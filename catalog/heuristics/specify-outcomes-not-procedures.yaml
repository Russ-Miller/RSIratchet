id: specify-outcomes-not-procedures
ref: ADG-0036
label: "Specify outcomes, not procedures"
statement: >-
  State the result, audience, relevant context, constraints, and completion criteria; leave routine problem-solving choices open when they do not affect the result.
origin: >-
  OpenAI's 2026 GPT-6 model guide recommends beginning with the desired result, audience, context, constraints, and definition of done. This is vendor guidance, not an independent comparison of prompt styles.
transfer: >-
  A goal lets the model adapt its plan to the task and use its learned problem-solving ability. Procedure-level instructions still matter when they encode safety, compliance, required evidence, or a non-negotiable process; avoid treating this heuristic as a reason to omit those constraints.
provenance: borrowed
sources: [openai-2026-gpt6-model-guide, openai-2026-gpt6-prompting-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
