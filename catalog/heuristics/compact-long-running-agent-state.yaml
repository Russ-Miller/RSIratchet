id: compact-long-running-agent-state
ref: ADG-0027
label: "Compact long-running agent state"
statement: >-
  For long tasks, preserve the decisions, evidence, and next steps needed to continue, and use compaction or durable state instead of carrying an ever-growing transcript.
origin: >-
  OpenAI's GPT-6 model guide recommends compaction for context and cost management and identifies it as a tool for long-running work.
transfer: >-
  Long tasks can exceed practical context and cost budgets. A concise state summary preserves continuity, but it should retain source evidence and unresolved decisions rather than compressing away facts needed for later verification.
provenance: borrowed
form: prescriptive
sources: [openai-2026-gpt6-model-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
