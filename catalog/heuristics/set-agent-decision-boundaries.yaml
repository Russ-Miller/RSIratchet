id: set-agent-decision-boundaries
ref: ADG-0035
label: "Set autonomy boundaries"
statement: >-
  Name which routine decisions and actions an agent may take independently and which decisions require user input or approval.
origin: >-
  OpenAI's GPT-6 model guide recommends replacing blanket always-ask rules with clear decision boundaries and specifying when the agent should ask.
transfer: >-
  Explicit boundaries reduce unnecessary pauses while preserving human control over decisions that materially change scope or risk. Permissions should be specific to the workflow and environment.
provenance: borrowed
form: prescriptive
sources: [openai-2026-gpt6-model-guide, openai-2026-gpt6-prompting-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
