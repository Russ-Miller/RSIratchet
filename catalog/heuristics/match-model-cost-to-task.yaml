id: match-model-cost-to-task
ref: ADG-0033
label: "Match model and reasoning effort to task"
statement: >-
  Use the least costly model and reasoning effort that meets the task's quality bar; increase capability or effort when representative evaluations show it is needed.
origin: >-
  OpenAI's GPT-6 model guide frames model and reasoning selection as a capability, cost, and latency tradeoff.
transfer: >-
  Task difficulty varies, so selecting a capable model and reasoning budget for each workload can avoid paying for unused capability. Check quality and cost on representative tasks rather than assuming the cheapest option is sufficient.
provenance: borrowed
form: prescriptive
sources: [openai-2026-gpt6-model-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
