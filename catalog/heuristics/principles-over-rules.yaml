id: principles-over-rules
ref: ADG-0026
label: "State the goal and constraints; leave the method flexible"
adage: "Principles over rules"
aliases: ["Leave the how to the agent", "Commander's intent", "Mission command"]
statement: >-
  Give the desired result, hard constraints, and the reason for them; leave
  the method open when the agent can discover it, but prescribe procedures
  that encode essential knowledge or safety.
origin: >-
  Military mission command (Auftragstaktik), developed in the Prussian army
  in the nineteenth century: orders state the intent and the end state and
  leave the method to the officer on the ground, who knows the local
  situation. The same idea runs through management by objectives. Restated
  for agents in a November 2026 exchange: Farzad's post that "the HOW should
  ALWAYS be the job of the agent", and Dave Lee's reply, "Principles over
  rules."
sources: [farzad-2026-the-how-is-the-agents-job, lee-2026-principles-over-rules]
transfer: >-
  The mechanism is that whoever executes has context and ability the
  instruction-writer lacks, so a fixed method throws that away. For models
  there is a second mechanism: capability is rising, so a method tuned to
  today's model becomes prompt debt for the next one, while a stated intent
  carries over. The heuristic is itself a principle, not a rule; filed as
  "always", it contradicts itself. It should fail where the method is the
  hard part and the model cannot find it on its own (weaker models,
  unfamiliar formal procedures), and where a constraint is a hard limit
  rather than a preference (safety, permissions, compliance), which belongs
  in the harness rather than in the prompt either way. The reason for each
  constraint is the part that should never be left out.
evidence:
  - claim: prompting-task-method-knowledge-model-which-spells-out-what-do-how
    verdict: narrows
    note: >-
      Spelling out the method, together with the goals and the reason for
      each step, lifted o1 from about 32% to 97% on obfuscated Blocksworld
      planning. Where the method is hard to rediscover, giving it pays; the
      prompt that won also gave the why, so the finding cuts against "leave
      the how" and not against "give the intent".
  - claim: repository-context-files-do-not-raise-task-success-on-benchmark-coding
    verdict: holds
    note: >-
      Indirect. Context files, which are mostly instructions on how to work
      in a repository, were obeyed and raised cost about 20% without raising
      success on benchmark coding tasks: method instructions the agent could
      work out for itself added spend, not results.
  - claim: removing-overconstraint-from-system-prompts-stopped-costing-accuracy
    verdict: holds
    note: >-
      The prompt-debt mechanism observed directly: guardrail rules written for
      older models (blanket prohibitions, repeated warnings) became dead
      weight a generation later, and removing over 80% of a production
      system prompt cost nothing on the vendor's own coding evaluations. The
      rules had begun to conflict with each other and with user intent.
  - claim: tool-examples-can-narrow-rather-than-teach
    verdict: holds
    note: >-
      A worked example is a method handed to the model, and for a capable
      model it can fence the search to what the example shows. The advice
      that replaces it is a principle in the interface itself: expressive
      parameters that imply their own use.
evidence_search:
  searched_on: "2026-11-07"
  note: >-
    No filed claim directly compares an intent-only prompt with a
    step-by-step prompt for the same task and model. The prompt-debt
    argument has one vendor-reported case (a production system prompt cut
    by over 80% at no measured cost) but no controlled test running prompts
    tuned on an older model against a newer one. Both are open.
  nearest_miss:
    - prompting-task-method-knowledge-model-which-spells-out-what-do-how
