id: parkinsons-law
ref: ADG-0020
label: Parkinson's law
statement: Work expands so as to fill the time available for its completion.
origin: >-
  C. Northcote Parkinson, 1955, The Economist, on the growth of the British
  civil service. About people and bureaucracies, where the mechanism is that
  effort has no natural stopping point short of the deadline.
transfer: >-
  The model's analogue of time is the token budget. If the law transfers, a
  model given a larger budget for reasoning or output will use it whether or
  not the task needs it, and the extra tokens will not improve the answer and
  may degrade it. The mechanism would be different from Parkinson's — not
  self-interest but the absence of any internal signal that the task is done
  — which makes the transfer worth testing rather than assuming.
evidence:
  - claim: no-thinking-controls-do-not-stop-visible-reasoning
    verdict: narrows
    note: >-
      Tests the low end of the transfer, not the high end: offered no
      reasoning budget, models kept reasoning visibly, more so as the answer
      space opened. That supports the mechanism the transfer names, effort
      set by something other than the budget offered, with no internal
      signal of when to stop. It does not test whether a larger budget is
      filled, which is the law as stated.
evidence_search:
  searched_on: "2026-10-18"
  note: >-
    Still wanted: a measurement of whether reasoning or output length tracks
    the budget offered rather than what the task needs, at budgets above
    zero. The "overthinking" literature on reasoning models is the place to
    look. The nearest miss on the input side remains the claim that longer
    input degrades reasoning.
  nearest_miss:
    - holding-task-fixed-only-lengthening-input-degrades-reasoning
status: active
