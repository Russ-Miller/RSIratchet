id: keep-context-task-relevant
ref: ADG-0032
label: "Keep context relevant"
statement: >-
  Include the evidence and instructions needed for the task, and remove unrelated context that competes for attention.
origin: >-
  OpenAI's GPT-6 model guide recommends cutting context the task does not need while keeping relevant evidence.
transfer: >-
  Irrelevant instructions consume finite context and may distract or conflict with the task. Relevant evidence remains essential; this is a selection rule, not a blanket preference for shorter context.
provenance: borrowed
sources: [openai-2026-gpt6-model-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
