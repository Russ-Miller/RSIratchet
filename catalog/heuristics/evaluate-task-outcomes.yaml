id: evaluate-task-outcomes
ref: ADG-0030
label: "Evaluate outcomes, not just outputs"
statement: >-
  Compare agents using task success, completeness, latency, and cost per successful task on representative workloads.
origin: >-
  OpenAI's GPT-6 model guide recommends measuring task success and latency and testing before deployment; its prompting guidance recommends evaluating prompts with the chosen model and workload.
transfer: >-
  A fluent response or fewer tokens does not establish task quality. Outcome measures reveal whether a prompt or model change improves completed work and at what operational cost.
provenance: borrowed
sources: [openai-2026-gpt6-model-guide, openai-2026-gpt6-prompting-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
