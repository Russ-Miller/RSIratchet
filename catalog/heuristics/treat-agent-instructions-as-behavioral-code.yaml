id: treat-agent-instructions-as-behavioral-code
ref: ADG-0037
label: "Treat agent instructions as behavior-changing configuration"
statement: >-
  Audit skills, repository instructions, and task prompts for stale, conflicting, or overly broad rules because they can materially change agent behavior.
origin: >-
  OpenAI's GPT-6 Astra guidance describes skills, AGENTS.md, and task prompts as shaping model behavior and recommends auditing instructions available to the model.
transfer: >-
  Persistent instructions affect many tasks and can conflict with each other or with user intent. Review them as configuration: scope them, remove obsolete rules, and retain constraints that genuinely matter.
provenance: borrowed
sources: [openai-2026-rethinking-skills-prompts-gpt6-astra, openai-2026-gpt6-prompting-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
