id: amdahls-law
ref: ADG-0001
label: "Find the serial bottleneck first"
adage: "Amdahl's law"
statement: >-
  Before adding agents, identify the work that will remain serial—such as
  coordination, verification, or shared state—and reduce that bottleneck.
origin: >-
  Gene Amdahl, 1967, on multiprocessor computing. A formula rather than an
  observation: with fraction p parallelisable, speed-up is at most 1/(1-p).
transfer: >-
  Multi-agent systems are pitched as parallelism, and the law says where the
  ceiling is: whatever cannot be split — integration of the parts, the
  verification pass, the human review, the one shared piece of state — bounds
  the gain no matter how many agents run. The prediction is that as agents
  get cheaper the serial fraction (usually verification) dominates wall-clock
  and cost, and that a system's throughput is better improved by shrinking
  that fraction than by adding agents. It is also a warning about the
  catalog's own ambition: an evidence pipeline is bounded by the serial step
  of a person reviewing.
evidence_search:
  searched_on: "2026-09-12"
  note: >-
    Nothing in the catalog measures the serial fraction of a multi-agent
    workflow or plots gain against agent count. The nearest claims are about
    long-horizon single agents, not parallel ones.
  nearest_miss:
