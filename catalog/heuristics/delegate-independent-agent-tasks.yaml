id: delegate-independent-agent-tasks
ref: ADG-0029
label: "Delegate independent work"
statement: >-
  Run independent subtasks in parallel when their results can be combined safely; keep dependent steps ordered and define how findings will be integrated.
origin: >-
  OpenAI's GPT-6 model guide recommends running independent tasks together and delegating independent subtasks for long-running work.
transfer: >-
  Parallel work can reduce elapsed time when tasks do not depend on one another. Integration and shared-state conflicts remain costs, so delegation is useful only when work is genuinely separable.
provenance: borrowed
sources: [openai-2026-gpt6-model-guide, openai-2026-gpt6-prompting-guide]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
