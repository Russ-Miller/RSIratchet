id: retire-obsolete-scaffolding
ref: ADG-0034
label: "Retire scaffolding as capability improves"
statement: >-
  Revisit detailed prompts, skills, and repository instructions as models improve; remove prescriptions that no longer help while preserving outcomes, constraints, evidence, and decision boundaries.
origin: >-
  OpenAI's September 2026 GPT-6 Astra guidance argues that older, elaborate instructions can overconstrain newer coding agents and that overly specific guidance can hinder results.
transfer: >-
  Redundant steps and stale examples consume context and can narrow the model's exploration. The advice is model- and task-dependent: keep instructions that encode necessary constraints, and compare lean and detailed variants on representative tasks before broad removal.
provenance: borrowed
form: prescriptive
sources: [openai-2026-rethinking-skills-prompts-gpt6-astra, openai-2026-gpt6-model-guide]
evidence:
  - claim: gpt6-astra-guidance-says-overly-specific-coding-agent-instructions-can-hinder-results
    verdict: narrows
    note: >-
      OpenAI's guidance recommends revisiting elaborate instructions for
      GPT-6 Astra coding agents, while also retaining task outcomes,
      constraints, and boundaries. This is vendor guidance and calls for
      task-level evaluation rather than universal deletion.
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
