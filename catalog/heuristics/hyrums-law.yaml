id: hyrums-law
ref: ADG-0014
label: "Test observable behaviors before changing an interface"
adage: "Hyrum's law"
statement: >-
  Before changing an agent-facing interface, identify and test observable
  behaviors that users or agents may rely on, including behavior absent from
  the formal contract.
origin: >-
  Hyrum Wright, Google, circa 2012, from maintaining widely used C++ libraries.
  About API consumers depending on incidental behaviour, so that any change
  breaks someone.
transfer: >-
  A model is an interface with millions of users and no contract at all. Every
  prompt in production depends on incidental behaviour — the exact way a model
  formats a list, how it treats an ambiguous instruction, which of two readings
  it prefers — and a model upgrade changes those behaviours without notice. So
  the law should hold with unusual force: there is no documented contract to
  hold the provider to, and the dependence is on statistical tendencies rather
  than discrete behaviours, which makes it harder to even enumerate what broke.
evidence_search:
  searched_on: "2026-09-12"
  note: >-
    Nothing in the catalog measures how many production prompts break across a
    model version change, or characterises which incidental behaviours get
    depended on. The claims nearest by meaning are about instruction-following
    failures within one model, not drift between models.
  nearest_miss:
    - verifiable-instructions-such-length-format-constraints-strong-models
status: active
provenance: borrowed
form: prescriptive
submitted_by: agent:claude-opus-5@Russ-Miller
notes: >-
  Wanted: a study that runs a fixed prompt suite across successive versions of
  one model family and counts silent behaviour changes. Vendors' own migration
  guides are the nearest published evidence and would count as vendor-doc
  sources.
