id: expertise-label-is-not-evidence
ref: ADG-0031
label: Don't mistake a role label for expertise
statement: >-
  An expert role prompt is not a reliable accuracy boost. Give the model the
  task, criteria, and evidence it needs; test any claimed benefit against a
  no-role baseline.
origin: >-
  Distilled from catalog claims comparing expert-persona prompts with neutral
  baselines on factual and open-ended tasks. The recurring finding is that a
  role label changes response characteristics inconsistently and does not
  reliably supply missing task knowledge or improve factual accuracy.
transfer: >-
  A model has learned associations with occupational language, but naming a
  profession does not itself provide the task's authoritative standards,
  source evidence, or a check on whether conclusions follow from that
  evidence. The prompt may alter detail, framing, or clarity, and its effects
  vary by model and task. Put the operational criteria and evidence in the
  context, require uncertainty or unsupported conclusions to be surfaced, and
  compare against the same prompt without the role label before relying on
  it for accuracy. The cited persona studies did not evaluate CMMC assessments.
provenance: distilled
form: prescriptive
evidence:
  - claim: expert-persona-prompts-do-not-reliably-improve-factual-accuracy
    verdict: holds
    note: >-
      Two studies across multiple roles and models found no reliable factual
      accuracy gain over no-persona baselines; effects varied by role and
      model, and mismatched roles sometimes harmed accuracy.
  - claim: expert-role-prompts-trade-clarity-for-perceived-depth-conditionally
    verdict: narrows
    note: >-
      Role framing can change perceived expertise depth, but the single-model
      study also found reduced clarity and domain/task-dependent results. This
      bounds the heuristic to accuracy claims and motivates checking response
      quality dimensions separately.
status: active
submitted_by: human:Russ-Miller
notes: >-
  Example: for a CMMC assessment, provide the applicable controls, assessment
  criteria, and evidence; ask the model to map findings to each criterion and
  flag gaps or unsupported conclusions. The cited persona studies did not
  evaluate CMMC assessments.
