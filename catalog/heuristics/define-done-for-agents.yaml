id: define-done-for-agents
ref: ADG-0028
label: "Define what done means"
statement: >-
  For agent tasks, specify observable completion criteria, including required implementation, checks, inspection, and any remaining handoff.
origin: >-
  OpenAI's GPT-6 model guide and prompting article recommend explicit completion criteria for long-running work.
transfer: >-
  Observable end conditions help an agent distinguish a partial draft from a completed task and make verification part of the requested outcome. The appropriate checks depend on task risk and scope.
provenance: borrowed
sources: [openai-2026-gpt6-model-guide, openai-2026-rethinking-skills-prompts-gpt6-astra]
status: active
submitted_by: agent:codex@OpenAI
notes: >-
  Adapted from vendor recommendations for GPT-6 systems. Treat as a starting
  point to evaluate on the model and workload in use, not as a replicated
  result or a universal rule.
