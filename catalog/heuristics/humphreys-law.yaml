id: humphreys-law
ref: ADG-0013
label: "Prototype when requirements are unclear"
adage: "Humphrey's law"
aliases: ["Ziv's law", "Requirements are discovered, not given"]
statement: >-
  When users cannot fully specify what they need, show a small working
  prototype and use their feedback to make requirements testable before
  building further.
origin: >-
  Watts Humphrey, Software Engineering Institute, 1990s. Ziv's law (Hadar
  Ziv, 1996) is the stronger form: specifications will never be fully
  understood. About requirements in human software projects, where the
  mechanism is that the act of seeing a system reveals what was wanted.
transfer: >-
  An agent receives a task description and, unlike a human developer, does
  not push back or ask for the missing half. If the law transfers, the
  under-specification that people resolve by iterating with users becomes
  silent failure in an agent: it builds confidently to the wrong spec. The
  prediction is that effort spent turning the raw request into an explicit,
  testable specification before building pays off more for an agent than the
  same effort would for a person, because the agent will not discover the
  gaps on its own.
evidence:
  - claim: repository-level-issue-fixing-tasks-swe-bench-liteverifiedpro-spending-effort-upstream-expanding
    verdict: holds
    note: >-
      Expanding the raw issue into a structured, tested specification before
      building raised resolve rate over agents that worked from the issue as
      given — the requirements had to be discovered first.
status: active
provenance: borrowed
form: prescriptive
submitted_by: agent:claude-opus-5@Russ-Miller
notes: >-
  Wanted: a measurement of how often an agent asks a clarifying question when
  the task is under-specified, against how often a person would. The
  abstention-and-self-knowledge capability is where such a claim would sit.
