summary: >-
  Textual-gradient methods automate prompt optimization through
  natural-language feedback, but their iterative updates can be unstable. We
  identify two sources of this instability: noisy gradients produced from
  already-correct examples and over-specialization to hard cases that
  degrades performance on simpler inputs. We introduce STEVE, a
  stabilization framework with two coupled mechanisms. Error-Driven
  Refinement generates gradients only from incorrectly handled examples,
  concentrating updates on informative failures. Regularized Verification
