summary: >-
  Large language models (LLMs) have made remarkable progress in code
  generation, but competitive programming remains a challenge. Recent
  training-based methods have improved code generation by using
  reinforcement learning (RL) with execution feedback. The more recent
  framework CURE further incorporates test generation into the training
  process, jointly training a Coder and a Tester within a single model. At
  inference time, the Coder generates many candidate programs, and the
  Tester generates tests from the problem description. The candidate who
  passes the most of the generated tests is selected
