brief: >-
  Splitting data across LLM agents does not escape context limits: agents
  coordinate competently but fail to integrate what they gather, and at scale
  a distributed team is beaten by 1 agent holding the full input. Silo-Bench
  partitions global inputs across N agents on 30 generator-built algorithmic
  tasks spanning 3 communication-complexity levels (aggregation, mesh, global
  shuffle), varying N in {2, 5, 10, 20, 50, 100}, 3 protocols (P2P, broadcast,
  shared file system) and 3 open models, for 54 configurations and 1,620
  experiments.


  DeepSeek-V3.1 averages 36.9% success, GPT-OSS-120B 16.9%, Qwen3-Next-80B-A3B
  8.2%. DeepSeek drops from 62.0% on Level I to 11.7% on Level III, with 0.0%
  at N=50 and N=100 on Level III while Level I stays above 40%. The gap
  between partial correctness and success is 26 percentage points on Level I
  for DeepSeek (88.0% vs 62.0%), and at N>=50 on Level III success is 0% with
  PCS 8-16%.


  The key control is an N=1 oracle with full data: relative coordination cost
  is already 15-49% at k=2 and reaches 80-100% at k=50 for Levels II-III,
  isolating coordination rather than task hardness. Failure modes were
  labelled by rules plus 2 annotators, Cohen's kappa = 0.87: premature
  submission 37.2%, consensus failure 29.9%, computation error 28.6%.


  Not tested: closed-source models, heterogeneous teams, hierarchical or
  gossip protocols. Treat agent-count scaling as no substitute for long
  context.
