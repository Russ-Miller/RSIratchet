brief: >-
  An LLM that picks an ordered sequence of macro-actions but is given no
  numeric durations, with a learned physics surrogate choosing the timings,
  goes from 0% to 100% goal-reach on marine navigation missions. The division
  matters: the language model contributed the action topology, not the
  physics.


  The system pairs gemma4:26b (local, temperature 0.3, called once per
  mission) with an analytical Fossen simulator plus a residual MLP, a 3-phase
  duration optimizer, and an MPC-style replanner with a trust-region guard. 5
  inspection missions each for a 6-DOF BlueROV2 AUV and a 3-DOF Blueboat ASV,
  in an analytical simulator and in GazeboSim.


  In the analytical simulator the grounded planners reach 1.00 goal-reach with
  0.0 collisions versus 0.00 and 27.2 (AUV) / 24.0 (ASV) collisions for the
  raw LLM plan. In GazeboSim, after residual fine-tuning on 250 k transitions,
  goal error falls 70-82% (ASV) and roughly 93% (AUV). Removing the
  trust-region guard drops slalom goal-reach from 100% to 10%.


  All 4 planners share one LLM and prompt, so the optimizer's contribution is
  isolated; the guard is ablated. But there is 1 model, no real hardware, N=3
  and N=10 trials, and GazeboSim is still a simulator. The ASV's 1 m success
  threshold holds at only 0.20.


  On LLM competence: skeletons were valid in 200/200 AUV and 197/200 ASV
  trials, and no skeleton needed topological repair on the ASV, but the
  optimizer cannot fix a wrong topology at all.


  Treat LLM output as a discrete plan sketch and put a differentiable dynamics
  model between it and the actuators.
