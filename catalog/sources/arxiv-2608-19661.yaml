summary: "Large language models can turn a natural-language mission into a
  sequence of robot actions, but they do not have a sense of physics: they
  cannot judge how long a command should run, or whether it will make the
  robot drift into an obstacle. We proposed the use of a world model to expand
  the capabilities of Large Language model-based planners. Our method has
  three components: a physics-grounded neural world model, a three-phase
  gradient-based trajectory optimizer, and a Model Predictive Controller
  (MPC)-style closed-loop replanner with a trust-region guard. The language
  model decides what to do,"
