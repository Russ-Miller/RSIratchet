brief: >-
  Routing unit test generation through 3 role-specialized agents plus a
  test-specific repository knowledge graph raises mutation score far more than
  it raises coverage, and the graph, not the agent roles, carries most of the
  gain.


  TestAgent splits the task into a requirement planner, test generator (with
  sandboxed execution feedback and a 3-LLM vote on whether a failure is a real
  defect), and test reviewer, all querying a static-analysis knowledge graph
  with test-specific nodes. Evaluated on 1,454 Java focal methods from 6
  projects, 658 industrial methods, and 141 Python methods, against EvoSuite,
  ChatUniTest, HITS, CodaMosa, and CoverUp.


  With GPT-4o it reached 97.46% execution rate, 92.34% line coverage, 90.24%
  branch coverage, 83.69% mutation score, versus EvoSuite at 82.11%, 80.81%,
  43.59%. Python: 88.85% line, 78.89% branch. 154 real bugs found at 92.22%
  precision.


  The ablation isolates components: removing the knowledge graph costs 22.31%
  line coverage and 26.83% mutation score; removing the reviewer costs 8.09%
  mutation score; removing similar-test retrieval only 2.87%. LLM baselines
  ran on the same GPT-4o version. There is no matched-token-budget comparison,
  and EvoSuite got 300 seconds per class against roughly 300 seconds per
  method for TestAgent.


  Gains shrink with weaker backbones: Qwen3-30B-A3B fell to 60.44% mutation
  score and below EvoSuite on coverage. The 10-person readability study is
  author-run and unblinded to design.


  If you build test-generation agents, spend effort on repository
  representation before on role decomposition.
