brief: >-
  Giving a model accurate retrieved context does not stop it degrading as
  conditions accumulate across dialogue turns. Reasoning-type retrieval
  dialogues get worse at every turn, even with correct context supplied.


  RAD-Bench builds 89 3-turn samples (267 turns total) across 6 scenarios
  split into Retrieval Synthesis (academic writing, news TLDR, education) and
  Retrieval Reasoning (finance, customer support, travel planning), each turn
  paired with retrieved context and an audited reference answer. 4 closed and
  8 open models were scored 1-10 by GPT-4o (2024-05-13, temperature 0) as a
  reference-guided judge with scenario-specific criteria.


  GPT-4o averaged 8.72, with Llama3.1-405B at 7.88 and Deepseek-v2 at 7.86
  leading open weights and GPT-3.5-Turbo at 6.59. Travel planning was hardest;
  Deepseek-v2 scored 7.95 there, above GPT-4o's 7.83. Mistral-Nemo-12B fell to
  3.55 on the same scenario.


  The turn-wise decline is measured, but causes are argued rather than
  isolated: no ablation on context quality or distractor contexts, and the
  judge is a single model, so judge bias is uncontrolled. The authors note
  BreeXe-8x7B's strong synthesis scores may reflect its own role as question
  scorer during construction.


  Questions are LLM-generated, scenarios number only 6, and sample size is
  small. Use it as evidence that single-turn RAG benchmarks and Arena Elo both
  mispredict multi-turn retrieval behaviour.
