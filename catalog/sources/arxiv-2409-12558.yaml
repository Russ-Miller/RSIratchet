brief: >-
  Giving a model correct retrieved context at every turn does not stop its
  answers from degrading as conditions accumulate across turns.


  RAD-Bench builds 89 multi-turn samples, each 3 turns with retrieved context
  and an audited reference answer, for 267 scored turns across 6 scenarios
  split into Retrieval Synthesis (academic writing, news TLDR, education) and
  Retrieval Reasoning (finance, customer support, travel planning). 4 closed
  and 8 open models were scored 1-10 by GPT-4o (2024-05-13) as a
  reference-guided judge with chain-of-thought and per-criterion prompts.


  GPT-4o averaged 8.72, GPT-4o-mini 8.47, Llama3.1-405B 7.88, Deepseek-v2
  7.86, GPT-3.5-Turbo 6.59. Travel planning was hardest, where Deepseek-v2
  (7.95) beat GPT-4o (7.83) and Mistral-Nemo-12B fell to 3.55. Reasoning
  scores fell with each successive turn; synthesis scores rose at turn 2 then
  fell at turn 3. Models with similar Chatbot Arena Elo diverged here, e.g.
  Llama3.1-8B vs Mistral-Large.


  The turn-wise decline is measured but not causally isolated: questions are
  LLM-generated, the judge is a single model, and BreeXe-8x7B also served as
  question scorer, which the authors flag as a likely bias toward its
  strengths. No human-judge agreement study, 1 judge, English, 89 samples.


  Use it as a reminder that retrieval quality and single-turn RAG scores do
  not predict multi-turn behaviour.
