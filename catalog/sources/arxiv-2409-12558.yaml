brief: >-
  Giving a model correct retrieved context at every turn does not stop its
  answers from degrading as conditions accumulate across turns. Chat-arena
  standing also fails to predict how a model handles retrieval-grounded
  dialogue.


  RAD-Bench holds 89 samples of 3 turns each, 267 turns total, split across 6
  scenarios grouped into Retrieval Synthesis (academic writing, news TLDR,
  education) and Retrieval Reasoning (finance, customer support, travel
  planning). Questions and contexts were synthesized by LLMs then filtered by
  LLM scorers and manual inspection; responses are scored 1-10 by GPT-4o
  (2024-05-13) as a reference-guided judge, temperature 0. 4 closed and 8 open
  models were run.


  GPT-4o leads at 8.72 average, GPT-4o-mini 8.47, Mistral-Large 7.91,
  Llama3.1-405B 7.88, Deepseek-v2 7.86, GPT-3.5-Turbo 6.59. Travel Planning is
  hardest, and there Deepseek-v2 (7.95) beats GPT-4o (7.83). Retrieval
  Reasoning scores fall monotonically turn by turn; Retrieval Synthesis rises
  at turn 2 then drops at turn 3.


  The turn effect is measured but not isolated: turns differ in task type, not
  only in depth, and the authors themselves read judge rationales to explain
  the synthesis dip. Scoring rests on 1 judge model, no human agreement study,
  and BreeXe-8x7B was both a question scorer and an evaluated model, which the
  authors flag as possible bias. The Chatbot Arena comparison is a correlation
  over the subset of shared models, not a controlled test.


  Use it as a model-selection screen for multi-turn RAG deployments rather
  than as evidence about why later turns fail.
