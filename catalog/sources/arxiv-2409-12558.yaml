brief: >-
  Giving a model accurate retrieved context at every turn does not stop it
  degrading as conditions pile up across a dialogue. RAD-Bench measures this:
  89 synthetic multi-turn samples, each 3 turns with a retrieved context and
  an audited reference answer, totalling 267 evaluated turns across 6
  scenarios split into Retrieval Synthesis (Academic Writing, News TLDR,
  Education) and Retrieval Reasoning (Customer Support, Finance, Travel
  Planning). Responses from 4 closed and 8 open models are scored 1-10 by
  GPT-4o (2024-05-13, temperature 0) as a reference-guided judge with
  chain-of-thought and per-criterion rubrics.


  GPT-4o leads at 8.72 average, then GPT-4o-mini 8.47, Mistral-Large 7.91,
  Llama3.1-405B 7.88, Deepseek-v2 7.86, GPT-3.5-Turbo 6.59. Travel Planning is
  hardest (Mistral-Nemo-12B 3.55; Deepseek-v2 7.95 beats GPT-4o's 7.83).
  Retrieval Reasoning scores fall with each successive turn; Retrieval
  Synthesis rises at turn 2 then falls at turn 3. Models at similar Chatbot
  Arena Elo diverge here (Llama3.1-8B vs Mistral-Large, Llama3.1-70B vs
  Deepseek-v2).


  The turn-wise decline is measured but not causally isolated: no ablation
  separating question difficulty from context accumulation, 1 judge model, and
  the authors note BreeXe-8x7B's strong synthesis scores may reflect its role
  as question scorer. Questions are LLM-generated; retrieval quality itself is
  not varied.


  Use it if you are picking a model for multi-turn RAG and suspect Arena ranks
  mislead.
