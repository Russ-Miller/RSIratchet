brief: >-
  Giving a model correct retrieved context per turn does not stop its answers
  from degrading as conditions accumulate across turns. Scores fall turn by
  turn once new constraints or changed intents enter the dialogue, even with
  accurate context supplied.


  RAD-Bench is 89 synthetic 3-turn samples (267 turns total) spanning 6
  scenarios split into Retrieval Synthesis (academic writing, news TLDR,
  education) and Retrieval Reasoning (customer support, finance, travel
  planning), each turn paired with retrieved context and an audited reference
  answer. 4 closed and 8 open models were scored 1-10 by GPT-4o as a
  reference-guided judge with chain-of-thought and per-criterion rubrics.


  GPT-4o averaged 8.72, GPT-4o-mini 8.47, Llama3.1-405B 7.88, Deepseek-v2
  7.86, GPT-3.5-Turbo 6.59. Travel Planning was hardest, where Deepseek-v2
  (7.95) beat GPT-4o (7.83). Retrieval Reasoning scores drop monotonically
  across turns; Synthesis rises at turn 2 then falls at turn 3. Pairs with
  near-identical Chatbot Arena Elo (Llama3.1-8B vs Mistral-Large, Llama3.1-70B
  vs Deepseek-v2) separate here.


  The degradation is measured but confounded: one judge model, no human
  agreement study, and the authors note BreeXe-8x7B also served as question
  scorer, likely favouring it on Synthesis. 89 samples is small, questions are
  LLM-generated, and retrieval itself is never varied, so failures are
  attributed to generation only by construction.


  Useful if you pick models for multi-turn RAG deployment rather than
  single-turn QA.
