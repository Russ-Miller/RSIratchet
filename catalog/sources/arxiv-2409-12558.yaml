brief: >-
  Giving a model accurate retrieved context at every turn does not stop it
  from degrading as constraints accumulate across a dialogue. Models with
  near-identical Chatbot Arena chat ratings diverge sharply once
  retrieval-augmented multi-turn tasks are involved.


  RAD-Bench contains 89 samples of 3 turns each, 267 turns total, spanning 6
  scenarios split into Retrieval Synthesis (Academic Writing, News TLDR,
  Education) and Retrieval Reasoning (Customer Support, Finance, Travel
  Planning). Questions and contexts were synthesized by LLMs and filtered by
  LLM scorers plus manual inspection; scoring is reference-guided
  LLM-as-a-Judge with GPT-4o (2024-05-13), temperature 0, on a 1-10 scale. 4
  closed and 8 open models were evaluated.


  GPT-4o averaged 8.72, Llama3.1-405B 7.88, Deepseek-v2 7.86, GPT-3.5-Turbo
  6.59. Travel Planning was hardest, with Deepseek-v2 at 7.95 beating GPT-4o's
  7.83 and Mistral-Nemo-12B at 3.55. Retrieval Reasoning scores fall
  monotonically turn over turn; Retrieval Synthesis rises at turn 2 then drops
  at turn 3.


  The degradation is measured, but the causal story is interpretive: the
  authors read judge outputs rather than ablate. Judge and one candidate share
  a family, and BreeXe-8x7B also served as question scorer, which the authors
  flag as possible bias. 267 turns, 1 judge, no human agreement study.


  Use it as a model-selection signal for RAG deployments, not as evidence
  about why turns degrade.
