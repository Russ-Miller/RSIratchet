brief: >-
  Giving a model correct retrieved context at every turn does not stop its
  answers from degrading as conditions accumulate across a dialogue. RAD-Bench
  isolates this by holding retrieval quality fixed and varying only the
  layering of constraints.


  The benchmark has 89 multi-turn samples, each 3 turns with retrieved context
  and an audited reference answer, for 267 evaluated turns, split across 6
  scenarios grouped into Retrieval Synthesis (news TLDR, education, academic
  writing) and Retrieval Reasoning (customer support, finance, travel
  planning). 4 closed and 8 open models were scored 1-10 by GPT-4o
  (2024-05-13) as a reference-guided judge at temperature 0.


  GPT-4o leads at 8.72 average, then GPT-4o-mini 8.47, Mistral-Large 7.91,
  Llama3.1-405B 7.88, Deepseek-v2 7.86, GPT-3.5-Turbo 6.59. Travel planning is
  hardest, where Deepseek-v2 (7.95) beats GPT-4o (7.83). Retrieval Reasoning
  scores fall monotonically turn over turn; Retrieval Synthesis rises at turn
  2 then falls at turn 3. Models with similar Chatbot Arena Elo separate here
  (Llama3.1-8B vs Mistral-Large, Llama3.1-70B vs Deepseek-v2).


  Evidence is a measured leaderboard, not a controlled intervention: questions
  are LLM-generated, 1 judge model, and BreeXe-8x7B also served as question
  scorer, which the authors flag as a possible bias toward its strengths. No
  retrieval system is tested, only provided context.


  Use it if you are picking a model for multi-turn RAG and suspect chat
  leaderboards mislead you.
