brief: >-
  Giving a model correct retrieved context per turn does not stop it from
  degrading as later turns add conditions or shift intent. RAD-Bench measures
  that degradation and separates models that look equivalent on general chat
  leaderboards.


  The benchmark has 89 synthetically generated 3-turn samples, 267 turns
  total, each turn paired with retrieved context and an audited reference
  answer, across 6 scenarios split into Retrieval Synthesis (Academic Writing,
  News TLDR, Education) and Retrieval Reasoning (Customer Support, Finance,
  Travel Planning). Scoring is GPT-4o (2024-05-13) as reference-guided judge,
  1-10, temperature 0, on 4 closed and 8 open models.


  GPT-4o leads at 8.72 average, GPT-4o-mini 8.47, then Llama3.1-405B 7.88 and
  Deepseek-v2 7.86. Travel Planning is hardest, where Deepseek-v2 (7.95) beats
  GPT-4o (7.83) and Mistral-Nemo-12B collapses to 3.55. Retrieval Reasoning
  scores fall with each turn; Retrieval Synthesis rises at turn 2 then drops
  at turn 3.


  The turn-wise decline is measured, but the cause is argued from reviewing
  judge outputs, not isolated. Single judge model, no human agreement study,
  and the authors flag that BreeXe-8x7B served as a question scorer, which may
  explain its strong synthesis scores. Elo correlation is a qualitative
  scatter comparison.


  Use it as a model-selection screen for multi-turn RAG, not as evidence about
  why later turns fail.
