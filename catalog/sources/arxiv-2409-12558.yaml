brief: >-
  Giving a model the correct retrieved context does not stop its answers from
  degrading as a multi-turn dialogue adds conditions and constraints.
  RAD-Bench measures that degradation separately from ordinary chat ability.


  The benchmark holds 89 samples of 3 turns each, 267 turns total, spread over
  6 scenarios split into Retrieval Synthesis (News TLDR, Education, Academic
  Writing) and Retrieval Reasoning (Customer Support, Finance, Travel
  Planning). Each turn pairs a question with retrieved context; GPT-4o
  (2024-05-13) judges responses 1 to 10 against an audited reference answer
  with scenario-specific criteria. 4 closed-source and 8 open-source models
  were scored.


  GPT-4o led with an average of 8.72, followed by GPT-4o-mini at 8.47; the
  strongest open models were Llama3.1-405B at 7.88 and Deepseek-v2 at 7.86,
  and GPT-3.5-Turbo trailed at 6.59. Travel Planning was hardest, with
  Deepseek-v2 at 7.95 beating GPT-4o's 7.83. Retrieval Reasoning scores fell
  on every successive turn; Retrieval Synthesis rose at turn 2 and fell at
  turn 3.


  The turn-wise decline is measured but not causally isolated: no ablation
  varies context quality, 1 judge model is used, and questions are
  LLM-generated. The authors note BreeXe-8x7B also served as question scorer,
  which may bias its own synthesis scores.


  If you pick models by Chatbot Arena Elo, this gives reason to re-test them
  under multi-turn retrieval.
