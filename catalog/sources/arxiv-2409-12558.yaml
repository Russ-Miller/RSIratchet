brief: >-
  Giving a model accurate retrieved context at every turn does not stop its
  answers from degrading as conditions pile up across a dialogue. RAD-Bench
  measures this for multi-turn retrieval-augmented chat, splitting the skill
  into Retrieval Synthesis (summarizing, writing) and Retrieval Reasoning
  (support, finance, planning).


  The benchmark has 89 samples of 3 turns each, 267 turns total, across 6
  scenarios built from ShareGPT and MediaTek DaVinci dialogues, with synthetic
  questions, retrieved contexts and audited reference answers. 4 closed and 8
  open models were scored 1-10 by GPT-4o (2024-05-13) as a reference-guided
  judge at temperature 0.


  GPT-4o leads at 8.72 average, with Llama3.1-405B at 7.88 and Deepseek-v2 at
  7.86 the strongest open models. Retrieval Reasoning scores fall on each
  successive turn; Retrieval Synthesis rises on turn 2 then drops on turn 3.
  Travel Planning is hardest, where Deepseek-v2 beats GPT-4o.


  The turn-wise decline is measured but not isolated: turns differ in task
  difficulty as well as position, and there is no control where context is
  withheld. Scoring rests on 1 judge model, acknowledged as unexamined for
  length or style bias, and BreeXe-8x7B was itself a question scorer, likely
  inflating its synthesis scores. Correlation with Chatbot Arena Elo is shown
  qualitatively, with named pairs rather than a coefficient.


  Treat Arena-style chat rankings as a poor proxy for retrieval-augmented
  deployment.
