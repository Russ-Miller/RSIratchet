brief: >-
  Giving a model the correct retrieved context does not stop its answers from
  degrading as a multi-turn dialogue adds conditions or shifts intent.
  Chat-arena standing also fails to predict how a model behaves in
  retrieval-augmented dialogue.


  RAD-Bench is 89 synthetically generated 3-turn samples, 267 turns total,
  each turn paired with retrieved context and an audited reference answer,
  spanning 6 scenarios split into Retrieval Synthesis (Academic Writing, News
  TLDR, Education) and Retrieval Reasoning (Customer Support, Finance, Travel
  Planning). 4 closed and 8 open models were scored 1-10 by GPT-4o
  (2024-05-13) as reference-guided judge at temperature 0.


  GPT-4o leads at 8.72 average, with Llama3.1-405B at 7.88 and Deepseek-v2 at
  7.86 the best open models. Travel Planning is hardest; Deepseek-v2 scores
  7.95 there, above GPT-4o's 7.83, while Mistral-Nemo-12B falls to 3.55.
  Retrieval Reasoning scores drop with each successive turn; Retrieval
  Synthesis rises at turn 2 then falls at turn 3.


  The turn-wise decline is measured but not causally isolated: no condition
  with corrupted or absent context, and the judge is a single model. The
  authors note BreeXe-8x7B also acted as question scorer, likely biasing
  synthesis scenarios toward it. Sample size is small and questions are
  LLM-generated.


  If you select models using arena Elo for a RAG product, this suggests
  re-testing on multi-turn retrieval tasks directly.
