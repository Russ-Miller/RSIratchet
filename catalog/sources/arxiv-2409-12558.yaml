brief: >-
  Giving a model the right retrieved context does not stop it from degrading
  as a dialogue adds conditions. Across multi-turn retrieval-augmented
  dialogues, scores fall turn by turn even when each turn ships with accurate
  context.


  RAD-Bench contains 89 synthetically generated 3-turn samples, 267 turns in
  total, spread over 6 scenarios: Academic Writing, News TLDR, Education
  (Retrieval Synthesis) and Finance, Customer Support, Travel Planning
  (Retrieval Reasoning). Each turn pairs a question with retrieved context and
  an audited reference answer; GPT-4o (2024-05-13) at temperature 0 judges
  responses 1-10 with scenario-specific criteria. 4 closed and 8 open models
  were tested.


  GPT-4o leads at 8.72 average, then GPT-4o-mini 8.47, Mistral-Large 7.91,
  Llama3.1-405B 7.88, Deepseek-v2 7.86, GPT-3.5-Turbo 6.59. Travel Planning is
  hardest, with Deepseek-v2 (7.95) beating GPT-4o (7.83) and Mistral-Nemo-12B
  scoring 3.55. Retrieval Reasoning scores drop each turn; Retrieval Synthesis
  rises at turn 2 then falls at turn 3.


  The turn-wise decline is measured but not isolated: questions are
  LLM-generated, the judge is a single model with no human agreement figure
  reported, and BreeXe-8x7B also served as question scorer, which the authors
  flag as possible bias. Correlation with Chatbot Arena Elo is shown
  qualitatively in a figure, no coefficient given.


  If you select models on chat benchmarks alone, this suggests rank orders
  shift under retrieval-heavy multi-turn use.
