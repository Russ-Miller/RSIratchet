summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not make a model better at
  factual questions, and sometimes makes it worse. That cuts against the
  common prompt-engineering advice to tell the model it is a lawyer, a doctor,
  or a helpful assistant.


  The test used 162 personas (112 occupations, 50 interpersonal roles) across
  6 relationship types and 8 expertise domains, 4 prompt templates
  (speaker-specific, audience-specific, and "Imagine" paraphrases), and 2,410
  MMLU questions balanced across 26 subjects, on 9 instruction-tuned open
  models from 4 families: FLAN-T5-XXL (11B), Llama-3-Instruct (8B, 70B),
  Mistral-7B-Instruct-v0.2, and Qwen2.5-Instruct (3B-72B).


  No persona beat the no-persona control at statistical significance; several
  hurt. Domain-aligned personas gave a coefficient of 0.004 (p < 0.01), a real
  but tiny gain. Gender share of an occupation was not predictive (coefficient
  -5.79e-4, p = 0.561). Prompt-question similarity correlated with accuracy at
  only 0.39 at best (Qwen2.5-7B) and -0.02 at worst (Qwen2.5-72B).


  Effects were measured with mixed-effects regressions against a matched
  no-persona control, with model as a random effect, which isolates the
  persona itself. Picking the best persona per question does lift accuracy,
  but automatic selection (similarity, a domain classifier at 78.1% accuracy,
  a 162-way role classifier at F1 0.34-0.77) performs near or below random.


  Only MMLU multiple-choice was tested; no closed models like GPT-4, no
  open-ended or subjective tasks. Treat persona prompts as a style or safety
  choice, not an accuracy lever.
