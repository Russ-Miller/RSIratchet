summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not improve accuracy on factual
  multiple-choice questions, and in some cases lowers it.


  The setup: 162 personas (112 occupations, 50 interpersonal roles across
  family, friend, romantic, work, school, social, plus AI roles), 4 prompt
  templates covering speaker-specific ("You are a lawyer") and
  audience-specific ("You are talking to a fireman") framings, run over 2,410
  MMLU questions balanced across 26 subjects mapped to 8 domains, on 9
  instruction-tuned open-weight models from 4 families (FLAN-T5-XXL 11B,
  Llama-3-Instruct 8B and 70B, Mistral-7B-Instruct-v0.2, Qwen2.5-Instruct 3B
  to 72B).


  Mixed-effects regressions with a no-persona control as reference find no
  persona significantly beats control; most are flat and some are negative.
  Domain-aligned personas help by a coefficient of 0.004 (p < 0.01).
  Gender-neutral roles beat gendered ones; occupational gender share is not
  predictive (coefficient -5.79e-4, p = 0.561). Word frequency,
  prompt-question similarity and perplexity correlate weakly and
  inconsistently (similarity correlation ranges from 0.39 on Qwen2.5-7B to
  -0.02 on Qwen2.5-72B). Oracle best-role-per-question gives large gains, but
  a RoBERTa role classifier, a domain classifier (78.1% domain accuracy) and
  similarity selection land near random, and below random on Qwen.


  The control condition is properly matched and the sweep is large, though it
  is 1 dataset (MMLU), multiple-choice only, no closed-source models, and no
  open-ended or subjective tasks.


  Treat persona text in system prompts as stylistic, not as a performance
  lever.
