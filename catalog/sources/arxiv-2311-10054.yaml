summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to a system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it. The common "You are a
  helpful assistant" framing buys nothing measurable on objective tasks.


  The setup: 162 personas (112 occupations plus interpersonal roles, spanning
  6 relationship types and 8 expertise domains), 4 prompt templates
  (speaker-specific, audience-specific, and "Imagine" paraphrases), 9
  instruction-tuned open-weight models across 4 families (FLAN-T5-XXL 11B,
  Llama-3-Instruct 8B/70B, Mistral-7B-Instruct-v0.2, Qwen2.5-Instruct 3B-72B),
  on 2410 MMLU questions balanced across 26 subjects.


  Mixed-effects regressions with no-persona as reference find no persona
  significantly better than control; for Llama3-70B more personas have
  negative effects. In-domain personas help by a coefficient of 0.004 (p <
  0.01). Gender share in occupations is not predictive (coefficient -5.79e-4,
  p = 0.561). Word frequency, prompt-question similarity, and perplexity
  correlate weakly and inconsistently (similarity correlation ranges from 0.39
  on Qwen2.5-7B to -0.02 on Qwen2.5-72B).


  The evidence is measured, not argued, with a proper no-persona control and
  model as a random effect. Oracle best-persona-per-question gives large
  gains, but similarity selection, a domain classifier (78.1% accuracy), and a
  role classifier (F1 0.34-0.77) are barely better than random and worse than
  random on Qwen.


  Boundaries: only MMLU, only multiple-choice factual questions, no
  closed-source models, no open-ended or subjective tasks where personas may
  still matter.


  Stop treating persona strings as a free accuracy lever; choose them for
  style or safety instead.
