summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it. The usual advice to tell
  the model "you are an expert in X" does not survive a controlled test.


  The setup: 162 personas (112 occupations plus interpersonal roles, spanning
  6 relationship types and 8 expertise domains), 4 prompt templates
  (speaker-specific, audience-specific, plus "Imagine" paraphrases), 2,410
  MMLU questions balanced across 26 subjects, and 9 instruction-tuned open
  models from 4 families (FLAN-T5-XXL 11B, Llama-3 8B/70B,
  Mistral-7B-Instruct-v0.2, Qwen2.5 3B-72B).


  No persona beat the no-persona control at statistical significance; for
  Llama3-70B more personas had negative effects, while Qwen2.5-7B and 72B were
  insensitive to all 162. In-domain roles helped by a coefficient of 0.004 (p
  < 0.01). Gender share of an occupation was not predictive (coefficient
  -5.79e-4, p = 0.561). Oracle best-role-per-question gives large gains, but
  similarity selection, a domain classifier (78.1% accuracy) and a role
  classifier (F1 0.34-0.77) land near random, and below random on Qwen.


  Effects were measured with mixed-effects regressions against a no-persona
  control, with model as a random effect, across all 4 families. Limits: MMLU
  only, no open-ended or subjective tasks, no closed-source models.


  Treat persona prompts as a style or safety choice, not an accuracy lever.
