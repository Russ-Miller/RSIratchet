summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not make a model more accurate on
  factual questions, and often makes it slightly worse. The practice of
  writing "You are a helpful assistant" or "You are a lawyer" buys nothing on
  objective tasks.


  The setup: 162 personas (112 occupations plus interpersonal roles across
  family, friend, romantic, work, school, social, and AI categories), 4 prompt
  templates including speaker-specific and audience-specific framings, run
  over 2,410 MMLU questions balanced across 26 subjects mapped to 8 domains,
  on 9 instruction-tuned open models from 4 families (FLAN-T5-XXL 11B,
  Llama-3-Instruct 8B and 70B, Mistral-7B-Instruct-v0.2, Qwen2.5-Instruct 3B
  to 72B).


  No persona beat the no-persona control significantly in a mixed-effects
  model with model as a random effect; Llama3-70B showed more negative-effect
  personas, Qwen2.5-7B and 72B were insensitive to all 162. Domain alignment
  helped by a coefficient of 0.004 (p < 0.01). Gender share of an occupation
  was not predictive (coefficient -5.79e-4, p = 0.561). Word frequency,
  prompt-question similarity, and perplexity correlated weakly and
  inconsistently; similarity ranged from 0.39 on Qwen2.5-7B to -0.02 on
  Qwen2.5-72B.


  The effects are measured against a matched no-persona control across all
  models, which isolates the persona as the only varying factor. Oracle
  selection of the best persona per question gives large gains, but similarity
  ranking, a domain classifier at 78.1% accuracy, and a RoBERTa role
  classifier (F1 0.34-0.77) land near random selection, and below random on
  Qwen.


  Only MMLU multiple-choice was tested; no closed-source models, no open-ended
  or subjective tasks. If you are tuning system prompts for accuracy, persona
  text is not the lever.
