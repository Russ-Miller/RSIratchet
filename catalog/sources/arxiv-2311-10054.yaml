summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not make a model better at
  factual questions, and sometimes makes it worse. The common "You are a
  helpful assistant" framing has no measurable payoff on objective tasks.


  The setup: 162 personas (112 occupations, 50 interpersonal roles) crossed
  with 4 prompt templates (speaker-specific, audience-specific, plus "Imagine"
  paraphrases) over 2,410 MMLU questions balanced across 26 subjects, run on 9
  instruction-tuned open-weight models from 4 families: FLAN-T5-XXL (11B),
  Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2, and Qwen2.5-Instruct
  (3B to 72B).


  No persona beat the no-persona control at statistical significance; for
  Llama3-70B more personas had negative effects, while Qwen2.5-7B and 72B were
  insensitive to all 162. Domain-aligned personas helped by a coefficient of
  0.004 (p < 0.01). Gender-neutral roles beat gendered ones; occupational
  gender share was not predictive (coefficient -5.79e-4, p = 0.561). Role
  n-gram frequency, prompt-question similarity, and perplexity all correlated
  weakly and inconsistently (similarity correlation ranged 0.39 on Qwen2.5-7B
  to -0.02 on Qwen2.5-72B).


  Effects were measured with mixed-effects regressions against an explicit
  no-persona control, with model as a random effect, which isolates the
  persona itself. Oracle best-role-per-question gives large gains, but a
  RoBERTa domain classifier (78.1% accuracy) and a role classifier (F1
  0.34-0.77) were only marginally better than random role selection, and worse
  than random on Qwen.


  Limits: MMLU multiple-choice only, no open-ended or subjective tasks, no
  closed-source models, 162 personas.


  Stop treating persona prompts as a free accuracy lever; keep them for style
  or safety reasons only.
