summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to a system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it.


  The setup covers 162 personas (112 occupations, 50 interpersonal roles,
  spanning 6 relationship types and 8 expertise domains), 4 prompt templates
  including speaker-specific ("You are a lawyer") and audience-specific ("You
  are talking to a fireman"), 2,410 MMLU questions balanced across 26
  subjects, and 9 instruction-tuned open-weight models from 4 families:
  FLAN-T5-XXL (11B), Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2, and
  Qwen2.5-Instruct (3B-72B).


  No persona beat the no-persona control at statistical significance;
  Llama3-70B showed more negative effects, Qwen2.5-7B and 72B were insensitive
  to all 162 personas. Domain alignment helped by a coefficient of 0.004 (p <
  0.01). Gender-neutral roles beat gendered ones; occupational gender share
  was not predictive (coefficient -5.79e-4, p = 0.561). Role word frequency,
  prompt-question similarity, and perplexity correlated weakly and
  inconsistently (similarity correlation ranged from 0.39 on Qwen2.5-7B to
  -0.02 on Qwen2.5-72B).


  Effects were measured with mixed-effects regressions against a matched
  no-persona control, with random intercepts per model. Oracle
  best-role-per-question gave large gains, but a similarity method, a domain
  classifier (78.1% accuracy), and a RoBERTa role classifier (F1 0.34-0.77)
  landed near random selection, and below random for Qwen.


  Only MMLU, only open-weight models; no GPT-3.5/4, no open-ended or
  subjective tasks.


  Treat persona prefixes as stylistic choices, not accuracy levers.
