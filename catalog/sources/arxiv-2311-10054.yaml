summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to a system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it. That cuts against the
  common prompt-engineering advice to tell the model who it is.


  The test covers 162 personas (112 occupations, 50 interpersonal roles), 4
  prompt templates (speaker-specific, audience-specific, plus "Imagine"
  paraphrases), and 2,410 MMLU questions balanced across 26 subjects, run on 9
  instruction-tuned open-weight models from 4 families: FLAN-T5-XXL (11B),
  Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2, and Qwen2.5-Instruct
  (3B-72B).


  Mixed-effects regressions with no-persona as reference find no persona
  significantly better than control; for Llama3-70B more personas have
  negative effects. In-domain alignment gives a coefficient of 0.004 (p <
  0.01). Gender share in occupational roles is not predictive (coefficient
  -5.79e-4, p = 0.561). Role n-gram frequency correlates weakly with accuracy
  (-0.23 on Qwen2.5-7B down to -0.01 on Llama3-8B); prompt-question similarity
  ranges 0.39 to -0.02.


  Effects are measured against a matched no-persona control with model as a
  random effect, which isolates the persona itself. Oracle
  best-role-per-question does help, but automatic selection (similarity, a
  RoBERTa domain classifier at 78.1% accuracy, a role classifier at F1
  0.34-0.77) barely beats random and is worse than random on Qwen.


  Only MMLU, only open-weight models; no GPT-3.5/4, no open-ended or
  subjective tasks. Treat persona choice as noise, not a lever.
