summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to a system prompt does not improve accuracy on objective
  questions, and sometimes lowers it. Compared against a no-persona control,
  no persona tested produced a statistically better result on any model.


  The setup: 162 personas (112 occupations plus interpersonal roles, spanning
  6 relationship types and 8 expertise domains), 4 prompt templates
  (speaker-specific, audience-specific, plus "Imagine" paraphrases), and 2410
  MMLU questions balanced across 26 subjects, run on 9 instruction-tuned
  open-weight models from 4 families: FLAN-T5-XXL (11B), Llama-3-Instruct (8B,
  70B), Mistral-7B-Instruct-v0.2, Qwen2.5-Instruct (3B-72B).


  Effects that do reach significance are tiny: in-domain personas give a
  coefficient of 0.004 (p < 0.01); gender-neutral roles beat gendered ones;
  audience-specific prompts beat speaker-specific. Occupation gender share is
  not predictive (coefficient -5.79e-4, p = 0.561). Role n-gram frequency
  correlates weakly with accuracy (-0.23 on Qwen2.5-7B to -0.01 on Llama3-8B);
  prompt-question similarity ranges 0.39 to -0.02. Oracle
  best-role-per-question gives large gains, but a similarity heuristic, a
  domain classifier (78.1% domain accuracy), and a RoBERTa role classifier (F1
  0.34-0.77) land near random, and below random for Qwen.


  Effects were measured with mixed-effects regressions against a matched
  no-persona control, which isolates the persona well. Only MMLU multiple
  choice, only open-weight models; no GPT-4, no open-ended or subjective
  tasks, where persona may still matter.


  Treat persona text in system prompts as a style and safety choice, not an
  accuracy lever.
