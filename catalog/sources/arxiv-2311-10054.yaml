summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it. That cuts against the
  common practice of opening with "You are a helpful assistant" or a
  domain-matched expert role.


  The setup: 162 personas (112 occupations, 50 interpersonal roles across
  family, friend, romantic, work, school, social, plus AI roles), 4 prompt
  templates covering speaker-specific and audience-specific framing, and 2,410
  MMLU questions balanced across 26 subjects mapped to 8 domains. Models were
  9 instruction-tuned open-weight LLMs from 4 families: FLAN-T5-XXL (11B),
  Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2, and Qwen2.5-Instruct
  (3B to 72B).


  Mixed-effects regressions with the no-persona control as reference found no
  persona that beat control; most had no significant effect and Llama3-70B
  showed more negative effects. Domain-aligned roles helped by a coefficient
  of 0.004 (p < 0.01). Gender of occupational roles was not predictive
  (coefficient -5.79e-4, p = 0.561). Role n-gram frequency, prompt-question
  similarity, and perplexity correlated weakly and inconsistently; similarity
  ranged from 0.39 on Qwen2.5-7B to -0.02 on Qwen2.5-72B.


  Picking the best role per question does lift accuracy, but selection methods
  barely beat random: a RoBERTa domain classifier reached 78.1% domain
  accuracy yet gave little gain, and on Qwen it did worse than random.


  Measured, with a control condition and random effects per model, but limited
  to MMLU-style objective questions, open-weight models, and 162 roles. No
  GPT-3.5/4, no open-ended or subjective tasks.


  Treat persona text as a style or safety choice, not a performance lever.
