summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not improve accuracy on factual
  questions, and for larger models it more often hurts. No persona beats the
  no-persona control at statistical significance.


  The test used 162 personas (112 occupations, 50 interpersonal roles) crossed
  with 4 prompt templates (speaker-specific, audience-specific, plus "Imagine"
  paraphrases) over 2,410 MMLU questions balanced across 26 subjects, on 9
  instruction-tuned open-weight models from 4 families: FLAN-T5-XXL (11B),
  Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2, and Qwen2.5-Instruct
  (3B-72B).


  Most personas had no significant effect; Llama3-70B showed more negative
  effects, Qwen2.5-7B and 72B were insensitive to all 162. Domain alignment
  helped by a coefficient of 0.004 (p < 0.01). Gender share of an occupation
  was not predictive (coefficient -5.79e-4, p = 0.561). Prompt-question
  similarity correlated with accuracy inconsistently, from 0.39 on Qwen2.5-7B
  to -0.02 on Qwen2.5-72B. An oracle best-role-per-question gives large gains,
  but RoBERTa-based role and domain classifiers (domain accuracy 78.1%) land
  near random selection, and below it for Qwen.


  Effects were measured against a matched no-persona control with
  mixed-effects models and random intercepts per model, so the persona is
  isolated.


  Bounds: MMLU multiple-choice only, no open-ended or subjective tasks, no
  closed-source models.


  Treat persona text in system prompts as a style or safety choice, not a
  performance lever.
