summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to a system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it.


  The test used 162 personas (112 occupations, 50 interpersonal roles across
  family, friend, romantic, work, school, social, plus AI roles), 4 prompt
  templates (speaker-specific, audience-specific, and paraphrases with
  "Imagine"), and 2,410 MMLU questions balanced across 26 subjects mapped to 8
  domains, run on 9 instruction-tuned open-weight models from 4 families:
  FLAN-T5-XXL (11B), Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2,
  Qwen2.5-Instruct (3B-72B).


  Mixed-effects regressions with the no-persona control as reference find no
  persona beating control; most have no effect and some are negative, with
  more negative effects on Llama3-70B while Qwen2.5-7B and 72B are
  insensitive. Domain-aligned personas help by 0.004 (p < 0.01). Occupational
  gender skew is not predictive (coefficient -5.79e-4, p = 0.561). Role n-gram
  frequency correlates weakly (-0.23 on Qwen2.5-7B to -0.01 on Llama3-8B);
  prompt-question similarity ranges 0.39 on Qwen2.5-7B to -0.02 on
  Qwen2.5-72B.


  Evidence is measured against a matched no-persona control with random
  effects per model, and persona search is ablated: an oracle
  best-role-per-question gains a lot, but a RoBERTa domain classifier (78.1%
  accuracy), a role classifier (F1 0.34-0.77), and similarity selection are
  near or below random selection.


  Only MMLU, only open-weight models, no GPT-3.5/4, no open-ended tasks.


  Treat persona text in system prompts as a style or safety choice, not an
  accuracy lever.
