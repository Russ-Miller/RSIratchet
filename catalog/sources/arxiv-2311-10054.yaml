summary: Tests system-prompt personas against no-persona controls on 2,410
  factual questions across four model families. Across 162 personas, roles did
  not reliably improve accuracy; persona effects varied and were difficult to
  predict in advance.
ingested_at: 2026-11-09
brief: >-
  Adding a persona to the system prompt does not improve accuracy on factual
  multiple-choice questions, and sometimes lowers it. The common "You are a
  helpful assistant" framing has no measurable payoff on objective tasks.


  The test used 162 personas (112 occupations, 50 interpersonal roles across
  family, friend, romantic, work, school, social, plus AI roles), 4 prompt
  templates covering speaker-specific and audience-specific framings, and
  2,410 MMLU questions balanced across 26 subjects mapped to 8 domains. Models
  were 9 instruction-tuned open-weight LLMs from 4 families: FLAN-T5-XXL
  (11B), Llama-3-Instruct (8B, 70B), Mistral-7B-Instruct-v0.2, and
  Qwen2.5-Instruct (3B-72B).


  Mixed-effects regressions with the no-persona control as reference found no
  persona significantly better than control; Llama3-70B had more negative
  effects than smaller models, while Qwen2.5-7B and 72B were insensitive to
  all 162 personas. Domain-aligned personas helped by a coefficient of 0.004
  (p < 0.01). Occupational gender skew was not predictive (coefficient
  -5.79e-4, p = 0.561). Oracle best-role-per-question gave large gains, but
  similarity selection, a domain classifier (78.1% accuracy), and a role
  classifier (F1 0.34-0.77) were only marginally better than random, and worse
  than random on Qwen.


  The effect was measured against a matched no-persona control across 4 model
  families, which isolates the persona itself. Limits: open-weight models
  only, no GPT-3.5/4, MMLU only, no open-ended or subjective tasks.


  Stop treating persona strings as a free accuracy lever; keep them for style
  or safety reasons instead.
