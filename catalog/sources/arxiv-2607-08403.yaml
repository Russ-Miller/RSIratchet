summary: >-
  The application of lightweight Large Language Models in rule-based
  scientific domains remains severely limited by their tendency to mimic
  linguistic patterns rather than reproduce axiomatic reasoning, causing
  frequent hallucinations. Here, we show that G-Frame, an adaptive
  multi-agent framework integrating Bayesian and team game principles,
  establishes an automated closed-loop for high-quality data synthesis and
  model training. By forcing the internalization of domain constraints
  through structured reasoning, we synthesized a specialized corpus of
  363,045 chains-of-thought and 199,589 question
