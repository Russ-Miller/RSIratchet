brief: >-
  Quantized 7-8B models running on a laptop locate real Python bugs about
  43-45% of the time when told in advance that a bug exists, and spend nearly
  half their remaining output flagging that something is wrong without naming
  the fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized under Ollama on an M1
  Pro with 16GB, were given zero-shot prompts containing a single extracted
  buggy function from BugsInPy. 349 of 501 bugs (69.7%) across 17 projects,
  including pandas, keras and matplotlib, survived extraction.


  Mistral scored 44.4% correct, LLaMA 3.2 43.3%; McNemar's test on the 349
  paired predictions gives p = 0.68, so the gap is not meaningful. Per-project
  accuracy ranges 0.0% (tqdm, LLaMA) to 100.0% (PySnooper). By bug type,
  Null/None Check reaches 59.5-60.8% while Type Conversion is 0.0% and
  Other/Complex 21.7% / 16.7%.


  Scoring is keyword matching against tokens new to the fixed lines, validated
  only by manual inspection of 50 sampled responses with agreement reported
  qualitatively. The authors note this both over- and under-counts. The prompt
  guarantees a bug exists, so no false-positive rate on clean code was
  measured, and no cloud-model comparison was run.


  Treat this as a floor estimate for offline triage, not a detection rate.
