brief: >-
  Small quantized models running on a laptop identify something wrong in a
  buggy Python function far more often than they identify the actual fix.
  LLaMA 3.2 (8B) and Mistral (7B), both at 4-bit quantization via Ollama on an
  M1 Pro with 16GB, were given 349 real bugs from 17 BugsInPy projects, one
  function per prompt, zero-shot, with the prompt stating that a bug is
  present.


  Accuracy was 43.3% for LLaMA 3.2 and 44.4% for Mistral, with 171 and 161
  responses respectively labeled partial, meaning the model flagged a problem
  without naming the fix. Per-project results range from 0.0% on tqdm to
  100.0% on PySnooper. By bug type, Null/None Check reaches around 60%, Type
  Conversion 0.0% for both, and Other/Complex 21.7% and 16.7%.


  Scoring is keyword matching against tokens introduced by the patch,
  validated only on a manual check of 50 responses; the authors call it a
  lower bound. McNemar's test on paired predictions gives p = 0.68, so the
  model gap is not established. The only baseline is random keyword matching,
  stated as below 5%.


  No cloud model, no few-shot, no multi-function context, 1 language, 2
  models, and the bug-present hint likely inflates results.


  Treat local 7–8B models as region-narrowing assistants, not fix generators.
