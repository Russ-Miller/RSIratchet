brief: >-
  Small quantized models running on a laptop identify a bug's presence far
  more often than they identify its fix. LLaMA 3.2 (8B) and Mistral (7B), both
  at 4-bit quantization through Ollama on an M1 Pro with 16GB, were given
  single buggy Python functions with a zero-shot prompt that already stated a
  bug was present.


  The test set is 349 real bugs from 17 BugsInPy projects (pandas, keras,
  matplotlib, scrapy and others), 69.7% of the 501 total after extraction
  failures. LLaMA 3.2 scored 43.3% correct (151 correct, 171 partial, 27
  wrong) and Mistral 44.4% (155/161/33); McNemar's exact test on paired
  predictions gives p = 0.68, so the gap is not significant. Accuracy by bug
  type ranges from 60.8% on Null/None Check down to 21.7% and 16.7% on
  Other/Complex and 0% for both on Type Conversion (4 cases). By project it
  ranges from 0% on tqdm to 100% on PySnooper (2 bugs).


  Correctness is scored by keyword matching against tokens introduced in the
  fix, validated only against a manual check of 50 responses; the authors call
  it a lower bound. Against chance it is argued, not measured: "random keyword
  matching would yield negligible accuracy (below 5%)". No cloud-model
  comparison, 1 prompt format, 2 models, and the prompt reveals that a bug
  exists, which inflates results versus real triage.


  Treat local models as region-narrowing assistants, not fix generators.
