brief: >-
  Small quantized models running on a laptop identify roughly 43-45% of real
  Python bugs when told a bug exists and shown the enclosing function, but
  they far more often flag that something is wrong than name the fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized under Ollama on an M1
  Pro MacBook with 16GB, were given a zero-shot prompt over 349 BugsInPy bugs
  from 17 projects (pandas, keras, scrapy, matplotlib, others), 69.7% of the
  501-bug dataset. Grading was keyword-based: correct if the response contains
  a token introduced by the fix, partial if it only names a problem.


  Mistral scored 44.4% (155 correct, 161 partial, 33 wrong), LLaMA 3.2 43.3%
  (151/171/27). McNemar's test on paired predictions gives p = 0.68, so the
  gap is not distinguishable. Accuracy by project ranges 0% (tqdm, LLaMA) to
  100% (PySnooper). By bug type, Null/None Check reaches about 60%, Type
  Conversion 0%, Other/Complex 21.7% and 16.7%.


  The grading is heuristic and self-acknowledged as a lower bound; validation
  was a manual check of 50 responses by the author, with agreement reported
  only qualitatively. The baseline is random keyword matching, stated as below
  5%, not measured. 2 models, 1 language, 1 dataset, and the prompt guarantees
  a bug exists, which removes false-positive pressure.


  Treat local models as region-narrowing assistants, not localizers.
