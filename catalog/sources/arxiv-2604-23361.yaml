brief: >-
  Small quantized models running offline on a laptop find roughly 43-45% of
  real Python bugs when told a function is buggy, but mostly flag that
  something is wrong rather than name the fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on an Apple
  M1 Pro with 16GB, were given single extracted functions from BugsInPy with a
  zero-shot prompt stating a bug is present. 349 of 501 bugs across 17
  projects (pandas, keras, scrapy, matplotlib and others) were usable, 69.7%
  of the dataset.


  Mistral reached 44.4% accuracy, LLaMA 3.2 43.3%; both produced 161-171
  partial responses out of 349. McNemar's test on paired predictions gave p =
  0.68, so the model gap is not distinguishable. Accuracy by project ranged 0%
  on tqdm to 100% on PySnooper. By bug type: Null/None Check 59.5-60.8%,
  Return Value 51.3%, Other/Complex 21.7% and 16.7%, Type Conversion 0% for
  both.


  Scoring is keyword matching against tokens introduced by the fix, validated
  only against a manual check of 50 responses; it can both over- and
  under-count. The prompt guarantees a bug exists, which inflates results
  relative to real triage, and the "random keyword matching" baseline below 5%
  is weak.


  Treat local models as region-narrowing assistants, not fix generators, and
  discount any accuracy number produced by keyword-based grading.
