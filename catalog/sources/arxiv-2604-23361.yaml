brief: >-
  Small open-weight models running offline on a laptop find real Python bugs
  about 43-45% of the time when told in advance that a bug exists, but mostly
  cannot say what the fix is.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized under Ollama on an M1
  Pro with 16GB, were given zero-shot prompts containing a single extracted
  function from 349 BugsInPy bugs across 17 projects (pandas, keras, scrapy,
  matplotlib and others), out of 501 total bugs, 69.7% processed.


  LLaMA 3.2 scored 43.3% (151 correct, 171 partial, 27 wrong), Mistral 44.4%
  (155/161/33); McNemar's exact test over the paired predictions gives p =
  0.68, so the gap is not distinguishable. Accuracy by project ranges from 0%
  (tqdm, LLaMA) to 100% (PySnooper). By bug type: Null/None Check 59.5%/60.8%,
  Return Value 51.3% both, Other/Complex 21.7%/16.7%, Type Conversion 0% both.


  Correctness is scored by keyword overlap with the fix lines, validated only
  against a manual check of 50 responses; the authors call it a lower bound.
  The prompt asserts a bug is present, removing the false-positive problem
  that dominates real use.


  No cloud model was run as a comparison, and 2 models on 1 dataset in 1
  language is the whole scope.


  Treat these as suspicious-region highlighters, not fix generators.
