brief: >-
  Small quantized models running offline on a laptop find roughly 2 in 5 real
  Python bugs, but mostly flag that something is wrong rather than pinpoint
  the fix. LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on
  an Apple M1 Pro with 16GB, were given a single buggy function and a
  zero-shot prompt stating a bug exists, across 349 BugsInPy bugs from 17
  projects (pandas, keras, scrapy and others), with responses scored by
  keyword matching against the fix.


  Mistral scored 44.4% correct, LLaMA 3.2 43.3%; McNemar's exact test on 349
  paired predictions gives p = 0.68, no difference. Partial responses (problem
  noted, no fix identified) were 171 and 161 respectively. Accuracy ranged
  from 0% on tqdm to 100% on PySnooper. By bug type, Null/None Check reached
  about 60%, Return Value 51.3%, Other/Complex 21.7% and 16.7%, Type
  Conversion 0.0% for both.


  The scoring is heuristic keyword matching, validated only against a manual
  check of 50 sampled responses; the only baseline is a stated random-keyword
  rate below 5%. No cloud-model comparison, no few-shot or multi-function
  context condition, 2 models, 1 language.


  Telling the model a bug exists removes the hard part, so treat 43-45% as an
  upper-bounded screening signal, not detection.
