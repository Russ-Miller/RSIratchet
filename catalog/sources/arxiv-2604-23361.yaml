brief: >-
  Small quantized models running on a laptop identify roughly 2 in 5 real
  Python bugs, but they are far better at flagging that something is wrong
  than at saying what to fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on an M1
  Pro MacBook with 16GB, were given a zero-shot prompt stating the function
  contains a bug, over 349 BugsInPy defects from 17 projects (501 total, 69.7%
  processed). Scoring was keyword-based: correct if a response mentions a
  token introduced by the fix, partial if it flags a problem without matching
  keywords.


  Mistral reached 44.4% accuracy, LLaMA 3.2 43.3%; partial responses were 161
  and 171. McNemar's test on the 349 paired predictions gives p = 0.68, no
  difference between models. Accuracy ranged from 0% on tqdm to 100% on
  PySnooper. By bug type: Null/None Check 59.5%/60.8%, Return Value 51.3%
  both, Other/Complex 21.7%/16.7%, Type Conversion 0% both.


  The evaluation is automated and heuristic; only 50 responses were manually
  checked for agreement, and the authors call the figures a lower bound. The
  chance baseline is asserted as "below 5%", not measured.


  Prompts announce the bug's existence, so this does not measure detection in
  the wild, and only function-level context, 2 models, and Python were tested.


  Useful if you are weighing offline models as a first-pass triage tool rather
  than a repair system.
