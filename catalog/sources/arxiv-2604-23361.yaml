brief: >-
  Small quantized models running offline on a laptop find roughly 2 in 5 real
  Python bugs when told a bug exists and given the enclosing function, but
  mostly flag the region rather than the fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on an M1
  Pro with 16GB, were zero-shot prompted on 349 bugs from BugsInPy spanning 17
  projects including pandas, keras, matplotlib and scrapy. Responses were
  graded by keyword matching against tokens introduced by the real patch, with
  correct, partial and wrong labels.


  Mistral scored 44.4% accuracy, LLaMA 3.2 43.3%; McNemar's exact test over
  349 paired predictions gave p = 0.68, so the gap is not distinguishable.
  Partials dominate the remainder (171 and 161 responses). Accuracy by bug
  type ranges from 59.5%/60.8% on Null/None checks to 21.7%/16.7% on
  Other/Complex and 0.0% on 4 Type Conversion bugs. Per-project spread runs 0%
  (tqdm) to 100% (PySnooper, 2 bugs).


  The grading is heuristic and self-acknowledged as a lower bound; validation
  was a manual look at 50 responses with no reported agreement statistic. No
  cloud-model comparison, no few-shot or full-file condition, 2 models, 1
  language, and the prompt asserts a bug is present, which inflates numbers
  relative to screening use.


  Treat local 7–8B models as region-narrowing assistants, not fix generators.
