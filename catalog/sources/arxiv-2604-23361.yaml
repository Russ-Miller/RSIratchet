brief: >-
  Small quantized models running on a laptop identify roughly 2 in 5 real
  Python bugs when told in advance that a bug exists, but mostly flag the
  region rather than the fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on an M1
  Pro with 16GB, were given single buggy functions from BugsInPy with a
  zero-shot prompt asking them to find and fix the bug. 349 of 501 bugs
  (69.7%) across 17 projects were processed after extraction failures.


  Mistral scored 44.4% accuracy, LLaMA 3.2 43.3%; McNemar's exact test on 349
  paired predictions gives p = 0.68, so the gap is not significant. Nearly
  half of outputs were "partial" (problem noted, no fix). Accuracy by bug type
  ranged from 59.5%–60.8% on Null/None checks to 21.7%/16.7% on Other/Complex
  and 0% on Type Conversion (4 cases). Per-project accuracy spanned 0% (tqdm)
  to 100% (PySnooper, 2 bugs).


  Correctness is scored by keyword matching against tokens introduced by the
  fix, validated only against a manual sample of 50 responses. There is no
  cloud-model comparison and no few-shot or full-file condition; the only
  baseline is a stated random-keyword figure below 5%. Small per-project and
  per-category counts make much of the variation unstable.


  The prompt guarantees a bug exists, so these numbers do not speak to
  screening clean code. Treat local models as region-narrowing assistants, not
  fix generators.
