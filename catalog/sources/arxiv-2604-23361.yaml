brief: >-
  Small quantized models running offline on a laptop identify the exact fix
  for roughly 43-45% of real Python bugs when told in advance that a function
  is buggy, and flag the presence of a problem without pinpointing it in
  nearly half the remaining cases.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on an M1
  Pro with 16GB, were given 349 bugs from 17 BugsInPy projects (of 501 total,
  69.7% extractable) with a single zero-shot prompt per buggy function.


  Mistral reached 44.4% accuracy (155 correct, 161 partial, 33 wrong) versus
  43.3% for LLaMA 3.2 (151/171/27). McNemar's test on paired predictions gives
  p = 0.68, so the gap is not distinguishable. Accuracy by project ranges 0%
  (tqdm, LLaMA) to 100% (PySnooper). By bug type: Null/None Check 59.5%/60.8%,
  Return Value 51.3% both, Other/Complex 21.7%/16.7%, Type Conversion 0% both.


  Scoring is keyword matching against tokens new to the fix, which the author
  calls heuristic and a lower bound; agreement was checked on a manual sample
  of 50 responses only. The stated chance baseline is "below 5%". No
  cloud-model comparison, no few-shot or multi-sample condition, 2 models, 1
  language.


  Telling the model a bug exists inflates the setting relative to real triage,
  and function-level context caps performance on cross-function defects.


  Treat local 7-8B models as region-narrowing assistants, not fix generators.
