brief: >-
  Small quantized models running offline on a laptop identify roughly 2 in 5
  real Python bugs when told in advance that a bug exists, but mostly flag the
  right region rather than the exact fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized (Q4_K_M) via Ollama on
  an M1 Pro MacBook with 16GB, were given zero-shot prompts containing a
  single extracted buggy function from BugsInPy. 349 of 501 bugs (69.7%)
  across 17 projects were usable after extraction filtering.


  Mistral scored 44.4% accuracy, LLaMA 3.2 43.3%; McNemar's exact test on 349
  paired predictions gives p = 0.68, so the gap is not distinguishable.
  Partial responses, which name a problem without matching fix keywords, were
  171 and 161 respectively. By bug type, Null/None Check reached about 60%,
  Other/Complex fell to 21.7% and 16.7%, and Type Conversion was 0% for both.
  Per-project accuracy ranged 0%–100%.


  Correctness was scored by keyword matching against tokens introduced by the
  fix, validated against manual inspection of 50 sampled responses; the
  authors call the metric a lower bound. The prompt asserts a bug is present,
  so no false-positive rate on clean code was measured. 2 models, 1 language,
  1 benchmark, no cloud-model comparison.


  Treat local models as region narrowers, not fix generators.
