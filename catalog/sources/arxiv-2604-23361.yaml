brief: >-
  Small quantized models running offline on a laptop locate roughly 43-45% of
  real Python bugs when told in advance that a bug exists, but most of their
  remaining output only flags that something is wrong without naming the fix.


  LLaMA 3.2 (8B) and Mistral (7B), both 4-bit quantized via Ollama on an M1
  Pro MacBook with 16GB, were given zero-shot prompts over single extracted
  functions for 349 bugs from 17 BugsInPy projects (pandas, keras, scrapy,
  matplotlib and others), out of 501 total.


  Mistral scored 44.4% correct, LLaMA 3.2 43.3%; partial responses numbered
  171 and 161. McNemar's exact test on 349 paired predictions gave p = 0.68,
  so the gap is not distinguishable. Accuracy ranged from 0% on tqdm to 100%
  on PySnooper, and by bug type from 60.8% on Null/None checks down to 0% on
  Type Conversion and 16.7-21.7% on Other/Complex.


  Grading was keyword matching against tokens introduced by the fix, checked
  against manual inspection of 50 sampled responses; the authors call it a
  lower bound. The prompt asserts a bug is present, so this is not detection
  under uncertainty. 2 models, 1 dataset, 1 language, no cloud-model
  comparison.


  Treat local models as region-narrowing assistants, not fix generators.
