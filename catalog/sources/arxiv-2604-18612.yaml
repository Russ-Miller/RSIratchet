summary: >-
  Large Language Models (LLMs) have demonstrated strong capabilities in
  complex reasoning tasks, while recent prompting strategies such as
  Chain-of-Thought (CoT) have further elevated their performance in handling
  complex logical problems. Despite these advances, high-quality reasoning
  remains heavily reliant on manual static prompts and is sensitive to
  decoding configurations and task distributions, leading to performance
  fluctuations and limited transferability. Existing automatic prompt
  optimization methods typically adopt single-agent local search, failing to
  simultaneously optimize prompts
