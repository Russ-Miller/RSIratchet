brief: >-
  How you bound retrieval in a retrospective forecasting benchmark matters
  more than which model you rank. Date-filtered search alone inflates scores
  by more than the entire spread across 27 model configurations.


  OracleProto reconstructs resolved events from FutureX-Past as
  discrete-choice forecasting instances, admitting each question only if the
  model's disclosed knowledge cutoff precedes the prediction cutoff,
  date-restricting Tavily search at the tool layer, and running an auxiliary
  filter over retrieved snippets blind to the question and gold answer. The
  main benchmark covers 27 model-configuration pairs on 300 questions (109
  binary, 154 MCS, 37 multi-answer), 3 trials each, 24,300 predictions.


  In a controlled comparison on 4 models (10,800 predictions), scores follow
  no-retrieval < full protocol < date-only: retrieval adds +10.65 to +18.56
  Score points, and removing flagged candidates costs +12.65 to +16.35,
  against an 11.0-point range across all 27 configurations. A post-filter
  audit flags 137 of 10,000 results (1.37%) as leaking realized facts, all 137
  human-confirmed, with no leakage in 1,000 sampled negatives. More reasoning
  effort helps unevenly: GPT-5.4 High gains +6.31 over Default, Kimi K2.5 only
  +0.31. Strict majority voting scores below the trial mean for 27 of 27
  configurations.


  The ablation replays a frozen candidate bank with fixed prompts and budgets,
  isolating the filter, but the authors note D−F is not a pure leakage
  estimate since the filter also drops admissible speculation. Only
  discrete-choice questions, 1 retrieval backend, disclosed cutoffs taken as
  proxies.


  Treat any retrospective forecasting score without a documented information
  boundary as uninterpretable.
