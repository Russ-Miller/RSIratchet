brief: >-
  How you bound a forecasting model's information access moves scores more
  than which model you pick. Date-restricted retrieval without content
  filtering inflates scores by more than the entire spread across 27 model
  configurations.


  OracleProto reconstructs resolved events from a FutureX-Past-derived pool as
  discrete-choice forecasting tasks, admitting a question only if the model's
  disclosed knowledge cutoff precedes the prediction cutoff, date-restricting
  live Tavily search at the tool layer, and running an auxiliary filter that
  sees only retrieval payloads, never the question or answer. The main run
  covers 27 model-configuration pairs on 300 questions (109 binary, 154 MCS,
  37 multi-answer), 3 trials each, 24,300 predictions.


  Across GLM-5, Kimi K2.5, Doubao Seed 2.0 Lite and Qwen 3.5 Flash, retrieval
  adds +10.65 to +18.56 Score points over no retrieval, and dropping the
  content filter adds a further +12.65 to +16.35, against an 11.0-point range
  across all 27 configurations. Filtering retains 40.4–42.8% of candidate
  results. A post-filter audit flags 137 of 10,000 results (1.37%) as leaking
  realized facts, all 137 human-confirmed, with no leakage in 1,000 sampled
  negatives.


  The boundary comparison replays a frozen candidate bank per model, question
  and trial, so the corpus is held fixed; but query selection can still shift,
  and the filter also removes admissible future-dated schedules, so D−F is not
  a clean leakage estimate. Only 4 models in that ablation.


  Secondary findings: more reasoning effort is inconsistent (GPT-5.4 High
  +6.31 over Default; Kimi +0.31), majority voting scores below the trial mean
  for 27 of 27 configurations, and GPT-OSS Default trails Opus 4.6 by 1.98
  points at $0.49 versus $64.74 per trial.


  If you read retrospective forecasting scores, treat the retrieval boundary
  as the first thing to check.
