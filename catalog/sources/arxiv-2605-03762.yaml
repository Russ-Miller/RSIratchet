summary: "Forecasting is a composite capability encompassing information
  gathering, evidence integration, situational assessment, and
  decision-making. Large language models (LLMs) combine reasoning and tool
  use, offering new avenues for automated forecasting and decision support.
  Yet LLM forecasting evaluation faces a structural challenge: live benchmarks
  support prospective assessment, but limited question reuse and changing
  information conditions make results difficult to reproduce and compare;
  retrospective benchmarks offer reproducibility but risk information leakage.
