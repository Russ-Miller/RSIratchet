summary: >-
  Large language models are increasingly deployed in Arabic-speaking
  markets, yet standard benchmarks overwhelmingly reward Modern Standard
  Arabic (MSA) fluency while leaving dialectal and culturally grounded
  competence unmeasured. This gap is consequential: everyday Arabic is
  largely dialectal, and dialect encodes social meaning that MSA-centric
  evaluation cannot capture. We present a rubric-based benchmark for the
  Saudi dialect, comprising 31 expert-authored prompts spanning idiomatic,
  pragmatic, lexical, and culturally-embedded phenomena, each paired with an
  expert-established ground truth. O
