brief: >-
  Multimodal models that do well at describing what already happened in a
  video are much weaker at predicting what happens next when audio carries the
  causal cue. FutureOmni tests this with 919 newly collected YouTube videos
  (average 163.5 seconds) and 1,034 multiple-choice QA pairs across 8 domains,
  built via a Gemini/DeepSeek-assisted, human-verified pipeline with 4
  adversarial distractor types (visual-only, audio-only, delayed,
  reverse-causal).


  Across 20 models, the best is Gemini 3 Flash at 64.80%; the strongest
  open-source omni model, Qwen3-Omni (30B), reaches 53.05%, and the best
  video-only model, GPT-4o, 49.70%. Speech is the hardest audio type (Gemini 3
  Flash 60.52% speech vs 68.31% music). Error analysis on 318 Gemini 3 Flash
  failures attributes 51.6% to video perception, 30.8% to joint reasoning, and
  only 2.5% to missing knowledge.


  A modality ablation isolates the audio contribution: Qwen2.5-Omni drops from
  47.48% (A+V) to 42.50% with video or audio alone, and subtitles or captions
  do not recover the gap. LoRA tuning on a 7K rationale-annotated set gives
  +1.03 to +3.87 on FutureOmni and small out-of-domain gains (Qwen2.5-Omni
  WorldSense +2.55, Video-MME 53.77 to 55.51).


  Tuning covers 3 7B-class open models only, with no matched-data control;
  gains for video-SALMONN 2 and Ola are under 1 point on most transfer
  benchmarks. Treat audio-grounded forecasting as an unsolved axis distinct
  from retrospective video QA.
