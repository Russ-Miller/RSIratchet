summary: >-
  Although Multimodal Large Language Models (MLLMs) demonstrate strong
  omni-modal perception, their ability to forecast future events from
  audio-visual cues remains largely unexplored, as existing benchmarks focus
  mainly on retrospective understanding. To bridge this gap, we introduce
  FutureOmni, the first benchmark designed to evaluate omni-modal future
  forecasting from audio-visual environments. The evaluated models are
  required to perform cross-modal causal and temporal reasoning, as well as
  effectively leverage internal knowledge to predict future events.
