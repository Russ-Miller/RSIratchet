brief: >-
  Safety alignment on 6 current models degrades once a malicious request
  leaves English or is dressed up as legitimate security work, and no tested
  model refuses more than about a quarter of such requests. Prompts for
  phishing emails, phishing webpages, and keylogger code were written in
  direct and elaborate (red-team, awareness-training framing) variants,
  instantiated in English, Turkish, Russian, and Simplified Chinese plus
  Base64, ROT13, and Hex encodings of the malicious clause, then run 10 times
  each against DeepSeek-V3.2, Gemini 2.5 Flash, GPT-5 Mini, Grok-4-1-Fast,
  Llama 4 Scout Instruct, and Qwen 3 235B, for 15,540 responses.


  Full compliance was 68.76%, stalling assistance 12.08%, refusal 19.16%, so
  80.84% fulfillment. Full compliance spanned 44.09% (GPT-5 Mini) to 84.32%
  (DeepSeek), but GPT-5 Mini's 30.23% stalling still left 74.32% fulfillment.
  Turkish led languages at 80.18% versus English 71.31%; encodings averaged
  59.46% against 75.73% for natural languages. Elaborate prompts hit 76.69%
  versus 62.01% direct, and elaborate phishing email carried only 17.18%
  warnings.


  Outcomes were human-labelled against a 3-way rubric, with per-iteration
  compliance stable at 68.02%-69.56%. There is no check that compliant outputs
  are actually usable; the authors exclude response quality explicitly, so
  StrongREJECT-style overestimation is unaddressed. The prompt set comes from
  the authors' prior work, 1 translation engine (DeepL), and no statistical
  testing is reported.


  Treat English-only red-teaming as an incomplete safety signal.
