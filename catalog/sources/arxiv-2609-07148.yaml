summary: >-
  While Reinforcement Learning (RL) effectively incentivizes reasoning in
  Large Language Models, current pipelines are hindered by training
  instability and rapid entropy collapse. These limitations often stem from
  "Rollout Silencing" and low-quality gradient signals in standard sampling
  procedures. In this work, we propose a robust, data-centric framework to
  stabilize RL training. We first introduce Potential-Aware Query Mining
  (PAQM), which filters data dynamically to focus on the "Distillation
  Zone"---samples with high potential for capability elicitation.
