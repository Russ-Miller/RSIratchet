brief: >-
  Splitting a tabular-plus-narrative prediction task across category-specific
  LLM agents and fusing their intermediate scores with a small supervised MLP
  beats both single-agent prompting and tabular-only machine learning on crash
  severity. TransportAgent assigns filtered features to conceptual groups
  (demographics, environment, incident details), has one agent score each
  group, and trains an MLP on the score vector to output a 4-level severity
  label.


  Evaluation covers 2 U.S. injury surveillance datasets filtered to
  micromobility crashes, CPSRMS (1555 test samples) and NEISS (1059 whole, 397
  balanced subset), across GPT-3.5-turbo, GPT-4o-mini and
  LLaMA-3.3-70B-Instruct, against 10-shot prompting, CoT, AutoGen, MLP, MLP
  with feature selection, and ordered logit.


  On CPSRMS with GPT-3.5-turbo it reaches 74.6% accuracy versus 62.38% for
  CoT, 66.56% for AutoGen, 64.6% for Ologit and 19.3% for a plain MLP;
  LLaMA-3.3-70B-Instruct gives 73.31% on CPSRMS and 85.78% on whole NEISS.
  Over 10 stratified 80/20 splits it averages 70.69% ± 1.76 against 54.04% ±
  1.08 for k-shot and 63.22% ± 1.97 for CoT.


  Measured, with matched test partitions, an ablation removing feature
  selection, category organization and individual agents, and a repeated-split
  check that retrains only the MLP while freezing the agents. No matched
  token-budget baseline is reported, and the MLP sees supervised training that
  the prompting baselines do not.


  The advantage is not uniform: on whole NEISS, ordered logit scores 80.4%
  against 76.41% for GPT-3.5-turbo and 74.84% for GPT-4o-mini versions, and
  NEISS results are mainly reported on a rebalanced subset. Only 2 datasets, 1
  task.


  If your data is narrative-heavy, decomposition plus supervised fusion is
  worth more than better prompting.
