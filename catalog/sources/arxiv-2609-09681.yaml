summary: >-
  Large Audio Language Models (LALMs) have shown strong performance on audio
  reasoning benchmarks, but accuracy alone cannot distinguish true reasoning
  from superficial pattern matching, often overestimating reasoning ability
  since high scores may result from guessing rather than genuine audio
  understanding. Evaluating the reasoning process itself is essential for
  improving LALMs' reasoning ability, yet remains challenging. Existing
  methods either rely on costly human annotation or opaque LLM-as-judge
  approaches, making them impractical, biased, and lacking transparency.
