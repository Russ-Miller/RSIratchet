brief: >-
  When cultural norms and personal preferences conflict, models do not share a
  single resolution: some families almost always defer to the norm, others
  almost always honor the preference, and the split is a property of the model
  family rather than of the scenario.


  PACT builds 318720 instances from NormAd-ETI (75 countries) and CultureAtlas
  (149 countries), each pairing a scenario, a GPT-4o-generated personal
  preference in tension with the local norm, and actor/receiver countries,
  ages, and genders. Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3,
  DeepSeek-7B-Chat, and GPT-5.4-mini choose Follow-Culture or
  Allow-Preference.


  Country context shifted behavior most (7.8%), far above age (1%) and gender
  (0.7%). Mistral, DeepSeek, and Qwen lean norm-following; Llama and GPT lean
  preference-permissive. Instruction tuning moved models in opposite
  directions. A 200-participant Prolific study across Brazil, India, South
  Africa, the UK, and the US produced 4098 judgments on 63 scenarios;
  agreement was lowest when the scenario country matched the participant's
  own. Models matched human majority choices but tracked human uncertainty
  poorly, best correlation 0.24.


  Measured, with annotator validation on 200 scenarios (96.0% plausibility,
  96.3% pooled agreement), demographic and prompt ablations, option-position
  checks, and base-vs-instruct comparison. Persona conditioning helped some
  models (DeepSeek worsened 0.092 to 0.128 MAE; Qwen improved 0.188 to 0.146)
  and hurt others.


  Binary choices only, English-only, country as a proxy for culture, 5
  participant countries, larger models (≥24B) tested only in targeted
  analyses.


  Treat majority-choice agreement as insufficient evidence of cultural
  alignment.
