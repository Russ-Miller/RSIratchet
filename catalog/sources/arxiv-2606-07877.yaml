brief: >-
  When cultural norms conflict with a stated personal preference, models do
  not share a common resolution: some almost always defer to the norm
  (Mistral, DeepSeek, Qwen), others side with the individual (Llama, GPT), and
  instruction tuning pushes different families in opposite directions.


  PACT builds 318720 binary-choice instances from NormAd-ETI (75 countries)
  and CultureAtlas (149 countries), each pairing a scenario with an actor and
  receiver whose countries, ages, genders, and norm/preference orientations
  are varied orthogonally, with GPT-4o-generated preferences validated on 200
  sampled items by 4 annotators (96.0% plausibility, pooled agreement 96.3%).
  6 models were tested, plus base-versus-instruct comparisons.


  Behavior shifted more by country context (7.8%) than age (1%) or gender
  (0.7%). A 200-participant Prolific study across Brazil, India, South Africa,
  the UK and the US yielded 4098 judgments over 63 scenarios; agreement was
  lowest when the scenario country matched the participant's own, and scenario
  country was the strongest regression predictor. Models matched human
  majority choices but tracked human uncertainty poorly, best correlation
  0.24, and persona conditioning helped some models (Qwen 0.188 to 0.146 MAE)
  while hurting others (DeepSeek 0.092 to 0.128).


  Effects were measured, with demographic, scale, source-dataset and
  option-position ablations, though preferences are synthetic, the choice
  space binary, prompts English-only, and the human sample covers 5 countries.


  Treat majority-choice agreement as insufficient evidence of cultural
  alignment.
