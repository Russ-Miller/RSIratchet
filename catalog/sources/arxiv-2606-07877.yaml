brief: >-
  When a stated personal preference conflicts with a local cultural norm,
  which side a model takes is mostly a property of the model family, not of
  the scenario, and no model tracks how divided humans are about these cases.


  PACT builds 318720 binary-choice instances (Follow-Culture vs
  Allow-Preference) from NormAd-ETI and CultureAtlas, varying actor/receiver
  country, age, gender, country distance, and 3 preference-role
  configurations. Models tested: Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B,
  Mistral-7B-v0.3, DeepSeek-7B-Chat, GPT-5.4-mini, plus a human study of 200
  Prolific participants from 5 countries yielding 4098 judgments over 63
  scenarios.


  Mistral, DeepSeek and Qwen are norm-dominant; Llama and GPT allow
  preferences most. Country context shifts behavior 7.8% versus 1% for age and
  0.7% for gender. Instruction tuning moves families in opposite directions.
  Human agreement is lowest when participants judge their own country. Models
  can match the human majority option while missing response rates, and the
  best uncertainty correlation is 0.24 (GPT).


  Effects are measured, with 200 manually validated scenarios (96.0%
  plausibility, 96.3% pooled agreement), demographic and prompt ablations,
  option-position checks and larger-model (≥24B) replication. Persona
  conditioning helps unevenly (DeepSeek worsens 0.092 to 0.128 MAE; Qwen
  improves 0.188 to 0.146).


  Limits: binary choices, synthetic preferences, English only, country as
  proxy for culture, 5 participant countries, mostly small models.


  If you evaluate cultural alignment by majority agreement, you are likely
  scoring the wrong thing.
