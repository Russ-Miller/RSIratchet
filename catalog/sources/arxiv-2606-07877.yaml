brief: >-
  When a stated personal preference conflicts with a local cultural norm,
  which way a model resolves it is mostly a property of the model family, not
  of the scenario, and no model tracks how divided humans actually are. PACT
  builds 318720 instances from NormAd-ETI (75 countries) and CultureAtlas (149
  countries), each pairing an actor and receiver with countries, age, gender,
  and a GPT-4o-generated preference in tension with the norm, with a binary
  choice between Follow-Culture and Allow-Preference.


  Across Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3,
  DeepSeek-7B-Chat, and GPT-5.4-mini, Mistral, DeepSeek and Qwen are
  norm-dominant while Llama and GPT are preference-permissive. Country context
  shifts behavior 7.8% versus 1% for age and 0.7% for gender. Instruction
  tuning moves models in opposite directions: Llama and Qwen toward
  preference, DeepSeek and Mistral toward norms. A 200-participant Prolific
  study across Brazil, India, South Africa, the UK and the US yielded 4098
  judgments on 63 scenarios; agreement was lowest when the scenario country
  matched the participant's own. Best human-model uncertainty correlation was
  0.24 (GPT); persona conditioning helped some models (Qwen 0.188 to 0.146
  MAE) and hurt others (DeepSeek 0.092 to 0.128).


  Effects are measured, with demographic, scale, source-dataset, prompt and
  option-position ablations, and annotator validation on 200 scenarios (96.0%
  plausibility, AC1 = 0.962). Preferences are synthetic, not elicited; the
  decision space is binary; country proxies culture; everything is in English;
  larger models (>=24B) only in targeted runs.


  If you evaluate cultural alignment by majority-choice accuracy, this argues
  you are measuring the wrong thing.
