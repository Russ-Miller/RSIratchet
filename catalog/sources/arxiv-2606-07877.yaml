brief: >-
  Models can hit the human majority answer on culture-versus-preference
  dilemmas while completely missing how divided humans are, with the best
  uncertainty correlation reaching only 0.24.


  PACT builds 318720 scenarios from NormAd-ETI and CultureAtlas in which an
  actor's personal preference conflicts with a receiver's local cultural norm,
  forcing a binary choice between Follow-Culture and Allow-Preference.
  Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3, DeepSeek-7B-Chat and
  GPT-5.4-mini were evaluated, alongside 200 Prolific participants from
  Brazil, India, South Africa, the UK and the US giving 4098 judgments over 63
  scenarios.


  Behavior split by family: Mistral, DeepSeek and Qwen are norm-dominant,
  Llama and GPT preference-permissive. Country context shifted decisions 7.8%
  versus 1% for age and 0.7% for gender. Instruction tuning moved families in
  opposite directions. Human agreement was lowest when participants judged
  their own country's scenarios. Persona conditioning did not consistently
  help: DeepSeek's rate-alignment MAE worsened from 0.092 to 0.128, while Qwen
  improved from 0.188 to 0.146.


  Effects are measured, with demographic, scale, source-dataset and
  option-position ablations, plus 200 human-validated scenarios (96.0%
  plausibility). Preferences are GPT-4o-generated rather than elicited, the
  decision space is binary with no compromise option, country stands in for
  culture, and the human reference covers 5 countries in English only.


  Treat majority-match scores on cultural benchmarks as uninformative about
  distributional alignment.
