brief: >-
  Models can match the human-majority answer on culture-versus-preference
  dilemmas while failing to reproduce how divided humans actually are. Which
  way a model leans is a property of the model family, not a shared default.


  PACT builds 318720 scenario instances from NormAd-ETI (75 countries) and
  CultureAtlas (149 countries), each pairing a cultural norm with a
  GPT-4o-generated personal preference and forcing a binary choice between
  Follow-Culture and Allow-Preference across actor/receiver country, age,
  gender, and 3 preference-role configurations. Evaluated models:
  Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3, DeepSeek-7B-Chat,
  GPT-5.4-mini.


  Qwen, DeepSeek and Mistral favor norms; Llama and GPT favor preferences.
  Country context shifts behavior by 7.8%, against 1% for age and 0.7% for
  gender. Instruction tuning moves models in opposite directions. Best
  human-model correlation on uncertainty is 0.24; persona conditioning helps
  some models (OLMo 0.278 to 0.217, Qwen 0.188 to 0.146) and hurts others
  (DeepSeek 0.092 to 0.128).


  Evidence is measured, with 200-scenario manual validation (96.3% pooled
  agreement, Gwet's AC1 = 0.962), option-position checks, demographic and
  source-dataset ablations, and larger-model (>=24B) spot checks. The human
  reference is 4098 judgments from 200 Prolific participants over 63 scenarios
  in 5 countries, not cultural experts.


  Boundaries: binary choice space, English prompts, constructed rather than
  elicited preferences, country as a proxy for culture, age and gender only.


  If you report majority-choice agreement as cultural alignment, you are not
  measuring what you think.
