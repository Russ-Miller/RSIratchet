brief: >-
  When cultural norms and a user's stated personal preference conflict, models
  do not share a common resolution: some families almost always defer to the
  norm, others almost always allow the preference, and none tracks how divided
  humans actually are. PACT builds 318720 instances from NormAd-ETI (75
  countries) and CultureAtlas (149 countries), each pairing a scenario, an
  actor-receiver dyad with age/gender/country, and a GPT-4o-generated
  preference in tension with the norm; models pick Follow-Culture or
  Allow-Preference. Evaluated models are Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B,
  Mistral-7B-v0.3, DeepSeek-7B-Chat and GPT-5.4-mini.


  Mistral, DeepSeek and Qwen are norm-dominant; Llama and GPT are
  preference-permissive. Country context shifts behavior 7.8%, far above age
  (1%) and gender (0.7%). Instruction tuning moves families in opposite
  directions. Against 4098 human judgments from 200 Prolific participants
  across Brazil, India, South Africa, UK and US over 63 scenarios, models can
  match the majority option but correlate with human uncertainty at only 0.24
  at best; persona conditioning helps some and hurts others (DeepSeek MAE
  0.092 to 0.128; Qwen 0.188 to 0.146).


  Effects are measured, with demographic, scale, source-dataset and
  option-position ablations, plus 200 human-validated scenarios (96.0%
  plausibility). Choices are binary, English-only, country-as-culture, and the
  human sample covers 5 countries.


  Treat majority-choice agreement as insufficient evidence of cultural
  alignment.
