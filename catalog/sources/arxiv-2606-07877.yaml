brief: >-
  When a stated personal preference conflicts with a local cultural norm,
  which one an LLM sides with is mostly a property of the model family, not of
  the scenario, and no model tracks how divided humans actually are on these
  cases.


  PACT builds 318720 binary-choice instances from NormAd-ETI (75 countries)
  and CultureAtlas (149 countries), each pairing a scenario, an actor-receiver
  dyad with age/gender/country, and a GPT-4o-generated personal preference in
  tension with the norm. Models choose Follow-Culture or Allow-Preference.
  Evaluated: Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3,
  DeepSeek-7B-Chat, GPT-5.4-mini.


  Mistral, DeepSeek and Qwen are norm-dominant; Llama and GPT are
  preference-permissive. Behavior shifts more with country context (7.8%) than
  age (1%) or gender (0.7%). Instruction tuning moves Llama and Qwen toward
  preference-allowing and DeepSeek and Mistral the other way. Against 4098
  human judgments from 200 Prolific participants across Brazil, India, South
  Africa, the UK and the US over 63 scenarios, models can hit the majority
  option but miss response rates; best uncertainty correlation is 0.24 (GPT).
  Persona conditioning helps some models and hurts others (DeepSeek 0.092 to
  0.128 MAE; OLMo 0.278 to 0.217; Qwen 0.188 to 0.146).


  Effects are measured, with demographic, prompt-condition, source-dataset,
  model-scale and option-position ablations; 200 scenarios were
  human-validated (96.0% plausibility, Gwet's AC1 = 0.962).


  Boundaries: binary choice with no compromise option, constructed rather than
  elicited preferences, country as proxy for culture, English only, 5 human
  countries, larger models (>=24B) only in targeted analyses.


  If you evaluate cultural alignment by majority agreement, you are likely
  scoring models that do not match human disagreement at all.
