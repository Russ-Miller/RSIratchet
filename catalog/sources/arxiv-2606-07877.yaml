brief: >-
  Models can match the human-majority answer on culture-versus-preference
  dilemmas while failing to reproduce how divided humans actually are; best
  human-model uncertainty correlation reaches only 0.24.


  PACT builds social scenarios from NormAd-ETI (75 countries) and CultureAtlas
  (149 countries), pairing a cultural norm with a GPT-4o-generated personal
  preference and forcing a binary choice between Follow-Culture and
  Allow-Preference, across actor/receiver countries, age, gender, and 3
  preference-role configurations. 318720 base instances; 6 models evaluated
  (Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3, DeepSeek-7B-Chat,
  GPT-5.4-mini), plus a Prolific study of 200 participants from 5 countries
  yielding 4098 judgments over 63 scenarios.


  Behavior splits by family: Mistral, DeepSeek and Qwen are norm-dominant,
  Llama and GPT preference-permissive; instruction tuning moves families in
  opposite directions. Country context shifts behavior 7.8% versus 1% for age
  and 0.7% for gender. Human agreement is lowest when participants judge their
  own country. Persona conditioning helps unevenly (DeepSeek worsens 0.092 to
  0.128 MAE; Qwen improves 0.188 to 0.146).


  Effects are measured, with demographic, scale, source-dataset and
  option-position ablations, and a regression on human data. 200 validation
  scenarios had 96.0% plausibility.


  Preferences are synthetic, scenarios binary, framing English-only, country
  used as a coarse culture proxy, human study limited to 5 countries, larger
  models only spot-checked.


  If you report majority agreement as cultural alignment, this says that
  metric hides the disagreement you care about.
