brief: >-
  When cultural norms conflict with a stated personal preference, which one a
  model sides with is mostly a property of the model family, not of the
  scenario, and no model tracks how divided humans actually are.


  PACT builds 318720 instances from NormAd-ETI (75 countries) and CultureAtlas
  (149 countries), each pairing a scenario, a cultural norm, and a
  GPT-4o-generated conflicting personal preference, with actor-receiver dyads
  varied by country distance, age, and gender. Models choose Follow-Culture or
  Allow-Preference: Llama-3.1-8B, Qwen-3-4B, OLMo-2-7B, Mistral-7B-v0.3,
  DeepSeek-7B-Chat, GPT-5.4-mini.


  Mistral, DeepSeek and Qwen are norm-dominant; Llama and GPT are
  preference-permissive. Country context shifts behavior 7.8%, versus 1% for
  age and 0.7% for gender. Instruction tuning moves families in opposite
  directions. A 200-participant Prolific study across Brazil, India, South
  Africa, UK and US yields 4098 judgments over 63 scenarios; agreement is
  lowest when the scenario country matches the participant's own. Best
  human-model uncertainty correlation is 0.24, and persona conditioning is
  inconsistent (DeepSeek worsens 0.092 to 0.128 MAE; Qwen improves 0.188 to
  0.146).


  Measured, with annotator validation on 200 scenarios (96.0% plausibility),
  demographic and option-position ablations, and base-vs-instruct comparison.
  Boundaries: binary choice, English only, country as culture proxy,
  constructed rather than elicited preferences, 5 participant countries,
  larger models (≥24B) only in targeted analyses.


  If you evaluate cultural alignment by majority-choice agreement, you are
  likely measuring the wrong thing.
