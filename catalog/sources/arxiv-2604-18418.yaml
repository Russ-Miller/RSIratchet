brief: >-
  Deep research agents write clinical guidelines that look right and cite
  plausibly while missing most of the evidence they should have found.
  MedProbeBench sets 50 guideline-generation tasks, one per tumour entity,
  drawn from 5 WHO Classification of Tumours volumes, with 5,133
  physician-validated atomic claims (2,203, or 42.92%, carrying citation
  anchors) and 1,236 task-adaptive rubric criteria; 17 systems were tested,
  split into LLMs with search tools and deep research agents.


  The best system, MiroThinker-v1.5-pro, scores 0.631 overall: 0.772 on
  holistic rubric quality but only 0.570 on evidence verification, with task
  success rate 0.452 and search effectiveness 0.496. Holistic scores cluster
  high while claim coverage collapses by knowledge type: mechanistic claims
  average 28.8%, differential diagnosis 22.2%, therapeutic claims 19.2%.
  Factual consistency stays high across sections even where coverage is poor,
  so citation formatting is preserved while the relevant evidence is not
  retrieved. Extended thinking modes did not improve grounding and sometimes
  hurt it.


  Evaluation is GPT-4.1 as judge at temperature 0. A reader study with 3
  senior experts on 40 samples gives Spearman rho=0.754, p=0.012 against the
  judge; 200 claim-reference pairs give F1 86.4% and Cohen's kappa=0.79. Each
  system was run once per task, so run-to-run variance is unmeasured, and the
  domain is oncology classification only.


  If you take high citation consistency as evidence of grounding, this
  separates the two.
