brief: >-
  Deep research agents can produce fluent, well-structured clinical guidelines
  while failing to ground the claims that matter; citation consistency stays
  high even where substantive evidence coverage collapses.


  MedProbeBench builds 50 guideline-generation tasks from 5 WHO Classification
  of Tumours volumes, each task 1 tumor entity, with 5,133 physician-validated
  atomic claims (2,203, or 42.92%, carrying citation anchors) and 1,236
  task-adaptive rubric criteria. 17 systems were tested zero-shot, spanning
  LLMs with search tools (GPT-5.2, Gemini-3-Flash, Claude-Sonnet 4,
  Baichuan-M2/M3-Plus) and deep research agents (MiroThinker-v1.5-pro,
  Perplexity Sonar DR, o4-mini DR, Tongyi DR-30B).


  Best overall score is 0.631 (MiroThinker-v1.5-pro), with holistic quality
  0.772 but evidence verification 0.570. Task success rate tops out at 0.452;
  search effectiveness at 0.496. By knowledge type, averages are 28.8% for
  mechanistic claims, 22.2% for differential diagnosis, 19.2% for therapeutic
  claims. Extended thinking modes did not help: Claude-Sonnet 4 falls 0.427 to
  0.396, Gemini-3-Flash 0.484 to 0.464.


  Scoring is GPT-4.1 as judge at temperature 0, with human checks: Spearman
  rho=0.754, p=0.012 on 40 rubric samples from 4 systems, and F1 86.4%,
  Cohen's kappa=0.79 on 200 claim-reference pairs. Each system was run once
  per task, so run-to-run variance is unmeasured.


  Scope is oncology guideline synthesis only, not diagnosis from patient
  cases. Treat high citation-consistency scores as weak evidence of grounding.
