summary: >-
  Multi-agent LLM systems, where multiple prompted instances of a language
  model independently answer questions, are increasingly used for complex
  reasoning tasks. However, existing methods for quantifying the uncertainty
  of their collective outputs rely on shallow voting statistics that discard
  the rich semantic information in agents' reasoning. We introduce DiscoUQ,
  a framework that extracts and leverages the structure of inter-agent
  disagreement -- both linguistic properties (evidence overlap, argument
  strength, divergence depth) and embedding geometry (cluster distances,
  dispersion, cohesion
