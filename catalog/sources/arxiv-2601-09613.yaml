brief: >-
  Open-weight vision-language models are near chance at judging whether an
  object is on a railway track, moving toward it, or dangerous, and joint
  multi-task fine-tuning recovers most of the gap. CogRail builds
  question-answer pairs over 2 public railway datasets (RailSem19, MRSI) with
  3 tasks: RailPos (position relative to track/ballast), RailMove (motion
  state), RailThreat (threat level). Cog-MRSI has 347 images with 614 OOIs;
  Cog-RailSem19 has 495 images with 1,536 OOIs, with animal and vehicle
  instances cut-and-pasted from LVIS. 5 models were evaluated zero-shot and
  after LoRA tuning: Qwen2-VL-7B, Qwen2.5-VL-7B, LLaMA-3.2-11B-Vision,
  Yi-VL-6B, LLaVA-NeXT-7B, under 2 visual prompt types.


  Zero-shot, the best model is Qwen2.5-VL at 48.19% mean accuracy; Yi-VL
  reaches 30.44%. Task-specific tuning raised average RailPos F1 by 7.47,
  4.77, 18.35 and 10.36 points across the 4 settings. Joint fine-tuning beat
  both zero-shot and individual tuning in 17 of 20 configurations; Qwen2.5-VL
  reached 76.11 F1 on Cog-RailSem19 Type-II, 20.04 over zero-shot and 9.77
  over individual tuning.


  The comparison is matched across models and prompt types, but uniform
  hyperparameters were used for every architecture, and some configurations
  degraded after tuning. Inputs are single frames, so motion and threat labels
  are partly underdetermined; much of Cog-RailSem19 is composited rather than
  real. Treat zero-shot VLMs as unusable for track-side risk judgment without
  domain tuning.
