brief: >-
  Open-weight vision-language models are near chance on railway intrusion
  reasoning out of the box, and joint multi-task fine-tuning recovers more
  than per-task fine-tuning does.


  CogRail builds visual question-answer pairs over 2 public railway datasets:
  Cog-MRSI (347 images, 614 objects of interest, 5 classes) and Cog-RailSem19
  (495 images, 1,536 objects, 7 classes, with animals and vehicles composited
  in from LVIS). 3 subtasks: relative position to track/ballast (RailPos),
  motion state (RailMove), threat level (RailThreat), all posed as
  single-answer multiple choice with 3 options. 5 models are tested:
  Qwen2-VL-7B, Qwen2.5-VL-7B, LLaMA-3.2-11B-Vision, Yi-VL-6B, LLaVA-NeXT-7B,
  under 2 visual prompt types (boxes only vs boxes plus track/ballast masks).


  Zero-shot, the best model is Qwen2.5-VL at 48.19% mean accuracy; Yi-VL
  reaches 30.44%. LoRA fine-tuning per task raises averaged RailPos F1 by
  7.47, 4.77, 18.35, and 10.36 points across the 4 settings. Joint fine-tuning
  beat both zero-shot and individual tuning in 17 of 20 configurations,
  peaking at 76.11% F1 (Qwen2.5-VL, Type-II, Cog-RailSem19), 9.77 points above
  individual tuning.


  The joint-vs-individual comparison is matched on data and hyperparameters,
  so the multi-task effect is reasonably isolated, but the same uniform recipe
  across architectures also produced degradations for Qwen2.5-VL and Yi-VL on
  some RailMove/RailThreat settings. Motion and threat are inferred from
  single frames, so temporal reasoning is never actually tested; no closed
  models, and the RailSem19 split uses pasted-in objects.


  Treat it as evidence that spatial-relational safety judgments are a real
  gap, not a prompting gap.
