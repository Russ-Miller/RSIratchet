brief: >-
  Reward-related information in LLM hidden states is not spread across the
  representation but concentrated in under 1% of neurons, split into 2
  functional types. Probes trained on single layers keep their predictive
  power after most input dimensions are pruned away.


  A 2-layer MLP value probe was trained with TD learning to predict eventual
  answer correctness from the hidden state at the question position, and a
  parallel dopamine probe was trained to predict paragraph-level TD errors
  estimated by Monte Carlo rollouts. Models included
  Qwen-2.5-7B/14B-SimpleRL-Zoo, Llama-3.1-8B-Instruct, Phi-3.5-mini,
  Gemma-3-4B and Qwen3.5-0.8B; datasets included GSM8K, MATH500, ARC, MBPP+
  and IFEval.


  Zeroing the top 1% of value neurons in 1 layer of Qwen-2.5-7B-SimpleRL-Zoo
  dropped MATH500 accuracy from 75.2% to 20.3% on average, versus 74.6% for
  random, 76.4% for next-token-prediction neurons, 71.6% for Magnitude and
  65.8% for Wanda. Value neurons gave average confidence AUC 0.67 against 0.60
  for a full-hidden-state linear probe, 0.52 verbal, 0.48 token probability.
  Dopamine neurons as a process reward model reached 77.8% versus 72.2% greedy
  and 75.0% implicit PRM.


  The causal claim is measured with 4 matched-sparsity ablation baselines and
  an overlap check (0.7% vs 0.5% random), which isolates reward-specificity
  reasonably well. The search application uses 1 model, 1 dataset subset, K =
  4, 3 seeds; initial-position AUCs are moderate.


  Worth reading if you build lightweight confidence estimators or internal
  PRMs.
