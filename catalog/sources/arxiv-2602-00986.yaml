summary: "Recent studies show that LLM hidden states encode reward-related
  information, such as answer correctness and model confidence. However,
  existing approaches typically fit black-box probes on the full hidden
  states, offering little insight into how this information is structured
  across neurons. In this paper, we show that reward-related information is
  concentrated in a sparse subset of neurons. Using simple probing, we
  identify two types of neurons: value neurons, whose activations predict
  state value, and dopamine neurons, whose activations encode step-level
  temporal difference (TD) errors. Tog"
