summary: >-
  While Omni-modal Large Language Models (OLLMs) have demonstrated
  impressive capabilities in jointly processing audio and visual streams,
  their ability to strictly adhere to complex, multi-faceted user
  instructions remains largely unexplored. Existing benchmarks primarily
  focus on holistic video understanding or text-only instruction following,
  failing to capture the intricate interplay between modalities and user
  constraints. To bridge this gap, we introduce OmniCap-IF, the first
  comprehensive benchmark specifically designed to evaluate
