summary: Although Large Vision-Language Models (VLMs) have significantly
  advanced embodied navigation, their direct deployment remains challenging,
  as existing methods often force VLMs into unnatural action spaces that
  misalign with their 2D pre-training priors, compounded by rigid reasoning
  schedules and inefficient memory management. To overcome these limitations,
  we propose TAMP-Nav, a unified framework for efficient embodied navigation.
  First, we introduce a Pixel-to-3D Action Formulation (Point) that
  reformulates navigation into 2D visual prompting. Specifically, the VLM
  merely selects 2D pixels,
