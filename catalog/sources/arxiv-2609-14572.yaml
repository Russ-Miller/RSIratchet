  algorithm analysis and complexity theory is challenging because students
  must handle formal proofs and asymptotic reasoning that conventional
  resources rarely explain in an adaptive, on-demand way. We present
  AlgoRAG, a specialized Retrieval-Augmented Generation (RAG) system that
  couples a large language model (LLM) with a curated, domain-specific
  knowledge base to address these challenges. The knowledge base integrates
