summary: >-
  As Large Language Models (LLMs) are increasingly integrated into automated
  decision-making pipelines, specifically within Human Resources (HR), the
  security implications of Indirect Prompt Injection (IPI) become critical.
  While a prevailing hypothesis posits that "Reasoning" or
  "Chain-of-Thought" Models possess safety advantages due to their ability
  to self-correct, emerging research suggests these capabilities may enable
  more sophisticated alignment failures. This qualitative Red-Teaming case
  study challenges the safety-through-reasoning premise using the Qwen 3 30B
  architecture. By subjectin
