brief: >-
  Models that correctly identify an intermediate bridge fact still fail at the
  second hop: on Indian cultural 2-hop questions, state identification runs
  far ahead of final answer accuracy, and chain-of-thought fine-tuning closes
  the bridge gap without fixing target resolution.


  VIRAASAT is a semi-automated benchmark built from a knowledge graph of over
  700 expert-curated artifacts across 13 attributes and all 28 states and 8
  Union Territories, yielding 3218 questions on an anchor to state to target
  path. 11 models were benchmarked zero-shot, 4 with SFT on CoT traces, 3 with
  SFT on Symbolic Chain-of-Manipulation traces, where a verifier agent
  corrects each graph traversal step.


  Zero-shot, gemini-2.0-flash reaches 81.71% State Match but 31.32% Full
  Match; Qwen2.5-7B-Instruct hits 43.88% State Match with 3.72% Answer Match.
  CoT-SFT lifts Qwen2.5-7B to 89.11% / 36.70%; SCoM brings it to 91.45% State
  Match and 57.54% Full Match, +20.84 points.


  Two ablations on 1k train / 100 test isolate the cause: dropping the critic
  costs 16 points of Full Match (52% to 36%), dropping the explicit
  manipulations collapses it to 9%. OOD transfer to a 10% SANSKRITI subset
  (2,183 samples) only matches vanilla baselines.


  All questions use a single fixed 2-hop state-bridge template, English only,
  no 3-hop chains, no RAG or RL comparison.


  If you train reasoning traces, verified tool-call supervision beats
  free-form CoT where retrieval, not memorization, is the bottleneck.
