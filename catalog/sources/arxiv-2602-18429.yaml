summary: Large Language Models (LLMs) have made significant progress in
  reasoning tasks across various domains such as mathematics and coding.
  However, their performance deteriorates in tasks requiring rich
  socio-cultural knowledge and diverse local contexts, particularly those
  involving Indian Culture. Existing Cultural benchmarks are (i) Manually
  crafted, (ii) contain single-hop questions testing factual recall, and (iii)
  prohibitively costly to scale, leaving this deficiency largely unmeasured.
