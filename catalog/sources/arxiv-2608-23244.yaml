summary: >-
  Large language models (LLMs) often produce fluent but incorrect answers
  with unwarranted confidence. A central limitation is that standard LLMs
  represent uncertainty through a single predictive distribution, conflating
  epistemic ignorance with genuine ambiguity. We introduce Credal Large
  Language Models (CLLMs): an ensemble of LoRA adapters induces a credal set
  whose lower and upper probabilities expose the spread of plausible
  predictive distributions rather than collapsing to a single softmax
  output. From this representation we derive two complementary commitment
  scores. Credal Token Commitme
