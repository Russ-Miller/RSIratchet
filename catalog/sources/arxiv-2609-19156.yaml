summary: >-
  Data-driven fine-tuning is widely adopted to enhance reasoning in Large
  Language Models (LLMs) due to its simplicity and efficiency. However,
  mainstream imitation learning methods that rely exclusively on perfect
  reasoning trajectories suffer from a Scaling Collapse: when the problem
  set is limited, increasing positive examples fails to yield continuous
  improvement. However, during inference, an LLM can not guarantee that
  every intermediate step is correct and is therefore prone to errors. Once
  such errors arise, the LLM often struggles to recover and may be further
