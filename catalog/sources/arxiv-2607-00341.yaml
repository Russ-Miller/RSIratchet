summary: >-
  Large language models achieve strong performance on many reasoning tasks
  when allowed to externalize intermediate steps as Chain-of-Thought (CoT).
  However, many questions require the model to internalize the multi-step
  reasoning within a single forward pass before generating the answer. We
  study this challenge through two-hop reasoning, a representative task
