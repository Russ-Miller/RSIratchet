brief: >-
  Planning edit targets for a fact and its neighbors jointly, rather than
  optimizing propagation and preservation separately, improves both at once in
  locate-then-edit knowledge editing. The paper's diagnostic is that existing
  editors fail at both: across ROME, MEMIT, PMET, AlphaEdit and GLAME on
  RippleEdits with GPT-J, average positive ripple rate is 62.53% while average
  harmful perturbation rate is 64.74%.


  JNO builds editable/preserved neighborhoods, optimizes target
  representations under a pairwise coordination penalty plus an
  exposure-weighted residual penalty, then rejects high-risk plans with a
  semantic gate before writing weights. Tested on RippleEdits (839 edits),
  CounterFact and ZsRE (2,000 each) with Qwen2.5-1.5B-Instruct, GPT-J (6B) and
  LLaMA3 (8B), against 9 baselines.


  On LLaMA3/RippleEdits, RE improves 18.1% and SA 7.0% over the best baseline;
  on GPT-J, RS 16.7% and FF 30.9%. Reliability drops about 3.0% relative,
  staying above 95.9%. Gains on CounterFact and ZsRE are smaller: Specificity
  2.6% and 8.6%, Consistency 8.2%.


  Evidence is reasonably isolated. Ablations separate the two penalties
  (removing the residual term costs 16.3/19.2 points of RS/FF; removing the
  pairwise term costs 10.9/10.8/10.6 of LG/RE/SA), and a coverage-matched
  comparison at 96.3% coverage shows the gate is not the source of gains. The
  structural-probe analysis is explicitly correlational, no randomized
  intervention. Neighborhoods are rule-mined with a 2.9% conflict rate and
  89.7% valid rate, so results depend on that construction; multilingual,
  long-context and multi-hop settings are untested.


  If you edit facts in production, expect to trade a few points of edit
  reliability for better neighborhood behaviour.
