summary: "Single-edit updates in large language models can trigger ripple
  effects across local knowledge neighborhoods: desirable propagation to
  related facts and unintended perturbation of preserved ones. Existing
  methods address these two effects separately, without explicitly modeling
  their coupling. We challenge this separation through an analysis of ripple
  responses across typical baselines, identifying two coupled design
  pressures: editable-side coordination and preserved-side leakage. We propose
  Joint Neighborhood Optimization (JNO), a new knowledge-editing framework to
  formalize and jointly addr"
ingested_at: 2026-09-19
brief: >-
  Planning edit targets for a whole knowledge neighborhood at once, instead of
  separately promoting propagation and suppressing perturbation, improves both
  at the same time. Current locate-then-edit methods fail at both: on
  RippleEdits with GPT-J (6B), average Positive Ripple Rate across ROME,
  MEMIT, PMET, AlphaEdit and GLAME is 62.53% while average Negative Ripple
  Rate reaches 64.74%.


  Joint Neighborhood Optimization (JNO) builds an editable/preserved
  neighborhood per request, jointly optimizes target representations with
  pairwise coordination weights and exposure-weighted residual penalties, then
  rejects plans failing a semantic-loss gate. Tested on Qwen2.5-1.5B-Instruct,
  GPT-J (6B) and LLaMA3 (8B) over 839 RippleEdits-POPULAR requests plus 2,000
  edits each from CounterFact and ZsRE.


  On LLaMA3, RE improves 18.1% and SA 7.0% over the strongest baseline; on
  GPT-J, RS and FF improve 16.7% and 30.9%. Reliability drops about 3.0%
  relative, staying at or above 95.9%. Gains on CounterFact and ZsRE are
  smaller, 2.2–8.6% on specificity and consistency.


  Attribution is reasonably isolated: ablations show removing the residual
  penalty costs 16.3/19.2 points of RS/FF while removing the pairwise term
  costs 10.9/10.8/10.6 on LG/RE/SA, and a coverage-matched comparison gates
  AlphaEdit and SAKE at JNO's 96.3% coverage, so gains are not from rejection
  alone. The structural probes behind the design are correlational, not
  interventional.


  Neighborhoods come from rule-guided mining audited at 89.7% valid, so
  coverage may degrade on other relation types; multilingual and long-context
  editing untested. If you edit facts in batches with known related and
  unrelated neighbors, joint target planning is worth the reliability cost.
