brief: >-
  Planning edit targets for a whole knowledge neighborhood at once, instead of
  separately optimizing propagation and preservation, improves both at the
  same time. Existing locate-then-edit methods leak badly in either direction:
  across ROME, MEMIT, PMET, AlphaEdit and GLAME on RippleEdits with GPT-J
  (6B), average Positive Ripple Rate is 62.53% while average Negative Ripple
  Rate reaches 64.74%.


  JNO builds editable and preserved neighborhoods per edit, jointly optimizes
  target representations with a pairwise coordination term and an
  exposure-weighted residual term, then abstains on plans failing a
  semantic-loss check before writing weights. Tested on RippleEdits (839
  requests), CounterFact and ZsRE (2,000 each) with Qwen2.5-1.5B-Instruct,
  GPT-J (6B) and LLaMA3 (8B), against 9 baselines including SAKE and SUIT.


  On LLaMA3 RippleEdits, RE +18.1% and SA +7.0% over the best baseline; on
  GPT-J, RS +16.7% and FF +30.9%. Reliability drops about 3.0% relative,
  staying above 95.9%.


  The attribution is reasonably tight: ablations show removing the residual
  penalty costs 16.3/19.2 points of RS/FF while removing the pairwise term
  costs 10.9/10.8/10.6 on LG/RE/SA, and a coverage-matched comparison gives
  baselines the same gate at 96.3% coverage, where JNO still leads.
  Neighborhoods were audited on 200 requests per dataset (2.9% conflict rate,
  89.7% valid).


  Gains on CounterFact and ZsRE are small (0.4%–8.6%), neighborhoods come from
  rule-guided mining, and multilingual, long-context and multi-hop propagation
  are untested.


  If you edit facts in sequence, treat propagation and locality as one coupled
  planning problem rather than two objectives.
