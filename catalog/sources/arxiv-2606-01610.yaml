brief: >-
  Planning edit targets for a whole local neighborhood at once, instead of
  handling desirable propagation and unwanted perturbation separately,
  improves both at the cost of a small drop in edit reliability. Joint
  Neighborhood Optimization (JNO) jointly optimizes target representations
  with a pairwise coordination penalty over editable neighbors and an
  exposure-weighted residual penalty over preserved facts, plus a semantic
  gate that abstains from high-risk plans before writing weights.


  Tested on RippleEdits-POPULAR (839 requested edits, sequential editing,
  batch 10), CounterFact and ZsRE (2,000 requests each), across
  Qwen2.5-1.5B-Instruct, GPT-J (6B) and LLaMA3 (8B), against 9 baselines
  including ROME, MEMIT, AlphaEdit, GLAME, SAKE, SUIT.


  On LLaMA3, RE rises 18.1% over SAKE and SA 7.0% over SUIT; on GPT-J, RS and
  FF rise 16.7% and 30.9%. Reliability falls up to 3.1% relative, staying
  above 95.9%. Efficacy on CounterFact/ZsRE drops at most 1.5%.


  The design isolates causes reasonably well: ablations show the residual
  penalty carries preservation (removing it costs 16.3/19.2 RS/FF points) and
  the pairwise term carries propagation (10.9/10.8/10.6 LG/RE/SA points), and
  a coverage-matched comparison at 96.3% gates AlphaEdit and SAKE too, so
  gains are not from selective rejection. Baselines all run on the same
  constructed neighborhoods, 3 seeds.


  The structural diagnostics behind the two "pressures" are correlational, not
  interventional; neighborhoods come from rule-guided mining with a 2.9%
  conflict rate and 89.7% valid rate; multilingual, long-context and multi-hop
  propagation are untested.


  If you edit facts in place, expect to trade a few points of edit success for
  materially better neighborhood behavior.
