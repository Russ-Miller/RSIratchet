brief: >-
  Planning the target representations for an edit and its whole local
  neighborhood jointly, rather than treating propagation and preservation as
  separate problems, improves both at once. The paper first shows that
  existing locate-then-edit methods are unreliable on both sides: across 5
  baselines on RippleEdits with GPT-J (6B), average Positive Ripple Rate is
  62.53% while average Negative Ripple Rate reaches 64.74%.


  JNO builds editable/preserved neighborhoods, optimizes target vectors under
  a pairwise coordination penalty plus an exposure-weighted residual penalty,
  and abstains from edits whose optimized targets fail a semantic-loss check.
  Evaluation covers Qwen2.5-1.5B-Instruct, GPT-J (6B) and LLaMA3 (8B) on
  RippleEdits (839 sequential edits), CounterFact and ZsRE (2,000 each),
  against 9 baselines including AlphaEdit, GLAME, SAKE and SUIT.


  On LLaMA3, RE rises 18.1% and SA 7.0% over the best baseline; on GPT-J, RS
  and FF rise 16.7% and 30.9%. Reliability falls about 3.0% relative, and
  CounterFact/ZsRE gains are small (Specificity +2.6%, +8.6%).


  The causal story is argued, not tested: structural probes were measured on
  natural neighborhoods without randomized intervention, and the authors call
  them correlational. But the components are isolated by ablation (dropping
  the residual term costs 16.3/19.2 points of RS/FF; dropping the pairwise
  term costs 10.9/10.8/10.6 on LG/RE/SA) and by a coverage-matched comparison
  at 96.3%, where gated AlphaEdit and SAKE still lose, so the gain is not from
  rejecting hard edits.


  Neighborhoods are rule-mined with a 2.9% conflict rate and 89.7% valid rate;
  multilingual, long-context and multi-hop settings are untested, and all
  results use 1 parameter-update backend in the main table.


  If you edit model weights, treat propagation and locality as 1 coupled
  planning problem, and expect to pay a few points of edit reliability.
