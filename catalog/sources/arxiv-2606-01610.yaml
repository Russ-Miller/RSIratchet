brief: >-
  Planning edit targets for a whole knowledge neighborhood at once, instead of
  separately promoting propagation and suppressing perturbation, improves both
  at the same time. The paper first measures that current locate-then-edit
  methods fail at both: on RippleEdits with GPT-J (6B), average Positive
  Ripple Rate across ROME, MEMIT, PMET, AlphaEdit and GLAME is 62.53% while
  average Negative Ripple Rate is 64.74%.


  JNO builds editable/preserved neighborhoods, jointly optimizes target
  representations with a pairwise coordination term and an exposure-weighted
  residual term, then rejects high-risk plans with a semantic loss gate before
  any weight update. Tested on RippleEdits (839 requests), CounterFact and
  ZsRE (2,000 requests each) with Qwen2.5-1.5B-Instruct, GPT-J (6B) and LLaMA3
  (8B), against 9 baselines including AlphaEdit, GLAME, SAKE and SUIT.


  On LLaMA3 RippleEdits, RE +18.1% and SA +7.0% over the best baseline; on
  GPT-J, RS +16.7% and FF +30.9%. Reliability drops about 3.0% relative,
  staying above 95.9%.


  Evidence is reasonably isolated: ablations show removing the residual
  penalty costs 16.3/19.2 points of RS/FF while removing the pairwise term
  costs 10.9/10.8/10.6 on LG/RE/SA, and a coverage-matched comparison at 96.3%
  coverage with gated AlphaEdit and SAKE shows the gains are not from
  abstention. The structural analysis is explicitly correlational, no
  randomized intervention. Neighborhoods are rule-mined with a 2.9% audited
  conflict rate and 89.7% valid rate, so coverage limits apply; multilingual
  and long-context editing untested.


  If you edit facts in place, treat propagation and locality as one coupled
  planning problem, not two.
