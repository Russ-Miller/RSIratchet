summary: >-
  Deep research agents are Large Language Model (LLM)-based systems designed
  for autonomous, multi-step scientific reasoning, and they hold immense
  potential for accelerating research in the physical sciences. However,
  comprehensive and in-depth evaluations of their capabilities within this
  domain remain lacking. To address this gap, we introduce PhySciBench, a
  benchmark highly relevant to physical science research, comprising 200
  expert-curated questions, balanced between physics and chemistry, across
  six task categories that reflect real-world scientific workflows.
