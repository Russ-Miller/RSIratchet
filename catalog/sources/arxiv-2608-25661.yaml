summary: >-
  Automated root cause analysis (RCA) with large language models (LLMs) has
  drawn growing attention. Today, SREs typically automate RCA with LLMs in
  one of two ways: directly using a general-purpose agent (e.g., Codex or
  Claude Code) for diagnosis, or building a specialized RCA agent from
  scratch. As mainstream general agents grow more capable and iterate
  quickly, our quantitative study finds that the former now often surpasses
  the latter. Its accuracy, however, still falls short of production needs,
