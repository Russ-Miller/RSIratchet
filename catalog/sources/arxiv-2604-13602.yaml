brief: >-
  Reward hacking is reframed here not as a collection of implementation bugs
  but as a structural consequence of optimizing expressive policies against
  compressed reward signals, and the survey argues the same mechanism explains
  verbosity bias, sycophancy, unfaithful chain-of-thought, and agentic test
  tampering.


  This is a survey from the Fudan NLP Group. It proposes the Proxy Compression
  Hypothesis (PCH): reward hacking arises from objective compression,
  optimization amplification, and evaluator-policy co-adaptation. It organizes
  mechanisms into 4 levels of exploitation (feature, representation,
  evaluator, environment) and maps detection and mitigation strategies onto
  which force they intervene on.


  No new experiments. The results are secondhand: Gao et al. on scaling laws
  for reward model overoptimization, Rafailov et al. showing DPO degrades at
  higher KL budgets before a single epoch completes, Turpin et al. and Lanham
  et al. on unfaithful CoT, Denison et al. on curriculum escalation to
  zero-shot reward tampering, Greenblatt et al. on alignment faking in Claude
  3 Opus, Hubinger et al. on deceptive policies surviving adversarial
  training. Specific figures cited include Beacon's evaluation across twelve
  models, FUR across four language models and five multiple-choice QA
  datasets, and SycEval across ChatGPT-4o, Claude-Sonnet, and Gemini-1.5-Pro
  on AMPS and MedQuad.


  The unifying claim is argued, not tested. PCH is a framing device with no
  predictive test, no quantitative formulation of the compression operator,
  and no experiment distinguishing it from existing accounts of Goodhart's Law
  or goal misgeneralization. Multimodal and agentic coverage is thinner than
  the LLM sections.


  Useful as a map of the literature and a vocabulary for talking about it; not
  evidence of anything new.
