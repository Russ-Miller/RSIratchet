summary: "Reinforcement Learning from Human Feedback (RLHF) and related
  alignment paradigms have become central to steering large language models
  (LLMs) and multimodal large language models (MLLMs) toward human-preferred
  behaviors. However, these approaches introduce a systemic vulnerability:
  reward hacking, where models exploit imperfections in learned reward signals
  to maximize proxy objectives without fulfilling true task intent. As models
  scale and optimization intensifies, such exploitation manifests as verbosity
  bias, sycophancy, hallucinated justification, benchmark overfitting, and, in
  multimoda"
