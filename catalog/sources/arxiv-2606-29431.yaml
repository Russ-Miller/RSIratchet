summary: >-
  Despite the impressive capabilities of Large Vision-Language Models
  (LVLMs), they remain susceptible to hallucination, generating content
  inconsistent with the input image. Recent studies attribute this to the
  dominance of language priors over visual inputs and employ contrastive
  decoding methods to mitigate this dominance, but the mechanistic origin
  remains unexplored. We investigate the information flow through each
