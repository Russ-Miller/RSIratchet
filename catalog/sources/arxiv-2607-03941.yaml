summary: >-
  Recent advances in embodied AI have established robot foundation models
  (RFMs) as the dominant approach for generalist robotic systems to date. By
  leveraging imitation learning on extensive robot demonstrations, RFMs have
  achieved impressive capabilities in mapping visual observations and
  language instructions to continuous robotic actions. However, current RFMs
  lack an inherent ability to reason about physical dynamics and the causal
  effects of robot behaviors on the 3D physical world. This creates a
  fundamental mismatch between 2D-centric visual perception and 3D-centric
  embodied interaction
