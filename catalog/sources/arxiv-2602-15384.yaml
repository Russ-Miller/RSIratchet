brief: >-
  Letting a world model simulate a proposed web action, and then rejecting and
  regenerating it when a judge scores it low, improves task success more than
  simply selecting among simulated candidates. The same correction loop can
  substitute for sampling many candidate actions.


  WAC adds 2 pieces on top of a WebDreamer-style agent: on-demand consultation
  of a world model as an environment expert during action proposal, and a
  closed-loop refinement step where low-confidence simulated outcomes are fed
  back as corrective rationales. It is tuning-free, evaluated on 233
  human-verified VisualWebArena tasks and 300 Online-Mind2Web tasks, with
  ReAct and WebDreamer reimplemented on the same Qwen3-VL-Plus backbone at
  temperature 1.


  WAC reaches 24.5% on VisualWebArena versus 22.7% for both baselines, and
  16.0% on Online-Mind2Web versus 14.7% for WebDreamer. On the 56-task
  Classifieds subset, refinement adds 1.8 points and collaborative generation
  another 1.8, for 3.6% absolute over WebDreamer's 32.1. Restricting to a
  single initial proposal still gives 35.7.


  The ablation is staged and the backbone held fixed, so attribution is
  reasonable, but the gains on the full benchmarks are 1.3–1.8 points on small
  task sets with no variance reported and no matched-compute baseline;
  refinement costs extra simulation calls. Cross-model checks use GLM-4.5v and
  GLM-4.6v on single subsets only.


  Treat the single-proposal result as the interesting one and the headline
  deltas as weakly separated.
