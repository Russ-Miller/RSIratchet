brief: >-
  Forcing a video-to-LLM projector to attend only backwards in time improves
  causal and temporal question answering more than it helps descriptive
  questions, suggesting bidirectional projectors leak future information into
  earlier frame representations.


  V-CORE pairs a frozen CLIP ViT-L/14 with a frozen Vicuna-7B v1.5, adding
  Learnable Spatial Aggregation (K=16 queries per frame, from N=256 patches),
  a 2-layer Causality-Aware Temporal Projector with a block-causal mask, and a
  terminal learnable summary token as a causal sink. Training is 4-bit QLoRA
  (r=64) on Video-ChatGPT-100K for 3 epochs on 1 RTX 4090, roughly 20 hours,
  then zero-shot evaluation on MSVD-QA, MSRVTT-QA, TGIF-QA and NExT-QA with
  GPT-3.5-turbo as judge.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA at 60.7% and near VideoChat2 at
  61.7% with 100K vs 2M training data. MSVD-QA is 67.2 and MSRVTT-QA 57.8,
  against Video-ChatGPT's 64.9 and 49.3; TGIF-QA 57.2 trails Video-LLaVA's
  70.0.


  A staged ablation isolates the cause: mean-pool+linear 53.8, +LSA 55.6,
  +bidirectional transformer 58.0, +causal mask 60.2 (+2.2%), +summary token
  61.2. Sub-task breakdown shows +5.2% causal and +3.5% temporal over the
  bidirectional variant, with descriptive near flat (64.2 to 65.1). Prepending
  the summary query instead drops accuracy to 57.1.


  Evidence is 1 model family, 1 training set, no matched-compute baseline, and
  LLM-judged scoring. Open-ended dialogue and very long videos were not
  tested.


  If you build parameter-efficient video connectors, the attention mask
  direction is worth an ablation of its own.
