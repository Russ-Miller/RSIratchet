brief: >-
  Masking future frames in the video-to-LLM projector, rather than letting
  attention run bidirectionally, is where the temporal-reasoning gain comes
  from. V-CORE adds a block-causal temporal projector (CATP) plus a terminal
  learnable summary token acting as a causal sink, with Learnable Spatial
  Aggregation picking K=16 salient tokens per frame.


  The setup is a frozen CLIP ViT-L/14 encoder and frozen Vicuna-7B v1.5, 4-bit
  QLoRA (r=64) on query/value projections only, T=16 frames, trained on
  Video-ChatGPT-100K for 3 epochs on 1 RTX 4090 in roughly 20 hours, evaluated
  zero-shot with GPT-3.5-turbo as judge on MSVD-QA, MSRVTT-QA, TGIF-QA and
  NExT-QA.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA (60.7) and near VideoChat2
  (61.7) which used 2M training samples. Elsewhere: MSVD-QA 67.2, MSRVTT-QA
  57.8, TGIF-QA 57.2, all above Video-ChatGPT at matched 100K data but below
  Video-LLaVA on TGIF-QA (70.0).


  The causal mechanism is isolated by ablation: swapping bidirectional for
  causal attention gives +2.2%, the summary token adds the rest; against the
  bidirectional variant the gains sit in causal (+5.2%) and temporal (+3.5%)
  subsets while descriptive accuracy barely moves (64.2 to 65.1). Prepending
  the summary query instead drops accuracy to 57.1.


  One LLM backbone, one data scale, VideoQA only; open-ended dialogue
  untested, and the judge is GPT-3.5-turbo. If you build parameter-efficient
  video connectors, directional masking is a cheap thing to try.
