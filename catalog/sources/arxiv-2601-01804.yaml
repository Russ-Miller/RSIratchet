brief: >-
  Forcing a video-to-LLM projector to attend only backwards in time, instead
  of bidirectionally, mostly helps on the question types that depend on event
  order and causation, and barely moves descriptive questions.


  V-CORE pairs a frozen CLIP ViT-L/14 encoder with a frozen Vicuna-7B. Each of
  T = 16 frames is compressed to K = 16 salient tokens by a learned
  cross-attention module, then passed through a 2-layer projector with a
  block-causal mask that permits intra-frame attention but blocks
  future-to-past flow, plus a terminal learnable summary token. Training is
  4-bit QLoRA on Video-ChatGPT-100K, 3 epochs, 1 RTX 4090, roughly 20 hours,
  evaluated zero-shot on MSVD-QA, MSRVTT-QA, TGIF-QA and NExT-QA with
  GPT-3.5-turbo as judge.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA at 60.7% and near VideoChat2 at
  61.7% with 100K vs 2M training data. Ablations run MeanPool+Linear 53.8,
  LSA+Linear 55.6, bidirectional transformer 58.0, causal mask 60.2, plus
  summary token 61.2. The sub-task split gives +5.2% causal and +3.5% temporal
  over the bidirectional variant, with descriptive accuracy 64.2 to 65.1.


  The causal-mask effect is isolated by a matched ablation, and summary-token
  position is varied separately. Only 1 backbone, 1 training set, no seed
  variance, and the judge is an LLM. Treat directional masking in the
  connector as a cheap lever for ordering-sensitive VQA, untested for dialogue
  or very long video.
