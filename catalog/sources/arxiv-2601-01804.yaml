brief: >-
  Forcing the video-to-LLM projector to attend only backwards in time improves
  causal and temporal question answering, and the gain is separable from the
  gain of better spatial token selection.


  V-CORE pairs a frozen CLIP ViT-L/14 encoder with a frozen Vicuna-7B v1.5,
  inserting 2 modules: Learnable Spatial Aggregation (K = 16 queries per
  frame, T = 16 frames) and a Causality-Aware Temporal Projector using a
  block-causal mask plus a terminal learnable summary token. Training is 4-bit
  QLoRA (r = 64) on Video-ChatGPT-100K for 3 epochs on 1 RTX 4090, roughly 20
  hours, then zero-shot evaluation on MSVD-QA, MSRVTT-QA, TGIF-QA and NExT-QA
  with GPT-3.5-turbo as judge.


  NExT-QA accuracy is 61.2%, against 60.7% for VISTA-LLaMA and 61.7% for
  VideoChat2 trained on 2M samples. Within the ablation, swapping
  bidirectional attention for the causal mask adds +2.2%, and the summary
  token adds the remaining step to 61.2%. The sub-task split shows +5.2%
  causal and +3.5% temporal over the bidirectional variant, with descriptive
  accuracy nearly flat (64.2 to 65.1).


  The causal attribution is measured, with a 5-row progressive ablation and a
  separate summary-token placement study where prepending drops accuracy to
  57.1%. Limits: 1 LLM backbone, 1 training corpus, no matched-compute
  comparison against larger-data models, and TGIF-QA (57.2) stays well below
  Video-LLaVA (70.0).


  If you build parameter-efficient video connectors, directionality in the
  projector is worth an ablation of its own.
