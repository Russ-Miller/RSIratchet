brief: >-
  Forcing the video-to-LLM projector to attend only backwards in time, instead
  of bidirectionally, moves the needle on causal and temporal question types
  while leaving descriptive ones roughly flat. V-CORE pairs a Learnable
  Spatial Aggregation module (K=16 queries per frame, replacing mean pooling
  over 256 patches) with a block-causal temporal projector plus a terminal
  learnable summary token acting as a causal sink, on frozen CLIP ViT-L/14 and
  Vicuna-7B v1.5 with 4-bit QLoRA, trained on Video-ChatGPT-100K for 3 epochs
  on 1 RTX 4090 in about 20 hours.


  Zero-shot, it reaches 61.2% on NExT-QA against 60.7% for VISTA-LLaMA and
  61.7% for VideoChat2 (which uses 2M training samples), plus 67.2 MSVD-QA,
  57.8 MSRVTT-QA, 57.2 TGIF-QA. The causal mask alone adds +2.2% over a
  bidirectional transformer projector; the summary token adds another 1.0%. On
  NExT-QA subsets, the full model gains +5.2% causal and +3.5% temporal over
  the bidirectional variant, with descriptive moving 64.2 to 65.1.


  The attribution is reasonably clean: a 5-step progressive ablation holds
  backbone, data and token budget fixed, and a separate ablation shows a
  prepended summary query drops to 57.1%. Comparisons to other systems differ
  in training data scale, and scoring uses GPT-3.5-turbo as judge on 1 model
  family only. No open-ended dialogue evaluation.


  If you build parameter-efficient video connectors, the directional mask is a
  cheap thing to try.
