brief: >-
  Forcing the video-to-LLM projector to attend only backwards in time improves
  causal and temporal question answering, and the gain is separable from the
  gain from better spatial token selection. V-CORE replaces the usual
  unconstrained bidirectional temporal projector with block-causal attention
  plus a learnable summary token placed at the end of the sequence as a causal
  sink.


  The setup is a frozen CLIP ViT-L/14 encoder and a frozen Vicuna-7B v1.5 with
  4-bit QLoRA, T = 16 frames, K = 16 spatial queries, trained on
  Video-ChatGPT-100K for 3 epochs on 1 RTX 4090 in roughly 20 hours, evaluated
  zero-shot on MSVD-QA, MSRVTT-QA, TGIF-QA and NExT-QA with GPT-3.5-turbo as
  judge.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA at 60.7% and near VideoChat2 at
  61.7%, which used 2M rather than 100K training examples. MSVD-QA is 67.2 and
  MSRVTT-QA 57.8 against Video-ChatGPT at 64.9 and 49.3.


  The component ablation is the stronger evidence: swapping bidirectional for
  causal masking adds +2.2% on NExT-QA, the terminal summary adds the rest to
  61.2, and prepending the same summary query drops accuracy to 57.1. Sub-task
  breakdown gives +5.2% causal and +3.5% temporal over the bidirectional
  variant, with descriptive questions flat.


  Only 1 backbone, 1 training corpus, and an LLM-judge metric; no open-ended
  dialogue, and TGIF-QA at 57.2 trails Video-LLaVA at 70.0.


  If you build parameter-efficient video connectors, the mask direction is
  worth an ablation.
