brief: >-
  Forcing the video-to-LLM projector to attend only backwards in time, rather
  than bidirectionally, improves causal and temporal video QA at fixed
  parameter cost. V-CORE adds a block-causal mask over frame blocks
  (intra-frame attention preserved, future-to-past blocked) plus a learnable
  summary token appended at the end of the sequence as a causal sink, and a
  cross-attention module that selects K salient spatial tokens per frame.


  The setup is a frozen CLIP ViT-L/14 encoder and frozen Vicuna-7B v1.5, 4-bit
  QLoRA on query and value projections, T = 16 frames, K = 16, L = 2 projector
  layers, trained on Video-ChatGPT-100K for 3 epochs on 1 RTX 4090 in ~20
  hours, then evaluated zero-shot with GPT-3.5-turbo as judge.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA (60.7%) and Video-ChatGPT
  (54.6%), near VideoChat2 (61.7%) trained on 2M samples. MSVD-QA 67.2,
  MSRVTT-QA 57.8, TGIF-QA 57.2.


  The causal mask is isolated by ablation: swapping bidirectional for causal
  attention gives +2.2%, the summary token a further +1.0 to 61.2.
  Sub-category breakdown shows gains concentrated in causal (+5.2%) and
  temporal (+3.5%) over the bidirectional variant, with descriptive roughly
  flat. Prepending the summary query instead drops to 57.1.


  Evidence is 1 model family, 1 training corpus, no matched-compute comparison
  against the larger-data baselines, and an LLM judge. Open-ended dialogue and
  very long videos are untested.


  If you build parameter-efficient video connectors, the directionality of the
  projector mask is worth an ablation of your own.
