brief: >-
  Masking future frames out of a video-LLM's projector, rather than letting it
  attend bidirectionally, is where most of the causal-reasoning gain comes
  from. V-CORE replaces the usual connector between a frozen CLIP ViT-L/14 and
  a frozen Vicuna-7B v1.5 with two parts: Learnable Spatial Aggregation (K=16
  query tokens per frame instead of mean pooling) and a Causality-Aware
  Temporal Projector using a block-causal mask plus a terminal learnable
  summary token as a causal sink. Training is 4-bit QLoRA (r=64) on
  Video-ChatGPT-100K, 3 epochs, 1 RTX 4090, roughly 20 hours, then zero-shot
  evaluation with GPT-3.5-turbo as judge.


  NExT-QA accuracy reaches 61.2%, above VISTA-LLaMA (60.7%) and near
  VideoChat2 (61.7%) trained on 2M samples. MSVD-QA 67.2, MSRVTT-QA 57.8,
  TGIF-QA 57.2, all above Video-ChatGPT at matched 100K data.


  The attribution is measured, not just argued: a 5-step ablation isolates the
  causal mask at +2.2% over a bidirectional transformer projector, the summary
  token adds the rest, and the sub-task breakdown shows gains concentrated in
  temporal (+3.5%) and causal (+5.2%) questions while descriptive accuracy
  barely moves (64.2 to 65.1). A summary-token placement ablation shows
  prepending collapses to 57.1.


  One backbone, one LLM family, one training corpus, VideoQA only; no
  open-ended dialogue, no larger models, no independent replication. If you
  build parameter-efficient video connectors, the directional mask is worth
  copying.
