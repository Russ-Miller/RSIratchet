brief: >-
  Forcing the video-to-LLM projector to be unidirectional in time, rather than
  letting frames attend bidirectionally, gains most of its accuracy on exactly
  the question types that depend on event order and causation.


  V-CORE pairs a frozen CLIP ViT-L/14 encoder with a frozen Vicuna-7B.
  Learnable Spatial Aggregation keeps K = 16 salient tokens per frame out of N
  = 256 patches; the Causality-Aware Temporal Projector applies a block-causal
  mask across T = 16 frames with a terminal learnable summary token as a
  causal sink. Only 4-bit QLoRA adapters (r = 64) train, on
  Video-ChatGPT-100K, 3 epochs, 1 RTX 4090, roughly 20 hours.


  Zero-shot NExT-QA accuracy is 61.2%, above VISTA-LLaMA (60.7%) and near
  VideoChat2 (61.7%, 2M training data). Ablations: swapping bidirectional for
  causal attention adds +2.2%; the terminal summary adds the rest. Against the
  bidirectional variant, causal subset accuracy rises +5.2% and temporal
  +3.5%, while descriptive barely moves (64.2 to 65.1).


  The attribution is reasonably isolated: a 5-step component ladder on a fixed
  backbone and data scale, plus a summary-token placement ablation where
  prepending drops to 57.1%. Comparisons to other systems are not matched on
  data or training.


  TGIF-QA (57.2) stays well below Video-LLaVA (70.0), and only VideoQA was
  tested, not dialogue. Scoring uses GPT-3.5-turbo as judge.


  If you build parameter-efficient video connectors, the mask direction is a
  cheap lever worth trying.
