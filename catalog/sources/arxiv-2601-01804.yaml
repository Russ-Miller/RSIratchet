brief: >-
  Forcing unidirectional attention in the video-to-LLM projector, instead of
  unconstrained bidirectional attention, improves causal and temporal video QA
  without adding model capacity.


  V-CORE pairs a frozen CLIP ViT-L/14 encoder and frozen Vicuna-7B v1.5 with 2
  trained modules: Learnable Spatial Aggregation (K = 16 query tokens per
  frame, T = 16 frames) and a Causality-Aware Temporal Projector using a
  block-causal mask plus a terminal learnable summary token as a causal sink.
  Training is 4-bit QLoRA on Video-ChatGPT-100K for 3 epochs on 1 RTX 4090,
  about 20 hours, evaluated zero-shot on MSVD-QA, MSRVTT-QA, TGIF-QA and
  NExT-QA with GPT-3.5-turbo as judge.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA at 60.7% and near VideoChat2 at
  61.7% which uses 2M training samples versus 100K. MSVD-QA is 67.2% and
  MSRVTT-QA 57.8%, both above Video-ChatGPT at the same data scale.


  The causal mask is isolated by ablation: swapping bidirectional for causal
  attention adds +2.2%, and the full model gains +5.2% causal and +3.5%
  temporal over the bidirectional variant while descriptive accuracy barely
  moves. Summary-token position is also ablated; prepending drops accuracy to
  57.1%. Evidence is 1 backbone, 1 training set, and LLM-judged scoring with
  no human check.


  TGIF-QA at 57.2% trails Video-LLaVA at 70.0%, frame sampling is uniform, and
  only VideoQA was tested, not dialogue.


  If you build parameter-efficient video connectors, the mask direction is
  worth treating as a design choice rather than a detail.
