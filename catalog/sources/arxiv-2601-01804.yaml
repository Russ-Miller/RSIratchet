  coherence. Many parameter-efficient Video-LLMs rely on unconstrained
  bidirectional projectors to model inter-frame interactions, which can blur
  temporal ordering by allowing later frames to influence earlier
  representations, without explicit architectural mechanisms to respect the
  directional nature of video reasoning. To address this limitation, we
