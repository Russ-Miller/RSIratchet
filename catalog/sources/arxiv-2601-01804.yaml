brief: >-
  Forcing the video-to-LLM projector to attend only backwards in time, rather
  than bidirectionally, improves causal and temporal video QA. V-CORE adds a
  block-causal mask over frame blocks (intra-frame attention preserved,
  future-to-past blocked) plus a terminal learnable summary token acting as a
  causal sink, on top of a learnable spatial aggregation module that keeps
  K=16 queries per frame.


  The stack is a frozen CLIP ViT-L/14 encoder and a frozen Vicuna-7B v1.5 with
  4-bit QLoRA (r=64) on query and value projections, T=16 frames, trained on
  Video-ChatGPT-100K for 3 epochs on 1 RTX 4090 in roughly 20 hours, then
  evaluated zero-shot with GPT-3.5-turbo as judge.


  NExT-QA accuracy reaches 61.2%, above VISTA-LLaMA (60.7%) and near
  VideoChat2 (61.7%) trained on 2M samples. MSVD-QA 67.2, MSRVTT-QA 57.8,
  TGIF-QA 57.2 — above Video-ChatGPT at matched 100K data, below Video-LLaVA
  on TGIF-QA (70.0).


  The causal attribution is measured, not just argued: swapping bidirectional
  for causal attention alone gives +2.2%, and the sub-task breakdown shows
  gains concentrated in causal (+5.2%) and temporal (+3.5%) while descriptive
  accuracy moves 64.2 to 65.1. Summary-token position is also ablated (prepend
  drops to 57.1%).


  One LLM backbone, one training corpus, no video dialogue tasks, no seed
  variance reported, and the judge is an LLM. Worth reading if you build video
  projectors.
