brief: >-
  Blocking later video frames from influencing earlier frame representations
  in the vision-to-LLM projector improves causal and temporal video QA, and
  the gain is concentrated exactly in those question types rather than spread
  across the board.


  V-CORE pairs a frozen CLIP ViT-L/14 encoder with a frozen Vicuna-7B v1.5,
  inserting a Learnable Spatial Aggregation module (K = 16 queries per frame,
  from N = 256 patches) and a Causality-Aware Temporal Projector that applies
  a block-causal mask over T = 16 frames plus a terminal learnable summary
  token. Training used 4-bit QLoRA on Video-ChatGPT-100K for 3 epochs on 1 RTX
  4090, then zero-shot evaluation on MSVD-QA, MSRVTT-QA, TGIF-QA and NExT-QA,
  scored by GPT-3.5-turbo.


  NExT-QA accuracy is 61.2%, above VISTA-LLaMA (60.7%) and near VideoChat2
  (61.7%) trained on 2M samples. The ablation moves 53.8 to 55.6 (LSA), 58.0
  (bidirectional transformer), 60.2 (causal mask, +2.2%), 61.2 (summary
  token). Against the bidirectional variant, causal accuracy rises +5.2% and
  temporal +3.5%, with descriptive roughly flat (64.2 to 65.1).


  The causal-mask effect is isolated by a matched ablation differing only in
  attention mask, plus a summary-token placement study where prepending drops
  to 57.1. But results come from 1 model family, 1 instruction dataset, and an
  LLM judge; TGIF-QA (57.2) remains well below Video-LLaVA (70.0), and
  open-ended dialogue was not tested.


  If you build parameter-efficient video connectors, the mask direction is a
  cheap lever worth trying.
