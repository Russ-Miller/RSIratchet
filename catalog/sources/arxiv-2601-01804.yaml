brief: >-
  Forcing the video-to-LLM projector to attend only backwards in time improves
  causal and temporal question answering, while leaving descriptive questions
  roughly unchanged. The claim is that unconstrained bidirectional projectors
  leak future-frame information into earlier representations.


  V-CORE pairs a frozen CLIP ViT-L/14 encoder and a frozen Vicuna-7B v1.5 with
  two trained modules: Learnable Spatial Aggregation (K = 16 queries per
  frame, T = 16 frames) and a Causality-Aware Temporal Projector using a
  block-causal mask plus a terminal learnable summary token. 4-bit QLoRA,
  trained on Video-ChatGPT-100K for 3 epochs on 1 RTX 4090, evaluated
  zero-shot with GPT-3.5-turbo as judge.


  On NExT-QA it reaches 61.2% versus VISTA-LLaMA 60.7% and VideoChat2 61.7%
  (2M data). Also 67.2% MSVD-QA, 57.8% MSRVTT-QA, 57.2% TGIF-QA.


  The causal mechanism is isolated by ablation: swapping bidirectional for
  causal attention adds +2.2%, the summary token adds the rest to 61.2%, and
  sub-task breakdown shows +5.2% causal and +3.5% temporal over the
  bidirectional variant with descriptive near-flat (64.2 to 65.1). Prepending
  the summary query drops accuracy to 57.1%.


  All ablations are 1 model family, 1 training set, and judged by an LLM
  rather than exact match. No test on video dialogue or very long videos;
  uniform segment sampling may miss fine events.


  If you build parameter-efficient video connectors, the mask direction is
  worth an ablation.
