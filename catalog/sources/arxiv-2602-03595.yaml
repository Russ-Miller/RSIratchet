brief: >-
  A training-free agent pipeline with explicit self-verification beats
  supervised fine-tuned models on referring video object segmentation, using a
  9B open-source MLLM. The gain comes mostly from reflection, not from the
  base model.


  Refer-Agent decomposes RVOS into frame selection, intent analysis, object
  grounding, and mask generation, with Ovis2.5-9B as the reasoning model and
  SAM2 for masks. A Chain-of-Reflection stage runs a Questioner-Responder pair
  to check target existence in the selected keyframe and consistency between
  predicted objects and query attributes, feeding failures back for up to 4
  rounds. Tested on ReVOS, Ref-YouTube-VOS, MeViS, ReasonVOS, GroundMoRe.


  It reaches 69.8 J&F on ReasonVOS, 61.3 overall on ReVOS, 71.3 on
  Ref-YouTube-VOS, 54.7 on MeViS, 33.4 on GroundMoRe, versus 65.5 for CoT-RVS
  with GPT-4o on ReasonVOS. Removing both reflection stages drops ReasonVOS to
  64.5; each stage alone costs more than 3%. Dynamic Focus Layout adds 2.8%
  over a single keyframe and 2.1% over uniform frame integration.


  Ablations isolate reflection, layout, agent merging, and reflection count,
  with per-sample latency reported: 99s at MAX_TURN 0 versus 195s at 4. That
  is the honest cost comparison; prior methods are quoted from their papers,
  not rerun at matched compute.


  Most ablations are on ReasonVOS only. Swapping in Qwen2.5-VL-7B gives 55.5,
  above RGA3's 53.6 but far below the Ovis2.5 result, so model choice still
  dominates absolute numbers.


  If you were assuming RVOS needs SFT, this says a verification loop closes
  the gap at roughly 2x inference time.
