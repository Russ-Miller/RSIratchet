summary: "In domains such as materials science, biomedicine, and finance,
  high-stakes deployment of large language models (LLMs) requires injecting
  private, domain-specific knowledge that is proprietary, fast-evolving, and
  under-represented in public pretraining. However, the two dominant paradigms
  for private knowledge injection each have clear drawbacks: fine-tuning is
  expensive to iterate under continual updates that can induce catastrophic
  forgetting and general-capability regression; retrieval-augmented generation
  (RAG) keeps the base model intact but remains brittle in specialized private
  corpora"
notes: "Filed as a source on knowledge-updating from the classifier's
  judgement that the paper is about it (improves, low): The paper proposes
  GAG, a method for injecting private, fast-evolving domain knowledge into a
  frozen base model that reportedly avoids fine-tuning's forgetting and RAG's
  brittleness, i.e., a technique claimed to improve use of new knowledge. No
  claim has been drafted from it yet."
