summary: >-
  In domains such as materials science, biomedicine, and finance,
  high-stakes deployment of large language models (LLMs) requires injecting
  private, domain-specific knowledge that is proprietary, fast-evolving, and
  under-represented in public pretraining. However, the two dominant
  paradigms for private knowledge injection each have clear drawbacks:
  fine-tuning is expensive to iterate under continual updates that can
  induce catastrophic forgetting and general-capability regression;
  retrieval-augmented generation (RAG) keeps the base model intact but
  remains brittle in specialized private corpora
