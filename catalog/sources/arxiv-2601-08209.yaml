brief: >-
  Domain knowledge can be injected into a frozen LLM as 4 latent vectors
  distilled from a small expert model's hidden states, beating both retrieval
  and parameter-efficient fine-tuning on specialist QA without degrading
  general-domain accuracy.


  GAG adapts Qwen3-1.7B to a private corpus, generates question-conditioned
  background, compresses its multi-layer hidden states into 4 memory slots,
  and projects them into Qwen3-8B's embedding space at reserved anchor
  positions. Evaluation covers catalytic-materials and immunology-adjuvant QA
  plus 6 open-domain benchmarks (FreebaseQA, HotpotQA, NQ, TriviaQA,
  WebQuestions, PopQA).


  On Materials, BertScore rises from 57.50 (base) to 69.11, above LoRA SFT at
  67.08 and GraphRAG at 62.35. On Adjuvant, 64.28 vs 63.26 for LoRA SFT.
  General-domain EM average is 42.35 for GAG vs 42.16 base, while
  Prompt-Tuning drops to 35.64, LoRA SFT 37.72, BLADE 33.96. Prototype routing
  hits 99.72% over 2 routes and 99.61% over 3. On a 128-query subset, GAG adds
  4 tokens and 8.7471 TFLOPs/query vs RAG's 666.1 tokens and 18.7270.


  Evidence is measured with ablations: removing latent memory injection
  learning drops BertScore to 57.88; 1 slot gives 66.86, 8 gives 69.03.
  Judging uses gpt-4o. One base family, 2 private domains, no external
  replication, and RAG baselines are excluded from the general-domain table.


  If you deploy frozen backbones across evolving private corpora, this is a
  concrete alternative to both retrieval and adapters.
