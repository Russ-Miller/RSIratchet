summary: >-
  Understanding large codebases is a long-horizon task for Large Language
  Model (LLM) agents: answering a single question can require building and
  running the software, tracing execution across files, and synthesizing
  evidence over tens of minutes. On SWE-Atlas QnA, a benchmark of
  long-horizon questions over production repositories, a single Claude Code
  agent (Opus 4.6) resolves only 32.3% of tasks. Dividing the work among
  agents with clean contexts mitigates this limitation. However, the
