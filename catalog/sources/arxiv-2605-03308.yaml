brief: >-
  Travel planning failures in current models are not mostly upstream parsing
  errors: even when constraints, tool outputs and candidate information are
  supplied as oracle context, plan generation and self-correction stay weak.
  Giving models more valid candidate POIs than the reference plan uses can
  help rather than hurt, which points at distributional priors in POI choice
  rather than pure combinatorial reasoning.


  Travel planning was decomposed into 5 atomic sub-tasks (constraint
  extraction, tool use, plan generation, error identification, error
  correction), each evaluated with oracle intermediate inputs, on
  TravelPlanner, ChinaTravel and TripCraft, with GPT-5.2, DeepSeek V3.2, Qwen3
  Max, Claude Sonnet 4.5 and Gemini 3 Pro in reasoning and non-reasoning
  modes.


  Constraint extraction is near-saturated on TravelPlanner (Gemini 3 Pro F1
  0.98, EM 0.88) but collapses on ChinaTravel to F1 0.61–0.71 and 0.00 EM for
  every model. Tool use is 1.00 on TravelPlanner and TripCraft, 0.64–0.84 on
  ChinaTravel. Best plan success is 43% (Gemini 3 Pro, TravelPlanner);
  TripCraft tops out at 0.15. Error identification shows high recall with low
  precision, and correction peaks at 0.32, with errors persisting after being
  pointed out.


  The decoupling is the design's strength: oracle contexts isolate each stage.
  Evidence for the POI-prior claim is thinner, resting on 37 queries where
  reconstructing minimal input from model plans lifted Gemini 3 Pro from 0 to
  0.49.


  Scale is limited by cost, ChinaTravel was skipped for generation and
  correction, and judging used GPT-5.2. Treat end-to-end travel-planning
  scores as dominated by generation and repair, not extraction.
