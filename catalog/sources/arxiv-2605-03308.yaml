summary: >-
  Travel planning serves as a critical task for long-horizon reasoning,
  exposing significant deficits in LLMs. However, existing benchmarks and
  evaluations primarily assess final plans in an end-to-end manner, which
  lacks interpretability and makes it difficult to analyze the root causes
