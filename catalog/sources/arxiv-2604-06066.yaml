  in open-ended reasoning tasks due to ``hallucination snowballing,'' a
  phenomenon in which models recursively justify early errors during
  free-text reflection. While structured feedback can mitigate this issue,
  existing approaches often rely on externally trained critics or symbolic
  tools, reducing agent autonomy. This study investigates whether enforcing
  structured reflection purely through Outlines-based constrained decoding
