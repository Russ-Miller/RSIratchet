brief: >-
  Topological structure across sampled reasoning paths predicts which chains
  are correct, and selecting paths by that structure beats selecting by the
  model's own confidence. GHS-TDA merges N sampled chains into a Global
  Hypothesis Graph, embeds nodes with semantic, graph-position and uncertainty
  features, then runs a Vietoris-Rips filtration and persistent homology to
  extract H0 backbones and H1 self-consistent loops.


  Tested on GSM8K, MATH, OlympiadBench, BBH, MMLU-CF, LongBench, HotpotQA and
  MuSiQue with GPT-4o-mini, Qwen-Turbo and DeepSeek-V3, against 9 baselines
  including CoT-SC, ToT, GoT, FoT, AFlow and AoT.


  Average EM is 68.0% on GPT-4o-mini, 67.6% on Qwen-Turbo, 68.3% on
  DeepSeek-V3, versus AoT at 66.9%, 66.8% and 67.3%. Gains are mostly under 1
  point on math, larger on BBH (87.9% vs 85.4% for AoT on Qwen-Turbo). H1
  persistence alone predicts correctness with ROC-AUC 0.74 globally and
  0.70-0.78 per dataset; +1 SD of persistence multiplies odds of correctness
  by about 3.5x. Token use is 26.8% below ToT and 35.7% below AoT.


  Costs are controlled: calls are capped at 19 per problem with decoding fixed
  across baselines, and a weight ablation isolates the semantic term as
  dominant (77.4% without it vs 83.9%). Interpretability scores come from 3
  annotators, and the adversarial-robustness test reports 2 strategies only.


  Average margins over AoT are roughly 1 point, so the stronger claim is
  persistence as a label-free correctness signal rather than the accuracy win.
