brief: >-
  Merging many sampled reasoning paths into 1 graph and selecting a path by
  topological persistence, rather than by local confidence, buys about 1 point
  of accuracy and a large cut in token cost. GHS-TDA builds a Global
  Hypothesis Graph from sampled chains, embeds nodes with semantic,
  graph-structural and uncertainty features, and extracts backbones (H0) and
  self-consistent loops (H1) via Vietoris-Rips persistent homology.


  Tested on GPT-4o-mini, Qwen-Turbo and DeepSeek-V3 across GSM8K, MATH,
  OlympiadBench, BBH, MMLU-CF, LongBench, HotpotQA and MuSiQue against 9
  baselines including CoT-SC, ToT, GoT, FoT, AFlow and AoT.


  Average EM is 68.0%, 67.6% and 68.3% versus AoT at 66.9%, 66.8% and 67.3%.
  The bigger claims are elsewhere: H1 persistence alone predicts correctness
  with ROC-AUC 0.74 (per-dataset 0.703-0.778), Spearman 0.349, and +1 SD
  raises odds of correctness ~3.5x. Under paraphrase perturbation the answer
  change rate is 2.9% versus 7.4% for max-confidence selection. Cost is a
  fixed 19 LLM calls, with 26.8% fewer tokens than ToT and 35.7% fewer than
  AoT.


  The distance-metric ablation isolates components: dropping the semantic term
  costs the most (83.9% to 77.4%), structural 81.2%, uncertainty 83.5%.
  Accuracy gains over AoT are within ~1 point on most cells and no seed-level
  variance is shown; interpretability rests on 3 in-house annotators; the
  method's stated 16-call cap conflicts with the reported 19.


  Treat the persistence-correctness correlation, not the accuracy table, as
  the result worth acting on.
