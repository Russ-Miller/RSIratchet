summary: >-
  Multi-agent LLM systems hallucinate for a reason model quality alone does not explain: context drift,
  the divergence of knowledge states between concurrent agents. The paper defines a Context Divergence
  Score between agent pairs and a Shared State Verification Protocol (SSVP) in which agents periodically
  exchange compressed state summaries and flag high divergence before reasoning jointly. On travel planning
  with three Claude Haiku agents (n=30 per condition, 8 scenarios), naive full-broadcast synchronisation
  raised hallucination rate 34% above no synchronisation (0.658 vs 0.492, p=0.0022, d=1.18) by propagating
  one agent's erroneous state; SSVP avoided that and reduced hallucination modestly (0.463, d=0.30) with
  58% fewer API calls. The contamination effect did not appear in the software-planning domain, where
  every condition converged below 0.2.
