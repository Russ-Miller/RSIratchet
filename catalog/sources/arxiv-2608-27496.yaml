summary: Indirect prompt injection (IPI) plants instructions in the content a
  tool-using LLM agent reads, steering the agent into harmful tool calls. The
  strongest defenses are system-level, leveraging techniques such as
  task-conditional tool screening to prevent execution of malicious tools, and
  information-flow control to avoid tool execution with untrusted parameters.
  However, as agents grow more capable, users delegate more to automation.
