brief: >-
  Rewriting a buggy Java function in a semantics-preserving way drops LLM
  repair success rates, and the drop is largest on exactly the bugs the model
  finds most familiar.


  7 models (Claude-3.7-Sonnet, GPT-4o, GPT-4o-mini, Gemma-2-27B, Llama-3.1 8B,
  Ministral-7B, StarCoder2 7B) were prompted 10 times per bug on original and
  transformed function-level bugs from Defects4J (854 bugs) and GitBug-Java
  (199, minus 44 excluded), using a chain-of-thought SRepair-style prompt and
  test-suite pass as the success criterion. Transformations came from a tool,
  CodeCocoon: identifier renaming with LLM-generated synonyms, for-to-while,
  nested else-if, operand swaps.


  On Defects4J all 7 models dropped, from -4.01% (GPT-4o) to -15.98%
  (Llama-3.1), all p < 0.001; worst cases went 100% to 0%. On GitBug-Java,
  Claude-3.7 and GPT-4o were unchanged (p = 0.819, p = 0.667). For the 4 open
  models, Spearman correlation between NLL and success drop in the lower NLL
  half was r = 0.303 (Gemma-2), 0.218 (Mistral), 0.165 (Llama), 0.401
  (StarCoder2, p = 0.0798).


  The drop is measured and paired per bug; the leakage attribution is
  correlational, NLL is borrowed from prior work and unavailable for closed
  models, and unnaturalness of transformed code remains a possible confound.
  Patch correctness is test-adequacy only, no manual validation. Java and APR
  only.


  If you cite Defects4J numbers, report transformed variants alongside them.
