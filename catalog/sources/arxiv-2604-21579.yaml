summary: "LLM-based automated program repair (APR) techniques have shown
  promising results in reducing debugging costs. However, prior results can be
  affected by data leakage: large language models (LLMs) may memorize bug
  fixes when evaluation benchmarks overlap with their pretraining data,
  leading to inflated performance estimates. In this paper, we investigate
  whether we can better reveal data leakage by combining metamorphic testing
  (MT) with negative log-likelihood (NLL), which has been used in prior work
  as a proxy for memorization. We construct variant benchmarks by applying
  semantics-preserving t"
