brief: >-
  Rewriting a buggy function in a semantically equivalent way makes LLM
  program repair worse, and the drop is largest exactly on the bugs the model
  finds least surprising.


  The pipeline, CodeCocoon, applies 9 natural semantics-preserving Java
  transformations (identifier renaming via GPT-4o-mini synonyms, for-to-while,
  nest else-if, operand swaps, etc.) to function-level bugs in Defects4J (854
  bugs) and GitBug-Java (199 bugs, 44 excluded). 7 models (Claude-3.7-Sonnet,
  GPT-4o, GPT-4o-mini, Llama-3.1 8B, Gemma-2 27B, Mistral-7B v0.3, StarCoder2
  7B) were prompted 10 times per bug under chain-of-thought with
  function-level fault localization; success means a patch compiles and passes
  the test suite.


  On Defects4J all 7 models drop, from -4.01% (GPT-4o) to -15.98% (Llama-3.1),
  all p < 0.001, with worst cases going from 10/10 runs to 0. On GitBug-Java,
  Claude-3.7 (+0.27%, p=0.819) and GPT-4o (+1.76%, p=0.667) are unchanged.
  Spearman correlation between NLL and success drop over the lower half of the
  NLL distribution: Gemma-2 r=0.303 (p=0.0011), Mistral-7B r=0.218, Llama-3.1
  r=0.165, StarCoder2 r=0.401 (p=0.0798).


  The degradation is measured with paired tests and effect sizes; the leakage
  attribution is correlational, and NLL is unavailable for the 3 proprietary
  models, so their drops are unexplained. Patches are only test-adequate, not
  manually verified, and unnaturalness of transformed code remains a partial
  confound. Treat single-benchmark Defects4J repair numbers as partly a
  memorization score.
