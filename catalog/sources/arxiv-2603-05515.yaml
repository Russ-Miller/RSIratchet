  systems like APIs, enabling applications in customer support, data
  analysis, and dynamic content generation. While recent benchmarks have
  advanced tool-use research, they suffer from key limitations, including
  reliance on simulated or restricted APIs, limited reproducibility, and a
  lack of cultural and geographic diversity. To address these gaps, we
