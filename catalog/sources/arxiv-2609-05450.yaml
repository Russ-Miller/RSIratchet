summary: >-
  AI models, including large language models, are increasingly integrated
  into scientific discovery workflows, yet they remain prone to
  hallucination. In experimental sciences, such errors translate directly
  into failed wet-lab validations and wasted resources; in self-improving
  agentic systems, confident errors risk being reinforced rather than
  corrected. Retrosynthesis provides a representative example of this
  failure mode: existing models can generate chemically plausible routes,
  but cannot reliably determine which routes are experimentally feasible. We
  define \textbf{Chemical Hallucination}
