summary: >-
  A reliable action feasibility scorer is a critical bottleneck in embodied
  agent pipelines: before any planning or reasoning occurs, the agent must
  identify which candidate actions are physically executable in the current
  state. Existing approaches use supervised fine-tuning (SFT) to train
  action scorers, but SFT treats each candidate independently and does not
  explicitly teach the model to discriminate between actions that are
  physically correct and those that are subtly wrong. We propose the
