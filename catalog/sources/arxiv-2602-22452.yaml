summary: "A reliable action feasibility scorer is a critical bottleneck in
  embodied agent pipelines: before any planning or reasoning occurs, the agent
  must identify which candidate actions are physically executable in the
  current state. Existing approaches use supervised fine-tuning (SFT) to train
  action scorers, but SFT treats each candidate independently and does not
  explicitly teach the model to discriminate between actions that are
  physically correct and those that are subtly wrong. We propose the
  Contrastive World Model (CWM), which fine-tunes a large language model (LLM)
  as an action scorer using"
notes: "Filed as a source on embodied-control from the classifier's judgement
  that the paper is about it (improves, low): The paper proposes a contrastive
  (InfoNCE with hard negatives) fine-tuning objective that improves an LLM's
  ability to score physically executable actions over SFT, both intrinsically
  and in live filtering during task execution. No claim has been drafted from
  it yet."
