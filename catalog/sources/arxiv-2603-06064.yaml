brief: >-
  Letting an LLM step through a PDDL simulation one action at a time,
  observing each resulting state, buys almost nothing over generating a whole
  plan in one shot and re-sampling. The step feedback tells the agent only
  that an action was applicable, not whether it is closer to the goal.


  PyPDDLEngine exposes 7 PDDL operations (execute action, query state, reset,
  validate plan, etc.) as MCP tool calls. 4 approaches were run on 102 IPC
  Blocksworld instances under a uniform 180-second budget: Fast Downward
  lama-first, Fast Downward seq-sat-lama-2011, direct Claude Haiku 4.5, and
  agentic Claude Haiku 4.5.


  Fast Downward solved 85.3%. Direct reached 63.7%, agentic 66.7%, at 5.7x
  more tokens per solution (44,705 vs 254,796). The agentic run halted early
  claiming unsolvability on 6 instances; direct solved 4 of those. On the 49
  co-solved instances both LLM variants produced plans of nearly identical
  length, and shorter than seq-sat-lama-2011 in most blocks despite having no
  quality-improvement mechanism.


  The success-rate gap is measured under matched wall-clock budgets, but token
  budgets are unmatched, there is 1 run per instance with no variance
  estimate, 1 model tier, and 1 domain. The memorisation reading of the
  plan-length result is argued, not tested by relabelling or varying domain
  familiarity.


  If you are betting on closed-loop agents for planning, the feedback has to
  be externally grounded, not self-assessed.
