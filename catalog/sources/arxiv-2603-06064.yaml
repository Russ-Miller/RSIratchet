brief: >-
  Letting an LLM act step by step inside a live PDDL simulator, observing each
  state transition and resetting when it wants, buys almost nothing over
  one-shot plan generation. The step feedback confirms only that an action was
  applicable; it carries no signal about distance to the goal, so progress
  assessment stays self-generated.


  PyPDDLEngine exposes 7 PDDL operations as MCP tool calls. 4 approaches were
  run on 102 IPC Blocksworld instances under a uniform 180-second budget: Fast
  Downward lama-first and seq-sat-lama-2011, direct prompting of Claude Haiku
  4.5 with retries, and agentic stepping via the engine.


  Fast Downward reached 85.3% success; direct LLM 63.7%, agentic 66.7%, at
  5.7x more tokens per solution (44,705 vs 254,796). The agentic run halted
  early claiming unsolvability on 6 instances, and on 4 of those the direct
  approach found a valid plan. On 49 co-solved instances both LLM variants
  returned plans shorter than seq-sat-lama-2011 in most difficulty blocks, and
  near-identical to each other, which the authors read as training-data recall
  rather than incremental reasoning.


  Measured, with matched time budget and classical baselines, but 1 model
  tier, 1 run per instance, no variance estimate, and the memorisation account
  is argued rather than tested with relabelled domains.


  One domain only; no reasoning models, no goal-distance heuristic in the
  feedback.


  If you are planning an agentic planner, budget for externally grounded
  progress signals, not just interaction.
