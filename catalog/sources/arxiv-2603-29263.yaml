brief: >-
  Audio language models that correctly deny a sound when asked directly will
  still describe that same sound in detail when the question presupposes it.
  Questions phrased as how/why/when about an absent event bypass the grounding
  step entirely.


  AHA-Eval is a 6.5K-pair attack suite built from AudioCaps, Clotho and
  MusicCaps clips filtered for caption agreement, with counterfactual sound
  events generated by Gemini 3 Pro in 2 tiers (adversarial co-occurrences,
  random out-of-context), probed through explicit vs implicit queries and
  through TTS utterances prepended to the audio. 6 models were tested:
  Qwen2.5-Omni, Qwen3-Omni, R1-AQA, Audio Flamingo 3, Gemini 3 Pro, GPT 4
  Audio.


  Audio Flamingo 3 reaches 95.35% attack success and Gemini 3 Pro 79.65%. For
  Gemini 3 Pro, random-sound ASR rises from 10.88% explicit to 59.67%
  implicit. AF 3's random explicit ASR goes from 1.90% text to 53.40%
  audio-embedded. CoT prompting raises random implicit ASR on Qwen2.5-Omni
  from 68.74% to 82.90%; DPO on the 120K AHA-Guard set cuts it to 39.01%.


  Measured, not argued, with an attention analysis showing less audio
  attention under implicit queries and a confidence gap (76.3% vs 23.7%
  high-confidence "yes"). ASR comes from GPT-5.2 as judge, validated on 200
  samples at 92.4% human agreement. Mitigation was tested on 1 model only, and
  adversarial audio-surface ASR stays at 86.63% after DPO.


  If you evaluate audio grounding with presence questions, you are measuring
  the easy case.
