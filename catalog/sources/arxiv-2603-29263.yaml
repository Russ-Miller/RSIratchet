summary: "Large Audio Language Models (LALMs) achieve strong performance on
  audio-language tasks; however, their reliability in real-world settings
  remains underexplored. We introduce Audio Hallucination Attacks (AHA), an
  attack suite called AHA-Eval, comprising 6.5K QA pairs designed to test
  whether LALMs genuinely ground their responses in the audio input. AHA
  targets two attack surfaces: (i) query-based attacks, which exploit question
  structure to induce hallucinations about absent sounds, and (ii) audio-based
  attacks, which inject synthetic speech describing non-existent events into
  the audio stream"
notes: "Filed as a source on audio-understanding from the classifier's
