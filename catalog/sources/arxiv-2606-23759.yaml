summary: >-
  Verilog debugging remains one of the most time-consuming stages in digital
  circuit design. Recent advances in Large Language Models (LLMs) have
  enabled automated debugging; however, most existing approaches rely solely
  on test outputs and compiler feedback in an end-to-end manner, limiting
  their effectiveness on complex bugs. A key challenge is that the root
  cause of an error may be far removed from its observable outputs, making
  it difficult for LLMs to trace long dependency chains in code. This
  challenge is further exacerbated in large codebases, where long context
