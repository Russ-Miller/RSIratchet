brief: >-
  Representation-editing methods that suppress hallucinations in
  vision-language models damage general generation, and the damage comes from
  two separable causes: hallucination directions entangled with grounded
  semantics, and edits applied to every weight in a targeted layer. MPD
  addresses both by extracting the hallucination component as the residual
  orthogonal to the faithful subspace (SVD on faithful representations) and
  editing only the top-K weight vectors most cosine-similar to that component.


  Tests run on MiniGPT-4 V2, mPLUG-Owl2 and LLaVA-1.5-7B across CHAIR and POPE
  on MSCOCO, HallusionBench, MME and LLaVA-Bench, against DoLa, OPERA, VCD,
  LURE, HALC and Nullu.


  CHAIR_S drops to 12.80, 19.40 and 14.00 versus Nullu at 15.20, 20.30 and
  15.30, with BLEU held (16.06 best on mPLUG-Owl2). POPE F1 in the random
  setting reaches 88.20, 85.76 and 71.81. LLaVA-1.5-7B LLaVA-Bench accuracy
  rises 5.59 to 6.39, detailedness 4.72 to 5.52. The headline claim is 23.4%
  hallucination reduction with 97.4% of generative capability retained, and
  parameter perturbation cut 42% on mPLUG-Owl2 and 37% on MiniGPT4.


  Evidence is measured, with 3 backbones, 6 baselines, a layer-range ablation
  (16-32 best), and a PCA check on 1,000 faithful prompts showing smaller
  representation drift than Nullu. The orthogonal-projection advantage over
  naive differencing is argued analytically, not ablated empirically against a
  matched variant. LLaVA-Bench scoring is GPT-4V-based. All models are
  7B-class; ambiguous visual inputs and long-form coherence were not tested.


  If you edit weights to suppress model behaviours, restricting edits by
  similarity rather than editing whole layers is worth trying.
