  for robot manipulation, yet adapting them to a specific deployment remains
  challenging. Supervised fine-tuning (SFT) on task-specific demonstrations
  provides a step toward deployment, but faces two persistent limitations:
  static data provide limited coverage of out-of-distribution states, and
  standard imitation objectives do not distinguish progressing behavior from
  less useful data. Interactive post-training can address these limitations,
