brief: >-
  Multimodal DPO degrades general vision-language ability because the
  preference pairs are mostly easy, and down-weighting the easy ones
  per-sample recovers much of that loss while cutting hallucination further.
  DA-DPO scores each preference pair's difficulty with a frozen CLIP
  ViT-L/14@336 (image-text similarity gap) and a frozen LLaVA v1.5 7B
  (log-likelihood gap), fuses them by a voting weight proportional to each
  model's preference-classification accuracy, and uses the result to scale the
  per-sample beta. Training uses BPO (180k pairs), plus VLFeedback and
  LLaVA-RLHF (10k each), on LLaVA v1.5 7B/13B and LLaVA-OneVision 7B.


  On LLaVA v1.5 7B, AMBER generative Hal. drops from 35.7 (DPO) to 28.0,
  ObjHal CHAIRs from 43.3 to 39.7, and LLaVA-Bench recovers from 70.5 to 75.4
  (base model 63.8); SeedBench goes 57.8 to 64.8 against a base of 66.1.


  The effect is measured against standard DPO at matched data and schedule,
  with an ablation separating CLIP-only, MLLM-only and fused scores, a
  hard-filtering baseline at 10%/25%/50% removal that DA-DPO beats, swaps of
  the scoring VLMs (EVA-CLIP 8B, LLaVA-OV 7B), and 3 seeds in the
  reward-dynamics analysis.


  All models are LLaVA-family; MME perception stays below the base model in
  every arm, and difficulty estimation assumes the scoring VLMs match the data
  domain.


  If you run multimodal DPO, reweighting by a training-free difficulty proxy
  is cheaper than curating new pairs.
