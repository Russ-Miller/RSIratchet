brief: >-
  Multimodal DPO trained on standard preference data cuts hallucination but
  damages general ability, and the cause traced here is an easy/hard imbalance
  in the pairs: models overfit to pairs whose chosen and rejected responses
  are easy to tell apart. Down-weighting those pairs recovers much of the lost
  general performance.


  DA-DPO scores each preference pair with CLIP ViT-L/14@336 (image-text
  similarity gap) and LLaVA v1.5 7B (log-likelihood gap), Gaussian-normalizes
  both, fuses them by each model's preference-classification accuracy, and
  uses the result as a per-sample beta. Training used the BPO dataset (180k
  pairs) plus VLFeedback and LLaVA-RLHF (10k each), on LLaVA v1.5 7B/13B and
  LLaVA-OneVision 7B, across AMBER, ObjectHalBench, MMHal, POPE and GQA,
  SeedBench, MME, LLaVA-Bench.


  On LLaVA v1.5 7B, AMBER generative Hal. falls from 35.7 (DPO) to 28.0,
  LLaVA-Bench rises from 70.5 to 75.4, GQA from 45.3 to 59.8 against 62.0 for
  the untuned base.


  The cause is reasonably isolated: ablations separate CLIP-only and MLLM-only
  scoring, a matched comparison against hard filtering of 10%/25%/50% easy
  samples, difficulty-bucket training runs, and 3 seeds in the reward-dynamics
  analysis. Only 1 model family (LLaVA) is tested, and general ability still
  sits below the untuned base on several benchmarks.


  If you run multimodal DPO, reweighting by a training-free difficulty proxy
  is cheaper than filtering and works better.
