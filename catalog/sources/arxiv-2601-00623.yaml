brief: >-
  Multimodal DPO reduces hallucination but degrades general vision-language
  ability, and the cause traced here is overfitting to easy preference pairs;
  softly down-weighting those pairs recovers much of the loss.


  DA-DPO estimates each pair's difficulty with no extra training, using the
  CLIP image-text score gap and the reference MLLM's log-likelihood gap, fused
  by weights proportional to each model's preference-classification accuracy,
  then uses the score to scale per-sample beta in the DPO loss. Tested on
  LLaVA-v1.5-7B/13B and LLaVA-OneVision-7B trained on BPO (180k pairs),
  VLFeedback (10k) and LLaVA-RLHF (10k), across AMBER, Object HalBench, MMHal,
  POPE and GQA, SeedBench, MME, LLaVA-Bench.


  On LLaVA-v1.5-7B, AMBER generative HalRate falls from 35.7 under DPO to
  28.0, while LLaVA-Bench rises from 70.5 to 75.4 and GQA from 45.3 to 59.8
  (base model 62.0). Gains are not uniform: MME perception stays below the
  untuned 1510.7 for every variant.


  The effect is measured with matched training budgets and isolated by
  ablations: CLIP-only, MLLM-only, both; 2 CLIP and 2 MLLM scorers; and
  filtering 10%/25%/50% of easy samples, which fluctuates and loses to
  reweighting. Reward-gap buckets trained separately show the 25-50% bucket
  helps hallucination most. 3 seeds in the analysis, but the main table
  reports single runs.


  Scope is 1 model family, English image-text, and difficulty scoring assumes
  the pretrained VLMs transfer to the domain.


  If you run multimodal DPO, reweighting by cheap difficulty proxies is a
  lower-cost lever than collecting new preference data.
