brief: >-
  Multimodal DPO degrades general vision-language ability because it overfits
  to easy preference pairs, and softly down-weighting those pairs recovers
  much of the loss while cutting hallucination further. DA-DPO estimates pair
  difficulty without training by combining a CLIP ViT-L/14@336 image-text
  score gap with a LLaVA-v1.5-7B log-likelihood gap, fuses them by
  accuracy-weighted voting, and uses the result to scale the DPO beta per
  sample.


  Trained on BPO's 180k pairs with LLaVA-v1.5-7B/13B and LLaVA-OneVision-7B,
  evaluated on AMBER, MMHal, Object HalBench, POPE, plus GQA, SeedBench, MME,
  LLaVA-Bench. On LLaVA-v1.5-7B, AMBER generative HalRate falls from 35.7
  (DPO) to 28.0; LLaVA-Bench rises from 70.5 to 75.4; GQA recovers from 45.3
  to 59.8 against 62.0 for the untuned base. MME perception stays below base
  (1406.6 vs 1510.7).


  Evidenced by matched-dataset comparisons against vanilla DPO, an ablation
  separating CLIP-only (31.9 Hal.) from MLLM-only (29.9) from both (28.0), a
  hard-filtering baseline at 10%/25%/50% removal that DA-DPO beats,
  replication on VLFeedback and LLaVA-RLHF, and 3 seeds in the reward-dynamics
  analysis.


  All models are LLaVA-family; difficulty proxies may not transfer to domains
  far from CLIP/LLaVA pretraining, and general-benchmark degradation is
  reduced but not eliminated.


  If you run multimodal DPO, reweighting by a free difficulty proxy is cheaper
  than curating data and beats filtering.
