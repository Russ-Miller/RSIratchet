brief: >-
  Standard multimodal DPO overfits to preference pairs whose chosen and
  rejected responses are easy to tell apart, which both limits hallucination
  suppression and degrades general vision-language ability. Down-weighting
  those easy pairs, rather than deleting them, recovers much of the loss.


  DA-DPO scores each pair's difficulty with 2 frozen models, CLIP ViT-L/14@336
  and LLaVA v1.5 7B, Gaussian-normalizes each score gap, fuses them by a
  voting weight set from each model's preference-classification accuracy, and
  uses the result to scale the DPO beta per sample. Training uses the
  180k-pair BPO dataset on LLaVA v1.5 7B/13B and LLaVA-OneVision 7B, evaluated
  on AMBER, MMHal, Object HalBench, POPE plus GQA, SeedBench, MME,
  LLaVA-Bench.


  On LLaVA v1.5 7B, AMBER generative HalRate falls 35.7 to 28.0 versus DPO,
  and LLaVA-Bench rises 70.5 to 75.4 against a 63.8 base. DPO alone dropped
  GQA 62.0 to 45.3; DA-DPO holds 59.8.


  Evidence is measured with the right comparison: a matched-data DPO baseline,
  a 2x2 ablation over CLIP and MLLM scorers, swaps of the scorer models, 3
  seeds in the reward-dynamics analysis, 2 further datasets, and explicit
  filtering baselines at 10%, 25%, 50% removal that DA-DPO beats.


  All 3 models are LLaVA-family, and the difficulty proxies may not transfer
  to domains far from CLIP pretraining.


  If you run multimodal DPO, reweighting by cheap frozen-model score gaps is a
  near-free way to avoid the usual general-capability tax.
