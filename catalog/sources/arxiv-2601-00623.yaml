brief: >-
  Multimodal DPO degrades general vision-language ability because preference
  pairs are not equally hard: models overfit the easy pairs where chosen and
  rejected responses are obviously different, and learn little from the
  fine-grained ones. Down-weighting easy pairs recovers much of the lost
  general performance while cutting hallucination further.


  DA-DPO scores each preference pair's difficulty training-free, using the
  CLIP image-text score gap and the reference MLLM's log-likelihood gap,
  Gaussian-normalized and fused by each scorer's preference-classification
  accuracy. The fused score scales the per-sample beta in the DPO loss. Tested
  on LLaVA-v1.5 7B/13B and LLaVA-OneVision 7B, trained on BPO's 180k pairs,
  plus VLFeedback and LLaVA-RLHF, over AMBER, MMHal, Object HalBench, POPE and
  GQA, SEED, MME, LLaVA-Bench.


  On LLaVA-v1.5-7B, AMBER generative Hal. drops from 35.7 (DPO) to 28.0,
  LLaVA-Bench rises from 70.5 to 75.4, GQA from 45.3 to 59.8 against a 62.0
  base.


  Evidence includes ablations isolating CLIP vs MLLM scoring, a swap to
  EVA-CLIP 8B, 3 seeds in the reward-dynamics analysis, and a matched
  filtering baseline removing 10%/25%/50% easy samples, which DA-DPO beats.
  Comparison is to vanilla DPO only; stronger methods like mDPO are listed as
  reference, not matched. All models are LLaVA-family; MME perception still
  falls below base.


  If you run multimodal DPO, difficulty reweighting is a cheap fix for
  alignment tax.
