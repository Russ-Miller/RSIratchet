brief: >-
  Multimodal DPO degrades general vision-language ability because preference
  pairs are difficulty-imbalanced: models overfit to easy pairs where the
  chosen and rejected responses differ obviously, and learn little from the
  hard ones. Down-weighting easy pairs recovers much of the lost general
  capability while improving hallucination metrics.


  DA-DPO estimates pair difficulty without training by taking the score gap
  from CLIP ViT-L/14@336 (image-text relevance) and from LLaVA v1.5 7B (token
  log-likelihood), Gaussian-normalizing both, and fusing them by each model's
  preference-classification accuracy. The fused score scales the per-sample
  beta. Trained on BPO's 180k pairs with LLaVA v1.5 7B/13B and LLaVA-OneVision
  7B, evaluated on AMBER, MMHal, Object HalBench, POPE plus GQA, SEED, MME,
  LLaVA-Bench.


  On LLaVA v1.5 7B, AMBER generative HalRate falls from 35.7 (DPO) to 28.0,
  and LLaVA-Bench rises from 70.5 to 75.4 against 63.8 for the base model; GQA
  goes 45.3 to 59.8 where DPO had dropped it from 62.0.


  Evidenced with ablations on each VLM signal, 4 CLIP/MLLM backbone pairings,
  3 preference datasets (BPO, VLFeedback, LLaVA-RLHF), and a matched filtering
  baseline removing 10%/25%/50% easy samples, which DA-DPO beats. Training
  dynamics use 3 seeds.


  All models are LLaVA-family; no comparison at matched compute to stronger
  reward-model-based calibration, and MME perception stays below base.


  If you run multimodal DPO, reweighting by a free difficulty proxy is cheaper
  than new data and recovers general-benchmark loss.
