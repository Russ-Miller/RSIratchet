brief: >-
  Multimodal DPO overfits to easy preference pairs, and softly down-weighting
  them by estimated difficulty cuts hallucination while preserving general
  ability better than either plain DPO or hard filtering. DA-DPO scores each
  pair using CLIP ViT-L/14@336 (image-text similarity gap) and LLaVA v1.5 7B
  (log-likelihood gap), fuses them by each model's preference-classification
  accuracy, and uses the result to scale per-sample beta in the DPO loss. No
  extra data or training stage.


  Trained on BPO's 180k pairs with LLaVA-v1.5 7B/13B and LLaVA-OneVision 7B,
  evaluated on AMBER, MMHal, Object HalBench, POPE plus GQA, SeedBench, MME,
  LLaVA-Bench. On LLaVA-v1.5-7B, AMBER generative HalRate falls from 35.7
  under DPO to 28.0, and LLaVA-Bench rises from 70.5 to 75.4 (base model
  63.8). DPO collapsed GQA from 62.0 to 45.3; DA-DPO recovers 59.8.


  Effects are measured, with an ablation separating CLIP-only (31.9 Hal.),
  MLLM-only (29.9) and fused (28.0), a matched filtering baseline at
  10%/25%/50% easy-sample removal that DA-DPO beats, replication on VLFeedback
  and LLaVA-RLHF, and a bucket study where the 25-50% difficulty band gives
  the largest hallucination drop.


  All models are LLaVA-family; the method assumes pretrained VLMs rank
  difficulty well, untested on distant domains. MME perception still drops
  below base everywhere.


  If you run multimodal DPO, difficulty reweighting is a cheap way to avoid
  the general-capability tax.
