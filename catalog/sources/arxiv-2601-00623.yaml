brief: >-
  Multimodal DPO degrades general vision-language ability because the
  preference data is dominated by easy pairs, and softly down-weighting those
  pairs recovers much of the loss while cutting hallucination further.


  DA-DPO scores each preference pair's difficulty with 2 frozen models, CLIP
  ViT-L/14@336 and LLaVA v1.5 7B, Gaussian-normalizes each score gap, fuses
  them by weighting each model by its preference-classification accuracy, and
  uses the result to modulate the per-sample beta in DPO. Training used the
  180k-pair BPO dataset on LLaVA v1.5 7B/13B and LLaVA-OneVision 7B, evaluated
  on 4 hallucination benchmarks (AMBER, MMHal, Object HalBench, POPE) and 4-5
  general ones (LLaVA-Bench, GQA, SeedBench, MME).


  On LLaVA v1.5 7B, AMBER generative HalRate falls from 35.7 (DPO) to 28.0,
  LLaVA-Bench rises from 70.5 to 75.4, and GQA from 45.3 to 59.8 (base model
  62.0). Gains are smaller and uneven on 13B and OneVision; MME perception
  stays below base everywhere.


  The cause is reasonably isolated: an ablation separates CLIP-only, MLLM-only
  and fused scoring, a matched comparison against hard filtering of
  10%/25%/50% easy samples shows reweighting wins, 2 further datasets
  (VLFeedback, LLaVA-RLHF) replicate the direction, and reward-dynamics curves
  use 3 seeds. All models are LLaVA-family, and difficulty labels have no
  oracle, only proxies. Worth reading if you tune multimodal preference data.
