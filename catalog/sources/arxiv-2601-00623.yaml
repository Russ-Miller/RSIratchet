brief: >-
  Multimodal DPO degrades general vision-language ability because preference
  pairs are not equally hard: models overfit the easy pairs where chosen and
  rejected responses are obviously different, and learn little from the subtle
  ones. Reweighting by estimated difficulty recovers much of the lost general
  capability while cutting hallucination further.


  DA-DPO scores each pair with a frozen CLIP ViT-L/14@336 (image-text
  similarity gap) and a frozen LLaVA v1.5 7B (log-likelihood gap),
  Gaussian-normalizes both, fuses them by each model's
  preference-classification accuracy, and uses the result as a per-sample
  beta. Training uses the 180k-pair BPO dataset on LLaVA v1.5 7B/13B and
  LLaVA-OneVision 7B, evaluated on AMBER, ObjectHalBench, MMHal, POPE plus
  GQA, SeedBench, MME, LLaVA-Bench.


  On LLaVA v1.5 7B, AMBER generative HalRate falls from 35.7 under DPO to
  28.0, LLaVA-Bench rises from 70.5 to 75.4, GQA from 45.3 to 59.8 (base
  62.0), SeedBench from 57.8 to 64.8 (base 66.1).


  Evidence is measured with matched DPO baselines on the same data, 3 seeds in
  the reward-dynamics analysis, an ablation separating CLIP from MLLM signals
  (4.7 vs 4.6 vs 4.3 CHAIR_s), swaps to EVA-CLIP 8B and LLaVA-OV 7B, and a
  hard-filtering baseline at 10%/25%/50% removal that DA-DPO beats.
  Replication is across datasets (VLFeedback, LLaVA-RLHF) but 1 model family
  only; MME perception still drops below base, and difficulty estimators may
  not transfer outside VLM pretraining domains.


  If you run multimodal DPO, treat easy-pair overfitting as the default
  failure and reweight rather than filter.
