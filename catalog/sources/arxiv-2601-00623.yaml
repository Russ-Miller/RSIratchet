brief: >-
  Standard multimodal DPO overfits to easy preference pairs, cutting
  hallucinations while degrading general vision-language ability; softly
  down-weighting easy pairs recovers much of that loss. DA-DPO estimates pair
  difficulty training-free by combining a CLIP ViT-L/14@336 image-text score
  gap with an MLLM log-likelihood gap, fused by a voting weight set from each
  model's preference-classification accuracy, then uses the score to scale
  per-sample beta.


  Trained on the BPO dataset (180k pairs) with LLaVA-v1.5-7B/13B and
  LLaVA-OneVision-7B, evaluated on AMBER, MMHal, Object HalBench, POPE, plus
  GQA, SeedBench, MME, LLaVA-Bench.


  On LLaVA-v1.5-7B, AMBER generative Hal. drops from 35.7 (DPO) to 28.0,
  ObjHal CHAIRs from 43.3 to 39.7, and LLaVA-Bench rises from 70.5 to 75.4
  against 63.8 for the untuned base; GQA recovers from 45.3 to 59.8 (base
  62.0), so general ability is still below baseline.


  The effect is measured against matched DPO on the same data, with ablations
  isolating CLIP-only (31.9 Hal.) and MLLM-only (29.9) versus both (28.0), a
  filtering baseline at 10%/25%/50% easy-sample removal that DA-DPO beats, 3
  seeds in the reward-dynamics analysis, and replication on VLFeedback and
  LLaVA-RLHF. All models are LLaVA-family; no non-LLaVA backbone, and MME
  perception still falls below base.


  If you run multimodal DPO, difficulty reweighting is a near-free way to cut
  the alignment tax.
