brief: >-
  Multimodal DPO degrades general vision-language ability because preference
  pairs are difficulty-imbalanced: models overfit to easy pairs where chosen
  and rejected responses are obviously different, and learn little from the
  hard ones. Down-weighting easy pairs recovers much of the lost general
  ability while cutting hallucination further.


  DA-DPO estimates pair difficulty training-free by combining a CLIP
  image-text score gap with the reference MLLM's log-likelihood gap, fused by
  accuracy-weighted voting, then uses the score to scale the per-sample beta.
  Tested on LLaVA-v1.5-7B/13B and LLaVA-OneVision-7B, trained on BPO's 180k
  pairs, evaluated on AMBER, MMHal, ObjectHalBench, POPE plus GQA, SeedBench,
  MME, LLaVA-Bench.


  On LLaVA-v1.5-7B, AMBER generative Hal. drops from 35.7 (DPO) to 28.0,
  LLaVA-Bench rises from 70.5 to 75.4, GQA from 45.3 to 59.8, SeedBench from
  57.8 to 64.8. Base model GQA was 62.0, so degradation is reduced, not
  eliminated.


  Evidence is reasonably isolated: an ablation separates CLIP-only from
  MLLM-only from fused scoring, a matched comparison against hard filtering of
  10%/25%/50% easy samples, 2 extra datasets (VLFeedback, LLaVA-RLHF), 3 seeds
  for reward-dynamics plots, and a bucket-wise training study showing the
  25-50% gap bucket helps most.


  All models are LLaVA-family; difficulty proxies may not transfer to domains
  far from CLIP/LLaVA pretraining; MME perception stays below the base model.


  If you run multimodal DPO, reweighting by an off-the-shelf difficulty proxy
  is cheap and recovers general-benchmark loss better than filtering.
