brief: "A 32B open model fine-tuned on synthetic Verus proof data can approach
  Claude Sonnet 4.5 on real-world Rust system verification at roughly 1/50 the
  cost, provided the synthetic data is scaled past the size of any existing
  source benchmark. VeruSyn drops the dependence on a fixed source corpus: a
  Llama-3.3-70B-Instruct proof generator, seeded with the SAFE dataset, writes
  both Rust programs and their proofs (self-synthesis), is steered by Verus
  Tutorial chapters and ~1,000 expert seed programs for feature coverage, and
  is topped up with 4,557 long-CoT agent trajectories from GitHub Copilot CLI
  on Sonnet 4.5. The result is 6.9 million verified programs used to fine-tune
  Qwen2.5-Coder-32B-Instruct. On VeruSAGE-Bench (560 held-out tasks from large
  Rust systems), Accuracy@600 with debugging is 49% vs 54% for Sonnet 4.5, 24%
  for o4-mini, 19% raw Qwen, 15% AlphaVerus data, 11% SAFE data. On
  VerusBench, 83% vs 76% for Sonnet 4.5. Cost per task with debugging: $0.61
  vs $39.24. Ablations isolate the two data parts: Part-1 alone reaches 20% on
  VeruSAGE-Bench, Part-2 alone 41%, and Part-2 hurts Accuracy@1 on small
  algorithmic tasks (18% vs 57% for Part-1 only). Caveats: 1 base model, no
  coding agent at evaluation, and the 289 CoT-source tasks were excluded but
  came from the same benchmark family. Useful if you are weighing fine-tuning
  against paying for frontier models on verification work."
