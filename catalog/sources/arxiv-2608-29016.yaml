brief: >-
  Wrapping a general LLM in staged validation and domain knowledge bases
  removes the human from the loop on medical imaging pipeline generation, but
  the biggest single contributor to output quality is the domain knowledge
  base, not the validation.


  AutoMedImg splits generation into a Planning Phase (dataset analysis,
  architecture design, semantic checks plus CSP#/PAT model checking) and a
  Coding Phase (parallel Coder agents, Pylint/Radon static checks, 30–40
  Pytest cases per module, assembly validation), with a cross-project pipeline
  store. It was run on 6 datasets (FLARE22, ACDC, BTCV, FLARE21,
  Promise12MSBench, OrganMNIST3D) with 5 backbone LLMs, Pass@3, best of 3
  trials.


  Baseline IDE tools needed 5–17 human interventions; proprietary LLMs 5–12
  with 0.5058–0.9752 Dice. Multi-agent and AutoML frameworks needed 1–9.
  AutoMedImg reported 0 interventions everywhere, up to 0.9041 Dice (ACDC,
  Claude-4.5-Opus) and 0.9938 accuracy on OrganMNIST3D.


  Ablations on Claude-4.5-Opus isolate components: removing the knowledge base
  costs -13.7% performance, adaptive synthesis -8.4%, single-agent mode -10.2%
  and +1.33 HI, execution testing +3.50 HI. Intervention counts are
  self-judged by the authors, and best-of-3 reporting inflates all systems.


  Only segmentation and classification, only 6 public benchmarks, 1 ablation
  backbone, no independent replication.


  Useful if you care whether validation scaffolding or domain context is doing
  the work in agentic code generation.
