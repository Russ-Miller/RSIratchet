brief: >-
  Process reward models that look strong at catching math errors largely stop
  working outside math. On LSR-Ben, 3,595 human-annotated problem-solution
  pairs across 4 scientific and 5 logical reasoning subdomains, 13 open-source
  PRMs and 11 prompted LLMs were asked to name the first erroneous step or
  declare the solution clean, scored by F1 over erroneous and correct samples.


  PRMs mostly land below 30 average F1 against much higher ProcessBench
  scores: Qwen2.5-Math-PRM-72B goes 78.3 on ProcessBench to 37.4 average,
  Universal-PRM-7B 77.8 to 28.7. Prompted LLMs do better, with
  Gemini-3.8-flash at 63.8 and DeepSeek-v3.2 at 55.4. Error-type breakdown on
  the top 4 PRMs and top 4 LLMs shows PRMs average 52.7 FN and 22.7 FP, LLMs
  26.6 FN and 28.6 FP, so PRMs miss errors and LLMs invent them. Enabling slow
  thinking helps (Qwen3-32B 36.7 to 45.4) but hurts analogical reasoning.


  The cross-domain gap is measured, not argued, with the same task format and
  metric on both benchmarks. Scalar-score PRMs needed a per-domain threshold
  tuned on 40 held-out samples, which favors them. Open models are averaged
  over 3 runs; closed models are single-sample. Logical subdomain errors are
  65.1% logical by construction, so the domains are not balanced in error
  type.


  If you rely on a PRM for test-time search outside math, check it first.
