brief: >-
  Process reward models trained on math do not transfer their step-error
  detection to scientific and logical reasoning, and general-purpose LLMs
  prompted as critics beat every PRM tested in those domains.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 9
  subdomains (physics, chemistry, biology, computer science; deductive,
  inductive, abductive, analogical, mixed logic), drawn from MMLU-Pro, FOLIO,
  MIRAGE, CauseLogics, Analobench and LogiQA2.0, with solutions generated by
  11 open-source and 4 closed-source LLMs. The task follows ProcessBench: name
  the first erroneous step or declare the chain correct, scored as F1 over
  error and correct accuracy.


  PRMs score below 30% on average on LSR-Ben while reaching 73.5-78.3 on
  ProcessBench; the best PRM averages 37.4. Gemini-3.8-flash reaches 63.8,
  DeepSeek-v3.2 55.4, GPT-5.5 50.1. PRMs miss errors (average FN 52.7%, FP
  22.7%); LLMs over-flag (FN 26.6%, FP 28.6%). Slow thinking lifts Qwen3-32B
  from 36.7 to 45.4 but hurts analogical reasoning.


  The gap is measured, not argued, with 3 annotators per item, 76.4% full
  consensus, and a matched ProcessBench comparison. PRM scalar-score
  thresholds were tuned on per-domain dev sets, which if anything favors PRMs.
  Only 2 non-math PRMs exist to test, so the transfer claim rests on a thin
  treatment arm.


  If you rely on a PRM for verification outside math, measure it before
  trusting it.
