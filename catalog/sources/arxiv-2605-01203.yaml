brief: >-
  Process reward models trained on math barely transfer: their step-level
  error detection collapses outside mathematics, and prompted general LLMs
  beat them there.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 2
  reasoning categories and 9 subdomains (physics, chemistry, biology, computer
  science; deductive, inductive, abductive, analogical, mixed logic), with
  solutions generated by 11 open-source and 4 closed-source LLMs, reformatted
  for uniform step granularity, and labelled by 3 annotators with double
  cross-validation. 22 models were scored, 13 open PRMs plus 9 open and 2
  closed LLMs, using the ProcessBench F1 metric over erroneous and correct
  samples.


  Qwen2.5-Math-PRM-72B scores 78.3 on ProcessBench but 37.4 average on
  LSR-Ben; most PRMs fall under 30. Gemini-3.8-flash reaches 63.8 and
  DeepSeek-v3.2 55.4. Error-type breakdown over the top 4 PRMs and top 4 LLMs
  gives PRMs an average FN rate of 52.7 versus 26.6 for LLMs, and FP of 22.7
  versus 28.6: PRMs miss errors, LLMs over-flag. Slow thinking helps, GPT-5.5
  from 50.1 to 58.9, but not on analogical reasoning.


  The gap is measured, not argued, on a shared metric and a math control
  benchmark. Caveats: scalar-score PRMs needed per-domain thresholds tuned on
  a 40-sample dev set, closed models were sampled once, and only 2 non-math
  PRMs exist to compare against.


  If you rely on a PRM for test-time scaling outside math, assume it is close
  to unusable and check an LLM judge instead.
