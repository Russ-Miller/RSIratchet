brief: >-
  Process reward models trained on math do not transfer their step-error
  detection ability to scientific and logical reasoning; prompted general LLMs
  beat them there.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 9
  subdomains (physics, chemistry, biology, computer science, and deductive,
  inductive, abductive, analogical, mixed logical reasoning), with solutions
  generated by 11 open-source and 4 closed-source LLMs, re-segmented into
  steps by Qwen3-32B, and labeled by 3 annotators with double
  cross-validation. 13 PRMs and 11 LLMs were scored on first-error
  identification, using the ProcessBench F1 metric.


  PRM averages on LSR-Ben sit below 30 in general: Qwen2.5-Math-PRM-72B gets
  78.3 on ProcessBench but 37.4 average, VersaPRM 34.1, Universal-PRM-7B 28.7.
  Gemini-3.8-flash reaches 63.8 and DeepSeek-v3.2 55.4. PRMs miss errors
  (average FN 52.7, FP 22.7) while LLMs over-flag (FN 26.6, FP 28.6). Slow
  thinking helps: Qwen3-32B rises 36.7 to 45.4, but falls in analogical
  reasoning.


  The PRM-vs-LLM gap is measured, not matched on compute or prompt format, and
  PRMs with scalar outputs had thresholds tuned on a 40-sample dev set per
  subdomain, which favors them slightly. No best-of-N downstream check, so it
  is unclear whether these F1 gaps change selection quality.


  If you rely on a math PRM as a general step verifier, treat an LLM critic as
  the stronger baseline.
