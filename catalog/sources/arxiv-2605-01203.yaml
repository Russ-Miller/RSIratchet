brief: >-
  Process reward models trained on math do not transfer their step-level error
  detection to scientific or logical reasoning, and prompted general LLMs beat
  them there by a wide margin.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 2
  reasoning categories and 9 subdomains (physics, chemistry, biology, computer
  science; deductive, inductive, abductive, analogical, mixed logical), with
  solutions generated by 15 LLMs, reformatted into uniform steps by Qwen3-32B,
  and labelled by 3 annotators each for first erroneous step plus error type.
  13 open-source PRMs and 11 LLMs were scored with the ProcessBench F1 metric.


  PRMs average under 30 on LSR-Ben versus up to 78.3 on ProcessBench;
  Qwen2.5-Math-PRM-72B is the best PRM at 37.4 average while Gemini-3.8-flash
  reaches 63.8 and DeepSeek-v3.2 55.4. Error-type breakdown shows PRMs average
  52.7% FN versus 26.6% for LLMs, and 22.7% FP versus 28.6%: PRMs miss errors,
  LLMs over-flag. Slow thinking raises Qwen3-32B from 36.7 to 45.4 but hurts
  analogical reasoning.


  The transfer gap is measured, not argued, with matched metric and held-out
  thresholds for scalar PRMs; it is not isolated whether the cause is training
  domain or data format, and only 2 non-math PRMs exist to test.


  If you rely on PRMs for test-time scaling outside math, expect to use an LLM
  critic instead.
