brief: >-
  Process reward models trained on math do not transfer their step-error
  detection ability to scientific or logical reasoning, and prompted general
  LLMs beat them there by a wide margin.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 4
  scientific subdomains (physics, chemistry, biology, computer science) and 5
  logical ones (deductive, inductive, abductive, analogical, mixed), with
  solutions generated by 15 open- and closed-source LLMs, re-segmented into
  steps (13.7 average), and labelled for the first erroneous step plus its
  error type. 13 PRMs and 11 LLMs were scored by F1 over error/correct
  accuracies.


  PRMs score mostly under 30 average on LSR-Ben versus 40.8-78.3 on
  ProcessBench; the best PRM, Qwen2.5-Math-PRM-72B, reaches 37.4 average
  against 78.3 on ProcessBench, while Gemini-3.8-flash reaches 63.8 and
  DeepSeek-v3.2 55.4. PRMs skew toward false negatives (52.7% average FN) and
  LLMs toward false positives (28.6% average FP). Slow thinking raises LLM
  averages, for example Qwen3-32B 36.7 to 45.4, but drops on analogical
  reasoning.


  All effects are measured with 3-annotator majority consensus (76.4%
  unanimous) and scalar-score PRMs given per-domain thresholds tuned on
  held-out dev sets, which is a fair-to-generous setup for them. No PRM was
  retrained on these domains, so transfer failure is observed, not explained.


  If you rely on a math PRM as a general verifier, test it before trusting it.
