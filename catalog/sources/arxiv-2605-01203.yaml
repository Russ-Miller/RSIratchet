brief: >-
  Process reward models trained on math do not transfer their error-detection
  ability to scientific or logical reasoning, and prompted general LLMs beat
  them there by a wide margin.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 2
  reasoning categories and 9 subdomains (physics, chemistry, biology, computer
  science; deductive, inductive, abductive, analogical, mixed logic), with
  solutions generated by 11 open-source and 4 closed-source LLMs, reformatted
  for step granularity, and annotated by 3 annotators each with double
  cross-validation. The task follows ProcessBench: name the first erroneous
  step or declare the process correct, scored as F1 over erroneous- and
  correct-sample accuracy.


  13 PRMs and 11 LLMs were evaluated. Qwen2.5-Math-PRM-72B scores 78.3 on
  ProcessBench but 37.4 average on LSR-Ben; most PRMs fall below 30.
  Gemini-3.8-flash reaches 63.8 and DeepSeek-v3.2 55.4. Non-math-trained
  VersaPRM (8B) gets 34.1, above same-scale math PRMs. PRMs miss errors (52.7%
  average FN) while LLMs over-flag them (28.6% average FP). Slow thinking
  lifts Qwen3-32B from 36.7 to 45.4 and GPT-5.5 from 50.1 to 58.9, but not on
  analogical reasoning.


  The transfer gap is measured against a matched math benchmark with the same
  metric, though scalar-score PRMs required threshold tuning on a 40-sample
  dev set per subdomain, which favors them slightly. Open LLMs were averaged
  over 3 runs; closed models were sampled once.


  If you rely on a math-trained PRM outside math, assume it is close to
  unusable and check an LLM critic instead.
