brief: >-
  Process reward models trained on math do not transfer their step-level error
  detection to scientific or logical reasoning, and general-purpose LLMs
  prompted to critique beat them there.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 9
  subdomains (physics, chemistry, biology, computer science; deductive,
  inductive, abductive, analogical, mixed logical reasoning), with solutions
  generated by 11 open-source and 4 closed-source LLMs, re-segmented by
  Qwen3-32B, and annotated by 3 people each with double cross-validation. The
  task follows ProcessBench: name the first erroneous step or declare the
  process clean. 13 PRMs and 11 LLMs were scored by F1 over correct and
  erroneous samples.


  PRMs mostly land below 30 average F1 on LSR-Ben; Qwen2.5-Math-PRM-72B
  reaches 78.3 on ProcessBench but 37.4 average here. Gemini-3.8-flash reaches
  63.8, DeepSeek-v3.2 55.4. PRMs miss errors (average FN 52.7, FP 22.7) while
  LLMs over-flag (FN 26.6, FP 28.6). Slow thinking lifts Qwen3-32B from 36.7
  to 45.4 but hurts analogical reasoning.


  Evidence is a measured cross-benchmark comparison on the same task format,
  with scalar-score PRMs given per-domain thresholds tuned on 40-sample dev
  sets, so they are not disadvantaged by calibration. There is no
  matched-compute comparison between PRMs and the much larger LLMs, and the
  PRM/LLM gap may partly be scale.


  If you rely on a math PRM for test-time scaling outside math, verify it
  first.
