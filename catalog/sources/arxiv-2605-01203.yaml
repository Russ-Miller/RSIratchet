brief: >-
  Process reward models trained on math do not transfer their step-error
  detection ability to scientific or logical reasoning, and prompted general
  LLMs beat them there. LSR-Ben contains 3,595 human-annotated
  problem-solution pairs across 2 reasoning categories and 9 subdomains
  (physics, chemistry, biology, computer science; deductive, inductive,
  abductive, analogical, mixed logic), with solutions generated by 11
  open-source and 4 closed-source LLMs, reformatted for step granularity, and
  labelled by 3 annotators each for the first erroneous step and its error
  type.


  Across 13 PRMs and 11 LLMs, most PRMs score under 30 average F1 on LSR-Ben
  while reaching far higher on math ProcessBench: Qwen2.5-Math-PRM-72B gets
  78.3 on ProcessBench but 37.4 average; Universal-PRM-7B 77.8 vs 28.7.
  Gemini-3.8-flash leads at 63.8, DeepSeek-v3.2 55.4. Error-type breakdown
  shows PRMs average 52.7 FN% vs 22.7 FP%, LLMs 26.6 FN% vs 28.6 FP%, so PRMs
  miss errors and LLMs over-flag. Slow thinking helps (Qwen3-32B 36.7 to 45.4)
  but not on analogical reasoning.


  The gap is measured, with ProcessBench as the matched math comparison and
  76.4% 3/3 annotator agreement. Scalar-score PRMs required per-domain
  thresholds tuned on a 40-sample dev set, which favours them slightly. No PRM
  was retrained on these domains, so whether the gap is data or architecture
  is untested.


  If you rely on a math PRM as a general verifier, test it on your domain
  first.
