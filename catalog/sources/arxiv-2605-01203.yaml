brief: >-
  Process reward models trained on math do not transfer their step-level error
  detection to scientific or logical reasoning, and general-purpose LLMs
  prompted to critique beat them there.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 9
  subdomains (physics, chemistry, biology, computer science; deductive,
  inductive, abductive, analogical, mixed logic), with solutions generated by
  11 open-source and 4 closed-source LLMs, reformatted to uniform step
  granularity, and labelled by 3 annotators each with double cross-validation.
  13 PRMs and 11 LLMs are scored by F1 over erroneous and correct samples,
  alongside ProcessBench as a math reference.


  PRMs mostly sit under 30 average F1 on LSR-Ben: Qwen2.5-Math-PRM-72B gets
  78.3 on ProcessBench but 37.4 average, Universal-PRM-7B 77.8 vs 28.7.
  Gemini-3.8-flash reaches 63.8 and DeepSeek-v3.2 55.4. PRMs miss errors
  (average FN 52.7) while LLMs over-flag (average FP 28.6). Slow thinking
  helps most models, e.g. Qwen3-32B 36.7 to 45.4, but hurts analogical
  reasoning.


  The gap is measured, not argued, with a matched task format across both
  model classes and a per-error-type FP/FN breakdown. Scalar-output PRMs had
  thresholds tuned on a 40-sample dev set per subdomain, which favours them
  slightly. Only 2 non-math PRMs exist to test, and PRMs cannot use
  chain-of-thought, so part of the gap may be format rather than training
  data.


  If you rely on a PRM outside math, assume it is close to unusable and prompt
  an LLM critic instead.
