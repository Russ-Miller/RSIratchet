brief: >-
  Process reward models trained on math do not transfer their step-level error
  detection to scientific and logical reasoning, and general-purpose LLMs
  prompted to critique beat them there by a wide margin.


  LSR-Ben contains 3,595 human-annotated problem-solution pairs across 9
  subdomains (physics, chemistry, biology, computer science; deductive,
  inductive, abductive, analogical, mixed logical), with solutions generated
  by 11 open-source and 4 closed-source LLMs and 3 annotators per item plus
  double cross-validation. The task follows ProcessBench: name the first
  erroneous step or declare the solution clean. 13 PRMs and 11 LLMs were
  evaluated by F1.


  PRMs mostly score below 30 average on LSR-Ben versus much higher on
  ProcessBench: Qwen2.5-Math-PRM-72B gets 78.3 on ProcessBench but 37.4
  average, Universal-PRM-7B 77.8 versus 28.7. Gemini-3.8-flash reaches 63.8
  and DeepSeek-v3.2 55.4. Error-type breakdown shows PRMs average 52.7 FN and
  22.7 FP, LLMs 26.6 FN and 28.6 FP, so PRMs miss errors and LLMs over-flag.
  Slow thinking raises LLM scores (Qwen3-32B 36.7 to 45.4) but not in
  analogical reasoning.


  The gap is measured, not argued, with threshold tuning on a held-out dev set
  for scalar-output PRMs and 3 runs for open models; closed models were
  sampled once. Only 2 non-math-trained PRMs exist to test, so domain training
  versus scale is not cleanly separated.


  Treat math PRM leaderboards as uninformative about PRM utility outside math.
