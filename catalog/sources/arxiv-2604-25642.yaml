summary: "Large Vision-Language Models (LVLMs) have achieved remarkable
  progress in visual-textual understanding, yet their reliability is
  critically undermined by hallucinations, i.e., the generation of factually
  incorrect or inconsistent responses. While recent studies using steering
  vectors demonstrated promise in reducing hallucinations, a notable challenge
  remains: they inadvertently amplify the severity of residual hallucinations.
  We attribute this to their exclusive focus on the decoding stage, where
  errors accumulate autoregressively and progressively worsen subsequent
  hallucinatory outputs. To"
notes: "Filed as a source on hallucination from the classifier's judgement
