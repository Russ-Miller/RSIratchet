brief: >-
  Standard LoRA fine-tuning cannot teach an LLM to both suppress noisy
  retrieved documents and keep the fine-grained attention pattern it needs for
  reasoning; passing the attention update through a saturating non-linearity
  separates the 2 objectives. The argument is that relevance judgment is
  triple-wise (a token, its subject, the query) while attention is pairwise,
  so small rerankers cannot filter noise and the burden falls on the LLM.


  The method adds g(x) = max/min(xi*tanh(x), x) to the LoRA attention update,
  with xi ramped linearly over the first 80% of training. Tested on
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and Mistral-7B-Instruct on NQ,
  TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA, with 3 DPR-retrieved non-gold
  documents injected alongside gold ones; 3000 test / 7000 train samples per
  dataset, 948 / 4000 for ASQA.


  Mean accuracy across the 5 datasets rises from 72.0 (LoRA) to 74.2 at xi=5;
  vanilla is 50.2. Mistral gains most, e.g. 84.2 to 86.7 on HotpotQA and 48.8
  to 51.3 on ASQA. Placing the query before the documents helps consistently
  (NQ 65.7 vs 62.6 for LoRA).


  Evidence is measured against matched-rank LoRA (r=64), with activation
  ablations (tanh alone, tanh+x, sigmoid) and attention-gap diagnostics. No
  comparison to data-centric robustness baselines like RAFT or Differential
  Transformer, which the authors call unfair. Gains are 1-4 points, and the
  gold documents are inserted by construction.


  If you fine-tune for RAG robustness, the attention update function, not just
  the training data, is a lever worth testing.
