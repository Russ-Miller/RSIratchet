brief: >-
  Standard LoRA fine-tuning cannot teach an LLM to ignore retrieved noise
  without distorting attention among the relevant tokens; adding a saturating
  non-linear rectifier to the attention update separates the two jobs. The
  argument is that relevance judgement is triple-wise (a token, its subject,
  and the query term) while attention is pairwise, so small retrievers cannot
  filter noise and the burden falls on the LLM, whose linear weight update
  applies the same adjustment to relevant and irrelevant tokens alike.


  The method applies g(x) = max/min(xi*tanh(x), x) to the LoRA attention
  delta, with xi ramped linearly over the first 80% of training. Tested on
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and Mistral-7B-Instruct, on NQ,
  TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA, with DPR retrieval and 3
  non-gold distractor documents mixed with gold documents; 7000 train / 3000
  test samples per dataset, 948 test for ASQA.


  Mean accuracy across the 5 datasets rises from 72.0 (LoRA) to 74.2 at xi=5,
  versus 50.2 untuned. Mistral gains most (NQ 62.3 to 66.3). Placing the query
  before the documents helps both before and after tuning.


  Evidence is a matched-rank LoRA baseline (r=64) plus activation ablations
  (tanh alone, tanh+x, sigmoid) and an attention-gap measurement on answer
  tokens. No comparison against noise-robustness training methods such as RAFT
  or Self-RAG; the authors call those unfair. Gains over LoRA are 1-4 points,
  and the gold documents are always inserted.


  Useful if you fine-tune for RAG robustness and want an attention-level
  rather than data-level intervention.
