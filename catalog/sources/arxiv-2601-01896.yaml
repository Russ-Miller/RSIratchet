brief: >-
  Standard LoRA fine-tuning cannot cleanly teach an LLM to ignore retrieved
  noise, because a linear attention update must push irrelevant tokens down
  while preserving relative attention among relevant ones. Inserting a
  non-linear rectification on the attention update separates these two jobs
  and recovers accuracy.


  The method adds g(x) = max/min(ξ·tanh(x), x) to the attention score update,
  with ξ annealed from 0 over the first 80% of steps, LoRA rank 64. Tests on
  NQ, TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA with DPR retrieval, mixing
  gold documents with 3 distractor documents, on Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct and Mistral-7B-Instruct-v0.2.


  Mean over the 5 datasets: 50.2 vanilla, 72.0 LoRA, 74.2 at ξ=5. Mistral
  gains are larger (NQ 62.3 to 66.3, ASQA 48.8 to 51.3). Placing the query
  before the documents also helps, e.g. NQ 65.7 vs 62.6 under LoRA.


  Evidence is measured, with matched LoRA rank so trainable parameters are
  equal, and an ablation across tanh-only, tanh+x and sigmoid variants. No
  comparison against data-centric noise-robustness methods or Differential
  Transformer, which the authors call unfair; gold documents are injected,
  inflating 2wiki numbers to the mid-90s.


  If you fine-tune for RAG robustness, the attention update form, not just the
  training data mix, is a lever.
