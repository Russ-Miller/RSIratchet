brief: >-
  Standard LoRA fine-tuning cannot teach an LLM to ignore retrieved noise
  without damaging the attention pattern it uses to reason over relevant text;
  inserting a non-linear rectifier on the attention update recovers part of
  that trade-off. The argument is that relevance judgment is triple-wise
  (query token, subject, descriptor) while attention is pairwise, so small
  rerankers cannot filter noise and the burden falls on the LLM.


  The method adds g(x) = max/min(ξ·tanh(x), x) to the LoRA attention update,
  giving a saturating penalty for irrelevant tokens and linear growth for
  relevant ones. Tested on Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and
  Mistral-7B-Instruct on NQ, TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA,
  with 3 DPR-retrieved distractor documents added to gold documents, rank 64.


  On Llama, mean accuracy goes from 50.2 (vanilla) to 72.0 (LoRA) to 74.2 (ξ =
  5 or ξ = 10). Mistral gains more than Qwen, e.g. NQ 62.3 to 66.3 versus 61.4
  to 62.7. Placing the query before the documents helps consistently, e.g.
  52.4 vs 46.7 untuned.


  Evidenced with a matched-parameter LoRA baseline, an activation ablation
  (tanh alone, tanh+x, sigmoid), full fine-tuning, and an attention-gap
  measurement on answer tokens. No comparison to published noise-robustness
  methods (RAFT, Self-RAG, Differential Transformer, CrAM), which the authors
  call unfair rather than run. 3 models, all roughly 7–8B, 1 retriever, gold
  documents always present in the main table.


  If you fine-tune for RAG robustness, the attention-update shape may matter
  as much as the training data mix.
