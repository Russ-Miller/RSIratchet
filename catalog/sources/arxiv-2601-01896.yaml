brief: >-
  Standard LoRA fine-tuning asks one attention update to do two conflicting
  jobs, suppressing noisy retrieved tokens and preserving relative attention
  among relevant ones, and a non-linear rectification on the update does both
  better. The authors argue noise filtering is triple-wise (relevance of a
  token depends on several others) while attention is pairwise, so small
  rerankers cannot solve it and the burden falls on the LLM.


  The method adds g(x) to the attention score, where g is a tanh saturating at
  a hyperparameter xi, reverting to identity for large updates. Tested on
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and Mistral-7B-Instruct-v0.2
  across NQ, TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA, with DPR retrieval,
  gold documents plus 3 non-gold distractors, LoRA rank 64.


  Mean accuracy on Llama rose from 72.0 for LoRA to 74.1-74.2 for xi = 3-10.
  Mistral gained most, e.g. NQ 62.3 to 66.3 and ASQA 48.8 to 51.3. Placing the
  query before documents helped both before and after tuning (vanilla NQ 52.4
  vs 46.7).


  Evidence is measured with matched trainable parameters against LoRA, plus
  activation ablations (tanh alone, tanh+x, sigmoid) and an attention-gap
  analysis on answer tokens. No comparison to published noise-robust
  fine-tuning baselines; Differential Transformer and CrAM were excluded as
  unfair. Only 7B-8B models, no training from scratch.


  If you fine-tune for RAG robustness, the attention update form, not just
  data construction, is a lever.
