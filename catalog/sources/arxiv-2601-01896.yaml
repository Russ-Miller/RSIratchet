brief: >-
  Standard LoRA fine-tuning cannot teach an LLM to ignore retrieved noise
  without distorting attention among the relevant tokens; adding a saturating
  non-linear rectifier to the attention update separates the two objectives.
  The argument is that relevance judgment is triple-wise while attention is
  pairwise, so small retrievers cannot filter noise and the burden falls on
  the LLM.


  The method applies g(x) = max/min(ξ·tanh(x), x) to the LoRA attention
  update, with ξ ramped linearly over the first 80% of training. Tested on
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and Mistral-7B-Instruct-v0.2
  across NQ, TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA, with 3 distracting
  DPR-retrieved documents mixed with gold documents, 7000 train / 3000 test
  samples per dataset (948 test for ASQA).


  On Llama, mean accuracy goes 50.2 vanilla, 72.0 LoRA, 74.2 at ξ=5. Mistral
  ASQA rises 48.8 to 51.3. Placing the query before the documents helps both
  before and after fine-tuning (NQ 52.4 vs 46.7 untuned).


  Evidence is measured at matched trainable-parameter count (rank 64) against
  LoRA, with activation ablations (tanh alone, tanh+x, sigmoid) and
  attention-gap diagnostics. No comparison to published noise-robust
  fine-tuning baselines; Differential Transformer and CrAM were excluded as
  unfair. All models are 7–8B instruct models, single retriever, QA only.


  If you fine-tune for RAG robustness, the attention update shape may matter
  as much as the data mixture.
