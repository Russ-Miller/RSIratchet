brief: >-
  Standard LoRA fine-tuning cannot teach an LLM to suppress irrelevant
  retrieved tokens without distorting attention among the relevant ones;
  inserting a non-linear rectification on the attention update separates the
  two objectives and beats LoRA on every RAG benchmark tested.


  The argument has two parts. First, judging token relevance is triple-wise
  (the query token, the subject, and the context token), while attention is
  pairwise, so small retrievers cannot filter noise reliably. Second, a
  theorem shows a linear ΔW approximating the ideal noise-zeroing attention
  requires the update to be nearly constant across retained tokens. The fix
  applies g(x) = max/min(ξ·tanh(x), x) to the attention update, with the query
  placed before the documents.


  On Llama-3.1-8B-Instruct across NQ, TriviaQA, HotpotQA, 2WikiMultiHopQA and
  ASQA with 3 distracting DPR documents added to gold documents, mean accuracy
  goes 50.2 vanilla, 72.0 LoRA, 74.2 at ξ=5. Qwen2.5-7B and Mistral-7B show
  the same ordering (Mistral NQ 52.3 / 62.3 / 66.3). Query-ahead ordering
  helps both before and after fine-tuning.


  Evidence is measured, with matched LoRA rank 64 and activation ablations
  (tanh alone, tanh+x, sigmoid), plus an attention-gap probe on answer tokens.
  No comparison to noise-robustness baselines like RAFT or Differential
  Transformer, which the authors call unfair; 3 7-8B models only; gold
  documents are always present in the main table.


  If you fine-tune for RAG robustness, the attention update shape, not just
  the training data mix, is a lever worth testing.
