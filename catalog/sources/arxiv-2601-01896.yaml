brief: >-
  Standard LoRA fine-tuning cannot cleanly teach an LLM to ignore retrieved
  noise, because a linear attention update must push irrelevant tokens down
  while leaving relative attention among relevant tokens intact; inserting a
  non-linear rectifier on the attention update recovers most of that gap.


  The argument has two parts: judging whether a retrieved token is relevant is
  a triple-wise problem that pairwise attention needs many layers to solve, so
  small retrievers will always leak noise; and a theorem bounding how closely
  a linear ΔW can approximate the ideal noise-filtering attention. The fix
  applies g(x) = max/min(ξ·tanh(x), x) to x_i^T ΔW x_j, with ξ ramped from 0
  over the first 80% of training. Tested on Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct, Mistral-7B-Instruct-v0.2 across NQ, TriviaQA, HotpotQA,
  2WikiMultiHopQA, ASQA, with 3 distractor documents added to gold documents,
  rank-64 LoRA.


  Mean accuracy over the 5 datasets rises from 72.0 for LoRA to 74.2 at ξ = 5;
  Mistral-7B goes 62.3 to 66.3 on NQ. Placing the query before documents also
  helps (52.4 vs 46.7 untuned on NQ).


  Ablations cover tanh alone, tanh+x, and sigmoid variants, and the
  attention-gap analysis supports the stated mechanism. The only baseline is
  matched-parameter LoRA; Differential Transformer and CrAM are excluded as
  unfair comparisons, and gains are 1-4 points on 7-8B models with gold
  documents guaranteed present.


  Worth reading if you fine-tune for RAG robustness and assume LoRA suffices.
