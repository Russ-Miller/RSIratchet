brief: >-
  Standard LoRA fine-tuning cannot teach a model to ignore retrieved noise
  without disturbing the attention it needs for reasoning; adding a non-linear
  clamp to the attention update recovers some of both. The argument is that
  relevance judgment is triple-wise (a token, its subject, and the query),
  while attention is pairwise, so small retrievers cannot filter noise and the
  burden falls on the LLM.


  The method adds g(x) = max/min(xi tanh(x), x) to the attention score update,
  with xi ramped linearly over the first 80% of training. Tested on
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and Mistral-7B-Instruct over NQ,
  TriviaQA, HotpotQA, 2WikiMultiHopQA and ASQA, with DPR retrieving 3
  distracting documents mixed with gold documents, 7000 train / 3000 test
  samples each (ASQA: 4000 / 948).


  Mean accuracy across the 5 datasets rises from 72.0 (LoRA) to 74.2 at xi =
  5; vanilla is 50.2. Mistral-7B goes 62.3 to 66.3 on NQ, Qwen 61.4 to 62.7.
  Placing the query before the documents helps (65.7 vs 62.6 on NQ for LoRA).


  Evidenced by matched-rank comparison (r = 64, same trainable parameters)
  against LoRA, plus an activation ablation showing tanh alone or tanh(x)+x is
  worse. No comparison to published noise-robust fine-tuning baselines;
  Differential Transformer and CrAM were excluded as unfair. Gains are 1-4
  points and gold documents are always present.


  If you fine-tune for RAG robustness, the attention-update shape is a cheap
  knob worth trying.
