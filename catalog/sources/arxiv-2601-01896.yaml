brief: >-
  Standard LoRA fine-tuning cannot cleanly teach an LLM to ignore retrieved
  noise, because a linear attention update must both push irrelevant tokens
  down and preserve relative attention among relevant ones. Passing that
  update through a saturating non-linearity separates the two jobs and
  recovers accuracy.


  The method adds g(x) = max/min(ξ·tanh(x), x) to the attention score update,
  trained with LoRA at rank 64 on Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct
  and Mistral-7B-Instruct. Evaluation covers NQ, TriviaQA, HotpotQA,
  2WikiMultiHopQA and ASQA, with DPR retrieval and 3 non-gold documents
  injected alongside gold ones; 3000 test / 7000 train samples per dataset,
  948 / 4000 for ASQA.


  Mean across the 5 datasets rises from 50.2 (vanilla) to 72.0 (LoRA) to 74.2
  (ξ = 5 or 10). On Mistral 7B, NQ goes 62.3 to 66.3 and ASQA 48.8 to 51.3.
  Placing the query before the documents also helps after fine-tuning, e.g. NQ
  67.6 vs 64.8.


  The effect is measured against a matched-rank LoRA baseline, with ablations
  on tanh alone, tanh+x, and sigmoid; the sigmoid variant also helps, so the
  gain comes from saturation rather than tanh specifically. No comparison to
  Differential Transformer, CrAM, or data-construction methods, which the
  authors call unfair. Only 7–8B instruct models, synthetic distractor
  injection, no training from scratch.


  If you fine-tune for RAG noise robustness, the attention update shape is a
  cheap lever you may not have tried.
