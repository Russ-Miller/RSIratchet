summary: >-
  Recent large language models support inputs of up to 10 million tokens,
  yet they perform poorly on long-context tasks that require complex
  reasoning. Such tasks can be solved using only a subset of the input -- a
  proxy context -- rather than the full sequence. Despite sharing the same
  underlying reasoning process, models exhibit a significant performance
  disparity between proxy and full contexts. To improve long-context
  reasoning, we propose ProxyCoT, a novel training framework that transfers
  reasoning capabilities from short proxy contexts to full long contexts.
