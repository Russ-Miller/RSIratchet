brief: >-
  Video MLLMs that answer a question correctly often do so without tracking
  the objects involved, and scoring only the final answer hides this. The
  claim is that hallucination in dynamic scenes comes from weak
  spatio-temporal monitoring: holding object identities, states, and relations
  stable across time.


  STEMO-Bench is built from human-verified object-centric facts and decomposes
  each query into sub-questions, so a model's intermediate reasoning is graded
  rather than just its final output. The stated goal is to separate real
  temporal understanding from correct answers reachable via a single frame's
  visual cue or a statistical prior.


  The accompanying method, STEMO-Track, extracts object states chunk-by-chunk
  and aggregates them temporally into explicit trajectories, then reasons over
  that structure.


  The source reports that the object-centric framework reduces hallucinated
  answers and improves spatio-temporal reasoning consistency against
  state-of-the-art MLLMs, but gives no numbers, no named models, and no
  benchmark sizes, so the size of the effect cannot be judged from what is
  here. There is no description of an ablation separating chunk-wise
  extraction from temporal aggregation, and no matched-compute baseline is
  mentioned.


  What is untested here includes transfer to existing video benchmarks and
  whether sub-question grading itself is reliable.


  Treat this as a diagnostic framing worth checking before trusting
  final-answer video scores, pending the figures.
