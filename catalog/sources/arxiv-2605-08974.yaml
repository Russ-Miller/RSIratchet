brief: >-
  Video MLLMs that answer dynamic-scene questions correctly often do so
  without tracking anything: they resolve queries from local frame cues or
  statistical priors, and single final-answer scoring hides that gap. The
  authors frame the deficit as a failure of spatio-temporal monitoring, the
  persistent tracking of object identities, states, and relations across a
  video.


  STEMO-Bench is built from human-verified object-centric facts and decomposes
  each query into sub-questions, so intermediate reasoning steps are scored
  alongside the final answer and coincidental correctness can be separated
  from genuine temporal understanding. The companion method, STEMO-Track,
  extracts object states chunk-wise and aggregates them temporally into
  explicit object trajectories that the model reasons over.


  The source text reports results only qualitatively: the object-centric
  framework reduces hallucinated answers and improves spatio-temporal
  reasoning consistency relative to state-of-the-art MLLMs. No per-benchmark
  numbers, model names, dataset sizes, or baseline configurations are given
  here.


  The evidence is described as extensive experiments but is not quantified in
  the text available, and there is no stated matched-compute baseline,
  ablation separating chunk-wise extraction from temporal aggregation, or
  independent replication. Whether the benchmark's sub-question decomposition
  itself leaks answers is untested as presented.


  Treat the diagnostic framing as the contribution worth taking, and withhold
  judgment on the magnitude of STEMO-Track's gains until numbers are
  available.
