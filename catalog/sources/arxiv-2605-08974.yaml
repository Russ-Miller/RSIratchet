summary: >-
  While multimodal large language models (MLLMs) have advanced video
  understanding, they remain highly prone to hallucinations in dynamic
  scenes. We argue this stems from a failure in spatio-temporal monitoring,
  the ability to persistently track object identities, states, and relations
  over time. Existing benchmarks obscure this deficit by relying on single
  final-answer evaluations for queries that can often be resolved via local
  visual cues or statistical priors. To rigorously diagnose this, we
  introduce STEMO-Bench (Spatio-TEmporal MOnitoring), a benchmark of
