brief: >-
  Cheap execution-quality flags already emitted by an agent framework predict
  hallucination better than classifiers trained to detect it. The
  clarity-and-justification flag alone reaches AUC = 0.908, against a best
  supervised AUC = 0.689.


  Trajel covers 225 agent trajectories from the AssetOpsBench industrial
  multi-agent framework (IoT, FSMR, TSFM, WO agents), 6 model configurations,
  42 operations tasks, each Thought-Action-Observation trace annotated by an
  LLM judge and by blind human reviewers at 2 institutions under a 5-type
  taxonomy: factual, referential, logical, procedural, scope.


  Humans flagged hallucination in 68.3% (153 / 224) of trajectories; 48.7%
  involved multiple types; procedural accounted for 38.5% of occurrences. The
  LLM judge matched humans on 78.6% of binary labels but managed F1 0.258 on
  logical and 0.222 on referential, with exact type-set agreement in only
  58.2% of jointly flagged cases. BERT, NLI and Longformer detectors scored F1
  0.590, 0.563, 0.533, all below the zero-shot judge's 0.855.


  The signal result is correlational, measured on n = 213 with the flags
  produced at trajectory end by the same framework being audited, so no causal
  isolation and no prospective test of the proposed CJ+RV kill switch (97.1%
  hallucination rate). Inter-judge κ = 0.456 overall, ≤ 0.211 for the subtle
  types the paper most relies on.


  One domain, one orchestrator, 6 configurations; nothing here transfers
  automatically to web or healthcare agents. If you audit agents, read
  trajectories and cheap runtime flags before training a detector.
