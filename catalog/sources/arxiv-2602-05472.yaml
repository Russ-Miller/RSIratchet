brief: >-
  A model that writes its own training tasks, solves them, and critiques
  itself can beat both scalar-reward RL and externally supervised verbal
  feedback, and a weaker co-evolving task constructor beats a stronger
  decoupled one.


  ALIVE runs 3 roles in 1 shared policy: a Constructor that masks
  reasoning-critical spans in raw text (the hidden span is the ground truth),
  a Solver that produces reasoning traces, and a Reviewer that emits
  natural-language critiques plus a soft score in [0,1]. Training uses GRPO
  plus a feedback-conditioned loss. Backbones: Qwen3-4B/8B/30B-A3B-Base on
  Wikipedia, Qwen2.5-7B-Base on Big-Math/WebInstruct, Qwen3-30B-A3B-Instruct
  on coding corpora.


  On Qwen3-8B, ALIVE-Self beats PretrainZero on all benchmarks, including
  +4.06 on AIME24, +2.44 on SuperGPQA, +1.68 on BBEH. On Qwen2.5-7B,
  GPQA-Diamond reaches 45.96% vs 39.1% for FCP+Bootstrap. SWE-bench Verified
  goes 11.80 to 17.2%; QuestBench Plan-Q 8.50% to 31.35%. Self-generated
  critiques roughly match Kimi-K2 critiques (66.82 vs 66.92 MMLU-Pro).


  Measured, with matched data and compute and role-level ablations: removing
  the Constructor or Reviewer degrades results, and an external Kimi-K2.5
  Constructor scores 62.58 on MMLU-Pro, 4.2 points below the unified system.
  All backbones are 1 family (Qwen), and some baseline numbers are copied from
  prior papers rather than rerun.


  If you assumed self-generated rewards cap out below external judges, this is
  evidence against that for masked-span tasks.
