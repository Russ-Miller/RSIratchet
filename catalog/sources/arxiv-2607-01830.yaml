summary: >-
  Reliable reward and preference signals are critical for evaluating and
  optimizing large language models on open-ended tasks. Rubric-based judges
  offer a transparent way to decompose such judgments into explicit
  evaluation criteria, but existing annotation-free rubric generators
  typically rely on a single generic evaluator. As a result, they may
  overlook important dimensions of human preference, a failure mode we term
  dimensional blind spots. To address this limitation, we propose Multi-Role
  Rubric Generation (MRRG), a training-free and reference-free framework
  that elicits evaluation criteria
