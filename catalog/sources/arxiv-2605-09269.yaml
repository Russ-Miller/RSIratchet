brief: >-
  Forcing a multimodal judge to first write an instance-specific disagreement
  checklist, then execute it against the image, beats letting it produce a
  rationale and verdict in one pass. The gain is largest exactly where
  single-step judging is weakest: reasoning and visually dependent subsets.


  DeltaRubric trains one shared MLLM to play both Disagreement Planner and
  Checklist Verifier, optimized jointly with GRPO on 30K RLAIF-V preference
  pairs (decontaminated), using Qwen3-VL 4B and 8B Instruct. The Planner is
  rewarded only when its checklist flips a no-rubric baseline verdict from
  wrong to right.


  On VL-RewardBench overall accuracy rises +22.6 (4B) and +18.8 (8B) over
  base, and +4.3 and +8.1 over an RL-finetuned no-rubric baseline. 8B
  Reasoning goes 43.2 to 72.6. On Multimodal RewardBench the 8B goes 67.7 to
  73.2, with VQA 71.4 to 84.9. Text-only RewardBench improves 81.4 to 84.6.


  Evidence is measured against a matched RL-finetuned no-rubric baseline and a
  static generic rubric (75.3 vs 80.1 overall at 8B), plus ablations on frozen
  vs trained Planner, absolute vs relative Planner reward, image-free
  planning, and DAPO. 2 model sizes, 1 family, 1 training corpus; no
  inference-cost-matched comparison despite the 2-pass pipeline, and no
  downstream RLHF test of the reward model.


  If you build multimodal judges, the checklist step is worth its extra pass.
