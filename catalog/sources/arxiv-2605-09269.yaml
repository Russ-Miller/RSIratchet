brief: >-
  Making a multimodal judge write its own instance-specific disagreement
  checklist before judging, and training both roles with RL, beats judging
  with a free-form rationale. DeltaRubric runs one shared MLLM twice: first as
  a Disagreement Planner that lists the verifiable points where two candidate
  responses conflict, then as a Checklist Verifier that executes those checks
  against the image.


  Qwen3-VL-4B and 8B Instruct were RL-finetuned with GRPO on 30K RLAIF-V
  preference instances, with planner and verifier advantages computed in
  separate groups, and evaluated on VL-RewardBench, Multimodal RewardBench and
  text-only RewardBench.


  Overall VL-RewardBench accuracy rose +22.6 (4B) and +18.8 (8B) over the base
  models, and +4.3 and +8.1 over an RL-finetuned no-rubric CoT baseline.
  Multimodal RewardBench 8B went to 73.2 against 68.7 no-rubric. Text-only
  RewardBench rose from 81.4 to 84.6, with Reasoning 79.0 to 85.7.


  The effect is measured against a matched RL-finetuned no-rubric baseline,
  plus ablations on a frozen planner (Reasoning 66.3 vs 72.6), a static
  generic rubric (8B Overall 75.3 vs 80.1), absolute vs relative planner
  reward, an image-free planner, and DAPO as an alternative algorithm.
  Attribution is reasonably isolated.


  Limits: 1 model family, 2 sizes, 1 training source, pairwise preference
  only; no test as a reward signal in downstream policy training, and no cost
  accounting for the 2-pass inference.


  If you build multimodal judges, the gain comes from dynamic per-instance
  checklists, not from rubrics as such.
