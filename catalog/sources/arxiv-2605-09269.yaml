summary: Aligning Multimodal Large Language Models (MLLMs) requires reliable
  reward models, yet existing single-step evaluators can suffer from lazy
  judging, exploiting language priors over fine-grained visual verification.
  While rubric-based evaluation mitigates these biases in text-only settings,
  extending it to multimodal tasks is bottlenecked by the complexity of visual
  reasoning. The critical differences between responses often depend on
  instance-specific visual details. Robust evaluation requires dynamically
  synthesizing rubrics that isolate spatial and factual discrepancies. To
  address this, we
