brief: >-
  Vision-language-action models that clear standard manipulation benchmarks
  degrade once spatial relations get ambiguous and plans get long, and the
  failures separate into distinct causes rather than a single drop in success
  rate.


  RoboSPA is a manipulation dataset and benchmark built around 2 axes,
  fine-grained spatial reasoning and long-horizon procedural planning,
  spanning 10 task categories and 56 base tasks. Each task is instantiated at
  5 difficulty levels for 280 variants of rising spatial ambiguity and
  procedural complexity, with 527K collected trajectories across multiple
  embodiments and scenes. Beyond binary success, the benchmark adds diagnostic
  metrics intended to localise where a rollout breaks.


  Evaluations on representative VLA models are reported as struggling with
  complex spatial relations, precise low-level execution, and memory-intensive
  planning. The abstract gives no per-model or per-level numbers, so the size
  of the degradation across the 5 difficulty levels is not quantifiable from
  what is available here.


  The design does isolate difficulty, since each base task appears at all 5
  levels, which is a within-task comparison rather than a cross-benchmark one.
  But the set of models evaluated is described only as representative, no
  baselines or ablations are named, and the diagnostic metrics are the
  authors' own.


  Treat this as a source of graded manipulation tasks for stress-testing
  spatial and planning failures, not yet as a measured ranking of VLA systems.
