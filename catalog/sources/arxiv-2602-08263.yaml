summary: >-
  Large language model (LLM)-driven automated program repair (APR) has
  advanced rapidly, but most methods remain code-centric: they directly
  rewrite source code and thereby risk hallucinated, behaviorally
  inconsistent fixes. This limitation suggests the need for an alternative
  repair paradigm that relies on a representation more accessible to LLMs
  than raw code, enabling more accurate understanding, analysis, and
  alignment during repair. To address this gap, we propose VibeRepair, a
  specification-centric APR technique that treats repair as
  behavior-specification repair rather than ad-hoc code ed
notes: >-
  Filed as a source on debugging from the classifier's judgement that the
  paper is about it (improves, high): VibeRepair converts buggy code to a
  behavior specification, repairs the specification, then synthesizes code,
  repairing 28-33 more bugs than the strongest baselines. No claim has been
  drafted from it yet.
