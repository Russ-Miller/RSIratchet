  model (LLM) agents. Our vehicle is Nous, a long-term memory architecture
  that represents each entity-attribute pair as a categorical probability
  distribution updated through closed-form Bayesian inference, with
  information-theoretic surprise driving belief revision and entropy-based
  forgetting. A controlled ablation on the LoCoMo benchmark shows that
