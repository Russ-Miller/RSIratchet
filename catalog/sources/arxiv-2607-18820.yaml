summary: >-
  Chain-of-thought (CoT) reasoning is widely used to improve both the
  performance and interpretability of large language models (LLMs), yet the
  generated reasoning may not faithfully support the final answer. We study
  this problem from a causal perspective, where a faithful CoT process
  should follow the chain $Z\rightarrow X\rightarrow Y$, with $Z$, $X$, and
  $Y$ denoting the instruction, reasoning chain, and final answer,
  respectively. In this process, the instruction should affect the answer
  only through the reasoning chain. However, conventional autoregressive
  LLMs condition answer generation
