summary: >-
  Large language models can insert workplace details into phishing pretexts
  at low cost, but those details may either support or undermine a message's
  credibility. We recruited 180 U.S. working adults to evaluate simulated,
  AI-generated phishing emails in a disclosed survey. The emails used four
  cumulative levels of information: workplace (Level 1); recipient name and
  job title; job responsibilities; and coworker/shared-project context
  (Level 4). Participants rated each message's convincingness from 0 to 100,
  chose one stated action (open the link, investigate, delete, or report),
  and explained
