summary: >-
  General-purpose robots need to reason about their actions, combining
  perception, world knowledge, planning, success detection, recovery, and
  low-level control. Today's state-of-the-art models attempt to combine all
  these capabilities into the learned policy via large-scale pre-training.
  Instead, we show that these capabilities can be decomposed into a general
  language-conditioned policy/control agent and a high-level agent
  manager/orchestrator. Rather than training policies to reason via
  pre-training, we build a closed-loop physical agent orchestrator that can
  do high-level planning, decompose
