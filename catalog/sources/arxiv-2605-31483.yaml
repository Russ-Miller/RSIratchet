summary: >-
  Despite Bengali being the sixth most spoken language in the world, no
  prior work has systematically evaluated hallucination in large language
  models (LLMs) for Bengali. We introduce BenHalluEval, a fine-grained
  hallucination evaluation framework for Bengali covering four tasks:
  Generative Question Answering (GQA), Bangla-English Code-Mixed QA,
  Summarization, and Reasoning. We construct 12,000 hallucinated candidates
  using GPT-5.4 across twelve task-specific hallucination types, drawn from
  three existing Bengali datasets, and evaluate seven LLMs spanning
