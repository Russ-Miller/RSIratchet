brief: >-
  Lifelong knowledge editing can be done without touching model weights:
  retrieve the edited fact, filter it with a small relevance classifier, and
  suppress the log probability of the original answer's first token at
  decoding time.


  LightEdit pairs an edit-aware selector (XLM-RoBERTa-large cross-encoder
  trained on 1,000 sampled instances, 1 epoch) with in-context decoding that
  subtracts a weighted prior-knowledge log probability. Tested on LLaMA-3 (8B)
  and GPT-J (6B) over 1,000 sequential edits on ZSRE, Counterfact, and RIPE
  against FT, ROME, MEMIT, GRACE, R-ROME, AlphaEdit, LTE, and RECIPE.


  Average scores: 0.9664 on ZSRE, 0.9296 on Counterfact, 0.9818 on RIPE,
  versus RECIPE at 0.9380 / 0.7664 / 0.5473 and LTE at 0.7934 / 0.8753 /
  0.8980. Parameter-editing baselines collapse (MEMIT averages 0.0105 on
  ZSRE). On CSQA/MMLU/ANLI/TriviaQA, LightEdit averages 0.6108 against the
  unedited 0.6092, while ROME drops to 0.2004. Edit time is 0.0000s versus
  13.8527s for AlphaEdit.


  Evidence is measured, with an ablation separating the two components
  (removing the selector drops locality to 0.4612; removing decoding drops
  reliability to 0.8978), plus sweeps over alpha and top-k, and a first-token
  vs all-tokens comparison (0.9664 vs 0.9174).


  All 3 datasets are standard triple-based editing sets; no open-domain QA,
  multilingual, or multi-hop reasoning test, and the selector still needs
  supervised training.


  If you assumed retrieval-based editing requires expensive task-specific
  training, this suggests a classifier plus decoding contrast gets most of the
  way there.
