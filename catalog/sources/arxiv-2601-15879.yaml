brief: >-
  Code models that match proprietary systems on fill-in-the-middle correctness
  fall far behind them at obeying instructions about how to write the
  completion. C3-Bench isolates this by pairing identical prefix/suffix
  contexts with fine-grained instructions, either implementation requirements
  checked by unit tests plus an LLM judge, or scale requirements (line span,
  multi-line, statement block) checked by AST and line counting.


  The benchmark has 2,195 Python tasks derived from HumanEval and SAFIM, 1,286
  implementation-control and 909 scale-control, with 40+ models evaluated.


  Qwen2.5-Coder-32B reaches 38.7 implementation IF but only 5.2 scale IF,
  against 62.9 and 59.6 for o1-2024-12-17 and 60.9/50.8 for
  Claude3.5-Sonnet-20241022. Gemini-2.0-Flash scores 59.5 implementation IF
  but 7.0 on scale. SFT on 200,000 synthetic instruction-completion pairs
  produced by Qwen2.5-Coder-32B-Instruct lifts the 32B model's scale IF to
  80.7 and average IF to 66.6; Pass@1 moves only 58.1 to 62.0.


  Evidence is measured, with 10-gram decontamination, an ablation removing
  instructions (IF collapses, Pass@1 roughly flat), and a judge agreeing 98%
  with 5 senior Python developers. The judge is Claude3.5-Sonnet, which also
  generated the SCC instructions and part of the seed data, so judge-generator
  overlap is not ruled out.


  Scope is in-file Python only; no multi-language or repository-level test,
  and the gains are 1 model family.


  If you ship completion in an editor, test scale control separately from
  correctness.
