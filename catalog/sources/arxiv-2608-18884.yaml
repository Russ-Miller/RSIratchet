summary: >-
  Reinforcement-learning training of reasoning LLMs (e.g., GRPO) is
  expensive and requires a controllable environment, committing every
  contribution to a full training pipeline. We present EvoResearcher, a
  training-free, inference-time protocol that adds cost-bounded
  self-reflection to a single frozen LLM backbone. The protocol iterates
  generate -> self-critique -> revise until a maximum depth D is reached or
  the critique returns the CONFIRMED sentinel, an implicit early stop that
  lets the backbone self-verify its answer under a strict compute budget.
  Four self-reflective meta-reward components
notes: >-
  Filed as a source on critique from the classifier's judgement that the
  paper is about it (measures, low): The protocol's self-critique loop does
  not raise accuracy beyond the confidence interval, only saving compute via
  early stopping, characterizing self-critique's limited effect on output
