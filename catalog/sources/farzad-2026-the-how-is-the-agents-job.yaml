archived_text: |
  The craziest thing about agents is that you DO NOT want to be too explicit about HOW you want something.

  The HOW should ALWAYS be the job of the agent.

  If you don’t do this, you will not benefit from the creativity and IQ boost that future models will get, and you’ll have to spend a ton of your time optimizing prompts until models get smart enough to tell you that you’re being dumb lol
