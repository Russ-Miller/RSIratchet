summary: >-
  Conversations with large language models (LLMs) can substantially shift
  beliefs and attitudes, raising concerns about manipulation using AI
  persuasion. Here we test whether a light-touch AI literacy intervention -
  a brief warning that LLMs can be prompted to persuade and may present
  information selectively - helps protect users. Across two experiments
  (total N = 3,208 Americans) in which participants conversed with an LLM
  instructed to shift their views about different political topics, the
