summary: >-
  This paper describes the SKstars submission to SHROOM-Visions 2026, a
  shared task on fine-grained hallucination detection in large
  vision-language model outputs. The task requires systems to identify
  hallucinated character spans, assign hallucination categories, and provide
  confidence estimates for their predictions. Our approach combines
  zero-shot predictions from Qwen2.5-VL-72B-Instruct with those of a
