summary: "Uncertainty quantification techniques measure confidence in language
  model outputs to support critical applications like hallucination detection
  and selective prediction. While prior work has developed various confidence
  metrics and demonstrated their calibration for classification tasks or using
  verbalized confidence, the robustness of probability-based and
  self-consistency-based UQ metrics for natural language generation remains
  underexplored particularly under model adaptation. Since practitioners
  routinely apply supervised fine-tuning to adapt models to new tasks, a key
  question arises: do"
