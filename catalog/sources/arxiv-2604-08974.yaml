brief: >-
  Confidence scores from token probabilities or self-consistency do not keep
  their calibration through supervised fine-tuning, and the direction of the
  shift cannot be predicted from the pre-SFT model.


  The authors fine-tuned BART Base, Flan-T5 Base, Llama 3.1-8B, Gemma-2-2B,
  Gemma-2-9B and QWen 2.5-14B on English-Afrikaans translation (NLLB/FLORES),
  SQUAD and GSM8K, and scored 12 probability- and consistency-based UQ metrics
  by Prediction-Rejection Ratio before and after SFT.


  Across 216 configurations calibration degraded in 112 cases (43
  statistically significant) and improved in 104 (47 significant). PRR could
  drop by up to 0.290 points between consecutive epochs. Probability-based
  scores drifted toward relative overconfidence, consistency-based scores
  toward underconfidence. On TruthfulQA (817 question-answer pairs, filtered
  to entity answers), AUROC for detecting correct answers fell in 35/72 cases
  post-SFT.


  The effect is measured, with 3 seeds and ANOVA plus Holm correction. Fixing
  training steps at 2,500 while varying sample count isolates sample size from
  step count: 13/216 configurations still differed significantly. Mechanistic
  analysis covers only 2 of the 12 metrics, and the training-similarity
  explanation rests on correlations with cosine similarity to training data,
  not intervention.


  Untested on summarization and dialogue, and PRR assumes a monotonic
  confidence-quality relation.


  If you ship a confidence score on a fine-tuned model, revalidate it after
  every adaptation run.
