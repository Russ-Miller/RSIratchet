brief: >-
  Knowledge edits injected in Chinese and in English land in nearly disjoint
  parameter subspaces, so neither transfers to the other, and a mixed-language
  edit is close to the plain vector sum of the two.


  CLM-Bench is a Chinese-first CounterFact set of 1,010 pairs across 24
  knowledge domains, generated with Deepseek-R1 and manually reviewed, then
  aligned to English counterparts rather than translated from English. Batch
  editing with MEMIT, AlphaEdit and PMET was run on Llama3-8B, Mistral-7B,
  Qwen2-7B and llama2-chinese-7B under a lifelong protocol, 1000 monolingual
  edits or 2000 bilingual triplets.


  For Llama3-8B with MEMIT, Chinese editing gives zh_score 61.71% and zh
  Reliability 63.21% while en Reliability falls to 19.55%. Chinese reliability
  under mixed editing tracks monolingual Chinese closely (94.17% vs 73.00% at
  batch 100 scale reporting, 63.21% vs 63.21% at 1000). Geometrically, cosine
  similarity between Chinese and English deltas is 0.027–0.042, neuron Jaccard
  below 0.32, subspace angle above 60°; for mix vs the sum, cosine exceeds
  0.976 and relative error stays below 0.23.


  The geometric analysis is measured, but only on layer 12 of 1 model with 1
  method. AlphaEdit and PMET collapse at batch 1000, confounding their
  language comparisons. Only Chinese–English, only locate-and-edit batch
  methods.


  Treat multilingual edit propagation as something you must engineer, not
  expect.
