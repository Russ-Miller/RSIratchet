  facts in Large Language Models (LLMs) without retraining. However,
  progress in Multilingual Knowledge Editing (MKE) is currently hindered by
  biased evaluation frameworks. We observe that existing MKE benchmarks are
  typically constructed by mechanically translating English-centric datasets
