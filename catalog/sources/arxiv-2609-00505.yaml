summary: >-
  Video-text models adapted from image-text architectures (e.g., CLIP)
  frequently exhibit temporal blindness, the inability to perceive
  fundamental cues like order, direction, and motion dynamics. Standard
  datasets mask this limitation by enabling models to exploit static spatial
  shortcuts. To systematically evaluate this, we introduce XTE-Bench, a
  diagnostic probe revealing that even large-scale video-language models
  struggle with basic temporal reasoning, indicating that parameter scaling
  alone is insufficient to resolve this flaw. To address this, we propose
  Cross-Modal Temporal Edits (XTE),
