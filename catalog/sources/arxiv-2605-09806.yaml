summary: "Large reasoning models, such as OpenAI o1 and DeepSeek-R1, tend to
  become increasingly verbose as their reasoning capabilities improve. These
  inflated Chain-of-Thought (CoT) trajectories often exceed what the
  underlying problems require, wasting compute, latency, and context budgets.
  While introducing length-based efficiency rewards during reinforcement
  learning offers a natural remedy, existing methods struggle with two
  fundamental challenges: the optimal balance between correctness and
  efficiency is non-stationary throughout training, and intrinsic reasoning
  budgets vary drastically across p"
