  However, past work has shown that they can reward spurious or undesirable
  attributes such as length, format, hallucinations, and sycophancy. In this
  work, we introduce and study the research problem of automatically finding
  reward model biases in natural language. We offer a simple approach of
  using an LLM to iteratively propose and refine candidate biases. Our
