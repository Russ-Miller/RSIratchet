brief: >-
  A reward model that tops RewardBench 2 can be made to prefer responses with
  triple spaces between words and with hallucinated detail, and an LLM-driven
  evolutionary search finds such biases without any prior hypothesis about
  what to look for. The pipeline defines a bias as an attribute where the RM's
  reward rises but a Claude Sonnet 4.5 judge's winrate falls below 0.5,
  measured on counterfactual response pairs produced by minimally rewriting
  sampled answers with 3 different rewriters (gpt-5-mini, claude-haiku-4.5,
  grok-4.1-fast). It was run against Skywork-Reward-V2-Llama-3.1-8B over 20
  synthetic user-prompt topics.


  Of 17 candidate biases surfaced across 7 of 20 topics, 10 were significant
  at p = 0.01 for both RM and judge on a held-out test set. A hand-written
  hallucination attribute gave RM strength 2.52 ± 0.51 (p = 1.9e-6) with judge
  winrate 0.156 [0.132, 0.184] (p = 2.0e-42). Format checks reproduced prior
  findings: bold is favored broadly, lists only on a narrow how-to
  distribution.


  Evidence is mixed. Bias strengths are measured with confidence intervals,
  Bonferroni correction, and multi-rewriter consensus; the claim that
  evolutionary depth beats flat best-of-N rests on 1 run per configuration at
  matched candidate count, with 6 topics yielding survivors. Recall is checked
  only via 3 regex-detectable injected biases with n = 10 per point. 1 RM
  family, synthetic prompts, no generative RMs, and no test of whether a
  policy trained on this RM learns the biases.


  Treat it as a cheap audit recipe, not as a map of RM failure modes.
