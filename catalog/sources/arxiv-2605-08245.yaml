brief: >-
  Object hallucination in decoder-based VLMs traces to a linear,
  dataset-agnostic textual subspace sitting in the top principal components of
  vision embeddings; projecting it out reduces hallucination without
  retraining.


  The text manifold is defined by PCA over pretraining captions. Layer-wise
  alignment scores, a Ridge linear probe over 80 MS-COCO categories
  (image-level mAP), and logit-lens decoding at layers 26-28 are used to show
  that top PCs act as a modality anchor masking visual detail. Debiasing is
  applied either post-hoc at inference or inside the fine-tuning forward pass
  (projector only, LLM frozen, 2 epochs), on LLaVA-1.5-7B and Qwen2.5-VL-7B.


  On Qwen2.5-VL-7B, AMBER CHAIR falls 5.14 to 4.23, HAL 28.62 to 25.07,
  CHAIR_i 10.40 to 8.20, POPE rises 87.3 to 88.4, MME 2328.1 to 2355.2. On
  LLaVA-1.5-7B, AMBER CHAIR 9.20 to 6.74 and HAL 38.80 to 29.87. Fine-tuning
  raises VRSBench CLAIR from 72.30 to 74.70 (Qwen) and TextCaps from 60.30 to
  63.80 (LLaVA) over standard SFT.


  Measured, with 4 training-free decoding baselines (VCD, SID, VISTA, DMAS)
  and an SFT comparison at matched data and budget, so the gain is
  attributable to the projection. Ablations vary K and intervention layer, but
  only on 1 benchmark and 1 model.


  Boundaries: 2 7B models, decoder architectures only, linear-subspace
  assumption likely weaker out of distribution, and Recall drops on LLaVA
  (77.90 to 75.11).


  If you are mitigating hallucination by decoding tricks, a single projection
  may get you the same effect for free.
