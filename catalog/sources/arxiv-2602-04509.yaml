summary: Fine-tuning Multimodal Large Language Models (MLLMs) on task-specific
  data is an effective way to improve performance on downstream applications.
  However, such adaptation often leads to a degradation in generalization on
  pretrained tasks, a phenomenon known as Catastrophic Forgetting. Existing
  methods that aim to mitigate this issue either become ineffective when
  fine-tuning deeper layers of the language decoder or scale poorly with
  increasing model size. To address these limitations, we propose
