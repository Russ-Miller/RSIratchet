brief: >-
  Freezing the parameters whose perturbation most shifts a multimodal model's
  outputs, chosen before any downstream training and without any real data,
  retains more pretrained ability than merging-based or gradient-history-based
  forgetting mitigation, especially when fine-tuning reaches early decoder
  layers.


  Model-Dowser scores each weight as the product of Jacobian norm (estimated
  with Hutchinson/Rademacher probes), weight magnitude, and input activation,
  probing with prompts the model itself generates from random vocabulary
  tokens. It then freezes the top-scoring weights and trains the rest. Tested
  on LLaVA-1.5-7B and NVILA-Lite-2B fine-tuned on COCO-Caption, Flickr30k,
  ImageNet-R, IconQA, with upstream retention on TextVQA, OKVQA, OCRVQA, MMB,
  MMB (CN), GQA.


  At 20 fine-tuned layers and ρ = 0.1, H-scores reach 85.7 and 71.2 on
  COCO-Caption and ImageNet-R for NVILA, 79.9 and 69.7 for LLaVA, above SPIDER
  (78.3, 60.5, 75.2, 62.8). Memory stays at O(|P|) versus O(3|P|) for SPIDER,
  which cannot train LLaVA-7B beyond L > 20.


  Evidence includes a matched random-selection baseline over 3 seeds (at ρ =
  0.5, H-score 62.7 vs 55.0 ± 0.8, p = 0.004), a ρ sweep, and a depth sweep.
  Data-free scores correlate 0.891 ± 0.003 with real-data scores.


  Only 2 models, 1 training recipe (10k samples, 5 epochs), vision-language
  tasks only; no text-only LLM test.


  If you fine-tune deep into an MLLM decoder, a one-time static mask may beat
  dynamic gradient-based selection at a third of the memory.
