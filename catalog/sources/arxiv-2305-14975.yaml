ingested_at: 2026-09-19
brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than estimating its conditional probability by
  sampling. This cuts against the assumption that RLHF simply destroys
  calibration and leaves nothing recoverable.


  The evaluation covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on TriviaQA, SciQ, and TruthfulQA, with 1000 sampled
  questions each for TriviaQA and SciQ and all 817 TruthfulQA questions.
  Confidence methods include label probability estimated from n = 10 samples,
  an 'Is True' probe, verbalized numeric probabilities in 1 or 2 stages over
  top-1/2/4 answer candidates, chain-of-thought, and linguistic likelihood
  phrases mapped to probabilities either by a 123-respondent human survey or
  fit on held-out data.


  For gpt-3.5-turbo on SciQ, ECE falls from 0.256 for label probability to
  0.065 for Verb. 1S top-4; on TruthfulQA, 0.451 to 0.203. GPT-4 shows
  TriviaQA ECE 0.078 to 0.024. Asking for more candidate answers before
  scoring improves calibration; chain-of-thought does not.


  Evidence is measured, with ECE, temperature-scaled ECE, Brier score, and
  selective-accuracy AUC reported for every method and model, so the prompt
  variants are directly comparable. Log probabilities are approximated by
  sampling, not read out, since most models are closed.


  Gains are inconsistent for Llama-2-70b-chat and weak for claude-1
  verbalization, and 1-stage versus 2-stage prompts sometimes diverge sharply.
  Only short-form factual recall was tested, not reasoning, arithmetic, or
  long-form generation.


  If you need confidence scores from an API model, prompt for several answers
  plus probabilities rather than sampling for a distribution.
