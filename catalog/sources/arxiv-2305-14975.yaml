brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled token probabilities,
  reversing part of the calibration damage RLHF is thought to cause.


  Confidence-extraction methods were compared on gpt-3.5-turbo, gpt-4,
  claude-1, claude-2, and Llama-2-70b-chat, over 1000 questions each from
  TriviaQA and SciQ and all 817 TruthfulQA questions, scored with ECE,
  temperature-scaled ECE, Brier score, and selective-accuracy AUC. Conditional
  probabilities were estimated from n=10 samples since log-probs are
  unavailable for closed models; verbalized methods prompt for k guesses plus
  a probability each, in 1 or 2 stages, or a linguistic phrase mapped to a
  probability.


  For gpt-3.5-turbo on SciQ, ECE drops from 0.256 (label prob.) to 0.065
  (Verb. 1S top-4); on TruthfulQA from 0.451 to 0.125 with optimized
  linguistic expressions. gpt-4 TriviaQA ECE falls 0.078 to 0.024. Producing
  more candidate answers before scoring helps; chain-of-thought does not.


  Measured, with temperature scaling applied to both sides, so the comparison
  is matched on that axis. RLHF's effect on log-prob calibration is isolated
  only via Llama-2-70B base vs chat. Claude-1 verbalizes poorly and
  Llama-2-70b-chat gains inconsistently; prompt variants (1S vs 2S) swing
  calibration a lot.


  All tasks are short-form factual recall, not reasoning or long-form
  generation.


  If you need deferral thresholds from a closed chat model, ask it for a
  probability rather than sampling.
