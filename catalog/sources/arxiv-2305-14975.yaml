brief: >-
  Asking an RLHF-tuned model to state its confidence in words gives
  better-calibrated numbers than sampling its own conditional probabilities,
  reversing part of the calibration damage RLHF causes.


  The comparison covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on 1000 sampled TriviaQA questions, 1000 SciQ questions,
  and all 817 TruthfulQA questions, scoring ECE, temperature-scaled ECE, Brier
  score, and selective-accuracy AUC. Conditional probabilities are estimated
  from n = 10 samples since log probs are unavailable for closed models;
  verbalized methods ask for k guesses plus probabilities in 1 or 2 stages, or
  a linguistic phrase such as 'Almost certain'.


  On gpt-4, ECE falls from 0.078 (Label prob.) to 0.024 with Verb. 1S top-1 on
  TriviaQA, and from 0.445 to 0.082 (Ling. 1S-opt.) on TruthfulQA. Generating
  more candidate answers helps: SciQ ECE goes 0.234 to 0.065 from top-1 to
  top-4 on gpt-3.5-turbo. Chain-of-thought does not help.


  The effect is measured across 5 models with a matched prompt-free baseline
  (the model's own sampled probabilities) and temperature scaling applied to
  both sides. Calibration degradation from RLHF is isolated only on
  Llama-2-70B base vs chat.


  It fails to generalize cleanly: claude-1 verbalizes poorly, Llama-2-70b-chat
  improves only on some metrics, and only short-form factual recall was
  tested, not reasoning or long-form generation. Prompt phrasing swings
  results, with 1-stage and 2-stage differing sharply.


  If you need confidence from a closed chat model, ask it for several answers
  with probabilities rather than resampling.
