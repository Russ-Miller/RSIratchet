brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled token probabilities,
  reversing part of the calibration damage RLHF is thought to cause.


  The comparison covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on TriviaQA, SciQ, and TruthfulQA (1000 sampled questions
  each for the first 2, all 817 TruthfulQA questions), scored with ECE,
  temperature-scaled ECE, Brier score, and selective-accuracy AUC. Methods
  include conditional label probability estimated from n=10 samples, an 'Is
  True' probe, 1-stage and 2-stage verbalized numeric probabilities over top-k
  guesses, chain-of-thought, and linguistic hedges mapped to probabilities via
  a 123-respondent survey or fit on held-out data.


  For gpt-3.5-turbo, SciQ ECE drops from 0.256 (label prob.) to 0.065 (Verb.
  1S top-4); for gpt-4, TruthfulQA ECE drops from 0.445 to 0.082 with
  optimized linguistic expressions. Asking for more candidate answers before
  scoring helps; chain-of-thought does not.


  Everything is measured, across 5 models and 3 datasets, with temperature
  scaling applied to both sides so the comparison is reasonably matched.
  Weaknesses: correctness is judged by GPT-4/GPT-3.5 equivalence checking,
  claude-1 shows little verbalization benefit, Llama-2-70b-chat is
  inconsistent, and 1-stage vs 2-stage prompts diverge sharply, so prompt
  sensitivity is unresolved.


  Only short-form factual recall was tested; reasoning and long-form
  generation were not.


  If you need confidence scores from a closed RLHF model, ask for them in
  tokens rather than inferring them from sampling.
