summary: A trustworthy real-world prediction system should produce
  well-calibrated confidence scores; that is, its confidence in an answer
  should be indicative of the likelihood that the answer is correct, enabling
  deferral to an expert in cases of low-confidence predictions. Recent studies
  have shown that unsupervised pre-training produces large language models
  (LMs) whose conditional probabilities are remarkably well-calibrated.
