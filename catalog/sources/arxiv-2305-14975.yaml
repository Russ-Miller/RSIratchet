brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled token probabilities,
  reversing part of the calibration damage RLHF causes. No fine-tuning is
  needed.


  The setup covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on TriviaQA (1000 questions), SciQ (1000 questions), and
  TruthfulQA (all 817 questions), scored with ECE, temperature-scaled ECE,
  Brier score, and selective-accuracy AUC. Baselines are conditional label
  probability estimated from n=10 samples and a Kadavath-style 'Is True'
  probability; verbalized variants ask for top-1, top-2, or top-4 guesses with
  probabilities, in 1 or 2 stages, or linguistic terms like 'almost certain'.


  For gpt-3.5-turbo on SciQ, ECE falls from 0.256 (label prob.) to 0.065
  (Verb. 1S top-4) and 0.064 (Ling. 1S-opt.); on TruthfulQA, 0.451 to 0.125.
  GPT-4 SciQ goes 0.219 to 0.028. Asking for more candidate answers before
  scoring helps; chain-of-thought does not.


  The effect is measured across 5 models and 3 datasets with multiple metrics
  and prompt-format ablations, but correctness is judged by GPT-4/GPT-3.5
  equivalence checking, and probabilities are sampled rather than read from
  logits.


  Gains are inconsistent for Llama-2-70b-chat and weak for claude-1, and
  nothing here covers reasoning, arithmetic, or long-form generation. If you
  need confidence scores from a closed API, prompt for them rather than
  sampling.
