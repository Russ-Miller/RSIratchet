brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled token probabilities,
  reversing part of the calibration damage RLHF is thought to cause.


  The comparison covers gpt-3.5-turbo, gpt-4, claude-1, claude-2 and
  Llama-2-70b-chat on TriviaQA (1000 questions), SciQ (1000) and TruthfulQA
  (all 817), scoring ECE, temperature-scaled ECE, Brier score and
  selective-accuracy AUC. Conditional probabilities are estimated from n = 10
  samples, since log-probs are unavailable for closed models; verbalized
  variants include 1-stage and 2-stage numerical probabilities over top-k
  guesses, chain-of-thought, and linguistic expressions mapped to
  probabilities.


  For gpt-3.5-turbo, ECE falls from 0.140 (label prob.) to 0.047 on TriviaQA
  and from 0.256 to 0.065 on SciQ; gpt-4 goes 0.078 to 0.024 on TriviaQA and
  0.219 to 0.028 on SciQ. Prompting for more answer choices (top-2, top-4)
  helps; chain-of-thought does not.


  The effect is measured, with method-by-method tables and temperature scaling
  applied to both sides, so the comparison is matched. Prompt sensitivity is
  large: 1-stage and 2-stage numbers diverge sharply, and claude-1 verbalizes
  poorly while Llama-2-70b-chat improves only on some metrics.


  All tasks are short-form factual recall; reasoning, arithmetic and long-form
  generation are untested.


  If you need confidence from an API model without log-probs, just ask it, and
  ask for several candidate answers first.
