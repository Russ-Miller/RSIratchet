ingested_at: 2026-09-19
brief: >-
  Asking an RLHF-tuned model to state its confidence in words gives
  better-calibrated numbers than its own sampled conditional probabilities.
  That cuts against the assumption that RLHF simply destroys calibration and
  leaves nothing to recover.


  The comparison covers gpt-3.5-turbo, gpt-4, claude-1, claude-2 and
  Llama-2-70b-chat on TriviaQA (1000 questions), SciQ (1000) and TruthfulQA
  (all 817). Baselines are label probability estimated from n=10 samples and a
  Kadavath-style 'Is True' probability; the elicitation variants are 1-stage
  and 2-stage verbalized numeric confidences over top-1/2/4 guesses,
  chain-of-thought, and linguistic likelihood phrases mapped to probabilities
  either by a 123-respondent survey or by a held-out calibration set.


  For gpt-3.5-turbo, ECE on SciQ falls from 0.256 (label prob.) to 0.065
  (Verb. 1S top-4) and 0.064 (Ling. 1S-opt.); on TriviaQA from 0.140 to 0.047.
  gpt-4 goes from 0.078 to 0.024 on TriviaQA and 0.445 to 0.082 on TruthfulQA.
  Producing more candidate answers before scoring helps; chain-of-thought does
  not.


  Effects are measured, with temperature scaling applied to both sides, 4
  metrics, and 5 models, so the gain is not a scaling artifact. But
  correctness is judged by GPT-4/GPT-3.5 equivalence checking, log
  probabilities are approximated by sampling for closed models, Claude-1 and
  Llama-2-70b-chat show inconsistent gains, and 1-stage vs 2-stage prompts
  differ sharply.


  All tasks are short-form factual recall; reasoning, arithmetic and long-form
  generation are untested. If you need deferral thresholds from a closed chat
  model, ask it for a probability over several candidate answers rather than
  resampling.
