ingested_at: 2026-09-19
brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled conditional probabilities.
  That cuts against the assumption that token probabilities are the most
  honest uncertainty signal available.


  The comparison covers gpt-3.5-turbo, gpt-4, claude-1, claude-2 and
  Llama-2-70b-chat on TriviaQA, SciQ and TruthfulQA, using 1000 sampled
  questions each from TriviaQA and SciQ and all 817 TruthfulQA questions.
  Conditional probabilities were estimated from n = 10 samples since log-probs
  are unavailable in closed models; verbalized methods ask for k guesses plus
  a probability each, in 1 or 2 dialogue stages, or ask for a linguistic
  phrase such as 'Almost certain'.


  On SciQ, gpt-3.5-turbo's ECE drops from 0.256 for label probability to 0.065
  for Verb. 1S top-4; on TruthfulQA, gpt-4 goes from 0.445 to 0.082 with
  optimized linguistic expressions. Producing several candidate answers before
  assigning confidence helps consistently; chain-of-thought does not.


  Evidence is measured across 4 metrics (ECE, ECE-t, BS-t, AUC) and 5 models,
  with Llama-2-70B base vs chat used to replicate the claim that RLHF degrades
  log-prob calibration. But correctness is judged by GPT-4 or GPT-3.5
  equivalence checking, which couples the metric to the systems under test,
  and claude-1's verbalized confidences do not improve, nor do
  Llama-2-70b-chat's consistently.


  All tasks are short-form factual recall; reasoning, arithmetic and long-form
  generation are untested, and 1-stage vs 2-stage prompts sometimes differ
  sharply.


  If you need confidence from an API model without log-probs, prompt for
  several answers plus probabilities rather than resampling.
