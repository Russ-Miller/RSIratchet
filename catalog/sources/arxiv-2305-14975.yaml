brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled conditional probabilities.
  That cuts against the assumption that token-level likelihoods are the
  privileged source of uncertainty.


  The setup covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on TriviaQA, SciQ, and TruthfulQA, with 1000 sampled
  questions each from TriviaQA and SciQ and all 817 TruthfulQA questions.
  Confidence baselines are a sampled label probability (n = 10 samples) and an
  'Is True' probability; verbalized variants ask for top-k guesses with
  probabilities in 1 or 2 stages, or linguistic expressions mapped to numbers.


  ECE often drops by over 50%. For gpt-3.5-turbo on SciQ, label probability
  ECE is 0.256 versus 0.065 for Verb. 1S top-4; on TruthfulQA, 0.451 versus
  0.125 for Ling. 1S-opt. GPT-4 on TriviaQA goes 0.078 to 0.024. Asking for
  more candidate answers before scoring helps; chain-of-thought does not.


  Measured, with 4 metrics (ECE, ECE-t, BS-t, AUC) and matched prompts across
  5 models, but correctness is judged by GPT-4 or GPT-3.5 equivalence
  checking, and log probabilities are approximated by sampling because the
  models are closed.


  Boundaries: short-form factual recall only, no reasoning or long-form tasks;
  Claude-1 and Llama-2-70b-chat show weak or inconsistent gains, and 1-stage
  versus 2-stage prompts differ sharply.


  If you need calibrated confidence from an API model, prompt for it rather
  than reconstructing probabilities.
