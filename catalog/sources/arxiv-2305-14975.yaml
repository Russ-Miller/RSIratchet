brief: >-
  Asking an RLHF-tuned model to state its confidence in words gives
  better-calibrated numbers than its own sampled token probabilities,
  reversing part of the calibration damage attributed to RLHF.


  The comparison covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on 1000 sampled TriviaQA questions, 1000 SciQ questions,
  and all 817 TruthfulQA questions, scored with ECE, temperature-scaled ECE,
  Brier score, and selective-accuracy AUC. Conditional probabilities were
  estimated from n = 10 samples since log-probs are unavailable for closed
  models.


  For gpt-3.5-turbo, SciQ ECE falls from 0.256 for label probability to 0.065
  for verbalized 1-stage top-4 and 0.064 for optimized linguistic expressions;
  on TruthfulQA, 0.451 to 0.203 and 0.125. For gpt-4, TriviaQA ECE goes 0.078
  to 0.024. Prompting for several candidate answers before scoring helps;
  chain-of-thought does not.


  The effect is measured, with matched prompting variants and temperature
  scaling applied to both sides, and Figure 2 shows RLHF worsening log-prob
  calibration on Llama-2-70B base versus chat. Correctness was judged by GPT-4
  or GPT-3.5 equivalence checking, not exact match.


  It holds unevenly: claude-1 verbalizes poorly, Llama-2-70b-chat only
  inconsistently, and 1-stage versus 2-stage prompts differ sharply. All tasks
  are short-form factual recall; reasoning and long-form generation were not
  tested.


  If you need confidence from a closed chat model, ask for it rather than
  sampling.
