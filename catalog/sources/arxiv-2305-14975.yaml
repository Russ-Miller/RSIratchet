brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives
  better-calibrated numbers than its own sampled token probabilities,
  reversing part of the calibration damage RLHF is thought to cause.


  Confidence-extraction methods were compared on gpt-3.5-turbo, gpt-4,
  claude-1, claude-2, and Llama-2-70b-chat over 1000 questions each from
  TriviaQA and SciQ and all 817 TruthfulQA questions, scored by ECE,
  temperature-scaled ECE, Brier score, and selective-accuracy AUC. Conditional
  probabilities were estimated from n = 10 samples since log-probs are
  unavailable for closed models; verbalized variants asked for 1, 2, or 4
  guesses with probabilities, in 1 or 2 dialogue stages, or with linguistic
  phrases like 'Almost certain'.


  For gpt-3.5-turbo on SciQ, ECE fell from 0.256 for label probability to
  0.065 for Verb. 1S top-4; on TruthfulQA, 0.451 to 0.203. gpt-4 went from
  0.219 to 0.056 on SciQ. Asking for more candidate answers helped;
  chain-of-thought did not (Verb. 2S CoT ECE 0.323 on SciQ).


  All effects are measured, with temperature scaling applied to both sides, so
  the comparison is matched. Correctness was judged by GPT-4 or GPT-3.5
  equivalence checking, not exact match, which couples the metric to the
  models under test. Gains are inconsistent for Llama-2-70b-chat and claude-1
  verbalizes poorly. Only short-form factual recall was tested; reasoning and
  long-form generation were not.


  If you need deferral signals from a closed model, prompt for verbalized
  confidence over several candidate answers rather than sampling for
  probabilities.
