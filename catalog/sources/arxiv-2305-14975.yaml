brief: >-
  Asking an RLHF-tuned model to state a confidence in words gives you
  better-calibrated numbers than estimating its conditional probability by
  sampling. That cuts against the assumption that RLHF simply destroys
  calibration and leaves you with nothing usable.


  The evaluation covers gpt-3.5-turbo, gpt-4, claude-1, claude-2, and
  Llama-2-70b-chat on TriviaQA (1000 questions), SciQ (1000 questions), and
  TruthfulQA (817 questions), scoring ECE, temperature-scaled ECE, Brier
  score, and selective-accuracy AUC. Confidence sources compared: sampled
  label probability (n = 10), a sampled 'Is True' probability, verbalized
  numeric probabilities over top-k guesses in 1 or 2 dialogue stages,
  chain-of-thought, and linguistic expressions like 'highly likely'.


  On SciQ, gpt-3.5-turbo's label-probability ECE of 0.256 drops to 0.065 with
  Verb. 1S top-4; gpt-4 goes 0.219 to 0.056. On TruthfulQA, gpt-4's 0.445
  falls to 0.082 with optimized linguistic expressions. Asking for more
  candidate answers before scoring helps consistently.


  The effect is measured, with a matched conditional-probability baseline and
  temperature scaling applied to both sides, across 5 models. Weaknesses:
  correctness is judged by GPT-4/GPT-3.5 equivalence checking, log
  probabilities were unavailable so baselines are sample-estimated, claude-1
  shows little verbalized gain, and Llama-2-70b-chat is inconsistent.


  All tasks are short-form factual recall; reasoning, arithmetic, and
  long-form generation were not tested. If you need confidence scores from a
  closed API, prompt for them rather than sampling.
