summary: >-
  FORM is a domain-specific symbolic manipulation language widely used in
  particle physics for processing the very large algebraic expressions
  arising from multi-loop Feynman diagram calculations. Despite its central
  role in precision theoretical physics, no artificial-intelligence tooling
  exists, to our knowledge, for assisting physicists in writing FORM code.
  We show that contemporary large language models (LLMs), including frontier
  models with hundreds of billions of parameters, achieve a zero-percent
  execution pass rate on our instruction-following and tutorial-style FORM
  tasks without docum
