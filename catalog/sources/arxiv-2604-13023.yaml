summary: "Large Audio-Language Models (ALMs) have recently demonstrated
  remarkable capabilities in holistic audio understanding, yet they remain
  unreliable for temporal grounding, i.e., the task of pinpointing exactly
  when an event occurs within long-form audio. This limitation stems from two
  factors: training data dominated by clip-level supervision lacking precise
  timestamps, and benchmarks that fail to simulate real-world scenarios where
  short events are obscured by dense background sounds. In this paper, we
  introduce SpotSound, an audio language model designed for grounding audio
  events. SpotSound i"
