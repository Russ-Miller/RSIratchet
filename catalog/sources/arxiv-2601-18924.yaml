summary: >-
  Large Language Models (LLMs) are increasingly relied upon for complex
  workflows, yet their ability to maintain flow of instructions remains
  underexplored. Existing benchmarks conflate task complexity with
  structural ordering, making it difficult to isolate the impact of prompt
  topology on performance. We introduce RIFT, Reordered Instruction
  Following Testbed, to assess instruction following by disentangling
