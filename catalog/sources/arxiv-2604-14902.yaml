brief: >-
  Embodied instruction-following agents collapse when the instruction is
  literally valid but the target object is temporarily unusable, and the
  bottleneck is visual state inference rather than planning.


  DynAfford rebuilds the ALFRED generation pipeline in AI2-THOR with injected
  affordance violations (occupied microwaves, used pans, dirty cloths),
  holding instruction text, goals and success criteria fixed: 2,628 expert
  demonstrations, 10,106 annotations, 57 scenes, 2,076 test tasks. ADAPT is a
  decision-time module that infers whether a planned action's preconditions
  hold, then defers or inserts a preparatory action, using a LoRA-finetuned
  LLaVA-1.5-7B with 3-image in-context comparison.


  Baselines score near zero to low on test unseen: SayCan 0.00 SR, LLM-Planner
  2.46, MOCA 0.00, FILM 9.34, CAPEAM 19.39. ADAPT lifts FILM to 16.18 SR
  (+73.2%) and GC 25.54 to 34.41 (+34.7%); CAPEAM to 21.10 SR (+8.8%). GPT-4o
  as the affordance backend underperforms the finetuned LLaVA, by more than
  10% on affordance classification alone.


  Ablations isolate both components (27.69 to 16.07 SR without LoRA, to 6.15
  without in-context exemplars). A symbolic heuristic with ground-truth
  simulator state reaches 46.15 SR, well above ADAPT. Results come from 1
  deterministic run, 1 simulator, 3 affordance categories, single-view
  observation; geometric constraints and real robots are untested.


  If you benchmark embodied agents, assume static affordance is hiding most of
  your failure modes.
