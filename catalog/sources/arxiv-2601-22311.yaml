summary: "Large language model (LLM)-based agents exhibit strong step-by-step
  reasoning capabilities over short horizons, yet often fail to sustain
  coherent behavior over long planning horizons. We argue that this failure
  reflects a fundamental mismatch: step-wise reasoning induces a form of
  step-wise greedy policy that is adequate for short horizons but fails in
  long-horizon planning, where early actions must account for delayed
  consequences. From this planning-centric perspective, we study LLM-based
  agents in deterministic, fully structured environments with explicit state
  transitions and evaluation s"
