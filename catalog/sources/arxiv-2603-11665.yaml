brief: >-
  Supervised fine-tuning of a multimodal judge buys in-domain accuracy and
  loses the ability to handle an unseen answer format; RL training on the same
  mixed data keeps both. On MJ-Bench pairwise safety judging, a unified SFT
  judge falls to 49.40 Macro-F1, below the untuned zero-shot backbone at
  73.07, while the RL-trained judge reaches 82.23.


  MT-RL-Judge trains Qwen3-VL-30B-A3B-Instruct with GRPO and a reward
  combining answer correctness and a reasoning-first format constraint,
  jointly over 6 pointwise binary judging datasets: 3 AGIN subsets, SeeTRUE,
  ImageReward, UnsafeBench. Baselines are off-the-shelf prompting, per-task
  SFT, unified SFT, and per-task RL, all on the same backbone.


  In-domain the methods are close: MT-RL-Judge leads on SeeTrue at 83.67 but
  is behind SFT-Single on UnsafeBench (85.22 vs 90.28). RL-Single beats
  SFT-Single on 5 of 6 benchmarks, with +3.0 on SeeTrue and +4.63 on
  AGIN-Rationality.


  The single-task versus unified and SFT versus RL cells are all present,
  which isolates both factors, and the held-out pairwise test is a real format
  shift. But it is 1 backbone, 1 model size, binary classification only, and
  the OOD evidence rests on 2 MJ-Bench task columns.


  If you train judges, this says the measured in-domain gain of SFT can mask
  format brittleness that RL avoids.
