brief: >-
  Giving an LLM agent a parsed dependency graph of a repository, plus sparse
  keyword indexing over it, beats directory-traversal agents and embedding
  retrieval at finding the code that needs editing. LocAgent parses Python
  repos into a directed heterogeneous graph (directory/file/class/function
  nodes; contain/import/invoke/inherit edges) and exposes 3 tools:
  SearchEntity, TraverseGraph (multi-hop BFS), RetrieveEntity.


  On SWE-Bench-Lite (274 of 300 examples), LocAgent with Claude-3.5 reaches
  94.16 file Acc@5 and 77.37 function Acc@10, against 90.15 and 70.07 for
  OpenHands with the same model, and 84.67/58.76 for CodeRankEmbed. A
  fine-tuned Qwen2.5-32B scores 92.70 and 77.01 at $0.09 per example vs $0.66
  for Claude-3.5. Downstream repair with Agentless editing rises from 33.58 to
  37.59 Pass@10.


  Evidence is measured, with matched localization models across agent
  baselines and an ablation that isolates components: removing TraverseGraph
  drops function Acc@10 from 71.53 to 66.06, restricting to contain edges
  gives 66.42, and removing SearchEntity gives 53.28. Cost comparison is
  per-example API spend, not token-matched. The ablation uses only the 7B
  model.


  Loc-Bench, their new 560-example benchmark balanced across
  bug/feature/security/performance, shows a drop outside bug reports, which
  the authors attribute to training data skew. Python only; 1 fine-tuned model
  family; LoRA only.


  If you build retrieval for coding agents, dependency-graph indexing is the
  lever to try before dense embeddings.
