brief: >-
  Giving an LLM agent a graph index of a repository, rather than directory
  traversal or embeddings, lifts code localization most on cases where the
  target code is never named in the issue. LocAgent parses Python repos into a
  directed heterogeneous graph (directory/file/class/function nodes;
  contain/import/invoke/inherit edges) with sparse BM25-backed entity indexes,
  exposed through 3 tools: SearchEntity, TraverseGraph, RetrieveEntity.


  On SWE-Bench-Lite (274 of 300 examples retained), LocAgent with Claude-3.5
  reaches 94.16 file Acc@5 and 77.37 function Acc@10, against 90.15 and 70.07
  for OpenHands and 79.56/58.76 for Agentless. A fine-tuned Qwen2.5-32B scores
  92.70 and 77.01 at $0.09 per example versus $0.66 for Claude-3.5. Downstream
  repair with Agentless editing goes from 33.58 to 37.59 Pass@10. On the new
  Loc-Bench (560 samples, with 139 performance and 29 security issues),
  Claude-3.5 gets 86.07 file Acc@10.


  Ablations isolate the components: removing TraverseGraph drops function
  Acc@10 from 71.53 to 66.06, restricting to contain edges gives 66.42, and
  removing SearchEntity drops it to 53.28. Baselines run on matched models
  (GPT-4o, Claude-3.5), but costs come from third-party price lists and
  ablations use only the 7B model.


  Python only, 1 fine-tuned model family, and accuracy falls outside the
  bug-report category where training data was concentrated. Useful if you are
  choosing between embedding indexes and agentic traversal for repo-scale
  retrieval.
