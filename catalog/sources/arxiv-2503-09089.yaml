brief: >-
  Giving a code agent a graph index of a repository, rather than directory
  traversal, raises code localization accuracy, and a fine-tuned 32B open
  model can then match Claude-3.5 at a fraction of the cost. LocAgent parses
  Python repos into a directed heterogeneous graph of directories, files,
  classes and functions linked by contain, import, invoke and inherit edges,
  exposed through 3 tools: SearchEntity, TraverseGraph, RetrieveEntity.


  On SWE-Bench-Lite (274 of 300 examples retained) LocAgent with Claude-3.5
  reaches 94.16 file Acc@5 and 77.37 function Acc@10, against 90.15 and 70.07
  for OpenHands with the same model. Fine-tuned Qwen2.5-32B reaches 92.70 file
  Acc@5 at $0.09 per example versus $0.66 for Claude-3.5, an 86% reduction. On
  the new Loc-Bench (560 issues, including 139 performance and 29 security
  cases collected after training cutoffs) Claude-3.5 gets 86.07 file Acc@10
  versus 80.00 for OpenHands.


  Ablations isolate the components: removing SearchEntity drops file Acc@5
  from 88.32 to 68.98, removing TraverseGraph to 86.13, fixing hops at 1 to
  86.86. Downstream repair with the Agentless editor improves Pass@10 from
  33.58 to 37.59.


  Only Python, 1 fine-tuned model family, and accuracy drops outside bug
  reports, matching the training mix. Useful if you are building retrieval
  scaffolds for repo-level agents.
