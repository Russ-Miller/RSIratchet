brief: >-
  Giving an LLM agent a heterogeneous graph index of a repository (files,
  classes, functions linked by contain, import, invoke, inherit) plus
  multi-hop traversal tools beats directory-walking agents and embedding
  retrieval at finding which code an issue requires changing.


  LocAgent parses Python repos into a directed graph with sparse hierarchical
  and BM25 indexes, exposes 3 tools (SearchEntity, TraverseGraph,
  RetrieveEntity), and is evaluated on SWE-Bench-Lite (274 of 300 examples)
  and Loc-Bench, a new 560-example set balanced across bug reports, feature
  requests, security, and performance issues.


  With Claude-3.5 it reaches 94.16% file Acc@5 and 77.37% function Acc@10,
  above OpenHands (90.15 / 70.07) and SWE-agent. Fine-tuned Qwen2.5-32B
  reaches 92.70% file Acc@5 at $0.09 per example versus $0.66 for Claude-3.5.
  Downstream issue resolution rises from 33.58 to 37.59 Pass@10 over
  Agentless.


  Ablations on the 7B model isolate the components: dropping SearchEntity cuts
  function Acc@10 from 71.53 to 53.28, dropping TraverseGraph to 66.06, and
  limiting traversal to 1 hop to 66.79. Baselines run at matched model but not
  matched cost; the fine-tuning data is self-generated from Claude-3.5 and the
  32B model's own successful trajectories.


  Only Python, only Qwen-2.5-Coder fine-tunes, and accuracy drops outside the
  bug-report category, which dominated training. If you build retrieval for
  coding agents, the graph index rather than the agent loop is where the gain
  sits.
