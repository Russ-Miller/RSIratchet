brief: >-
  Giving an LLM agent a graph index of a repository, rather than directory
  traversal or embeddings, raises code localization accuracy and lets a
  fine-tuned 32B open model match Claude-3.5.


  LocAgent parses Python repos into a directed heterogeneous graph
  (directory/file/class/function nodes; contain, import, invoke, inherit
  edges) with sparse BM25-backed entity indexes, exposed to the agent as 3
  tools: SearchEntity, TraverseGraph, RetrieveEntity. Evaluated on 274
  SWE-Bench-Lite examples and Loc-Bench, a new 560-example set spanning bug
  reports, feature requests, security and performance issues.


  On SWE-Bench-Lite with Claude-3.5, LocAgent reaches 94.16 file Acc@5 and
  77.37 function Acc@10, above OpenHands (90.15 / 70.07) and SWE-agent (90.15
  / 64.60). Fine-tuned Qwen2.5-32B hits 92.70 file Acc@5 at $0.09 per example
  versus $0.66 for Claude-3.5. Downstream repair with Agentless editing
  improves Pass@10 from 33.58 to 37.59.


  Ablations isolate the components: dropping SearchEntity costs the most (file
  Acc@5 88.32 to 68.98), removing TraverseGraph or fixing hops=1 mainly hurts
  function level. Baselines run the same backbone models, though the ablation
  uses only the fine-tuned 7B.


  Boundaries: Python only, 1 fine-tuned model family, LoRA only, and
  performance drops outside the bug-report category, which dominated training
  trajectories.


  If you build retrieval for coding agents, this argues structural indexing
  beats embeddings on cost and accuracy.
