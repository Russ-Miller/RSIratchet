summary: >-
  Chain-of-Thought reasoning is widely used to improve the interpretability
  of multimodal large language models (MLLMs), yet the faithfulness of the
  generated reasoning traces remains unclear. Prior work has mainly focused
  on perceptual hallucinations, leaving reasoning level unfaithfulness
  underexplored. To isolate faithfulness from linguistic priors, we
  introduce SPD-Faith Bench, a diagnostic benchmark based on fine-grained
  image difference reasoning that enforces explicit visual comparison.
