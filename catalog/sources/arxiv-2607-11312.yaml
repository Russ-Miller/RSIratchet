brief: >-
  Video-LLMs can absorb a skill from a tutorial video and apply it
  immediately, but most of that gain disappears if the tutorial sits a couple
  of hours back in the stream. SLVMBench pairs 1 tutorial video with 1 target
  video, inserts distractor videos between them, and asks a 5-option question
  at a sub-second-calibrated cutoff just before a key step: 2,261
  human-annotated QA pairs from 1,220 videos, 11 categories, streams of 10
  minutes to 2 hours, all sourced after January 2025.


  Across 3 paradigms (no tutorial, tutorial immediately before, tutorial
  behind up to 2 hours of distractors), every model gained from the immediate
  tutorial: Gemini 3.1 Pro +29.47, video-SALMONN 2+ at 768 frames +29.72. With
  the long gap, gains collapsed for GPT-5.2 (2.21), GPT-4o (2.48), Qwen3-Omni
  (2.33), VideoLLaMA3 (0.64), while Gemini 3.1 Pro held 14.00 and
  video-SALMONN-S 14.95. Audio-visual models retained more than visual-only
  ones (Qwen2.5-Omni 7B 11.2 vs Qwen3-VL 8B 1.28), and raising frames from 64
  to 768 lifted retention from 9.60 to 15.79.


  The tutorial/no-tutorial/long-gap contrast isolates memory from priors, and
  Wilson intervals are reported; the audio and frame-count claims rest on
  cross-model comparisons, not controlled ablations. Gaps stop at 2 hours, and
  the setting is multiple-choice QA, not embodied action.


  If you count long-context video wins as memory, this separates holding
  tokens from retrieving procedure.
