summary: >-
  Large language model-based multi-agent systems are evolving from fixed
  interaction topologies toward dynamically orchestrated Agent Swarms.
  However, existing benchmarks are still largely based on single-agent or
  general-purpose agent tasks, making it difficult to systematically
  evaluate key orchestration capabilities. We propose SwarmBench, a
  benchmark that evaluates model performance from multiple perspectives,
  including accuracy, efficiency, cost, and process quality. Experimental
  results show that current models exhibit substantial differences in
