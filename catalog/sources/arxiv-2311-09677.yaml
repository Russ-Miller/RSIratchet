brief: >-
  Fine-tuning a model on only the answers it already gets right, and labelling
  the rest with "I am unsure", teaches refusal as a transferable skill rather
  than a per-dataset trick. R-Tuning splits instruction data into certain and
  uncertain sets by comparing the base model's prediction to the label,
  appends "I am sure"/"I am unsure" to each example, then fine-tunes normally;
  OpenLLaMA-3B, LLaMA-7B and LLaMA-13B were tested on 9 datasets, single-task
  on ParaRel and MMLU and multi-task on 5 datasets with HaluEval-QA held out.


  AP scores beat vanilla instruction tuning, with the gap widening with scale:
  MMLU in-domain 68.87 vs 51.93 at 13B, ParaRel out-of-domain 77.30 vs 64.12.
  On unanswerable questions the refusal rate reaches 96.62 on FalseQA and
  99.18 on NEC for LLaMA-7B, against 18.35 and 20.55 for vanilla tuning
  prompted that it may refuse.


  Evidence is measured, with several matched baselines: vanilla tuning, the
  pre-trained checkpoint scored on the same willingly-answered subset, an
  unsupervised variant (R-Tuning-U, k=10, temperature 0.7) and test-time
  consistency filtering (Vanilla-C). Learning uncertainty during training beat
  applying the same uncertainty filter at test time, which the authors explain
  only by hypothesis about hidden states.


  Boundaries: 1 model family at 3 sizes, short-answer QA and multiple choice
  only, confidence is binary, and knowledge membership is inferred from answer
  correctness rather than from pre-training data.


  If you are building abstention behaviour, this suggests putting it in the
  tuning data rather than the decoding loop.
