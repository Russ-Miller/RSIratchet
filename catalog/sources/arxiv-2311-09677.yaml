brief: >-
  Splitting instruction-tuning data by what a base model already knows, and
  training it to append "I am sure" or "I am unsure", gives a model that
  abstains on questions outside its parametric knowledge without losing
  accuracy on the rest. Learning uncertainty during training also beats
  estimating it at test time.


  R-Tuning runs the pre-trained model once over the training set, routes
  matched predictions to a certain set and mismatched ones to an uncertain
  set, then fine-tunes with the uncertainty phrase padded after the label.
  Base models are OpenLLaMA-3B, LLaMA-7B, LLaMA-13B; 9 datasets, single-task
  on ParaRel and MMLU and multi-task over ParaRel, MMLU, WiCE, HotpotQA, FEVER
  with HaluEval-QA held out.


  AP scores beat vanilla fine-tuning, with the gap widening at scale: MMLU
  in-domain 68.87 vs 51.93 at 13B, ParaRel OOD 77.30 vs 64.12. On unanswerable
  questions R-Tuning refuses 96.62% of FalseQA at 7B against 18.35% for
  vanilla. An unsupervised variant sampling k=10 at temperature 0.7 matches or
  beats the supervised one, and both beat Vanilla-C, which applies the same
  majority-vote uncertainty at test time only.


  Evidence is measured, with matched comparisons against vanilla tuning, a
  test-time uncertainty baseline, and perplexity and entropy checks separating
  the two data splits. Limits: 1 model family, confidence is binary
  sure/unsure, and no comparison to retrieval or verification methods.


  If you abstain by thresholding test-time confidence, training the abstention
  in may be cheaper and better.
