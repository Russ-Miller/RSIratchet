brief: >-
  Fine-tuning a model on its own errors, labelled "I am unsure", teaches
  refusal as a transferable skill, and learning uncertainty during training
  beats measuring uncertainty at test time.


  R-Tuning splits an instruction tuning set into certain data (model's
  pre-tuning prediction matches the label) and uncertain data, appends "I am
  sure"/"I am unsure" after the answer, then fine-tunes normally. Tested on
  OpenLLaMA-3B, LLaMA-7B and LLaMA-13B across 9 datasets, single-task on
  ParaRel and MMLU and multi-task on 5 datasets with HaluEval-QA held out,
  scored by Average Precision over combined answer and certainty confidence.


  AP gains over vanilla fine-tuning grow with size: MMLU in-domain 68.87 vs
  51.93 at 13B, ParaRel OOD 77.30 vs 64.12, while vanilla AP drops as models
  scale. On unanswerable questions, refusal rates reach 95.90 on FalseQA and
  98.17 on NEC at 13B, against 6.00 and 2.36 for vanilla. An unsupervised
  variant using 10-sample answer entropy (R-Tuning-U) matches or beats the
  supervised split, and beats Vanilla-C, which applies the same 10-sample
  consistency filter at test time (ParaRel ID 94.39 vs 87.92 at 7B).


  Measured, with matched baselines including a test-time uncertainty control
  and perplexity/entropy checks on the data split. Only LLaMA-family bases,
  short-form QA and multiple-choice, and confidence stays binary; the
  hidden-state explanation for the uncertainty-learning effect is argued, not
  tested.


  If you are building abstention, training on your model's own failures is
  cheaper at inference than sampling-based uncertainty and scored better here.
