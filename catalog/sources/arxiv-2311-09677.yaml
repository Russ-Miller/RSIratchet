brief: >-
  Fine-tuning a model on its own errors, labelled with "I am unsure", teaches
  refusal as a transferable skill, and learning uncertainty during training
  beats estimating uncertainty at test time. R-Tuning splits an instruction
  dataset into certain data D1 (model's pre-fine-tuning prediction matches the
  label) and uncertain data D0, appends "I am sure"/"I am unsure" after the
  answer, then fine-tunes normally.


  Tested on OpenLLaMA-3B, LLaMA-7B and LLaMA-13B across 9 datasets,
  single-task on ParaRel and MMLU and multi-task on 5 datasets with
  HaluEval-QA held out.


  AP scores beat vanilla instruction tuning, with the gap widening with scale:
  on MMLU in-domain, 68.87 vs 51.93 at 13B; on ParaRel out-of-domain, 77.30 vs
  64.12. Vanilla AP falls with scale in those settings. On unanswerable
  questions, refusal rates reach 96.62 on FalseQA, 99.18 on NEC and 95.45 on
  SelfAware at 7B, against 18.35, 20.55 and 34.79 for vanilla even when
  prompted that refusal is allowed. An unsupervised variant sampling 10
  answers at temperature 0.7 and refusing the 50% most uncertain usually
  scores higher still, and beats Vanilla-C, which applies the same 10-sample
  consistency filter at test time.


  The Vanilla-C comparison isolates train-time versus test-time uncertainty
  use; the mechanism offered for why training helps is a hypothesis about
  hidden states, not measured. 1 model family, no RLHF or chat models, and
  confidence remains binary.


  If you refuse at inference by sampling, consider moving that signal into
  training instead.
