brief: >-
  Fine-tuning a model on its own errors, labelled with "I am unsure", teaches
  refusal as a transferable skill and also improves answer accuracy on the
  questions it still attempts. R-Tuning splits an instruction-tuning set into
  certain data (model's pre-tuning prediction matches the label) and uncertain
  data, appends "I am sure"/"I am unsure" to each, then fine-tunes normally.


  Tested on OpenLLaMA-3B, LLaMA-7B and LLaMA-13B across 9 datasets,
  single-task on ParaRel and MMLU and multi-task on 5 datasets with
  HaluEval-QA held out, scored by Average Precision over confidence-ranked
  answers.


  AP gains over vanilla instruction tuning grow with size: MMLU in-domain
  68.87 vs 51.93 at 13B but 59.05 vs 58.16 at 7B; ParaRel OOD 77.30 vs 64.12
  at 13B, and 74.61 vs 78.08 at 7B, the one reversal. On unanswerable
  questions, refusal rates reach 95.90–99.18 for R-Tuning versus 2.07–34.79
  for vanilla, with baselines explicitly prompted that refusal was allowed.


  Comparisons are matched against vanilla tuning on the same data, and an
  unsupervised variant (10 samples, entropy split) plus a test-time
  uncertainty-filtering baseline (Vanilla-C) are both included; R-Tuning-U
  usually beats Vanilla-C, e.g. 64.69 vs 48.34 on MMLU ID at 7B. All results
  are self-reported on 1 model family, binary confidence only, no chat-tuned
  or larger models.


  If you are building abstention behaviour, the training-time route looks
  cheaper and better calibrated than sampling at test time.
