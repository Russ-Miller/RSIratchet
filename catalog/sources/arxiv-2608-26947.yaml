summary: >-
  Embodied agents need environments that are visually diverse, physically
  interactive, and changing over time. Procedural simulators can generate
  large interactive scene collections, and recent 4D generators produce
  compelling visual dynamics. Combining these properties in one environment,
  however, still demands extensive manual effort, and the result is rarely
  editable or controllable enough to reuse at scale. We present 4DSynth, a
  controllable procedural system that turns a natural-language description,
