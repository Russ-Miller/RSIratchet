brief: >-
  Logical validity and real-world plausibility occupy nearly the same
  direction in LLM activation space, and the degree of that overlap predicts
  how strongly a model's validity judgments are driven by content.


  The setup is syllogistic reasoning: 1,280 syllogisms covering all 64
  syllogism types, balanced for valid/invalid and plausible/implausible
  conclusions, plus a matched plausibility (true/false) classification task.
  10 instruction-tuned models from Qwen-2.5, Qwen-3 and Gemma-3 (4B-32B) were
  tested zero-shot and with CoT, with difference-in-means vectors extracted
  per layer and used for steering.


  Qwen2.5-32B-Instruct showed a content effect of 0.348 zero-shot, falling to
  0.096 with CoT; Qwen3-14B went from 0.213 to 0.014. Validity and
  plausibility vectors reached steering power near 1 at late layers, with
  cosine similarity 0.48 to 0.64, against 0.10 to 0.13 for hypernymy and -0.12
  to -0.17 for harmlessness. A mixed-effects regression over 57 model-prompt
  points gave similarity as a positive predictor of content effect (beta =
  0.557, p = 0.017). A task-difference vector scaled by alpha = 1.5 cut CE to
  0.072 and 0.043 while raising accuracy from 81.62 to 82.21 and 86.54 to
  96.70.


  Causal direction is tested by cross-task steering, and the hypernymy and
  harmlessness controls rule out generic binary-task artefacts. The account
  does not explain why CoT lowers the behavioral effect despite similar
  geometry, covers only syllogisms, only residual-stream activations at the
  final token, and 2 model families plus Gemma-3.


  If you treat content bias as a prompting problem, this locates it in
  geometry instead.
