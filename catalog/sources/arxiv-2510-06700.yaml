brief: >-
  Content effects in syllogistic reasoning trace to geometry: the directions
  encoding logical validity and factual plausibility are strongly aligned in
  model activation space, and the degree of alignment predicts how much a
  model's validity judgments follow believability.


  The setup uses 1,280 syllogisms covering all 64 syllogism types, built from
  10 taxonomic term triples, with conclusions that are either true or false in
  the world. 10 instruction-tuned models from Qwen-2.5, Qwen-3 and Gemma-3
  (4B-32B) were tested zero-shot and with CoT, with difference-in-means
  vectors extracted per layer and used for steering.


  Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, dropping to 0.096
  with CoT; Qwen3-14B goes 0.213 to 0.014. Validity-plausibility cosine
  similarity runs 0.48 to 0.64, against 0.10 to 0.13 for hypernymy and -0.12
  to -0.17 for harmlessness. A mixed-effects regression over 57 model-prompt
  points gives similarity as a positive predictor of content effect (beta =
  0.557, p = 0.017). A task-difference vector scaled by alpha = 1.5 cuts CE to
  0.072 and 0.043 while accuracy rises from 81.62 to 82.21 and 86.54 to 96.70.


  Causality is measured, not just argued: plausibility vectors flip validity
  judgments and vice versa, with 2 control concepts ruling out shared prompt
  format. The alignment-CE link remains correlational across models, and
  alignment does not explain why CoT reduces bias.


  Boundaries: syllogisms only, binary plausibility, residual-stream
  activations at 1 token position, 2 model families plus Gemma.


  If you treat logical reasoning failures as prompt-level, this locates one of
  them in representation geometry and shows an inference-time fix.
