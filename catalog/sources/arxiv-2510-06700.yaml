brief: >-
  Logical validity and real-world plausibility occupy nearly the same linear
  direction inside LLM activation space, and how closely the 2 directions
  align predicts how much a model's validity judgments get contaminated by
  content.


  The test bed is 1,280 syllogisms covering all 64 syllogism types, balanced
  for valid/invalid and plausible/implausible conclusions, plus a matched
  plausibility (true/false) classification task. 10 instruction-tuned models
  from Qwen-2.5, Qwen-3 and Gemma-3 (4B-32B) were run zero-shot and with CoT.
  Difference-in-means vectors were extracted per layer and used for steering.


  Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, dropping to 0.096
  with CoT; Qwen3-14B goes 0.213 to 0.014. Validity-plausibility cosine
  similarity runs 0.48 to 0.64, against 0.10 to 0.13 for hypernymy and -0.12
  to -0.17 for harmlessness. A mixed-effects fit over 57 model-prompt points
  gives similarity as a positive predictor of content effect (β = 0.557, p =
  0.017). Plausibility vectors flip validity judgments and vice versa. A
  task-difference vector scaled by α = 1.5 cuts CE to 0.072 and 0.043 while
  accuracy moves 81.62 to 82.21 and 86.54 to 96.70.


  The causal claim is measured, not just argued, with 2 control concepts
  ruling out generic binary-task or lexical overlap artifacts. Debiasing was
  demonstrated on 2 models, zero-shot only, at hand-picked layers with a tuned
  scalar; representations were read only at the final pre-answer token, so why
  CoT reduces bias despite equal alignment is unexplained.


  If you treat content effects as a prompting problem, this locates them in
  geometry you can intervene on directly.
