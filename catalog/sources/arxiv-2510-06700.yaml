brief: >-
  Validity and plausibility are encoded as nearly the same direction in LLM
  activation space, and the degree of that overlap predicts how strongly a
  model's logical judgments are swayed by whether the conclusion is factually
  true.


  The work uses 1,280 syllogisms covering all 64 syllogism types, balanced for
  plausible vs implausible conclusions, across 10 instruction-tuned models
  from Qwen-2.5, Qwen-3, and Gemma-3 (4B-32B), under zero-shot and
  chain-of-thought prompting. Difference-in-means vectors for validity and
  plausibility are extracted per layer and used as steering vectors; hypernymy
  and harmful/harmless classification serve as controls for shared prompt
  format.


  Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, falling to 0.096
  with CoT; Qwen3-14B falls from 0.213 to 0.014. Validity-plausibility cosine
  similarity is 0.48 to 0.64, against 0.10 to 0.13 for hypernymy and -0.12 to
  -0.17 for harmlessness. A mixed-effects regression over 57 model-prompt
  pairs finds similarity predicts content effect (β = 0.557, p = 0.017). A
  task-difference vector scaled by α = 1.5 cuts CE to 0.072 for Qwen2.5-32B
  (accuracy 81.62 to 82.21) and to 0.043 for Qwen3-14B (86.54 to 96.70).


  The causal claim is measured, not just argued: cross-task steering flips
  judgments, and the control concepts rule out the binary-task-format
  explanation. But the correlation is across models rather than within, and
  the debias layer and α were selected post hoc per model.


  Untested: why CoT lowers content effects despite unchanged vector alignment,
  non-syllogistic reasoning, non-Qwen/Gemma families, and anything beyond
  last-token residual-stream activations.


  If you treat content bias as a prompting problem, this suggests it is
  geometric and addressable without retraining.
