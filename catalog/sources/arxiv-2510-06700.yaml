brief: >-
  Logical validity and real-world plausibility sit on nearly the same linear
  direction inside LLMs, and that geometric overlap is what produces belief
  bias in syllogistic reasoning.


  The study uses 1,280 syllogisms covering all 64 syllogism types, balanced
  for plausible vs implausible conclusions, plus a plausibility (true/false)
  classification task on the conclusions and 2 control tasks (hypernymy,
  harmful/harmless). 10 instruction-tuned models from Qwen-2.5, Qwen-3, and
  Gemma-3, 4B to 32B, were tested zero-shot and with CoT; difference-in-means
  vectors were extracted per layer and used for steering.


  Qwen2.5-32B-Instruct shows a content effect of 0.348 zero-shot, falling to
  0.096 with CoT; Qwen3-14B goes from 0.213 to 0.014. Validity and
  plausibility vectors reach steering power near 1 at late layers and are
  aligned at cosine 0.48 to 0.64, versus 0.10 to 0.13 for hypernymy and -0.12
  to -0.17 for harmlessness. Cross-task steering flips judgments in both
  directions. A mixed-effects regression over 57 model-prompt points makes
  alignment a positive predictor of content effect (beta = 0.557, p = 0.017).


  Causality is tested by intervention, not just correlation, and the control
  concepts rule out a generic binary-classification artifact. A
  task-difference vector scaled by alpha = 1.5 cuts CE to 0.072 for
  Qwen2.5-32B (accuracy 81.62 to 82.21) and to 0.043 for Qwen3-14B (86.54 to
  96.70).


  Only syllogisms, only 2 model families plus Gemma-3, only last-token
  residual stream activations; the authors do not explain why CoT reduces bias
  despite unchanged geometry, nor why the conflation arises.


  If you treat belief bias as a prompting problem, this suggests it is a
  representational one, fixable at inference time without retraining.
