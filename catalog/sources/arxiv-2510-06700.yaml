brief: >-
  Logical validity and real-world plausibility sit on nearly the same linear
  direction inside instruction-tuned LLMs, and that geometric overlap is what
  produces syllogistic content effects. Steering along a plausibility
  direction flips validity judgments, and vice versa.


  The setup is 1,280 syllogisms covering all 64 syllogism types, balanced
  between plausible and implausible conclusions, evaluated on 10 models from
  Qwen-2.5, Qwen-3 and Gemma-3 at 4B–32B under zero-shot and chain-of-thought
  prompting. Directions are difference-in-means vectors at the last token
  before the label, with hypernymy and harmlessness classification as control
  concepts.


  Zero-shot Qwen2.5-32B-Instruct has a content effect of 0.348, falling to
  0.096 with CoT; Qwen3-14B goes from 0.213 to 0.014. Validity and
  plausibility vectors align at cosine 0.48 to 0.64, versus 0.10 to 0.13 and
  −0.12 to −0.17 for the controls. Across 57 model–prompt pairs, average
  similarity predicts content effect (β = 0.557, p = 0.017). A task-difference
  vector scaled by α = 1.5 cuts CE to 0.072 and 0.043 while accuracy moves
  from 81.62 to 82.21 and 86.54 to 96.70.


  The cross-task steering is a causal manipulation with matched controls; the
  similarity-to-behaviour link is correlational across models. Alignment does
  not differ between zero-shot and CoT (p = 0.625), so the geometry does not
  explain why CoT reduces bias. Only syllogisms, 1 token position, 3 model
  families, no account of why training induces the conflation.


  If you treat content effects as a surface prompting artifact, this locates
  them in representation and gives an inference-time fix.
