brief: >-
  Logical validity and real-world plausibility occupy nearly the same linear
  direction inside LLM activations, and that geometric overlap is what
  produces belief bias in syllogistic reasoning. Steering along the
  plausibility (truth) direction flips validity judgments, and the validity
  direction flips truth judgments.


  The setup is 1,280 syllogisms covering all 64 syllogism types, balanced for
  plausible vs implausible conclusions, plus a plausibility classification
  task over the same conclusions and 2 control tasks (hypernym/hyponym,
  harmful/harmless). 10 instruction-tuned models from Qwen-2.5, Qwen-3 and
  Gemma-3, 4B-32B, under zero-shot and CoT prompting; concept directions are
  difference-in-means vectors at the final token.


  Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, dropping to 0.096
  with CoT; Qwen3-14B goes from 0.213 to 0.014. Validity-plausibility cosine
  similarity runs 0.48 to 0.64, versus 0.10 to 0.13 for hypernymy and -0.12 to
  -0.17 for harmlessness. In a mixed-effects model over 57 model-prompt
  points, similarity predicts content effect (beta = 0.557, p = 0.017). A
  task-difference vector scaled by alpha = 1.5 cuts CE to 0.072 and 0.043
  while accuracy moves from 81.62 to 82.21 and 86.54 to 96.70.


  The causal claim is measured, with control concepts isolating the effect
  from shared prompt format. Unexplained: CoT lowers bias while similarity
  stays unchanged (p = 0.625), and only syllogisms, last-token residual
  stream, and 3 model families were tested.


  Treat content effects as a representational entanglement you can intervene
  on, not just a prompting artifact.
