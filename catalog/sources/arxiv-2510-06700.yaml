brief: >-
  Logical validity and real-world plausibility are encoded as nearly the same
  direction in LLM activation space, and the degree of that alignment predicts
  how strongly a model's validity judgments are swayed by content.


  The setup is syllogistic reasoning: 1,280 syllogisms covering all 64
  syllogism types, balanced across valid/invalid and plausible/implausible
  conclusions, run on instruction-tuned Qwen-2.5, Qwen-3 and Gemma-3 models
  from 4B to 32B under zero-shot and chain-of-thought prompting.
  Difference-in-means vectors for validity and plausibility were extracted per
  layer and used as steering vectors.


  Qwen2.5-32B-Instruct shows a content effect of 0.348 zero-shot, dropping to
  0.096 with CoT; Qwen3-14B goes from 0.213 to 0.014. Validity and
  plausibility vectors reach cosine similarity 0.48 to 0.64, against 0.10 to
  0.13 for hypernymy and -0.12 to -0.17 for harmlessness. A mixed-effects
  regression over 57 model-prompt points finds similarity predicts content
  effect (beta = 0.557, p = 0.017). Steering with the task-difference vector
  at alpha = 1.5 cuts CE to 0.072 and 0.043 while accuracy rises from 81.62 to
  82.21 and 86.54 to 96.70.


  The causal claim is measured, with hypernymy and harmlessness as matched
  binary-task controls and cross-task steering in both directions. The
  correlation rests on 3 model families, 1 task type, and activations only at
  the final token before the judgment. The authors do not explain why CoT
  lowers bias despite identical representational geometry, nor why the
  conflation arises.


  If you treat content effects as a behavioural quirk, this gives you a
  geometric handle on them and an inference-time fix.
