brief: >-
  Logical validity and real-world plausibility are encoded as nearly the same
  direction in LLM activation space, and the degree of that overlap predicts
  how much a model's validity judgments are swayed by content. Steering
  vectors for one concept flip judgments on the other task.


  The setup: 1,280 syllogisms covering all 64 syllogism types, balanced for
  valid/invalid and plausible/implausible conclusions, plus a plausibility
  (true/false) classification task over the same conclusions, run on 10
  instruction-tuned Qwen-2.5, Qwen-3 and Gemma-3 models from 4B to 32B under
  zero-shot and chain-of-thought prompting. Concept directions come from
  difference-in-means at the last token before the label.


  Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, dropping to 0.096
  with CoT; Qwen3-14B 0.213 to 0.014. Validity-plausibility cosine similarity
  runs 0.48 to 0.64, versus 0.10 to 0.13 for hypernymy and -0.12 to -0.17 for
  harmlessness. A mixed-effects regression over 57 model-prompt points finds
  similarity predicts content effect (beta = 0.557, p = 0.017). A
  task-difference debiasing vector scaled by alpha = 1.5 cuts CE to 0.072 and
  0.043 while accuracy moves from 81.62 to 82.21 and 86.54 to 96.70.


  The causal claim is tested by intervention, not just correlation, and the
  hypernymy and harmlessness controls rule out generic binary-task artifacts.
  But similarity does not differ between prompting conditions (p = 0.625), so
  it does not explain why CoT reduces the bias; analysis covers only
  residual-stream activations at 1 token position, 3 model families, and
  syllogisms.


  If you treat content effects as a surface behavior, this gives a
  representational handle and an inference-time fix that needs no retraining.
