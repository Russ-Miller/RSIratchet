brief: >-
  Logical validity and real-world plausibility are encoded as nearly the same
  direction in LLM activation space, and that geometric overlap predicts how
  much a model's validity judgments get contaminated by content.


  The setup: 1,280 syllogisms covering all 64 syllogism types, balanced for
  plausible vs implausible conclusions, plus a matched plausibility
  (true/false) task on the same conclusions. 10 instruction-tuned models from
  Qwen-2.5, Qwen-3 and Gemma-3, 4B-32B, under zero-shot and chain-of-thought
  prompting. Concept directions come from difference-in-means on the model's
  own predicted labels, applied as steering vectors.


  Results: Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, falling
  to 0.096 with CoT; Qwen3-14B goes 0.213 to 0.014. Validity and plausibility
  vectors reach steering power near 1 at late layers and have cosine
  similarity 0.48 to 0.64, against 0.10 to 0.13 for hypernymy and -0.12 to
  -0.17 for harmlessness. Across 57 model-prompt pairs, similarity predicts
  content effect (beta = 0.557, p = 0.017). A task-difference vector scaled by
  alpha = 1.5 cuts CE to 0.072 and 0.043 while raising accuracy from 81.62 to
  82.21 and 86.54 to 96.70.


  Evidence is causal on the intervention side: cross-task steering flips
  judgments in both directions, and 2 unrelated binary tasks with similar
  prompt structure serve as controls for the similarity claim. The predictive
  link is correlational across models.


  Boundaries: only residual-stream activations at the last token before the
  label, syllogisms only, and no account of why CoT reduces the bias despite
  showing the same representational entanglement.


  If you treat content effects as a surface prompting artifact, this locates
  them in geometry you can measure and partly cancel without retraining.
