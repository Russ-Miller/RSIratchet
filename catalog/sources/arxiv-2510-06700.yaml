brief: >-
  Logical validity and real-world plausibility are encoded as nearly the same
  direction inside instruction-tuned LLMs, and that geometric overlap is what
  produces belief bias in syllogistic reasoning.


  The study builds 1,280 syllogisms covering all 64 syllogism types, balanced
  for valid/invalid and plausible/implausible conclusions, plus a separate
  plausibility (true/false statement) task and 2 control tasks (hypernymy,
  harmful/harmless). 10 LLMs from Qwen-2.5, Qwen-3 and Gemma-3, 4B-32B, are
  tested zero-shot and with CoT; difference-in-means vectors are extracted per
  layer and used for steering.


  Qwen2.5-32B-Instruct shows content effect 0.348 zero-shot, dropping to 0.096
  with CoT; Qwen3-14B goes from 0.213 to 0.014. Validity and plausibility
  vectors reach steering power near 1 at late layers and have cosine
  similarity 0.48 to 0.64, versus 0.10 to 0.13 for hypernymy and -0.12 to
  -0.17 for harmlessness. A mixed-effects fit over 57 model-prompt pairs finds
  similarity predicts content effect (beta = 0.557, p = 0.017). A
  task-difference vector scaled by alpha = 1.5 cuts content effect to 0.072
  and 0.043 while accuracy moves from 81.62 to 82.21 and 86.54 to 96.70.


  The causal claim is measured, with cross-task steering in both directions
  and 2 control concepts ruling out shared prompt format; the
  similarity-to-bias link is correlational across models. Notably, CoT lowers
  bias without lowering vector alignment, so the representational account does
  not explain that case. Only syllogisms, last-token residual stream, 3 model
  families.


  If you treat belief bias as a prompting artifact, this locates it in
  representation geometry instead.
