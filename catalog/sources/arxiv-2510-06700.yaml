summary: "Both humans and large language models (LLMs) exhibit content
  effects: biases in which the plausibility of the semantic content of a
  reasoning problem influences judgments regarding its logical validity. While
  this phenomenon in humans is best explained by the dual-process theory of
  reasoning, the mechanisms behind content effects in LLMs remain unclear. In
  this work, we address this issue by investigating how LLMs encode the
  concepts of validity and plausibility within their internal representations.
  We show that both concepts are linearly represented and strongly aligned in
  representational g"
