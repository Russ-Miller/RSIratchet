brief: >-
  Weighting debate agents by how well they predict their peers' beliefs,
  rather than by their own stated confidence, can recover correct answers when
  the majority of agents is confidently wrong. The claim is that truth-holders
  anticipate the crowd's misconception while the crowd assumes consensus,
  giving a score gap that can be amplified into convergence toward truth.


  AceMAD runs 4 phases per round: argumentation, private self-belief plus
  peer-belief prediction, Brier scoring against the realized peer average, and
  exponential weight updates. Evaluation uses challenging subsets of 6
  benchmarks (ARC-C, LogiQA, MMLU-Pro, TruthfulQA, MedQA, BBH) with N=5
  agents, against majority voting and decentralized, centralized and sparse
  MAD.


  On the challenging subsets, majority voting averages 14.0% and standard MAD
  22.1%. With GPT-4o-mini, AceMAD at T=3 reaches 49.92% average versus 28.62%
  for decentralized MAD. Gains concentrate on BBH (78.28 vs 47.24) and ARC-C;
  LogiQA and MMLU-Pro move little or drop.


  Ablations isolate the mechanism: replacing peer prediction with
  self-reported confidence, or with uniform weights, both lose accuracy, and 3
  different heterogeneity sources all beat homogeneous MAD.


  Results are unstable across rounds and models. On Qwen3-235B-A22B, T=5 falls
  to 52.98% average with TruthfulQA dropping 42.60 below the best baseline,
  and accuracy plateaus or declines past N=10. Heterogeneity is hand-induced
  by personas and sampling temperature, not naturally occurring, and only
  filtered subsets were tested.


  Treat debate weighting by second-order belief as promising but round- and
  size-sensitive.
