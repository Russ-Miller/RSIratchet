summary: >-
  While scaling individual Large Language Models (LLMs) has delivered
  remarkable progress, the next frontier lies in scaling collaboration
  through multi-agent systems (MAS). However, purely autonomous MAS remain
  ''closed-world'' systems, constrained by the static knowledge horizon of
  pre-trained models. This limitation makes them brittle on tasks requiring
  knowledge beyond training data, often leading to collective failure under
  novel challenges. To address this, we propose the Human-In-the-Loop
  Multi-Agent Collaboration (HILA) framework, a principled paradigm for
  human--agent collaboration. HIL
