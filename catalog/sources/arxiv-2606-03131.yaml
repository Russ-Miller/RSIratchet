summary: Reward models are central to large language model (LLM) alignment,
  but they remain vulnerable to reward hacking. To evaluate reward-model
  robustness, we introduce RewardHackBench containing 13 reward-hacking
  patterns covering real life high-stakes domains and general settings, and we
  find severe failures on specific subcategories across eight reward models.
  To mitigate these failures, we propose HARVE, a training-free reward-head
  editing method for scalar reward models. Instead of fine-tuning the reward
  model, HARVE identifies a multi-directional hacking subspace from residual
  stream direction
