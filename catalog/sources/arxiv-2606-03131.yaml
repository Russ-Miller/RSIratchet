brief: >-
  Reward hacking in scalar reward models can be suppressed without any
  gradient updates, by deleting the component of the linear reward head that
  lies in a subspace spanned by hacking directions read off from
  residual-stream differences between gold and hacked responses.


  HARVE is evaluated on RewardHackBench, a new benchmark of 1,203 matched
  gold-hacked pairs across 13 subcategories (law, policy, compliance plus
  general-purpose attacks from LLMBar via RewardBench), with 8 open-source
  reward models from 0.6B-20B, plus RM-Bench Hard for transfer. Hacked
  responses were written to preserve length and structure; the professional
  subset has a hacked-to-gold word ratio of 1.01.


  Baseline gold-preference rates run 67.53% to 84.07%, with subcategory
  collapses such as 21.43% on hedge stripping for GRM-Llama-3.2-3B. HARVE
  raises target-subcategory rates by +21.1 points over baseline and +13.7 over
  the stronger fine-tuning baseline (gains +10.5 to +32.3), and improves
  RM-Bench by 2.4 points on average, +20.65 on RM-Mistral-7B.


  The effect is measured against 3:1 and 5:1 data-augmented fine-tuning
  baselines, with ablations: joint subspace removal gives +16.67 points on
  targets versus near-zero for style-only or style-orthogonal-only, and
  fooled-pair filtering lifts cosine alignment from -0.05 to +0.24.


  The edit strength alpha is tuned per model on a dev split, target
  subcategories are chosen per model, and nothing is tested inside an RLHF
  loop or on closed-source or generative pairwise judges.


  If you train reward models, try head-space editing before collecting
  adversarial preference data.
