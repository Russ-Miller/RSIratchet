brief: >-
  Rewriting rather than refusing can cut context-dependent sensitive leakage
  at modest utility cost, but only in models with enough reasoning capacity to
  edit; smaller ones just delete text.


  SemSIEdit runs a dual-agent Evaluator-Editor loop at inference time,
  critiquing and rewriting spans flagged as sensitive identity attributes,
  reputation-harmful content, or incorrect hazardous information, tested on
  SemSI-Bench across 13 models including GPT-5, Grok-4.1-Fast, DeepSeek-V3,
  Qwen3, Llama-3.3 and Gemma-3.


  Average leakage occurrence fell from 0.78 to 0.51 (34.6% reduction) with
  utility dropping 6.04 to 5.45 (9.8% cost). External guardrails barely
  detected the category at all: LlamaGuard 4 F1 0.01, GPT-OSS-Safeguard-20B
  0.17. GPT-5 lengthened answers by +110 characters and held utility at 8.58,
  while Llama-3.3-70B shrank from 1479 to 394 characters, with other models
  losing -50% to -73%. Gemma-3-4B stayed near 90% occurrence after exhausting
  t = 3 iterations.


  The design includes a prompt-only single-pass control, a per-iteration
  ablation, and a thinking-mode toggle on Qwen3-8B showing reasoning raises
  baseline leakage (84.0% vs 74.0%) but improves the defense (42.0% vs 47.0%).
  Scoring is LLM-as-judge with GPT-5, audited against humans on 400 responses
  (privacy agreement 96.97% and 99.50%).


  False-information claims rest on small manual audits (88 GPT-5 responses, 10
  per model in Table 3), and latency rises 2x to 4x. Treat semantic-privacy
  filtering as reasoning-gated, not a drop-in filter.
