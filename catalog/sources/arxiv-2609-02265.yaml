brief: >-
  Separating a genuine change of user preference from a planted one cannot be
  done by any rule reading only recency and provenance, and treating
  authenticity as a latent state to be inferred improves both adaptation and
  security at once. CAPTURE tracks user state with a neural ODE, writes
  hypotheses into a 3-layer ledger (stable, contextual, transient),
  quarantines uncertain claims, and asks a clarifying question when action
  entropy is high; it is evaluated on D-PrefGuard, a synthetic benchmark of
  2,400 longitudinal episodes across 5 tracks, with Qwen3-8B and Llama-3.1-8B
  backbones.


  On 480 held-out episodes from 96 users, CAPTURE reaches 71.5% win rate,
  11.5% fixed-policy poisoning, and 83.5% genuine-update adherence, against
  Provenance-only at 20.0% poisoning and 74.1% adherence, and Recency RAG at
  51.6% poisoning and 85.7% adherence. Against an adaptive paraphrase-search
  attacker with the released weights, poisoning rises to 24.7%, statistically
  inseparable from Provenance-only's 22.1% (difference 2.6 points, [-1.9,
  7.2], p = 0.29).


  Evidence is unusually well isolated: a supervised Transformer baseline given
  identical labels, history, extractor, selector, and clarification channel
  reaches 69.3% win and 15.9% poisoning, leaving only 2.2 points of win (p =
  0.011) and 4.4 of poisoning (p = 0.003) attributable to architecture.
  Component ablations, 3 seeds, and zero-shot transfer to HorizonBench plus a
  40-participant replay are reported.


  The attack data is synthetic and author-constructed; poisoning robustness
  does not demonstrably transfer, and the adaptive-attack advantage
  disappears.


  Treat the security gain as conditional on the attacker not optimizing
  against your gate.
