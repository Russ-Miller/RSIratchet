summary: The hidden states of large language models (LLMs) are known to
  capture rich information relating to model knowledge and behavior that can
  be hard to extract from examination of input and output alone. As LLM-based
  systems increasingly interface with the external world, one area of concern
  is detecting incorrect or improper use of tools. Motivated by this, we study
  the effectiveness of using linear probes to detect incorrect tool-calls,
  measuring probe efficacy across 18 tool-calling LLMs evaluated on the
  Berkeley Function Calling Leaderboard. Overall, we find that probing is an
  effective means
