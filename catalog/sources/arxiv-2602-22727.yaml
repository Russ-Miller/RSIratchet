brief: >-
  Object hallucination in vision-language models can be cut at inference by
  splitting hidden states into mutually orthogonal visual-evidence,
  anti-prior, and residual subspaces and shrinking only the latter two, with
  no reference model and no second forward pass.


  HulluEdit estimates the visual subspace online by weighted SVD over cached
  visual tokens from an anchor layer (layer 26 in LLaVA-1.5-7B), builds an
  anti-prior subspace inside its orthogonal complement from a rolling text
  cache, and edits the final layer in closed form with strengths gated on
  visual and prior conflict ratios. Evaluated on POPE, CHAIR over 500 MSCOCO
  images, and MME, across LLaVA-1.5-7B/13B, Qwen-VL-Chat-7B, MiniGPT-4,
  mPLUG-Owl2.


  On POPE adversarial, LLaVA-1.5-7B accuracy rises from 77.6 greedy to 82.5,
  above VAF at 80.1. CHAIRi on LLaVA-1.5 drops from 7.08 to 4.18 and on
  mPLUG-Owl2 from 8.62 to 3.35, beating Nullu at 5.30 and 5.77. MME shifts are
  mixed: Existence +13.33, Position +22.23, Color +7.22, Count -13.33.


  Measured, with baselines run under identical prompts and decoding, and an
  8-variant ablation isolating layer choice, weighted vs uniform SVD,
  orthogonal complement, adaptive strengths and gating; removing gating raises
  CHAIRi to 7.70. Throughput is shown as a figure only, not numbers.


  MiniGPT-4 CHAIRs is 23.60 versus Nullu 21.40, so the gain is not uniform;
  generations capped at 64 tokens, and counting degrades.


  If you need hallucination reduction without extra passes, this is a
  plausible drop-in.
