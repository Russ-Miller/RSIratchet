summary: >-
  Agent harnesses shape how language-model agents use instructions, tools,
  and runtime components, but adapting these harnesses requires costly
  verification. Existing propose-and-verify methods typically score every
  candidate on a fixed task set, wasting rollouts on unrelated behaviors and
  allowing aggregate scores to obscure specific regressions. We introduce
  HarnessLens, a budget-aware framework for automated harness evolution.
  HarnessLens jointly explores the task space and user-configurable
  components, derives candidate modifications from execution trajectories,
  and selectively verifies each
