brief: >-
  Offline graph matching between failed and expert trajectories yields error
  corrections that beat iterative test-time self-reflection, in 1 execution
  instead of 5.


  Experience Memory Graph (EMG) converts exploration and expert trajectories
  into directed action decision graphs where nodes are normalized actions and
  edges carry preceding observations, then uses a Fused Gromov-Wasserstein
  solver to extract common subgraphs (workflows) and edit paths (corrections).
  These are distilled by an LLM into node insights, with edges holding
  cross-task insights between similar queries. Tested on ALFWorld and
  ScienceWorld (seen and unseen splits) with Qwen3-4B and DeepSeek-V4-Flash
  against ReAct, Reflexion, ExpeL, CDMem, and MemP.


  Average across 6 metrics: 40.69 vs 29.83 for the best baseline with
  Qwen3-4B, and 61.92 vs 51.70 with DeepSeek-V4-Flash. On ALFWorld seen with
  Qwen3-4B, iterative baselines span 27.14%-38.57% over 5 iterations while EMG
  reaches 53.57% in 1. Matching costs 0.4892 s/pair (ALFWorld) and 2.8766
  s/pair (ScienceWorld) offline.


  Ablations isolate the 2 memory types: node insights alone lift DeepSeek
  unseen ScienceWorld SR from 13.74% to 23.22%; edges add most for the small
  model (9.48% to 16.11%). Iterative baselines were given 5 iterations, so the
  comparison is not matched on token budget in EMG's favour.


  EMG depends on pre-collected expert demonstrations from ETO; only 1,275 of
  3,321 ALFWorld training tasks had pairs, and no demonstration-free setting
  was tested. Only 2 embodied benchmarks and 2 models.


  If you have expert trajectories, offline correction extraction may be
  cheaper and better than reflection loops.
