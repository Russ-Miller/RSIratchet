summary: >-
  Large Language Model (LLM)-based automatic Multi-Agent Systems (MAS)
  generation has become a crucial frontier for tackling complex tasks.
  However, existing methods face a dilemma between model capability and
  experience retention. Inference-time MAS leverages frozen frontier LLMs
  but repeats identical searches without learning from past experience.
