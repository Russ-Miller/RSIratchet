summary: >-
  Recent advances in large language models and multimodal models have pushed
  remote sensing (RS) processing from simple perception models to agentic
  systems designed to tackle complex, long-horizon RS tasks. However,
  existing systems often rely on monolithic decision-making frameworks,
  which fail to accommodate the multi-stage, interdependent nature of RS
  tasks. This centralized approach leads to challenges such as unstable task
