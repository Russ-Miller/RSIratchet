brief: >-
  Exception handling at the repository level remains mostly unsolved for LLMs:
  even the best configuration tested passes only 29% of executable cases.
  CatchAll shows that mined API-to-exception statistics, not retrieval or
  multi-agent orchestration, is the component that carries most of the gain.


  CatchAll prompts an LLM with 3 knowledge layers: an API-exception mapping
  mined from try-catch blocks, a depth-bounded cross-file call trace, and a
  handling pattern abstracted from the top-20 retrieved historical try-catch
  blocks. Evaluation uses 2 new Android benchmarks, RepoExEval (3,200
  repositories, 120,000 try-catch blocks, 1,000 sampled test instances) and
  RepoExEval-Exec (4 projects, 100 instances, 174 unit tests), against 6
  baselines under GPT-4o and DeepSeek-V3.


  With GPT-4o, CatchAll reaches 0.31 CodeBLEU, 60.1% IntentAcc, 29% Pass@1,
  versus RepoCoder at 0.27, 48.0%, 25%. Exception type accuracy is 53.6%
  versus 41.1% for KPC. Ablation: removing the API-Exception mapping drops
  Pass@1 to 9%; removing call traces gives 23%, removing patterns 21%.


  The ablation isolates components cleanly and 2 backbones are tested.
  Execution-based numbers rest on 4 repositories only; Java/Android only;
  contamination control is date filtering plus a CodeSearchNet overlap check
  showing 4.4% (143 out of 3,233 repositories).


  Treat repository-level exception handling as an open problem, and mined
  API-exception statistics as the lever worth pulling first.
