brief: >-
  LLMs write poor exception handlers at repository scale, and the biggest
  single fix is not more context but a mined map of which APIs throw which
  exceptions. CatchAll feeds a model 3 knowledge layers: an API–exception
  mapping mined from real code, a depth-bounded cross-file call trace, and
  handling patterns abstracted from the top-20 retrieved historical try-catch
  blocks.


  Evaluation uses 2 new benchmarks built from 3,200 Android Java repositories:
  RepoExEval (120,000 try-catch blocks, 1,000 sampled for test, hand-annotated
  intents) and RepoExEval-Exec (100 instances from 4 projects, 174 unit
  tests). Backbones are GPT-4o and DeepSeek-V3, against 6 baselines including
  RepoCoder, Seeker, KPC, Nexgen, ExAssist.


  With GPT-4o, CatchAll reaches CodeBLEU 0.31 vs 0.27 for RepoCoder, IntentAcc
  60.1% vs 48.0%, Pass@1 29% vs 25%, and exception TypeAcc 53.6% vs 41.1% for
  KPC. DeepSeek-V3 gives 26% Pass@1.


  Ablations isolate the components: dropping the API–exception mapping cuts
  Pass@1 from 29% to 9%, call traces to 23%, handling patterns to 21%. A
  matched single-round RepoCoder-RG1 baseline is included. Absolute numbers
  stay low, execution evidence rests on 100 cases from 4 repositories, and
  contamination checks found 4.4% overlap with CodeSearchNet.


  Java/Android only, try-catch only; no try-with-resources or preventive
  handling. If you build repo-level code agents, mined API-exception
  statistics may buy more than retrieval.
