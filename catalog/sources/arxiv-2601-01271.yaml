brief: >-
  LLMs still fail most repository-level exception handling even when given
  mined API-exception knowledge, call traces, and handling patterns: the best
  configuration passes under a third of executable cases.


  CatchAll feeds an LLM three knowledge layers — an API-exception mapping
  mined from 3,200 Android GitHub repositories, a depth-bounded cross-file
  call trace around the target code, and a handling pattern abstracted from
  the top-20 retrieved historical try-catch blocks. Evaluation uses 2 new
  benchmarks, RepoExEval (120,000 blocks, 1,000 sampled with manually
  annotated handling intents) and RepoExEval-Exec (4 repositories, 100
  instances, 174 unit tests), against 6 baselines including RepoCoder, KPC,
  Seeker, Nexgen and ExAssist, with GPT-4o and DeepSeek-V3 backbones.


  With GPT-4o, CatchAll reaches CodeBLEU 0.31, IntentAcc 60.1%, Pass@1 29%,
  versus RepoCoder at 0.27, 48.0%, 25%. DeepSeek-V3 gives 0.29, 53.9%, 26%.
  Exception type prediction: 53.6% TypeAcc versus 41.1% for KPC.


  An ablation isolates each component on the same benchmark: dropping the
  API-exception mapping cuts Pass@1 from 29% to 9%, call traces to 23%,
  handling patterns to 21%. Baselines were rerun with the same backbones and
  the same input snippet, so backbone capability is controlled.
  Execution-based evidence rests on only 4 repositories; contamination was
  checked against CodeSearchNet with 4.4% overlap (143 out of 3,233
  repositories).


  Only Java/Android and try-catch constructs were tested; no preventive
  handling, propagation, or try-with-resources. Offline mapping construction
  cost about 97 hours.


  Treat repository-level exception handling as an open problem rather than a
  solved retrieval task.
