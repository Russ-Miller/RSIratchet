brief: >-
  Exception handling at repository scale remains mostly unsolved for LLMs:
  even with retrieval and repository context, the best method generates a
  functionally correct catch block in under a third of cases. CatchAll adds
  three knowledge layers to the prompt — an API-to-exception mapping mined
  from real code, a depth-bounded cross-file call trace, and a handling
  pattern abstracted from the top-20 retrieved historical try-catch blocks.


  Evaluation uses 2 new Android Java benchmarks: RepoExEval (120,000 try-catch
  blocks from 3,200 repositories, 1,000 sampled for test) and RepoExEval-Exec
  (100 instances from 4 repositories with 174 unit tests). Backbones are
  GPT-4o and DeepSeek-V3, against 6 baselines including RepoCoder, KPC,
  Seeker, Nexgen, ExAssist.


  With GPT-4o, CatchAll reaches Pass@1 29% vs 25% for RepoCoder, CodeBLEU 0.31
  vs 0.27, IntentAcc 60.1% vs 48.0%, and exact exception-type accuracy 53.6%
  vs 41.1% for KPC. DeepSeek-V3 gives 26% Pass@1.


  Ablations isolate the components: dropping the API-Exception mapping
  collapses Pass@1 to 9%, call traces to 23%, patterns to 21%. Baselines were
  re-run with matched backbones and the same input snippet, which is a fair
  comparison. Execution-based numbers rest on 4 repositories and 100 cases
  only; CodeBLEU and IntentAcc dominate the large benchmark. Java/Android
  only, try-catch only, no try-with-resources or preventive handling.
  Contamination was checked but not eliminated (4.4% overlap, 143 out of 3,233
  repositories).


  If you are building repo-level code assistance, treat mined API-exception
  statistics as the highest-value context, not call graphs.
