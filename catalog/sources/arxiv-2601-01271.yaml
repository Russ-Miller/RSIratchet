brief: >-
  Exception handling is a repository-level task that LLMs do poorly on when
  given only local code, and the single biggest fix is a mined
  API-to-exception mapping rather than more context retrieval. CatchAll
  prompts an LLM with 3 knowledge layers: an API–exception mapping mined from
  real code, a depth-bounded cross-file call trace, and a handling pattern
  abstracted from the top-K retrieved historical try-catch blocks.


  Evaluation uses 2 new Android benchmarks: RepoExEval (120,000 try-catch
  instances from 3,200 repositories, 1,000 sampled for testing) and
  RepoExEval-Exec (100 instances from 4 repositories, 174 unit tests).
  Backbones are GPT-4o and DeepSeek-V3, against 6 baselines including
  RepoCoder, Seeker, KPC, Nexgen, ExAssist.


  With GPT-4o, CatchAll reaches 0.31 CodeBLEU, 29% Pass@1, 60.1% IntentAcc
  versus RepoCoder's 0.27, 25%, 48.0%. Exception type accuracy is 53.6% versus
  41.1% for KPC. DeepSeek-V3 gives 26% Pass@1.


  The ablation isolates causes well: removing the API–exception mapping drops
  Pass@1 from 29% to 9%, call traces to 23%, handling patterns to 21%.
  Retrieval size peaks at K=20.


  Boundaries: Java/Android only, try-catch only, execution-based scoring on 4
  repositories, 2 models, no human study. Contamination is argued down via
  date filters and a 4.4% CodeSearchNet overlap check, not eliminated.


  If you build repo-level code tools, treat mined API-exception statistics as
  higher value than generic retrieval.
