brief: >-
  LLMs asked to write Java catch blocks mostly fail at the repository level,
  and the single biggest fix is telling them which APIs throw what, not giving
  them more surrounding code. CatchAll feeds GPT-4o and DeepSeek-V3 three
  knowledge layers: an API-exception mapping mined from real repositories, a
  depth-bounded cross-file call trace, and handling patterns abstracted from
  retrieved historical try-catch blocks.


  Evaluation uses 2 new benchmarks built from 3,200 Android repositories and
  120,000 exception-handling blocks: RepoExEval (1,000 sampled instances,
  CodeBLEU and intent accuracy) and RepoExEval-Exec (100 instances from 4
  repositories, 174 unit tests, Pass@1).


  Against 6 baselines, CatchAll reaches 0.31 CodeBLEU vs 0.27 for RepoCoder,
  60.1% intent accuracy vs 48.0%, and 29% Pass@1 vs 25%. Exception type
  accuracy is 53.6% vs 41.1% for KPC. DeepSeek-V3 gives 26% Pass@1, 0.29,
  53.9%.


  The ablation is the informative part: dropping the API-Exception mapping
  collapses Pass@1 from 29% to 9%, below Direct-Prompting, while dropping call
  traces costs only 6 points. Backbones are swapped for all baselines, so
  capability is roughly controlled; there is no matched-token-budget
  comparison.


  Boundaries: Java and Android only, try-catch only, execution testing on 4
  repositories, 4.4% corpus overlap with CodeSearchNet remains.


  Absolute numbers stay low, so treat this as a ranking of what context helps,
  not a solved task.
