brief: >-
  LLMs write poor exception-handling code at repository scale, and the single
  largest fix is not more context retrieval but a mined API-to-exception
  mapping. CatchAll adds 3 knowledge layers to the prompt: an API-exception
  mapping mined from real code, a depth-bounded cross-file call trace, and a
  handling pattern abstracted from the top-K retrieved historical try-catch
  blocks.


  Evaluation uses 2 new Java/Android benchmarks: RepoExEval (120,000 try-catch
  instances from 3,200 GitHub repositories, 1,000 sampled for test) and
  RepoExEval-Exec (100 instances from 4 repositories with 174 unit tests).
  Backbones are GPT-4o and DeepSeek-V3, against 6 baselines including
  RepoCoder, Seeker, KPC, Nexgen, ExAssist.


  With GPT-4o, CatchAll reaches CodeBLEU 0.31 vs 0.27 for RepoCoder, IntentAcc
  60.1% vs 48.0%, Pass@1 29% vs 25%, and exact exception TypeAcc 53.6% vs
  41.1% for KPC. DeepSeek-V3 gives 26% Pass@1.


  The ablation isolates the components: removing the API-exception mapping
  drops Pass@1 from 29% to 9%, far more than removing call traces (23%) or
  handling patterns (21%). K=20 retrieved samples is optimal; 1-5 samples
  underperform retrieving nothing.


  Boundaries: Java/Android only, try-catch only, execution-based scores rest
  on 4 repositories, and no matched-token-budget baseline is reported.
  Contamination was checked only against CodeSearchNet (4.4% overlap, 143 of
  3,233 repositories).


  If you are building repository-level code tooling, mine the API-failure
  statistics before you scale up context retrieval.
