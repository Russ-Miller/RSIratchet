brief: >-
  Exception-handling code is a place where LLMs remain weak, and most of the
  gap comes from missing repository-level knowledge rather than from generic
  code ability. CatchAll adds 3 knowledge channels to the prompt: an
  API-exception mapping mined from real code, a depth-bounded cross-file call
  trace, and a handling pattern abstracted from the top-K retrieved historical
  try-catch blocks.


  Evaluation uses 2 new benchmarks built from Android Java repositories:
  RepoExEval (120,000 try-catch blocks from 3,200 repositories, 1,000 sampled
  for testing) and RepoExEval-Exec (100 instances from 4 repositories, 174
  unit tests). Baselines include ExAssist, Nexgen, KPC, Seeker, RepoCoder and
  Direct-Prompting, run under GPT-4o and DeepSeek-V3.


  With GPT-4o, CatchAll reaches CodeBLEU 0.31 vs 0.27 for RepoCoder, IntentAcc
  60.1% vs 48.0%, and Pass@1 29% vs 25%. Exception type accuracy is 53.6% vs
  41.1% for KPC. DeepSeek-V3 shows the same ordering at 26% Pass@1.


  Ablations isolate the components: removing the API-exception mapping drops
  Pass@1 from 29% to 9%, call traces to 23%, handling patterns to 21%.
  Retrieval size peaks near K=20. There is no matched-token-budget baseline,
  and RepoCoder's iterative variant takes over 40 seconds per query against
  under 5 seconds for others.


  Scope is Java/Android try-catch only, 2 model backbones, and execution
  testing on just 4 repositories; contamination was mitigated by date filters
  with 4.4% CodeSearchNet overlap remaining.


  If you are building repo-level code assistance, the ablation suggests mined
  API-exception associations matter more than retrieval of similar code.
