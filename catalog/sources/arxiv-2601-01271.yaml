brief: >-
  Exception handling at the repository level stays hard for LLMs, and the
  biggest single lever is not retrieval of similar code but a mined mapping
  from APIs to the exceptions they actually throw. CatchAll stacks 3 knowledge
  layers into prompts: an API-exception mapping mined from real repositories,
  a depth-bounded cross-file call trace around the target snippet, and a
  handling pattern abstracted from the top-K retrieved historical try-catch
  blocks.


  Evaluation uses 2 new benchmarks built from 3,200 Android repositories:
  RepoExEval (120,000 try-catch blocks, 1,000 sampled for testing) and
  RepoExEval-Exec (100 instances from 4 projects, 174 unit tests). Backbones
  are GPT-4o and DeepSeek-V3; 6 baselines include ExAssist, Nexgen, KPC,
  Seeker, RepoCoder and Direct-Prompting.


  With GPT-4o, CatchAll reaches CodeBLEU 0.31 vs 0.27 for RepoCoder, IntentAcc
  60.1% vs 48.0%, Pass@1 29% vs 25%, and exact exception TypeAcc 53.6% vs
  41.1% for KPC. DeepSeek-V3 gives 26% Pass@1.


  An ablation isolates the components: removing the API-Exception mapping
  drops Pass@1 from 29% to 9%, call traces to 23%, handling patterns to 21%.
  Baselines were re-run with the same backbones and the same input snippet, so
  model capability is controlled. Gains over the strongest baseline are 4 and
  3 percentage points of Pass@1, on 100 executable cases only.


  Limits: Java/Android only, try-catch only, 1 executable benchmark of 4
  repositories, 4.4% overlap with CodeSearchNet. Treat API-level exception
  knowledge, not generic repo retrieval, as the thing to supply.
