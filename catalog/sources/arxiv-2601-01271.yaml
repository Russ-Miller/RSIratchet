brief: >-
  LLMs write poor exception-handling code at repository scale, and the biggest
  missing ingredient is not call-graph context but a mined mapping from APIs
  to the exceptions they actually throw. CatchAll feeds the model three
  knowledge layers: an API-Exception mapping mined from real code, a
  depth-bounded cross-file call trace, and a handling pattern abstracted from
  the top-20 retrieved historical try-catch blocks.


  Evaluation uses 2 new benchmarks built from 3,200 Android repositories:
  RepoExEval (120,000 try-catch blocks, 1,000 sampled for test) and
  RepoExEval-Exec (100 instances from 4 projects, 174 unit tests). Baselines
  are ExAssist, Nexgen, KPC, Seeker, RepoCoder and Direct-Prompting, under
  GPT-4o and DeepSeek-V3.


  With GPT-4o, CatchAll reaches CodeBLEU 0.31, IntentAcc 60.1%, Pass@1 29%,
  against RepoCoder's 0.27, 48.0%, 25%. Exception type accuracy is 53.6%
  versus 41.1% for KPC. An ablation isolates the components: dropping call
  traces moves Pass@1 to 23%, dropping handling patterns to 21%, dropping the
  API-Exception mapping to 9%.


  The ablation and the 2 backbones are the strongest evidence; the Pass@1
  numbers rest on 100 executable cases from 4 repositories, and absolute
  correctness stays below 30%. Java/Android only, try-catch only, no
  try-with-resources or preventive handling. Offline mapping construction cost
  roughly 97 hours.


  If you are building repository-level code assistants, mine API failure
  behaviour before adding more retrieval.
