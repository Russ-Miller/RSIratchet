summary: "Humans are capable of strategically deceptive behavior: behaving
  helpfully in most situations, but then behaving very differently in order to
  pursue alternative objectives when given the opportunity. If an AI system
  learned such a deceptive strategy, could we detect it and remove it using
  current state-of-the-art safety training techniques? To study this question,
  we construct proof-of-concept examples of deceptive behavior in large
  language models (LLMs). For example, we train models that write secure code
  when the prompt states that the year is 2023, but insert exploitable code
  when the stated year is 2024. We find that such backdoor behavior can be
  made persistent, so that it is not removed by standard safety training
  techniques, including supervised fine-tuning, reinforcement learning, and
  adversarial training (eliciting unsafe behavior and then training to remove
  it). The backdoor b…"
