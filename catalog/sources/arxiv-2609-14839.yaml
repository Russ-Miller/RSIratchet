summary: >-
  The integration of Large Language Models (LLMs) into automated code
  optimization introduces a critical reliability risk we term the Efficiency
  Hallucination: an LLM's tendency to issue non-functional mutations with
  unsubstantiated performance claims on already-optimized code. This is
  driven by the Evaluation Trap, wherein binary benchmarks incentivize
  unnecessary modifications over safely abstaining. We present a validation
  framework using classification penalty methods, evaluated across 180
  optimization runs on nine models (GPT, Claude, Gemini) using EffiBench.
