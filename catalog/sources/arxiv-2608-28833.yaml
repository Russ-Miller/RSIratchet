brief: >-
  Conditioning a model on a user profile is the main driver of personalization
  side effects, and it degrades behavior more than retrieved memory does.
  PRISK evaluates 13 open and closed models (GPT-5.4/mini, Claude Haiku
  4.5/Sonnet 4.6, Gemini 2.5 family, Llama 3.1 8B/70B, Qwen3 4B-32B) on 3000
  manually verified (profile, memory, query) triples built from Reddit data,
  synthetic templates, and rewritten CSQA/GSM8K/MMLU items, under 4
  conditions: base, profile, retrieval, both.


  Average degradation is 45.9%, 41.7% and 61.7% for irrelevant
  personalization, preference narrowing and sycophantic bias. Profile context
  cuts benchmark exact-match accuracy by up to 4.3%. Gemini 2.5 Flash's
  perspective-sycophancy score falls from 55.1% to 0.9% with a profile;
  inverting a stated preference flips 94.8% of responses. Within Qwen3,
  resistance rises monotonically with size, 46.8% at 4B to 60.0% at 32B.


  Attribution is unusually well isolated: a 2x2 factorial mixed-effects model
  (N=800 per risk) finds profile dominant for irrelevant personalization, and
  a do-intervention counterfactual test separates profile-specific from
  generic bias. Judges are LLM-based, with human agreement of 89.71%, 84.80%
  and 84.35%.


  Memories are synthetic, profiles fully observed across 10 attributes,
  English only, no longitudinal or real-product interaction. Self-reflection
  prompting largely fixes surface profile injection but leaves narrowing and
  sycophancy far below baseline, so treat memory features as an alignment
  dial, not a free win.
