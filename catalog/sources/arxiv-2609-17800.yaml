summary: >-
  Vision-language models (VLMs) remain largely unreliable on panoramic
  dental radiographs and can rely on learned anatomical priors rather than
  evidence in the image. This is particularly problematic for tooth
  localization and spatial reasoning, and fine-tuned dental VLMs can retain
  the same spatial biases. We present AgenTeeth, a model-agnostic,
  tool-augmented framework that grounds frozen VLMs using seven specialized
  dental vision experts. A question-aware orchestrator selects the relevant
  tools, whose detections are mapped to FDI tooth numbers or anatomical
  regions and returned as structured
