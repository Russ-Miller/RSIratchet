brief: >-
  Bounding the context injected into a multi-agent system, rather than
  extending it, is enough to keep long-horizon scientific workflows running
  across sessions without degradation. Ensemble QSP uses a three-layer
  hierarchical memory that caps state categories and evicts completed work,
  holding injected context to a median of 301 tokens and a maximum of 4,050.


  The system runs 5 specialist worker agents under domain-expert principal
  investigator agents, with physics-based checklists and structured domain
  knowledge enforcing physical constraints. Tasks span autonomous
  pharmacokinetic-pharmacodynamic model selection, parameter recovery,
  literature synthesis, and PBPK model implementation.


  Reported outcomes: autonomous PKPD model selection, improved parameter
  recovery against single-agent baselines, and stable interpretation of
  linguistically varied prompts. Replication with DeepSeek-V4-Flash/Pro and
  Llama 3.1 70B reproduced the architectural conclusions, so the result does
  not depend on proprietary models.


  Feature-level ablations separate memory, retrieval, and PI oversight and
  attribute distinct scientific failure modes to each, which is the strongest
  part of the evidence. The source reports no accuracy figures for the
  benchmarks, no matched-token-budget long-context baseline, and the
  evaluation appears self-run.


  Stringent physical-consistency checks still depend on the underlying model's
  capability, and the domain-agnostic claim rests on configuration structure
  rather than tested transfer outside computational biology.


  If you are building long-running agent workflows, this argues for
  engineering memory eviction before reaching for larger context windows.
