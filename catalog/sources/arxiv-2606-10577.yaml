summary: >-
  Zero-shot vision-and-language navigation in continuous environments
  (VLN-CE) has recently become feasible with large vision-language models
  (VLMs). Existing methods typically rely on learned waypoint predictors to
  propose navigable actions. This limits the model's action space and fails
  to leverage depth inputs effectively. Moreover, memory is commonly handled
  by accumulating long textual or visual histories, which overwhelms the
  prompt context. In this paper, we rethink zero-shot VLN-CE as an agentic
