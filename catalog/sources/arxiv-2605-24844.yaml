summary: >-
  While general-purpose Large Language Models (LLMs) applied to Geology
  often hallucinate when reasoning about subsurface structures and deep-time
  evolution, current AI in Earth sciences predominantly targets surface
  remote sensing and GIS. To bridge this gap, we introduce Geo-Expert, a
  family of parameter-efficient geological LLMs fine-tuned on a
  custom-curated, high-quality instruction dataset processed using our
  custom instruction synthesis pipeline. We investigate the impact of model
  scaling and architecture by fine-tuning three base models: Qwen3-8B,
  Qwen3-32B, and Gemma-3-27B, with Low-Ran
