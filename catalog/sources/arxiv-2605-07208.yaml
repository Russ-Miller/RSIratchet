brief: >-
  Frontier LLMs asked to judge which papers will matter barely beat chance,
  and a small geometric model trained on field trajectories beats all of them
  by a wide margin.


  The test treats historical arXiv papers as "new ideas" relative to a
  temporal cutoff and scores predictions against realized impact, a composite
  of GitHub stars, citation counts, influential citations, and Altmetric.
  3,200 papers from Time Series Forecasting, Sparse Attention, and Image
  Generation are evaluated in an 18-month sliding window from June 2024 to
  November 2025. Judges include GPT-4.1, GPT-5.2, Gemini-3.1-Pro-Preview,
  DeepSeek-V3.2, and the fine-tuned SciJudge-4B, against ML baselines and the
  authors' FAME manifold model.


  LLM Spearman correlations stay under 0.25 and swing erratically, GPT-4.1
  averaging 0.003 in the final 6-month block and GPT-5.2 0.179; SciJudge-4B
  reaches 0.302. FAME averages 0.535, 0.513, and 0.532 across the 3 blocks.


  All evaluators are anchored to the same impact labels and LLMs get a
  30-paper few-shot window to offset knowledge cutoffs, which is a real
  attempt at parity, though FAME trains on in-domain historical data and the
  LLMs do not. Loss ablations and a graph-construction ablation are reported;
  vanguard loss matters most. The composite label correlates 0.5283 (Spearman)
  with 3 human raters on 300 papers, so the target itself is only partly
  human-aligned.


  Limited to 3 CS subfields and to formalized manuscripts, not raw hypotheses.
  If you rely on LLM-as-judge for idea triage, treat its impact rankings as
  near-uninformative.
