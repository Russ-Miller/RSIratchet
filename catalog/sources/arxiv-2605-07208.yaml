brief: >-
  Frontier LLMs asked to judge which papers will matter are close to
  uninformative as rankers of realized impact, and a geometric model trained
  on field trajectories beats them by a wide margin. The claim is about
  prospective forecasting, not retrospective scoring.


  The setup treats historical manuscripts as "new ideas" relative to a cutoff:
  3,200 arXiv papers from Time Series Forecasting, Sparse Attention and Image
  Generation, with ground truth a composite of GitHub stars, citations,
  influential citations and Altmetric score. Evaluation is an 18-month sliding
  window from June 2024 to November 2025, with 2-month test windows, scored by
  Spearman correlation. FAME projects papers into a continuous latent space
  with per-topic "spines" and scores a paper by the cosine alignment of its
  positional residual with its field's momentum.


  LLMs average roughly 0.079-0.215 (GPT-4.1 0.003 in the last block, GPT-5.2
  0.179, Gemini-3.1-Pro-Preview 0.131), SciJudge-4B 0.247-0.302, classical
  baselines on text embeddings 0.160-0.399, FAME 0.513-0.535.


  The design does work to neutralize knowledge-cutoff advantages: all
  evaluators see the same realized labels, and LLMs get a 30-paper few-shot
  hint window. FAME trains on in-domain historical data while LLMs are
  few-shot, so the comparison is not matched on supervision. Loss ablations
  (vanguard loss largest drop) and graph ablations (raw citation graph, random
  graph) are reported, plus a 300-paper, 3-rater human check where the
  composite score correlates 0.5283 with human consensus.


  Boundaries: 3 CS subfields, formalized manuscripts rather than raw
  hypotheses, finalized impact labels used for training, and no handling of
  delayed-impact papers.


  If you rely on LLM-as-judge for idea triage, treat its impact rankings as
  near-noise and add field-trajectory signal.
