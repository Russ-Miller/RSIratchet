summary: >-
  Large Language Models (LLMs) are increasingly used to brainstorm and
  evaluate research ideas, yet assessing such judgments is fundamentally
  difficult because the true impact of a new idea may take years to emerge.
  We address this challenge by using the impact forecasting of
  human-authored manuscripts as a verifiable proxy task. In a prospective
  forecasting study, we find that frontier LLMs fail to reliably distinguish
  high-impact papers from ordinary publications, suggesting that static
