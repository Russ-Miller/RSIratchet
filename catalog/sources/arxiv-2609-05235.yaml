summary: >-
  Cryptocurrency markets exhibit extreme volatility and non-stationary
  dynamics that challenge conventional forecasting methods. Although Large
  Language Models (LLMs) have shown promise for time series forecasting, the
  combined effects of adaptation choices remain largely unexplored in
  financial settings. This study introduces PRICE, a structured approach for
  adapting LLMs to short-term Bitcoin price forecasting. Built on a 4-bit
  quantized LLaMA-3 8B model, PRICE investigates how fine-tuning, numerical
  representation, prompting, inference, and decoding jointly influence
  forecasting performance.
notes: >-
