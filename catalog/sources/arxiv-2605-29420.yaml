title: 'When Does Persona Prompting Actually Help? A Retrieval and Metric Analysis of Expert Role Injection in LLMs'
year: 2026
date: '2026-05-28'
arxiv_id: '2605.29420'
url: https://arxiv.org/abs/2605.29420
tags: [prompting, persona, evaluation]
summary: >-
  Compares no role, generic expert framing, retrieved roles, and hybrid role
  selection across 1,140 questions, 38 roles, and six domains using GPT-4o mini.
  Overall differences were small; role prompts tended to increase expertise
  depth while reducing clarity, with effects varying across question and
  domain types. Submitted for peer review.
