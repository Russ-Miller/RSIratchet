summary: >-
  Large language model (LLM) agents increasingly operate within a harness,
  the scaffolding that determines what enters the executor's context, yet
  the experience they accumulate across tasks rarely flows back into this
  harness. Existing approaches include executor fine-tuning and external
  memory retrieval, but combining task-adaptive retrieval with experience
  reuse across frozen executors remains challenging. To this end, we
  introduce ExpHarness, a learnable experience harness that improves frozen
  and replaceable LLM executors without modifying their parameters.
