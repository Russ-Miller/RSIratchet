summary: >-
  Most Vision-Language-Action (VLA) models map observations directly to
  actions without explicit reasoning, limiting their capacity for
  reasoning-intensive long-horizon tasks. To address this, existing
  approaches adopt Chain-of-Thought (CoT) reasoning to enable subgoal
  decomposition and spatial anticipation. However, those methods lack a
  unified architecture for effective cross-modal reasoning and fail to
  explicitly include inverse reasoning ability based on the target state. We
