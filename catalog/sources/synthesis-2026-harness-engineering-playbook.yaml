summary: >-
  A nine-page playbook presenting production agent design as six layers
  around the model: guides (feedforward instructions), sensors (feedback
  checks), a bounded agentic loop, persistent memory, permissions and
  budgets, and observability. Its organising idea is the ratchet: every
  failure becomes a permanent fix in the harness rather than a patch to a
  prompt. It compiles harness-only performance gains from five secondhand
  sources and supplies a vocabulary — guides versus sensors, computational
  versus inferential sensors, trip wires, capability budgets, escalation
  packets — that maps unusually well onto this catalog's own machinery.
notes: >-
  Provenance is unusual and worth stating plainly. The document is formatted
  as an IEEE-style paper and carries a Google wordmark on every page, but its
  own front matter says it was "independently compiled, August 2026 — not
  affiliated with Google, OpenAI, Anthropic, or HashiCorp — and not
  endorsed", and its source note calls it "an independent practical
  synthesis". No author is named. Every quantitative result in it is cited
  to a blog post, a Medium article or a company engineering post — Masood
  on GAIA, LangChain on Terminal Bench, Lopopolo on Codex. So it is filed as
  a post, not a paper: a well-organised secondhand synthesis whose value is
  the framework and the vocabulary, not the numbers. Any claim leaning on
  those numbers should cite the underlying source directly once that source
  is itself filed. Forwarded by Russ on 2026-09-11 for both the catalog and
  its bearing on the recursive self-improvement ambition.
