brief: >-
  Letting a language model choose where in a video to look, and how densely to
  sample it, at each reasoning step beats one-shot frame selection and
  retrieval over pre-computed captions. LensWalk runs a reason-plan-observe
  loop in which an LLM reasoner picks among 3 VLM-backed tools (Scan Search,
  Segment Focus, Stitched Verify) with explicit temporal intervals and frame
  budgets, plus timestamp anchors and a subject memory table, capped at 20
  tool calls with per-call frame budgets of 180, 32 and 128.


  With o3 as both reasoner and observer, LVBench rises from 57.1 to 68.6 and
  Video-MME long from 64.7 to 71.4; on Video-MME long it is over 4% above Mr.
  Video and Deep Video Discovery, though Deep Video Discovery still leads on
  LVBench (74.2 vs 68.6). Component ablations on Video-MME long attribute 4.6%
  to Scan Search, 3.2% to Stitch Verify, 1.9% to Segment Focus, and 0.6% to
  the 2 memory modules combined.


  Gains are measured against published or re-run single-pass baselines at 256
  uniformly sampled frames, with a component ablation and a reasoner/observer
  swap grid; token-cost comparisons are reported but the main table mixes
  leaderboard numbers with in-house runs.


  The reasoner's strength is the binding constraint: Qwen3-235B-A22B as
  reasoner gives +0.1% on GPT-4.1 and -0.6% on Qwen2.5-VL-72B, so open-source
  planners do not reproduce the effect on strong observers.


  If you are scaling video QA, budget reasoning quality before frames.
