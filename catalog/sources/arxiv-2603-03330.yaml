summary: >-
  Large language models (LLMs) often present answers with high apparent
  confidence despite lacking an explicit mechanism for reasoning about
  certainty or truth. While existing benchmarks primarily evaluate
  single-turn accuracy, truthfulness or confidence calibration, they do not
  capture how models behave when their responses are challenged in
  interactive settings. We introduce the Certainty Robustness Benchmark, a
  two-turn evaluation framework that measures how LLMs balance stability and
  adaptability under self-challenging prompts such as uncertainty ("Are you
  sure?") and explicit contradiction
