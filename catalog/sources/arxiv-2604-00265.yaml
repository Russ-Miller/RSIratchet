brief: >-
  Asking good clarifying questions during embodied navigation does not require
  a heavy modular LLM pipeline: a 7B VLM fine-tuned on synthetic reasoning
  traces beats a 20B modular system on both question-asking and navigation.


  QAsk-Nav splits Collaborative Instance Object Navigation into 2 protocols:
  an offline multi-turn question-asking game (questioner sees only a text
  description, oracle sees the target image, distractors generated by editing
  color, salient features, and context) with ~1,400 episodes, and a navigation
  protocol over 1,649 CoIN-Bench/GOAT-Bench episodes in Habitat with
  Gemini-3-pro-written target descriptions. Light-CoNav is Qwen2.5-VL-7B
  fine-tuned on the 28,000-trace dataset and bolted onto VLFM.


  On question asking it reaches SR 0.4510 / FR 0.3317 versus 0.3027 / 0.1993
  for AIUTA and 0.0752 / 0.0034 for untuned Qwen2.5-VL-7B, at 1.15s versus
  177.83s per episode. Gemini-3-flash remains far ahead at 0.9329. Navigation
  SR is 12.20 / 14.15 / 9.63 across Val Seen / Synonyms / Unseen versus
  AIUTA's 10.46 / 14.89 / 7.83.


  The base-model comparison isolates the fine-tuning effect, and results are
  averaged over 3 oracle VLMs with a small human check; description quality is
  credited for ~1.30x SR gains in a matched ablation. Weaknesses: 1 model
  family fine-tuned, AIUTA's online LLM was swapped for reproducibility, and
  category-only descriptions break the method (SR 0.06 versus AIUTA's 0.42),
  showing it under-asks when input is vague.


  If you evaluate interactive agents, this gives you a cheap protocol that
  separates asking from acting.
