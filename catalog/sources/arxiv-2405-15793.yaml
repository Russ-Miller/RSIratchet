summary: "Language model (LM) agents are increasingly being used to automate
  complicated tasks in digital environments. Just as humans benefit from
  powerful software applications, such as integrated development environments,
  for complex tasks like software engineering, we posit that LM agents
  represent a new category of end users with their own needs and abilities,
  and would benefit from specially-built interfaces to the software they use.
  We investigate how interface design affects the performance of language
  model agents. As a result of this exploration, we introduce SWE-agent: a
  system that facilitates LM agents to autonomously use computers to solve
