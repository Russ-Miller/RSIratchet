summary: >-
  Multi-agent systems (MAS) powered by large language models have shown
  promise for complex tasks but suffer from high failure rates. Current
  self-reflection methods for MAS require all agents to reflect upon
  failure, overlooking a critical reality: failures typically stem from a
  specific agent leading the task astray, namely the decisive error agent,
