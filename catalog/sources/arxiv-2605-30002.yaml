summary: >-
  Cross-domain multimodal time series forecasting is a challenging task,
  requiring models to integrate precise numerical comprehension,
  cross-domain semantic understanding, and effective multimodal fusion.
  Existing approaches either build Time Series Foundation Models (TSFMs)
  from scratch or leverage pretrained Large Language Models (LLMs). However,
  TSFMs often overlook semantic understanding and lack the ability to
  perform future-oriented semantic reasoning, and LLMs struggle with
  numerical comprehension and accurate quantitative forecasting. To overcome
  these limitations, we propose KairosAgen
