brief: >-
  Text-to-SQL has stopped being an end-to-end generation problem and become a
  pipeline engineering problem, and this survey's main claim is that where the
  difficulty sits has moved from understanding the question to understanding
  the database.


  The survey organizes LLM-era Text-to-SQL into a lifecycle: translation
  models, training data and benchmarks, evaluation, and error analysis. It
  catalogues systems such as DIN-SQL, DAIL-SQL, CodeS, RESDSQL, PICARD,
  MAC-SQL, CHESS, CHASE-SQL and Alpha-SQL across pre-processing (schema
  linking, database content retrieval, additional information acquisition),
  translation (sequential, graph-based and separate encoding; greedy, beam and
  constraint-aware incremental decoding; CoT and decomposition prompting;
  intermediate representations), and post-processing (correction,
  self-consistency, execution-guided refinement, n-best reranking), with a
  table of design choices for systems from 2020 to 2025.


  The only quantitative claim carried in the text is that PLM-based methods
  resolve approximately 80% of Spider cases while accuracy drops to about 50%
  on Spider's extra hard cases. Everything else is qualitative, including the
  stated advantages of graph encoding, indexing and multi-agent decomposition.


  This is argued rather than measured. There is no new experiment, no
  matched-budget comparison between modules, and no reimplementation; claims
  about which modules help are taken from the original papers' self-reported
  results on Spider and BIRD. The proposed two-level error taxonomy and the
  module-selection decision flow are design proposals, not validated
  artifacts.


  Boundaries: no coverage of non-SQL dialects or non-relational stores, and no
  cost or latency numbers to support the cost-effectiveness discussion.


  Use it as a map of the module space and a reading list, not as evidence
  about which pipeline wins.
