brief: >-
  Text-to-SQL is best understood not as a single end-to-end capability but as
  a pipeline of separable modules, and this survey organizes the LLM-era
  literature around that claim. The lifecycle is split into 4 parts:
  translation models, training data and benchmarks, evaluation, and error
  analysis, with modules grouped into pre-processing (schema linking, database
  content retrieval, additional information acquisition), translation
  (encoding, decoding, task-specific prompting, intermediate representation),
  and post-processing (SQL correction, output consistency, execution-guided
  refinement, n-best reranking).


  The survey tabulates roughly 35 systems from 2020-2025, including RAT-SQL,
  PICARD, RESDSQL, CodeS, DIN-SQL, DAIL-SQL, MAC-SQL, CHESS, CHASE-SQL and
  Alpha-SQL, marking for each whether it fine-tunes and which modules it uses.
  The only performance figures reported are that PLM-based methods resolve
  approximately 80% of cases in Spider, with accuracy dropping to about 50% on
  Spider's extra hard cases.


  This is a review, not an experiment. No new measurements, no ablations, no
  matched-budget comparisons; module effects are described qualitatively from
  the original papers, so you cannot attribute gains to any single component
  from what is here. The proposed 2-level error taxonomy and the decision flow
  for module selection are authored constructions, not validated artifacts.


  The survey does not cover non-relational query languages or agentic data
  analysis beyond SQL generation. Use it as a map of the module design space
  and benchmark landscape, not as evidence about which modules work.
