brief: >-
  Text-to-SQL has shifted from an end-to-end task to a modular pipeline, and
  this survey argues the remaining bottleneck is the database, not the
  language: LLM emergent abilities largely resolved natural language
  understanding, leaving schema complexity, dirty values, and domain knowledge
  as the hard parts.


  The review organizes the field into 4 stages of solutions (rule-based,
  neural, PLM-based, LLM-based) and 3 pipeline phases: pre-processing (schema
  linking, database content retrieval, additional information acquisition),
  translation (encoding, decoding, task-specific prompts, intermediate
  representations), and post-processing (correction, self-consistency,
  execution-guided refinement, n-best reranking). Table I compares design
  choices across systems from BRIDGE and RAT-SQL through RESDSQL, DIN-SQL,
  DAIL-SQL, CodeS, MAC-SQL, CHESS, CHASE-SQL and Alpha-SQL.


  The only quantitative claim carried through is that PLM-based methods
  resolve approximately 80% of cases on Spider but drop to about 50% on
  Spider's extra-hard cases. Everything else is qualitative synthesis of prior
  papers.


  Nothing is measured here. There is no re-run of any system, no
  matched-budget comparison, and no independent replication; the error
  taxonomy and the module decision flow are proposed by the authors rather
  than validated. Claims about multi-agent frameworks such as MAC-SQL and
  Alpha-SQL are reported from their source papers.


  Use it as a map of module choices and benchmark trade-offs, not as evidence
  that any particular technique wins.
