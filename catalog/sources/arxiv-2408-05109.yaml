brief: >-
  Text-to-SQL is no longer mainly a language-understanding problem; with LLMs
  the residual difficulty has shifted to the database side, and to modular
  pipeline design rather than end-to-end generation. This survey organizes the
  field around a 4-part lifecycle: translation models, training data and
  benchmarks, evaluation, and error analysis.


  The authors cover rule-based, neural, PLM-based, and LLM-based stages, and
  decompose modern systems into pre-processing (schema linking, database
  content retrieval, additional information acquisition), translation
  (sequential, graph-based, or separate encoding; greedy, beam, or
  constraint-aware decoding; CoT and decomposition prompting; intermediate
  representations such as NatSQL), and post-processing (correction,
  self-consistency, execution-guided refinement, N-best reranking). Systems
  compared include DIN-SQL, DAIL-SQL, CodeS, RESDSQL, MAC-SQL, CHESS,
  CHASE-SQL, and Alpha-SQL, across Spider and BIRD.


  The main quantitative claim carried over from prior work is that PLM-based
  methods resolve approximately 80% of Spider cases but drop to about 50% on
  Spider's extra-hard split. No new experiments, ablations, or matched-budget
  comparisons are run; module effectiveness is argued from cited results, not
  measured here, so relative contributions of schema linking versus decoding
  versus post-processing remain unattributed.


  Coverage is skewed toward English academic benchmarks and relational SQL;
  open-world, dirty-data, and cost-sensitive deployment are named as open
  problems rather than evaluated.


  Use it as a map of module choices and error taxonomies, not as evidence that
  any one component works.
