brief: >-
  Text-to-SQL in the LLM era is best understood as a modular pipeline rather
  than an end-to-end translation task, and the hard part has shifted from
  understanding the natural language question to handling the database itself.
  This survey organizes the field around 4 stages of the task lifecycle:
  translation models, training data and benchmarks, evaluation, and error
  analysis, and traces 4 historical phases from rule-based parsers through
  neural nets, PLMs, and LLMs.


  The core contribution is a modular decomposition into pre-processing (schema
  linking, database content retrieval, additional information acquisition),
  translation (sequential, graph-based, or separate encoding; greedy, beam, or
  constraint-aware incremental decoding; CoT and decomposition prompting;
  intermediate representations), and post-processing (SQL correction,
  self-consistency, execution-guided refinement, n-best reranking). A
  comparison table maps roughly 35 named systems from BRIDGE (2020) through
  OpenSearch-SQL and Alpha-SQL (2025) onto these modules.


  The only performance figures cited are that PLM-based methods resolve
  approximately 80% of Spider cases but drop to about 50% on Spider's
  extra-hard split. Nothing here is measured by the authors: the taxonomy, the
  two-level error taxonomy, the optimization roadmap, and the module-selection
  decision flow are argued from the literature, not benchmarked. No
  head-to-head reimplementation, no cost or latency measurements.


  Treat it as a map of design choices and their stated trade-offs, not as
  evidence about which pipeline wins.
