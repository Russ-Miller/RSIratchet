brief: >-
  Text-to-SQL has shifted from an end-to-end parsing task into a modular
  pipeline, and this survey argues the remaining bottleneck is the database
  side, not language understanding. Once LLM emergent abilities largely solved
  natural language interpretation, the hard parts became schema linking,
  cell-value retrieval, domain knowledge acquisition, and execution-guided
  correction.


  The survey organizes the field around 4 stages: model (pre-processing,
  translation, post-processing), data (benchmarks and synthesis), evaluation,
  and error analysis. It tabulates over 30 systems from BRIDGE (2020) through
  Alpha-SQL and CHASE-SQL (2025) across design choices: encoding (sequential,
  graph-based, separate), decoding (greedy, beam, constraint-aware
  incremental), prompting (chain-of-thought vs decomposition), and
  intermediate representation (SQL-like syntax language vs sketch structure).


  Almost no performance figures are reported. The 1 quantitative claim:
  PLM-based methods resolved approximately 80% of Spider cases, with accuracy
  dropping to about 50% on Spider's extra-hard subset. Everything else is
  qualitative comparison.


  This is argued, not measured. There are no new experiments, no
  reimplementation under matched conditions, and no head-to-head numbers
  across the tabulated systems, so the modular taxonomy is a framing device
  rather than evidence that any module helps. Claims about multi-agent
  frameworks and MCTS-based planning rest on the original papers'
  self-reported results.


  Use it as a map of module design choices and a two-level error taxonomy, not
  as a source for which method is best.
