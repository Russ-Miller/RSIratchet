brief: >-
  Text-to-SQL has shifted from an end-to-end parsing problem to a modular
  pipeline, and the surviving hard part is the database, not the language.
  This survey argues that LLMs' emergent language understanding largely
  dissolved the natural-language-understanding bottleneck, leaving schema
  complexity, dirty cell values, ambiguity, and domain knowledge as the
  binding constraints.


  The review organizes the field into 4 stages of the lifecycle: translation
  models, training data and benchmarks, evaluation, and error analysis. It
  tabulates design choices across roughly 35 systems from 2020 to 2025
  (RAT-SQL, BRIDGE, PICARD, RESDSQL, DIN-SQL, DAIL-SQL, CodeS, MAC-SQL, CHESS,
  CHASE-SQL, Alpha-SQL), decomposing each into pre-processing (schema linking,
  DB content retrieval, additional information), translation (encoding,
  decoding, prompt strategy, intermediate representation), and post-processing
  (correction, self-consistency, execution-guided refinement, n-best
  reranking).


  The only quantitative claim carried forward is that PLM-based methods
  resolve approximately 80% of Spider cases but drop to about 50% on Spider's
  extra hard cases. Benchmarks like BIRD and BULL are described as the newer
  targets emphasizing massive tables and domain knowledge.


  This is a taxonomy, not an experiment. No head-to-head reruns, no
  matched-budget comparisons, no ablation isolating which module drives
  accuracy; claims about each strategy's weaknesses are argued from cited
  work. The authors also propose their own 2-level error taxonomy and a
  module-selection decision flow, neither validated empirically here.


  Use it as a map of module design choices, not as evidence that any one of
  them works.
