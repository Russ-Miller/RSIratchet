brief: >-
  Modular pipelines, not end-to-end generation, now define how language models
  are applied to Text-to-SQL. This survey organizes the field around a 4-part
  lifecycle: translation models, training data and benchmarks, evaluation, and
  error analysis.


  The review covers rule-based, neural, PLM-based and LLM-based stages, and
  decomposes LLM solutions into pre-processing (schema linking, database
  content retrieval, additional information acquisition), translation
  (sequential, graph-based, separate encoding; greedy, beam, constraint-aware
  incremental decoding; CoT and decomposition prompting; intermediate
  representations such as NatSQL), and post-processing (SQL correction,
  self-consistency, execution-guided refinement, n-best reranking). Table I
  compares design choices across roughly 35 systems from 2020 to 2025,
  including RAT-SQL, PICARD, RESDSQL, DIN-SQL, DAIL-SQL, CodeS, MAC-SQL,
  CHESS, CHASE-SQL and Alpha-SQL.


  The only quantitative claim carried through is that PLM-based methods
  resolve approximately 80% of cases on Spider but drop to about 50% on
  Spider's extra hard cases. Everything else is descriptive; there is no new
  experiment, no re-run of the cited systems under a shared budget, and no
  independent measurement of the modules the authors claim matter.


  The proposed 2-level error taxonomy, the optimization roadmap and the
  module-selection decision flow are argued from the literature rather than
  validated. Treat this as a map of the design space and a reading list, not
  as evidence that any module helps.
