brief: >-
  Text-to-SQL is best understood as a 4-stage pipeline problem rather than a
  single end-to-end capability, and this survey organizes the LLM-era
  literature around that lifecycle: model, training data, evaluation, and
  error analysis.


  The scope covers rule-based, neural, PLM-based, and LLM-based systems, with
  a modular decomposition into pre-processing (schema linking, database
  content retrieval, additional information acquisition), translation
  (encoding, decoding, task-specific prompting, intermediate representation),
  and post-processing (correction, self-consistency, execution-guided
  refinement, n-best reranking). Table I compares roughly 35 named systems
  from BRIDGE and RAT-SQL through DIN-SQL, DAIL-SQL, CodeS, MAC-SQL, CHESS,
  CHASE-SQL, and Alpha-SQL across those design axes, plus benchmarks including
  Spider, BIRD, and BULL.


  The only quantitative claim carried forward is that PLM-based methods
  resolve approximately 80% of cases on Spider but drop to about 50% on
  Spider's extra-hard cases. Everything else is a qualitative synthesis of
  each module's trade-offs.


  Nothing here is measured by the authors. There are no new experiments, no
  ablations, and no re-run comparison of the cataloged systems under a shared
  budget; the error taxonomy and the module-selection decision flow are
  proposed and argued, not validated.


  Use it as a map of the design space and of where benchmark coverage is thin,
  not as evidence that any module helps.
