brief: >-
  Text-to-SQL is no longer one end-to-end model call; the systems that work
  now are modular pipelines with separate stages for schema linking, content
  retrieval, translation, and correction. This survey organizes the field
  around that lifecycle, plus training data, evaluation, and error analysis.


  The scope is LLM-based Text-to-SQL, with a taxonomy covering 4 historical
  stages (rule-based, neural, PLM-based, LLM-based) and a module-level
  comparison table of roughly 35 named systems from 2020 to 2025, including
  DIN-SQL, DAIL-SQL, RESDSQL, CodeS, MAC-SQL, CHESS, CHASE-SQL, and Alpha-SQL,
  indexed by fine-tuning, encoding strategy, decoding strategy, intermediate
  representation, and post-processing choices.


  Few performance figures are given. The main ones: PLM-based models resolve
  approximately 80% of cases in Spider, with accuracy dropping to about 50% on
  Spider's extra hard cases. Comparisons across the surveyed systems are
  descriptive, not re-run on a common harness.


  This is argued and curated, not measured. No new experiments, no
  matched-budget comparison of modules, no replication of the cited numbers.
  The claim that modularity helps rests on reported results from heterogeneous
  papers using different backbones and benchmarks.


  The survey also notes what the field has not solved: open-world queries,
  dirty and large database values, cost-effectiveness, and trustworthiness.


  Use it as a map of module design choices, not as evidence that any one
  choice wins.
