brief: >-
  Survey papers rarely change beliefs about capability, and this one is best
  read as a map of the Text-to-SQL pipeline rather than as evidence. The claim
  it organizes everything around is that LLMs largely resolved the
  natural-language understanding half of Text-to-SQL, shifting the remaining
  difficulty onto the database side: large, dirty, domain-specific schemas and
  the one-to-many mapping from a question to valid SQL.


  The authors review the full lifecycle in 4 parts: translation models,
  training data and benchmarks, evaluation, and error analysis. They tabulate
  design choices across roughly 35 systems from 2020-2025 (BRIDGE, RAT-SQL,
  PICARD, RESDSQL, DIN-SQL, DAIL-SQL, CodeS, MAC-SQL, CHESS, CHASE-SQL,
  Alpha-SQL), broken down by schema linking, DB content retrieval, encoding,
  decoding, intermediate representation, correction, consistency, and
  reranking.


  The only quantitative claim carried through is that PLM-era models resolved
  approximately 80% of Spider cases, with accuracy dropping to about 50% on
  Spider's extra hard split. Everything else is qualitative.


  Nothing is measured here. There is no unified re-evaluation of the surveyed
  systems, no matched-budget comparison, and the per-module tradeoffs (CoT
  latency, beam search cost, index maintenance) are argued from the original
  papers rather than tested. The proposed 2-level error taxonomy and the
  module-selection decision flow are design artifacts, not validated
  instruments.


  Use it as a component checklist and a reading list for BIRD/Spider-era
  systems, not as evidence that any module helps.
