brief: >-
  Text-to-SQL research has reorganized itself around a modular pipeline rather
  than end-to-end generation, and this survey argues that the bottleneck has
  shifted from understanding natural language to handling databases. The
  authors review LLM-era systems through 4 lenses: model, data, evaluation,
  and error analysis.


  The survey covers the lifecycle from pre-processing (schema linking,
  database content retrieval, additional information acquisition) through
  translation (encoding, decoding, prompt strategy, intermediate
  representation) to post-processing (correction, output consistency,
  execution-guided refinement, n-best reranking). Table I compares design
  choices across solutions dated 2020-2025, including DIN-SQL, DAIL-SQL,
  RESDSQL, CodeS, MAC-SQL, CHESS, CHASE-SQL, and Alpha-SQL, plus earlier PLM
  work such as PICARD, RAT-SQL, and Graphix-T5.


  The only accuracy figures given are for the PLM stage: models resolved
  approximately 80% of cases in Spider, dropping to about 50% on Spider's
  extra hard cases. No head-to-head reproduction of LLM-based systems is
  reported in the text here; claims about which modules help are drawn from
  the cited papers, not re-measured under a common setup.


  The contributions that are original to the authors are organizational: a
  two-level error taxonomy, a roadmap for adapting LLMs to Text-to-SQL, and a
  decision flow for module selection. These are argued, not validated
  empirically.


  Use it as a map of the module space and benchmark landscape, not as evidence
  about which pipeline wins.
