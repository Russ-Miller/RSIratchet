brief: >-
  Surveys rarely change beliefs, but this one is organized around a claim
  worth testing: Text-to-SQL has stopped being a language-understanding
  problem and become a database problem. The authors argue that LLMs' emergent
  abilities largely resolved natural language ambiguity, shifting the
  remaining failures onto schema complexity, dirty cell values, and domain
  knowledge.


  The scope is the full lifecycle: translation methods, training data and
  synthesis, evaluation, and error analysis. Table I compares roughly 35 named
  systems from BRIDGE (2020) through CHASE-SQL and Alpha-SQL (2025) across 11
  design axes, including schema linking, DB content retrieval, encoding
  (sequential, graph-based, separate), decoding (greedy, beam,
  constraint-aware incremental), intermediate representation, and
  post-processing.


  On hard figures the survey is thin. PLM-based models resolve approximately
  80% of Spider cases, dropping to about 50% on Spider's extra-hard split. No
  head-to-head reproduction, no matched-budget comparison, and no new
  experiments; the module taxonomy and the 2-level error taxonomy are proposed
  by the authors rather than validated empirically.


  Claims about which modules matter are argued from the literature, not
  isolated. Cost, latency, and SQL execution efficiency are named as open
  problems but not measured anywhere here.


  Use it as a map of the design space and a decision flow for module
  selection, not as evidence that any particular pipeline wins.
