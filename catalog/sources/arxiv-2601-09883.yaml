brief: >-
  Replacing a hand-written multi-agent workflow with a single orchestrator
  agent that coordinates workers in natural language buys nothing when every
  agent uses a strong model, and buys about 8 points when the workers are
  weak.


  The setup is CORAL's A2A toolkit (wait_for_mention, send_messages), where an
  information flow orchestrator talks to a planner, web agent, document agent,
  and reasoning & coding agent, with no predefined state machine. The baseline
  is OWL, a workflow-based MAS, reimplemented with the same agent roles.
  Benchmark is the GAIA validation set, 165 tasks (53 Level 1, 86 Level 2, 26
  Level 3), pass@1, temperature 0, 30 minute budget per task.


  With Grok 4.1 Fast for all agents, both systems reach 0.6424 overall, with
  the A2A system using slightly more tokens. With Grok 4.1 Fast only for main
  agents and GPT 4.1 Mini for workers, the A2A system holds 63.64% while OWL
  falls to 55.15%, a gap of 8.49 percentage points, and uses fewer tokens on
  tasks above 0.6M tokens.


  The comparison controls agent roles and models, which isolates the
  coordination mechanism reasonably well, but it is 1 benchmark, 1 baseline
  system, pass@1 with no repeats or variance reported, and OWL was reproduced
  by the authors (replanning attempts raised from 2 to 3). The coordination
  and edge-case taxonomies, 4 patterns and 3 strategies, are hand-read from
  logs, not measured.


  Domain-specific tasks, where workflows have strong priors, were not tested.


  Treat dynamic orchestration as insurance against weak workers rather than a
  general accuracy gain.
