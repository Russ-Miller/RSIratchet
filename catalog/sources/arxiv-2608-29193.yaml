summary: >-
  Multimodal Large Language Models (MLLMs) can assign similar confidence to
  answers that fail for different reasons. We propose HalluPrism, a
  behavioral diagnostic that re-runs an answer after visual degradation,
  blank-image replacement, and grounding or relation checks. These targeted
  probes yield a signature over visual-perturbation sensitivity (V ),
  image-removal confidence retention (L), and grounding/relation-probe
  instability (A). Across 58K+ examples from four benchmarks and four MLLMs,
  image-removal confidence retention is most prevalent, while
  grounding/relation-probe instability better
