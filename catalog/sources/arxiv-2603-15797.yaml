summary: >-
  Large Language Models (LLMs) have demonstrated exceptional logical
  reasoning capabilities but frequently struggle with the continuous
  spatiotemporal dynamics governed by Partial Differential Equations (PDEs),
  often resulting in non-physical hallucinations. Existing approaches
  typically resort to costly, domain-specific fine-tuning, which severely
  limits cross-domain generalization and interpretability. To bridge this
  gap, we propose OMNIFLOW, a neuro-symbolic architecture designed to ground
  frozen multimodal LLMs in fundamental physical laws without requiring
  domain-specific parameter updates.
