brief: >-
  Asking a general multimodal model to generate scientific flow fields
  directly fails on numerical fidelity; routing the numerics through a
  separate pretrained diffusion simulator and using the frozen LLM only for
  reasoning closes most of the gap. OmniFlow pairs a DiT-based Neural Earth
  Simulator with Gemini 3 Flash running a ReAct loop over physics retrieval, a
  conservation-law critic, and counterfactual probes of perturbed initial
  conditions.


  Evaluation spans 2D Turbulence, ERA5 and SEVIR against vision backbones,
  spatiotemporal predictors and neural operators, plus zero-shot image
  generation by Banana Pro, Seedream 4.5 and ChatGPT-Images.


  Against trained baselines OmniFlow reports the best RMSE/SSIM/PSNR
  everywhere, e.g. SSIM 0.715 on turbulence and 0.552 RMSE on ERA5 versus
  EarthFarseer's 0.615. In 50-sample pixel-space zero-shot comparison it lifts
  ERA5 SSIM from 0.352 to 0.685 and cuts RMSE from 102.5 to 59.10. Report
  quality with Gemini 3 Flash reaches Mech F1 83.2%, above Qwen3-VL.


  Evidence is measured over 5 runs, but there is no ablation separating the
  simulator from the agentic loop, so the claimed contribution of the
  reflexive critic is argued rather than isolated. The zero-shot comparison is
  against image generators in 8-bit PNG space, a weak target. No compute- or
  latency-matched baseline; the authors note added inference latency and
  dependence on simulator fidelity.


  Treat the numbers as evidence for decoupled simulator-plus-LLM pipelines,
  not for LLM physical reasoning itself.
