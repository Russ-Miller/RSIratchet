summary: >-
  Intrinsic self-correction (SC) aims to improve large language model
  outputs by prompting a model to revisit its own initial answer without
  external feedback. Recent studies have questioned the reliability of this
  approach, showing that models often struggle to judge whether their
  initial responses are correct. In this work, we take a task-sensitive view
