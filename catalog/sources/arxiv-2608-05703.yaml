summary: >-
  Deploying autonomous multimodal agents in continuous, real-world
  environments requires them to ingest unbounded audio-visual streams and
  maintain hour-scale memory. However, current evaluations predominantly
  rely on brief clips and multiple-choice formats. This design allows
  minimal baselines that process only the last four frames to match or
  surpass complex streaming models, while answer options also expose
  language shortcuts. We introduce StreamArena, a benchmark for hour-scale,
  interactive streaming video understanding. StreamArena contains 243
