summary: >-
  Language-guided UAV agents must execute long-horizon semantic instructions
  while producing smooth, physically feasible continuous flight commands,
  yet existing Vision-Language Navigation (VLN) benchmarks typically use
  discrete or coarse actions and existing UAV Vision-Language-Action (VLA)
  tasks focus on short, atomic maneuvers. To address this gap in UAV task
  settings, we introduce \textbf{FLIGHT}, a \textbf{F}ine-grained
  \textbf{L}ong-horizon \textbf{I}nstruction-\textbf{G}uided benchmark for
  \textbf{H}ybrid UAV navigation and reasoning \textbf{T}asks, which
  combines multi-stage instructions
