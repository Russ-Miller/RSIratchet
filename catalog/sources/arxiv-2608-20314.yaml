summary: >-
  Mid-training is increasingly recognized as a critical stage for shaping
  the capabilities of large language models. Recent work has shown that
  targeted mid-training can strengthen reasoning-intensive abilities such as
  math and science, and can also improve agentic capabilities in
  software-engineering settings. In this work, we study the parallel but
  less explored agentic capability: general tool use. We present MidTool, an
  open corpus construction pipeline for agentic tool-use mid-training that
  combines large-scale web, PDF, and code data with synthesized supervision
  from real-world tool APIs,
notes: >-
