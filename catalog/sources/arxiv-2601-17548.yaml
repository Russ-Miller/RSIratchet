brief: >-
  Published prompt injection defenses for coding agents hold up in their own
  reported evaluations and collapse under adaptive attack, and this survey
  argues the gap is architectural rather than fixable by filtering.


  The paper is a Systematization of Knowledge covering agentic coding
  assistants (Claude Code, GitHub Copilot, Cursor, OpenAI Codex CLI) and the
  Model Context Protocol. It screens 183 initial results down to 78 primary
  sources from January 2024 to December 2025, proposes a 3-dimensional
  taxonomy (delivery vector, modality, propagation), and adds previously
  undocumented exploit chains for Claude Code skills and Copilot Extensions.


  Reported numbers are borrowed from the underlying studies. Detectors
  reported under 5% bypass but reach 93% (Protect AI), 91% (PromptGuard), 89%
  (PIGuard) and 78% (Model Armor) under adaptive optimization. MCPSecBench
  finds 85%+ of attacks compromise at least one platform. AIShellJack's 314
  payloads across 70 MITRE ATT&CK techniques get 41%-84% success.
  Prevention-side: SecAlign cuts attack success from 96% to 2%, Progent from
  41.2% to 2.2%, CaMeL gives provable security on 77% of AgentDojo tasks.


  Nothing here is measured by the authors; they state they ran no independent
  replication. Platform vulnerability ratings (Cursor Critical, Claude Code
  Low) are judgment calls, not benchmark scores, and the 73% boundary-failure
  figure has no stated test set.


  Use it as a map of the attack surface and a warning about vendor-reported
  defense numbers, not as new evidence.
