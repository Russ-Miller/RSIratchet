brief: >-
  Contrastive decoding for vision-language hallucination weakens as generation
  proceeds, because the model stops depending on image tokens; removing
  important text tokens instead restores the contrast signal. CRoPS builds a
  second "hallucinated" model that drops all visual tokens and the
  most-attended text tokens, then subtracts both it and a vision-deficit model
  from the original logits under a generalized multi-model contrastive
  formulation.


  Tested on LLaVA-1.5 (7B and 13B), LLaVA-NeXT (8B) and Qwen2-VL (7B) across
  CHAIR on MS-COCO, AMBER, POPE, a GPT-4o-assisted benchmark, MME and
  MathVista, against VCD, ICD, OPERA, ClearSight, SID and M3ID.


  On LLaVA-1.5 7B CHAIR, C_S falls from 57.0 (sampling) and 47.1 (M3ID) to
  39.5, C_I from 17.0 to 10.2, with recall 76.3. AMBER HAL drops from 44.3 to
  29.3. POPE gains are smaller, around 2% accuracy over the strongest
  baseline. MME rises from 1601 to 1662 on LLaVA-1.5.


  Effects are measured, averaged over 3 seeds, with one shared hyperparameter
  configuration across all backbones and benchmarks. Ablations isolate the
  pieces: random text removal is worse (C_S 50.7 vs 43.2), and substituting
  M3ID for the second hallucinated model gives 45.1 vs 39.5. Latency is
  reported, not hidden: 652s vs 215s for sampling.


  Only training-free contrastive methods were compared; no training-based
  baselines, and MathVista gains do not hold on Qwen2-VL (55.6 vs 56.9 for
  sampling).


  If you use contrastive decoding, the text-side hallucinated model is the
  part worth stealing.
