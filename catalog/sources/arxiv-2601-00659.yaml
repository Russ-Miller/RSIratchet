brief: >-
  Contrastive decoding for vision-language hallucination loses its grip late
  in a generation, because the model stops depending on visual tokens once it
  has text to condition on. Building a second "hallucinated" model by deleting
  important text tokens instead of image tokens restores the contrastive
  signal in that regime.


  CRoPS combines a vision-deficit model (remove high-attention visual tokens)
  with a vision-and-text-deficit model (remove visual tokens plus
  high-attention prompt/generated tokens), weighted so the text-deficit term
  grows over time. Tested on LLaVA-1.5 7B/13B, LLaVA-NeXT 8B, Qwen2-VL 7B
  across CHAIR on MS-COCO, AMBER, POPE, a GPT-4o-assisted benchmark, MME, and
  MathVista, against VCD, ICD, OPERA, ClearSight, SID, M3ID.


  On MS-COCO CHAIR with LLaVA-1.5 7B, C_S drops 57.0 (sampling) to 39.5, C_I
  17.0 to 10.2, recall 76.3 vs 75.0 for sampling. AMBER HAL falls 44.3 to
  29.3. POPE accuracy gains about 2% over the strongest baseline. MME rises
  1601 to 1662 on LLaVA-1.5.


  Measured, with 3 seeds, 1 shared hyperparameter configuration across all
  backbones, and ablations isolating text-token removal (random removal gives
  C_S 50.7 vs 43.2 selective) and the token retention schedule. Swapping in
  M3ID as the second model gives C_S 45.1, attributing gains to the specific
  text-deficit design.


  Training-free contrastive methods only; latency is roughly 3x sampling (652s
  vs 215s). If you deploy contrastive decoding, the late-generation failure
  mode is the part worth fixing.
