brief: >-
  Contrastive decoding for vision-language hallucination loses its grip as
  generation proceeds, because the model's dependence on visual tokens decays
  over time; building a second "hallucinated" model by deleting the most
  important text tokens restores the contrast signal late in a caption.


  CRoPS combines 2 hallucinated models under a generalized contrastive
  decoding rule: one with important visual tokens removed (SID-style), one
  stripped of all visual tokens plus the highest-attention text tokens, with
  the second term's weight growing over generation steps. Evaluated on
  LLaVA-1.5 (7B, 13B), LLaVA-NeXT (8B), Qwen2-VL (7B) across CHAIR/MS-COCO,
  AMBER, POPE, a GPT-4o-assisted benchmark, MME, and MathVista, against VCD,
  ICD, OPERA, ClearSight, SID, M3ID.


  On MS-COCO CHAIR with LLaVA-1.5 7B, C_S drops from 57.0 (sampling) and 47.1
  (M3ID) to 39.5, C_I from 17.0 to 10.2, recall held at 76.3. AMBER HAL falls
  from 44.3 to 29.3. POPE accuracy gains are roughly 2% over the best
  baseline. MME rises to 1662/1779/2184.


  Effects are measured, averaged over 3 random seeds, with ablations isolating
  the text-removal design: random text removal gives C_S 50.7, stacking
  M3ID+SID gives 45.1, and alternative token-retention schedules are worse. 1
  shared hyperparameter configuration is used across all backbones. ClearSight
  reaches lower C_S on Qwen2-VL but collapses recall to 38.2, so single-metric
  comparisons mislead.


  Limits: only training-free contrastive methods are compared, no
  training-based baselines, and CRoPS runs about 3x slower than sampling (652s
  vs 215s).


  If you use contrastive decoding, the decay of visual dependency over
  generation steps is the failure mode to design against.
