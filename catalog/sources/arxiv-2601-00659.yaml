brief: >-
  Contrastive decoding for vision-language hallucination loses its grip late
  in generation, because the model's dependence on visual tokens decays as
  more text is generated. Removing important text tokens, not just visual
  ones, restores the contrast signal.


  CRoPS builds 2 hallucinated models: one that prunes high-attention visual
  tokens (as in SID) and one that drops all visual tokens plus the most
  important prompt and generated text tokens, retained according to an
  exponential schedule. Both are subtracted from the original logits under a
  generalized contrastive decoding rule, with the text-deficit weight growing
  over time. Tested on LLaVA-1.5 7B/13B, LLaVA-NeXT 8B and Qwen2-VL 7B across
  CHAIR on MS-COCO, AMBER, POPE, a GPT-4o-assisted benchmark, MME and
  MathVista.


  On CHAIR with LLaVA-1.5 7B, C_S falls from 57.0 (sampling) and 47.1 (M3ID)
  to 39.5, C_I from 17.0 to 10.2, with recall 76.3. AMBER HAL drops from 44.3
  to 29.3. POPE accuracy gains about 2% over the best baseline. MME rises 1601
  to 1662.


  Measured, with 3 seeds, 1 shared hyperparameter set across all backbones,
  and ablations isolating the contribution: random text removal gives C_S 50.7
  versus 43.2 for least-important removal, and swapping in M3ID as the second
  model gives 45.1. Latency is 652s versus 215s for sampling.


  Only training-free contrastive methods were compared; no training-based
  baselines, and recall sometimes drops slightly.


  If you use contrastive decoding, the late-generation decay is the failure
  mode to target.
