brief: >-
  Contrastive decoding for vision-language hallucination weakens as generation
  lengthens, because models stop depending on visual tokens; building a second
  hallucinated model by deleting important text tokens restores the contrast
  signal late in a caption.


  CRoPS combines 2 hallucinated models, one stripped of important visual
  tokens (as in SID) and one stripped of visual tokens plus high-attention
  text tokens, under a generalized contrastive decoding rule with a
  time-growing weight on the text-deficit term. Tested on LLaVA-1.5 7B and
  13B, LLaVA-NeXT 8B, and Qwen2-VL 7B across CHAIR on MS-COCO, AMBER, POPE, a
  GPT-4o-assisted benchmark, MME, and MathVista, against VCD, ICD, OPERA,
  ClearSight, SID, M3ID.


  On LLaVA-1.5 7B CHAIR, C_S drops from 47.1 (M3ID) to 39.5 and C_I from 12.8
  to 10.2, with recall 76.3 vs 74.8. AMBER HAL falls 44.3 to 29.3. POPE
  accuracy rises about 2% over the strongest baseline. MME goes 1601 to 1662.


  Measured, averaged over 3 random seeds, with 1 shared hyperparameter
  configuration across all backbones and benchmarks. Ablations isolate the
  pieces: random text removal is worse (C_S 50.7 vs 43.2), and swapping in
  M3ID as the second model gives 45.1 vs 39.5. Latency is reported at matched
  hardware but not matched compute: 652s vs 215s for sampling.


  Only training-free contrastive decoding baselines are considered; gains on
  Qwen2-VL are smaller, and MathVista on Qwen2-VL does not improve over
  sampling (55.6 vs 56.9).


  If you use contrastive decoding, the fix worth copying is making the
  contrast target text, not just images, late in generation.
