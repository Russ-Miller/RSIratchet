brief: >-
  Contrastive decoding for vision-language hallucination loses its grip late
  in a generation, because the model stops depending on visual tokens;
  building a second hallucinated model that strips important text tokens
  instead restores the contrast signal. CRoPS combines a vision-deficit model
  with this text-deficit model under a generalized contrastive decoding rule
  that subtracts several hallucinated models at once, with a time-increasing
  weight on the text term.


  Tested on LLaVA-1.5 7B and 13B, LLaVA-NeXT 8B, and Qwen2-VL 7B, against VCD,
  ICD, OPERA, ClearSight, SID and M3ID, across CHAIR on MS-COCO, AMBER, POPE,
  a GPT-4o-assisted benchmark, MME and MathVista.


  On LLaVA-1.5 7B CHAIR, C_S falls from 57.0 (sampling) and 47.1 (M3ID) to
  39.5, C_I from 17.0 to 10.2, with recall 76.3 vs 74.8. AMBER HAL drops from
  44.3 to 29.3. POPE accuracy rises about 2% over the strongest baseline. MME
  goes 1601 to 1662.


  Measured, with ablations that isolate the new component: swapping the
  text-deficit model for M3ID gives 45.1 C_S, random rather than
  least-important text removal gives 50.7, and the exponential retention
  policy beats constant, all-but-one and linear. 3 seeds, 1 shared
  hyperparameter setting across all backbones and benchmarks.


  Only training-free contrastive methods were compared, and CRoPS is about 3x
  slower than sampling (652s vs 215s). ClearSight reaches lower C_S on
  Qwen2-VL but collapses recall to 38.2.


  If you use contrastive decoding, the late-generation decay is the failure
  mode to target.
