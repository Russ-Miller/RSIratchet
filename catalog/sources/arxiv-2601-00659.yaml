brief: >-
  Contrastive decoding for vision-language hallucination weakens as generation
  proceeds, because the model's dependence on visual tokens falls off;
  building a second "hallucinated model" by stripping important text tokens
  restores the contrast signal late in a caption.


  CRoPS combines 2 hallucinated models under a generalized contrastive
  decoding rule: one that removes important visual tokens (SID-style) and one
  that removes all visual tokens plus the most-attended text tokens, with the
  second term's weight growing over time. Tested on LLaVA-1.5 7B/13B,
  LLaVA-NeXT 8B, and Qwen2-VL 7B across CHAIR/MS-COCO, AMBER, POPE, a
  GPT-4o-assisted benchmark, MME, and MathVista, against VCD, ICD, OPERA,
  ClearSight, SID, M3ID.


  CHAIR C_S on LLaVA-1.5 7B drops from 47.1 (M3ID) to 39.5, with recall 76.3
  vs 74.8. AMBER HAL on LLaVA-1.5 7B falls 40.0 to 29.3. POPE gains are about
  2% accuracy over the strongest baseline. MME rises 1683 to 1779 on
  LLaVA-NeXT.


  Effects are measured over 3 seeds with 1 shared hyperparameter configuration
  across all backbones. Ablations isolate the pieces: random text removal is
  worse (C_S 50.7 vs 43.2), and stacking M3ID+SID instead gives 45.1. Latency
  is reported: 652s vs 215s for sampling.


  Only training-free contrastive methods are compared; no training-based
  baselines, and ClearSight's lower C_S on Qwen2-VL comes with recall 38.2,
  showing the metric is gameable by suppression.


  If you use contrastive decoding, the text-side hallucinated model is the
  part worth copying.
