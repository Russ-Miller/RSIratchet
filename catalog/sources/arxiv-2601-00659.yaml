summary: "Despite the rapid success of Large Vision-Language Models (LVLMs), a
  persistent challenge is their tendency to generate hallucinated content,
  undermining reliability in real-world use. Existing training-free methods
  address hallucinations but face two limitations: (i) they rely on narrow
  assumptions about hallucination sources, and (ii) their effectiveness
  declines toward the end of generation, where hallucinations are most likely
  to occur. A common strategy is to build hallucinated models by completely or
  partially removing visual tokens and contrasting them with the original
