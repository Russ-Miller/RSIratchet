brief: >-
  Contrastive decoding for vision-language hallucination weakens as generation
  lengthens, because the model's dependence on visual tokens decays;
  contrasting against a text-deficit model instead of only an image-deficit
  one restores the signal. CRoPS builds a second hallucinated model by
  deleting the most important text tokens (prompt plus past generations) and
  combines it with an SID-style visual-token-pruned model under a generalized
  contrastive decoding rule that sums multiple contrasts with time-varying
  weights.


  Tested on LLaVA-1.5 7B and 13B, LLaVA-NeXT 8B, and Qwen2-VL 7B across CHAIR
  on MS-COCO, AMBER, POPE, a GPT-4o-assisted benchmark, MME, and MathVista,
  against VCD, ICD, OPERA, ClearSight, SID, and M3ID.


  On LLaVA-1.5 7B CHAIR, C_S falls from 57.0 (sampling) and 47.1 (M3ID) to
  39.5, with recall 76.3 vs 74.8. AMBER HAL drops from 44.3 to 29.3. POPE
  accuracy rises about 2% over the best baseline. MME improves to 1662, 1779,
  and 2184 across the 3 families.


  Evidence is measured, 3 seeds, 1 shared hyperparameter configuration with no
  per-model tuning, and ablations isolate the components: random text removal
  is worse (C_S 50.7 vs 43.2), and swapping the second model for M3ID gives
  45.1. ClearSight's lower C_S on Qwen2-VL comes with recall collapse (38.2 vs
  67.4), a trade-off CRoPS avoids.


  All models are open 7B-13B LVLMs; only training-free contrastive methods
  were compared, and latency is roughly 3x sampling (652s vs 215s).


  If you use contrastive decoding, the text-side contrast is the part you are
  probably missing.
