brief: >-
  Contrastive decoding for vision-language hallucination fails late in
  generation because the model stops depending on visual tokens; building a
  hallucinated model that strips important text tokens instead restores the
  contrast signal. CRoPS combines two hallucinated models, one with visual
  tokens removed and one deprived of visual plus high-importance text tokens,
  under a generalized contrastive decoding rule that subtracts multiple
  hallucinated logits with a time-increasing weight on the text-deficit term.


  Tested on LLaVA-1.5 (7B and 13B), LLaVA-NeXT (8B) and Qwen2-VL (7B) across
  CHAIR on MS-COCO, AMBER, POPE, a GPT-4o-assisted benchmark, MME and
  MathVista, against VCD, ICD, OPERA, ClearSight, SID and M3ID.


  On LLaVA-1.5 7B CHAIR, C_S drops from 57.0 (sampling) and 47.1 (M3ID) to
  39.5, C_I from 17.0 to 10.2, with recall 76.3. AMBER HAL falls from 44.3 to
  29.3. POPE gains are small: accuracy 83.9 vs 82.7 for SID on LLaVA-1.5. MME
  rises 1601 to 1662.


  Evidence is measured, 3 seeds, 1 shared hyperparameter configuration across
  all backbones, with ablations separating image-only, text-only, random-token
  and M3ID+SID stacking variants, which attributes the gain to selective
  text-token removal rather than to adding a second model.


  Cost is real: 652s vs 215s for sampling, roughly 3x. Only training-free
  contrastive methods were compared; no training-based baselines.


  If you use contrastive decoding for captioning, the late-generation failure
  mode is the thing to fix.
