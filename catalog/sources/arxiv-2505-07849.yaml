brief: >-
  A single-shot retrieve-and-rerank pipeline beats multi-step LLM agents at
  finding which functions a GitHub issue refers to, at roughly 1/50th the
  cost. The claim cuts against the assumption that codebase localization needs
  iterative tool use.


  SweRank pairs SweRankEmbed (bi-encoder, 137M or 7B) with SweRankLLM
  (listwise reranker, 7B or 32B), both finetuned on SweLoc: 67,341 issue/patch
  pairs mined from 3387 Python repos, with top-20 consistency filtering and 15
  mined hard negatives. Evaluated on SWE-Bench-Lite (274 examples) and
  LocBench (560 examples) against MoatlessTools, SWE-Agent, OpenHands and
  LocAgent.


  SweRankLLM-Large reaches 83.21 file Acc@1 and 88.69 function Acc@10 on
  SWE-Bench-Lite, versus 77.74 and 77.37 for LocAgent with Claude-3.5, at
  $0.015 vs $0.66 per example. On issues touching 2–3 functions, LocAgent
  falls from 82.0% to 47.1% while the retriever holds 77.1%.


  The data pipeline is ablated: no consistency filtering makes finetuning
  worse than the base model, and 3 retrievers plus 6 Qwen2.5 rerankers all
  gain from SweLoc, which isolates the dataset rather than the architecture.
  Agent baselines are taken as reported, not rerun.


  Limits: Python only, repos overlapping the benchmarks excluded, >5 gold
  functions gives single-digit accuracy for everything. Downstream repair
  rises only 22.6 to 24.5 Pass@1, with oracle localization at 25.9.


  If you are paying for agentic localization, a trained ranker likely matches
  it.
