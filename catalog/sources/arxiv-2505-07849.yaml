brief: >-
  Retrieval-and-rerank on task-specific contrastive data beats multi-turn LLM
  agents at finding the code a GitHub issue refers to, at a fraction of the
  cost. This cuts against the assumption that codebase localization needs
  iterative tool use and dependency traversal.


  SweRank pairs SweRankEmbed (137M CodeRankEmbed or 7B GTE-Qwen2 bi-encoder)
  with SweRankLLM, a listwise reranker (7B or 32B Qwen2.5), both finetuned on
  SweLoc: 67,341 PR-codebase pairs from 3387 Python repos, filtered so the
  positive function ranks in the top 20, with 15 hard negatives. Evaluated on
  SWE-Bench-Lite (274 examples) and LocBench (560) at file, module and
  function granularity.


  SweRankLLM-Large reaches 88.69 function Acc@10 on SWE-Bench-Lite against
  77.37 for LocAgent with Claude-3.5, at $0.015 vs $0.66 per instance. The
  137M retriever (74.45) beats 7B GTE-Qwen2 (70.44). On issues touching 2–3
  functions, LocAgent drops from 82.0% to 47.1% while SweRankEmbed-Large holds
  77.1%.


  Ablations isolate the causes: removing consistency filtering degrades
  performance below the pretrained checkpoint, and finetuning on SweLoc lifts
  3 unrelated retrievers (+8.1 to +17.4 function Acc@10) and 6 Qwen rerankers.
  Agent baselines are taken from prior reports, not rerun.


  Issues needing >5 functions remain near single-digit accuracy for every
  method, training data is Python-only, and downstream repair gains are small
  (24.5 vs 22.6 Pass@1, oracle 25.9).


  If you are paying for agentic localization, a trained reranker is the
  cheaper default.
