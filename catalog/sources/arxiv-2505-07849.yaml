brief: >-
  Single-shot retrieve-and-rerank beats multi-step LLM agents at finding which
  functions a GitHub issue refers to, at a fraction of the cost. The
  bottleneck was training data, not architecture: code retrievers trained on
  docstring-to-code pairs transfer poorly to verbose failure-describing
  queries.


  SweRank pairs SweRankEmbed (bi-encoder, 137M or 7B) with SweRankLLM
  (listwise reranker, 7B or 32B), both fine-tuned on SweLoc, 67,341 issue-PR
  pairs from 3387 Python repos with consistency filtering (K=20) and 15 mined
  hard negatives. Evaluated on SWE-Bench-Lite (274 examples) and LocBench (560
  examples) at file, module and function granularity.


  SweRankLLM-Large reaches 88.69 function Acc@10 on SWE-Bench-Lite against
  77.37 for LocAgent with Claude-3.5, at $0.015 vs $0.66 per instance. On
  issues touching 2-3 functions, LocAgent drops from 82.0% to 47.1% while
  SweRankEmbed-Large holds 77.1%.


  The data claim is well isolated: 3 retrievers and 6 Qwen2.5 rerankers all
  improve after SweLoc fine-tuning (+8.1 to +17.4 function Acc@10 for
  retrievers), and removing filtering makes performance worse than the
  pretrained model. Agent baselines are taken as reported, not rerun.


  Issues touching >5 functions stay in single-digit accuracy for every method.
  Downstream repair gains are small: 24.5 pass@1 vs 22.6 for LocAgent, 25.9
  with oracle files.


  If you are paying for agentic localization, a trained reranker is likely
  cheaper and better.
