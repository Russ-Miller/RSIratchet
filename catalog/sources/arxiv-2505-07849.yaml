brief: >-
  Single-shot retrieve-and-rerank beats multi-step LLM agents at finding the
  code a GitHub issue refers to, at a fraction of the cost. SweRank pairs
  SweRankEmbed, a bi-encoder retriever (137M and 7B variants), with
  SweRankLLM, a listwise reranker (7B and 32B), both finetuned on SweLoc:
  67,341 (PR, codebase) pairs mined from 3387 Python repos, with top-20
  consistency filtering and 15 hard negatives per instance.


  On SWE-Bench-Lite (274 of 300 examples) SweRankLLM-Large reaches 83.21 file
  Acc@1 and 88.69 function Acc@10, against LocAgent with Claude-3.5 at 77.74
  and 77.37. The 137M retriever alone beats 7B embedding baselines. Cost per
  instance is $0.015 vs $0.66 for LocAgent with Claude-3.5, up to 6X better
  performance-cost tradeoff. LocBench (560 examples) shows the same ordering.


  The effect is measured, with ablations that isolate the data: finetuning on
  SweLoc lifts 3 unrelated retrievers (+8.1 to +17.4 function Acc@10) and 6
  Qwen2.5 rerankers; removing consistency filtering makes performance drop
  below the pretrained model. Complexity, lexical-overlap and semantic-overlap
  breakdowns are reported.


  Limits: Python only, repos excluded to avoid benchmark leakage, and issues
  touching more than 5 functions stay in single-digit accuracy for every
  method. Downstream repair gains are small (24.5 vs 22.6 Pass@1, oracle
  25.9), so editing is now the bottleneck.


  If you are paying for agentic localization, a trained ranker is the cheaper
  default.
