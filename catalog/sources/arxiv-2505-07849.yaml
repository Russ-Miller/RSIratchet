summary: Software issue localization, the task of identifying the precise code
  locations (files, classes, or functions) relevant to a natural language
  issue description (e.g., bug report, feature request), is a critical yet
  time-consuming aspect of software development. While recent LLM-based
  agentic approaches demonstrate promise, they often incur significant latency
  and cost due to complex multi-step reasoning and relying on closed-source
  LLMs. Alternatively, traditional code ranking models, typically optimized
  for query-to-code or code-to-code retrieval, struggle with the verbose and
  failure-descrip
