brief: >-
  A single-shot retrieve-and-rerank pipeline beats multi-step LLM agents at
  finding which functions a GitHub issue refers to, at a fraction of the cost.
  This cuts against the assumption that codebase localization needs iterative
  tool use and repository traversal.


  SweRank pairs SweRankEmbed (a bi-encoder, 137M or 7B) with SweRankLLM (a
  listwise reranker, 7B or 32B), both finetuned on SweLoc: 67,341 issue/patch
  pairs mined from 3387 Python repos, with top-K consistency filtering (K=20)
  and 15 mined hard negatives. Evaluation is on SWE-Bench-Lite (274 examples)
  and LocBench (560 examples) at file, module and function granularity.


  SweRankLLM-Large reaches 88.69 function Acc@10 on SWE-Bench-Lite versus
  77.37 for LocAgent with Claude-3.5, and 76.25 versus 60.71 function Acc@15
  on LocBench. Cost per instance is $0.015 against $0.66 for LocAgent with
  Claude-3.5. Swapping SweRank into the SWE-Fixer repair pipeline lifts repair
  Pass@1 from 22.6 to 24.5, against an oracle ceiling of 25.9.


  Evidence includes ablations on filter threshold and data size, and
  finetuning 3 retrievers and 6 Qwen2.5 rerankers on SweLoc, all of which
  improve. Agent baselines are taken as reported rather than rerun, and
  training and test differ in repo set but share Python only.


  Issues touching more than 5 functions stay in single-digit accuracy for
  every method, so the gain is on concentrated edits. Non-Python languages are
  untested.


  If you are building a repair pipeline, try ranking before reaching for an
  agent.
