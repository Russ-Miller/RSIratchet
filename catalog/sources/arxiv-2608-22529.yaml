brief: >-
  Functional correctness of LLM-generated C# tells you almost nothing about
  its structural quality: across 340 solutions the Pearson correlation between
  correctness and a composite quality score was r = 0.075.


  The pipeline translated 85 HumanEval tasks into C#, queried GPT-4, Gemini
  1.5 Pro, Claude 3.5 Sonnet and Grok 3 at temperature = 0, then scored each
  output 3 ways: unit tests via .NET Reflection, Roslyn AST metrics
  (cyclomatic complexity, nesting, naming violations, documentation), and
  BenchmarkDotNet profiling at N = 100, 1,000 and 10,000 with worst-case
  inputs written by a separate DeepSeek-V3 instance.


  Mean correctness clustered tightly: Gemini 98.53%, Claude 98.32%, Grok
  97.98%, GPT 96.37% with the highest variance (SD = 15.37) and a quality
  collapse on failed tasks (22.44 vs 39.51 on passes). Claude produced the
  simplest code (complexity 2.47, nesting 1.13) but the worst memory footprint
  (156.6 MB median, roughly 26x Grok's 6.0 MB). Cross-model complexity
  agreement on identical tasks was r = 0.63 to 0.69, so task difficulty, not
  model style, drives most complexity.


  The orthogonality is measured, but correctness is itself 1 of the 5
  composite components, which the authors flag as partly self-referential; the
  robustness check excluding it is future work. 1 run per task, 85
  single-function tasks, no multi-file or enterprise .NET code, no multi-run
  variance analysis.


  If you pick models by Pass@k, you are not ranking maintainability or runtime
  cost.
