summary: >-
  Reliable evaluation of large language models should separate supported
  answering from unsupported guessing without conflating either with data
  contamination, prompt idiosyncrasy, or generic refusal behavior. We
  present a contamination-aware, multi-zone benchmark for measuring the
  transition from answerable knowledge to abstention-expected unknowns under
  frozen build-time labels. The benchmark contains 1,200 items across five
  domains, explicit abstention expectations, contamination-risk metadata,
  and dual parsing with an official strict parser plus a normalized
  robustness parser. We evaluate FL
