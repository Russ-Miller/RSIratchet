summary: >-
  Deepfake detection models often generate natural-language explanations,
  yet their reasoning is frequently ungrounded in visual evidence, limiting
  reliability. Existing evaluations measure classification accuracy but
  overlook reasoning fidelity. We propose DeepfakeJudge, a framework for
  scalable reasoning supervision and evaluation, that integrates an
  out-of-distribution benchmark containing recent generative and editing
  forgeries, a human-annotated subset with visual reasoning labels, and a
  suite of evaluation models, that specialize in evaluating reasoning
