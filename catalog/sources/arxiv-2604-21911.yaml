brief: >-
  Vision-language models can see the object is absent and still describe it,
  if the question assumes it is there. HalluScope separates 3 hallucination
  causes by asking, per image, about a present object, a random absent object,
  a semantically plausible absent (adversarial) object, and an attribute
  question that presupposes the adversarial object exists. Images come from
  COCO, with Florence-2-large and Grounding-DINO verification and PMI
  co-occurrence statistics picking adversarial objects; 3K images per subset.


  Across InternVL3-5-8B, Molmo-7B-D, Qwen2-VL-7B, Qwen2.5-VL-7B and
  LLaVA-1.5-7B, positive and random recognition stay above 85%, adversarial
  recognition drops by about 8% to 37%, and presupposition rejection drops
  approximately 25% to 85% relative to those, and at least more than 15% below
  adversarial recognition. LLaVA-1.5-7B scores 5.85 on AdP.


  HalluVL-DPO, a weighted DPO on 20k synthetic preference samples, raises
  LLaVA AdP 5.85 to 84.65 and adversarial recognition 58.5 to 81.28;
  Qwen2-VL-7B AdP goes 57.96 to 82.83. MME, ScienceQA and MMVet are roughly
  preserved; positive recognition falls for LLaVA from 94.85 to 84.30.


  Evidence includes ablations removing each preference type at fixed 20k, a
  data-scale curve, and VCD and Antidote baselines, but mitigation is tested
  on only 2 models, with synthetic training images and LLM-judged
  presupposition scoring.


  Treat presupposing prompts as a distinct, larger failure mode than
  perception.
