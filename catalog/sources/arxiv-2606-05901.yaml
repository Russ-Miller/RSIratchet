brief: >-
  Adding handwritten graph-query tools on top of vector retrieval cuts
  hallucinated answers on complex multi-hop questions roughly in half, while
  the agent still mostly falls back on vector search unless prompted
  otherwise.


  The system is a single LangChain agent on GPT-5.4 (reasoning effort medium)
  with 11 tools over a Neo4j store built from an August 2025 English Wikipedia
  snapshot: 5,771,867 nodes and 22,088,251 relationships, schema limited to
  articles, sections, paragraphs, chunks and links. Three configurations
  (vector RAG, vector+graph RAG, zero-shot) were run 3 times each on 510
  MoNaCo questions, judged by Llama-4-Maverick with Ragas.


  Factual correctness precision rose from 0.15 to 0.36 and recall from 0.13 to
  0.33; answer relevancy from 0.35 to 0.61. Fine-grained truthfulness was best
  for vector+graph RAG at 63, versus 35 for vector RAG and 40.5 for zero-shot.
  Zero-shot gave 174 fully correct answers but hallucinated on 301 of 510.
  Total tokens rose from 41694 to 45695.


  Evidence is measured with 3 repeats, but on 1 benchmark, 1 reasoning model,
  no human validation of the judge, and no per-tool ablation; the prompt
  differed between arms by design.


  MoNaCo is Wikipedia-based, so zero-shot is inflated and proprietary-KB
  generalisation is untested.


  Treat lightweight document graphs as a cheap hallucination reducer, not a
  correctness ceiling.
