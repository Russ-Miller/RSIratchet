summary: >-
  Multimodal Large Language Models (MLLMs) are prone to hallucination as
  their generation preferences are insufficiently calibrated to visual
  evidence, causing them to fall back on linguistic priors, rather than
  faithful grounding. In this work, we start from an empirical observation:
  when query-relevant visual evidence is explicitly strengthened using the
  model's own attention, generation becomes more accurate, suggesting that
