summary: "It is clear that one of the primary tools we can use to mitigate the
  potential risk from a misbehaving AI system is the ability to turn the
  system off. As the capabilities of AI systems improve, it is important to
  ensure that such systems do not adopt subgoals that prevent a human from
  switching them off. This is a challenge because many formulations of
  rational agents create strong incentives for self-preservation. This is not
  caused by a built-in instinct, but because a rational agent will maximize
  expected utility and cannot achieve whatever objective it has been given if
  it is dead. Our goal is to study the incentives an agent has to allow itself
  to be switched off. We analyze a simple game between a human H and a robot
  R, where H can press R&#39;s off switch but R can disable the off switch. A
