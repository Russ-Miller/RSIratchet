brief: >-
  An agent's willingness to be shut off comes from uncertainty about its own
  objective, not from a built-in self-preservation override. If a robot treats
  a human's decision to press the off switch as evidence about the true
  utility, waiting is weakly preferred to acting unilaterally; if it is
  certain of the utility, it prefers to bypass the human unless the human is
  perfectly rational.


  The setup is a formal one-shot game: the robot either acts directly, waits
  for the human's verdict, or switches itself off; the human, holding the true
  utility, can press the switch. This is analysis, not experiment, with no
  models or benchmarks involved.


  Two theorems, plus a corollary. With a rational human the incentive to wait
  is non-negative, and strictly positive whenever the robot's belief puts mass
  on both positive and negative utility. Under a Gaussian belief and a
  Boltzmann-noisy human, the incentive equals a variance term minus a bias
  term weighted by the probability of correction, so high certainty plus high
  human irrationality flips the robot toward acting alone or switching itself
  off. A design-time simulation shows value peaks when the robot's variance
  matches the true Bayesian posterior, and the cost of extra uncertainty grows
  with the number of available actions.


  Evidence is mathematical, on a deliberately minimal game: 1 human, 1 robot,
  one shot, one information source, no cost for disabling the switch.
  Sequential settings and model misspecification are untested.


  Read it as the formal grounding for objective uncertainty as a corrigibility
  mechanism, plus its price.
