  such as computing cot(-540°) or evaluating (1).startswith("1"), instead of
  abstaining. We ask whether this failure reflects missing recognition or
  failed routing from recognition to abstention. Across instruction-tuned
  models from 1.7B to 70B parameters, a single linear direction in the
  hidden state separates answerable from structurally impossible math and
  code prompts, showing that models represent impossibility before
