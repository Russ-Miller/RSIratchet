summary: >-
  Large language models serve heterogeneous populations structured by
  domain, topic difficulty, and linguistic style. Conformal risk control
  (CRC) gives rigorous marginal risk guarantees for selective prediction
  with abstention, but marginal guarantees do not imply per-group ones: a
  model can meet the population budget while systematically over-exposing
  subgroups to errors. Under mild shift in group composition, standard CRC
  violates the budget in up to 47% of trials. We propose HG-CRC
