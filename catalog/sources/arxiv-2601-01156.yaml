brief: >-
  Training a deliberately unfaithful "Evil" model by penalizing correct
  tokens, rather than by fine-tuning on annotated hallucinated answers, gives
  a better contrastive signal for suppressing hallucinations at decoding time.


  DHI modifies the Evil model's loss to assign negative weight to the factual
  answer spans, edits the causal attention mask so penalized tokens do not
  influence later tokens, and at inference restricts contrastive subtraction
  to tokens where the positive model is already confident. Training uses 9,196
  expanded QA items derived from HaluEval; evaluation is TruthfulQA (817
  questions, MC1/MC2/MC3) and FACTSCORE biographies, with Llama2-7B-Base/Chat
  and LoRA.


  On TruthfulQA, DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2,
  against ICD at 50.5, DoLa 41.1, ITI 39.8, 70B-Chat greedy 42.2. On
  FACTSCORE, score 68.1 vs ICD 66.3, with 49.9 facts per response.


  The effect is measured against several decoding baselines, and a component
  ablation isolates each piece: removing selective contrast drops average to
  51.7, mask adaptation to 52.5, loss modification to 51.4. An α sweep shows
  an inverted U, best at 0.05 (53.2), worst at 0.00 (49.8).


  Everything is 1 base model family at 7B, 2 benchmarks, no human evaluation
  of fluency, and no compute-matched comparison for the doubled inference cost
  of contrastive decoding.


  If you use ICD, the annotated-hallucination dataset is probably unnecessary.
