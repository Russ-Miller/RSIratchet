brief: >-
  Training a deliberately unreliable "Evil" model by penalizing factually
  correct tokens, rather than by fine-tuning on annotated hallucination data,
  produces a stronger contrastive signal for factuality. DHI adds a
  negative-weighted loss term at answer-token positions, removes those
  positions' influence on later tokens via a modified causal attention mask,
  and at inference restricts contrastive subtraction to tokens where the
  positive model is already confident.


  The setup is Llama2-7B-Chat as positive model contrasted against a
  LoRA-finetuned 7B, with training data built by expanding 30,000 HaluEval QA
  answers into declarative sentences with GPT-4o and filtering to 9,196
  entries. Evaluation is TruthfulQA (817 questions, MC1/MC2/MC3) and FACTSCORE
  biographies.


  DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, averaging 53.2 against ICD's 50.5
  and a 70B-Chat greedy baseline of 42.2. On FACTSCORE the score is 68.1 vs
  ICD's 66.3, with 49.9 facts per response.


  The component ablation is run and each removal costs performance (51.4-52.5
  avg), and α sweeps show an inverted-U peaking at 0.05. But gains over ICD
  are 1.4-3.7 points on 1 model family, 1 model size, 2 benchmarks, with no
  seeds or variance reported, and the text elsewhere states α was set to 0.0
  and 0.1, inconsistent with the sweep.


  Treat this as a cheap variant worth trying if you already run
  induce-then-contrast decoding, not as settled evidence.
