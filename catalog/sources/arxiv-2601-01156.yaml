brief: >-
  Training a deliberately unfactual "Evil LLM" by penalizing correct tokens on
  factual data beats training it on pre-annotated hallucination examples, when
  the two models are contrasted at decoding time. The claim is that rewarding
  specific predefined wrong tokens narrows the error patterns the Evil model
  produces, which limits the contrastive signal.


  DHI combines three pieces: a loss that assigns negative weight to factual
  answer spans, a causal attention mask that blocks hallucination-targeted
  positions from influencing later tokens, and an inference-time constraint
  restricting contrastive decoding to tokens where the positive model is
  confident. Positive model is Llama2-7B-Chat, Evil model is LoRA-finetuned
  Llama2-7B-Base; training data is 9,196 GPT-4o-expanded HaluEval QA items.
  Evaluation is TruthfulQA (817 questions, MC1/MC2/MC3) and FACTSCORE
  biographies.


  DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2, against ICD at 50.5,
  DoLa 41.1, ITI 39.8, and 70B-Chat greedy 42.2. On FACTSCORE the score is
  68.1 vs 66.3 for ICD, with 49.9 facts per response.


  Measured, with a 3-way component ablation (removing selective contrast costs
  1.5 average points; loss modification 1.8) and an α sweep showing an
  inverted U peaking at 0.05. But 1 model family, 1 size, 2 benchmarks, and
  gains over ICD are 1.8–2.7 points with no reported variance or seeds. No
  test on instruction-tuned models beyond 7B-Chat, and the FACTSCORE response
  rate (41.2%) remains low.


  Useful if you are choosing how to construct a negative model for contrastive
  decoding; the margins are small enough to warrant replication.
