brief: >-
  Training a deliberately unreliable "Evil" model by penalizing correct tokens
  on ordinary factual data produces a better contrastive signal than
  fine-tuning it on curated hallucination examples. DHI adds a causal
  attention mask that blocks hallucination-targeted positions from influencing
  later tokens, and restricts contrastive subtraction to steps where the
  positive model is not already confident.


  Setup is Llama2-7B-Chat as the positive model against a LoRA-finetuned 7B
  evil model, trained on 9,196 filtered HaluEval QA items expanded into
  declarative sentences by GPT-4o. Evaluation is TruthfulQA multiple choice
  (817 questions, MC1/MC2/MC3) and FactScore biographies.


  On TruthfulQA, DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2,
  against ICD at 50.5, greedy 7B-Chat at 40.1, and greedy 70B-Chat at 42.2. On
  FactScore, 68.1 versus ICD's 66.3, with 49.9 facts per response. Ablations
  drop the average to 51.4 without loss modification, 52.5 without mask
  adaptation, 51.7 without selective contrast. An α sweep shows an inverted-U
  peaking at 0.05 (53.2) and falling to 50.4 at 0.20.


  Effects are measured and component-isolated, but on 1 model family, 1 size,
  2 benchmarks, with no independent replication and no matched-compute
  comparison against simply fine-tuning the positive model. The α and β values
  differ per benchmark and were set from preliminary results, so some tuning
  is baked into the headline numbers.


  If you use induced-hallucination contrastive decoding, the annotation-free
  training signal is the part worth borrowing.
