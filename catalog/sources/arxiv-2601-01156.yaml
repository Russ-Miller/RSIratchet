brief: >-
  Training a deliberately unfaithful "Evil" model by penalizing correct tokens
  produces a better contrastive signal than training it to imitate labeled
  hallucinations. DHI needs no pre-annotated hallucination data, only factual
  QA data with the answer span marked.


  The setup is Llama2-7B-Chat as the positive model contrasted against a
  LoRA-finetuned 7B evil model, trained on 9,196 HaluEval QA items expanded
  into declarative sentences by GPT-4o. Three parts: a loss term that
  down-weights correct tokens, a causal attention mask that blocks
  hallucinated positions from influencing later tokens, and decoding that only
  applies the contrast where the positive model is not confident. Evaluation
  is TruthfulQA multiple-choice (817 questions, MC1/MC2/MC3) and FactScore
  biographies.


  DHI reaches 41.9/72.6/45.0 (avg 53.2) on TruthfulQA versus ICD at
  40.5/69.7/41.3 (avg 50.5) and 70B-Chat greedy at 42.2. On FactScore it
  scores 68.1 against ICD's 66.3, with 49.9 facts per response. Ablations drop
  the average to 51.4, 52.5 and 51.7 when loss modification, mask adaptation
  and selective contrast are removed; alpha shows an inverted-U peaking at
  0.05.


  Evidence is measured with component ablations and a hyperparameter sweep,
  but on 1 model family, 1 size, 2 benchmarks, self-run, with no
  matched-compute baseline and no generation-quality or fluency check beyond
  FactScore counts. Scaling to 70B is reported only as a baseline, not
  combined with DHI.


  If you build contrastive decoding, this suggests the induction data
  requirement can be dropped.
