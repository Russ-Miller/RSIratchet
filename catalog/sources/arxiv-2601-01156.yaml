brief: >-
  Training a deliberately unfactual "Evil" model by penalizing correct tokens,
  rather than rewarding pre-annotated wrong ones, gives a better contrastive
  signal for suppressing hallucinations. DHI needs no hallucination-labelled
  data: it flips the loss sign on the token positions holding the factual
  answer, masks those positions out of the causal attention so later tokens
  are unaffected, and at inference only applies the contrast where the
  positive model is not already confident.


  Setup is Llama2-7B-Chat as positive model contrasted against a
  LoRA-finetuned 7B evil model, trained on 9,196 GPT-4o-expanded items from
  HaluEval, evaluated on TruthfulQA (817 questions, MC1/MC2/MC3) and FACTSCORE
  biographies.


  DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2, against ICD at 50.5
  and 70B-Chat greedy at 42.2. On FACTSCORE it scores 68.1 versus ICD's 66.3,
  with 49.9 facts per response.


  The component ablation is run and each removal costs points: dropping
  selective contrast gives 51.7, mask adaptation 52.5, loss modification 51.4.
  An α sweep shows an inverted U with a peak at 0.05 (53.2) and collapse at
  0.20 (50.4). But this is 1 model family, 1 positive model size, and 2
  benchmarks, with gains over ICD of 1.4–3.7 points and no reported variance
  or repeated runs. The stated implementation hyperparameters (α=0.0)
  contradict the ablation's best setting.


  Treat the margin over ICD as suggestive, not settled, and note the data-free
  training as the clearer practical gain.
