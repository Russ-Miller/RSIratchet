brief: >-
  Training a deliberately unfactual "Evil" model by penalizing correct tokens
  on factual data works better as a contrastive signal than fine-tuning it on
  pre-annotated hallucination examples. DHI reverses the loss sign at
  answer-token positions, masks those tokens out of the causal attention for
  later positions, and restricts contrastive subtraction to steps where the
  positive model is not already confident.


  Setup: Llama2-7B-Base trained with LoRA as the Evil model, contrasted
  against 7B-Chat at inference. Training data came from the HaluEval QA
  subset, expanded by GPT-4o into declarative sentences and filtered to 9,196
  entries. Evaluation on TruthfulQA (817 questions, MC1/MC2/MC3) and FactScore
  biographies.


  Results: DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2, against ICD
  at 50.5 and 70B-Chat greedy at 42.2. On FactScore it scores 68.1 versus ICD
  66.3, with 49.9 facts per response.


  Evidence: measured, with a 3-way component ablation (removing selective
  contrast drops average to 51.7, mask adaptation to 52.5, loss modification
  to 51.4) and an alpha sweep showing an inverted U peaking at 0.05 (53.2)
  versus 49.8 at 0.00 and 50.4 at 0.20.


  Boundary: 1 model family, 1 size, 2 benchmarks, no compute-matched baseline,
  and FactScore response rate stays low at 41.2%. Note the inconsistency
  between the reported alpha of 0.05 in the sweep and 0.0 in the TruthfulQA
  implementation details.


  If you build contrastive decoding, the signal source matters more than
  scale.
