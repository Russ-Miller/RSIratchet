brief: >-
  Training a deliberately unreliable "Evil" model by penalizing correct
  tokens, rather than rewarding pre-labeled hallucinated ones, produces a
  better contrastive signal for factuality, and it can be trained on factual
  data alone.


  DHI fine-tunes Llama2-7B-Base with LoRA as the negative model, using a loss
  that assigns negative weight to factual answer spans, a causal attention
  mask that blocks those positions from influencing later tokens, and an
  inference-time constraint that only applies contrastive subtraction where
  the positive model is unconfident. Training data is 9,196 GPT-4o-expanded
  items from HaluEval QA; evaluation is TruthfulQA multiple-choice (817
  questions) and FACTSCORE biographies.


  On TruthfulQA, DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2,
  against ICD at 50.5, CD at 42.2, DoLa at 41.1, ITI at 39.8, and 70B-Chat
  greedy at 42.2. On FACTSCORE, score 68.1 vs 66.3 for ICD, with 49.9 facts
  per response. Ablations drop the average to 51.4, 52.5 and 51.7 when loss
  modification, mask adaptation and selective contrast are removed
  respectively; α shows an inverted-U peaking at 0.05.


  The component ablations isolate each piece, but everything runs on 1 model
  family at 7B, 2 benchmarks, no matched-compute baseline, and the stated α of
  0.0 for TruthfulQA contradicts the sweep. Gains over ICD are 1.8–2.7 points,
  so treat this as an incremental refinement of induce-then-contrast, not a
  new regime.
