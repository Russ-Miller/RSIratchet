brief: >-
  Training a deliberately unfactual "Evil" model by penalizing correct tokens,
  rather than by fine-tuning on annotated hallucination data, produces a
  better contrastive-decoding signal for factuality. DHI flips the loss sign
  on the token positions holding the factual answer, masks those positions out
  of the causal attention for later tokens, and at inference only applies the
  contrast where the positive model's top logit is not dominant.


  The positive model is Llama2-7B-Chat; the Evil model is the same base
  fine-tuned with LoRA. Training data comes from HaluEval QA, expanded by
  GPT-4o into declarative sentences, 9,196 entries after filtering. Evaluation
  is TruthfulQA multiple-choice (817 questions, MC1/MC2/MC3) and FactScore
  biographies.


  DHI reaches 41.9 MC1, 72.6 MC2, 45.0 MC3, average 53.2, versus 50.5 for ICD
  and 42.2 for a 70B-Chat greedy baseline. On FactScore it scores 68.1 against
  ICD's 66.3, with 49.9 facts per response. Ablations remove each component:
  dropping selective contrast costs 1.5 average points, mask adaptation 0.7,
  loss modification 1.8. The α sweep shows an inverted U, best at 0.05 (53.2),
  worse at 0.00 (49.8) and 0.20 (50.4).


  Evidence is measured but narrow: 1 model family, 1 size, 2 benchmarks, no
  matched-compute comparison and no replication. Response rate on FactScore
  stays low (41.2%), so coverage trade-offs are unexamined.


  If you use induced-hallucination contrastive decoding, the annotation
  requirement may be unnecessary.
