brief: >-
  You can train a hallucination-generating "Evil" model from purely factual
  data by flipping the loss sign on correct-answer tokens, and the resulting
  contrastive decoder beats one trained on annotated hallucination data. DHI
  adds a causal-mask change that strips hallucination-targeted tokens'
  influence on later tokens, plus an inference-time rule that only applies
  contrastive subtraction where the positive model is uncertain.


  Setup: Llama2-7B-Chat as positive model, a LoRA-finetuned 7B as the Evil
  model, trained on 9,196 GPT-4o-expanded sentences derived from HaluEval QA.
  Evaluation on TruthfulQA multiple-choice (817 questions, MC1/MC2/MC3) and
  FACTSCORE biographies.


  DHI reaches 41.9/72.6/45.0 (avg 53.2) on TruthfulQA against ICD's
  40.5/69.7/41.3 (avg 50.5), greedy 7B-Chat at 40.1, and 70B-Chat at 42.2. On
  FACTSCORE, 68.1 vs ICD's 66.3, with 49.9 facts per response.


  Measured against 5 baselines including ITI, DoLa, CD and ICD, with a 3-way
  component ablation (removing selective contrast drops avg to 51.7, mask
  adaptation to 52.5, loss modification to 51.4) and an α sweep showing an
  inverted U peaking at 0.05. Gains over ICD are 1.4-3.7 points, within a
  range where seed variance matters and no variance is reported.


  One model family, one scale, 2 benchmarks; no test of whether the method
  survives on instruction-tuned larger models or non-English tasks. Also note
  the stated α for TruthfulQA (0.0) conflicts with the ablation's best value
  (0.05).


  Worth reading if you build decoding-time factuality methods and want to drop
  the annotated-hallucination data requirement.
