brief: >-
  This is a position paper: it argues that publication bias in science now
  propagates into language models, and proposes experiments rather than
  running them. No new measurements are reported.


  The argument has three strands. LLMs cut the cost of retrieving prior
  failures, so the triage that created the "file drawer" is no longer
  economically necessary; frontier models are running out of human-generated
  text while unpublished negative results are the largest untapped human
  corpus; and LLM reviewers trained on a positively skewed record may be
  poorly calibrated about what flawed work looks like.


  Supporting figures are all borrowed. Fanelli's survey of over 4,600 papers
  found positive results above 80% after 1999, peaking at 88.6% in 2005.
  Registered Reports in psychology drop the positive rate from 96% (N=152) to
  44% (N=71). In ML-for-PDE work, 93% of 82 articles claimed superiority over
  numerical methods and 79% of those used weak baselines. ICLR submissions
  went from roughly 7,000 in 2024 to nearly 20,000 in 2026, and 21% of 75,800
  ICLR 2026 reviews were flagged as AI-generated.


  Evidence for the core claim is argued, not measured. The two proposed tests,
  200–500 ClinicalTrials.gov outcomes for calibration and a 5-condition
  context ablation, are designs with expected findings only. The author states
  the human-expertise analogy may not transfer and the failure taxonomy is
  untested.


  Read it as a research agenda, not a result.
