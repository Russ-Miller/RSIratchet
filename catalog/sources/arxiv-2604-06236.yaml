brief: >-
  This is a position paper, not an experiment: the claim is that LLMs inherit
  the positive-result bias of the literature they train on, and that this is
  now costly enough to justify publishing negative results systematically. No
  new measurements are reported.


  The argument assembles existing figures. Fanelli's survey of over 4,600
  papers found positive-result rates above 80% after 1999, peaking at 88.6% in
  2005. Registered Reports in psychology cut positive rates from 96% (N=152)
  to 44% (N=71). In ML for fluid PDEs, 93% of 82 reviewed articles claimed
  superiority over numerical baselines, with 79% of those claims resting on
  weak baselines. Supporting evidence that failure carries learnable signal is
  cited secondhand: failed chemical reactions improving reaction prediction,
  and a generative model improved from failed attempts alone with
  orders-of-magnitude success-rate gains on sparse-reward tasks.


  Evidence for the central claim is argued, not measured. The authors say so,
  and propose 2 experiments they did not run: predicting outcomes for 200-500
  ClinicalTrials.gov trials, and a 5-condition context ablation (no context,
  success only, failure only, both, both plus failure-cause classification)
  with a dose-response curve at 10, 50, 100, 200 failure records.


  The analogy between human tacit failure knowledge and text-encoded failure
  data is unverified, the 3-part failure taxonomy is untested, and no model
  was probed. Treat it as a research agenda and a citation list, not a result.
