brief: >-
  The claim here is that publication bias now has a second victim: language
  models trained on a literature where experiments almost always succeed
  should inherit a miscalibrated prior about what works. This is a position
  paper, not a study.


  The argument assembles existing bibliometrics: Fanelli's analysis of over
  4,600 papers found positive results above 80% after 1999, peaking at 88.6%
  in 2005; Registered Reports in psychology drop the positive rate from 96%
  (N=152) to 44% (N=71); 93% of 82 ML-for-PDE papers claimed superiority over
  numerical baselines, with 79% of those claims resting on weak baselines. It
  then layers on LLM-era pressures: ICLR submissions of roughly 7,000 in 2024,
  12,000 in 2025, nearly 20,000 in 2026, and 21% of 75,800 ICLR 2026 reviews
  flagged as entirely AI-generated.


  No experiment is run. The 2 central claims, that LLMs overestimate success
  and that failure data corrects this, are proposed as designs: 200–500
  ClinicalTrials.gov records scored for success probability, and a 5-condition
  context ablation (A baseline, B success-only, C failure-only, D both, E
  classified by a proposed Type A/B/C failure taxonomy) with a dose-response
  curve at 10, 50, 100, 200 failure records. Expected findings are stated, not
  measured.


  The authors concede the human-expertise analogy may not transfer to
  statistical models, and that the taxonomy is untested.


  Read it for the experimental protocol and the citation set, not for
  evidence.
