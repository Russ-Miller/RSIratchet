brief: >-
  The claim that language models inherit the positive-result bias of published
  science is here an argument, not a measurement. This is a position paper: it
  assembles existing bibliometrics and proposes experiments rather than
  running them.


  The case rests on published figures about publication bias. Fanelli's
  analysis of over 4,600 papers found positive-result rates above 80% after
  1999, peaking at 88.6% in 2005. Scheel et al. compared conventional
  psychology papers with Registered Reports, where acceptance is
  outcome-independent, and positive rates fell from 96% (N=152) to 44% (N=71).
  McGreivy and Hakim reviewed 82 articles on ML for fluid PDEs: 93% claimed
  superiority over numerical methods, 79% of those on weak baselines. Chalmers
  and Glasziou estimated 85% of research investment is avoidably wasted.


  On the LLM side the only supporting evidence is secondhand: Toniato et al.
  improved reaction prediction using failed chemical reactions, and Lee et al.
  report orders-of-magnitude success-rate gains on sparse-reward tasks from
  failed attempts alone. The author's own hypotheses, that models overestimate
  trial success and that classified failure context fixes it, are set out as
  designs over 200-500 ClinicalTrials.gov records with 5 context conditions,
  with expected findings stated in advance.


  Nothing is measured. No model was tested, no baseline run, and the failure
  taxonomy (Type A/B/C) is untested; the author concedes the human-expertise
  analogy may not transfer to statistical models.


  Read it for the experimental protocol and the bias statistics, not for
  evidence about model calibration.
