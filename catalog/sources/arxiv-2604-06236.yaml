brief: >-
  The case here is argued, not measured: publication bias toward positive
  results is claimed to propagate into LLMs, which inherit a distorted prior
  on how often experiments succeed, just as the corpus of unpublished failure
  becomes the largest untapped source of human-generated training text.


  The paper is a conceptual framework assembling existing literature on the
  "file drawer" with observations about LLM training and peer review.
  Supporting figures are borrowed: Fanelli's analysis of over 4,600 papers
  found positive-result rates exceeding 80% after 1999, peaking at 88.6% in
  2005; Registered Reports in psychology drop positive rates from 96% (N=152)
  to 44% (N=71); 93% of 82 ML-for-PDE papers claimed superiority over
  numerical baselines, with 79% of those claims resting on weak baselines;
  Chalmers and Glasziou estimated 85% of research investment is avoidably
  wasted. On the review side, ICLR submissions went from roughly 7,000 in 2024
  to nearly 20,000 in 2026, and 21% of 75,800 ICLR 2026 reviews were flagged
  as entirely AI-generated.


  No experiment was run. Two are proposed: predicting outcomes for 200–500
  ClinicalTrials.gov trials from pre-trial information, and a 5-condition
  context ablation (no context, success-only, failure-only, both, classified)
  with a dose-response curve at 10, 50, 100, 200 failure records.


  The authors concede the core claim rests partly on analogy to human
  expertise, that the proposed Type A/B/C failure taxonomy is untested, and
  that incentives are unaddressed. Cited empirical support for learning from
  failure is narrow: chemical reaction prediction and sparse-reward generative
  tasks.


  Treat this as an agenda and a set of hypotheses to test, not evidence that
  failure data calibrates models.
