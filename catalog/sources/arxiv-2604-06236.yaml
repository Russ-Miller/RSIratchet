brief: >-
  This is a position paper, not an experiment: it argues that publication bias
  toward positive results now harms language models directly, as training
  corpora, as research assistants, and as reviewers. No empirical validation
  is included.


  The argument assembles existing literature. Fanelli's analysis of over 4,600
  papers found positive-result rates above 80% after 1999, peaking at 88.6% in
  2005. Scheel et al. compared standard psychology papers with Registered
  Reports, where publication is guaranteed regardless of outcome: positive
  rates fell from 96% (N=152) to 44% (N=71). McGreivy and Hakim reviewed 82
  articles on ML for fluid PDEs, where 93% claimed superiority over numerical
  methods but 79% of those claims used weak baselines. On review load, 21% of
  75,800 ICLR 2026 peer reviews were flagged as entirely AI-generated, and
  submissions went from roughly 7,000 in 2024 to nearly 20,000 in 2026.


  The core claim, that LLMs inherit this positive skew and that failure data
  corrects it, is argued rather than measured. The author proposes two unrun
  experiments on 200–500 ClinicalTrials.gov trials, with a 5-condition context
  comparison (A–E) and a dose-response curve at 10, 50, 100, 200 failure
  records.


  Supporting evidence is indirect and domain-specific: Toniato et al. on
  failed chemical reactions, Lee et al. on learning from failures alone. The
  paper admits its human-expertise analogy may not transfer to statistical
  models, and its 3-part failure taxonomy (Type A/B/C) is untested.


  Treat this as a research agenda and a citation collection, not a result.
