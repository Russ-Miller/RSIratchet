brief: >-
  The claim here is that LLMs invert the economics of the "file drawer":
  retrieving someone else's failed attempt is now cheaper than repeating it,
  so negative results become worth publishing. This is a position paper, not
  an experiment.


  The argument assembles existing bibliometrics with 3 LLM-specific pressures:
  retrieval cost, training-data scarcity, and LLM participation in peer
  review. Supporting figures cited include Fanelli's analysis of over 4,600
  papers where positive results exceeded 80% after 1999 and peaked at 88.6% in
  2005; Scheel et al.'s comparison of standard psychology papers (96%, N=152)
  with Registered Reports (44%, N=71); McGreivy and Hakim's review of 82
  ML-for-PDE articles where 93% claimed superiority but 79% of those used weak
  baselines; and Chalmers and Glasziou's estimate that 85% of research
  investment is avoidably wasted. On the review side, 21% of 75,800 ICLR 2026
  reviews were flagged as entirely AI-generated, with submissions rising from
  roughly 7,000 in 2024 to nearly 20,000 in 2026.


  Nothing about LLM miscalibration is measured. The core claims, that models
  inherit positive bias and that failure data corrects it, are argued and then
  deferred to 2 proposed experiments on 200–500 ClinicalTrials.gov records
  with 5 context conditions. The authors concede the human-expertise analogy
  may not transfer to statistical models and that their Type A/B/C failure
  taxonomy is untested.


  Read it as a research agenda, not evidence.
