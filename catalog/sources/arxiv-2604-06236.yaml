brief: >-
  This is a position paper: it argues, without running anything, that
  publication bias in the scientific literature propagates into language
  models as a miscalibrated prior that experiments succeed. No new
  measurements are reported.


  The case is assembled from existing literature. Fanelli's analysis of over
  4,600 papers found positive-result rates above 80% after 1999, peaking at
  88.6% in 2005. Scheel et al. compared standard psychology papers with
  Registered Reports, where publication is guaranteed regardless of outcome,
  and the positive rate fell from 96% (N=152) to 44% (N=71). McGreivy and
  Hakim reviewed 82 articles on ML for fluid PDEs: 93% claimed superiority
  over numerical methods, 79% of those claims rested on weak baselines. On the
  LLM side it cites Franco et al. (roughly two-thirds of NSF null results
  never written up), Chalmers and Glasziou (85% of research investment
  avoidably wasted), submission growth at ICLR from roughly 7,000 in 2024 to
  nearly 20,000 in 2026, and 21% of 75,800 ICLR 2026 reviews flagged as
  entirely AI-generated.


  The central claims are proposed, not tested. Two clinical-trial experiments
  on 200–500 ClinicalTrials.gov records are outlined with AUC-ROC measures and
  5 context conditions, with expected findings stated in advance. The
  supporting evidence that failure data helps models is secondhand and
  domain-narrow: failed chemical reactions improving reaction prediction, and
  a generative model improved from failed attempts only on sparse-reward
  tasks.


  The authors concede the analogy from human tacit expertise to text-trained
  models may not transfer, and that the 3-part failure taxonomy
  (methodological, substantive null, ambiguous) is untested.


  Treat this as a research agenda and a citation collection, not as evidence
  that LLMs are miscalibrated about research success.
