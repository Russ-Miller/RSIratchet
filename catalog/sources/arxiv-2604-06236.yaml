brief: >-
  The claim here is that publication bias now harms language models directly,
  not just human science, and that failure data is the largest untapped
  human-generated corpus. This is a position paper: no new experiments, only a
  synthesis of existing literature plus two proposed protocols.


  The argument has three strands. LLMs collapse the retrieval cost that
  originally justified the file drawer; they face exhaustion of high-quality
  text and degrade when trained on model output; and they are increasingly
  acting as reviewers while having been trained on a corpus where positive
  results dominate.


  Supporting figures are all borrowed. Fanelli's 4,600-paper survey puts
  positive results above 80% after 1999, peaking at 88.6% in 2005. Registered
  Reports drop the positive rate from 96% (N=152) to 44% (N=71). In ML for
  fluid PDEs, 93% of 82 articles claimed superiority over numerical baselines,
  with 79% of those claims resting on weak baselines. At ICLR 2026, 21% of
  75,800 reviews were flagged as entirely AI-generated.


  The central claims are argued, not measured. The authors say so, and flag
  that the human-expertise analogy may not transfer to statistical models, and
  that their 3-part failure taxonomy (Type A/B/C) is untested.


  Proposed validation uses 200–500 ClinicalTrials.gov records with outcomes
  withheld, comparing 5 context conditions by AUC-ROC. Nothing was run.


  Read it for the framing and the citation set, not for evidence.
