brief: >-
  The argument here is that publication bias is no longer just a human
  problem: models trained on a literature where positive results dominate
  inherit a distorted prior about which experiments work, and this matters now
  that models are used as research tools, data consumers, and reviewers. This
  is a position paper, not an experiment.


  The case is assembled from existing literature. Fanelli's analysis of over
  4,600 papers found positive-result rates above 80% after 1999, peaking at
  88.6% in 2005. Scheel et al. compared standard psychology papers with
  Registered Reports and saw positive rates fall from 96% (N=152) to 44%
  (N=71). McGreivy and Hakim reviewed 82 ML-for-PDE articles: 93% claimed
  superiority over numerical methods, 79% of those on weak baselines. Franco
  et al. found roughly two-thirds of NSF null results were never written up.
  On the review side, 21% of 75,800 ICLR 2026 reviews were flagged as entirely
  AI-generated, with submissions rising from roughly 7,000 in 2024 to nearly
  20,000 in 2026.


  No new measurement is reported. The authors propose 2 experiments on 200–500
  ClinicalTrials.gov trials with 5 context conditions, and state the expected
  findings in advance; the claim that models overestimate success remains
  untested, as does their Type A/B/C failure taxonomy. Supporting evidence for
  learning from failure comes from cited chemistry and sparse-reward work, not
  from the paper itself.


  Read it as a framing and an experimental design, not as evidence that models
  are miscalibrated.
