brief: >-
  The claim here is that publication bias in the scientific literature now
  propagates into LLMs, and that LLMs have in turn made publishing negative
  results economically sensible. It is an argument, not a measurement: the
  paper contains no new experiments.


  The case is assembled from prior literature. Fanelli's survey of over 4,600
  papers from 1990 to 2007 found positive-result rates above 80% after 1999,
  peaking at 88.6% in 2005. Scheel et al. compared standard psychology papers
  with Registered Reports, where publication is guaranteed regardless of
  outcome, and positive rates fell from 96% (N=152) to 44% (N=71). McGreivy
  and Hakim reviewed 82 articles on ML for fluid PDEs: 93% claimed superiority
  over numerical methods, 79% of those on weak baselines. Franco et al. found
  roughly two-thirds of NSF null results were never written up.


  On the LLM side, the paper cites Toniato et al. (2025) on failed chemical
  reactions improving reaction prediction, and Lee et al. (2025) on training a
  generative model from failed attempts alone. Review-system pressure is cited
  via 21% of 75,800 ICLR 2026 reviews flagged as AI-generated.


  The core claims are untested. Two experiments are proposed, not run:
  predicting outcomes for 200-500 ClinicalTrials.gov trials, and a 5-condition
  context study comparing success-only, failure-only, both, and
  cause-classified failure records. The authors concede their
  human-expertise-to-LLM analogy may not transfer and that their 3-part
  failure taxonomy is preliminary.


  Read it as a research agenda, not evidence that failure data calibrates
  models.
