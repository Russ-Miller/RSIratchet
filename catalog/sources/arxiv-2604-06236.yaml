brief: >-
  The claim here is that publication bias in the scientific literature is now
  an alignment-adjacent data problem for language models, and the paper makes
  that case by argument rather than by measurement.


  The setup is a position piece: it assembles existing bibliometrics on
  positive-result filtering, points to the exhaustion of high-quality human
  text, and connects both to LLMs deployed as research assistants and peer
  reviewers. It proposes, but does not run, 2 experiments on 200-500 completed
  ClinicalTrials.gov trials, with 5 context conditions ranging from no context
  to failure records annotated by a 3-part failure taxonomy.


  Supporting figures are all borrowed. Fanelli's survey of over 4,600 papers
  found positive results above 80% after 1999, peaking at 88.6% in 2005.
  Registered Reports cut the positive rate from 96% (N=152) to 44% (N=71).
  ICLR submissions went from roughly 7,000 in 2024 to nearly 20,000 in 2026,
  and 21% of 75,800 ICLR 2026 reviews were flagged as entirely AI-generated.


  Nothing is measured. The authors state plainly that the paper contains no
  empirical validation, that the claim LLMs inherit positive skew is untested,
  and that the failure taxonomy is preliminary. The analogy to senior
  scientists accumulating tacit failure knowledge is acknowledged as an
  analogy.


  Read it as a research agenda and a citation collection, not as evidence that
  LLMs are miscalibrated about success rates.
