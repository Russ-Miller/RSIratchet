brief: >-
  Hallucinated VQA answers can be detected from a single forward pass of the
  generating model, without repeated sampling or an external verifier at
  inference time. FaithSCAN trains a small classifier on 3 internal signal
  families: token-level log-likelihood and entropy, raw visual patch
  embeddings, and cross-modal aligned representations, fused by branch-wise
  encoders and attention. Labels come from a Visual-NLI judge
  (Qwen2.5-VL-32B-Instruct) rather than human annotation.


  Tested on IB-T5-XL, LLaVA-8B and Qwen3-VL-8B across HalLoc-VQA, POPE,
  HaloQuest and VQA v2, with 2,000 training and 1,000 evaluation instances per
  split and 3 seeds. In-distribution AUROC reaches 0.754 (HalLoc-VQA,
  IB-T5-XL) versus 0.675 for P(True) and 0.669 for logistic regression, with
  up to 8% AUROC improvement, at 0.605–1.191s inference per 100 samples versus
  78.613–367.522s for SelfCheckGPT. Judge labels agree with human checks on
  100 samples per dataset at 0.950–0.990, Cohen's Kappa 0.798–0.947.


  Evidence includes ablations isolating each signal source, layer choice, and
  fusion method; sampling-based baselines are compared, though not at matched
  compute. Generalization is weak: cross-dataset AUROC falls to 0.393–0.429 in
  several transfers, below chance. Treat this as an efficient in-distribution
  detector, not a transferable one.
