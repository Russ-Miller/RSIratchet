brief: >-
  Hallucinated VQA answers can be flagged from a single forward pass of the
  model itself, without repeated sampling or an external verifier, by
  combining token-level decoding uncertainty, raw visual patch embeddings, and
  cross-modal aligned features.


  FaithSCAN is a lightweight supervised classifier trained on internal signals
  from 3 frozen backbones (IB-T5-XL, LLaVA-8B, Qwen3-VL-8B) across HalLoc-VQA,
  POPE, HaloQuest, and VQA v2, with 2,000 training and 1,000 evaluation
  instances per split and 3 seeds. Labels come from a Visual-NLI judge
  (Qwen2.5-VL-32B-Instruct, T = 0.1) rather than human annotation.


  In-distribution AUROC reaches 0.754 on HalLoc-VQA and 0.829 on HaloQuest, up
  to 8% AUROC above baselines, while inference costs 0.605–1.191 s per 100
  samples versus 340.683 s for SelfCheckGPT. Judge labels agreed with humans
  at 0.950–0.990 on 100 samples per dataset, Cohen's Kappa mostly above 0.8.


  Evidence includes ablations isolating each signal source and layer-wise
  sweeps; token-level embeddings carry most of the signal, visual patch
  features help mainly on POPE's object-level hallucinations. Cross-dataset
  transfer is weak: several entries fall below 0.5, including 0.393 and 0.412
  on HalLoc-VQA to HaloQuest.


  Treat it as an in-distribution, per-model detector, not a general one.
