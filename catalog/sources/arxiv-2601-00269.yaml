brief: >-
  Hallucinated VQA answers can be flagged from a single forward pass, without
  resampling, by training a small classifier on the model's own internal
  signals. FaithSCAN pools token-level log-likelihood and entropy, decoder
  hidden states, raw visual patch embeddings, and cross-modal aligned
  features, encodes each branch separately, and fuses them with attention.
  Training labels come from a Visual-NLI judge (Qwen2.5-VL-32B-Instruct, T =
  0.1) rather than human annotation.


  Evaluated on HalLoc-VQA, POPE, HaloQuest, and VQA v2 with 3 backbones
  (IB-T5-XL, LLaVA-8B, Qwen3-VL-8B), 2,000 train and 1,000 eval samples per
  split, 3 seeds. Reported gains reach up to 8% AUROC over baselines including
  semantic entropy, SelfCheckGPT, P(True), and logistic regression, with
  inference latency of 0.605–1.191 s per 100 samples versus 340.683 s for
  SelfCheckGPT. Auto-labels agreed with 100 human-checked samples per dataset
  at 0.950–0.990 agreement.


  Ablations isolate the sources: token-level signals carry most of the signal;
  visual patch features help on POPE (object hallucination) but little on
  reasoning-heavy sets. Cross-dataset transfer is weak, with several AUROC
  values below 0.5, including HalLoc-VQA to HaloQuest at 0.393.


  Use this if you want cheap in-distribution hallucination gating; do not
  expect it to transfer across hallucination types.
