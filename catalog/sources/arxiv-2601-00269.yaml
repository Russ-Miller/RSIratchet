brief: >-
  Hallucinated VQA answers can be flagged from a single forward pass of the
  model, without resampling or an external verifier, by training a small
  classifier on internal signals. FaithSCAN fuses token-level log-likelihood
  and entropy, decoder hidden states, raw visual patch embeddings, and
  cross-modal aligned features via branch-wise encoders and uncertainty-aware
  attention, with labels generated by a Visual-NLI judge
  (Qwen2.5-VL-32B-Instruct) rather than humans.


  Tested on HalLoc-VQA, POPE, HaloQuest, and VQA v2 across IB-T5-XL, LLaVA-8B,
  and Qwen3-VL-8B, with 2,000 training and 1,000 evaluation instances per
  split and 3 seeds. Reported gains reach up to 8% AUROC over baselines
  including semantic entropy, SelfCheckGPT, P(True), and logistic regression;
  inference costs 0.605–1.191 s per 100 samples versus 78.613–367.522 s for
  SelfCheckGPT. Auto-labels agreed with human checks on 100 samples per
  dataset at 0.950–0.990, Cohen's Kappa up to 0.947.


  The design includes source ablations and layer sweeps, isolating that
  token-level signals carry most of the discriminative power and visual patch
  features help mainly on object-level POPE. Generalization is weak: several
  cross-dataset AUROCs fall below 0.5, and the supervised comparison is
  against a logistic baseline, not other trained detectors.


  Treat this as in-distribution detection, not a transferable hallucination
  monitor.
