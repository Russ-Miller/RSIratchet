brief: >-
  Hallucinated answers in visual question answering can be flagged from a
  single forward pass, without repeated sampling or an external verifier, by
  training a small classifier on the model's own internal signals. FaithSCAN
  fuses token-level log-likelihood and entropy, decoder hidden states, raw
  visual patch embeddings, and cross-modal aligned features via branch-wise
  encoders (64-dim) and attention. Labels come from a Visual-NLI judge
  (Qwen2.5-VL-32B-Instruct, T = 0.1) rather than human annotation.


  Across HalLoc-VQA, HaloQuest, VQA v2, and POPE on 3 backbones (IB-T5-XL,
  LLaVA-8B, Qwen3-VL-8B), the paper reports up to 8% AUROC improvement over
  baselines including semantic entropy, SelfCheckGPT, and P(True), with
  inference latency of 0.605–1.191 s/100 samples versus 78.613–367.522 for
  SelfCheckGPT. Automatic labels agree with human checks on 100 samples per
  dataset at 0.950–0.990 agreement, Cohen's Kappa above 0.8 for most.


  Evidence is measured with ablations isolating each signal source and each
  decoder layer, 3 seeds, 2,000 train / 1,000 eval instances per dataset.
  Token-level signals carry most of the discriminative power; visual patch
  uncertainty helps mainly on POPE's object-level questions.


  Out-of-distribution transfer is weak: several cross-dataset AUROCs fall
  below 0.5 (0.393, 0.412, 0.429). Treat this as an in-distribution, per-model
  detector, not a general one.
