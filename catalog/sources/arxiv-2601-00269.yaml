brief: >-
  Hallucinated answers in visual question answering can be flagged from
  internal states collected in a single forward pass, without repeated
  sampling or an external verifier at inference time. FaithSCAN trains a small
  classifier on 3 internal signal types: token-level log-likelihood and
  entropy, intermediate visual patch embeddings, and cross-modal aligned
  representations, fused by branch-wise encoding and attention.


  The setup covers 3 backbones (IB-T5-XL, LLaVA-8B, Qwen3-VL-8B) and 4
  datasets (HalLoc-VQA, POPE, HaloQuest, VQA v2), with 2,000 training and
  1,000 evaluation instances sampled per split and averaged over 3 seeds.
  Labels come from a Visual-NLI judge (Qwen2.5-VL-32B-Instruct, T = 0.1)
  rather than humans.


  In-distribution AUROC reaches up to 8% above baselines, e.g. 0.754 vs 0.675
  for P(True) on HalLoc-VQA with IB-T5-XL, and inference latency is
  0.605–1.191 s per 100 samples versus 78.613–367.522 s for SelfCheckGPT.
  Label quality was checked on 100 samples per dataset: agreement 0.950–0.990,
  Cohen's Kappa up to 0.947.


  Ablations isolate signal sources: token-level uncertainty carries most of
  the discrimination, visual patch features help mainly on POPE's object
  hallucinations, and intermediate decoder layers beat earliest and deepest.


  Generalization is the weak point. Cross-dataset transfer often falls below
  0.5 AUROC (HalLoc-VQA to HaloQuest: 0.393 on LLaVA-8B), and detectors are
  trained per backbone. Treat this as a cheap in-domain filter, not a portable
  one.
