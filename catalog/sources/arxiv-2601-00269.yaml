brief: >-
  Hallucinated VQA answers can be flagged from a single forward pass of the
  generating model, without repeated sampling or an external verifier, by
  training a small classifier on token-level log-likelihood, entropy, decoder
  hidden states, raw visual patch embeddings, and cross-modal aligned
  features.


  FaithSCAN fuses these 5 signal types with branch-wise encoders (64-dim) and
  attention. It is tested on 3 backbones (IB-T5-XL, LLaVA-8B, Qwen3-VL-8B)
  over HalLoc-VQA, POPE, HaloQuest, and VQA v2, with 2,000 train and 1,000
  eval instances per split, 3 seeds. Labels come from a Visual-NLI judge
  (Qwen2.5-VL-32B-Instruct) rather than humans.


  AUROC gains reach up to 8% over baselines including semantic entropy,
  SelfCheckGPT, P(True), and logistic regression, with inference latency of
  0.605–1.191 s per 100 samples versus 78.613–367.522 s for SelfCheckGPT.
  Judge labels agree with human annotation on 100 samples per dataset at
  0.950–0.990, Cohen's kappa mostly above 0.8.


  Ablations isolate the contributions: token-level signals carry most of the
  discriminative power, visual patch uncertainty helps mainly on POPE's object
  hallucinations, and intermediate decoder layers beat earliest and deepest
  ones.


  Generalization is the weak point. Single-dataset training transfers poorly,
  with several cross-dataset AUROCs below 0.5 (HalLoc-VQA to HaloQuest: 0.393
  for LLaVA-8B). Multi-source training helps but stays below in-distribution
  levels.


  If you need cheap hallucination gating on a model you control,
  internal-state probes are a reasonable bet; do not expect them to survive a
  shift in hallucination type.
