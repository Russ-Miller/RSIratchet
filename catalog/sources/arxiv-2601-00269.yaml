brief: >-
  Hallucinated VQA answers can be flagged from a single forward pass of the
  generating model, without repeated sampling or an external verifier, by
  training a small classifier on the model's own internal signals.


  FaithSCAN extracts token-level log-likelihood and entropy, decoder hidden
  states, raw visual patch embeddings, and cross-modal aligned tokens from a
  frozen VLM, encodes each branch separately, and fuses them with attention.
  Backbones are IB-T5-XL, LLaVA-8B, and Qwen3-VL-8B; datasets are HalLoc-VQA,
  POPE, HaloQuest, and VQA v2, with 2,000 training and 1,000 evaluation
  instances sampled per split and 3 random seeds. Labels come from a
  Visual-NLI judge (Qwen2.5-VL-32B-Instruct, T = 0.1) rather than human
  annotation.


  In-distribution AUROC reaches 0.754 on HalLoc-VQA and 0.829 on HaloQuest, up
  to 8% AUROC over baselines, at inference cost of 0.605–1.191 s per 100
  samples versus 340.683 s for SelfCheckGPT. Judge labels agree with human
  annotators on 100 samples per dataset at 0.950–0.990 agreement, Cohen's
  Kappa up to 0.947.


  Evidence includes ablations isolating each signal source, layer-wise sweeps,
  and a logistic regression supervised baseline, but latency comparison is not
  matched on training cost.


  Cross-dataset transfer often fails: HalLoc-VQA → HaloQuest drops to 0.393 on
  LLaVA-8B, below chance. Visual signals alone are weak; token-level signals
  carry most of the discriminative power.


  Treat this as an efficient in-distribution detector, not a general one.
