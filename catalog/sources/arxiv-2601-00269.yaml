brief: >-
  Hallucinated answers in visual question answering can be flagged from a
  single forward pass, using the model's own internal states, without repeated
  sampling or an external verifier at inference time.


  FaithSCAN is a lightweight classifier trained on 3 internal signal types
  from a frozen VLM: token-level log-likelihood and entropy, decoder hidden
  states, raw visual patch embeddings, and cross-modal aligned tokens, fused
  by branch-wise encoding and attention. Backbones are IB-T5-XL, LLaVA-8B, and
  Qwen3-VL-8B; datasets are HalLoc-VQA, POPE, HaloQuest, and VQA v2, with
  2,000 train and 1,000 eval instances sampled per split over 3 seeds. Labels
  come from Qwen2.5-VL-32B-Instruct acting as a Visual-NLI judge.


  In-distribution AUROC reaches 0.754 on HalLoc-VQA and 0.829 on HaloQuest,
  described as up to 8% AUROC improvement, with inference latency of
  0.605–1.191 s/100 samples versus 340.683 s for SelfCheckGPT. Judge labels
  agreed with human annotation at 0.950–0.990 across 100 samples per dataset,
  Cohen's Kappa mostly above 0.8.


  Evidence includes ablations over signal sources, layers, and fusion, plus a
  logistic regression supervised baseline. Sampling costs are not matched
  across methods, and judge labels are model-generated.


  Cross-dataset transfer often fails: HalLoc-VQA to HaloQuest gives 0.393 on
  LLaVA-8B and 0.412 on Qwen3-VL-8B, below chance. Visual signals alone are
  weak except on object-level POPE.


  Use this if you need cheap in-domain hallucination gating, not a portable
  detector.
