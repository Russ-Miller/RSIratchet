summary: >-
  Large language models (LLMs) have advanced automatic program repair (APR)
  to the point where agentic systems routinely resolve real-world,
  repository-level issues. Yet the generated patch has received little
  scrutiny beyond whether it passes tests. In this paper, we identify patch
  verbosity as a major yet overlooked concern in LLM-based APR.
  Characterizing 28 state-of-the-art approaches on SWE-bench Verified, we
  find that even successful patches are consistently larger and more complex
  than developer patches, with the median approach producing 121.78% more
  total changes, 80.91% more net change
notes: >-
  Filed as a source on cutting-to-the-chase from the classifier's judgement
  that the paper is about it (improves, medium): The paper measures that LLM
  patches are substantially more verbose than needed and that
  minimality/format prompts barely help, then proposes RECAP which reduces
  patch size with far less correctness loss than baselines. No claim has
  been drafted from it yet.
