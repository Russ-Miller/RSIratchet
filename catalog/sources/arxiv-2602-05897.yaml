brief: >-
  Training small reasoning models with outcome-only rewards makes their chains
  of thought less faithful even as final answers get more faithful. On NewsQA
  with DeepSeek-R1-Distill-Qwen-1.5B, only 6.00% of CoTs are free of
  unfaithful sentences while 67.40% of answers are judged faithful;
  restricting to the key reasoning path still gives 39.11%.


  FaithRL adds step-level supervision to GRPO: HHEM-2.1 as a process reward
  model scores each CoT sentence for groundedness in the context, trajectories
  are truncated at the first unfaithful step and resampled from the faithful
  prefix, plus an information-gain penalty and an n-gram repetition penalty.
  Evaluated on DPSK-1.5B, Qwen3-0.6B, and Qwen3-1.7B across SQuAD, NewsQA,
  TriviaQA, NQ, HotpotQA against SFT, KD, Self-Refine, GRPO, FSPO.


  Average gains over the best baseline: 7.29% accuracy and 1.73% faithfulness.
  Hallucination rate on the key reasoning path for DPSK-1.5B drops from 19.28
  to 5.04 on correct answers and 35.75 to 10.21 on incorrect ones. Training
  cost is lower than GRPO: 29.28 vs 35.59 GPU hours for Qwen3-1.7B.


  Evidence is measured, with 5 runs and standard deviations, and component
  ablations: removing resampling cuts average Faith by 15.77%. Faithfulness
  judging relies on Qwen3-32B as judge, and attack questions come from
  GPT-5.2, so the metric and the method share a notion of faithfulness.


  Limited to open-book QA and models under 2B; larger models and open-ended
  tasks untested. Useful if you treat answer correctness as a sufficient RL
  signal.
