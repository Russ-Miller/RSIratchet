summary: As large language models become smaller and more efficient, small
  reasoning models (SRMs) are crucial for enabling chain-of-thought (CoT)
  reasoning in resource-constrained settings. However, they are prone to
  faithfulness hallucinations, especially in intermediate reasoning steps.
  Existing mitigation methods based on online reinforcement learning rely on
  outcome-based rewards or coarse-grained CoT evaluation, which can
  inadvertently reinforce unfaithful reasoning when the final answer is
