summary: >-
  While large language models (LLMs) possess vast zero-shot procedural
  knowledge, their tendency to produce homogenized logic often obscures the
  unique, idiosyncratic execution processes of individual human creators. In
  this paper, we investigate the computational discovery of procedural
  personas from unstructured data. To achieve this, we introduce
  ViralRecipesTrans, a new dataset of procedurally aligned execution flow
  graphs extracted from popular culinary video transcripts and explicitly
  mapped to specific creators. We formulate procedural stylometry as a graph
  learning and process discovery
