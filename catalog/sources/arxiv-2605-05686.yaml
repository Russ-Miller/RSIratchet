brief: >-
  Confident hallucination and memory conflict look identical at the output
  layer but separate cleanly in hidden-state geometry. Learned facts form
  attractor basins during autoregressive generation; conflict between
  parametric and context memory is basin competition that disrupts convergence
  without raising output entropy, and hallucination is basin absence, where
  the hidden state drifts with nothing to converge to. The frozen LM head
  fires confidently in both cases.


  The test bed is a synthetic task mapping entity identifiers to unique codes,
  with parametric memory installed through LoRA adapters so ground truth is
  exact and component roles can be isolated by targeted adapter placement.


  Geometric margin, the hidden state's distance to the nearest memorized
  basin, separates correct recall from hallucination with zero false refusals,
  while entropy-based detection cannot avoid rejecting the vast majority of
  correct outputs. The separation also appears on natural-language factual
  queries from the pretrained model with no adaptation. The
  confident-hallucination fraction follows C = exp(-c/\barΔ), rising with
  scale even as error rates fall.


  The causal attribution rests on adapter placement in a synthetic setup where
  the authors control what was memorized; the natural-language check is
  reported as a transfer, with no accuracy figures given here and no baseline
  detector beyond entropy.


  If you monitor model outputs for hallucination, this argues the signal you
  want is upstream of the head.
