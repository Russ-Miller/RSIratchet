brief: >-
  Small open VLMs trained on agent-synthesized murder mystery scripts can
  close much of the gap to proprietary models on imperfect-information social
  deduction, but role-playing quality barely moves.


  The pipeline uses Gemini 2.5 Pro-class agents in specialized roles
  (OutlineAgent, CharacterAgent, ClueAgent, RoleplayAgent, QaAgent,
  CriticAgent) to synthesize scripts, multimodal clues and multi-hop QA, then
  trains Qwen2.5-VL-3B-Instruct and 7B with LoRA SFT followed by GRPO using a
  ScoreAgent LLM-as-Judge reward. Evaluation is WhodunitBench, 7 metrics,
  65,536-token context, 5 to 82 image clues per script.


  The 7B full model reaches 58.42 MMR vs 37.63 for the base 7B and 58.75 for
  GPT-4V, and 36.87% decision-making vs 25.61%. Text-rich image understanding
  gains most (+36.65). Role-playing is the exception: -0.29 at 7B, +1.66 at
  3B.


  Ablations remove SFT, RL and the image-clue match reward separately, and
  separate human-only from synthetic-only data (55.01 combined vs 51.03 human,
  48.35 synthetic), with human-annotated evaluation sets. Judge reliability is
  checked on 100 instances per task against 3 judges and humans (Spearman 0.71
  CMD, 0.62 RP; Cohen's κ 0.47 for RP). No matched-compute baseline for the
  synthesis cost.


  Only 1 model family, 1 benchmark, and the authors note image-clue alignment
  still needs partial human verification.


  If you want small VLMs to handle deceptive multi-party context, synthetic
  script generation plus judge-shaped RL is worth copying; do not expect it to
  fix persona fidelity.
