brief: >-
  Predictive performance on chosen benchmarks is a noisy proxy for whether a
  method matters, and filtering publications on it suppresses results the
  field needs. This is a position paper, so the claim is argued rather than
  tested.


  The authors define a negative result as failure to reject the usual null
  hypothesis that a proposed method does not beat existing methods on a
  relevant problem subset, and split these into novel-method negative results
  (NMNR) and existing-method negative results (EMNR, e.g. replication studies
  or failure-mode papers). They then make 3 arguments: performance is a faulty
  progress metric, performance-chasing sets bad incentives, and the field is
  duplicating work.


  Supporting evidence is all secondhand. Cited: AI publications more than
  doubled between 2010 and 2021 to almost 500,000; roughly 4,000 papers per
  month in 2023 with a doubling rate of roughly 23 months; a review that
  screened 2,212 COVID prediction studies and scrutinised 62, finding none
  clinically usable; and Kaggle cases where winners' reported gains were
  smaller than evaluation noise.


  Nothing here is measured by the authors. There is no survey of reviewers, no
  audit of rejection reasons, no quantification of how much duplicated effort
  negative results would save. Counterarguments are raised and answered by
  assertion, leaning on a "healthy review process".


  The output is 8 action points: negative-results tracks and workshops,
  two-phase review that hides results in round 1, funded replication studies,
  and reviewer criteria including surprise factor and depth of analysis.


  Read it if you set venue policy, not for empirical grounding.
