brief: >-
  Predictive performance on chosen benchmarks is a noisy and partly misleading
  proxy for whether a proposed method matters, and the near-exclusive
  publication of results that beat the state of the art is argued to produce
  publication bias, wasted compute, and incentives against risky ideas.


  This is a position paper, not an experiment. It defines negative results
  against the usual null hypothesis (a method does not beat existing methods
  on a relevant problem subset), splits them into novel-method negative
  results and existing-method negative results, and argues that the latter are
  already accepted while the former are effectively gatekept.


  Evidence is entirely secondhand citation. It leans on a review that screened
  2,212 COVID machine learning studies down to 62 and found none clinically
  usable, on Kaggle analyses where winners' reported gains fell below
  evaluation noise, and on growth figures: almost 500,000 AI publications by
  the end of 2021, more than doubling between 2010 and 2021, with a doubling
  rate of roughly 23 months and over 4,000 papers per month in 2023.


  No new measurement, no survey of reviewers or authors, no quantification of
  how often negative results are rejected. The counterarguments the authors
  raise against themselves are answered by appeal to a healthy review process
  rather than data.


  The contribution is eight concrete action points: dedicated tracks,
  two-phase review that hides results in round 1, funded replication studies,
  and review criteria weighted toward surprise factor and depth of analysis.
  Read it as an agenda, not as a finding.
