brief: >-
  Predictive performance on chosen benchmarks is a noisy and poorly aligned
  proxy for the worth of a machine learning method, and treating it as the
  publication bar distorts what the field produces. This is a position paper,
  not an experiment.


  The authors define negative results against the usual null hypothesis that a
  proposed method is not better than existing methods, and split them into
  novel method negative results (NMNR) and existing method negative results
  (EMNR), noting EMNR already have better standing. They argue publication
  bias produces community-level inefficiency, resource inequality as a
  gatekeeper, and risk-averse research agendas.


  Supporting evidence is borrowed, not generated: a review of 2,212
  coronavirus prognostication studies that found none of the 62 most promising
  to be of clinical use; Kaggle competitions where winners' reported gains
  were smaller than evaluation noise; AI publications more than doubling
  between 2010 and 2021 to almost 500,000, with a doubling rate of roughly 23
  months and over 4,000 papers per month in 2023.


  Nothing here is measured by the authors. There is no survey of reviewers, no
  analysis of acceptance rates by result sign, and no quantification of how
  much duplicated effort negative-result publication would save. The
  counterfactuals section concedes that most objections apply equally to
  positive results and leans on "a healthy review process" to resolve them.


  The contribution is 8 concrete action points, including a two-phase review
  where results are withheld in round 1. Read it for the proposals, not for
  evidence.
