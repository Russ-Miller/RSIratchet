brief: >-
  Predictive performance on chosen benchmarks is a weak and noisy proxy for
  the worth of a machine learning paper, and the near-exclusive publication of
  positive results makes the field less efficient. The argument is a position
  paper, not a study: the authors define a negative result as failure to
  reject the null that a proposed method beats existing methods, and split it
  into novel-method negative results (NMNR) and existing-method negative
  results (EMNR), the latter already better tolerated.


  Evidence is entirely secondhand citation. Roberts et al. (2021) screened
  2,212 studies on COVID detection and prognosis, scrutinised the most
  promising 62, and found none clinically usable. Varoquaux and Cheplygina
  report Kaggle winners whose margins were smaller than evaluation noise.
  Growth figures cited: AI publications more than doubled between 2010 and
  2021 to almost 500,000, with a doubling rate of roughly 23 months and over
  4,000 papers per month in 2023.


  Nothing is measured here. There is no survey of reviewers, no audit of
  acceptance rates by result sign, no estimate of how much duplicated effort
  negative-result publication would save. The 4 counterarguments the authors
  raise are answered by argument, largely by appeal to a healthy review
  process.


  The contribution is 8 concrete proposals, including two-phase review where
  results are withheld in round 1, incentivised replication studies, and
  venue-level criteria for judging negative results.


  Read it as agenda-setting for how your venue reviews, not as a finding about
  models.
