brief: >-
  Predictive performance on benchmarks is a noisy and poorly aligned proxy for
  the scientific worth of a machine learning paper, and treating it as the
  gate on publication produces publication bias, wasted compute, and
  incentives against risky ideas. This is a position paper, so the claim is
  argued rather than tested.


  The argument distinguishes novel method negative results (a proposed method
  that fails to beat state-of-the-art) from existing method negative results
  (replications and failure-mode studies, such as vanishing gradients or
  adversarial examples), and claims the latter are already tolerated while the
  former are effectively unpublishable.


  Supporting evidence is all borrowed from prior work: a clinical review that
  screened 2,212 COVID studies and scrutinised 62, finding none clinically
  useful; AI publication counts of almost 500,000 by the end of 2021 with
  exponential growth at a doubling rate of roughly 23 months and over 4,000
  papers per month in 2023; and Kaggle competitions where winners' reported
  gains were smaller than evaluation noise.


  No new experiments, no survey of reviewers or authors, no quantification of
  how much negative-result suppression actually costs. The counterfactuals
  section concedes that most objections to negative results apply equally to
  positive ones, which weakens rather than resolves them.


  The paper ends with 8 concrete measures: dedicated tracks and workshops,
  two-phase review where results are withheld in round 1, funded replication
  studies, and criteria reviewers could apply to negative results.


  Read it if you review or set venue policy; there is no empirical finding
  here to update on.
