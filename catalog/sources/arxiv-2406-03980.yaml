brief: >-
  Predictive performance on chosen benchmarks is a weak and noisy proxy for
  the worth of a machine learning paper, and treating it as the main criterion
  suppresses results that would be useful to the field. This is a position
  paper, not an experiment.


  The authors define the field's implicit null hypothesis (a proposed method
  does not beat existing methods on a relevant subset of problems) and split
  negative results into novel-method negative results, where a new method
  fails to beat the state of the art, and existing-method negative results,
  such as replication studies or failure-mode analyses, which they say already
  enjoy better standing.


  The case is argued from secondary literature rather than measured.
  Supporting figures are borrowed: Roberts et al. screened 2,212 COVID
  prognosis studies, scrutinised 62, and found none clinically useful; AI
  publications more than doubled between 2010 and 2021 to almost 500,000;
  Krenn et al. report exponential growth with a doubling rate of roughly 23
  months, past 4,000 papers per month in 2023. Varoquaux and Cheplygina found
  Kaggle winners' reported gains sometimes smaller than evaluation noise.


  No new data, no survey of reviewers or acceptance rates, no quantification
  of how many negative results go unpublished. The 4 counterarguments the
  authors raise are answered by appeal to a healthy review process.


  Useful if you want a structured vocabulary and 8 concrete action points for
  publication-bias arguments, not if you want evidence.
