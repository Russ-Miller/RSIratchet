brief: >-
  Predictive performance on chosen benchmarks is a noisy, poorly aligned proxy
  for the worth of a machine learning method, and the field's near-exclusive
  publication of methods that beat the state of the art creates publication
  bias, wasted compute, and incentives against risky ideas. The argument is
  for normalizing "negative" results, defined as cases where the null
  hypothesis that a method does not outperform existing methods cannot be
  rejected, split into novel-method negative results and existing-method
  negative results.


  This is a position paper, not an experiment. It assembles existing evidence:
  a review that screened 2,212 studies of COVID-19 detection and prognosis
  models and found none of the most promising 62 clinically useful; Kaggle
  analyses where winners' reported gains were smaller than evaluation noise;
  sensitivity of reported performance to dataset choice, hyperparameter
  tuning, evaluation tricks, and random seeds; and growth figures of almost
  500,000 AI papers by the end of 2021, doubling between 2010 and 2021, with
  exponential growth at a doubling rate of roughly 23 months and over 4,000
  papers per month in 2023.


  Nothing here is measured by the authors. No survey of reviewers, no data on
  how often negative-result submissions are rejected, no estimate of
  duplicated effort. The case is argued, with historical examples (vanishing
  gradients, adversarial examples) standing in for causal evidence.


  It also engages 4 counterarguments and ends with 8 concrete proposals,
  including a 2-phase review in which results are withheld from the first
  round.


  Useful if you review or design venues; it will not change your beliefs about
  any model capability.
