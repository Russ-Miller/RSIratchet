brief: >-
  Predictive performance on benchmarks is a noisy and weakly grounded proxy
  for whether a proposed method matters, and the field's near-exclusive
  publication of methods that beat the state of the art creates publication
  bias, duplicated work, and incentives against risky ideas. This is a
  position paper, so the claim is argued rather than tested.


  The authors define a negative result as failure to reject the usual null
  hypothesis that a method is not better than existing ones, and split it into
  novel-method negative results and existing-method negative results such as
  replication studies and failure-mode analyses. They then give 8 concrete
  action points: negative-results tracks and workshops, a 2-phase review that
  withholds experimental results from the first decision round, funding for
  replication, and reviewer criteria including surprise factor and depth of
  analysis of why the method failed.


  Evidence is entirely secondary. They cite a review that screened 2,212
  relevant studies on COVID detection and prognosis, scrutinised the most
  promising 62, and found none clinically usable; Kaggle analyses where
  winners' gains were smaller than evaluation noise; sensitivity of reported
  performance to dataset choice, hyperparameters, evaluation tricks and random
  seeds; and growth to almost 500,000 AI papers by the end of 2021 with a
  doubling rate of roughly 23 months and over 4,000 papers per month in 2023.


  No new experiment, no measurement of publication bias in machine learning
  venues, and no test of whether any proposed reform works. The
  counterfactuals section concedes that most of the quality objections apply
  equally to positive results.


  Useful as a framing for evaluation practice, not as evidence about any model
  capability.
