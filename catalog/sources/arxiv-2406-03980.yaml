brief: >-
  Predictive performance on benchmarks is a noisy and poorly aligned proxy for
  the scientific worth of a machine learning paper, and treating it as the
  deciding criterion distorts what gets published. The argument is positional,
  not experimental.


  The authors define negative results against the usual null hypothesis that a
  proposed method does not beat existing methods on a relevant subset of
  problems, and split them into novel method negative results (NMNR) and
  existing method negative results (EMNR), the latter covering replication
  studies and failure-mode papers such as the vanishing gradient work of
  Bengio et al. (1994) and adversarial examples in Szegedy et al. (2014).


  Supporting evidence is borrowed, not generated. They cite Roberts et al.
  (2021), who screened 2,212 COVID studies and scrutinised the most promising
  62, finding none clinically usable; Varoquaux and Cheplygina (2022), who
  found Kaggle winners' reported gains smaller than evaluation noise; and
  growth figures of almost 500,000 AI papers by the end of 2021, doubling
  between 2010 and 2021, with a doubling rate of roughly 23 months and over
  4,000 papers per month in 2023.


  There is no new measurement, no survey of reviewers or acceptance rates, and
  no test of whether publishing negative results would reduce duplicated
  effort. The counterfactuals section concedes most objections apply equally
  to positive results.


  Useful if you review or set venue policy: it ends with 8 concrete action
  points, including split-phase review where results are withheld in round 1.
