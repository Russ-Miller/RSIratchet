brief: >-
  Predictive performance on chosen benchmarks is a noisy and poorly aligned
  proxy for the worth of a machine learning method paper, and the resulting
  filter against "negative" results makes the field less efficient. This is a
  position paper, not an experiment.


  The authors define the field's usual null hypothesis (a proposed method is
  not better than existing ones on a relevant problem subset) and split
  negative results into novel-method negative results, where a new method
  fails to beat state-of-the-art, and existing-method negative results, such
  as replication studies or failure-mode analyses. They argue the latter are
  already tolerated while the former are near-unpublishable.


  The evidence is a synthesis of other people's numbers, not new measurement:
  Roberts et al. screened 2,212 COVID prediction studies, scrutinised 62, and
  found none clinically usable; Varoquaux and Cheplygina report Kaggle
  winners' margins smaller than evaluation noise; AI publications more than
  doubled between 2010 and 2021 to almost 500,000; Krenn et al. find
  exponential growth with a doubling rate of roughly 23 months and over 4,000
  papers per month in 2023. Sensitivity of reported gains to dataset choice,
  hyperparameters, evaluation tricks and random seeds is cited from prior
  work.


  Nothing here is tested. The claim that publishing negative results would
  reduce duplicated effort is argued, not demonstrated, and the paper admits
  the average positive-result paper is likely more impactful. Eight concrete
  proposals follow, including two-phase review where results are withheld in
  round 1.


  Read it for the review-process proposals, not for new findings.
