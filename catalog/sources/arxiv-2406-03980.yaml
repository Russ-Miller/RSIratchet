brief: >-
  Predictive performance on benchmarks is a noisy and poorly aligned proxy for
  the worth of a machine learning method, and treating it as the publication
  bar produces publication bias, wasted compute, and incentives against risky
  ideas. This is a position paper: the claim is argued, not measured.


  The argument distinguishes two kinds of negative result: novel method
  negative results (NMNR), where a proposed method fails to beat
  state-of-the-art, and existing method negative results (EMNR), where
  established methods are shown to underperform or to have failure modes. The
  authors define positive and negative relative to the null hypothesis that a
  proposed method does not beat existing methods on a relevant subset of
  problems.


  Supporting evidence is drawn entirely from cited literature: a review that
  screened 2,212 COVID prognostication studies and scrutinised 62, finding
  none clinically usable; Kaggle competitions where winners' reported gains
  were smaller than evaluation noise; AI publication counts more than doubling
  between 2010 and 2021 to almost 500,000, with a doubling rate of roughly 23
  months and over 4,000 papers per month in 2023.


  No new experiments, no survey of reviewers or authors, no quantification of
  how often negative results are rejected. The authors concede the average
  paper with a performance improvement is likely more impactful than one
  without, and do not ask for negative results to dominate.


  Useful if you review or design venues; 8 concrete measures are proposed,
  including two-phase review that hides results in round 1.
