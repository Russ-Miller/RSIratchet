brief: >-
  Letting each agent pick its own communication action with a QMIX-trained
  Q-network, rather than generating the whole agent graph centrally, raises
  multi-agent accuracy and cuts token use at the same time. The usual
  assumption that topology must be designed or generated globally is what this
  cuts against.


  Agent Q-Mix gives 3 agents a 6-action discrete space (solo_process,
  broadcast_all, selective_query, aggregate_refine, execute_verify,
  debate_check) whose joint choice forms a round-wise adjacency matrix; each
  agent uses a topology-aware GNN, GRU memory, and per-agent Q-heads under
  centralized training with decentralized execution, with reward trading
  accuracy against token cost. Evaluation covers 7 benchmarks across coding,
  reasoning and mathematics on GPT-OSS:120B and Gemini-3.1-Flash-Lite, plus
  HLE.


  On GPT-OSS:120B it averages 72.73% against GTD's 60.37% and AutoGen's
  68.60%, with HMMT at 53.33% versus 43.33% for the next best prior method. On
  Gemini-3.1-Flash-Lite the average is 66.90%. MMLU-Pro token usage is 112K
  versus 471K–2.71M for other multi-agent methods. Under injection of 1
  adversarial agent, accuracy falls 2.86 points versus 8.57 for LLM-Debate.


  Evidence is measured, median of 3 runs, against 12 baselines including
  commercial frameworks, but the comparisons are not matched on token budget,
  and the authors' claim that differences are attributable to the learned
  topology rests on shared evaluation tasks rather than ablation of the GNN,
  GRU or QMIX parts in the main text. Gains are smallest on coding and
  reasoning where single-agent accuracy is already near ceiling, and only 3
  agents and 2 model backbones were tested.


  If you build agent workflows, this is a reason to treat communication
  structure as a learned per-agent decision rather than a fixed template.
