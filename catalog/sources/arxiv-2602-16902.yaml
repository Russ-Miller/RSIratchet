brief: "Frontier models form sensible navigation strategies but fail at
  revising them: they recognise they are stuck in a loop and keep looping
  until the step budget runs out. LLM-WikiRace asks a model to walk the
  Wikipedia hyperlink graph from a source page to a target, seeing only the
  current page title, 50 outgoing link titles, the target, and its visit
  history, over a 549,232-page snapshot, capped at 30 steps. Splits are set by
  shortest path length: easy (3-4, 200 pairs), medium (5-6, 150), hard (7-8,
  100). Leading models exceed 90% on easy but Gemini 3.1 tops hard at 29%;
  GPT-5 reaches 15.0% hard, Opus 4.5 18.0%, LLaMA 3 70B 7%, and most sub-30B
  open models 0%. Gemini 3 loops in 86% of hard tasks and solves only 10% of
  those, while all loop-free hard tasks are solved; across families, loop
  frequency vs success gives a regression coefficient of -1.02 (95% CI -1.13
  to -0.91). A 1k-pair link-prediction probe predicts success for instruct
  models, but reasoning models sit up to 20 percentage points above that fit.
  Evidence is measured on a fixed graph across over 20 models; the loop
  analysis rests on 18 hand-sampled trajectories per model for 2 models. DAPO
  fine-tuning of Qwen-2.5-7B lifts easy from 22.5% to 67.5% but leaves hard at
  0 - 1 model, 1 algorithm, single-step reward. Treat long-horizon replanning,
  not knowledge, as the binding constraint."
