summary: >-
  We introduce LLM-Wikirace, a benchmark for evaluating planning, reasoning,
  and world knowledge in large language models (LLMs). In LLM-Wikirace,
  models must efficiently navigate Wikipedia hyperlinks step by step to
  reach a target page from a given source, requiring look-ahead planning and
  the ability to reason about how concepts are connected in the real world.
  We evaluate a broad set of open- and closed-source models, including
  Gemini-3, GPT-5, and Claude Opus 4.5, which achieve the strongest results
  on the easy level of the task and demonstrate superhuman performance.
