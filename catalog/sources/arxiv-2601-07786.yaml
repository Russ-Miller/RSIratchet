brief: >-
  Developers who ship AI-generated code often admit in comments that they do
  not understand it, and the debt they self-admit skews toward deferred
  testing and unfinished implementation rather than design flaws.


  The authors searched public Python and JavaScript GitHub repositories
  (November 2022–July 2025) with 196 queries built from 7 AI terms, 6
  generative verbs and 4 connectors, yielding 37,234 files and 6,540 unique
  comments referencing an LLM. Filtering for TODO/FIXME/HACK/XXX gave 96
  candidates, manually reduced to 81 after removing 15 false positives, then
  labelled with Maldonado et al.'s 5 SATD types and open-coded for AI's role.


  Design Debt was 33/81 (40.74%) against 71.84% in Maldonado et al., while
  Requirement Debt rose to 20.98% (vs 14.24%) and Test Debt to 20.98% (vs
  2.09%). Developers cast AI as Catalyst in 34/81 (41.98%), Source in 22/81
  (27.2%), Mitigator in 19/81, Neutral in 6/81 (7.4%).


  This is measured by 2 annotators (Cohen's κ=0.896) but the comparison to
  prior SATD distributions is across studies, corpora and eras, with no
  matched baseline of non-AI comments from the same repositories. Keyword
  detection misses other phrasings; 81 instances, 2 languages, public code
  only.


  Treat the shift toward test and requirement debt as a hypothesis worth
  testing, not an established rate.
