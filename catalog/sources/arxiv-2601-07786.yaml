brief: >-
  Developers ship AI-generated code they admit they do not understand, and
  they say so in comments. In 81 GitHub code comments that both reference an
  LLM and carry a debt marker, the most common self-admitted problem is
  uncertainty about correctness rather than a deliberate shortcut.


  196 keyword queries over public Python and JavaScript repositories (November
  2022–July 2025) returned 37,234 files, reduced by AST comment extraction and
  deduplication to 6,540 LLM-referencing comments; filtering on TODO, FIXME,
  HACK, XXX left 96, of which 81 survived manual validation.


  Using Maldonado's 5-type taxonomy: Design Debt 33 (40.74%), Requirement Debt
  17 (20.98%), Test Debt 17 (20.98%), Defect Debt 11 (13.58%), Documentation
  Debt 3 (3.70%). Against Maldonado et al., design falls (40.74% vs. 71.84%)
  while requirement (20.98% vs. 14.24%) and test debt (20.98% vs. 2.09%) rise.
  Open coding of AI's role: Catalyst 34/81 (41.98%), Source 22/81 (27.2%),
  Mitigator 19/81, Neutral 6/81 (7.4%).


  This is descriptive, not causal. The comparison to prior SATD distributions
  is across studies, not matched repositories or time periods, and the yield
  rate (1.47%) is close to the 1.86% SATD base rate. Two annotators, Cohen's
  κ=0.896.


  Keyword detection misses paraphrased AI mentions, and 2 languages and public
  repos only. Treat the distribution shift as a hypothesis worth testing at
  scale, not a measured effect.
