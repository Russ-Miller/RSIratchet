brief: >-
  Developers who label code as AI-generated in comments are documenting a
  different mix of technical debt than the classic SATD literature reports:
  less design debt, much more deferred testing and unfinished implementation.


  The study scraped public Python and JavaScript GitHub repositories from
  November 2022 to July 2025 using 196 keyword queries combining AI tool
  names, generative verbs, and connectors, yielding 37,234 files and 6,540
  unique LLM-referencing comments. Filtering for TODO, FIXME, HACK, XXX left
  96 candidates; manual annotation removed 15 false positives, leaving 81
  comments coded against Maldonado et al.'s 5 SATD types.


  Design Debt was most common at 33 (40.74%) but far below the 71.84% in prior
  work, while requirement debt reached 20.98% (vs 14.24%) and test debt 20.98%
  (vs 2.09%). In open coding of AI's role, developers cast AI as a Catalyst
  for future debt in 34/81 cases, a Source of errors in 22/81, a Mitigator in
  19/81, and Neutral in 6/81.


  This is descriptive, not causal: the comparison to prior SATD distributions
  is across different corpora and eras, with no matched baseline of non-AI
  comments from the same repositories. Inter-annotator agreement was Cohen's
  κ=0.896. Keyword detection misses alternative phrasing, and 81 instances
  from 2 languages cannot support quantitative generalization.


  Treat the shift toward deferred validation as a hypothesis worth testing at
  scale, not an established effect.
