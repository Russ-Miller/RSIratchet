summary: >-
  As large language models (LLMs) such as ChatGPT, Copilot, Claude, and
  Gemini become integrated into software development workflows, developers
  increasingly leave traces of AI involvement in their code comments. Among
  these, some comments explicitly acknowledge both the use of generative AI
  and the presence of technical shortcomings. Analyzing 6,540
  LLM-referencing code comments from public Python and JavaScript-based
