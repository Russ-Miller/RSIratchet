brief: >-
  Developers who label code as AI-generated in comments often also admit they
  do not understand or trust it, and the debt they self-admit skews toward
  deferred completion and testing rather than design.


  The study scraped public Python and JavaScript GitHub repositories (November
  2022–July 2025) using 196 keyword queries combining AI tool names,
  generative verbs, and connectors, yielding 37,234 files and 6,540 unique
  LLM-referencing comments. Filtering for TODO, FIXME, HACK, XXX left 96
  candidates; manual annotation against Maldonado et al.'s 5-type taxonomy
  removed 15 false positives, leaving 81.


  Design Debt dominated at 33/81 (40.74%) but far below the 71.84% in prior
  SATD work, while Requirement Debt (20.98% vs 14.24%) and Test Debt (20.98%
  vs 2.09%) were higher. Open coding of AI's role gave Catalyst 34/81
  (41.98%), Source 22/81 (27.2%), Mitigator 19/81, Neutral 6/81. The authors
  name the uncertainty pattern GIST.


  The distribution shift is a descriptive comparison against a differently
  constructed prior corpus, not a matched baseline, and the 81 instances carry
  no statistical test. Cohen's κ=0.896 supports the labelling. Keyword
  detection misses alternative phrasings, and only comments where developers
  chose to disclose AI use are visible.


  Treat this as a vocabulary and a hypothesis about deferred verification, not
  a measured rate of AI-induced debt.
