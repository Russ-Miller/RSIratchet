brief: >-
  Vision-language models fail at fusing several partial ego-centric camera
  views into one scene, and the fix that works is supervised warm-up before
  RL, not RL alone. Multiple close-range robot views also beat a single
  privileged overhead camera on the same scenes.


  E2W-Bench puts 3 tasks over multi-robot views: global counting, relational
  location reasoning across objects that never co-occur in one view, and
  grasping that outputs 2D image coordinates. Over 100k simulated and 60k
  real-world samples, 15k+ scenes, scene-disjoint splits. CoRL is CoT SFT then
  GRPO with a Cross-View Spatial Reward combining Hungarian-matched IoU
  grounding, an overlap-count term, and answer correctness.


  CoRL-7B reaches 82.67 average reasoning accuracy vs 72.33 for SFT alone,
  51.50 for RL from scratch, and 54.50 for GPT-5. Multi-view vs single global
  view on E2W-2(S): 97.0 vs 54.0. On Where2Place, 50.9 vs RoboPoint 46.8. Real
  robot success: 65% and 30% on 2 tasks vs 0.0 for RoboPoint.


  Ablations remove each reward component on the 7B model; dropping answer
  correctness collapses E2W-1 from 61.0 to 10.5, isolating that intermediate
  shaping alone is insufficient. Baselines are zero-shot under matched
  prompts, not compute-matched, and all fine-tuning uses 1 backbone family,
  Qwen2.5-VL. Real-world evidence is 2 tasks on 1 rig.


  If you are building multi-robot perception, prefer distributed cameras and
  do not skip the SFT stage.
