summary: "Understanding the world from distributed, partial viewpoints is a
  fundamental challenge for embodied multi-agent systems. Each agent perceives
  the environment through an ego-centric view that is often limited by
  occlusion and ambiguity. To study this problem, we introduce the
  Ego-to-World (E2W) benchmark, which evaluates a vision-language model's
  ability to fuse heterogeneous viewpoints across three tasks: (i) global
  counting, (ii) relational location reasoning, and (iii) action-oriented
  grasping that requires predicting view-specific image coordinates. To
  address this setting, we propose CoRL"
notes: "Filed as a source on embodied-control from the classifier's judgement
  that the paper is about it (improves, low): The proposed CoRL training
  improves cross-view spatial grounding and is reported to enable successful
  real-world multi-robot grasp-and-place execution, though the bulk of
  evaluation is benchmark reasoning rather than closed-loop control. No claim
  has been drafted from it yet."
