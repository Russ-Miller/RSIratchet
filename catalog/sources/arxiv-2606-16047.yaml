brief: >-
  Multi-agent debate helps on argument relation classification only when it is
  withheld from confident cases; run on every sample it changes about as many
  predictions for the worse as for the better.


  The setup extends a Proponent-Opponent-Judge framework (Manager and debaters
  on Gemini 2.5 Flash, Judge on Gemini 2.5 Pro, 2 rounds) to joint Argument
  Relation Identification and Classification on UKP Argument Annotated Essays
  v2, labeling within-paragraph component pairs as Support, Attack or None
  over the standard 80-essay test split, against Vanilla, CoT, a Gemini 2.5
  Pro "Smart Reasoning" baseline, and fine-tuned RoBERTa-base/large.


  Gating at tau = 0.70 debates 332 of 2,407 samples (14%) and reaches Macro F1
  0.585 versus 0.578 for the strongest single-agent baseline; full debate
  drops to 0.561. Gated debate flipped 84 predictions right and 48 wrong; full
  debate 249 right and 236 wrong. Attack F1 is 0.427 gated, 0.071 for
  RoBERTa-base and 0.167 for RoBERTa-large, which win on Weighted F1 (0.707,
  0.721).


  The threshold sweep and the improvement/regression counts isolate the gating
  effect, but the margin over Baseline C is 0.007 and untested for statistical
  significance, Attack rests on 42 test instances, and 1 corpus and 1 model
  family were used.


  Boundaries: gold component boundaries assumed, no end-to-end pipeline, no
  cross-domain test.


  Treat confidence routing, not debate itself, as the lever.
