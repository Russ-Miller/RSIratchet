summary: As corporate responsibility increasingly incorporates environmental,
  social, and governance (ESG) criteria, ESG reporting is becoming a legal
  requirement in many regions and a key channel for documenting sustainability
  practices and assessing firms' long-term and ethical performance. However,
  the length and complexity of ESG disclosures make them difficult to
  interpret and automate the analysis reliably. To support scalable and
  trustworthy analysis, this paper introduces ESG-Bench, a benchmark dataset
  for ESG report understanding and hallucination mitigation in large language
  models (LLMs). ES
