brief: >-
  Fine-tuning small open models on explicit 4-step reasoning templates
  improves both grounded answering and abstention on long documents more than
  plain supervised fine-tuning does. ESG-Bench frames corporate sustainability
  report analysis as question answering with a "Not provided" option, built
  from 94 ESG reports published 2020-2024, 270 human-annotated QA pairs from
  GPT-4o outputs, and a larger mitigation split with 1,358 correct and 25,516
  hallucinated responses. Contexts average 2,604 tokens and reach 46,562
  tokens.


  LLaMA-3.2-3B, Gemma-2-2B-it and Mistral-7B-Instruct-v0.3 were tested without
  fine-tuning, with supervised fine-tuning, and with 2-step and 4-step CoT
  fine-tuning, on ESG-Bench (300 test items), HaluEval (400) and BioASQ (400),
  each roughly balanced between answerable and unanswerable. On ESG-Bench,
  LLaMA goes from 76.00% overall accuracy without fine-tuning to 90.67% with
  SFT and 96.00% with 4-step CoT; Gemma from 71.00% to 92.00%; Mistral from
  80.67% to 90.00%. Gains carry to BioASQ (Gemma 89.75% to 99.50%) and
  HaluEval.


  The ablation across 4 training settings and 3 model families isolates the
  CoT supervision, but GPT-4o generated both the source answers and the step-1
  topics, and its self-judgments serve as proxy supervision; annotator
  agreement was 68.89-86.67%. No frontier models, no retrieval baseline, no
  matched-compute comparison.


  Treat structured multi-step CoT supervision, not more SFT data, as the lever
  for abstention behaviour in document-grounded QA.
