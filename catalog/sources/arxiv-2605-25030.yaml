summary: >-
  Retrieval-augmented generation (RAG) systems offer a promising approach to
  reduce hallucinations and improve answer accuracy in large language models
  (LLMs), a requirement for reliable, financial analysis where answers must
  be grounded in verifiable evidence from filings rather than generated from
  model priors. However, designing RAG systems that extract meaningful
  insights from mixed financial documents and integrate into analyst
  workflows remains challenging. This paper introduces MimirRAG
  (Metadata-Integrated Multi-Agent Information Retrieval), a multi-agent RAG
  system developed iteratively
