summary: >-
  Behavioral alignment in large language models (LLMs) is often achieved
  through broad fine-tuning, which can result in undesired side effects like
  distributional shift and low interpretability. We propose a method for
  alignment that identifies and updates only the neurons most responsible
  for a given behavior, a targeted approach that allows for fine-tuning with
  significantly less data. Using sparse autoencoders (SAEs) and linear
  probes, we isolate the 3% of MLP neurons most predictive of a target
  behavior, decode them into residual space, and fine-tune only those
  neurons using gradient masking
