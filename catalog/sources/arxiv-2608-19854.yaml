summary: >-
  Large language model agents have made substantial progress in code
  generation, yet most existing systems assume a predefined repository
  architecture. This assumption does not hold in zero-to-all code
  generation, where an agent must construct an entire software project
  directly from natural-language requirements while maintaining a modular
  repository architecture throughout development. We present Repo0, a
  continuous structural evolution framework for zero-to-all code generation.
