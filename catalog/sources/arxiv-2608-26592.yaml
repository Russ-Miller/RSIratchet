summary: >-
  Following clinical decision pathways (CDPs) defined by clinical practice
  guidelines is essential for safe and reliable medical decision-making.
  However, existing medical large language model (LLM) benchmarks mainly
  evaluate final-answer accuracy, providing limited evaluation of models'
  ability to adhere to guidelines. To address this gap, we introduce
  MEGA-CDP, a benchmark for evaluating whether medical LLMs can generate
  guideline-adherent CDPs using provided guidelines as references. MEGA-CDP
  is constructed from 2,274 English and Chinese clinical practice guidelines
