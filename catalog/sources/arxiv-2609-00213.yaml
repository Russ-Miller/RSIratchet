summary: >-
  Reinforcement learning fine-tuning of large language models increasingly
  adopts multiple reward dimensions, including verifiable rules,
  task-specific evaluators, and learned reward models, to provide richer
  supervision across diverse capabilities. These dimensions are commonly
  scalarized with fixed aggregation weights. We identify a failure mode in
  which aggregation itself induces reward hacking: static projection aliases
  qualitatively different reward profiles into a single scalar, steering
  optimization toward whichever dimensions are easiest, densest, or
  systematically favored by the reward
