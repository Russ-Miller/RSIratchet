summary: >-
  Despite the remarkable progress of large vision language models (LVLMs),
  object hallucination remains a fundamental challenge that hinders their
  trustworthy deployment. A key finding motivates our work: real and
  hallucinated object tokens are clearly separable in hidden
  representations, yet this separability is largely lost at the
  language-modeling (LM) head. We propose TruthLens, a self-evaluation
  framework that teaches the LM head to expose a per-object truthfulness
  signal without any auxiliary model or additional inference cost.
