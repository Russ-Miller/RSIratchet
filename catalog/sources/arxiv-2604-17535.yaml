brief: >-
  A model's own short-context behavior is a usable teacher for its
  long-context behavior: distilling token-by-token from the same weights
  prompted with an extracted short passage recovers most of the degradation
  seen at 128K tokens.


  OPSDL builds (long context, extracted short chunk, self-generated question)
  triplets from raw documents with no annotation, samples responses on-policy
  under the long context, and uses the log-ratio of short-context teacher to
  long-context student probability as a per-token advantage for a
  policy-gradient update. Backbones are Qwen2.5-Instruct at 7B, 14B and 32B,
  evaluated on RULER and LongBench V2.


  RULER average rises from 77.16 to 86.32 at 7B, and at 128K the gain over the
  base instruct model is +48.70, +34.25 and +30.29 at 7B, 14B and 32B. The gap
  to the dedicated Qwen2.5-Instruct-1M variants narrows from 13.10 to 3.94 at
  7B and 10.57 to 3.28 at 14B. Short-context benchmarks drop about 1.3
  percentage points versus 3-4 for Long-SFT.


  Measured against Long-SFT and LongPO baselines, but LongPO is only reported
  at 7B (it failed to converge at 14B and 32B in their reproduction), there is
  no matched-compute comparison, no ablation of the short-chunk extraction or
  the reverse-KL form, and 1 model family only.


  If you are post-training for long context, this removes the reward model and
  preference pairs from the pipeline.
