brief: >-
  Token-level verdict probability combined with contradiction between
  rationales generated under opposing assumptions gives better-calibrated
  factual confidence than asking a model how confident it is. The authors use
  this signal to decide when a fact-checker should retrieve at all.


  PCC scores each claim on internal certainty (log-probability margin between
  True and False verdict tokens) and reasoning consistency (NLI contradiction
  between rationales elicited under assume-true and assume-false prompts),
  then routes claims into 4 quadrants: direct answer, targeted
  contradiction-driven search, reflection-guided search, or deep search.
  Tested on SciFact, FeLMWk, and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1,
  GPT-3.5-turbo.


  ECE falls from 23.53 to 12.91 on SciFact (Gemini-2.5-Pro) and 39.37 to 20.76
  on HoVer (GPT-4o-mini). Against FIRE, the closest baseline, False-label F1
  on HoVER rises 0.66 to 0.76 with GPT-4o. The largest shift is GPT-3.5-turbo
  on FeLMWk: 0.23 to 0.66 on False claims.


  The ablation separates targeted from deep search by quadrant and shows each
  wins in its intended region, so the routing claim is isolated. Thresholds
  were set empirically on the same distributions; no retrieval-cost or
  token-budget accounting is reported despite efficiency being a stated
  motivation, and no significance testing.


  Low-certainty, high-consistency cases favor broad retrieval over
  contradiction-driven queries, and Mistral's SciFact False score drops 0.57
  to 0.53. If you build retrieval-gated verifiers, logits plus counterfactual
  rationale agreement is a stronger gate than verbalized confidence.
