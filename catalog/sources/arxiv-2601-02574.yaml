brief: >-
  An LLM's self-reported verbal confidence is a worse retrieval trigger for
  fact-checking than two internal signals: the log-probability margin between
  "True" and "False" verdict tokens, and the NLI-measured contradiction
  between rationales the model generates under opposing assumptions. PCC
  combines both, then routes each claim into 1 of 4 strategies: direct answer,
  contradiction-driven targeted search, reflection-guided search, or deep
  search.


  Evaluation covers SciFact, FeLMWk and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1 and
  GPT-3.5-turbo, against Factool, FactCheck-GPT, SAFE and FIRE.


  Calibration improves: ECE falls from 23.53 to 12.91 on SciFact
  (Gemini-2.5-Pro), 39.37 to 20.76 on HoVer (GPT-4o-mini), 34.41 to 23.95 on
  FeLMWk. F1 on False claims rises from 0.66 to 0.76 on HoVER over FIRE with
  GPT-4o, a 15.2 percent relative gain. The largest effect is with
  GPT-3.5-turbo on FeLMWk, where False F1 goes from 0.23 to 0.66, near
  GPT-4.1's 0.68.


  The RQ3 comparison holds the search module fixed and varies only the
  confidence signal, which isolates the trigger. Quadrant ablations show
  targeted search wins only under high certainty and low consistency; deep
  search wins in the opposite quadrant. No retrieval-cost or token-budget
  numbers are reported despite efficiency claims, thresholds are set
  empirically on the same distributions, and 1 result regresses (SciFact
  False, Mistral, 0.57 to 0.53).


  If you gate retrieval on verbalized confidence, logprob margin plus
  rationale consistency is the cheaper substitute to try.
