brief: >-
  A model's self-reported verbal confidence is a poor router for deciding when
  to retrieve evidence; token-level verdict margins combined with
  cross-assumption rationale contradiction do better. Probabilistic Certainty
  and Consistency (PCC) scores internal certainty from the log-probability gap
  between True and False verdict tokens, and reasoning consistency as 1 minus
  the NLI contradiction between rationales generated assuming the claim is
  true versus false, then routes claims into 4 quadrants: direct answer,
  targeted contradiction-driven search, reflection-guided retrieval, or deep
  search.


  Evaluated on SciFact, FeLMWk, and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1, and
  GPT-3.5-turbo, against Factool, FactCheck-GPT, SAFE, and FIRE. Calibration
  error drops from 23.53 to 12.91 on SciFact (Gemini-2.5-Pro) and 39.37 to
  20.76 on HoVer (GPT-4o-mini). On HoVER the False-label F1 rises from 0.66
  (FIRE) to 0.76. The largest gain is GPT-3.5-turbo on FeLMWk, False F1 0.23
  to 0.66.


  The PCC-versus-verbal comparison holds the search module fixed, which
  isolates the confidence signal. Quadrant ablations show targeted search
  beats deep search only when certainty is high and consistency low, and loses
  when reversed. No retrieval-call or token-cost figures are reported despite
  efficiency claims, and the thresholds were chosen empirically on the same
  distributions. Gains are 2–4 points for most model-dataset pairs, and 1 case
  regresses (Mistral SciFact False, 0.57 to 0.53).


  If you route retrieval on verbalized confidence, logit margins plus
  adversarial rationale contradiction are a cheap upgrade.
