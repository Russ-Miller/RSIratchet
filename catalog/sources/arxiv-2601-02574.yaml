brief: >-
  Verbalized confidence is a poor router for deciding when a fact-checking LLM
  should search; token-level probability margins combined with rationale
  consistency are better calibrated and improve verdicts, especially on false
  claims.


  PCC scores each claim on internal certainty (log-probability margin between
  True and False verdict tokens) and reasoning consistency (NLI contradiction
  between rationales generated under the assumption the claim is true vs
  false). The 2 signals partition claims into 4 quadrants mapped to direct
  answering, contradiction-driven targeted search, reflection-guided search,
  or iterative deep search. Benchmarks: SciFact, FeLMWk, HoVER; models GPT-4o,
  GPT-4o-mini, GPT-4.1, GPT-3.5-turbo, Gemini-2.5-Pro, Gemini-2.5-Flash,
  Mistral-7B-Instruct.


  Calibration improves: ECE drops from 23.53 to 12.91 on SciFact with
  Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini, 34.41 to 23.95 on
  FeLMWk. Against FIRE, the closest baseline, HoVER False F1 goes 0.66 to 0.76
  with GPT-4o. The largest effect is on a weak model: GPT-3.5-turbo False F1
  on FeLMWk rises from 0.23 to 0.66.


  The retrieval comparison is controlled, PCC uses FIRE's search module and
  differs only in the trigger signal, and a quadrant ablation shows targeted
  search beats deep search only under high certainty and low consistency (0.58
  to 0.66 on SciFact), with the reverse in the other quadrant. Thresholds are
  set empirically on the score distributions, so some tuning is unaccounted
  for. No retrieval-call counts are reported, so the claimed efficiency gain
  is argued rather than measured, and the method needs token logprobs.


  If you route retrieval on self-reported confidence, switch to logprob
  margins plus adversarial rationale agreement.
