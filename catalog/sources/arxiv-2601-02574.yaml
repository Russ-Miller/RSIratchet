brief: >-
  A model's self-reported verbal confidence is a worse router for deciding
  whether to retrieve evidence than two mechanical signals: the
  log-probability margin between "True" and "False" verdict tokens, and the
  NLI-measured contradiction between rationales the model writes under
  opposing assumptions. The second signal catches confident-but-unstable cases
  that token probabilities miss.


  PCC combines both into a 4-quadrant router: answer directly, targeted
  retrieval from the most contradictory rationale pair, reflection-guided
  retrieval, or iterative deep search. Tested on SciFact, FeLMWk, and HoVER
  with GPT-4o, GPT-4o-mini, Gemini-2.5-Pro, Gemini-2.5-Flash,
  Mistral-7B-Instruct, GPT-4.1, GPT-3.5-turbo.


  Calibration improves: ECE falls from 23.53 to 12.91 on SciFact with
  Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini, 34.41 to 23.95 on
  FeLMWk. Against FIRE, the closest baseline, HoVER False-label F1 rises 0.66
  to 0.76 (15.2 percent). The largest effect is on a weak model: GPT-3.5-turbo
  False F1 on FeLMWk goes 0.23 to 0.66, near GPT-4.1's 0.68.


  The confidence-signal comparison is isolated: PCC uses the same search
  module as FIRE, differing only in the routing signal. Quadrant ablations
  show targeted search beats deep search only in the high-certainty,
  low-consistency region, and loses in the reverse region.


  Thresholds were chosen empirically from score distributions, with no
  held-out tuning described, and gains are not uniform: Mistral SciFact False
  F1 drops 0.57 to 0.53, Gemini-2.5-Flash HoVER False drops 0.73 to 0.70.
  Retrieval-call savings are claimed but no cost figures are given.


  If you route retrieval on verbalized confidence, logprob margin plus
  rationale contradiction is a cheap substitute worth testing.
