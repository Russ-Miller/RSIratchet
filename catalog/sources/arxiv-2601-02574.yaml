brief: >-
  A model's self-reported verbal confidence is a worse router for "should I
  retrieve evidence?" than two mechanical signals: the log-probability margin
  between True and False verdict tokens, and whether rationales generated
  under opposing assumptions contradict each other.


  PCC combines these into a 2-dimensional score and partitions claims into 4
  quadrants, routing each to direct answering, contradiction-driven targeted
  search, reflection-guided retrieval, or iterative deep search. Evaluated on
  SciFact, FeLMWk, and HoVER against Factool, FactCheck-GPT, SAFE, and FIRE,
  with GPT-4o, GPT-4o-mini, Gemini-2.5-Pro/Flash, Mistral-7B-Instruct,
  GPT-4.1, and GPT-3.5-turbo.


  Calibration improves: ECE falls from 23.53 to 12.91 on SciFact with
  Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini. Verification F1 on
  False claims rises from 0.66 to 0.76 on HoVER over FIRE with GPT-4o. The
  largest effect is on weak models: GPT-3.5-turbo goes from 0.23 to 0.66 on
  FeLMWk False claims, close to GPT-4.1's 0.68.


  Measured, not argued, with a quadrant-level ablation showing targeted search
  beats deep search only in the high-certainty/low-consistency region (0.58 to
  0.66 on SciFact) and loses in the opposite quadrant. The retrieval
  comparison against FIRE holds the search module fixed. No matched
  retrieval-call or token budget is reported despite efficiency being a stated
  goal, thresholds are tuned empirically on the same distributions, and gains
  are not uniform: Mistral False F1 on SciFact drops 0.57 to 0.53.


  If you route retrieval on verbalized confidence, logprob margins plus NLI
  contradiction are a cheap replacement worth testing.
