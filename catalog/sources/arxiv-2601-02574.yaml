brief: >-
  Token-level verdict probabilities plus the stability of a model's rationales
  under opposing assumptions give a better-calibrated factual confidence
  signal than asking the model to state its confidence in words. Probabilistic
  Certainty and Consistency (PCC) combines an internal certainty score from
  the log-probability margin between "True" and "False" verdict tokens with a
  reasoning consistency score from an NLI model's contradiction probability
  between rationales generated under assume-true and assume-false prompts.


  The 2 signals route each claim into 1 of 4 quadrants: direct answering,
  contradiction-driven targeted search, reflection-guided retrieval, or
  iterative deep search. Evaluated on SciFact, FeLMWk, and HoVER with GPT-4o,
  GPT-4o-mini, Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1
  and GPT-3.5-turbo, against Factool, FactCheck-GPT, SAFE and FIRE.


  ECE falls from 23.53 to 12.91 on SciFact (Gemini-2.5-Pro) and from 39.37 to
  20.76 on HoVer (GPT-4o-mini). On HoVER, False-label F1 rises from 0.66 under
  FIRE to 0.76 with GPT-4o, a 15.2 percent relative gain. With GPT-3.5-turbo
  on FeLMWk, False F1 goes from 0.23 to 0.66.


  The routing comparison is partly isolated: the verbal-confidence baseline
  uses the same search module, differing only in the trigger. Retrieval-cost
  efficiency is claimed but no call counts are reported, thresholds α and β
  were set empirically from observed score distributions, and gains are mostly
  2-4 points. Not all cells favor PCC (SciFact False drops 0.57 to 0.53 on
  Mistral-7B).


  If you route retrieval on self-reported confidence, logit margins plus
  rationale contradiction are a cheap replacement worth testing.
