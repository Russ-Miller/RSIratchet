brief: >-
  An LLM's self-reported verbal confidence is a worse router for retrieval
  than token-level probability margins combined with the stability of its
  rationales under opposing assumptions. PCC scores each claim on internal
  certainty (probability gap between "True" and "False" verdict tokens) and
  reasoning consistency (NLI contradiction between rationales generated
  assuming the claim is true vs false), then routes to direct answering,
  contradiction-driven targeted search, reflection-guided retrieval, or
  iterative deep search.


  Evaluation covers SciFact, FeLMWk and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1 and
  GPT-3.5-turbo, against Factool, FactCheck-GPT, SAFE and FIRE.


  Calibration improves: ECE falls from 23.53 to 12.91 on SciFact with
  Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini, 34.41 to 23.95 on
  FeLMWk. F1 on False claims on HoVER rises from 0.66 (FIRE) to 0.76. The
  largest effect is on a weak model: GPT-3.5-turbo False F1 goes from 0.23 to
  0.66, near GPT-4.1's 0.68.


  The comparison against FIRE holds the search module fixed and varies only
  the confidence signal, which isolates the routing signal. Quadrant ablations
  show targeted search wins only in the high-certainty/low-consistency region;
  deep search wins in the opposite one. Gains are small on True labels, and
  Mistral False F1 on SciFact drops 0.57 to 0.53. Thresholds were chosen
  empirically on the same distributions, and no retrieval-cost figures are
  reported despite efficiency claims.


  If you route retrieval on verbalized confidence, logprob margins plus
  rationale consistency are a cheap substitute worth testing.
