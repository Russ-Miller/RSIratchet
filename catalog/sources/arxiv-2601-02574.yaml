brief: >-
  Token-level verdict probabilities combined with the stability of a model's
  rationales under opposing framings predict factual correctness better than
  the model's self-reported verbal confidence, and that signal can route when
  and how to retrieve. The framework, Probabilistic Certainty and Consistency
  (PCC), takes the log-probability margin between True and False verdict
  tokens as internal certainty, and uses an NLI contradiction score between
  rationales generated under "assume true" and "assume false" prompts as
  reasoning consistency. Claims fall into 4 quadrants: direct answering,
  contradiction-driven targeted search, reflection-guided retrieval, or
  iterative deep search.


  Tested on SciFact, FeLMWk, and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1, and
  GPT-3.5-turbo. Calibration improves: ECE falls from 23.53 to 12.91 on
  SciFact with Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini.
  Against FIRE, the closest baseline, F1 on False claims rises from 0.66 to
  0.76 on HoVER with GPT-4o (15.2 percent relative). The largest gain is
  GPT-3.5-turbo on FeLMWk, 0.23 to 0.68 with GPT-4.1 at 0.68.


  Evidence is measured, with a quadrant-level ablation comparing targeted
  versus deep search, and the verbal-confidence comparison holds the search
  module fixed. No cost or token-budget accounting is reported despite
  efficiency being a stated motive, thresholds are set empirically per
  distribution, and gains are small or reversed in places (SciFact False with
  Mistral drops 0.57 to 0.53).


  If you route retrieval on self-reported confidence, logit margins plus
  rationale consistency are a cheaper and better-calibrated trigger.
