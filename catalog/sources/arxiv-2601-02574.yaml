brief: >-
  A model's self-reported verbal confidence is a worse router for deciding
  when to retrieve evidence than two mechanical signals: the log-probability
  margin between "True" and "False" verdict tokens, and the NLI contradiction
  score between rationales generated under opposing assumptions. The authors
  call the combination Probabilistic Certainty and Consistency (PCC) and use
  it to pick 1 of 4 verification strategies per claim, from direct answering
  to deep search.


  Evaluation covers SciFact, FeLMWk and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1 and
  GPT-3.5-turbo, against Factool, FactCheck-GPT, SAFE and FIRE.


  Calibration improves: ECE falls from 23.53 to 12.91 on SciFact with
  Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini, 34.41 to 23.95 on
  FeLMWk. F1 on False claims on HoVER rises from 0.66 (FIRE) to 0.76. The
  largest gap is GPT-3.5-turbo on FeLMWk, where False F1 goes 0.23 to 0.66,
  close to GPT-4.1's 0.68.


  The comparison against FIRE holds the search module fixed and varies only
  the confidence signal, which isolates the routing effect. Retrieval cost is
  claimed to drop but no token or API-call counts are reported. Quadrant
  ablations show targeted search beats deep search only under high certainty
  and low consistency; the reverse holds elsewhere.


  If you route retrieval on verbalized confidence, logit margins plus
  rationale contradiction are a cheap replacement.
