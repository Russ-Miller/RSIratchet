brief: >-
  Token-level verdict probabilities combined with the stability of rationales
  generated under opposing assumptions give a better-calibrated factual
  confidence signal than an LLM's self-reported verbal confidence, and routing
  retrieval on that signal improves fact-checking.


  Probabilistic Certainty and Consistency (PCC) scores a claim on internal
  certainty (log-probability margin between True/False verdict tokens) and
  reasoning consistency (1 minus NLI contradiction between rationales written
  assuming the claim is true vs false), then partitions claims into 4
  quadrants mapped to direct answering, contradiction-driven targeted search,
  reflection-guided retrieval, or deep search. Tested on SciFact, HoVer and
  FeLMWk with GPT-4o, GPT-4o-mini, GPT-4.1, GPT-3.5-turbo,
  Gemini-2.5-Pro/Flash and Mistral-7B-Instruct.


  ECE drops from 23.53 to 12.91 on SciFact (Gemini-2.5-Pro) and 39.37 to 20.76
  on HoVer (GPT-4o-mini). Against FIRE, the closest baseline, False-label F1
  on HoVER rises 0.66 to 0.76 with GPT-4o; with GPT-3.5-turbo on FeLMWk it
  goes 0.23 to 0.66.


  Evidence is measured, and the RQ3 comparison holds the search module fixed
  so only the confidence signal varies, which isolates the cause. Quadrant
  ablations show targeted search wins only in the
  high-certainty/low-consistency region (0.58 to 0.66 on SciFact) while deep
  search wins in the opposite quadrant. No retrieval-cost or token-budget
  numbers are reported despite efficiency being a stated motivation,
  thresholds were set empirically on the same distributions, and Mistral's
  SciFact False score fell 0.57 to 0.53. Requires logprob access, so closed
  verdict-only APIs are out.


  If you route retrieval on verbalized confidence, logprob margins plus
  counterfactual rationale consistency are the cheaper substitute to try.
