brief: >-
  An LLM's self-reported verbal confidence is a worse router for "should I
  retrieve evidence?" than token-level log-probability margins combined with
  the stability of its rationales under opposing assumptions. The paper's PCC
  framework computes internal certainty from the probability gap between True
  and False verdict tokens, and reasoning consistency as 1 minus the NLI
  contradiction score between rationales generated assuming the claim is true
  vs false, then routes claims into 4 quadrants: direct answer, targeted
  search, reflection-guided search, or deep search.


  Evaluation covers SciFact, FeLMWk and HoVER with GPT-4o, GPT-4o-mini,
  Gemini-2.5-Pro, Gemini-2.5-Flash, Mistral-7B-Instruct, GPT-4.1 and
  GPT-3.5-turbo, against Factool, FactCheck-GPT, SAFE and FIRE.


  Calibration improves: ECE drops from 23.53 to 12.91 on SciFact with
  Gemini-2.5-Pro, 39.37 to 20.76 on HoVer with GPT-4o-mini, 34.41 to 23.95 on
  FeLMWk. On HoVER with GPT-4o, F1 on False claims rises from 0.66 (FIRE) to
  0.76. The weakest model gains most: GPT-3.5-turbo on FeLMWk goes from 0.23
  to 0.66 on False claims, near GPT-4.1's 0.68.


  The retrieval-mode comparison is isolated: PCC uses FIRE's search module,
  varying only the confidence signal, and a quadrant-wise ablation shows
  targeted search wins only in the high-certainty/low-consistency region (0.58
  to 0.66 on SciFact) while deep search wins in the opposite quadrant.


  Gains are small on some cells and sometimes negative (SciFact False drops
  0.57 to 0.53 on Mistral-7B). No retrieval-call counts are reported despite
  the efficiency claim, thresholds are tuned empirically, and only short-claim
  fact-checking is tested.


  If you route retrieval on verbalized confidence, logit margins plus
  contradiction scores are a cheap substitute worth trying.
