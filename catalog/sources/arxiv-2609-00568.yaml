summary: Code generation aims to automatically generate source code from task
  requirements and has attracted significant attention with the rapid
  advancement of large language models (LLMs). Despite remarkable progress,
  LLMs often struggle to generate correct code for complex software
  engineering tasks because task descriptions are frequently incomplete,
  ambiguous, or lack critical contextual information. Existing approaches
  primarily improve the capabilities of coding agents through more
  sophisticated tools, skills, and workflows, while largely overlooking the
  quality of the task requirements themselv
