brief: >-
  Out-of-distribution failures in vision-language-action policies can be
  largely fixed at the input layer, without touching policy weights, by
  editing what the frozen model sees and reads. RoboHarness wraps a frozen VLA
  with a dual-memory retrieval bank holding both successes and failures, a
  Qwen3-VL-32B orchestrator that diagnoses the failure cause, and 5 Model
  Context Protocol tools that overlay masks on targets, inpaint out
  distractors, rewrite instructions, split long horizons, and roll back
  stalled execution.


  Tested on 25 tasks across π0, π0.5 and SmolVLA, on LIBERO-PRO and a custom
  LIBERO-RoboHarness suite covering visual ambiguity, clutter, noisy prompts,
  execution fragility and task chaining, with 199 randomized rollouts per
  task.


  Average absolute success gain was 56.6%, with 89.1% on long-horizon
  chaining. On LIBERO-PRO the π0.5 baseline sits near floor, 2.33% under
  position shifts and 0.86% under semantic shifts, rising to 57.2% and 55.2%.
  Memory ablation: no memory needs 7.40 reasoning turns on average,
  success-only 1.47, dual 1.07; on a clutter variant success goes 19.20% to
  48.80% to 60.10% as retrieval richness increases.


  Evidence is measured, with memory ablations and latency accounting, but
  gains are computed against unaided frozen baselines at near-zero success
  rather than any fine-tuned or equally-prompted comparison, orchestration is
  1 model, reasoning depth is scored by that same model, and nothing was run
  on real hardware.


  If you treat VLA brittleness as a motor-control problem, this argues the
  bottleneck is perceptual and contextual instead.
