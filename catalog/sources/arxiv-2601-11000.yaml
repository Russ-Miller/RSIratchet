summary: >-
  Personalized large language models (LLMs) adapt model behavior to
  individual users to enhance user satisfaction, yet personalization can
  inadvertently distort factual reasoning. We show that when personalized
  LLMs face factual queries, there exists a phenomenon where the model
  generates answers aligned with a user's prior history rather than the
  objective truth, resulting in personalization-induced hallucinations that
  degrade factual reliability and may propagate incorrect beliefs, due to
  representational entanglement between personalization and factual
  representations. To address this issue,
