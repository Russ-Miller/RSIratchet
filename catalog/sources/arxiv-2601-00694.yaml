brief: >-
  A fine-tuned 7B language model with visual and domain-knowledge inputs
  transfers to unseen traffic sites far better than statistical or supervised
  models trained on the same task, where the usual failure mode is
  site-specific overfitting.


  PedX-LLM extracts visual features of the built environment with LLaVA,
  combines them with tabular/textual pedestrian data and transportation domain
  knowledge, and fine-tunes LLaMA-2-7B with LoRA to infer crossing decisions.
  Generalization is tested by site-based partitioning across held-out
  locations.


  In-distribution, it reaches 82.0% balanced accuracy, above the best
  statistical and supervised baselines. The vision module accounts for 2.9% of
  the gain and domain knowledge for a further 4.1%. On 5 unseen sites, the
  zero-shot configuration reaches 66.9% balanced accuracy, at least 18
  percentage points above data-driven baselines; adding 5 validation examples
  as few-shot context raises it to 72.2%.


  The component contributions are isolated by ablation, and cross-site
  partitioning is the right design for the generalization claim. But it is 1
  model family, 1 backbone size, and the baselines are not matched on compute
  or on access to visual input, so part of the margin may come from the extra
  modality rather than from reasoning.


  Unclear whether the effect survives other behavioral domains or larger
  supervised baselines with vision. Useful if you are weighing LLM fine-tuning
  against tabular models for transfer to new sites.
