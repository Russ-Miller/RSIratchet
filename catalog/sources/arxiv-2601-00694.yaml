brief: >-
  Fine-tuning a 7B language model on textual, visual, and domain-knowledge
  inputs transfers to pedestrian crossing sites it never saw, where
  conventional supervised models collapse.


  PedX-LLM pairs LLaVA-extracted visual features of the built environment with
  textual trajectory/context data and transportation domain knowledge, then
  fine-tunes LLaMA-2-7B with LoRA to infer whether a pedestrian crosses.
  Comparison is against statistical models and supervised learning baselines,
  with cross-site validation using site-based partitioning.


  In-distribution, PedX-LLM reaches 82.0% balanced accuracy, above the best
  statistical and supervised methods. On 5 unseen test sites, the zero-shot
  configuration gets 66.9% balanced accuracy, at least 18 percentage points
  above the data-driven baselines; adding 5 validation examples as few-shot
  context raises this to 72.2%.


  The component contributions are measured by ablation: the vision module adds
  2.9% and domain knowledge a further 4.1%, which isolates each input stream.
  The generalization claim rests on held-out site partitioning rather than a
  separate dataset, and only 1 backbone model family is tested.


  No result is reported for other foundation models, other cities or
  countries, or against a vision-language baseline without fine-tuning.


  If you build behavioral models for new sites with little local data, the
  few-shot transfer numbers are the part to check.
