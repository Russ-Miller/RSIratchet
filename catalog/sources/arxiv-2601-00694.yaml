brief: >-
  Fine-tuning a general LLM with visual features and transportation domain
  knowledge transfers to unseen road sites far better than statistical or
  supervised models trained on the same behavioral data.


  PedX-LLM extracts visual descriptions of the built environment with LLaVA,
  combines them with textual crossing data and domain knowledge, and
  fine-tunes LLaMA-2-7B using LoRA to infer whether a pedestrian crosses. It
  is compared against statistical models and supervised learning baselines,
  with cross-site validation using site-based partitioning.


  In-distribution, PedX-LLM reaches 82.0% balanced accuracy, above the best
  statistical and supervised baselines. The vision module accounts for 2.9% of
  the gain and domain knowledge a further 4.1%. On 5 unseen test sites, the
  zero-shot configuration reaches 66.9% balanced accuracy, at least 18
  percentage points above the data-driven baselines; adding 5 validation
  examples as few-shot context raises this to 72.2%.


  The component contributions are measured by ablation, and the transfer claim
  rests on a held-out-site split rather than a random split, which isolates
  site generalization. Reported figures are balanced accuracy only; no
  calibration, no token-budget-matched prompting baseline, and 1 base model
  family.


  Scope is 1 task and a limited set of sites, so the margin over supervised
  methods on denser or different geographies is untested.


  If you assume domain-tuned tabular models beat LLMs on structured behavioral
  prediction, the cross-site numbers are the part to check.
