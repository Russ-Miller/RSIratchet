brief: >-
  A fine-tuned LLM with visual and domain-knowledge inputs transfers to unseen
  intersections far better than statistical or supervised models trained on
  the same data, which is where those baselines usually collapse.


  PedX-LLM extracts visual features of the built environment with LLaVA,
  combines them with textual trajectory data and transportation domain
  knowledge, and fine-tunes LLaMA-2-7B with LoRA to infer whether a pedestrian
  crosses.


  On the main task it reaches 82.0% balanced accuracy, above the best
  statistical and supervised baselines. Ablations attribute 2.9% to the vision
  module and a further 4.1% to domain knowledge. Under site-based
  partitioning, zero-shot PedX-LLM gets 66.9% balanced accuracy on 5 unseen
  test sites, at least 18 percentage points above data-driven baselines; 5
  few-shot validation examples raise it to 72.2%.


  The effect is measured, with component ablations isolating the vision and
  knowledge contributions and cross-site splits isolating generalization. Only
  1 model family and 1 adaptation method are tested, and the paper as given
  reports no variance across runs or splits.


  The absolute cross-site number stays below 73%, so this is a
  relative-transfer result, not a deployable accuracy claim, and it is
  untested outside this pedestrian dataset.


  If you work on behavioral models that break on new sites, this is evidence
  that semantic reasoning plus visual context buys transfer that curve-fitting
  does not.
