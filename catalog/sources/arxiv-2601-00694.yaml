brief: >-
  Fine-tuning a general LLM with visual and domain-knowledge context transfers
  to unseen traffic sites far better than statistical or supervised models
  trained on the same behavioral data.


  PedX-LLM pairs LLaVA-extracted visual features of the built environment with
  textual trajectory data and transportation domain knowledge, then fine-tunes
  LLaMA-2-7B with LoRA to infer whether a pedestrian crosses. Comparison is
  against statistical models and supervised learning baselines, with
  cross-site validation using site-based partitioning across 5 held-out sites.


  On the in-distribution task PedX-LLM reaches 82.0% balanced accuracy, above
  the best statistical and supervised methods. Ablations attribute 2.9% to the
  vision module and a further 4.1% to domain knowledge. Zero-shot on 5 unseen
  sites it reaches 66.9% balanced accuracy, at least 18 percentage points
  above the data-driven baselines; 5 few-shot validation examples raise it to
  72.2%.


  The effect is measured, and the 2 component ablations isolate the
  contributions of vision and knowledge separately. Only 1 base model is used,
  and the source reports no matched-compute baseline or comparison against an
  untuned LLM prompted with the same context.


  The cross-site numbers come from 5 sites in one dataset, so transfer across
  cities, countries, or camera setups is untested.


  If you work on behavioral prediction with small site-specific datasets, this
  is evidence that semantic context beats pattern fitting when the test site
  changes.
