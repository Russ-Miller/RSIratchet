brief: >-
  A fine-tuned 7B language model with visual and domain-knowledge inputs
  transfers to unseen pedestrian crossing sites far better than statistical or
  supervised baselines, which is where those baselines typically fail.


  PedX-LLM combines LLaVA-extracted visual features of the built environment
  with textual crossing data and transportation domain knowledge, then
  fine-tunes LLaMA-2-7B with LoRA to infer whether a pedestrian crosses.
  Evaluation uses in-distribution testing plus cross-site validation with
  site-based partitioning across 5 held-out sites.


  In-distribution balanced accuracy is 82.0%, above the best statistical and
  supervised learning methods. Ablations attribute 2.9% to the vision module
  and a further 4.1% to domain knowledge. Zero-shot on the 5 unseen sites,
  balanced accuracy is 66.9%, at least 18 percentage points above the
  data-driven baselines; adding 5 validation examples as few-shot context
  raises it to 72.2%.


  The component contributions are measured by ablation rather than argued, and
  the cross-site split isolates generalization from memorized site patterns.
  What is not reported here is any matched-capacity baseline, a comparison
  against other LLM backbones, or whether the gains survive outside this 1
  model family.


  The transfer gap is the result worth taking: on new sites, semantic
  reasoning over scene and domain context beats numerical pattern fitting by a
  wide margin.
