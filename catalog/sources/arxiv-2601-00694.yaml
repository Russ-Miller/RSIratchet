brief: >-
  Fine-tuning a general LLM with visual and domain-knowledge inputs transfers
  to unseen traffic sites far better than statistical or supervised models
  trained on the same behavioral data.


  PedX-LLM combines LLaVA-extracted visual features of the built environment
  with textual trip data and transportation domain knowledge, then fine-tunes
  LLaMA-2-7B via LoRA to infer whether a pedestrian crosses. Evaluation uses
  in-sample accuracy plus cross-site validation with site-based partitioning
  on 5 held-out sites.


  In-sample balanced accuracy is 82.0%, above the best statistical and
  supervised baselines. The vision module accounts for 2.9% of the gain and
  domain knowledge a further 4.1%. On the 5 unseen sites, zero-shot PedX-LLM
  reaches 66.9% balanced accuracy, at least 18 percentage points above
  data-driven baselines; adding 5 validation examples as few-shot context
  raises this to 72.2%.


  The component contributions are measured by ablation, and the cross-site
  split isolates generalization rather than fit. Baselines are the
  conventional methods, not other LLMs or other fine-tuning budgets, so the
  result does not separate scale, pretraining, or adaptation method.


  Only 1 model family and 1 behavior task; 5 test sites is a small transfer
  set, and absolute zero-shot accuracy stays near 2/3.


  If you work on behavioral transportation models, this is evidence that
  semantic priors carry across sites where fitted coefficients do not.
