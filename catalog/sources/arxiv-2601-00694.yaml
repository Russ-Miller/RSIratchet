brief: >-
  A fine-tuned LLM with visual and domain-knowledge inputs transfers to unseen
  pedestrian crossing sites far better than statistical or supervised models
  trained on the same data, which collapse off-site.


  PedX-LLM combines LLaVA-extracted visual features of the built environment
  with textual trajectory data and transportation domain knowledge, then
  fine-tunes LLaMA-2-7B with LoRA to infer whether a pedestrian crosses.
  Comparison is against statistical models and supervised learning baselines,
  with cross-site validation using site-based partitioning on 5 held-out
  sites.


  In-distribution, PedX-LLM reaches 82.0% balanced accuracy. The vision module
  accounts for 2.9% of that and domain knowledge a further 4.1%. On the 5
  unseen sites, zero-shot PedX-LLM gets 66.9% balanced accuracy, at least 18
  percentage points above the data-driven baselines; adding 5 few-shot
  validation examples raises it to 72.2%.


  The effect is measured, and the two enhancement components are separated by
  ablation, so the vision and knowledge contributions are attributed. The
  abstract gives no dataset size, no site counts for training, and no variance
  across runs or sites.


  Only 1 base model and 1 adapter method were tested, and generalization
  evidence rests on 5 test sites in one data collection. Treat this as
  evidence that semantic priors beat numerical fitting under distribution
  shift, not that absolute accuracy is deployment-ready.
