brief: >-
  Fine-tuning a general LLM on pedestrian data transfers to new intersections
  better than statistical or supervised models trained on the same task, which
  mostly fail off-site.


  PedX-LLM pairs visual features extracted by LLaVA with tabular/textual
  pedestrian data and hand-supplied transportation domain knowledge, then
  fine-tunes LLaMA-2-7B with LoRA to infer whether a pedestrian crosses.
  Evaluation is balanced accuracy, with cross-site validation using site-based
  partitioning on 5 held-out sites.


  On the in-distribution task PedX-LLM reaches 82.0% balanced accuracy, above
  the best statistical and supervised baselines. The vision module accounts
  for 2.9% of the gain and domain knowledge for a further 4.1%. Zero-shot on 5
  unseen sites it gets 66.9%, at least 18 percentage points above data-driven
  baselines; adding 5 validation examples as few-shot context raises it to
  72.2%.


  The two component contributions are measured by ablation, and the transfer
  claim rests on site-based splits rather than random splits, which is the
  right comparison. Only 1 backbone and 1 vision encoder were tested, and no
  matched-capacity baseline is reported, so backbone scale and pretraining
  cannot be separated from the proposed additions.


  The unseen-site evidence covers 5 sites in one dataset; absolute accuracy
  there remains far below in-distribution.


  If you work on behavior models that break on new sites, this is a concrete
  data point that LLM priors help transfer.
