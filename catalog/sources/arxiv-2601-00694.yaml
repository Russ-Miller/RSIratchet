brief: >-
  A fine-tuned 7B language model with visual and domain-knowledge inputs
  transfers to unseen intersections far better than statistical or supervised
  models trained on the same task, which mostly fail off-site.


  PedX-LLM extracts visual features of the built environment with LLaVA,
  combines them with textual data and transportation domain knowledge, and
  fine-tunes LLaMA-2-7B with LoRA to infer whether a pedestrian crosses.
  Evaluation is balanced accuracy, with cross-site validation using site-based
  partitioning across 5 held-out sites.


  In-distribution, the model reaches 82.0% balanced accuracy, above the best
  statistical and supervised baselines. Zero-shot on 5 unseen sites it reaches
  66.9%, at least 18 percentage points above the data-driven baselines; adding
  5 validation examples as few-shot context raises this to 72.2%.


  The component contributions were measured by ablation: the vision module
  adds 2.9% and domain knowledge a further 4.1%. The generalization claim
  rests on site-based splits rather than random splits, which is the right
  design, but it is 1 model family, 1 fine-tuning method, and no
  matched-capacity baseline is described.


  Unclear how much of the gain comes from LLM pretraining versus the extra
  visual and knowledge inputs, and whether this holds on other behavioral
  prediction tasks or larger backbones.


  If you work on transferring behavior models across sites, this is evidence
  that semantic inputs beat numerical fitting.
