brief: >-
  Fine-tuning a general LLM with visual and domain-knowledge context transfers
  to unseen traffic sites far better than statistical or supervised models
  trained on the same behavioral data, which collapse off-site.


  PedX-LLM pairs LLaVA-extracted visual features of the built environment with
  textual trip data and transportation domain knowledge, then fine-tunes
  LLaMA-2-7B with LoRA to infer whether a pedestrian crosses. Evaluation is
  balanced accuracy, with cross-site validation using site-based partitioning
  across 5 held-out sites.


  On the main task PedX-LLM reaches 82.0% balanced accuracy, above the best
  statistical and supervised baselines. Ablations attribute 2.9% to the vision
  module and a further 4.1% to domain knowledge. In the zero-shot cross-site
  setting it gets 66.9% on 5 unseen sites, at least 18 percentage points above
  data-driven baselines; adding 5 validation examples as few-shot context
  raises this to 72.2%.


  The component effects are measured through ablation, and the site-based
  split isolates generalization rather than in-distribution fit. Weaknesses: 1
  model family, 1 backbone size, no matched-compute baseline, and the
  unseen-site evaluation covers only 5 sites.


  Nothing here tests other regions, other behavior types, or whether a larger
  non-fine-tuned model would close the gap.


  If you work on behavioral transfer across sites, this is evidence that
  semantic context beats numeric pattern fitting.
