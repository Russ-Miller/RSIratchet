brief: >-
  Fine-tuning a general LLM with visual and domain-knowledge context transfers
  to unseen pedestrian crossing sites far better than statistical or
  supervised models trained on the same data.


  PedX-LLM combines LLaVA-extracted visual features of the built environment
  with textual trip data and transportation domain knowledge, then fine-tunes
  LLaMA-2-7B with LoRA to infer whether a pedestrian crosses. Evaluation uses
  in-sample balanced accuracy plus cross-site validation with site-based
  partitioning on 5 held-out sites.


  In-sample balanced accuracy is 82.0%, above the best statistical and
  supervised baselines. The vision module adds 2.9% and domain knowledge a
  further 4.1%. On the 5 unseen sites, zero-shot PedX-LLM reaches 66.9%
  balanced accuracy, at least 18 percentage points above data-driven
  baselines; adding 5 few-shot validation examples raises it to 72.2%.


  The component contributions are measured through ablations of the vision and
  knowledge modules, and the generalization claim rests on site-based
  partitioning rather than random splits, which is the right comparison for
  transfer. Only 1 model family and 1 base model size are tested, and the
  cross-site evidence comes from 5 sites.


  Unclear whether gains come from the LLM's prior or from the added visual and
  knowledge channels alone; no equal-capacity non-LLM baseline using the same
  features is reported.


  If you work on behavioral transfer across sites, this is a concrete case
  where semantic context beats numerical pattern fitting.
