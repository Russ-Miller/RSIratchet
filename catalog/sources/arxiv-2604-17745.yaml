brief: >-
  Adding supervisory manager agents that inspect intermediate artefacts and
  re-invoke sub-agents beats fixed sequential pipelines for reproducing papers
  as code, and the widely used reference-free judge for this task is badly
  broken.


  HiRAS decomposes reproduction into planning sub-phases, analysis, coding,
  and an added execution phase, with a planning manager and a global manager
  able to re-invoke subordinates. It is evaluated on PaperBench (20 ICML 2024
  papers) and Paper2Code (90 papers) against PaperCoder and AutoReproduce,
  with Qwen3-Coder-480B, DeepSeek-v3.1-Terminus, and Claude-Sonnet backbones.


  On PaperBench-CodeDev with o3-mini-high as judge, HiRAS scores 64.1 on
  Claude-Sonnet and 57.4 on DeepSeek-v3.1, above PaperCoder's 51.1 with
  proprietary backbones. On Paper2Code's original reference-free metric, an
  empty repository scores 3.89 and a config-only repository 4.67, above all
  model-generated codebases; the proposed P2C-Ex prompt raises correlation
  with reference-based scores from 0.423 to 0.862, and correlation with 3
  human experts from 0.50 to 0.72 (inter-annotator 0.82).


  Baselines were re-run on matched backbones and an ablation separates
  specialised agents, intra-agent refinement, and hierarchical management,
  with supervision alone worth roughly 10%. Token and time cost is not matched
  across methods, and o3-mini judging was not run on all settings.


  Execution, not code generation, is the bottleneck: only 3 of 110 runs failed
  at code generation, while scores fall from ~45% on CodeDev to ~20% on full
  PaperBench.


  Treat published reference-free paper-to-code scores as unreliable unless
  repository structure is in the judge prompt.
