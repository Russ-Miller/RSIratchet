brief: >-
  Multi-agent scaffolding amplifies reasoning a model already has and does
  nothing for models that lack it. On synthetic multi-hop tasks, LLaMA-3 8B
  gained 46.7 percentage points from a 3-agent pipeline (p < 0.001) and
  Mixtral 8x7B gained 13.3pp (p = 0.014), while LLaMA-2 13B and DeepSeek-V2
  16B showed no benefit.


  The setup is a synthetic contextual-inference framework: documents about
  fictional entities, targets requiring 2-4 hops, 120 trials (30 per model
  across 4 models), 15 structured and 15 contextual trials each, 50 candidate
  guesses and 3 refinement rounds per trial. Agents are Analyst, Strategist,
  Generator in a LangGraph loop.


  Rule-based extraction hits 100% on structured tasks and 6.7% on contextual;
  multi-agent LLMs invert this, reaching 80% contextual for LLaMA-3 8B.
  Multi-agent coordination hurt Mixtral on structured tasks (20% vs 86.7%).
  Entity extraction stayed above 80% for all models, locating the bottleneck
  in combining facts, not retrieving them. Single-agent LLaMA-3 fell from 80%
  at 2 hops to 0% at 4; multi-agent held 60-100%.


  Evidence is thin: 15 trials per condition, Fisher's exact test, authors call
  p-values indicative. The ~50B threshold comes from a sigmoid fit using 1
  literature-reported 70B point outside their data. 4 models, 1 synthetic task
  family, no prompt optimization, no 30-70B models.


  Treat multi-agent as an amplifier, not a fix for weak base models.
