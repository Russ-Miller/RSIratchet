brief: >-
  Multi-agent scaffolding amplifies reasoning a model already has rather than
  supplying it: the same 3-agent pipeline that lifts a strong model gives weak
  models nothing, and can hurt on tasks that need no reasoning.


  The setup is a synthetic multi-hop inference framework (documents plus a
  target string that must be assembled from facts never co-located), 120
  trials, 30 per model across LLaMA-3 8B, LLaMA-2 13B, Mixtral 8x7B and
  DeepSeek-V2 16B, with 15 structured and 15 contextual tasks each, 50 guesses
  per trial, and an Analyst/Strategist/Generator LangGraph loop compared
  against single-agent chain-of-thought and a pattern-matching rule baseline.


  Rule-based scores 100% on structured tasks and 6.7% on contextual ones;
  multi-agent LLaMA-3 8B reaches 80.0 on contextual, up 46.7 percentage points
  over single-agent (p < 0.001), Mixtral gains 13.3pp (p = 0.014), and the
  weaker models gain nothing. Mixtral's multi-agent structured score falls to
  20.0 from 86.7. Entity extraction stays above 80% for all models, so the
  bottleneck is combination, not retrieval.


  Effects are measured, with Fisher's exact tests and a matched single-agent
  comparison, but only 15 trials per cell, 4 models, 1 synthetic task family,
  no prompt optimisation, and no token-budget-matched baseline for the extra
  agent calls. The ~50B threshold is an extrapolation anchored on 1 literature
  point, not data.


  Treat multi-agent scaffolding as a capability multiplier to be tested on
  your base model, not a fix for weak ones.
