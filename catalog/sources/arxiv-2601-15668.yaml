brief: >-
  Speech LLMs barely perceive prosody, and fixing that before RL is what makes
  emotion reasoning work. Qwen2.5-Omni-7B scores 25.71% on pitch, 29.94% on
  speed, 27.67% on energy, 25.83% on intonation and 30.24% on stress over
  1,000 held-out utterances; prosody-centric SFT on ~500 hours lifts those to
  75.11/68.70/69.42/60.25/71.50.


  EmotionThinker builds on that base with EmotionCoT-35K (35,000
  speech-reasoning pairs, ~200 hours, GPT-4o-written chains conditioned on
  extracted prosodic features), then GRPO with a trained reasoning reward
  model (Qwen2.5-Omni-3B, 101,400 tuples) gated by a trustworthiness weight
  and introduced progressively.


  Average emotion accuracy across IEMOCAP, MELD, RAVDESS and SAVEE reaches
  68.89%, against 65.41% for BLSP-Emo and 50.83% for the backbone. GPT-rated
  reasoning averages 3.98/5 versus 3.04 for the best baseline.


  Ablations isolate each piece: SFT alone 53.91%, plain GRPO 62.91%, untrained
  reward model 66.67%, no trust weight 67.71% (reasoning 3.74), no progressive
  schedule 62.80%. K from 4 to 16 moves the average only 67.06-67.66. Human
  rating used 100 outputs, 20 per model, 4 reviewers.


  Reasoning quality is scored mainly by GPT-4o-style judges on the authors'
  own rubric, with one 7B backbone and 9 emotion categories; generalisation to
  other languages or spontaneous speech is untested.


  If you train audio reasoning models, treat perceptual grounding as a
  prerequisite stage rather than something RL will discover.
