brief: >-
  English is not the strongest language for comprehension in multilingual
  LLMs. Several Romance languages, including lower-resource ones,
  systematically outperformed it.


  The setup is a language comprehension task posed to 3 popular models across
  12 languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, with human baselines for comparison.


  Accuracy was high across typologically diverse languages, but all 3 models
  fell short of the human baseline in every language, with the size of the
  shortfall varying by language. The source gives no per-language or per-model
  figures, so the result is reported qualitatively here.


  The effect is measured against a human baseline rather than argued, which is
  the main strength of the design. The proposed explanations - tokenization,
  language distance from Spanish and English, training data size, and whether
  data came from high- or low-resource, WEIRD or non-WEIRD communities - are
  discussed rather than isolated by ablation, so none of them is attributed as
  the cause of the English deficit.


  The finding rests on 1 comprehension task and 3 models; it says nothing
  about generation, reasoning, or languages outside the 12 tested, and 5
  families is thin coverage of the non-WEIRD world.


  If you treat English as the ceiling when choosing a prompt language, that
  assumption needs checking.
