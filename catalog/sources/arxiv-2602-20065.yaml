brief: >-
  English is not the strongest language for multilingual LLM comprehension.
  Across a comprehension task, several Romance languages, including
  lower-resource ones, systematically outperformed English.


  The setup: 3 popular LLMs prompted on a single language comprehension task
  in 12 languages spanning the Indo-European, Afro-Asiatic, Turkic,
  Sino-Tibetan, and Japonic families, compared against human baselines.


  The models were accurate across typologically diverse languages but fell
  short of human baselines in every language tested, with the size of the gap
  varying by language. The paper reports no numeric figures in the text
  available here, so the magnitudes of the English-Romance gap and the
  human-model gaps are described qualitatively only.


  The cross-language ranking is measured; the explanations for it are argued,
  not tested. Tokenization, distance from Spanish and English, training data
  size, and high- vs low-resource and WEIRD vs non-WEIRD data origin are
  discussed as drivers rather than isolated by ablation, so no single factor
  is attributed the effect.


  Boundary: 1 comprehension task, 3 models, 12 languages. Generation,
  reasoning, and longer-form tasks were not tested, and families outside the 5
  listed are absent.


  If you assume English is the safe default language for prompting, that
  assumption needs checking against your own task.
