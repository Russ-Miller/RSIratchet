brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages, including lower-resource
  ones, systematically outperformed English in 3 popular models.


  The setup prompts 3 models on a single language comprehension task across 12
  languages drawn from the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, with human baselines for comparison.


  Accuracy was high across typologically diverse languages, but every model
  fell short of the human baseline in every language, with the gap varying by
  language. The source reports no numeric accuracy figures, so the magnitudes
  of these gaps cannot be stated here.


  The cross-language comparison is measured against human baselines; the
  explanations offered for the ranking, tokenization, language distance from
  Spanish and English, training data size, and whether data comes from high-
  or low-resource and WEIRD or non-WEIRD communities, are discussed rather
  than isolated by ablation. No controlled manipulation attributes the English
  deficit to any one of these factors.


  The evidence covers 1 comprehension task and 12 languages; generation,
  reasoning, and longer-form tasks were not tested, and 3 models is a thin
  base for claims about model families generally.


  If you default to English prompts on the assumption they are strongest, that
  assumption is worth testing on your own task.
