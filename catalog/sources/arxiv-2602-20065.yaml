brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages systematically outperformed
  English, including lower-resource ones.


  The setup: 3 popular LLMs prompted on a single language comprehension task
  in 12 languages spanning the Indo-European, Afro-Asiatic, Turkic,
  Sino-Tibetan, and Japonic families, with human baselines for comparison.


  The reported results are qualitative in the source. Models scored high
  across typologically diverse languages but fell short of human baselines in
  every language, with the size of the gap varying by language. The
  English-versus-Romance ordering is described as systematic but no accuracy
  figures are given here.


  Evidence is measured against human baselines rather than argued, and the
  cross-linguistic comparison is held on 1 task. Explanatory factors such as
  tokenization, distance from Spanish and English, training data size, and
  high- versus low-resource or WEIRD versus non-WEIRD data origin are
  discussed, not isolated by ablation, so the cause of the English deficit is
  not attributed.


  Boundaries: 3 models, 12 languages, 1 comprehension task, no generation or
  reasoning tasks, and no reported per-language numbers in the abstract.


  If you default to English prompts on the assumption they are strongest, that
  assumption deserves testing on your own task.
