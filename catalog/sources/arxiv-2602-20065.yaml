brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages, including lower-resource
  ones, systematically outperformed English in 3 popular models.


  The setup prompts 3 models on one language comprehension task in 12
  languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, with human baselines for comparison.


  Accuracy was high across typologically diverse languages, but all models
  fell short of the human baseline in every language, with the size of the gap
  varying by language. The source reports no per-language numbers, so the
  result is stated qualitatively.


  The English-vs-Romance comparison is measured against a human baseline per
  language, which is stronger than a raw accuracy ranking. The explanatory
  factors offered, tokenization, distance from Spanish and English, training
  data size, and high- vs low-resource and WEIRD vs non-WEIRD data origin, are
  discussed rather than tested by ablation, so no cause is isolated.


  The evidence covers 1 task type and 12 languages, 3 models, and does not
  address generation, reasoning, or languages outside the 5 families sampled.


  Treat "English first, everything else degrades" as an assumption worth
  checking in your own evaluation rather than a default.
