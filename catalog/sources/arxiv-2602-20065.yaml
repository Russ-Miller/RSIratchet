summary: >-
  Large Language Models (LLMs) play a critical role in how humans access
  information. While their core functionality relies on the ability to
  comprehend written requests, our understanding of this ability is
  currently constrained, because most benchmarks evaluate LLMs in
  high-resource languages that are predominantly spoken by Western,
  Educated, Industrialized, Rich, and Democratic (WEIRD) communities. The
  default assumption is that English is the best-performing language for
  LLMs, while smaller, low-resource languages are linked to less natural or
  reliable outputs, even in multilingual, state
