brief: >-
  English is not the best-performing language for comprehension in
  multilingual LLMs. Several Romance languages, including lower-resource ones,
  systematically outperformed it.


  3 popular models were prompted on a language comprehension task across 12
  languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, with human baselines for comparison.


  Accuracy held up across typologically diverse languages, but every model
  fell short of the human baseline in every language, with the size of the gap
  varying by language. The source text reports no per-language figures, so the
  magnitudes cannot be given here.


  The effect on relative language ranking was measured; the explanations
  offered for it were not. Tokenization, distance from Spanish and English,
  training data size, and high- vs. low-resource and WEIRD vs. non-WEIRD data
  origin are discussed as drivers rather than isolated experimentally, so no
  single factor is attributed. 3 models and 1 comprehension task limit how far
  the ranking generalises.


  It is unclear whether the Romance advantage survives on generation,
  reasoning, or long-context tasks, or across more model families and more
  low-resource languages outside the 5 families tested.


  If you assume English prompts give the most reliable comprehension, that
  assumption needs checking against your own task.
