brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages, including lower-resource
  ones, systematically outperformed English in 3 popular models.


  The setup: 3 models prompted on a single language comprehension task in 12
  languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, compared against human baselines in each language.


  Accuracy was high across typologically diverse languages, but every model
  fell short of the human baseline in all 12 languages, with the size of the
  gap varying by language. The source reports no per-language or per-model
  numbers.


  The English-versus-Romance gap is measured, not argued, but the explanatory
  factors the authors raise, tokenization, language distance from Spanish and
  English, training data size, and high- versus low-resource and WEIRD versus
  non-WEIRD data origin, are discussed rather than isolated by ablation. 3
  models and 1 task type mean the design cannot separate model-specific
  behaviour from a general property of multilingual LLMs.


  Boundary: 1 comprehension task, no generation or reasoning tasks, no
  coverage of the many families outside the 5 sampled.


  If you default to English prompts assuming they are strongest, that
  assumption is worth testing on your own task.
