brief: >-
  English is not the strongest language for comprehension in multilingual
  LLMs. Several Romance languages, including lower-resource ones,
  systematically outperformed it.


  The setup: 3 popular LLMs prompted on a language comprehension task across
  12 languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, with human baselines for comparison.


  Across the typologically diverse set, the models show high linguistic
  accuracy, but fall short of the human baseline in every language, by varying
  margins. The source reports no per-language accuracy figures, so the size of
  the English-vs-Romance gap cannot be quantified here.


  The effect is measured against human performance on the same task, which is
  the right comparison, but the explanatory factors the authors raise,
  tokenization, language distance from Spanish and English, training data
  size, and WEIRD vs. non-WEIRD data origin, are discussed rather than
  isolated by ablation. 3 models and 1 task type is a narrow base for a claim
  about comprehension generally.


  Boundaries: 1 comprehension task, no reasoning or generation evaluation, no
  open-weight ablation on tokenizer or training mix, and 12 languages out of
  thousands.


  If you treat English as the default ceiling when choosing a prompt language,
  that assumption needs checking on your own task.
