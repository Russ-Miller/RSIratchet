brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages systematically outperformed
  English, including lower-resource ones.


  The setup: 3 popular models prompted on 1 language comprehension task across
  12 languages drawn from the Indo-European, Afro-Asiatic, Turkic,
  Sino-Tibetan, and Japonic families, compared against human baselines.


  The models held up across typologically diverse languages but fell short of
  human baselines in all 12, with the gap varying by language. The source
  reports no accuracy figures, so the size of the English-Romance gap and the
  human shortfall cannot be quantified here.


  The cross-language comparison is measured; the explanations are argued
  rather than tested. Tokenization, language distance from Spanish and
  English, training data size, and high- vs. low-resource and WEIRD vs.
  non-WEIRD data origin are discussed as drivers, but no ablation isolates any
  of them. 3 models and 1 task type is a narrow base.


  Boundary: 1 comprehension task, no generation or reasoning tasks, and 12
  languages out of 5 families leaves most low-resource languages untested.


  If you default to English prompts on the assumption that it is the strongest
  language, that assumption is worth checking against your own task.
