brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages, including lower-resource
  ones, systematically outperformed English in 3 popular models.


  The setup: 3 models prompted on one language comprehension task in 12
  languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, compared against human baselines.


  Accuracy was high across typologically diverse languages, but all models
  fell short of the human baseline in every language, with the gap varying by
  language. The source reports no per-language numbers, so the size of the
  English deficit and the Romance advantage cannot be read off here.


  The evidence is a measured cross-language comparison with human baselines,
  which is the right control for task difficulty. The explanations offered --
  tokenization, language distance from Spanish and English, training data
  size, and high- vs. low-resource and WEIRD vs. non-WEIRD data origin -- are
  discussed rather than isolated by ablation, so no causal attribution is
  established.


  Boundaries: 1 comprehension task, 12 languages, 3 models, no manipulation of
  tokenizer or training mix.


  If you assume English is your safest evaluation language, this gives you a
  reason to check that assumption against Romance languages.
