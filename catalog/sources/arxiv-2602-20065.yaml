brief: >-
  English is not the best language for LLM comprehension. Across a language
  comprehension task, several Romance languages, including lower-resource
  ones, systematically outperformed English in 3 popular models.


  The setup: 3 models were prompted on a comprehension task across 12
  languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, with human baselines for comparison.


  Accuracy was high across typologically diverse languages, but every model
  fell short of the human baseline in all 12 languages, with the size of the
  gap varying by language. No per-language accuracy figures are given in the
  available text, so the result is reported here qualitatively.


  The effect is measured against human baselines rather than argued, and the
  cross-family language sample is broader than most comprehension benchmarks.
  The attribution is weaker: factors such as tokenization, language distance
  from Spanish and English, training data size, and high- vs. low-resource and
  WEIRD vs. non-WEIRD data origin are discussed rather than isolated by
  ablation, and the model set is limited to 3.


  The finding covers 1 comprehension task; generation, reasoning, and
  long-form tasks were not tested, and 12 languages cannot settle whether the
  Romance advantage generalises.


  If you assume English prompts are the safest default for comprehension, this
  gives you reason to test Romance alternatives.
