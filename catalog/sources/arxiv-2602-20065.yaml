brief: >-
  English is not the best language for LLM comprehension. Across a
  comprehension task, several Romance languages systematically outperformed
  English, including lower-resource ones, which cuts against the default
  assumption that English leads and low-resource languages trail.


  The setup: 3 popular LLMs prompted on a language comprehension task in 12
  languages spanning the Indo-European, Afro-Asiatic, Turkic, Sino-Tibetan,
  and Japonic families, compared against human baselines.


  The models were accurate across typologically diverse languages but fell
  below human baselines in every language tested, with the size of the gap
  varying by language. The source reports no accuracy figures, so the margins
  between languages and against humans cannot be quantified here.


  The cross-language comparison is measured; the explanatory factors are
  argued rather than tested. Tokenization, distance from Spanish and English,
  training data size, and high- vs low-resource and WEIRD vs non-WEIRD data
  origin are discussed as drivers, not isolated by ablation. 3 models, 1 task
  type.


  Boundaries: a single comprehension task, no coverage of generation,
  reasoning, or long-context work, and 12 languages out of thousands. Whether
  the Romance advantage holds on other task formats is untested.


  If you treat English as the safe default for evaluation or deployment, this
  is reason to check your own task in Romance languages before assuming so.
