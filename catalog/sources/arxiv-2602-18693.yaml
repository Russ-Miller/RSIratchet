brief: >-
  Retrieving evidence for a claim's explicit negation, and pooling evidence
  across several corpora, improves zero-shot claim verification over
  single-source, claim-only retrieval - but the gains are small in absolute
  terms and do not survive when one source already dominates.


  The system generates a negated form of each claim with Mistral, retrieves
  sentences from Wikipedia (~7M articles via Elasticsearch), PubMed (23.6M
  abstracts, dense + BM25), and Google Custom Search, filters and deduplicates
  with SPICED embeddings, then prompts 5 zero-shot LLMs (Llama 3.3 70B, Llama
  3.1 405B, Mistral-Large, Qwen 2.5, Phi-4) on SciFact, PubHealth, Averitec,
  and LIAR.


  Adding the negated claim gave relative gains of about +2-10% accuracy and
  +2-8% F1, e.g. SciFact with Llama 70B+Google 0.550 to 0.607 accuracy and
  0.530 to 0.573 F1. Merging the 3 sources raised Averitec Llama 405B F1 by
  +68.8% over Wikipedia and +29.3% over Google, but on LIAR merging
  underperformed Google alone (0.320 vs 0.415).


  The effect is measured across 4 datasets x 5 models x 3 sources, with
  original-only versus original+negated as the matched comparison, so the
  retrieval change is isolated. There is no fine-tuned or non-LLM baseline, no
  retrieval-budget control, and absolute accuracy stays low (LIAR mostly
  0.2-0.4).


  Per-source label log-probabilities tracked agreement: unanimity gave sharp
  high-confidence peaks, disagreement flatter ones, though magnitudes shift by
  model and need calibration.


  Treat negation-based retrieval as a cheap add-on, not a fix for hard
  political claims.
