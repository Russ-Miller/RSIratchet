summary: >-
  The spread of misinformation across digital platforms can pose significant
  societal risks. Claim verification, a.k.a. fact-checking, systems can help
  identify potential misinformation. However, their efficacy is limited by
  the knowledge sources that they rely on. Most automated claim verification
  systems depend on a single knowledge source and utilize the supporting
  evidence from that source; they ignore the disagreement of their source
  with others. This limits their knowledge coverage and transparency. To
  address these limitations, we present a novel system for open-domain claim
  verification
