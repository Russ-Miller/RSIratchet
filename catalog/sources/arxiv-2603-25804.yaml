brief: >-
  Chart-to-code ability on simple single-panel benchmarks does not transfer to
  complex multi-panel charts built from real data. RealChart2Code holds 2,896
  instances from 1,036 filtered Kaggle datasets (3,271 raw files, ~860 million
  rows), split into Chart Replication (1,016), Chart Reproduction from raw
  data (1,016), and multi-turn Chart Refinement over injected errors (864),
  with Matplotlib ground truth written by 5 expert developers and 50 chart
  types.


  14 VLMs (5 proprietary, 9 open-weight, 7B–241B) were scored by a multi-agent
  judge on 8 visual criteria plus pass rate. Claude-4.5-Opus led with AVG 8.2,
  Gemini-3-Pro-Preview 8.1, GPT-5.1 5.4; the best open models were
  Qwen3-VL-235B at 3.6 and Intern-VL-3.5-241B at 3.4, despite ChartMimic
  scores above 75. Normalized, Gemini-3-Pro-Preview falls from above 91% on
  existing benchmarks to roughly 50%, Qwen3-VL from ~85% to below 25%.


  The judge was validated: Fleiss' κ 0.8239 inter-agent, Cohen's κ 0.83
  against humans on 600 sampled Claude-4.5-Sonnet tasks, results averaged over
  3 runs with greedy decoding. Error attribution is categorical rather than
  controlled: open models fail on syntax and layout, proprietary ones on data
  mapping, and refinement shows "Regressive Editing" where a requested fix
  breaks working code.


  Code is Matplotlib only, and subtle visual artifacts may escape the judge.
  Treat prior chart-to-code scores as near-saturated and uninformative about
  complex layouts.
