summary: Robotic assistance in scientific laboratories requires procedurally
  correct long-horizon manipulation, reliable execution under limited
  supervision, and robustness in low-demonstration regimes. Such conditions
  greatly challenge end-to-end vision-language-action (VLA) models, whose
  assumptions of recoverable errors and data-driven policy learning often
  break down in protocol-sensitive experiments. We propose CAPER, a framework
  for Constrained And ProcEdural Reasoning for robotic scientific experiments,
  which explicitly restricts where learning and reasoning occur in the
  planning and control pip
