summary: "Large Language Model (LLM) agents are susceptible to Indirect Prompt
  Injection (IPI) attacks, where malicious instructions in retrieved content
  hijack the agent's execution. Existing defenses typically rely on strict
  filtering or refusal mechanisms, which suffer from a critical limitation:
  over-refusal, prematurely terminating valid agentic workflows. We propose
  ICON, a probing-to-mitigation framework that neutralizes attacks while
  preserving task continuity. Our key insight is that IPI attacks leave
  distinct over-focusing signatures in the latent space. We introduce a Latent
  Space Trace Probe"
notes: "Filed as a source on prompt-injection from the classifier's judgement
