brief: >-
  Indirect prompt injections leave a measurable signature in attention:
  successful attacks collapse focus onto a few injected tokens, and
  suppressing those attention peaks at inference time blocks the attack while
  letting the agent finish its task instead of refusing.


  ICON computes a Focus Intensity Score (attention entropy per head), trains a
  small CNN+MLP prober on selected layers, then masks the top-τ attention
  weights in flagged heads before softmax. Tested in a ReAct loop on
  Qwen-3-8B, LLaMA-3.1-8B and Mistral-8B against Ignore Instruction, Combined
  Attacks and TrojanTools, plus 3 vision-language models on Meta's Visual
  Prompt Injection benchmark.


  Average ASR 0.4% on Qwen-3-8B versus 0.2% for the Qwen3Guard detector, but
  utility under attack of 53.8% against under 49% for the next best defense.
  Trained only on TrojanTools, detection transfers at over 97% on AgentDojo
  and over 80% on InjecAgent, with utility recovery above 60%. Training takes
  under 2 minutes on 255 samples with roughly 31k parameters, against over 10
  hours and 1.19M samples for Qwen3Guard.


  Baselines are matched on tasks, not on compute, and the adaptive attacks
  used for training were synthesised by the authors' own LLM-as-Optimizer, so
  attack strength is self-defined. All backbones are 8B-class open models with
  white-box access; no adaptive adversary aware of the steering mechanism was
  tested.


  If you deploy agents and have model internals, attention steering is a
  cheaper security-utility tradeoff than refusal-based guardrails.
