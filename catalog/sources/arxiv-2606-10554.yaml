brief: >-
  Editing a fact into a model's weights does not propagate to what that fact
  entails. Parameter-based editors recall the direct assertion but fail the
  multi-hop questions implied by it.


  The benchmark builds a DBpedia knowledge graph from entities extracted out
  of existing editing datasets (spaCy + SPARQL), mines logical rules with
  AMIE3, then prompts an LLM to turn each rule plus its assertions into a
  multi-hop QA pair. Edits were applied with ROME, constrained fine-tuning
  (FT), and Knowledge Neurons (KN) on gpt2-medium, gpt2-large, and gpt2-xl,
  scored by F1 and Exact Match on MLaKE (English single-hop subset) and
  MQuAKE-T, from 1000 sampled prompts reduced to 831 and 961 questions.


  ROME on MLaKE drops from 16.36 F1 direct to 8.67 correlated on gpt2-medium;
  FT collapses further, from 24.58 to 0.45 F1 on gpt2-large, and to 0.0 F1 on
  gpt2-xl for MQuAKE. The abstract states a gap of up to 24%. KN reverses the
  pattern, scoring 14.26 vs 1.34 F1 on MLaKE.


  The gap is measured, but on 1 model family (GPT-2), 3 editors, and no
  memory-based method such as MeLLo. Direct-edit F1 is itself in the single to
  low double digits, so the correlated scores sit near a floor, and the
  entailed answers come from LLM-generated QA pairs with no reported human
  validation.


  Treat direct edit-success numbers as uninformative about entailment, and
  note that KN behaves differently from ROME and FT here.
