summary: Large Language Models (LLMs) are increasingly deployed in real-world
  applications that require access to up-to-date knowledge. However,
  retraining LLMs is computationally expensive. Therefore, knowledge editing
  techniques are crucial for maintaining current information and correcting
  erroneous assertions within pre-trained models. Current benchmarks for
  knowledge editing primarily focus on recalling edited facts, often
  neglecting their logical consequences. To address this limitation, we
  introduce a new benchmark designed to evaluate how knowledge editing methods
  handle the logical consequence
ingested_at: 2026-09-19
brief: >-
  Parameter-based knowledge editing inserts a fact without propagating its
  logical consequences, and the gap shows up even on automatically generated
  entailment questions. The benchmark here builds the test cases from mined
  rules rather than hand-curation.


  Entities are extracted from MLaKE and MQuAKE-T questions with spaCy,
  resolved to DBpedia URIs, and queried via SPARQL to build a knowledge graph;
  AMIE3 mines rules over it, and an LLM turns each rule plus its assertions
  into a multi-hop QA pair. ROME, constrained fine-tuning (FT) and Knowledge
  Neurons (KN) were applied to GPT2-medium, GPT2-large and GPT2-xl, then
  scored with F1 and exact match on direct versus correlated questions.


  The abstract reports a gap of up to 24% between direct and entailed
  knowledge. Absolute numbers are low throughout: ROME on MLaKE reaches F1
  16.36 direct versus 8.67 correlated on GPT2-medium; FT collapses on
  correlated items, from 24.58 to 0.45 F1 on GPT2-large. KN moves the other
  way, 1.34 direct versus 14.26 correlated F1 on MLaKE.


  Measured, not argued, but on 1 model family, 3 GPT-2 sizes, 831 MLaKE and
  961 MQuAKE questions, with no memory-based editors (MeLLo, PokeMQA) and no
  check that the LLM-generated QA pairs are themselves answerable; the
  confidence scores shown range down to 0.67.


  Nothing tested on LLaMA, Mistral, or Wikidata-scale graphs, and the KN
  reversal is 1 model only.


  Treat edit-success numbers as uninformative about whether downstream facts
  changed.
