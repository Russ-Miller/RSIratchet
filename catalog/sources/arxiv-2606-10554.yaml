brief: >-
  Parameter-based knowledge editing inserts a fact but does not propagate it
  to what the fact entails. The gap shows up as soon as you query the logical
  consequences rather than the edit itself.


  The benchmark builds a DBpedia knowledge graph from entities extracted from
  editing-benchmark questions with spaCy and SPARQL, mines rules with AMIE3,
  then prompts an LLM to turn each rule plus its assertions into a multi-hop
  question. Tests cover ROME, constrained fine-tuning (FT) and Knowledge
  Neurons (KN) on gpt2-medium, gpt2-large and gpt2-xl, using English
  single-hop MLaKE and MQuAKE-T, sampled to 831 and 961 questions after entity
  filtering.


  ROME on MLaKE drops from 16.36 F1 on direct edits to 8.67 on correlated
  knowledge for gpt2-medium; FT collapses from 24.58 to 0.45 F1 on gpt2-large.
  Exact match is 0.0 on MQuAKE in almost every cell. KN goes the other way,
  scoring 14.26 F1 correlated versus 1.34 direct on MLaKE.


  The effect is measured, with direct and correlated evaluations run on the
  same edited weights, so the comparison is clean. But absolute scores are low
  everywhere, including on the direct edits, which makes it hard to separate
  failed entailment from GPT-2 simply being weak at the generated questions.
  Memory-based methods such as MeLLo, and LLaMA- or Mistral-class models, were
  not tested, and QA pairs are LLM-generated with confidence scores as low as
  0.67.


  Treat direct-edit success rates as a poor proxy for whether an edit holds up
  downstream.
