brief: >-
  Editing a fact into a model's weights does not propagate to the facts that
  fact logically entails, and the gap widens the more the edit is constrained.
  Knowledge Neurons is the exception in these tests.


  The benchmark builds a DBpedia knowledge graph from entities extracted from
  editing-benchmark questions with spaCy and SPARQL, mines rules with AMIE3,
  then prompts an LLM to turn each rule plus its assertions into a multi-hop
  QA pair. Evaluation covers ROME, constrained fine-tuning (FT) and Knowledge
  Neurons (KN) on GPT2-medium, GPT2-large and GPT2-xl, over MLaKE (English
  single-hop subset) and MQuAKE-T, with 831 and 961 questions retained from
  1000 sampled prompts.


  ROME on MLaKE falls from F1 16.36 to 8.67 on gpt2-medium; FT on gpt2-large
  collapses from 24.58 to 0.45, with MQuAKE exact match 0.0 almost throughout.
  KN inverts this, scoring 14.26 F1 on correlated versus 1.34 on direct for
  MLaKE.


  The effect is measured, but direct and correlated scores come from different
  question sets generated by different pipelines, so the comparison is not
  matched; absolute F1 is low enough (under 25 everywhere) that the base
  models may simply be weak at multi-hop QA. Only GPT-2 scale models, only
  parameter-based editors, and KN on 1 model. No human check of the generated
  QA pairs is reported.


  Treat entailment propagation as unresolved rather than measured here.
