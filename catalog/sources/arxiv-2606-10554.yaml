summary: Large Language Models (LLMs) are increasingly deployed in real-world
  applications that require access to up-to-date knowledge. However,
  retraining LLMs is computationally expensive. Therefore, knowledge editing
  techniques are crucial for maintaining current information and correcting
  erroneous assertions within pre-trained models. Current benchmarks for
  knowledge editing primarily focus on recalling edited facts, often
  neglecting their logical consequences. To address this limitation, we
  introduce a new benchmark designed to evaluate how knowledge editing methods
  handle the logical consequence
ingested_at: 2026-09-19
brief: >-
  Parameter-editing methods insert a fact into a model but do not propagate it
  to the facts the edit logically entails. The gap between direct-edit recall
  and entailed-knowledge recall reaches up to 24%.


  The benchmark builds a DBpedia knowledge graph from entities extracted with
  spaCy out of existing edit datasets, mines rules with AMIE3, then prompts an
  LLM to turn each rule plus its assertions into a multi-hop QA pair. Edits
  are applied with ROME, constrained fine-tuning (FT), and Knowledge Neurons
  (KN) on GPT2-medium, GPT2-large and GPT2-xl, scored by F1 and Exact Match on
  MLaKE (English single-hop free-form subset) and MQuAKE-T (1,825 instances).


  From 1000 sampled prompts, 831 MLaKE and 961 MQuAKE questions survived
  entity linking. ROME on MLaKE drops from 16.36 F1 direct to 8.67 correlated
  for GPT2-medium; FT collapses further, from 24.58 to 0.45 F1 on GPT2-large.
  KN reverses the pattern on GPT2-xl: 1.34 direct vs 14.26 correlated F1 on
  MLaKE, 4.67 vs 18.53 on MQuAKE.


  The effect is measured, but absolute scores are so low (EM often 0.0) that
  the direct-edit baseline itself is barely functional, which makes the gap
  hard to attribute. Only GPT2-class models, only parameter-based editors, no
  memory-based methods like MeLLo, no validation of the LLM-generated QA pairs
  beyond a confidence score.


  Treat edit-success numbers from existing KE papers as uninformative about
  entailed consequences.
