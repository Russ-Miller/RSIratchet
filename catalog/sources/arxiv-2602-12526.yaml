brief: >-
  Treating correctness as a hard constraint relative to a frozen reference
  model, rather than as a term mixed into a length reward, prunes
  chain-of-thought without the accuracy erosion that length-reward methods
  show.


  Constraint-Rectified Training (CRT) alternates between minimizing normalized
  response length and restoring accuracy only when minibatch accuracy drops
  below the reference policy's, plus a second stage that maximizes accuracy
  under a length budget inherited from stage 1. Trained with GRPO-style
  rollouts in Verl on GSM8K+MATH, using DeepSeek-R1-Distilled-Qwen-1.5B and
  Qwen3-4B, evaluated on GSM8K, MATH500, SAT Math, AMC23, AIME24, OLYMPIAD
  Bench against ThinkPrune, L1, O1-Pruner, ShorterBetter, ACPO.


  On DeepSeek-1.5B in-domain, CRT reaches 85.35 average accuracy at 2499.2
  tokens versus the base model's 84.81 at 3428.0, with AES2 0.2901 against
  0.1261 for ACPO and 0.0811 for ThinkPrune-1k. Conditioned on length
  reduction, accuracy degrades in 12.5% of SAT Math cases versus 37.5% for
  ThinkPrune-1k. A gzip compression ratio metric shows 0.423 for CRT versus
  0.388 for ThinkPrune-1k at comparable length.


  Evidenced by measured comparison against 6 reproduced baselines plus an
  ablation separating stage 2 and a primal-dual variant; baselines were
  reproduced by the authors, and accuracy is not uniformly better (AIME24
  28.54 vs 30.42 base).


  Math only, 2 models, 1.5B-4B. The reference-guard framing is worth adopting
  if you tune length rewards.
