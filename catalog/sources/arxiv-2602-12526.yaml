summary: Chain-of-Thought (CoT) has significantly enhanced the reasoning
  capabilities of Large Language Models (LLMs), especially when combined with
  reinforcement learning (RL) based post-training methods. While longer
  reasoning traces can improve answer quality and unlock abilities such as
  self-correction, they also incur high inference costs and often introduce
  redundant steps, known as overthinking. Recent research seeks to develop
  efficient reasoning strategies that balance reasoning length and accuracy,
  either through length-aware reward design or prompt-based calibration.
