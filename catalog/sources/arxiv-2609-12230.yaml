summary: >-
  Question-answering often requires reasoning across multiple connected
  facts rather than retrieving a single isolated relation. Knowledge graphs
  (KGs) provide a structured way to represent such facts, but training large
  language models (LLMs) only on isolated KG head-relation-tail triples may
  limit their ability to learn the surrounding context needed for multi-hop
  reasoning. In this work, we propose a context-augmented training framework
