notes: >-
  Filed as a source on arithmetic from the classifier's judgement that the
  paper is about it (improves, medium): Handing arithmetic to a
  deterministic Python executor gives a clear accuracy gain at 32B (+7.05
  pts) but no reliable gain at 7B, showing code offloading helps yet does
  not uniformly remove arithmetic error and leaves
  formula/variable-extraction errors. No claim has been drafted from it yet.
