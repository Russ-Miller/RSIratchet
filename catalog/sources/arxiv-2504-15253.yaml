brief: >-
  LLM judges that score well on RewardBench are not interchangeable with
  reward models for test-time scaling: they match outcome reward models at
  reranking, lose to a much smaller process reward model in beam search, and
  their natural-language critiques fail to guide refinement.


  JETTS evaluates 10 judges (7B-70B) against 8 generators (6.7B-72B) on 3
  domains across 8 datasets (GSM8k, MATH Lvl 5, CHAMP, HumanEval+, MBPP+,
  BigCodeBench, AlpacaEval, IFEval) under response reranking, (10, 2)
  step-level beam search, and (1, 9) critique-based refinement, scored as
  normalized helpfulness over greedy decoding.


  Best judge reranking is 0.177 (Skywork-Critic 70B) vs 0.113 for the best RM;
  in beam search the best judge reaches 0.138 while Qwen2.5-Math-PRM-7B
  reaches 0.195. No judge beats 1.0 on refinement, with instruction following
  degrading up to 10%. Coding helpfulness is negative at all
  judge-to-generator size ratios, and 8B judges guiding 70B generators average
  negative helpfulness.


  Effects are measured with greedy, random, oracle, majority-vote, ORM and PRM
  baselines, plus t-tests, protocol ablations (pairwise vs Likert vs
  additive), and lookahead variants. The refinement failure diagnosis rests
  partly on a qualitative inspection of over 100 refinements.


  Limits: only fine-tuned open judges plus 1 prompted Llama-3.1-8B baseline;
  no frontier or reasoning-trained judges; beam search steps defined as lines.


  If you planned to swap a judge in for a PRM, expect a loss.
