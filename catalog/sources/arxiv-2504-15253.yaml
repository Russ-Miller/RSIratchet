brief: >-
  LLM judges that score well on RewardBench do not transfer that ability to
  test-time scaling: they match outcome reward models at reranking but trail
  process reward models at beam search, and their natural language critiques
  fail to guide refinement. JETTS runs 10 judge models (7B-70B) over 8
  generators (6.7B-72B) across math (GSM8k, MATH Lvl 5, CHAMP), code
  (HumanEval+, MBPP+, BigCodeBench), and instruction following (AlpacaEval,
  IFEval), in 3 settings: reranking of 10 responses, (10, 2) step-level beam
  search, and (1, 9) critique-based refinement, scored as normalized
  helpfulness against a greedy baseline of 0.


  Best judge reranking is 0.177 (Skywork-Critic 70B) versus 0.113 for the best
  RM; in beam search the best judge reaches 0.138 while the 7B
  Qwen2.5-Math-PRM reaches 0.195. Several judges fall below greedy decoding,
  e.g. Themis 8B at -0.149 on reranking. No judge exceeds 1.0 effective
  improvement ratio on refinement; instruction following degrades by up to
  10%. Code helpfulness is negative at all judge-to-generator size ratios, and
  8B judges give negative helpfulness for 70B generators.


  Effects are measured, with greedy, random, oracle, majority-vote, ORM and
  PRM baselines, and two-sided t-tests. Critique quality analysis rests on a
  qualitative inspection of over 100 refinements. Only open-weight finetuned
  judges are covered; no frontier or reasoning-trained judges.


  If you plan to swap a reward model for a judge in a search loop, this argues
  against it.
