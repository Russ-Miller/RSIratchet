brief: >-
  LLM judges that produce natural-language critiques hold up as rerankers but
  fall behind process reward models in step-level search, and their critiques
  do not help generators revise. JETTS benchmarks 10 judge models (7B-70B)
  against 8 generators (6.7B-72B) on 3 tasks: best-of-10 response reranking,
  (10, 2)-beam search, and (1, 9)-critique-based refinement, over 8 datasets
  in math (GSM8k, MATH Lvl 5, CHAMP), code (HumanEval+, MBPP+, BigCodeBench),
  and instruction following (AlpacaEval, IFEval).


  The best judge scores 0.177 normalized helpfulness on reranking versus 0.113
  for the best outcome RM, but on beam search the top judge reaches 0.138
  against 0.195 for a 7B process RM. Refinement never exceeds the baseline
  value of 1.000 for any judge, with instruction following losing up to 10%.
  Pairwise round-robin beats single-instance rating everywhere except MBPP+;
  code helpfulness is negative at all judge-to-generator size ratios; 8B
  judges guiding 70B generators give negative helpfulness, so no
  weak-to-strong effect. Only SFR 70B and SC 70B beat majority voting on
  GSM8k, and only for weak generators.


  Effects are measured with greedy, random, and oracle baselines and t-tests,
  though pairwise reranking costs O(N^2) judge calls and is not
  compute-matched against O(N) alternatives. Critique failure modes come from
  a qualitative inspection of over 100 refinements. If you were planning to
  swap a scalar RM for a judge inside a search loop, this argues against it.
