brief: >-
  LLM-judges match scalar outcome reward models when reranking complete
  responses, but trail process reward models in step-level search, and their
  natural language critiques do not help generators improve.


  JETTS evaluates 10 judge models (7B-70B) scoring outputs from 8 generators
  (6.7B-72B) across math (GSM8k, MATH Lvl 5, CHAMP), code (HumanEval+, MBPP+,
  BigCodeBench) and instruction following (AlpacaEval, IFEval), under 3
  settings: best-of-10 reranking, (10,2) step-level beam search, and (1,9)
  critique-based refinement.


  Best judges reach 0.177 normalized helpfulness on reranking vs 0.113 for the
  best RM, but only 0.138 on beam search vs 0.195 for a 7B Qwen2.5-Math-PRM.
  No judge exceeds an effective improvement ratio of 1.0 on refinement;
  instruction following loses up to 10%. Pairwise comparison beats
  single-instance rating but costs O(N^2). Small judges never help large
  generators: at size ratio ~0.1, helpfulness is negative. Code helpfulness is
  negative at all size ratios. Only SFR 70B and SC 70B beat majority voting on
  GSM8k, and only for weak generators.


  Effects are measured against greedy, random, oracle, RM and PRM baselines
  with t-tests, across datasets and generator sizes; the critique failure
  analysis is qualitative, over 100 inspected refinements.


  No reasoning-trained judges or frontier closed models were tested, and beam
  search steps are defined simply as lines.


  If you are choosing an evaluator for test-time scaling, RewardBench accuracy
  will mislead you about judge size.
