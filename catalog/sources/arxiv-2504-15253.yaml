brief: >-
  LLM judges that generate natural-language critiques match outcome reward
  models at reranking but fall behind process reward models at step-level
  search, and their critiques do not help generators improve.


  JETTS evaluates 10 judges (7B-70B: SFR-Judge, Skywork-Critic, OffsetBias,
  Prometheus, Self-Taught-Evaluator, Themis) guiding 8 generators (6.7B-72B)
  across math (GSM8k, MATH Lvl 5, CHAMP), code (HumanEval+, MBPP+,
  BigCodeBench) and instruction following (AlpacaEval, IFEval), under
  reranking of 10 responses, (10, 2)-beam search, and (1, 9)-critique
  refinement.


  Best judge reranking helpfulness was 0.177 vs 0.113 for the best ORM; in
  beam search the best judge reached 0.138 against 0.195 for
  Qwen2.5-Math-PRM-7B. No judge reached an effective improvement ratio above
  1.0 in refinement, with instruction following losing up to 10%. Pairwise
  beat single-rating but costs O(N^2). Only SFR 70B reliably beat majority
  voting on MATH.


  All effects are measured against greedy, random and oracle baselines, with
  t-tests and RM/PRM comparisons at smaller judge size; judge-to-generator
  size ratio is regressed, so attribution to judge scale is reasonable, though
  compute budgets are not equalized across protocols. Critique quality claims
  rest on inspecting over 100 refinements, qualitative only.


  No reasoning-trained judges or API frontier judges were tested, and code
  results were negative at every size ratio.


  If you planned to swap a reward model for a judge in test-time search, keep
  the PRM.
