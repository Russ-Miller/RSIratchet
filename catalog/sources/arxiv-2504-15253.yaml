brief: >-
  LLM judges hold up as rerankers but fail as process evaluators and as
  critics: their natural-language critiques do not steer generators toward
  better answers. JETTS measures this by running judges inside actual
  test-time scaling loops rather than on fixed preference pairs.


  The benchmark covers 3 domains (math, code, instruction following) across 8
  datasets (GSM8k, MATH Lvl 5, CHAMP, HumanEval+, MBPP+, BigCodeBench,
  AlpacaEval, IFEval), 3 tasks (10-response reranking, (10, 2)-beam search,
  (1, 9)-critique refinement), 10 judges from 7B-70B, and 8 generators from
  6.7B-72B, with normalized helpfulness relative to greedy and oracle.


  Best judges reach 0.177 and 0.171 on reranking versus 0.113 for the best
  ORM, but only 0.138 on beam search versus 0.195 for a 7B process reward
  model. No judge beats the baseline of 1.000 on refinement; instruction
  following degrades up to 10%. 8B judges guiding 70B generators give negative
  helpfulness, so no weak-to-strong effect. Only SFR 70B and SC 70B beat
  majority voting, and only on weaker generators.


  Evidence is measured with greedy, random, oracle, ORM and PRM baselines,
  significance tests, and a size-ratio regression; compute is not matched
  between pairwise O(N^2) reranking and O(N) rating. Refinement conclusions
  rest on 3 judge families, and critique quality is partly a qualitative read
  of over 100 refinements.


  If you planned to swap a reward model for a judge in a search loop,
  reranking is defensible and beam search or self-refinement is not.
