brief: >-
  LLM judges trained to critique in natural language are roughly on par with
  outcome reward models when reranking finished responses, but fall clearly
  behind process reward models when steering step-level search, and their
  critiques do not help generators revise.


  JETTS evaluates 10 judges (7B-70B) across 3 tasks (best-of-10 reranking,
  (10,2) step-level beam search, (1,9) critique-based refinement) on 8
  datasets spanning math (GSM8k, MATH Lvl 5, CHAMP), code (HumanEval+, MBPP+,
  BigCodeBench) and instruction following (AlpacaEval, IFEval), with responses
  from 8 generators (6.7B-72B). Performance is normalized against greedy and
  oracle selection, so 0 means no gain over greedy.


  Best judge reranking helpfulness is 0.177 (Skywork-Critic 70B) vs 0.113 for
  the best ORM; in beam search the best judge reaches 0.138 while a 7B
  Qwen2.5-Math-PRM reaches 0.195. No judge exceeds 1.000 on refinement (best
  0.996), and instruction following degrades up to 10%. Pairwise comparison
  beats single-instance rating but costs O(N^2). Code helpfulness is negative
  at all judge-to-generator size ratios; 8B judges guiding 70B generators are
  net harmful. No judge reliably beats majority voting on GSM8k/MATH.


  Effects are measured with matched 10-response budgets and t-tests against
  the greedy baseline, with RM and PRM baselines and random-reranking
  controls; the size-ratio claim is a regression across judge-generator pairs,
  not a controlled intervention, and the critique analysis rests on over 100
  hand-inspected refinements. Only open judges up to 70B were tested, no
  reasoning-trained judges or frontier APIs.


  If you planned to swap a reward model for a judge in a search loop, expect a
  loss outside instruction following.
