brief: >-
  LLM judges that produce natural-language critiques match scalar outcome
  reward models at reranking complete responses, but fall behind process
  reward models at step-level search, and their critiques do not help
  generators refine.


  JETTS evaluates 10 judges (7B-70B: SFR-Judge, Skywork-Critic, OffsetBias,
  Prometheus, Self-Taught-Evaluator, Themis) over 8 generators (6.7B-72B) on 8
  datasets across math (GSM8k, MATH Lvl 5, CHAMP), code (HumanEval+, MBPP+,
  BigCodeBench) and instruction following (AlpacaEval, IFEval), under 3
  settings: best-of-10 reranking, (10, 2)-beam search, and (1, 9)-critique
  refinement. Scores are normalized against greedy decoding (0) and an oracle
  (1).


  Best judge reranking is 0.177 (Skywork-Critic 70B) vs 0.113 for the best RM;
  in beam search the best judge is 0.138 vs 0.195 for a 7B process RM. No
  judge reaches an effective improvement ratio above 1.0 in refinement, with
  instruction following losing up to 10%. Code helpfulness is negative at all
  judge-to-generator size ratios; 8B judges guiding 70B generators are
  negative on average.


  Effects are measured with greedy, random, oracle, majority-vote, ORM and PRM
  baselines and significance tests, though pairwise reranking costs O(N^2)
  judge calls with no equal-compute control. Judges are all open-weight
  finetunes; no reasoning models or GPT-4-class judges are included.


  If you were planning to swap an RM for a judge in a search loop, measure
  first.
