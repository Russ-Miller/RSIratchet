brief: >-
  Splitting multimodal chain-of-thought into 2 specialized agents, 1 that
  reasons and 1 that judges and summarizes, then letting them generate each
  other's training data, raises reasoning scores without eroding perception.
  Insight-V builds long-chain reasoning trajectories automatically via
  progressive generation plus LLM-based filtering and scoring, trains a
  reasoning agent on top-scoring paths and a summary agent deliberately
  exposed to flawed paths, then replaces iterative DPO with 2 on-policy GRPO
  variants (ST-GRPO for spatial-temporal rewards including temporal-grounding
  IoU and clip reordering, J-GRPO for judge-plus-answer rewards) in
  Insight-V++.


  On LLaVA-NeXT-LLaMA3 8B, average reasoning rises from 46.8% to 54.9% and
  perception from 65.5% to 72.3% across 10 benchmarks. On Qwen2.5-VL 7B,
  reasoning goes 66.3% to 71.1% with perception roughly flat (82.9 to 82.8),
  advanced image reasoning averages 53.9 across 6 benchmarks, and video
  reasoning averages 47.3 to 54.2 across 6 benchmarks.


  The decomposition and self-evolution steps are separated (base,
  +Multi-Agent, +DPO/Self-Evolving rows), so the incremental contribution of
  each is visible, but gains are measured against the backbone only, with no
  baseline matched on tokens or on equivalent SFT data volume, and the
  comparison models differ in training data.


  Evidence covers 2 backbones at 7B-8B; nothing larger, no closed-source
  backbone, and no test of whether a single agent trained on the same 600K
  image and 1 million image-video samples would close the gap.


  If you are deciding between scaling reasoning data and restructuring the
  inference pipeline, this argues the role split itself carries part of the
  gain.
