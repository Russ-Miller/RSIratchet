summary: >-
  Hallucination in large language models reduces their reliability and slows
  adoption. Various white-box studies have used internal representations to
  detect patterns of truthfulness and factuality. A less-studied approach is
  to identify feed-forward neurons correlated with hallucination. We propose
  a method to rank feed-forward neurons at the final prompt token using a
  custom neuron selection dataset. We transfer the selected neuron
  identities to train hallucination classifiers on other factual question
  answering datasets. Our work provides empirical evidence that probes
