brief: >-
  A 4B agent model can solve 97.09% of text-only GAIA tasks at pass@64 after
  SFT alone, which locates the bottleneck for edge-scale agents in inference
  stability rather than latent capability.


  AgentCPM-Explore is built on Qwen3-4B-Thinking-2507 with three
  interventions: DELLA parameter-space merging of base and SFT weights,
  three-tier reward filtering (environment errors, format errors,
  extreme-length trajectories) during RL, and a distilled 4B summarizer plus
  RL-trained search-intent generation. Evaluated on 8 agent benchmarks
  including GAIA, BrowseComp, HLE, FRAMES, WebWalker, SEAL-0, xbench.


  It reaches 63.9 on GAIA text-only, 82.7 on FRAMES (vs 74.5 for
  ASearcher-32B, 71.0 for IterResearch-30B), 24.1 on BrowseComp (vs 19.6 for
  Claude-4.5-Sonnet), but trails DeepSeek-V3.2 (67.6 BrowseComp) and
  Tongyi-DeepResearch-30B on most tasks. Swapping the summarizer alone moved
  GAIA from 60.1 to 62.1 with GPT-5; the RL-adapted agent with a Qwen3-14B
  summarizer beat that at 63.9.


  The summarizer substitution is a clean controlled swap with the agent fixed.
  The reward-filtering claim rests on 3 RL curves with components removed,
  reported qualitatively as entropy collapse, without per-benchmark ablation
  numbers. Merging is not ablated separately; 1 base model, 1 scale.


  The pass@1 gap, not reasoning capacity, is where 4B agents lose.
