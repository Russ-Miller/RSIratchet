brief: >-
  Rendering a model's own pixel-level predictions back onto the image lets it
  catch perception errors that text-only self-correction misses. ChartVSR
  splits chart parsing into a Refine Stage, where the model emits [x, y]
  coordinates for each data point, sees them drawn as markers on the chart,
  and corrects omissions, shifts and hallucinations, and a Decode Stage that
  reads values off the verified anchors.


  The model is a finetuned Qwen2.5-VL-3B trained on roughly 800K synthetic
  Matplotlib charts from a diversity-focused data engine, evaluated with SCRM
  average precision on ChartQA-SE-Clean, PlotQA-SE, ChartX-SE and a new
  hand-annotated 1,200-chart ChartP-Bench.


  On ChartP-Bench the 3B model averages 38.41 against 34.07 for Gemini-2.5-Pro
  and 2.09 for GPT-4o; prior chart models score 1.55-5.22. Ablating VSR drops
  the average to 36.54, and removing pixel localization too gives 36.17, with
  the gap concentrated on the Hard subset. Round 1 of refinement detects 92.3%
  of errors and cuts error samples from 110 to 51; later rounds stall near 52
  despite recall above 85%. Cost rises from 1 to at least 3 forward calls.


  The ablation isolates VSR from the pixel-anchor representation, but there is
  no matched-compute baseline for the extra 3 calls, 1 model family, and 1
  training-data regime. Counting and grounding transfer is illustrated
  qualitatively only, with no numbers. Near-zero AP-Strict across all models
  limits what the strict metric shows.


  If you work on vision-heavy extraction, visual rather than textual feedback
  is the lever worth trying.
