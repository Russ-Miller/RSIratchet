summary: Recent vision-language models have strong perceptual ability but
  their implicit reasoning is hard to explain and easily generates
  hallucinations on complex queries. Compositional methods improve
  interpretability, but most rely on a single agent or hand-crafted pipeline
  and cannot decide when to collaborate across complementary agents or compete
  among overlapping ones. We introduce MATA (Multi-Agent hierarchical
  Trainable Automaton), a multi-agent system presented as a hierarchical
  finite-state automaton for visual reasoning whose top-level transitions are
  chosen by a trainable hyper agent. Eac
