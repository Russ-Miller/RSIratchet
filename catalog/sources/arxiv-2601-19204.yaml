brief: >-
  Learning when to switch between overlapping agents beats a hand-written
  pipeline, but most of the gain comes from having a router at all, not from
  the number of agents. MATA casts visual reasoning as a hierarchical
  automaton: 3 agent states (Specialized perception, Oneshot reasoner,
  Stepwise code reasoner), each with rule-based internal control, with a
  finetuned Qwen3 (4B) acting as the cross-agent transition policy over an
  append-only shared memory. Labels come from expanding transition-trajectory
  trees per image-query, scoring leaves by IoU or accuracy, and backing up the
  best child, giving MATA-SFT-90K (90,854 examples).


  With InternVL2.5 (8B) and Florence2-L as fixed backbones, MATA reaches 64.9
  on GQA, 76.5 on OK-VQA, 96.3/93.9/90.8 on RefCOCO/+/g and 77.3 on Ref-Adv,
  above InternVL3.5 (8B) (63.8, 75.7) and NAVER (96.2, 92.8, 91.6, 75.4).


  The ablation is matched on backbones and isolates the parts: random
  transitions average 6.91 sec/query but score 57.1 on GQA, a pretrained LLM
  router gets 58.5, SFT adds the rest to 64.9. An exhaustive ensemble of all
  agents is both slower (34.58 sec) and worse (57.7). Going from 1 to 2 agents
  gives 61.5 to 64.5; the third agent adds 0.4.


  Cross-dataset transfer is under 1% loss, but all tests are VQA and referring
  expressions, 1 VLM backbone, and data generation requires near-exhaustive
  tree search that will not scale past a few agents.


  If you are stacking agents, spend the budget on routing, not on more agents.
