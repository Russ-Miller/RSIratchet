brief: >-
  Hallucination detectors that claim to read chain-of-thought traces often get
  most of their signal from the final answer, and two cheap oracle
  interventions expose this. Force replaces the final answer with ground truth
  while leaving the reasoning body intact; Remove deletes answer-announcement
  steps. Neither repairs or corrupts a derivation, so a trace-faithful
  detector should score similarly under both.


  The tests were run across 4 benchmarks (BBH-Tracking, GPQA Diamond,
  MATH-500, CausalT5K-D6) and 5 models (Gemma-3-27B, GPT-OSS-120B,
  LLaMA-3-70B, Nemotron-30B, Nova Pro), against 7 black-box scorers including
  RACE, NSN, BSC and SEU, all given the same 10 sampled traces.


  RACE scores 76.17 AUC under Force on BBH-Tracking with Gemma-3-27B but 54.67
  under Remove, and nearly inverts on GPQA Diamond (24.28 vs 59.01). NSN stays
  at chance under Force on MATH-500 for every model yet reaches 77.40 and
  79.72 under Remove. TRACT, a lexical trajectory scorer with no NLI or
  embedding model, gives identical or near-identical scores across conditions
  and reaches 75.44/75.44 on CausalT5K-D6 with Nemotron-30B.


  The effect is measured, not argued, with a feature-block ablation (Content
  alone 80.3 on MATH-500, Structure 66.3 on CausalT5K-D6) and step-wise
  prefix-revelation curves. TRACT's stability is partly definitional, since
  its features are computed after answer removal; fusion gains of +5.42 to
  +20.00 AUC show it is not strictly better than baselines standalone.


  Only tasks with canonical answers were tested; open-ended generation and
  tool use were not. Treat unperturbed-trace AUC as uninformative about
  reasoning faithfulness.
