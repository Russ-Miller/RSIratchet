brief: >-
  Hallucination detectors that claim to read chain-of-thought mostly read the
  final answer. Two oracle interventions make this visible: Force replaces the
  final answer with ground truth while keeping the reasoning body, and Remove
  deletes answer-announcement steps. A trace-faithful scorer should score
  about the same under both.


  The tests were run across 4 benchmarks (BBH-Tracking, GPQA Diamond,
  MATH-500, CausalT5K-D6) and 5 models (Gemma-3-27B, GPT-OSS-120B,
  LLaMA-3-70B, Nemotron-30B, Nova Pro), against 7 black-box scorers (EMR, NCP,
  BSC, NCS, NSN, RACE, SEU), all given the same 10 sampled traces, scored by
  AUC.


  RACE moves from 76.17 Force to 54.67 Remove on BBH-Tracking with
  Gemma-3-27B, and nearly inverts on GPQA Diamond (24.28 vs 59.01). NSN sits
  at chance under Force on MATH-500 for every model but reaches 77.40 and
  79.72 under Remove. TRACT, a lexical trajectory scorer using hedge slope,
  step-length dynamics and cross-sample unigram divergence, gives identical or
  near-identical Force/Remove values, e.g. 75.44/75.44 on CausalT5K-D6 with
  Nemotron-30B.


  The instability is measured, not argued, with matched sampling budgets and a
  feature-block ablation; the Content block alone reaches 80.3 AUC on
  MATH-500, Structure 66.3 on CausalT5K-D6. Fusing TRACT with baselines gains
  +5.42 to +20.00 AUC, so TRACT alone is not the strongest option.


  All tasks have canonical answers; open-ended generation, tool use and
  white-box detectors are untested, and passing these checks does not show
  step-level verification.


  If you report detector AUC on unperturbed traces only, you cannot tell what
  your detector is reading.
