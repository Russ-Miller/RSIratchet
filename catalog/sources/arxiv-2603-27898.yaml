summary: >-
  Large vision-language models (VLMs) frequently suffer from hallucinations,
  generating content that is inconsistent with visual inputs. Existing
  methods typically address this problem through post-hoc filtering,
  additional training objectives, or external verification, but they do not
  intervene during the decoding process when hallucinations arise. In this
  work, we introduce SAGE, a Sink-Aware Grounded Decoding framework that
  mitigates hallucinations by dynamically modulating self-attention during
  generation. Hallucinations are strongly correlated with attention sink
