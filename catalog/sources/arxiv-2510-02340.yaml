brief: >-
  Telling a model to act as if its knowledge stopped in an earlier year works
  when you ask about the forgotten fact directly, and mostly fails when the
  fact is only causally upstream of the question.


  The test is 3 curated subsets: Factual (675 examples, e.g. who is US
  president as of 2022), Semantic (303 examples, e.g. what "TikTok" meant
  around 2010), and Counterfactual (689 examples, e.g. predicting the Tokyo
  Olympics year given a 2018 cutoff, where COVID-19 is the hidden meta-event).
  DeepSeek-V3, LLaMA-3.1-405B and GPT-4o were run with 2 hand-tuned cutoff
  meta-prompts; success means the answer flips toward the simulated cutoff,
  scored by multiple-choice flip or MPNet embedding similarity.


  Average unlearn success was around 82.5% on Factual, about 70.0% on
  Semantic, and about 19.2% on Counterfactual. Reasoning models close much of
  the gap: DeepSeek-R1 hits 0.723 and 0.701 on Counterfactual versus 0.152 and
  0.125 for DeepSeek-V3; o3 reaches 0.478 and 0.533 versus GPT-4o's 0.144 and
  0.201.


  Effects are measured, but the only comparison is prompt-vs-no-prompt; no
  fine-tuning, gradient unlearning, or retrieval baseline was run, and data
  were GPT-4o-generated then filtered by other LLMs and authors. Scope is 5
  large proprietary or frontier open models and 2 prompts.


  If you use prompted cutoffs to clean up contamination in temporal prediction
  evals, treat causally-downstream leakage as unaddressed.
