summary: "Large Language Models (LLMs) are widely used for temporal
  prediction, but their reliance on pretraining data raises contamination
  concerns, as accurate predictions on pre-cutoff test data may reflect
  memorization rather than reasoning, leading to an overestimation of their
  generalization capability. With the recent emergence of prompting-based
  unlearning techniques, a natural question arises: Can LLMs be prompted to
  simulate an earlier knowledge cutoff? In this work, we investigate the
  capability of prompting to simulate earlier knowledge cutoff in LLMs. We
  construct three evaluation datasets"
ingested_at: 2026-09-19
brief: >-
  Telling a model to pretend its knowledge cutoff is an earlier date works
  when you ask it directly about post-cutoff facts, and mostly fails when the
  post-cutoff knowledge only bears indirectly on the question.


  3 datasets were built to separate these cases: a Factual subset (675
  examples, e.g. who is US president as of 2022), a Semantic subset (303
  examples, word meanings before a shift, e.g. "TikTok" in 2010), and a
  Counterfactual subset (689 examples, predicting a downstream event while
  ignoring a later meta-event, e.g. the Tokyo Olympics year given a 2018
  cutoff). DeepSeek-V3, LLaMA-3.1-405B and GPT-4o were tested with 2
  hand-tuned meta prompts, scored by unlearn success rate.


  Average success was about 82.5% on Factual, about 70.0% on Semantic, and
  about 19.2% on Counterfactual. Reasoning models close much of that gap:
  DeepSeek-R1 reaches 0.723 and 0.701 on Counterfactual versus 0.152 and 0.125
  for DeepSeek-V3, while o3 gets 0.478 and 0.533.


  The effect is measured, and the 3-subset split isolates direct query from
  causal dependence. But Factual and Counterfactual use 2-option multiple
  choice where success means only that the answer flipped, the Semantic metric
  is an embedding-similarity heuristic, data were generated by GPT-4o then
  filtered by other LLMs and the authors, and no non-prompting unlearning
  method was compared.


  If you use prompted cutoffs to argue away contamination in temporal
  prediction, that defence is weakest exactly where prediction lives.
