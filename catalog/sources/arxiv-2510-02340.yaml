brief: >-
  Telling a model in its system prompt that its knowledge ends in an earlier
  year works when you ask directly about a post-cutoff fact, and mostly fails
  when the post-cutoff fact is only causally upstream of the question.


  The authors built 3 subsets: Factual (675 examples, e.g. who is US president
  as of 2022), Semantic (303 examples, e.g. define "TikTok" circa 2010), and
  Counterfactual (689 examples, e.g. predict the Tokyo Olympics year given a
  2018 cutoff, where COVID-19 is the hidden meta-event). Items were
  GPT-4o-generated, de-duplicated at ROUGE-L 0.7, cross-validated by 3 other
  LLMs, and manually reviewed. DeepSeek-V3, LLaMA-3.1-405B, and GPT-4o were
  tested with 2 hand-tuned meta prompts.


  Average unlearning success was around 82.5% on Factual, approximately 70.0%
  on Semantic, and about 19.2% on Counterfactual. Reasoning models closed much
  of the gap: DeepSeek-R1 reached 0.723 and 0.701 on Counterfactual versus
  0.152 and 0.125 for DeepSeek-V3; o3 reached 0.478 and 0.533 versus GPT-4o's
  0.144 and 0.201.


  The effect is measured, with the 2-prompt variation acting as the only
  sensitivity check. No non-prompt unlearning baseline, no finetuning
  comparison, and Factual/Counterfactual scoring reduces to a 2-option
  multiple choice, so "success" means a flipped answer rather than a correct
  counterfactual chain. Semantic scoring relies on MPNet embedding ratios.


  If you use prompted cutoffs to defend against contamination in temporal
  prediction, treat them as insufficient for anything causally downstream.
