summary: "Large Language Models (LLMs) are widely used for temporal
  prediction, but their reliance on pretraining data raises contamination
  concerns, as accurate predictions on pre-cutoff test data may reflect
  memorization rather than reasoning, leading to an overestimation of their
  generalization capability. With the recent emergence of prompting-based
  unlearning techniques, a natural question arises: Can LLMs be prompted to
  simulate an earlier knowledge cutoff? In this work, we investigate the
  capability of prompting to simulate earlier knowledge cutoff in LLMs. We
  construct three evaluation datasets"
ingested_at: 2026-09-19
brief: >-
  Telling a model "your knowledge ends in 2018" works when the post-cutoff
  fact is asked about directly, and largely fails when the fact is only
  causally upstream of the question.


  The authors built 3 subsets to test prompted knowledge cutoffs: Factual (675
  examples, e.g. who is U.S. president as of a given date), Semantic (303
  examples, e.g. define "TikTok" with a 2010 cutoff), and Counterfactual (689
  examples, e.g. predict the Tokyo Olympics year given a 2018 cutoff, where
  COVID-19 is the hidden meta-event). Items were GPT-4o-generated,
  de-duplicated by ROUGE-L above 0.7, cross-validated by 3 other LLMs, then
  manually reviewed. 2 hand-tuned meta prompts (P1, P2) were run on
  DeepSeek-V3, LLaMA-3.1-405B and GPT-4o; metric is unlearn success rate, with
  the Semantic subset scored by MPNet embedding similarity.


  Average success was around 82.5% on Factual, approximately 70.0% on
  Semantic, and about 19.2% on Counterfactual. Reasoning models close much of
  that gap: DeepSeek-R1 reaches 0.723 and o3 0.533 on Counterfactual, against
  0.152 for DeepSeek-V3 and 0.201 for GPT-4o.


  The effect is measured, with 2 prompt variants as the only robustness check;
  there is no comparison against weight-level unlearning, no
  fine-tuned-on-cutoff-prompts baseline, and the data are synthetic and partly
  generated by one of the evaluated models. The reasoning-model comparison is
  2 models per group, not matched on training data.


  If you use prompted cutoffs to decontaminate temporal prediction evals,
  treat them as insufficient for anything requiring causal inference.
