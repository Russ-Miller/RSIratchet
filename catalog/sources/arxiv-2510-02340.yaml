brief: >-
  Telling a model "your knowledge cutoff is 2018" works when you ask it
  directly about post-cutoff facts, and mostly fails when the post-cutoff
  event is only causally upstream of the question.


  The authors built 3 subsets with GPT-4o generation plus manual review:
  Factual (675 examples, e.g. who is US president as of a date), Semantic (303
  examples, words whose meaning shifted, e.g. "TikTok" in 2010), and
  Counterfactual (689 examples, e.g. predicting the Tokyo Olympics year given
  a 2018 cutoff, where COVID-19 is the hidden meta-event). DeepSeek-V3,
  LLaMA-3.1-405B and GPT-4o were tested with 2 hand-written meta-prompts;
  success means the answer flips toward the simulated cutoff.


  Average unlearn success was about 82.5% on Factual, about 70.0% on Semantic,
  and about 19.2% on Counterfactual. Reasoning models close much of the gap:
  DeepSeek-R1 reaches 0.723 and o3 0.533 on Counterfactual, versus 0.152 for
  DeepSeek-V3 and 0.201 for GPT-4o.


  Measured, not argued, but the comparison is only prompt-vs-no-prompt; no
  weight-level unlearning baseline was run, by the authors' own admission, and
  Semantic scoring relies on an MPNet cosine heuristic rather than human
  judgment. Only 2 prompts, and reasoning-model results cover 2 models.


  If you use prompted cutoffs to defend a temporal-prediction evaluation
  against contamination, the defense does not hold for causally downstream
  questions.
