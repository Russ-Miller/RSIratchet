brief: >-
  Telling an LLM in the system prompt to act as if its knowledge cutoff were
  earlier works when the post-cutoff fact is asked about directly, and largely
  fails when the fact is only causally upstream of the question.


  The test is a 3-part dataset: a Factual subset (675 examples, e.g. who is US
  president as of 2022), a Semantic subset (303 examples, pre-2010 meaning of
  "TikTok"), and a Counterfactual subset (689 examples, e.g. predict the Tokyo
  Olympics year given a 2018 cutoff, where COVID is the hidden meta-event).
  DeepSeek-V3, LLaMA-3.1-405B and GPT-4o were run with 2 hand-tuned
  meta-prompts; Factual and Counterfactual were scored as 2-option multiple
  choice, Semantic by MPNet embedding similarity.


  Average unlearn success rate was around 82.5% on Factual, approximately
  70.0% on Semantic, and about 19.2% on Counterfactual. Reasoning models close
  much of that gap: DeepSeek-R1 reaches 0.723 and 0.701 on Counterfactual
  versus 0.152 and 0.125 for DeepSeek-V3; o3 reaches 0.478 and 0.533 versus
  GPT-4o's 0.144 and 0.201.


  The effect is measured, with 2 prompt variants as the only sensitivity
  check, and no comparison against finetuning-based or weight-level
  unlearning. Data were generated by GPT-4o then filtered by other LLMs and
  manual review, so item difficulty is not independently calibrated. The
  causes of failure are speculated, not isolated.


  If you use prompted cutoffs to defend temporal-prediction results against
  contamination, that defence does not hold for causally downstream questions
  on non-reasoning models.
