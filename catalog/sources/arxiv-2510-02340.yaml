summary: "Large Language Models (LLMs) are widely used for temporal
  prediction, but their reliance on pretraining data raises contamination
  concerns, as accurate predictions on pre-cutoff test data may reflect
  memorization rather than reasoning, leading to an overestimation of their
  generalization capability. With the recent emergence of prompting-based
  unlearning techniques, a natural question arises: Can LLMs be prompted to
  simulate an earlier knowledge cutoff? In this work, we investigate the
  capability of prompting to simulate earlier knowledge cutoff in LLMs. We
  construct three evaluation datasets"
ingested_at: 2026-09-19
brief: >-
  Telling an LLM "your knowledge cutoff is 2018" works when the post-cutoff
  fact is asked about directly, and largely fails when the fact is only
  causally upstream of the question.


  Three subsets were built to test this: Factual (675 examples, e.g. who is US
  president as of a date), Semantic (303, older meanings of words like
  "TikTok"), and Counterfactual (689, e.g. predicting the Tokyo Olympics year
  without knowing COVID-19). DeepSeek-V3, LLaMA-3.1-405B and GPT-4o were run
  under 2 hand-tuned meta prompts, scored by unlearn success rate; Factual and
  Counterfactual as 2-option multiple choice, Semantic via MPNet embedding
  similarity to pre- vs post-shift meanings.


  Average success was around 82.5% on Factual, approximately 70.0% on
  Semantic, and only about 19.2% on Counterfactual. Reasoning models close
  much of that gap: DeepSeek-R1 reaches 0.723 and 0.701 on Counterfactual
  versus 0.152 and 0.125 for DeepSeek-V3; OpenAI o3 gets 0.478 and 0.533
  versus GPT-4o's 0.144 and 0.201.


  The effect is measured, with 2 prompt variants as the only sensitivity
  check. Data was generated by GPT-4o then cross-validated by other LLMs and
  manually filtered, so item difficulty is not independently calibrated. No
  fine-tuning or weight-level unlearning baseline was tried, and the
  reasoning-model comparison covers 2 pairs.


  If you use prompted cutoffs to defend against contamination in temporal
  prediction evaluations, that defence is weak for causally downstream
  questions.
