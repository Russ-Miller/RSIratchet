brief: >-
  Constraining self-reflection to actions a vision-language model can actually
  perform, plus a running log of past reflections, turns iterative
  self-correction from a plateau into sustained gains on OCR tasks.
  Unconstrained reflection in these models proposes things like "enhance the
  image" or "add human proofreading" and loops on the same failed fixes.


  OCR-Agent wraps RolmOCR-7B in 3 fixed rounds of reflect-then-refine,
  filtering infeasible plan steps (Capability Reflection) and conditioning
  each refinement on all prior reflections (Memory Reflection), with no
  training. Evaluation is OCRBench v2, over 10,000 verified QA pairs across
  English and Chinese, 8 task types, run on 4 NVIDIA 3090 GPUs.


  English average rises from 38.4 naive to 51.0, past InternVL3-8B (49.0) and
  near Gemini-Pro (51.9), with top scores in Understanding (79.9) and
  Reasoning (66.5). Chinese average goes 37.7 to 54.7, with Chinese
  Recognition jumping 37.7 to 77.0 but Parsing (22.9) still below several
  baselines.


  The component ablation is present and clean: CoT 42.0, Self-Refine 43.4,
  Capability only 45.9, Memory only 48.4, both 51.0. There is no
  matched-compute baseline, so 3x the VLM calls is not controlled for, and
  only 1 base model is used.


  The gains are bounded by base-model perception; initial misreads are not
  recoverable. Treat it as evidence that reflection helps when its action
  space is constrained, not that reflection helps generally.
