brief: >-
  Personalization methods that work by retrieving semantically similar user
  history collapse when the profile cues and the target preference sit in
  different concept spaces. Vibe-Bench isolates this regime, called
  profile-preference conceptual misalignment, with 3,504 personas and 12,239
  dialogues built from Big Five personality traits, Holland's RIASEC
  vocational interests, and emotional-support dialogue data, plus a 128-sample
  manually verified gold test set.


  Two tasks: pick and realize an emotion-regulation strategy for a distress
  query, and judge whether a user's occupation fits their inferred interest
  type. Six instruction-tuned models across 4 families were tested with
  full-history prompting, profile-augmented prompting, BM25 and BERTScore
  retrieval, and LoRA fine-tuning on 6 more models.


  Strategy-selection accuracy stays between 18.36 and 24.22 against a
  no-history baseline of 21.48; full-history prompting drops accuracy to 18.36
  and Macro-F1 to 10.36. Fine-tuning wins Task 2 (F1 83.15, MCC 0.68) and best
  BLEU-4 (9.11) yet still scores 17.97 strategy accuracy.


  An ablation injecting explicit preferences gives 100.0 accuracy under both
  non-misaligned paradigms; removing only the cross-concept mapping step costs
  58% on Task 1 versus 7% for removing profile inference, which attributes the
  failure to mapping rather than retrieval anchoring. Template CoT built from
  gold persona labels recovers 44% on Task 1.


  Synthetic English histories, 2 psychology tasks, no preference-optimization
  baselines. Treat retrieval quality as the wrong lever for cold-start
  personalization.
