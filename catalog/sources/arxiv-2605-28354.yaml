summary: "Training large language models as retrieval-augmented reasoning
  agents typically combines reinforcement learning with an SFT cold start
  distilled from a stronger model. However, this paradigm overlooks two
  fundamental factors: the dependency structure among sub-skills, and the
  possibility that distillation is not the only route to capability
  acquisition. We study this through Plan, a structured agentic behavior for
  multi-hop retrieval that decomposes a question into ordered sub-questions
  before any retrieval is performed, so that each search step can be anchored
  to a pre-designed sub-question"
