brief: >-
  Cold-start data from a 3B seed model beats distillation from a 72B model
  when teaching search agents to plan, and whether RL on planning works at all
  depends on the starting checkpoint rather than the reward. PL-Search makes
  the model emit a <plan> block of ordered sub-questions before any retrieval,
  then anchors each think/search/refine step to one sub-question, trained with
  GRPO under a plan-alignment reward thresholded at 0.25 to stop verbatim
  copying.


  On 7 QA benchmarks with a Wikipedia retriever, PL-Search-3B-Base reaches
  0.430 average EM vs 0.405 for the strongest baseline, with multi-hop gains
  of 0.045 over AutoRefine-Base. Across 12 configurations (Qwen2.5, Llama3.2,
  Qwen3, 3B-14B) multi-hop EM improves in all 12, averaging 0.053; single-hop
  is flat. Removing the plan reward costs 0.017-0.025 multi-hop EM.
  Self-bootstrapped SFT beats 72B distillation by 1.4 EM points on 3 targets
  at matched 4,500 filtered trajectories, and distillation-initialized RL
  collapsed repeatedly on 2 of them.


  The failure analysis is measured: entropy traces show prior collapse at 0.06
  for the 3B-Instruct model, explosion past 2.5 for Qwen3-4B-Base, and
  collapse when plan is trained before refine, with the order ablation run on
  the one model where R-to-P succeeds. Post-SFT entropy lands in 0.12-0.28
  across 8 runs.


  Only multi-hop QA with static retrieval was tested; tool use and live web
  are open. If you build search agents, try a same-size seed model before
  paying for a bigger teacher.
