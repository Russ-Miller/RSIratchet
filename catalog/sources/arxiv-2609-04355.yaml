summary: >-
  Pretrained vision-language-action (VLA) models enable broad manipulation
  but remain unreliable in tasks demanding precision and repeatability.
  Applying real-world online reinforcement learning (RL) to VLA
  post-training enables autonomous trial-and-error improvement beyond
  demonstrations alone, but exposes two bottlenecks: 1) unreliable value
  signals can induce policy drift; 2) large-VLA overhead constrains
  throughput and sample efficiency. To address these challenges, we present
  VLA-Precision, an efficient real-world online RL framework featuring the
  Asymmetric Co-Bootstrapping (ACoB) algorith
