brief: >-
  Real-world online RL on top of a task-finetuned large VLA can push
  manipulation success past the demonstration ceiling, provided value
  estimates are calibrated gradually and updates are anchored to a frozen
  reference rather than maximizing absolute Q.


  VLA-Precision fine-tunes π0.5 with LoRA on the action expert, combining
  intervention-driven flow-matching behavior cloning, TD return propagation
  plus state-matched preference ranking across a critic ensemble, and
  reference-regularized relative-advantage updates. It is evaluated on 9
  high-precision chemistry tasks (contact-rich, contact-light, contact-free,
  bimanual) across 4 embodiments, against HIL-SERL, ConRFT, Robo-Dopamine, π0
  and π0.5.


  Reported average success is 98.3% after 45.8 min of online training per
  task, with 27.6 s episodes; 177 of 180 held-out trials succeed, 100% on 7
  tasks. π0.5 and π0 reach 67.8% and 59.4%; the RL baselines reach 7.8% and
  10.0%. The systems side, ACoB-Stream, claims up to 10.9x throughput and
  efficiency gains.


  Evidence is measured on real hardware with 20 trials per method-task pair
  and Wilson 95% intervals on 5 representative tasks, plus intervention-rate
  curves. Baselines were built for compact policies or Octo, so the comparison
  confounds algorithm with backbone scale; no matched-compute or
  equal-intervention baseline is shown, and the 10.9x figure has no named
  ablation in the text here.


  One task family, 1 VLA family, 1 lab, self-run evaluation; generalization
  beyond lab-scale precision tasks is untested.


  If you assumed real-robot RL on large VLAs needs 400–1,000+ episodes per
  task, this suggests sub-hour budgets are plausible with human corrections in
  the loop.
