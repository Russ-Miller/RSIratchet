brief: >-
  Object hallucination in VLMs is not a case of visual evidence going missing;
  the same components that carry grounding signal flip polarity and start
  supporting the hallucinated answer. Activation patching across 5
  architecturally diverse VLMs finds a visual grounding pathway (Cohen's d >
  0) and a hallucination pathway (d < 0) in every model.


  The models are Qwen3-VL-8B, LLaVA-v1.6-7B, Llama-3.2-V-11B, InternVL3-8B and
  InternVL3-14B, probed on POPE-adversarial with 3σ Gaussian noise on visual
  tokens, plus AMBER for transfer.


  On correct samples 61–83% of grounding-component indirect effects are
  positive; on hallucinating samples only 21–33% are, with subset-mean IE
  turning negative in every model (cross-subset d from −1.60 to −2.45, all p <
  0.001). Scaling down hallucination-pathway outputs cuts hallucination 40%
  (LLaVA) to 76% (Llama-3.2) at ≤ 2 pp accuracy cost.


  The causal claim is measured, with a random-component control (mean |ΔH| =
  3.0 pp, sign positive), a grounding-pathway ablation that collapses accuracy
  to 0.50–0.51, and matched static-direction baselines (ITI, mean-difference
  projection) that underperform per-component scaling.


  Transfer is type-dependent: 36–47% relative reduction on AMBER relational
  hallucination in 3 of 5 models, but attribute hallucination is largely
  unaffected. Logit-lens validation fails for Llama-3.2 (d = −0.18, p = 0.43),
  and micro-level wiring correlates poorly across models (|r| ≤ 0.33).


  If you build hallucination mitigations around a single steering direction,
  this argues the signal is spread across components instead.
