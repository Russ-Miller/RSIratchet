summary: >-
  LLMs operating in dynamic real-world contexts often encounter knowledge
  that evolves continuously or emerges incrementally. To remain accurate and
  effective, models must adapt to newly arriving information on the fly. We
  introduce Online Adaptation to Continual Knowledge Streams(OAKS) to
  evaluate this capability, establishing a benchmark for online adaptation
  over streaming, continually updating knowledge. Specifically, the
  benchmark is structured as a sequence of fine-grained context chunks where
  facts change dynamically across time intervals. OAKS comprises two
  datasets: OAKS-BABI and OAKS-N
notes: >-
  Filed as a source on knowledge-updating from the classifier's judgement
  that the paper is about it (measures, medium): The paper introduces a
  benchmark and reports that current models and memory systems fail to track
  continually changing facts, characterizing rather than improving or
  breaking the capability. No claim has been drafted from it yet.
