brief: >-
  Frontier multimodal models read latent mental states from real classroom
  video poorly, and most of the usable signal turns out to be in the
  transcript rather than the video. MOTOR-Bench packages 1,440 clips (about
  6.10 seconds each, 2 to 4 students, Finnish speech transcribed by
  Whisper-large-finnish-v3) from 30 groups in a nature-based inquiry activity,
  each labelled by educational researchers with behavior, cognition, and
  emotion categories drawn from self-regulated learning theory.


  Zero-shot, the best single model InternVL-3.5 reaches 26.84 average
  Macro-F1; Gemini-1.5-Pro 23.17, AffectGPT 22.60. CAMEL with 3 agents reaches
  39.28. The authors' MOTOR-MAS, which predicts behavior first then conditions
  cognition and emotion on it, reaches 42.77, +15.93 over InternVL-3.5 and
  +10.2 on cognition over CAMEL. Cognition stays hardest at 39.81.


  Backbone is held fixed at InternVL-3.5-8B across CAMEL and MOTOR-MAS with
  identical inputs and decoding, which isolates the coordination structure.
  Ablations separate agent decomposition (-7.96), SRL-grounded prompts
  (-8.87), and video input (-3.30), so prompt-level domain knowledge matters
  about as much as the agent split.


  One dataset, one language, one backbone for the agent comparisons;
  proprietary models were not run inside MOTOR-MAS, and utterance-level
  inference ignores temporal dynamics. Mixed emotion fails for all systems.
  Absolute scores stay low, so treat this as a hard open benchmark rather than
  a solved pipeline.
