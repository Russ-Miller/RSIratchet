brief: >-
  Frontier multimodal models read inner mental states from real classroom
  video poorly, and most of the gain from fixing this comes from prompt-level
  domain theory and agent specialisation rather than from the video itself.


  MOTOR-Bench is 1,440 clips (about 6.10 seconds each, 2 to 4 Finnish
  secondary students) from inquiry science collaboration, each labelled by
  educational researchers with a behavior, cognition and emotion triplet from
  self-regulated learning theory. Zero-shot baselines include
  InternVL-2.5/3.5, Gemini-1.5-Flash/Pro, AffectGPT and CAMEL; MOTOR-MAS
  chains 3 agents in order behavior, then cognition, then emotion.


  Best single model InternVL-3.5 reaches 26.84 Macro-F1 averaged over the 3
  labels; MOTOR-MAS reaches 42.77, +15.93 points, and beats CAMEL with 3
  agents on cognition 39.81 vs 29.61. Cognition stays hardest at 39.81.


  Ablations share the InternVL-3.5-8B backbone, same input and decoding, so
  the comparison is budget-matched in backbone terms: removing agent
  decomposition costs 7.96 points, removing SRL prompts 8.87, removing video
  only 3.30.


  Metrics are self-reported on a dataset the authors built, 1 backbone for the
  agent variants, 1 language and 1 educational setting, utterance-level only
  with no temporal modelling. Mixed emotion failed for all models.


  Treat the gain as evidence for theory-shaped prompting, not for multi-agent
  scaffolding alone.
