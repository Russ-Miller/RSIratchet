summary: >-
  We introduce Full-Duplex-Bench-v3 (FDB-v3), a benchmark for evaluating
  spoken language models under naturalistic speech conditions and multi-step
  tool use. Unlike prior work, our dataset consists entirely of real human
  audio annotated for five disfluency categories, paired with scenarios
  requiring chained API calls across four task domains. We evaluate six
  model configurations -- GPT-Realtime, Gemini Live 2.5, Gemini Live 3.1,
  Grok, Ultravox v0.7, and a traditional Cascaded pipeline
  (Whisper$\rightarrow$GPT-4o$\rightarrow$TTS) -- across accuracy, latency,
