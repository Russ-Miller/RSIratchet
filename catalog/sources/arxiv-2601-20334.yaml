brief: >-
  An off-the-shelf coding-agent loop, given privileged simulator state and
  Cartesian control, can discover manipulation programs by trial and error
  without any demonstrations or fine-tuning. The capability at issue is
  iterative program synthesis transferred to embodied control, and the result
  cuts against the assumption that manipulation requires task-specific
  demonstration data.


  FAEA wraps the unmodified Claude Agent SDK (Claude Opus 4.5) around LIBERO
  (120 tasks, Franka Panda), ManiSkill3 (14 tasks x 5 seeds, domain
  randomization), and MetaWorld (50 tasks, Sawyer). The agent writes and
  reruns Python scripts, observing success signals and state, averaging 2–26
  attempts per task.


  Success rates: 84.9% on LIBERO (88.2% with human coaching tips), 85.7% on
  ManiSkill3, 96% on MetaWorld versus SmolVLA's 68.2%. A 10-trial pilot
  reached only 70.6%, and removing the cap recovered 17/35 failed tasks;
  coaching recovered 21/35.


  Evidence is measured but the comparison is not controlled: VLA baselines are
  quoted from other papers and use RGB observations, while FAEA reads
  ground-truth object poses. 1 SDK, 1 model, simulation only. One clean
  negative control exists: LIBERO-derived coaching applied to ManiSkill
  dropped success to 81.4% and raised cost 47% ($150 to $220).


  Sub-centimeter tasks fail outright (PegInsertionSide 0%), and task discovery
  takes 2.0–24.6 minutes, ruling out reactive control.


  Treat this as evidence for agents as simulation trajectory generators, not
  as robot controllers.
