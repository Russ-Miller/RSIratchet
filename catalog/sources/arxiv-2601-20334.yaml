summary: Robotic manipulation has increasingly adopted vision-language-action
  (VLA) models, which achieve strong performance but typically require
  task-specific demonstrations and fine-tuning, and often generalize poorly
  under domain shift. We investigate whether general-purpose large language
  model (LLM) agent frameworks, originally developed for software engineering,
  can serve as an alternative control paradigm for embodied manipulation. We
  introduce FAEA (Frontier Agent as Embodied Agent), which applies an LLM
  agent framework directly to embodied manipulation without modification.
