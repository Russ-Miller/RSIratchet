brief: >-
  Training a code model on its own samples plus a teacher's critique of them
  beats fine-tuning on the teacher's code directly, and the gains keep
  accruing across iterations.


  Adaptive Critique Refinement (ACR) samples 7 responses at temperature 0.7,
  scores them with Qwen2.5-32B-Instruct as judge plus a code executor, and
  either replaces the dataset answer with the winning self-generated one or
  builds 2-turn data where the teacher critiques the losing self-generated
  code. Applied for 3 iterations to DSCoder-6.7B-Base and
  Qwen2.5-Coder-7B-Base over an 80K GPT-4o-built Python SFT set.


  Average pass@1 on LiveCodeBench and BigCodeBench-hard rose 2.7 and 3.1
  points; the largest single jump was iter0 to iter1 (2.0 and 2.3). On
  HumanEval(+), MBPP(+) and BigCodeBench, averages rose 2.7 and 4.5. On
  MultiPL-E, despite Python-only training, averages rose 1.0 and 2.1.


  Evidence includes an ablation removing each ACR module (both hurt, the
  2-turn critique data more), a scoring-system check where best-scored code
  beat worst-scored by 15.8 and 8.6 on HumanEval+, and a TLI leakage analysis
  showing 3 baseline datasets contaminated on HumanEval(+)/MBPP(+), which
  complicates the headline comparison.


  Only 2 base models, 1 judge model, Python-only training data, no
  matched-compute distillation baseline, and no test on math or other
  reasoning tasks.


  If you fine-tune code models, self-sampling plus critique is worth trying
  before scaling teacher distillation.
