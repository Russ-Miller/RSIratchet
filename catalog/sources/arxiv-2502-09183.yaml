brief: >-
  Replacing teacher-distilled code answers with a model's own samples plus a
  teacher critique of those samples improves one-shot code generation more
  than imitating the teacher directly, and the gains compound over iterations.


  Adaptive Critique Refinement (ACR) samples 7 responses at temperature 0.7,
  scores them with Qwen2.5-32B-Instruct as judge plus a code executor, and
  either replaces the original teacher answer with the winning self-generated
  one or builds 2-turn data where the model's loser is critiqued against the
  teacher answer. Base models were DSCoder-6.7B and Qwen2.5-Coder-7B,
  retrained from scratch each round on an 80K GPT-4o-built Python set, over 3
  iterations.


  Average pass@1 rose 2.7 and 3.1 points on LiveCodeBench plus
  BigCodeBench-hard, and 2.7 and 4.5 points on
  HumanEval(+)/MBPP(+)/BigCodeBench, with the largest single jump from Iter0
  to Iter1 (2.0 and 2.3). MultiPL-E averages gained 1.0 and 2.1 despite
  Python-only training.


  Ablating either the single-turn or the 2-turn critique module lowered
  performance at every iteration, with the 2-turn critique mattering more; the
  scoring system was checked separately (best-vs-worst of 10 samples, error
  rates 3.1-5.8). Baselines are not matched on data or teacher, and 2 of them
  train on datasets the authors show leak into HumanEval(+)/MBPP(+), which
  complicates the comparison.


  Math and other reasoning domains were not tested, and ACR still needs a
  supplied instruction set.


  If you fine-tune code models, self-sampling with critique is a cheaper
  alternative to more distillation.
