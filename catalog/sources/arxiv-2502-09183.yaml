brief: >-
  Replacing teacher-distilled code answers with the model's own best sample,
  plus a teacher critique when the self-sample loses, improves one-shot code
  generation beyond plain distillation on the same instructions.


  Adaptive Critique Refinement (ACR) samples 7 responses at temperature 0.7,
  ranks them with an LLM-as-a-Judge plus code executor, and either replaces
  the original answer with the winning self-generated one or builds 2-turn
  data where Qwen2.5-32B-Instruct critiques the losing self-sample. Applied
  for 3 iterations to DSCoder-6.7B-Base and Qwen2.5-Coder-7B-Base on an 80K
  GPT-4o-built Python instruction set.


  Average Pass@1 on LiveCodeBench and BigCodeBench-hard rose 2.7 and 3.1
  points; on HumanEval(+), MBPP(+) and BigCodeBench, 2.7 and 4.5. Most of the
  gain lands at Iter0 to Iter1 (2.0 and 2.3). MultiPL-E averages improved 1.0
  and 2.1 despite Python-only training.


  Data size is held fixed at 80K across iterations, and ablating either the
  single-turn or the 2-turn critique branch lowers scores, with the 2-turn
  removal costing more. HumanEval(+) still trails the strongest baselines; the
  authors attribute this to contamination in 3 baseline datasets using the TLI
  metric, which is an argument about leakage, not a controlled comparison. 2
  model families, 1 judge model, no preference-learning baseline at matched
  compute.


  If you distill code SFT data, re-ranking against self-samples is a cheap
  second pass worth trying.
