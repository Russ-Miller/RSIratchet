brief: >-
  Replacing teacher-distilled code responses with the model's own best sample,
  plus a written critique when the teacher's answer still wins, beats plain
  distillation on the same instruction set. Adaptive Critique Refinement (ACR)
  rewrites the SFT dataset each round rather than adding data.


  The pipeline samples 7 responses at temperature 0.7, scores them with
  Qwen2.5-32B-Instruct as judge plus a code executor, compares the best
  against the original GPT-4o response, and either swaps in the self-generated
  winner or builds 2-turn critique data. DSCoder-6.7B-Base and
  Qwen2.5-Coder-7B-Base were fine-tuned from scratch on an 80K Python set for
  3 iterations.


  Average pass@1 on LiveCodeBench and BigCodeBench-hard rose 2.7 and 3.1
  points; on HumanEval(+), MBPP(+) and BigCodeBench, 2.7 and 4.5. The largest
  single jump was iter0 to iter1 (2.0 and 2.3). MultiPL-E, never trained on,
  gained 1.0 and 2.1.


  Ablating either the single-turn or the 2-turn critique branch lowered scores
  at every iteration, with the critique data mattering more. Data size is held
  at 80K across iterations, so the gain is not extra data. A TLI leakage
  analysis shows 3 baseline datasets contaminate HumanEval(+)/MBPP(+), which
  the authors use to explain their deficit there.


  Only 2 base models, 1 judge model, Python-only training, and no math or
  non-code reasoning tests. If you distil code SFT data, iterating on
  self-samples is worth a run.
