brief: >-
  Replacing a teacher's code answers with the model's own best sample, plus a
  critique of the model's answer when the teacher's is better, beats plain
  distillation on the same instruction set. Adaptive Critique Refinement (ACR)
  rewrites an SFT dataset each round: sample 7 responses at temperature 0.7,
  score them with Qwen2.5-32B-Instruct as judge plus a code executor,
  pairwise-compare the best self-sample against the teacher response, and
  either keep the self-sample as single-turn data or build 2-turn critique
  data.


  Starting from an 80K GPT-4o-built Python set, DSCoder-6.7B-Base and
  Qwen2.5-Coder-7B-Base were fine-tuned from scratch for 3 iterations. Average
  pass@1 on LiveCodeBench and BigCodeBench-hard rose 2.7 and 3.1 points; on
  HumanEval(+)/MBPP(+)/BigCodeBench, 2.7 and 4.5 points. Most of the gain
  lands at iter0 to iter1 (2.0 and 2.3). MultiPL-E, out of distribution,
  improved 1.0 and 2.1.


  Evidence includes an ablation removing each critiquing module (both hurt,
  the 2nd-turn critique more), and a leakage check: baselines using
  Magic-Evol-Instruct, Evol-CodeAlpaca-v1 and Code-FeedBack show high TLI on
  HumanEval(+)/MBPP(+), which is offered as why RefineCoder trails them there.
  The judge itself was only validated by best-vs-worst sample gaps (76.2 vs
  60.4 on HumanEval+) with 3.1-5.8 error rates.


  Limits: 2 base models near 7B, Python-only training, 3 iterations, no math
  or other reasoning domains, and no matched-compute distillation baseline.
