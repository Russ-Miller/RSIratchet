brief: >-
  Training a code model on its own best samples, plus a critique of them when
  the teacher's answer wins, beats plain distillation of teacher responses at
  the same data size. The gains accumulate over repeated rounds rather than
  saturating after 1.


  Adaptive Critique Refinement (ACR) samples 7 responses at temperature 0.7,
  scores them with Qwen2.5-32B-Instruct as judge plus a code executor, then
  either replaces the dataset entry with the winning self-generated response
  or builds 2-turn data where the model's weaker code is followed by a
  critique and the teacher answer. Applied for 3 iterations to
  DSCoder-6.7B-Base and Qwen2.5-Coder-7B-Base on an 80K GPT-4o-built Python
  SFT set.


  Average pass@1 rises 2.7 and 3.1 points on LiveCodeBench plus
  BigCodeBench-hard, and 2.7 and 4.5 points on
  HumanEval(+)/MBPP(+)/BigCodeBench, with 80K data versus 130K-185K for
  baselines. MultiPL-E gains 1.0 and 2.1 points despite Python-only training.


  Ablations remove each module per iteration and both hurt, with the 2-turn
  critique data mattering more. Data size is held fixed across iterations, so
  the comparison is matched. Judge and critic are the same model family used
  for scoring and selection, and no DPO or CodeLutra baseline is run.
  Baselines were partly taken from leaderboards; the authors attribute their
  HumanEval(+) shortfall to leakage in 3 baseline datasets, measured by TLI.


  Only 2 base models, 7B scale, code tasks; math is untested.
