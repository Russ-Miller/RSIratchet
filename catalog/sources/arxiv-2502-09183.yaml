brief: >-
  Replacing teacher-distilled code answers with the model's own best sample,
  plus a teacher critique when the sample loses, keeps improving a code model
  across retraining rounds, where plain distillation plateaus.


  Adaptive Critique Refinement (ACR) samples 7 responses at temperature 0.7,
  scores them with Qwen2.5-32B-Instruct as judge plus a code executor,
  compares the best against the original GPT-4o response, and rewrites the
  dataset: a single-turn example when the self-generated code wins, a 2-turn
  (loser, critique, winner) example when it loses. Applied for 3 iterations to
  DSCoder-6.7B-Base and Qwen2.5-Coder-7B-Base on an 80K Python SFT set.


  Average pass@1 on LiveCodeBench and BigCodeBench-hard rose 2.7 and 3.1
  points; on HumanEval(+)/MBPP(+)/BigCodeBench, 2.7 and 4.5. The largest jump
  is iter0 to iter1 (2.0 and 2.3). MultiPL-E, out of distribution, gained 1.0
  and 2.1.


  Ablations removing either the single-turn or the critique branch at each
  iteration both hurt, with the 2-turn critique mattering more. HumanEval(+)
  and MBPP+ remain below the strongest baselines; the authors attribute this
  to n-gram leakage in 3 baseline datasets (TLI 43.20, 47.04, 30.50 on
  HumanEval(+) vs 4.97 for theirs) rather than running a clean head-to-head.


  Only 2 base models, 1 judge model, no matched-compute distillation control,
  and no test outside code. If you distill code SFT data, a
  self-sample-plus-critique rewrite loop is worth 1 run.
