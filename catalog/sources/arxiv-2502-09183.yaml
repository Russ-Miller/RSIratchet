brief: >-
  Training a code model on its own best samples, plus a critique of those
  samples when they lose to the teacher's answer, beats fine-tuning on
  distilled teacher code directly. The gain compounds over iterations with no
  change in data size.


  Adaptive Critique Refinement (ACR) samples 7 responses at temperature 0.7,
  scores them with Qwen2.5-32B-Instruct as judge plus a code executor,
  compares the best against the original teacher answer, and either replaces
  the datum with the self-generated winner or builds a 2-turn item containing
  the losing self-code and a critique. Applied for 3 iterations to
  DSCoder-6.7B-Base and Qwen2.5-Coder-7B-Base over an 80K GPT-4o-built Python
  SFT set.


  Average pass@1 rose 2.7 and 3.1 on LiveCodeBench and BigCodeBench-hard, and
  2.7 and 4.5 on HumanEval(+)/MBPP(+)/BigCodeBench, with the largest single
  jump at iter0 to iter1 (2.0 and 2.3). MultiPL-E, out of distribution from
  Python-only training, improved 1.0 and 2.1.


  Ablating either the single-turn or 2-turn critique component lowers
  performance at every iteration, with the 2-turn critique mattering more.
  Baseline comparisons are confounded by data leakage, which the authors
  measure with TLI and address rather than ignore; HumanEval(+) remains below
  the strongest baseline.


  Not tested on math or other reasoning tasks, and the method still needs a
  high-quality instruction seed set.
