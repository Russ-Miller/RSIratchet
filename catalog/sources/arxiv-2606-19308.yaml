summary: >-
  Large language model (LLM)-based multi-agent systems (MAS) have
  demonstrated great potential in solving tasks with execution complexity,
  by distributing subtasks across cooperative agents. However, this
  divide-and-conquer paradigm falls short on decision-making tasks that are
  also prevalent in the real world. These tasks require simultaneous
  reasoning from the stances of all involved stakeholders whose decisions
  are mutually dependent and thus cannot be solved in isolation. We
  characterize this challenge as stance entanglement, a form of decision
  complexity distinct from execution complexity.
