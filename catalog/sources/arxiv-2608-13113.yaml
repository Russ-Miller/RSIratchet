summary: >-
  Recent advances in Multimodal Large Language Models (MLLMs) have led to
  substantial progress in video understanding, accompanied by a growing
  number of long video benchmarks. However, existing benchmarks rely
  predominantly on web-sourced videos that lack inter-clip spatiotemporal
  continuity, making it difficult to assess whether models can maintain
  consistent memory across days or weeks of real-world experience. We
  introduce EgoMonth, the first month-level egocentric video understanding
  benchmark. EgoMonth comprises over 300 hours of first-person daily-life
  recordings from 20 participants span
