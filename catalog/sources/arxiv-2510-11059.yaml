summary: Automated Program Repair (APR) plays a critical role in enhancing the
  quality and reliability of software systems. While substantial progress has
  been made in Java-based APR, largely facilitated by benchmarks like
  Defects4J, there remains a significant gap in research on C/C++ program
  repair, despite the widespread use of C/C++ and the prevalence of associated
  vulnerabilities. This gap is primarily due to the lack of high-quality,
  open-source benchmarks tailored for C/C++. To address this issue, we
  introduce Defects4C, a comprehensive and executable benchmark specifically
  designed for C/C++ pr
ingested_at: 2026-09-19
brief: >-
  LLM program repair ability on Java and on contest-style C/C++ does not
  transfer to real-world C/C++ code. On Defects4C, GPT-3.5-Turbo fixes 8.5% of
  bugs and GPT-4 9.0% at pass@1, against 94.0 and 93.0 on CodeFlaws and 59.0
  and 74.6 on DebugBench for the same 2 models.


  Defects4C is built from 38 million keyword-filtered GitHub commits, narrowed
  to 9M valid bug-relevant commits, 76K single-function commits, then 3,785
  with bug-revealing tests, then human-verified to 248 buggy functions and 102
  CVE-derived vulnerable functions across 41 projects, each with executable
  tests in a Docker harness.


  Across 24 pre-trained LLMs in single-round and conversation-based repair,
  the best conversational result is 27/248 bugs (10.88%) and 7/102
  vulnerabilities (6.86%), versus 29.80/51.30/71.30 function/hunk/line rates
  reported for Defects4J. LoRA fine-tuning on the commit corpus helped in 21
  of 28 cases, average relative gain 84.89%, but the best fine-tuned pass@1 is
  4.92.


  Evidence is measured, with test-based validation and decontamination at 0.95
  cosine similarity; annotation agreement reached Cohen's kappa 0.88. GPT-4
  was capped at 2 repair attempts versus 10 for others, so its conversational
  numbers are not budget-matched. Only single-function defects are covered;
  multi-function and cross-file bugs are untested.


  Treat existing C/C++ repair scores on contest benchmarks as uninformative
  about production code.
