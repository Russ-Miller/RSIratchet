brief: >-
  LLM program repair performance on C/C++ collapses when the bugs come from
  real projects rather than contest or assignment code. On DebugBench
  (LeetCode) GPT-4 reaches 74.6 pass@1 and on CodeFlaws 93.0, but on
  real-world C/C++ functions it reaches 9.0.


  Defects4C was built from 38M+ keyword-filtered GitHub commits, narrowed to
  9M valid bug-relevant commits, 76K single-function commits, then
  human-annotated into 248 confirmed bugs and 102 CVE-linked vulnerable
  functions, each with a bug-revealing test case (fails pre-commit, passes
  post-commit). 24 pre-trained LLMs were evaluated in single-round and
  conversation-based repair; 2 open models were LoRA fine-tuned on 20,591
  decontaminated commit pairs.


  Conversation-based repair fixed at best 27/248 bugs (10.88%) and 7/102
  vulnerabilities (6.86%), against reported Defects4J rates of 29.80
  (function), 51.30 (hunk), 71.30 (line). Fine-tuning helped in 21 out of 28
  cases, average relative improvement 84.89%, but best pass@1 was still 4.92.
  Scaling did not help monotonically: CodeLlama-Python pass@100 went 22.5 to
  32.2 to 29.8 across 7B/13B/34B, with ~19% of CodeLlama-Instruct-34B outputs
  truncated by the 2048-token limit.


  Evidence is measured with executable tests, and failure patterns were
  hand-labelled (52.0% long/multi-hunk, 28.4% missing external context). The
  Defects4J comparison is imported from prior work, not rerun; GPT-4 got only
  2 repair attempts versus 10 for others; only single-function bugs are
  covered.


  Treat contest-derived C/C++ repair scores as near-useless predictors of
  real-project repair.
