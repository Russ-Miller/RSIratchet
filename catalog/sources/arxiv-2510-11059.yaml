brief: >-
  LLM program repair success on Java benchmarks does not carry over to
  real-world C/C++ code. On Defects4C, a new executable benchmark of 248
  human-verified buggy functions and 102 CVE-linked vulnerable functions from
  41 real projects, each paired with bug-revealing unit tests, plus 9M
  bug-relevant commits for fine-tuning.


  24 pre-trained LLMs were evaluated in single-round and conversation-driven
  repair (up to 10 attempts x 3 turns), with fine-tuning tested on
  CodeLlama-7B and DeepSeek-Coder-6.7B.


  GPT-4 reached 9.0 pass@1 and GPT-3.5-Turbo 8.5, versus 59.0 and 74.6 for
  GPT-3.5/GPT-4 on DebugBench and 94.0/93.0 on CodeFlaws. Conversation-driven
  repair fixed 10.88% of bugs and 6.86% of vulnerabilities; Defects4J rates
  under the same protocol were 29.80 (function), 51.30 (hunk), 71.30 (line).
  Scaling did not help monotonically: CodeLlama-Python pass@100 went 22.5 (7B)
  to 32.2 (13B) to 29.8 (34B), partly because ~19% of CodeLlama-Instruct-34B
  outputs overran the 2048-token limit. LoRA fine-tuning improved 21 of 28
  pass@k cells by 84.89% on average, but the best pass@1 was still 4.92.


  Evidence is a measured cross-benchmark comparison, though the Defects4J
  numbers are copied from prior work rather than rerun, GPT-4's attempt budget
  was cut to 2, and only 2 models were fine-tuned. Restricted to
  single-function fixes; multi-function and cross-file defects were excluded.
  Failure analysis on 1 model attributes 52.0% of vulnerability failures to
  long/multi-hunk patches and 28.4% to missing external context.


  Treat Java repair scores as a poor predictor of C/C++ repair.
