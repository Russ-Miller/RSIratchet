summary: Automated Program Repair (APR) plays a critical role in enhancing the
  quality and reliability of software systems. While substantial progress has
  been made in Java-based APR, largely facilitated by benchmarks like
  Defects4J, there remains a significant gap in research on C/C++ program
  repair, despite the widespread use of C/C++ and the prevalence of associated
  vulnerabilities. This gap is primarily due to the lack of high-quality,
  open-source benchmarks tailored for C/C++. To address this issue, we
  introduce Defects4C, a comprehensive and executable benchmark specifically
  designed for C/C++ pr
ingested_at: 2026-09-19
brief: >-
  LLM program repair ability on Java and contest-style C/C++ does not transfer
  to real-world C/C++ code. Pass@1 for GPT-3.5-Turbo drops from 94.0 on
  CodeFlaws and 59.0 on DebugBench to 8.5 on real-world bugs.


  Defects4C is built from 38 million keyword-filtered GitHub commits, narrowed
  to 9 million valid bug-relevant commits, 76K single-function commits, then
  test-matched and human-annotated into 248 confirmed bugs and 102 CVE-derived
  vulnerabilities across 41 projects, each with a bug-revealing unit test and
  a Docker-backed CLI for patch verification. 24 pre-trained LLMs were
  evaluated in single-round and conversation-based repair, plus LoRA
  fine-tuning of CodeLlama-7B and DeepSeek-Coder-6.7B on 20,591 decontaminated
  commit pairs.


  Conversation-based repair tops out at 27/248 bugs (10.88%) and 7/102
  vulnerabilities (6.86%), against 29.80-71.30 on Defects4J for the same
  method. Function-level fixes are near zero for every model. Fine-tuning
  helped in 21 of 28 cases, average relative gain 84.89%, but best pass@1
  remained 4.92. Larger models were not better: CodeLlama-Python pass@100 went
  22.5 to 32.2 to 29.8 across 7B/13B/34B, partly from 2048-token truncation
  (about 19% of CodeLlama-Instruct-34B outputs incomplete).


  Comparison with Defects4J is cross-paper, not rerun, and GPT-4 got only 2
  attempts versus 10 for others; contamination was argued away, not tested.
  Only single-function, single-commit defects are included.


  Treat high repair scores on contest-derived C/C++ sets as uninformative
  about real codebases.
