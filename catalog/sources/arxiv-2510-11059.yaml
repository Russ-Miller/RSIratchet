brief: >-
  LLM program repair performance on C/C++ collapses once bugs come from real
  projects rather than contest or assignment code. Defects4C contains 248
  human-confirmed buggy functions and 102 CVE-derived vulnerable functions
  from 41 real-world repositories, each paired with a bug-revealing test case,
  plus 9 million bug-relevant commits for fine-tuning.


  24 pre-trained LLMs were evaluated in single-round and conversation-based
  repair. GPT-3.5-Turbo scores 94.0 pass@1 on CodeFlaws and 59.0 on DebugBench
  but 8.5 on Defects4C; GPT-4 drops to 9.0, CodeLlama-34b-Instruct to 4.0. In
  conversation-based repair with up to 10 attempts, the best models fix 27/248
  general bugs (10.88%) and 7/102 vulnerabilities (6.86%), against reported
  Defects4J rates of 29.80 (function), 51.30 (hunk) and 71.30 (line).
  Function-level C/C++ fixes are near-zero for most models. LoRA fine-tuning
  on 20,591 decontaminated commits helped in 21 of 28 cases, average relative
  gain 84.89%, but best pass@1 remained 4.92.


  The cross-benchmark gap is measured, not argued, with matched prompts and
  attempt budgets, though GPT-4 was capped at 2 attempts and evaluated
  greedily, so its numbers understate it. Failure analysis is manual and on 1
  model: 52.0% long/multi-hunk patches, 28.4% missing external context.


  Only single-function bugs are covered; cross-file defects are untested.


  Treat reported C/C++ repair rates from contest-derived benchmarks as
  uninformative about real code.
