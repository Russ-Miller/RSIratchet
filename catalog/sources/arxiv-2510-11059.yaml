brief: >-
  LLM program repair performance on contest-style C/C++ bugs does not transfer
  to real-world C/C++ code. On DebugBench (LeetCode) GPT-4 reaches 74.6 pass@1
  and on CodeFlaws 93.0, but on real-world functions it drops to 9.0.


  Defects4C is an executable benchmark built from 38M+ keyword-filtered GitHub
  commits, narrowed to 9M valid bug-relevant commits, 76K single-function
  commits, then 3,785 with bug-revealing tests, and finally 248
  human-confirmed buggy functions plus 102 CVE-derived vulnerable functions
  across 41 projects. 24 pre-trained LLMs were run in single-round and
  conversation-based repair; 2 models were LoRA fine-tuned on 20,591
  decontaminated commit pairs.


  Best conversation-based results fix 27/248 bugs (10.88%) and 7/102
  vulnerabilities (6.86%), against 29.80/51.30/71.30 reported for Defects4J at
  function/hunk/line granularity. Fine-tuning raised pass@k in 21 of 28 cases,
  average relative improvement 84.89%, but best pass@1 is still 4.92. Scale
  does not help monotonically: CodeLlama-Python pass@100 goes 22.5 (7B), 32.2
  (13B), 29.8 (34B), with ~19% of CodeLlama-Instruct-34B outputs truncated at
  2048 tokens.


  The gap is measured, though the Defects4J comparison is borrowed from prior
  work rather than re-run, GPT-4 got only 2 repair attempts versus 10 for
  others, and contamination is argued away rather than tested. Only
  single-function fixes are covered; multi-file defects are excluded. Failure
  analysis on 1 model attributes 52.0% of vulnerability failures to
  long/multi-hunk patches.


  Treat existing C/C++ repair numbers as inflated by benchmark simplicity.
