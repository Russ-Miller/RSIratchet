brief: >-
  LLM program repair success on C/C++ collapses when the bugs come from real
  projects rather than contest or assignment code. On DebugBench (LeetCode)
  GPT-4 reaches 74.6 pass@1 and on CodeFlaws 93.0, but on real-world C/C++
  functions it reaches 9.0.


  Defects4C was built from GitHub commits in 110,441 candidate C/C++ repos,
  filtered from 38 million keyword-matched commits down to 9 million valid
  ones, 76K single-function commits, and finally 248 human-confirmed bugs plus
  102 CVE-linked vulnerable functions, each paired with a bug-revealing test
  that fails pre-commit and passes post-commit. 24 pre-trained LLMs were run
  in single-round and conversation-based repair; 2 open models were LoRA
  fine-tuned on 20,591 decontaminated commit pairs.


  Conversation-based repair fixed at best 10.88% of bugs and 6.86% of
  vulnerabilities, against 29.80 / 51.30 / 71.30 reported for Defects4J at
  function/hunk/line granularity. Fine-tuning helped in 21 of 28 cases,
  average relative gain 84.89%, yet the best pass@1 was 4.92. Scale did not
  help monotonically: CodeLlama-Python pass@100 went 22.5 (7B), 32.2 (13B),
  29.8 (34B), partly because ~19% of CodeLlama-Instruct-34B outputs overran
  the 2048-token limit.


  Evidence is measured with executable tests and a 3-round annotation process
  reaching Cohen's kappa 0.88, but the Defects4J comparison is borrowed from
  prior work rather than rerun, GPT-4 got only 2 repair attempts against 10
  for others, and fine-tuning covers 1 setup on 2 models. Only single-function
  bugs are included; multi-function and cross-file defects are untested. Treat
  published Java repair rates as a poor guide to C/C++ performance.
