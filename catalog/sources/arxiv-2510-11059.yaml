brief: >-
  LLM program repair ability on Java and contest-style C/C++ does not transfer
  to real-world C/C++ code. On Defects4C, GPT-3.5-Turbo repairs 8.5% of bugs
  at pass@1 and GPT-4 9.0%, against 59.0 and 74.6 on DebugBench and 94.0 and
  93.0 on CodeFlaws.


  Defects4C is built from 38 million keyword-filtered GitHub commits, narrowed
  to 9M valid bug-relevant commits, 76K single-function commits, then 3,785
  with bug-revealing tests, then human-annotated down to 248 confirmed bugs
  and 102 CVE-derived vulnerabilities across 41 real projects, each with
  executable tests and a Docker-backed CLI. 24 pre-trained LLMs were tested in
  single-round and conversation-based repair.


  Best conversation-based results: 27/248 bugs (10.88%) and 7/102
  vulnerabilities (6.86%), versus 29.80/51.30/71.30 function/hunk/line rates
  reported for Defects4J. Scaling does not help monotonically:
  CodeLlama-Python pass@100 goes 22.5 (7B), 32.2 (13B), 29.8 (34B), partly
  because ~19% of CodeLlama-Instruct-34B outputs overran the 2048-token limit.
  LoRA fine-tuning on Defects4C_bgcommit improved 21 of 28 pass@k cells,
  average relative gain 84.89%, but best pass@1 is still 4.92.


  Evidence is measured, with decontamination at 0.95 cosine similarity and
  annotator Cohen's kappa rising 0.48 to 0.88. Caveats: the Defects4J
  comparison is cross-paper, not rerun; GPT-4 got only 2 repair attempts
  versus 10 for others; fine-tuning covers 2 models; only single-function
  defects are included.


  Treat prior C/C++ repair numbers from contest benchmarks as uninformative
  about real code.
