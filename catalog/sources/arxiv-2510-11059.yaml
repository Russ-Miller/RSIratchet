brief: >-
  Code LLMs that repair most Java bugs and nearly all contest-style C/C++ bugs
  fail on real-world C/C++ defects, fixing roughly 1 in 10.


  Defects4C is an executable C/C++ repair benchmark built from GitHub commits
  and CVE records: 9M bug-relevant commits for training, plus 248
  human-confirmed buggy functions and 102 vulnerable functions, each paired
  with a bug-revealing test case, across 41 real projects. 24 pre-trained LLMs
  were evaluated in single-round repair (pass@1/10/100) and conversation-based
  repair with compiler and test feedback, up to 10 attempts x 3 turns.


  Pass@1 on Defects4C is 8.5 for GPT-3.5-Turbo and 9.0 for GPT-4, against 59.0
  and 74.6 on DebugBench and 94.0 and 93.0 on CodeFlaws. Conversation-based
  repair fixes at most 10.88% of bugs and 6.86% of vulnerabilities, versus
  29.80/51.30/71.30 function/hunk/line rates reported for Defects4J. LoRA
  fine-tuning on the commit corpus helped in 21 of 28 cases (84.89% average
  relative gain) but topped out at 4.92 pass@1. Scale did not help
  monotonically: CodeLlama-Python pass@100 rises 22.5 to 32.2 from 7B to 13B,
  then drops to 29.8 at 34B, partly because ~19% of CodeLlama-Instruct-34B
  outputs overran the 2048-token limit.


  Measured, not argued, with a decontamination step and matched prompts; the
  Defects4J comparison is borrowed from prior work rather than re-run, and
  GPT-4's conversation budget was cut to 2 attempts. Only single-function
  fixes are covered; multi-function and cross-file defects are excluded, and
  failure analysis attributes 52.0% of vulnerability failures to
  long/multi-hunk patches.


  Treat strong Java or LeetCode repair numbers as no evidence about systems
  C/C++.
