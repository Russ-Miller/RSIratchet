brief: >-
  LLM program repair scores on C/C++ collapse when the bugs come from real
  projects rather than contest or assignment code. On DebugBench (LeetCode)
  GPT-4 reaches 74.6 pass@1 and on CodeFlaws 93.0, but on real-world C/C++
  functions it reaches 9.0.


  Defects4C is built from 38M keyword-filtered bug commits across 110,441
  GitHub C/C++ repos, narrowed to 9M valid commits, 76K single-function
  commits, then human-annotated into 248 confirmed bugs and 102 CVE-derived
  vulnerabilities, each with a bug-revealing test (passes post-fix, fails
  pre-fix). 24 LLMs were evaluated in single-round and conversation-driven
  repair.


  Best conversation-based results fix 27/248 bugs (10.88%) and 7/102
  vulnerabilities (6.86%), against reported Defects4J rates of 29.80
  (function), 51.30 (hunk), 71.30 (line). Scaling does not help monotonically:
  CodeLlama-Python pass@100 goes 22.5 (7B) to 32.2 (13B) to 29.8 (34B), partly
  because ~19% of CodeLlama-Instruct-34B outputs overrun the 2048-token limit.
  LoRA fine-tuning on Defects4C_bgcommit improves 21 of 28 pass@k cells,
  average relative gain 84.89%, but best pass@1 is still 4.92.


  The cross-benchmark Defects4J comparison is imported from prior work, not
  rerun, and GPT-4 got only 2 repair attempts versus 10 for others, so its
  conversation numbers are not budget-matched. Fine-tuning covers 2 model
  families. Only single-function bugs are included; cross-file defects are
  untested. Annotated failure patterns: 52.0% long/multi-hunk, 28.4% missing
  external context.


  Treat existing C/C++ repair scores from contest-derived benchmarks as
  uninformative about real code.
