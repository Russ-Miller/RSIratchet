brief: >-
  LLM program repair ability on Java and contest-style C/C++ does not transfer
  to real-world C/C++ code: repair rates fall by roughly an order of
  magnitude.


  Defects4C is built from 38+ million keyword-filtered GitHub commits,
  narrowed to 9 million valid bug-relevant commits, 76K single-function
  commits, then 3,785 test-paired candidates, and finally 248 human-confirmed
  bugs plus 102 CVE-derived vulnerable functions, each with a test that fails
  pre-fix and passes post-fix. 24 pre-trained LLMs were evaluated in
  single-round and conversation-based repair, plus LoRA fine-tuning of
  CodeLlama-7B and DeepSeek-Coder-6.7B.


  GPT-3.5-Turbo scores 94.0 pass@1 on CodeFlaws and 8.5 on Defects4C; GPT-4
  drops from 74.6 on DebugBench to 9.0. Conversation-based repair fixes at
  best 27/248 bugs (10.88%) and 7/102 vulnerabilities (6.86%), against
  29.80–71.30 rates reported for Defects4J. Fine-tuning helped in 21 of 28
  cases, average relative gain 84.89%, but the best pass@1 was still 4.92.


  The gap is measured, with matched prompts across benchmarks, though the
  Defects4J comparison is imported from prior work rather than rerun. Scope is
  single-function fixes only; multi-function and cross-file defects are
  excluded, and training-pair quality was not manually verified.


  Treat Java APR numbers as a poor predictor of C/C++ repair performance.
