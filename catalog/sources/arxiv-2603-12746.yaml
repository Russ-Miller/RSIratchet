brief: >-
  Multimodal models that do well on static spatial reasoning do not carry that
  over to tracking objects through time, and chain-of-thought prompting barely
  helps; feeding them structured spatial/motion descriptions or mask-fused
  frames does.


  Dyn-Bench draws 1000 videos, 7000 multiple-choice VQA pairs, and 3000
  dynamic-object grounding annotations from 4 2D segmentation and 4 4D
  dynamic-scene datasets, covering inter-object perception, object-scene
  tracking, and camera-object reasoning. General, spatial, and region-level
  MLLMs were run zero-shot, graded by accuracy and J&F.


  Against a 25.0 random chance level, the best model, Qwen3-VL-235B, reaches
  65.3 average; Gemini-2.5 Pro 59.8, GPT-5 59.5, GPT-4o 50.1. Spatial models
  top out at 56.5 (SpaceR-7B), weakest on camera-object interaction. Adding
  all 3 ST-TCM components lifts Qwen3-VL-32B from 62.8 to 68.3 average and
  Sa2VA-InternVL2.5-8B grounding from 71.9 to 77.3 J&F. Mask-Guided Fusion
  raises Qwen3-VL-8B from 53.8 to 57.1, while masks alone leave it at 53.8.


  The component ablation is clean and isolates spatial and motion cues as the
  active ingredients, but the intervention tests use 1 model per paradigm,
  with no matched token-budget baseline against the longer ST-TCM prompts.
  Grounding is only measured on region-level models. Error analysis of GPT-4o
  rests on case studies rather than counts.


  If you are evaluating video reasoning, test grounding and reasoning jointly;
  current models trade one for the other.
