brief: >-
  Current vision-language models cannot reliably read software architecture
  diagrams: the best model answers only 70.18% of counting and retrieval
  questions about entities, relations, and clusters.


  SADU pairs 154 curated diagrams (51 behavioral, 53 structural, 50 ER, drawn
  from Azure docs, PyUNML, and diagram-design platforms) with hand-written
  JSON ground truth (about 160 human hours) and 2,431 template-generated QA
  pairs across 24 subtypes. 11 models from Gemini, Claude, GPT, and Qwen were
  run at temperature 0 with exact-match scoring plus an LLM judge.


  gemini-3-flash-preview leads at 70.18%, gemini-2.5-flash 69.68%,
  claude-sonnet-4.5 56.36%, gpt-5-nano 55.45%, gpt-4o-mini 17.77%,
  qwen-2.5-VL-32B/7B/3B 45.17%/38.58%/31.30%. ER diagrams are easiest,
  behavioral hardest. Accuracy falls as entity and relation counts rise.
  gpt-5-nano spends 1475.19 completion tokens on average without beating
  Gemini. Raising gemini-3-flash-preview's thinking level from low (72.85%) to
  high (69.77%) hurts; 470 manually coded cases show task confusion and scope
  inflation.


  Effects are measured, with prompt ablations (removing definitions costs more
  than removing format rules) and a constructed hard set of 15 cases per arrow
  pattern where overlap arrows top out at 33.33%. Prompt and thinking
  ablations cover Gemini only; the hard set is small and the judge is gpt-5.4
  scoring its peers.


  Treat diagram-grounded design tasks as unsolved, and do not assume more
  reasoning tokens help.
