brief: >-
  Multimodal instruction-following benchmarks largely test the text backbone:
  responses generated without the image still pass their checks. VC-IFEval
  rebuilds the test around constraints that can only be satisfied by looking
  at the picture, and current models do poorly on it.


  The benchmark is 300 curated image-task-constraint pairs, scored by a hybrid
  of GPT-4o direct constraint judging and a comparative check that regenerates
  each response with the image removed, to detect reliance on linguistic
  priors. Training data from the same pipeline is VC-IFInstruct-10k (SFT) and
  VC-IFDPO-10k (preference pairs built by ablating constraints or editing the
  image).


  Qwen2.5-VL-Instruct-32B reaches only 67.3% on VC-IFEval.
  Qwen2.5-VL-7B-Instruct goes 57.3 to 63.0 with SFT and 66.1 with DPO;
  LLaVA-NeXT-Llama3-8B goes 50.1 to 53.3 to 60.2. Gains on MM-IFEval and
  IFEval are small, and VQA scores (MMBench, MMVet, POPE) move little in
  either direction.


  Evidence includes a matched comparison against MM-IFEngine data (60.1/61.2
  vs 63.0/66.1), a DPO-construction ablation where image-removal rejected
  responses underperform image editing, and human agreement checks at 90%
  direct, 92% comparative, 86% across judges.


  Only 2 open models, 1 proprietary judge, 300 items. Useful if you suspect
  your multimodal IF numbers are measuring text compliance.
