brief: >-
  Instruction-following benchmarks for multimodal models mostly test the
  language backbone: responses produced without the image still pass the
  compliance check, because constraints are textual patterns rather than
  vision-dependent ones. VC-IFEval puts the constraint in the image.


  The benchmark is 300 curated image-task-constraint pairs spanning 2 major
  and 10 constraint subcategories, scored by a hybrid protocol: GPT-4o judges
  constraint satisfaction directly, and a comparative pass checks whether the
  with-image response beats the no-image response, isolating actual visual
  grounding. Paired datasets VC-IFInstruct-10k (SFT) and VC-IFDPO-10k
  (preference pairs built by constraint ablation and image editing) come from
  the same pipeline.


  Qwen2.5-VL-Instruct-32B reaches only 67.3% on VC-IFEval. Tuning
  Qwen2.5-VL-7B-Instruct lifts it from 57.3 to 63.0 (SFT) and 66.1 (DPO);
  LLaVA-NeXT-Llama3-8B goes 50.1 to 53.3 and 60.2. VQA scores hold roughly
  flat (MMBench 83.2 to 82.8 for Qwen). Training on MM-IFEngine data instead
  reaches 60.1 and 61.2.


  Evidence includes a matched comparison against MM-IFInstruct/MM-IFDPO, a DPO
  construction ablation (constraint removal at -33/-66/-100% gives
  64.4/67.3/68.8, versus 59.3 with no image), and human agreement of 90%
  direct, 92% comparative, 86% across judges. Only 2 model families, 7-8B
  scale, and the judge is GPT-4o throughout.


  If you benchmark multimodal instruction-following, add a no-image control
  before trusting your numbers.
