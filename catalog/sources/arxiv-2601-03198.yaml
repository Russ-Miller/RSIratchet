brief: >-
  Multimodal models can pass existing instruction-following benchmarks without
  looking at the image, because those benchmarks test adherence to textual
  patterns rather than to constraints that depend on visual content.


  VC-IFEval is a 300-item benchmark of image-task-constraint pairs built by a
  generation pipeline (image filtering with IC9600 and RAM, task generation,
  constraint generation from a pool of 2 categories and 10 subcategories),
  then human-refined. Scoring combines GPT-4o constraint judging with a
  comparative score that pits responses generated with the image against
  responses generated without it. Paired training sets VC-IFInstruct-10k (SFT)
  and VC-IFDPO-10k (preference, with rejected answers from instruction
  ablation or image editing) were also built.


  Qwen2.5-VL-Instruct-32B reaches 67.3% on VC-IFEval. Qwen2.5-VL-7B-Instruct
  goes from 57.3 to 63.0 with SFT and 66.1 with DPO; LLaVA-NeXT-Llama3-8B goes
  50.1 to 53.3 to 60.2. VQA scores (MMBench, MMVet, POPE, MMT-Bench) move
  little in either direction. Training on MM-IFEngine data gives 60.1/61.2,
  below the visual-centric data.


  Evidence includes a matched comparison against MM-IFInstruct/MM-IFDPO, a
  DPO-construction ablation (constraint removal at -33%/-66%/-100% beats
  removing images: 68.8 vs 59.3), human agreement of 90% direct and 92%
  comparative, and 86% agreement between GPT and Qwen judges. Only 2 open 7-8B
  models were tuned, and the benchmark rests on an MLLM judge.


  If you evaluate multimodal instruction following, assume current scores
  partly measure the text backbone.
