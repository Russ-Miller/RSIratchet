brief: >-
  Multimodal models can pass instruction-following benchmarks without using
  the image at all, because existing benchmarks encode constraints in text
  that the language backbone alone can satisfy. VC-IFEval tries to close that
  hole by making constraints vision-dependent.


  The benchmark has 300 curated image-task-constraint pairs built by a 3-stage
  pipeline (image filtering with IC9600 and RAM, task generation, constraint
  generation across 2 categories and 10 subcategories). Scoring is hybrid:
  GPT-4o judges constraint satisfaction directly, and a comparative pass
  compares outputs generated with and without the image to isolate whether
  vision was actually used. Two training sets, VC-IFInstruct-10k (SFT) and
  VC-IFDPO-10k (preference pairs built by constraint ablation and image
  editing), accompany it.


  Qwen2.5-VL-Instruct-32B reaches 67.3% on VC-IFEval. Qwen2.5-VL-7B-Instruct
  goes from 57.3 to 63.0 with SFT and 66.1 with DPO; LLaVA-NeXT-Llama3-8B goes
  50.1 to 53.3 to 60.2. VQA scores (MMBench, MMVet, POPE, MMT-Bench) move by
  about a point either way. Training on MM-IFEngine data instead gives
  60.1/61.2, below the VC equivalents.


  Evidence is mid-strength: 2 model families, GPT-4o-as-judge with human
  agreement of 90% (direct) and 92% (comparative) on 400 samples, and 86%
  agreement with a Qwen judge. A DPO ablation shows removing 100% of
  constraints to build rejections works best (68.8) and removing images
  entirely works worst (59.3). No matched-compute baseline against unrelated
  instruction data, and the judge is also from the family being evaluated in
  part.


  Treat prior multimodal IF scores as partly measuring the text backbone.
