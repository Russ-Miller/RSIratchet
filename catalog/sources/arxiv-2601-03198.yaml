brief: >-
  Multimodal instruction-following benchmarks largely test the text backbone:
  responses generated without the image still pass their checks, so reported
  scores overstate visual grounding. VC-IFEval is built to break that, pairing
  images with constraints that cannot be verified by text matching.


  The benchmark has 300 curated image-task-constraint pairs, scored by a
  hybrid of GPT-4o constraint judging and a comparative step that pits the
  model's output with the image against its output without the image. Training
  resources accompany it: VC-IFInstruct-10k for SFT and VC-IFDPO-10k, whose
  rejected responses come from constraint ablation or edited images.


  Qwen2.5-VL-Instruct-32B reaches only 67.3% on VC-IFEval.
  Qwen2.5-VL-7B-Instruct goes 57.3 to 63.0 with SFT and 66.1 with DPO;
  LLaVA-NeXT-Llama3-8B goes 50.1 to 53.3 to 60.2. MM-IFEval and IFEval move
  little, and VQA scores (MMBench, MMVet, POPE) stay roughly flat. Against
  MM-IFEngine data, VC-IFDPO gives 66.1 versus 61.2.


  Evidence includes a DPO ablation: removing 100% of constraints to form
  rejected answers gives 68.8, while dropping the image entirely gives 59.3.
  Human agreement with the automatic judge is 90% direct, 92% comparative, 86%
  across judge models. Only 2 models were tuned, and the judge is the same
  family used to build the data.


  If you report multimodal IF numbers, check whether a blind model would pass.
