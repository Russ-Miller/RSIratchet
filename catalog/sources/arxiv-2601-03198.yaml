brief: >-
  Existing multimodal instruction-following benchmarks can be passed without
  looking at the image, which means they largely test the text backbone rather
  than visual grounding. VC-IFEval is built to close that gap, pairing each
  image with tasks and vision-dependent constraints (spatial relations,
  attributes, style, target restriction) and scoring responses with GPT-4o
  both directly and comparatively against a no-image run, so a model that
  answers from linguistic priors loses credit.


  The benchmark holds 300 curated image-task-constraint pairs.
  Qwen2.5-VL-Instruct-32B reaches only 67.3% on it. Training
  Qwen2.5-VL-7B-Instruct on the matching 10k SFT set lifts VC-IFEval from 57.3
  to 63.0 and the DPO set to 66.1, against 60.1 and 61.2 for MM-IFEngine data;
  LLaVA-NeXT-Llama3-8B moves 50.1 to 53.3 to 60.2. VQA scores (MMBench, MMVet,
  POPE, MMT-Bench) stay roughly flat.


  Effects are measured, with a direct comparison to a prior data pipeline and
  a DPO ablation showing that constructing rejected answers by removing 100%
  of constraints scores 68.8 while dropping the image entirely gives only
  59.3. Human checks: 90% agreement on direct judging, 92% on comparative, 86%
  across judge models, IAA 0.86.


  Only 2 open 7-8B models were tuned, the judge is GPT-4o, and the VQA
  benchmark list is left unfilled in the text. Treat existing multimodal IF
  scores as partly text-only measurements.
