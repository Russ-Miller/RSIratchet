ingested_at: 2026-11-26
brief: >-
  Multimodal instruction-following benchmarks largely test the language
  backbone: models can pass their checks with responses that ignore the image
  entirely. VC-IFEval attacks this by building constraints that only make
  sense against the picture, and by scoring whether removing the image changes
  the answer.


  The pipeline filters images for information density (IC9600, threshold 0.50)
  and saliency (RAM), generates image-grounded tasks, then samples and refines
  constraints across 2 categories and 10 subcategories. It yields
  VC-IFInstruct-10k for SFT, VC-IFDPO-10k for preference learning, and a
  300-pair evaluation set judged by GPT-4o plus a with-image vs without-image
  comparison.


  Qwen2.5-VL-Instruct-32B reaches only 67.3% on VC-IFEval. Fine-tuning
  Qwen2.5-VL-7B-Instruct lifts VC-IFEval from 57.3 to 63.0 (SFT) and 66.1
  (DPO); LLaVA-NeXT-Llama3-8B goes 50.1 to 53.3 and 60.2. Gains on MM-IFEval
  and IFEval are under 2 points. VQA scores (MMBench, MMVet, POPE) move by
  about 1 point either way.


  Evidence includes a matched comparison against MM-IFEngine data (60.1 / 61.2
  vs 63.0 / 66.1), a DPO-construction ablation where constraint removal (68.8)
  beats image removal (59.3), and human checks: 84% of SFT samples valid, 80%
  of preference pairs, IAA 0.86, 90% and 92% judge agreement, 86% across
  evaluators.


  2 model families, 1 data scale, and a GPT-4o judge the authors flag as a
  bias source; real-world tasks untested.


  If you benchmark MLLM instruction-following, check whether your scores
  survive deleting the image.
