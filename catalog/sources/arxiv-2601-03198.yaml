brief: >-
  Multimodal models can pass existing instruction-following benchmarks without
  looking at the image, because the constraints are textual patterns their
  language backbone can satisfy. VC-IFEval tests instructions whose
  constraints depend on the picture, and scores drop.


  The benchmark holds 300 curated image-task-constraint pairs built by a
  3-stage pipeline (image filtering with IC9600 and RAM, task generation,
  constraint generation across 2 categories and 10 subcategories), with human
  refinement and GPT-4o conflict removal. Scoring is hybrid: GPT-4o judges
  constraint satisfaction, and a comparative pass checks whether the response
  with the image beats the response without it. Paired training sets
  VC-IFInstruct-10k (SFT) and VC-IFDPO-10k (preference pairs from constraint
  ablation and image editing) are released.


  Qwen2.5-VL-Instruct-32B reaches 67.3% on VC-IFEval. Qwen2.5-VL-7B-Instruct
  goes 57.3 to 63.0 with SFT and 66.1 with DPO; LLaVA-NeXT-Llama3-8B goes 50.1
  to 53.3 to 60.2. VQA scores (MMBench, MMVet, POPE, MMT-Bench) stay roughly
  flat. Training on MM-IFEngine data instead gives 60.1/61.2 on VC-IFEval.


  Evidence includes a matched comparison against MM-IFInstruct/MM-IFDPO, a
  DPO-construction ablation where removing images entirely gives only 59.3
  versus 68.8 for full constraint removal, and human agreement checks (90%
  direct, 92% comparative, 86% across judges; 400 annotated samples, IAA
  0.86).


  Limits: 2 trained models, GPT-4o as primary judge, no real-world task
  testing.


  If you benchmark multimodal instruction following, check whether your tasks
  survive deleting the image.
