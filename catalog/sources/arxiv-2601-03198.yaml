brief: >-
  Multimodal instruction-following benchmarks that use text-only constraints
  mostly measure the language backbone; when constraints depend on the image,
  models do much worse, and a response generated without the image can still
  pass.


  VC-IFEval is a benchmark of 300 curated image-task-constraint pairs built by
  a 3-stage pipeline (image filtering with IC9600 and RAM, task generation,
  constraint generation across 2 categories and 10 subcategories). Scoring
  combines GPT-4o constraint judging with a comparative check of outputs
  generated with vs without the image. Two training sets, VC-IFInstruct-10k
  (SFT) and VC-IFDPO-10k (preference pairs built by constraint ablation or
  image editing), were used to tune Qwen2.5-VL-7B-Instruct and
  LLaVA-NeXT-Llama3-8B.


  Qwen2.5-VL-Instruct-32B reaches 67.3% on VC-IFEval. The 7B model goes 57.3
  to 63.0 with SFT and 66.1 with DPO; LLaVA-NeXT goes 50.1 to 53.3 to 60.2.
  Gains on MM-IFEval and IFEval are small (0.7-1.7%), and VQA scores (MMBench,
  MMVet, POPE, MMT-Bench) move by 1-2 points in either direction.


  Evidence: a matched comparison against MM-IFEngine data (60.1 SFT, 61.2 DPO
  vs 63.0/66.1) and an ablation over DPO rejection strategies, where full
  constraint removal scores 68.8 and dropping the image entirely only 59.3.
  Human checks give 90% agreement on direct judging, 92% on comparative, 86%
  across GPT-4o vs Qwen judges.


  Only 2 base models, 10k-scale data, and GPT-4o-dependent scoring. Useful if
  you assume your MLLM's instruction compliance transfers to visually grounded
  constraints.
