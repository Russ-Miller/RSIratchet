brief: >-
  Multimodal models can pass existing instruction-following benchmarks without
  looking at the image, because the constraints being tested are textual
  patterns the language backbone alone can satisfy. VC-IFEval is built to
  close that loophole: 300 curated image-task-constraint pairs with
  vision-dependent constraints (spatial relations, attributes, comparative
  logic), scored by averaging GPT-4o constraint-following accuracy with an
  image influence score that compares outputs generated with and without the
  image.


  Qwen2.5-VL-Instruct-32B reaches only 67.3% on the benchmark. Fine-tuning on
  the paired datasets VC-IFInstruct-10k (SFT) and VC-IFDPO-10k (preference
  pairs built by constraint ablation and image editing) lifts
  Qwen2.5-VL-7B-Instruct from 57.3 to 63.0 and 66.1 on VC-IFEval, and
  LLaVA-NeXT-Llama3-8B from 50.1 to 53.3 and 60.2, with small gains on
  MM-IFEval and IFEval and roughly flat VQA scores on MMBench, MMVet and POPE.


  The design includes a matched comparison against MM-IFEngine data (60.1 SFT,
  61.2 DPO vs 63.0 and 66.1), a DPO construction ablation where full
  constraint removal scores 68.8 and image-free negatives only 59.3, and human
  checks: 90% agreement on direct judging, 92% on comparative, 86% between
  GPT-4o and Qwen2.5-VL judges, IAA 0.86. Data validity was 84% for SFT and
  80% for preference pairs.


  Only 2 model families, 7B-8B scale, and evaluation rests on an LLM judge.
  Treat text-only IF scores as weak evidence of multimodal grounding.
