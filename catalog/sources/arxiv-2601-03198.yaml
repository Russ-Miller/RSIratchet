brief: >-
  Multimodal instruction-following benchmarks mostly test the text backbone:
  models can pass their checks without looking at the image. VC-IFEval tries
  to separate the two, and current MLLMs do poorly on it.


  The benchmark holds 300 curated image-task-constraint pairs with
  vision-dependent constraints (spatial relations, attributes, target
  restriction). Scoring is hybrid: GPT-4o judges constraint satisfaction
  directly, plus an image-influence score comparing responses generated with
  and without the image. Training data from the same pipeline comes as
  VC-IFInstruct-10k (SFT) and VC-IFDPO-10k (preference pairs built by
  constraint ablation or image editing).


  Qwen2.5-VL-Instruct-32B reaches 67.3% on VC-IFEval. Qwen2.5-VL-7B-Instruct
  goes 57.3 to 63.0 with SFT and 66.1 with DPO; LLaVA-NeXT-Llama3-8B goes 50.1
  to 53.3 to 60.2. MM-IFEngine data reaches only 60.1/61.2 on the same
  benchmark. VQA scores (MMBench, MMVet, POPE) stay roughly flat. DPO
  ablations show rejected responses built by removing 100% of constraints work
  best (68.8), while dropping the image entirely gives 59.3.


  Evidence is measured on 2 models, with a matched comparison against
  MM-IFEngine data and a 5-way DPO ablation. Judge agreement with humans was
  90% direct and 92% comparative; an open-source judge agreed 86%. The
  pipeline, training data, and judge all lean on the same generator family, so
  quality is partly self-assessed, and no larger models were fine-tuned.


  Useful if you suspect your multimodal IF scores are measuring text
  compliance.
