brief: >-
  Giving a non-reasoning LLM 2-4 generic graph traversal tools lets it solve
  structural tasks it fails entirely when the same graph is pasted into its
  context, and the advantage grows with graph size.


  GraphWalk equips off-the-shelf models with minimal, domain-free Neo4j
  operations (node lookup by property, neighbor retrieval, property
  enumeration, think) and tests them on 10x10 mazes and on fully synthetic
  property graphs with non-semantic 4-8 character labels, across 12 query
  templates spanning retrieval, aggregation, multi-hop paths, and first-order
  logic. Models: gpt-4o-mini, gpt-4o, gpt-4.1, gpt-4.1-mini, gpt-4.1-nano,
  o3-mini, o4-mini.


  On mazes, gpt-4.1 and gpt-4.1-mini go from 10.00 and 0.00 without tools to
  100.00 with tools; reasoning models score 100.00 without tools. On the
  100-node graph benchmark (120 runs each), tools roughly double correct
  answers (gpt-4.1: 35 vs 21; gpt-4o: 34 vs 18), but absolute accuracy stays
  low and o4-mini without tools leads at 49.17. At 500 nodes, gpt-4.1 with
  tools holds 26.67 accuracy while gpt-4.1 without tools drops to 10.83 and
  o4-mini collapses from 59 correct to 5.


  The no-tool condition is a matched full-graph-in-context baseline, so the
  comparison isolates tool access; the synthetic labels rule out parametric
  leakage. Limits: 1 model family, no fine-tuned or text-to-Cypher comparison,
  no equal-token-budget control, and Variable Hop Path queries score 0
  everywhere.


  Treat traversal scaffolding, not retrieval quality, as the lever for
  enterprise-scale KG QA.
