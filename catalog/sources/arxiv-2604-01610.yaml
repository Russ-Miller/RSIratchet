summary: The use of knowledge graphs for grounding agents in real-world Q&A
  applications has become increasingly common. Answering complex queries often
  requires multi-hop reasoning and the ability to navigate vast relational
  structures. Standard approaches rely on prompting techniques that steer
  large language models to reason over raw graph context, or
  retrieval-augmented generation pipelines where relevant subgraphs are
  injected into the context. These, however, face severe limitations with
  enterprise-scale KGs that cannot fit in even the largest context windows
  available today. We present GraphWalk
