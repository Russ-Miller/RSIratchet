summary: >-
  We introduce NemotronLabs VoiceChat, an open full-duplex speech-to-speech
  model with native tool-calling capabilities. NemotronLabs VoiceChat
  combines a streaming speech encoder and decoder-only language model with
  parallel specialized output streams for agent text and structured function
  calls, an auxiliary RNN-T branch for incremental user transcription, and a
  streaming TTS decoder. This design enables the model to listen,
  transcribe, reason, invoke tools, and speak within a unified streaming
  architecture while preserving the temporal behavior required for natural
  conversation. On Full-Duple
