summary: >-
  Large language model (LLM) agents interact with external environments
  through tool invocation, but tool outputs can also expose them to indirect
  prompt injection (IPI) attacks. Existing defenses mainly rely on prompt
  hardening, content filtering, pre-generated plans, or permission
  constraints. These approaches often struggle with complex tasks or
  over-sanitize external content, making it difficult to balance security
  and utility. The key challenge is therefore to preserve execution
  flexibility while precisely identifying and removing the malicious content
  that actually induces unsafe actions.
