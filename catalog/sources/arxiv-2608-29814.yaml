summary: >-
  Modern video generators excel at synthesizing individual clips, but
  complete video production requires coordinating a long sequence of
  interdependent creative steps, including scripting, storyboarding,
  generation, and editing. It further demands persistent asset management
  and dynamic task orchestration as intermediate outputs, dependencies, and
  execution states evolve over time. Existing automated systems typically
  rely on rigid pipelines that are difficult to adapt to diverse inputs and
  changing workflows, while general-purpose large language models (LLMs)
  remain unreliable for long-horizon
