summary: >-
  We report a multi-month engineering program to build Sophea, a production
  bilingual Greek-English automatic speech recognition system. We evaluate
  the system against nine production gates covering Greek and English word
  error rate, language identification, and hallucinations on non-speech
  audio. Across twenty-three training iterations and two model
  architectures, no training-data composition passed all nine gates
  simultaneously. Meeting the Greek noisy-environment target required about
  1,500 steps of dense domain exposure, while preserving English language
  identification tolerated only about 2
notes: >-
