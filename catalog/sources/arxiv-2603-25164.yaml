brief: >-
  Attacking a RAG system through both the query path and the corpus at once
  removes the need to know the victim's query in advance, which is the main
  constraint on existing poisoning attacks. PIDP-Attack appends a fixed
  injection suffix carrying an attacker-chosen target question S to any
  incoming query, and inserts n poisoned passages keyed on S into the corpus;
  the suffix pulls those passages into the top-k, and they supply the evidence
  that makes the generator emit the attacker's wrong answer.


  Evaluation covers Natural Questions, HotpotQA and MS-MARCO in BEIR format, a
  Contriever retriever, and 8 instruction-tuned LLMs, with defaults n=5, k=5
  and strict substring matching on the target string.


  Average ASR is 98.125% versus 92% for PoisonedRAG and 3.125% for GCG, with
  gains of +4% to +16% on NQ and +5% to +12% on MS-MARCO. Ablations separate
  the two vectors: prompt-only injection reaches 0% relaxed success on NQ and
  MS-MARCO, Clean-RAG (injected query, clean corpus) reaches 68%–96% relaxed
  on some models, and n=2 already gives >95% strict ASR on NQ and HotpotQA
  while MS-MARCO climbs from ~30% at n=1 to >90% at n=5.


  The comparison is matched on query IDs, retriever, prompt template and
  target pair, and retrieval F1 is reported separately so retrieval-stage and
  generation-stage effects can be told apart; sweeps use 3 models, 10 queries
  per iteration, 10 iterations. No defended baseline is tested: the prompt
  wrapper deliberately omits guardrails, sanitization or provenance checks.
  The attack is retrieval-limited on noisy corpora, generation-limited on
  refusal-prone models (ASR near 0), and dilution-limited at large k
  (qwen2.5-7b falls from 97% at k=5 to 82% at k=10); 1 retriever, text only.


  If you treat the query string as trusted in a RAG orchestrator, assume
  poisoning requires knowing the query no longer holds.
