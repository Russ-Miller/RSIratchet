summary: >-
  Large language model (LLM) based agents are increasingly applied to
  cybersecurity tasks such as vulnerability discovery and automated
  penetration testing. On long-horizon security tasks, however, such agents
  remain limited by context forgetting and intent drift: early critical
  facts and causal reasoning chains are lost over extended interactions, and
  the agent falls into aimless, repetitive exploration. This paper proposes
  Intentest, an intent-graph-guided automated penetration testing agent that
  externalizes long-horizon state from the LLM's context window onto a
  persistent fact-intent direct
