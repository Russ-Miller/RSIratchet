summary: Recent audio-aware large language models (ALLMs) have demonstrated
  strong capabilities across diverse audio understanding and reasoning tasks,
  but they still frequently produce hallucinated or overly confident outputs.
  While uncertainty estimation has been extensively studied in text-only LLMs,
  it remains largely unexplored for ALLMs, where audio-conditioned generation
  introduces additional challenges such as perceptual ambiguity and
  cross-modal grounding. In this work, we present the first systematic
  empirical study of uncertainty estimation in ALLMs. We benchmark five
  representative methods,
