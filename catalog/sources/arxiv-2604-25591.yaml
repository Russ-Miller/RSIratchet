brief: >-
  Uncertainty signals that work for text LLMs partly carry over to audio-aware
  LLMs: semantic-level and self-verification measures beat token-level
  likelihood for flagging wrong answers, but only reliably on general
  reasoning tasks, not on hallucination or unanswerable-question settings.


  5 methods (predictive entropy, length-normalized entropy, semantic entropy,
  discrete semantic entropy, P(True)) were compared on Qwen2.5-Omni-3B,
  Qwen2.5-Omni-7B, and Audio Flamingo 3 across MMAU, MMAR, MMSU, SAKURA,
  Audio-Hallucination, and AQUA-Bench, scored by AUROC and AURAC. Predictions
  came from temperature 0.1 decoding; uncertainty from K = 10 samples at
  temperature 1.0.


  On MMAU, semantic/discrete semantic entropy reach 0.80–0.85 AUROC against
  0.62–0.73 for token-level entropy. On trustworthiness benchmarks the ranking
  flips by model: on AQUA-Bench P(True) is best for the 7B model (0.79) but
  worst for the 3B model (0.52), where normalized entropy wins (0.75); on
  Audio-Hallucination normalized entropy is best for Audio Flamingo 3 (0.78).


  Measured, not argued, with the same protocol across 3 models and 6
  benchmarks, so the method comparison is clean; the trustworthiness
  instability rests on 3 models and 2 benchmarks only.


  All tasks have constrained answer spaces, so open-ended captioning and
  dialogue are untested, as are representation-level uncertainty signals.


  Using uncertainty to route to a caption-then-reason mode hit the best MMAU
  accuracy at 41% of reasoning tokens for the 7B model, but failed on MMAR
  where reasoning itself hurt, so do not assume routing alone buys
  reliability.
