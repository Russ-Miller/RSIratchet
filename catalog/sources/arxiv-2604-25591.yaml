brief: >-
  Semantic-level and self-verification uncertainty signals separate correct
  from incorrect answers in audio-aware LLMs better than token-level
  likelihood, but that ordering collapses once the task tests hallucination or
  unanswerability.


  5 methods (predictive entropy, length-normalized entropy, semantic entropy,
  discrete semantic entropy, P(True)) were compared on Qwen2.5-Omni-3B,
  Qwen2.5-Omni-7B and Audio Flamingo 3, across MMAU, MMAR, MMSU, SAKURA plus 2
  trustworthiness benchmarks, AQUA-Bench and Audio-Hallucination. Predictions
  came from temperature 0.1 decoding; uncertainty from K = 10 samples at
  temperature 1.0, scored by AUROC and AURAC.


  On MMAU, Qwen2.5-Omni-7B reached 0.85 AUROC with discrete semantic entropy
  against 0.64 for predictive entropy; on MMSU the semantic methods hit 0.80
  versus 0.60. On AQUA-Bench the winner changes per model: P(True) 0.79 for
  the 7B, normalized entropy 0.75 for the 3B, and on Audio-Hallucination
  normalized entropy 0.78 beat semantic entropy for Audio Flamingo 3.
  Uncertainty-routed adaptive inference matched or beat the better of direct
  and caption-then-reason at 24–64% of reasoning tokens, but failed on MMAR
  where reasoning itself hurt (0.59 to 0.54 for the 7B).


  All effects are measured head-to-head on fixed predictions, so method
  comparison is clean; 3 models and multiple-choice-style answer spaces only,
  with no open-ended generation, no modality-specific estimator, and a single
  fixed routing threshold of 0.25.


  Treat semantic entropy as the default audio-LLM confidence signal, but
  re-tune per model before using it for hallucination gating.
