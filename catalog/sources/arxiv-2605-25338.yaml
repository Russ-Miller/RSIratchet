summary: >-
  Large language model (LLM) agents frequently fail on multi-step tasks
  involving reasoning, tool use, and environment interaction. While such
  failures are typically logged or retried heuristically, they contain
  structured signals about where execution broke down. We introduce
  CausalFlow, an interventional framework that converts failed agent traces
  into minimal counterfactual repairs and reusable supervision. CausalFlow
  models execution traces as sequential chains of dependent steps and
  computes Causal Responsibility Scores(CRS) via step-level counterfactual
  intervention to identify failure-ind
