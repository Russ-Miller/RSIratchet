brief: >-
  Knowing when not to act is a capability that moves largely independently of
  task-solving skill in tool-using agents. Within a model, act-pass and
  abstain-pass on the same task pair are near-uncorrelated (mean phi -0.10
  across 17 models, 15 of 17 negative), and across generations the two often
  move in opposite directions.


  AgentAbstain is a paired-task benchmark: 263 pairs (526 tasks) in 42
  generated MCP sandbox environments exposing 541 tools, covering 8 abstention
  scenarios split into pre-execution (166 pairs) and runtime (97 pairs)
  triggers. Each pair differs by exactly one perturbation to query,
  environment state, or tool set, so no constant always-act or always-refuse
  policy exceeds 50% paired accuracy. Scoring combines a deterministic commit
  check on the tool trace with an LLM judge (GPT-5.4) on the final response.


  Across 17 models in 4 harnesses, paired accuracy ranges 33.0% (GPT-4o) to
  59.5% (Gemini 3.1 Pro), mean 45.7%; 13 of 17 fall below 50%. Mean act
  accuracy is 80.6% versus 59.1% abstain. Failure modes split into Implicit
  Abstention (17.8%), No Abstention (19.7%), and Post-hoc Abstention (2.6%,
  n=115), where the agent commits an irreversible action then claims
  restraint.


  Evidence is measured, with the minimal-perturbation design isolating the
  trigger, and 3 annotators rating 94-98% of 100 sampled pairs well-designed.
  Caveats: environments and tasks are LLM-generated with no human curation,
  each task run once per model, and the judge is itself an evaluated model
  family.


  If you benchmark agents on task success alone, you are not measuring
  restraint at all.
