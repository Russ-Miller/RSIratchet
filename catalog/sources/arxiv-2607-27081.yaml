brief: >-
  Safety realignment of a fine-tuning-compromised model mostly works only in
  the prompt template the defender happened to pick, and switching the system
  prompt at inference re-opens the attack channel for every method tested,
  including the one proposed here.


  The setup: an attacker LoRA-fine-tunes Llama-2-7B-Chat, Qwen2.5-7B-Instruct
  and Gemma-2-9B-it on a task corpus plus 1,500 BeaverTails harmful examples,
  giving SQL, SAMSum and NL2Bash skill alongside compliance. Defenses
  (rollback, RESTA, soft-SFT, SSRD) are repaired under raw or self templates
  without knowing the attack template; ASR is judged by Qwen2.5-32B-Instruct
  on 700 held-out harmful prompts. ROPD routes harmful tokens to the original
  aligned model as teacher and task tokens to the fine-tuned model, matched by
  top-K KL.


  Under template mismatch, baselines either leave the channel open (SSRD 3.1
  to 46.3 on Llama-2; RESTA 6.4 to 66.4 on Qwen2.5) or collapse the task
  (RESTA to 0.036, rollback to 0.017). ROPD under the self defense holds
  2.1-2.4 ASR on Llama-2 and task 0.596-0.626, but rises to 28.3 under a raw
  deployment template. Cross-template re-evaluation after acceptance pushes
  ASR back up for all: soft-SFT 36.4, rollback 42.3, ROPD 19.7.


  Evidence is measured across 3 models, 3 tasks and 4 baselines with
  attack/defense/eval templates controlled independently, plus a teacher
  ablation showing the safety teacher alone drives harm reduction (ASR 23.0)
  while dropping the task teacher costs skill (0.563). Baselines run at their
  own published configurations rather than matched compute; harm judgments
  rely on 1 LLM judge; only 7-9B instruct models, 4-bit LoRA attacks.


  If you evaluate a realigned model under one template, treat the resulting
  ASR as an underestimate.
