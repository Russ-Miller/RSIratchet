brief: >-
  Current vision-language models cannot track furniture parts through an
  assembly video, and most of their score on such questions comes from
  image-level shortcuts rather than the video. Flat-Pack Bench builds 602
  manually curated multiple-choice questions over 50 in-the-wild IKEA assembly
  videos (from IKEA-Manuals-at-Work), with hand-annotated part segmentations
  on 343 frames used as visual prompts, across 4 task types: temporal
  ordering, temporal localization, part mating, and tracking.


  Humans reach 94.18% micro average; GPT-5 reaches 37.71%, Gemini 2.5 Pro
  33.72%, best open model InternVL3-78B 41.03%, against 26.74% frequency
  chance. On Track, GPT-5 gets 25.68%, near 25.49% random.


  The video-dependence claim is measured, not argued: removing the video from
  Qwen2.5-VL-72B's input costs 8.80% overall and 24.51% on Track, while Mate
  (+5.75) and TLoc (+4.85) improve; human accuracy falls over 50%. Shuffling
  part IDs across 3 seeds exposes an ordering shortcut. Chain-of-thought
  (39.20%) and self-consistency over 5 samples (32.23%) both hurt. An agentic
  decomposition with SAM2 and a VLM query tool scores 11.79% with 62.29%
  abstentions; SAM2 tracking averages 0.28 IoU and contact reasoning hits
  52.93% on Yes cases.


  Analysis depth rests on 1 model for ablations and Gemini 2.5 Pro thought
  summaries for the 200-question error taxonomy; rigid parts only, no
  fine-tuning tested.


  Treat region-grounded tracking as an open bottleneck, not a solved input
  primitive.
