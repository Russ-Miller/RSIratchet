brief: >-
  The format of a chain-of-thought trace, not just its presence, determines
  whether fine-tuned reasoning transfers to harder instances of the same task.
  Interleaving a natural-language discussion of the next move with a compact
  ASCII grid redraw of the map after that move is the only setup that keeps
  non-trivial accuracy outside the training distribution.


  The testbed is FrozenLake grid navigation from Wu et al. (2024):
  Qwen2.5-VL-7B-Instruct fine-tuned for 10 epochs on 1,000 maps (100 3x3, 200
  4x4, 300 5x5, 400 6x6), with maps and CoT traces rendered as image,
  description, table, or grid, and tested on 7x7-10x10 maps with 200 maps per
  size.


  Zero-shot accuracy is 0.06 average in-distribution. Fine-tuning with any CoT
  beats no CoT; best ID average is 91%. On OOD maps where start-goal distance
  d_inf >= 6, most models fall below 10% at 7x7 and near 0% beyond; grid input
  with grid + description CoT holds 0.41 average and 0.20 at 10x10. With map
  size fixed at 10x10 to isolate distance, no-CoT and description-CoT models
  drop to near 0% at d_inf = 6, while grid + description reaches 0.29 OOD
  average.


  Evidence is measured across 4 input formats x 6 CoT formats, with 3 separate
  shift axes (size, distance, solution length), an epoch ablation (10/20/30),
  a retrained Mirage baseline with shuffled helper images, and a re-train
  dropping the 10 training maps with optimal length > 10. Only 1 base model
  and 1 task family; the image-CoT and RL-trained vision baselines (VPRL,
  91.6%) could not be tested OOD.


  If you are attributing generalization gains to reasoning itself, check
  whether the trace format is doing the work.
