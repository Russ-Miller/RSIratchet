brief: >-
  Chain-of-thought format, not just its presence, determines whether a
  fine-tuned model generalizes beyond its training distribution on a simple
  planning task. Interleaving a natural-language discussion of the next move
  with a compact ASCII grid of the map after that move is the only setup that
  survives real distribution shift.


  The testbed is FrozenLake grid navigation: a map with holes, a player and a
  treasure, output is a move sequence. Qwen2.5-VL-7B-Instruct is supervised
  fine-tuned for 10 epochs on 1,000 maps of size up to 6×6, with 4 input
  formats (image, description, table, grid) crossed with CoT formats, and
  tested on 7×7-10×10 maps, start-goal distance, and optimal solution length.


  Zero-shot accuracy is 0.06 average in-distribution. All CoT variants beat
  no-CoT in-distribution, best 91%. On OOD maps where start-goal distance d∞ ≥
  6, most models fall below 10% at 7×7; description-only CoT drops to 7%. Grid
  input with grid + description CoT holds 41% average and 20% at 10×10. With
  map size fixed at 10×10 to isolate distance, no-CoT and description CoT go
  near 0% at d∞ = 6, while grid + description reaches 29% OOD.


  Evidence is measured, with matched training data across formats, a
  200-maps-per-cell OOD test set, an epochs ablation (20, 30), and a
  retraining ablation removing the 10 training maps with solution length > 10.
  Mirage's continuous-space reasoning is retrained and matched by a plain
  no-CoT image model; shuffling its helper images changes nothing.


  Only 1 base model and 1 task family; image inputs lag text throughout and
  VPRL could not be tested OOD. Treat CoT format as a tunable variable rather
  than a fixed design choice.
