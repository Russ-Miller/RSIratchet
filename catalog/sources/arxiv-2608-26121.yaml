summary: >-
  Large language models state false facts as fluently as true ones, yet a
  model often "knows" internally when it is on shaky ground: the probability
  it assigns to its own answer tends to dip on the facts it gets wrong. The
  usual way to act on this, teaching a model to abstain rather than guess,
  requires a labelled dataset of right and wrong answers. We ask whether the
  model's own confidence, which is free and needs no labels, can do that job
  instead. We fine-tune each model (with LoRA) to answer when its frozen
  confidence is high and to say "I'm not sure" when it is low, using the
