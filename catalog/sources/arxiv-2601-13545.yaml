brief: >-
  All 8 frontier models deployed as forecasting agents on live prediction
  markets lost money over the evaluation window, and models with comparable
  forecast accuracy diverged sharply in calibration, drift, and token cost.


  TruthTensor embeds LLM agents into Polymarket with versioned, locked
  prompts, querying them repeatedly per market until resolution and logging
  probability estimates, reasoning traces, and trades. The window ran 30 days
  (Dec 12, 2025 – Jan 10, 2026), covering 876,567 forecasting decisions,
  531,770 users, 983,600 agents, and over $1.14B in active market value, with
  8 models passing a 50,000-agent inclusion threshold.


  Cumulative P&L was negative for every model, from $-2,604,933.30 for
  Gemini-3-Pro-Preview to $-14,276,936.58 for Claude-Sonnet-4.5. Average
  output tokens spanned 429 (Qwen3-Max) to 4,611 (Gemini-3-Pro-Preview).
  Kimi-K2-Thinking produced long reasoning chains yet the lowest frequency of
  valid decisions.


  Models forecast the same markets at the same timestamps, so comparisons are
  paired under identical information. But the headline drift, calibration, and
  human-imitation metrics are defined, not reported with numbers; the
  behavioural claims rest on figures and narrative description, and the agents
  are crowd-deployed rather than controlled, so model effects are confounded
  with user configuration.


  No token-matched ablation, no accuracy or Brier numbers, 1 market platform.


  Treat this as a deployment-scale cost and behaviour survey, not evidence
  about forecasting accuracy.
