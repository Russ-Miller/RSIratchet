summary: Large Language Models frequently generate fluent but factually
  incorrect text. We propose Adaptive Activation Cancellation (AAC), a
  real-time inference-time framework that treats hallucination-associated
  neural activations as structured interference within the transformer
  residual stream, drawing an explicit analogy to classical adaptive noise
  cancellation from signal processing. The framework identifies Hallucination
  Nodes (H-Nodes) via layer-wise linear probing and suppresses them using a
  confidence-weighted forward hook during auto-regressive generation --
