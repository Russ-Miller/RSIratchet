brief: >-
  This is a position and design paper, not an evaluation: it proposes a
  formalism for multi-agent LLM systems and argues that it could fix known
  failure modes, without measuring anything.


  The framework models the environment as a graph G(V,E) whose vertices are
  agents and plugins and whose edges are message channels. Agents are tuples
  of (language model instance, role, state, permission to create agents, set
  of agents they may halt); plugins carry functionalities, configurations, and
  usage constraints. Components include an oracle agent that is stateless and
  memory-less, a supervisor agent with authority to halt, and paired feedback
  agents that simulate self-critique.


  The paper then re-describes Auto-GPT, BabyAGI, and Gorilla in this notation
  and sketches how added supervisor or oracle agents might break Auto-GPT's
  looping behaviour, screen code execution in continuous mode, or catch
  hallucinations in API calls. Two illustrative scenarios are described in
  prose: a courtroom with judge, jury, attorney, witness, and clerk agents,
  and a software team with 8 roles.


  There are no experiments, no benchmarks, no baselines, and no reported
  numbers. Every claimed improvement is argued rather than measured, and the
  authors themselves list scalability and the absence of suitable evaluation
  metrics as open problems.


  Treat it as vocabulary for describing agent topologies, not as evidence that
  multi-agent structure helps.
