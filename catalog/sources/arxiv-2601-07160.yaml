brief: >-
  General-purpose LLMs are effectively unusable for writing Ascend NPU kernels
  in AscendC without domain adaptation, and targeted post-training moves
  complex-kernel compilation from near zero to near ceiling.


  AscendKernelGen pairs Ascend-CoT, a chain-of-thought corpus built from
  AscendC documentation, decomposed real operator host-kernel pairs, and
  general reasoning data, with KernelGen-LM, trained by supervised fine-tuning
  plus reinforcement learning on execution feedback. Evaluation uses
  NPUKernelBench, which runs generated kernels on real hardware across 3
  difficulty levels, 158 tasks, and both static- and dynamic-shape paths.


  Zero-shot, Qwen3-8B compiles 8.22% of L1 kernels and 1.39% of L2/L3, with
  0.00% functional correctness on L2/L3; Qwen2.5-Coder-7B, Llama3.1-8B and
  Mistral-7B all score 0.00% correctness on L2/L3. After post-training,
  Level-2 compilation reaches 95.5% (Pass@10) and functional correctness
  64.3%.


  The baseline failure is measured on hardware across 4 model families. The
  gains are measured, but the headline comparison is a fine-tuned 1-model
  system against zero-shot 8B models, with no ablation separating the CoT
  data, error-derived SFT, and RL contributions, and no matched-compute
  baseline. Performance against vendor aclnn reference latency is defined but
  not reported here.


  Treat this as evidence that hardware DSL competence is data-bound rather
  than scale-bound, and not yet as evidence about which part of the pipeline
  matters.
