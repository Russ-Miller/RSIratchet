brief: >-
  Training a language model explicitly to predict environment observations,
  rather than actions, lifts simulation fidelity above frontier models and
  transfers across domains it was never trained on.


  Qwen-AgentWorld-35B-A3B and 397B-A17B are trained in 3 stages (CPT, SFT,
  GSPO RL with 9:1 rubric-to-rule rewards) on 10M+ interaction trajectories
  across 7 domains: MCP, Search, Terminal, SWE, Android, Web, OS.
  AgentWorldBench holds 2,170 turn-level samples from 5 frontier agents on 9
  benchmarks including Terminal-Bench 1.0 & 2.0 and OSWorld-Verified, judged
  on 5 rubric dimensions against real observations.


  The 397B model averages 58.71, above GPT-5.4 at 58.25; its base checkpoint
  scores 54.74. The 35B model gains 8.66 points (47.73 to 56.39). RL on
  Terminal data alone gives +14.2 in-domain and +11.5 SWE, +11.8 Search, +5.0
  MCP on held-out domains.


  Base-versus-trained comparisons isolate the pipeline, and judge choice was
  checked across 3 models (Spearman 0.92-0.99). Evaluation is self-constructed
  and judged by GPT-5.2, with no human fidelity audit reported.


  GUI domains still trail Claude Opus 4.6 (61.12 vs 59.69), Search is weak for
  everyone (best 37.82), and the downstream agent gains are asserted in
  sections not shown with figures here.


  If you assumed agent progress lives on the policy side, this gives a
  measured case for the simulator side.
