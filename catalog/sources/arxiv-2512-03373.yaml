brief: >-
  Multimodal ad creatives built by LLMs plus a diffusion model are preferred
  over human-made ads by crowd participants, and the preference survives
  participants knowing the ad is AI-made. Trait-level personalization only
  reaches parity.


  Study 1 (n=400, MTurk) compared GPT-3.5 one-line ad copy for a fictional
  phone against human-written ads from prior work, targeting openness and
  neuroticism, with a Big Five questionnaire administered afterward. Study 2
  (n=800, Prolific, 200 per condition) pitted human ads against ads whose text
  came from GPT-5, Sonnet 4, or Llama 4 and images from Midjourney, across
  authority, consensus, cognition, and scarcity.


  In Study 1 LLM ads took 51.14% of side-by-side clicks vs 48.86%, with no
  significant AI-human differences for matched personalities. In Study 2 AI
  ads won 59.1% vs 40.9% (χ2=26.65, p<0.001), led by authority 63.0% and
  consensus 62.5%; scarcity was a tie (51.5%, p=0.671). 58.4% correctly
  spotted the AI ad (Kappa=0.17); detection cut AI preference from 71.5% to
  50.3%, still above 40.9%.


  Evidence is measured, forced-choice, with randomized position, Bonferroni
  correction, and effect sizes. But the AI variant was hand-picked from 3
  models by 1 author, the human ads were not matched in production effort, and
  there is no expert-curated AI condition.


  Only single-exposure preference, 1 product, US participants; no purchase
  behavior. Treat this as evidence about creative appeal, not about sales.
