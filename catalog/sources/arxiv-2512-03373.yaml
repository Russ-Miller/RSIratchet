brief: >-
  LLM-written ads match human-written ones when tailored to personality
  traits, but beat them when built around generic persuasion principles.
  Preference for AI content survives being recognized as AI.


  Study 1 (n=400, MTurk) compared GPT 3.5 one-line ads for the fictional
  "Xphone" against human expert copy from prior work, targeting openness or
  neuroticism, with Big Five measured after exposure. Study 2 (n=800,
  Prolific) paired human ads with AI ads (text from GPT-5, Sonnet 4, Llama 4;
  images from Midjourney) under 4 Cialdini principles, 200 participants per
  condition, side-by-side forced choice, origin undisclosed until a final
  detection question.


  AI ads took 51.14% of clicks vs 48.86% in Study 1 with no significant
  AI-human differences for matched traits. In Study 2 AI won 59.1% vs 40.9%
  (χ2 = 26.65, p < 0.001, Cohen's h = 0.37), strongest on Authority (63.0%)
  and Consensus (62.5%), tied on Scarcity (51.5%, p = 0.671). Detection was
  58.4% accurate (Kappa = 0.17); correct detection cut AI preference by 21.2
  pp, to 50.3%, still above 40.9%.


  Effects are measured with preregistered-style statistics, Bonferroni
  correction, and randomized position, but the ad selection was made by 1
  non-expert author from 3 models, and human baselines were fixed, not matched
  in production effort.


  Single exposure, 1 product, US-only samples, stated preference rather than
  purchase. Treat the persuasion gap as a claim about polish and visual-text
  coherence, not about sales.
