brief: >-
  Multimodal ad creative built by LLMs plus a diffusion model beats
  human-authored ads on forced-choice preference, and the advantage survives
  people knowing the ad is AI-made. Trait-level personalization, by contrast,
  only reaches parity.


  Study 1 (n=400, MTurk) compared GPT 3.5 one-line ads for a fictional phone
  against human-written ads from prior research, targeting openness and
  neuroticism, with a Big Five questionnaire administered afterwards. Study 2
  (n=800, Prolific, 200 per condition) paired 1 human ad against 1 AI ad (text
  from GPT-5, Sonnet 4, or LLama 4; images from Midjourney) for authority,
  consensus, cognition, and scarcity.


  Study 1: LLM ads took 51.14% of clicks vs 48.86%, with no significant
  differences on matched personalities; openness matching helped (p = 0.02 on
  product rating), neuroticism matching did not. Study 2: AI preferred 59.1%
  vs 40.9% (p<0.001, Cohen's h = 0.37), strongest in authority (63.0%) and
  consensus (62.5%), no difference on scarcity (51.5%, p = 0.671). Detection
  ran 58.4% (Kappa = 0.17); knowing the origin cut AI preference by 21.2
  percentage points to 50.3%, still above 40.9%.


  Effects are measured with chi-square, Bonferroni correction, and effect
  sizes, and order was randomized, but the AI variant was hand-picked by 1
  non-expert author from 3 models, so selection is entangled with generation.
  Single exposure, stated preference not purchase, 1 product, US samples, no
  fine-tuning or prompt optimization.


  Treat "people reject AI ads once labelled" as too strong; quality appears to
  dominate origin for a large share of viewers.
