brief: >-
  An agentic Lean prover that interacts lemma-by-lemma, with tool calls for
  Mathlib search and Python, beats both step-level and whole-proof provers at
  a smaller compute budget, and RL makes it cheaper per proof rather than more
  expensive.


  Seed-Prover 1.5 combines 3 components: a natural-language prover (from
  Doubao-Seed-1.6), a sketch model trained with rubric RL to turn NL proofs
  into lemma-style Lean sketches with sorry placeholders, and a tool-using
  Lean agent trained with VAPO-based agentic RL on outcome-only Lean compiler
  reward. Evaluation covers PutnamBench (660 problems), FATE-H and FATE-X (100
  each), CombiBench, IMO 2025, Putnam 2025, and Erdos problems.


  The full workflow solves 87.9% of PutnamBench at 10 H20 days/problem, versus
  50.4% for Seed-Prover 1.0 at 18 H20 days, 56.1% for AlphaProof at ~500 TPU
  days, and 75.8% for Aleph Prover. FATE-H reaches 80%, FATE-X 33%, CombiBench
  48%. 11 of 12 Putnam 2025 problems fell within 9 hours. During RL, training
  accuracy rose from ~50% to ~90% while average tool calls fell from ~15 to
  ~10 and sequence length from ~28k to ~17k tokens.


  Gains are measured against prior systems at stated compute budgets, and the
  agent-only ablation (359/660 Putnam at pass@8x8 vs 331/660 for the 1.0
  medium workflow) separates the trained agent from the workflow. Cross-system
  compute comparisons are across different hardware and are self-reported.


  PhD-level FATE-X remains at 33%, CombiBench has acknowledged formalization
  errors, and the authors say the solved Erdos problems were simple or
  mis-formalized.


  Treat formal proving at undergraduate and graduate level as largely solved
  by search plus NL decomposition, and frontier research math as untouched.
