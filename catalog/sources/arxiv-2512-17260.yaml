brief: >-
  An agentic Lean prover that interacts lemma-by-lemma, with tool access to
  Mathlib search and Python, beats both step-level and whole-proof provers
  while using less compute, and agentic RL makes it cheaper rather than more
  expensive per proof.


  Seed-Prover 1.5 from ByteDance Seed combines 3 components: a
  natural-language prover (from Doubao-Seed-1.6), a sketch model trained with
  rubric RL to turn NL proofs into lemma-style Lean sketches with sorry
  placeholders, and the RL-trained agentic prover that discharges each lemma.
  Evaluation covers PutnamBench (660 problems), FATE-H and FATE-X (100 each),
  CombiBench, IMO 2025, Putnam 2025 and a subset of Erdős problems, under Lean
  v4.22.0.


  The full workflow solves 87.9% of PutnamBench, 80% of Fate-H, 33% of Fate-X
  and 48% of CombiBench at 10 H20 days per problem, against AlphaProof's 56.1%
  at 500 TPU days and Seed-Prover 1.0's 50.4% at 18 H20 days. Over 1200 RL
  steps, batch accuracy went from ~50% to ~90% while average tool calls fell
  from ~15 to 10 and sequence length from ~28k to ~17k tokens. The agentic
  prover alone at pass@8×8 reached 359/660 Putnam and 57/100 Fate-H.


  Compute budgets are reported but not matched across systems, and baselines
  are quoted from their own papers rather than rerun; there is no ablation
  separating the sketch model from the RL-trained prover. CombiBench and some
  Erdős formalizations are acknowledged as faulty, and the authors say the
  Erdős problems solved were simple or simplified.


  Treat undergraduate and graduate formal proving as largely solved at
  moderate cost; PhD-level and research mathematics are not.
