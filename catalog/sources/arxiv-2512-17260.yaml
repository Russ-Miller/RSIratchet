brief: >-
  An agentic Lean prover that interacts lemma-by-lemma, with caching, Mathlib
  search and Python execution, beats both step-level and whole-proof provers
  at a fraction of the compute. Seed-Prover 1.5 (ByteDance Seed) pairs this
  RL-trained agent with a sketch model, trained via rubric RL with VAPO, that
  turns natural-language proofs from Doubao-Seed-1.6 into lemma-style Lean
  sketches for parallel sub-goal solving.


  On PutnamBench (660 problems), FATE-H and FATE-X (100 each) and CombiBench,
  the full workflow reaches 87.9% Putnam, 80% Fate-H, 33% Fate-X and 48%
  CombiBench at 10 H20 days per problem, against Seed-Prover 1.0's
  50.4%/35%/9%/39% at 18 H20 days, AlphaProof's 56.1% at 500 TPU days,
  Hilbert's 70.0% and Aleph Prover's 75.8%. It solved 11 of 12 Putnam 2025
  problems within 9 hours, and 5 of 6 IMO 2025. RL training accuracy rose from
  ~50% to nearly 90% over 1200 steps while average tool calls fell from ~15 to
  10 and sequence length from ~28k to ~17k tokens.


  The agent alone, at Pass@8x8, solves 359/660 Putnam versus 331/660 for the
  heavier 1.0 medium workflow, which isolates the RL gain; the sketch model
  and search-depth contributions are not separately ablated. Compute budgets
  across systems are not matched, and comparison numbers for other provers are
  taken from their own reports.


  Erdős problems solved were judged trivial or mis-formalized, so this does
  not indicate research-level ability.
