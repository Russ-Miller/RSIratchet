brief: >-
  Letting a Lean prover interact at lemma granularity, with Mathlib search and
  Python tools, and training that agent with outcome-rewarded RL raises formal
  proving rates while cutting compute. Seed-Prover 1.5 pairs this agentic
  prover with a sketch model trained by rubric RL to turn natural-language
  proofs into lemma-style Lean sketches, decomposing problems into parallel
  sub-goals.


  Evaluation covers PutnamBench (660 problems), FATE-H and FATE-X (100 each),
  CombiBench, IMO 2025, Putnam 2025, and Erdős problems, under Lean v4.22.0,
  with the agent capped at 64K tokens and 28 tool calls.


  The full workflow solves 87.9% of PutnamBench, 80% of Fate-H, 33% of Fate-X,
  and 48% of CombiBench at 10 H20 days/problem, against Seed-Prover 1.0 at
  50.4%/35%/9%/39% with 18 H20 days/problem, AlphaProof 56.1% at 500 TPU
  days/problem, Hilbert 70.0%, Aleph Prover 75.8%. RL training accuracy rose
  from about 50% to nearly 90% over 1200 steps, with function calls falling
  from ~15 to 10 and sequence length from ~28k to ~17k. 11 of 12 Putnam 2025
  problems were solved within 9 hours.


  Gains are measured against prior systems, but compute budgets are not
  matched and the comparison mixes hardware; the RL ablation is a single
  training curve on 1 model lineage, self-reported.


  PhD-level FATE-X remains at 33%, CombiBench has formalization errors, and
  the solved Erdős problems are described by the authors as simple or
  mis-formalized.


  Treat lemma-level agentic interaction, not whole-proof or step-level
  generation, as the current efficient frontier for formal proving.
