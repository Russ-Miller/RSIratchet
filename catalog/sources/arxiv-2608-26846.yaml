summary: >-
  Interactive language-model agents use confidence signals to decide whether
  to answer immediately, retrieve additional evidence (from memory or
  external knowledge), or defer. Yet confidence is usually evaluated in
  isolation, without measuring the trajectory-level consequences of the
  actions it triggers. We propose matched trajectory replay, a controlled
  protocol for comparing confidence-to-action mappings. The protocol holds
  candidate answer states, evidence points, budgets, and action costs fixed.
  We use it to compare raw verbalized confidence with post-hoc isotonic
  calibration in a multi-hop
