summary: >-
  Hallucinations remain a major obstacle to deploying large language models
  (LLMs) in knowledge-intensive settings, where generated responses must be
  faithfully grounded in provided evidence. Reinforcement learning (RL) is a
  promising direction for hallucination mitigation, but response-level
  faithfulness rewards suffer from a granularity mismatch: localized
  hallucinations can cause supported content to receive spurious penalties.
