summary: >-
  Indirect prompt injection (IPI) remains a central safety and security
  challenge for large language model (LLM) systems because standard
  transformers lack architectural notion of source authority. Retrieved
  documents, user inputs, and system instructions are all processed through
  the same undifferentiated attention mechanism, forcing the model to infer
  from wording alone what should be obeyed and what should be treated as
  data. We propose Provenance-Aware Transformers, a provenance-aware defense
  that makes application-supplied source labels actionable inside the model.
