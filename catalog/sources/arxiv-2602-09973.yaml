brief: >-
  General and closed-source VLMs, including Gemini-2.5-Flash and GPT4o-mini,
  mostly cannot produce the spatial and temporal intermediate representations
  that plan-then-execute robot policies depend on, and training on dense
  per-frame annotations closes much of that gap.


  RoboInter-Data annotates 230k manipulation episodes (mainly Droid and RH20T)
  across 571 scenes with 10+ representation types, feeding RoboInter-VQA (9
  spatial, 20 temporal categories) and RoboInter-VLA, a
  Qwen2.5-VL/LLaVA-OneVision planner plus a DiT-head executor in implicit,
  explicit, and modular variants.


  On spatial generation, baseline VLMs stay below 40% and often near random
  (25%) on choice tasks; RoboInter-LlavaOV-7B reaches 82.9% object grounding
  versus 25.8% for its base. Open-loop mOLS rises from 0.3086 (Vanilla) to
  0.3218 (IC-E2E), 0.3340 (EC-E2E), 0.3543 (Te-Modular). Real-world Franka
  trials over 4 tasks give IC-E2E 77.3% ID and 58.3% OOD versus 65.0%/38.3%
  for Vanilla; EC-E2E drops 8.3% ID to OOD versus 19.0%.


  Evidence includes a representation ablation isolating each signal (trace
  largest, 0.3861 mOLS) and baselines OpenVLA, Pi-0, VLA-OS. Closed-loop
  testing is 15 ID and 15 OOD trials per task on 1 arm, few-shot, with no
  proprioception, and general VLM benchmarks degrade slightly after tuning.


  If you build plan-then-execute policies, this argues for explicit, dense
  traces over coarse subtask labels.
