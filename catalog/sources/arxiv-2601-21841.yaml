brief: >-
  Replacing a growing interaction history with a two-tier graph memory raises
  long-horizon embodied planning success while cutting context tokens, and the
  retrieved experience transfers from a large model to a small one without
  fine-tuning.


  GiG parses observations into a scene graph, encodes it with a graph
  attention network, and chains those embeddings into a state-transition graph
  used for loop detection and retrieval of past successful traces; an optional
  bounded lookahead injects 1-step PDDL-grounded projections. Tested on
  Robotouille Synchronous, Robotouille Asynchronous, and ALFWorld (134 tasks,
  6 types) with Qwen3-235B, Qwen3-30B, DeepSeek-R1, Gemini-2.5-Flash and
  Flash-Lite, against ReCAP, ReAct, ExpeL, CoT at Pass@1.


  Gains over the best baseline reach +19 on Synchronous, +37 on Asynchronous,
  +6 on ALFWorld (97 vs 89). Memory as a plug-in adds +15 for Qwen3-30B and +7
  for Flash-Lite. Prefill averages 12297 tokens/step vs 40720 for ReCAP and
  57357 for ReAct. Under injected perception noise GiG holds 93-94 while ReAct
  drops 12 and ReCAP 9.


  Measured, with a component ablation (BL 80, LD 90, Exp 95, full 97) and
  shared system prompts across baselines. Cost is compared in FLOPs, not
  matched token budget; no independent replication.


  Gains shrink on Gemini-2.5-Flash (+0 Synchronous), memory is excluded on
  ALFWorld because randomized placements break transfer, and out-of-domain
  transfer is untested.


  If your agent loop appends raw history, structural state abstraction is
  worth trying before scaling the backbone.
