brief: >-
  A VLM planner can drive several robots from different vendors through a
  long-horizon household task if abstract instructions are routed through a
  shared tool registry and every candidate action is checked in simulation
  before it reaches hardware. ROSClaw stacks a cognitive layer (LLM/VLM
  planning), a coordination layer with an Online Tool Pool aggregating robot
  SDKs, MCPs and APIs, and a physical layer over ROS drivers, with an e-URDF
  "physical firewall" running forward dynamics and collision checks in Isaac
  Lab, plus a Local Resource Pool that records states, observations and
  trajectories.


  Validation is demonstrative rather than quantitative. Four heterogeneous
  robots (mobile manipulator, fixed arm, humanoid) operate in a 60 square
  meter kitchen/living-room scene with three tables, one sink, six cabinets
  and one refrigerator, dividing door-opening, kiwi grasping via a DINO-X API
  call, and basket transport. A second task generated roughly 20 seconds of
  music and choreography for seven gimbal units, reported as taking
  approximately three minutes versus traditional orchestration pipelines.


  No success rates, no trial counts, no ablation separating the e-URDF
  safeguard from the rest of the stack, and the time comparison has no
  measured baseline. The authors concede that evaluation is in structured or
  semi-dynamic environments only, and that the data pool does not yet close
  the loop into policy optimization.


  Read this as an architecture proposal, not as evidence about reliability.
