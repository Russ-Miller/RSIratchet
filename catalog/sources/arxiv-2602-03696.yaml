summary: Large language models (LLMs) rely on internal knowledge to solve many
  downstream tasks, making it crucial to keep them up to date. Since full
  retraining is expensive, prior work has explored efficient alternatives such
  as model editing and parameter-efficient fine-tuning. However, these
  approaches often break down in practice due to poor generalization across
  inputs, limited stability, and knowledge conflict. To address these
  limitations, we propose the CoRSA (Conflict-Resolving and Sharpness-Aware
  Minimization) training framework, a parameter-efficient, holistic approach
  for knowledge editing
notes: "Filed as a source on knowledge-updating from the classifier's
  judgement that the paper is about it (improves, high): CoRSA proposes a
  training framework that raises generalization to paraphrased inputs, reduces
  forgetting across multiple updates, and resolves conflicts with prior
  knowledge. No claim has been drafted from it yet."
