brief: >-
  Editing a fact into a model with plain LoRA often leaves the old fact alive
  underneath, and it resurfaces after later edits. Adding a preference term
  that pushes the new answer away from the old one, plus flat-minimum
  optimization, suppresses that reversion.


  CoRSA trains a single LoRA adapter with an SFT loss plus a DPO loss between
  old and new targets, optimized under Sharpness-Aware Minimization with
  PCGrad used to reconcile the two conflicting gradients. Tested on
  CounterFact, ZsRE, MQuAKE-Remastered, AToKe-ME and CodeUpdateArena, with
  Llama-3.1-8B-Instruct and Qwen3-4B/8B/14B, against LoRA, MEMIT and
  F-Learning.


  Generality rises 12.42% over LoRA and 9.99% over MEMIT on average. On
  CounterFact with Qwen-3-4B, outdated-answer retention falls from 9.81%
  (LoRA) to 1.28%; old-knowledge reactivation after continual updates falls
  from 17.09% to 7.72%. Forgetting on AToKe drops to 27.46% versus 46.13% for
  F-Learning, with update efficacy 98.04%. On code, 34.53% Pass@5 update
  efficacy versus 29.05%.


  The effect is measured against 3 baselines at matched LoRA rank and learning
  rate, with a component ablation in the appendix and a data-fraction sweep.
  No independent replication; 2 model families.


  Edit success is already 97-98% for all methods, so the gains are confined to
  paraphrase generality and retention, not raw edit success. Reconsider
  whether your editing baseline's apparent success survives paraphrasing.
