summary: >-
  Large Language Models (LLMs) have demonstrated remarkable performance in
  automatic code generation tasks, thereby encouraging new research in this
  area. Although numerous studies have explored LLM-based code generation,
  the impact of the natural language in input prompts remains unexplored
  (language bias). This study aims to (1) quantify how the natural language
  of input prompts influences LLM-based code generation performance and (2)
  evaluate a mitigation strategy to reduce language bias in code generation.
  We assess code generation Accuracy on AtCoder, LeetCode, and BigCodeBench.
