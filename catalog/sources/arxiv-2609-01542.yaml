summary: >-
  Large audio language models (LALMs) can describe what is heard, but their
  ability to localize when queried content occurs remains less
  systematically evaluated. We present TAG-Bench, a benchmark for temporal
  audio grounding in which a model returns every time interval that matches
  a natural-language query. TAG-Bench contains 1,750 human-verified
  query-recording pairs covering 149.5 hours, with eight source-dependent
  subsets spanning query categories and audio durations from 7 s to 20 min;
