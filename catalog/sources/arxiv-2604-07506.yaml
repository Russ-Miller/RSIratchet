brief: >-
  Training a generative reward model to judge its own analytical traces, not
  just final verdicts, improves both judgment accuracy and positional
  consistency. ReflectRM converts standard preference data into process-level
  pairs by sampling multiple judgments and pairing analyses that led to
  correct versus incorrect verdicts, then trains on a 4:1 mix of
  response-preference and reflection data with GRPO on Qwen3-4B/8B/14B. At
  inference it draws N = 8 rollouts, picks a high-confidence anchor from token
  log-probabilities, uses self-reflection to filter the rest, and
  majority-votes the survivors.


  Average accuracy across RewardBench, RM-Bench, RMB and PPE-Preference rises
  3.7 points on Qwen3-4B (72.7 to 76.4) and 2.2 on Qwen3-8B; the 4B system at
  76.4 beats the 8B RFT baseline at 76.1. Positional consistency, scored only
  when the model picks correctly under both orderings, gains 10.2 points on 4B
  versus 5.4 for RFT.


  The design isolates causes reasonably well: a token-matched baseline trains
  on 17.1k pure preference samples (79.1 AVG) against 13.7k Pref. plus 3.4k
  Refl. (80.3), and ablations replacing the anchor or the reflection filter
  with random selection cost 0.5 and 1.0 points. Matched-compute comparisons
  are deferred to an appendix section not shown here.


  Only 1 model family, pairwise preference judging, and mainly 2 training
  sources were tested. Inference cost roughly doubles over N-sample majority
  voting.


  If you build reward models, process-level preference pairs look cheaper than
  scaling preference data.
