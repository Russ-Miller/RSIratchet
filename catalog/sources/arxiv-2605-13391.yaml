brief: >-
  Letting an agent navigate a hierarchical tool index itself, loading tool
  documentation only after it decides it needs that tool, beats both full tool
  registration and one-shot retrieval on remote sensing agent tasks.


  RS-Claw splits 104 Earth-Bench remote sensing tools into 5 skill categories
  with 3 layers (skill summary, tool brief, full API doc), and makes "expand a
  skill" and "load a doc" ReAct actions. Baselines: Flat (all tools in the
  system prompt, the official Earth-Agent setup) and RAG (19 semantically
  retrieved tools per question). Models: GPT-5, DeepSeek-V3.1, Qwen3-32b; 234
  questions after excluding 14 ChangeOS items.


  RS-Claw wins on all 3 models and both modes; the gain is largest for the
  weakest model (+12.45 points over Flat on Qwen3-32b AP vs 3.00 on GPT-5),
  with up to 86% fewer input tokens per question and 81% fewer per turn. Token
  savings on GPT-5 were only about 20%.


  Evidence is measured, with 2 ablations on Qwen3-32b: random skill grouping
  loses 9.87 points, and a 2-layer variant scores higher Tool-Any-Order (58.07
  vs 50.22) yet lower Accuracy (25.75 vs 33.05), which is the paper's cleanest
  isolation of the reasoning-space mechanism.


  Boundary: with only the ground-truth minimal tool set, Flat is slightly
  better and cheaper; the advantage comes from tool-library redundancy, and
  ablations run on 1 model.


  If your agent's tool list is small, this buys you nothing.
