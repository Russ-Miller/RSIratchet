brief: >-
  Choosing in-context examples by their position in a learned latent geometry
  beats lexical and embedding-similarity retrieval for hallucination
  detection, except where the task is explicit evidence matching.


  GA-ICL freezes the LLM, extracts mean-pooled final-layer hidden states, and
  trains a lightweight projection plus class prototypes with a proxy-anchor
  loss and a manifold point-to-point loss; demonstrations are the
  representations nearest the learned momentum prototype. Evaluated 2-shot on
  FEVER and 3 HaluEval subsets (dialogue, summarization, QA) across 6 models
  (Qwen3-4B, Llama3-8B, Falcon-3-3B, GPT-Neo-2.7B, Vicuna-7B, Mistral-7B),
  plus Phi-14B and Qwen3-32B.


  GA-ICL wins in most cells against KNN, clustering, BM25, perplexity, SA-ICL,
  AdaICL and Top-k+Con-E, with gains up to 9.9 accuracy points on Mistral-7B
  dialogue/summarization. On HaluEval QA at small scale BM25 is sometimes
  better (Qwen3-4B 69.0 vs 70.5 for GA-ICL but perplexity 74.0; Mistral-7B
  66.0 vs 62.0). At larger scale GA-ICL leads everywhere, e.g. Phi-14B QA 81.2
  vs 78.3.


  Evidence is measured but single-run at temperature 0, with no variance
  reporting; shot-count and prototype-dimension ablations are included, and
  temperature sweeps 0–1 show less output variation than BM25 and SA-ICL. The
  prototype-compression claim rests on 2 models.


  One-time cost is 3–4 hours and 640MB GPU memory per dataset-model pair.
  Useful if you detect hallucinations in open-ended dialogue or summarization;
  less so for evidence-grounded QA at small scale.
