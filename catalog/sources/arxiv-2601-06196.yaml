summary: >-
  Large language models (LLMs) frequently generate factually incorrect or
  unsupported content, commonly referred to as hallucinations. Prior work
  has explored decoding strategies, retrieval augmentation, and supervised
  fine-tuning for hallucination detection, while recent studies show that
  in-context learning (ICL) can substantially influence factual reliability.
