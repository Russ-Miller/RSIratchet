summary: >-
  AI agents are usually evaluated by whether they complete a task. In
  interactive service settings, a successful agent can still frustrate users
  by asking repeated questions, performing redundant searches, or making
  avoidable revisions. We introduce RideWay, an efficiency-centered
  benchmark for ridehailing agents in a stateful tool-calling environment,
  together with Efficiency Utility, a success-gated metric that discounts
  successful trajectories for excess tool calls and user-facing turns
