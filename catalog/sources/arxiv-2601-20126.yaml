brief: >-
  Making "I don't know" a rewarded action in RLVR gives a tunable knob over
  hallucination, but the trade-off against accuracy is steep and the knob is
  sharply nonlinear in small models.


  Granite-3.3-2B-Instruct and Qwen-3-4B-Instruct were trained with GRPO (TRL,
  LoRA, 500 steps, ~8k training samples, ~100 held-out test samples) on
  MedMCQA and Hendrycks MATH, using a ternary reward of 1 for correct, -1 for
  wrong, and a swept r_abs for abstention, with and without a prior SFT stage
  that teaches abstention (random 30% of labels, or R-Tuning on items the base
  model got wrong).


  On MedMCQA, Qwen at r_abs=0.3 cut incorrect answers from 32.5% to 10.3%
  while correct fell from 67.5% to 48.0%, with 41.0% abstentions. Granite
  collapsed: 0.0% abstention at r_abs=-0.5, 100% abstention at r_abs=0.3. On
  MATH with RL-RTuning, abstention went from 5.4% at r_abs=-0.95 to 98.2% at
  0.25, with correctness dropping to 0.7%.


  The reward sweeps are proper ablations and isolate r_abs. But the test set
  is ~100 samples, there are 2 models and 2 datasets, no confidence intervals,
  and no external baseline such as confidence-threshold abstention.


  Treat abstention reward as a dial that must be tuned per model and per task,
  not a setting that transfers.
