  agents, yet their scores are often treated as ground truth without
  validating the evaluators themselves. We present a systematic validity and
  reproducibility audit of four major tool-calling benchmark families: BFCL
  v4, τ2-Bench, LiveMCPBench, and MCP-Atlas. Across 496 expert-reviewed
