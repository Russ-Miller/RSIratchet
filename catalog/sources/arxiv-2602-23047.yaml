summary: >-
  Context engineering has emerged as a pivotal paradigm for unlocking the
  potential of Large Language Models (LLMs) in Software Engineering (SE)
  tasks, enabling performance gains at test time without model fine-tuning.
  Despite its success, existing research lacks a systematic taxonomy of
  SE-specific context types and a dedicated benchmark to quantify the
  heterogeneous effects of different contexts across core SE workflows. To
  address this gap, we propose CL4SE (Context Learning for Software
  Engineering), a comprehensive benchmark featuring a fine-grained taxonomy
