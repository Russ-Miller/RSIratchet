brief: >-
  Asking a reasoning model to self-correct its own social bias makes it worse,
  not better, unless the correction behaviour is trained in. Models notice the
  stereotype and then rationalise it anyway.


  The diagnostic forces a biased reasoning prefix into the chain ("CEO roles
  require dominance...") on BBQ and CEB-CrowS-Pairs, with
  DeepSeek-R1-Distill-Qwen-7B, Qwen2.5-7B-Instruct, Qwen3-8B and
  Llama-3.1-8B-Instruct. Self-Debias then adds cold-start SFT on 10k BBQ
  samples with GPT-4o CoT, a suffix-level preference objective with a
  Jain's-index fairness regulariser, and 2 online rounds built from 5k
  unlabeled queries via consistency filtering.


  Injection costs -11.6% accuracy on CrowS-Pairs; reflection tokens appear in
  11.8%-32.6% of cases but rarely change the conclusion. Prompted
  self-correction drops the average across 8 benchmarks by 13.5 points for
  Qwen3-8B, 9.5 for Llama-3.1-8B, 6.7 for DeepSeek. Self-Debias Iter2 reaches
  81.7 average and gains 0.4 from self-correction; on 1,000 uninjected BBQ
  samples errors fall 89 -> 26.


  Evidence is measured, with ablations on trajectory-level vs response-level
  optimisation (80.8 -> 78.5), the consistency filter, and constraint
  strength, plus a Llama-3.1-8B replication (52.3 -> 81.4). Fairness gains on
  the natural-generation chain-level bias rate are small (29.2% -> 23.1%), BBQ
  supplies both training and test distribution, and all backbones are 7-8B.


  Treat prompted post-hoc debiasing as actively harmful and budget for
  training if you want test-time correction to help.
