brief: >-
  Asked to find latent bugs with only documentation as the oracle, current
  models almost always fail: the best single-shot score is a 16.06%
  Fail-to-Pass rate. TestExplora frames test generation as proactive discovery
  rather than regression prevention or reproducing a reported issue, so no
  defect signal is in the prompt.


  The benchmark holds 2,389 test-generation tasks from 1,552 pull requests
  across 482 repositories (>1,000 stars each), with a 517-sample Lite subset
  over 330 PRs. Models see DocAgent-written documentation plus either entry
  code and dependencies (White Box) or documentation only (Black Box). 6
  models were run 3 times each, plus SWEAgent and TraeAgent.


  GPT-5-mini led the plain setting on Lite at 11.84 F2P White Box and 7.67
  Black Box; Claude-Sonnet-4.5 reached 16.06. SWEAgent with GPT-5-mini reached
  17.27 F2P and 29.7 at pass@5. GPT-4o fell from 3.6% Black Box to 2.2% White
  Box, so more context is not uniformly helpful. All models scored higher on
  pre-2023 PRs, which the authors read as SWEBench contamination.


  Evidence is execution-based and repeated, with ablations on documentation
  source and dependency type, and a GPT-5 leakage audit finding 16 (1.03%)
  patch-leak cases. Python only; agentic comparison covers 2 agents and 2
  models, with no matched token budget.


  Treat agent scaffolds, not larger context windows, as the lever here.
