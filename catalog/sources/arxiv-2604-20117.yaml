  constructed rather than passively copied. Despite the generative nature of
  Large Language Models (LLMs), most existing agent memory systems are still
  based on dense retrieval. However, dense retrieval heavily relies on
  semantic overlap or entity matching within sentences. Consequently,
  embeddings often fail to distinguish instances that are semantically similar
  but contextually distinct, introducing substantial noise by retrieving
  context-mismatched entries. Conversely, directly employing open-ended
