  memory overhead inherent in the self-attention mechanism. To address these
  challenges, we introduce \textsc{AllMem}, a novel and efficient hybrid
  architecture that integrates Sliding Window Attention (SWA) with non-linear
  Test-Time Training (TTT) memory networks. \textsc{AllMem} enables models to
  effectively scale to ultra-long contexts while mitigating catastrophic
  forgetting. This approach not only overcomes the representation constraints
