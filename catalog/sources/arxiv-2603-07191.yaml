summary: >-
  Autonomous agents powered by large language models introduce a class of
  execution-layer vulnerabilities -- prompt injection, retrieval poisoning,
  and uncontrolled tool invocation -- that existing guardrails fail to
  address systematically. In this work, we propose the Layered Governance
  Architecture (LGA), a four-layer framework comprising execution sandboxing
  (L1), intent verification (L2), zero-trust inter-agent authorization (L3),
  and immutable audit logging (L4). To evaluate LGA, we construct a
  bilingual benchmark (Chinese original, English via machine translation) of
  1,081 tool-call sample
