brief: >-
  Filtering supervised fine-tuning targets down to facts the base model can
  already recall reduces hallucinations, but mostly by making the model refuse
  more rather than by making it more accurate at equal coverage.


  The study frames several mitigations as knowledge-aligned SFT and compares
  them on the English first-turn subset of OASST1 (3,468 examples) with
  Qwen3-4B-Base and OLMo 3 7B: FLAME (self-generated targets), UNIT cut
  (confidence filtering), plus 2 new variants, Evidence Rewrite (external
  Wikipedia verification) and Recall Rewrite (keep a claim only if the base
  model answers several paraphrased probes consistently). Evaluation covers
  WildHalu, Biography, UnknownBench, and 4 OLMES tasks.


  Recall Rewrite raises FActScore from 74.4 to 84.1 on WildHalu and 34.1 to
  76.4 on Bios, but refusals rise from 2 to 55 and from 4 to 252, and
  supported claims fall. FLAME does not beat standard SFT. UnknownBench F1
  improves on all 3 subtasks with the lowest precision. OLMES average drops
  0.9 points; the IFEval gap is explained by refusing 30 of 541 prompts.


  Method comparisons are correlational; only 1 ablation varies %Known
  (100/50/0) at fixed set size and refusal count, on 1 model and dataset.
  Evaluation is automatic, entity-centric, and depends on
  gpt-4o-mini/gpt-5-mini teachers; stacking with DPO or RLVR was not tested.


  Treat the FActScore gains as a shift in response policy, not better factual
  generation.
