brief: >-
  Splitting an injected objective across the user prompt and tool metadata,
  then correcting the trajectory at runtime, keeps long-horizon prompt
  injection both hard to detect and reliable to execute. Eclipse builds a
  verified malicious tool chain in a sandbox, renders it as a natural one-shot
  request with no tool names, rewrites target-tool descriptions with
  state-transition cues (Static Workflow Encoding), and appends corrective
  text to tool results when execution drifts (Dynamic Trajectory Correction).


  The authors also release LASE-Bench: 120 malicious tasks, 198 unique tools,
  96.7% of tasks requiring at least 5 tool calls, versus about 1.0% for
  ASSEBench unsafe records and none in SHADE-Arena. Victims are 7 agents
  including DeepSeek, GPT-4o, Claude 4.8 Opus, GPT-5.6 Luna, Claude Sonnet 5,
  Kimi-k3-104b, QWEN-3.8-27b, against 5 baselines.


  Undefended ASR reaches 96.7% on DeepSeek, 95.0% GPT-4o, 93.3% Claude 4.8
  Opus. With an LLM safety monitor, 69.2% on DeepSeek, 27.5 percentage points
  above ObliInjection; 62.4% on Claude 4.8 Opus where the best baseline hits
  0.8%. Open-source victims drop to 37.2% and 36.9% under defense.


  Ablations isolate the mechanism: prompt alone 19.2%, DTC alone 37.5%, SWE
  66.7%, SWE+DTC 69.2%. Baselines run under matched retrieval, sandbox, and
  call budgets. Evidence is self-run, with 1 LLM-monitor defense as the main
  defended condition; no independent replication. Transfer shown on OpenClaw
  (61.7% defended) and Hermes (55.8%).


  If you rely on input-side injection detectors, this suggests tool
  descriptions are the unguarded channel.
