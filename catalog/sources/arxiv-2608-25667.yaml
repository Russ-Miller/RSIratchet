brief: >-
  Fluency in security reports has stopped being a proxy for correctness, and
  the standard mitigations aimed at that problem target provenance rather than
  truth. This survey collects empirical failure cases of LLMs in vulnerability
  assessment and organizes them into 3 branches: hallucinated vulnerabilities,
  plausible but incorrect patches, and semantic repackaging of existing
  findings into report spam.


  The review covers IEEE Xplore, ACM DL, and arXiv with 2 independent
  screeners, retaining studies with concrete failure evidence rather than
  aggregate scores. Cited results include models reporting vulnerabilities in
  benign code, judgments flipping under semantics-preserving variable
  renaming, patches that fix symptoms while introducing new CWEs, and readers
  preferring incorrect AI explanations for their clarity. The cURL case is the
  operational anchor: by mid-2025 roughly 20% of HackerOne submissions were
  low-quality AI slop while valid reports fell to around 5%, and the program
  was discontinued in January 2026.


  Nothing here is measured by the authors. The Deductive Coverage Score and
  the 2 proposed instruments, CVE-Bench and Slop-Score, are specified but not
  run; no baselines, no datasets, no discrimination numbers. The claim that
  chain-of-thought and tool use narrow but do not close the gap rests on cited
  work, not new experiments.


  Useful as a framing and a benchmark design document, not as evidence about
  any specific model.
