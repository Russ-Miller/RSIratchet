brief: >-
  When a symbolic planner hits an impasse because a novel object has no
  matching operator, prompting an LLM to write the missing PDDL operator works
  where RL-based operator discovery almost never does.


  The system pairs a breadth-first "search-and-prompt" loop (GPT-o3,
  temperature 0.3, self-consistency over 5 samples) that proposes one missing
  operator per search state, with PPO skill learning guided by 3 dense
  reward-shaping functions written by GPT-o4-mini, trained as an ordered
  sub-goal curriculum with the worst candidate pruned every 2 x 10^5
  timesteps. Evaluation covers 4 mimicgen manipulation domains: Kitchen (lid),
  Nut Assembly (round peg), Coffee-Box, Coffee-Drawer.


  The hybrid planner identified the missing operators 10/10 times in 3 domains
  and 7/10 in Coffee-Drawer, taking 45.26 sec to 681.83 sec. Operator
  Discovery succeeded 10/10 only in Kitchen and 0/10 elsewhere, exceeding 7 h.
  The guided RL agent passed 90% average success and progress on most
  operators.


  Evidence is measured against 2 named baselines, LEAGUE-sparse and a reward
  machine, over 10 seeds with Wilcoxon signed tests; all comparisons reached p
  < 0.05 except pick-up-lid-from-pot vs the reward machine (0.1094). All in
  simulation, 1 LLM family, ground-truth predicate checking rather than
  perception, and 1 novelty at a time.


  If you build TAMP agents, treat missing-operator identification as an LLM
  job rather than an exploration job.
