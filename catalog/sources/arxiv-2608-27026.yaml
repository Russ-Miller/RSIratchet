summary: >-
  Large Audio Language Models (LALMs) have demonstrated strong performance
  across a wide range of audio understanding tasks. However, they are
  typically evaluated on single, coherent audio segments, leaving their
  behavior under less familiar input configurations underexplored. We study
  this issue through a controlled setting in which two audio segments are
  concatenated into a single input. Across multiple LALMs, we observe a
  striking task-dependent robustness gap: automatic speech recognition (ASR)
  remains comparatively stable, whereas audio question answering (AQA)
  degrades substantially. To in
