brief: >-
  Vision-language judge models that look reliable in English can degrade
  sharply in other languages, and size or family does not predict which ones
  hold up. MM-JudgeBench translates VL-RewardBench and OpenCQA into 25
  typologically diverse languages (over 60K pairwise preference instances)
  using Gemini-3-Pro, plus a 100K-sample multilingual training set from
  MM-RewardBench, and runs 22 LVLMs (15 open, 7 proprietary) as pairwise
  judges with rationales.


  GPT-5 leads at 81.3% average accuracy with 0.2 cross-language variance.
  Efficiency-tuned variants collapse: Gemini-2.5-Flash-Lite 40.8%,
  Claude-4.5-Haiku 56.4%. Qwen3-VL is the strongest open family, scaling 54.3%
  at 2B to 68.8% at 32B. The reward-specialized LLaVA-Critic-7B scores 49.5%.
  Kazakh is the worst language for most models; English usually the best.
  Fine-tuning Qwen3-VL-8B on the training set gives +14% over direct prompting
  and +10% over rationale prompting.


  Effects are measured, with order-swapped position-bias checks and a
  translation sensitivity ablation: weaker translators drop Qwen3-VL-32B 68.8
  to 64.4 to 58.1 and inflate Qwen3-VL-2B variance from 1.6 to 13.2, but
  rankings hold.


  OpenCQA labels come from GPT-5 itself (300 samples, 93.5% human agreement),
  so that subset measures agreement with a proprietary judge rather than
  ground truth. Treat English judge scores as an upper bound.
