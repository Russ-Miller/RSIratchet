summary: >-
  Automatic evaluators such as reward models play a central role in the
  alignment and evaluation of large vision-language models (LVLMs). Despite
  their growing importance, these evaluators are almost exclusively assessed
  on English-centric benchmarks, leaving open the question of how well these
  evaluators generalize across languages. To answer this question, we
  introduce MM-JudgeBench, the first large-scale benchmark for multilingual
  and multimodal judge model evaluation, which includes over 60K pairwise
  preference instances spanning 25 typologically diverse languages.
