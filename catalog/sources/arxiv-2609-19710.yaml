summary: >-
  Software systems increasingly embed a large language model in features
  that must satisfy a numeric output constraint, that is, a requirement
  expressible as a number or an interval and checkable by code, such as a
  target word count or a target readability grade band. Because such a model
  is non-deterministic, is configured through natural-language instructions
  rather than a typed interface, and satisfies a stated requirement only
  approximately, a single prompt neither reliably meets the target nor
  preserves the source content. This paper presents and evaluates a
  closed-loop control architecture
notes: >-
  Filed as a source on procedure-following from the classifier's judgement
  that the paper is about it (improves, high): A deterministic
  generate-evaluate-adjust control loop raises numeric constraint
  satisfaction from 21-32% single-shot to 92.5-98.8%, with the low
  single-shot rates corroborating that models fail verifiable constraints
  often. No claim has been drafted from it yet.
