summary: >-
  Strategic reasoning in Large Language Models (LLMs) within long-horizon
  environments is often limited by inconsistent subgoals. In these settings,
  finite attention resources prevent the model from maintaining strategic
  coherence over thousands of steps. This limitation leads to strategic
  drift, where localized decisions fail to sustain a coherent trajectory
  across reasoning. To address this, we introduce EpicStar, a framework that
  enables agents to learn memory as policy to tackle long-horizon reasoning.
