brief: >-
  Forcing a video model to emit an ordered event summary before it reasons,
  and supervising that summary with the model's own agreement across samples,
  beats supervised fine-tuning on chain-of-thought annotations followed by RL.
  Self-supervision also beats ground-truth summary supervision at 7B scale.


  SDRL extends GRPO on Qwen2.5-VL-Instruct-7B with a Summarize to Think to
  Answer format, 16 frames, group size 8, 1,000 RL iterations on 32 A100s. Two
  token-wise weights: Consistency of Vision Knowledge (KL to a
  correctness-weighted summary center) and Dynamic Variety of Reasoning
  (entropy bonus scaled by 1 minus group accuracy). Evaluated on 7 VideoQA
  benchmarks plus a new 53K-pair temporal dataset, EventFlowQA.


  Against the SFT+RL baseline VideoRFT*, gains of 4.2% on NExT-GQA, 1.3% on
  MMVU, 0.7% on VideoMMMU, 2.8% on MVBench, 0.3% on TempCompass. On
  EventFlowQA, self-supervision gives +11.91% at 7B versus +6.19% for GT
  supervision, but at 3B GT wins (+3.01% vs +2.40%). Dynamic diversity beats
  static (52.22% vs 49.13%; 56.10% vs 55.78%); entropy beats KL.


  Ablations are component-wise and matched on data, with the 3B/7B contrast
  isolating scale. But results come from 1 backbone family, VideoMME and
  VSIBench do not uniformly improve, and several margins are under 1 point.


  If you were planning a CoT annotation run for video RL, this argues you may
  not need it at 7B and up.
