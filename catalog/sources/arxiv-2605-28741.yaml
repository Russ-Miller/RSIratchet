brief: >-
  Post-training a vision-language model for multi-step visual search degrades
  the single-step abilities it already had, and you can recover them at
  inference by letting the pre-trained base model propose tokens that the
  post-trained model accepts only when they fit its own distribution.


  SeProD pairs a visual-search post-trained model (the "search" model: Pixel
  Reasoner, DeepEyes, Mini-o3) with its Qwen2.5-VL base (the "prophet", 3B by
  default). At each turn the base model gets the cropped image and either a
  grounding-verification query or the original question; its output tokens are
  accepted as prefixes when a geometric mix of both models' probabilities
  exceeds τ=0.3. Evaluation covers V* Bench, HR-Bench 4K/8K, VisualProbe-test,
  plus MME-RealWorld, ScienceQA, OCRBench, CVBench.


  Post-training cut grounding, OCR, spatial understanding and counting by
  49.3%, 2.3%, 10.9% and 3.0%. SeProD gains on all 12 splits: +3.3 on
  VisualProbe hard and +2.9 on V* overall for Mini-o3, +4.3 and +4.1 with a 7B
  prophet. Acceptance rates 74.2%–80.7%, speedup 1.03x–1.07x.


  Measured, with ablations isolating grounding verification vs answer
  drafting, a τ sweep, a fixed-vs-dynamic α comparison, and a naïve
  prompt-injection baseline that mostly hurt (46.2 vs 50.5 hard). All
  baselines share the Qwen2.5-VL family; reported numbers for prior work are
  partly reproduced by the authors.


  Boundary: tested only on high-resolution visual search and 4 general VQA
  sets, and only where a matched pre-training checkpoint exists.


  If you post-train for agentic visual reasoning, keep the base checkpoint
  around as a decoding-time corrector.
