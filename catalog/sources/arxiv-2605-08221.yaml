brief: >-
  Perturbing a model's hidden states with Gaussian noise, running 5 such
  trajectories, and abstaining when they disagree gives a usable confidence
  signal without retraining. Agreement among noise-perturbed latent paths
  tracks correctness as well as token-level self-consistency is claimed to,
  and needs no fine-tuning or training data.


  NoisyCoconut adapts the Coconut continuous-chain-of-thought loop: noise is
  injected into the first hidden state after the first forward pass, with
  exponentially decaying scale, and up to 8 latent steps. Tested on
  Qwen2.5-7B-Instruct, Llama-3.1-8B-Instruct, Mixtral-8B-Instruct-v0.1,
  gpt-oss-20B, and DeepSeek-R1-Distill-Qwen-7B, over 1000 sampled questions
  each from GSM8K, GSM-Symbolic, and MMLU.


  At unanimous 5/5 agreement, error rates fall from 40% to 70% at low
  agreement to below 15%. On GSM8K no baseline exceeds 75% accuracy, yet all
  models exceed 90% at 5/5, with coverage 31.1% (Llama-3.1-8B) to 53.2%
  (gpt-oss-20B). DeepSeek-Qwen goes 62.0% to 95.2% at 31.4% coverage.


  The comparison is greedy single-path decoding, not token-space
  self-consistency at matched 5x compute, so the latent-space part of the
  claim is not isolated. Noise calibration (sigmoid fits, R2 >= 0.94)
  justifies sigma0 = 0.2. Hyperparameter ablations are component-wise only.


  Boundaries: open weights required, exact-match answers only, no open-ended
  generation, and gpt-oss-20B needed first-layer rather than final-layer
  feedback to avoid degenerate output.


  Treat this as evidence that representational instability is readable, not
  yet that latent noise beats resampling.
