  enhances large language model (LLM) reliability by manipulating internal
  representations. Unlike fine-tuning methods that require extensive
  retraining, NoisyCoconut operates directly on model representations during
  inference and requires no retraining. Rather than training models to
  reason in latent space, we inject controlled noise into latent
  trajectories to generate diverse reasoning paths. Agreement among these
  paths provides a confidence signal, enabling models to abstain when
