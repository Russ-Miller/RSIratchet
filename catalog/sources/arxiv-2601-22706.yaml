brief: >-
  Asking a model to write repository-level Java code that is both functionally
  correct and free of real vulnerabilities fails almost completely, and
  neither retrieval nor security prompting fixes the security half.


  RealSec-bench contains 105 task instances from 30 Maven-based Java
  repositories, built by CodeQL scanning 532 high-risk repos (over 20,000
  candidate findings), LLM false-positive filtering, and expert review. It
  spans 19 CWE types and taint paths up to 34 hops. 5 models were tested:
  Claude-3.7-Sonnet, GPT-4.1, GPT-4.1-mini, Deepseek-V3, Qwen3-235B.


  Best Pass@1 was 16.19% (Claude-3.7-Sonnet); no model exceeded 8% on the
  composite SecurePass@k. On Crypto & Web Security, Claude reached 38.89%
  Pass@1 but 0.00% SecurePass@1. Code Quality tasks were easy (GPT-4.1 80%
  SecurePass@1), but only 5 tasks. RAG helped functional correctness; dense
  retrieval topped Claude at 7.6% SecurePass@1, and the high-precision
  dataflow retriever underperformed text retrieval. Security guidelines
  dropped Claude's Pass@1 from 16.2% to 9.5%.


  Measured, with ablations on the judging pipeline: raw SAST precision 44.9%,
  voters 63.0%, voters plus judge 81.7% precision and 98.0% recall on 89
  manually reviewed alerts.


  Category cells rest on 4–18 tasks, so per-category figures are fragile. Java
  and Maven only; 56.2% of instances are log injection.


  Treat secure repo-level generation as unsolved, and don't expect
  prompt-level security instructions to transfer across models.
