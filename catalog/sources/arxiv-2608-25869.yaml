summary: >-
  Large language models (LLMs) increasingly assess generated content, giving
  rise to the LLM-as-a-Judge paradigm. These systems now score outputs,
  filter content, and gate iterative refinement in production pipelines,
  where each judgment is often assumed to be independent of earlier
  evaluations. We test this assumption using three prompt conditions: no
  metadata, revision framing, and anchored metadata containing revision,
  attempt, and prior-score fields. We show that prior scores, even when
  included only as context metadata, anchor judgments and systematically
  shift ratings toward their values.
