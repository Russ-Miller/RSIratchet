brief: >-
  Frontier VLMs are unreliable judges of graphic layout aesthetics, and
  image-preference reward models trained on text-to-image data do not transfer
  to layouts at all. PickScore scores 0.461 binary accuracy on layout pairs,
  below chance-level coin flipping.


  DesignSense-10k contains 10,235 human-annotated layout preference pairs
  built from Crello via a 5-stage pipeline (semantic grouping with GPT-4o,
  candidate generation with AesthetiQ, filtering, IoU clustering, o3-based
  refinement), annotated as left, right, both good, or both bad. An
  InternVL3-8B classifier is fine-tuned on 8,735 pairs and tested on 1,000.


  It reaches 0.456 Macro F1 and 0.732 binary accuracy, against 0.295 Macro F1
  for GPT-5-fewshot-deepthink and 0.719 binary accuracy for OpenAI-o3-fewshot.
  The gap between high binary accuracy and low Cohen's κ (0.164 for
  o3-fewshot) indicates frontier models mostly fail the tie classes. On unseen
  LayoutNUWA pairs, 4-class accuracy is 68.3% versus 42.5% for Gemini 2.5-Pro.


  A perturbation-augmentation ablation accounts for 12.3% of the Macro F1
  gain. Downstream claims rest on GPT-4o and GPT-5 as proxy judges, not
  humans: AAPA win rate rises 14.27%→17.97% (GPT-4o) and inference-time
  selection over 10 candidates lifts 16.6%→20.2% on 20% of the test set.
  Inter-human 4-way agreement is only 56%, capping the ceiling.


  No matched-compute baseline for the RL arm, 1 backbone, 1 generator family
  for training. Treat layout preference as a domain needing its own reward
  model rather than a transferable one.
