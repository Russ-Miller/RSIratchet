summary: Air-Ground Object Search (AGOS) in urban environments is a
  challenging embodied task, which requires an Unmanned Aerial Vehicle (UAV)
  and an Unmanned Ground Vehicle (UGV) to jointly search for and verify a
  specified target vehicle from multi-view visual references. To study this
  underexplored problem, we introduce AGOS-Bench, the first dedicated
  benchmark for evaluating whether general-purpose Vision-Language Models
