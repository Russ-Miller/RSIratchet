summary: >-
  Large language models can produce fluent reasoning traces whose local
  semantic errors propagate to an incorrect conclusion, while unconstrained
  self-correction may preserve, amplify, or introduce errors. Existing
  diffusion language models provide iterative refinement, but usually define
  noise as token masking or replacement rather than as errors in the
  reasoning process. We present Semantic Reasoning Denoising (SRD), an
  operatorized Markov denoising method for natural-language reasoning
  trajectories. SRD represents semantic noise with executable error
  operators that describe the error type, it
