summary: >-
  While Video Large Language Models (Video-LLMs) have recently demonstrated
  strong performance, reliably evaluating their fine-grained video
  understanding remains challenging. Existing benchmarks often rely on
  question answering or ground-truth caption matching, where models may
  succeed through superficial cues and incomplete annotations. To this end,
  we introduce VidOmni-Bench, a benchmark that requires models to verify
  whether each event in dense video captions is supported by the video.
