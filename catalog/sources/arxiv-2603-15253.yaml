brief: >-
  Vision-language models used as hallucination detectors carry a position
  bias: sentences appearing early in a caption get judged correct regardless
  of whether they actually are.


  HalDec-Bench collects captions produced by a range of VLMs and pairs them
  with human annotations covering whether a hallucination is present, which
  category it falls into, and segment-level labels within the caption. The
  tasks span a spread of difficulty levels.


  The source text reports results qualitatively and gives no figures. The
  benchmark separates detector models that existing multimodal reasoning and
  alignment benchmarks score as similar. The authors also report that dataset
  noise in image-caption corpora can be cut substantially by filtering with a
  strong VLM while generating captions with a recent VLM.


  The position-bias finding is measured on the benchmark's segment-level
  labels, which is the right granularity to isolate it, but no figures,
  ablations, or matched baselines are described in the text available here,
  and the filtering claim is phrased as suggestive rather than demonstrated.


  Unclear from this text how many captioning models, detectors, or annotated
  captions are involved, or whether the bias persists outside captioning into
  other judge tasks.


  If you use a VLM as a data-curation filter, test whether its verdicts depend
  on where in the response a claim sits.
