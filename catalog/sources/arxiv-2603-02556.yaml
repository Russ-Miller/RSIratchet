brief: >-
  Showing a VLM a second, visually similar image with a synonymous question
  makes it correct its own visual hallucinations more often than giving it the
  ground-truth answer as a hint, and rationales produced this way transfer
  back into single-image reasoning after finetuning.


  VC-STaR builds on that: 21 VQA datasets across reasoning, math, chart/graph,
  general and OCR are paired by image and question embedding similarity, only
  median-difficulty pairs are kept, a VLM writes a coarse rationale then a
  contrastive analysis, and Qwen2.5-72B rewrites the rationale. The result is
  VisCoR-55K, used for full SFT of Qwen2.5VL-7B.


  Average across MMVP, HallusionBench, MathVista, MathVision, MMStar and
  MME-RealWorld rises from 55.5 to 58.1, with +5.7 on MMVP and +3.2 on
  Hallusion. STaR, Verifier and Feedback baselines gained on hallucination
  benchmarks while losing on math and general (averages 55.4, 54.9, 56.4); the
  best off-the-shelf reasoning dataset, LPT, reached 56.9.


  Self-improving baselines were reproduced on the same 55K pairs, which
  matches data scale if not token budget. Ablations cover pair-construction
  source, difficulty (adding 20K-40K easy samples cost 1.1-3.4 points),
  positive vs negative counterparts on GQA, and 2 further bases: Qwen2.5VL-3B
  (+6.3 Hallusion) and InternVL2.5-8B (+7.2).


  Gains are small on MMStar and MathVision, no RL comparison, and no
  independent replication.


  If you are generating visual CoT data, pairing images may be cheaper than
  captioning them.
