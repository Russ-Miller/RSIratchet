brief: >-
  Scattering near-miss decoys through a long context collapses frontier model
  accuracy on an otherwise easy retrieval task, and clustering the same decoys
  next to the target restores it almost entirely. The decoys themselves are
  not the difficulty; their dispersal across context is.


  PredicateLongBench asks models to find the longest contiguous run of words
  satisfying predicates (string prefix/suffix/containment, or lexicographic
  ordering) in lists of roughly 128K tokens synthetic, up to 365K from
  LongBench v2 documents. 9 configurations across Opus 4.6, GPT-5.4, Gemini
  3.1 Pro, MiniMax 2.7, GLM 5.1, Qwen 3.5 397B, 100 examples per variant (93
  for open models on LongBench tasks), 16K max output tokens.


  Opus 4.6 high goes from 97 on the synthetic lexicographic baseline to 1 with
  8 near-sorted decoys, then back to 98 when those decoys are clustered. With
  decoys present, no model exceeds 2 on the synthetic lex task. Holding token
  count at 128K but shortening words so the list grows from 26K to 60K words
  drops GPT-5.4 high from 92 to 10. Open-source models sit at single digits or
  0 on everything except the unary baseline.


  Effects are measured, with each variant perturbing 1 axis against its own
  baseline, which isolates the axes well. The search-space result rests on 1
  model. Failure analysis is partly anecdotal: 5 Opus queries at a 64K budget,
  plus OSS reasoning traces. First-word accuracy on wrong answers is 0 across
  all models, so failure is location, not reproduction.


  If you treat context length as the main long-context variable, add
  search-space size and decoy dispersal.
