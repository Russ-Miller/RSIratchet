summary: >-
  Large language models (LLMs) are increasingly used for emotional support
  and relationship advice, where a model's tendency to preserve a user's
  face can inadvertently reinforce harmful interpersonal behaviors. To
  systematically examine this risk, we developed the Romantic Relationship
  Advice-Seeking Prompts (RRASP) dataset of 2,400 prompts across five
  relationship themes and evaluated social sycophancy using the ELEPHANT
  framework on two consumer-facing models, GPT-5 Mini and Gemini 3 Flash.
