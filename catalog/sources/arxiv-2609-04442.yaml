brief: >-
  Anchoring claim-level uncertainty to external trusted documents, rather than
  to agreement across sampled LLM responses, separates grounded facts from
  confidently repeated hallucinations and yields calibrated abstention. GRACE
  decomposes responses and trusted priors into atomic claims in a weighted
  bipartite graph, uses weighted closeness centrality to label each claim
  Grounded, Refuted, or Boundary, and routes only high-priority uncertain
  Boundary claims to a verifier under a Return on Attention rule.


  Evaluation covers QASPER (100 papers) and QuALITY (50 articles) with
  GPT-4o-mini and LLaMA 3.1 8B, against zero-shot partial/full context, RAG,
  and GraphRAG.


  On QASPER GRACE reaches 28.1% accuracy on both models versus 19.8% and 18.5%
  for RAG, with answerability near accuracy (50.6%, 50.5%) while GraphRAG
  reports 90.4% and 95.2% answerability. Across 3 expansion rounds on 334
  QASPER questions, QA accuracy rises 14.1%→49.1%, above the full-paper
  context 33.6%; prior coverage 63.1%→83.4%, frontier 10.02→4.57 claims/paper,
  grounding precision 97.6%. Scaling from 1 to 50 documents (91→4,554 claims)
  costs 52.18%→47.16%.


  The expansion loop is measured with an LLM verifier (GPT-4.1) standing in
  for experts; a 15-paper, 15-student human round matched coverage (93.63% vs
  93.58%) and accuracy but resolved more frontier, with no gold key so Yield
  is acceptance not correctness. Only 1 expansion round was tested with
  humans, 2 models, and priors are assumed equally trustworthy.


  If you build retrieval for audited settings, centrality over priors is a
  cheap calibration signal worth testing against GraphRAG.
