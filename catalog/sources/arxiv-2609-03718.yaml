summary: >-
  Computer-aided engineering (CAE) simulation is among the largest and most
  demanding areas of engineering, where setting up a solver such as
  OpenFOAM, FEniCS, or COMSOL takes real expertise. Large language model
  (LLM) agents promise to turn a natural-language request into a working
  simulation, and recent CAE agents add simulation-specific machinery:
  multi-agent decomposition, domain retrieval, and scripted reflection. That
  machinery suited weak base models; modern harnesses already supply
  multi-turn reasoning, tool use, and execution feedback. We ask what a CAE
  simulation agent still needs beyo
notes: >-
  Filed as a source on multi-model-coordination from the classifier's
  judgement that the paper is about it (degrades, high): A single-agent
  generic harness matched or beat multi-agent specialized CAE systems (96.4%
  vs 88.2%), indicating multi-agent decomposition adds no benefit and
  underperforms for strong base models. No claim has been drafted from it
