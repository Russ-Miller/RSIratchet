brief: >-
  Gains on math, code, and knowledge benchmarks across model generations do
  not carry over to theory-of-mind or coordination tasks, and coordination
  performance is close to flat across 2 years of model releases.


  The test covers 41 instruction-tuned open-weight models from the Qwen and
  LLaMA families, 0.5B to 235B parameters, releases from 2023 to 2025, on 7
  benchmarks: MATH-500, MMLU-Pro, HumanEval, GPQA as single-agent; ToMBench
  and EmoBench as multi-agent understanding; CoordinationQA (198 questions
  from 4 coordination games) as multi-agent planning. Accuracy is the unified
  metric, pass@1 for HumanEval.


  For ~8B models, Qwen-1 to Qwen-3 single-agent accuracy rises from 0.23 to
  0.64 while multi-agent understanding moves from 0.44 to 0.55. For ~72B,
  Qwen-1 to Qwen-2.5 goes 0.42 to 0.71 single-agent versus 0.57 to 0.67
  understanding. Coordination accuracy for ~8B models sits between 0.2 and
  0.35 across generations, and sometimes declines at ~72B (LLaMA-3 to
  LLaMA-3.1). Models with single-agent accuracy of 0.6–0.8 show wide spread in
  coordination accuracy.


  This is correlational across generations, not a controlled intervention;
  training data and post-training differ between checkpoints, and only 2 model
  families and 1 coordination benchmark are used. No closed models, no
  interactive multi-agent testbeds, no training remedy is tested; the rest of
  the paper is a research agenda.


  If you treat leaderboard gains as a proxy for agent-team readiness, this
  argues you need separate evaluation.
