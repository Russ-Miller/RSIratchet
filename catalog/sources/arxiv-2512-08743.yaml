brief: >-
  Gains on math, code, and knowledge benchmarks across model generations do
  not carry over to theory-of-mind or multi-agent coordination tasks, which
  stay nearly flat.


  The authors evaluated 41 instruction-tuned open-weight models from the Qwen
  and LLaMA families, spanning 0.5B to 235B parameters and 2023 to 2025
  releases, on 7 benchmarks: MATH-500, MMLU-Pro, HumanEval, GPQA for
  single-agent ability; ToMBench and EmoBench for multi-agent understanding;
  CoordinationQA (198 questions from 4 coordination games) for multi-agent
  planning.


  For ~8B Qwen models, single-agent accuracy rose from 0.23 to 0.64 across
  Qwen-1 to Qwen-3 while multi-agent understanding moved only from 0.44 to
  0.55. For ~72B models, 0.42 to 0.71 versus 0.57 to 0.67. Coordination
  accuracy for ~8B models stayed between 0.2 and 0.35 across generations and
  slightly declined for ~72B models from LLaMA-3 to LLaMA-3.1. Models at
  0.6–0.8 single-agent accuracy show wide spread in planning accuracy.


  The evidence is a cross-sectional correlation over public checkpoints, not a
  controlled intervention: generation changes bundle data, scale, and
  post-training, so nothing isolates the cause. Only 2 families, all
  QA-format, no interactive multi-agent testbed, no closed or
  reasoning-specialized models.


  If you assume coordination competence rides along with benchmark scores,
  treat that as unsupported.
