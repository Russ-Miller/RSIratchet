brief: >-
  Gains in single-agent benchmark accuracy across model generations do not
  carry over to theory-of-mind or multi-agent coordination tasks, and
  coordination performance is close to flat.


  The comparison covers 41 instruction-tuned open-weight models from the Qwen
  (Qwen through Qwen3) and LLaMA (LLaMA-2 through LLaMA-3.3) families, from
  0.5B to 235B parameters and releases spanning 2023 to 2025, run via vLLM
  with official hyperparameters. Benchmarks: MATH-500, MMLU-Pro, HumanEval,
  GPQA for single-agent; ToMBench (2,860 questions) and EmoBench (400
  questions) for multi-agent understanding; CoordinationQA (198 questions from
  four coordination games) for multi-agent planning.


  For ~8B Qwen models, single-agent accuracy rises from 0.23 to 0.64 across
  Qwen-1 to Qwen-3 while understanding accuracy moves only 0.44 to 0.55. At
  ~72B, 0.42 to 0.71 versus 0.57 to 0.67. Coordination accuracy for ~8B models
  stays between 0.2 and 0.35 across generations, and at ~72B declines slightly
  in places (LLaMA-3 to LLaMA-3.1). Models with single-agent accuracy of
  0.6-0.8 vary widely in coordination accuracy.


  The effect is measured, across 2 families, but it is a cross-generation
  correlation with no controlled intervention: pretraining data and tuning
  differ arbitrarily between generations, so nothing isolates why the gap
  persists. Only understanding and planning were tested; communication
  efficiency and adaptation are discussed, not measured. Proprietary and
  reasoning-specialised models are absent.


  Treat coordination competence as something to test for separately rather
  than infer from benchmark scores.
