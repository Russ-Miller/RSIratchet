summary: >-
  Video Temporal Grounding (VTG), the task of localizing video segments from
  text queries, struggles in open-world settings due to limited dataset
  scale and semantic diversity, causing performance gaps between common and
  rare concepts. To overcome these limitations, we introduce OmniVTG, a new
  large-scale dataset for open-world VTG, coupled with a Self-Correction
  Chain-of-Thought (CoT) training paradigm designed to enhance the grounding
  capabilities of Multimodal Large Language Models (MLLMs). Our OmniVTG is
