brief: >-
  Multimodal LLMs produce more accurate timestamps when asked to dense-caption
  a video than when asked to ground a query directly, and that asymmetry can
  be exploited both to label data and to make the model correct its own
  predictions.


  OmniVTG uses Gemini-2.5-Pro to caption web videos retrieved by LLM-generated
  keywords targeting words absent from existing grounding datasets, yielding
  2124.1 h of video and 359.2 K query-moment pairs with 22.5 K unique
  adjectives. Qwen2.5-VL-7B is then trained in 3 stages: multi-task SFT
  (grounding, captioning, query-clip matching, event status), a "predict then
  correct" CoT finetune built from nested event pairs, and GRPO RL.


  Zero-shot R1@0.5 reaches 63.2 on Charades-STA, 39.8 on ActivityNet, 67.0 on
  QVHighlights, 37.6 on TVGBench, above Time-R1 (60.8 / 39.0 / 66.2 / 29.4).
  On the OmniVTG rare-concept subset the model scores 62.4 versus 63.3 full,
  while Time-R1 falls 33.9 to 29.4.


  The stage ablation isolates each component (SFT 62.3, +CoT 62.4, +RL 62.8,
  full 63.3 on OmniVTG; 25.6 to 39.8 on ActivityNet) and a data-scale sweep
  (10%/50%/100%) supports the dataset's contribution. Only 1 model family and
  1 size were tested, and baselines were not retrained on OmniVTG, so dataset
  and method effects are not separated from each other against competitors.


  The test set shares its annotation distribution with training; 93.82% of
  automated timestamps had IoU above 0.5 with human correction on the 10,871
  manually checked videos.


  If you build grounding data, caption-then-convert is worth preferring to
  direct localization prompts.
