brief: >-
  Multimodal LLMs produce more accurate timestamps when asked to dense-caption
  a video than when asked to ground a query directly, and that gap can be
  exploited twice: once to auto-annotate training data, once to make the model
  critique its own predictions.


  OmniVTG is a video temporal grounding dataset of 2124 hours, 46,176 videos
  and 359,221 query-timestamp pairs, built by finding vocabulary gaps in
  existing datasets, translating rare words into event-centric search keywords
  with Gemini-2.5-Pro, then prompting the same model for timestamped dense
  captions. Training is 3 stages on Qwen2.5-VL-7B: multi-task SFT (grounding,
  captioning, query-clip matching, event status), self-correction CoT
  finetuning that predicts a coarse span then narrows it, and GRPO.


  On 10,871 manually corrected videos, 93.82% of automatic timestamps had IoU
  above 0.5 with human correction. Zero-shot R1@0.5 reaches 63.2 on
  Charades-STA, 39.8 on ActivityNet, 67.0 on QVHighlights, 37.6 on TVGBench,
  above Time-R1 (60.8 / 39.0 / 66.2 / 29.4). On the OmniVTG rare-concept
  subset the model holds 62.4 against 63.3 on the full set, while Time-R1
  drops 33.9 to 29.4.


  Ablations isolate the stages: SFT alone gives 25.6 on ActivityNet, +CoT
  32.5, +CoT+RL 39.8, and SFT+RL without CoT falls to 37.2. Data scaling is
  measured at 10%, 50%, 100% (41.9 / 58.7 / 62.3).


  Only 1 model family and 1 size were tested, the test set shares its
  distribution with training, and the annotation quality check uses the same
  pipeline's own humans. Treat caption-then-ground as a usable trick for both
  labels and inference.
