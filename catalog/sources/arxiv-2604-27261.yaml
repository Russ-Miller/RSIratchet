brief: >-
  Text-to-SQL accuracy measured on a single benchmark database overstates how
  often predictions are actually semantically correct. Requiring the same
  prediction to match the gold query on a second, synthesized database
  instance removes several points of accuracy from every system tested.


  SynSQL generates test databases from the natural language question and
  schema alone, without gold SQL, in 3 stages: schema selection by
  ensemble-expansion, question-conditioned tuple synthesis, and a critic that
  scores 6 dimensions on a 1-10 scale and refines up to 3 iterations. It was
  run with GPT-4.1-mini, Gemini-2.5-Flash, Gemini-3-Flash, and Qwen-3-8B,
  against 10 text-to-SQL systems on Spider, BIRD, and Spider 2.0-SQLite.


  Compound accuracy drops 3-14% versus static evaluation; on BIRD the drop is
  6-9%, and on Spider 2.0 GPT 5.4 falls 14.07 under SynSQL with
  Gemini-3-Flash. Rankings mostly hold, but on Spider, Graphix overtakes C3.
  Structural validity reaches 99%; success rate on Spider (93.04%) exceeds the
  human-curated database (92.55%).


  Ablations isolate both components: removing the critic drops Qwen-3-8B
  success from 73.60% to 67.86%, and removing schema selection drops BIRD
  success to 71.25% from 82.07%, with an oracle schema at 91.46%. A vanilla
  single-pass synthesizer serves as the baseline.


  Failures were hand-analyzed on 500 BIRD questions: 84 empty-result cases, of
  which 44 were semantic and 17 of those traced to ambiguous BIRD annotations
  rather than synthesis. Only SQLite-scale, single-database settings were
  tested.


  Treat reported execution accuracy as an upper bound, especially when
  comparing systems within a few points.
