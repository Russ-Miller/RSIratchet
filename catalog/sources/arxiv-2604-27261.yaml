summary: "Evaluating text-to-SQL systems remains largely fragile: correctness
  is typically judged by executing predicted and gold SQL queries on a single
  static database, even though the same queries may behave differently under
  alternative database instances. This raises a broader language modeling
  question: Can large language models synthesize semantically meaningful,
  schema-consistent relational data directly from a natural language question?
  If so, such generation can serve as a controlled mechanism for
  stress-testing text-to-SQL systems beyond fixed benchmark databases. We
  introduce SynSQL, a frame"
