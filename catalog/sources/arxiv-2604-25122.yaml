brief: >-
  Multimodal LLMs fail at knowledge-based VQA when a question spans several
  fine-grained entities and several reasoning hops, and most of the gap is
  knowledge access rather than reasoning: handing models the exact gold
  sentence roughly doubles accuracy but still leaves them under 60%.


  M3-VQA contains 13125 (I, Q, A) triplets, 10565 unique images, 7611 unique
  questions, average 3.1 hops and 2.8 entities, built from fine-grained image
  datasets plus EVQA/InfoSeek, linked to Wikidata and a Wikipedia knowledge
  base of roughly 2 million entities. 16 MLLMs were evaluated under 3
  settings: image+question only, gold evidence at 3 granularities, and
  retrieval from the KB.


  Best image+question accuracy is 32.6% (Qwen2.5-VL-72B); Q-Only scores 15.6%
  on average, an 8.9% gap confirming the image matters. With gold sentences
  the best model reaches 58.7% and the average 49.9%. Agentic retrieval
  (Planner/Executor/Solver with detection, text and image retrieval) beats
  heuristic one-shot retrieval for every model tested, e.g. 29.4 vs 25.3 for
  InternVL2.5-8B, but trails the Sentence setting by about 20%.


  Evidence granularity and partial-evidence coverage are ablated under fixed
  complexity (4-entity parallel, 3-hop sequential), which isolates the
  knowledge-vs-reasoning split. Retrieval comparison is not matched on
  compute, GPT-4o serves as Planner for all agentic runs, chain-of-thought
  prompting is untested, and the data is English Wikipedia only.


  Use this if you want a VQA benchmark where retrieval quality, not answer
  formatting, is the bottleneck.
