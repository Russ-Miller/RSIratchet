brief: >-
  Asking a model to score how many of its own sampled answers agree with each
  other gives a better abstention signal than the sequence log-probability,
  and the gap widens as answers get longer. The agreement score can then be
  calibrated so the hallucination rate carries a distribution-free upper
  bound.


  The method samples a greedy response plus k-1 = 10 responses at temperature
  0.9 from a Gemini Pro model, uses LLM self-prompting (conditioned on the
  query) to count matches, and tunes the abstention threshold with conformal
  risk control or Risk-Controlling Prediction Sets. Evaluation covers Temporal
  Sequences from BIG-bench (4000 QA pairs, alpha = 0.05 and alpha = 0.1) and
  TriviaQA (1000 pairs, alpha = 0.1 and alpha = 0.2), with delta = 0.05 and
  20% held out for test.


  On Temporal Sequences, log-probability scoring gives a worse
  abstention/error trade-off than match count or expected match count at any
  sufficiently large calibration size. On TriviaQA, where answers are short,
  log-probability is competitive, slightly better at alpha = 0.1 and worse at
  alpha = 0.2. CRC and RCPS differ little; empirical Bernstein is worse than
  Bernoulli-KL and Hoeffding-Bentkus; the uncalibrated baseline violates the
  risk bound at small calibration sizes.


  The score comparison is measured and ablated across 3 score functions and 5
  calibration methods, with 10 resamples per calibration size, so the score
  effect is isolated. But only 1 model is tested, on 2 datasets, and the match
  function itself is a thresholded LLM similarity validated on 100 manually
  inspected pairs (4 mistakes at threshold 7 on Temporal Sequences, 2 on
  TriviaQA), so reported error rates are only guaranteed to understate the
  true rate by at most 5 percentage-points.


  If you abstain based on token probabilities for anything longer than a
  phrase, swapping to self-evaluated sample agreement is likely the cheaper
  improvement.
