brief: >-
  Asking a model to self-evaluate how many of its own sampled answers agree
  with each other gives a better abstention signal than its log-probabilities,
  and the gap appears only when answers are long.


  The method samples a greedy response plus k-1 = 10 extra responses at
  temperature 0.9, then prompts the LLM to judge similarity between the
  reference and the samples. The resulting match count (or an expected match
  count read off token log-probabilities) is thresholded, with the threshold
  calibrated by conformal risk control or risk-controlling prediction sets to
  bound the hallucination rate at a chosen α. Tested with Gemini Pro on
  Temporal Sequences (4000 QA pairs, long answers) and TriviaQA (1000 pairs,
  short answers).


  On Temporal Sequences at α = 0.05 and α = 0.1, log-probability scoring gave
  a worse abstention/error trade-off than both match-count scores at
  sufficiently large calibration sets. On TriviaQA at α = 0.1 and α = 0.2 the
  three scores were comparable, log-probability slightly better at α = 0.1 and
  slightly worse at α = 0.2. Uncalibrated baselines violated the risk bound on
  small calibration sets; empirical Bernstein was the weakest bound, and CRC
  versus RCPS made little difference.


  The risk bound is proved, not just measured, and the score comparison is run
  under matched calibration methods and sample sizes, which isolates the
  score. Evidence is 1 model, 2 datasets, closed-book QA only; the match
  function itself was validated on 100 hand-checked pairs per dataset, with 4
  residual errors on Temporal Sequences and 2 on TriviaQA.


  If your outputs are short, log-probability abstention is probably
  sufficient; if they are long, self-consistency scoring is what buys you the
  gain.
