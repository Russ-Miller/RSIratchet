brief: >-
  Self-consistency across sampled answers, scored by the model itself, gives a
  better abstention signal than sequence log-probability, and conformal risk
  control turns that signal into a hallucination rate with a distribution-free
  upper bound. The advantage over log-probability appears only when answers
  are long.


  The setup: a Gemini Pro model on 2 closed-book QA sets, Temporal Sequences
  from BIG-bench (4000 question-answer pairs, many long answers) and TriviaQA
  (1000 pairs, short answers). For each query the greedy response is the
  reference, k-1 = 10 more are sampled at temperature 0.9, and the score is
  the number of sampled responses the LLM judges similar to the reference
  (match count), or an expected count read off token log-probabilities.
  Thresholds are calibrated by CRC or 3 RCPS bounds (empirical Bernstein,
  Hoeffding-Bentkus, Bernoulli KL).


  On Temporal Sequences at alpha = 0.05 and alpha = 0.1, log-probability
  scoring gives a worse abstention-error trade-off at any given calibration
  method once the calibration set is large. On TriviaQA at alpha = 0.1 and
  alpha = 0.2, log-probability is competitive, somewhat better at 0.1 and
  worse at 0.2. CRC and RCPS differ negligibly; empirical Bernstein is worse;
  the uncalibrated baseline violates the risk target on small calibration
  sets.


  Evidence is measured, with calibration sizes varied, 10 resamples with
  replacement, 20% held out, and a bound comparison that isolates the
  calibration method from the score. Weaknesses: 1 model, 2 datasets, no
  human-rated hallucination endpoint beyond 100 manually inspected pairs per
  dataset used to set the match threshold, and the automatic match function is
  itself the same LLM. Match-function calibration left 4 mistakes in 100 on
  Temporal Sequences and 2 on TriviaQA, so reported error rates understate
  truth by up to 5 and 1 percentage points.


  If you already sample multiple responses, this gives you a risk-bounded
  abstention rule for free; do not expect a gain over log-probability on
  short-answer tasks.
