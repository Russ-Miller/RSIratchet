brief: >-
  Self-consistency across sampled responses, scored by asking the model itself
  whether two of its answers match given the question, gives a better
  abstention signal than sequence log-probability, and conformal calibration
  turns that signal into a hallucination rate with a distribution-free bound.


  The setup uses a Gemini Pro model on 2 closed-book QA datasets: Temporal
  Sequences from BIG-bench (4000 question-answer pairs, many long answers) and
  TriviaQA (1000 pairs, short answers). For each query the greedy response is
  compared against k-1 = 10 samples at temperature 0.9, yielding a match count
  or an expected match count from token log-probabilities; a threshold is then
  calibrated by conformal risk control or 3 RCPS variants (empirical
  Bernstein, Hoeffding-Bentkus, Bernoulli KL), with 20% held out, calibration
  subsamples drawn 10 times with replacement.


  On Temporal Sequences at alpha = 0.05 and alpha = 0.1, log-probability
  scoring gives a worse abstention-rate/error trade-off at any given
  calibration method; on TriviaQA at alpha = 0.1 and alpha = 0.2 the 2
  approaches are comparable. CRC and RCPS differ little; empirical Bernstein
  is worse; the uncalibrated baseline violates the risk constraint on small
  calibration sets.


  The risk bound is proved, and the comparison is matched across calibration
  methods and sample sizes, so the score function is isolated. But the
  trade-off results are read off figures rather than reported as headline
  numbers here, with 1 model and 2 datasets, no third-party replication, and
  no accounting for the extra inference cost of 11 samples against a
  single-sample baseline.


  If you need a hallucination rate you can state formally, this gives a
  lightweight prompt-only route, provided your answers are long enough that
  log-probabilities fail.
