brief: >-
  Asking a model to score how many of its own sampled answers agree with its
  greedy answer gives a better abstention signal than sequence
  log-probability, and the gap is driven by answer length. Conformal
  calibration then converts that score into an abstention threshold with a
  distribution-free bound on hallucination rate.


  The setup: Gemini Pro on 2 closed-book QA sets, Temporal Sequences from
  BIG-bench (long answers, 4000 question-answer pairs) and TriviaQA (short
  answers, 1000 pairs). For each query, the greedy response plus k-1 = 10
  samples at temperature 0.9; scores are match count, expected match count
  (from log-probs over "1", "2", ...), or log-probability of the greedy
  response. Thresholds are set by CRC or 3 RCPS confidence bounds, at alpha =
  0.05 and 0.1 (Temporal Sequences), 0.1 and 0.2 (TriviaQA), delta = 0.05.


  Results are reported as abstention-rate vs test-loss tradeoffs, not single
  headline numbers. Log-probability scoring is much worse on long answers and
  roughly matched on TriviaQA. The uncalibrated baseline threshold violates
  the risk target at small calibration sizes; CRC and RCPS differ negligibly;
  empirical Bernstein is the weakest bound, as expected for Bernoulli losses.


  Evidence is measured, with 20% held-out test splits, 10 resampled
  calibration subsets, and score functions compared under identical
  calibration machinery, which isolates the score as the cause. Weaknesses: 1
  model, 2 datasets, and automatic evaluation depends on a match function
  whose threshold was fixed by manual inspection of 100 pairs (F1 made 45
  mistakes, recall 13, LLM self-prompting at threshold 7 made 4).


  Untested on reasoning, multi-turn, or open-ended generation, and the
  guarantee needs exchangeable calibration data. If you are building a refusal
  gate, sample-agreement scores plus CRC are the cheap default; log-probs are
  only defensible for short answers.
