brief: >-
  Asking a model how many of its own sampled answers agree with each other
  gives a better abstention signal than its log-probabilities, and the gap
  appears only when answers are long. The agreement score can be calibrated
  with conformal risk control so the hallucination rate is bounded without
  fine-tuning.


  The setup is Gemini Pro on 2 closed-book QA sets: Temporal Sequences from
  BIG-bench (long answers, 4000 question-answer pairs) and TriviaQA (short
  answers, 1000 pairs). A greedy response is scored by how many of k-1 = 10
  samples at temperature 0.9 the model itself judges to match it, either
  counted directly (match count) or read off token log-probabilities for the
  count (expected match count). Thresholds are set by CRC or 3 RCPS bounds;
  the uncalibrated baseline picks the smallest lambda with empirical loss
  below alpha.


  Results are reported as abstention-rate versus test-loss curves rather than
  single numbers. On Temporal Sequences (alpha = 0.05, 0.1) log-probability
  scoring is clearly worse at matched risk; on TriviaQA (alpha = 0.1, 0.2) it
  is competitive. CRC and RCPS differ negligibly; Empirical Bernstein is
  worse, as expected for Bernoulli losses. The uncalibrated baseline violates
  the risk constraint at small calibration sizes.


  Evidence is measured, with 10 resampled calibration subsets per size and
  delta = 0.05, and the score function is varied while holding the calibration
  method fixed, which isolates the score. But it is 1 model, 2 datasets, and
  the automatic match function is itself an approximation: on 100 manually
  inspected Temporal Sequences pairs, F1 made 45 mistakes and recall 13, and
  the chosen LLM-prompted threshold of 7 still made 4.


  Untested on open-ended generation, multi-step reasoning, or other model
  families. If you need a risk guarantee rather than an AUC curve, this gives
  one at the cost of k samples per query.
