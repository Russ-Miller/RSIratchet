brief: >-
  Asking a model to score how many of its own sampled responses agree with
  each other gives a better abstention signal than its token
  log-probabilities, and the gap widens as answers get longer.


  The method samples a greedy response plus k-1 = 10 responses at temperature
  0.9, then prompts the same model to judge similarity between the reference
  and each sample (match count), or to report the number of matches in 1 query
  and read off log-probabilities over "1", "2", ... (expected match count). A
  threshold on that score decides abstention, calibrated with conformal risk
  control or 3 Risk-Controlling Prediction Sets confidence bounds to cap
  hallucination risk at a target alpha. Model is Gemini Pro; datasets are
  Temporal Sequences from BIG-bench (4000 pairs, alpha = 0.05 and alpha = 0.1)
  and TriviaQA (1000 pairs, alpha = 0.1 and alpha = 0.2), delta = 0.05, 20%
  held out, calibration subsamples drawn 10 times.


  On Temporal Sequences, which contains long answers, log-probability scoring
  gives a clearly worse abstention-rate/error trade-off at equal risk; on
  short-answer TriviaQA the 3 scores are comparable. Calibrated methods
  respect the risk bound while the uncalibrated baseline violates it on small
  calibration sets. Empirical Bernstein is the weakest bound, as expected for
  Bernoulli losses.


  Evidence is measured against a matched log-probability baseline at the same
  target risk, with score and bound varied separately, so attribution is
  reasonably clean. The reported trade-offs are read from figures; exact
  numbers sit in appendix tables not reproduced here. Limits: 1 model, 2
  datasets, closed-book short-form QA, no comparison to semantic entropy or
  fine-tuned abstention, and the match function itself is model-judged with 4
  manual errors in 100 inspected pairs.


  If you need a risk guarantee rather than a ranking curve, this gives a
  calibration recipe and a reason not to use log-probabilities on long
  outputs.
