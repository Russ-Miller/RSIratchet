brief: >-
  Scaling audio-language training past academic datasets to roughly 1M hours
  of internet audio, plus timestamp-grounded reasoning chains, moves a 7B open
  model to or past much larger closed models on long-audio understanding.


  AF-Next pairs the AF-Whisper encoder with a Qwen-2.5-7B backbone extended
  from 32k to 128k context, with rotary time embeddings instead of RoPE,
  trained on 128 NVIDIA H100 GPUs through a 4-stage curriculum (pre-training,
  2 mid-training stages, GRPO post-training, then CoT SFT). Data is ~108M
  samples, including 200K internet videos of 5-30 minutes and AF-Think-Time,
  ~43K question-answer-reasoning triplets averaging 446.3 words. 3 checkpoints
  are released: Instruct, Think, Captioner.


  On MMAU, Instruct reaches 74.20 average vs Audio Flamingo 3's 72.42, Think
  75.01, Captioner 75.76. On MMAR, Captioner hits 63.0 vs AF3's 58.5. On
  LongAudioBench, Instruct scores 73.9 vs AF3 68.6 and Gemini 2.5 Pro 60.4,
  and 81.2 vs 72.9 and 66.2 on the speech variant. LibriSpeech WER falls to
  1.54/2.76. MMSU still trails Gemini-2.5-Flash (66.1 vs 63.3).


  Results are measured across 20+ benchmarks with reproduced baselines, but
  there is no ablation separating the data scaling, RoTE, GRPO, or Temporal
  CoT contributions, and the captioner variant's gains come from a GPT-5.2
  text-only pipeline rather than the model alone. Multi-talker ASR,
  diarization, timestamped captioning, and voice-to-voice were not evaluated.


  Treat the long-audio numbers as the load-bearing claim; the reasoning
  paradigm itself is unisolated.
