summary: "We present Audio Flamingo Next (AF-Next), the next-generation and
  most capable large audio-language model in the Audio Flamingo series,
  designed to advance understanding and reasoning over speech, environmental
  sounds and music. Compared to Audio Flamingo 3, AF-Next introduces: (i) a
  stronger foundational audio-language model that significantly improves
  accuracy across diverse audio understanding tasks; (ii) scalable strategies
  for constructing large-scale audio understanding and reasoning data beyond
  existing academic benchmarks; (iii) support for long and complex audio
  inputs up to 30 minute"
