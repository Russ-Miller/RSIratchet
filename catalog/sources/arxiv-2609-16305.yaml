  interactions involving tool use, persistent state, evolving authorization,
  and external environment feedback. In such settings, safety failures may
  emerge only after multiple turns, yet existing evaluations often reduce
  agent behavior to task or attack success, obscuring whether an agent acts,
  refuses, or remains appropriately calibrated as the interaction evolves.
