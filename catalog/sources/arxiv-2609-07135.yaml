  frames. It must track ingredient states over time and integrate visual
  observations with recipe and nutritional knowledge to support
  constraint-aware decision-making. We formalize this capability as
  \emph{Embodied Nutrition Management}: perceiving nutrition-relevant
  events, maintaining a persistent food state, and using it for
  knowledge-grounded planning. Existing benchmarks evaluate static food
