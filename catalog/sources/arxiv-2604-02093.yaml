brief: >-
  Dropping half the visual tokens inside a video LLM, selected by similarity
  to the text query, beats feeding the model every frame for temporal
  grounding. Token-level selection also beats frame-level selection at the
  same budget.


  GroundVTS inserts a query-guided sampling module after the vision encoder
  and projector of Qwen2.5VL-7B and InternVL3.5-8B, using differentiable top-K
  with Gumbel-Softmax at ratio ρ = 0.5, trained in 3 stages (VTS warm-up,
  joint LoRA on LLaVA-Video-178K, fine-tuning on a 70K-pair Grounding-FT set).
  Evaluation covers Charades-STA, ActivityNet-Captions, QVHighlights, plus
  NExT-GQA as-is.


  Against the same base model fine-tuned on Grounding-FT, Charades-STA R1@0.5
  rises 24.8 points to 57.5 and mIoU 18.4 to 50.1; QVHighlights highlight
  detection mAP rises 20.6 to 52.5 and Hit@1 48.6 to 88.4. At half the token
  budget GroundVTS reaches 34.2 R1@0.7, above the baseline at full density
  (30.5).


  The causal attribution is reasonably tight: ablations are run at a matched
  token budget (FPS = 2.0, ρ = 0.5), and token-level beats frame-level by 8.5
  mIoU on Charades-STA, uniform, and random. Removing positional encodings
  collapses mIoU from 50.1 to 9.5. Training-stage ablation shows an untrained
  VTS module is worse than the base model.


  Gains are uneven across backbones: the InternVL variant improves only
  1.3–3.5 points on moment retrieval and underperforms on NExT-GQA, so the
  effect is partly base-model-specific. Long-video and efficiency numbers sit
  in an unseen supplement.


  If you build video grounding systems, treat query-conditioned token pruning
  as an accuracy lever, not only a compute one.
