brief: >-
  Attention mass on visual tokens is not a reliable indicator of whether
  vision actually drives a vision-language model's token choice. Decomposing
  each attention head into a visual route and a text route and measuring their
  effect on the decision score shows heads where the two routes push in
  opposite directions, and suppressing only the text route in those heads
  reduces hallucination.


  Causal Route Gating (CRG) splits head outputs by visual/textual key indices,
  attaches route gates, and estimates each route's do-effect with 1 forward
  pass and 1 gradient query per token. Heads with conflicting signs are ranked
  by a Visual Reliance Index; the top-k lowest get graded text-route
  suppression, mild for Conflict-A (0.5, 1.0) and strong for Conflict-B (0,
  0.5). Tested on LLaVA-1.5-7B, Qwen-VL-Chat, and Qwen2.5-VL-7B-Instruct over
  POPE, CHAIR, MME, MMHal-Bench, and AMBER.


  POPE accuracy rises 6.3% on LLaVA-1.5-7B and 1.2% over the strongest
  baseline VTI. CHAIR C_S/C_I fall from 52.8/15.9 to 34.2/11.2 with recall
  77.8 vs 77.3. AMBER Score goes 82.70 to 86.45. Latency is 139.2 ms (x2.27)
  versus 61.3 ms regular, with no memory increase.


  Evidence is measured against 4 training-free baselines, with A/B conflict
  ablations, layer-range sweeps, and k/γ sensitivity; the ablations isolate
  that both conflict types contribute, B more. All models are 7B, decoding is
  greedy, and the gradient estimator is only validated for sign consistency in
  an appendix. The authors note CRG cannot fix errors where both routes share
  a bias, or perception, OCR, and multi-step reasoning failures, and may
  reduce descriptive richness.


  If you use attention-share proxies to locate hallucination-prone components,
  this gives a reason to switch to decision-aligned effects.
