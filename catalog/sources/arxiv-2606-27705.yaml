summary: >-
  Large Language Models (LLMs) still struggle with the
  ``lost-in-the-middle'' problem, where critical information located in the
  middle of long-context inputs is often underrepresented or lost. While
  existing methods attempt to address this by combining multi-scale rotary
  position embeddings (RoPE), they typically suffer from high latency or
  rely on suboptimal hand-crafted scaling strategies. To overcome these
  limitations, we introduce a layer-specific positional embedding
  scaling~(LPES) method that assigns distinct scaling factors to each layer.
