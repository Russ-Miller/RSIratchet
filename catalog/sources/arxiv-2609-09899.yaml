summary: >-
  Language models can fluently describe how they would behave: whether they
  would cave to pushback, misuse a tool, or lie under pressure. Is that
  description actually about the model speaking? We turn self-knowledge into
  a prediction test. Across nine behavioral evaluations, we measure how a
  model behaves under different conditions, ask it to predict those rates,
  and compare its predictions with controls that remove the self from the
  question. We find that: (i) Direct self-report is weak (r = +0.04), and
  even showing the model the exact items only raises prediction to +0.24.
  Crucially, the same
