brief: >-
  Which model fills which debate role matters more than which model is
  strongest alone, and picking the filler per question with a pre-debate
  selection round beats both homogeneous and random assignment. Meta-Debate
  has each candidate agent write a role-specific "proposal", then has all
  agents peer-score those proposals against auto-generated, role- and
  domain-specific criteria; the top-scored agent takes the role.


  Agents were Claude 3.5, Nova Premier, and Pixtral-Large-Instruct-2411 at
  temperature 0, layered on 2 debate frameworks (MAD, DMAD), evaluated on GPQA
  (448 questions), MathVision (190 items), and RealWorldQA (437 questions).


  On GPQA, Meta-Debate reached 59.15% with MAD and 66.29% with DMAD, versus
  54.24%/58.93% for Claude in all roles and 50.67–55.58%/53.57–60.27% across
  random assignments, which varied with standard deviation up to 3.5%. The
  abstract claims gains up to 74.8% over uniform and 29.7% over random. Debate
  is not uniformly helpful: MAD with Pixtral in all roles fell below
  single-agent Pixtral on MathVision (31.05% vs 32.10%) and RealWorldQA
  (62.24% vs 70.25%).


  Evidence is measured but thin. The head-to-head role-assignment table covers
  GPQA only; there is no baseline matched on tokens or calls, and Meta-Debate
  adds a full proposal-plus-scoring pass per question. Role effects on the 2
  multimodal sets are shown only for uniform assignment, and selection quality
  is illustrated with 2 hand-picked MathVision cases.


  If you run heterogeneous debate, treat role placement as a tunable variable,
  not an afterthought.
