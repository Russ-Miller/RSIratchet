summary: "Large Language Models (LLMs) are increasingly used for Islamic
  question answering, where ungrounded responses may carry serious religious
  consequences. Yet standard MCQ/MRC-style evaluations (MCQ: Multiple choice
  questions, MRC: Machine Reading Comprehension) do not capture key real-world
  failure modes, notably free-form hallucinations and the ability to abstain
  when evidence is insufficient. To address this gap, we introduce
  IslamicFaithQA, a 3,810-item bilingual (Arabic/English) generative benchmark
  with atomic single-gold answers, which enables direct measurement of
  hallucination and absten"
