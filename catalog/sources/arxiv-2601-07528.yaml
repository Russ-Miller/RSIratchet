brief: >-
  Letting a model call retrieval tools repeatedly beats a single retrieval
  pass by a wide margin on knowledge-intensive religious QA, and closes an
  Arabic-English performance gap that fine-tuning does not.


  IslamicFaithQA is a 3,810-item bilingual Arabic/English generative benchmark
  with atomic single-gold answers, graded by an LLM judge as correct,
  incorrect, or not attempted. 15 Arabic-centric and multilingual instruct
  models were run zero-shot; 4 (ALLaM-7B, Fanar-1-9B, Qwen3-4B-2507,
  Fanar-2-27B) were then run with SFT on 25,000 Arabic reasoning pairs, GSPO
  alignment on 5,000 preference samples, standard RAG over 6,236 Qur'an
  verses, and agentic RAG with search, verse-read, and metadata tools.


  Most off-the-shelf models stay below 30% average accuracy. Qwen3-4B-2507
  goes 21.85 base, 30.55 +SFT, 30.83 +RL, 38.85 +RAG, 48.90 +Agentic RAG, with
  Arabic rising from 15.80 to 49.60. Fanar-2-27B reaches 57.30 with agentic
  RAG. Of 36 cases recovered over standard RAG, 24 were
  not-attempted-to-correct and 12 incorrect-to-correct.


  The gains are measured against a staged ablation on the same backbones, but
  not at matched compute: agentic RAG uses 1,520 tokens vs 502 and 6.63x
  latency, with no equal-budget RAG baseline. Judge-human agreement is 79% on
  200 items, Cohen's kappa 0.51.


  Grounding is Qur'an-only, answers are short-form, and disputed multi-madhhab
  questions are excluded.


  If you are deciding between a bigger model and tool-mediated retrieval, this
  favors the latter, at a latency cost.
