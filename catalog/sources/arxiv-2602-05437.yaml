brief: >-
  A vision-language model can answer a true statement about an image correctly
  and then also accept the contradicting counterfactual version of it, and
  this failure is invisible in accuracy scores. The paper argues that
  culturally plausible but visually wrong readings are a distinct failure mode
  from ordinary hallucination.


  The benchmark, M2CQA, pairs images from 17 MENA countries with contrastive
  true/counterfactual statement pairs in English, Modern Standard Arabic, and
  Arabic dialects. The proposed metric, CounterFactual Hallucination Rate
  (CFHR), counts counterfactual acceptance only on items where the model
  already answered the true statement correctly, which separates hallucination
  from plain error.


  Across several state-of-the-art VLMs and multiple prompting strategies, CFHR
  rises sharply in Arabic and more so in dialects, while true-statement
  accuracy stays high. Reasoning-first prompting consistently raises
  counterfactual hallucination; answering before justifying lowers it.


  The effects are measured, and conditioning on correct true-statement answers
  isolates hallucination from capability. The abstract gives no per-model
  numbers, no CFHR values, and no human baseline, so the size of the gap
  cannot be read off here.


  Scope is MENA imagery and Arabic varieties; other low-resource languages and
  non-cultural image domains are untested.


  If you report accuracy on multilingual VLM benchmarks, add a
  counterfactual-acceptance check, and be wary of chain-of-thought-first
  prompts.
