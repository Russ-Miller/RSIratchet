brief: >-
  Splitting an agentic RAG system into a planner trained with RL and an
  executor trained with SFT beats training both end-to-end on a single
  final-answer reward. The authors argue end-to-end training creates
  "hierarchical credit entanglement": one sparse reward cannot separate plan
  errors from retrieval errors.


  APEX-Searcher trains the planner with GRPO against a Set-Equivalence Plan
  Reward, an F1 over Hungarian-matched sub-question embeddings (threshold 0.8)
  compared to gold decompositions, using 10,473 MuSiQue examples. The executor
  is SFT'd on 14,604 self-instruct multi-turn retrieval trajectories.
  Backbones are Qwen2.5-3B-Instruct and Qwen2.5-7B-Instruct, evaluated by EM
  on HotpotQA, 2WikiMultiHopQA, MuSiQue and Bamboogle.


  Average EM gains over Standard RAG are 0.176 (7B) and 0.183 (3B); relative
  gains over the strongest baseline are +9.0% on 7B and +13.2% on 3B. The
  biggest jump is 2Wiki (0.540 vs 0.500 for DecEx-RAG). On MuSiQue,
  StepSearch-instruct still wins (0.226 vs 0.164 on 7B).


  A 6-cell ablation isolates each component. Planning without training hurts
  the 3B model (13.42 to 12.63); adding RL lifts it to 18.10; execution SFT
  alone gives 23.52; all components 33.45. Compute budget across arms is not
  matched.


  Only 1 model family, 2 sizes, English Wikipedia-style corpora. If you build
  multi-hop retrieval agents, this is a reason to separate planner and
  executor training signals rather than scale one reward.
