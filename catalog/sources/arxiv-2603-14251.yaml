brief: >-
  Overthinking in reasoning models shows up as a local spike in token entropy,
  and cutting reasoning off when that spike appears raises accuracy rather
  than trading accuracy for tokens. RPDI-EE computes a Reasoning Path
  Deviation Index, the ratio of average entropy in a sliding window to average
  entropy over the whole trajectory so far, and inserts a </think> marker when
  it exceeds a threshold. No proxy model, no answer probing.


  Tested on 8 models (DeepSeek-R1-Distill-Qwen 1.5B/7B/14B/32B, Distill-Llama
  8B/70B, Qwen3-30B-A3B-Thinking, Qwen3-235B-Thinking) over GSM8K, MATH500,
  AMC23, AIME2024/2025, OlympiadBench, GPQA-Diamond, against vanilla CoT,
  NoThinking, ThinkLess, DEER, Dynasor-CoT.


  Average accuracy gain over vanilla CoT is 3.9%, and 5.1% on distilled
  models. Token savings are modest: on Qwen-32B, 75.5 average accuracy at 6280
  tokens vs 67.6 at 6814 for CoT, while Dynasor-CoT drops to 55.0 at 1857.
  Fixed-budget baselines lose 7.7–24.4 points.


  Ablations isolate the parts: removing the global baseline costs 3.3% on Math
  Hard, removing the boundary-trigger mechanism costs 2.8% average. A
  preliminary study over 45.9 million tokens supports the entropy long-tail
  claim, with the lowest-entropy 60% of tokens contributing near zero.


  Full baseline comparison runs on only 4 of 8 models; gains are not uniform
  (GPQA drops 7.5 on Qwen-7B). Domains outside math and science untested.


  If you assumed early exit is an efficiency-for-accuracy trade, this suggests
  a signal that mostly buys accuracy instead.
