summary: >-
  Large Language Models (LLMs) are increasingly used to generate structured
  outputs, but their reliability remains unclear when those outputs must
  satisfy database-level constraints. We study this issue through database
  normalization, involving reasoning about functional dependencies, lossless
  join decompositions, and inter-table constraints. We introduce a Database
  Normalization Benchmark (DNBENCH), comprising 3,275 samples for evaluating
  LLM-driven database normalization from 1NF to BCNF. DNBENCH uses a
  three-axis protocol to measure semantic equivalence, structural accuracy,
  and logical valid
