summary: >-
  Frozen pretrained forecasters often fail in structured, recurring ways
  that are costly to repair through fine-tuning. We study corrective feature
  discovery: mining interpretable features of a frozen forecaster's residual
  to drive a lightweight post-hoc corrector. Prior automated feature
  engineering models the data-generating process; corrective features
  instead model the model-failure process. We present CRAFTER (Corrective
  Residual Agent with Feature-based Temporal Exploration and Reasoning),
