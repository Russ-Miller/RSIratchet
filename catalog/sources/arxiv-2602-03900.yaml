brief: >-
  Replacing the natural-language domain description in a planning prompt with
  a JSON-serialized Task-Method-Knowledge (TMK) structure lifts planning
  accuracy most where linguistic cues are absent, and can invert which variant
  is harder.


  The test bed is PlanBench Blocksworld in 3 variants: Classic (canonical
  action names), Mystery (misleading semantic labels), Random (opaque
  alphanumeric identifiers). Models are GPT4, GPT4o, o1mini, o1, GPT5. TMK
  prompts are one-shot with a non-matching example; the baseline is the better
  of sampled zero- and one-shot plain text, and a plan counts only if every
  step is valid.


  Gains are largest on Random: o1 rises from 31.5% to 97.33%, a 65.8%
  increase, and its Random score then exceeds its Mystery score (74.3% to
  83.3%). o1mini goes 9.33% to 27.0% on Random but drops on Mystery, 19.1% to
  16.83%. GPT4 and GPT4o stay near-zero on obfuscated variants (0 to 3.8%,
  0.83% to 4.83%). GPT5 was already 92.5% on Random, rising to 99.0%.


  The accuracy effect is measured; the mechanism, steering models into
  code-like symbolic inference, is argued, not tested. Baselines are drawn
  from a public leaderboard at a different shot count, extraction code was
  modified by the authors, 1 model family, 1 domain, no comparison to HTN or
  BDI prompts.


  Worth trying if you prompt reasoning models on symbolic planning with opaque
  identifiers.
