brief: >-
  Replacing the plain-text domain description in a planning prompt with a
  JSON-serialized Task-Method-Knowledge (TMK) structure raises plan
  correctness most where linguistic cues are absent, and reverses the usual
  ordering in which models do better on semantically obfuscated tasks than on
  opaque symbolic ones.


  The authors hand-authored a 3-layer TMK model of Blocksworld and swapped it
  into the PlanBench prompt, testing GPT4, GPT4o, o1mini, o1 and GPT5 on the
  Classic, Mystery and Random variants. Plans were scored fully correct only
  if every step was valid, using PlanBench's validators.


  o1 on Random rose from 31.5% to 97.33%, a 65.8% gain, overtaking its own
  Mystery score (74.3% to 83.3%). GPT5 went 92.5% to 99.0% on Random, GPT4o
  35.5% to 45.3% on Classic, and o1mini 9.33% to 27.0% on Random but dropped
  on Mystery, 19.1% to 16.83%.


  Measured, but the comparison is TMK one-shot against the zero-shot public
  leaderboard, so prompt length, shot count and content all vary at once; no
  ablation separates TMK's hierarchy from its code-like JSON form, no
  matched-token baseline, no comparison to BDI or HTN, 1 vendor's models.


  Only Blocksworld was tested; Logistics, multi-agent and path-finding
  planning were not. Treat the symbolic-steering explanation as a hypothesis
  and the gains as domain-specific.
