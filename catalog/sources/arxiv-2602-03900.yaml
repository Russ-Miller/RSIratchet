brief: >-
  Replacing the natural-language domain description in a planning prompt with
  a JSON knowledge model (Task-Method-Knowledge) flips which Blocksworld
  variant is hardest for a reasoning model: symbolic, meaningless labels
  become easier than misleading semantic ones.


  The test is PlanBench Blocksworld in 3 variants, Classic (canonical action
  names), Mystery (unrelated words like "attack", "feast"), and Random (opaque
  strings like "1jpkithdyjmlikck"), scored as fully correct plans with every
  step valid. Models: GPT4, GPT4o, o1mini, o1, GPT5. TMK prompts are one-shot
  with a non-matching example; plain-text baselines come from the public
  PlanBench leaderboard.


  o1 on Random rose from 31.5 to 97.33, a 65.8% gain, while its Mystery score
  went 74.3 to 83.3, so Random overtook Mystery. GPT5 moved 92.5 to 99.0 on
  Random. GPT4 and GPT4o stayed near floor on Mystery and Random (0 to 3.8,
  0.83 to 4.83). o1mini regressed on Mystery, 19.1 to 16.83.


  Evidence is measured on a verified benchmark with full-plan scoring, but the
  baseline is zero-shot leaderboard numbers rather than a matched one-shot
  plain-text run, 1 model family, and no ablation separating TMK's structure
  from its content. HTN and BDI comparisons, Logistics, multi-agent planning,
  and open reasoning traces were not tested.


  If you prompt planners, treat schema-shaped domain encodings as a steering
  lever, not just extra context.
