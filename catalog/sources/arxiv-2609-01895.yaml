summary: >-
  Large language models (LLMs) are increasingly discussed as tools for peer
  review, but their value is often assessed through human-likeness,
  perceived usefulness, or textual overlap with reviewer comments. This
  study shifts attention from whether LLMs resemble human reviewers to what
  functions of scientific critique they perform. Using ICLR 2025 peer-review
  data, we compare human reviews with LLM reviews generated under baseline
  and expert prompts. We operationalize scientific critique through two
  review acts, weakness critique and scientific questioning, and annotate
