brief: >-
  Routing queries through a heterogeneous agent pool can be handled by a
  1B-parameter fine-tuned classifier plus a pheromone table instead of an
  LLM-based selector, and the cheap version matches or beats the expensive
  one. The framework, AMRO-S, treats multi-agent routing as path selection on
  a layered directed graph, where each node is a (backbone, reasoning method,
  role) pair, and keeps separate pheromone matrices per task type fused by the
  router's predicted intent mixture.


  The agent pool is GPT-4o-mini, Gemini-1.5-flash, Claude-3.5-haiku, and
  Llama-3.1-70b; routers are Llama-3.2-1B-Instruct and Qwen2.5-1.5B fine-tuned
  on 3,000 GPT-4o-generated instructions. Across MMLU, GSM8K, MATH, HumanEval,
  and MBPP, average pass@1 rises from 85.93 (MasRouter) to 87.83, with MATH
  75.42 to 78.15 and MBPP 84.0 to 86.3. Under a 1000-process stress test,
  runtime drops from 3849.60s to 823.21s (4.7x) while GSM8K accuracy holds at
  96.40%, versus weighted round-robin falling to 88.20%.


  Ablations isolate the parts: random path selection gives 79.64, an
  unsupervised 1B router 83.42, SFT 87.83. Inference budget was standardized
  by capping interaction turns and agent invocations. Intent accuracy reaches
  97.93% after SFT.


  Baselines are reproductions by the authors, not independent; the pool is 4
  cheap models only, and no reasoning-model or long-horizon agentic tasks were
  tested. Interpretability is argued from pheromone heatmaps, not measured.


  Useful if you are deciding whether a learned router is worth its own
  inference cost.
