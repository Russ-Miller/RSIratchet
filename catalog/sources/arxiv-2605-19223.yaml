brief: >-
  Fluent video summaries from multimodal LLMs do not imply the models located
  the right visual evidence. On HAVEN, a text-only LLM given frame and shot
  descriptions beats most MLLMs at grounding summary sentences to shots, while
  losing badly at recovering shot order.


  HAVEN rebuilds 6 video summarization datasets (SumMe, TVSum, OVP, YouTube,
  VideoXum, MR.HiSum) into 11055 videos with aligned frame, shot, and
  video-level text, human keyframe labels, and 6 tasks: V2T/V2V/V2VT
  summarization, temporal ordering, grounding, saliency ranking. Zero-shot
  models: GPT-5.2, GLM-4.6V-Flash, Qwen3-VL-8B, Qwen2.5-VL-7B,
  InternVideo2.5-Chat-8B, VideoLLaMA3-7B.


  BERTScore for text summaries clusters at 0.84–0.88 across models, but
  keyframe selection F1 sits at 0.15–0.30. The text proxy reaches 0.804
  grounding F1 against 0.510 for GPT-5.2 and 0.253 for VideoLLaMA3, yet only
  0.019 Spearman on temporal order versus 0.280 for GPT-5.2. Adding the
  reference document lifts temporal ordering by +108% for GPT-5.2 and +64.7%
  for GLM-4.6V. Joint V2VT generation changes CLIPScore by -0.077 to +0.044,
  no consistent gain.


  Evidence is measured, with a text-proxy baseline and with/without-document
  ablations, but on sampled subsets of 100 videos for the 2 large sources,
  annotations largely LLM-generated, and inter-annotator agreement often
  negative. Short videos only, no audio, 1 commercial model class.


  Treat summarization scores as a weak proxy for visual grounding.
