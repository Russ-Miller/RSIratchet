brief: >-
  Scoring each reasoning step separately and flagging the lowest-confidence
  one detects failures better than scoring a whole multi-step trace at once,
  but the advantage depends on the task and the scoring method.


  The setup compares response-level and step-level confidence estimation on 2
  multi-step benchmarks: GSM8K, where a fine-tuned Llama-3.2-11B-Instruct
  agent calls an expression evaluator (average 5.1 steps), and CoQA (average
  13.5 steps). Scorers include self-verbalized confidence, Llama-3.2-11B and
  GPT-4.1-mini as judges, a trained regression head, a preference reward
  model, self-certainty, and a hidden-state regressor.


  On CoQA every method improved with step-level scoring: self-certainty went
  from AUC 0.523 to 0.849 (FPR@0.9 recall 0.95 to 0.374), and the regression
  model reached 0.952 AUC with FPR 0.169. On GSM8K the trend reversed for some
  scorers: GPT-4.1-mini dropped from 0.880 to 0.670 and self-certainty from
  0.649 to 0.395, attributed to tool outputs distorting per-step logits. In
  60/879 GSM8K cases the agent got the right answer from flawed reasoning;
  step-level regression recalled 0.60 of these versus 0.367 response-level.


  Evidence is measured with matched scorers across both granularities, so the
  granularity effect is isolated, but there is 1 agent model family, 2 public
  datasets, and no reported variance or repeated runs. A private
  clinical-notes case study (AUC 0.940, FPR@0.9 rec 0.152) is self-reported.


  Preference reward models performed near chance here, so do not reuse them as
  correctness detectors.
