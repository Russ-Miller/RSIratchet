summary: "Reliability and failure detection of large language models (LLMs) is
  critical for their deployment in high-stakes, multi-step reasoning tasks.
  Prior work explores confidence estimation for self-evaluating LLM-scorer
  systems, with confidence scorers estimating the likelihood of errors in LLM
  responses. However, most methods focus on single-step outputs and overlook
  the challenges of multi-step reasoning. In this work, we extend
  self-evaluation techniques to multi-step tasks, testing two intuitive
  approaches: holistic scoring and step-by-step scoring. Using two multi-step
  benchmark datasets, we"
