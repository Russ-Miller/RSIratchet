brief: >-
  When a text premise contradicts the image, multimodal LLMs follow the text
  partly because attention heads that push toward the false premise are spread
  widely while heads that resist it are concentrated in a few places. Zeroing
  the driving heads cuts hallucination; zeroing the resisting heads raises it.


  Head-level path patching was run on 5 open-source MLLMs (Qwen2.5-VL-7B,
  Qwen3-VL-8B, LLaVA-7B, LLaVA-NeXT-7B, InternVL3-8B) using MMMC object
  conflict, scoring each head by the change in log-likelihood gap between
  hallucinated and factual answers over 256 prototype samples.


  Summed positive scores exceeded summed absolute negative scores in all 5
  models (mean ratio 1.51x), while the top-5 heads held 27.2% of resisting
  importance vs 14.0% of driving importance. Ablating object-identified
  driving heads transferred to attribute, relation, and SCI-SemanticConflict
  conflicts, e.g. LLaVA-NeXT object 44.39 to 22.43. MACI, which gates
  driving-head ablation on a resisting-head probe (AUROC 0.89–0.95), gave the
  largest hallucination drop on all 5 models and −7.9pp mean on SCI.


  The ablations include a size-matched random-head control over 5 seeds, which
  stayed near Base, so the effect is attributed to selected heads rather than
  capacity loss. Judging used DeepSeek-V3.2 cross-validated with Llama-3.3-70B
  (κ 0.784–0.863).


  Heads were identified only from object conflict and prefill activations;
  InternVL3 and LLaVA lost non-conflict accuracy, and cases where the image
  itself misleads were untested.


  If you treat hallucination mitigation as a decoding problem, this suggests
  head-level routing is a more targeted lever.
