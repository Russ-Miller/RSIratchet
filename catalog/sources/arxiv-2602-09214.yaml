summary: >-
  Uncertainty quantification (UQ) is vital for ensuring that vision-language
  models (VLMs) behave safely and reliably. A central challenge is to
  localize uncertainty to its source, determining whether it arises from the
  image, the text, or misalignment between the two. We introduce
  VLM-UQBench, a benchmark for modality-specific and cross-modal data
  uncertainty in VLMs, It consists of 600 real-world samples drawn from the
