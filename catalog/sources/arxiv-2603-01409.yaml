summary: >-
  Large Language Models (LLMs) often fail to generate correct code on the
  first attempt, which requires using generated unit tests as verifiers to
  validate the solutions. Despite the success of recent verification
  methods, they remain constrained by a "scaling-by-quantity" paradigm. This
  brute-force approach suffers from a critical limitation: it yields
  diminishing returns in fault detection while causing severe test
  redundancy. To address this, we propose MIST-RL (Mutation-based
  Incremental Suite Testing via Reinforcement Learning), a framework that
