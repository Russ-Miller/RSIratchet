brief: >-
  Giving a model stored personal facts about a user makes it less likely to
  notice what it still doesn't know, and raises hallucination. A prompt-level
  checklist of unknown categories reverses this.


  The Severance Schema lists 6 dimensions of person-context (physicality,
  temporality, consequences, continuity, multiplicity, interiority), each
  filled or marked [unknown]. It was tested on a synthetic advisory benchmark
  of 10 person profiles and 30 advice-seeking scenarios, with manually
  annotated good-answer and decision-flip claims, across Claude Sonnet 4,
  Llama 3.3 70B, DeepSeek V3, Gemma-4 31B and Qwen3-235B, judged by GPT-5.2
  with Claude Sonnet 4 as validation judge.


  Memory alone pushed hallucination from 0-1% to 3.7-11.7% and cut
  unknown-awareness below the no-context baseline on every model. The schema
  roughly doubled unknown-awareness, cut harmful advice from 14-19% to 2-10%
  and sycophancy from 15-20% to 2-9% on open-weight models, and with memory
  brought hallucination to 1.7-4.0%, at a usefulness cost of about 0.20
  points. In a 2-turn setting, only schema conditions gained usefulness after
  clarification (+0.27 and +0.10 vs -0.11 and -0.10).


  Memory and Schema+Memory received identical information, so the gap is
  attributable to format; an ablation shows neither the [unknown] slots nor
  the category names alone recovers the effect. Profiles are synthetic,
  scoring is LLM-judge based, and only advice-seeking tasks were tested.


  If you ship memory in an assistant, treat it as a hallucination risk and
  pair it with an explicit unknowns inventory.
