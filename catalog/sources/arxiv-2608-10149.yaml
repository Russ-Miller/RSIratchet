summary: >-
  Due to the diversity of real-world time series, no single forecasting
  model consistently dominates across all samples. Ensemble learning
  addresses this by combining complementary model strengths, yet existing
  methods rely on fixed rules or black-box models based solely on numerical
  inputs, failing to leverage LLM reasoning for interpretable weighting
  decisions. We propose REATS, which leverages LLM reasoning capabilities as
  an intelligent ensemble router that jointly processes textual temporal
  pattern descriptions and numerical features to produce interpretable,
  sample-adaptive ensemble weight
