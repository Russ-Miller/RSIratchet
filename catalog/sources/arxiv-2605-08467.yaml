brief: "When CUDA kernels are scored against human-expert implementations
  rather than naive PyTorch baselines, frontier models produce correct code
  that runs at a fraction of expert speed, and tool-augmented agentic search
  can make things worse. CUDAHercules packages 195 tasks across 4 classes (63
  single kernels, 119 module/kernel-family, 10 full applications, 3 unsolved
  challenges), each pinned to a target architecture (Ampere A100, Hopper H200,
  Blackwell RTX PRO 6000/B200) with build harnesses, performance parsers,
  anti-cheating rules, and domain-specific semantic validators (error bounds,
  convergence, proof verification). Evaluated models: GPT-5.4,
  Claude-Opus-4.6, Qwen3.5-122B-A10B, and the RL-tuned Kevin32B, under
  one-shot, self-refine@10, and CUDAForge/StitchCUDA tool settings. Best
  one-shot result is GPT-5.4 at pass@3: 70% correct on Class 1 and 81% on
  Class 2, but mean expert-relative speed of only 0.257x and 0.463x, with
  fast_p(1.05) at 5% and 14%. Claude Opus 4.6 reaches 90% Class 1 pass under
  tool augmentation at 0.403x mean speed. Class 2 degrades under tools: Claude
  drops 67%-47% pass, GPT-5.4 to 2%. Kevin32B, strong on KernelBench, reaches
  20% Class 2 correctness with near-zero speed. All 3 Class 4 tasks unsolved;
  only 3 Class 3 tasks ever pass semantic gating. Correctness and speed are
  measured by task-defined harnesses, not self-reported, and settings are
  compared at matched revision budgets (10 rounds refine, 20 tool), but there
  is no human-expert time baseline and 1 run configuration per cell, so
  variance is unreported. Scope is NVIDIA CUDA on 4 models; Triton, AMD, and
  smaller open models are untested. If you cite KernelBench scores as evidence
  of kernel-engineering ability, this suggests those gains do not transfer."
