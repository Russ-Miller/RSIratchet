summary: >-
  Large language models show promise for automated CUDA programming, however
  even the strongest coding models (e.g., Claude-Opus-4.6) may still fall
  short of expert-level, architecture-aware optimization. We introduce
  CUDAHercules, a benchmark that evaluates generated CUDA against end-to-end
  human-expert SOTA systems. It spans single kernels, module-level
