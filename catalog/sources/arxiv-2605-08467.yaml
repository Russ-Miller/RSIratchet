brief: >-
  Frontier models write CUDA that compiles and often passes correctness
  checks, but it runs at a fraction of human-expert kernel speed, and giving
  them profilers and feedback loops can make things worse. CUDAHercules scores
  generated CUDA against expert references from systems like CUTLASS and
  FlashAttention-3 rather than naive baselines: 195 tasks across single
  kernels, module-level operators, full applications, and unsolved challenges,
  targeting Ampere, Hopper, and Blackwell, with application tasks gated by
  semantic validators (bounded error, convergence, proof verification).


  On the general subsets (Class 1, 20 tasks; Class 2, 43 tasks), GPT-5.4 at
  pass@3 reaches 70% and 81% correctness but mean expert-relative speed of
  only 0.257x and 0.463x. Kevin32B, RL-tuned on KernelBench, reaches 0% Class
  2 pass@3. Tool augmentation lifts Claude Opus 4.6 to 90% Class 1 pass yet
  0.403x mean speed, while dropping Class 2 pass from 67% to 47%; GPT-5.4
  falls to 2% on Class 2. Of 10 Class 3 applications, Claude solves 3 (0.35x,
  0.74x, 0.52x); all 3 Class 4 tasks are unsolved.


  Results are measured with harness-defined validators and anti-cheating
  audits, and prompts injecting expert strategy were run as a diagnostic, but
  that diagnostic is reported qualitatively with no table. Comparisons across
  settings differ in round budget (10 vs 20), so refinement and tool use are
  not matched on compute.


  Treat KernelBench-style scores as evidence of functional synthesis only, not
  optimization skill.
