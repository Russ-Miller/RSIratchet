summary: >-
  Verifying multi-step reasoning in large language models is difficult due
  to imprecise error localization and high token costs. Existing methods
  either assess entire reasoning chains, suffering attention dilution, or
  rely on expensive multi-sampling. We introduce Node-wise Consistency
  Verification (NCV), a training-free framework that recasts verification as
