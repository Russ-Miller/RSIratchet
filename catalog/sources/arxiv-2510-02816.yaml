brief: >-
  Breaking a reasoning chain into atomic claims and asking a model for a 1-bit
  yes/no on each, 3 times, localizes errors better than having the same model
  critique the whole chain with chain-of-thought — and costs far fewer tokens.
  The framework, NCV, is training-free: each node is judged conditional on the
  problem plus previously verified nodes, with output capped at 4 tokens.


  Evaluation is on all 4 ProcessBench subsets (3,400 cases: GSM8K 400, MATH
  1,000, OlympiadBench 1,000, Omni-MATH 1,000) with Qwen2.5-7B/32B/72B and
  Llama-3.3-70B, against E2E-cot greedy and E2E-cot 8-vote.


  On Qwen2.5-32B, NCV@3-B raises average F1 from 45.2 (greedy) to 61.4, with
  28.1 tokens per sample versus 177.4 and 1619.2 — 6.3x and 57.6x reductions.
  Error localization on OlympiadBench goes 25.3 to 55.8. Gains grow with
  difficulty: +13.3 F1 on GSM8K, +23.8 on Omni-MATH.


  An ablation separates the two ingredients: 3-vote alone gives 48.3,
  structure alone 54.9, both 61.4, and CoT per node 69.0. That isolates
  decomposition from consistency cleanly.


  The effect is not uniform. On Llama-3.3-70B, NCV averages 58.0 F1, matching
  8-vote E2E and losing on GSM8K; on Qwen2.5-72B the margin over 8-vote is
  63.3 versus 61.2. Only math process verification was tested.


  If you run step-level verifiers, binary node checks are the cheaper default
  to try first.
