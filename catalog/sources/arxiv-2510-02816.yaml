brief: >-
  Breaking a reasoning chain into atomic claims and asking a model for a
  1-word yes/no on each, 3 times, beats having the same model verify the whole
  chain with chain-of-thought, and costs far less. Node-wise Consistency
  Verification (NCV) is training-free: each step is decomposed into atomic
  assertions, verified in order conditioned on previously accepted nodes, with
  majority voting or a one-vote veto.


  Evaluation is on all 4 ProcessBench subsets (GSM8K 400, MATH 1,000,
  OlympiadBench 1,000, Omni-MATH 1,000 cases; 3,400 total) with
  Qwen2.5-7B/32B/72B and Llama-3.3-70B, against end-to-end CoT verification
  with greedy decoding and 8-sample majority voting.


  Average F1 gains are largest at 32B: 13.3 points on GSM8K, 20.9 on MATH,
  21.9 on OlympiadBench, 23.8 on Omni-MATH, with error-localization accuracy
  55.8% vs 25.3% for E2E 8-vote on OlympiadBench. Cost at 32B: 28.1 tokens per
  sample vs 177.4 (greedy) and 1619.2 (8-vote), max output 4 tokens.


  The ablation isolates both components on one model: 45.2 greedy, 48.3 with
  voting alone, 54.9 structure alone, 61.4 combined, 69.0 with CoT per node.
  Reported numbers for Qwen2.5-32B NCV@3-B differ between the main table and
  the ablation.


  Gains are not uniform: on Llama-3.3-70B average F1 ties the 8-vote baseline
  at 58.0, and on GSM8K at 72B NCV slightly trails. Only math reasoning, only
  2 model families, no trained PRM baseline.


  If you verify reasoning chains, decomposition plus cheap repeated binary
  checks is worth trying before scaling samples.
