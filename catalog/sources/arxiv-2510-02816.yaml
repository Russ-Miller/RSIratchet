brief: >-
  Asking a model 1 binary question per reasoning node beats asking it to
  critique a whole chain of thought, and costs far fewer tokens. Node-wise
  Consistency Verification (NCV) decomposes a solution into atomic assertions,
  verifies each conditioned on previously accepted nodes, and stops at the
  first rejection, with no training involved.


  The test bed is ProcessBench, 3,400 cases across GSM8K (400), MATH (1,000),
  OlympiadBench (1,000), Omni-MATH (1,000), with human-annotated first-error
  positions. Verifiers are Qwen2.5-7B/32B/72B and Llama-3.3-70B, against
  end-to-end CoT verification with greedy decoding and with 8-sample majority
  voting.


  On Qwen2.5-32B, average F1 rises from 45.2 (greedy) and 49.3 (8-vote) to
  61.4 for NCV@3-Binary, using 28.1 tokens per sample versus 177.4 and 1619.2,
  a 6.3x and 57.6x reduction, with max output length 4 tokens. Gains grow with
  difficulty: +13.3 F1 on GSM8K, +23.8 on Omni-MATH. Error-localization
  accuracy on OlympiadBench is 55.8% versus 25.3%.


  An ablation separates the two ingredients: voting alone gives 48.3,
  decomposition alone 54.9, both 61.4, CoT per node 69.0. Baselines are
  matched on task, not on token budget, which here favors the baselines.


  The one clear miss is Llama-3.3-70B, where NCV ties E2E 8-vote at 58.0
  average F1 and loses on GSM8K. Only math verification was tested, on 2 model
  families.


  If you run a verifier at scale, the binary node check is the cheaper
  default.
