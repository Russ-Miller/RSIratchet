brief: >-
  Asking a model to verify a reasoning chain as one long judgment is worse and
  more expensive than asking it a series of 1-token-ish binary questions about
  individual claims. Node-wise Consistency Verification (NCV) decomposes a
  solution into atomic assertions, each checked conditioned on previously
  verified nodes, with majority voting across 3 binary samples and output
  capped at 4 tokens.


  Evaluation covers all 4 ProcessBench subsets (GSM8K 400 cases, MATH 1,000,
  OlympiadBench 1,000, Omni-MATH 1,000) on Qwen2.5-7B/32B/72B and
  Llama-3.3-70B, against end-to-end CoT verification with greedy decoding and
  with 8-vote majority.


  On Qwen2.5-32B, F1 gains over E2E-cot (8-vote) grow with difficulty: 13.3
  points on GSM8K, 20.9 on MATH, 21.9 on OlympiadBench, 23.8 on Omni-MATH,
  with error localization accuracy 55.8% vs 25.3% on OlympiadBench. Cost per
  sample is 28.1 tokens vs 177.4 (greedy) and 1619.2 (8-vote), a 57.6x
  reduction with 12.1 points higher F1.


  The ablation separates the two ingredients on Qwen2.5-32B: 45.2 F1 greedy,
  48.3 with 3-vote alone, 54.9 with decomposition but no consistency, 61.4
  with both, 69.0 with per-node CoT. That isolates decomposition as the larger
  contributor.


  Gains are not uniform: on Llama-3.3-70B average F1 is 58.0, matching the
  8-vote baseline, and correct-solution accuracy often drops versus E2E. Only
  math reasoning and 2 model families were tested.


  If you run step-level verification, the decomposition is worth trying before
  the sampling budget.
