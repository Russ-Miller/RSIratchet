brief: >-
  Breaking a reasoning chain into atomic claims and asking a model a 4-token
  yes/no question about each one localizes errors better than having the same
  model critique the whole chain with Chain-of-Thought, and costs far less.
  Node-wise Consistency Verification (NCV) is training-free: it maps each
  solution step to atomic assertions, verifies each conditioned on previously
  accepted nodes, and aggregates 3 binary samples by voting or one-vote veto.


  Evaluation covers all 4 ProcessBench subsets (GSM8K 400 cases, MATH 1,000,
  OlympiadBench 1,000, Omni-MATH 1,000) with Qwen2.5-7B/32B/72B and
  Llama-3.3-70B, against E2E-cot greedy and 8-vote baselines.


  For Qwen2.5-32B, F1 gains are 13.3 points on GSM8K, 20.9 on MATH, 21.9 on
  OlympiadBench, 23.8 on Omni-MATH; error localization on OlympiadBench rises
  from 25.3% to 55.8%. NCV@3-Binary scores 61.4 F1 at 28.1 tokens per sample
  versus 45.2 at 177.4 (greedy) and 49.3 at 1619.2 (8-vote), a 6.3x and 57.6x
  token reduction.


  An ablation on Qwen2.5-32B separates the 2 components: voting alone 48.3,
  structure alone 54.9, both 61.4, CoT per node 69.0. Token budgets are
  reported, so the cost comparison is matched in a usable way.


  The gain is not universal: on Llama-3.3-70B NCV ties the 8-vote baseline at
  58.0 avg F1 and loses on GSM8K, and Qwen2.5-7B stays below 43.6. Only math
  reasoning and 2 model families were tested, and node decomposition quality
  is not independently audited.


  If you run step-level verifiers, decomposition plus cheap binary consistency
  is likely a better default than long-form critique.
