brief: >-
  Asking a model 1 binary yes/no question per atomic claim, repeated 3 times,
  localizes reasoning errors better and far cheaper than having it verify a
  whole chain with chain-of-thought. Node-wise Consistency Verification (NCV)
  is training-free: it splits a solution into atomic assertion nodes, verifies
  each conditioned on previously accepted nodes, and caps output at 4 tokens.


  Evaluation is on all 4 ProcessBench subsets (3,400 cases: GSM8K 400, MATH
  1,000, OlympiadBench 1,000, Omni-MATH 1,000) with Qwen2.5-7B/32B/72B and
  Llama-3.3-70B, against end-to-end CoT verification with greedy decoding and
  8-sample majority voting.


  For Qwen2.5-32B, average F1 rises from 45.2 (greedy) and 49.3 (8-vote) to
  61.4, with per-subset gains of 13.3, 20.9, 21.9 and 23.8 points as
  difficulty increases; error localization on OlympiadBench goes 25.3 to 55.8.
  Cost is 28.1 tokens per sample versus 177.4 and 1619.2, a 6.3x and 57.6x
  reduction.


  An ablation separates the two ingredients at fixed model: voting alone 48.3,
  structure alone 54.9, both 61.4, per-node CoT 69.0. The comparison is
  cost-measured, not cost-matched, so the 8-vote baseline is not run at NCV's
  token budget.


  Gains are not universal: on Llama-3.3-70B NCV only matches the 8-vote
  baseline (58.0), and the largest Qwen gains shrink at 72B. Only math process
  verification was tested, with human-annotated first-error labels.


  If you run verifier passes at scale, restructuring into binary node checks
  is the cheaper default.
