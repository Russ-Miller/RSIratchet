  better-performing strategies than offline methods across a broad range of
  performance measures. In particular, RL-trained policies exhibit stronger
  out-of-distribution (OOD) behavior, where models trained only with
  imitation learning approaches often struggle. A recent study introduced an
  OOD-focused benchmark and reported that RL-trained vision-language-action
  (VLA) policies achieve noticeably better OOD performance and slightly
  better in-distribution (IND) performance than their counterparts trained
