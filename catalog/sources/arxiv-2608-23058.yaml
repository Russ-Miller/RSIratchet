summary: >-
  Large language models (LLMs) now support forecasting systems that combine
  language-based reasoning with temporal data, evidence retrieval, external
  tools, and iterative prediction. We investigate LLM-based forecasting
  agents, meaning systems in which a language model contributes to a scored
  prediction about a future or currently unobserved target. We organize
  architectures into three groups. Standalone LLM workflows operate on
  encoded time series or event context. Tool- and retrieval-augmented agents
  incorporate external evidence. Hybrid systems pair LLMs with statistical
  or foundation models.
