summary: >-
  Large audio language models (LALMs) extend large language models with an
  audio encoder and large-scale audio data. However, the scarcity of
  high-quality annotated audio data remains a fundamental bottleneck for
  scaling. Through probing signal detectability analysis, we identify
  fine-grained spectrotemporal perceptual weaknesses in a foundation LALM.
