brief: >-
  Omni-modal models that caption and answer questions well over aligned audio
  and video largely fail to notice when the two streams contradict each other,
  especially when the contradiction must be localized in a long video.


  AVID builds inconsistency into videos sourced from LongVALE by segmenting
  them into Active Speaker, Voiceover and Scenic classes, having a Gemini 3.1
  Pro strategy agent pick a plausible conflict category, then applying 1 of 5
  audio injectors (temporal offset, contradictory synthesized speech,
  pitch/formant identity shift, volume attenuation, background replacement)
  while leaving frames and duration untouched. The result is 11,200 full
  videos (avg 235.5s) with 39,361 annotated events and 78,722 clips over 8
  categories.


  Segment detection tops out at 69.7% (Gemini 3.1 Pro); full-video temporal
  grounding reaches only 26.2% mIoU. Fine-tuning Qwen3-Omni in 2 stages gives
  36.1% mIoU, SODA-m 7.47 vs 6.15, and 6.2 vs 2.2 BLEU-4 on segment reasoning.


  The tuning effect is measured with a stage ablation: segment-only training
  raises segment detection to 61.5% but drops full-video R@0.5 from 8.3% to
  4.6%; combining stages reaches 39.2%. Classification barely moves (55.0% to
  55.5%), so reasoning and category labels are not coupled.


  Inconsistencies are synthetic and audio-side only, with 8 categories and no
  natural-inconsistency test set; human agreement is self-reported (Cohen's
  Kappa > 0.75).


  Treat cross-modal conflict detection as a separate capability from
  audio-visual understanding, not a byproduct of it.
