  task in monitoring applications across clinical care, industrial
  operations, financial services, and logistics, where brief evidence may
  hide inside long spans of high-frequency data. Time-Series Language Models
  (TSLMs) are able to ingest time series data and verbalize findings on
  anomalies in natural language; however, recent benchmarks report a
