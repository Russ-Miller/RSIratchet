summary: >-
  Fine-tuning a Vision-Language-Action (VLA) model for a new deployment
  environment is expensive, yet most methods apply uniform-capacity adapters
  to every network region as if every region requires equal adjustment. This
  paper tests that assumption on five architecturally diverse VLAs
  (OpenVLA-OFT, $π_0$, SmolVLA, DTP, Octo; 93M-7B parameters). Measuring
