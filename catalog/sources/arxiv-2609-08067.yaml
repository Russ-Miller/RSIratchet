  keeping its outputs current, yet can also induce factual forgetting and
  new hallucinations. Prior work shows that long-tail knowledge is harder to
  acquire and newly memorized long-tail facts are difficult to retain during
  later fine-tuning. We study a complementary question: among facts that a
