brief: >-
  Asking a medical vision-language model to re-derive the question from its
  own answer, while forcing it to reuse the same visual attention, detects
  hallucinations better than measuring its predictive uncertainty. V-Loop
  extracts a semantic unit from the question and one from the answer, builds
  an inverted verification question, re-queries the image with the primary
  stage's aggregated text-to-image attention added back in at weight alpha =
  0.7, and flags a mismatch as hallucination. It is training-free and uses
  DeepSeek-V3.2-Exp as a text-only question generator and judge.


  Tested on VQA-RAD, VQA-Med-2019 and SLAKE with MedGemma-4B-it, Lingshu-7B
  and InternVL3-8B, with hallucination labels assigned automatically by GREEN.
  On VQA-Med-2019 open-ended questions with Lingshu-7B, AUC goes from 51.80
  (Semantic Entropy) to 71.93. Added on top of VASE, SE and RadFlag it
  improves every cell, by + 1.37 to + 20.71 AUC.


  The ablation isolates both parts: removing verification question generation
  drops VQA-RAD open-ended AUC from 70.00 to 56.89; removing attention
  consistency drops it to 66.79. Labels come from an automated metric, not
  clinicians, and the generator/judge is a single external LLM.


  Gains shrink on full test splits, since closed-ended questions lack dual
  semantic units and fall back to rephrasing. Performance also tracks backbone
  quality, with low AUC on LLaVA-Med-v1.5-7B.


  If you run uncertainty-based detectors, this is a cheap single-pass addition
  rather than a replacement.
