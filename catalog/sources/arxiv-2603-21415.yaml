summary: >-
  As large language models (LLMs) are deployed as autonomous agents with
  tool execution privileges, a critical assumption underpins their security
  architecture: that model errors are detectable at runtime, allowing
  monitoring systems, guardrails, or human reviewers to intervene before the
  agent acts. We present empirical evidence from a preliminary cohort of
  LLMs that this assumption fails for two of three instruction-following
  models evaluable for conflict detection; broader replication across
  additional architectures and scales is needed to establish prevalence
  rates. We introduce the concept
