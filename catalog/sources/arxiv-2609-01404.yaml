summary: >-
  Multimodal Large Language Models (MLLMs) are strong perceivers of images
  and video. We ask how far that reach extends into acting: dropping an MLLM
  directly into a drone's control loop, with its entire action space
  declared solely in the prompt. Recent systems approach this setting but
  increasingly narrow the model's decision-making. We widen it back. We
  introduce DroneCATS-Agent, an architecture where the MLLM is a swappable
  component, and DroneCATS, a benchmark treating the model as the
  independent variable. Beyond merely flying toward a pixel, our agent
  entrusts the model to yaw and search,
