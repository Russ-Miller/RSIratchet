brief: >-
  Having agents critique each other's drafts in natural language, instead of
  concatenating their outputs, keeps multi-layer agent ensembles improving
  with depth instead of peaking. Attention-MoA replaces MoA's naive
  concatenation with cross-agent and self-"attention" (each agent writes a
  refinement instruction for every peer), plus a residual stack of all prior
  layer outputs and an adaptive early-stop signal from the synthesis agent.


  Collaborative agents were Claude-4.5-Sonnet, Gemini-2.5-Pro, GPT-4.1,
  Qwen-Max and DeepSeek-V3.1 (Claude as aggregator), with a small-scale
  variant using 12B-32B open models. Benchmarks: AlpacaEval 2.0, MT-Bench, and
  the FLASK Hard subset (89 instances), depth L = 5.


  AlpacaEval 2.0 LC win rate reached 91.15% vs 88.56% for MoA and 78.20% for
  RMoA; MT-Bench average 9.32 vs 9.13 and 8.82. The small ensemble hit 8.83 /
  77.36%, above Claude-4.5-Sonnet (8.62 / 73.49%) and GPT-4.1 (8.59 / 69.83%).
  FLASK: better on 10 out of 12 dimensions, worse on Conciseness and
  Efficiency. Depth scaling was monotonic (89.48% at layer 1 to 91.15% at
  layer 5) while MoA degraded after layer 3. Early stopping cut tokens from
  118,9k to 106,1k per query, about 11%.


  Baselines share the same constituent and aggregation models, but not token
  budget, and Attention-MoA spends far more per query; all three benchmarks
  are LLM-judged, and the attention and residual modules are never ablated
  apart. Aggregator choice alone moved results 12.82%.


  If you run MoA pipelines, the depth-scaling and aggregator-choice results
  matter more than the headline win rate.
