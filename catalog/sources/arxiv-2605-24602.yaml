brief: >-
  Object hallucinations in multimodal LLMs track two measurable attention
  signatures: visual attention that disagrees across heads, and visual
  attention that decays as decoding proceeds. Correcting both at inference,
  without training, cuts hallucination rates.


  AFIP enriches attention scores using the cross-head mean of the top-k heads
  minus a variance penalty, reinjects stored visual attention from an 8-step
  history window, and gates the whole adjustment on the peak text-minus-visual
  attention gap. It is applied only to intermediate and deeper layers of
  LLaVA-1.5-7B/13B, Shikra-7B, MiniGPT-4-7B and Qwen-VL, evaluated on CHAIR
  and POPE.


  On CHAIR at 512 max new tokens, average C_S falls from 46.9 (greedy) to 17.5
  and C_I from 13.3 to 5.9, ahead of attention-intervention baseline HGAI at
  26.7/7.5. POPE average accuracy for LLaVA-1.5-7B rises from 84.87 to 87.11.
  Gains hold at 64/128/256 token limits.


  Evidence is measured against 6 baselines including OPERA, VCD and MemVR,
  with layer-wise and hyperparameter ablations; entropy differences between
  real and hallucinated tokens are reported at p < 0.01, and bootstrap
  intervals use 2,000 resampling trials. Mechanistic analysis is mostly
  correlational, and the theory concerns Rademacher complexity of an
  abstracted classification head, not the measured models.


  POPE gains do not hold on MiniGPT-4-7B, and only object hallucination
  benchmarks were tested, so general VQA or reasoning effects are unknown.


  If you intervene on attention to reduce hallucination, cross-head variance
  and decoding-time decay are worth targeting jointly.
