summary: >-
  A viral summary (1,500+ likes within hours) of arXiv 2602.00986 that
  presents the paper's probe-derived value and TD-error neurons as a
  "biological-style reward subsystem" that "naturally evolved", says the
  neurons "map perfectly" to prefrontal and dopamine neurons and "physically
  spike", and that ablating them means the model "completely loses its
  ability to reason". The paper states the names are analogy and reports the
  ablation on one 7B model and one benchmark.
notes: >-
