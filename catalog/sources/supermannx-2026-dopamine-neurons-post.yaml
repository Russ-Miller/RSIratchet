  overstatement of a real finding; the numbers it cites are in the paper,
  the framing is not. See the reply by Brett Hall filed alongside.
archived_text: |
  Researchers found dopamine neurons inside LLMs.

  Stanford and Tsinghua published a paper showing AI models have naturally evolved a biological-style reward subsystem inside their hidden states.

  they didn't program this. it just exists.

  by probing the network, researchers discovered that a highly sparse subset (less than 1% of neurons) does all the heavy lifting for self-correction.

  these neurons map perfectly to two biological equivalents:

  • value neurons: these predict the "expected value" of a state, functioning exactly like the human prefrontal cortex. before the model even generates its next word, these neurons light up to signal the model's exact confidence level.

  • dopamine neurons: these encode "reward prediction errors." when the ai makes an unexpected logical breakthrough, these neurons physically spike. when the model hits a logical flaw or makes a mistake, the dopamine crashes.

  why this is a massive deal for ai development:

  right now, scaling "inference-time reasoning" requires building massive, expensive external reward models to grade the ai's thoughts step-by-step.

  this paper proves the llm already has an internal reward model built-in.

  developers can just hook into the model's own dopamine neurons and use them as a native process reward model (PRM) to guide its logic. and if you ablate (turn off) just this tiny <1% cluster of neurons, the ai completely loses its ability to reason.

  synthetic neural networks are starting to behave exactly like biological brains..
