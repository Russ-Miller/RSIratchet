summary: >-
  Solvability detection is one of the most challenging aspects of
  mathematical reasoning for Large Language Models (LLMs). While prior work
  has studied this capability extensively, these analyses have been limited
  to English. Consequently, it remains unclear whether multilingual failures
  arise from differences in internal Solvability Belief or from
  language-dependent failures to express it. To address this gap, we
  introduce the first multilingual benchmark of paired solvable and
  unsolvable mathematical problems, extending ReliableMath to French and
  Greek. Using this, we train multilingual probes
