summary: >-
  To mitigate hallucinations in large language models (LLMs), we propose a
  framework that focuses on errors induced by prompts. Our method extends a
  chain-style knowledge distillation approach by incorporating a
  programmable module that guides knowledge graph exploration. This module
  is embedded as executable code within the reasoning prompt, allowing the
  model to leverage external structured knowledge during inference. Based on
  this design, we develop an enhanced distillation-based reasoning framework
  that explicitly regulates intermediate reasoning steps, resulting in more
  reliable predictions
