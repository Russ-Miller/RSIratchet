brief: >-
  Embedding executable code into a chain-of-thought prompt to drive
  knowledge-graph traversal is claimed to cut prompt-induced hallucination,
  with reported HIT@K scores above 95% on reasoning and QA benchmarks. Treat
  the size of those numbers with care.


  The system, KDCM, reformulates a prompt into structured sub-problems, runs a
  distillation chain whose intermediate steps are constrained by code-guided
  graph exploration, then answers from the validated steps. Base models are
  GPT-4 and LLaMA 3.3; datasets are WebQSP, CWQ, GSM8K, MWP, and Dr. SPIDER.


  Adding the code module moves HIT@1 from 82.36 to 99.33 on WebQSP, 81.36 to
  97.86 on CWQ, 82.06 to 98.23 on GSM8K, 85.26 to 98.19 on MWP, and 86.29 to
  94.10 on Dr. SPIDER. Averaged gains are reported as 15.64%, 13.38% and
  13.28% for HIT@1, HIT@3 and HIT@5, against baselines KG-LLM-PR (91.06
  HIT@1), LLM-SubKG-Sum (92.23), RAG (90.23) and Self-Check (91.25).


  Evidence is thin relative to the claim. There is one ablation (with and
  without the code module), but no matched compute budget, no per-model
  breakdown separating GPT-4 from LLaMA 3.3, no variance or seed counts, and
  HIT@K is an odd metric for GSM8K and text-to-SQL. Robustness to ambiguous
  prompts is asserted, not quantified.


  The method needs a knowledge graph and code representations, and is untested
  on open-ended generation or multimodal tasks. Useful as a design sketch; not
  yet a reason to believe hallucination is largely solved by structured
  prompts.
