brief: >-
  Embedding executable code that traverses a knowledge graph inside a
  chain-of-thought prompt is reported to raise retrieval-style accuracy on
  question answering and math benchmarks by double digits. The claim is that
  explicit, externally constrained intermediate steps suppress prompt-induced
  hallucination.


  The system, KDCM, reformulates a prompt into structured sub-problems, runs a
  code-guided distillation chain over external structured knowledge, then
  answers. Base models are GPT-4 and LLaMA 3.3; datasets are WebQSP, CWQ,
  GSM8K, MWP, and Dr. SPIDER; metrics are HIT@1, HIT@3, HIT@5.


  Adding the code module moves WebQSP HIT@1 from 82.36 to 99.33 and Dr. SPIDER
  from 86.29 to 94.10. Averaged across datasets the method reports 98.40 /
  96.83 / 95.51, against RAG at 90.23 / 90.28 / 90.18 and Self-Check at 91.25
  / 92.35 / 91.27. Headline gains are 15.64%, 13.38%, 13.28%.


  Evidence is thin. There is 1 ablation (with and without the code module),
  but no matched-compute baseline, no per-model breakdown separating GPT-4
  from LLaMA 3.3, no variance or seed counts, and HIT@K is an odd metric for
  GSM8K and text-to-SQL. Robustness to ambiguous prompts is asserted, not
  quantified.


  Treat the near-99% numbers as unverified until the evaluation protocol is
  specified.
