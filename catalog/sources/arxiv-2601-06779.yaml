brief: >-
  Fine-tuning a 2B model for cybersecurity runs into a hardware-imposed
  context ceiling that undercuts the instruction-tuning it is supposed to
  enable. Gemma-2B was fine-tuned on a MITRE ATT&CK dataset of 2,398
  prompt-response pairs on a single 24GB GPU with 4-bit quantized weights,
  then extended with a RAG pipeline and graph-based retrieval over STIX threat
  intelligence.


  Default token lengths of 1,024 to 2,048 caused parser errors at batch size
  4; a token limit of 397 with dynamic padding was needed for stable training,
  which restricted the model to 1–2 shot prompting and 200-token outputs
  despite nominal 2048 support. Baseline accuracy for sub-2B models is
  reported below 20%, versus over 50% for cloud models above 175 billion
  parameters, which is why larger models were used to generate the synthetic
  instruction data. On 5 MITRE queries scored by an LLM judge across
  relevance, completeness, accuracy, specificity, and clarity, GraphRAG+GNN
  averaged 8.00, pure RAG 7.87, and Graph+LLM 7.16.


  The retrieval comparison rests on 5 queries and an automated LLM judge, with
  no human scoring and no standard baseline; the authors say baseline
  comparison is future work. The fine-tuning claims are qualitative, from
  inspected sample outputs rather than a scored test set.


  Treat this as an engineering report on small-model domain adaptation, not as
  evidence that graph augmentation beats RAG.
