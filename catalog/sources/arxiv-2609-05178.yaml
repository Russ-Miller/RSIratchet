summary: "Vision-Language-Action (VLA) or World Action (WAM) models have
  recently demonstrated remarkable performance in robotic manipulation. On
  LIBERO, SOTA method have achieved nearly 100\\% success rates, seemingly
  suggesting that the models are ready for deployment in real world. However,
  near perfect performance on existing benchmarks can be misleading: success
  under ideal conditions does not imply real world robustness. Existing
  benchmarks primarily evaluate task completion from predefined initial
  states, while real world interactions inevitably involve failures such as
  failed grasps, collisions,"
