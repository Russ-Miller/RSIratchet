brief: >-
  Near-perfect LIBERO scores do not indicate that manipulation policies can
  recover from their own mistakes. Placed in failure states that actually
  occurred during execution, every model tested loses more than 50% of its
  performance, and standard benchmark rankings stop predicting who does
  better.


  LIBERO-Recover builds 2178 recovery scenarios from 130 subtasks across 4
  LIBERO suites, with failures harvested from runs of pi-0, pi-0.5, OpenVLA,
  GR00T, Wan-Policy and Cosmos-Policy rather than injected by hand, then
  sorted by Qwen3.5-27B-Instruct into 4 recovery levels from action retry to
  environmental recovery. 6 policies are evaluated, 10 trials per task.


  Recovery success falls steeply with level: pi-0 goes 40.0 at L1 to 6.7 at L4
  on LIBERO-Spatial, and no model exceeds 12.5 at L4 anywhere. Averaged over
  models, success drops from 26.2% to 0.3% on LIBERO-100 post-failure, a
  100.0% degradation rate. Shrinking action chunks from 32 to 4 helps; adding
  the initial frame as temporal context raises OpenVLA-OFT from 20.8% to
  26.8%.


  The transfer result is the sharpest: mixing 3,184 teleoperated recovery
  trajectories into training lifts recovery (GR00T 17.8% to 21.2%) but leaves
  standard LIBERO flat or worse (OpenVLA-OFT 97.1% to 96.6%). That is a
  matched comparison on the same 2 models.


  Level labels come from an LLM, not human audit, and higher levels are
  sparse. Treat saturated LIBERO numbers as uninformative about deployment
  robustness.
