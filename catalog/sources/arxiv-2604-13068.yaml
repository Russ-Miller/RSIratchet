summary: >-
  Activation-based linear probing is widely proposed as a method for both
  detecting and correcting hallucinations in autoregressive language models.
  We present an empirical study across seven models spanning 117M to 7B
  parameters and three architecture families (GPT-2, Pythia, Qwen-2.5) that
  documents a robust asymmetry: linear probes can detect hallucination
  signals with above-chance accuracy in larger models, but activation
  steering along the probe-derived direction fails to correct hallucinations
  in 7 of 7 models tested. We further find that output-confidence baselines
