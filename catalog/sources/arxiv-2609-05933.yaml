summary: >-
  Efficiency is increasingly important for Large Language Model (LLM)-based
  multi-agent systems (MAS), as larger models and more agents introduce
  substantial execution costs. Recent methods aim to make MAS cheaper by
  pruning agents, removing communication edges, or searching for compact
  structures. However, we argue that existing evaluations may overestimate
  their true ability to improve MAS efficiency. Reported gains are often
  measured under method-specific prompts and starting topologies, making
  them difficult to attribute to the proposed structural changes. Moreover,
