summary: We present H-Node Adversarial Noise Cancellation (H-Node ANC), a
  mechanistic framework that identifies, exploits, and defends hallucination
  representations in transformer-based large language models (LLMs) at the
  level of individual hidden-state dimensions. A logistic regression probe
  trained on last-token hidden states localizes hallucination signal to a
  small set of high-variance dimensions -- termed Hallucination Nodes
  (H-Nodes) -- with probe AUC reaching 0.90 across four architectures. A
  white-box adversarial attack amplifies these dimensions at inference time
  via a real-time forward hook,
