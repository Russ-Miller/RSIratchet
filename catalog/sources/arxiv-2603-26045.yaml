brief: >-
  Hallucination signal in transformers is linearly readable from last-token
  hidden states at roughly half of network depth, and the same dimensions can
  be amplified to inject hallucination or cancelled to defend — but a defender
  who picks its own dimensions covers only a minority of the attacker's.


  H-Node ANC trains logistic-regression probes on last-token activations from
  300 TruthfulQA and 300 HaluEval samples, picks the top-50 coefficient
  dimensions, and runs attack and defense as forward hooks on OPT-125M,
  Phi-3-mini-4k, LLaMA-3-8B-Instruct and Mistral-7B-Instruct-v0.3.


  Probe AUC is 0.754, 0.888, 0.898, 0.905, peaking at 50%, 53%, 47% and 50%
  depth; last-token pooling beats mean-pooling by +0.036 to +0.240. Attacker
  and defender node sets overlap only 14.0–36.0%, so single-pass defense
  robustness is 0.035–0.083. Re-ranking targets by residual excess across
  passes lifts this to 0.689 (OPT), 0.371 (Phi-3), 0.339 (Mistral), 0.125
  (LLaMA). Perplexity shifts +0.0 to +3.3%; MMLU moves −0.03 to +0.02.


  Static-vs-adaptive and stopping-criterion ablations are present, and ITI and
  DoLA baselines are run on all 4 models, so the drift reduction of 33.3–41.5%
  and the 1.54x–4.53x selectivity edge over ITI are measured, not argued. All
  numbers are self-reported by the authors.


  MC1 stays near chance (0.24–0.28) under bare Q:/A: prompting, so no
  generation-level hallucination reduction is demonstrated; nothing above 8B,
  and black-box attackers are out of scope.


  Treat this as evidence about representational geometry, not about shipping a
  hallucination fix.
