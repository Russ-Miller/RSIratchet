summary: >-
  Deception detection is a critical and highly challenging task within
  affective computing and behavioral analysis. Existing deep learning
  methods typically treat this task as a straightforward classification
  problem; however, this black-box approach lacks interpretability and fails
  to capture the complex logical deduction processes utilized by human
  experts when identifying lies. While Multimodal Large Language Models
  (MLLMs) have shown potential, applying them effectively requires a bridge
  between low-level audiovisual cues and high-level logical reasoning. In
  this paper, we propose DeceptionX
