summary: >-
  End-to-end navigation policies trained on large simulation corpora degrade
  sharply when transferred to out-of-distribution scenes, categories, or
  goal modalities. Modular pipelines such as Modular GOAT are bottlenecked
  by closed-set object detection recall, while 3D snapshot-memory systems
  (e.g. 3D-Mem) accumulate dense, view-dependent representations that are
  heavy to maintain. We present AnyGoal, a training-free multi-robot
  architecture that places a Vision-Language Model (VLM) at the core of
  frontier-based exploration and coordinates agents through a shared 2D
