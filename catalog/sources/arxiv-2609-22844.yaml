summary: >-
  Automated Program Repair (APR) increasingly relies on Large Language
  Models (LLMs). ChatGPT-enhanced APR uses techniques such as
  self-correction and autonomous agents to improve repair without modifying
  model parameters. Although these approaches report strong results on
  Defects4J and SWE-bench, the stability of enhancement gains across
  benchmarks remains under-explored. We evaluate three ChatGPT-enhanced APR
  methods on three representative, long-standing benchmarks. With
