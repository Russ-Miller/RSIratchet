summary: "Today&#39;s AI systems have human-designed, fixed architectures and
  cannot autonomously and continuously improve themselves. The advance of AI
  could itself be automated. If done safely, that would accelerate AI
  development and allow us to reap its benefits much sooner. Meta-learning can
  automate the discovery of novel algorithms, but is limited by first-order
  improvements and the human design of a suitable search space. The Gödel
  machine proposed a theoretical alternative: a self-improving AI that
  repeatedly modifies itself in a provably beneficial manner. Unfortunately,
  proving that most changes are net beneficial is impossible in practice. We
  introduce the Darwin Gödel Machine (DGM), a self-improving system that
  iteratively modifies its own code (thereby also improving its ability to
  modify its own codebase) and empirically validates each change using coding
  benchmarks. Inspired by Dar…"
