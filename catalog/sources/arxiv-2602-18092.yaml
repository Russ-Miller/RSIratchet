ingested_at: 2026-09-19
brief: >-
  Telling people a chatbot is politically biased against their party cuts how
  much it corrects their factual beliefs, without eliminating persuasion. In a
  preregistered 4-arm U.S. survey experiment (N=2144, Prolific, December
  2025-January 2026), participants held at least 1 of 6 economic
  misconceptions (household-budget analogy, rent control, immigration and
  jobs, trade deficits, tax cuts paying for themselves, "Buy American") and
  had a 3-round conversation with gpt-4.1-2025-04-14 prompted to persuade them
  toward the academic-economist consensus while not fabricating evidence.


  Control respondents moved -1.20 (SE=0.06) on a 0-4 agreement scale; the
  heavy out-party bias cue (training-data skew plus Sam Altman donation facts
  and a photo with an out-party politician) yielded -0.86 (SE=0.06) and the
  light cue -0.93 (SE=0.06), attenuations of 28% (16-40%) and 23% (9-35%).
  Full opinion reversals fell from 34.4% to 22.1%. Cues also lowered rated
  persuasiveness (d = -0.31), willingness to repeat (d = -0.20), and trust in
  AI (d = -0.10).


  The cause is manipulated rather than measured, with a non-directional bias
  arm as an active control, topic fixed effects, and a manipulation check
  showing the cue raised perceived out-party bias in both parties. LLM-judged
  transcript scaling found more words and more argumentativeness, not
  disengagement or dismissiveness, pointing to motivated reasoning.
  Topic-by-treatment interactions were all non-significant, and partisan
  differences in effect were not significant (p = 0.40).


  Boundaries: 1 short interaction, 1 model family, U.S. online sample, 6
  economic topics; no test of repeated real-world use or other models.


  If you cite LLM persuasion estimates, treat them as upper bounds set in a
  low-politicization window.
