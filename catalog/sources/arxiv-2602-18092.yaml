brief: >-
  Telling someone that a chatbot is politically biased against their party
  cuts how much it can correct their false beliefs, without eliminating the
  effect. In a preregistered U.S. Prolific experiment (N=2144), respondents
  held at least 1 of 6 economic misconceptions (household-budget analogy, rent
  control, immigration and jobs, trade deficits, tax cuts, "Buy American") and
  then had a 3-round conversation with gpt-4.1-2025-04-14 prompted to persuade
  them toward the academic-economist consensus while staying truthful. 4 arms:
  blank control, a non-directional bias warning, and 2 out-party bias
  warnings, the stronger adding factual donation history and a real photo of
  Sam Altman with Trump or Pelosi.


  Mean pre-post change in misconception agreement was -1.20 (SE=0.06) on a 0-4
  scale in control, -0.93 (SE=0.06) under the light cue and -0.86 (SE=0.06)
  under the heavy cue: a 28% reduction in persuasion (16-40%) and 23% (9-35%).
  Full opinion reversals fell from 34.4% to 22.1%. Transcript analysis via
  LLM-as-judge pairwise comparisons and a Bayesian Bradley-Terry scale found
  more words and more argumentativeness, not disengagement or dismissiveness.


  Randomized manipulation with a manipulation check, topic fixed effects and
  pretreatment controls; earlier work only measured bias beliefs. Effects were
  consistent across 4 of 6 topics with no significant topic interactions, and
  no heterogeneity by partisan strength, affective polarization, or AI trust.


  Limits: 1 short interaction, 1 model family, U.S. online sample, economic
  topics only.


  Treat published LLM persuasion effects as upper bounds for politicized
  deployment contexts.
