brief: >-
  Telling someone that a chatbot is politically biased against their party
  cuts how much it corrects their factual beliefs, without eliminating
  persuasion. This places perceived source neutrality alongside interactivity
  and personalization as a lever of LLM persuasion.


  In a preregistered 4-arm, between-subjects Prolific experiment (N=2144,
  U.S., December 2025-January 2026), respondents held at least 1 of 6 economic
  misconceptions (household-budget analogy, rent control, immigration and
  jobs, trade deficits, tax cuts, "Buy American") and then had a 3-round
  conversation with gpt-4.1-2025-04-14 prompted to persuade them toward the
  academic-economist consensus without fabricating evidence. Arms: blank
  control, an undirected bias warning, and light and heavy out-party bias cues
  (the heavy arm added factual Sam Altman donation details and a photo with an
  out-party politician).


  Control pre-post change was -1.20 (SE=0.06) on a 0-4 scale. Heavy treatment
  was -0.86 (SE=0.06) and light -0.93 (SE=0.06), a 28% (16-40%) and 23%
  (9-35%) attenuation. Full opinion reversals fell from 34.4% to 22.1%.
  Transcript scaling (LLM-as-judge pairwise comparisons, Bayesian
  Bradley-Terry) showed more words and more argumentativeness, not
  disengagement or dismissiveness, pointing to motivated reasoning.


  Bias perceptions were manipulated rather than measured, with a manipulation
  check and topic fixed effects; topic-by-treatment interactions were not
  individually significant, and party heterogeneity was not significant
  (p-value = 0.40).


  Boundaries: 1 short interaction, 1 model family, U.S. online sample,
  economic topics only; no test of repeated real-world use.


  If you extrapolate from persuasion experiments run in politically neutral
  framings, discount for messenger-credibility attacks.
