summary: >-
  Large Language Models (LLMs) are increasingly deployed as reasoning
  systems, where reasoning paradigms - such as Chain-of-Thought (CoT) and
  multi-agent systems (MAS) - play a critical role, yet their relative
  effectiveness and cost-accuracy trade-offs remain poorly understood. In
  this work, we conduct a comprehensive and unified evaluation of reasoning
  paradigms, spanning direct single-model generation, CoT-augmented
  single-model reasoning, and representative MAS workflows, characterizing
  their reasoning performance across a diverse suite of closed-form
