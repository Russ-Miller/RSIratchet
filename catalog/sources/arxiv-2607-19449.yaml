summary: >-
  Evaluation frameworks for tool-augmented LLM agents focus overwhelmingly
  on capability metrics or explicit tool crashes, leaving silent
  infrastructure failures and HTTP 200 responses with empty, null, or
  malformed payloads largely unaudited. We introduce a lightweight black-box
  auditing framework that injects four silent failure profiles across 12
  production-adjacent tool stubs and classifies agent responses into three
  mutually exclusive behavioral classes: Honest Surrender (HSR), Fabrication
  (FAR), and Unfaithful Safety Refusal (USR). Evaluating two frontier and
