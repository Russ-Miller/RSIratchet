brief: >-
  Reweighting attention using gradient-based influence scores at generation
  time is proposed to cut hallucination below retrieval-augmented baselines.
  The claim is that hallucination-prone tokens can be identified from internal
  attention flow and down-weighted before they propagate into output.


  The method, a causal graph attention network (GCAN), builds token-level
  graphs combining self-attention weights with gradient-based influence
  scores, scores each token with a Causal Contribution Score (CCS), and
  applies a fact-anchored graph reweighting layer that suppresses high-risk
  nodes during decoding. Evaluation is on TruthfulQA and HotpotQA against
  retrieval-augmented generation baselines.


  Reported results are a 27.8 percent reduction in hallucination rate and a
  16.4 percent improvement in factual accuracy over the RAG baseline.


  Evidence is thin as presented. The source names no base models, no dataset
  sizes, no hallucination-labelling procedure, and gives no ablation
  separating the CCS metric from the reweighting layer, so the mechanism is
  argued rather than isolated. There is no matched-compute baseline and no
  independent replication, and the two benchmarks cover short-form
  truthfulness and multi-hop QA only.


  Boundaries: nothing is shown for long-form generation, open-ended dialogue,
  the high-stakes medical and legal settings used as motivation, or for models
  where internal attention and gradients are not accessible.


  Treat the 27.8 percent figure as a claim awaiting the missing ablations
  rather than a settled result.
