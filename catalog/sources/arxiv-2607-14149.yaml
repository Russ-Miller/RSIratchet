  logical grounding. We investigate a neuro-symbolic agentic framework to
  enhance the reasoning capabilities of SLMs, specifically Gemma 3 (1B, 4B)
  and Llama 3.2 (3B), using the CLUTRR kinship benchmark. Our approach
  transforms the SLM into a minimalist agent utilizing two specialized tool
