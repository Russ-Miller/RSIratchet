brief: >-
  Small language models' failure on multi-hop kinship reasoning is a
  fact-extraction problem, not a reasoning problem: give them the right
  symbolic hint and accuracy jumps, but make them extract the facts themselves
  and the pipeline collapses.


  Gemma 3 (1B, 4B) and Llama 3.2 (3B) were turned into minimal agents on the
  CLUTRR benchmark with 2 tools: extract_facts for triplet extraction and
  get_hint from a 4-layer RGCN trained on 2-4 hop chains and tested on 2-10
  hops. Oracle and self-extracted configurations were compared.


  Story-only baselines reach 7.54% (Gemma 1B), 16.13% (Llama 3B), 13.45%
  (Gemma 4B). With a ground-truth Oracle Hint, Llama 3B rises to 62.79% and
  Gemma 4B to 59.16%. The RGCN scores 60.69% on oracle facts but 24.88% on
  SLM-extracted facts, where ground-truth fact recall is about 71%. GNN hints
  from self-extracted facts give a 1.5 - 2x gain (Gemma 1B 7.5% to 12.6%). A
  distraction effect appears for Gemma 4B: Story + GNN Hint 19.75% beats Story
  + SLM Facts + GNN Hint 14.98%, while Llama is unaffected (20.32% vs 20.52%).


  Measured, with a 9-configuration grid isolating oracle facts from oracle
  hints, so the extraction bottleneck is cleanly attributed. Evidence is 1
  synthetic kinship benchmark, 3 models, zero-shot only, no fine-tuning or
  iterative verification baseline.


  If you are building SLM agents over knowledge graphs, spend the budget on
  extraction quality, not the reasoner.
