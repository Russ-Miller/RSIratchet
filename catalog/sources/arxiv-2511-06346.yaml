summary: Large Language Models (LLMs) perform well on standard reasoning and
  question-answering benchmarks, yet such evaluations often fail to capture
  their ability to handle long-tail, expertise-intensive knowledge in
  real-world professional scenarios. We introduce LPFQA, a long-tail knowledge
  benchmark derived from authentic professional forum discussions, covering 7
  academic and industrial domains with 430 curated tasks grounded in practical
  expertise. LPFQA evaluates specialized reasoning, domain-specific
  terminology understanding, and contextual interpretation, and adopts a
  hierarchical difficulty
