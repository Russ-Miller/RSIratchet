brief: >-
  Frontier models sit near 50% on real questions pulled from specialized
  professional forums, and giving them a code interpreter or web search makes
  them worse, not better.


  LPFQA contains 430 items (249 multiple-choice, 181 short-answer) scraped as
  screenshots from over 50 vetted forums across 7 primary and 21 secondary
  domains, filtered by VLM/LLM extraction, then expert-verified and stratified
  into 3 difficulty tiers. 11 models were scored by an LLM judge under binary
  matching against expert reference answers.


  All models land in 45%–55%; GPT-5-High leads at 54.42%, with per-domain
  averages from 41.26% (Computer Science) to 54.85% (EE). No model dominates
  every domain. Error attribution on 50 sampled wrong answers per domain puts
  knowledge gaps plus question misinterpretation at over 73% of errors,
  reasoning errors at 16.3%. Tool augmentation dropped scores: Jupyter CI
  −28.76% on average, search −30.26%, with Gemini-2.5-Pro falling 47.67 to
  33.50.


  The tool ablation is matched against the same models tool-free, so the
  degradation is cleanly attributed, though the cause is diagnosed via case
  study rather than measured. Contamination is argued indirectly through
  ROUGE-L overlap (LPFQA 24.02–33.73 vs MMLU-devset 38.05–46.17) on 3 open
  models. Grading is LLM-judge only, with no human agreement check, and the
  set is small.


  Treat retrieval and code tools as task-dependent, not default wins.
