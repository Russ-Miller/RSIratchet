brief: >-
  Frontier models sit near 50% accuracy on niche professional forum questions,
  and giving them a code interpreter or web search makes them worse.


  LPFQA contains 430 items (249 multiple-choice, 181 short-answer) scraped as
  screenshots from over 50 vetted professional forums, covering 7 primary and
  21 secondary domains, built through VLM extraction, LLM question generation,
  and expert verification with difficulty stratification. 11 models were
  scored by an LLM judge against expert reference answers.


  All models cluster in 45%-55%; GPT-5-High leads at 54.42% overall, GLM-4.6
  at 50.47%, Gemini-3-Pro at 51.16%, average 48.96%. Computer Science is
  weakest (41.26% average). Adding a Jupyter interpreter drops the 5-model
  average from 50.00 to 35.62 (28.76% relative), search to 34.87 (30.26%).
  Error attribution on 50 sampled failures per domain puts knowledge gaps plus
  question misinterpretation at over 73%, reasoning errors at 16.3%.


  The tool result is a matched comparison against the same models tool-free,
  so the degradation is attributable, though the cause is diagnosed by case
  reading rather than measured. Contamination is argued only via ROUGE-L
  overlap (LPFQA 24.02-33.73 vs MMLU-devset 38.05-46.17) on 3 open models.
  Judging is LLM-based with no reported human agreement, and 430 items across
  7 domains leaves small per-domain samples.


  If you assume retrieval fixes long-tail knowledge gaps, this is evidence it
  can actively hurt.
