brief: >-
  Frontier models sit near 50% on real questions pulled from niche
  professional forums, and giving them a code interpreter or web search makes
  them worse, not better.


  LPFQA contains 430 items (249 multiple-choice, 181 short-answer) built from
  over 2,000 threads scraped from over 50 vetted forums, all posted after
  January 2025, covering 7 primary and 21 secondary domains. Items were
  extracted by a VLM from screenshots, filtered by an LLM, then
  expert-verified and stratified into 3 difficulty tiers. 11 models were
  scored by an LLM judge on binary answer match.


  All models fall in a 45%-55% band; GPT-5-High leads at 54.42%, Gemini-3-Pro
  51.16%, GLM-4.6 50.47%. Computer Science is weakest at roughly 41.26%
  average. Error attribution on 50 sampled wrong answers per domain puts
  knowledge gaps plus question misinterpretation at over 73%, reasoning errors
  at 16.3%. Tool augmentation cut accuracy: average 50.00 to 35.62 with
  Jupyter CI (28.76% drop) and 34.87 with search (30.26% drop). ROUGE-L
  overlap is 24.02-33.73 on LPFQA versus 38.05-46.17 on MMLU-devset, arguing
  against leakage.


  The tool ablation is measured against a matched tool-free baseline, but the
  failure mechanism is argued from case studies rather than isolated. Judging
  is LLM-based, single-pass at temperature 1, and the leakage check covers 3
  open models only.


  Use it if you want a knowledge benchmark where search retrieval actively
  hurts.
