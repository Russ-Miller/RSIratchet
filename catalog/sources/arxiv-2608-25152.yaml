summary: >-
  Multi-agent LLM systems increasingly debate answers, coordinate research,
  simulate users, and mediate information flows, making agent-to-agent
  persuasion a basic but undermeasured capability. We introduce a controlled
  testbed for studying how goal-directed persuaders shift elicited stances
  in networks of LLM agents grounded in real-world ego-network topologies.
