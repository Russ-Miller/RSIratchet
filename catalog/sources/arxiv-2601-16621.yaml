summary: >-
  Large language model (LLM)-powered assistants have recently integrated
  memory mechanisms that record user preferences, leading to more
  personalized and user-aligned responses. However, irrelevant personalized
  memories are often introduced into the context, interfering with the LLM's
  intent understanding. To comprehensively investigate the dual effects of
  personalization, we develop RPEval, a benchmark comprising a personalized
  intent reasoning dataset and a multi-granularity evaluation protocol.
