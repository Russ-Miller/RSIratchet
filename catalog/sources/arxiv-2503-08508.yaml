brief: >-
  A 1.5B model fine-tuned to emit parameterized skill calls plus explicit
  three-level verification beats GPT-4-based planners on robot task planning
  that requires resolving relational semantics like "largest" or "leftmost".


  LightPlanner replaces fixed skill templates with function calls whose
  parameters (e.g. bounding boxes) the LLM computes itself, adds reasoning
  over execution feedback, goal consistency, and parameter validity before
  each step, and stores history in a memory module instead of growing context.
  Qwen2.5-1.5B-Instruct was fine-tuned on LightPlan-40k (40,000 decision
  samples, tasks of 2 to 13 steps, expanded by GPT-4 from 60 hand-annotated
  tasks) and evaluated on a UR3 arm across 30 tasks run 3 times each, 90
  trials.


  On dynamic semantic reasoning tasks it reached 100.0 short-term success,
  79.5% medium-term (vs 71.4% CoPAL/GPT-4) and 66.1% long-term (vs 54.1%
  CAPE). On 10 unseen 8-step task categories: 62.6% SR vs 53.8% CoPAL and
  42.0% ReAct-3B. Latency varies by ±2 seconds and VRAM stays near 3.9 GB; it
  runs on Jetson Xavier Orin at 10 words/s.


  Baselines ReAct and MLDT were retrained on the same dataset, which isolates
  the planner design from the data. Ablations drop SR by 7.5% (dynamic skill
  control), 5.8% (hierarchical reasoning) and 5.0% (memory). But GPT-4
  baselines were prompted, not trained, so the dataset advantage is not
  matched for them; evaluation is 1 robot, 1 lab, 1 model family, static
  scenes only, and the authors flag unpredictably changing environments as
  untested.


  If you assumed small models fail at planning because of capacity, this
  points instead at action-space design.
