brief: >-
  Letting a 1.5B model generate skill-function parameters itself, instead of
  filling fixed skill templates, closes most of the gap to GPT-4-based
  planners on robot task planning that requires resolving relational language
  like "largest" or "leftmost".


  LightPlanner fine-tunes Qwen2.5-1.5B-Instruct on LightPlan-40k, 40,000
  single-step action-decision samples built from 60 hand-annotated tasks with
  13 skill functions and action chains of 2 to 13 steps. Evaluation ran on a
  real UR3 arm with a D435 camera over 30 tasks repeated 3 times (90 trials),
  split into simple semantic mapping and dynamic semantic reasoning, with
  short (2-4), medium (5-6) and long (7-8) step lengths.


  On dynamic semantic reasoning tasks it reached 100.0% short-term success,
  79.5% medium (vs 71.4% CoPAL/GPT-4) and 66.1% long-term (vs 54.1% CAPE). On
  10 unseen 8-step task categories it scored 62.6% SR against 53.8% for CoPAL
  and 42.0% for ReAct-3B. Ablations in long-term tasks: removing dynamic skill
  control costs 7.5% SR, hierarchical reasoning 5.8%, memory 5.0% plus 4
  seconds.


  Baselines ReAct and MLDT were retrained on the same LightPlan-40k data,
  which isolates the planner design rather than the data; the GPT-4 baselines
  were prompt-only. Single robot, single task family, 90 trials, authors' own
  environment, and the paper concedes failure risk in environments that change
  mid-task.


  If you are planning on edge hardware, parameterized skill calls plus
  per-step verification look worth more than extra parameters.
