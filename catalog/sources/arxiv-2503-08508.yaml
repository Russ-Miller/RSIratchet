brief: >-
  A 1.5B model fine-tuned to emit parameterized skill calls with step-by-step
  verification can beat GPT-4-based planners on robot task planning that
  requires dynamic semantic reasoning, like resolving "largest" or "leftmost"
  from detection boxes. The mechanism is letting the LLM compute parameters
  (e.g. bounding box areas) rather than filling fixed skill templates.


  LightPlanner fine-tunes Qwen2.5-1.5B-Instruct on LightPlan-40k, 40,000
  action-control samples derived from 60 hand-annotated tasks over 13 skill
  functions with chains of 2 to 13 steps, and evaluates on a UR3 arm across 30
  real tasks run 3 times each (90 trials), split into simple semantic mapping
  and dynamic semantic reasoning, short/medium/long-term.


  On dynamic semantic reasoning it reaches 100.0% SR short-term, 79.5% medium
  (vs 71.4% CoPAL), 66.1% long-term (vs 54.1% CAPE); spatial reasoning success
  exceeds ReAct by 14.9%. On unseen 8-step tasks: 62.6% SR vs 53.8% CoPAL and
  42.0% ReAct-3B. Ablations drop SR to 58.6% without dynamic skill control,
  60.3% without hierarchical reasoning, 61.1% without memory.


  Baselines were retrained on the same dataset, which isolates the method
  rather than the data, and the ablation is matched. But trial counts are
  small, evaluation is author-run on 1 robot setup, and GPT-4 baselines use
  original prompts. Nothing tested in dynamic environments, which the authors
  flag as a limit.


  If you assumed small models can't plan, the bottleneck may be the action
  interface rather than parameter count.
