brief: >-
  A 1.5B model fine-tuned to emit parameterized skill calls plus 3-level
  verification reasoning beats GPT-4-based planners on robot tasks that
  require resolving dynamic spatial semantics like "largest" or "leftmost".


  LightPlanner separates perception from action skills, lets the model compute
  parameters (e.g. bounding-box areas) rather than filling fixed templates,
  verifies execution feedback, goal consistency and parameter validity before
  each step, and keeps a memory module instead of growing context.
  Qwen2.5-1.5B-Instruct was fine-tuned on LightPlan-40k, 40,000 action-control
  samples built from 60 hand-annotated tasks expanded to 6,000 via GPT-4.
  Evaluation ran on a real UR3 arm, 30 tasks x 3 repeats = 90 trials.


  On dynamic semantic reasoning tasks LightPlanner-1.5B reached 100.0%
  short-term success, 79.5% medium (vs 71.4% CoPAL/GPT-4) and 66.1% long-term
  (vs 54.1% CAPE). On unseen 8-step task orders it hit 62.6% SR against 53.8%
  for CoPAL and 42.0% for ReAct-3B. Ablations in long-term tasks drop SR to
  58.6% without dynamic skill control, 60.3% without hierarchical reasoning,
  61.1% without memory.


  Baselines ReAct and MLDT were retrained on the same dataset, so the
  architecture is isolated from data advantage, but GPT-4 baselines were
  prompt-only. 1 robot, 1 model family, 90 trials, tabletop block
  manipulation, static scenes; the authors flag unpredictable dynamic
  environments as untested.


  If you assumed small planners fail on relational semantics, the bottleneck
  may be output format rather than model size.
