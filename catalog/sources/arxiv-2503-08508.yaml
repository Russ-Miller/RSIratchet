brief: >-
  A 1.5B model fine-tuned to emit parameterized skill calls with explicit
  per-step verification beats GPT-4-based planners on robot tasks that require
  resolving dynamic spatial semantics like "largest" or "leftmost".


  LightPlanner fine-tunes Qwen2.5-1.5B-Instruct on LightPlan-40k, 40,000
  action-decision samples derived from 60 hand-annotated tasks expanded to
  6,000 via GPT-4, over 13 skill functions. Evaluation is on a real UR3 arm
  with wrist RGB-D, 30 tasks run 3 times each for 90 trials, split into simple
  semantic mapping and dynamic semantic reasoning, with chains of 2-8 steps.


  On dynamic semantic reasoning, LightPlanner-1.5B hits 100.0% success
  short-term, 79.5% medium-term vs 71.4% for CoPAL (GPT-4), and 66.1%
  long-term vs 54.1% for CAPE. On 10 unseen 8-step task categories it reaches
  62.6% SR against 53.8% for CoPAL and 42.0% for ReAct-3B. Ablations on
  long-term tasks drop SR to 58.6% without dynamic skill control, 60.3%
  without hierarchical reasoning, 61.1% without memory.


  Baselines were retrained on the same dataset where applicable (ReAct-1.5B,
  ReAct-3B, MLDT-7B), which isolates the planner design from the data.
  Prompt-only GPT-4 baselines used original prompt designs, so some of the gap
  may be prompt fit rather than method.


  The environment is 1 arm, 1 task family, blocks on a table, 90 trials,
  authors' own setup; the paper concedes failure modes in environments that
  change mid-task. Worth reading if you are deciding whether edge-sized
  planners need large-model fallbacks.
