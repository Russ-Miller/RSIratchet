brief: >-
  Letting an agent fail on a real task and then curating only the knowledge it
  asked for is proposed as a cheaper route to enterprise context than
  documenting a domain up front. The paper is a methodology paper with a
  worked demonstration, not a controlled evaluation.


  Demand-Driven Context (DDC) runs a 9-step cycle: sandbox the problem, let
  the agent attempt it with current context, have the agent emit an
  information checklist, have a human expert answer only those items,
  re-attempt, validate, and graduate typed markdown entities with YAML
  frontmatter into a version-controlled knowledge base. The demonstration is a
  synthetic retail e-commerce order fulfillment domain with an SRE incident
  management agent, starting from an empty knowledge base.


  Across 9 cycles, new entities per cycle fell from 8 to 2, reused entities
  rose from 0 to 6, and the reuse ratio went from 0.0 to 0.75, ending in a
  base of 46 entities. 4 of the first 6 cycles needed rejected attempts and
  correction loops; the last 3 needed none. Total curation time was 270
  minutes (4.5 hours), averaging 30 minutes per cycle.


  Evidence is a single uncontrolled case study. No baseline against top-down
  documentation or an automated method such as ACE, 1 domain, 1 agent role,
  synthetic data, no model named, no statistical test, and the authors call
  the trend suggestive only. The 20–30 cycle convergence claim and the scaling
  architecture with PR governance are hypothesis and design, untested. Cycle 6
  does document the agent fabricating a nonexistent "data replication
  pipeline", which is the failure mode the method targets.


  Treat this as a framing and a process template to try, not as evidence the
  approach beats alternatives.
