  right answer, not on whether they report honestly when a tool fails to
  supply one. We isolate this post-failure decision with a benchmark of
  1,024 items spanning 16 internal-system domains and eight tool-failure
  types, in which a tool call is enforced and the returned payload is
  guaranteed to be unusable. Under a deployment-style system prompt, 14.10%
