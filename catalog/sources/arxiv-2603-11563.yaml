brief: >-
  Training a vision-language planner on visual observations alone before ever
  showing it action history reduces the model's tendency to repeat past
  actions instead of reading the current scene. The claim is that joint SFT on
  full trajectory context teaches textual shortcuts, and that standard DPO,
  being purely relative, pushes probability mass off the expert path.


  SVLL is a 3-stage recipe on Qwen2.5-VL-7B: history-blocked SFT, then
  full-context SFT, then LoRA alignment with Bias-DPO, which adds a weighted
  chosen margin, an auxiliary SFT term, and a threshold-triggered unlikelihood
  penalty. Evaluation is on an AI2-THOR trajectory test set plus 9 real-world
  tasks on a 6-DoF arm.


  SVLL-Stage 3 reaches 78.35% success rate, 68.53% SPL, 89.64% valid action
  rate, 7.22% loop rate, 26.34% constraint violation rate, against
  Gemini-2.0-flash at 58.76% SR / 31.55% CVR, GPT-4o at 48.45% / 40.32%, and
  RoboBrain2.0-32B at 27.84% / 52.61%. Real-world zero-shot: 55.56% SR and
  4.35% CVR versus 22.22% and 10.94% for the 32B baseline.


  The staging claim is isolated by a "Direct Stage 2" ablation skipping Stage
  1 (68.04% SR, 10.31% LR). B-DPO is only compared against Stage 2 SFT, not
  against standard DPO at matched budget, so the specific loss design is
  argued rather than measured. 1 backbone, 1 simulator, 9 real tasks, 5 of 9
  completed.


  Treat the staging result as the transferable part; the Bias-DPO components
  remain unseparated.
