summary: >-
  Large language models (LLMs) remain unreliable for high-stakes claim
  verification due to hallucinations and shallow reasoning. While
  retrieval-augmented generation (RAG) and multi-agent debate (MAD) address
  this, they are limited by one-pass retrieval and unstructured debate
  dynamics. We propose a courtroom-style multi-agent framework, PROClaim,
  that reformulates verification as a structured, adversarial deliberation.
  Our approach integrates specialized roles (e.g., Plaintiff, Defense,
  Judge) with Progressive RAG (P-RAG) to dynamically expand and refine the
  evidence pool during the debate. Fur
