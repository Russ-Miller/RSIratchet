brief: >-
  Multimodal models often answer figure-dependent materials science questions
  correctly without actually reading the figure, falling back on memorized
  domain knowledge instead.


  MaterialFigBench is 137 free-response problems adapted from standard
  materials science textbooks, each requiring interpretation of a figure such
  as a phase diagram, stress-strain curve, Arrhenius plot, diffraction
  pattern, or microstructural schematic. Topics span crystal structures,
  mechanical properties, diffusion, phase diagrams, phase transformations, and
  electronic properties. Because reading numbers off an image is inherently
  imprecise, expert-defined answer ranges are supplied where appropriate.
  Several ChatGPT and GPT models accessed through OpenAI APIs were scored and
  broken down by category and model version.


  Overall accuracy rises with newer model versions, but the authors report
  continued failure on genuine visual understanding and quantitative figure
  interpretation, with specific weaknesses in numerical precision and
  significant-digit handling. No per-model or per-category accuracy figures
  are given in the source text, so the size of the improvement cannot be
  judged here.


  The claim that correct answers come from memorization rather than image
  reading is stated as an observation from case analysis rather than from a
  reported controlled test such as figure removal or perturbation. Only OpenAI
  models were evaluated, so the conclusion does not extend to other families,
  and the 137 items are textbook-derived rather than drawn from research
  literature.


  Use it as a diagnostic set if you care whether a model is reading scientific
  figures or recalling them.
