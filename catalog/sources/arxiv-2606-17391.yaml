brief: >-
  Frontier models hit a hard ceiling on long-horizon narrative continuation,
  and extra reasoning budget does not move it. Across 21 systems, every
  closed-frontier and reasoning-tier model clusters at plot-beat F1 in the
  band [0.78, 0.81] at h = 50 and loses about -0.20 F1 going from h = 10 to h
  = 200.


  NarrativeWorldBench scores 9 narrative-structure metrics on 1,204 serialized
  audio-drama continuation instances from 38 openly licensed series, at
  horizons h in {10, 20, 50, 100, 200}, with intervening episodes held out so
  only a structured scene plan is given. The authors also train N-VSSM, a
  Mamba-2 8B decoder with a 256-dimensional per-scene narrative latent.


  N-VSSM holds plot-beat F1 >= 0.84 at every horizon (0.86 at h = 50 vs 0.81
  for GPT-5) at 17 H100-sec/episode against ~72 for GPT-5. A learned Cultural
  Transfer Function raises native-speaker cultural fidelity by +0.20 to +0.23
  Likert points across 4 Indic languages.


  Evidence is measured: 5 seeds with 95% CIs, Welch's t-tests with Bonferroni
  correction, ablations isolating the latent posterior (-0.11 F1 at h = 200)
  and the Mamba-2 backbone (-0.06), and a judge ensemble at Cohen's kappa =
  0.78 replicated on an N-VSSM-disjoint judge subset.


  Boundaries: judge-model overlap with evaluated systems, English-centric
  pretraining, 4 Indic languages only, and a writer study with n = 12 (240
  trials, 71% preference) against a single comparator.


  If you assume scale fixes long-arc coherence, this is a counterexample with
  an architectural alternative attached.
