summary: Long-form serialized audio drama, with arcs that run for 200 to 800
  episodes, is a major creative medium and a setting where frontier large
  language models (LLMs) fail. We benchmark 21 models, spanning classical,
  fine-tuned, open-frontier, closed-frontier, and reasoning tiers, on a
  uniform set of structural narrative metrics. All closed-frontier systems
  saturate at a plot-beat F1 in the band [0.78, 0.81] and collapse by about
  -0.20 F1 at horizon h=200. We introduce NarrativeWorldBench, an open
  benchmark of nine narrative-structure metrics evaluated across horizons h in
  {10, 20, 50, 100, 200},
