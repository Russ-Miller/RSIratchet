brief: >-
  For self-evolving agents with an external memory bank, how memories are
  extracted matters more than how they are managed. UMEM trains a small
  "Mem-Optimizer" with GRPO to jointly emit a memory entry and a management
  operation, rewarded by the marginal utility of that memory across a cluster
  of 3 semantically similar queries rather than on the originating query
  alone.


  Training data is ~2,000 MMLU queries; policies are Llama-3.2-1B-Instruct and
  Qwen3-4B-Instruct, with Qwen3-8B as the frozen executor during training.
  Evaluation spans AIME, GPQA-Diamond, HLE, HotpotQA and ALFWorld under a
  streaming no-reset protocol, with GPT-5.1, Qwen3-8B-Thinking and
  Gemini-2.5-Flash as unseen executors.


  UMEM-Qwen3-4B with GPT-5.1 reaches 82.84 ALFWorld success rate and 57.74
  average, versus 54.71 for Memp and 49.49 for ReMem. Ablations show removing
  extraction optimization costs 4.7 points on average, against 0.73 for
  removing management optimization; dropping neighborhood modeling takes
  GPT-5.1 AIME from 51.67 to 41.67, and N=1 or N=5 both underperform N=3.


  The component attribution is measured via gradient masking and
  neighborhood-size sweeps across 2 executors, which isolates the extraction
  effect reasonably well. There is no matched-compute baseline for the extra
  rollouts the neighborhood reward requires, training uses 1 source dataset,
  and gains are uneven: GPQA and HLE move by under 2 points in several
  settings, and the 1B policy loses on ALFWorld with the Qwen3-8B executor.


  If you are building memory agents, the reward signal on extraction, not the
  management policy, is where to spend effort.
