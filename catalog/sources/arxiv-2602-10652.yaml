summary: >-
  Self-evolving memory serves as the trainable parameters for Large Language
  Models (LLMs)-based agents, where extraction (distilling insights from
  experience) and management (updating the memory bank) must be tightly
  coordinated. Existing methods predominately optimize memory management
  while treating memory extraction as a static process, resulting in poor
  generalization, where agents accumulate instance-specific noise rather
  than robust memories. To address this, we propose Unified Memory
  Extraction and Management (UMEM), a self-evolving agent framework that
  jointly optimizes a Large Language
