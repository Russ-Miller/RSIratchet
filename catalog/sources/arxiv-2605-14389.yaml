summary: "Language models have emerged as highly capable reasoners, yet their
  performance in time series forecasting remains uneven across domains and
  levels of contextual grounding. This is primarily due to their suboptimal
  time series reasoning and numerical modeling capabilities. To tackle this,
  we introduce Nexus, a multimodal forecasting framework that bridges
  qualitative event reasoning with structural numerical modeling through
  principled statistical synthesis. Nexus follows three structured stages: (1)
  Temporal profiling and anchor generation, which distills the multimodal
  history into a timesta"
