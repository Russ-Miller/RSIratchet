brief: "Letting a language model reason over dated event text helps
  forecasting only when its output is held to a numerical prior and weighted
  by its own backtest error; combined that way, it beats time-series
  foundation models. Nexus runs 3 stages: an LLM builds a causal-temporal
  profile and commits a text-free anchor (a TSFM or a sandboxed forecasting
  script), 2 decoupled streams produce macro (shape-first) and micro
  (stepwise) contextual trajectories, and closed-form Gaussian updating
  reconciles them using empirical error covariances. Backbones are
  Gemini-3.1-Pro and Claude-Sonnet-4.5; benchmarks are Leaf (windows
  postdating the knowledge cutoff), GIFT-CTX (245 instances), and GIFT-Eval.
  On Leaf, Weather MAE drops 25% versus MoiraiAgent and 36% versus the same
  backbone under the benchmark prompt; Electricity MAPE drops 14% versus
  Chronos-2. GIFT-CTX wNMAE is 0.052 against 0.193 for Chronos-2. GIFT-Eval
  aggregate is 0.513 versus 0.537 for TimesFM-3.0. Component ablations isolate
  the effect: anchor, macro, and micro alone are all worse, and removing
  calibration raises Weather MAE by 4.4%. Error-correlation analysis shows
  TSFMs err together (0.86-0.94) while the contextual streams correlate
  0.31-0.51 with them. Gains are small on equities and commodities, where
  errors stay correlated (0.78-0.88); reasoning quality is judged by LLMs, and
  GIFT-Eval series predate the cutoff. Treat context-aware gains as real on
  physical domains, marginal on markets."
