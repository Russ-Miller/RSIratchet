brief: >-
  Frontier models solve only about half of competitive programming problems
  when the problem statement is in Ukrainian, suggesting that code generation
  ability measured in English does not transfer cleanly to a low-resource
  prompt language.


  UA-Code-Bench is 500 problems taken from the Eolymp platform, spread evenly
  across 5 difficulty levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  each submission was judged inside the Eolymp environment against hidden
  tests rather than by string or model-based matching.


  The best performers, OpenAI o3 and GPT-5, solved only half of the problems.
  The paper also breaks results down by difficulty level and reports solution
  uniqueness plus computational efficiency, measured as elapsed time and
  memory use of generated code.


  The correctness signal is well grounded: hidden-test execution on a real
  judge, not self-reported or LLM-graded. What is missing is a matched
  English-language control. Without the same 500 problems translated, the gap
  between Ukrainian-prompt difficulty and inherent problem difficulty is not
  isolated.


  Scope is 1 language, 1 platform, 1 output language, and one-shot prompting
  with no repeated sampling or agentic retry.


  Use it as an execution-verified hard benchmark, not yet as evidence of a
  language-specific penalty.
