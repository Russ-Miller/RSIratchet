brief: >-
  Competitive programming problems stated in Ukrainian stay hard for frontier
  models: the best of them solve about half.


  UA-Code-Bench draws 500 problems from the Eolymp platform, spread evenly
  across 5 difficulty levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  submissions were judged in the Eolymp environment against hidden tests
  rather than by string match or model grading.


  OpenAI o3 and GPT-5 lead and solve only half of the problems. The paper also
  breaks performance down by difficulty tier and reports solution uniqueness
  plus computational efficiency, measured as elapsed time and memory
  consumption of the generated code.


  The evidence is a measured pass/fail against hidden tests, which is the
  strongest available signal for code correctness, and the model set is broad.
  But the design does not isolate language as the cause: there is no matched
  English version of the same 500 problems, so the gap between Ukrainian
  prompting and general competitive programming difficulty is argued rather
  than measured.


  Only Python, only one-shot prompting, no repeated sampling or agentic
  scaffolding, no other low-resource languages.


  Treat this as a hard, contamination-resistant coding benchmark first and a
  Ukrainian-language test second.
