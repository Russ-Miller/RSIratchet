brief: >-
  Competitive programming problems stated in Ukrainian remain unsolved about
  half the time by the strongest reasoning models, so low-resource-language
  code generation is not a solved transfer case.


  UA-Code-Bench draws 500 problems from the Eolymp platform, evenly split
  across 5 complexity levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  submissions were judged inside the Eolymp environment against hidden tests
  rather than by string match or LLM grader.


  The top performers, OpenAI o3 and GPT-5, solve only half of the problems.
  The authors also break down accuracy by difficulty level and report solution
  uniqueness plus runtime and memory consumption of the generated code.


  The correctness signal is measured, not argued, and hidden-test execution is
  a stronger check than most translated benchmarks offer. What is missing is
  an isolation of language: no matched English version of the same 500
  problems is reported here, so the gap between Ukrainian difficulty and
  problem difficulty is not separated.


  Only Python, only one-shot prompting, no repeated sampling or pass@k, and no
  test-time budget comparison across models.


  Treat it as a hard execution-verified ceiling measurement for Ukrainian
  prompts, not as evidence about where the failure originates.
