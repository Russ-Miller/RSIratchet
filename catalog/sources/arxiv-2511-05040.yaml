brief: >-
  Competitive programming problems stated in Ukrainian stop the strongest
  current models at roughly half solved, which cuts against the assumption
  that code generation is largely language-agnostic once the task is formal.


  UA-Code-Bench collects 500 problems from the Eolymp platform, 100 at each of
  5 complexity levels from very easy to very hard. 13 proprietary and
  open-source models produced Python solutions from a one-shot prompt, and
  submissions were judged inside the Eolymp environment against hidden tests
  rather than by string or model-based matching.


  The top performers, OpenAI o3 and GPT-5, solved only half of the problems.
  The paper also breaks results out by difficulty level and reports solution
  uniqueness plus computational efficiency measured as elapsed time and memory
  consumption.


  The evidence is a measured pass rate against hidden judge tests, which is
  the right correctness signal, but the design does not isolate language as
  the cause: there is no matched English translation of the same 500 problems,
  so the gap between Ukrainian and English prompting is inferred rather than
  demonstrated. Single prompt format, single output language, single judge
  platform.


  If you are choosing a model for code tasks specified in a low-resource
  language, treat English code benchmarks as an upper bound rather than a
  prediction.
