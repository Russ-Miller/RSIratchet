brief: >-
  Competitive programming problems stated in Ukrainian defeat even the
  strongest reasoning models, which solve only about half of them.


  UA-Code-Bench draws 500 problems from the Eolymp platform, evenly split
  across 5 complexity levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  submissions were judged in the Eolymp environment against hidden tests
  rather than by model- or string-based scoring.


  The top performers, OpenAI o3 and GPT-5, solve only half the problems. The
  paper also breaks results down by difficulty level and reports solution
  uniqueness plus computational efficiency measured as elapsed time and memory
  consumption of the generated code.


  The correctness signal is measured, not argued, and hidden-test execution is
  a clean pass criterion. What is missing is a matched English-language
  control: without the same 500 problems presented in English, the gap between
  language difficulty and problem difficulty is not isolated, so the
  low-resource-language claim rests on inference rather than a paired
  comparison.


  Only Python, only one-shot prompting, no repeated sampling or agentic
  scaffolding, and no other low-resource language was tested.


  Use it as an execution-verified Ukrainian coding benchmark, but treat the
  language-specific attribution as open.
