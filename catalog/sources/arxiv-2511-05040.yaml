brief: >-
  Competitive programming stated in Ukrainian stops the strongest reasoning
  models at roughly half the problem set, so low-resource language framing
  remains a real constraint on code generation rather than a solved
  translation issue.


  UA-Code-Bench draws 500 problems from the Eolymp platform, spread evenly
  across 5 complexity levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  submissions were judged inside the Eolymp environment against hidden tests
  rather than by model- or string-based grading.


  Top performers, including OpenAI o3 and GPT-5, solved only half of the
  problems. The paper also breaks results out by difficulty level and reports
  solution uniqueness plus computational efficiency in elapsed time and memory
  consumption.


  Correctness is measured, not argued, and hidden-test execution is the
  strongest part of the design. What is absent is a matched English-language
  version of the same 500 problems, so the shortfall cannot be attributed to
  Ukrainian as opposed to problem difficulty itself; no per-model figures
  appear in the text available here.


  The benchmark covers Python only, one-shot prompting only, and competitive
  programming rather than software engineering tasks.


  Use it as an execution-verified probe of non-English coding, and read the
  headline half-solved rate as a joint statement about language and
  difficulty.
