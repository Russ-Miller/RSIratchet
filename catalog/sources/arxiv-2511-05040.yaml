brief: >-
  Competitive programming problems stated in Ukrainian remain unsolved by
  frontier models about half the time, even for the strongest reasoning
  systems.


  UA-Code-Bench is an open-source benchmark of 500 problems taken from the
  Eolymp platform, spread evenly across 5 complexity levels from very easy to
  very hard. 13 proprietary and open-source models were prompted one-shot to
  produce Python solutions, which were submitted to the Eolymp environment and
  judged against hidden tests rather than by string match or model grading.


  The top performers, OpenAI o3 and GPT-5, solve only half of the problems.
  The paper also breaks results down by difficulty level and reports solution
  uniqueness plus computational efficiency, measured as elapsed time and
  memory consumption of generated code.


  The evidence is measured execution against hidden tests, which is a strong
  correctness signal and avoids translation artifacts since the problems are
  natively Ukrainian. The abstract gives no per-model or per-level figures,
  and there is no matched English-language control set, so the share of
  failure attributable to the language rather than to problem difficulty is
  not isolated.


  Scope is 1 platform, 1 target language, Python only, one-shot prompting, no
  repeated sampling or agentic scaffolding.


  Use it if you need a non-English, execution-verified coding eval; do not
  read it yet as a clean measure of a language penalty.
