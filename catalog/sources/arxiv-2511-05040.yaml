brief: >-
  Competitive programming problems stated in Ukrainian stop frontier models at
  roughly half correct, well below their English-language code performance
  profile.


  UA-Code-Bench draws 500 problems from the Eolymp platform, evenly split
  across 5 complexity levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  submissions were judged in the Eolymp environment against hidden tests
  rather than by string match or model grading.


  The strongest models, OpenAI o3 and GPT-5, solved only half of the problems.
  The paper also breaks results down by difficulty level and reports solution
  uniqueness plus computational efficiency, measured as elapsed time and
  memory consumption of generated code.


  The pass rates are measured, not argued, and hidden-test execution is a
  harder criterion than most generation benchmarks use. But there is no
  matched English version of the same 500 problems, so the gap attributed to
  Ukrainian is not isolated from the intrinsic difficulty of Eolymp problems;
  the abstract also gives no per-model figures beyond the top 2.


  Only Python, only one-shot prompting, no repeated sampling or agentic
  iteration, and no test of whether translating the statement to English
  recovers performance.


  Treat it as evidence that low-resource-language framing costs real accuracy
  on executable tasks, with the size of that cost still unquantified.
