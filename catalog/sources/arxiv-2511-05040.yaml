brief: >-
  Competitive programming problems stated in Ukrainian defeat even the
  strongest current models: the best solve about half.


  UA-Code-Bench is 500 problems from the Eolymp platform, 100 at each of 5
  difficulty levels from very easy to very hard. 13 proprietary and
  open-source models were prompted one-shot to produce Python solutions, which
  were submitted to the Eolymp judge and checked against hidden tests rather
  than scored by a model or by string match.


  The top performers, OpenAI o3 and GPT-5, solve only half the problems. The
  paper also breaks results down by difficulty level and reports solution
  uniqueness plus runtime and memory consumption of accepted programs.


  The correctness signal is measured, not argued, and hidden-test execution is
  the strongest available form of verification for this task. What is missing
  is an isolation of the language factor: no matched English-translation
  condition is described, so the gap between these scores and typical English
  code benchmarks cannot be attributed to Ukrainian specifically rather than
  to problem difficulty or source distribution.


  Boundaries: 1 language, 1 target language (Python), 1 prompt format, no
  multi-sample or self-repair setting.


  If you treat code generation as near-saturated, this is a cheap,
  execution-verified counterexample in a low-resource language.
