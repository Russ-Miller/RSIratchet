summary: >-
  Evaluating the real capabilities of large language models in low-resource
  languages still represents a challenge, as many existing benchmarks focus
  on widespread tasks translated from English or evaluate only simple
  language understanding. This paper introduces UA-Code-Bench, a new
  open-source benchmark established for a thorough evaluation of language
  models'code generation and competitive programming problem-solving
  abilities in Ukrainian. The benchmark comprises 500 problems from the
