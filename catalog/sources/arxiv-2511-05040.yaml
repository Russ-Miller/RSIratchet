brief: >-
  Competitive programming problems stated in Ukrainian defeat the best current
  models about half the time, which is a sharper gap than typical
  translated-benchmark results suggest.


  UA-Code-Bench collects 500 problems from the Eolymp platform, evenly spread
  across 5 complexity levels from very easy to very hard. 13 proprietary and
  open-source models generated Python solutions from a one-shot prompt, and
  submissions were judged inside the Eolymp environment against hidden tests
  rather than by a model or by string matching.


  Top performers, including OpenAI o3 and GPT-5, solved only half the
  problems. The paper also reports results broken down by difficulty level and
  measures solution uniqueness plus computational efficiency via elapsed time
  and memory consumption of the generated code.


  The correctness signal is measured, not argued, and hidden-test execution
  avoids grader leniency. What the abstract does not report is a matched
  English-language control: without the same problems in English, the share of
  failure attributable to Ukrainian specifically versus raw problem difficulty
  is not isolated. No per-model figures appear in the abstract.


  Scope is 1 language, 1 platform, 1 target language (Python), and a single
  prompt format. Treat it as a hard execution-verified set for checking
  whether your model's reasoning survives a low-resource problem statement.
