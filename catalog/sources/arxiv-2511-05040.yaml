brief: >-
  The best available models solve only about half of Ukrainian-language
  competitive programming problems, so prompting in a low-resource language
  remains a real constraint on code generation rather than a cosmetic one.


  UA-Code-Bench draws 500 problems from the Eolymp platform, evenly split
  across 5 difficulty levels from very easy to very hard. 13 proprietary and
  open-source models were asked to produce Python solutions from a one-shot
  prompt, and submissions were judged inside Eolymp against hidden tests
  rather than by string or model matching.


  Top performers, including OpenAI o3 and GPT-5, solved only half of the
  problems. The paper also breaks results down by difficulty level and reports
  solution uniqueness plus computational efficiency, measured by elapsed time
  and memory consumption of generated code.


  The correctness signal is measured, not argued, and hidden-test execution
  avoids the usual leniency of text-based grading. What is missing is a
  matched English-language control: without the same 500 problems presented in
  English, the gap attributable to Ukrainian specifically is not isolated from
  the intrinsic difficulty of the problems.


  Scope is 1 platform, 1 target language, Python only, one-shot prompting,
  with no multi-sample or agentic setting tested.


  Treat it as a hard execution-verified benchmark for multilingual coding, not
  yet as evidence of how much the language itself costs.
