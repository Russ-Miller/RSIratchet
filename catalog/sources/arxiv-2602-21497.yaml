summary: 'Recent large vision-language models (LVLMs) have demonstrated
  impressive reasoning ability by generating long chain-of-thought (CoT)
  responses. However, CoT reasoning in multimodal contexts is highly
  vulnerable to visual hallucination propagation: once an intermediate
  reasoning step becomes inconsistent with the visual evidence, subsequent
  steps-even if logically valid-can still lead to incorrect final answers.
