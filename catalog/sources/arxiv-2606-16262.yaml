brief: >-
  Frontier models write UX critiques that all help a downstream repair agent,
  but the amount of help they give differs by a small and surface-dependent
  margin rather than by a clean ranking. UXBench measures this by forcing a
  judge model to explore a running interface before reporting, then handing
  its report to a fixed repair agent.


  The suite is 41 local-first HTML/CSS/JS fixtures (11 real-product anchors,
  30 independently authored synthetic siblings) across 10 surface families
  from landing pages to chatbots and mobile micro-UIs. A coverage gate rejects
  premature termination, pushing the agent back to unexercised controls.
  Claude Code performs the repair under brand and interaction invariants;
  GPT-5.4-Mini scores the result on 7 rubric dimensions, 1–5.


  All 8 models improved on the 3.27 baseline. GPT-5.4 gained +0.22,
  Gemini-3.1-Pro +0.14, an 0.08-point spread. Per-dimension leaders diverge:
  GPT-5.4 on error recovery, Kimi-K2.5 on feedback and trust, Qwen-3.6-Plus on
  flow and scanability. GPT-5.4, Kimi-K2.5 and GLM-5.1 each average about 0.57
  pairwise win rate, with many head-to-head cells near 0.5.


  Repair agent and scorer are held fixed, so variation is attributable to the
  reports. The scoring judge is an LLM from one of the evaluated families;
  blind human review by 6 UX-experienced reviewers backs the coarse ordering
  but groups GPT-5.4 and Claude-Sonnet-4.6 together instead.


  Static fixtures only, 1 repair pipeline, no live sites or personalization.
  Treat UX-judge leaderboards as surface-conditioned, not global.
