brief: >-
  Frontier models all produce UX critiques that let a downstream repair agent
  improve an interface, but how much depends on the judge, and the spread
  between the best and worst is small. UXBench holds the fixtures, repair
  agent, and scorer fixed so the only variable is the report.


  The benchmark is 41 local-first runnable HTML/CSS/JS fixtures (11
  real-product anchors, 30 independently authored synthetic siblings) across
  10 surface families from landing pages to chatbots and mobile micro-UIs.
  Each of 8 judge models runs a coverage-gated browser trajectory that blocks
  premature termination, then emits an evidence-grounded report over 7 rubric
  dimensions; Claude Code performs the repair and GPT-5.4-Mini scores the
  result on a 1-5 scale.


  All models lift the 3.27 baseline. GPT-5.4 gains +0.22, Gemini-3.1-Pro
  +0.14, an 0.08-point spread. Rubric-level profiles diverge: GPT-5.4 leads on
  error recovery, Kimi-K2.5 on feedback and trust, Sonnet-4.6 on goal clarity,
  Qwen-3.6-Plus on flow and scanability. Pairwise win rates put GPT-5.4,
  Kimi-K2.5 and GLM-5.1 in a top cluster at about 0.57, with many head-to-head
  cells near 0.5.


  The paired design isolates report quality well. The automated scorer is a
  single blinded LLM, and the blind human study used only 6 reviewers; it
  backed the coarse ranking but placed GPT-5.4 and Sonnet-4.6 in a shared top
  tier rather than a strict order.


  Static fixtures exclude personalization, backends, and live drift, and
  actionability is defined relative to 1 repair agent and 1 scorer.


  Treat adjacent ranks here as noise and pick a UX judge by surface family
  instead.
