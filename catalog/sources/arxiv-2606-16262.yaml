brief: >-
  Frontier models all produce UX critiques that help a downstream repair agent
  improve an interface, but the differences between them are small in
  aggregate and only separate clearly at the fixture and surface level.


  UXBench builds 41 local-first runnable web fixtures (11 real-product
  anchors, 30 independently authored synthetic siblings) across 10
  product-surface families, from landing and pricing pages to dashboards,
  chatbot interfaces, and mobile micro-UIs. Each of 8 judge models drives the
  same coverage-gated browser exploration loop, which rejects premature
  termination until salient controls have been exercised, then emits an
  evidence-grounded report over 7 rubric dimensions. Claude Code acts as a
  fixed repair agent; GPT-5.4-Mini scores the repaired fixture on a 1–5 scale,
  blinded to report authorship.


  All models improved the unrepaired baseline of 3.27. GPT-5.4 gained the most
  (+0.22), Gemini-3.1-Pro the least (+0.14), an 0.08-point spread.
  Per-dimension leaders differ: GPT-5.4 on error recovery, Kimi-K2.5 on
  feedback and trust, Claude-Sonnet-4.6 on goal-state clarity, Qwen-3.6-Plus
  on flow and scanability. GPT-5.4, Kimi-K2.5 and GLM-5.1 each average about
  0.57 pairwise win rate, with many head-to-head cells near 0.5.


  The repair agent, scorer, and fixtures are held fixed, so variation is
  attributable to the reports. Significance tests and bootstrap intervals are
  reported in an appendix. A blind study with 6 UX-experienced reviewers
  broadly agreed but placed GPT-5.4 and Claude-Sonnet-4.6 in a top cluster,
  and some models strong on automated lift did not transfer.


  Fixtures are static and backend-free, the scorer is itself an LLM, and the
  human study is small. Treat the aggregate leaderboard as unreliable and read
  surface-level results instead.
