brief: >-
  Frontier models all produce UX critiques that a fixed repair agent can act
  on, but the differences between them are small in aggregate and inconsistent
  across interface types. UXBench measures this by holding everything
  downstream constant: 41 local-first runnable HTML/CSS/JS fixtures (11
  real-product anchors, 30 synthetic re-skinned siblings) across 10 surface
  families, coverage-gated browser exploration that rejects early stopping
  until controls have been exercised, an evidence-grounded report over 7
  rubric dimensions, then repair by Claude Code and scoring by GPT-5.4-Mini on
  a 1–5 scale.


  Across 8 models, repair lift over a 3.27 baseline ranged from +0.22
  (GPT-5.4) to +0.14 (Gemini-3.1-Pro), a 0.08-point spread. Per-dimension
  signatures diverged: GPT-5.4 led error recovery, Kimi-K2.5 feedback and
  trust, Claude-Sonnet-4.6 goal-state clarity, Qwen-3.6-Plus flow and
  scanability. Pairwise win rates put GPT-5.4, Kimi-K2.5 and GLM-5.1 in a top
  cluster near 0.57, with many head-to-head cells near 0.5.


  The design isolates report quality, since fixtures, repair agent and scorer
  are fixed and the scorer is blinded to report authorship. A blind study with
  6 UX/front-end reviewers broadly agreed but sharpened the top group to
  GPT-5.4 and Claude-Sonnet-4.6, with some automated-lift leaders not
  translating into perceived quality.


  Boundaries: static fixtures, 1 repair agent, 1 scorer, and a small expert
  panel; no live-site, personalization, or backend-failure conditions.


  Treat aggregate UX-judge rankings as unreliable and check surface-level and
  human-rated results before picking a model.
