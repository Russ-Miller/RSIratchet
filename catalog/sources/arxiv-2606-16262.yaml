brief: >-
  Frontier models all produce UX critiques that a downstream repair agent can
  act on, but the spread between the best and worst judge is small, and the
  ranking flips depending on the kind of interface.


  UXBench pins 41 runnable local-first web fixtures (11 real-product anchors,
  30 independently authored synthetic siblings) across 10 surface families,
  from landing pages to dashboards, chatbots and mobile micro-UIs. 8 judge
  models drive a coverage-gated browser trajectory that rejects early
  termination until salient controls have been exercised, then emit an
  evidence-grounded report over 7 rubric dimensions; a fixed Claude Code
  repair agent edits the fixture and a fixed blinded scorer (GPT-5.4-Mini)
  rates the result on a 1-5 scale.


  All models improved over the unrepaired baseline of 3.27. GPT-5.4 led with
  +0.22 lift, Gemini-3.1-Pro trailed at +0.14, an 0.08-point spread.
  Per-dimension gains diverge: GPT-5.4 strongest on error recovery, Kimi-K2.5
  on feedback and trust, Qwen-3.6-Plus on flow and scanability. GPT-5.4,
  Kimi-K2.5 and GLM-5.1 each average about 0.57 pairwise win rate, with many
  head-to-head cells near 0.5.


  The paired design holds fixtures, repair agent and scorer constant, so
  variation is attributable to the reports. A blind study with 6 expert
  reviewers broadly agreed but placed GPT-5.4 and Claude-Sonnet-4.6 in one top
  cluster, so automated lift does not fully predict perceived quality.


  Fixtures are static, with no personalization or backend failure, and the
  human panel is small.


  Treat UX-judge leaderboards as surface-specific, not global.
