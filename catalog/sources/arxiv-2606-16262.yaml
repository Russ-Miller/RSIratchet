brief: >-
  Frontier models all write UX critiques that help a downstream repair agent
  improve an interface, but the amount of help differs by model and the
  ordering is not stable across interface types. UXBench measures this by
  holding the repair step fixed: 8 judge models (GPT-5.4, GPT-5.4-Mini,
  GPT-5.4-Nano, Claude-Sonnet-4.6, Kimi-K2.5, GLM-5.1, Qwen-3.6-Plus,
  Gemini-3.1-Pro) explore 41 local-first static web fixtures (11 real anchors,
  30 synthetic re-skinned siblings) across 10 product-surface families under a
  coverage gate that blocks early termination, then emit an evidence-linked
  report over 7 rubric dimensions; Claude Code edits the fixture from that
  report and a fixed blinded scorer (GPT-5.4-Mini) rates the result.


  From a common baseline of 3.27 on a 1–5 rubric, repair lift ranges from
  +0.22 (GPT-5.4) to +0.14 (Gemini-3.1-Pro), a 0.08-point spread.
  Per-dimension strengths diverge, and category win rates reorder the
  leaderboard; GPT-5.4, Kimi-K2.5 and GLM-5.1 each average about 0.57 pairwise
  win rate.


  The paired design isolates the report as the only varying factor, and 6 UX
  or front-end reviewers blind-rated repaired pages, broadly agreeing but
  collapsing the top into a GPT-5.4/Claude-Sonnet-4.6 cluster. The absolute
  spread is small, the fixtures are static and backend-free, and actionability
  is defined relative to 1 repair agent and 1 scorer.


  Treat model choice for UX critique as surface-dependent, not settled by an
  aggregate score.
