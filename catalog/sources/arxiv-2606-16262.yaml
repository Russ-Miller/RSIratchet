brief: >-
  Frontier models all produce UX critiques that a downstream repair agent can
  act on, but the differences between them are small in aggregate and reorder
  completely by product surface. UXBench treats UX judging as
  report-conditioned repair: a judge model explores a runnable interface,
  writes an evidence-grounded report over 7 rubric dimensions, and a fixed
  Claude Code repair agent edits the fixture from that report.


  The suite is 41 local-first HTML/CSS/JS fixtures, 11 real-product anchors
  and 30 synthetic siblings, across 10 surface families from landing pages to
  chatbots and mobile micro-UIs, with a coverage gate that rejects premature
  stopping. 8 models were run, scored by GPT-5.4-Mini blinded to report
  authorship, plus a blind review by 6 UX or front-end practitioners.


  All models improved on the unrepaired baseline of 3.27. GPT-5.4 gained the
  most (+0.22), Gemini-3.1-Pro the least (+0.14), a 0.08-point spread on a 1-5
  scale. Per-dimension leaders differ: Kimi-K2.5 on feedback and trust, Sonnet
  4.6 on goal-state clarity, Qwen-3.6-Plus on flow and scanability. GPT-5.4,
  Kimi-K2.5 and GLM-5.1 each average about 0.57 pairwise win rate.


  Fixtures, repair agent and scorer are held fixed, so variation is
  attributable to the reports; site-paired tests and bootstrap intervals are
  relegated to an appendix. The human study backs the coarse ordering but
  collapses it into a GPT-5.4 and Sonnet-4.6 top cluster, and some
  automated-lift leaders do not carry over.


  Static fixtures exclude personalization, backend failures and live drift,
  and 1 repair pipeline stands in for all developer workflows. Treat UX-judge
  model choice as surface-specific rather than settled by a leaderboard.
