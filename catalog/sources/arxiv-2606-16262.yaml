brief: >-
  Frontier models all produce UX critiques that a fixed repair agent can act
  on, but the differences between them are small in aggregate and inconsistent
  across interfaces. UXBench frames UX judging as report-conditioned repair:
  41 local-first runnable HTML/CSS/JS fixtures (11 real-product anchors, 30
  synthetic re-skinned siblings) across 10 surface families, a coverage-gated
  browser loop that blocks early termination until controls have been
  exercised, then an evidence-grounded report over 7 rubric dimensions, fed to
  Claude Code as a fixed repair agent and scored by GPT-5.4-Mini on a 1–5
  scale.


  Across 8 models, repair lift over the unrepaired baseline of 3.27 ranged
  from +0.22 (GPT-5.4) to +0.14 (Gemini-3.1-Pro), an 0.08-point spread. Rubric
  signatures diverge: GPT-5.4 leads on error recovery, Kimi-K2.5 on feedback
  and trust, Claude-Sonnet-4.6 on goal-state clarity, Qwen-3.6-Plus on flow
  and scanability. Pairwise win rates show a top cluster around 0.57 rather
  than a strict ordering, and the per-category leader changes across all 10
  surfaces.


  The design holds fixtures, repair agent, and scorer constant, so variation
  is attributable to the reports; the authors cite site-paired significance
  tests and bootstrap intervals in an appendix. A blind study with 6 expert
  reviewers supports the coarse ranking but tightens the top group to GPT-5.4
  and Claude-Sonnet-4.6, and some automated leaders do not transfer.


  Fixtures are static, so personalization and backend failure modes are
  untested, and one repair pipeline defines actionability. Treat aggregate
  UX-judge rankings as unreliable at adjacent ranks; pick per surface.
