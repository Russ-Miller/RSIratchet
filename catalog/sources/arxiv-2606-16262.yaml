summary: Large language models (LLMs) are increasingly deployed as UX judges
  that inspect interfaces, diagnose usability problems, and propose repairs.
  Yet no controlled benchmark measures whether the resulting critiques are
  reliable and actionable across heterogeneous product surfaces. We introduce
  UXBench, a benchmark for evaluating LLMs as interaction-grounded UX judges.
  UXBench comprises local-first runnable web fixtures spanning ten
  product-surface families, paired with coverage-gated browser exploration
  that forces models to collect interaction evidence before reporting. Each
