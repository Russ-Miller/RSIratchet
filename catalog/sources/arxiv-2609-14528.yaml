summary: >-
  Multi-Hop Knowledge Graph Question Answering (KGQA) tasks require models
  to assemble relational evidence along paths in a KG to answer
  natural-language questions. However, existing KGQA systems typically focus
  on predicting the final answer without explicitly modeling or validating
  the intermediate reasoning steps, obscuring whether the correct answers
  arise from faithful multi-hop reasoning. To address this limitation, we
  re-frame multi-hop KGQA as a question-conditioned graph navigation
