summary: >-
  Although multimodal large language models (MLLMs) have advanced industrial
  anomaly detection toward a zero-shot paradigm, they still tend to produce
  high-confidence yet unreliable decisions in fine-grained and structurally
  complex industrial scenarios, and lack effective self-corrective
  mechanisms. To address this issue, we propose M3-AD, a unified
  reflection-aware multimodal framework for industrial anomaly detection.
