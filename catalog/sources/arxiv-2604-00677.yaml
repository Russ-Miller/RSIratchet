brief: >-
  Continual-learning methods that stop forgetting in video LLMs do so by
  over-specializing: the ones with the best backward-transfer scores lose the
  most general video understanding, and plain LoRA fine-tuning beats all of
  them on unseen benchmarks.


  CL-VISTA assembles 8 tasks spanning perception (counting, spatial), 7
  domain-understanding areas (traffic, movie, GUI, science, sports) and
  temporal reasoning, trained sequentially on Video-LLaVA-7B and
  VideoLLaMA2-7B with 10 CL methods, scored by Qwen3-30A3B-Instruct as judge,
  plus 5 held-out benchmarks (MMVU, MVBench, LongVideoBench, MMBench-Video,
  NExTQA) and timing/storage protocols.


  MR-LoRA reaches BWT 0.02 and DISCO -0.85 against LoRA-FT's -11.09, but on
  general video understanding they fall 4.94 and 5.98 points below LoRA-FT's
  43.90 average, with NExTQA dropping 15.98 and 21.12. RegLoRA and HiDe are
  worse on both axes (BWT -25.41 and -13.91; HiDe -16.46 average). DISCO costs
  nearly 3x baseline inference time; RegLoRA and OLoRA add about 4 hours per
  task.


  The trade-off is measured, not argued, with a common task order, identical
  hyperparameters from original papers, and replication on a second backbone
  (MR-LoRA BWT -0.03, DISCO -1.23). The authors built the benchmark they
  evaluate on; the held-out suite is independent of training data. Only 1 task
  order, 1 epoch per task, 8 frames, and 7B models were tested, and the
  Video-LLaVA general-understanding averages are reported inconsistently in
  the text.


  If you were planning to adopt a routing or parameter-isolation CL method,
  check its general-benchmark scores before trusting its forgetting numbers.
