summary: "Intelligent agents should learn from their mistakes so that
  experience leads to continuous improvement. Yet today&#39;s agents recover
  from a mistake only temporarily: in-context reflections are easily forgotten
  across sessions and compete for limited context, while full-parameter
  fine-tuning is expensive and can interfere with existing capabilities. We
  introduce Self-Direction, a mechanism for agents to learn from mistakes that
  combines the benefits of temporary in-context retries and policy updates.
  When an agent fails a task, it reflects on its own trajectory in order to
  extract a lesson and immediately distills it into a lightweight low-rank
  adapter. By keeping the original weights frozen, Self-Direction prevents
  adapter training from overwriting base-model parameters while training
  additional parameters equivalent to ~0.02% of the base model&#39;s parameter
  count for each adapter. T…"
