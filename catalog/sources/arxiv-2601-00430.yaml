brief: >-
  On geopolitical event forecasting, 9 open-weight LLMs mostly fail to beat
  trivial frequency/recency/copy heuristics, and supervised GNNs beat them in
  every configuration tested. The data representation matters more than the
  model: encoding multi-entity facts natively instead of reifying them into
  binary edges improves accuracy and roughly halves inference time.


  The setup is htkgh-polecat, built from POLECAT events Jan 2018-Jul 2024,
  filtered from 2.23M facts to about 556K, with a stratified 1% test set of
  roughly 5.5k facts. Models span 4B-20B (Llama-3.1-8B-Instruct, Qwen3
  instruct and thinking variants, gemma-3-4b/12b-it,
  DeepSeek-R1-Distill-Qwen-7B, gpt-oss-20b), given the 100 most recent
  filtered facts as context.


  Best relation-prediction accuracies sit near 40.6% against a frequency
  heuristic at 43.3%. Thinking variants of Qwen3 gain +2.7-8.4% over
  non-thinking. HTKGH beats reified HTKG by +4.7% accuracy with ~56.8% less
  inference time, and by as much as 21.29% on set-based link prediction with
  ~57.3% less time. Shuffling entity names moves non-thinking models up to
  +1.4% and thinking models down to -2.3%; shuffling relations too produces
  erratic swings from +9.2% to -6.8%.


  Evidence is measured with matched context and heuristic baselines, and the
  shuffle variants isolate memorization from context use. Decomposed HTKG
  could not be run at all, exceeding the 32768-token context, so the
  structural comparison is only against reification. 1 domain, 1 database,
  small open models only; no frontier API models.


  If you are building TKG forecasting pipelines, spend effort on context
  retrieval and fact representation before model scale.
