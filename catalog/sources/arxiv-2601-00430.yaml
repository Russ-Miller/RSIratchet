brief: >-
  On geopolitical event forecasting over temporal knowledge graphs, 9 open
  LLMs rarely beat 3 trivial heuristics (frequency, recency, copy), while a
  supervised GNN beats them in every setting. The representation you feed the
  model matters more than the model: a hypergraph encoding of multi-entity
  facts outperforms the reified graph encoding of the same data at roughly
  half the inference cost.


  The setup is htkgh-polecat, built from the POLECAT event database (Jan
  2018-Jul 2024), filtered from 2.23M facts to about 556K, with a 1%
  stratified test set of about 5.5k facts. Models range 4B-20B, including
  Llama-3.1-8B-Instruct, Qwen3 thinking and non-thinking, gemma-3-4b/12b-it,
  DeepSeek-R1-Distill-Qwen-7B, and gpt-oss-20b, with 100 retrieved historical
  facts as context.


  Relation prediction accuracy peaks around 40.6% for gemma-3-12b-it against a
  frequency heuristic reaching 43.3%. Thinking variants of Qwen3 gain
  +2.7-8.4% over non-thinking. HTKGH beats reified HTKG by +4.7% accuracy with
  ~56.8% less inference time, and by as much as 21.29% on link prediction
  (Jaccard) with ~57.3% less time. Shuffling entities moves accuracy only
  slightly (up to +1.4% / -2.3%); shuffling relations too makes behavior
  erratic (+9.2% to -6.8%).


  The structure comparison is measured with information held constant at test
  time, though decomposed HTKG could not be run at all due to the 32768-token
  context limit, so one baseline is missing. Geopolitical domain only, 1
  dataset, models under 20B, no frontier closed models.


  If you are prompting LLMs over event graphs, spend effort on retrieval and
  fact encoding before model choice.
