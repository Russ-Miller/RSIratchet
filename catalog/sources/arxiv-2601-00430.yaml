brief: >-
  On geopolitical event forecasting, 9 open LLMs mostly fail to beat trivial
  heuristics like "most frequent relation in the retrieved history", while a
  supervised GNN beats them in every setting tested.


  The authors formalize hyper-relational temporal knowledge generalized
  hypergraphs (HTKGH), which allow more than 2 primary entities per fact, and
  build htkgh-polecat from the POLECAT event database (Jan 2018-Jul 2024),
  filtering 2.23M facts down to roughly 556K, with a stratified 1% test set of
  about 5.5k facts. Models span 4B to 20B, thinking and non-thinking, each
  given the 100 most recent filtered facts as context.


  In the regular variation, relation prediction accuracy tops out near 40.6%
  against a Frequency heuristic reaching 43.3%; LLMs beat heuristics only in a
  few filter settings. Thinking variants of Qwen3 gain +2.7-8.4% over
  non-thinking. GNNs sit around 48-49% regardless of filtering; LLMs close to
  within -6% under tight filters. HTKGH over reified HTKG gives +4.7% relation
  accuracy and about 56.8% less inference time, and up to 21.29% on link
  prediction (Jaccard) with about 57.3% less time.


  Evidence is measured with matched information in the HTKGH-vs-reified
  comparison. Shuffling entities moves accuracy only slightly (up to +1.4% /
  -2.3%), arguing against memorization; shuffling relations too produces
  erratic swings (+9.2% to -6.8%). Decomposed HTKG could not be run at all at
  32768-token context.


  Limits: 1 domain, 1 database, models 4B-20B only, no frontier API models, 1
  GNN family with an acknowledged bottleneck.


  If you plan to use LLMs for structured event forecasting, budget for
  retrieval quality and check your frequency baseline first.
