brief: >-
  LLMs forecasting geopolitical relations mostly fail to beat trivial
  frequency/recency heuristics, and supervised GNNs beat them in every tested
  setting. The representation you feed them matters more than the model: a
  hypergraph-style encoding of multi-actor events outperforms reified
  binary-edge encodings on both accuracy and latency.


  The setup is htkgh-polecat, built from POLECAT events Jan 2018-Jul 2024,
  filtered from 2.23M facts to ~556K, with a stratified 1% test set (~5.5k
  facts) and the 100 most recent filtered facts as context. 9 models from 4B
  to 20B were tested, including Llama-3.1-8B-Instruct, gemma-3-4b/12b-it,
  Qwen3 thinking and non-thinking variants, and gpt-oss-20b.


  LLMs beat the Frequency/Recency/Copy heuristics in few settings. Thinking
  modes add +2.7-8.4% over non-thinking Qwen3. GNNs stay flat across filters
  while LLMs close the gap to -6% under tight filtering. HTKGH beats reified
  HTKG by +4.7% on relation prediction with ~56.8% less inference time, and by
  as much as 21.29% on set-based link prediction with ~57.3% less time.


  Memorization is probed by shuffling: entity-only shuffles move accuracy by
  at most +1.4%/-2.3%, but shuffling relations too produces erratic swings
  from +9.2% to -6.8%.


  Evidence is measured, with heuristic baselines and matched-information
  reification, but 1 domain, 1 database, and decomposed HTKG could not run at
  all due to the 32768-token context limit. Treat retrieval and encoding, not
  model scale, as the lever here.
