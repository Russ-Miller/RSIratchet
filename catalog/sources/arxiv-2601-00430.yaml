brief: >-
  On geopolitical event forecasting, 9 open LLMs mostly fail to beat trivial
  frequency/recency/copy heuristics for relation prediction, while a
  supervised GNN beats them in every setting tested.


  The setup is htkgh-polecat, a dataset built from POLECAT events (Jan
  2018-Jul 2024), filtered from 2.23M to roughly 556K facts, using a proposed
  structure (HTKGH) that supports more than 2 primary entities per fact via
  generalized hypergraphs. Models span 4B to 20B, including
  Llama-3.1-8B-Instruct, Qwen3 thinking and non-thinking variants,
  gemma-3-4b/12b-it, DeepSeek-R1-Distill-Qwen-7B, and gpt-oss-20b, each given
  the 100 most recent filtered facts; the test set is a 1% stratified sample
  (~5.5k facts).


  Best regular-variation accuracies reach 40.6% (Qwen3-4B-Thinking) against a
  frequency heuristic at 43.3%. Thinking variants gain +2.7-8.4% over
  non-thinking Qwen3. HTKGH beats reified HTKG by +4.7% on relation prediction
  with ~56.8% less inference time, and by as much as 21.29% on link prediction
  (Jaccard) with ~57.3% less time. Shuffling entities moves accuracy only
  slightly (up to +1.4%/-2.3%); shuffling relations too makes behavior erratic
  (+9.2% to -6.8%).


  Evidence is measured with matched context size across structures and 8
  filter configurations, but decomposed HTKG could not be run (32768-token
  limit), GNN comparison uses 2 in-house variants, and only 1 domain is
  tested.


  If you planned to use LLMs as drop-in TKG forecasters, budget for retrieval
  quality and a heuristic baseline first.
