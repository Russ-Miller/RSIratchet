brief: >-
  LLMs forecasting geopolitical events rarely beat trivial heuristics like
  "pick the most frequent relation in the retrieved history", and supervised
  GNNs beat them in every tested setting. The representation of the facts,
  however, matters a lot for both accuracy and cost.


  The authors formalize hyper-relational temporal knowledge generalized
  hypergraphs (HTKGHs), which allow more than 2 primary entities per fact, and
  build htkgh-polecat from the POLECAT event database (Jan 2018-Jul 2024),
  filtered from 2.23M facts to roughly 556K, with a 1% stratified test set of
  about 5.5k facts. 9 LLMs from 4B to 20B are given the 100 most recent
  filtered facts and asked to predict the relation.


  Best regular-variation accuracies hover near 40-43% against a frequency
  heuristic reaching 40.2-46.7%; GNNs reach about 48-49.8% and stay flat as
  retrieval filters tighten, while LLMs close to within -6%. Thinking variants
  of Qwen3 gain +2.7-8.4% over non-thinking. Against reified HTKG on the same
  data, HTKGH gives +4.7% relation accuracy with ~56.8% less inference time,
  and up to 21.29% better link prediction (Jaccard) with ~57.3% less time.


  Shuffling entity names moves accuracy only slightly (up to +1.4% / -2.3%),
  suggesting context reliance over memorization; shuffling relations too makes
  behavior erratic (+9.2% to -6.8%).


  The structure comparison isolates representation by holding information
  constant, but decomposed HTKG could not be run at all (32768-token context
  limit), GNN design space is barely explored, and only 1 domain and 1 event
  database are tested.


  If you are building TKG forecasting pipelines, spend effort on retrieval and
  fact representation before model scale.
