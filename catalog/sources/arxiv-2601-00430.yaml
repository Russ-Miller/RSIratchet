brief: >-
  On geopolitical event forecasting, open-weight LLMs mostly lose to trivial
  frequency, recency, and copy heuristics, and lose to small supervised GNNs
  in every tested configuration. The data representation, not the model, gives
  the largest gains.


  The setup is htkgh-polecat, a dataset built from POLECAT events (Jan 2018 to
  Jul 2024), filtered from 2.23M to roughly 556K facts, using a proposed
  hyper-relational temporal knowledge generalized hypergraph (HTKGH)
  formalization that supports more than 2 primary entities. 9 models from 4B
  to 20B (Llama-3.1-8B-Instruct, Qwen3 variants, gemma-3,
  DeepSeek-R1-Distill-Qwen-7B, gpt-oss-20b) were tested on relation prediction
  over a 1% stratified test set (~5.5k facts) with the 100 most recent
  filtered facts as context.


  Best regular-variation LLM accuracies sit near 40.6%, against a frequency
  heuristic of 40.2% and GNNs at 48.2-49.8%. Thinking variants of Qwen3 gain
  +2.7-8.4% over non-thinking. Shuffling entities moves accuracy only +1.4% to
  -2.3%; shuffling relations too swings results from +9.2% to -6.8%. HTKGH
  beats reified HTKG by +4.7% on relation prediction and ~56.8% less inference
  time, and by up to 21.29% on link prediction with ~57.3% less time.


  Comparisons are matched on information content for the HTKGH vs reified HTKG
  test, and heuristic baselines are included throughout, but decomposed HTKG
  could not be run at all (32768 token context overflow), so the structural
  comparison is partial. Only 1 domain, 1 database, and models up to 20B; no
  frontier closed models.


  If you are building forecasting pipelines over event graphs, spend effort on
  context retrieval and representation before model scale.
