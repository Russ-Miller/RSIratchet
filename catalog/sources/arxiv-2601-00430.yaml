brief: >-
  On geopolitical event forecasting, 9 open LLMs mostly fail to beat trivial
  frequency/recency/copy heuristics, and supervised GNNs beat them in every
  configuration tested.


  The setup is htkgh-polecat, a dataset built from POLECAT events (Jan
  2018-Jul 2024) using a new formalization, hyper-relational temporal
  knowledge generalized hypergraphs, which supports more than 2 primary
  entities per fact (group-type and set2set-type events). Filtering cut 2.23M
  facts to roughly 556K; the test set is a stratified 1% sample (~5.5k facts).
  Models span 4B to 20B, non-thinking and thinking, with the 100 most recent
  filtered facts as context.


  Relation prediction accuracy for LLMs mostly sits below the Frequency
  heuristic (up to 46.9 with full filters). Thinking variants of Qwen3 gain
  +2.7-8.4% over non-thinking. Shuffling entity names moves accuracy by at
  most +1.4% / -2.3%; shuffling relations too produces erratic swings from
  +9.2% to -6.8%. Against reified HTKG on the same data, HTKGH gives +4.7%
  relation accuracy and ~56.8% less inference time, and up to 21.29% better
  Jaccard on link prediction with ~57.3% less time.


  The structure comparison is matched on information content, but decomposed
  HTKG could not be run at all (32768-token context overflow), so one key
  baseline is missing. 1 domain, open models under 20B only, and the GNN
  comparison uses 2 of the authors' own architectures.


  Treat heuristic baselines as mandatory before claiming LLM forecasting
  ability.
