brief: >-
  Open-weight LLMs mostly lose to trivial frequency and recency heuristics
  when forecasting geopolitical event relations, and lose to supervised GNNs
  everywhere, but the way facts are encoded matters a lot: a hypergraph
  representation beats a reified graph on both accuracy and latency.


  The authors formalize hyper-relational temporal knowledge generalized
  hypergraphs (HTKGH), which allow more than 2 primary entities per fact, and
  build htkgh-polecat from the POLECAT event database (Jan 2018-Jul 2024),
  filtering 2.23M facts down to ~556K, with a 1% stratified test set (~5.5k
  facts). 9 models from 4B to 20B (Llama-3.1-8B, Qwen3 thinking/non-thinking,
  gemma-3, DeepSeek-R1-Distill, gpt-oss-20b) get the 100 most recent filtered
  facts as context.


  LLMs beat the Frequency/Recency/Copy heuristics in few settings. Thinking
  variants of Qwen3 gain +2.7-8.4% over non-thinking. GNNs win in all
  scenarios, with LLMs closing to -6% under tight context filtering. HTKGH
  beats reified HTKG by +4.7% on relation prediction with ~56.8% less
  inference time, and by up to 21.29% on set-based link prediction with ~57.3%
  less time.


  Evidence is measured with matched information at test time for the HTKGH
  comparison, and heuristic baselines throughout; the structure comparison
  uses 1-2 models only, and decomposed HTKG could not be run at all because
  100 context facts exceeded the 32768-token limit.


  Shuffling entities moves accuracy only slightly (up to +1.4% non-thinking,
  -2.3% thinking); shuffling relations too produces erratic swings from +9.2%
  to -6.8%.


  If you are building LLM forecasters over event graphs, retrieval quality and
  fact encoding will buy you more than model scale.
