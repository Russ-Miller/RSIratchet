brief: >-
  On geopolitical event forecasting, 9 open LLMs mostly fail to beat trivial
  frequency/recency/copy heuristics, and supervised GNNs beat them in every
  configuration tested. The exception is the knowledge representation itself:
  a hypergraph-style format for multi-entity facts helps both accuracy and
  latency.


  The setup is htkgh-polecat, built from POLECAT events Jan 2018–Jul 2024,
  filtered from 2.23M facts to roughly 556K, with a stratified 1% test set of
  approximately 5.5k facts. Models span 4B to 20B (Llama-3.1-8B-Instruct,
  Qwen3 instruct and thinking variants, gemma-3-4b/12b-it,
  DeepSeek-R1-Distill-Qwen-7B, gpt-oss-20b), each given the 100 most recent
  filtered facts.


  Relation prediction accuracy tops out near 40.6% for the best regular
  setting, against a Frequency heuristic reaching 43.3%. Thinking variants of
  Qwen3 gain +2.7-8.4% over non-thinking. HTKGH beats reified HTKG by +4.7% on
  relation prediction with ~56.8% less inference time, and by as much as
  21.29% on link prediction with ~57.3% less time. Shuffling entities moves
  accuracy only slightly (up to +1.4% / -2.3%); shuffling relations too makes
  behavior erratic (+9.2% to -6.8%).


  The structure comparison is matched on information content by reifying the
  same data, so the attribution is reasonable, but decomposed HTKG could not
  be run at all due to the 32768-token context limit, and the HTKGH comparison
  uses 1-2 models. GNN results come from the authors' own architectures, not
  established baselines; only geopolitical data, open models under 20B.


  If you are building LLM forecasters over temporal knowledge graphs, spend
  effort on context retrieval and fact encoding before model scale.
