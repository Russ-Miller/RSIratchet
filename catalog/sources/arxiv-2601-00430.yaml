brief: >-
  On geopolitical event forecasting, 9 open LLMs mostly fail to beat trivial
  heuristics like picking the most frequent or most recent relation in the
  retrieved history. The representation you feed them matters more than the
  model: a hypergraph-style encoding of multi-entity facts outperforms the
  reified graph encoding of the same data while roughly halving inference
  time.


  The setup is htkgh-polecat, built from POLECAT geopolitical events (Jan
  2018-Jul 2024), filtered from 2.23M to ~556K facts, with a 1% stratified
  test set (~5.5k facts) and the 100 most recent filtered facts as context.
  Models span 4B-20B, thinking and non-thinking, plus 2 supervised GNN
  baselines and entity-shuffled and fully shuffled variants.


  LLMs beat the Frequency/Recency/Copy heuristics in few settings. Thinking
  variants of Qwen3 gain +2.7-8.4% over non-thinking. GNNs beat LLMs in all
  settings, with the gap narrowing to -6% under tighter context filtering.
  HTKGH beats reified HTKG by +4.7% on relation prediction with ~56.8% less
  inference time, and by up to 21.29% on set-based link prediction (Jaccard)
  with ~57.3% less time.


  Shuffling entities alone moves accuracy only slightly (up to +1.4% / -2.3%),
  suggesting context dependence rather than memorization; shuffling relations
  too makes behavior erratic (+9.2% to -6.8%).


  Evidence is measured with matched information at test time for the
  HTKGH/HTKG comparison, but 1 domain, open models under 20B only, and
  decomposed HTKG could not be run due to the 32768-token limit.


  If you build retrieval over event graphs, invest in context filtering and
  fact representation before model scale.
