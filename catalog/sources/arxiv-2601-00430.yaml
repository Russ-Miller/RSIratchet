brief: >-
  LLMs forecasting geopolitical events mostly fail to beat trivial
  frequency/recency heuristics, and supervised GNNs beat them in every tested
  setting. The representation you feed the model matters more than the model:
  a hypergraph encoding of multi-actor facts outperforms a reified graph
  encoding of the same data at roughly half the inference cost.


  The setup is htkgh-polecat, built from POLECAT events Jan 2018-Jul 2024,
  filtered from 2.23M facts to about 556K, with a 1% stratified test set of
  about 5.5k facts. 9 open models from 4B to 20B (Llama-3.1-8B, Qwen3 4B/8B
  thinking and non-thinking, gemma-3-4b/12b, DeepSeek-R1-Distill-Qwen-7B,
  gpt-oss-20b) predict the relation given the 100 most recent filtered facts.


  HTKGH beats reified HTKG by +4.7% relation accuracy with ~56.8% less
  inference time, and by as much as 21.29% Jaccard on link prediction with
  ~57.3% less time. Thinking variants of Qwen3 gain +2.7-8.4% over
  non-thinking. Shuffling entity names moves accuracy only slightly (up to
  +1.4% / -2.3%); shuffling relations too makes behaviour erratic (+9.2% to
  -6.8%).


  The structural comparison holds information constant at test time, so the
  effect is isolated; the GNN comparison is 1 architecture family on a
  2018-2022/2023-2024 split. Decomposed HTKG could not be run at all,
  exceeding the 32768-token context.


  If you are building TKG forecasting pipelines, invest in context retrieval
  and fact encoding before model scale.
