brief: Open-weight LLMs mostly lose to trivial heuristics on geopolitical
  event forecasting, while a richer graph structure that encodes multi-entity
  facts directly beats the standard reified encoding on both accuracy and
  latency. The paper formalizes hyper-relational temporal knowledge
  generalized hypergraphs (HTKGHs), which support more than 2 primary entities
  and set-to-set facts, and builds htkgh-polecat from the POLECAT database
  (Jan 2018 to Jul 2024), filtering 2.23M facts down to roughly 556K, of which
  about one in four uses the new complex formats. 9 models from 4B to 20B
  (Llama-3.1-8B-Instruct, Qwen3 variants, gemma-3,
  DeepSeek-R1-Distill-Qwen-7B, gpt-oss-20b) are tested on relation prediction
  over a 1% stratified test set (~5.5k facts) with the 100 most recent
  filtered facts as context. Frequency, recency and copy heuristics reach 46.9
  and LLMs top out near 43.4; supervised GNNs win in all settings, with LLMs
  closing to within -6% under the tightest retrieval filters. Thinking
  variants of Qwen3 gain +2.7-8.4% over non-thinking. HTKGH beats reified HTKG
  by +4.7% on relation prediction with ~56.8% less inference time, and by as
  much as 21.29% on link prediction (Jaccard) with ~57.3% less time. Shuffling
  entities moves accuracy only slightly (up to +1.4% / -2.3%); shuffling
  relations too produces erratic swings from +9.2% to -6.8%, evidence that
  predictions are context-driven rather than memorized but unstable when
  context contradicts priors. The structure comparison is matched on
  information content at test time, though decomposed HTKG could not be run at
  all within the 32768-token context. Only open models under 20B, 1 database,
  1 domain, and a thin GNN study. If you are building TKG forecasting systems,
  invest in context retrieval and fact representation before model scale.
