brief: >-
  RL's advantage over SFT on out-of-distribution reasoning comes from learning
  when to reject an answer, not from generating better answers. The paper
  splits a single policy analytically into a sampling policy (generate a
  candidate solution) and a decision policy (stop or resample), and argues
  token-level KL penalties scale with sequence length for sampling actions but
  stay O(1) for decision actions, so SFT-like objectives constrain sampling
  while leaving the decision function untrained.


  The empirical test is multi-digit multiplication with Qwen2.5-7B-Instruct,
  trained on 4x5 and 5x4 and evaluated on 3x3 through 3x9, all
  out-of-distribution, n = 100 per cell. Decision actions are detected by
  lexical revision markers.


  Base and SFT without reflection collapse past 3x4. SFT with reflection holds
  to 3x5 but drops to 49.0 on 3x6 and 0.0 on 3x9; RL holds 90.0 on 3x6 and
  34.0 on 3x9. Calibrating 3 parameters, RL keeps p(resample | wrong) at
  40-60% far OOD while SFT's collapses toward zero, with p(stop | correct)
  near ceiling in both.


  Evidence is a theorem plus 1 model family, 1 task type, and a 3-parameter
  behavioural fit, not an intervention that toggles gradient attribution.
  Supporting results on p(F->T) flatness at 3-5% and 8-80% SFT OOD degradation
  are cited from others. Clipping, trust regions, and non-binary rewards are
  excluded by assumption.


  Use it if you are deciding whether to spend on reflection-rich SFT data.
