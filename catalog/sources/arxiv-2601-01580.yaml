brief: >-
  RL's advantage over SFT on out-of-distribution reasoning comes from learning
  when to revise an answer, not from generating better answers. The authors
  split a model's policy into a sampling policy (produce a candidate solution)
  and a decision policy (stop or resample), and argue the two receive
  differently scaled gradients.


  The theory: trajectory-level surrogate rewards multiply both components by
  the same scalar advantage, while token-level KL penalties scale with
  sequence length for sampling (O(L_k)) and O(1) for decisions, so SFT-like
  objectives regularize generation hard and leave the decision policy
  untrained. Empirically, Qwen2.5-7B-Instruct was trained on 4x5 and 5x4
  multiplication and tested on 3x3 through 3x9, all OOD, n = 100 per cell.


  RL and reflection-SFT tie on easy OOD (96-98% on 3x3), then diverge: at 3x6
  RL holds 90% against SFT's 49%, and at 3x9 RL gets 34% against 0%. A
  3-parameter calibration (p_s, p_d|C, p_d|W) fits observed accuracy; RL keeps
  p_d|W at 40-60% far OOD while SFT's collapses toward zero.


  Evidence is mixed: the theorems are proved, but validation is 1 model family
  on 1 synthetic arithmetic task, with the decision boundary identified by
  lexical markers like "Let me recompute". No matched-compute baseline, and
  the calibration is a fitted abstraction, not a direct measurement.
  Supporting evidence from Kang et al. (p(F->T) flat at 3-5%) and Chu et al.
  (SFT degrades OOD 8-80%, RL improves 3-61%) is cited, not replicated.


  If you are buying reflection-heavy SFT data to get self-correction, this
  predicts you will get reflective text without discriminative action.
