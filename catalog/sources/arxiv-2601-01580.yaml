brief: >-
  RL's advantage over SFT on out-of-distribution reasoning comes from the
  model learning when to reject its own wrong answers, not from generating
  better answers. The paper argues this follows from gradient structure:
  trajectory-level surrogate rewards weight the generation and the stop/retry
  decision by the same scalar advantage, while token-level KL penalties (and
  SFT, treated as a KL-like objective) penalize generation changes by O(L_k)
  and decision changes by only O(1), leaving the decision policy
  under-trained.


  The empirical test is multiplication with Qwen2.5-7B-Instruct trained on 4x5
  and 5x4, evaluated OOD on 3x3 through 3x9, n=100 per cell, comparing base,
  SFT without reflection, SFT with reflection, and RL.


  RL and reflection-SFT tie on easy OOD (96–98% on 3x3), then diverge: at 3x6
  RL holds 90% vs 49%; at 3x9, 34% vs 0%. A 3-parameter calibration (p_s,
  p_d|C, p_d|W) fits observed accuracy; for both models p_d|C stays near
  ceiling, but p_d|W holds 40–60% for RL and collapses toward zero for SFT.


  The core claim is a proof under simplifying assumptions, with clipping and
  trust regions abstracted away; the empirical side is 1 model, 1 task family,
  no matched-compute baseline, and decision actions identified by lexical
  markers like "Let me recompute". Supporting evidence is cited from others:
  p(F→T) flat at 3–5% across corrective-data ratios, SFT degrading OOD by
  8–80% while RL improves 3–61%, and DFT moving AIME24 from 6.68 to 8.56 vs
  SFT's 2.48.


  If you are adding reflection traces to SFT data hoping for self-correction,
  this predicts you will buy first-answer accuracy and nothing else.
