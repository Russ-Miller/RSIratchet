brief: >-
  RL's edge over SFT on out-of-distribution math comes from the model learning
  when to reject its own wrong answer, not from producing better answers. The
  paper formalizes this by splitting a single policy into a sampling component
  (generating a candidate) and a decision component (STOP vs RESAMPLE), and
  proving that trajectory-level surrogate rewards weight gradients to both
  components identically, while token-level KL penalties scale as O(L) for
  sampling versus O(1) for decisions, leaving the decision policy
  under-regularized.


  Validation is on Qwen2.5-7B-Instruct trained on 4x5 and 5x4 multiplication
  and evaluated out-of-distribution on 3x3 through 3x9, n = 100 per cell. RL
  and reflection-SFT are comparable on easy tasks (96-98% on 3x3), diverge at
  3x6 (RL 90% vs SFT 49%), and separate fully at 3x9 (34% vs 0%). A
  3-parameter calibration fits observed accuracy: p_d|C stays near ceiling for
  both, while p_d|W holds at 40-60% for RL and collapses toward zero for SFT.


  The mechanism is argued from theory; the empirical part is 1 model, 1
  arithmetic task family, and decision actions are detected by lexical markers
  like "Let me recompute", which is a proxy, not a measurement. Supporting
  evidence is cited rather than replicated: Kang et al. report p(F→T) flat at
  3-5%, Chu et al. report SFT degrading OOD by 8-80% while RL improves 3-61%.


  The theory abstracts away clipping and trust regions and assumes binary
  correctness rewards; process rewards and learned reward models are untested.


  If you are diagnosing why SFT reflection data fails, measure rejection of
  wrong answers separately from first-pass accuracy.
