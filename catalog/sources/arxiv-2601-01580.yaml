brief: >-
  RL's advantage over SFT on out-of-distribution reasoning comes from the
  decision of when to retry, not from better generation. The authors split a
  single policy analytically into a sampling policy (produce a candidate
  answer and trace) and a decision policy (STOP or RESAMPLE), and argue the
  token-level KL penalty scales as O(L) for sampling but O(1) for decisions,
  so regularization constrains generation while leaving the stop/retry
  judgment free to move.


  Validation is on Qwen2.5-7B-Instruct trained on 4x5 and 5x4 multiplication
  and tested on 3x3 through 3x9, all OOD, n=100 per cell. RL and
  reflection-SFT tie on easy cells (96-98% on 3x3), diverge at 3x6 (RL 90% vs
  SFT 49%) and at 3x9 (RL 34% vs SFT 0%). A 3-parameter calibration fits
  observed accuracy: both models keep p_d|C near ceiling, but RL sustains
  p_d|W at 40-60% far OOD while SFT's collapses toward zero.


  The theory is proved under simplifying assumptions, with clipping and trust
  regions abstracted away; the empirical side is 1 model, 1 task family, and
  decision actions are detected by lexical markers like "Let me recompute".
  Supporting evidence from Kang et al. (p(F→T) flat at 3-5%) and Chu et al.
  (SFT degrades OOD 8-80%, RL improves 3-61%) is cited, not replicated.


  If you attribute RL gains to better reasoning, this suggests measuring the
  verification decision separately.
