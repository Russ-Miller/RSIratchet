brief: >-
  RL-trained models generalize better than SFT models not because they
  generate better candidate answers, but because they learn when to reject a
  wrong one. The paper decomposes an LLM's policy into a sampling component
  (generate a candidate solution) and a decision component (stop or resample),
  and argues that trajectory-level surrogate rewards weight both equally while
  token-level KL penalties scale with sequence length, constraining sampling
  by O(L) and leaving the decision policy nearly unregularized.


  The empirical test uses Qwen2.5-7B-Instruct trained on 4x5 and 5x4
  multiplication, evaluated out-of-distribution on 3x3 through 3x9, n=100 per
  cell. SFT with reflection data and RL are near-equal on easy tasks (96-98%
  on 3x3), then diverge: at 3x6, RL 90% vs SFT 49%; at 3x9, RL 34% vs SFT 0%.
  A 3-parameter calibration fits observed accuracy; RL keeps p(resample |
  wrong) at 40-60% far OOD while SFT's collapses toward zero, with p(stop |
  correct) high in both.


  The mechanism claim is proved under a simplified objective with clipping and
  trust regions abstracted away. The empirical side is 1 model, 1 task family,
  arithmetic only, with no ablation separating reward structure from KL
  weighting; supporting evidence for SFT's failure is cited from others (p(F
  to T) flat at 3-5%; SFT degrades OOD 8-80% while RL improves 3-61%).


  If you are diagnosing why reflection-tuned SFT models echo their first
  answer, measure the rejection rate on wrong answers rather than first-pass
  accuracy.
