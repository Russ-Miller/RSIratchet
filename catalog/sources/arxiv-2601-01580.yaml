brief: >-
  RL's advantage over SFT on out-of-distribution reasoning comes from the
  model learning when to reject its own answer, not from generating better
  answers. Both model types sample at similar rates; only the RL model keeps
  rejecting wrong candidates as tasks get harder.


  The authors decompose a single next-token policy analytically into a
  sampling policy (generate a candidate + trace) and a decision policy (STOP
  or RESAMPLE), detect decision actions via lexical markers like "Let me
  recompute", and fit 3 parameters (p_s, p_d|C, p_d|W) from output behavior.
  Models are Qwen2.5-7B-Instruct trained on 4x5 and 5x4 multiplication,
  evaluated on 3x3 through 3x9, all OOD, n = 100 per cell.


  RL and SFT-with-reflection tie on easy OOD (96–98% on 3x3), then diverge: at
  3x6 RL holds 90% vs SFT's 49%; at 3x9, 34% vs 0%. Calibration shows p_d|C
  high for both, but RL sustains p_d|W at 40–60% far OOD while SFT's collapses
  toward zero; RL's p_s still falls from roughly 80% to below 20%.


  The theory is proved, not measured: surrogate rewards give balanced gradient
  attribution, token-level KL gives an O(L_k) vs O(1) asymmetry. The empirical
  side is 1 model family, 1 task type, no ablation separating the decision
  policy causally; the decomposition is a fitted 3-parameter abstraction whose
  agreement with observed accuracy is the main validation. Supporting evidence
  is cited from others (SFT degrades OOD by 8–80% while RL improves it by
  3–61%; p(F→T) flat at 3–5%).


  If you are buying reflection-rich SFT data to get self-correction, this
  predicts you get better first answers and no discrimination.
