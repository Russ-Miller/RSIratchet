brief: >-
  RL's advantage over SFT on out-of-distribution arithmetic comes from the
  model's decision to revise, not from better candidate answers. The authors
  split a single policy analytically into a sampling policy (generate a
  reasoning trace and answer) and a decision policy (STOP or RESAMPLE), then
  ask how reward gradients split between them.


  The theory: trajectory-level surrogate rewards multiply both components by
  the same scalar advantage (balanced attribution), while token-level KL
  penalties scale as O(L_k) for sampling and O(1) for decisions, leaving the
  decision policy under-regularized and under-optimized. SFT is argued to
  behave like the KL term without countervailing reward.


  Empirically, Qwen2.5-7B-Instruct trained on 4x5 and 5x4 multiplication was
  tested on 3x3 through 3x9 (n=100 each). RL and reflection-SFT tie on easy
  tasks, then diverge: 90% vs 49% on 3x6, and 34% vs 0% on 3x9. Calibrating 3
  parameters from outputs, the probability of stopping on a correct answer
  stays high for both, but the probability of resampling when wrong holds at
  40-60% for RL and collapses toward zero for SFT.


  Evidence is 1 model family, 1 task family, no matched-compute baseline; the
  decision/sampling split relies on lexical revision markers. Supporting
  citations (p(F→T) flat at 3-5%; SFT degrading OOD by 8-80% while RL improves
  3-61%) are secondhand.


  If you train reflection by SFT, expect fluent revision text without
  discriminative revision.
