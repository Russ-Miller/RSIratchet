brief: >-
  RL's advantage over SFT on out-of-distribution arithmetic comes from a
  better stopping/revision decision, not from better candidate generation. SFT
  models trained on reflection-rich traces produce verification text but keep
  echoing their first answer when it is wrong.


  The authors split an LLM's policy analytically into a sampling policy
  (generate reasoning plus candidate) and a decision policy (STOP vs
  RESAMPLE), prove that trajectory-level surrogate rewards weight both
  components by the same scalar advantage while token-level KL penalties
  penalize sampling by O(L_k) and decisions by O(1), then test on
  Qwen2.5-7B-Instruct trained on 4x5 and 5x4 multiplication and evaluated on
  3x3 through 3x9 (all OOD, n=100 per cell).


  RL and SFT-with-reflection tie on easy OOD (96-98% on 3x3), diverge at 3x6
  (RL 90% vs SFT 49%) and at 3x9 (RL 34% vs SFT 0%). Calibrating p_s, p_d|C,
  p_d|W shows RL holds p_d|W at 40-60% far OOD while SFT's collapses toward
  zero; p_s degrades in both.


  The theory is proved under a simplified objective with clipping and trust
  regions abstracted away. The empirical side is 1 model family, 1 task
  family, no matched-budget comparison, and decision actions are identified by
  lexical markers like "Let me recompute", which may miss non-verbalized
  revisions. Supporting evidence from Kang et al. (p(F->T) flat at 3-5%) and
  Chu et al. (SFT degrades OOD by 8-80%, RL improves by 3-61%) is cited, not
  replicated.


  Useful if you want a gradient-level reason to stop expecting reflection-rich
  SFT data to buy self-correction.
