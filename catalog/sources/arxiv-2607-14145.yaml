summary: "Tool-augmented large language model agents excel at long-horizon
  tasks, yet they are typically post-trained on fixed toolsets. When tasks
  demand new tools, these agents struggle to incorporate them effectively, and
  retraining from scratch is often impractical. We identify the core obstacle
  in such toolset expansion problem as behavioral inertia: the tendency of
  agents to fall back on familiar tools and established reasoning patterns
  despite having access to new ones. We demonstrate that injecting
  counterfactual anchor contexts at critical decision points can break this
  inertia, recovering fail"
