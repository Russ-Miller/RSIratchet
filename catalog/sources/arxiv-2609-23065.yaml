summary: >-
  Chain-of-thought (CoT) can sound plausible yet be unfaithful to the
  model's underlying reasoning. Most prior work probes CoT faithfulness
  through input--output behavior or input attributions, leaving internal
  computation largely underexplored. We instead cast faithfulness as
  internal concept grounding: Does a large language model's (LLM) CoT
  reasoning engage the same internal concepts that support the LLM's direct
  prediction, and do the shared concepts causally drive its answer? Encoding
