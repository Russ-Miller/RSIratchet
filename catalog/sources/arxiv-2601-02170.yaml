brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as a
  running state, not just a one-off error, and the accumulated prefix-level
  signal behaves asymmetrically: it rises fast and falls only after sustained
  correction.


  The setup is a probing framework over 10,000+ long CoT trajectories with
  200k+ reasoning steps, including 40k+ hallucinated steps, generated by
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, with
  step-level and prefix-level labels assigned by Claude 4.5 plus semantic,
  logical-consistency and stratified human checks. A linear probe reads an
  exponentially late-token-weighted within-step representation; a second probe
  predicts prefix state using the step score as a guiding signal.


  Step-level AUC reaches 87.83%, 86.70% and 93.27%, about +4.6%, +5.8% and
  +2.9% over global-mean aggregation. Final-step prefix AUC is 72.69%, 81.05%
  and 92.18%. Step-level AUC falls from roughly 0.89 early to 0.82 late,
  accuracy 0.89 to 0.74, while recall rises from 0.31-0.34 to over 0.80.


  Baselines share identical supervision, which isolates the representation
  change; the aggregation ablation covers uniform and linear weighting.
  Dynamic-metric claims rest on 1 radar figure and 4 hand-picked trajectories.


  Requires white-box hidden states and explicit steps, so API-only or
  compressed reasoning is out of scope, and no mitigation is attempted.


  Useful if you want an online, zero-extra-cost reliability signal during
  generation.
