brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as an
  evolving state, not a one-off error, and how you pool tokens into a step
  representation matters more than probe capacity. Weighting tokens
  exponentially toward the end of a single step, rather than averaging over
  the whole prefix, lifts step-level detection across 3 model families.


  The setup: 10,000+ long CoT trajectories with 200k+ reasoning steps,
  including 40k+ hallucinated steps, generated by Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, with step-level and
  prefix-level labels assigned by Claude 4.5 plus logical-consistency
  filtering and stratified human review. Two probes run per step: a local
  alarm and a prefix-state predictor that takes the step score as input.


  Step-level AUC reaches 87.83%, 86.70% and 93.27%, about +4.6%, +5.8% and
  +2.9% over global-mean aggregation. Final-step prefix AUC is 72.69%, 81.05%
  and 92.18%. Step AUC falls from roughly 0.89 early in the chain to 0.82
  late, while F1 rises from below 0.35 to nearly 0.78, driven by recall
  (0.31-0.34 to over 0.80) at roughly flat precision (0.74-0.75).


  The aggregation effect is isolated: all methods share the same labels and
  probe, so gains come from the input representation. Weaker points are the
  LLM-generated labels, 3 models all at 7-8B, and qualitative trajectory cases
  standing in for dynamic evidence. It needs hidden states, so it does not
  apply to API-only models, and it detects rather than fixes.


  If you are building inference-time monitors, pool within the step, not
  across the prefix.
