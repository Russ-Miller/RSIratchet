brief: >-
  Hallucination in a long chain of thought behaves like a persistent latent
  state, not a set of isolated bad steps: once the prefix enters a
  hallucinated regime, a single corrective step rarely pulls it out. Linear
  probes on hidden states can read both the local step judgment and this
  global prefix state.


  The setup is a dataset of 10,000+ long CoT trajectories with 200k+ reasoning
  steps, including 40k+ hallucinated steps, generated by
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, with
  step-level and prefix-level labels assigned by Claude 4.5 plus semantic,
  logical and stratified human checks. Step representations use exponential
  within-step token weighting instead of additive aggregation over the whole
  prefix.


  Step-level AUC reaches 87.83%, 86.70% and 93.27%, about +4.6%, +5.8% and
  +2.9% over a global-mean baseline. Prefix-level Final-setting AUC is 72.69%,
  81.05% and 92.18%. Step-level AUC falls from roughly 0.89 early in the chain
  to about 0.82 late, with accuracy dropping 0.89 to 0.74, while F1 rises from
  below 0.35 to nearly 0.78, driven by recall (0.31–0.34 to over 0.80) at
  stable precision (0.74–0.75).


  Baselines are matched on supervision and labels, which isolates the
  representation change. Asymmetric recovery is shown through 4 qualitative
  trajectories, not measured at scale. Needs hidden states, so no API-only
  use, and detection only, no mitigation.


  If you want online abort signals for reasoning agents, this gives a cheap
  probe and a reason to track prefix state rather than per-step alarms.
