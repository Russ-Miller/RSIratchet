brief: >-
  Hallucination in long chain-of-thought reasoning is decodable from hidden
  states as an evolving state, not a one-off error, and it is easier to detect
  late in a chain than early. Prefix-level hallucination also recovers
  asymmetrically: it rises fast after a bad step but only falls after
  sustained correction.


  The setup is a probing framework over 10,000+ long CoT trajectories with
  200k+ reasoning steps, including 40k+ hallucinated steps, generated by
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, with
  step-level and prefix-level labels assigned by Claude 4.5 plus semantic,
  logical and stratified manual checks. The method weights tokens within a
  step exponentially instead of averaging over the whole prefix, then trains a
  prefix probe with an anchor loss and a step-guided synchronization loss.


  Step-level AUC reaches 87.83%, 86.70% and 93.27%, about +4.6%, +5.8% and
  +2.9% over global-mean aggregation. Final-step prefix AUC is 72.69%, 81.05%
  and 92.18%. Along the chain, AUC falls from roughly 0.89 early to 0.82 late
  while F1 rises from below 0.35 to nearly 0.78, driven by recall (0.31-0.34
  to over 0.80) at stable precision (0.74-0.75).


  Baselines share identical supervision, which isolates the representation
  change. Labels come from a model judge; datasets are 3 models, 1 label
  source, and the method needs hidden states, so it will not transfer to
  API-only models.


  Useful if you want an online reliability signal during generation rather
  than post-hoc answer checking.
