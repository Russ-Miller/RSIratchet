brief: >-
  Hallucination in long chain-of-thought reasoning is decodable from hidden
  states while the chain is still being generated, but the signal behaves as
  an accumulating state rather than a per-step error flag. Lu et al. separate
  a step-level probe (does this step introduce unsupported content) from a
  prefix-level probe (has the trajectory entered a hallucinated state), with
  the step score fed in as a guiding signal plus a final-step anchor loss and
  an alarm-synchronization loss.


  The dataset covers 10,000+ long CoT trajectories, 200k+ reasoning steps,
  40k+ hallucinated steps, labeled by Claude 4.5 with semantic, logical and
  stratified human checks, generated from Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B. Final-answer hallucination
  rates differ sharply across models: 73.47%, 66.63%, 48.33%.


  Step-level AUC reaches 87.83%, 86.70%, 93.27%, above a global-mean
  aggregation baseline by roughly +4.6%, +5.8%, +2.9%. Under Final prefix
  evaluation AUC is 72.69%, 81.05%, 92.18%. Step-level AUC falls from about
  0.89 early to 0.82 late; recall rises from 0.31–0.34 to over 0.80 while
  precision stays near 0.74–0.75.


  All methods share identical supervision, so representation construction is
  isolated as the cause; the global-mean baseline matches aggregate AUC but
  degrades on the 8 dynamic metrics, which are the authors' own.


  Requires hidden-state access, so not usable for API-only models, and
  detection is not mitigation.
