brief: >-
  Hallucination inside a long chain of thought is decodable from hidden states
  while the chain is still being written, but the signal is weak early and
  strong late, which is the opposite of what you want for early intervention.
  Probes trained on step-level labels reach AUC 87.83%, 86.70% and 93.27% on
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, using
  a within-step exponential token weighting instead of additive aggregation
  over the whole prefix.


  The dataset covers 10,000+ long CoT trajectories, 200k+ reasoning steps and
  40k+ hallucinated steps, labelled by Claude 4.5 at both step level and
  prefix level, with semantic, logical-consistency and stratified human
  checks. A second probe estimates whether the prefix has entered a
  hallucinated state, conditioned on the step score, trained with a final-step
  anchor loss and a one-way synchronization loss.


  Against a global-mean aggregation baseline under identical supervision, the
  step representation adds roughly +4.6%, +5.8% and +2.9% AUC. Along the
  trajectory, step AUC falls from about 0.89 early to 0.82 late and accuracy
  from 0.89 to 0.74, while F1 rises from below 0.35 to nearly 0.78 purely
  through recall (0.31–0.34 to over 0.80) at stable precision (0.74–0.75).
  Prefix-level final-step AUC is 72.7%, 81.1% and 92.2%, above all baselines,
  though the global-mean baseline is close on AUC and separates only on 8
  dynamic transition metrics.


  Supervision is matched across methods, so the representation change is
  isolated, but labels come from 1 annotator model and the dynamic-metric
  advantage rests on self-defined measures. The method needs hidden states, so
  it does not transfer to API-only models, and detection is not mitigation.


  If you want runtime monitoring of reasoning chains, expect usable signal
  with no extra inference cost, and expect it to arrive late.
