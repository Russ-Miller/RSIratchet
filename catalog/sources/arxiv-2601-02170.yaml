brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as a
  persistent, slowly-recovering state, not as isolated bad steps. Probes read
  two signals per step: whether the current step adds unsupported content, and
  whether the whole prefix has entered a hallucinated regime.


  The dataset covers 10,000+ long CoT trajectories, 200k+ reasoning steps,
  40k+ hallucinated steps, generated by Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, with step- and prefix-level
  labels assigned by Claude 4.5 plus logic filtering and stratified human
  review.


  The step-level probe uses exponential within-step token weighting instead of
  additive prefix aggregation, reaching AUC 87.83%, 86.70%, 93.27% versus a
  global-mean baseline at 82.27%, 80.95%, 90.38%. Prefix-level AUC at the
  final step is 72.69%, 81.05%, 92.18%. Step-level AUC falls from roughly 0.89
  early in a chain to 0.82 late; recall rises from 0.31–0.34 to over 0.80
  while precision stays near 0.74–0.75.


  Baselines are trained under identical supervision, which isolates the
  representation change, and layer-wise and position-wise ablations are
  included. Label quality rests on an LLM annotator. Three 7–8B models, no
  API-only or implicit-reasoning setting, detection only, no mitigation.


  If you need an online hallucination monitor and have hidden-state access,
  prefix-level probing is worth trying; aggregate AUC alone will mislead you
  about transition behaviour.
