brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as an
  evolving state, not a one-off error, and a prefix-level signal recovers more
  than per-step judgments do. Probes read it out at over 87% accuracy at both
  levels, and early-step errors are detectable but weakly evidenced.


  The setup: 10,000+ long CoT trajectories with 200k+ reasoning steps,
  including 40k+ hallucinated steps, generated by Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B, with step-level and
  prefix-level labels assigned by Claude 4.5 plus semantic, logical and
  stratified human checks. A lightweight probe reads step representations
  built by exponentially weighting later tokens within a step rather than
  summing across the prefix.


  The weighting improves AUC by about +4.6%, +5.8% and +2.9% over global-mean
  aggregation. Step-level AUC falls from roughly 0.89 early in a chain to
  about 0.82 late, accuracy from around 0.89 to 0.74, while F1 rises from
  below 0.35 to nearly 0.78, driven by recall (0.31-0.34 to over 0.80) at
  stable precision (0.74-0.75). Final-step prefix AUCs reach 72.7%, 81.1% and
  92.2%. Online detection correctly identifies 78% of CoT instances.


  Baselines are trained under identical supervision, which isolates the
  representation change; the aggregation comparison is a clean ablation.
  Labels are mostly model-generated, the dynamic-metric advantage over global
  mean is shown on a radar plot rather than a significance test, and
  qualitative asymmetry claims rest on 4 cases.


  It needs hidden states, so no API-only models, and detection is not
  mitigation. Useful if you are building inference-time monitors for reasoning
  models you host yourself.
