brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as an
  evolving prefix state, not just a local error event, and the prefix state
  recovers more slowly than step-level signals do.


  The setup: 10,000+ long CoT trajectories with 200k+ reasoning steps,
  including 40k+ hallucinated steps, generated by Llama-3.1-8B-Instruct,
  Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B on queries from existing
  multi-hop and BBH-style sets, with step-level and prefix-level labels
  assigned by Claude 4.5 plus answer-correctness and logic filters and
  stratified human review. Linear probes read hidden states; step
  representations use exponential within-step token weighting instead of
  global mean pooling.


  Step-level probing reaches AUC 87.83%, 86.70% and 93.27%, about +4.6%, +5.8%
  and +2.9% over global-mean aggregation. Final-step prefix AUC is 72.69%,
  81.05% and 92.18%. Step AUC falls from about 0.89 early in the chain to
  about 0.82 late, while F1 rises from below 0.35 to nearly 0.78, driven by
  recall (0.31-0.34 to over 0.80) at roughly flat precision (0.74-0.75).


  Baselines share identical supervision, so the representation change is
  isolated; dataset labels, though, come from 1 annotator model, and the
  global-mean baseline is close on AUC, separating only on the authors' own 8
  dynamic metrics. Requires white-box hidden states, 3 8B-class models,
  detection only, no mitigation.


  Useful if you want a cheap inference-time monitor on open-weight reasoning
  models.
