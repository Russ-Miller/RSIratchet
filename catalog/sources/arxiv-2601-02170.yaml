brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as a
  persistent, slowly-recovering state, not an isolated bad step. Separating a
  per-step judgment from a cumulative prefix-level state makes both readable
  by lightweight probes.


  The authors annotate 10,000+ long CoT trajectories with 200k+ reasoning
  steps, including 40k+ hallucinated steps, using Claude 4.5 plus semantic,
  logical-consistency and stratified human checks, on traces from
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B. Step
  representations use within-step exponential token weighting instead of
  additive aggregation over the whole prefix; the prefix probe is trained with
  an anchor loss at the final step plus a one-way synchronization loss toward
  the step signal.


  Step-level AUC reaches 87.83%, 86.70% and 93.27%, about +4.6%, +5.8% and
  +2.9% over global-mean aggregation. Final-step prefix AUC is 72.69%, 81.05%
  and 92.18%. Step-level AUC falls from roughly 0.89 early to 0.82 late, with
  recall rising from 0.31-0.34 to over 0.80 while precision stays near
  0.74-0.75.


  Baselines (TTPD, SAPLMA, ICR, LLM-Check, global mean) are trained under
  identical supervision, so the representation change is isolated; dataset
  labels are mostly model-generated, and the prefix-level gain over global
  mean on aggregate AUC is small, visible mainly on 8 dynamic metrics the
  authors define.


  It needs hidden-state access, so not usable for API-only models, and covers
  detection only, not mitigation. Treat prefix confidence, not step alarms, as
  the signal worth monitoring during generation.
