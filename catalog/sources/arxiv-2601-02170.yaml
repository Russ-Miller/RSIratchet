brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as an
  evolving state, not a one-off error: a step-level probe and a cumulative
  prefix-level probe both read out above 87% accuracy, and the prefix state
  rises fast but recovers slowly. Step-level separability degrades as the
  chain grows.


  The setup is a dataset of 10,000+ long CoT trajectories with 200k+ reasoning
  steps, including 40k+ hallucinated steps, generated by
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B on
  multi-hop QA and BBH-style queries, with step- and prefix-level labels from
  Claude 4.5 plus semantic, logical and stratified human validation. Probes
  use within-step exponentially weighted token aggregation rather than global
  mean.


  Step-level AUC: 87.83%, 86.70%, 93.27% versus global-mean 82.27%, 80.95%,
  90.38%. Along the trajectory AUC falls from about 0.89 early to 0.82 late
  and accuracy from 0.89 to 0.74, while F1 rises from below 0.35 to nearly
  0.78, driven by recall (0.31–0.34 to over 0.80) at stable precision
  (0.74–0.75). Final-step prefix AUC: 72.69%, 81.05%, 92.18%.


  Baselines share identical supervision, isolating representation
  construction; dynamic-metric gains over global mean rest on 8 self-defined
  metrics and 4 case studies. Labels are model-generated. Requires
  hidden-state access, so not applicable to API-only models, and no mitigation
  is attempted.


  Treat it as evidence that reasoning reliability is trackable online, not
  that it can be fixed.
