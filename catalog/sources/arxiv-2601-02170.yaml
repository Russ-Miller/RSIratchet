brief: >-
  Hallucination in long chain-of-thought is decodable from hidden states as a
  persistent trajectory state, not just a local error, and the two signals
  behave differently: prefix-level state rises fast after an error but falls
  only after sustained correction.


  The setup is a probing framework over 10,000+ long CoT trajectories with
  200k+ reasoning steps, including 40k+ hallucinated steps, generated by
  Llama-3.1-8B-Instruct, Qwen2.5-7B-Instruct and DeepSeek-R1-Distill-8B on
  queries from existing multi-hop and BBH-style sources, with step-level and
  prefix-level labels assigned by Claude 4.5 plus answer-correctness,
  logic-consistency and stratified human checks. Steps are represented by
  exponentially weighting later tokens within a step rather than summing over
  the whole prefix.


  Step-level AUC reaches 87.83%, 86.70% and 93.27%, about +4.6%, +5.8% and
  +2.9% over a global-mean aggregation baseline. Final-step prefix AUCs are
  72.69%, 81.05% and 92.18%. Step AUC falls from roughly 0.89 early to 0.82
  late, accuracy 0.89 to 0.74, while F1 rises from below 0.35 to nearly 0.78,
  driven by recall (0.31–0.34 to over 0.80) at stable precision (0.74–0.75).


  Baselines share identical supervision, so the representation change is
  isolated; the global-mean comparison is matched. Labels are LLM-generated, 3
  8B-scale models, no black-box setting, detection only, no mitigation.


  If you want online hallucination monitoring, track an accumulated prefix
  score, not step alarms.
