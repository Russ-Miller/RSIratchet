brief: >-
  Scaffolding around the search step, not the LLM itself, is where issue
  localization gains come from: managing which code-search action runs next
  and pruning retrieved context lifts function-level localization and carries
  through to more resolved patches.


  OrcaLoca builds a CodeGraph over a Python repo and adds 3 pieces on top of a
  ReAct-style agent: a priority queue over LLM-proposed search actions with
  redundancy elimination, decomposition of class/file skeleton results into
  sub-actions ranked by a scoring sub-agent, and context pruning that keeps
  the 12 search results closest in graph distance to the current candidate bug
  locations. Claude-3.5-Sonnet-20241022, temperature 0.1, evaluated on
  SWE-bench Lite with Agentless-1.5's repair stage bolted on.


  Function match rate 65.33% (196 of 300) and file match 83.33% (250),
  resolved 41.00% (123). Against a self-reproduced Agentless-1.5: +6.67 points
  function match, +4.62 points precision, +6.33 points resolved. Ablations on
  a 93-instance subset drop function match from 76.34% to 70.97%–73.12%.


  The main comparison is a reproduction the authors ran themselves, and the
  leaderboard rows differ in model and harness, so no matched-cost baseline
  exists; search costs $0.87 and editing $0.90 per instance. Ablations are on
  93 instances. 1 model, Python only, no open-weight model tested.


  If you are building a localization stage, the action-scheduling and pruning
  machinery is worth copying; treat the ranking claim as softer.
