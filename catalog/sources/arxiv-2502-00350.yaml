ingested_at: 2026-09-19
brief: >-
  Engineering the search process around an LLM agent, rather than letting the
  LLM schedule its own actions, raises issue localization accuracy on real
  repositories. OrcaLoca adds 3 pieces on top of a graph representation of a
  codebase: a priority queue over LLM-proposed search actions with redundancy
  elimination, decomposition of class and file skeletons into sub-actions
  ranked by a scoring sub-agent, and context pruning that keeps only search
  results close to candidate bug locations by shortest-path distance on the
  code graph.


  Running on Claude-3.5-Sonnet-20241022 over SWE-bench Lite's 300 instances,
  it reaches 65.33% (196) function match and 83.33% (250) file match, and
  41.00% (123) resolved after its output is fed into Agentless-1.5's repair
  stage. Against a reproduced Agentless-1.5 baseline on the same model, that
  is +6.67 percentage points function match, +4.62 percentage points function
  match precision, and +6.33 percentage points resolved rate.


  The gains are measured, not argued, and the localization-to-repair
  comparison holds the editor and model fixed. An ablation on the 93-instance
  SWE-bench Common subset shows each component contributes roughly 3-5
  percentage points, dropping function match from 76.34% (71) to
  70.97%-73.12%. No matched token-budget baseline is reported; cost is about
  $0.87 per instance for search plus $0.90 for editing.


  Boundaries: 1 model family, Python repositories only, and a single
  open-source repair pipeline. Treat the scheduler and pruning as cheap
  add-ons worth trying before switching models.
