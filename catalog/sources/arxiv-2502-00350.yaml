brief: >-
  Structuring an agent's code search with a priority queue, sub-agent
  relevance scoring, and graph-distance context pruning raises issue
  localization accuracy more than letting the LLM drive search freely, and the
  localization gain carries through to more resolved patches.


  OrcaLoca builds a CodeGraph of a repository, has Claude-3.5-Sonnet-20241022
  emit observations, candidate bug locations, and search actions, then
  reorders those actions by priority, decomposes class/file skeleton results
  into top-k method queries via a scoring sub-agent, and prunes retrieved
  context by shortest-path distance to current candidate locations. Evaluation
  is on SWE-bench Lite (300 instances), with ablations on a 93-instance
  SWE-bench Common subset; patch generation reuses Agentless-1.5's repair and
  validation stages.


  Function match reaches 65.33% (196) and file match 83.33% (250), best among
  open-source entries; resolved rate is 41.00% (123). Against a reproduced
  Agentless-1.5 baseline, that is +6.67 pp function match, +4.62 pp function
  match precision, and +6.33 pp resolved rate. Ablations drop function match
  on SWE-bench Common from 76.34% to 70.97%-73.12%.


  The comparison is a reproduction of 1 baseline whose editor OrcaLoca reuses,
  so the localization component is isolated reasonably well, but leaderboard
  rivals differ in model and scaffold. Only 1 model family was tested, only
  Python repositories, and the ablation set is small. Search costs about $0.87
  per instance plus $0.90 for editing.


  If you build localization scaffolds, the scheduling and pruning ideas are
  worth copying; the model-generality claim is untested.
