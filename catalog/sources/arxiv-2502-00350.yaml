brief: >-
  Scaffolding around code search, not the model, is where issue localization
  gains come from: a priority queue over LLM-proposed search actions plus
  graph-distance context pruning lifts function match rate and carries through
  to patch resolution.


  OrcaLoca builds a CodeGraph of a repository (files, classes, methods, with
  containment and reference edges), lets Claude-3.5-Sonnet-20241022 propose
  search actions, schedules them by priority and repetition count, decomposes
  class/file skeletons into top-k sub-actions via a scoring sub-agent, and
  prunes retrieved context by average shortest-path distance to current
  candidate bug locations. Evaluation is on SWE-bench Lite (300 instances),
  with ablations on a 93-instance SWE-bench Common subset.


  Function match rate is 65.33% (196) and file match rate 83.33% (250), the
  best among open-source entries on the leaderboard at the 01/13/2025 cutoff.
  Pairing the localizations with Agentless-1.5's repair stage resolves 41.00%
  (123), +6.33 percentage points over their own Agentless-1.5 reproduction,
  with +6.67 points function match and +4.62 points precision. Search costs
  about $0.87 per instance, editing about $0.90.


  Evidence is reasonable: the Agentless baseline was reproduced in-house with
  the same LLM and patch budget (40 patches), and each component was ablated,
  costing 3–5 points. Ablations run on 93 instances only, 1 model, Python
  repositories, and leaderboard comparisons differ in underlying models.


  If you build localization agents, the scheduling and pruning mechanisms are
  the transferable part.
