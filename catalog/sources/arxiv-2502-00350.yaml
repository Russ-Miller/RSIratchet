ingested_at: 2026-09-19
brief: >-
  Scheduling and pruning an agent's code-search actions, rather than letting
  the LLM freely choose and accumulate context, raises issue localization
  accuracy on real repositories. OrcaLoca adds 3 pieces on top of a CodeGraph
  index: a priority queue over LLM-proposed search actions with redundancy
  elimination, decomposition of class/file skeletons into sub-actions ranked
  by a scoring sub-agent, and context pruning that keeps only search results
  near the current candidate bug locations by graph distance.


  Evaluated on SWE-bench Lite (300 instances) with Claude-3.5-Sonnet-20241022
  at temperature 0.1, with Agentless-1.5's repair and patch-selection stages
  bolted on for end-to-end scoring; ablations run on SWE-bench Common, a
  93-instance intersection of Lite and Verified.


  Function match rate is 65.33% (196) and file match 83.33% (250), against a
  reproduced Agentless-1.5 baseline at 58.67% (176) union-of-locations;
  resolved rate is 41.00% (123) versus 34.67% (104), a 6.33 percentage point
  gain, with function match precision 38.34% vs 29.01%. Search cost is about
  $0.87 per instance, editing about $0.90.


  The localization-to-repair link is measured against 1 reproduced baseline
  sharing the same repair stage and model, which isolates the localization
  component reasonably well; leaderboard comparisons are not matched on model
  or token budget. Ablations drop each component for roughly 3-5 percentage
  points (76.34% down to 70.97%-73.12%) on 93 instances only.


  Only 1 model and Python repositories were tested; the framework is claimed
  model-agnostic but open-source models were not run.


  If you build repair agents, treat action scheduling and context pruning as a
  tunable stage separate from the patcher.
