ingested_at: 2026-09-19
brief: >-
  Scaffolding the search process, rather than letting the LLM freely choose
  next actions, raises how often an agent finds the right function to fix.
  OrcaLoca adds a priority queue over LLM-proposed search actions, decomposes
  class/file skeletons into scored sub-actions via a sub-agent, and prunes
  retrieved context by shortest-path distance on a code graph to current
  candidate bug locations.


  The system runs on Claude-3.5-Sonnet-20241022 at temperature 0.1 over
  SWE-bench Lite (300 instances), with Agentless-1.5's repair, validation and
  patch-selection stages bolted on for end-to-end scores, and ablations on a
  93-instance "SWE-bench Common" intersection of Lite and Verified.


  Function match rate reaches 65.33% (196) and file match 83.33% (250), the
  best among open-source entries; resolved rate is 41.00% (123). Against a
  reproduced Agentless-1.5 baseline, that is +6.67 percentage points function
  match, +4.62 points function match precision, and +6.33 points resolved
  rate. Removing any single component costs 3-5 points on the 93-instance
  subset.


  The localization-to-repair attribution is clean because the repair stage is
  held fixed; the leaderboard comparison is not, since other systems differ in
  model and pipeline. 1 model family, Python repositories only, 1 benchmark
  subset, search cost about $0.87 per instance plus $0.90 editing.


  If you build repository agents, treat action scheduling and context pruning
  as tunable levers, not plumbing.
