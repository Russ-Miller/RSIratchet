summary: Recent developments in Large Language Model (LLM) agents are
  revolutionizing Autonomous Software Engineering (ASE), enabling automated
  coding, problem fixes, and feature improvements. However, localization --
  precisely identifying software problems by navigating to relevant code
  sections -- remains a significant challenge. Current approaches often yield
  suboptimal results due to a lack of effective integration between LLM agents
  and precise code search mechanisms. This paper introduces OrcaLoca, an LLM
  agent framework that improves accuracy for software issue localization by
  integrating priori
ingested_at: 2026-09-19
brief: >-
  Bug localization in large repositories improves more from managing the
  agent's action queue and pruning its context than from better prompting, and
  that localization gain carries through to patch success. OrcaLoca adds 3
  things on top of a graph index of the codebase: a priority queue over
  LLM-generated search actions with redundancy elimination, decomposition of
  class/file skeleton results into sub-actions ranked by a scoring sub-agent,
  and pruning of retrieved context by shortest-path distance to current
  candidate bug locations.


  Run with Claude-3.5-Sonnet-20241022 at temperature 0.1 on SWE-bench Lite
  (300 instances), with Agentless-1.5's repair, validation and patch selection
  bolted on for end-to-end scoring. It reaches 65.33% (196) function match and
  83.33% (250) file match, best among open-source entries on the leaderboard,
  and 41.00% (123) resolved. Against a self-reproduced Agentless-1.5 baseline:
  +6.67 percentage points function match, +4.62 percentage points function
  match precision, +6.33 percentage points resolved. It uniquely localized 6
  issues and resolved 8 not covered by Agentless, AutoCodeRover, or OpenHands.


  Ablations on SWE-bench Common (93 instances) remove each component and lose
  roughly 3–5 percentage points each, from 76.34% (71) down to 70.97% (66)
  without disambiguation decomposition. The leaderboard comparison is not
  matched on cost or tokens, and the baseline is the authors' own
  reproduction. 1 model, 1 language (Python), and no open-weight models
  tested. Search costs about $0.87 per instance, editing about $0.90.


  If you build repo-level agents, the result argues for spending engineering
  on retrieval scheduling and context hygiene rather than a bigger model.
