summary: Recent developments in Large Language Model (LLM) agents are
  revolutionizing Autonomous Software Engineering (ASE), enabling automated
  coding, problem fixes, and feature improvements. However, localization --
  precisely identifying software problems by navigating to relevant code
  sections -- remains a significant challenge. Current approaches often yield
  suboptimal results due to a lack of effective integration between LLM agents
  and precise code search mechanisms. This paper introduces OrcaLoca, an LLM
  agent framework that improves accuracy for software issue localization by
