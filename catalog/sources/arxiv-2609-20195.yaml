summary: >-
  Audio-language models increasingly generate confident music descriptions
  that are unsupported by the input audio. We present, to our knowledge, the
  first music-specific, layer-wise, multi-paradigm empirical study of
  hallucination in audio-language models and formulate it as a hierarchical
  perceptual grounding failure across five layers: sound events, temporal
  properties, tonal attributes, style, and emotion. We introduce MuseDiag, a
  multi-paradigm diagnostic framework with contradiction-based verification,
