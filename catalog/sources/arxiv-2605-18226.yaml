brief: >-
  A long fixed prefix can be replaced at inference time by a lookup table of
  precomputed attention outputs, built with forward passes only, so the model
  never attends to the prefix and still matches or beats full attention on
  some tasks.


  Attention-state memory (ASM) stores per-layer entries of (attention output,
  softmax denominator) keyed by clustered query vectors, then merges the
  retrieved entry into self-attention using the online-softmax identity.
  Evaluated on LLaMA 3.1-8B over 7 ManyICLBench tasks and the NBA bench of
  RuleArena (~20K-token rulebook), with entry counts of 1K-16K.


  On ICL, ASM matches or beats in-context learning on average from 1K to 8K
  entries and cuts attention latency 1.36x at 8K, with 1.8x at 16K entries for
  the optimized lookup. On the NBA bench it reaches 25.5 vs 24.1 for the
  20K-token full-rulebook baseline at 4K entries, i.e. 20% of the memory
  footprint. KVzip, a training-free KV compression baseline, underperforms
  both.


  Effects are measured, with a matched per-layer memory budget against KVzip
  and ICL, plus ablations on chunked construction (78.5 at 4K x 4 chunks vs
  79.0 for single 16K pass) and hierarchical lookup.


  Only 1 model in the main results, and gains vanish on reasoning tasks where
  ICL itself does not scale; accuracy is non-monotonic in entry count and
  crosses over at 16K when training data is too small to fill the codebook.


  If you serve a fixed reused prefix, this is a training-free alternative to
  prefix caching worth benchmarking.
