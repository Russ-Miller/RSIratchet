summary: "Modern large language model (LLM) applications increasingly rely on
  long conditioning prefixes to control model behavior at inference time.
  While prefix-augmented inference is effective, it incurs two structural
  limitations: i) the prefix's influence fades as generation proceeds, and ii)
  attention computation over the prefix scales linearly with its length.
  Existing approaches either keep the prefix in attention while compressing
  it, or internalize it into model parameters through gradient-based training.
  The former still attends to the prefix at inference, while the latter is
