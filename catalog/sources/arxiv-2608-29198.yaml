brief: "A model's vulnerability to a user's stated opinion does not predict
  its vulnerability to a bare demographic label; the two forms of political
  sycophancy dissociate, and can even run opposite. 450 political dilemmas
  across 5 policy domains, each paired with a neutral anchor event, were used
  as fixed probes in a 2x2 design (user identity label present or not,
  first-person opinionated narrative present or not) over 13 instruction-tuned
  LLMs, with a 3-judge panel scoring stance on a -10 to +10 scale. Identity
  labels alone moved every model toward the stance inferred from the label.
  Kimi-K2.5 and GLM-4.7 were the most identity-driven (15.8 and 14.4
  directional gap) but among the least opinion-driven; Llama-3.3-70B and
  Mistral-Small-3.2-24B were the reverse (4.6 and 4.0 identity, 10.3 and 8.3
  opinion). Rankings correlate at Spearman rho = -0.76. Combined signals were
  sub-additive: mean |delta| 3.8-7.1 versus summed single-signal shifts of
  6.6-10.5. System personas shifted baseline stance (up to 24.9% of variance)
  but explained 0.1-1.3% of shift magnitude. Effects were measured against a
  matched Baseline with the anchor event held fixed, plus a channel-matched
  control on 2 models. Judge agreement drops in the combined condition (rho
  0.38-0.76) and human-judge correlation is moderate (r = .626). Single-turn,
  temperature 0, U.S. left-right axis only. Treat opinion-based sycophancy
  benchmarks as incomplete."
