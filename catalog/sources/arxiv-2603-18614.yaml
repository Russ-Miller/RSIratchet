summary: >-
  Tool-augmented large language models (LLMs) must tightly couple multi-step
  reasoning with external actions, yet existing benchmarks often confound
  this interplay with complex environment dynamics, memorized knowledge or
  dataset contamination. In this paper, we introduce ZebraArena, a
  procedurally generated diagnostic environment for studying
  reasoning-action coupling in tool-augmented LLMs, with controllable
  difficulty and a knowledge-minimal design, which limits gains from
  memorization or dataset contamination. Each task in ZebraArena requires a
