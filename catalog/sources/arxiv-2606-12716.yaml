summary: >-
  The integration of Large Language Models (LLMs) and Multimodal LLMs
  (MLLMs) into scientific peer-review workflows introduces novel and
  significant risks for adversarial manipulation, especially given the
  multimodal nature of scientific papers where figures, not just text,
  convey core evidence. This creates a significant gap: current robustness
  studies on AI peer-review are overwhelmingly text-only. Moreover, the
  problem is distinct from standard jailbreaking, as a peer-review attack
