brief: >-
  A training-free quantity read straight off the output logits detects LLM
  errors better than trained probing classifiers once you leave the probe's
  training distribution. Reinterpreting the final softmax as an energy-based
  model, the authors note that two energies which the chain rule says should
  be equal across consecutive decoding steps are not, and define that gap as
  spilled energy, plus a single-step marginal energy.


  Evaluation covers 9 benchmarks (HotpotQA, IMDB, Math, MNLI, Movies,
  TriviaQA, Winobias, Winogrande) on LLaMA-3 and Mistral in base and instruct
  form, Gemma-Instruct 1B and 4B, and synthetic 13-digit arithmetic with
  injected errors of 3 magnitudes using Llama-3 8B, Qwen-3 8B,
  Mistral-7B-Instruct.


  Average AuROC for Spilled ΔE with min pooling reaches 73.16 on
  LLaMA-Instruct and 77.49 on Mistral-Instruct, against 64.16 and 65.56 for
  Orgad et al. probes and 54.62 and 63.44 for logit confidence. Probes
  cross-tested off-diagonal sit near 62−64%. Restricting to exact answer
  tokens adds +24.06 for spilled energy versus +9.23 for logits.


  The probe comparison uses cross-dataset averages, which is the fair setting,
  and pooling and exact-answer-span choices are ablated; variance across
  datasets is large (±15−25 AuROC) and some scores fall well below chance,
  e.g. 14.37 on IMDB.


  It fails on Winogrande and Winobias (near 50) and on semantically empty
  tokens like punctuation. Treat it as a cheap default detector where no
  task-specific probe can be trained.
