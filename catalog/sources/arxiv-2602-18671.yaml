summary: We reinterpret the final Large Language Model (LLM) softmax
  classifier as an Energy-Based Model (EBM), decomposing the
  sequence-to-sequence probability chain into multiple interacting EBMs at
  inference. This principled approach allows us to track "energy spills"
  during decoding, which we empirically show correlate with factual errors,
  biases, and failures. Similar to Orgad et al. (2025), our method localizes
  the exact answer token and subsequently tests for hallucinations. Crucially,
  however, we achieve this without requiring trained probe classifiers or
  activation ablations. Instead, we intro
