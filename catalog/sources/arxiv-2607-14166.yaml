brief: >-
  Approval gates, cancellation, and timeouts in agent frameworks do not
  actually block side effects. On all 6 widely used open-source frameworks
  tested, the barrier semantics implied by the documentation fail.


  Model-free differential probes isolate a "sibling leak": an approval gate
  suspends its own branch while a sibling branch's effect runs during the
  pause, defeating rejection. This appeared in every framework shipping a
  pre-execution gate (5 of 6, spanning 4 execution models and 2 language
  runtimes), alongside replay double-execution, cancellation orphans, and
  timeout zombies.


  The hazard is reachable by real models: frontier models emit the
  leak-triggering plan shape at rates up to 14%, and live models driving
  unmodified frameworks leaked 215 of 1,200 runs, with P(leak | emitted)=1.00.
  On naturalistic tau-bench episodes models serialize writes, so the everyday
  gap stays latent; injection induces it deterministically. A 13-incident
  public corpus corroborates the replay and cancellation failures.


  The proposed fix, SOUNDGATE, is an external Rust admission gate. Its core is
  verified with Verus, TLA+/TLC to 7.5e7 states, TLAPS, and Loom, plus
  differential conformance over 1.2e7 operations with zero divergences. It
  blocks every measured violation on all 6 frameworks, with zero refusals on
  gated tau-bench episodes at ~1 ms per write and ~12k admissions per second.


  Evidence is measurement plus mechanical proof, but guarantees hold only
  under the stated complete-mediation contract, discharged for network egress
  by 2 kernel-enforced routes; closed-source frameworks and other effect
  channels are untested. If you rely on a framework's pause or cancel as a
  safety boundary, verify it yourself.
