brief: >-
  RL post-training of multimodal models improves visual reasoning even when
  the visual input during training is blank or mismatched, which suggests GRPO
  is mostly amplifying the language model's reasoning rather than teaching it
  to see.


  The Hallucination-as-Cue framework applies 3 corruptions to training and
  test data: blank image replacement (BI), random image replacement (RI), and
  textual information removal (TR). Qwen2.5-VL-3B and 7B were trained with
  GRPO on Geometry3K, MMR1-V0, and CLEVR, then evaluated on MathVision,
  MathVerse, MathVista, and WeMath.


  For 3B, clean GRPO averaged 44.74 vs 39.72 base, and corrupted variants
  still reached 42.25-42.45. For 7B, GRPO-RI averaged 54.23, above clean GRPO
  at 53.52. On Geometry3K-BI the 7B went 9.7% to 14.1% while 3B went 7.6% to
  10.4%. Under BI inference the 3B gained +0.72 on MathVision, where images
  apparently distract.


  The effect was measured, with a separate run per corruption type and
  clean-GRPO and base-model baselines, plus replication across 3 training
  datasets and 2 model sizes. All results are 1 model family, 1 RL algorithm,
  and mostly visual math; the margins on 7B are small enough that no seed
  variance is reported.


  If you attribute RL gains in MLLMs to visual grounding, this is reason to
  check against an image-corrupted control.
