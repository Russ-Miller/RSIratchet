summary: The recent success of reinforcement learning (RL) in large reasoning
  models has inspired the growing adoption of RL for post-training Multimodal
  Large Language Models (MLLMs) to enhance their visual reasoning
  capabilities. Although many studies have reported improved performance, it
  remains unclear whether RL training truly enables models to learn from
  visual information. In this work, we propose the Hallucination-as-Cue
  Framework, an analytical framework designed to investigate the effects of
  RL-based post-training on multimodal reasoning models from the perspective
  of model hallucination. Sp
