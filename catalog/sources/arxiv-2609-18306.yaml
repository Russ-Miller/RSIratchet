summary: >-
  Large language models (LLMs) are increasingly deployed in applications
  involving interaction between agents, where their output plays a role in
  collective reasoning and decision-making processes. Despite significant
  research into the functioning of LLMs in such multi-agent systems, the
  processes of bias propagation in such systems are still a challenge. This
  work studies how biased opinions are propagated in the form of textual
  interaction in an environment of LLMs, in which a minority of agents
  maintain persistent extreme opinions, while the remaining agents
  iteratively update their beliefs t
