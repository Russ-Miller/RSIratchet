brief: >-
  Which skill combinations you synthesize matters more than how much data you
  synthesize: 4K structurally selected multi-skill examples beat 52K general
  instruction samples, which actively degrade instruct-tuned models.


  STEPS builds a skill co-occurrence graph from tagged instructions, induces a
  hierarchy by greedily minimizing structural entropy, then picks k-skill
  tuples that maximize conditional structural entropy within local subtrees.
  Fine-tuning covers Qwen-2.5-7B, Llama-3-8B and Mistral-7B-v0.3 (base and
  instruct), evaluated on MT-Bench, AlpacaEval 2.0 and WildBench.


  Llama-3-8B base WB-Score goes from -25.7 to 23.0; instruct 36.3 vs 30.8 for
  Instruct-SkillMix. Alpaca52k drops Qwen-2.5-7B-Instruct from 45.4 to -11.4
  and Llama-3-8B-Instruct MT-Bench from 6.94 to 5.04. Moving from k=1 to k=2
  lifts WB-Score from -22.75 to 23.91; a k in [1,6] mixture peaks at 31.52.


  Measured, with a matched 4K budget against Instruct-SkillMix, plus ablations
  on k, data volume (26.72 at 2K to 33.11 at 5K), curriculum order (33.09 vs
  31.48 at 8K), and unconstrained entropy maximization, which hurts instruct
  models (45.43 to 35.14).


  Judging is LLM-based (GPT-4o for WB-Score), models are 7B-8B, and the
  agentic SkillBench results are evaluation-only, not training. Treat
  compositional density, not volume, as the lever for instruction-tuning data.
