brief: >-
  Which skill combinations you synthesize matters more than how much data you
  synthesize: 4K examples chosen to maximize structural information gain over
  an induced skill hierarchy beat 52K generic instruction samples, which
  actively degrade instruct-tuned models.


  STEPS builds a skill co-occurrence graph, merges nodes by minimizing
  structural entropy into a taxonomy, then greedily picks k-skill tuples
  maximizing conditional structural entropy, with search restricted to local
  subtrees to keep combinations coherent. Base and instruct versions of
  Qwen-2.5-7B, Llama-3-8B and Mistral-7B-v0.3 were fine-tuned and evaluated on
  MT-Bench, AlpacaEval 2.0 and WildBench.


  Llama-3-8B Base WB-Score goes from -25.7 to 23.0; the instruct version
  reaches 36.3 vs 30.8 for Instruct-SkillMix. Alpaca52k drops
  Qwen-2.5-7B-Instruct from 45.4 to -11.4 and Llama-3-8B-Instruct MT-Bench
  from 6.94 to 5.04. Moving from atomic to 2-skill data lifts WB-Score from
  -22.75 to 23.91; mixing k in [1,6] peaks at 31.52.


  Evidence is measured, with matched 4K budgets against Instruct-SkillMix, an
  unconstrained-entropy ablation (Qwen-2.5-Instruct falls to 35.14 without the
  coherence constraint), and a curriculum variant at 8K (33.09 vs 31.48).
  Judging is LLM-based, 7-8B models only, no independent replication.


  On the SkillBench agentic benchmark all models decay past Skill@4, and
  tool-trained models (AutoTIR 4.09, ReSearch 4.40, SearchR1 4.54) do not beat
  their instruct baselines (Qwen2.5-7B 5.04).


  If you are curating post-training data, treat structural coverage of skill
  pairs as the lever, not volume.
