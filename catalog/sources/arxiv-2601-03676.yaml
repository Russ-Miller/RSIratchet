brief: >-
  Structuring synthetic instruction data around a hierarchical skill taxonomy,
  rather than pairing skills at random, produces better compositional
  generalization at a fixed 4K-sample budget. Unconstrained maximization of
  skill diversity actually hurts already-instruction-tuned models.


  STEPS builds a skill co-occurrence graph, induces a taxonomy by greedily
  minimizing structural entropy, then selects k-tuples that maximize marginal
  conditional structural entropy within local subtrees. Fine-tuning
  Qwen-2.5-7B, Llama-3-8B and Mistral-7B-v0.3 (base and instruct) on 4K
  samples, evaluated on MT-Bench, AlpacaEval 2.0 and WildBench against
  Instruct-SkillMix (4K, random pairing) and Alpaca52k.


  Llama-3-8B Instruct WB-Score reaches 36.3 vs 30.8 for Instruct-SkillMix; the
  base model goes from -25.7 to 23.0. Alpaca52k degrades instruct models,
  Qwen-2.5-7B falling from 45.4 to -11.4. Moving from k=1 to k=2 lifts
  WB-Score from -22.75 to 23.91; a k∈[1,6] mixture peaks at 31.52.
  Unconstrained entropy maximization drops Qwen-2.5-Instruct from 45.43 to
  35.14.


  The sweet-spot claim is isolated by a direct ablation against unconstrained
  selection, and curriculum ordering is tested at matched 8K budget. Only 3
  7–8B models, 1 synthesis baseline, LLM-judge metrics throughout.


  On the new SkillBench agentic benchmark, all models decay past Skill@4, and
  tool-trained models (AutoTIR 4.09, ReSearch 4.40, SearchR1 4.54) do not beat
  their instruct baselines (5.04–5.21).


  If you synthesize post-training data, structure beats volume here, but
  coherence constraints matter more than raw diversity.
