summary: Reinforcement Learning from Human Feedback (RLHF) remains
  indispensable for aligning large language models (LLMs) in subjective
  domains. To enhance robustness, recent work shifts toward Generative Reward
  Models (GenRMs) that generate rationales before predicting preferences. Yet
  in GenRM training and evaluation, practice remains outcome-label-only,
  leaving reasoning quality unchecked. We show that reasoning fidelity-the
  consistency between a GenRM's preference decision and reference decision
  rationales-is highly predictive of downstream RLHF outcomes, beyond standard
  label accuracy. Specifical
