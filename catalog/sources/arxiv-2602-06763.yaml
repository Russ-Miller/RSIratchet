brief: >-
  Generative reward models often pick the right response for the wrong reason,
  and label accuracy on reward benchmarks hides it. Two GenRMs with
  near-identical benchmark scores produced opposite RLHF outcomes: Qwen3-14B
  (74.1 HelpSteer3, 87.9 RewardBench2, 65.2 PPE-Preference) kept improving a
  Qwen3-8B policy while RRM-32B (74.7, 88.5, 65.1) collapsed it.


  The authors define Spurious Correctness (S-Corr), the share of label-correct
  judgments whose rationale conflicts with a Gemini-3-Pro-written golden
  rationale, plus a Fidelity Score combining both. RRM-32B showed 59.0% /
  36.7% / 62.4% S-Corr versus 40.0% / 20.1% / 36.9% for Qwen3-14B. S-Corr is
  widespread: Qwen3-4B-Instruct-2507 hits 44.8% on HelpSteer3, and thinking
  variants beat their non-thinking counterparts across the board.


  R-Align grants reward only when both verdict and rationale pass a
  GPT-OSS-120B meta-judge. It lifted Qwen3-14B's HelpSteer3 F-Score to 54.0
  (+13.9 over RLVR) and raised downstream policy average to 61.7 vs 59.4 for
  RLVR. F-Score correlated with downstream RLHF at r=0.947/0.924/0.963; L-Acc
  at 0.366/0.382/0.220.


  Hyperparameters were matched between RLVR and R-Align, isolating the reward
  change, but training used 1 model family (Qwen3), 1 policy, and golden
  rationales plus benchmark meta-judging came from a single proprietary model
  whose validation against humans sits in an appendix. The correlation is over
  few points.


  If you evaluate reward models by pairwise accuracy, that number is close to
  useless for predicting RLHF outcomes.
