brief: >-
  Frontier models judge syllogism validity almost perfectly while ignoring
  conclusion believability, the reverse of the human belief-bias pattern;
  weaker models show the human-like bias instead.


  160 syllogisms (40 handcrafted bases plus nonsense-predicate,
  premise-order-switched, and combined variants) were labelled twice:
  syntactic validity and real-world believability. 14 models from 8
  organizations (1B to 671B, dense and MoE) were run under 4 prompting
  strategies (zero-shot, one-shot, few-shot, zero-shot CoT) and 3
  temperatures, with majority voting at temperature above 0, for 26,880
  evaluations.


  Syntax accuracy averaged 81.7% against 56.2% NLU accuracy. Gemini 2.5 Flash
  reached 99.6% syntax and 51.7% NLU (47.9 pp gap); Llama 3.2 1B Instruct
  scored 51.9%. 12 of 14 models favoured congruent over incongruent items
  (mean +10.81 pp, p = 0.0280, d = 0.66), with bias shrinking as accuracy rose
  (rho = -0.565). Few-shot underperformed zero-shot by 3.57 pp (p = 0.0165,
  surviving Holm-Bonferroni), though the overall strategy test was null (p =
  0.356).


  Effects are measured, with within-model congruent/incongruent contrasts,
  matched content variants, and instance-level McNemar tests; 1 dataset of 160
  items and no fine-tuning controls, so the accuracy-bias link stays
  correlational.


  Only categorical syllogisms were tested; nested quantifiers, modal
  operators, and adversarial distractors were not.


  Treat belief bias as a property of weaker models, not of LLMs generally.
