brief: >-
  Frontier models solve categorical syllogisms as formal objects and ignore
  whether the conclusion is plausible, the reverse of the human pattern.
  Belief bias still shows up, but mainly in weaker models.


  160 syllogisms (40 handcrafted bases plus nonsense-predicate,
  premise-order-switched, and combined variants) were labelled twice:
  syntactic validity and real-world believability. 14 models from 8
  organizations (1B–671B, dense and MoE) were run across 4 prompting
  strategies and 3 temperatures, with majority voting over up to 10 samples,
  for 26,880 evaluations.


  Mean syntax accuracy was 81.7% versus 56.2% NLU accuracy, a 25.50pp gap.
  Gemini 2.5 Flash reached 99.6% syntax with 51.7% NLU; Llama 3.2 1B Instruct
  sat at 51.9%. 12 of 14 models favoured congruent over incongruent items
  (mean +10.81 pp, p = 0.0280, d = 0.66), with bias shrinking as accuracy rose
  (ρ = −0.565). Few-shot underperformed zero-shot (79.1% vs 82.7%, Δ = −3.57
  pp, p = 0.0165), though a Friedman test over all 4 strategies found no
  effect (p = 0.356).


  The within-model congruent/incongruent contrast isolates bias cleanly; the
  strategy claim is weaker, with McNemar showing error redistribution (786 vs
  546) rather than a robust median gain. Temperature had no effect under
  adaptive stopping.


  Only categorical syllogisms, no nested quantifiers or modal operators, no
  adversarial distractors, and the believable/unbelievable split is skewed (38
  believable vs 122).


  If you treat logic benchmarks as proxies for human-like reasoning, this
  suggests the top models are drifting the other way.
