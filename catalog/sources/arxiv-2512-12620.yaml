brief: >-
  Frontier models judge syllogisms as formal objects, not as plausible claims:
  the strongest ones score near-perfectly on logical validity while sitting at
  chance on whether the conclusion is believable, the inverse of the human
  belief-bias pattern.


  14 models from 8 organizations (1B to 671B, dense and MoE) were tested on
  160 syllogisms built from 40 handcrafted base items plus nonsense-predicate,
  premise-order-switched, and combined variants, each labelled twice:
  syntactic validity and real-world believability. 4 prompting strategies
  (zero-shot, one-shot, few-shot, zero-shot CoT) x 3 temperatures gave 26,880
  evaluations, with self-consistency voting at temperature > 0.


  Mean syntax accuracy was 81.7% versus 56.2% NLU accuracy, a 25.50pp gap;
  Gemini 2.5 Flash hit 99.6% syntax and 51.7% NLU, while Llama 3.2 1B Instruct
  reached 51.9% syntax. 12 of 14 models favoured congruent over incongruent
  items (mean +10.81 pp, p = 0.0280, d = 0.66), and bias shrank with accuracy
  (rho = -0.565). Few-shot underperformed zero-shot (-3.57 pp, p = 0.0165),
  though the Friedman test over all 4 strategies showed no effect (p = 0.356).


  Effects are measured within-model on matched congruent/incongruent items,
  which isolates bias from overall skill, but the strategy result is fragile:
  Wilcoxon fails after correction, and McNemar shows mainly error
  redistribution (786 vs 546).


  Only categorical syllogisms, 40 base items, no nested quantifiers, modal
  operators, or adversarial distractors; the NLU "chance" result partly
  reflects 122 of 160 conclusions being unbelievable or abstract.


  If you treat belief bias as evidence of human-like reasoning, strong models
  no longer show it.
