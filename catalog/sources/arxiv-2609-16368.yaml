summary: >-
  Vision-language models (VLMs) can generate routes directly from aerial
  imagery for off-road navigation, but their predictions provide no
  indication of reliability. We present UDAV, an Uncertainty-Driven Adaptive
  VLM Waypoint Planner for UAV-guided UGV navigation. UDAV draws multiple
  stochastic trajectory predictions, selects their medoid as a
  self-consistent nominal route, and estimates predictive uncertainty from
  their spatial dispersion. When the maximum uncertainty across interior
  waypoints exceeds a threshold, UDAV invokes a reconsideration stage;
  otherwise, it returns the medoid directly.
notes: >-
  Filed as a source on planning from the classifier's judgement that the
  paper is about it (improves, medium): The paper proposes stochastic medoid
  selection plus uncertainty-triggered reconsideration that reduces
  trajectory displacement error by 25% versus deterministic route
