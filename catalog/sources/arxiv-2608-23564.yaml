summary: "Modern software systems accumulate technical debt over decades of
  development, which makes migration expensive and largely manual. As coding
  agents become increasingly capable at bug fixing, can they autonomously
  perform such migrations? Existing benchmarks cannot answer this question
  because they evaluate only behavioural correctness, not whether the
  migration actually occurred. This leads an easy hack: agents copy the
  original implementation to make tests pass. We call this Blindness. To
  address this problem, we introduce SWE Refactor Bench, a benchmark
  comprising 20 whole-repository migrati"
