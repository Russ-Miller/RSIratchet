brief: >-
  A frozen model's hidden states carry a usable signal about whether that
  model can solve the instance in front of it, and whether it should clarify,
  call a tool, or abstain, better than the model's own stated behaviour.
  Multi-Head Latent Control attaches 2 small heads to a frozen LLM or VLM: a
  Capability Head on the final-layer trace of generated tokens predicting
  adequacy versus handoff to a stronger model, and a Resolution Head on a
  middle-layer trace choosing clarification, tool use, abstention, or direct
  answering.


  Tested on Qwen3-VL, Qwen3.5 and Gemma backbones from 2B to 32B over CharXiv,
  MathVerse, MathVista, ScreenSpot-Pro, SimpleVQA, MMLU-Pro, AndroidWorld,
  When2Call and TriviaQA. Routed execution cut paid large-model cost 27-53%
  overall, and on AndroidWorld Qwen3-VL-4B to 32B went from 0.47 to 0.60 score
  with a 90.7% cost reduction. On When2Call, Qwen-VL-2B F1 rose 37.3 to 49.0
  and accuracy 52.7 to 65.1. On TriviaQA, Qwen3-VL-4B score rose 0.231 to
  0.756 (+158.9%) with missed needed web calls down 708 to 244.


  Measured, with layer ablations, a training-mixture ablation, a prompt-level
  self-abstention baseline and a token-confidence baseline, both of which
  underperformed. Cost is an estimated token-based proxy, labels come from an
  LLM judge, the small model is assumed free, and routed scores sometimes fall
  slightly below the large model. Useful if you deploy small-plus-large
  cascades and want instance-level escalation without retraining the backbone.
