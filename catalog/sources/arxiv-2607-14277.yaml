summary: >-
  Large language models are increasingly deployed as agents, but reliable
  agentic behavior requires more than next-token prediction. At inference
  time, it is preferred that an agent can decide whether to proceed with its
  current reasoning, defer to a stronger model, request additional
  information, invoke external tools, or abstain under the given setup.
  Existing approaches address these decisions through prompt-level routing,
  external orchestration, or task-specific fine-tuning, which primarily rely
  on input-side signals, and are often costly and difficult to maintain as
  model backbones evolve.
