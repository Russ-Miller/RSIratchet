brief: >-
  Pairing a strong LLM with a weak one can score worse than pairing 2 weak
  models together. Across GSM8K, MBPP and CVRP, strong-weak agent pairs
  averaged 45.0%, 36.5% and 65.0%, against weak-weak averages of 52.0%, 40.0%
  and 69.3% on the same tasks, a 7 percentage point loss on GSM8K and 3.5 on
  MBPP.


  The setup pairs GPT-4o and Claude-3.5-Sonnet as guides with Qwen-2.5-0.5B
  and Llama-3.2-1B as solvers, over 50 GSM8K problems, 50 MBPP problems and 20
  CVRP instances, in Framework-Solver, Framework-Implementer and
  Proposer-Validator roles. The proposed fix scores the weak agent's reply on
  5 entropy components and picks light, moderate or intensive guidance, plus a
  TF-IDF retrieval store of past successes.


  Against a No-Guidance baseline, the guided method reached 64.0% on GSM8K (vs
  45.0%, and 51.0% for Chain-of-Thought), 43.5% on MBPP (tied with CoT), and
  71.6% on CVRP. Adding retrieval gave 69.0%, 46.0% and 81.3%.


  The negative-synergy effect is measured and reproduced across 4 strong-weak
  pairs, but the fix mixes 2 changes and only RAG is separated; guidance alone
  adds nothing on MBPP. Samples are small (20-50 items), weak models are
  0.5B-1B, and there is no matched token-budget baseline, so some of the gain
  may be extra interaction rounds.


  Treat capability gap as a cost, not a free complement, when composing agent
  teams.
