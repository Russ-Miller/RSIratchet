brief: >-
  Splitting task planning and safety checking across 2 separate LLMs cuts
  detected safety violations in multi-robot plans without inflating step
  counts, but the violations are counted by another LLM.


  SAFER pairs a Task Planning LLM with a Safety Planning LLM that audits and
  refines each plan, adds per-robot Execution LLMs plus a feedback loop, and
  scores final plans with an LLM-as-a-Judge against 15 risk criteria.
  Evaluation uses 40 tasks from the COHERENT multi-agent benchmark, 8 per
  scene across 5 scenes, split 2 mono-type, 3 dual-type, 3 trio-type, with
  GPT-4o and DeepSeek-r1.


  Against the GPT-4o baseline without SAFER, average safety violations fall
  47% with GPT-4o and 77.5% with DeepSeek-r1. Average steps stay comparable,
  for example 15.8 to 12.1 in scene S1, though DeepSeek-r1 uses more steps
  than GPT-4o. Overhead is 2 extra API calls per step.


  The effect is measured, but the outcome metric is itself an LLM judgment,
  with no human-annotated violation count and no ablation separating the
  safety LLM from the feedback module. Hardware validation is 1 task with 2
  Kuka arms and 1 human, reported as a successful run rather than a success
  rate.


  Treat the violation reductions as evidence about plan auditing by a second
  model, not as calibrated safety measurement.
