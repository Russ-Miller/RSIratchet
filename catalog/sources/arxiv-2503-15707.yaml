summary: The integration of large language models (LLMs) into robotic task
  planning has unlocked better reasoning capabilities for complex,
  long-horizon workflows. However, ensuring safety in LLM-driven plans remains
  a critical challenge, as these models often prioritize task completion over
  risk mitigation. This paper introduces SAFER (Safety-Aware Framework for
  Execution in Robotics), a multi-LLM framework designed to embed safety
  awareness into robotic task planning. SAFER employs a Safety Agent that
  operates alongside the primary task planner, providing safety feedback.
