brief: >-
  Splitting task planning and safety checking across 2 separate LLMs cuts
  safety violations in multi-robot plans without inflating step counts, where
  a single planner holding both roles trades context between task history and
  safety rules. SAFER pairs a Task Planning LLM with a Safety Planning LLM
  that audits and revises sequences, adds per-robot Execution LLMs and a
  feedback loop, and scores final plans with an LLM-as-a-Judge against 15 risk
  criteria. Control Barrier Functions enforce joint and operational-space
  constraints at the controller.


  Evaluation used 40 tasks from the COHERENT heterogeneous-agent benchmark, 8
  per scene (2 mono-type, 3 dual-type, 3 trio-type), against a GPT-4o planner
  with no safety module. Average safety violations fell 77.5% with DeepSeek-r1
  and 47% with GPT-4o, with average steps broadly comparable; overhead is 2
  extra API calls per step.


  The reduction is measured, but the metric is the framework's own LLM judge
  with no human-rated ground truth, and the violation counts for the stronger
  reasoner are not separated from its general planning quality. There is 1
  baseline, 2 models, 5 scenes, and the hardware run is a single demonstration
  on 2 Kuka IIWA arms with no repeated trials or failure rate.


  Treat the violation-reduction numbers as judge-relative, and the hardware
  section as existence proof rather than measurement.
