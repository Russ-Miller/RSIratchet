brief: >-
  Splitting task planning and safety checking across 2 separate LLMs cuts
  unsafe robot plans more than prompting a single planner to do both, and the
  authors attribute this to sidestepping the context-window trade-off between
  task history and safety rules. SAFER pairs a Task Planning LLM with a Safety
  Planning LLM that audits and revises each plan, adds per-robot Execution
  LLMs and a feedback loop, scores final plans with an LLM-as-a-Judge against
  15 risk criteria, and compiles the safety LLM's natural-language constraints
  into Control Barrier Functions at the controller level.


  Evaluation uses 40 tasks from the COHERENT multi-agent benchmark, 8 per
  scene across 5 scenes (2 mono-type, 3 dual-type, 3 trio-type), measuring
  average steps and average safety violations. Reported reductions in average
  safety violations are 77.5% for the DeepSeek-r1 variant and 47% for GPT-4o,
  with per-scene ASV falling from 32.6 to 17.6 in S1 and 51.5 to 16.8 in S3,
  while step counts stay comparable; overhead is 2 extra API calls per step.


  The comparison is to a single non-safety GPT-4o planner only, with no
  matched-token-budget baseline, no ablation separating the safety LLM from
  the feedback module or CBFs, 2 models, and safety violations scored by the
  same family of LLMs being evaluated. The hardware demonstration is 1 task
  with 2 Kuka arms, reported as a successful run rather than a measured
  success rate.


  Treat the size of the effect as indicative; the architectural claim is
  better supported than the numbers.
