brief: >-
  Splitting task planning from safety checking across 2 LLMs cuts safety
  violations in multi-robot plans more than asking 1 model to do both, because
  the safety rules never have to compete for the planner's context window.
  Left unprompted, the planners default to short, fast plans that omit
  preconditions and create spatial conflicts.


  SAFER pairs a Task Planning LLM with a Safety Planning LLM that audits and
  revises each sequence, adds per-robot Execution LLMs and a feedback loop,
  and scores final plans with an LLM-as-a-Judge against 15 risk criteria.
  Evaluation used 40 tasks from the COHERENT heterogeneous multi-agent
  benchmark, 8 per scene across 5 scenes (2 mono-type, 3 dual-type, 3
  trio-type), with GPT-4o and DeepSeek-r1.


  Average safety violations fell 77.5% with DeepSeek-r1 and 47% with GPT-4o
  versus the GPT-4o non-safety baseline, with average steps often lower too;
  overhead is 2 extra API calls per step.


  The comparison is against 1 baseline, GPT-4o without SAFER, with no ablation
  separating the Safety LLM from the feedback module or the execution checks,
  and the violation metric is produced by an LLM judge rather than an external
  oracle. The hardware demonstration is 1 successful run with 2 Kuka arms and
  1 human, not a measured success rate, and CBFs were not evaluated
  separately.


  Treat the violation reductions as directional evidence that role separation
  helps, not as a calibrated safety guarantee.
