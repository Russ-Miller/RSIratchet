brief: >-
  Splitting safety checking off into a second LLM, rather than loading safety
  rules into one planner's prompt, cuts detected hazards in multi-robot task
  plans without much added step count. SAFER pairs a Task Planning LLM with a
  Safety Planning LLM that audits and refines sequences, adds per-robot
  Execution LLMs and a feedback loop, scores plans with an LLM-as-a-Judge
  against 15 risk criteria, and enforces the resulting constraints at the
  control level through Control Barrier Functions.


  Evaluation uses the COHERENT multi-agent benchmark, 40 tasks total, 8 per
  scene (2 mono-type, 3 dual-type, 3 trio-type), with GPT-4o and DeepSeek-r1
  as planners. Against a GPT-4o non-safety baseline, average safety violations
  drop 47% with GPT-4o and 77.5% with DeepSeek-r1; average steps fall in most
  scenes for GPT-4o but rise for DeepSeek-r1 (e.g. 15.8 to 20.5 in S1).
  Overhead is 2 extra API calls per step.


  The effect is measured, but the only baseline is a single-LLM GPT-4o planner
  with no safety prompt, so the comparison does not isolate multi-LLM
  decoupling from simply mentioning safety. The violation metric is produced
  by an LLM judge, and the authors' claim that such judges avoid
  self-preference bias is argued, not tested. Hardware validation is 1
  qualitative run with 2 Kuka arms and 1 human, no success rates.


  Treat the magnitude as indicative; the architecture claim needs a
  prompt-matched baseline.
