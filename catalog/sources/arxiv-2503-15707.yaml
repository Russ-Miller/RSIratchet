brief: >-
  Splitting task planning and safety auditing across 2 separate LLMs cuts
  safety violations in robot plans without much efficiency cost, and when no
  safety instruction is given, planners default to fast plans that omit hazard
  checks.


  SAFER pairs a Task Planning LLM with a Safety Planning LLM that audits and
  refines each plan, adds per-robot Execution LLMs and a feedback loop, and
  scores plans with an LLM-as-a-Judge against 15 risk criteria. Control
  Barrier Functions enforce joint and workspace constraints at the controller.
  Evaluation used 40 tasks from the COHERENT multi-agent benchmark (5 scenes,
  8 tasks each: 2 mono-type, 3 dual-type, 3 trio-type), with GPT-4o and
  DeepSeek-r1.


  Average safety violations fell 47% with GPT-4o and 77.5% with DeepSeek-r1
  relative to the GPT-4o non-safety baseline. Average steps were comparable or
  lower for SAFER-GPT-4o, higher for SAFER-r1. Added latency and cost were
  small, attributed to 2 extra API calls per step.


  The effect is measured, but the outcome metric is the paper's own LLM judge,
  with no human-labelled violations and no matched-token-budget single-LLM
  baseline carrying the same safety prompt. Only 1 non-safety baseline
  (GPT-4o) was run, so the r1 gain confounds framework and model.


  Hardware used 2 Kuka IIWA arms on mobile bases, Vicon tracking, 1 task, 1
  human, reported as a successful run without quantitative comparison.


  Treat the violation reductions as suggestive of role decomposition helping,
  not as a validated safety guarantee.
