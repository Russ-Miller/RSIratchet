brief: >-
  Splitting task planning and safety checking across 2 LLMs cuts the number of
  hazardous steps in robot plans more than prompting 1 planner to do both, and
  the gain tracks with how strong the reasoning model is. SAFER pairs a Task
  Planning LLM with a Safety Planning LLM that audits and revises each plan,
  adds per-robot execution LLMs and a feedback loop, and scores final plans
  with an LLM-as-a-Judge against 15 risk criteria. Control Barrier Functions
  enforce joint and workspace constraints at the controller level.


  Evaluation uses 40 tasks from the COHERENT multi-agent benchmark, 8 per
  scene across 5 scenes, split 2 mono-type, 3 dual-type, 3 trio-type. Average
  safety violations drop 47% with GPT-4o and 77.5% with DeepSeek-r1 relative
  to GPT-4o without SAFER; average steps stay comparable, with DeepSeek-r1
  taking more steps. Overhead is 2 extra API calls per step.


  The effect is measured but the metric is the paper's own LLM judge, so the
  outcome variable and the method share a model family. There is no
  matched-token-budget single-LLM baseline, no human annotation of violations,
  and only 2 planner models. The hardware demonstration is 1 task with 2 Kuka
  arms and 1 tracked human, reported as a successful run rather than a
  statistic.


  Treat the violation reductions as suggestive of role decomposition helping,
  not as calibrated safety measurement.
