brief: >-
  Splitting task planning from safety checking across 2 LLMs cuts the number
  of safety violations an LLM planner writes into multi-robot plans, without
  inflating step counts much. The usual picture, that a single LLM asked to
  plan will trade off hazard checks against task efficiency when its context
  is crowded, is supported here.


  SAFER pairs a Task Planning LLM with a Safety Planning LLM that audits and
  refines each plan, adds per-robot Execution LLMs and a feedback loop, and
  scores final plans with LLM-as-a-Judge against 15 risk criteria. Evaluation
  uses 40 tasks from the COHERENT heterogeneous multi-agent benchmark, 8 per
  scene across 5 scenes, split 2 mono-type, 3 dual-type, 3 trio-type, with
  GPT-4o and DeepSeek-r1.


  Average safety violations fall from 32.6 to 17.6 in scene S1 for GPT-4o and
  to 5.8 with DeepSeek-r1; the paper reports 47% reduction in ASV for GPT-4o
  and 77.5% for the stronger reasoner. Average steps change little (15.8 to
  12.1 for S-4o, 20.5 for S-r1). Overhead is 2 extra API calls per step.


  The violation metric is produced by an LLM judge, so the headline effect is
  measured by the same class of model being evaluated, with no human-annotated
  ground truth and no matched-token baseline. 2 models, 1 benchmark, 40 tasks.
  Control Barrier Functions and the hardware run with 2 Kuka IIWA 7 DoF arms
  are a demonstration, not an ablation.


  Treat the magnitude as soft and the architecture as the usable part.
