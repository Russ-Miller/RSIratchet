brief: >-
  Splitting safety checking off into a second LLM, rather than loading safety
  rules into one planner's prompt, cuts detected safety violations in
  multi-robot task plans without much added length. SAFER pairs a Task
  Planning LLM with a Safety Planning LLM that audits and refines plans, adds
  per-robot Execution LLMs and a feedback loop, and scores final plans with an
  LLM-as-a-Judge against 15 risk criteria. Control Barrier Functions enforce
  constraints at the controller level.


  Evaluation uses 40 tasks from the COHERENT multi-agent benchmark across 5
  scenes, 8 per scene (2 mono-type, 3 dual-type, 3 trio-type), with GPT-4o and
  DeepSeek-r1. Against the GPT-4o non-safety baseline, average safety
  violations fall by 47% with GPT-4o and 77.5% with DeepSeek-r1; average steps
  drop in most scenes for GPT-4o but rise for DeepSeek-r1 (e.g. 15.8 to 20.5
  in S1). Overhead is attributed to 2 extra API calls per step.


  The safety metric is itself an LLM judge, so the headline reduction is
  partly self-graded, and there is no human-labelled violation count, no
  ablation separating the Safety LLM from the feedback and execution modules,
  and no RAG or few-shot baseline despite the paper arguing against them.
  Hardware validation is 1 scripted task on 2 Kuka IIWA arms, reported as
  successful without trials or failure counts.


  Treat the violation reductions as evidence that role separation helps, not
  as a calibrated safety guarantee.
