summary: "Large language models (LLMs) often produce code that looks plausible
  but is not grounded in reality. The code may import packages that do not
  exist or claim to implement algorithms that violate proven theorems, while
  still compiling and running. We study \\emph{code hallucination} as
  \\emph{ungrounded generation} and separate it from ordinary \\emph{code
  error} (bugs in otherwise grounded programs). We propose a taxonomy with
  three dimensions: \\textbf{groundedness} (absolute violations of universal
  truths vs.\\ relative fabrications of contingent or ecosystem-specific
  facts), \\textbf{manifestation"
