summary: Language models are sequential processors, but long-horizon agency
  requires external information and computation beyond model weights and
  active context. Prime Agent is an open-source harness for long-horizon
  evaluation and coding-agent workflows. A persistent IPython REPL follows the
  Recursive Language Model abstraction for programmatic context processing and
  test-time compute, while Continual Harness preserves histories, memories,
  skills, prompts, and subagent specifications across trajectories. Recursive
  subagents coordinate through direct agent-to-agent communication, and the
  Agents View lets humans inspect and manage daemon-backed sessions. Prime
  Agent standardizes execution, recovery, verification, and resource
  accounting while leaving strategy construction to the model. This
  low-friction, expressive membrane prevents harness failures from becoming
  model failures and pushes measure…
