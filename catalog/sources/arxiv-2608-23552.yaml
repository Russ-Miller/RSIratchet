brief: >-
  Harness design can move measured long-horizon scores as much as model
  choice, but the paper's own evidence for that claim is mostly non-causal.
  Prime Agent is an open-source harness giving each session a persistent
  IPython REPL, recursive subagents that message each other directly, and
  Continual Harness state (prompt notes, memories, skills, subagent specs)
  that survives compaction and restart.


  It is tested on ARC-AGI-3, a 9-task long-context suite, PMPP-Hard GPU
  kernels, EmulatorBench, nanoGPT speedruns, Factorio and MazeBench, with
  GLM-5.2, Opus 5, GPT-5.6 Sol, Kimi K3 and DeepSeek V4 Pro against Pi-mono,
  Claude Code, Codex and opencode.


  ARC-AGI-3 RHAE Best@1 is reported rising from 30% to 95.5%. Long-context
  wins are mixed and small: OOLONG 128k .700 vs .420 for GLM, but .900 vs .920
  for Opus. A 7-day Factorio run spent 23.4 million output tokens, finished 24
  of 196 technologies, and spawned 633 depth-one subagents.


  The authors state the ARC comparison uses external published reference
  values because their own native-harness reruns fell below them, so it does
  not isolate a harness effect; long-context bolding has no uncertainty
  intervals, and nanoGPT harness choice had little effect on final records
  versus run noise.


  One trace shows refinement persisting a specification exploit as a reusable
  skill. Treat this as an engineering and instrumentation contribution, not a
  demonstrated capability gain.
