summary: >-
  Large Language Models demonstrate remarkable proficiency in static
  reasoning, yet training them as autonomous agents through Reinforcement
  Learning (RL) for long-horizon tasks is often hindered by severe reward
  sparsity. While conventional \textit{agent-side warming} up via supervised
  fine-tuning (SFT) can alleviate this, it is frequently limited by data
  scarcity and constrained exploration. To address this, we propose a
  paradigm shift to \textit{environment-side adaptation} by constructing
  \textbf{F}eedback-\textbf{E}nriched \textbf{E}nvironments (\textbf{FEEs}).
