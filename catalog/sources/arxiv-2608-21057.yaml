summary: Agentic large language model (LLM) systems are reshaping scientific
  workflows in chemistry and drug discovery, but evaluating their open-ended,
  tool-augmented outputs remains a fundamental bottleneck. The LLM-as-a-Judge
  paradigm has emerged as a scalable alternative, but existing drug discovery
  benchmarks deploy LLM judges without validating their alignment with human
  experts. In this work, we present an LLM-as-a-Judge evaluation framework for
  ChatInvent, an agentic drug discovery assistant deployed at AstraZeneca,
  with five contributions. First, we define four output-quality evaluation
