summary: >-
  Large language models (LLMs) have enabled AI scientist systems to automate
  scientific discovery, yet existing approaches most rely on static
  prompting or fixed workflows and fail to accumulate experience for
  continual improvement. We propose HypoForge, an experience-guided
  multi-agent framework that learns reusable scientific skills for automated
  hypothesis generation and hypothesis testing. HypoForge is built on the
  observation that these two stages involve different supervision signals.
