brief: >-
  Putting a long prompt in a Python REPL as a variable, and letting the model
  write code that slices it and calls itself on the slices, beats feeding the
  prompt to the model directly, including at lengths that fit in the window.
  Recursive Language Models (RLMs) treat the prompt as environment rather than
  context.


  The setup: GPT-5 (with GPT-5-mini sub-calls), Qwen3-Coder-480B-A35B, and
  Claude Opus 4.1, across LongBench-v2 CodeQA, BrowseComp-Plus (1K docs,
  6M-11M tokens), OOLONG, and a new quadratic-complexity OOLONG-Pairs, versus
  CodeAct+BM25, CodeAct+sub-calls, a compaction agent, OpenCode, and Claude
  Code.


  On GPT-5, RLM at depth=1 scores 62.0 on CodeQA, 91.3 on BrowseComp-Plus,
  56.0 on OOLONG, and 58.0 F1 on OOLONG-Pairs, where base GPT-5 and
  Qwen3-Coder both score 0.1. Median gains: 26% over compaction, 130% over
  CodeAct with sub-calls, 13% over Claude Code, at $0.99 average cost versus a
  $1.50-$2.75 extrapolated ingestion cost. Fine-tuning Qwen3-8B on 1,000
  trajectories from an unrelated domain gives a median 28.3% gain.


  Evidence is measured with cost reported per method, and depth=0 versus
  depth=1-3 ablations isolate the REPL from the recursion. Benchmark sets are
  small (50, 150, 50, 20 instances), no variance across seeds is given, and
  the effect reverses for Qwen3-Coder, where deeper recursion propagates
  syntax errors and depth=0 wins on CodeQA.


  If you are hitting context rot, the offloading trick is worth trying before
  the summarizer.
