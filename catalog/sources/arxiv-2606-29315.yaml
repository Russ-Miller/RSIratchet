summary: >-
  Large language models (LLMs) are increasingly used to take actions in the
  real world and support human decision-making, yet most agents rely on
  parametric knowledge, fixed post-training data, retrieval, or search. This
  paradigm breaks down in novel domains and for sophisticated queries that
  cannot be answered from prior knowledge alone. Knowing the laws of
  physics, for instance, does not by itself enable LLMs to answer queries or
  complete long-horizon tasks in a complex physical system. To address this,
