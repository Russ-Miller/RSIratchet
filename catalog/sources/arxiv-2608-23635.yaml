summary: >-
  Large language models (LLMs) rely on tool calling as a fundamental agent
  capability, enabling them to invoke external systems and complete tasks
  beyond text generation. However, clean end-to-end (E2E) success cannot
  identify where a tool-use failure originates or how it propagates through
  a call. We introduce ToolRobustBench, a stage-wise diagnostic benchmark
  for tool-calling agents, where a tool-calling agent is an LLM system that
  selects a tool, supplies structured arguments, and interprets its returned
