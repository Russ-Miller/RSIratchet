brief: >-
  Multi-agent debate's apparent resistance to a single misinformed agent is
  dilution, not interaction: with 1 of 3 agents exposed, debate is never
  better than majority voting over 3 independent samples with the same
  exposure, and is worse on moral judgment.


  The setup is MINT, 10,278 LLM-written misinformation passages in 8
  rhetorical styles over 1,142 questions from WinoGrande, ETHICS commonsense,
  and Complex Web Questions, with 3 open-weight consumers (Llama-3.3-70B,
  GLM-4.7-Flash, GPT-OSS-120B) run as single agents and as 3-agent debates in
  MALLM, under voting and consensus.


  A relevant false passage costs a single agent 0.12

  dash0.43 accuracy; filler, irrelevant true, and irrelevant false passages
  move it by at most 0.06. Style barely matters (odds ratios 0.67

  dash1.28). Interaction helps only with a misinformed majority, recovering up
  to 0.24 over voting (0.29 under consensus). A misinformed agent spreads its
  answer because it dissents more (50

  dash93% vs 7

  dash39% of pairs) and because of speaking slot (adopted in 0.24

  dash0.62 of cases when last vs 0.00

  dash0.17 when first), not because it is more persuasive. A 1-sentence
  unreliability warning recovers up to 0.18 under voting; a verifier agent
  never raises accuracy.


  Evidence is measured, with an exposure-matched non-interactive baseline at
  every k, 3 seeds at some exposure levels, bootstrap CIs, and a
  cross-generator table isolating same-model effects. Limits: 3 models,
  machine-generated misinformation only, fixed speaking order, only 26.9

  dash47.9% of passages pass both LLM judges, judge agreement \u03ba 0.39

  dash0.74.


  If you benchmark multi-agent robustness, compare against equally exposed
  independent sampling before claiming debate helps.
