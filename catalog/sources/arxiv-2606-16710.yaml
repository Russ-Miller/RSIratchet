brief: >-
  Multi-agent debate's apparent resistance to a single misinformed agent is
  dilution, not interaction: with 1 of 3 agents misled, debate is never better
  than majority voting over 3 independent samples at the same exposure.


  The setup is MINT, 10,278 LLM-written misinformation passages over 1,142
  questions in 8 rhetorical styles, built on WinoGrande, the ETHICS
  commonsense subset, and Complex Web Questions, with Llama-3.3-70B-Instruct,
  GLM-4.7-Flash, and GPT-OSS-120B as both single agents and 3-agent debaters
  in MALLM.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages move it by at most 0.06, and
  style changes error odds only 0.67–1.28x. With 1 misinformed agent debate is
  worse than the matched baseline on ETHICS (−0.07 to −0.12 voting); with a
  misinformed majority it recovers up to 0.24 (0.29 under consensus). A
  1-sentence unreliability warning recovers up to 0.18 under voting, 0.28
  under consensus, with no measurable cost on true context; a verifier agent
  changed 2–25% of answers but never helped.


  Effects are measured against exposure-matched baselines with bootstrap CIs
  and paired permutation tests, and decomposed into ensembling, interaction,
  and misinformation cost; generator x consumer cross-runs rule out a
  same-model artifact.


  Only 3 open-weight models, machine-generated passages judged by 2 LLMs with
  moderate agreement (κ 0.39–0.74), fixed speaking order, and no human-written
  misinformation or larger networks.


  Benchmark your agent pipelines against equal-exposure voting before claiming
  debate adds robustness.
