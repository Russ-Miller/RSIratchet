brief: >-
  Multi-agent debate's apparent resistance to a single misinformed agent is
  dilution, not deliberation: with 1 of 3 agents reading a false passage,
  debate is never better than majority voting over 3 independent samples at
  the same exposure.


  The setup is MINT, 10,278 LLM-written misinformation passages in 8
  rhetorical styles over 1,142 questions from WinoGrande, ETHICS commonsense,
  and Complex Web Questions, run through 3-agent and 5-agent debates with
  Llama-3.3-70B-Instruct, GLM-4.7-Flash, and GPT-OSS-120B.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages move it by at most 0.06. With
  1 misinformed agent, debate is worse than the matched baseline on ETHICS by
  -0.07 to -0.12 under voting; with 2–3 misinformed, interaction recovers up
  to 0.24 (0.29 under consensus). The misinformed agent is not more
  persuasive, it dissents more (50–93% vs 7–39% of pairs) and position
  matters: its answer is adopted in 0.24–0.62 of cases speaking last vs
  0.00–0.17 first. A one-sentence unreliability warning recovers up to 0.18
  under voting; a verifier agent speaking before the vote never helps.


  The exposure-matched baseline, control conditions, and cross-generator table
  isolate falsity from length and style. 3 open-weight models only,
  machine-generated misinformation, fixed speaking order, no heterogeneous or
  longer debates.


  If you cite debate as a misinformation defence, test it against an
  equal-exposure voting baseline first.
