summary: Multi-agent systems, in which multiple large language model agents
  solve problems through turn-based interaction, are increasingly deployed in
  high-stakes settings such as medical diagnosis, legal analysis, and forensic
  decision-making. Their reliability can be at risk when single agents reason
  from incorrect or misleading context, e.g., from tool calls, since errors
  may propagate through agent interactions. This work studies this risk by
  injecting intent-based misinformation into benign single-agent and
  multi-agent systems across reasoning, knowledge, and alignment tasks. We
