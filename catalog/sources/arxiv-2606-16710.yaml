brief: >-
  Multi-agent debate's apparent resistance to a single misinformed agent is
  dilution, not interaction: with 1 of 3 agents exposed, debate is no better
  than majority vote over 3 independent samples at the same exposure, and
  worse on moral judgment.


  MINT supplies 10,278 LLM-written misinformation passages across 8 rhetorical
  styles over 1,142 questions drawn from WinoGrande, ETHICS commonsense, and
  Complex Web Questions. Llama-3.3-70B, GLM-4.7-Flash, and GPT-OSS-120B run as
  single agents and in 3-agent (and one 5-agent) debates, with an
  exposure-matched self-consistency baseline (mSC) at every exposure level.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages move accuracy by at most
  0.06. With 1 misinformed agent, debate trails mSC by −0.07 to −0.12 on
  ETHICS; with 2–3 misinformed, interaction recovers up to 0.24 under voting
  and 0.29 under consensus. The misinformed agent is not more persuasive, it
  dissents more (50–93% vs 7–39% of pairs) and gains from speaking last
  (adopted in 0.24–0.62 vs 0.00–0.17 of cases). A one-sentence unreliability
  warning recovers up to 0.18 (voting) / 0.28 (consensus), with −0.06 to +0.03
  change when context is true or absent; a verifier agent never helps.


  Effects are measured, paired per question with 10,000 bootstrap resamples,
  and the exposure-matched baseline plus the generator x consumer grid isolate
  interaction and same-model effects. Only 3 open-weight models,
  machine-generated passages (19–37% pass both LLM judges, κ 0.39–0.74), fixed
  speaking order, and no human-written misinformation.


  If you claim debate buys robustness, test against an exposure-matched
  baseline before believing it.
