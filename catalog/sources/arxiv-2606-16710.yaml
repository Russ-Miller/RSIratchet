brief: >-
  Multi-agent debate's apparent resistance to a misinformed member is
  dilution, not deliberation: with 1 of 3 agents misled, debate is no better
  than majority voting over 3 independent samples at the same exposure, and
  worse on moral judgment.


  The setup is MINT, 10,278 LLM-written misinformation passages in 8
  rhetorical styles over 1,142 questions from WinoGrande, the ETHICS
  commonsense subset, and Complex Web Questions, with 3 open-weight consumers
  (Llama-3.3-70B, GLM-4.7-Flash, GPT-OSS-120B) run as single agents and as
  3-agent debates in MALLM, under voting and consensus.


  A relevant false passage costs a single agent 0.12\u20130.43 accuracy;
  filler, irrelevant true, and irrelevant false passages move it by at most
  0.06, and style changes error odds only 0.67\u20131.28x. Debate beats the
  matched baseline only when misinformed agents are the majority, by up to
  0.24 under voting and 0.29 under consensus. A 1-sentence unreliability
  warning recovers up to 0.18 (voting) and 0.28 (consensus) with no measurable
  cost when context is true; a verifier agent speaking before the vote never
  helps and loses 0.07\u20130.08 on ETHICS.


  Effects are measured, paired over questions with 10,000 bootstrap resamples
  and Holm adjustment, and the exposure-matched self-consistency baseline
  isolates interaction from ensembling and misinformation. Weaknesses:
  misinformation is machine-generated, only 19\u201337% of passages pass both
  LLM judges, 2 of the 3 consumers are also judges, speaking order is fixed,
  and token budgets differ sharply (10\u201350k for debate against
  0.9\u20134.8k for mSC).


  Untested: human-written misinformation, larger heterogeneous networks,
  closed models. If you cite debate as a robustness mechanism, benchmark it
  against an exposure-matched vote first.
