brief: >-
  Multi-agent debate's apparent resistance to a single misinformed agent is
  dilution, not interaction: with 1 of 3 agents misinformed, debate is never
  better than majority voting over 3 independent samples at the same exposure,
  and is worse on moral judgment.


  The setup is MINT, 10,278 LLM-written misinformation passages in 8
  rhetorical styles over 1,142 questions from WinoGrande, ETHICS commonsense,
  and Complex Web Questions, with Llama-3.3-70B, GLM-4.7-Flash, and
  GPT-OSS-120B as both single agents and 3-agent debaters in MALLM.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages move it by at most 0.06.
  Style barely matters (odds ratios 0.67–1.28). With 1 misinformed agent
  debate trails exposure-matched self-consistency by -0.07 to -0.12 on ETHICS;
  with a misinformed majority it recovers up to 0.24 (voting) and 0.29
  (consensus). The misinformed agent is adopted no more than a dissenting
  uninformed peer; it simply dissents more (50–93% vs 7–39% of pairs) and wins
  when it speaks last (0.24–0.62 vs 0.00–0.17). A 1-sentence unreliability
  warning recovers up to 0.18 under voting, with no measurable cost when
  context is true; a verifier agent never helps.


  Evidence is measured, paired per question with bootstrap CIs and
  exposure-matched baselines at every k, which is what isolates interaction
  from ensembling. Limits: 3 open-weight models, 2 of which also act as
  judges, machine-generated misinformation only, fixed speaking order, and
  mostly 3-agent groups.


  If you report multi-agent robustness, compare against an exposure-matched
  vote before claiming debate helps.
