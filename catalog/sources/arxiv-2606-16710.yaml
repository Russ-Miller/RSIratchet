brief: >-
  Multi-agent debate's apparent resistance to a misinformed peer is dilution,
  not interaction: with 1 of 3 agents reading a false passage, debate is never
  better than majority voting over 3 independent samples at the same exposure,
  and is worse on moral judgment.


  The setup is MINT, 10,278 LLM-written misinformation passages over 1,142
  questions in 8 rhetorical styles, built on WinoGrande, the ETHICS
  commonsense subset, and Complex Web Questions, tested with
  Llama-3.3-70B-Instruct, GLM-4.7-Flash, and GPT-OSS-120B in 3-agent and
  5-agent MALLM debates.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages move accuracy by at most
  0.06. Interaction helps only when misinformed agents are the majority,
  recovering up to 0.24 over voting (0.29 under consensus). A 1-sentence
  unreliability warning recovers up to 0.18 under voting (0.28 under
  consensus), with no measurable cost when context is true. A verifier agent
  speaking before the vote never raises accuracy.


  Effects are measured against an exposure-matched self-consistency baseline
  at every k, with paired bootstrap CIs and a decomposition into ensembling,
  interaction, and misinformation cost; mSC was also rerun at the debate
  temperature.


  Bounds: 3 open-weight models, machine-generated misinformation only,
  judge-verified passages (the strongest ones), fixed speaking order, and no
  larger or heterogeneous networks.


  If you benchmark agent robustness, use an exposure-matched baseline before
  claiming debate helps.
