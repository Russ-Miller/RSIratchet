brief: >-
  Multi-agent debate looks resistant to misinformation only because uninformed
  agents outnumber misinformed ones; against an exposure-matched baseline,
  interaction adds nothing when just 1 of 3 agents reads a false passage.


  The authors built MINT, 10,278 LLM-written misleading passages over 1,142
  questions from WinoGrande, the ETHICS commonsense subset, and Complex Web
  Questions, in 8 rhetorical styles plus true, irrelevant, and content-free
  controls. 3 open-weight models (Llama-3.3-70B, GLM-4.7-Flash, GPT-OSS-120B)
  were tested as single agents and in 3-agent debates (voting and consensus)
  with k of 3 agents exposed.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; irrelevant
  or content-free passages cost at most 0.06, and style changes error odds by
  no more than a third. With 1 misinformed agent, debate never beats
  exposure-matched self-consistency and is worse on ETHICS (−0.07 to −0.12
  under voting); with a misinformed majority it recovers up to 0.24 (0.29
  under consensus). A one-sentence unreliability warning recovers up to 0.18
  under voting, 0.28 under consensus, with no measurable cost when context is
  true. A verifier agent changes 2–25% of answers but never helps.


  Effects are measured, paired per question with bootstrap CIs and permutation
  tests, and the exposure-matched baseline isolates dilution from interaction.
  Limits: 3 models, machine-generated misinformation, only 19–37% of passages
  pass both LLM judges, fixed speaking order, and no larger or heterogeneous
  networks.


  If you report multi-agent robustness, match exposure in the baseline or the
  result is dilution.
