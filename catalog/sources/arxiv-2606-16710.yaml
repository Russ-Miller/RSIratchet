brief: >-
  Multi-agent debate's apparent resistance to a single misinformed agent is
  dilution, not interaction: with 1 of 3 agents misinformed, debate is never
  better than majority voting over 3 independent samples at the same exposure,
  and worse on moral judgment.


  MINT supplies 10,278 LLM-written misinformation passages in 8 rhetorical
  styles over 1,142 questions from WinoGrande, ETHICS commonsense, and Complex
  Web Questions. Llama-3.3-70B, GLM-4.7-Flash, and GPT-OSS-120B run as single
  agents and in 3-agent debates (plus a 5-agent sweep), with k of 3 agents
  reading the passage and an exposure-matched self-consistency baseline (mSC)
  at every k.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages cost at most 0.06. Style
  barely matters (odds ratios 0.67–1.28). With 2–3 misinformed agents debate
  beats mSC by up to 0.24 (voting) and 0.29 (consensus). Ensembling and
  interaction each move accuracy by at most 0.04 without misinformation. A
  1-sentence unreliability warning recovers up to 0.18 (voting) and 0.28
  (consensus) at full exposure, with no measurable cost under true or absent
  context; a verifier agent changes 2–25% of answers but never helps.


  Effects are measured, paired over questions with 10,000 bootstrap resamples,
  Holm adjustment on 72 debate effects, and an exposure-matched baseline that
  isolates interaction from dilution. Weaknesses: 3 open-weight models,
  machine-generated misinformation judged mainly by 2 LLMs that are also 2 of
  the 3 consumers, only 19–37% of passages passing both judges, moderate
  agreement (κ 0.39–0.74), and fixed speaking order.


  Untested: human-written misinformation, larger or heterogeneous networks,
  varied turn order. If you benchmark agent robustness, compare against an
  exposure-matched vote before claiming debate helps.
