brief: >-
  Multi-agent debate's apparent robustness to 1 misinformed agent is dilution,
  not interaction: at matched exposure, majority voting over independent
  samples does just as well, and sometimes better.


  MINT supplies 10,278 LLM-written misinformation passages in 8 rhetorical
  styles over 1,142 questions from WinoGrande, the ETHICS commonsense subset,
  and Complex Web Questions. Llama-3.3-70B, GLM-4.7-Flash, and GPT-OSS-120B
  run as single agents and in 3-agent debates (plus a 5-agent sweep) where k
  of n agents read the passage, against misinformed self-consistency (mSC) at
  the same k.


  A relevant false passage costs a single agent 0.12–0.43 accuracy; filler,
  irrelevant true, and irrelevant false passages move it at most 0.06, and
  style changes error odds by at most a third (odds ratios 0.67–1.28). With 1
  of 3 misinformed, debate is never better than mSC and is worse on ETHICS
  (−0.07 to −0.12 under voting); with a misinformed majority it recovers up to
  0.24 (0.29 under consensus). The misinformed agent is adopted no more often
  than a dissenting uninformed peer; it dissents more (50–93% vs 7–39% of
  pairs) and speaking last matters (0.24–0.62 vs 0.00–0.17 adoption). A
  1-sentence unreliability warning recovers up to 0.18 (0.28 consensus) with
  no measurable cost under true context; a verifier agent never helps.


  Effects are measured, paired per question with bootstrap CIs and permutation
  tests, with exposure-matched baselines and a generator x consumer grid
  ruling out a same-model artifact. Limits: 3 open-weight models,
  machine-generated passages where only 19–37% pass both judges (κ 0.39–0.74),
  2 of 3 consumers also serve as judges, and fixed speaking order with no
  human-written misinformation or heterogeneous networks.


  If you cite debate as a misinformation defense, re-test it against an
  exposure-matched vote at 0.9–4.8k tokens rather than 10–50k.
