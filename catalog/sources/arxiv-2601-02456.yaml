brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where targets are moving, not on static tabletop tasks. InternVLA-A1
  wires 3 experts, understanding, generation, and action, into one
  Mixture-of-Transformers with a blockwise attention mask that forces
  understanding to generation to action flow, and predicts future latents from
  a COSMOS VAE compressed to 16 tokens per view rather than running a video
  model.


  Instantiated at 1.8B (InternVL3) and 3.2B (Qwen3-VL), pre-trained for 700K
  steps on 692M frames of simulation, real robot, and egocentric human video,
  and evaluated on 12 real tasks across 3 robot embodiments at 30 rollouts per
  task, plus RoboTwin 2.0.


  The 3B model averages 75.1% on 10 static tasks, +4.4% over pi 0.5 (70.7%)
  and +14.5% over pi 0 (60.6%). On dynamic tasks the gap widens: 80.0% vs
  53.3% on Express Sorting, 93.3% vs 66.7% on In-motion Ingredient Picking,
  where pi 0 and GR00T N1.5 sit at 20.0%. RoboTwin 2.0 gain over pi 0.5 is
  2.6%.


  Two ablations isolate the cause. Removing the generation expert drops the
  12-task average from 77.0% to 57.6%, with the largest losses on the 2
  dynamic tasks. Removing pre-training drops it to 25.4%. Data ablation shows
  sim-only reaches 88.3%/88.5% on RoboTwin but only 33.3% on Sort parts,
  rising to 53.3% with real plus human data.


  Baselines were not matched on pre-training corpus, so architecture and data
  advantages are entangled in the comparisons against pi 0.5. The
  understanding expert was never trained on VQA data, and instruction
  following was not tested.


  If you care about manipulation under motion, foresight tokens look like the
  lever; for static tasks the gain is small.
