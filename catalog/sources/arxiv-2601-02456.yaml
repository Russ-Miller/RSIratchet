brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where the scene is moving, not where it is static. InternVLA-A1 couples
  3 experts in a Mixture-of-Transformers: an understanding expert
  (InternVL3-1B or Qwen3-VL-2B), a generation expert that predicts COSMOS VAE
  latents of frames 15 steps ahead via single-pass parallel decoding, and a
  flow-matching action expert, linked by a blockwise causal attention mask.


  Pre-training ran on 692M frames mixing InternData-A1 simulation (396M),
  AgiBot-World (206M), EgoDex human video (68M), RoboTwin and RoboMind.
  Evaluation covered 12 real-world tasks on 3 bimanual robots (30 rollouts per
  task) plus RoboTwin 2.0.


  InternVLA-A1 (3B) reached 75.1% average on 10 static tasks vs 70.7% for
  pi-0.5 and 60.6% for pi-0, and +2.6% on RoboTwin 2.0. On the 2 dynamic tasks
  the gap widened: 80.0% vs 53.3% on Express Sorting and 93.3% vs 66.7% on
  In-motion Ingredient Picking.


  The causal claim is backed by direct ablation. Dropping the generation
  expert cut the 12-task average from 77.0% to 57.6%, with the largest losses
  on the dynamic tasks; removing pre-training cut it to 25.4%. Data ablation
  shows sim-only reaches 88.3/88.5 on RoboTwin but only 33.3% on Sort parts.


  Baselines were not matched on pre-training corpus, so architecture and data
  advantages are entangled in the headline comparison, and the dynamic
  evidence rests on 2 task families. The understanding expert was not trained
  on VQA data, so semantic reasoning is untested.


  If you care about manipulation under motion, visual foresight is the lever
  worth pulling.
