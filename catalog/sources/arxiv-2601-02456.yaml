brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where the scene is moving, not where it is static. InternVLA-A1 couples
  three experts in a Mixture-of-Transformers, an understanding expert
  (InternVL3-1B or Qwen3-VL-2B), a generation expert that predicts COSMOS VAE
  latents of frames 15 steps ahead via single-pass parallel decoding, and a
  flow-matching action expert, linked by a blockwise causal attention mask.


  The 2B and 3B models were pre-trained on 692M frames mixing InternData-A1
  synthetic trajectories, AgiBot-World and RoboMind real data, and EgoDex
  human video, then evaluated on 12 real tasks across 3 robots (30 rollouts
  each) and RoboTwin 2.0 (50 bimanual tasks).


  InternVLA-A1 (3B) reaches 75.1% average on 10 static tasks against 70.7% for
  pi 0.5 and 60.6% for pi 0, and beats pi 0.5 by 2.6% on RoboTwin 2.0. The gap
  widens on dynamic tasks: 80.0% vs 53.3% on Express Sorting and 93.3% vs
  66.7% on In-motion Ingredient Picking.


  Two ablations isolate the causes. Removing the generation expert drops the
  12-task average from 77.0% to 57.6%, with the largest losses on the 2
  dynamic tasks; removing pre-training drops it to 25.4%. Baselines are not
  matched on data or parameters, and all real-robot evaluation is self-run.


  If you care about manipulation under moving targets, visual foresight is
  worth the compute; for static tabletop tasks the margin is small.
