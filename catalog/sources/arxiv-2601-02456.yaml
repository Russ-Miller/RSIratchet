brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where targets are moving, not where they are static. InternVLA-A1
  couples 3 experts in a Mixture-of-Transformers: an understanding expert
  (InternVL3-1B or Qwen3-VL-2B), a generation expert that predicts COSMOS VAE
  latents 15 frames ahead via single-pass parallel decoding, and a
  flow-matching action expert, linked by a blockwise causal attention mask.


  Pre-training covers 692M frames of synthetic (InternData-A1, RoboTwin), real
  robot (AgiBot-World, RoboMind) and egocentric human video (EgoDex).
  Evaluation spans 12 real-world tasks on 3 embodiments, 30 rollouts each,
  plus RoboTwin 2.0.


  InternVLA-A1 (3B) averages 75.1% on 10 static tasks vs 70.7% for π0.5 and
  60.6% for π0. On dynamic tasks the margin widens: 80.0% vs 53.3% on Express
  Sorting and 93.3% vs 66.7% on In-motion Ingredient Picking. RoboTwin 2.0
  gains are 2.6% over π0.5. Both variants run at ~13 Hz on 1 RTX 4090.


  Ablations isolate the cause reasonably well: removing the generation expert
  drops the 12-task average from 77.0% to 57.6%, with the largest losses on
  the 2 dynamic tasks, and it wins on 11 of 12 tasks. Removing pre-training
  drops the average to 25.4%. Data ablation shows real data adds most of the
  real-world gain (Sort parts 33.3%→53.3%).


  No matched-compute baseline, the comparison models were not pre-trained on
  the same 692M-frame corpus, and semantic reasoning or instruction following
  was not tested. Treat the dynamic-task gap as the headline claim worth
  checking.
