brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where the scene is moving, not where it is static. InternVLA-A1 couples
  3 experts (understanding, generation, action) in a Mixture-of-Transformers
  with a blockwise attention mask enforcing understanding to generation to
  action, and predicts future COSMOS VAE latents in a single
  non-autoregressive pass rather than running a video model.


  The 2B and 3B variants are built on InternVL3-1B and Qwen3-VL-2B,
  pre-trained for 700K steps on 692M frames mixing InternData-A1 simulation
  (396M), AgiBot-World (206M), EgoDex human video (68M), RoboMind and
  RoboTwin. Evaluation covers 10 static real tasks, 2 dynamic conveyor-style
  tasks on 3 robot embodiments, and RoboTwin 2.0 (50 bimanual tasks), 30
  rollouts per real task.


  InternVLA-A1 (3B) averages 75.1% on static tasks against 70.7% for pi 0.5
  and 60.6% for pi 0, and beats pi 0.5 by 2.6% on RoboTwin 2.0. Dynamic gains
  are larger: 80.0% vs 53.3% on Express Sorting, 93.3% vs 66.7% on In-motion
  Ingredient Picking.


  Two ablations isolate the causes. Removing the generation expert drops the
  12-task average from 77.0% to 57.6%, with the largest losses on the dynamic
  tasks; removing pre-training drops it to 25.4%. Data ablation shows sim-only
  reaches 88.3%/88.5% on RoboTwin but only 33.3% on Sort parts, rising to
  53.3% with real plus human data.


  Baselines are not matched on parameters or compute, all real-robot
  evaluation is self-run, and the authors note the understanding expert was
  never trained on VQA data, so instruction following is untested. Useful if
  you are deciding whether visual foresight is worth its cost outside static
  tabletop settings.
