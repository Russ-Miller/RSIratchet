brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where the scene is moving, not where it is static. InternVLA-A1 couples
  three Mixture-of-Transformers experts, scene understanding, visual foresight
  generation, and flow-matching action, linked by a blockwise causal attention
  mask that forces understanding to generation to action.


  Two variants were built on InternVL3-1B (1.8B total) and Qwen3-VL-2B (3.2B),
  pre-trained for 700K steps on 692M frames mixing InternData-A1 synthetic
  (396M), AgiBot-World (206M), EgoDex human video (68M), RoboTwin (17M) and
  RoboMind (5M). Evaluation covers 10 static and 2 dynamic real-world tasks on
  3 bimanual robots (30 rollouts per task) plus RoboTwin 2.0.


  InternVLA-A1 (3B) reaches 75.1% average on static tasks vs 70.7% for pi-0.5
  and 60.6% for pi-0, +2.6% on RoboTwin 2.0, and 80.0% vs 53.3% on Express
  Sorting, 93.3% vs 66.7% on In-motion Ingredient Picking.


  Ablations isolate the two claimed causes: removing the generation expert
  drops average success from 77.0% to 57.6%, worst on the dynamic tasks;
  removing pre-training drops it to 25.4%. The data mixture ablation moves
  real-world Sort parts from 33.3% (sim only) to 53.3% (sim+real+human).


  Baselines are re-run by the same team, not independently replicated, and the
  understanding expert was never trained on VQA data, so semantic reasoning
  and instruction following are untested. Predicted frames are blurry by
  design.


  If you care about manipulation under motion, treat foresight generation as
  the component doing the work.
