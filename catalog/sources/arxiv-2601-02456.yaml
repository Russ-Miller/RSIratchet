brief: >-
  Adding a lightweight future-frame prediction module inside a VLA policy
  helps most where targets are moving, not where scenes are static.
  InternVLA-A1 wires 3 experts, understanding, generation, and action, into
  one Mixture-of-Transformers with a masked attention flow understanding to
  generation to action, instantiated at 2B on InternVL3 and 3B on Qwen3-VL,
  and pre-trained on over 692M frames of simulation, real-robot, and
  egocentric human video.


  Evaluation covers 12 real-world tasks on 3 bimanual robots, 30 rollouts per
  task, plus RoboTwin 2.0 with 50 tasks. InternVLA-A1 (3B) averages 75.1% on
  10 static tasks against 70.7% for pi 0.5 and 60.6% for pi 0, and gains
  +26.7% on Express Sorting (80.0% vs 53.3%) and +26.6% on In-motion
  Ingredient Picking (93.3% vs 66.7%). RoboTwin 2.0 gains are 2.6% over pi
  0.5.


  Two ablations isolate the causes. Removing the generation expert drops the
  12-task average from 77.0% to 57.6%, with the largest losses on the 2
  dynamic tasks; removing pre-training drops it from 77.0% to 25.4%. Data
  ablation shows sim-only reaching 88.3%/88.5% on RoboTwin but only 33.3% on
  Sort parts, rising to 53.3% with real plus human data.


  All real-world numbers are self-reported, with 1 architecture family and no
  matched-compute baseline. The understanding expert was never trained on VQA
  data, so semantic reasoning and instruction following are untested.


  If you care about conveyor-style moving-target manipulation, visual
  foresight is worth the 13 Hz budget; for static tabletop work the margin is
  small.
