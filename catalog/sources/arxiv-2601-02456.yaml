brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where the scene is moving, not where it is static. InternVLA-A1 couples
  3 transformer experts, understanding, generation and action, in a
  Mixture-of-Transformers with a blockwise attention mask enforcing
  understanding then generation then action.


  The model is built on InternVL3-1B and Qwen3-VL-2B at 1.8B and 3.2B
  parameters, pre-trained on 692M frames mixing InternData-A1 simulation
  (396M), AgiBot-World (206M), RoboMind, RoboTwin and EgoDex human video
  (68M), then evaluated on 12 real-world tasks across 3 robot embodiments and
  RoboTwin 2.0, with 30 rollouts per real task.


  InternVLA-A1 (3B) averages 75.1% on 10 static tasks against 70.7% for pi-0.5
  and 60.6% for pi-0. On 2 dynamic tasks it reaches 80.0% on Express Sorting
  (+26.7% over pi-0.5) and 93.3% on In-motion Ingredient Picking (+26.6%). On
  RoboTwin 2.0 the gain over pi-0.5 is 2.6%.


  The generation expert is isolated by ablation: removing it drops the 12-task
  average from 77.0% to 57.6%, with the largest losses on the dynamic tasks.
  Removing pre-training drops it to 25.4%. A data ablation separates sim-only,
  sim+human and sim+real+human.


  Baselines were re-run by the authors, not independently replicated, and the
  dynamic evidence rests on 2 task families. Treat visual foresight as a
  dynamics-specific fix rather than a general policy upgrade.
