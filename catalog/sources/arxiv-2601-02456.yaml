brief: >-
  Adding a lightweight future-frame prediction module inside a VLA policy
  helps most where the scene is moving, not where it is static. InternVLA-A1
  couples an understanding expert, a generation expert that predicts latent
  future frames, and a flow-matching action expert in a
  Mixture-of-Transformers with blockwise masked attention.


  The models are built on InternVL3-1B and Qwen3-VL-2B at 1.8B and 3.2B
  parameters, pre-trained for 700K steps on 692M frames mixing InternData-A1
  simulation (396M frames), AgiBot-World (206M), EgoDex human video (68M),
  RoboTwin (17M) and RoboMind (5M). Evaluation covers 12 real-world tasks on 3
  robot embodiments, 30 rollouts per task, plus RoboTwin 2.0.


  InternVLA-A1 (3B) averages 75.1% on 10 static tasks against 70.7% for pi 0.5
  and 60.6% for pi 0. On dynamic tasks the gap widens: 80.0% vs 53.3% on
  Express Sorting and 93.3% vs 66.7% on In-motion Ingredient Picking. On
  RoboTwin 2.0 it beats pi 0.5 by 2.6%. Inference runs at roughly 13 Hz on 1
  RTX 4090.


  Ablations isolate the components: removing the generation expert drops the
  12-task average from 77.0% to 57.6%, with the largest losses on the dynamic
  tasks; removing pre-training drops it to 25.4%. Data-source ablation shows
  sim-only reaches 33.3% on Sort parts vs 53.3% with sim+real+human.


  Baselines are not matched on pre-training data, so architecture and corpus
  are confounded in the headline comparisons. The understanding expert was not
  trained on VQA data, and predicted frames are blurry by design.


  If you care about manipulation under moving targets, foresight tokens look
  like the lever.
