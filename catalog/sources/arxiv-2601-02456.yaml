brief: >-
  Adding a lightweight future-frame prediction module to a VLA policy mostly
  helps when the scene is moving, not when it is static. InternVLA-A1 uses a
  Mixture-of-Transformers with 3 experts — understanding (InternVL3-1B or
  Qwen3-VL-2B), a generation expert that predicts COSMOS VAE latents of frames
  15 steps ahead via single-pass parallel decoding, and a flow-matching action
  expert — linked by a blockwise causal attention mask, pre-trained on 692M
  frames of simulation, real-robot and egocentric human video.


  Across 12 real-world tasks on 3 bimanual robots, 30 rollouts each,
  InternVLA-A1 (3B) averages 75.1% on 10 static tasks versus 70.7% for π 0.5
  and 60.6% for π 0 , and gains +26.7% on Express Sorting (80.0% vs 53.3%) and
  +26.6% on In-motion Ingredient Picking (93.3% vs 66.7%). On RoboTwin 2.0 (50
  tasks, 27,500 demos, 100 trials) it beats π 0.5 by 2.6%.


  Two ablations isolate the causes: removing the generation expert drops the
  12-task average from 77.0% to 57.6%, worst on the dynamic tasks; removing
  pre-training drops it to 25.4%. A data-source ablation shows sim-only
  transfers poorly to real (33.3% on Sort parts vs 53.3% with sim+real+human).


  Baselines are not matched on pre-training data or compute, evaluation is
  self-run, and the understanding expert was never trained on VQA data, so
  semantic reasoning claims are untested.
