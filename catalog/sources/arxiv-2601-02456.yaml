brief: >-
  Adding a lightweight future-frame prediction expert to a VLA policy helps
  most where targets are moving, not where scenes are static. InternVLA-A1
  couples 3 experts in a Mixture-of-Transformers: an understanding expert
  (InternVL3-1B or Qwen3-VL-2B), a generation expert predicting a COSMOS VAE
  latent 15 frames ahead via single-pass parallel decoding, and a
  flow-matching action expert, linked by a blockwise causal attention mask.


  Pre-training used 692M frames mixing InternData-A1 synthetic (396M),
  AgiBot-World (206M), EgoDex human video (68M), RoboTwin (17M) and RoboMind
  (5M). Evaluation covered 12 real tasks on 3 bimanual robots (30 rollouts
  each) plus RoboTwin 2.0 (50 tasks, 100 trials).


  The 3B model averaged 75.1% on 10 static tasks vs 70.7% for pi-0.5 and 60.6%
  for pi-0. On dynamic tasks the gap widened: 80.0% vs 53.3% on Express
  Sorting, 93.3% vs 66.7% on In-motion Ingredient Picking. RoboTwin 2.0 gain
  over pi-0.5 was 2.6%.


  Ablations isolate the causes: removing the generation expert drops the
  12-task average from 77.0% to 57.6%, with the largest losses on the 2
  dynamic tasks; removing pre-training drops it to 25.4%; data-source ablation
  shows real-world demonstrations drive the real-task gains (Sort parts 33.3%
  to 53.3%). Baselines were run by the authors, not independently replicated,
  and 1 lab's models only.


  Useful if you care whether visual foresight buys anything beyond MLLM-style
  VLAs under motion.
