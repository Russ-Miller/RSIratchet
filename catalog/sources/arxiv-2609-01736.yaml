brief: >-
  Wrapping each tool in its own LLM that accepts natural language and resolves
  the API schema internally, rather than putting raw schemas in the caller's
  context, is where nearly all the gain comes from in a tool-use harness.


  HEART is a Planner-Router-Verifier multi-agent pipeline over ToolFace, a
  repository of 25,519 functions (16,464 ToolBench live APIs, 4,348 coding
  tools, and others) retrieved on demand by semantic search. Qwen3-8B backs
  every role, with a re-planning budget of B = 3, evaluated on ToolBench,
  NESTFUL, tau2-Bench, ACEBench and BFCLv4.


  HEART reports 75.1% average Pass Rate on ToolBench versus 73.4 for
  Claude-4.6-Sonnet (DFSDT), 0.44 Full Acc. on NESTFUL one-shot versus 0.40
  for GPT-5.4 and 0.09 for DeepSeek-V3, 86.9% overall on ACEBench, and 69.38%
  Memory Overall on BFCLv4. On 50 hand-built real-world tasks scored by human
  annotators it completes 84% versus 20-24% for 3 frontier models.


  The ablation isolates the cause: removing ToolFace and Tool Primitives drops
  ToolBench Pass from 75.1 to 16.1 and NESTFUL Full Acc. from 0.44 to 0.06;
  removing the Verifier gives 47.6 and 0.15. Budget sweeps saturate at B = 3.


  There is no matched-token-budget baseline: HEART spends 21,684-24,531 tokens
  per tau2-Bench task against roughly 5,000-8,000 for single models, and the
  cost advantage comes from a cheap 8B backbone. All numbers are
  self-reported, 1 backbone family, and the 50-task benchmark is authored by
  the same team.


  Treat the interface change, not the agent scaffolding, as the claim worth
  testing.
