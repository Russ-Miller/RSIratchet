summary: >-
  Existing hallucination detection methods for large language models (LLMs)
  rely on external verification at inference time, requiring gold answers,
  retrieval systems, or auxiliary judge models. We ask whether this external
  supervision can instead be distilled into the model's own representations
  during training, enabling hallucination detection from internal
  activations alone at inference time. We introduce a weak supervision
  framework that combines three complementary grounding signals: substring
  matching, sentence embedding similarity, and an LLM as a judge verdict to
  label generated response
