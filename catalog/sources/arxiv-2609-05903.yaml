summary: >-
  Large Language Model (LLM) agents are turning language into real-world
  effects, making safety necessary against both indirect prompt injections
  and direct harmful requests. System-level safety harnesses add an
  enforcement layer beyond model-level defenses, but existing harnesses are
  usually designed once by experts and applied across heterogeneous models
  and domains. Effective protection is deployment-dependent: models differ
  in how much enforcement they need before utility declines, while domains
  differ in the effects, state, and action sequences that must be governed.
