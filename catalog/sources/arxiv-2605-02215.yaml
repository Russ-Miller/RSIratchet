brief: >-
  Fine-tuned program-repair models lose roughly half their fix rate when a
  single local variable is renamed, even though the code means exactly the
  same thing. HEJ-Robust applies 8 semantics-preserving transformations to
  HumanEval-Java-Bug (164 Java programs with injected bugs, executable tests,
  annotated buggy lines), producing 1,450 transformed instances, and evaluates
  5 fine-tuned APR models: PLBART base/large and CodeT5 small/base/large,
  released by Jiang et al. Transformations include local variable, method and
  parameter renaming, log statement and try-catch insertion, boolean exchange,
  loop exchange, and condition reordering.


  Local variable renaming (100 bugs) drops Pass@10 by 50.5% to 57.31% across
  all 5 models. Try-catch insertion costs 10.4% to 42.87%. Parameter renaming
  and log insertion move results by only a few percent, sometimes upward
  (plbart_base +4.65%, plbart_large +3.23%), which the authors treat as noise.
  CodeBLEU stays near-flat throughout, so similarity metrics miss the
  functional damage entirely. Larger models often degrade more than smaller
  siblings.


  Measured with execution-based Pass@10, 10 patches per bug, using unmodified
  released checkpoints, so no retraining confound. Buggy-line locations were
  manually re-annotated, with a second author verifying over 10%. Boolean
  exchange had only 7 applicable instances and is excluded from claims.


  Only 2 model families, both fine-tuned encoder-decoders; instruction-tuned
  and agent-based repair are untested, as are project-level bugs. Treat
  single-form APR leaderboard numbers as an upper bound.
