brief: >-
  Fine-tuned program repair models lose over half their fixes when a single
  local variable is renamed, even though the code means exactly the same
  thing.


  HEJ-Robust applies 8 semantics-preserving transformations to
  HumanEval-Java-Bug's 164 manually bugged Java functions, yielding 1,450
  transformed instances with re-annotated buggy lines and executable tests.
  The 5 models evaluated are PLBART base/large and CodeT5 small/base/large,
  all fine-tuned for APR by Jiang et al., run unmodified at 10 candidate
  patches per bug and scored with Pass@10.


  Local variable renaming cut Pass@10 by 50.5% to 57.31% across all 5 models.
  Try-catch insertion dropped codet5_small by 42.87% and codet5_large by
  30.68%. Parameter renaming and log insertion moved scores only a few
  percent, sometimes upward. CodeBLEU stayed nearly flat throughout, so
  similarity metrics hide the functional collapse.


  The effect is measured against each model's own score on the untransformed
  subset, which isolates the transformation well. Renaming uses
  naturalness-aware substitution via CodeBERT and GraphCodeBERT rather than
  random strings, so degradation is not an artifact of unnatural identifiers.
  Boolean exchange has only 7 instances and the authors exclude it themselves.


  Only 2 model families, both encoder-decoder fine-tunes, and only
  function-level isolated code; instruction-tuned and agent-based LLMs and
  project-level bugs are untested.


  If you report APR numbers with CodeBLEU, or a single canonical buggy form,
  your headline score is probably optimistic.
