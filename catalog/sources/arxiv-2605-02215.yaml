brief: >-
  Renaming a single local variable cuts fine-tuned program-repair models'
  Pass@10 roughly in half, while CodeBLEU barely moves. HEJ-Robust applies 8
  semantics-preserving transformations to HumanEval-Java-Bug's 164 Java
  programs with injected bugs, yielding 1,450 transformed instances with
  manually re-annotated buggy-line locations and executable tests.


  The models are the 5 publicly released fine-tuned APR models from Jiang et
  al.: PLBART base/large and CodeT5 small/base/large, run unchanged with 10
  candidate patches per bug.


  Local variable renaming (100 bugs) drops Pass@10 by 50.5% to 57.31% across
  all 5 models. Try-catch insertion (114 bugs) costs 10.4%–42.87%; condition
  reordering (603 bugs) 7.05%–13.69%; method renaming and log insertion under
  10% for most models. Parameter renaming slightly improves plbart_base and
  plbart_large by 4.65% and 3.23%. CodeBLEU stays near-flat throughout, so it
  does not detect functional degradation.


  The effect is measured against each model's own score on the matched
  untransformed subset, so the transformation is isolated. Renaming uses
  naturalness-aware substitution via CodeBERT/GraphCodeBERT rather than random
  strings, which rules out unnatural-token artifacts. Boolean exchange has
  only 7 instances and the authors exclude it themselves.


  Only 2 model families, both encoder-decoder and fine-tuned; no
  instruction-tuned or agent-based LLMs, and no project-level bugs with
  inter-file dependencies. Treat similarity metrics as uninformative for
  repair robustness and report execution-based Pass@k.
