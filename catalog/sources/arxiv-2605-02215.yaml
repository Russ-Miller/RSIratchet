brief: >-
  Fine-tuned program repair models lose over half their fix rate when a single
  local variable is renamed, even though the code is semantically identical
  and the new name is developer-natural.


  HEJ-Robust applies 8 semantics-preserving transformations to
  HumanEval-Java-Bug (164 Java programs with manually injected bugs and
  executable tests), yielding 1,450 transformed instances with buggy-line
  locations manually re-annotated. The 5 evaluated models are PLBART
  base/large and CodeT5 small/base/large, all fine-tuned and released by Jiang
  et al., run unmodified at 10 patches per bug and scored with Pass@10 plus
  CodeBLEU.


  Local variable renaming (100 bugs) drops Pass@10 by 50.5% to 57.31% across
  all 5 models. Try-catch insertion costs 10.4%–42.87%, condition reordering
  7.05%–13.69%, parameter renaming and log insertion are near-flat and
  sometimes positive (plbart_base +4.65%, plbart_large +3.23%). CodeBLEU
  barely moves, so it does not detect the functional degradation. Larger
  models often degrade more than smaller ones in the same family.


  The comparison is a clean matched before/after on the same bugs, with one
  identifier renamed per program to bound transformation strength; Boolean
  Exchange is excluded from claims because only 7 instances apply. Scope is
  narrow: function-level human-injected bugs, 2 model families, no
  instruction-tuned or agent-based LLMs, no project-level bugs.


  If you report APR numbers on a canonical benchmark, treat them as an upper
  bound and stop using CodeBLEU as a robustness proxy.
