brief: >-
  Renaming a single local variable cuts fine-tuned program-repair models'
  Pass@10 roughly in half, even though the code's semantics and its CodeBLEU
  score are unchanged.


  HEJ-Robust applies 8 semantics-preserving transformations to the 164 Java
  programs of HumanEval-Java-Bug, yielding 1,450 transformed instances with
  manually re-annotated buggy-line locations and executable tests. The 5
  models evaluated are PLBART base/large and CodeT5 small/base/large, all
  fine-tuned and released by Jiang et al., run unmodified with 10 patches per
  bug.


  Local variable renaming (100 bugs) drops Pass@10 by 50.5% to 57.31% across
  all 5 models. Try-catch insertion (114 bugs) drops it 10.4% to 42.87%;
  condition reordering (603 bugs) 7.05% to 13.69%; parameter renaming and log
  insertion are near-flat, with small gains for some models. CodeBLEU barely
  moves anywhere, so it does not detect the failures.


  The effect is measured, with each model its own original-code baseline and
  single-identifier renaming limiting transformation strength. Boolean
  exchange had only 7 instances and the authors exclude it as uninterpretable.
  Larger models often degrade more than smaller ones.


  Only 2 fine-tuned encoder-decoder families on function-level, human-injected
  bugs; instruction-tuned, agent-based, and project-level repair were not
  tested.


  If you report APR numbers, treat CodeBLEU as uninformative and test
  identifier renaming.
