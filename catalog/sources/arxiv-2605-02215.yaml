brief: >-
  Fine-tuned program-repair models lose half their fixes when you rename a
  single local variable, even though the code's semantics are unchanged.
  Identifier patterns, not reasoning about the bug, appear to carry much of
  the measured repair ability.


  HEJ-Robust applies 8 semantics-preserving transformations to the 164 Java
  programs of HumanEval-Java-Bug, yielding 1,450 transformed instances with
  re-annotated buggy-line locations, executable tests, and human patches. The
  5 evaluated models are PLBART base/large and CodeT5 small/base/large, all
  fine-tuned and released by Jiang et al., run unmodified at 10 candidate
  patches per bug and scored with Pass@10.


  Local variable renaming (100 bugs) cuts Pass@10 by 50.5% to 57.31%.
  Try-catch insertion drops codet5_small 42.87% and codet5_large 30.68%;
  condition reordering, loop exchange, method renaming and log insertion cause
  smaller drops. CodeBLEU barely moves anywhere, so it does not track
  functional degradation. Larger models often degrade more than smaller ones.


  The effect is measured, with each transformation compared against the same
  models on the untransformed instances, which isolates syntax as the cause.
  Boolean exchange is correctly set aside at 7 instances. Weaknesses: 2 model
  families only, 1 identifier renamed per program, varying instance counts per
  transformation.


  No instruction-tuned, agent-based, or zero-shot models were tested, and all
  bugs are isolated functions rather than project-level code with inter-file
  dependencies.


  If you cite Pass@k on canonical APR benchmarks as evidence of repair skill,
  treat those numbers as an upper bound.
