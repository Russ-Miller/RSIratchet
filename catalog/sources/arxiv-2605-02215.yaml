brief: >-
  Fine-tuned program repair models lose half their functional accuracy when a
  single local variable is renamed, even though the code means exactly the
  same thing. HEJ-Robust applies 8 semantics-preserving transformations to the
  164 Java programs of HumanEval-Java-Bug (renaming of local variables,
  methods, parameters; log insertion; try-catch insertion; boolean exchange;
  loop exchange; condition reordering), yielding 1,450 transformed,
  test-executable instances with manually re-annotated buggy-line locations.


  Five APR models released by Jiang et al. (PLBART base/large, CodeT5
  small/base/large) were evaluated at Pass@10 with 10 patches per bug. Local
  variable renaming cut Pass@10 by 50.5% to 57.31% across all 5 models;
  try-catch insertion cut it by 10.4% to 42.87%; parameter renaming and log
  insertion moved results only a few percent, sometimes upward. CodeBLEU
  stayed near-flat throughout, so it does not detect the degradation.


  The effect is measured against each model's own score on the matching
  untransformed subset, which isolates the transformation. The authors exclude
  boolean exchange from claims because only 7 instances applied and 1
  prediction shifts the rate by over 12 points.


  Boundaries: 2 fine-tuned model families only, no instruction-tuned or
  agent-based LLMs, function-level isolated programs with no inter-file
  dependencies, and 1 identifier renamed per program.


  If you report APR gains using similarity metrics, switch to execution-based
  Pass@k and test renamed variants.
