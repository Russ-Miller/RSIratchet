brief: >-
  Renaming a single local variable cuts fine-tuned program-repair models'
  Pass@10 roughly in half, while CodeBLEU barely moves. That makes similarity
  metrics useless as robustness indicators for APR.


  HEJ-Robust applies 8 semantics-preserving transformations to
  HumanEval-Java-Bug (164 Java programs with manually injected bugs and
  executable tests), yielding 1,450 transformed instances. Transformations
  include local variable, method and parameter renaming, log-statement and
  try-catch insertion, boolean exchange, loop exchange, and condition
  reordering. 5 fine-tuned models were evaluated unmodified: PLBART base/large
  and CodeT5 small/base/large, 10 patches per bug.


  Local variable renaming (100 bugs) dropped Pass@10 by 50.5%–57.31% across
  all 5 models. Try-catch insertion (114 bugs) dropped it 10.4%–42.87%; loop
  exchange 4.81%–16.84%; condition reordering (603 bugs) 7.05%–13.69%.
  Parameter renaming and log insertion were near-neutral, with small gains for
  some PLBART variants. Larger models often degraded more than smaller ones.
  CodeBLEU stayed near 80–86 throughout.


  The design isolates the cause well: semantics is preserved, buggy-line
  locations were manually re-annotated with >10% second-author verification,
  instances where the transformation touched the buggy line were dropped, and
  renaming used naturalness-aware substitution rather than random strings.
  Boolean exchange (7 bugs) is acknowledged as underpowered and excluded.


  Only 2 model families, both fine-tuned encoder-decoders; no
  instruction-tuned or agent-based LLMs, and no project-level bugs. Treat
  single-benchmark APR scores as an upper bound tied to one syntactic form.
