brief: >-
  Renaming a single local variable cuts fine-tuned program-repair models'
  Pass@10 roughly in half, while CodeBLEU barely moves. HEJ-Robust applies 8
  semantics-preserving transformations to HumanEval-Java-Bug (164 Java
  programs with injected bugs, executable tests, annotated buggy lines),
  yielding 1,450 transformed instances, and evaluates 5 fine-tuned APR models:
  PLBART base/large and CodeT5 small/base/large, all released by Jiang et al.,
  with 10 candidate patches per bug.


  Local variable renaming drops Pass@10 by 50.5% to 57.31% across all 5
  models. Try-catch insertion drops it 10.4% to 42.87%; condition reordering
  7.05% to 13.69%; method renaming, parameter renaming, loop exchange, and log
  insertion cause smaller changes, with 3 small increases (plbart_base +4.65%,
  plbart_large +3.23% on parameter renaming; plbart_large +1.59% on log
  insertion). CodeBLEU stays near-flat throughout, so it fails to register
  functional degradation. Larger models often degrade more than smaller ones
  in the same family.


  The comparison is original versus transformed versions of the same bugs, so
  the transformation is isolated; buggy-line locations were manually
  re-annotated, with a second author checking over 10%. Renaming uses
  naturalness-aware substitution via CodeBERT/GraphCodeBERT rather than random
  strings, which rules out one artifact explanation. Boolean exchange has only
  7 instances and the authors exclude it themselves.


  Only 2 model families, both fine-tuned seq2seq, and only function-level,
  human-crafted bugs; instruction-tuned and agent-based models and
  project-level bugs are untested. Treat single-benchmark APR numbers as upper
  bounds, and do not use CodeBLEU to check robustness.
