brief: >-
  Fine-tuned program repair models lose over half their fix rate when a single
  local variable is renamed, even though the code means exactly the same
  thing. Identifier surface form, not program semantics, is carrying much of
  their apparent repair skill.


  HEJ-Robust applies 8 semantics-preserving transformations to
  HumanEval-Java-Bug's 164 manually bugged Java functions, yielding 1,450
  transformed instances with re-annotated buggy-line locations and executable
  tests. 5 fine-tuned APR models from Jiang et al. (PLBART base/large, CodeT5
  small/base/large) are evaluated at Pass@10 with 10 candidate patches per
  bug.


  Local variable renaming cuts Pass@10 by 50.5% to 57.31% across all 5 models.
  Try-catch insertion costs 10.4%–42.87%. Parameter renaming and log insertion
  are near-neutral, sometimes slightly positive (plbart_base +4.65%). CodeBLEU
  barely moves anywhere, so similarity metrics miss the degradation entirely.


  The effect is measured, with each transformation isolated as its own
  subtable against the matched original subset, and renaming uses
  naturalness-aware substitutions from CodeBERT/GraphCodeBERT rather than
  random strings, so degradation is not an artifact of unnatural code. Boolean
  exchange has only 7 instances and the authors exclude it themselves.


  Only 2 model families, both encoder-decoder fine-tunes; no instruction-tuned
  or agent-based LLMs, and no project-level bugs with cross-file dependencies.
  Treat single-form APR leaderboard numbers as upper bounds, and report
  execution-based metrics rather than CodeBLEU.
