brief: >-
  Separating camera-movement actions from arm actions, and pretraining the
  camera head alone, beats folding both into one action space when a robot
  must move its viewpoint to see the target. SaPaVe adds a LoRA camera adapter
  plus a decoupled action head to a 2B VLM, trains stage 1 on
  ActiveViewPose-200K (200k image-language-camera movement pairs built from 4k
  Objaverse assets, 500 scenes, GPT-4o-written instructions), then fine-tunes
  on mixed real and simulated manipulation data with a 3D spatial encoder
  injected into the action decoder. Evaluation covers ActiveManip-Bench (Isaac
  Sim, Unitree G1, 12 tasks, 100 objects, 20 scenes) and real-robot occluded
  and out-of-view pick-and-place and articulated manipulation.


  On viewpoint prediction it averages 84.3% vs 72.7% for Gemini-2.5-Pro and
  62.3% for Qwen2.5-VL-72B. In simulation it reaches 74.83% average vs 36.17%
  for a fixed camera and 52.33% for fixed plus wrist cameras. In the real
  world it hits 85.00% vs 53.75% for GR00T-N1 and 45.00% for π0, both
  fine-tuned with a unified action space.


  Ablations isolate each piece on 4 real tasks: dropping stage 1 falls to
  53.75%, dropping the decoupled head to 71.25%, dropping spatial injection to
  68.75%. Camera configurations are compared under 1 shared architecture,
  which is the cleanest comparison here; the VLA baselines differ in
  architecture and pretraining, so the 31.25-40 point gaps mix method and
  model. 1 embodiment, 1 head design, success-rate only, no human or
  teleoperation ceiling reported.


  If you build VLAs, treat camera control as a separate head with its own
  pretraining rather than extra action dimensions.
