summary: Multimodal Large Language Models (MLLMs) have recently demonstrated
  promising capabilities in multimodal coding tasks such as chart-to-code
  generation. However, existing methods primarily rely on supervised
  fine-tuning (SFT), which requires the model to learn code patterns through
  chart-code pairs but does not expose the model to a code execution
  environment. Moreover, while self-correction through execution feedback
  offers a potential route to improve coding quality, even state-of-the-art
  MLLMs have been shown to struggle with effective self-correction. In this
  work, we introduce MM-ReCoder,
