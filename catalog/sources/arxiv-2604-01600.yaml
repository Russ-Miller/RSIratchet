brief: >-
  Apparent self-correction gains on chart-to-code are mostly just fixing
  crashes, not improving already-working code. Filtering to charts that
  rendered in both turns, Qwen3-VL-8B's low-level score changes by -1.03% and
  Qwen3-VL-235B-A22B's by -0.26%, even though their aggregate 2-turn scores
  rise by 1.5% and 0.4% alongside execution-rate jumps of 10.7% and 2.3%.


  MM-ReCoder trains Qwen2.5-VL-7B with SFT on Chart2Code-160k, a 7k-sample
  multi-turn cold start distilled from Qwen3-VL-235B, then 2 GRPO stages:
  shared-first-turn rollouts, then full-trajectory. Rewards mix rule-based
  Matplotlib element extraction with a Qwen2.5-VL-72B judge. Evaluated on
  ChartMimic, Plot2Code, ChartX.


  At 4 turns it reaches 86.5 low-level and 84.9 high-level on ChartMimic and
  98.5 pass rate on Plot2Code, with +0.30 low-level improvement on re-rendered
  charts, 7.3% improved versus 4.5% degraded. Gains shrink each turn and go
  negative by turn 5.


  The rollout-strategy comparison is a real ablation: full-trajectory with no
  bonus repeats the first turn in 46.9% of cases, and a self-correction bonus
  of 0.1 makes the model sandbag turn 1 to 66.7 low-level. Reward-weight
  ablations isolate rule-based versus model-based contributions.


  Single base model, 1 domain, charts only; the model-based reward shares a
  family with the evaluated policy. Treat reported multi-turn gains elsewhere
  as executability artifacts until filtered.
