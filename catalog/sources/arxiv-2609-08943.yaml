summary: >-
  Automatic fact-checking systems assess the veracity of claims given
  evidence from relevant documents. Large Language Models (LLMs) have
  demonstrated strong performance in fact-checking due to their general
  reasoning capabilities. However, it remains unclear whether they
  faithfully make use of the evidence provided to reach veracity judgments
  or rely on parametric knowledge. To investigate this, we introduce
  Fact-Ablated Evaluation (FAE), a new evaluation framework that iteratively
  ablates the cited evidence to assess whether LLMs revise their predictions
  accordingly. Our empirical results show
