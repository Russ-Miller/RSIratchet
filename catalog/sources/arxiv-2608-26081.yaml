summary: >-
  Collective intelligence can emerge when individuals coordinate through a
  shared environment, allowing local actions to accumulate into durable
  social organization. Language-model agents offer a new substrate for this
  process, yet most multi-agent systems rely on direct conversation,
  predefined roles, or centralized workflows. It remains unclear whether
  decentralized agents can build functional technologies and outperform
  independent search. Here, initially homogeneous LLM agents in SwarmWorld
  self-organize without assigned roles or recipes into evolving
  technological societies. Agents explore
