brief: >-
  Models that can state the correct numbers for two entities often still pick
  the wrong one when asked to compare them, because presentation order, entity
  popularity and co-occurrence override the numbers they already hold.


  The task is pairwise comparison on 10 numerical Wikidata attributes (river
  length, atomic number, stadium capacity, follower counts and others), with
  up to 1000 entities per attribute, 12 prompts per pair across 6 templates
  and both entity orderings. Models: Llama3-1B/8B, OLMo2-1B/7B/32B,
  Qwen3-1.7B/8B/32B, Mistral-7B and Mistral-24B. Numerical accuracy is
  measured separately by extracting the model's own value estimates.


  Numerical accuracy exceeds pairwise accuracy throughout; the smallest models
  are barely above chance on pairs. On a balanced, orthogonal subset with all
  4 cues toggled independently, order dominates (Qwen3-1.7B reaches a risk
  ratio near 2), popularity sits at RR ≈ 1.1 − 1.25, co-occurrence at RR ≈
  1.05 − 1.15, and internal-knowledge alignment rises to about 1.5 for the
  largest models. A logistic meta-predictor using only surface cues beats the
  model's own numbers at predicting its choice for the smallest models. Qwen3
  thinking adds 5–9 percentage points of pairwise accuracy and similar
  internal consistency, not 100%.


  The cue isolation is a design strength; the Case 1 vs Case 3 analysis is
  descriptive, not causal, and chain-of-thought traces were inspected
  manually, with some showing rationalization after the answer. Zero-shot
  only; no fine-tuning, few-shot, mechanistic probing, non-numerical
  attributes or multi-entity ranking.


  Treat scale gains here as better strategy selection, not better knowledge.
