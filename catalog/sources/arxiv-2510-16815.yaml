summary: >-
  Large Language Models (LLMs) are increasingly used for knowledge-based
  reasoning tasks, yet understanding when they rely on genuine knowledge
  versus superficial heuristics remains challenging. We investigate this
  question through entity comparison tasks by asking models to compare
  entities along numerical attributes (e.g., ``Which river is longer, the
  Danube or the Nile?''), which offer clear ground truth for systematic
  analysis. Despite having sufficient numerical knowledge to answer
  correctly, LLMs frequently make predictions that contradict this
  knowledge. We identify three heuristic biases
