brief: >-
  Steering a vision-language model's activations along a visual direction only
  works if that direction is first orthogonalized against the model's language
  prior; otherwise high steering strengths collapse generation and gut general
  reasoning.


  Revis builds a raw visual vector as the mean difference between hidden
  states with and without the image (100 paired examples from Nullu), projects
  out a "language prior" vector (hallucinated minus refusal response with no
  image) via Gram-Schmidt, picks a single intervention layer by calibration on
  100 COCO images, and fires only when cosine-similarity risk crosses a
  percentile threshold. Evaluated on POPE, CHAIR, MME, MM-Vet and MMMU-Pro
  across Qwen2.5-VL-7B/32B, Qwen3-VL-8B, LLaVA-1.5, LLaVA-NeXT, InternVL3 and
  InternVL3.5, against VCD, M3ID, ONLY, AGLA and VTI.


  On Qwen2.5-VL, CHAIR_S falls from 31.00 to 25.00 while MM-Vet rises from
  70.18 to 72.16; VTI cuts hallucination too but drops MM-Vet to 56.38.
  LLaVA-1.5 CHAIR_S goes 54.00 to 30.00. Time per token stays at 0.025s versus
  ~0.05s for contrastive decoding.


  Ablations isolate the three components: shallow-layer steering (Layer 23)
  hurts both CHAIR_S (37.00%) and MM-Vet (60.37); removing the threshold
  collapses LLaVA-1.5 into repetition loops. The orthogonality claim rests on
  cosine-similarity observations plus the collapse contrast, not a direct
  causal test. Only 7B/8B and 32B models; no 70B+.


  If you steer activations, orthogonalize first and gate on risk.
