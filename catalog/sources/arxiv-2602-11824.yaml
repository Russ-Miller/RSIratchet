summary: Despite the advanced capabilities of Large Vision-Language Models
  (LVLMs), they frequently suffer from object hallucination. One reason is
  that visual features and pretrained textual representations often become
  intertwined in the deeper network layers. To address this, we propose REVIS,
  a training-free framework designed to explicitly re-activate this suppressed
  visual information. Rooted in latent space geometry, REVIS extracts the pure
  visual information vector via orthogonal projection and employs a calibrated
  strategy to perform sparse intervention only at the precise depth where
  suppress
