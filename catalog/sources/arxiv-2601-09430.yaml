summary: >-
  Spatial reasoning has emerged as a critical capability for Multimodal
  Large Language Models (MLLMs), drawing increasing attention and rapid
  advancement. However, existing benchmarks primarily focus on single-step
  perception-to-judgment tasks, leaving scenarios requiring complex
  visual-spatial logical chains significantly underexplored. To bridge this
  gap, we introduce Video-MSR, the first benchmark specifically designed to
  evaluate Multi-hop Spatial Reasoning (MSR) in dynamic video scenarios.
  Video-MSR systematically probes MSR capabilities through four distinct
