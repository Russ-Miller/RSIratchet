brief: >-
  Chain-of-thought prompting makes multimodal models worse at multi-hop
  spatial reasoning over video, and training on atomic spatial skills does not
  transfer to it either. Both effects are measured, not argued.


  Video-MSR covers 4 task types: Constrained Localization, Chain-based
  Reference Retrieval, Route Planning, and Counterfactual Physical Deduction.
  It has 3,052 video clips and 4,993 QA pairs drawn from ScanNet, ScanNet++,
  ARKitScenes, ADT, S3DIS, and ProcTHOR, generated by Gemini-3.0-Pro from
  templates, then filtered by a text-only blind test and checked by 10 human
  experts. 20 models were scored with greedy decoding.


  The best open model, Qwen3-VL-8B-Instruct, reached 43.92% overall; GPT-4o
  reached 41.87%. CoT dropped Qwen2.5-VL-7B by 1.80% and Qwen3-VL-8B by 4.54%.
  Cambrian-S-7B, tuned on VSI-590K for atomic spatial skills, fell from 32.91%
  to 27.82% against its own base. Scale was non-monotonic: Qwen3-VL-4B beat
  larger siblings on the Easy subsets of CL, CRR, and RP. Fine-tuning on
  MSR-9K (8,369 pairs) gave +7.82% to Qwen2.5-VL-7B, driven largely by +48.62%
  on Route Planning.


  Judge choice was ablated across 3 evaluators with consistent scores. The
  tuning gain is single-family and in-distribution with the benchmark's own
  generation pipeline, so transfer elsewhere is untested; indoor scans only.


  Treat CoT as a liability on spatial chains until shown otherwise.
