brief: >-
  Chain-of-thought prompting makes multimodal models worse at multi-hop
  spatial reasoning over video, and training on atomic spatial skills does not
  transfer to it either. Video-MSR is a benchmark of 3,052 video clips and
  4,993 QA pairs from 6 indoor-scan datasets (ScanNet, ScanNet++, ARKitScenes,
  ADT, S3DIS, ProcTHOR), split across Constrained Localization, Chain-based
  Reference Retrieval, Route Planning, and Counterfactual Physical Deduction,
  generated by Gemini-3.0-Pro from templates, filtered by a text-only blind
  test, then checked by 10 human experts.


  Across 20 models the best overall scores are 43.92% (Qwen3-VL-8B-Instruct)
  and 41.87% (GPT-4o). CoT costs Qwen2.5-VL-7B 1.80% and Qwen3-VL-8B 4.54%.
  Cambrian-S-7B, tuned on VSI-590K for atomic spatial concepts, drops over 5%
  below its own base model. Fine-tuning Qwen2.5-VL-7B on MSR-9K (8,369 pairs)
  gives +7.82% overall, +48.62% on Route Planning, and larger gains on Hard
  (+10.13%) than Easy (+4.79%); Qwen3-VL-8B gains +3.10%.


  The CoT and atomic-training effects are measured against matched base
  models, so attribution is clean. The SFT gain is in-distribution with the
  benchmark data and has no held-out transfer test, and open-ended tasks are
  scored by LLM judges, though 3 different judges agree. Scaling is
  non-monotonic: InternVL3.5-38B loses to smaller variants on some subsets.


  Treat CoT as a liability for long-horizon spatial chains until shown
  otherwise.
