summary: >-
  Test-time compute (TTC) strategies have emerged as a lightweight approach
  to boost reasoning in large language models (LLMs). However, their
  application and benefits for vision-language models (VLMs) remain
  underexplored. We present a systematic study of TTC across seven VLMs and
  six benchmarks, specifically analyzing feature-based scoring and majority
