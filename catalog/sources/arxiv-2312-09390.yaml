summary: "Widely used alignment techniques, such as reinforcement learning
  from human feedback (RLHF), rely on the ability of humans to supervise model
  behavior - for example, to evaluate whether a model faithfully followed
  instructions or generated safe outputs. However, future superhuman models
  will behave in complex ways too difficult for humans to reliably evaluate;
  humans will only be able to weakly supervise superhuman models. We study an
  analogy to this problem: can weak model supervision elicit the full
  capabilities of a much stronger model? We test this using a range of
  pretrained language models in the GPT-4 family on natural language
  processing (NLP), chess, and reward modeling tasks. We find that when we
  naively finetune strong pretrained models on labels generated by a weak
  model, they consistently perform better than their weak supervisors, a
  phenomenon we call weak-to-strong general…"
