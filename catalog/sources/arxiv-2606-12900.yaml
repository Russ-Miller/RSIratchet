summary: >-
  Large language models (LLMs) often hallucinate by generating factually
  incorrect or unfaithful content, posing significant risks to their safe
  use. Detecting such hallucinations is particularly challenging under the
  zero-source constraint, where no model internals or external references
  are available, and detection must rely solely on the textual query-answer
  pair. In this paper, we propose Human-like Criteria Probing for
