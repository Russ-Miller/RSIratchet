brief: >-
  A pipeline with no autonomy at all — fixed localize, repair, validate stages
  — matches or beats open-source LLM agents on real GitHub issues at lower
  cost, which cuts against the assumption that tool use and self-directed
  planning are needed for repository-level bug fixing.


  Agentless uses hierarchical localization (repo tree prompting plus embedding
  retrieval, then file skeletons, then edit lines), samples patches in a
  search/replace diff format, generates reproduction tests, and filters by
  regression plus reproduction tests with majority voting. Built on GPT-4o and
  compared against 26 agent-based systems on SWE-bench Lite (300 problems).


  It resolves 96 (32.00%) at $0.70 and 78,166 tokens average, the best among
  open-source approaches; SWE-agent with GPT-4o resolves 55 (18.33%) at $2.53.
  Ablations: majority voting alone 77 (25.67%), plus regression tests 81
  (27.00%), plus reproduction tests 96 (32.00%). Skeleton input localizes
  better than full files (58.33% vs 53.67% containing ground truth). Of 213
  reproduction tests kept, only 94 confirm the ground truth patch. Oracle over
  all 40 sampled patches would solve 126 (42.0%).


  Component ablations and cost-matched token counts are reported, so the
  attribution is reasonably isolated, but baseline numbers come from
  leaderboards and papers, many closed-source with no trajectories, and
  Agentless itself runs on 1 model family.


  Manual inspection found 4.3% of problems contain the exact ground truth
  patch, 10.0% lack critical information, and 5.0% include misleading
  solutions; the authors release a filtered SWE-bench Lite-S.


  Evidence is limited to Python bug-fixing issues in SWE-bench Lite, not
  feature work, other languages, or long-horizon tasks. Treat this pipeline as
  the baseline any agent must beat.
