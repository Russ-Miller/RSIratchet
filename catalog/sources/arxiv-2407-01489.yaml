brief: >-
  Dropping autonomous agent loops entirely and running a fixed 3-phase
  pipeline — hierarchical localization, patch sampling, test-based patch
  selection — matches or beats agent-based software engineering tools at lower
  cost. Agentless uses no tool-use abstraction and never lets the LLM choose
  the next action.


  Built on GPT-4o (gpt-4o-2024-05-13), evaluated on SWE-bench Lite (300
  problems) against 26 agent baselines plus a BM25 RAG baseline. Localization
  goes repository tree to file to skeleton to edit lines; repair samples 4
  location sets x 10 patches = 40 patches in Search/Replace diff format;
  selection uses LLM-filtered regression tests plus 40 sampled reproduction
  tests, then majority voting.


  Agentless resolves 96 (32.00%) at $0.70 and 78,166 tokens average — highest
  among open-source approaches, versus SWE-agent with Claude 3.5 Sonnet at 69
  (23.00%)/$1.62 and CodeR at 85 (28.33%)/$3.34. Closed-source systems score
  higher, up to 129 (43.00%).


  Component effects are ablated. Patch selection: majority voting alone 77
  (25.67%), +regression tests 81 (27.00%), +reproduction tests 96 (32.00%).
  Localization: prompting 78.67% vs embedding 67.67% vs combined 81.67%
  ground-truth file recall; skeleton format 58.33% vs full file 53.67%.
  Baselines are leaderboard-reported, not re-run, and many closed-source
  entries release no trajectories, so cost comparisons are uneven.


  Only 94 of 213 selected reproduction tests actually verify the ground-truth
  patch, and the oracle over all 40 patches is 126 (42.0%) — selection, not
  generation, is the ceiling. Single model, Python-only bug fixing; the
  authors also find 4.3% of SWE-bench Lite problems leak the ground-truth
  patch and 10.0% lack needed information, motivating a filtered SWE-bench
  Lite-S.


  If you are building agent scaffolds for code, check that you beat a fixed
  pipeline at equal cost first.
