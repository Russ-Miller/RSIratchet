brief: >-
  Internal support signals in vision-language models are source-confounded: an
  object mention can score high because it is scene-plausible or follows from
  the generated text prefix, not because the image contains evidence for it.
  Separating those sources improves hallucination detection.


  VisER is a training-free object-level score with 2 parts: Visual Evidence,
  which gates object-context similarity by logit-lens probabilities read off
  image tokens, and Visual Reliance, the ratio of image-derived to
  prefix-derived support. It is scored on captions from 8 LVLMs
  (LLaVA-1.5-7B/13B, LLaVA-NeXT, InstructBLIP, MiniGPT-4, InternVL3-8B,
  Shikra-7B, Qwen2.5-VL) on 500 MSCOCO and Pascal VOC images, labelled by
  CHAIR matching, against 7 training-free baselines.


  Average MSCOCO AUROC is 84.89 vs 81.26 for GLSim; on 4 extra models 81.66 vs
  77.42 for PAS. Against POPE-style yes/no verification on balanced subsets,
  accuracy rises from 67.77 to 78.67 and hallucinated-object F1 from 54.75 to
  79.42.


  Attribution is reasonably isolated: ablations give VR alone 78.22, VE alone
  83.88, combined 85.66; gating lifts compatibility from 72.25 to 83.88 on
  LLaVA-1.5-7B. Counterfactuals (blank image, patch shuffle, prefix removal)
  move each component as intended, with VR falling to 50.00 chance when the
  prefix is removed.


  Only object-existence errors on COCO/VOC categories are tested, not
  attributes, relations, counts, or open-vocabulary objects, and internal
  activations are required, so black-box APIs are out.


  If you build hallucination filters, compare support against the prefix
  rather than measuring support alone.
