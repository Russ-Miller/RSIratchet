summary: >-
  Large language models (LLMs) have demonstrated remarkable capabilities in
  reasoning and code generation, raising the prospect that they could assist
  in developing and optimizing the very infrastructure that powers them.
  However, existing benchmarks mainly focus on isolated kernels, predefined
  operators, or pre-specified optimization targets, and therefore fail to
  evaluate the ability of LLMs to perform open-ended, long-horizon LLM
  infrastructure engineering. To address this gap, we present $Φ$-Bench, a
  benchmark for systematically evaluating LLMs on engineering the LLM
  infrastructure stack. De
