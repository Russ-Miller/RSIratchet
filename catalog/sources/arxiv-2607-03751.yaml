summary: >-
  Vision-Language-Action (VLA) models acquire broad embodied capabilities
  through large-scale pretraining, yet their generalization remains far more
  fragile than that of LLMs and VLMs. The prevailing remedy, post-training
  via supervised fine-tuning or reinforcement learning, improves
  task-specific performance but narrows the generalist capability that makes
  pretraining valuable. We identify a key bottleneck: VLA failures stem not
  only from action generation but also from action evaluation. A diagnostic
  pass@k study confirms that frozen VLAs already contain competent behaviors
  in their output dis
notes: >-
