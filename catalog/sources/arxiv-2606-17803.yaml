summary: >-
  Large language models achieve strong reasoning performance by scaling
  inference-time compute, yet remain fundamentally stateless, discarding the
  rich, self-produced reasoning traces generated during this process. We
  investigate whether models can instead learn online from this experience,
  converting transient computation (reasoning traces) into persistent
  reusable knowledge, and without external supervision or access to future
  data. We show that In-Context Learning (ICL) over raw reasoning traces
  fails to generalize, reflecting a fundamental limitation of token-level
