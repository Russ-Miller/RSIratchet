summary: >-
  Large language models (LLMs) frequently hallucinate, limiting their
  reliability in knowledge-intensive applications. Retrieval-augmented
  generation (RAG) and conformal factuality have emerged as potential ways
  to address this limitation. While RAG aims to ground responses in
  retrieved evidence, it provides no statistical guarantee that the final
  output is correct. Conformal factuality filtering offers distribution-free
  statistical reliability by scoring and filtering atomic claims using a
  threshold calibrated on held-out data, however, the informativeness of the
  final output is not guaranteed.
