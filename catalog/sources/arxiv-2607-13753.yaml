brief: >-
  Which post-training recipe gives usable confidence depends on when in the
  reasoning trace you read it, and no single method is best at all 3 stages.
  On-policy distillation gives the best pre-generation difficulty signal, SFT
  the best in-trace signal for early stopping, and RL the best trace-level
  signal for answer aggregation.


  The comparison holds the backbone (Qwen2.5-7B-Instruct) and training data
  (DeepScaler plus SimpleRL) fixed across SFT, RL (GRPO with binary outcome
  rewards), and OPD from a DeepSeek-R1-Distill-Qwen-32B teacher, evaluated on
  AIME 2024, AIME 2025, AMC 2023, and MATH500 using top-k token confidence.


  Qwen-OPD leads Pre-CoT with average AUROC 0.644 and PRR 0.345, while Qwen-RL
  falls below 0.5 AUROC on all 4 benchmarks with negative PRR everywhere.
  Post-CoT, Qwen-RL's Top-10% confidence voting hits 62.8% average versus
  57.4% majority voting, while confidence filtering hurts both SFT and OPD.
  Trajectory plots show OPD confidence inverts late: incorrect traces end more
  confident than correct ones. PosConf, which reads confidence only from
  model-specific position intervals, pushes RL to 63.5% average and raises
  OPD's 30%-budget early stopping from 26.49 to 28.85 on AIME 2024.


  Effects are measured, with matched token budgets for early stopping and
  majority voting as the aggregation baseline, but the PosConf intervals are
  chosen from AIME 2024 trajectories and then reused, so part of the gain is
  tuned on evaluation data.


  One backbone, one scale, math only, and token-probability confidence only;
  entropy, margins, and cross-sample consistency were not tested.


  If you are selecting a confidence-based inference strategy, pick it per
  post-training recipe and per stage rather than treating calibration as a
  model property.
