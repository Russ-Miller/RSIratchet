summary: >-
  Effectively processing long contexts remains a fundamental yet unsolved
  challenge for large language models (LLMs). Existing single-LLM-based
  methods primarily reduce the context window or optimize the attention
  mechanism, but they often encounter additional computational costs or
  constrained expanded context length. While multi-agent-based frameworks
  can mitigate these limitations, they remain susceptible to the
  accumulation of errors and the propagation of hallucinations. In this
  work, we draw inspiration from the Long Short-Term Memory (LSTM)
  architecture to design a Multi-Agent System call
