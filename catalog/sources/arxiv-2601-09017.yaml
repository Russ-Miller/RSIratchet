brief: >-
  Model skill in a social deduction game degrades once the game is played in a
  non-English language and on region-specific entities, and the degradation is
  sharpest for Egyptian Arabic. Multicultural Spyfall runs the board game
  Spyfall turn-based with 5 LLM players (4 non-spies, 1 spy) across 3
  scenarios: generic locations, local locations, and local foods, in English,
  Indonesian, Simplified Chinese, and Egyptian Arabic, with 30 candidate
  entities per game.


  6 models were tested: gemini-2.5-pro, gemini-2.5-flash, qwen3-30b-a3b
  (thinking), qwen3-8b, gemma-3-12b-it, llama-3.1-8b-instruct, over 9,000
  matches, scored with Bradley-Terry ratings.


  Spy guess accuracy falls from 67.3% in English generic locations to 59.5% in
  arz, and for local food to 51.6% (zh), 40.9% (id), 24.4% (arz). Llama3.1-8B
  leaks the secret entity in up to 37.1% of non-spy games in Indonesian while
  both Gemini models leak 0%. Most models default to Modern Standard Arabic
  rather than arz, with arz usage below 13%; Gemini models reach ~70-80%.
  19.41% of games end in a quit, 70.52% of those from Llama3.1-8B.


  The effect is measured, and rankings on 5 overlapping models match Chatbot
  Arena ordering, though the spread is wider (133 points Gemini-P vs
  Gemma3-12B, against 62 in Arena) on far fewer matches (3,000 vs 82,000).
  Each game is played once; 4 non-spies share the same model, which may couple
  behavior, and only 3 cultures and 6 models are covered.


  Useful if you want a contamination-resistant way to separate cultural
  knowledge from rule-following in multilingual evaluation.
