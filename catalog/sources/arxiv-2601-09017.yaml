brief: >-
  Put a social deduction game in a non-English language with locally specific
  entities and model performance separates more sharply than it does in
  English, and weaker models start breaking the game's rules outright.
  Multicultural Spyfall adapts Spyfall to a turn-based format with 5 players
  (4 non-spies, 1 spy), 30 candidate entities per game, and 3 scenarios:
  generic locations, local locations, and local food, in English, Indonesian,
  Simplified Chinese, and Egyptian Arabic.


  6 models were run across 9,000 matches: gemini-2.5-pro, gemini-2.5-flash,
  qwen3-30b-a3b (thinking), qwen3-8b, gemma-3-12b-it, llama-3.1-8b-instruct.
  Bradley-Terry ratings on the 5 overlapping models match Chatbot Arena's
  ordering, but with a wider spread: 133 points between Gemini-P and
  Gemma3-12B (1136 vs 1003) against 62 in the Arena (1402 vs 1340). Spy guess
  accuracy falls from 67.3% (generic, en) to 24.4% (local food, arz).
  Llama3.1-8B leaks the secret entity in 37.1% of Indonesian games; both
  Gemini models leak 0%. Most models default to Modern Standard Arabic rather
  than arz, with arz usage below 13% for 4 of them.


  The ranking agreement is correlational, not causal, on 5 models. Each game
  is played once, with 4 identical instances on the non-spy team, which the
  authors flag as possible behavioral coupling. 3 countries, 30 entities each.


  Useful if you want a leakage-resistant evaluation that separates cultural
  knowledge from rule-following.
