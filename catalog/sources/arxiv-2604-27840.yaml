brief: >-
  Splitting an agentic forecasting pipeline so that tool planning stays frozen
  and only the numerical forecaster is trained beats training the whole loop
  or using the prior alone. CastFlow retrieves successful tool-use
  trajectories from training data into an Experience Memory, lets a frozen
  Grok 4 plan from an 11-tool diagnostic kit, and has a Qwen3-4B forecaster
  refine an ensemble prior, trained by SFT then GRPO with rewards for absolute
  MSE and improvement over the prior.


  Across 10 benchmarks (5 EPF electricity markets, ETTh/ETTm, wind and solar
  power, MOPEX streamflow) against 21 baselines, CastFlow wins both MSE and
  MAE on 9 datasets, i.e. 18 of 20 dataset-metric pairs. Largest gains: WP MSE
  1932.59 to 1719.99 (11.00%), MOPEX MSE 4.83 to 3.60 (25.47%). PJM is the
  exception (27.45 vs 25.70 MSE).


  Evidence is measured with matched splits and component ablations, and the
  authors concede the limits themselves: several margins are tiny (BE MAE 9.63
  to 9.60, ETTh MSE 8.02 to 8.00), point estimates only, no significance
  testing. Removing the toolkit removes prior, diagnostics and planning
  together, so no ablation isolates diagnostic reasoning or semantic
  reflection. Removing the profiler actually improves FR MSE to 675.67, so
  more evidence is not uniformly better.


  One frozen backbone, one trainable 4B model, no seed variance. Useful if you
  are deciding where in an agent loop to spend gradient updates.
