brief: >-
  Splitting an agentic forecasting pipeline so that a frozen large LLM only
  plans tool use and checks outputs, while a small fine-tuned LLM does the
  numerical refinement, beats both halves alone and 21 baselines on most
  datasets.


  CastFlow uses Grok 4 (frozen) for planning and reflection plus Qwen3-4B
  trained by SFT then GRPO with verifiable rewards (accuracy plus improvement
  over an ensemble prior), with an Experience Memory of training-time tool-use
  trajectories and an 11-tool diagnostic kit. Evaluation covers 10 benchmarks
  (5 electricity-price markets, ETTh/ETTm, wind, solar, MOPEX streamflow)
  against 21 baselines spanning statistical, tree, deep, foundation and LLM
  models.


  CastFlow has the lowest MSE and MAE on 9 of 10 datasets (18 of 20
  dataset-metric pairs). WP MSE drops 1932.59 to 1719.99 (11.00%); MOPEX 4.83
  to 3.60 (25.47%). PJM is the exception (27.45 vs 25.70 MSE). Several margins
  are tiny: BE MAE 9.63 to 9.60, ETTh MSE 8.02 to 8.00.


  Measured with component, tool-category and training-stage ablations; the
  authors state plainly that point estimates carry no significance tests, that
  removing the toolkit also removes the prior and planning, and that the
  reflection ablation conflates semantic checks with structural fallback. The
  ensemble prior (anchorer) is the single largest contributor; memory adds
  0.21%-13.77% MAE depending on dataset.


  Treat the gains as coming mostly from ensemble priors plus outcome-aligned
  fine-tuning, not from agentic reasoning per se.
