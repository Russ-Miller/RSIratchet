summary: "Time series forecasting is a fundamental task in temporal data
  analytics, and large language model (LLM)-based agents offer a promising
  paradigm through autonomous tool interaction and evidence-grounded
  reasoning. However, two fundamental challenges remain: how to acquire
  forecast-relevant evidence through adaptive tool interactions, and how to
  translate such evidence into accurate numerical predictions. To address
  these challenges, we propose CastFlow, a role-specialized agentic
  forecasting framework that bridges general-purpose tool reasoning and
  specialized temporal forecasting. Specificall"
