summary: >-
  Calculation-intensive financial question answering requires exact
  reasoning over structured rates, temporal conditions, numerical formulas,
  and rule-based constraints. Although Large Language Models (LLMs) perform
  strongly on natural language tasks, they often produce numerically
  incorrect yet plausible answers when solving multi-step financial
  calculations. To address this limitation, we introduce CIFQA
  (Calculation-Intensive Financial Query Answering), a deterministic
  tool-grounded multi-agent LLM framework for financial question answering.
