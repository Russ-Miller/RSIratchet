summary: >-
  Multimodal large language models (MLLMs) struggle with hallucinations,
  particularly with fine-grained queries, a challenge underrepresented by
  existing benchmarks that focus on coarse image-related questions. We
  introduce FIne-grained NEgative queRies (FINER), alongside two benchmarks:
  FINER-CompreCap and FINER-DOCCI. Using FINER, we analyze hallucinations
  across four settings: multi-object, multi-attribute, multi-relation, and
  ``what'' questions. Our benchmarks reveal that MLLMs hallucinate when
  fine-grained mismatches co-occur with genuinely present elements in the
