brief: >-
  Wrapping an LLM agent team around a physics solver does not do the
  optimizing; the solver-backed search does, and the agents mainly parse
  inputs, retrieve domain knowledge and route tools. Z-COPA formalizes
  zero-dimensional reduced-order model planning as graph
  topology-plus-parameter co-optimization, with a
  Supervisor/Representation/Design agent split, an ontology-driven multimodal
  RAG module (SAGE), and a MILP-guided navigation (MGN) optimizer; language
  and vision calls go through kimi-k2.6 on AutoGen 0.7.5.


  Evaluation covers 6 cases: 2 real CAD-derived aero-engine
  secondary-air-system tasks (forward and inverse), IEEE case33/case69
  distribution reconfiguration, and Two-Loop/New York Tunnels water networks.


  Reported results: total score 13.08 on SAS forward design; 3.15%
  seal-leakage reduction in inverse topology-parameter design; IEEE 69-bus
  active power loss from 222.10 kW to 98.93 kW, a 55.46% reduction; 90.45%
  cost reduction on Two-Loop; New York Tunnels cost 54.973M versus a 54.926M
  reference, a 0.09% gap, with gaps of 3.58%, 0.32%, 0.24% and 0.09% to
  reference baselines across the 4 public benchmarks.


  The ablation ladder is the strongest part: 5 configurations isolate SAGE
  retrieval, ReAct versus compact CoT, single versus multi-agent, and NSGA-II
  versus MGN at a fixed candidate-evaluation budget. But 1 model backbone, no
  seed or run counts given, no classical optimizer baselines by design, and
  success rate is a permissive executable-endpoint criterion rather than
  design quality.


  The public-benchmark wins are matching known references, not beating them,
  and the authors note that design quality is capped by the fidelity of the 0D
  formulas themselves.


  Read it as evidence for agents as orchestration and grounding layers over
  solvers, not as optimizers.
