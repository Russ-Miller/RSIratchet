summary: >-
  Retrieval-Augmented Generation enhances Large Language Models by grounding
  responses in external knowledge, but multi-hop reasoning remains
  vulnerable to error propagation, where early retrieval failures confound
  subsequent steps. Standard outcome-based optimization only rewards the
  final answer, leaving intermediate retrieval and reasoning errors
  undetected. While existing process-based methods introduce step-level
  signals, they still score each step against the final answer, rewarding
  spurious successes where flawed retrieval coincidentally produces the
  correct answer. Step-level supervision
notes: >-
  Filed as a source on multi-step-reasoning from the classifier's judgement
  that the paper is about it (improves, medium): The paper proposes
  step-level process reward optimization that penalizes flawed intermediate
  retrieval/reasoning steps (including spurious correct answers from invalid
  routes) and reports the best average EM/F1 across five benchmarks. No
  claim has been drafted from it yet.
