brief: >-
  Text-to-SQL accuracy reported on earlier benchmarks is largely memorization:
  when test databases and queries are both unseen, the best systems of the
  time fall to 12.4% exact match. Spider is the dataset built to force that
  split.


  11 college students spent about 1,000 hours writing 10,181 questions and
  5,693 unique SQL queries over 200 multi-table databases spanning 138
  domains, with coverage of JOIN, GROUP BY, HAVING, ORDER BY, INTERSECT,
  EXCEPT and nested queries. Each database averages 27.6 columns and 8.8
  foreign keys. Two splits are evaluated: example split (8659 train / 1034 dev
  / 2147 test) and database split (146 / 20 / 40 databases).


  Seq2Seq reaches 9.4% exact match on example split and 3.7% on database
  split. TypeSQL is best on example split at 33.0% but drops to 8.2% across
  databases; SQLNet goes 18.3% to 12.4%. Component F1 shows WHERE is hardest
  (TypeSQL 52.4% example, 16.0% database). Accuracy falls as the number of
  foreign keys rises.


  The cross-database gap is measured with the same models on both splits, so
  the drop is attributable to the split, not the architecture. Only 5 models,
  all pre-transformer, and value prediction and execution accuracy are
  excluded.


  Treat pre-Spider text-to-SQL numbers as not measuring generalization.
