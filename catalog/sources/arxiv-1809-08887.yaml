brief: >-
  Text-to-SQL accuracy above 80% on older benchmarks came largely from reusing
  the same queries and the same single database in train and test; once
  databases and queries are disjoint, the same model classes collapse. Spider
  is the dataset that makes that visible.


  11 computer science students spent about 1,000 hours writing 10,181
  questions and 5,693 unique SQL queries over 200 multi-table databases in 138
  domains, with annotation, SQL review, native-speaker question review, and a
  final execution check. Each database averages 27.6 columns and 8.8 foreign
  keys. 5 models were run: Seq2Seq, +Attention, +Copying, SQLNet, and TypeSQL,
  under an example split (8659/1034/2147) and a database split (146/20/40
  databases).


  Under example split TypeSQL reaches 33.0 exact match; under database split
  the best model is SQLNet at 12.4, and TypeSQL falls to 8.2. On extra hard
  queries the best database-split score is 1.3. WHERE clauses are the weakest
  component (19.8 F1 for SQLNet, database split), and accuracy falls as the
  number of foreign keys rises.


  The split comparison isolates generalisation to new schemas cleanly, since
  the same models and data are used in both settings. Limits: 4 of the 5
  baselines were adapted from designs built for other datasets, SQLNet and
  TypeSQL cannot emit nested queries or EXCEPT/INTERSECT at all, value
  generation is excluded, and execution accuracy was not reported.


  Treat pre-Spider text-to-SQL numbers as measuring matching, not parsing.
