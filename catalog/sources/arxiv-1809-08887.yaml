brief: >-
  Text-to-SQL accuracy near 80% on earlier benchmarks came largely from
  memorizing query templates; when the same models must handle unseen
  databases and unseen queries, accuracy collapses to the low teens.


  Spider is a hand-built dataset of 10,181 questions and 5,693 unique SQL
  queries over 200 multi-table databases spanning 138 domains, written and
  reviewed by 11 computer science students over roughly 1,000 man-hours.
  Evaluation uses exact set matching on SQL components plus 4 hardness levels,
  and two splits: example split (8659/1034/2147) and database split (146/20/40
  databases), where no database appears in both train and test.


  5 models were tested. On example split, TypeSQL reaches 33.0% exact match
  overall; on database split the best is SQLNet at 12.4%, with extra-hard
  queries at 1.3%. Plain Seq2Seq gets 3.7% on database split. Component F1 is
  worst on WHERE (19.8 for SQLNet, database split). Accuracy also falls as the
  number of foreign keys per database rises.


  The cross-domain effect is measured, not argued: the same models and
  codebase are run under both splits, which isolates generalization to new
  schemas from query novelty only partly, since both change together.


  Value generation, ambiguous questions, and queries needing outside knowledge
  or arithmetic are excluded, so the numbers are an upper bound on an
  already-simplified task. Treat pre-Spider text-to-SQL scores as
  uninformative about schema generalization.
