brief: >-
  Text-to-SQL accuracy on prior benchmarks was largely memorization: when
  target queries and databases are held out, the same models collapse. Spider
  makes that explicit.


  The dataset has 10,181 questions and 5,693 unique complex SQL queries over
  200 databases spanning 138 domains, written and cross-reviewed by 11
  computer science students over about 1,000 hours. Each database averages
  27.6 columns and 8.8 foreign keys, and the corpus contains 1335 ORDER BY,
  1491 GROUP BY, 844 nested and 388 HAVING queries, against 0 of any of those
  in WikiSQL. 5 systems were run: Seq2Seq, +Attention, +Copying, SQLNet and
  TypeSQL, under an example split (8659/1034/2147) and a database split
  (146/20/40 databases).


  On the example split TypeSQL reaches 33.0 exact match; on the database split
  the best is SQLNet at 12.4, and TypeSQL drops to 8.2. WHERE clauses are
  hardest (19.8 F1 for SQLNet under database split), and accuracy falls as the
  number of foreign keys rises.


  The split comparison isolates generalization to unseen schemas cleanly,
  since the same models and data generation are held fixed. Models predate
  large pretrained LMs, values are not predicted, ambiguous and commonsense
  questions were excluded, and execution accuracy is not reported.


  Treat pre-Spider text-to-SQL numbers as inflated.
