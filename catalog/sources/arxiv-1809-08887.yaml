brief: >-
  Text-to-SQL accuracy above 80% on older benchmarks came largely from
  memorizing query templates, not parsing: when the same models must handle
  unseen databases and unseen complex queries, the best one reaches 12.4%
  exact match.


  Spider contains 10,181 questions and 5,693 unique SQL queries over 200
  multi-table databases spanning 138 domains, written and reviewed by 11
  computer science students over roughly 1,000 man-hours. Queries cover JOIN,
  GROUP BY, HAVING, ORDER BY, INTERSECT, EXCEPT and nesting, and the split is
  by database (146 train, 20 dev, 40 test) so no schema is shared.


  Five systems were evaluated: Seq2Seq, +Attention, +Copying, SQLNet and
  TypeSQL. Under example split TypeSQL leads at 33.0 exact match; under
  database split it drops to 8.2 and SQLNet becomes best at 12.4. Plain
  Seq2Seq falls from 9.4 to 3.7. WHERE is the weakest component (SQLNet 19.8
  F1 on database split), and accuracy falls as the number of foreign keys in a
  database grows.


  The effect is measured, with the example-split versus database-split
  contrast isolating generalization to new schemas on the same data and
  models. Spider also excludes ambiguous questions, value generation, and
  queries needing outside knowledge, so it understates real deployment
  difficulty.


  Treat pre-Spider text-to-SQL numbers as inflated by template reuse.
