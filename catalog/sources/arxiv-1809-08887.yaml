brief: >-
  Text-to-SQL accuracy reported on earlier benchmarks was inflated by template
  memorization: once the same SQL query and the same database cannot appear in
  both train and test, the best system of 2018 drops to 12.4% exact match.


  Spider is a hand-built dataset of 10,181 questions and 5,693 unique SQL
  queries over 200 multi-table databases spanning 138 domains, written and
  cross-reviewed by 11 computer science students over about 1,000 hours.
  Queries cover JOIN, GROUP BY, HAVING, ORDER BY, set operations and nesting;
  each database averages 27.6 columns and 8.8 foreign keys. Evaluation uses
  component matching, exact matching, and 4 hardness levels.


  Under the example split, TypeSQL reaches 33.0 exact match on test; under the
  database split it falls to 8.2, while SQLNet reaches 12.4. Plain Seq2Seq
  gets 3.7 on the database split. Extra-hard queries sit at 0.5–1.3 on the
  database split. WHERE clauses are hardest (F1 19.8 for SQLNet, database
  split), and accuracy falls as the number of foreign keys rises.


  The example-vs-database split contrast isolates schema generalization within
  the same models and data, which is the strongest part of the design. Value
  prediction, ambiguous questions, and common-sense or arithmetic queries were
  excluded, so the difficulty estimate is a lower bound. The 5 baselines are
  pre-transformer; treat the absolute numbers as historical and the split
  methodology as the durable contribution.
