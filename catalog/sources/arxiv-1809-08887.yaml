brief: >-
  Semantic parsers that score above 80% on ATIS and GeoQuery are largely
  matching memorized query templates, not parsing: when the same model
  families face unseen SQL queries on unseen database schemas, accuracy
  collapses to 12.4%.


  Spider is a hand-built text-to-SQL corpus from 11 computer science students
  over roughly 1,000 man-hours: 10,181 questions, 5,693 unique SQL queries,
  200 multi-table databases across 138 domains, averaging 27.6 columns and 8.8
  foreign keys per database. Annotation forced coverage of JOIN, GROUP BY,
  HAVING, ORDER BY, INTERSECT, EXCEPT and nested queries, and excluded
  ambiguous or common-sense questions. 5 models were run: Seq2Seq, +Attention,
  +Copying, SQLNet, TypeSQL.


  Under example split, TypeSQL reaches 33.0 exact match; under database split
  its best drops to 8.2, while SQLNet leads at 12.4. Plain Seq2Seq falls from
  9.4 to 3.7. WHERE clauses are hardest (F1 19.8 for SQLNet on database
  split), and accuracy declines as the number of foreign keys grows.


  The example-versus-database split is a direct controlled comparison on the
  same data, which isolates schema generalization as the cause. Caveats: all
  baselines predate pretrained transformers, values are not predicted, and
  gold value lists are supplied.


  Treat pre-Spider parsing scores as upper bounds inflated by template reuse.
