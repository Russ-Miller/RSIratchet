brief: >-
  Text-to-SQL accuracy above 80% on older benchmarks came largely from
  memorizing query templates: when test databases and queries are both unseen,
  the same class of models drops to 12.4% exact match.


  Spider contains 10,181 questions and 5,693 unique SQL queries over 200
  multi-table databases spanning 138 domains, written and cross-reviewed by 11
  computer science students over roughly 1,000 hours. Unlike ATIS, GeoQuery or
  WikiSQL, it combines nested queries, JOIN, GROUP BY and ORDER BY with a
  split where no database appears in both train and test. Baselines are
  Seq2Seq, Seq2Seq+Attention, Seq2Seq+Copying, SQLNet and TypeSQL.


  Under example split, TypeSQL reaches 33.0 exact match on test; under
  database split the best is SQLNet at 12.4, with TypeSQL falling to 8.2. On
  extra-hard queries the database-split numbers are 0.5-1.3. Component F1
  shows WHERE is the weakest clause (19.8 for SQLNet, 16.0 for TypeSQL under
  database split), and accuracy declines as the number of foreign keys per
  database grows.


  The contrast between example split and database split is measured on the
  same data and models, which isolates cross-domain generalization well. The
  sketch-based models cannot emit nested queries, EXCEPT or INTERSECT at all,
  so their ceiling is structural rather than purely learned, and value
  prediction is excluded from the task.


  Treat pre-2018 semantic parsing scores as memorization-inflated unless the
  split separates databases.
