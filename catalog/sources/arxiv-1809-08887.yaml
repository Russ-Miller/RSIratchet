brief: >-
  Text-to-SQL accuracy reported on earlier benchmarks was largely template
  memorization: when target queries and databases are both held out,
  state-of-the-art parsers collapse to near-zero exact match.


  Spider is a hand-labeled dataset of 10,181 questions and 5,693 unique SQL
  queries over 200 multi-table databases spanning 138 domains, written and
  cross-reviewed by 11 computer science students over about 1,000 hours.
  Queries cover JOIN, GROUP BY, HAVING, ORDER BY, set operations and nested
  subqueries; each database averages 27.6 columns and 8.8 foreign keys. Models
  get the question plus schema and are scored by component matching and exact
  matching (values excluded).


  Under the example split, TypeSQL reaches 33.0 exact match on test. Under the
  database split, where the 206 databases are partitioned into 146 train, 20
  dev, 40 test, the best model is SQLNet at 12.4, and TypeSQL falls to 8.2. On
  extra hard queries, the best database-split score is 1.3. WHERE clauses are
  the weakest component (19.8 F1 for SQLNet, database split), and accuracy
  declines as foreign key count rises.


  The drop is measured across 5 models under matched splits on the same data,
  which isolates domain transfer from query novelty. All models predate
  pretrained LLMs; no value generation, no ambiguous questions, no common
  sense or arithmetic queries.


  Treat pre-Spider text-to-SQL numbers as inflated, and compare cross-database
  splits only.
