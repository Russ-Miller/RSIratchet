  parsing and text-to-SQL dataset annotated by 11 college students. It
  consists of 10,181 questions and 5,693 unique complex SQL queries on 200
  databases with multiple tables, covering 138 different domains. We define a
  new complex and cross-domain semantic parsing and text-to-SQL task where
  different complex SQL queries and databases appear in train and test sets.
