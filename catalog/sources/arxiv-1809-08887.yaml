brief: >-
  Text-to-SQL accuracy near 80% on older benchmarks came largely from reusing
  the same queries and the same single database in train and test; once
  databases and queries are held out, the same model classes collapse.


  Spider is 10,181 questions and 5,693 unique SQL queries over 200 multi-table
  databases spanning 138 domains, written and cross-reviewed by 11 computer
  science students over about 1,000 hours, with SQL covering JOIN, GROUP BY,
  HAVING, ORDER BY, INTERSECT, EXCEPT and nested subqueries. 5 systems were
  adapted and run: Seq2Seq, Seq2Seq+Attention, Seq2Seq+Copying, SQLNet, and
  TypeSQL.


  Under example split, TypeSQL reaches 33.0 exact match; under database split
  the best is SQLNet at 12.4, and TypeSQL falls to 8.2. Plain Seq2Seq drops
  from 9.4 to 3.7. Component F1 is worst on WHERE (52.4 example split, 19.8
  database split for the best models). Accuracy falls as the number of foreign
  keys per database grows.


  The contrast is measured, with the same models under both splits, which
  isolates generalization to unseen schemas from query novelty. Caveats:
  condition values are supplied rather than predicted, ambiguous and
  common-sense questions were excluded, execution accuracy is not reported,
  and the baselines predate pretrained language models.


  Treat pre-Spider text-to-SQL numbers as memorization-inflated.
