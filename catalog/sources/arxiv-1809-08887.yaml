brief: >-
  Text-to-SQL accuracy reported on earlier benchmarks was inflated by
  train/test overlap: once queries and databases are both unseen, the same
  class of models drops to near-zero on hard queries. Spider is the dataset
  built to expose that.


  The dataset holds 10,181 questions and 5,693 unique SQL queries over 200
  multi-table databases in 138 domains, annotated by 11 computer science
  students over roughly 1,000 man-hours, with SQL review, native-speaker
  question review and a final pass. Evaluation uses component matching, exact
  matching, and 4 hardness levels; values are supplied rather than predicted.
  Baselines are Seq2Seq, +Attention, +Copying, SQLNet and TypeSQL.


  Under example split the best model, TypeSQL, reaches 33.0 exact match on
  test; under database split the best is SQLNet at 12.4, and TypeSQL falls to
  8.2. Extra-hard queries land at 1.3 for SQLNet under database split. WHERE
  clauses are the weakest component (19.8 F1 for SQLNet, database split), and
  accuracy falls as the number of foreign keys per database rises.


  The cross-domain effect is measured, with the same models run under both
  splits, so the split is the isolated variable. Baselines predate large
  pretrained models, and Seq2Seq models mostly emit ungrammatical SQL, so the
  comparison may understate what sequence decoding can do. Value prediction,
  ambiguous questions and queries needing outside knowledge were excluded by
  construction.


  Treat pre-Spider text-to-SQL numbers as measuring template retrieval, not
  parsing.
