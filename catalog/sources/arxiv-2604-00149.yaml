summary: "While large language models (LLMs) promise to revolutionize
  automated scientific discovery, their application in rigorous real-world
  physical research is stalled by two critical barriers: a lack of realistic
  evaluation benchmarks and systemic LLM hallucinations. Here, we address both
  problems. We introduce QMP-Bench, a pioneering end-to-end research-level
  benchmark in quantum many-body simulation consisting of $100$ tasks
  extracted from $21$ high-impact prestigious journals, presenting a challenge
  even for current frontier LLMs. To establish a paradigm for reliable and
  transparent AI physicist"
