brief: >-
  Frontier LLMs cannot reliably reproduce published quantum many-body
  simulations, and the failures are not only syntactic: scripts that run
  cleanly still encode wrong physics, such as non-Hermitian hopping terms or a
  violated half-filling condition.


  QMP-Bench supplies 100 end-to-end tasks drawn from 21 published articles,
  each pairing the arXiv .tex source with a request to reproduce a specific
  figure using ITensors, NetKet, Qiskit, or ORCA (36 dmrg, 18 nqs, 20 qsim, 26
  dft). GPT-5.1, Gemini 2.5 Flash, Qwen3-Max, and Claude Sonnet 4 were run
  under ReAct, ReAct-RAG, a 1-shot variant, and PhysVEC, a 3-agent pipeline
  with a programming verifier (unit plus integration tests) and a scientific
  verifier (rubric, physical assertion, convergence tests).


  ReAct executability (pass@8) generally falls below 50% and ReAct-RAG rarely
  exceeds 75%; Claude Sonnet 4, the strongest, reaches only about 50% on nqs.
  PhysVEC approaches nearly 100% for several model-topic pairs, with steeper
  iteration curves and repeated-trial gains on 8 initially failed nqs tasks.


  The programming comparison spans 4 models and 4 topics with ablation against
  PhysVEC-1-shot, but token budgets are not matched: PhysVEC uses far more,
  with input typically under 1 million and output mostly under 0.3 million
  tokens per task. Physical validity was tested on only 5 dmrg tasks, and
  rubrics and assertions were hand-written.


  Treat executability as a weak proxy for scientific correctness.
