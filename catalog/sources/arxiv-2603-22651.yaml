brief: >-
  Self-correcting agent loops buy the top accuracy on financial document
  extraction but lose it at production volume, and a supervisor-worker design
  with caching and model routing gets most of the gain for near-baseline cost.


  The benchmark pits 4 orchestration patterns (sequential, parallel fan-out
  with merge, hierarchical supervisor-worker, reflexive self-correcting loop)
  against 5 models (GPT-4o, Claude 3.5 Sonnet, Gemini 1.5 Pro, Llama 3 70B,
  Mixtral 8x22B) on 10,000 SEC filings (10-K, 10-Q, 8-K) with 25 annotated
  field types, scored on F1, document accuracy, latency and cost per document.


  Reflexive with Claude 3.5 Sonnet tops field-level F1 at 0.943 and
  $0.430/doc, 2.30x the sequential baseline; hierarchical gets 0.929 at
  $0.261. Combining hybrid semantic caching, 2-tier routing and adaptive retry
  gives F1 0.924 at $0.148/doc, 1.15x sequential. Scaling from 1,000 to
  100,000 docs/day, reflexive drops to 0.871 and falls below hierarchical at
  50,000, while sequential degrades least (0.017).


  Effects are measured, with each architecture-model pair run on all 10,000
  documents, ablations isolating caching, routing and retry separately, and
  bootstrap confidence intervals; the scaling curves depend on one fixed
  8-node cluster and timeout policy, so the crossover points are
  infrastructure-specific. Annotation is in-house, English SEC filings only,
  25 fixed fields, January 2025 pricing.


  If you are sizing an extraction pipeline, treat target throughput as a
  first-class input to architecture choice.
