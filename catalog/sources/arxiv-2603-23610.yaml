  automation of complex software workflows remains an open problem. In
  long-horizon settings, agents frequently suffer from cascading errors and
  environmental stochasticity; a single misstep in a dynamic interface can
  lead to task failure, resulting in hallucinations or trial-and-error. This
  paper introduces $\\textit{Environment Maps}$: a persistent, agent-agnostic
  representation that mitigates these failures by consolidating heterogeneous
  evidence, such as screen recordings and execution traces, into a structured
