  intelligence, requires an agent to precisely follow a language-specified
  target. Yet most existing methods rely on single-agent imitation learning,
  suffering from costly expert data and limited generalization due to static
  training environments. Inspired by competition-driven capability
  evolution, we propose CoMaTrack, a competitive game-theoretic multi-agent
