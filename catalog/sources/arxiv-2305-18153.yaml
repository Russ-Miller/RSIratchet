summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Language models can flag questions that have no answer, but they do it worse
  than people, and the gap does not close with scale alone. Refusal ability
  grows with model size, instruction tuning, and in-context examples.


  SelfAware pairs 1,032 unanswerable questions, filtered from 2,858 collected
  from Quora and HowStuffWorks by 3 independent annotators, with 2,337
  answerable questions drawn from SQuAD, HotpotQA and TriviaQA (1,487, 182,
  668) selected as semantically nearest neighbours. Uncertainty in a generated
  answer is detected automatically by SimCSE similarity to a set of hedging
  reference sentences at threshold 0.75, scored as F1 with unanswerable as the
  positive class. 20 models were tested: GPT-3 and InstructGPT ladders, LLaMA,
  Alpaca, Vicuna, GPT-4.


  GPT-4 reached 75.47% F1 against a human benchmark of 84.93%. In-context
  learning lifted davinci by 27.96% over direct prompting, and Vicuna-13B beat
  LLaMA-65B. Closed-book accuracy on the answerable half rose from 2.48%
  (text-ada-001) to 10.61% (text-davinci-001) to 42.64% (GPT-4).


  The measurement is real but the instrument is soft: the human baseline comes
  from 2 volunteers on 100 samples in 30 minutes, GPT-4 was scored on 100
  instances rather than the full set, and hedging reference sentences were
  harvested only from GPT-3/InstructGPT outputs, which may miss other models'
  phrasings of uncertainty.


  Unanswerability here means subjective, speculative, philosophical or
  underdetermined questions, not factual gaps; only direct, instruction and
  ICL prompting were tried, with no reasoning-style methods. Treat refusal
  rates on this dataset as a prompt-format-sensitive property rather than a
  fixed model trait.
