summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models do express uncertainty on genuinely unanswerable questions more often
  than chance, but the best of them still lag humans, and the ability rises
  with scale, instruction tuning, and in-context examples.


  SelfAware pairs 1,032 unanswerable questions, drawn from Quora and
  HowStuffWorks and agreed unanswerable by 3 independent annotators, with
  2,337 semantically close answerable questions from SQuAD, HotpotQA and
  TriviaQA. Uncertainty in a model's free-text answer is detected
  automatically by SimCSE similarity to a reference set of hedging sentences,
  threshold 0.75, scored as F1 with unanswerable as the positive class, across
  20 LLMs including GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna and GPT-4, under
  direct, instruction, and ICL prompting.


  F1 grows with parameter count in all 3 input forms; ICL lifts davinci by
  27.96% over direct prompting; Vicuna-13B beats LLaMA-65B. GPT-4 reaches
  75.47% against a human benchmark of 84.93%. On answerable questions,
  closed-book accuracy rises from 2.48% (text-ada-001) to 10.61%
  (text-davinci-001) to 42.64% (GPT-4).


  The scaling and tuning effects are measured across model families, and a
  threshold ablation is reported. But the uncertainty detector is built from
  GPT-3/InstructGPT phrasings only, so other models' hedges may be missed; the
  human baseline is 2 volunteers on 100 samples, and GPT-4 was evaluated on
  100 samples rather than the full set. Only 3 prompting forms were tested.


  Treat self-knowledge as a prompt-sensitive, tuning-sensitive behaviour
  rather than a fixed model property.
