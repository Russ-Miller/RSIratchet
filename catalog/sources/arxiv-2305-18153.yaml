summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Language models can flag questions that have no answer, but less reliably
  than people, and the ability grows with scale, instruction tuning, and
  in-context examples.


  SelfAware pairs 1,032 unanswerable questions drawn from Quora and
  HowStuffWorks across 5 categories (no scientific consensus, imagination,
  subjective, too many variables, philosophical) with 2,337 answerable
  questions from SQuAD, HotpotQA and TriviaQA chosen to be semantically
  nearest. Uncertainty in free-text responses is detected automatically by
  SimCSE similarity to a reference set of hedging sentences, threshold 0.75,
  scored as F1 with unanswerable as the positive class, across 20 models
  including GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna and GPT-4.


  GPT-4 scores 75.47% F1 against a human benchmark of 84.93%. F1 rises with
  parameter count under all 3 input forms; ICL lifts davinci by 27.96% over
  direct prompting; Vicuna-13B beats LLaMA-65B. On answerable questions
  accuracy climbs from 2.48% (text-ada-001) to 10.61% (text-davinci-001) to
  42.64% (GPT-4).


  Measured, with ablations on model size, tuning, and input form, so the three
  factors are separated. The human baseline rests on 2 volunteers and 100
  samples, GPT-4 on 100 samples, and the uncertainty detector's reference
  sentences come only from GPT-3/InstructGPT outputs, so hedging phrased
  differently by other models may be missed. Nothing beyond direct,
  instruction and ICL prompting was tested.


  Use it as a cheap abstention benchmark, with the caveat that the metric is a
  similarity heuristic.
