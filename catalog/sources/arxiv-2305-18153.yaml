summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models can flag questions that have no answer, but the best of them still
  trails humans, and the ability tracks size, instruction tuning, and prompt
  form rather than emerging suddenly.


  SelfAware pairs 1,032 unanswerable questions collected from Quora and
  HowStuffWorks (3 annotators had to agree) with 2,337 answerable ones drawn
  from SQuAD, HotpotQA, and TriviaQA and matched for semantic closeness via
  SimCSE. Uncertainty in a free-text response is detected automatically by
  SimCSE similarity to a reference set of hedging sentences, threshold 0.75,
  scored as F1 with unanswerable as the positive class, across 20 models in
  the GPT-3, InstructGPT, LLaMA, Alpaca, and Vicuna families under direct,
  instruction, and in-context-learning prompts.


  GPT-4 reaches 75.47% F1 against a human benchmark of 84.93%. In-context
  examples lift davinci by 27.96% over direct prompting; Vicuna-13B beats
  LLaMA-65B, and closed-book accuracy on the answerable half rises from 2.48%
  (text-ada-001) to 10.61% (text-davinci-001) to 42.64% (GPT-4).


  Effects are measured, with a threshold ablation, but the human baseline
  comes from 2 volunteers on 100 samples and GPT-4 was tested on only 100
  instances. Reference hedging sentences were harvested from GPT-3 and
  InstructGPT outputs, so uncertainty phrased differently by other models may
  go undetected, and only 3 prompt forms were tried.


  Use it as a cheap probe of refusal calibration, not as a settled measure of
  self-knowledge.
