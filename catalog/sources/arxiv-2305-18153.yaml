summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models do partially recognize questions that have no answer, but the best of
  them still trails humans, and the ability tracks scale, instruction tuning,
  and prompt form rather than emerging suddenly.


  SelfAware pairs 1,032 unanswerable questions collected from Quora and
  HowStuffWorks, filtered by 3 independent annotators and spanning 5
  categories (no scientific consensus, imagination, subjective, too many
  variables, philosophical), with 2,337 answerable questions drawn from SQuAD,
  HotpotQA and TriviaQA and chosen by SimCSE to be semantically closest.
  Uncertainty in a generated answer is detected automatically by SimCSE
  similarity to a reference set of hedging sentences, threshold 0.75, scored
  as F1 with unanswerable as the positive class. 20 LLMs were tested: GPT-3,
  InstructGPT, GPT-4, LLaMA, Alpaca, Vicuna, under direct, instruction, and
  in-context learning prompts.


  F1 rises with parameter count in all 3 input forms. In-context learning
  gives davinci a 27.96% improvement over direct prompting. Vicuna-13B beats
  LLaMA-65B. GPT-4 leads at 75.47% against a human benchmark of 84.93%.
  Accuracy on answerable questions climbs from 2.48% for text-ada-001 to
  10.61% for text-davinci-001 and 42.64% for GPT-4.


  The measurement is real but thin at the top: the human baseline came from 2
  volunteers on 100 samples, and GPT-4 was scored on 100 samples while other
  models used the full set. Reference hedging sentences were harvested only
  from GPT-3/InstructGPT outputs, so other models' phrasings of uncertainty
  may be missed; only 3 prompt forms were tried.


  Treat the human-model gap figure as indicative, and the scaling and
  instruction-tuning trends as the sturdier result.
