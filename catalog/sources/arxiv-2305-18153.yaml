summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Large language models do express uncertainty on genuinely unanswerable
  questions more often than chance, and the tendency grows with scale,
  instruction tuning, and in-context examples, but still trails humans.


  The SelfAware dataset pairs 1,032 unanswerable questions, drawn from Quora
  and HowStuffWorks and kept only when 3 annotation analysts independently
  agreed, with 2,337 answerable questions pulled from SQuAD, HotpotQA, and
  TriviaQA and matched by SimCSE similarity. Unanswerable items fall into 5
  categories: no scientific consensus, imagination, completely subjective, too
  many variables, philosophical. Uncertainty in a generated answer is detected
  automatically by SimCSE similarity to a reference set of hedging sentences,
  threshold 0.75, scored as F1 with unanswerable as the positive class. 20
  LLMs were tested across GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna, and
  GPT-4, in direct, instruction, and ICL input forms.


  F1 rises with parameter count in all 3 input forms; ICL gives davinci a
  27.96% improvement over direct prompting; Vicuna-13B beats LLaMA-65B. GPT-4
  leads at 75.47% against a human benchmark of 84.93%. Answerable-question
  accuracy climbs from 2.48% (text-ada-001) to 10.61% (text-davinci-001) to
  42.64% (GPT-4).


  Evidence is measured, with a threshold ablation and clean scale and
  instruction-tuning contrasts, but the human baseline rests on 2 volunteers
  and 100 samples, GPT-4 was evaluated on only 100 instances, and the
  reference hedging sentences come solely from GPT-3 and InstructGPT outputs,
  which may undercount uncertainty phrasing from other families.


  Boundaries: only 3 prompting forms, no reasoning-style methods like
  Reflexion or ToT, and unanswerability here is intrinsic rather than
  context-dependent as in SQuAD2.0.


  Treat refusal behaviour as a scalable, tunable capability rather than an
  emergent one, but do not assume current models reach human levels of it.
