summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Language models can flag questions that have no answer, but the best of them
  still trails humans, and the ability rises with scale, instruction tuning,
  and in-context examples.


  SelfAware pairs 1,032 unanswerable questions collected from Quora and
  HowStuffWorks, agreed on by 3 independent annotators and spanning 5
  categories (no scientific consensus, imagination, completely subjective, too
  many variables, philosophical), with 2,337 answerable questions drawn from
  SQuAD, HotpotQA and TriviaQA and matched by SimCSE similarity. Uncertainty
  in the model's free text is detected automatically by SimCSE similarity to a
  reference set of hedging sentences at threshold 0.75, scored as F1 with
  unanswerable as the positive class, across 20 models including GPT-3,
  InstructGPT, LLaMA, Alpaca, Vicuna and GPT-4, under direct, instruction and
  ICL prompts.


  GPT-4 reaches 75.47% F1 against a human benchmark of 84.93% set by 2
  volunteers on 100 samples. ICL lifts davinci by 27.96% over direct
  prompting, Vicuna-13B beats LLaMA-65B, and closed-book accuracy on the
  answerable half climbs from 2.48% for text-ada-001 to 10.61% for
  text-davinci-001 and 42.64% for GPT-4.


  The effect is measured, with size and tuning varied within families and a
  threshold ablation reported, but the metric is a proxy: reference hedging
  sentences were drawn only from GPT-3 and InstructGPT outputs, so other
  models' phrasings of uncertainty may be missed. GPT-4 was evaluated on 100
  samples rather than the full set, the human baseline rests on 2 annotators,
  and only 3 prompt forms were tried.


  Use this if you want a scale-and-tuning trend line for abstention behaviour,
  but treat the absolute F1 numbers as tied to the similarity detector.
