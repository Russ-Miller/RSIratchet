summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models can flag questions that have no answer, but not as often as people
  can, and the gap persists at the frontier. Expressing uncertainty improves
  with scale, instruction tuning, and in-context examples.


  SelfAware pairs 1,032 unanswerable questions, drawn from 2,858 collected
  from Quora and HowStuffWorks and kept only when 3 annotators agreed, with
  2,337 answerable ones sampled from SQuAD, HotpotQA and TriviaQA (1,487, 182,
  668). Unanswerability falls into 5 categories: no scientific consensus,
  imagination, completely subjective, too many variables, philosophical.
  Uncertainty in a generation is detected automatically by SimCSE similarity
  to a reference set of hedging sentences, threshold 0.75, scored as F1 with
  unanswerable as positive.


  Across 20 LLMs (GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna, GPT-4), F1 rises
  with parameter count in all 3 input forms. ICL lifts davinci by 27.96% over
  direct prompting. Vicuna-13B beats LLaMA-65B. GPT-4 scores 75.47% against a
  human benchmark of 84.93%. On answerable questions, accuracy goes 2.48%
  (text-ada-001) to 10.61% (text-davinci-001) to 42.64% (GPT-4).


  The scale and tuning effects are measured across model series, but the human
  baseline comes from 2 volunteers on 100 samples given 30 minutes, and GPT-4
  was evaluated on 100 instances rather than the full set. Reference hedging
  sentences were harvested only from GPT-3 and InstructGPT outputs, so other
  models' phrasings of uncertainty may be missed. Only direct, instruction and
  ICL prompting were tried; no reflection or search-style methods.


  Use it as a cheap automated probe of refusal-on-unknowables, with the caveat
  that the detector is phrase-matching, not semantics.
