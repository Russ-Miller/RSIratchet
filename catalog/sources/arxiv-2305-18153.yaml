summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models do express uncertainty on genuinely unanswerable questions more often
  than chance, and that tendency grows with scale, instruction tuning, and
  in-context examples, but it still trails humans.


  The authors built SelfAware: 1,032 unanswerable questions scraped from Quora
  and HowStuffWorks, kept only when all 3 annotators agreed, spanning 5
  categories (no scientific consensus, imagination, subjective, too many
  variables, philosophical), plus 2,337 answerable questions matched by SimCSE
  similarity from SQuAD, HotpotQA, and TriviaQA. Uncertainty in a response is
  detected automatically by SimCSE similarity above 0.75 against a curated set
  of hedging reference sentences, scored as F1 with unanswerable as the
  positive class, across 20 LLMs (GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna,
  GPT-4) under direct, instruction, and ICL prompts.


  GPT-4 reaches 75.47% F1 against a human benchmark of 84.93%. ICL lifts
  davinci by 27.96% over direct prompting, and Vicuna-13B beats LLaMA-65B. On
  answerable questions, accuracy rises from 2.48% (text-ada-001) to 10.61%
  (text-davinci-001) to 42.64% (GPT-4).


  Effects are measured, with scale, tuning, and prompt form varied separately,
  but the human baseline rests on 2 volunteers over 100 samples and GPT-4 was
  evaluated on only 100 instances. The uncertainty detector's reference
  sentences came solely from GPT-3 and InstructGPT outputs, so hedging phrased
  differently by other models may be missed; only 3 prompt forms were tested.


  Useful if you want an abstention benchmark that is not context-dependent
  like SQuAD2.0.
