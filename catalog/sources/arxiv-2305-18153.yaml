summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models do express uncertainty on genuinely unanswerable questions more often
  than chance, and that ability grows with scale, instruction tuning, and
  in-context examples, but still trails humans.


  SelfAware pairs 1,032 unanswerable questions, drawn from Quora and
  HowStuffWorks and agreed unanswerable by 3 independent annotators, with
  2,337 answerable ones sampled from SQuAD, HotpotQA and TriviaQA via SimCSE
  for semantic proximity. Uncertainty in free-text replies is detected
  automatically by SimCSE similarity (threshold 0.75) to a curated set of
  hedging reference sentences, scored as F1 with unanswerable as the positive
  class, across 20 models including GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna
  and GPT-4, under direct, instruction and ICL prompts.


  F1 rises with parameter count in all 3 input forms; ICL lifts davinci by
  27.96% over direct prompting; Vicuna-13B beats LLaMA-65B. GPT-4 scores
  75.47% against a human benchmark of 84.93%. Closed-book accuracy on
  answerable questions goes from 2.48% (text-ada-001) to 10.61%
  (text-davinci-001) to 42.64% (GPT-4).


  The effect is measured, with scale and tuning varied separately and a
  threshold ablation reported, but the human baseline is 2 volunteers on 100
  samples and GPT-4 was tested on only 100 instances. Reference hedging
  sentences were harvested only from GPT-3/InstructGPT outputs, so other
  models' phrasings of uncertainty may be missed. Treat the headline gap as
  indicative, and the metric as prompt-sensitive.
