summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Models do express uncertainty on genuinely unanswerable questions more often
  than chance, and the ability grows with scale and instruction tuning, but
  the best model tested still trails humans.


  SelfAware pairs 1,032 unanswerable questions, drawn from Quora and
  HowStuffWorks and vetted by 3 independent annotators, with 2,337
  semantically close answerable questions from SQuAD, HotpotQA and TriviaQA.
  Uncertainty in free-text answers is detected automatically by SimCSE
  similarity to a reference set of hedging sentences at threshold 0.75, scored
  as F1 with unanswerable as the positive class, across 20 models including
  GPT-3, InstructGPT, LLaMA, Alpaca, Vicuna and GPT-4, under direct,
  instruction and in-context-learning prompts.


  F1 rises with parameter count in all 3 input forms; ICL gives davinci a
  27.96% improvement over direct prompting; Vicuna-13B beats LLaMA-65B. GPT-4
  reaches 75.47% against a human benchmark of 84.93%. Closed-book accuracy on
  the answerable half goes from 2.48% for text-ada-001 to 10.61% for
  text-davinci-001 and 42.64% for GPT-4.


  The effects are measured, with a threshold ablation reported, but the human
  baseline is 2 volunteers on 100 samples and GPT-4 was evaluated on 100
  instances only, not the full set. Reference hedging sentences were harvested
  from GPT-3 and InstructGPT outputs, so other models' phrasings of
  uncertainty may be missed. Only 3 prompt forms were tested.


  Treat refusal-calibration as scale- and tuning-sensitive rather than fixed.
