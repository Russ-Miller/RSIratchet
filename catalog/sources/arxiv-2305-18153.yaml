summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Language models can flag questions that have no answer at all, but less well
  than people, and the ability grows with scale, instruction tuning, and
  in-context examples.


  SelfAware pairs 1,032 unanswerable questions, drawn from Quora and
  HowStuffWorks and kept only when 3 annotators agreed, with 2,337 answerable
  questions matched by SimCSE similarity from SQuAD, HotpotQA, and TriviaQA.
  Unanswerability falls into 5 categories: no scientific consensus,
  imagination, completely subjective, too many variables, philosophical. 20
  models were tested, including the GPT-3 and InstructGPT series, LLaMA,
  Alpaca, and Vicuna, under direct, instruction, and ICL prompts. Uncertainty
  in a response is detected automatically by SimCSE similarity to a reference
  set of hedging sentences, threshold 0.75, scored as F1 with unanswerable as
  the positive class.


  GPT-4 reaches 75.47% F1 against a human benchmark of 84.93% from 2
  volunteers on 100 samples. ICL gives davinci a 27.96% improvement over
  direct prompting, and Vicuna-13B beats LLaMA-65B. On answerable questions,
  accuracy rises from 2.48% for text-ada-001 to 10.61% for text-davinci-001
  and 42.64% for GPT-4.


  The effect is measured, with a threshold ablation and clean size and tuning
  comparisons inside each family, but the uncertainty detector is the whole
  measurement, and its reference sentences were harvested only from GPT-3 and
  InstructGPT outputs, so hedging phrased differently by other models may be
  missed. GPT-4 was scored on 100 instances, not the full set, and the human
  baseline rests on 2 annotators. Only 3 prompt forms were tried; no
  calibration probe or fine-tuned detector baseline.


  Use SelfAware if you want an abstention benchmark where unanswerability is
  intrinsic rather than context-dependent, but treat the F1 numbers as
  detector-dependent.
