summary: Large language models (LLMs) have a wealth of knowledge that allows
  them to excel in various Natural Language Processing (NLP) tasks. Current
  research focuses on enhancing their performance within their existing
  knowledge. Despite their vast knowledge, LLMs are still limited by the
  amount of information they can accommodate and comprehend. Therefore, the
  ability to understand their own limitations on the unknows, referred to as
  self-knowledge, is of paramount importance. This study aims to evaluate
  LLMs' self-knowledge by assessing their ability to identify unanswerable or
  unknowable questions
ingested_at: 2026-09-19
brief: >-
  Language models can flag some questions as unanswerable, but the best of
  them still trails humans, and the ability scales with size and instruction
  tuning rather than appearing suddenly.


  SelfAware pairs 1,032 unanswerable questions collected from Quora and
  HowStuffWorks, in 5 categories (no scientific consensus, imagination,
  completely subjective, too many variables, philosophical), with 2,337
  answerable questions drawn from SQuAD, HotpotQA and TriviaQA, selected by
  SimCSE to be semantically closest to the unanswerable ones. Uncertainty in a
  model's free-text answer is detected automatically by SimCSE similarity
  (threshold 0.75) against a reference set of hedging sentences, scored as F1
  with unanswerable as positive; 20 models were tested across GPT-3,
  InstructGPT, LLaMA, Alpaca, Vicuna and GPT-4, under direct, instruction and
  in-context-learning prompts.


  GPT-4 reached 75.47% F1 versus a human benchmark of 84.93%. ICL lifted
  davinci by 27.96% over direct prompting, and Vicuna-13B beat LLaMA-65B. On
  answerable questions, accuracy went from 2.48% (text-ada-001) to 10.61%
  (text-davinci-001) to 42.64% (GPT-4).


  Effects are measured, with input form and instruction tuning varied within
  model families, which isolates those factors reasonably well. The human
  baseline rests on 2 volunteers and 100 samples, GPT-4 was evaluated on 100
  instances rather than the full set, and the uncertainty detector's reference
  sentences came only from GPT-3/InstructGPT outputs, so hedging phrased
  differently by other models may be missed.


  Treat refusal-to-answer as a trainable, prompt-sensitive behaviour, not a
  fixed property of a model.
