brief: >-
  Text-only LLMs get better at speech emotion recognition when prosody is
  described per vowel rather than per utterance. VowelPrompt force-aligns
  phonemes, extracts pitch level/slope/variation, intensity level/variation,
  and duration from each vowel segment, normalizes by speaker and vowel type,
  quantile-bins the values, and writes them into the prompt as phrases like
  "high F0, rising, loud, lengthened".


  Evaluation covers 5 corpora: IEMOCAP, MELD, CaFE (French), EmoDB (German),
  ASVP-ESD (mixed), with GPT-4o, LLaMA-3-8B-Instruct,
  LLaMA-4-Scout-17B-16E-Instruct, and Qwen2-7B-Instruct. Adaptation is LoRA
  SFT on 20% of training data plus GRPO with accuracy and format rewards.


  Zero-shot on GPT-4o, gains over a transcript-only prompt reach 7.80% UACC
  and 7.11% WF1 on IEMOCAP and 2.19%/3.25% on MELD; on LLaMA-3-8B up to
  3.64%/3.63%. Under SFT, Weighted F1 rises up to 3.14% on IEMOCAP and 2.17%
  on MELD. Cross-domain after SFT & GRPO, it beats SpeechCueLLM by 5.12%
  (IEMOCAP → MELD) and 6.96% (MELD → IEMOCAP).


  The comparison against a sentence-level prosody baseline is matched on
  inputs and splits, which isolates granularity as the cause. Counterfactual
  checks (prosody permutation, placebo descriptors, consonant-level variants,
  alignment perturbation) exist but their numbers sit in appendices not
  reproduced here.


  Limits: emotion classification only, English/French/German, forced alignment
  and a transcript required.


  If you are prompting an LLM with acoustic summaries, push the descriptors
  down to segment level.
