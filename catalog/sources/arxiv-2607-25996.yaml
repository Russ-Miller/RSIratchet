summary: >-
  Recent large language models (LLMs) have shown strong performance on
  software engineering tasks, yet most existing benchmarks evaluate code
  reasoning at the function level, where all relevant information is
  localized. This setting fails to reflect real-world development, which
  requires reasoning across multiple files and complex dependency
  structures. We introduce RepoReasoner, a benchmark for evaluating
  repository-level code reasoning. It assesses two complementary abilities:
  Output Prediction, which measures fine-grained, stateful execution
  reasoning across files, and Call Chain Prediction,
