brief: >-
  Declarative software architecture knowledge is close to saturated in current
  frontier models, and more prompt context helps recall categories while
  hurting trade-off reasoning. SAKE is a benchmark of 2154 author-written,
  dual-reviewed multiple-choice questions with 4 options each, stratified over
  8 categories (design patterns, quality attributes, architectural solutions,
  styles, scalable practices, quantum computing) and 4 word-count bins, run on
  11 proprietary and open-weight models at temperature 0 in zero-shot and
  five-shot settings.


  Overall accuracy clusters from 89.31% (GPT 5.4 Nano, five-shot) to 94.23%
  (Claude Opus 4.6, five-shot). Per category, Quality Attributes averages
  98.2% and Creational Patterns 97.1% zero-shot, while Architectural Solutions
  is the weakest at 89.5% and Quantum Computing at 90.3%. Overall accuracy
  rises with prompt length (shortest bin lowest for every model), but within
  Architectural Solutions it falls: Grok 4.1 Fast drops from 100% on the
  shortest prompts to 91.7% or less above 135 words.


  Effects are measured on identical 2114 scored items across both prompt
  settings, so zero-shot versus five-shot is matched. The context-length
  finding is correlational: bins differ in content, not just length, and the
  distractor-density explanation is argued rather than tested. Questions were
  authored and reviewed by the same 3 authors, with no external validation;
  95.6% first-pass agreement.


  Multiple choice does not test open-ended design judgment, and the
  LLM-augmented longer stems confound length with authoring process. Treat
  per-category scores, not aggregate ones, when deciding where to trust a
  model.
