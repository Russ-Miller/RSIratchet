brief: >-
  Current frontier models are near-saturated on declarative software
  architecture knowledge, and five-shot prompting is as likely to hurt as
  help. Overall accuracy clusters so tightly that cost, not accuracy, becomes
  the selection criterion.


  SAKE is a benchmark of 2154 author-written 4-option multiple-choice
  questions, stratified across 8 categories (Gang of Four pattern families
  plus quality attributes, architectural solutions, scalable practices,
  styles, and quantum computing) and 4 word-count bins. 11 models, including
  Claude Opus 4.6, GPT 5.4, Deepseek v3.2, and Qwen3 235B A22B, were scored at
  temperature 0 on the same 2114 test items in zero-shot and five-shot.


  Accuracy spans 89.31–94.23% across both settings. Quality Attributes
  averages 98.2% zero-shot; Architectural Solutions is the weakest at 89.5%.
  Five-shot helped Claude Opus 4.6 (+0.66%) but cost Deepseek v3.2 4.21%,
  which also fell to 78.3% on structural patterns. Longer prompts raised
  overall accuracy but lowered Architectural Solutions accuracy, e.g. Grok 4.1
  Fast from 100% on the shortest bin to 91.7% or less above 135 words.


  The category and length effects are measured on a fixed prompt template, but
  all questions were authored and reviewed by the same 3 authors, with 95.6%
  first-pass agreement and no external review. Multiple choice does not test
  open-ended design on a real system, and the length finding confounds length
  with distractor density, a cause the authors argue rather than isolate.


  Treat this as a floor test: failing it disqualifies a model, passing it says
  little about architecting.
