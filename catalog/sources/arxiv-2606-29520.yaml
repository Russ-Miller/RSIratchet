brief: >-
  Software architectural knowledge is close to saturated in current frontier
  models, but competence is uneven by category, and longer prompts help recall
  while hurting trade-off reasoning. SAKE is a multiple-choice benchmark of
  2154 author-written questions, 4 options each, stratified across 8
  categories drawn from Software Architecture in Practice and the Gang of Four
  patterns book, plus 4 context-length bins; 11 proprietary and open-weight
  models (Claude Haiku/Sonnet/Opus 4.5-4.6, GPT 5.4 and Nano, Gemini 3.1 Flash
  Lite, Grok 4.1/4.2, Deepseek v3.2, Mistral Small 4, Qwen3 235B) were run
  zero-shot and five-shot at temperature 0.


  Overall accuracy spans 89.31-94.23%. Quality Attributes sits near ceiling
  (98.2% zero-shot mean) while Architectural Solutions is consistently weakest
  (89.5% zero-shot, 88.4% five-shot). Five-shot prompting helps some models
  and hurts others, with Deepseek v3.2 dropping 4.21 points and falling to
  78.3% on structural patterns. On ASO, accuracy falls as prompts lengthen
  (Grok 4.1 Fast 100% on the shortest bin, 91.7% or less above 135 words), the
  reverse of the overall trend.


  The effects are measured on identical 2114 scored items with a fixed prompt
  template, so zero- vs five-shot is matched. But the distractor-density
  explanation for the ASO reversal is argued, not isolated; questions were
  authored and reviewed only by the 3 authors (95.6% first-pass agreement),
  with no external validation, no prompt-rephrasing test, and no open-ended
  design tasks.


  Use the per-category tables, not the headline score, when deciding where to
  trust a model.
