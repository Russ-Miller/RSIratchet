brief: >-
  Current frontier models already hold declarative software architecture
  knowledge near ceiling, and the gaps that remain are concentrated in
  trade-off reasoning rather than recall. Longer prompts help on recall
  categories and hurt on the reasoning-heavy ones, which cuts against the
  default that more context is better.


  SAKE is 2154 expert-authored 4-option multiple-choice questions, stratified
  over 8 categories drawn from Software Architecture in Practice and the Gang
  of Four, and 4 context-length bins by word count. 11 proprietary and
  open-weight models (Claude Haiku/Sonnet/Opus 4.5-4.6, GPT 5.4 and Nano,
  Gemini 3.1 Flash Lite, Deepseek v3.2, Grok 4.1/4.2, Mistral Small 4, Qwen3
  235B) were scored on the same 2114 test items, zero-shot and five-shot,
  temperature 0.


  Accuracy clusters between 89.31% and 94.23%. Quality Attributes averages
  98.2% zero-shot; Architectural Solutions is lowest at 89.5%, Quantum
  Computing 90.3%. Five-shot helps some models and hurts others (Deepseek v3.2
  drops 93.61% to 89.4%). Overall accuracy rises with prompt length
  (86.1-92.0% in the shortest bin), while ASO falls, e.g. Grok 4.1 Fast from
  100% on short prompts to 91.7% or less beyond 135 words.


  Effects are measured, with per-category and per-length breakdowns, but the
  length result is correlational: longer items were partly LLM-augmented, so
  complexity and length are confounded, and the distractor-density explanation
  is argued, not tested. Questions were authored and reviewed only by the 3
  authors; no external validation.


  Multiple choice does not measure open-ended design quality, and no
  contamination check is reported. Useful if you want a per-category trust map
  rather than a single leaderboard number.
