brief: >-
  Current frontier models sit near the ceiling on textbook software
  architecture knowledge, and the spread between the best and worst is small
  enough that accuracy is a weak basis for model choice. The interesting
  variation is by category, not by model.


  SAKE is 2154 author-written 4-option multiple-choice questions across 8
  categories drawn from Software Architecture in Practice and the Gang of Four
  book, stratified into 4 context-length bins by word count (0-134, 135-195,
  196-265, >266). 11 proprietary and open-weight models (Claude
  Haiku/Sonnet/Opus 4.5-4.6, GPT 5.4 and Nano, Gemini 3.1 Flash Lite, Grok
  4.1/4.2, Deepseek v3.2, Mistral Small 4, Qwen3 235B) were scored on 2114
  test items at temperature 0, zero-shot and five-shot.


  Accuracy ranges 89.31%-94.23% overall. Quality Attributes averages 98.2%
  zero-shot and Architectural Solutions 89.5%; Qwen3 235B stays within 1% of
  the top at 0.071 USD per million input tokens vs 5 USD for Claude Opus 4.6.
  Five-shot helps some models and hurts others, with Deepseek v3.2 dropping
  4.21%. Longer prompts raise overall accuracy but lower Architectural
  Solutions accuracy, e.g. Grok 4.1 Fast falls from 100% on the shortest bin
  to 91.7% or less above 135 words.


  The category and length effects are measured on a shared item set with a
  fixed prompt template, so settings are comparable. But all questions were
  authored and reviewed by the same 3 authors, with no external validation, no
  contamination check, and the length bins differ in content as well as
  length, so the length effect is confounded with distractor density, which
  the authors concede as their own explanation.


  Multiple-choice recall is not open-ended design; nothing here tests
  trade-off decisions on a concrete system, diagrams, or chain-of-thought and
  retrieval prompting.


  Use it as a floor test rather than a ranking: failure here disqualifies a
  model, success does not qualify it.
