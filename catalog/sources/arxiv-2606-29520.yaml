brief: >-
  Declarative software architecture knowledge is close to saturated in current
  frontier models, but competence is uneven by topic and longer prompts help
  recall while hurting trade-off reasoning.


  SAKE is a multiple-choice benchmark of 2154 author-written, dual-reviewed
  questions with 4 options each, stratified across 8 categories (design
  patterns, quality attributes, architectural solutions, styles, scalable
  practices, quantum computing) and 4 word-count bins. 11 proprietary and
  open-weight models (Claude Haiku/Sonnet/Opus 4.5-4.6, GPT 5.4 and Nano,
  Gemini 3.1 Flash Lite, Grok 4.1/4.2, Deepseek v3.2, Mistral Small 4, Qwen3
  235B) were scored zero-shot and five-shot at temperature 0 on the same 2114
  test items.


  Accuracy spans 89.31-94.23% overall. Quality Attributes averages 98.2%
  zero-shot, Architectural Solutions 89.5%. Five-shot helps some models
  (Claude Opus 4.6 +0.66%) and hurts others (Deepseek v3.2 -4.21%, dropping to
  78.3% on structural patterns). On Architectural Solutions, short prompts
  score highest (Grok 4.1 Fast 100%, falling to 91.7% or less past 135 words),
  the reverse of the overall trend.


  The effects are measured, with identical items across both prompting
  settings. But the questions were authored and reviewed only by the 3
  authors, with no external validation, no human expert baseline, and no
  contamination check; the length-versus-difficulty confound is argued
  (distractor density) rather than isolated.


  Use it as a floor test, not evidence of design competence; open-ended
  architecture work is untested here.
