brief: >-
  Current LLMs sit near the ceiling on declarative software-architecture
  knowledge, with proprietary and open-weight models separated by a few
  points, but competence is uneven by topic and more context hurts on
  trade-off reasoning.


  SAKE is a benchmark of 2154 expert-authored 4-option multiple-choice
  questions across 8 categories (3 from Gang of Four patterns, 5 from Software
  Architecture in Practice), stratified into 4 context-length bins by word
  count. 11 models, including Claude Opus 4.6, GPT 5.4, Deepseek v3.2 and Qwen
  3 235B A22B, were scored on 2114 held-in items at temperature 0 in zero-shot
  and five-shot.


  Accuracy spans 89.31%-94.23%. Quality Attributes averages 98.2% zero-shot
  while Architectural Solutions is lowest at 89.5%; Qwen 3 235B stays within
  1% of the best at 0.071 $ USD per million input tokens versus 5 USD for
  Claude Opus 4.6. Five-shot helps some models and hurts others, with Deepseek
  v3.2 dropping 4.21%. Overall accuracy rises with prompt length, but ASO
  accuracy falls with it.


  Effects are measured across all 11 models with a shared prompt template and
  the same scored items in both settings, so the zero-shot/five-shot
  comparison is matched. Distractor density as the cause of ASO degradation is
  argued, not isolated. Review was done by the 3 authors only; no external
  validation.


  Multiple-choice recall says nothing about open-ended design quality, which
  was not tested.


  Use per-category results, not the aggregate, when choosing a model as an
  architectural advisor.
