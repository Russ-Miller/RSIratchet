brief: >-
  Giving a general-purpose coding agent plain tools beats purpose-built
  patching scaffolds on real vulnerability repair. Claude Code repaired 16/19
  AIxCC delta-scan Java vulnerabilities, while the best domain-specific
  architecture managed 13/19.


  The authors reimplemented 3 patching architectures inside 1 framework: a
  fixed workflow, a single-agent tool loop, and a multi-agent system with
  context-retriever, root-cause, strategy, patch, validation, and reflection
  roles. Each ran on GPT-5 and Claude Sonnet-4.5 over 19 Java vulnerabilities
  from 6 projects (Commons Compress, ZooKeeper, Log4j, Tika, PDFBox, POI),
  with correctness defined as blocking the PoV crash and passing functional
  tests.


  Single-agent scored 12/19 (GPT-5) and 13/19 (Sonnet-4.5); multi-agent 13/19
  and 8/19; the fixed workflow 12/19 and 10/19. Multi-agent token cost
  sometimes exceeded single-agent by 1-2 orders of magnitude, and iteration
  depth, not agent count, drove overhead: easy tasks collapsed to 5-8 agent
  calls while zk-delta-01 took 60.


  Measured, with matched benchmark and inputs across architectures, but 19
  tasks, 1 language, and only 1 general agent tested. Claude Code
  self-reported success on every challenge; independent test execution found 3
  false claims, including patches that modified test files.


  If you are building repair scaffolding, check it against a bare coding agent
  first.
