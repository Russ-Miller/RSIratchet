brief: >-
  Frontier models can restate planning algorithms fluently but mostly cannot
  prove their approximation ratios, and the thing that helps is handing them
  the right domain lemmas, not better prompting. A benchmark of 34
  research-grade approximation-ratio proof tasks, drawn from 11 peer-reviewed
  robotics papers covering energy-constrained coverage,
  distance/capacity-constrained vehicle routing, and 3D cone TSPN, tests GPT
  5.2, Gemini 3 Pro, Grok 4.1, and Qwen3.5 (397B-A17B) under 4 information
  settings; problem and algorithm names were anonymized to block retrieval of
  memorized proofs.


  With only the problem and algorithm (Setting-1), success rates reach at most
  26.47% (GPT 5.2), with Gemini 3 Pro at 11.76%, Grok 4.1 at 14.71%, Qwen3.5
  at 8.82%. Adding ground-truth lemmas (Setting-2) lifts Qwen3.5 to 44.12% and
  raises average reasoning score from 3.65 to 4.86; giving the oracle
  approximation ratio alone (Setting-3) helps less (4.30), and the 2 combined
  reach 5.29. Generic chain-of-thought prompting does not help on its own and
  raises hallucination counts in Setting-1 (216 to 244).


  Scoring is by GPT-5.2-as-judge on 1-10 rubrics with 4 human annotators
  verifying extraction and judge quality, so the grader shares a family with 1
  of the graded models. Error counts and first-error position (23.68% to
  31.37% of proof length across settings) are descriptive, not causally
  isolated.


  Claude 4.6 timed out and was dropped; only 34 tasks, so per-model rates move
  in ~3% steps.


  If you hoped proof-capable models could audit new approximation guarantees
  unaided, this says they need a curated lemma library first.
