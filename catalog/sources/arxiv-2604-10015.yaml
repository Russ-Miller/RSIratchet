brief: >-
  Picking the right financial tools is largely solved for frontier models;
  reasoning over what those tools return is not. Across 13 LLMs,
  tool-selection and redundancy scores stay high while information utilization
  and final answer quality collapse.


  FinTrace is 800 expert-annotated trajectories over 34 financial task
  categories, built from 15,095 queries, run against 247 Financial Modeling
  Prep tools via MCP, and scored with 9 rubric metrics on 4 axes (3
  algorithmic, 6 LLM-judged by Claude-Sonnet-4.6).


  Claude-Opus-4.6 leads at 0.788 overall but scores only 2.65 Pass Rate, 3.34
  Final Answer Quality, and 3.23 Information Utilization on a 5-point scale.
  Small models game efficiency: Qwen-3.5-9B gets 1.000 Step Efficiency and
  Redundancy with 0.109 Tool-Calling F1. Reasoning QA is the worst category
  everywhere (0.62 for Opus, 0.45 for Gemini-3-Flash).


  The ranking survives an out-of-family judge (Spearman's rho = 0.989), 6
  blinded human annotators on 90 trajectories (kappa_w = 0.631-0.857), and
  leave-one-metric-out aggregation (Kendall's tau >= 0.974). Post-training on
  8,196 trajectories roughly doubles tool F1 (0.22 to 0.58 at 8B; 0.33 to 0.64
  at 32B), but DPO helps only at 32B, where early termination drops from 43.9%
  to 5.8% and answer quality rises 1.93 to 2.71; at 8B it regresses.


  All output metrics are LLM-judged against model-selected golden
  trajectories, and post-training covers 1 model family at 2 sizes.


  Use it if you are deciding whether tool-call accuracy is a usable proxy for
  agent quality; it is not.
