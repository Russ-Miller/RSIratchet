  powerful paradigm for solving complex, open-ended tasks through
  collaborative reasoning among specialized LLM agents, but they incur
  substantial operating costs due to repeated LLM invocations and
  long-horizon context accumulation. Existing cascade routing methods make
  one-shot, query-level decisions and cannot adapt to the dynamic,
  state-dependent nature of multi-step workflows, in which the right LLM at
  each step depends on evolving task progress, remaining task difficulty,
