summary: >-
  Large language models write correct code for isolated problems but remain
  far weaker at autonomous machine-learning development, where an agent must
  revise data pipelines, models, and validation over hours of feedback, and
  on most competitions still finishes below strong human competitors.
  Outcome-based benchmarks record this gap but not its cause, because they
  grade the final submission and discard the development process behind it.
