summary: >-
  Finite-state reasoning, the ability to understand and implement
  state-dependent behavior, is central to hardware design. In this paper, we
  present LLM-FSM, a benchmark that evaluates how well large language models
  (LLMs) can recover finite-state machine (FSM) behavior from
  natural-language specifications and translate it into correct register
  transfer-level (RTL) implementations. Unlike prior specification-to-RTL
