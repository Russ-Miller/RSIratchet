summary: Runtime guardrails are essential for reliable large language model
  (LLM) deployment, yet existing approaches typically rely on independent,
  external models that introduce additional inference cost, delayed safety
  signals, and a capacity mismatch with increasingly capable base models. To
  address these issues, we introduce SingProbe, a lightweight intrinsic
  runtime guard that directly reuses hidden states produced during LLM
  inference and operates alongside autoregressive decoding. Within a unified
  framework, SingProbe continuously predicts query intent, response safety,
  and hallucination risk a
