summary: >-
  Large language model (LLM) driven multi-agent systems have shown promise
  in complex clinical reasoning, yet existing approaches rely on static
  strategies and lack persistent clinical memory, preventing self-evolving
  from prior diagnostic successes and failures. We present EMR, a
  self-evolving medical multi-agent system via Experience Mining and Reuse.
  EMR introduces a hierarchical clinical experience library that organizes
  accumulated knowledge into three levels: clinical principles, diagnostic
  patterns, and representative cases. During inference, EMR emulates
