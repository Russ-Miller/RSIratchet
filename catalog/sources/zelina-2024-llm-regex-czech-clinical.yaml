title: 'From Examples to Patterns: LLM-Generated Regular Expressions for Entity
  Extraction in Czech Clinical Texts'
authors:
- Petr Zelina
year: 2024
date: '2024-12-01'
venue: RASLAN 2024
url: https://nlp.fi.muni.cz/raslan/2024/paper6.pdf
tags:
- forwarded
summary: Entity extraction in clinical texts is essential for converting unstructured
  data in clinical notes into structured formats, facilitating largescale analysis
  and clinical decision support. Traditional methods often rely on handcrafted regular
  expressions (regexes), which, while effective, demand significant time and specialized
  knowledge to create – resources that healthcare professionals may lack. We introduce
  a novel approach leveraging large language models (LLMs) to automate regex generation
  for clinical entity extraction. Our method involves prompting LLMs to generate
  regex patterns from examples, followed by iterative refinement using a feedback
  loop. Despite regex limitations, this approach is practical for extracting frequently
  patterned information common in clinical texts, such as dates, specific data about
  medical procedures or event detection. Our experiments on Czech clinical notes
  show this method outperforms current SOTA genetic-programming-based methods for
  generating regular expression patterns from examples, especially when there are
  few of them.
notes: 'Forwarded by Russ 2026-09-19 as one of ten papers on locators: generating
