summary: >-
  Scientific agents contribute to hypothesis discovery by synthesizing
  evidence, assessing proposals, and developing new explanations. Recent
  systems combine scientific agents with evolutionary search through
  critique, comparison, and revision. However, how different forms of agent
  collaboration affect hypothesis quality remains an open question.
  Answering this question requires separating the effects of agents'
  scientific capabilities from those of their collaboration. A framework
  must therefore preserve agents' scientific roles and support rules for
  combining, revising, and retaining hypothese
