summary: >-
  Large language models generate fluent text that can contain unfaithful
  claims -- a phenomenon known as hallucination. We present a multi-signal
  detection pipeline combining fine-tuned DeBERTa-v3 classification, Monte
  Carlo (MC) Dropout uncertainty quantification, and temperature-scaled
  calibration for response-level hallucination detection. Evaluated on the
  HaluEval benchmark, our pipeline achieves F1=0.915 and AUROC=0.977 on
  general-domain tasks, with per-task F1 scores of 0.97 (QA), 0.96
  (Summarization), and 0.82 (Dialogue). MC Dropout inference further
  improves accuracy to 93.2%. A context
notes: >-
  Filed as a source on domain-knowledge from the classifier's judgement that
  the paper is about it (improves, medium): The paper shows general-domain
  training transfers poorly to biomedical data (F1=0.52) while
  domain-matched pre-training (PubMedBERT fine-tuned on SciFact) improves
  performance to F1=0.63, attributing the gap to domain specificity. No
  claim has been drafted from it yet.
