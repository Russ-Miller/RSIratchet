brief: >-
  Vision-language models asked to answer only from retrieved evidence
  overwhelmingly fabricate answers rather than saying they cannot answer, and
  misleading text overrides correct visual evidence.


  VLM-DeflectionBench holds 2,775 samples drawn from 6 KB-VQA sources
  (InfoSeek, WebQA, E-VQA, MMDocRAG, MRAG-Bench, ViQuAE), filtered so that 4
  gating models all fail without context, then paired with gold and mined
  distractor contexts and scored in 4 scenarios: parametric, oracle,
  realistic, adversarial. 20 LVLMs were tested, open-weight 7B-72B plus
  Claude-4, GPT-5 and Gemini-2.5.


  With gold evidence only, LLaVA-OneVision still hallucinates on 41.6% of
  queries; Ovis2-34B reaches 66.5% accuracy versus Claude-Opus-4 at 49.1%.
  Under distractors only, Claude-Opus-4 deflects 88.3% while Qwen-2.5-VL
  answers incorrectly on 83.9%. When gold evidence is visual and distractors
  textual, Keye-1.5-8B and Mistral-Small-3.1 collapse to 1% accuracy with
  deflection above 80%. Raising distractors from 1 to 10 drops Ovis2-16B from
  59.8% to 35.9% accuracy, hallucination 36.5% to 57.6%.


  Effects are measured, with ablations over distractor modality, distractor
  count (1-10) and 4 prompt strictness levels; judging is GPT-4o SimpleQA,
  validated at >92% agreement and Cohen's κ = 0.91. Single pass per query, no
  repeated sampling, short-form QA only, and sources are text-centric.


  If you depend on strict-RAG grounding, treat abstention as unsolved, and
  note that stricter prompts buy deflection by destroying accuracy: Mistral
  falls from 57.7% to 9.2%.
