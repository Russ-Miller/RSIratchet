summary: Large Vision-Language Models (LVLMs) increasingly rely on retrieval
  to answer knowledge-intensive multimodal questions. Existing benchmarks
  overlook conflicts between visual and textual evidence and the importance of
  generating deflections (e.g., Sorry, I cannot answer...) when retrieved
  knowledge is incomplete. These benchmarks also suffer from rapid
  obsolescence, as growing LVLM training sets allow models to answer many
  questions without retrieval. We address these gaps with three contributions.
  First, we propose a dynamic data curation pipeline that preserves benchmark
  difficulty over time
