brief: >-
  Splitting a multi-hop QA task across 4 specialized agents costs more
  accuracy than the collaboration recovers, and a learned per-edge
  prompt-rewriting layer mostly just claws back what the single model already
  had.


  The proposal is Cognitive Fabric Nodes (CFN), a middleware that intercepts
  and rewrites every inter-agent message, with claimed functions for memory,
  topology selection, semantic grounding, security enforcement, and
  transformation. Only the rewriting function is tested: 4 agents (Researcher,
  Analyst, Critic, Synthesizer) on a directed graph, answering HotPotQA and
  MuSiQue questions where each agent sees only partial evidence, with per-edge
  rewriting policies optimized by LangMARL credit assignment plus TextGrad.
  All agents use Claude Sonnet 4.6.


  Single-model baselines are 92 on HotPotQA and 87.5 on MuSiQue. The
  multi-agent split drops these to 80.1 and 72.7. TextGrad alone gives 82.3
  and 76.2; CFN reaches 91.5 and 86.1, still below the single model.


  Measured, but on 1 model family, 2 datasets, mean over 5 training
  iterations, no variance reported and no ablation separating the 5 pillars.
  Security, routing, and grounding claims are argued and illustrated with
  hand-written examples, not evaluated.


  Treat this as evidence that language-space credit assignment repairs agent
  communication bottlenecks, not that the multi-agent decomposition pays.
