brief: >-
  Reinforcement learning from verifiable execution rewards raises GPU kernel
  correctness far more than it raises kernel speed. Fine-tuning GPT-5 on
  Triton generation lifted single-attempt functional correctness from 43.7% to
  77.0% (+33.3 percentage points), while geometric mean speedup over
  TorchInductor moved only from 0.73x to 0.81x, still below the compiler.


  The setup is Makora's RL environment: a curated 11,363-example PyTorch
  corpus (subsets of 100 and 1,000 used), a distributed H100 evaluation
  backend doing compile/validate/benchmark, reward-hack defenses via AST
  reachability analysis plus a GPT-5 judge, and evaluation on an extended
  264-problem KernelBench. Baselines include base GPT-5, Gemini 2.5 Pro,
  Claude, Grok.


  With 3 refinement attempts, correctness reaches 83.7%; adding web search,
  kernel evaluator and kernel search tools at inference raises it to 91.3%
  (+7.6), with speedup only +0.05. The MakoraGenerate agent solves up to 97.4%
  and beats TorchInductor on 72.9% at 2.12x geometric mean.


  Effects are measured, with a tool ablation and a data-curation ablation
  showing an in-distribution 100-example KernelBench subset (56.63%) beating a
  random 100 subset (40.96%). But comparisons are self-run, there is no
  matched-compute baseline, speedup comparisons shift with how many problems
  each model solves, and smaller Qwen models plateaued, so the method is
  unverified outside a strong base model.


  Treat RLVR here as a correctness fix, not a performance one.
