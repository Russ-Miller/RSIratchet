brief: >-
  Frontier models fail at ordinary retail banking arithmetic, and fine-tuning
  alone fixes formula generation but not the arithmetic itself; only routing
  the generated expressions to an external calculator closes the gap.


  BankMathBench contains 13,839 Korean and English question-answer-reasoning
  triplets on deposits, savings and loans, split into basic (single product),
  intermediate (two-product comparison) and advanced (multi-condition) levels,
  generated by GPT-4o and o1-mini, auto-verified by cross-checking two
  executable solutions, and reviewed by 2 retail banking professionals. 20
  open models up to 8B were evaluated zero-shot, after QLoRA SFT, and after
  tool-augmented SFT, against Claude Sonnet-3.5, Gemini-2.5-Flash and GPT-4o.


  Zero-shot, GPT-4o scores 67.8 basic, 14.4 intermediate, 6.3 advanced
  (English); Korean open-model averages were 18.0%, 0.8% and 0.5%. SFT raised
  Korean basic to a mean of 54.4 but left intermediate and advanced near zero.
  Tool-augmented SFT added 21.3, 71.1 and 62.8 points over SFT in Korean. On
  advanced, Qwen3-8B after SFT had only 1.75% exact accuracy but a 1.28%
  median relative error.


  The tool contribution is isolated by a matched SFT comparison on identical
  data; closed models were not fine-tuned, so no equal-adaptation baseline
  exists. Reasoning quality was not scored, and funds and insurance are
  absent.


  If you deploy a banking assistant, treat calculator calling as mandatory,
  not an optimisation.
