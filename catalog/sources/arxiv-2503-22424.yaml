brief: >-
  Constraining where a code agent is allowed to look beats letting it roam the
  repository: a two-phase search over call graphs plus a pruner nearly doubles
  function-level issue localization accuracy without training or indexing.


  CoSIL first picks suspicious files using a dynamically built module (import)
  call graph over a repository-structure tree, then runs an iterative
  function-call-graph search with 4 retrieval tools, a pruner agent that
  accepts or rejects each node, and a short-context reflection step to
  reformat final output. It is run with Qwen2.5-Coder-7B/14B/32B on SWE-bench
  Lite (300 instances) and Verified (500), against Agentless-FL, OrcaLoca, and
  LocAgent.


  With Qwen2.5-Coder-32B, function-level Top-1 is 0.433 on Lite and 0.446 on
  Verified, versus 0.247 and 0.326 for Agentless-FL and 0.103 and 0.250 for
  LocAgent. Empty recommendation rate falls to 0.00%-1.00% against LocAgent's
  13.67%-27.20%. Feeding top-3 locations into Agentless-1.5 repair raises
  resolution rate by 2.04%-30.5%.


  Ablations remove each component on Lite with the 32B model: dropping
  iterative search costs 27.8% of function Top-1, module call graph 11.5%,
  reflective alignment 9.9%, pruning 4.6%. Max-iteration sweep (1, 3, 5, 7,
  10) peaks at 10, so the chosen budget is the sweep's edge. Baselines run at
  their default configurations, not matched token budgets; CoSIL uses 0.07M
  tokens versus LocAgent's 0.53M on DeepSeek-v3.


  File-level gains are small or negative (LocAgent beats it at file Top-1 with
  32B), generalization tests use only 50-instance subsets, and CoSIL@40
  resolves 31.3% versus official Agentless-1.5's 32.0% despite 15% higher
  function Top-5 — better localization does not reliably convert to patches.
  Python-only, SWE-bench-only.


  If you build localization pipelines, treat pruning and graph-bounded search
  as the cheap wins and stop assuming localization accuracy transfers to
  resolution rate.
