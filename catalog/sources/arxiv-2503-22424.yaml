brief: >-
  Constraining an LLM's repository search with call graphs plus a pruner beats
  letting it roam the repo freely, and most of the gain shows up at function
  granularity rather than file granularity. CoSIL first expands file-level
  candidates using a dynamically built module call graph, then iteratively
  walks a function call graph with retrieval tools, rejecting irrelevant nodes
  via a pruner agent and reformatting final answers with a short-context
  reflection step. No training or pre-indexing.


  Tested on SWE-bench Lite (300 instances) and Verified (500) with
  Qwen2.5-Coder-7B/14B/32B against Agentless-FL, OrcaLoca, and LocAgent. With
  the 32B model, function-level Top-1 is 0.433 on Lite and 0.446 on Verified,
  versus 0.247 and 0.326 for Agentless-FL and 0.103/0.250 for LocAgent.
  File-level Top-1 is sometimes worse than baselines (LocAgent 0.647 vs CoSIL
  0.613 on Lite). Empty recommendation rate falls to 0.00%-1.00% against
  LocAgent's 12.80%-22.33%. Feeding locations into Agentless raises resolution
  rate by 2.04%-30.5%.


  Ablations remove each component: iterative search costs the most (Top-1
  0.433 to 0.320), module call graph ~10%, reflective alignment 6-10%, pruning
  ~3%. Iteration sweep shows performance dips then peaks at 10 iterations.
  Generalization to DeepSeek-v3 and GPT-4o is measured on 50-instance subsets
  only.


  Telling: with 40 patch samples CoSIL@40 resolves 31.3% versus
  Agentless-1.5's 32.0% despite 15% higher function Top-5, so better
  localization does not reliably convert into fixes. Python-only,
  SWE-bench-only.
