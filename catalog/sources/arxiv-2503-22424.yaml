brief: >-
  Constraining where a code agent is allowed to look beats letting it roam a
  repository freely. CoSIL localizes buggy functions by first expanding the
  file-level search space with a module call graph, then iteratively walking a
  function call graph, with a pruner agent rejecting irrelevant nodes and a
  short-context reflection step reformatting final output.


  Evaluated on SWE-bench Lite (300 instances) and SWE-bench Verified (500)
  against Agentless-FL, OrcaLoca and LocAgent, using Qwen2.5-Coder-7B/14B/32B,
  plus DeepSeek-v3-0324 and GPT-4o-2024-0806 on 50-instance subsets.


  With Qwen2.5-Coder-32B, function-level Top-1 is 0.433 on Lite and 0.446 on
  Verified, an average 96.04% gain over baselines; file-level gains are small
  (8.28% on Lite, 4.94% on Verified) and LocAgent beats it at file Top-1.
  Empty recommendation lists drop to 0.00% versus 13.67% for LocAgent. Feeding
  results to Agentless raises resolution rate by 2.04%–30.5%.


  Ablations isolate each part on Lite with the 32B model: removing iterative
  search costs 27.8% of function Top-1, the module call graph 11.9%,
  reflective alignment 9.9%, pruning 4.6%. Cost per instance is $0.02 with
  DeepSeek-v3 and $0.32 with GPT-4o. Comparisons are same-model and
  same-repair-pipeline; the generalization experiments use only 50 instances
  each.


  CoSIL@40 reaches 31.3% resolved, slightly below the official Agentless-1.5
  32.0% despite 15% higher function Top-5, which the authors attribute to
  sampling randomness. Python-only, SWE-bench-only.


  If you build localization pipelines, the finding to take is that
  search-space control and output-format repair matter more than tool breadth,
  and that better localization does not reliably convert into better patches.
