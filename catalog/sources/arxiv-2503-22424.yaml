brief: >-
  Constraining an LLM's repository search with call graphs plus a per-node
  relevance pruner and a short-context reformatting step roughly doubles
  function-level issue localization accuracy over free-exploration agents.


  CoSIL localizes GitHub issues in 2 phases: file-level selection using a
  dynamically built module call graph over the repository structure tree, then
  iterative function-level search over a function call graph with 4 retrieval
  tools, a pruner agent that accepts or rejects each retrieved snippet, and a
  reflective alignment query that reformats the final answer. It is run with
  Qwen2.5-Coder-7B/14B/32B on SWE-bench Lite and Verified against
  Agentless-FL, OrcaLoca, and LocAgent.


  With Qwen2.5-Coder-32B, function-level Top-1 is 0.433 on Lite and 0.446 on
  Verified, against 0.247 and 0.326 for Agentless-FL; average function-level
  Top-1 gain is 96.04%. Empty recommendation lists drop to 0.00%-1.00% versus
  12.80%-21.00% for LocAgent. Feeding Top-3 locations into Agentless-1.5
  raises resolution by 2.04%-30.5%.


  The component attribution is measured: removing iterative search costs about
  20% of performance, module call graph about 10%, reflective alignment 6-10%,
  pruning about 3%, on 1 model and 1 benchmark. Iteration budget was swept
  over 1, 3, 5, 7, 10. Cost is reported at $0.02 per instance on DeepSeek-v3
  and $0.32 on GPT-4o, but the cross-family check uses only 50 sampled
  instances per benchmark.


  File-level Top-1 sometimes drops below LocAgent, since broadening the file
  search space trades Top-1 for Top-5. Only Python, only SWE-bench, and
  CoSIL@40 ends at 31.3% resolved, below Agentless-1.5's reported 32.0%.


  Better localization scores do not automatically translate into more resolved
  issues, so treat localization gains as necessary rather than sufficient.
