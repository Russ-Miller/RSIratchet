brief: >-
  Constraining where an LLM may search in a repository beats letting it roam:
  a two-phase call-graph search with a pruner lifts function-level issue
  localization far more than file-level localization, and the gain carries
  into patch rates.


  CoSIL builds module call graphs for file-level breadth, expands them into
  function call graphs for iterative depth-first search, prunes irrelevant
  nodes with a separate agent, and adds a short-context reflection step to fix
  malformed tool-call output. It is compared against Agentless-FL, OrcaLoca
  and LocAgent on SWE-bench Lite (300 instances) and Verified (500), with
  Qwen2.5-Coder-7B/14B/32B, plus DeepSeek-v3-0324 and GPT-4o on 50-instance
  subsets.


  With Qwen2.5-Coder-32B, Top-1 function accuracy is 0.433 on Lite and 0.446
  on Verified, against 0.247 and 0.326 for Agentless-FL. File-level Top-1 is
  sometimes worse than LocAgent (0.613 vs 0.647 on Lite). Empty-result rate
  drops to 0.00%–1.00% versus 12.80%–13.67% for LocAgent. Feeding locations to
  Agentless raises resolution 2.04%–30.5%.


  Ablations isolate each part on 1 setting: removing iterative search costs
  ~20%, module call graph ~10%, reflective alignment ~6-10%, pruning ~3%.
  Costs are reported ($0.022-$0.341 per instance). The authors note the gains
  over a reproduced Agentless shrink at 40 patches: CoSIL@40 resolves 31.3% vs
  32.0% official Agentless despite 15% higher Top-5 function accuracy.


  Python-only, SWE-bench-only, with data-leakage risk acknowledged. If you
  build localization pipelines, treat search-space control as the lever, and
  expect localization gains to dilute downstream.
