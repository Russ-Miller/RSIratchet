brief: >-
  Constraining where an LLM may search a repository beats letting it roam: a
  2-phase search over dynamically built call graphs, plus a pruner that
  rejects irrelevant nodes, roughly doubles function-level issue localization
  accuracy without training or pre-indexing.


  CoSIL first reranks suspicious files using a module (import) call graph over
  a repository-structure tree, then expands into a function call graph and
  iteratively searches it with 4 retrieval tools, capped at 10 iterations,
  with a reflection query at the end of each stage to reformat output.
  Evaluated on SWE-bench Lite (300 instances) and Verified (500) with
  Qwen2.5-Coder-7B/14B/32B against Agentless-FL, OrcaLoca and LocAgent.


  With Qwen2.5-Coder-32B, function-level Top-1 is 0.433 on Lite and 0.446 on
  Verified, versus 0.247 and 0.326 for Agentless-FL and 0.103 and 0.250 for
  LocAgent. Average function-level Top-1 gain is 117.87% on Lite and 74.21% on
  Verified. Empty recommendation rate falls to 0.00% on Lite against
  LocAgent's 13.67%. Feeding top-3 locations into Agentless-1.5 raises
  resolution rate by 2.04%–30.5%.


  Ablations remove each component on 1 model and 1 benchmark: iterative search
  costs the most (Top-1 0.433 to 0.320), then module call graph (0.383),
  reflective alignment (0.390), pruning (0.413). Generalization to
  DeepSeek-v3-0324 and GPT-4o used only 50-instance subsets.


  File-level gains are small and sometimes negative: LocAgent beats CoSIL on
  Lite file Top-1 (0.647 vs 0.613). Downstream, CoSIL@40 resolved 31.3 against
  official Agentless-1.5's 32.0, which the authors attribute to sampling
  randomness. Python-only, SWE-bench-only, with acknowledged leakage risk.


  Treat better localization as necessary but not sufficient for higher patch
  resolution rates.
