brief: >-
  Constraining where a code-search agent can look next, rather than letting it
  roam a repository or trusting the issue text, is what drives function-level
  issue localization. CoSIL searches a dynamically built module call graph at
  the file level, expands it into a function call graph for iterative
  function-level search, uses a separate pruner agent to reject irrelevant
  nodes, and runs a short-context reflection query to reformat final output.


  Evaluated on SWE-bench Lite (300 instances) and SWE-bench Verified (500
  instances) with Qwen2.5-Coder-7B/14B/32B against Agentless-FL, OrcaLoca, and
  LocAgent.


  With Qwen2.5-Coder-32B, function-level Top-1 is 0.433 on Lite and 0.446 on
  Verified, versus 0.247 and 0.326 for the best baseline. File-level gains are
  small (0.613 vs LocAgent's 0.647 Top-1 on Lite). Empty recommendation lists
  drop to 0.00%-1.00% against LocAgent's 12.80%-21.00%. Feeding locations to
  Agentless raises resolution rate by 2.04%-30.5%.


  All 4 components were ablated on 1 model and 1 benchmark: iterative search
  is worth about 20% of performance, module call graph 10%, reflective
  alignment 6-10%, pruning only about 3%. Token cost is reported ($0.022 on
  DeepSeek-v3, $0.341 on GPT-4o per instance), so the comparison is not purely
  accuracy-blind, though baselines were run at their default retry limits
  rather than matched budget.


  The gain does not transfer cleanly downstream: CoSIL@40 resolves 31.3%
  versus Agentless-1.5's official 32.0% despite 15% higher Top-5 function
  accuracy. Python only, 2 SWE-bench subsets, generalization checked on
  50-instance samples.


  If you build localization pipelines, treat search-direction control and
  output-format repair as the levers, and expect localization gains to dilute
  at the patching stage.
