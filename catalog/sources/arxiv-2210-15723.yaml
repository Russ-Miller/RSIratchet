brief: >-
  Ranking crowd annotations by what bridges across opposing viewpoints, rather
  than by raw majority vote, produces notes that both change readers'
  agreement with misleading claims and are rated helpful across party lines.


  Twitter's Birdwatch data was used to fit a matrix factorization on a sparse
  note-rater matrix, with heavy regularization on intercepts (lambda 0.15 vs
  0.03 on factors) so a note only scores high if raters with differing latent
  factors call it helpful. Evaluation came from 3 waves of a survey experiment
  on stratified random samples of Twitter users (Wave Two N=7,387, Wave Three
  N=15,935), plus on-platform A/B tests.


  After 45 weeks, 15,368 notes on 10,321 Tweets from 2,558 users; filtering
  left 7,088 notes and 124,241 ratings, with final scores for 5,787 notes.
  Wave 3: algorithm-selected notes cut agreement with the Tweet's substance by
  about 26% (N=6,046, p << 0.001); 64% found them helpful. Wave 2: matrix
  factorization gave 41% less agreement vs 22% for any note and the same for
  supermajority voting. On-platform, exposure cut likes/retweets 25-34%.


  Effects are randomized and causal, with a supermajority baseline in Wave 2,
  but the A/B estimate is diluted by pipeline latency, notes were
  hand-filtered for inclusion (38 and 46 notes), and results are US-only.


  If you treat perceived accuracy as a proxy for belief, note that accuracy
  ratings correlated only r = 0.45 (control) and r = 0.29 (treated) with claim
  agreement and missed the effect entirely.
