brief: >-
  Ranking crowd annotations by whether they appeal across opposing viewpoints,
  rather than by raw majority vote, selects annotations that are both more
  persuasive and more acceptable to the side that usually distrusts labels.
  Twitter's Birdwatch algorithm factorizes the sparse rater-note matrix into
  1-dimensional user and note factors plus intercepts, with regularization on
  the intercepts set 5x higher (0.15 vs 0.03) than on the factors, so a note
  only earns a high intercept if raters with opposing factors both call it
  helpful.


  Training data came from a 45-week US pilot: 15,368 notes on 10,321 Tweets
  from 2,558 users, with 93,560 helpful, 56,328 not helpful and 10,789
  somewhat helpful ratings. Evaluation used 2 survey waves of stratified
  random samples of Twitter users (Wave 2, December 2021, N=7,387, 38 notes;
  Wave 3, April 2022, N=15,935, 46 notes) plus a live A/B test.


  Wave 3 notes cut agreement with a misleading Tweet's substance by about 26%
  (N=6,046, p &lt;&lt; 0.001), with no significant Democrat/Republican
  difference, and 64% found them helpful. In Wave 2, matrix-factorization
  notes cut agreement 41% versus 22% for any note and the same 22% for
  supermajority voting; perceived helpfulness rose about 3 points among
  Democrats and about 10 among Republicans. Live, annotation exposure reduced
  liking or retweeting 25-34%.


  Effects are randomized and causal, with a named supermajority baseline, but
  note sets were hand-filtered from 75 and 103 candidates, the algorithm
  comparison lives in 1 wave, and the A/B effect is diluted by pipeline
  latency. Perceived-accuracy questions showed no significant effect, and
  correlation with claim agreement fell from r = 0.45 to r = 0.29 under
  treatment. Nothing was tested outside the US, and the method needs some
  cross-partisan agreement to function at all.


  If you measure misinformation interventions with true/false accuracy scales,
  you may be missing the effect entirely.
