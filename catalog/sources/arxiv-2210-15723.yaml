brief: >-
  Ranking crowd annotations by whether they appeal across opposing viewpoints,
  rather than by raw majority approval, produces notes that are both more
  persuasive and more broadly acceptable. Twitter's Birdwatch algorithm
  factorizes the sparse note-rater matrix into 1-dimensional user and note
  factors plus intercepts, with regularization on intercepts set 5x higher
  than on factors (0.15 vs 0.03), so a note only scores highly if raters with
  opposing factor signs both call it helpful.


  Training data came from 45 weeks of the US pilot: 15,368 notes on 10,321
  Tweets from 2,558 users, with 93,560 helpful, 56,328 not helpful and 10,789
  somewhat helpful ratings. Evaluation used randomized survey waves of Twitter
  users (Wave 2, N=7,387, 38 notes; Wave 3, N=15,935, 46 notes) plus a
  platform A/B test.


  Wave 3 notes cut agreement with a misleading Tweet's substance by about 26%
  (N=6,046, p << 0.001), and 64% of users found them helpful. In Wave 2,
  matrix-factorization notes gave a 41% reduction versus 22% for any note and
  the same 22% for the 84% supermajority baseline; Republicans rated MF notes
  about 10 percentage points more helpful. On-platform, exposure cut likes and
  retweets 25-34%.


  Evidence is randomized with a named baseline, but the key
  MF-vs-supermajority comparison comes from 1 wave, and perceived-accuracy
  measures showed no significant effect, with correlation to claim agreement
  dropping from r = 0.45 to r = 0.29 under treatment. US-only, self-selected
  pilot contributors, and no adversarial-manipulation test.


  If you evaluate moderation interventions with true/false accuracy scales,
  this suggests you are measuring the wrong thing.
