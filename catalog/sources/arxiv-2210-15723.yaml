brief: >-
  Ranking crowd annotations by what appeals across opposing viewpoints, rather
  than by raw majority approval, selects annotations that are both more
  informative and more broadly liked. The gain comes from a matrix
  factorization on the rater-note matrix in which intercept terms are heavily
  regularized (0.15 vs 0.03 on factors), so a note only scores high if raters
  with differing latent viewpoints call it helpful.


  The data are from Twitter's Birdwatch pilot: after 45 weeks, 15,368 notes on
  10,321 Tweets from 2,558 users, with 7,544 raters producing 93,560 helpful
  and 56,328 not helpful ratings. Evaluation used 2 survey waves of stratified
  random samples of Twitter users (N=7,387 in December 2021, N=15,935 in April
  2022), plus on-platform A/B tests.


  Notes selected by the algorithm cut agreement with a misleading Tweet's
  substance by about 26% (N=6,046); 64% of users found them helpful. In Wave 2
  the head-to-head was 41% for matrix factorization vs 22% for supermajority
  voting (\u2265.84 helpful), with the helpfulness gap about 3 percentage
  points among Democrats and 10 among Republicans. Perceived Tweet accuracy
  correlated only r = 0.45 with claim agreement in control, dropping to r =
  0.29 under treatment, so accuracy-scale measures missed the effect entirely.
  A/B tests showed 25-34% fewer likes or retweets.


  Effects are randomized and causal, but the algorithm comparison is 1 wave,
  the sets are small (38 and 46 notes after filtering), the A/B treatment was
  diluted by pipeline latency, and everything is US-only and self-run by the
  platform.


  Bridging-based scoring is worth taking seriously, but it needs some
  cross-group agreement to exist at all.
