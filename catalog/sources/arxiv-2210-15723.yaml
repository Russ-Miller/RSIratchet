brief: >-
  Ranking crowd annotations by whether they appeal across opposed viewpoints,
  rather than by raw vote share, selects annotations that shift what readers
  believe and that partisans on both sides call helpful. This cuts against the
  expectation that polarized lay crowds cannot converge on usable fact-checks.


  The system is Twitter's Birdwatch: contributors write free-text notes on
  Tweets and rate others' notes. A matrix factorization over the sparse
  note-rater matrix estimates a 1-dimensional viewpoint factor per rater and
  note, with 5x higher regularization on intercepts (0.15 vs 0.03) so a note
  only scores high if raters with differing factors call it helpful. Trained
  on 45 weeks of pilot data: 15,368 notes on 10,321 Tweets, 93,560 helpful and
  56,328 not helpful ratings. Evaluation used 2 survey waves of stratified
  Twitter samples (N=7,387 December 2021; N=15,935 April 2022) plus an
  on-platform A/B test.


  Seeing an algorithm-selected note cut agreement with the misleading Tweet by
  about 26% in Wave 3 and 41% in Wave 2, versus 22% for any note and an
  identical 22% for the 0.84 supermajority baseline. 64% found notes helpful;
  the MF gain over baseline was about 3 percentage points among Democrats and
  about 10 among Republicans. Exposed users were 25-34% less likely to like or
  retweet.


  Effects are randomized and causal, with a supermajority baseline in Wave 2,
  but note sets are small (38 and 46 notes after filtering), 1 platform,
  US-only, and the A/B effect is diluted by pipeline latency.
  Perceived-accuracy questions showed no significant effect, correlating only
  r = 0.45 with claim agreement in control and r = 0.29 under treatment.


  If you measure misinformation interventions with true/false accuracy scales,
  you may be missing real effects.
