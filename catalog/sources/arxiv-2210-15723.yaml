brief: >-
  Ranking crowd annotations by what bridges across opposing viewpoints, rather
  than by raw helpfulness votes, selects annotations that both change readers'
  agreement with misleading claims and are accepted across party lines.


  Twitter's Birdwatch pilot produced 15,368 notes on 10,321 Tweets from 2,558
  users, with 93,560 helpful, 56,328 not helpful and 10,789 somewhat helpful
  ratings. A matrix factorization on the rater-note matrix, with heavy
  regularization on the intercept terms (0.15 vs 0.03), forces notes to earn a
  high global intercept only if raters with diverse latent factors rate them
  helpful. Evaluation came from survey waves on stratified samples of Twitter
  users: Wave 2 (N=7,387, 38 notes) and Wave 3 (N=15,935, 46 notes), plus
  on-platform A/B tests.


  In Wave 3 algorithm-selected notes cut agreement with the Tweet's substance
  by about 26% (N=6,046); 64% found them helpful; nearly 80% of Democrats and
  close to half of Republicans rated them somewhat or extremely helpful. In
  Wave 2 the matrix factorization gave 41% less agreement versus 22% for the
  supermajority baseline, with a 10-point helpfulness gain among Republicans.
  On-platform, exposed users were 25-34% less likely to like or retweet.


  Effects are randomized and causal, with a named supermajority baseline and
  an out-of-sample survey held apart from algorithm training; the A/B test
  suffers treatment dilution from pipeline latency, biasing estimates toward
  zero.


  Testing is US-only, English, 1 platform, and notes were hand-filtered before
  inclusion; adversarial manipulation was not tested.


  If you measure misinformation interventions by perceived post accuracy, note
  that accuracy correlated only r = 0.45 with claim agreement in control and r
  = 0.29 under treatment, and accuracy alone would have shown no effect.
