brief: >-
  Ranking crowd annotations by whether they appeal across opposed viewpoints,
  rather than by raw majority approval, produces annotations that both change
  readers' agreement with misleading claims and are rated helpful by both
  parties. The mechanism is a matrix factorization on the rater-note matrix
  with heavy regularization on the intercept terms, so a note only earns a
  high global score if raters with opposing latent factors both call it
  helpful.


  The data come from Twitter's Birdwatch pilot: after 45 weeks, 15,368 notes
  on 10,321 Tweets by 2,558 users, with 93,560 helpful, 56,328 not helpful and
  10,789 somewhat helpful ratings. Evaluation used 2 survey waves of
  stratified random samples of Twitter users: Wave Two in December 2021
  (N=7,387, 38 notes, used for algorithm selection) and Wave Three in April
  2022 (N=15,935, 46 notes).


  In Wave Three, seeing an algorithm-selected note cut agreement with the
  Tweet's substance by about 26% (N=6,046, p << 0.001), with no significant
  Democrat-Republican difference; 64% found notes helpful. In Wave Two,
  matrix-factorization notes cut agreement 41% versus 22% for any note and the
  same for supermajority voting, and were about 3 percentage points more
  helpful to Democrats and 10 points more to Republicans. A separate
  on-platform A/B test found 25-34% less liking or retweeting.


  Evidence is randomized at the individual level with control, treatment and
  evaluation arms, plus a supermajority baseline, so the bridging effect is
  isolated against a non-bridging comparator. Perceived Tweet accuracy
  correlated only r = 0.45 in control and r = 0.29 under treatment with claim
  agreement, and would have shown no significant effect, so proxy accuracy
  measures understate informativeness. Limits: US-only pilot, 1 platform,
  notes pre-filtered by hand, note selection partly by subjective quality
  thresholds, A/B effects diluted by pipeline latency, and the method needs
  some cross-partisan agreement to work at all.


  If you evaluate misinformation interventions on true/false accuracy scales,
  you may be measuring the wrong thing.
