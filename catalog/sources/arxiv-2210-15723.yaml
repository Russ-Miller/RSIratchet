brief: >-
  Ranking crowd annotations by whether they appeal across opposing viewpoints,
  rather than by raw helpful-vote share, produces annotations that reduce
  agreement with misleading posts and are rated helpful by both parties. The
  algorithm is a matrix factorization over Twitter's Birdwatch note-rater
  matrix, where a note's intercept term (heavily regularized relative to the
  1-dimensional factor vectors) becomes its global score, so a high score
  requires helpful ratings from raters with differing factors.


  Evidence comes from 3 waves of a survey experiment on stratified random
  samples of Twitter users who were not Birdwatch contributors (Wave Two,
  December 2021, N=7,387; Wave Three, April 2022, N=15,935), plus an
  on-platform A/B test. In Wave Three, notes selected by the algorithm cut
  agreement with the misleading Tweet's substance by about 26% (N=6,046, p <<
  0.001); 64% of users found them helpful. In Wave Two the
  matrix-factorization notes produced a 41% reduction versus 22% for any note
  and the same 22% for the supermajority baseline (.84 helpful threshold),
  with helpfulness gains of about 3 percentage points among Democrats and
  about 10 among Republicans. The A/B test found 25-34% fewer likes or
  retweets under exposure.


  Treatment was randomized and the supermajority baseline was measured, not
  argued, though 8 candidate algorithms were screened in the same wave used to
  pick the winner, and the effect size depends on sample engagement with the
  issues.


  Perceived Tweet accuracy correlated only r = 0.45 with claim agreement in
  control and r = 0.29 under treatment; using accuracy alone would have found
  no significant effect.


  Scope is 1 platform, US-only, during a limited pilot; adversarial
  manipulation was not tested, and the method needs some cross-partisan
  agreement to function at all.


  If you measure misinformation interventions with true/false accuracy scales,
  this suggests you are measuring the wrong thing.
