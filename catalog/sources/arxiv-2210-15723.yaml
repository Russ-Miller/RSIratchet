brief: >-
  Ranking crowd annotations by whether they appeal across inferred viewpoints,
  rather than by raw majority vote, produces annotations that both change
  readers' beliefs and are rated helpful by people on both sides of US party
  lines. Twitter's Birdwatch (Community Notes) scoring uses a matrix
  factorization on the sparse note-rater matrix, with heavy regularization on
  the intercept terms so a note's global score rises only when raters with
  diverse latent factors call it helpful.


  Evaluation came from 3 waves of a survey experiment on stratified random
  samples of Twitter users excluded from the pilot: Wave 2 (N=7,387, 38 notes)
  chose among 8 candidate algorithms, Wave 3 (N=15,935, 46 notes) tested the
  production one. Training data: 15,368 notes on 10,321 Tweets, filtered to
  7,088 notes and 124,241 ratings.


  Notes selected by the algorithm cut agreement with a misleading Tweet's
  substance by about 26% in Wave 3 (p << 0.001, N=6,046) and 41% in Wave 2,
  versus 22% for any note and the same 22% for the 0.84 supermajority
  baseline. 64% found them helpful; perceived helpfulness gained about 3
  percentage points among Democrats and about 10 among Republicans over
  baselines. An A/B test on live Twitter found 25-34% lower like/retweet
  rates.


  Random assignment isolates the note effect, and the supermajority comparison
  is matched within the same wave; the cross-algorithm comparison spans waves,
  and all work is by the platform's own team. Tweet-accuracy ratings showed no
  significant effect, correlating only r = 0.45 with claim agreement in
  control and r = 0.29 under treatment.


  US-only, 1 platform, and the method needs some cross-partisan consensus to
  function. If you study misinformation labels, stop using perceived-accuracy
  scales as a proxy for belief change.
