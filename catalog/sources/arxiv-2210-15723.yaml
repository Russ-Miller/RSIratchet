brief: >-
  Ranking crowd annotations by what bridges across polarized rater viewpoints,
  rather than by raw helpfulness vote share, selects annotations that change
  readers' agreement with misleading claims and appeal across party lines.


  Twitter's Birdwatch used matrix factorization on a sparse note-rater matrix,
  with heavy regularization on the intercept terms so that a note scores well
  only when raters with opposing latent factors rate it helpful. Training data
  came from a 45-week US pilot: 15,368 notes on 10,321 Tweets, 93,560 helpful
  and 56,328 not helpful ratings, filtered down to 7,088 notes and 124,241
  ratings. Evaluation came from 2 survey waves of stratified Twitter samples
  (N=7,387 December 2021; N=15,935 April 2022) plus a platform A/B test.


  In Wave 3, selected notes reduced agreement with the Tweet's substance by
  about 26% (p << 0.001, N=6,046), and 64% of users found them helpful. In
  Wave 2, matrix-factorization notes cut agreement 41% versus 22% for any note
  and the same for the supermajority baseline (≥.84 helpful), and were about
  10 percentage points more helpful to Republicans. Perceived Tweet accuracy
  correlated only r = 0.45 with claim agreement in control and r = 0.29 under
  treatment, and showed no significant treatment effect at all.


  The survey comparison is randomized and the supermajority baseline is
  matched, but algorithm selection and evaluation used different note pools,
  note sets were hand-filtered to 38 and 46 items, and the A/B engagement
  result (25-34% fewer likes/retweets) suffers acknowledged treatment
  dilution. US-only, 1 platform, self-conducted by the team that built the
  system.


  If you treat true/false accuracy ratings as a proxy for belief, this is
  direct evidence they miss real effects.
