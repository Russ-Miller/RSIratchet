brief: >-
  Ranking crowd annotations by whether they appeal across opposed viewpoints,
  rather than by raw helpfulness votes, produces annotations that measurably
  change what readers believe and how they share. Twitter's Birdwatch
  algorithm fits a matrix factorization to a sparse rater-note matrix, heavily
  regularizing the intercept terms so a note only scores well if raters with
  diverse latent factors call it helpful; the note intercept becomes its
  global score, with thresholds at 0.40 and -0.08.


  Training data came from a 45-week US pilot: 15,368 notes on 10,321 Tweets
  from 2,558 users, with 93,560 helpful, 56,328 not helpful and 10,789
  somewhat helpful ratings, filtered to 7,088 notes and 124,241 ratings.
  Evaluation used 3 survey waves of stratified random Twitter samples (Wave 2
  N=7,387, 38 notes; Wave 3 N=15,935, 46 notes), plus a live A/B test.


  In Wave 3, seeing an algorithm-selected note cut agreement with a misleading
  Tweet's substance by about 26% (N=6,046, p << 0.001); 64% found notes
  helpful. In Wave 2, matrix factorization gave 41% less agreement versus 22%
  for the supermajority-vote baseline, and was about 10 percentage points more
  helpful to Republicans, 3 to Democrats. On-platform, exposure cut
  likes/retweets by 25-34%.


  Effects are randomized and causally attributed, with a named supermajority
  baseline; the A/B test is diluted by pipeline latency, self-reported by the
  platform team, and confined to the US pilot and to topics where some
  cross-partisan agreement exists. Perceived-accuracy ratings correlated only
  r = 0.45 with claim agreement in control and r = 0.29 under treatment, and
  would have shown no effect at all.


  If you use accuracy scales as a proxy for belief change, this suggests you
  are measuring the wrong thing.
