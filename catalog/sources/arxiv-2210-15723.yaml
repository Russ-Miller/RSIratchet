brief: >-
  Ranking crowd annotations by whether they appeal across opposing viewpoints,
  rather than by raw vote share, produces notes that both reduce belief in
  misleading posts and are seen as helpful by people on both sides of the
  political spectrum. The system is Twitter's Birdwatch: a matrix
  factorization over the note-rater matrix, where heavy regularization on
  intercept terms (\u03bb_i = 0.15 vs \u03bb_f = 0.03) forces a note to earn a
  high global score only if raters with differing latent factors rate it
  helpful. It was fit on 15,368 notes and 160,677 ratings from the 45-week US
  pilot, filtered to 7,088 notes and 124,241 ratings, then evaluated in
  surveys of stratified random samples of Twitter users (Wave 2, N=7,387; Wave
  3, N=15,935) plus an on-platform A/B test.


  Notes chosen by the algorithm cut agreement with a misleading Tweet's
  substance by 26% (Wave 3, N=6,046, p << 0.001) and by 41% in Wave 2, against
  22% for supermajority voting (\u2265 .84 helpful) and for any note. 64% of
  Wave 3 users found selected notes helpful; the algorithm gained ~3 points of
  perceived helpfulness among Democrats and ~10 among Republicans. On
  platform, exposure cut Liking or retweeting by 25-34%.


  Effects are randomized and causal, with the algorithm trained before
  evaluation and analyzed by someone who did not build it. But note sets were
  hand-filtered (38 and 46 notes), the correlation-based RQ2 claim is
  observational, engagement estimates are diluted by pipeline latency, and
  everything is US-only during a small pilot.


  If you treat perceived-accuracy scales as a proxy for belief change, this
  argues against it: accuracy and claim agreement correlated only r = 0.45 in
  control and r = 0.29 under treatment, and accuracy alone would have shown no
  significant effect.
