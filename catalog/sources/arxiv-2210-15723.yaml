title: 'Birdwatch: Crowd Wisdom and Bridging Algorithms can Inform Understanding and Reduce
  the Spread of Misinformation'
authors: [Stefan Wojcik, Sophie Hilgard, Nick Judd, Delia Mocanu, Stephen Ragain, M. B. Fallin
    Hunzaker]
