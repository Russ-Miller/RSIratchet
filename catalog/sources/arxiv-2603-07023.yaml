  Multimodal Large Language Models with external knowledge, the transition to
  extensive contexts often leads to significant attention dilution and
  reasoning hallucinations. The surge in information density causes critical
  evidence to be submerged by voluminous noise, which complicates the
  discernment of relevant fragments within a dense input. In this paper, we
  propose \textbf{Hit-RAG}, a multi-stage preference alignment framework
  designed to resolve these cognitive bottlenecks through a progressive
