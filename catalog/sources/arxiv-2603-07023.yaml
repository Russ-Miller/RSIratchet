brief: >-
  Putting retrieved evidence in the prompt does not mean a model will use it;
  training the generator to prefer context-grounded answers, rather than
  improving retrieval, recovers most of the gap. Hit-RAG stacks 3 stages on
  top of a frozen retriever: SFT on contexts saturated to the model's token
  limit, DPO on pairs built from the model's own correct and incorrect
  generations, and GRPO with a reward combining answer correctness and
  agreement with a reranker's relevance scores.


  Backbones are Qwen3-4B/8B/32B, Llama3.1-8B/70B, and Qwen2.5-VL, evaluated on
  7 text QA sets (PopQA, HotpotQA, TQA, Pub, ARC, Bio, ASQA) plus ScienceQA,
  DocVQA, OK-VQA, A-OKVQA, with Top-20 BGE-M3 retrieval and roughly 10k
  training pairs.


  Qwen3-32B+Hit-RAG reaches 70.7 on PopQA and 69.3 EM on HotpotQA against 65.4
  and 42.7 for RankRAG-70B. Qwen2.5-VL-7B goes 85.12 to 92.97 on ScienceQA,
  above the 88.40 human baseline.


  The stage ablation is run on 2 backbones and shows RAG itself supplies most
  of the lift (Qwen3-8B PopQA 20.6 to 52.1), with SFT, DPO and GRPO adding
  58.4, 62.4, 63.1. Baselines are copied from prior papers, not rerun, so
  compute and retrieval setups are not matched.


  Gains shrink on stronger bases: Qwen3-VL-32B moves only 93.48 to 94.51. GRPO
  stalls when none of 8 samples is correct, and group sizes of 16 or 32 do not
  help.


  Useful if you are deciding whether to tune the generator or the retriever;
  treat the cross-paper comparisons as indicative only.
