summary: >-
  Embodied Vision-Language-Action (VLA) models are typically obtained by
  fine-tuning powerful pretrained VLMs on robotics data, yet it is unclear
  how much commonsense and factual knowledge they retain after adaptation.
  Failures on knowledge-sensitive tasks are ambiguous, conflating missing
  knowledge with poor generalization of low-level control. We introduce
  Act2Answer, a lightweight protocol that adapts VLM knowledge benchmarks to
  VLA evaluation by requiring agents to answer through action. Each question
  becomes a short tabletop episode where the agent performs a single
  object-placement action
