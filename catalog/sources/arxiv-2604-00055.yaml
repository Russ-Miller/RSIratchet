brief: >-
  A VLM only needs to shape the value function, not the policy, for
  long-horizon robot RL: querying it for 200K of 50M steps to initialize a
  critic captures most of the benefit, and per-step policy self-certainty
  supplies the rest of the dense signal with no external model in the loop.


  VLLR fine-tunes the SPOC foundation policy with PPO on the CHORES benchmark
  (20 discrete actions, 2 egocentric RGB cameras, held-out ProcThor houses
  from a 10:1 split of 191,568 houses). Claude-3.7-Sonnet decomposes tasks
  into subgoals from a scene graph; Nova Pro estimates progress, with median
  filtering to remove hallucinated spikes.


  On 4 in-distribution tasks, success rises to 87.6 on ObjectNav, 70.7 on
  Fetch, 97.0 on PickUp, 68.3 on RoomVisit, against FLaRe at 85.0, 65.23,
  91.8, 60.87. On 2 out-of-distribution tasks, ObjNavAff reaches 90.1 vs 79.7.
  Ablations on 3 tasks separate the parts: self-certainty alone gives 89.7 on
  ObjNavAff, VLM init alone 89.0, full 90.1.


  The component attribution is measured, but gains over FLaRe are small (up to
  5 % in-distribution) and the efficiency and convergence claims (30M vs. 50M
  steps) rest on single runs with no reported variance. 1 benchmark, 1 policy,
  discrete actions only; continuous-action manipulation untested. Useful if
  you were paying per-step for VLM rewards.
