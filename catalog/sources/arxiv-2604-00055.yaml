summary: Existing robotic foundation policies are trained primarily via
  large-scale imitation learning. While such models demonstrate strong
  capabilities, they often struggle with long-horizon tasks due to
  distribution shift and error accumulation. While reinforcement learning (RL)
  can finetune these models, it cannot work well across diverse tasks without
  manual reward engineering. We propose VLLR, a dense reward framework
  combining (1) an extrinsic reward from Large Language Models (LLMs) and
  Vision-Language Models (VLMs) for task progress recognition, and (2) an
  intrinsic reward based on policy self
