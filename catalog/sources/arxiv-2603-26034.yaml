brief: >-
  An agent's own binary self-reflection signal is enough to decide when to
  hand control from a small model to a large one, with no trained router.
  AgentCollab runs a short large-model warm-up, then lets the small model
  execute while emitting a progress rationale plus TRUE/FALSE indicator each
  step; consecutive FALSE signals grow the large model's takeover budget
  linearly (B0 = 2, k = 2).


  Tested inside 2 agent frameworks, DDV2 (7B/38B) and WebSailor (3B/7B/32B),
  on BrowseComp_zh (289), HLE-math (866), and WritingBench (1000), capped at
  40 iterations, served via vLLM-Ascend on Ascend 910B3 NPUs.


  On BrowseComp_zh with DDV2, accuracy goes 18.3 small-only to 33.9 versus
  34.6 large-only, at 1.36x speedup; WebSailor goes 14.2 to 22.5 against 25.5.
  HLE-math rises 8.0% to 21.1% at 2.31x. Baselines at the same model pairs are
  weaker: RouteLLM 28.2, FrugalGPT 27.2, TRiM 29.6, Miroflow 31.2, WeDAS 30.8.


  Measured, with matched model pairs and ablations on static versus dynamic
  budget (32.5 to 33.9, switching ratio 49.64 to 45.07), progress-check
  frequency, k, and cross-family pairing (31.9-32.6). Speedup is
  local-deployment latency only; API latency was not compared, and the
  mechanism degrades with weaker instruction following, where false
  progress-check rates reach 7% in WebSailor versus 3% in DDV2.


  If you run multi-step agents, self-reflection may replace a learned router.
