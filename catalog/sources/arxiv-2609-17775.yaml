summary: >-
  Enterprise guideline documents mix narrative text, complex tables, and
  embedded images, and converting them into structured work artifacts still
  takes two to three days of manual effort each. Current language and
  vision-language models extract from such documents but offer no governed
  workflow beyond extraction: no validation, no consistency checking, no
  traceable artifact generation. We introduce SAGE, a governed multi-stage
  LLM pipeline organized around a shared versioned rule store with stable
  identifiers, schema-validated inter-stage contracts, and end-to-end
  provenance tracking. Extracted
