summary: "Multi-turn tool calling is a core evaluation scenario for large
  language model (LLM) agents. On public tool-calling benchmarks, open-weight
  models now approach or even surpass closed-source frontier models in
  aggregate accuracy. However, this metric averages over many different
  multi-turn situations and obscures whether progress is balanced across them.
