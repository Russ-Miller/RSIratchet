brief: >-
  Keeping a probabilistic belief over target direction on the sphere, rather
  than asking a VLM for a pixel location in an equirectangular panorama, fixes
  the directional drift that appears when an agent rotates. EAGOR is
  training-free: a frozen VLM produces a target-conditioned response map,
  which is lifted to a log-likelihood field on the sphere and accumulated in a
  spherical harmonic basis (bandlimit L = 7, 64 coefficients), with rotation
  handled exactly by Wigner-D matrices.


  Tested in Habitat-Sim on waypoint following and map-free navigation, on HOS
  and OSR-Bench for active visual search, and on a Unitree-Go2 with an
  Insta360-X3 camera.


  On HOS, Qwen2.5-VL-7B goes from 27.24 to 40.10 overall, and Gemma-3-12B from
  25.67 to 36.55. On OSR-Bench, Qwen2.5-VL-7B + EAGOR reaches 25.2% against
  16.8% for its backbone and 18.1% for Qwen2.5-VL-72B. Navigation success
  rises from 82 to 94, steps fall from 61.0 to 50.2, MAE from 45.9 to 33.8,
  and temporal inconsistency from 11.6 to 2.6 per step.


  Effects are measured against three ERP-space baselines (Centroid, Cent-Circ,
  Grid) with the same backbones, which isolates the representation rather than
  model capacity; an ablation covers only the SH bandlimit. Real-robot results
  are qualitative. Failure analysis shows the method inherits VLM perception
  errors: 3.6% success on rare targets, 13.2% on OCR/fine-grained text.


  Treat panorama pixel coordinates as evidence, not as answers.
