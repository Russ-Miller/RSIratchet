  By fixating on simple retrieval and short-context inference, they neglect
  the multifaceted nature of complex memory systems, such as dynamic state
  tracking and hierarchical reasoning in continuous interactions. To
  overcome these limitations, we propose MemGround, a rigorous long-term
  memory benchmark natively grounded in rich, gamified interactive
  scenarios. To systematically assess these capabilities, MemGround
