summary: >-
  Code large language models (LLMs) can generate syntactically plausible
  programs that nevertheless violate hidden semantic constraints. Existing
  execution-feedback training methods identify whether a completed program
  fails, but provide limited supervision about how a correct solution should
  be organized. We introduce GraphAlignCoder, a training framework that
  transfers explicit correctness structure into code generation.
  GraphAlignCoder constructs an implementation graph that captures control
  and dependence among program regions. In parallel, a constrained Lean
  pipeline produces proof traces,
