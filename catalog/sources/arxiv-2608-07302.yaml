summary: >-
  Large Vision-Language Models (LVLMs) often suffer from object
  hallucination, generating objects that are absent from the image. Prior
  work largely attributes this to insufficient visual attention. However, we
  find that both real and hallucinated objects receive equally strong visual
  attention in the model's mid-to-late layers, suggesting that the key issue
