summary: As real-world tasks grow increasingly complex, long-context reasoning
  has become a core capability for Large Language Models (LLMs). However, few
  studies explore which data types are effective for long-context reasoning
  and why. We find that structured table data with periodic structures shows
  strong potential for long-context reasoning. Motivated by this observation,
  we mathematically analyze tabular dependency structures using mutual
  information, revealing periodic non-vanishing dependencies in table data.
