brief: >-
  Training on synthetic SQL-over-tables with RL transfers to general
  long-context reasoning, and the transfer comes mostly from the table's
  periodic structure rather than its content. TableLong builds verifiable
  (table, question, answer) triplets from over 10,000 real tables (BIRD,
  CoSQL, Spider) plus LLM-extracted document tables, up to 32k tokens and up
  to 30 tables per instance, filtered to keep only items with pass rate 0 < P
  < 1, then trains with GRPO on 64 H20 GPUs.


  Across 7 long-context benchmarks (LongBench-v2, Loong, BrowsCompLong,
  GSM-Infinite, Oolong, Ruler, MRCR), average gains were 8.24% for
  DeepSeek-R1-Distill-Qwen-32B, 8.93% for the 14B, 4.94% for Qwen3-32B, 4.79%
  for Qwen2.5-32B-Instruct. Needle-in-a-Haystack rose from 87.95% to 99.40%
  (32B) and 69.30% to 91.20% (14B). Out-of-domain: +11.97% LiveCodeBench,
  +10.00% AIME 2025, +7.58% GPQA-Diamond, +2.69% MultiChallenge on the 32B.


  The mechanism claim is partly isolated: stripping cell semantics still beat
  baseline by 1.67% but lost 6.57% versus full data, and removing visible
  delimiters or injecting noise cost only about 0.77%. Scaling cells involved
  (0~30 to 0~300+) and tables (1 to 1~30) each added a few points.


  Boundaries: 1 backbone family (Qwen-derived), no matched-token baseline
  against other synthetic data types, and the mutual-information theory rests
  on assumed column-distribution distinctness. Worth reading if you pick
  post-training data for long-context RL.
