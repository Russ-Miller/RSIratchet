summary: >-
  Large language models (LLMs) have demonstrated strong coding capabilities
  but still struggle to solve competitive programming problems correctly in
  a single attempt. Execution-based re-ranking offers a promising test-time
  scaling strategy, yet existing methods are constrained by either difficult
  test case generation or inefficient random input sampling. To address this
  limitation, we propose Agentic Verifier, an execution-based agent that
  actively reasons about program behaviors and searches for highly
  discriminative test inputs that expose behavioral discrepancies among
  candidate solutions. T
