summary: >-
  Building strong chart-to-code systems increasingly relies on reinforcement
  learning, whose effectiveness depends critically on the quality of the
  reward signal. Large Multimodal Models (LMMs) play a natural critical role
  in jointly assessing chart visual appearance and task requirements. They
  are therefore increasingly used as visual critics and reward models, yet
  their reliability as judges remains largely unexplored. To this end, we
  introduce ChartJudgeBench, a diagnostic vision-language benchmark for
  assessing LMM judges in chart-to-code workflows. It includes 1,003 Chart
  Perception Alignme
