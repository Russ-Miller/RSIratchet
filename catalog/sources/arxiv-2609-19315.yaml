summary: >-
  Large language models (LLMs) provide a flexible interface for long-horizon
  robot planning, but generated plans often fail to respect embodiment
  constraints, recover from planning errors, or reason effectively under
  partial observability. We present GAVEL, a framework for verifying and
  repairing long-horizon LLM planning built around an explicit graph world
  model. The graph represents relevant object-relations, action
