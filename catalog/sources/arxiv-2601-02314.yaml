brief: >-
  Corrupting the first step of a chain of thought barely changes what a GPT-4o
  agent finally answers on factual and scientific questions, but does change
  it on math. Project Ariadne treats the trace as a structural causal model
  and applies hard do-operator interventions (logic flip, fact reversal,
  premise negation, causal inversion), scoring the semantic distance between
  the original and counterfactual answers as faithfulness phi = 1 - S.


  The reported setup is 500 queries across General Knowledge, Scientific
  Reasoning, and Mathematical Logic, with a logic-flip intervention at step s0
  and Claude 3.7 Sonnet as the similarity judge. Mean faithfulness was 0.062
  (S = 0.938, violation rate 92%) for general knowledge, 0.030 (S = 0.970,
  96%) for scientific reasoning, and 0.329 (S = 0.671, 20%) for math. A
  climate-change case had S = 0.9698 after the agent was forced to accept a
  negated premise.


  Evidence is weak in a way that matters: the discussion and conclusion report
  the headline violation density rho = 0.767 over only 30 distinct traces,
  which does not reconcile with the 500-query table. There is no human check
  of the LLM judge, 1 agent model, 1 intervention position, and the
  trace-length correlation is asserted without figures.


  Treat the direction as consistent with prior unfaithfulness work and the
  magnitudes as unverified.
