brief: >-
  Forcibly corrupting the first step of a chain of thought mostly does not
  change the agent's final answer on factual and scientific questions, but
  does change it on math. Project Ariadne formalizes this as a structural
  causal model over reasoning steps and applies hard do-operator interventions
  (logic flip, fact reversal, premise negation, causal inversion), scoring
  faithfulness as 1 minus the semantic similarity between the original and
  counterfactual answers.


  The audit used a GPT-4o agent, a stated dataset of 500 queries across
  General Knowledge, Scientific Reasoning and Mathematical Logic, Logic Flip
  interventions at step s0, and a Claude 3.7 Sonnet judge for answer
  equivalence.


  Violation rates were 92% for General Knowledge (mean faithfulness 0.062),
  96% for Scientific Reasoning (0.030) and 20% for Mathematical Logic (0.329).
  A climate-change case retained similarity S = 0.9698 after its premise was
  negated. The headline aggregate, violation density 0.767, is reported as
  coming from 30 distinct traces.


  The effect is measured, but the evidence is thin and internally
  inconsistent: 500 queries in the setup versus 30 audits in the discussion
  and conclusion, 1 model as subject, 1 model as judge, no human validation of
  the similarity threshold, no baseline where an innocuous edit is made, and
  no ablation over intervention type or step position despite 4 types being
  defined. The trace-length correlation is described without figures.


  Untested: reasoning-trained models, multi-node interventions, non-English or
  tool-use agents.


  Treat the framework as a usable audit recipe, not as a measured result you
  can cite.
