brief: >-
  Corrupting the first step of a chain of thought barely changes what the
  model answers on factual and scientific questions; math is the exception.
  That makes the trace a narrative layer, not a generative driver, for
  retrieval-style tasks.


  Project Ariadne treats a reasoning trace as a structural causal model and
  applies hard do-operator interventions to a step, flipping logic, negating
  premises, or reversing facts, then re-runs the agent and scores the semantic
  distance between original and counterfactual answers. Traces came from a
  GPT-4o-based agent; a Claude 3.7 Sonnet instance judged answer equivalence.
  Interventions were logic flips at step s0.


  Violation rates were 92% for General Knowledge (mean faithfulness 0.062),
  96% for Scientific Reasoning (0.030), and 20% for Mathematical Logic
  (0.329). A climate-change case held at S = 0.9698 after the premise was
  negated. Longer traces correlated with higher similarity on general
  knowledge, not lower.


  Evidence is thin and internally inconsistent: the setup claims 500 queries,
  the discussion and conclusion report 30 audits with ρ = 0.767. One agent
  model, one intervention type, one step position, an LLM judge with no
  reported human agreement, no baseline on non-substantive edits, no
  calibration of the thresholds τ_sim and λ.


  Treat the direction as plausible and the magnitudes as unverified.
