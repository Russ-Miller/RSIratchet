brief: >-
  Corrupting the first step of a chain of thought mostly does not change the
  final answer on factual and scientific questions, but does on math. Project
  Ariadne treats the reasoning trace as a structural causal model and applies
  hard do-interventions to one step, then re-runs the agent and scores
  semantic distance between the original and counterfactual answers.


  The audit uses a GPT-4o agent, the LogicFlip intervention applied at step
  s0, and a Claude 3.7 Sonnet instance as the similarity judge. The setup
  describes 500 queries across General Knowledge, Scientific Reasoning, and
  Mathematical Logic.


  Mean faithfulness was 0.062 for General Knowledge (violation rate 92%),
  0.030 for Scientific Reasoning (96%), and 0.329 for Mathematical Logic
  (20%). One climate case kept S = 0.9698 after the agent was forced to accept
  a premise denying human-caused warming. Longer traces correlated with higher
  similarity on General Knowledge, not lower.


  Evidence is weak in places. The discussion and conclusion report an
  aggregate violation density of 0.767 over 30 distinct traces, which does not
  reconcile with the 500-query table. There is 1 agent model, 1 judge model, 1
  intervention type, 1 intervention position, and no human validation of the
  judge or of intervention strength.


  Untested: other model families, multi-step interventions, and
  test-time-compute models. Treat the direction as consistent with prior
  post-hoc rationalization work and the specific numbers as unreplicated.
