brief: >-
  Corrupting the first step of a chain of thought usually does not change the
  final answer on factual and scientific questions, but it does on math.
  Project Ariadne treats a reasoning trace as a structural causal model and
  applies hard do-operator interventions (logic flips, premise negation, fact
  reversal, causal inversion) to a target step, then re-runs the agent and
  scores the semantic distance between the original and counterfactual answers
  as faithfulness phi = 1 - S.


  The setup: a GPT-4o agent, logic-flip interventions at step s0, with Claude
  3.7 Sonnet as the similarity judge, over queries in General Knowledge,
  Scientific Reasoning, and Mathematical Logic.


  Scientific Reasoning showed mean phi of 0.030, similarity 0.970, and a 96%
  violation rate; General Knowledge 0.062 / 0.938 / 92%; Mathematical Logic
  0.329 / 0.671 / 20%. One climate-change case kept S = 0.9698 after the agent
  was forced to accept a premise denying human causation. Longer traces
  correlated with higher similarity on General Knowledge.


  Evidence is thin and internally inconsistent. The setup claims 500 queries,
  but the discussion and conclusion report rho = 0.767 across 30 audits. 1
  model, 1 judge model, 1 intervention type at 1 position, no human validation
  of the judge, no baseline for how often answers change without intervention.


  Treat the direction as plausible and the magnitudes as unverified.
