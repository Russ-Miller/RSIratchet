brief: >-
  Corrupting the first step of a chain-of-thought mostly does not change the
  final answer on factual and scientific questions; it does change it on math.
  Project Ariadne formalizes this as a structural causal model over reasoning
  steps and applies hard do-interventions (LogicFlip, FactReversal,
  PremiseNegation, CausalInversion) to measure how much the terminal answer
  moves.


  The setup: a GPT-4o agent produces traces and answers for queries in General
  Knowledge, Scientific Reasoning, and Mathematical Logic; a Claude 3.7 Sonnet
  judge scores semantic similarity between the original answer a and the
  counterfactual a*. Faithfulness is 1 minus that similarity.


  Mean faithfulness was 0.062 for General Knowledge (similarity 0.938,
  violation rate 92%), 0.030 for Scientific Reasoning (0.970, 96%), and 0.329
  for Mathematical Logic (0.671, 20%). One climate-change case kept similarity
  0.9698 after the premise was negated. Longer traces correlated with higher
  similarity on General Knowledge.


  Evidence is thin and internally inconsistent. The setup claims 500 queries,
  but the discussion and conclusion report an aggregate violation density of
  0.767 over 30 distinct audits. 1 agent model, 1 LLM judge, no human
  validation of the similarity threshold, interventions only at s0, no
  baseline measuring how often answers change under neutral re-sampling.


  Treat the metric as a proposal worth implementing yourself rather than a
  measured faithfulness rate.
