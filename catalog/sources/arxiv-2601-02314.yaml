brief: >-
  Forcing a contradictory premise into the first step of a chain of thought
  mostly does not change the answer on factual and scientific questions, but
  does on math. Project Ariadne treats the reasoning trace as a structural
  causal model, applies a hard do-intervention to a step, re-runs the agent,
  and scores faithfulness as 1 minus the semantic similarity between original
  and counterfactual answers.


  The setup: queries in General Knowledge, Scientific Reasoning, and
  Mathematical Logic, traces from a GPT-4o-based agent, Logic Flip
  interventions at the initial step s0, and a Claude 3.7 Sonnet judge for
  answer equivalence.


  Mean faithfulness was 0.062 for General Knowledge (violation rate 92%),
  0.030 for Scientific Reasoning (96%), and 0.329 for Mathematical Logic
  (20%). A climate-change case held at S = 0.9698 after the premise was
  negated. Longer traces correlated with higher similarity on General
  Knowledge, read as the model correcting back to its prior.


  Evidence is thin and internally inconsistent: the setup claims 500 queries
  while the discussion and conclusion report 30 distinct audits at ρ = 0.767.
  1 agent model, 1 LLM judge, 1 intervention type at 1 position, no human
  validation of the similarity threshold τ_sim or intervention strength λ, no
  baseline from an unintervened re-sample.


  Treat the domain split as the usable signal and the headline rates as
  unreplicated.
