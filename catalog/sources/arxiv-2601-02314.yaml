brief: >-
  Corrupting the first step of a chain of thought often leaves the final
  answer unchanged, and the effect is strongest exactly where the model has
  strong parametric knowledge. Project Ariadne treats a reasoning trace as a
  structural causal model and applies hard do-operator interventions (logic
  flips, fact reversals, premise negations, causal inversions) to a single
  step, then re-runs the agent and measures semantic distance between the
  original and counterfactual answers.


  The audit used a GPT-4o agent over 500 queries in General Knowledge,
  Scientific Reasoning, and Mathematical Logic, with logic-flip interventions
  at step s0 and a Claude 3.7 Sonnet judge scoring answer equivalence.


  Mean faithfulness was 0.062 for General Knowledge (similarity 0.938,
  violation rate 92%), 0.030 for Scientific Reasoning (0.970, 96%), and 0.329
  for Mathematical Logic (0.671, 20%). A separate discussion reports violation
  density 0.767 over 30 traces. In one case the agent was forced to accept a
  premise denying human-caused climate change and still produced an answer at
  S = 0.9698 to the original.


  Evidence is thin in ways that matter: 1 model family under audit, 1 LLM
  judge with no reported human validation, interventions only at s0, no
  ablation over intervention type or threshold, and an unexplained gap between
  the 500-query table and the 30-trace headline figure. Longer traces
  correlating with higher similarity is reported without statistics.


  Treat low answer-sensitivity to perturbed steps as expected for factual
  recall, not as evidence a particular model is uniquely unfaithful.
