brief: >-
  Corrupting the first step of a chain-of-thought mostly does not change the
  final answer on factual and scientific questions, but does on math. Project
  Ariadne treats a reasoning trace as a structural causal model and applies
  hard do-operator interventions (logic flips, premise negation, fact
  reversal, causal inversion) to one step, then re-runs the agent and scores
  how far the answer moves.


  The setup: a GPT-4o-based agent generates traces over queries in General
  Knowledge, Scientific Reasoning, and Mathematical Logic; interventions are
  Logic Flip applied at step s0; a Claude 3.7 Sonnet judge scores semantic
  similarity between original and counterfactual answers. Faithfulness is 1
  minus that similarity.


  Violation rate was 92% for General Knowledge (mean faithfulness 0.062), 96%
  for Scientific Reasoning (0.030), and 20% for Mathematical Logic (0.329). A
  climate-change case had similarity 0.9698 after the premise was negated.
  Longer traces correlated with higher similarity on General Knowledge.


  Evidence is thin and internally inconsistent. The setup claims 500 queries,
  but the discussion and conclusion report an audit of 30 distinct traces with
  density 0.767. 1 model family, 1 intervention type, 1 step position, an LLM
  judge with no reported validation, and no human baseline on whether a
  flipped premise should change the answer.


  Read the direction of the effect, not the magnitudes.
