brief: >-
  Corrupting a chain-of-thought step rarely changes the answer on factual
  questions, but often does on math. Project Ariadne treats the reasoning
  trace as a structural causal model and applies hard interventions
  (do-calculus) to a single step, then re-runs the agent and scores the
  semantic distance between the original and counterfactual answers as
  faithfulness phi = 1 - S.


  The audit used a GPT-4o agent over a stated dataset of 500 queries across
  General Knowledge, Scientific Reasoning, and Mathematical Logic, with a
  Logic Flip intervention applied at the first reasoning step and Claude 3.7
  Sonnet as the similarity judge.


  Scientific Reasoning showed mean faithfulness 0.030, similarity 0.970,
  violation rate 96%; General Knowledge 0.062, 0.938, 92%; Mathematical Logic
  0.329, 0.671, 20%. Aggregate violation density is reported as rho = 0.767.
  Longer traces correlated with higher similarity on General Knowledge, i.e.
  more chance to revert to the parametric prior.


  The effect is measured, but the evidence is thin and internally
  inconsistent: the setup says 500 queries while the discussion and conclusion
  report 30 distinct traces. There is 1 agent model, 1 intervention type, 1
  intervention position, an LLM judge with no reported human agreement, and no
  control for whether the counterfactual premise was even coherent.


  Nothing here covers test-time-compute models, multi-node interventions, or
  tool-using agents.


  Treat the direction as consistent with prior post-hoc-rationalization work;
  treat the specific numbers as unverified.
