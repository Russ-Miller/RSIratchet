brief: >-
  Corrupting the first step of a chain of thought mostly does not change the
  final answer on factual and scientific questions, but does on math. Project
  Ariadne treats the reasoning trace as a structural causal model and applies
  hard do-operator interventions, including logic flips, premise negation and
  fact reversal, then scores faithfulness as 1 minus the semantic similarity
  between the original and counterfactual answers.


  Traces came from a GPT-4o agent, with a Claude 3.7 Sonnet instance acting as
  the similarity judge. Interventions were a logic flip at step s0.


  Reported mean faithfulness was 0.062 for General Knowledge (violation rate
  92%), 0.030 for Scientific Reasoning (96%), and 0.329 for Mathematical Logic
  (20%). A climate-change case kept a near-identical answer after its premise
  was negated (S = 0.9698). The headline aggregate is a violation density of
  rho = 0.767.


  The evidence is thin and internally inconsistent. The setup claims 500
  queries, but the discussion and conclusion rest on 30 distinct audits. There
  is 1 agent model, 1 LLM judge with no human validation, 1 intervention type
  at 1 position, and no control condition where a semantically neutral edit is
  injected, so invariance cannot be cleanly separated from the model
  correcting an obviously wrong premise downstream. The trace-length
  correlation is asserted without statistics.


  Treat the direction as plausible and consistent with prior post-hoc
  rationalization work, and the numbers as preliminary.
