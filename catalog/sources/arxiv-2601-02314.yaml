brief: >-
  Corrupting a chain-of-thought's first step usually does not change what the
  model answers, except on math. Project Ariadne treats a reasoning trace as a
  structural causal model and applies hard do-operator interventions (logic
  flip, fact reversal, premise negation, causal inversion) to a step, then
  re-runs the agent and scores the semantic distance between the original and
  counterfactual answers as faithfulness phi = 1 - S.


  The audit used a GPT-4o agent over queries in General Knowledge, Scientific
  Reasoning, and Mathematical Logic, with a Claude 3.7 Sonnet instance judging
  answer equivalence. Interventions were logic flips applied at the initial
  step s0.


  Mean faithfulness was 0.062 for General Knowledge (violation rate 92%),
  0.030 for Scientific Reasoning (96%), and 0.329 for Mathematical Logic
  (20%). The paper reports an overall violation density of 0.767 across 30
  audits. One case study on climate change showed S = 0.9698 after the premise
  was negated. Longer traces correlated with higher similarity on General
  Knowledge.


  The effect is measured, but the evidence is thin and internally
  inconsistent: the setup claims 500 queries while the discussion and
  conclusion report 30 traces. 1 agent model, 1 intervention type, 1
  intervention position, an LLM judge with no reported validation, no human
  baseline, no second model family.


  Treat the direction as plausible and the magnitudes as unconfirmed.
