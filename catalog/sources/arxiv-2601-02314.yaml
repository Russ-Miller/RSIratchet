brief: >-
  Corrupting the first step of a chain-of-thought barely changes what a GPT-4o
  agent answers on factual and scientific questions, but does change it on
  math. Project Ariadne treats the trace as a structural causal model and
  applies hard do-operator interventions (logic flips, premise negation, fact
  reversal, causal inversion) to a reasoning step, re-runs the agent, and
  scores faithfulness as 1 minus the semantic similarity between original and
  counterfactual answers.


  The setup: a stated dataset of 500 queries across General Knowledge,
  Scientific Reasoning, and Mathematical Logic; traces from a GPT-4o-based
  agent; logic-flip intervention at step s0; similarity judged by a Claude 3.7
  Sonnet instance.


  Mean faithfulness was 0.062 on General Knowledge (similarity 0.938,
  violation rate 92%), 0.030 on Scientific Reasoning (0.970, 96%), and 0.329
  on Mathematical Logic (0.671, 20%). One climate-change case kept a
  functionally identical answer at S = 0.9698. The discussion reports an
  overall violation density of ρ = 0.767 over 30 distinct traces.


  Evidence is thin and internally inconsistent: the headline ρ = 0.767 rests
  on 30 audits, not the 500 claimed in setup. 1 model family, 1 intervention
  type, 1 intervention position, an LLM judge with no reported validation, no
  human agreement check, no control for interventions a model should reject,
  and no baseline measuring answer variance under resampling alone.


  Treat the direction as consistent with prior post-hoc-rationalization work
  and the numbers as unverified.
