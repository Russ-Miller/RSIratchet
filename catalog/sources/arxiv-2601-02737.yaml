brief: >-
  Chain-of-thought prompting makes PET diagnosis worse for several multimodal
  models, and the rationales stay fluent while the answers get less accurate.
  Medical-tuned models also lose to generalist ones on functional imaging:
  GPT-4o reaches 54.78% diagnostic accuracy while Lingshu-7B reaches 21.23%
  and MedGemma-27B 28.03%.


  PET-Bench holds 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET without CT overlay, arranged in 5 levels from tracer identification
  to disease diagnosis. 19 MLLMs were evaluated zero-shot; 10 were also run
  with a 6-step clinical CoT prompt.


  Image quality assessment is the weakest level, mean accuracy 15.44%, against
  62.93% mean for tracer identification. CoT changes ranged from -4.03 to
  +9.77 percentage points while plausibility scores, graded 0–1 by an LLM
  judge blind to labels, stayed at 0.85–0.99. Fine-tuning with LoRA on Levels
  1–4 only (Atomic Visual Alignment) raised direct diagnosis by +1.27 to +8.28
  points, and AVA+CoT by up to +15.90 (InternVL3-8B) and +14.83 (MedGemma-4B).


  The AVA effect is measured with a patient-level split excluding Level 5
  cases from training, so leakage is controlled, but there is no
  matched-compute fine-tuning baseline on diagnostic data, and AVA was tried
  on only 4 small models. Plausibility is scored by an LLM, not clinicians.


  Treat CoT as unsafe wherever the vision encoder has not been shown to read
  the signal.
