brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET scans, while producing rationales that text-based graders score
  as highly plausible. Medical-tuned models also underperform generalists
  here, suggesting anatomical pretraining does not transfer to functional
  imaging.


  PET-Bench contains 52,308 QA pairs from 9,732 SUV-normalized pure PET
  studies (no PET/CT overlay) across 8 centers and 4 tracers (FDG, PSMA, FAPI,
  MET), organized into 5 levels from tracer identification and image quality
  up to disease diagnosis. 19 MLLMs were evaluated zero-shot and under a
  6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy versus 21.23% for Lingshu-7B and
  28.03% for MedGemma-27B. Image quality assessment averaged 15.44% across all
  models. Under CoT, accuracy moved from -4.03 pp to +9.77 pp with no
  consistent direction, while plausibility stayed at 0.85-0.99. Fine-tuning
  only on Levels 1-4 (Atomic Visual Alignment, LoRA) lifted diagnosis by +1.27
  to +8.28 pp alone, and +7.64 to +15.90 pp with CoT.


  The effect is measured, with a patient-level split excluding Level 5 cases
  from AVA training, which isolates the perceptual-grounding claim. AVA was
  tested on 4 lightweight models only, with no matched-compute tuning
  baseline; diagnosis rests on 471 cases, and plausibility scoring uses an LLM
  judge.


  Treat fluent CoT on out-of-distribution imaging as unverified until
  low-level perception is demonstrated.
