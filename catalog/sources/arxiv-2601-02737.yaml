brief: >-
  Chain-of-thought prompting makes multimodal models worse at reading PET
  scans, while leaving their rationales as fluent as ever. Medical-tuned
  vision-language models also lose to generalists here, suggesting anatomical
  pretraining does not transfer to intensity-based functional imaging.


  PET-Bench contains 52,308 QA pairs from 9,732 SUV-normalized pure-PET
  studies across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), structured as
  5 levels from tracer identification to disease diagnosis (N=471,
  biopsy-verified). 19 MLLMs were evaluated zero-shot; 10 were also tested
  with a 6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy versus 21.23% for Lingshu-7B and
  28.03% for MedGemma-27B. Image quality assessment averaged 15.44% across all
  models. CoT changed accuracy by -4.03 to +9.77 pp while LLM-judged
  plausibility stayed at 0.85-0.99. Fine-tuning on Levels 1-4 only (AVA, LoRA)
  lifted direct diagnosis by +1.27 to +8.28 pp, and AVA+CoT by up to +15.90 pp
  for InternVL3-8B and +14.83 pp for MedGemma-4B.


  The perception gap is measured, not just argued, and patient-level splits
  keep Level 5 test cases out of AVA training. But AVA was tried on only 4
  small models, with no matched-compute baseline fine-tuned directly on
  diagnosis, and plausibility scoring is LLM-based.


  Treat fluent medical CoT as uninformative about grounding unless perception
  is separately verified.
