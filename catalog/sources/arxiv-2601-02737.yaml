brief: >-
  Chain-of-thought prompting can lower accuracy on medical images the model
  cannot actually see, while producing rationales that text-based graders rate
  as highly plausible. PET-Bench tests this on pure PET: 52,308 QA pairs from
  9,732 whole/total-body studies across 8 centers and 4 tracers (FDG, PSMA,
  FAPI, MET), SUV-normalized and stripped of CT overlays, organized into 5
  levels from tracer identification up to disease diagnosis.


  Across 19 MLLMs, zero-shot diagnosis is weak and medical-tuned models often
  trail generalists: GPT-4o 54.78% versus Lingshu-7B 21.23% and MedGemma-27B
  28.03%. Image quality assessment averages 15.44%; tracer identification
  averages 62.93%. A 6-step clinical CoT prompt changed diagnosis by -4.03pp
  to +9.77pp depending on model, while CoT plausibility stayed at 0.85-0.99.
  Fine-tuning on Levels 1-4 only (Atomic Visual Alignment, LoRA) lifted direct
  diagnosis by +1.27pp to +8.28pp, and AVA+CoT by +14.83pp (MedGemma-4B) and
  +15.90pp (InternVL3-8B).


  The gap is measured, with a patient-level split keeping Level 5 test cases
  out of AVA training. The plausibility score comes from an LLM evaluator, not
  clinicians, and AVA was run on 4 lightweight models only, so the fix is
  untested at scale and against matched-size generic instruction tuning.


  If you treat CoT as a reliability feature, check whether perception is
  grounded first.
