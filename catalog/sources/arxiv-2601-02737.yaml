brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET scans, while leaving their rationales just as fluent.
  Medical-tuned models also lose to generalists on this modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET without CT overlay, organized into 5 levels from tracer
  identification to disease diagnosis. 19 MLLMs were evaluated zero-shot; 10
  were also tested with a 6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy while Lingshu-7B and MedGemma-27B
  reached 21.23% and 28.03%. Mean image quality assessment accuracy was
  15.44%; mean tracer identification 62.93%. Under CoT, accuracy moved from
  -4.03pp to +9.77pp while plausibility scores stayed at 0.85-0.99.
  Fine-tuning on Levels 1-4 only (Atomic Visual Alignment, LoRA) raised direct
  diagnosis by +1.27 to +8.28pp, and AVA+CoT by +14.83pp for MedGemma-4B and
  +15.90pp for InternVL3-8B.


  The gap is measured, with a patient-level split keeping Level 5 test
  patients out of AVA training. AVA was tried on only 4 lightweight models,
  with no matched-compute baseline fine-tuned on diagnosis data instead, so
  the curriculum ordering itself is not isolated. Plausibility scoring is
  LLM-based.


  Treat CoT as a liability wherever visual grounding is unverified.
