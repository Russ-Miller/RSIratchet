brief: >-
  Chain-of-thought prompting can lower diagnostic accuracy on PET images while
  reasoning quality scores stay near-perfect, because the rationales are
  generated from language priors rather than the image. Medical-tuned
  multimodal models also do worse than generalists on this modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), SUV-normalized and
  stripped of CT overlays, organized into 5 levels from tracer identification
  to disease diagnosis. 19 MLLMs were evaluated zero-shot and with a 6-step
  clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy versus 21.23% for Lingshu-7B and
  28.03% for MedGemma-27B. Image quality assessment averaged 15.44% across all
  models; tracer identification averaged 62.93%. With CoT, accuracy moved from
  -4.03pp to +9.77pp while plausibility scores stayed at 0.85-0.99.
  Fine-tuning only on Levels 1-4 (Atomic Visual Alignment, LoRA) gave +1.27%
  to +8.28% directly, and +14.83% for MedGemma-4B and +15.90% for InternVL3-8B
  when combined with CoT.


  The AVA effect is measured against each model's own baseline with a
  patient-level split excluding Level 5 cases, but there is no matched-budget
  control for generic instruction tuning on the same data volume, and
  fine-tuning covers 4 small models only.


  If you assume CoT is a safe default for medical imaging, this is a
  counterexample where perception, not reasoning, is the binding constraint.
