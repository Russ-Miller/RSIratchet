brief: >-
  Chain-of-thought prompting can lower diagnostic accuracy on PET images while
  leaving the rationale sounding expert, because the vision encoder never
  grounded the reasoning in tracer intensity in the first place.


  PET-Bench contains 52,308 QA pairs from 9,732 whole-body PET studies across
  8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized pure
  PET without CT overlay, organized into 5 levels from tracer identification
  to disease diagnosis. 19 MLLMs were evaluated zero-shot, then 10 under a
  6-step clinical CoT prompt.


  Medical-tuned models often lost to generalists: GPT-4o reached 54.78%
  diagnostic accuracy versus 21.23% for Lingshu-7B and 28.03% for
  MedGemma-27B. Image quality assessment averaged 15.44%; tracer
  identification averaged 62.93%. CoT changed diagnosis by -4.03 to +9.77 pp
  while an LLM judge rated rationale plausibility 0.85–0.99 throughout.
  Fine-tuning only on Levels 1–4 (AVA, LoRA) gave +1.27 to +8.28 pp alone, and
  +7.64 to +15.90 pp with CoT.


  The effect is measured, with patient-level splits excluding Level-5 cases
  from AVA training, so diagnostic gains are not leakage. There is no
  matched-compute fine-tuning baseline on unrelated data, so curriculum order
  itself is not isolated. AVA was tested on 4 small open models only; the
  Level-5 test set is small (N=471), evaluation is multiple-choice, and
  plausibility scoring is LLM-based.


  Treat CoT as unsafe where perception is unverified.
