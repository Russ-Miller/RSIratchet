  remarkable proficiency in tasks such as abnormality detection and report
  generation for anatomical modalities, their capability in functional imaging
  remains largely unexplored. In this work, we identify and quantify a
  fundamental functional perception gap: the inability of current vision
  encoders to decode functional tracer biodistribution independent of
  morphological priors. Identifying Positron Emission Tomography (PET) as the
  quintessential modality to investigate this disconnect, we introduce
  PET-Bench, the first large-scale"
