brief: >-
  Chain-of-thought prompting can lower diagnostic accuracy on PET images while
  leaving the generated rationales looking expert-written, because the vision
  encoder never grounded the reasoning in tracer uptake.


  PET-Bench contains 52,308 QA pairs from 9,732 pure PET (no PET/CT overlay)
  studies across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), organised
  into 5 levels from tracer identification and image quality assessment up to
  disease diagnosis. 19 MLLMs were evaluated zero-shot, 10 with a 6-step
  clinical CoT prompt.


  Medical fine-tuned models underperform generalists on diagnosis: GPT-4o
  reaches 54.78%, Lingshu-7B 21.23%, MedGemma-27B 28.03%. Image quality
  assessment averages 15.44%. CoT moves diagnosis by -4.03 to +9.77 points
  while LLM-judged rationale plausibility stays at 0.85-0.99. Fine-tuning only
  on Levels 1-4 (Atomic Visual Alignment, LoRA) lifts direct diagnosis by
  +1.27 to +8.28 points and AVA+CoT by up to +15.90.


  The effect is measured, with a patient-level split keeping Level 5 test
  patients out of AVA training, so the gain is not memorisation. But AVA was
  tried on only 4 small models, there is no matched-compute fine-tuning
  baseline on diagnosis data, and reasoning quality is scored by an LLM judge.


  Treat CoT as unsafe wherever the visual features for the task were never
  trained.
