brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET images, while producing rationales that text-based graders score
  as highly plausible. Medical-tuned models also underperform generalists on
  this modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET with no CT overlay, split into 5 levels from tracer identification
  to disease diagnosis. 19 MLLMs were evaluated zero-shot and with a 6-step
  clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy; Lingshu-7B 21.23% and
  MedGemma-27B 28.03%. Image quality assessment averaged 15.44% across all
  models, tracer identification 62.93%. CoT changed diagnosis by -4.03 to
  +9.77 pp, with plausibility scores staying at 0.85-0.99. Atomic Visual
  Alignment, LoRA fine-tuning on Levels 1-4 only with patient-level separation
  from the Level 5 test set, gave +1.27% to +8.28% alone and up to +14.83%
  (MedGemma-4B) and +15.90% (InternVL3-8B) with CoT.


  The AVA effect is measured against each model's own baseline on 4
  lightweight models; there is no matched-compute fine-tuning control, so some
  gain may come from PET exposure rather than the hierarchy. Level 5 has only
  N=471 cases, inputs are 2D coronal slices, and no closed models were
  fine-tuned.


  Treat CoT scores from a text judge as uninformative about grounding when the
  encoder has not seen the modality.
