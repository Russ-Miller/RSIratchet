brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET scans, while producing rationales that text-based graders score
  as highly plausible. Medical-tuned models also underperform generalists on
  this modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET without CT overlays, organized into 5 levels from tracer
  identification to disease diagnosis. 19 MLLMs were evaluated zero-shot, 10
  with a 6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy versus 21.23% for Lingshu-7B and
  28.03% for MedGemma-27B. Image quality assessment averaged 15.44% across all
  models; tracer identification averaged 62.93%. CoT changed accuracy by
  -4.03pp to +9.77pp with plausibility scores of 0.85–0.99 throughout. Atomic
  Visual Alignment, LoRA fine-tuning on Levels 1–4 only with a patient-level
  split excluding Level 5 cases, gave +1.27 to +8.28pp alone and +7.64 to
  +15.90pp with CoT.


  The gap and the trap are measured; the mechanism (encoder blind to intensity
  independent of morphology) is argued formally, not isolated by an encoder
  ablation. AVA was tested on 4 lightweight models only, with no
  matched-compute generic instruction-tuning baseline, and Level 5 has only
  N=471 cases.


  If you assume CoT is a free reliability gain in multimodal medicine, this is
  a counterexample worth checking.
