brief: >-
  Chain-of-thought prompting degrades diagnostic accuracy on PET images for
  most models, while the rationales it produces stay highly fluent.
  Medical-tuned multimodal models also underperform generalist ones on this
  modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET without CT overlay, organized into 5 levels from tracer
  identification to disease diagnosis. 19 MLLMs were evaluated zero-shot and
  with a 6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy, against 21.23% for Lingshu-7B and
  28.03% for MedGemma-27B. Image quality assessment averaged 15.44% across all
  models. Under CoT, accuracy moved from -4.03pp to +9.77pp depending on
  model, while an LLM judge rated rationale plausibility 0.85-0.99 throughout.
  Fine-tuning on Levels 1-4 only (Atomic Visual Alignment, LoRA) raised direct
  diagnosis by +1.27 to +8.28pp, and AVA+CoT by +14.83pp for MedGemma-4B and
  +15.90pp for InternVL3-8B.


  The diagnosis split uses patient-level separation from AVA training, which
  isolates the alignment effect from memorization. Plausibility is scored by
  an auxiliary LLM, not clinicians, and AVA was tested on 4 lightweight models
  only, with no matched-compute generic fine-tuning baseline.


  If you treat CoT as a default reliability gain, functional imaging is a
  counterexample.
