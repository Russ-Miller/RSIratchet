brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET scans, while producing rationales that text-based graders score
  as highly plausible. Medical-tuned models also underperform generalists on
  this modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET without CT overlay, structured into 5 levels from tracer
  identification to disease diagnosis. 19 MLLMs were evaluated zero-shot and
  with a 6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy, against 21.23% for Lingshu-7B and
  28.03% for MedGemma-27B. Image quality assessment averaged 15.44% across all
  models; tracer identification averaged 62.93%. CoT moved diagnosis by -4.03
  to +9.77 pp while plausibility scores stayed at 0.85-0.99. Fine-tuning on
  Levels 1-4 only (Atomic Visual Alignment, LoRA) raised direct diagnosis by
  +1.27 to +8.28 pp, and AVA+CoT by up to +15.90 pp (InternVL3-8B) and +14.83
  pp (MedGemma-4B).


  The AVA effect is measured against each model's own baseline with a
  patient-level split excluding Level 5 cases from training, but there is no
  matched-budget control fine-tune on unrelated data, so the gain cannot be
  cleanly attributed to atomicity rather than PET exposure generally. AVA was
  tried on 4 lightweight models only; plausibility is scored by an LLM judge.


  Treat fluent CoT in functional imaging as an unreliable correctness signal.
