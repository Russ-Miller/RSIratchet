brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET scans, while producing rationales that text-based graders rate
  as highly plausible. Fine-tuning on low-level perceptual tasks first
  reverses the effect.


  PET-Bench contains 52,308 QA pairs from 9,732 whole-body PET studies across
  8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized pure
  PET without CT overlay, organized into 5 levels from tracer identification
  to disease diagnosis. 19 MLLMs were evaluated zero-shot and with a 6-step
  clinical CoT prompt.


  Medical-tuned models underperformed generalists on diagnosis: GPT-4o 54.78%
  vs Lingshu-7B 21.23% and MedGemma-27B 28.03%. Image quality assessment
  averaged 15.44% across all models. CoT changed diagnosis accuracy by -4.03
  to +9.77 pp while plausibility scores stayed at 0.85-0.99. Atomic Visual
  Alignment, LoRA tuning on Levels 1-4 only with patient-level splits, raised
  direct diagnosis by +1.27 to +8.28 pp, and AVA+CoT by +14.83 pp
  (MedGemma-4B) and +15.90 pp (InternVL3-8B).


  The CoT effect is measured against matched direct-answer baselines on the
  same inputs, and the leakage control is explicit. AVA was tested on only 4
  lightweight models, with no comparison against generic instruction tuning on
  equal data, and plausibility was scored by an LLM judge.


  Level 5 has only 471 cases, and nothing here transfers to PET/CT fusion or
  other functional modalities.


  If you treat CoT as a default reliability gain, functional imaging is a
  counterexample.
