brief: >-
  Chain-of-thought prompting makes multimodal models worse, not better, at
  reading PET scans, while producing rationales that text-based graders rate
  as highly plausible. Medical-tuned models also underperform generalist ones
  on this modality.


  PET-Bench contains 52,308 QA pairs from 9,732 whole/total-body PET studies
  across 8 centers and 4 tracers (FDG, PSMA, FAPI, MET), using SUV-normalized
  pure PET without CT overlays, organized into 5 levels from tracer
  identification to disease diagnosis. 19 MLLMs were evaluated zero-shot, 10
  of them with a 6-step clinical CoT prompt.


  GPT-4o reached 54.78% diagnostic accuracy, while Lingshu-7B reached 21.23%
  and MedGemma-27B 28.03%. Image quality assessment averaged 15.44% across all
  models; tracer identification averaged 62.93%. CoT changed accuracy by -4.03
  to +9.77 pp while plausibility scores stayed at 0.85-0.99. Fine-tuning on
  Levels 1-4 only (Atomic Visual Alignment, LoRA) raised direct diagnosis by
  +1.27 to +8.28 pp, and AVA+CoT by up to +15.90 pp for InternVL3-8B and
  +14.83 pp for MedGemma-4B.


  The AVA effect is measured against each model's own baseline with a
  patient-level split excluding Level 5 cases, but there is no matched-compute
  baseline such as tuning on diagnosis data directly, and fine-tuning covers
  only 4 lightweight models. Diagnosis test set is small (N=471); the
  plausibility score comes from an LLM evaluator.


  If you assume CoT is a safe default, functional imaging is a counterexample
  worth checking.
