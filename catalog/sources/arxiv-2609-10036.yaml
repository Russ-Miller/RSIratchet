summary: >-
  Large language model agents produce fluent action sequences across a wide
  range of tasks, yet they fail in characteristic ways once the environment
  becomes partially observable. Ambiguous feedback pushes them into
  premature commitments. A single informative observation can collapse their
  uncertainty onto the wrong hypothesis. Policies drift as the history
  grows. We trace these symptoms to a common structural cause. An LLM agent,
  as commonly deployed, is a history-conditioned policy with no explicit
  belief over hidden state. We propose an architectural fix. The
