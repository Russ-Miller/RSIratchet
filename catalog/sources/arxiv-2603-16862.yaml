brief: >-
  Extracting only temporally grounded subject-verb-object events with resolved
  datetime ranges, and indexing them alongside raw dialogue turns, substitutes
  for full knowledge-graph construction in long-term conversational memory.
  The weaker the backbone model, the more the structured temporal index
  carries the system.


  Chronos maintains 2 indexes (an event calendar and a turn calendar), adds
  per-question retrieval guidance generated by Gemini 3 Flash, dense retrieval
  with Cohere Rerank v3, and a ReAct agent with vector and grep tools over
  both calendars. It was evaluated on LongMemEvalS, 500 questions across 6
  categories, with GPT-4o (Chronos Low) and Claude Opus 4.6 (Chronos High).


  Chronos Low reaches 92.60% overall versus 86.00% for EmergenceMem Internal
  and 71.20% for Zep; Chronos High reaches 95.60%. Single-session preference
  recall is the weak category for Low at 80.00%, behind Honcho's 90.00%.


  The component attribution comes from ablations on a stratified 116-question
  subset. Removing the events index costs Chronos Low 34.5 points but Chronos
  High only 2.6, and dynamic prompting contributes nothing at the High tier.
  Baselines are other systems' self-reported numbers, some judged by different
  models (Honcho on Claude Haiku 4.5, Hindsight with an OSS-120B judge), so
  cross-system comparison is not matched. Retrieval failures remain the top
  error type for both configurations, and fabrication does not improve with
  the stronger model. The authors also flag incorrect benchmark ground truth
  and LLM-judge variability. LoCoMo and multi-user settings were not tested.


  If you are choosing a memory architecture, this argues the gain is
  concentrated in temporal structuring and mostly disappears as the backbone
  improves.
