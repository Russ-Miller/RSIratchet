summary: >-
  Large Language Models (LLMs) have demonstrated remarkable capabilities
  across diverse tasks, yet they remain prone to generating hallucinations.
  Detecting these hallucinations is critical for deploying LLMs reliably in
  high-stakes applications. We present Grad Detect, a gradient-based
  approach for predicting hallucinations by analyzing layer-wise gradient
  patterns from a single forward-backward pass during inference. Our method
  shows that the internal gradient structure of a model carries rich
  information about the correctness of its output. This information is not
