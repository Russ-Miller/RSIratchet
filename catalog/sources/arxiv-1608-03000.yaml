brief: >-
  A generic attention seq2seq LSTM, with no regex-specific semantic
  equivalence machinery, matches and then beats a hand-engineered semantic
  parser at turning English descriptions into regular expressions. The domain
  knowledge that prior work treated as necessary turns out to be replaceable
  by data.


  Deep-RegEx is a 6-layer word-to-character encoder-decoder (2 encoder, 2
  decoder LSTM layers, width 512, global attention, dropout 0.25, 20 epochs).
  It is tested on KB13 (824 pairs, 75/25 split) and on NL-RX, a new
  10,000-pair corpus built by generating regexes from a 15-non-terminal,
  6-terminal grammar with synthetic verbalizations, then having Mechanical
  Turk workers paraphrase them. Scoring uses DFA equivalence rather than
  string match.


  On NL-RX-Turk test, Deep-RegEx reaches 58.2% versus 38.6% for Semantic-Unify
  and 16.4% for a bag-of-words nearest-neighbour baseline. On NL-RX-Synth it
  hits 88.7%. On KB13 it gets 65.6% against 65.5%.


  The comparison is measured, with the prior model retrained in consultation
  with its authors, and a data-size curve supports the scaling claim. But the
  large dataset is the authors' own and grammar-generated, so the model may be
  fitting the generating grammar; only 1 architecture and 1 formalism are
  tested. KB13 is shown to be 45% unique regexes versus 97% for NL-RX, which
  explains the odd cross-dataset ordering.


  If you assumed structured-output tasks need task-specific semantics, this is
  evidence that corpus size substitutes.
