brief: >-
  A generic attention LSTM sequence-to-sequence model, trained only on
  text/regex pairs with no semantic-equivalence machinery, matches and then
  beats a hand-engineered semantic parser at translating English descriptions
  into regular expressions.


  The system, Deep-RegEx, encodes words and decodes regex characters with 2
  encoder and 2 decoder stacked LSTM layers of width 512, global attention,
  dropout 0.25, 20 epochs. It is compared against Semantic-Unify (the prior
  state of the art, which relies on a regex-specific semantic unification
  step) and a bag-of-words nearest-neighbor baseline, on the 824-example KB13
  dataset and on NL-RX, a new 10,000-pair corpus built by generating regexes
  from a 15-non-terminal, 6-terminal grammar and having Mechanical Turk
  workers paraphrase the synthetic descriptions.


  Scoring by DFA equivalence, Deep-RegEx reaches 65.6% on KB13 test versus
  65.5% for Semantic-Unify, and 58.2% on NL-RX-Turk test versus 38.6%, a gain
  of 19.6%. On the unparaphrased synthetic split it gets 88.7%.


  The comparison is measured, with the baseline trained in consultation with
  its original authors, and hyperparameters chosen on a dev set. The small
  KB13 gap is partly explained by that dataset's redundancy: only 45% of its
  regexes are unique, versus 97% in NL-RX-Turk, which also inflates the
  nearest-neighbor baseline to 48.5%.


  Nothing here tests transfer to other formal languages, despite the paper's
  framing; the claim that domain knowledge is unnecessary rests on 1 task and
  1 model architecture.


  Treat domain-specific semantic machinery as optional once you can generate
  enough parallel data cheaply.
