brief: >-
  A generic attention-based LSTM sequence-to-sequence model, trained only on
  text-regex pairs, matches or beats a semantic parser built around
  regex-specific semantic equivalence checking. That cuts against the idea
  that this task needs domain-specific machinery.


  Deep-RegEx is a 6-layer encoder-decoder (1 embedding layer, 2 encoder, 2
  decoder, 1 dense; 512-wide stacked LSTMs, global attention, dropout 0.25, 20
  epochs, batch size 32, learning rate 1.0), decoding regexes
  character-by-character. It is evaluated on KB13 (824 examples, 75/25 split)
  and on NL-RX, a new 10,000-pair corpus built by stochastically generating
  regexes from a 15-non-terminal, 6-terminal grammar with synthetic
  verbalizations, then having Mechanical Turk workers paraphrase them.


  Scored by DFA equivalence, the model reaches 88.7% on NL-RX-Synth test and
  58.2% on NL-RX-Turk test, against 46.3% and 38.6% for Semantic-Unify and
  30.6% and 16.4% for a bag-of-words nearest-neighbour baseline. On KB13 it
  gets 65.6% vs 65.5%.


  The comparison is measured, with the prior system retrained in consultation
  with its authors and 2 baselines, plus a training-set-size curve.
  Hyperparameters were grid-searched on a dev set. The KB13 tie is explained
  by that set containing only 45% unique regexes, versus 97% in NL-RX-Turk, so
  the older benchmark rewards memorisation.


  Only regexes were tested; the claimed extension to program scripts is
  argued, not shown.


  If you were assuming formal-language generation needs hand-built semantics,
  the bottleneck is more likely corpus size and diversity.
