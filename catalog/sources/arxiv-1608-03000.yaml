brief: >-
  A generic attention LSTM sequence-to-sequence model translates English
  descriptions into regular expressions better than a semantic parser built
  around regex-specific semantic unification, with no domain knowledge at all.


  Deep-RegEx is a 6-layer encoder-decoder (1 embedding, 2 encoder, 2 decoder,
  1 dense; 512-wide stacked LSTMs, global attention, dropout 0.25, 20 epochs).
  It is evaluated on KB13 (824 pairs, 75/25 split) and on NL-RX, a new
  10,000-pair corpus built by generating regexes from a 15-non-terminal,
  6-terminal grammar with synthetic verbalizations, then having Mechanical
  Turk workers paraphrase them. Scoring uses DFA equivalence rather than
  string match.


  On NL-RX-Turk test, Deep-RegEx reaches 58.2% against 38.6% for
  Semantic-Unify and 16.4% for a bag-of-words nearest-neighbor baseline. On
  NL-RX-Synth it reaches 88.7%. On KB13 it is 65.6% versus 65.5%, a 0.1% edge.


  Evidenced by direct comparison on shared splits, with Semantic-Unify trained
  in consultation with its original authors, plus a training-size curve. Only
  1 model architecture and 1 hyperparameter search; the headline 19.6% gain
  comes from a dataset the authors constructed, whose grammar bounds the regex
  distribution.


  KB13 is 45% unique regexes versus 97% in NL-RX-Turk, so prior scores on it
  were inflated by memorization. Treat small hand-built formal-language
  benchmarks as diagnostics of duplication first.
