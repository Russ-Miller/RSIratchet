brief: >-
  A generic attention seq2seq model with no domain-specific machinery matches
  or beats a hand-engineered semantic parser at turning English descriptions
  into regular expressions, cutting against the assumption that this task
  needs a regex-specific semantic equivalence component.


  Deep-RegEx is a 6-layer LSTM encoder-decoder (2 encoder, 2 decoder layers,
  width 512, global attention) trained on word inputs and character-level
  regex outputs. It is compared against Semantic-Unify (Kushman and Barzilay
  2013) and a bag-of-words nearest-neighbor baseline, on the 814-example KB13
  set and a new 10,000-pair corpus, NL-RX, built by generating regexes from a
  15-rule grammar, verbalizing them synthetically, then having Mechanical Turk
  workers paraphrase.


  Scored by DFA equivalence, the neural model reaches 65.6% on KB13 test
  versus 65.5% for Semantic-Unify, and 58.2% versus 38.6% on NL-RX-Turk test;
  on the easier synthetic descriptions it reaches 88.7% versus 46.3%.


  The baseline was retrained in consultation with the original authors, and
  hyperparameters were tuned on a dev set, so the comparison is reasonably
  matched. Dataset analysis explains the odd ordering: KB13 has only 45%
  unique regexes versus 97% for NL-RX-Turk.


  No ablation isolates which architectural choice matters, and the large gain
  is on a corpus the authors themselves generated from their own grammar, so
  coverage is bounded by those 15 non-terminals and 6 terminals.


  If you assumed formal-language generation needed domain priors, this is
  evidence that data volume substitutes for them.
