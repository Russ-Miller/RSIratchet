brief: >-
  A generic attention LSTM sequence-to-sequence model, trained only on
  text-regex pairs, beats a semantic parser built around regex-specific
  semantic equivalence checks. That cuts against the assumption that
  formal-language generation needs domain-specific machinery.


  The model (Deep-RegEx) is 6 layers: 1 embedding, 2 encoder LSTM layers, 2
  decoder layers, 1 dense output, width 512, global attention, dropout 0.25,
  20 epochs. It is compared to Semantic-Unify (Kushman and Barzilay 2013) and
  a bag-of-words nearest-neighbour baseline on KB13 (824 pairs) and on NL-RX,
  a new 10,000-pair corpus built by generating regexes from a 15-non-terminal,
  6-terminal grammar with synthetic verbalizations, then having Mechanical
  Turk workers paraphrase them.


  On NL-RX-Turk test, DFA-equality accuracy is 58.2% versus 38.6% for
  Semantic-Unify and 16.4% for BoW-NN. On NL-RX-Synth it is 88.7% versus
  46.3%. On KB13 the two are near-tied, 65.6% versus 65.5%.


  The comparison is measured with a shared DFA-equivalence checker and the
  baseline was retrained with the original authors' input. There is no
  ablation of attention, depth, or the paraphrase step, and only 1
  architecture family is tested.


  The gain is partly a dataset story: KB13 has only 45% unique regexes against
  97% for NL-RX-Turk, so the older benchmark rewards memorisation. Accuracy
  also scales with training size, so the headline margin is tied to having
  10,000 examples.


  If you were assuming formal-syntax targets need hand-built semantics, check
  whether your benchmark is just small and duplicated.
