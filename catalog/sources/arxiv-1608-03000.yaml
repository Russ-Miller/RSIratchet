brief: >-
  A generic attention-based LSTM sequence-to-sequence model translating
  English descriptions into regular expressions beats a domain-engineered
  semantic parser that relies on regex-specific semantic equivalence
  unification, meaning the specialized component is not what was carrying
  performance.


  The model (Deep-RegEx) is 6 layers: 1 word embedding layer, 2 encoder and 2
  decoder LSTM layers of width 512, 1 dense output layer, global attention,
  dropout 0.25, 20 epochs, batch size 32, learning rate 1.0. It is evaluated
  on KB13 (824 pairs, 75/25 split) and on NL-RX, a new 10,000-pair corpus
  built by stochastically generating regexes from a 15-non-terminal,
  6-terminal grammar and having Mechanical Turk workers paraphrase the
  synthetic descriptions. Scoring uses DFA-equivalence rather than string
  match.


  On NL-RX-Turk test, Deep-RegEx reaches 58.2% versus 38.6% for Semantic-Unify
  and 16.4% for a bag-of-words nearest-neighbour baseline. On NL-RX-Synth test
  it reaches 88.7%. On KB13 it reaches 65.6% versus 65.5%, essentially a tie.


  The comparison is measured against a retrained prior system, done in
  consultation with its original authors, on the same metric implementation.
  Only 1 architecture and 1 dataset family are involved, and no ablation
  separates attention, depth, or data size from the architecture choice; the
  training-size curve is the only scaling evidence.


  The authors also note KB13 has only 45% unique regexes against 97% for
  NL-RX-Turk, so the earlier benchmark overstated performance through
  train-test repetition. Treat small parallel-corpus results on
  formal-language generation with suspicion unless uniqueness is reported.
