brief: >-
  A generic attention seq2seq model with no domain-specific machinery beats a
  hand-engineered semantic parser at turning English descriptions into regular
  expressions, once enough training data exists.


  Deep-RegEx is a 6-layer LSTM encoder-decoder (2 encoder, 2 decoder layers,
  512 width, global attention) that maps words to regex characters. It is
  compared against Semantic-Unify, the prior state-of-the-art that relies on a
  regex-specific semantic equivalence component, and a bag-of-words
  nearest-neighbour baseline. Evaluation is DFA-equality, using the prior
  authors' own implementation. The authors also build NL-RX, 10,000
  regex/description pairs made by stochastically generating regexes from a
  15-non-terminal, 6-terminal grammar, then having Mechanical Turk workers
  paraphrase the synthetic descriptions.


  On NL-RX-Turk test, Deep-RegEx reaches 58.2% versus 38.6% for Semantic-Unify
  and 16.4% for BoW NN; on synthetic descriptions 88.7%. On the small KB13 set
  (824 examples) the two are near-tied at 65.6% vs 65.5%.


  The comparison is direct and measured on shared splits and metric, with the
  baseline trained in consultation with its original authors. Hyperparameters
  were grid-searched on a dev set. There is no ablation of attention or depth,
  and the data-size curve comes from 1 dataset.


  The authors note KB13 has only 45% unique regexes against 97% for
  NL-RX-Turk, so prior accuracy figures on it partly reflect train-test
  repetition. Absolute accuracy on paraphrased language stays below 60%, and
  nothing beyond regexes was tested.


  Treat domain-specific semantic components as optional once you can generate
  paired data cheaply.
