brief: >-
  A generic attention-based LSTM sequence-to-sequence model, trained only on
  text/regex pairs, matches or beats a semantic parser built around a
  regex-specific semantic equivalence component. The domain knowledge turns
  out not to be load-bearing.


  Deep-RegEx is a 6-layer encoder-decoder (word embedding, 2 encoder and 2
  decoder LSTM layers of width 512, global attention, dropout 0.25, 20
  epochs). It is evaluated on KB13, the 814-example corpus from Kushman and
  Barzilay (2013), and on NL-RX, a new 10,000-pair corpus built by
  stochastically generating regexes from a 15-nonterminal, 6-terminal grammar
  and having Mechanical Turk workers paraphrase the synthetic descriptions.


  Under DFA equality, Deep-RegEx reaches 58.2% on NL-RX-Turk test versus 38.6%
  for Semantic-Unify and 16.4% for a bag-of-words nearest-neighbour baseline,
  and 88.7% on the synthetic-description split. On KB13 the two are level:
  65.6% versus 65.5%.


  The comparison is direct, using the same train/test split and the original
  authors' DFA-equality implementation, with Semantic-Unify retrained in
  consultation with its authors. A learning-curve analysis ties the gain to
  data volume. There is no ablation of attention or depth, and only 1
  architecture is tested.


  The authors also show KB13 is easier than it looks: only 45% of its regexes
  are unique versus 97% in NL-RX-Turk, which inflates nearest-neighbour scores
  there. Absolute accuracy on genuinely varied paraphrases remains below 60%.


  If you are deciding whether to hand-engineer semantics for a formal-language
  generation task, this is evidence that corpus size buys more than structure
  does.
