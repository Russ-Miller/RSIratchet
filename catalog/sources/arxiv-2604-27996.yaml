brief: >-
  GUI-operating agents fail scientific visualization workflows because of
  planning depth, not interface perception: break the same tasks into steps
  and their success rate roughly quadruples. 8 agents were run on 15 ParaView
  tasks from SciVisAgentBench, 10 trials each, spanning domain-specific
  (ChatVis, ParaView-MCP), computer-use GUI (UFO, Open Interpreter, Agent-S),
  and general-purpose coding CLI agents (Codex CLI, Claude Code), with
  Claude-Opus-4.6 as rubric judge.


  Codex CLI scored highest (68.99 ± 1.92, 100.0% completion) but used 774.52K
  ± 623.29K input tokens per task; ChatVis scored 37.25 ± 4.92 on 8.17K ± 842
  input tokens. GUI agents stayed below 40% completion in full-task mode but
  reached 60.7%–65.2% step pass rates when each task was decomposed into 5
  steps starting from gold-standard prior states. Persistent memory raised
  Letta from 19.09 to 30.78 and Agent-S from 10.75 to 18.31 while cutting
  tokens and time.


  The memory comparison is a clean within-system toggle; the cross-agent
  comparison is not, since backbones, planners, and tool access all vary at
  once, as the authors state. 1 application (ParaView), 15 tasks, no
  controlled ablation of single design factors, and stepwise evaluation used
  only 3 trials.


  Treat agent-category rankings here as configuration tradeoffs, and expect
  decomposition plus memory to be the levers that actually transfer.
