brief: >-
  Memory systems built for general-purpose chat lose to plain retrieval once
  the conversation is about a code repository, and both fall far short of an
  oracle context. LoCoEval builds long-horizon repository development
  conversations from DevEval: 128 samples across 37 repos split into
  single-hop and multi-hop subsets, 1~4 requirements and 30~70 turns per
  sample, 64K~256K tokens of context, with 768 tasks covering topic awareness,
  information item extraction, and execution-tested function generation. Mock
  user queries and agent responses are generated dynamically at evaluation
  time, with mutated "distracting" information items injected as noise.


  Across GPT-5 mini, DeepSeek-V3.2 and Qwen3-235B-A22B, standalone
  long-context use (Full) consumes over 3M tokens per conversation and
  normalized scores stay under 50% on extraction and generation. Vanilla RAG
  with top-5 history retrieval beats MemGPT, LD-Agent and Mem0 in most cells,
  reaching 40.62 pass@1 on single-hop GPT-5 mini against Mem0's 30.62; some
  memory systems score negative normalized values. An extended Mem0 that
  stores repository paths alongside text (Mem0 R) reaches 37.50 pass@1 on
  GPT-5 mini and 31.88 on DeepSeek-V3.2 single-hop.


  Effects are measured, with Empty and Oracle bounds and compression ratios
  giving a token-cost comparison, so improvements are not purely from spending
  more context. Mem0 R is a single-component change evaluated by its authors
  on their own benchmark; the conversations are LLM-generated Python function
  generation only, with quality checked by spot manual inspection. If you were
  assuming graph or database memory helps coding agents, this says retrieval
  is the stronger default.
