summary: >-
  At Noora Health, our nurses answer more than 50,000 medical queries per
  month on our WhatsApp-based service that provides caregivers with
  on-demand support. Their most time-critical task is emergency triage:
  deciding which queries need immediate in-person attention. To support
  them, we built a system that uses a large language model (LLM) to classify
  whether a message is an emergency and provide a rationale for
  interpretability. But the system was opaque: analyzing mistakes meant
  reading reasoning chains for each message, which is infeasible at our
  scale. Prompt changes meant re-running a full
notes: >-
  Filed as a source on procedure-following from the classifier's judgement
  that the paper is about it (improves, medium): Moving the clinicians'
  undocumented decision tree out of the prompt into an explicit
  deterministic rule engine, leaving the LLM only symptom extraction, raised
  recall 0.565→0.810 and F1 0.606→0.702, with the structured rules driving
  most of the gain. No claim has been drafted from it yet.
