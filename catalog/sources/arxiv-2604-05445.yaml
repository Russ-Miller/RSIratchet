brief: >-
  Decomposing a vision-language reward into a small set of
  instruction-selected dimensions beats both a monolithic scalar head and a
  generative critic, without adding decoding cost. VL-MDR predicts which of 21
  fine-grained dimensions matter for an image-text query, scores the response
  on each, and aggregates with learned weights in 1 forward pass.


  The model is a 7B Qwen2.5-VL-7B-Instruct backbone with 3 lightweight heads,
  trained on 321.3k preference pairs filtered from 414.2k by 3-judge
  consensus, and evaluated on VL-RewardBench, Multimodal RewardBench, and
  MM-RLHF-Reward Bench.


  On VL-RewardBench it reaches 73.06 overall and 71.84 macro, against
  72.98/68.82 for Skywork-VL-Reward and 71.45/71.82 for UnifiedReward-Think.
  Inference cost is 0.218 GPU Hours versus 0.518 for UnifiedReward-Think, with
  17.86M extra parameters, 0.25% of the backbone.


  The causal attribution is the strongest part: ablations trained on the same
  200k subset separate structure from supervision (Scalar 64.55 overall,
  Implicit 68.72, Coarse-7D 67.12, Fine w/o Gate 69.77, full 70.81), and a
  top-k sweep peaks at k=3.


  Weaker points: 1 backbone family, dimension labels come from VLM judges
  rather than humans, and the DPO gains on LLaVA-OneVision-7B are near-ties
  with Skywork-VL and UnifiedReward-Think. Image-text only.


  If you want interpretable reward signals at discriminative-model throughput,
  this is evidence the granularity, not the extra heads, is what pays.
