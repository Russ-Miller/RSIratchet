brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly collapse
  on frontier open-ended proofs, and they fail in one direction: they label
  nearly every step correct. Hard2Verify annotates 1,860 steps across 200
  responses from GPT-5 (high), Gemini 2.5 Pro and Claude Sonnet 4 (thinking)
  to 80 recent Olympiad problems (IMO, Putnam, INMO), with PhD-level
  annotators and over 500 hours of labor; 78.5% of samples are open-ended and
  no errors were injected.


  Across 29 generative critics and PRMs, GPT-5 leads at 86.53 step-level
  balanced accuracy and 70.61 on first-error identification, while
  Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to 37.3 here, and
  Llama-3.3-70B falls from 58.0 ProcessBench balanced F1 to 2.50 on error ID.
  Weak verifiers show TNR near 0 and TPR near 1. Sequential compute helps
  (gpt-oss-120B 61.46 to 74.64 balanced F1 from low to high reasoning);
  parallel best-of-N from 32 samples, N=4-16, does not close the gap to high
  reasoning effort.


  The scaling comparison is a matched contrast within 1 model family with 10
  bootstrap trials; the main benchmark is measured against human labels, with
  prompting format shown to shift error-ID scores by up to +21.60 balanced
  accuracy, so rankings are prompt-sensitive.


  Self-verification analysis covers only 3 proprietary models, and no training
  intervention was tested.


  If you rely on PRMs for process rewards on hard proofs, assume they are
  near-blind to errors.
