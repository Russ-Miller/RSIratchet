brief: >-
  Step-level verifiers that look competent on existing benchmarks mostly fail
  on frontier open-ended proofs, and they fail in one direction: they mark
  nearly every step correct. Qwen2.5-Math-PRM-72B drops from 78.3 on
  ProcessBench to 37.3 on Hard2Verify for the same error-identification task.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses from
  GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) to 80 recent
  Olympiad problems (IMO, Putnam, INMO), 78.5% open-ended, annotated by
  PhD-level mathematicians over 500 hours with three rounds of review. 29
  verifiers were scored on step-level labels, response-level correctness, and
  first-error identification.


  GPT-5 leads at 86.53 step-level balanced accuracy and 70.61 on ErrorID;
  gpt-oss-120B is the best open-weight model, roughly matching o3.
  Llama-3.3-70B falls from 58.0 Balanced F1 on ProcessBench to 2.50 on
  ErrorID. Sequential compute helps (gpt-oss-120B 61.46 to 74.64 Balanced F1
  low to high reasoning), while best-of-N majority vote from 4-16 samples does
  not close the gap.


  The parallel-vs-sequential comparison is measured within 1 model family at
  matched sampling, which isolates it reasonably; the self-verification and
  solve-vs-verify analyses cover only 3 generators and are correlational.


  Treat verifier scores on ProcessBench as uninformative about proof-grading
  reliability.
