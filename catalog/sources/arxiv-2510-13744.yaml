brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended proofs, and they fail in one direction: they call nearly
  every step correct. Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to
  37.3 on Hard2Verify for first-error identification.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses from
  GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) to 80 recent
  Olympiad problems (IMO, Putnam, INMO), 78.5% open-ended, annotated by
  PhD-level mathematicians over 500 hours with 3 rounds of review. 29
  generative critics and PRMs are scored on step-level, response-level, and
  first-error tasks using Balanced Accuracy and Balanced F1.


  GPT-5 leads at 86.53 step-level Balanced Accuracy and 70.61 on ErrorID;
  Llama-3.3-70B-Instruct scores 2.50 Balanced F1 on ErrorID despite 58.0 on
  ProcessBench. Sequential compute helps (gpt-oss-120B 61.46 to 74.64
  step-level Balanced F1 from low to high reasoning), while best-of-N majority
  vote over 32 samples at low effort, N=4 to 16, does not close the gap.
  Verification rates exceed solve rates for all 3 generators.


  The parallel-scaling test covers 1 model (gpt-oss-20B); self-verification
  analysis covers 3 proprietary models; PRM thresholds are tuned, generative
  critics are prompted, not trained. Treat high ProcessBench scores as
  uninformative about proof-level verification.
