brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended math, and they fail in one direction: they call nearly
  every step correct. Process reward models fall below random guessing at
  finding the first error.


  Hard2Verify is 1,860 human-annotated steps across 200 responses from GPT-5
  (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) to 80 recent Olympiad
  problems (IMO, Putnam, INMO), 78.5% open-ended, graded by PhD-level
  annotators over 500 hours with 3 rounds of review. 29 generative critics and
  PRMs were scored on step-level, response-level, and first-error tasks.


  Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to 37.3 here;
  Llama-3.3-70B falls from 58.0 Balanced F1 on ProcessBench to 2.50 on error
  ID. GPT-5 leads at 86.53 step-level Balanced Accuracy and 70.61 on ErrorID;
  gpt-oss-120B roughly matches o3. Weak verifiers' TNR tends to 0 while TPR
  tends to 1. Sequential compute helps (gpt-oss-120B 61.46 to 74.64 Balanced
  F1 from low to high reasoning), while best-of-N majority vote over 32
  samples at low effort does not close the gap. Verification rates exceed
  solve rates for all 3 generators.


  The scaling comparison is matched by model and task, which isolates
  sequential vs parallel reasonably well; the self-verification analysis
  covers only 3 proprietary models and is correlational. Prompting effects are
  mixed per model, so ranking depends on prompt choice. No training
  intervention was tested.


  If you rely on PRMs for process rewards or test-time selection on hard
  proofs, assume they are near-useless there until shown otherwise.
