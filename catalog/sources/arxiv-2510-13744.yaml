summary: Large language model (LLM)-based reasoning systems have recently
  achieved gold medal-level performance in the IMO 2025 competition, writing
  mathematical proofs where, to receive full credit, each step must be not
  only correct but also sufficiently supported. To train LLM-based reasoners
  in such challenging, open-ended settings, strong verifiers capable of
  catching step-level mistakes are necessary prerequisites. We introduce
  Hard2Verify, a human-annotated, step-level verification benchmark produced
  with over 500 hours of human labor. Hard2Verify is designed to rigorously
