brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended proofs, and they fail in one direction: they call nearly
  every step correct.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses from
  GPT-5 (high), Gemini 2.5 Pro and Claude Sonnet 4 (thinking) on 80 recent
  Olympiad problems (IMO, Putnam, INMO), 78.5% open-ended, built with over 500
  hours of PhD-level annotation and three rounds of review. 29 verifiers were
  scored on step-level labelling, response-level correctness, and first-error
  identification.


  GPT-5 led with 86.53 step-level balanced accuracy and 70.61 on ErrorID.
  Qwen2.5-Math-PRM-72B dropped from 78.3 on ProcessBench to 37.3 here, and
  Llama-3.3-70B fell from 58.0 ProcessBench balanced F1 to 2.50 on ErrorID.
  Across generative critics, TNR collapses toward 0 while TPR rises toward 1.
  Sequential compute helps (gpt-oss-120B 61.46 to 74.64 step-level balanced F1
  from low to high reasoning); best-of-N majority vote over 32 samples at low
  effort, simulated for N=4-16 with 10 bootstrap trials, does not close the
  gap.


  Evidence is measured against human labels, with a matched-compute
  parallel-vs-sequential comparison and a prompting ablation (ErrorID vs.
  derived-from-step-labels, mixed effects by model). Generators are 3
  proprietary models; self-verification and solve-vs-verify comparisons are
  correlational, not causal.


  If you rely on PRMs for process rewards on hard proofs, assume near-zero
  error detection until you measure TNR yourself.
