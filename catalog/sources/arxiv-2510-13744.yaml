brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended proofs, and they fail in one specific way: they mark
  nearly every step correct. Hard2Verify collects 80 recent Olympiad problems
  (IMO, Putnam, INMO, 10 competitions), samples proofs from GPT-5 (high),
  Gemini 2.5 Pro, and Claude Sonnet 4 (thinking), and has PhD-level annotators
  label every step of 200 responses, 1,860 steps, 78.5% of them open-ended,
  over 500 hours of labor with 3 rounds of review.


  Across 29 generative critics and PRMs, GPT-5 leads at 86.53 Balanced
  Accuracy on step labels and 70.61 on first-error identification;
  Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to 37.3 here and only
  37.28 Balanced F1 on ErrorID; Llama-3.3-70B falls from 58.0 ProcessBench
  Balanced F1 to 2.50. Sequential compute helps (gpt-oss-120B 61.46 to 74.64
  Balanced F1 from low to high reasoning), while best-of-N majority vote over
  32 samples at low effort, N=4-16, 10 bootstrap trials, does not close the
  gap.


  The TPR/TNR decomposition isolates the failure mode cleanly, and the
  parallel-vs-sequential comparison is matched within 1 model.
  Self-verification and solve-vs-verify claims rest on 3 generators and
  human-label agreement, not held-out replication; no training intervention is
  tested.


  If you use a PRM as a process reward or reranker on proof-style outputs,
  expect it to detect almost nothing.
