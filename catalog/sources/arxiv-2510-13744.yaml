brief: >-
  Step-level verification of frontier math proofs breaks most open-source
  verifiers: they drift toward labeling every step correct, with true negative
  rate near 0 and true positive rate near 1. Process reward models that lead
  on older benchmarks score below random guessing at finding the first error.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses,
  sampled from GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) on
  80 recent Olympiad problems (IMO, Putnam, INMO) from 10 competitions, 78.5%
  open-ended, annotated by PhD-level mathematicians over 500 hours with 3
  rounds of review. 29 generative critics and PRMs were scored on step-level,
  response-level, and first-error tasks.


  GPT-5 leads at 86.53 step-level balanced accuracy and 70.61 on ErrorID;
  gpt-oss-120B is the best open model, roughly matching o3.
  Qwen2.5-Math-PRM-72B falls from 78.3 on ProcessBench to 37.3 here, and
  Llama-3.3-70B drops to 2.50 balanced F1 on ErrorID. Sequential compute helps
  (gpt-oss-120B 61.46 to 74.64 low to high reasoning), while best-of-N
  majority voting at low effort does not close the gap. Verification rates
  exceed solve rates on self-generated responses.


  Evidence is measured against human labels, with a matched-model
  parallel-vs-sequential comparison and a prompting ablation (direct ErrorID
  vs derived from step labels, mixed in F1). Only math proofs, 3 generators, 1
  response per problem, no training interventions.


  Treat PRM leaderboard scores as uninformative about frontier proof checking.
