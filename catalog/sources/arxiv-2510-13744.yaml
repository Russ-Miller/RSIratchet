brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended proofs, and they fail in one specific way: they mark
  nearly every step correct. Hard2Verify is a human-annotated benchmark of
  1,860 steps across 200 responses from GPT-5 (high), Gemini 2.5 Pro, and
  Claude Sonnet 4 (thinking) on 80 problems from 10 recent Olympiads (IMO,
  Putnam, INMO), 78.5% open-ended, built with over 500 hours of expert
  annotation and three rounds of review.


  Across 29 generative critics and PRMs, GPT-5 leads at 86.53 step-level
  balanced accuracy and 70.61 on first-error identification, while
  Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to 37.3 here, and
  Llama-3.3-70B falls from 58.0 ProcessBench balanced F1 to 2.50 on error ID.
  TNR trends to 0 as TPR trends to 1 for weaker verifiers. Sequential compute
  helps (gpt-oss-120B 61.46 to 74.64 balanced F1 from low to high reasoning);
  best-of-N over 32 samples at low effort does not close the gap. Verification
  rate exceeds solve rate for all 3 generators.


  Evidence is measured against human labels, with a matched-model
  parallel-vs-sequential comparison, but generators are limited to 3 models
  and the benchmark is math proofs only; label noise is checked by agreement
  rounds, not reported as a figure.


  If you rely on PRMs for process rewards or test-time selection, assume they
  are near-useless at the frontier.
