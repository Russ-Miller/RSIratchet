brief: >-
  Step-level verifiers that look strong on existing benchmarks collapse on
  frontier open-ended proofs, and they fail in one direction: they mark nearly
  every step correct. Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to
  37.3 on Hard2Verify for first-error identification.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses from
  GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) to 80 recent
  Olympiad problems (IMO, Putnam, INMO), 78.5% open-ended, annotated by
  PhD-level mathematicians over 500 hours. 29 generative critics and PRMs were
  scored on step-level, response-level, and first-error tasks using balanced
  accuracy and balanced F1.


  GPT-5 leads at 86.53 step-level balanced accuracy and 70.61 ErrorID;
  gpt-oss-120B roughly matches o3; Llama-3.3-70B falls to 2.50 ErrorID
  balanced F1 despite 58.0 on ProcessBench. Sequential compute helps
  (gpt-oss-120B 61.46 to 74.64 step-level balanced F1 from low to high
  reasoning), while best-of-N majority vote over 32 samples, N=4-16, does not
  close the gap.


  The gap between parallel and sequential scaling is a matched-model
  comparison but only within gpt-oss-20B; TPR/TNR decomposition isolates the
  generosity failure across all critics. Self-verification and solve-vs-verify
  analyses cover only 3 generators and rely on the same human labels.


  If you use PRMs as process reward signals for hard proofs, expect them to be
  worse than random at locating errors.
