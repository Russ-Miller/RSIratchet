brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended proofs, and they fail in one direction: they mark nearly
  every step correct. Qwen2.5-Math-PRM-72B drops from 78.3 on ProcessBench to
  37.3 on Hard2Verify for first-error identification.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses from
  GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) to 80 recent
  Olympiad problems (IMO, Putnam, INMO), 78.5% open-ended, annotated by math
  graduates over 500 hours with 3 rounds of review. 29 generative critics and
  PRMs were scored on step-level, response-level, and error-ID tasks using
  balanced accuracy and balanced F1.


  GPT-5 leads at 86.53 step-level balanced accuracy and 70.61 on ErrorID;
  gpt-oss-120B roughly matches o3; Llama-3.3-70B-Instruct scores 2.50 balanced
  F1 on ErrorID. TNR trends to 0 as TPR trends to 1. Sequential compute helps
  (gpt-oss-120B 61.46 to 74.64 step-level balanced F1 from low to high
  reasoning), while best-of-N majority voting from N=4 to 16 does not close
  the gap.


  The parallel-vs-sequential comparison is not matched on tokens, and the
  self-verification and solve-vs-verify analyses cover only 3 generators.
  Verification rate exceeded solve rate for all 3, measured against human
  labels.


  If you rely on PRMs for dense process rewards on hard proofs, expect them to
  be below chance at catching errors.
