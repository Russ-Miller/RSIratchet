brief: >-
  Step-level verifiers that look competent on existing benchmarks mostly fail
  on frontier open-ended proofs, and they fail in one specific way: they label
  almost every step correct. Qwen2.5-Math-PRM-72B drops from 78.3 on
  ProcessBench error identification to 37.3 on the new benchmark.


  Hard2Verify contains 1,860 human-annotated steps across 200 responses from
  GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking) to 80 recent
  Olympiad problems (IMO, Putnam, INMO), 78.5% open-ended, annotated by
  graduate-level mathematicians over 500 hours with 3 rounds of review. 29
  verifiers are scored on step-level, response-level, and first-error tasks
  using balanced accuracy and balanced F1.


  GPT-5 leads at 86.53 step-level balanced accuracy and 70.61 on ErrorID;
  gpt-oss-120B is the best open model, roughly matching o3. Llama-3.3-70B, at
  58.0 balanced F1 on ProcessBench, scores 2.50 on ErrorID. TNR collapses
  toward 0 while TPR rises toward 1 across the weak tail. Sequential compute
  helps (gpt-oss-120B 61.46 to 74.64 step-level balanced F1 from low to high
  reasoning), while best-of-N majority voting from N=4 to 16 at low effort
  does not close the gap.


  The parallel-versus-sequential comparison is a matched-family ablation but
  not matched on tokens, and it uses 1 model. Verification rates exceed solve
  rates for all 3 generators, measured against human labels. Treat strong
  ProcessBench scores as no evidence of frontier verification ability.
