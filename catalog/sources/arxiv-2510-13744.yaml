brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly collapse
  on frontier open-ended proofs, and they fail in one specific direction: they
  mark nearly every step correct. Hard2Verify pairs 80 recent Olympiad
  problems (IMO, Putnam, INMO, 2024 onward, 78.5% open-ended) with 200
  responses from GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking),
  annotated step-by-step by PhD-level mathematicians over 500 hours, yielding
  1,860 graded steps (1,080 correct, 780 incorrect). 29 verifiers were scored
  on step-level labeling, response-level correctness, and first-error
  identification.


  GPT-5 leads at 86.53 step-level Balanced Accuracy and 70.61 ErrorID Balanced
  Accuracy; Qwen2.5-Math-PRM-72B falls from 78.3 on ProcessBench to 37.3 here,
  and Llama-3.3-70B drops from 58.0 ProcessBench Balanced F1 to 2.50 ErrorID
  Balanced F1. TNR trends to 0 while TPR trends to 1 as verifiers weaken.
  Sequential compute helps (gpt-oss-120B 61.46 to 74.64 step-level Balanced F1
  from low to high reasoning); best-of-N majority vote over 32 samples,
  simulated for N=4-16 with 10 bootstrap trials, does not.


  The parallel-scaling comparison is matched against the same model at high
  effort, which isolates it reasonably; the self-verification and
  solve-vs-verify analyses are correlational across 3 generators only. All
  results are on math proofs with 1 annotation pipeline, and PRM thresholds
  were tuned by the authors.


  If you rely on a PRM for process rewards or test-time selection, assume it
  cannot catch errors at this difficulty.
