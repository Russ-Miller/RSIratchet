brief: >-
  Step-level verifiers that look strong on existing benchmarks mostly fail on
  frontier open-ended proofs, and they fail in one specific way: they mark
  nearly every step correct. Hard2Verify collects 80 Olympiad-level problems
  (IMO, Putnam, INMO, 2024 onward) from 10 competitions, samples 1 proof each
  from GPT-5 (high), Gemini 2.5 Pro, and Claude Sonnet 4 (thinking), and has
  PhD-level annotators label every step under strict grading, yielding 1,860
  steps across 200 responses, 780 of them incorrect, from over 500 hours of
  labor.


  Across 29 generative critics and PRMs, GPT-5 leads at 86.53 step-level
  balanced accuracy and 70.61 on first-error identification;
  Qwen2.5-Math-PRM-72B, state-of-the-art on ProcessBench at 78.3, drops to
  37.3 error-ID here, and Llama-3.3-70B falls from 58.0 ProcessBench balanced
  F1 to 2.50. TNR trends to 0 while TPR trends to 1 as verifiers weaken.
  Sequential compute helps (gpt-oss-120B 61.46 to 74.64 step-level balanced F1
  from low to high reasoning); parallel best-of-N from 32 samples, N=4-16,
  does not.


  This is measured, with a matched comparison for the compute question and 10
  bootstrap trials, though generators are 1 response per problem and
  annotation is single-vendor. Verification rates exceeded solve rates for all
  3 self-verifying models, suggesting verifiers need not match frontier
  generators.


  Treat ProcessBench scores as uninformative about proof-level verification.
