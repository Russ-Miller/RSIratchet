brief: >-
  Standard DPO applied to multimodal models leaves them unable to tell an
  image apart from the same image with its critical visual evidence removed,
  and adding an image-level preference term fixes much of it. The authors call
  this visual insensitivity and split it into across-image and within-image
  forms, backed by a margin decomposition showing both correspond to near-zero
  margins that the new loss directly enlarges.


  mPEA-DPO builds rejected images by masking 9% of each image, repeated n = 30
  times, then picking the variant with lowest CLIP similarity to the original.
  Training used LLaVA-v1.5-7B and 13B on 22K preference instances over 13K
  images, evaluated on MMHalBench, Object HalBench, and AMBER.


  On the 7B model, MMHalBench score rises from 2.11 to 3.02 and hallucination
  from 0.54 to 0.36; Object HalBench CHAIRs drops 53.6 to 4.3. The 13B model
  reaches 3.16 score and 0.31 hallucination. Recall stays at 52.30 versus
  DAMA's 54.50, arguing the gain is not just shorter answers.


  Evidence includes component ablations, an alpha sweep, a data-scale curve,
  and 4 alternative rejected-image strategies (blockwise, rotation, crop,
  blackness), all worse. Only 1 model family was tested, no recent MLLMs, and
  coverage on AMBER falls from 51.0 to 46.7.


  If you train multimodal preference models, the rejected-image construction
  matters more than the loss form.
