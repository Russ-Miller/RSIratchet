summary: "Direct Preference Optimization (DPO) has emerged as an effective
  approach for aligning large language models (LLMs) with human preferences.
  However, its adaptation to multimodal settings remains unexplored. Through
  representational analysis, we identify a key limitation in multimodal
  preference optimization, which we term visual insensitivity: models often
  fail to distinguish between images and those with critical visual context
  removed. Our theoretical analysis further uncovers two manifestations of
  this problem, namely Across-Image Insensitivity and Within-Image
