  simple queries, resulting in test-time inefficiency and even degraded
  accuracy. Prior work has attempted to mitigate this issue via adaptive
  reasoning strategies, but these methods largely overlook a fundamental
  bottleneck: visual perception failures. We argue that stable reasoning
