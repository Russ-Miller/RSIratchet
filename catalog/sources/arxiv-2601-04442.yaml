brief: >-
  Most errors in vision-language reasoning models trace to perception, not
  deliberation, and giving the model a dedicated path to re-look at the image
  buys more than giving it more thinking. GPT-4 attribution of Qwen2.5-VL
  failures found visual perception failures occur more than twice as often as
  reasoning errors.


  GPRO replaces alternate decoder FFN layers in Qwen2.5-VL (3B, 7B) with a
  gated module whose 2-layer controller routes each token to a fast FFN path,
  a cross-attention perception path, or a self-reflection reasoning path,
  trained with PPO on accuracy, cost, and uncertainty-calibration rewards.
  Supervision came from mining failures over roughly 790k samples (ViRL39k,
  MathV360K, Mulberry); evaluation on MathVision, MathVerse, MathVista,
  DynaMath, MM-Vet.


  GPRO-7B reaches 31.2 on MathVision and 74.2 on MathVista, beating GPT-4o
  (30.4) on the former, while cutting MathVerse length 51.5% (388.9 to 188.4
  tokens) and MathVista tokens 39%. The controller used the fast path for 73%
  of tokens, perception 17%, reasoning 10%.


  Ablations isolate the cause: removing slow perception costs 3.4 on
  MathVision and 4.4 on MathVerse, versus 1.7 for slow reasoning and 2.3-2.5
  for the calibration reward.


  Limits: 1 model family, math-heavy benchmarks, and MathVerse and MM-Vet at
  7B still trail FAST-7B (50.6, 71.2). Attribution labels are GPT-generated
  and unverified.


  If you are tuning adaptive reasoning, budget compute for re-perception
  rather than longer chains.
