brief: >-
  Flagging a hallucination in a RAG answer is only the start; the repair
  action you choose trades grounding against how much of the answer survives,
  and there is no dominant option.


  Using RAGTruth, where unsupported passages are hand-annotated, each flagged
  answer is decomposed into individual factual claims, each claim checked
  against the retrieved source, and 3 repair strategies of increasing richness
  are compared against leaving the answer untouched: deleting an unsupported
  claim, replacing it with source text, and rewriting it. 3 language models
  from different families judged the 916 repaired answers.


  All 3 strategies cut the proportion of answers judged to contain unsupported
  content, and the 3 judges agree on the ordering. Deletion reduces the most
  while retaining the least original text, at 64.3%; rewriting retains 80.1%
  and reduces the least. The pipeline also edits 83.5% of answers annotated
  clean, so repair is not confined to faulty ones.


  The grounding effect is measured, with 3 independent judge families as the
  main cross-check, but there is no human judgment of answer usefulness and
  only 1 benchmark. Whether an edited answer still helps a reader is untested,
  and the over-editing rate on clean answers is a direct cost.


  If you are building RAG guardrails, treat repair choice as a trade-off you
  must evaluate downstream, not a solved ranking.
