summary: "We introduce Voyager, the first LLM-powered embodied lifelong
  learning agent in Minecraft that continuously explores the world, acquires
  diverse skills, and makes novel discoveries without human intervention.
  Voyager consists of three key components: 1) an automatic curriculum that
  maximizes exploration, 2) an ever-growing skill library of executable code
  for storing and retrieving complex behaviors, and 3) a new iterative
  prompting mechanism that incorporates environment feedback, execution
  errors, and self-verification for program improvement. Voyager interacts
  with GPT-4 via blackbox queries, which bypasses the need for model parameter
  fine-tuning. The skills developed by Voyager are temporally extended,
  interpretable, and compositional, which compounds the agent&#39;s abilities
  rapidly and alleviates catastrophic forgetting. Empirically, Voyager shows
  strong in-context lifelong learn…"
