brief: "An LLM agent that writes reusable code skills into a growing library,
  driven by a self-generated curriculum and refined by execution feedback,
  learns Minecraft continually without any weight updates. Voyager queries
  GPT-4 through prompts only, storing verified JavaScript programs in a vector
  database keyed by GPT-3.5 embeddings, and runs in MineDojo with Mineflayer
  for low-level control. Against re-implemented ReAct, Reflexion and AutoGPT
  baselines, it discovers 63 unique items within 160 prompting iterations,
  3.3x more than counterparts, travels 2.3x longer distances, unlocks the
  wooden level 15.3x faster, stone 8.5x, iron 6.4x, and is the only method to
  reach diamond (102 iterations, 1/3 trials). On 4 unseen tasks in a fresh
  world it solves all within 50 iterations while all baselines score 0/3.
  Ablations isolate the components: a random curriculum drops item count by
  93%, removing self-verification drops it 73%, and swapping GPT-4 for GPT-3.5
  in code generation costs 5.7x in unique items. Trials are only 3 per
  condition, baselines were adapted from NLP settings rather than built for
  Minecraft, and no gradient-based Minecraft agent is compared since Voyager
  uses a high-level API. Perception is text-only; 3D building needed human
  visual critique. Treat the skill library as the transferable idea, since it
  also lifted AutoGPT."
