summary: >-
  Vision-language models (VLMs) have shown impressive capabilities across
  diverse tasks, motivating efforts to leverage these models to supervise
  robot learning. However, when used as evaluators in reinforcement learning
  (RL), today's strongest models often fail under partial observability and
  distribution shift, enabling policies to exploit perceptual errors rather
  than solve the task. We introduce SOLE-R1 (Self-Observing LEarner), a
  video-language reasoning model explicitly designed to serve as the sole
  reward signal for online RL. Given only raw video observations and a
