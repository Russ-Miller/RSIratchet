brief: >-
  The scaffolding around a model moves agent scores as much as the model
  choice does, so a single number attributed to a base model is
  underspecified. Harness-Bench holds the task prompt, initial sandbox state,
  budget, timeout and evaluator fixed while swapping 6 configurable harnesses
  (OpenClaw, NanoBot, Hermes, ZeroClaw, NullClaw, Moltis) over 8 API model
  backends on 106 sandboxed offline tasks spanning 8 workflow categories, from
  codebase maintenance to DevOps. Scores multiply completion, a binary
  security gate, and an LLM-judged process rubric for robustness, tool use and
  consistency.


  Across 5,088 trajectories in the factorial matrix, aggregate score ranges
  from 76.2 (NanoBot) to 52.4 (OpenClaw), a 23.8-point gap on the same tasks
  and backend pool. NanoBot used 68.7K tokens against Hermes's 139.7K and
  NullClaw's 175.1K, so longer trajectories did not buy performance. Stronger
  backends showed higher means and lower cross-harness variance. Among 5,194
  total trajectories, failed runs most often broke output contracts (36.4%) or
  failed to recover from tool errors (24.6%).


  The variation is measured under a controlled external protocol, but
  harnesses run with native prompting and state policy, so no individual
  mechanism is isolated; process scores depend on claude-sonnet-4.6 as judge,
  and Codex (80.4) is a reference point, not an ablation. Everything is
  offline and sandboxed, with no live services or drifting state.


  Report the harness alongside the model when citing agent numbers.
