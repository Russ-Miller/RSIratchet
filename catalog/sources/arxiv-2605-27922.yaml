summary: "LLM agents are increasingly deployed as executable systems that use
  tools, modify workspaces, and produce concrete artifacts. In such workflows,
  performance depends not only on the base model, but also on the harness: the
  system layer that manages context, tools, state, constraints, permissions,
  tracing, and recovery. However, existing benchmarks typically abstract away
  execution, compare complete agent systems, or hold the harness fixed, making
  execution-layer variation difficult to study. We introduce Harness-Bench, a
  diagnostic benchmark for evaluating configuration-level harness effects in
  realistic agent workflows. Harness-Bench evaluates representative harness
