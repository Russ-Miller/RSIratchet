summary: A fundamental problem of applying Large Language Models (LLMs) to
  important applications is that LLMs do not always follow instructions, and
  violations are often hard to observe or check. In LLM-based agentic
  workflows, such violations can propagate and amplify along reasoning chains,
  causing task failures and system incidents. This paper presents NSVIF, a
  neuro-symbolic framework for verifying whether an LLM's output follows the
  instructions used to prompt the LLM. NSVIF is a universal, general-purpose
  verifier; it makes no assumption about the instruction or the LLM. NSVIF
