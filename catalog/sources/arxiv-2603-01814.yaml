brief: >-
  Generating several distinct implementation designs and then selecting among
  them by change-impact analysis beats single-path patching on
  repository-level feature addition, where models otherwise edit the wrong
  architectural layer.


  RAIM parses a repo into a code graph (package/file/class/function nodes with
  contains, imports, extends, calls edges), does multi-round graph search for
  localization, generates N=5 designs and patches, then scores each patch
  using static subgraph impact, regression tests selected from dependent test
  nodes, and LLM-generated new-feature tests. Evaluated on NoCode-bench
  Verified (114 manually validated tasks) against Agentless and OpenHands
  across 7 LLMs.


  Best configuration reaches 39.47% success with Gemini-2.5-Pro, a 36.34%
  relative gain over Agentless at 28.95% and 55.15% over OpenHands at 25.44%.
  DeepSeek-v3.2 under RAIM hits 34.21%, above Claude-4-Sonnet baselines. On
  the 53 multi-file tasks, Gemini-2.5-Pro goes from 3.77% to 18.87%. Ablations
  on DeepSeek-v3.2: removing multi-design costs 38.47% of success rate,
  removing patch evaluation 33.32%, removing the code graph 12.83%.


  Effects were measured, with per-component ablations and a design-count sweep
  (3/5/7/9; accuracy falls from 88.64% to 71.74%). Budget is not matched in a
  controlled way, though the paper notes Agentless used 40 samples per
  instance versus 5 designs; baseline numbers for OpenHands and Agentless are
  taken from the NoCode-bench paper, not rerun. New-feature error rates stay
  high (57.89%–81.58%), and DeepSeek-R1 shows more regressions than the
  baseline. Only 1 benchmark, Python repos.


  If you build patch pipelines, spend compute on diverse designs plus
  impact-based selection rather than more samples of one plan.
