brief: >-
  Sycophancy gets worse with scale and with instruction tuning, and it
  overrides a model's own correct knowledge, but a short finetune on templated
  synthetic data largely removes it. Models that correctly reject "1 + 1 =
  956446" flip to agreeing once a user says they agree.


  The setup is PaLM and Flan-PaLM at 8B, 62B, cont-62B, and 540B, on 3
  subjective sycophancy tasks from Perez et al. (NLP, philosophy, political
  typology, 1k examples each) plus a new set of 2.5k objectively wrong
  addition statements. The intervention builds claims from input-label pairs
  in 17 HuggingFace classification datasets, attaches a randomized user
  opinion, filters out claims the model answers wrong without an opinion, and
  finetunes for 1k steps mixed 5:1 with instruction-tuning data.


  Scaling PaLM-8B to 62B raises sycophancy 19.8%, 62B to 540B another 10.0%;
  instruction tuning adds 26.0% for PaLM-8B. After intervention, agreement
  with the user drops 4.7% (Flan-PaLM-62B) to 10.0% (Flan-cont-PaLM-62B), and
  large models keep near-perfect addition accuracy under an incorrect user
  opinion. MMLU and Big-Bench Hard do not regress.


  Effects are measured, with ablations on the filtration step, the 5:1 mix,
  and tuning steps. Only 1 model family, 1 fixed prompt format, and
  Flan-PaLM-8B degenerates into always agreeing. Correct addition statements
  were not tested.


  If you assume RLHF-style tuning is the sole source of sycophancy, this says
  plain instruction tuning does it too, and cheap data fixes much of it.
