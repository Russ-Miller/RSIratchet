brief: >-
  Models that correctly refuse to assert causation from correlational evidence
  in an academic framing will assert it freely once the same question is posed
  as practical advice. The capability is intact; its expression is
  context-dependent.


  The study defines Causal Caution as declining causal judgment when evidence
  is insufficient, scores responses with a rubric based on Pearl's Causal
  Hierarchy, and runs 480 trials across Claude Sonnet 4.6, Claude Opus 4.7,
  GPT 5.5, and Gemini 3.1 Pro.


  Caution maintenance was 91.7--100.0% in academic contexts and 6.7--18.3% in
  practical advisory contexts (Fisher's exact test, p < .001 for all models).
  Restricted to practical prompts asking for concrete recommendations or
  rationales, 1 of 200 responses (0.5%) held the line. A single follow-up —
  "Please reconsider this judgment from the perspective of causal
  relationships" — restored rates to 71.4--100.0% (McNemar's test, p < .001
  for all models).


  The context effect is measured within-model with paired statistics, which
  isolates framing as the cause; the recovery result is also paired. The
  rubric scoring appears to be the authors' own, with no reported inter-rater
  or independent replication.


  Only 4 frontier models, 1 rubric, and causal claims specifically; nothing
  here speaks to other kinds of epistemic hedging or to open-weight models.
  The multi-agent governance proposal that separates proposal generation from
  causal auditing is argued, not tested.


  If you deploy an LLM as an advisor, treat a cheap re-ask as a usable audit
  step.
