brief: >-
  Letting an LLM judge decide on the fly how to weight sub-criteria produces
  unstable aggregation; fixing the weights explicitly before scoring raises
  agreement with human raters. Tree-of-Writing (ToW) models writing quality as
  a tree with content, format and impression nodes, has an LLM negotiator set
  edge weights per instruction, then traverses depth-first with per-aspect
  scorers.


  HoWToBench is a Chinese benchmark of 1302 instructions over 12 genres and 3
  task forms (Completion, Guide, Open), built by reverse-constructing prompts
  from expert human texts. 10 flagship models were scored, and MetaEditor
  supplies human ratings on 221 instructions x 9 outputs from 36 expert
  annotators.


  ToW reaches 0.93 Pearson and 0.93 Spearman with human system rankings,
  against 0.89 for elaborated rubrics and 0.88 for auto-planning. Aggregation
  drift falls from delta 0.273 to 0.080. Under disturbances (dropping,
  repeating, genre transfer) ToW always drops score; auto-planning and BLEU
  sometimes rise. Input length correlates -0.44 with content score on Guide.


  Evidence includes node ablations, a self-consistency baseline at comparable
  cost, and cost figures. Weaknesses: GPT-4o is the single judge backbone,
  data is Chinese only, single-round generation, and scalability of the tree
  was not tested.


  If you build LLM judges for long-form text, make aggregation weights
  explicit rather than negotiated.
