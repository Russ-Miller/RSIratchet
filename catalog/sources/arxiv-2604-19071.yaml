summary: >-
  Evaluating the writing capabilities of large language models (LLMs)
  remains a significant challenge due to the multidimensional nature of
  writing skills and the limitations of existing metrics. LLM's performance
  in thousand-words level and open-ended writing is inadequately assessed by
  traditional reference-based metrics or modern LLM-as-a-judge methods. We
  propose Tree-of-Writing (ToW), to resolve the implicit inconsistency often
  found when LLM-as-a-judge aggregates all sub-features in text evaluation.
  ToW incorporates a tree-structured workflow by explicitly modeling the
  aggregation weights
