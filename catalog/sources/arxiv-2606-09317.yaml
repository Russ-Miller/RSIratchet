summary: >-
  Spoken language identification (LID) for Indian languages is a challenging
  problem due to the large number of languages, significant phonetic overlap
  among related varieties, and the scarcity of labeled data for many
  low-resource languages. In this work, we present a systematic comparative
  study of two pre-trained speech encoders -- Whisper and FastConformer --
  combined with a linear classifier for large-scale Indic LID spanning 42
  languages across four linguistic families. We evaluate both encoders in
