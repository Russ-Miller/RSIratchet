summary: >-
  Large Language Models (LLMs) are increasingly deployed in human-centric
  applications, yet they often fail to provide substantive emotional
  support. While Reinforcement Learning (RL) has been utilized to enhance
  empathy of LLMs, existing reward models typically evaluate empathy from a
  single perspective, overlooking the inherently bidirectional interaction
  nature of empathy between the supporter and seeker as defined by Empathy
  Cycle theory. To address this limitation, we propose Psychology-grounded
  Empathetic Reward Modeling (PERM). PERM operationalizes empathy evaluation
  through a bidirection
