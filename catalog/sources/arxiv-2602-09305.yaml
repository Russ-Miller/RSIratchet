brief: >-
  Reward design, not RL algorithm choice, is where the differences between
  RLHF, RLVR and RLAIF actually live. This survey argues that framing all
  three under a common token-level MDP shows they share algorithmic structure
  and differ mainly in reward semantics, and that failure modes usually
  treated as separate bugs are manifestations of one tension between proxy
  reward and true reasoning quality.


  The synthesis, called Reasoning-Aligned Reinforcement Learning (RARL),
  organizes model-based, rule-based and self-reward paradigms along 3 axes:
  architecture (discriminative vs generative), granularity (outcome, step,
  token), and reward semantics (correctness, value estimation, potential-based
  shaping). Corpus: over 250 papers from arXiv (cs.LG, cs.CL, cs.AI) and
  NeurIPS, ICML, ICLR, ACL, EMNLP, January 2022 through April 2025.


  Claims are collated, not measured. Reported regularities include generative
  PRMs generalizing better out-of-distribution than discriminative ones, Monte
  Carlo value labeling carrying early-step bias, correctness and value signals
  being complementary, and binary verifiable rewards resisting hacking but
  causing vanishing gradients and entropy collapse. Table 1 compares RARL
  against 4 concurrent surveys.


  No experiments, no ablations, no reproduction. The authors note a
  significant share of cited works from late 2024 and early 2025 are
  non-peer-reviewed and should be treated as preliminary, and that coverage is
  representative rather than exhaustive.


  Use it as a map of reward-design failure modes, not as evidence for any one
  of them.
