brief: >-
  Reward design, not algorithm choice, is where RLHF, RLVR and RLAIF actually
  differ — this survey argues the three are structurally the same MDP and
  diverge only in reward semantics, and that credit-assignment bias, length
  bias and faithfulness bias are symptoms of one tension between proxy reward
  and true reasoning quality.


  The authors propose Reasoning-Aligned Reinforcement Learning (RARL), a
  taxonomy sorting model-based, rule-based and self-reward designs, with
  model-based rewards split along architecture (discriminative vs generative),
  granularity (outcome vs process reward models), and semantics (correctness,
  value estimation, potential-based shaping). Coverage spans reward hacking,
  inference-time scaling, hallucination and sycophancy, retrieval-augmented
  reasoning, and benchmark contamination.


  Stated regularities: generative PRMs beat discriminative ones on
  interpretability and out-of-distribution transfer; Monte Carlo value
  labeling biases toward early steps and is overly pessimistic; correctness
  and value signals are roughly orthogonal and combining them helps; binary
  rule-based rewards resist hacking but cause vanishing gradients and entropy
  collapse.


  Nothing here is measured by the authors. This is a synthesis of over 250
  papers from arXiv, Semantic Scholar and major proceedings covering January
  2022 through April 2025, with no new experiments, no ablations, and no
  reruns of the cited results. The authors flag that a large share of cited
  work from late 2024 and early 2025 is non-peer-reviewed and should be
  treated as preliminary; Table 2's trade-off ratings are qualitative
  judgments, not data.


  Use it as a map of reward-design failure modes and the vocabulary to compare
  them, not as evidence that any one design wins.
