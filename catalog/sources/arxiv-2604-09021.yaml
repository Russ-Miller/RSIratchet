brief: >-
  Feeding an audio model a few examples of pure noise paired with deliberately
  vague captions makes it hedge instead of inventing sound events, cutting
  hallucination without any fine-tuning. Real-audio in-context examples do not
  help, and slightly hurt.


  The setup is Clotho-1K, a 1,000-sample benchmark filtered from Clotho's
  4,981 clips down to 3,164 event-consistent ones, then manually re-annotated
  with one verified reference caption and AudioSet event labels.
  Hallucinations in generated captions are split into 4 types (acoustic
  attribute, source/material, prior-driven, fabricated event) and judged by
  Qwen3-Next-80B-A3B-Instruct. 13 ALLMs were scored; NAICL retrieves the Top-3
  nearest noise-description pairs via BEATs embeddings.


  Hallucination rates range from 19.42% (Gemini-2.5-pro) to 40.50%
  (SALMONN-7B), with source/material the dominant type. NAICL takes
  Qwen2.5-Omni-7B from 26.53% to 16.98%. Real-audio ICL gives 27.54%.
  Ablations cover shots, retrieval, 2s vs 10s noise, and structured vs
  unstructured captions; keyword frequencies show Event terms dropping 0.0831
  to 0.0490 and Acoustic terms rising 0.1166 to 0.1627.


  Mitigation was tested on 1 model only, and the judge is an LLM scoring
  against a single human reference, so conservatism and correctness are hard
  to separate. Treat the benchmark numbers as the more portable contribution.
