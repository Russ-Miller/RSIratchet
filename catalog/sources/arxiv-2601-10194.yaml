brief: >-
  Stuffing curated package documentation into the system prompt and splitting
  the workflow across specialized agents is what makes LLMs able to run tensor
  network simulations at all; without it they hallucinate completed runs. The
  agent system drives Renormalizer on 3 tasks: ground-state DMRG for an 8x8 2D
  transverse-field Ising model, TDVP dynamics and phase classification for the
  sub-Ohmic spin-boson model, and a 25-mode retinal photoisomerization model
  requiring an exponential DVR basis not present in the package.


  3 configurations (bare single agent, single agent with 43k tokens of curated
  docs, and a 7-agent architecture coordinated by a Conductor) were run with
  DeepSeek-V3.2, Gemini 2.5 Pro and Claude Opus 4.5, 5 runs per task, scored
  0-10 by rubric. Multi-agent reached roughly 90% success overall;
  DeepSeek-V3.2 scored 9.47 mean with 87% perfect runs, Gemini 2.5 Pro rose
  from 0.87 baseline with no perfect runs to 8.13 with 53% perfect. Average
  deductions fell to 0.53 and 1.87. Claude Opus 4.5 failed mainly through
  malformed empty tool calls on the retinal task.


  The 3-way configuration comparison isolates in-context learning and
  decomposition separately, but scoring is by the authors against their own
  rubric, with 5 runs per cell, 1 software package, and no human-expert or
  equal-token baseline. Token cost is large: around 10 million input tokens
  per task, $2-3 for DeepSeek and Gemini, $20-30 for Opus.


  Treat outputs as needing expert verification; a minority of failures look
  plausible but are wrong.
