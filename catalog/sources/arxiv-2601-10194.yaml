brief: >-
  Stuffing 43k tokens of curated package documentation into the system prompt,
  then splitting the work across specialized agents, takes LLMs from
  near-total failure to roughly 90% success on tensor network quantum
  simulations they otherwise cannot do.


  The system drives Renormalizer, a tensor network package, through a
  Conductor plus 7 specialists (Strategist, Guide, Programmer, Executor,
  Aggregator, Validator, Visualizer). Tasks: DMRG on an 8x8 2D
  transverse-field Ising model, TDVP phase-boundary mapping for the sub-Ohmic
  spin-boson model, and retinal photoisomerization requiring an exponential
  DVR basis not in the package. Backends: DeepSeek-V3.2, Gemini 2.5 Pro,
  Claude Opus 4.5. Runs scored 0-10 by rubric.


  DeepSeek-V3.2 multi-agent: 87% perfect runs, 9.47 average. Gemini 2.5 Pro
  goes from 0.87 average with no perfect runs at baseline to 8.13 with 53%
  perfect. Average deductions fall to 0.53 and 1.87. Claude Opus 4.5 fails
  mostly through malformed tool calls on the retinal task. DeepSeek makes ~300
  tool calls per task versus 100-150, consuming ~12 million input tokens on
  Ising versus 3-4 million.


  Evidence is a measured 3x3 ablation (baseline, in-context learning,
  multi-agent) at 5 runs per task, so the two interventions are separated, but
  scoring is author-run and n is small. No matched-token-budget baseline; 3
  tasks, 1 package.


  If you build scientific agents, documentation-in-context plus role
  decomposition is worth more than model choice here.
