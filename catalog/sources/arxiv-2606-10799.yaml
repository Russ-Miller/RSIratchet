summary: >-
  Large Language Models (LLMs) struggle to rigorously verify complex
  mathematical proofs. Standard global evaluation approaches suffer from
  "context poisoning," in which superficially plausible statements mask
  subtle logical flaws, leading to hallucination or over-skepticism. To
  address this, we shift from global evaluation to strict step-level
  verification: our framework maintains detailed context for each deduction
  step and strictly constrains the sources of applied theorems. We evaluate
