brief: >-
  Large language models can rate the correctness of their own generated
  answers well enough that filtering on the self-rating raises accuracy, and
  self-evaluation quality improves with scale even as generation quality also
  improves.


  Anthropic tested models at 800M, 3B, 12B and 52B parameters on multiple
  choice suites (all BIG Bench MC tasks, MMLU, TruthfulQA, LogiQA, QuALITY)
  and 6 sampling tasks (TriviaQA, Lambada, arithmetic, GSM8k, Codex HumanEval,
  scraped Python function synthesis). Two probes: P(True), asking the model
  whether a sampled answer is true or false, and P(IK), a finetuned value head
  predicting whether the model will answer a question correctly.


  Calibration on MC improves with size and from 0-shot to 5-shot; replacing an
  option with "none of the above" hurts both accuracy and calibration. For the
  52B model, accuracy on samples with P(True) > 0.5 is substantially above
  base accuracy, and showing 5 of the model's own T=1 samples before judging
  one helps short-answer tasks more than long-form ones. P(IK) trained on
  TriviaQA transfers partially: AUROC 0.864 on TriviaQA, 0.928 arithmetic,
  0.687 Python synthesis, 0.606 LAMBADA, 0.624 GSM8k; training on all 4 tasks
  raises these to 0.873, 0.987, 0.881, 0.853, 0.752. Calibration
  out-of-distribution is poor, usually underconfident.


  Effects are measured with AUROC, Brier and ECE across model sizes, with
  ablations on prompt format, shot count and training mixture. The
  self-knowledge claim is only weakly isolated: 2 12B models with different
  pretraining data differ by around 6% in average P(IK) on questions only one
  answers correctly (0.463 vs 0.408; 0.409 vs 0.477), and the
  cross-initialization test gave mixed results.


  All results are from 1 model family; RLHF policies appear miscalibrated
  until temperature is set to T = 2.5, and deception is not addressed. If you
  plan to use model self-scoring as a filter, expect useful ranking but
  untrustworthy probabilities off-distribution.
