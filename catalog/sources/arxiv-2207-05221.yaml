brief: >-
  Large language models assign calibrated probabilities to multiple choice
  answers when the options are shown as lettered tokens, and that calibration
  can be turned into usable self-evaluation of their own generated samples.


  Anthropic studied 800M, 3B, 12B and 52B pretrained models (850B tokens) on
  all BIG Bench multiple choice tasks, MMLU, TruthfulQA, LogiQA, QuALITY, plus
  the sampling tasks TriviaQA, Lambada, arithmetic, GSM8k, Codex HumanEval and
  scraped Python function synthesis. Two probes: P(True), asking the model
  whether a sampled answer is correct, and P(IK), a finetuned value head
  predicting whether the model will answer a question at all.


  Calibration improves with size and with 0-shot to 5-shot. Replacing an
  option with "none of the above" hurts accuracy and calibration even 20-shot.
  Showing 5 of its own T=1 samples before judging one improves short-answer
  self-evaluation; long-form tasks (Codex, GSM8k) benefit less. P(IK) trained
  on TriviaQA transfers partially: AUROC 0.864 in-distribution, 0.928 on
  arithmetic, 0.687 on Python synthesis, 0.606 on LAMBADA, 0.624 on GSM8k;
  training on all 4 tasks raises these to 0.873 / 0.987 / 0.881 / 0.853 /
  0.752. OOD calibration stays poor.


  Evidence is measured, with ablations on format, shot count, comparison
  samples and training mixture. A cross-model test with 2 12B models on
  different pretraining data found each model's P(IK) higher on questions it
  alone got right (0.463 vs 0.408; 0.409 vs 0.477), a gap of only around 6%,
  so "knows itself" versus "knows the question is hard" is only weakly
  separated.


  Only pretrained models; RLHF policies were miscalibrated until temperature
  T=2.5 was applied, and the natural-language confidence variant did not work
  well. Treat P(True) filtering as a working selective-prediction tool and
  P(IK) as unreliable off-distribution.
