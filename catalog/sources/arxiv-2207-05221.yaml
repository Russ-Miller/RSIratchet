brief: >-
  Large pretrained language models can produce calibrated probabilities about
  whether their own generated answers are correct, and verification scales
  faster than generation. Calibration depends heavily on format: answer
  options must be visible and letter-labeled.


  Anthropic tested models at 800M, 3B, 12B, and 52B parameters (850B
  pretraining tokens) on BIG Bench multiple choice, MMLU, TruthfulQA, LogiQA,
  QuALITY, plus open-ended TriviaQA, Lambada, arithmetic, GSM8k, Codex
  HumanEval, and scraped Python function synthesis. Two probes: P(True),
  asking the model to judge a sampled answer as True/False, and P(IK), a
  finetuned value head predicting whether the model will answer correctly at
  T=1.


  Calibration error falls with model size and from 0-shot to 5-shot. Replacing
  an option with "none of the above" degrades both accuracy and calibration,
  even 20-shot. RLHF policies look miscalibrated until a single temperature
  adjustment of T=2.5. Showing the model 5 of its own T=1 samples before
  judging one improves short-answer self-evaluation but helps less on Codex
  and GSM8k. A P(IK) head trained only on TriviaQA transfers partially: AUROC
  0.864 on TriviaQA, 0.928 on arithmetic, 0.687 on Python synthesis, 0.606 on
  LAMBADA, 0.624 on GSM8k; training on all 4 tasks raises these to 0.873,
  0.987, 0.881, 0.853, 0.752. OOD calibration stays poor, mostly
  underconfident. P(IK) rises from 18% to 78% when a relevant Wikipedia
  article is prepended, and tracks hint length and hint quality on GSM8k.


  Causal attribution for "self"-knowledge is weak: 2 12B models with different
  pretraining data showed average P(IK) of 0.463 vs 0.409 on questions only A
  got right, a gap of around 6%, and cross-initialization results were mixed.
  Everything is 1 model family, self-run, no external replication, and only 5
  sampling datasets.


  If you want cheap confidence signals, P(True) filtering works today
  in-distribution; do not trust it off-distribution without recalibration.
