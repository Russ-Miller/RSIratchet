brief: >-
  Large language models can grade their own samples better than they can
  produce them, and self-evaluation quality improves with scale even as
  generation quality also improves. That cuts against the intuition that
  models are uniformly overconfident about their own outputs.


  Anthropic tested models at 800M, 3B, 12B, 52B on multiple choice suites (all
  BIG Bench multiple choice, MMLU, TruthfulQA, LogiQA, QuALITY) and 5–6
  sampling tasks (TriviaQA, Lambada, arithmetic, GSM8k, Codex HumanEval,
  scraped Python function synthesis). Two probes: P(True), asking the model
  whether its own T=1 sample is correct, and P(IK), a finetuned value head
  predicting whether the model will answer a question at all.


  Calibration on multiple choice improves with size and with few-shot
  prompting, but only in a lettered-option format; replacing an option with
  "none of the above" hurts accuracy and calibration badly. Showing the model
  5 of its own T=1 samples before judging 1 improves short-answer
  self-evaluation, less so for Codex and GSM8k. P(IK) trained on TriviaQA
  alone transfers partially: AUROC 0.864 in-distribution, 0.928 on arithmetic,
  0.687 on Python synthesis, 0.606 on LAMBADA, 0.624 on GSM8k; training on all
  4 tasks raises these to 0.873/0.987/0.881/0.853/0.752. OOD calibration stays
  poor.


  Effects are measured with matched comparisons and ablations across formats,
  shot counts, and training mixtures. The key confound, whether P(IK) tracks
  self-knowledge or just question difficulty, is addressed by 2 12B models
  with different pretraining data: each scores higher on the 650 and 826
  TriviaQA questions only it got right, but the gap is only about 6%.


  All models come from 1 lab and 1 family; RLHF policies are miscalibrated
  until temperature is set to T=2.5, and only 5 sampling datasets were
  studied. If you are building abstention or verifier layers, P(True)
  filtering is worth trying, but do not expect calibrated confidence
  off-distribution.
