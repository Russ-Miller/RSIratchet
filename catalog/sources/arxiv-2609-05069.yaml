summary: >-
  Large language models (LLMs) show potential for medical tasks, but their
  single-turn question-answer format does not reflect how clinical diagnosis
  is performed in practice. As a result, they remain limited in complex
  diagnostic settings. We developed Debate-Mixture-of-Agents (DMoA), a novel
  multi-agent framework that structures role-based interaction to support
  iterative diagnostic reasoning. Base models and DMoA were evaluated on 297
