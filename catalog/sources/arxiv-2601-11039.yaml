summary: >-
  Large Audio Language Models (LALMs) excel at semantic and paralinguistic
  tasks, yet their ability to perceive the fundamental physical attributes
  of audio such as pitch, loudness, and spatial location remains
  under-explored. To bridge this gap, we introduce SonicBench, a
  psychophysically grounded benchmark that systematically evaluates 12 core
  physical attributes across five perceptual dimensions. Unlike previous
  datasets, SonicBench uses a controllable generation toolbox to construct
  stimuli for two complementary paradigms: recognition (absolute judgment)
  and comparison (relative judgment). T
