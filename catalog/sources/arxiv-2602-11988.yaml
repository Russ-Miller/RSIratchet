summary: "A widespread practice in software development is to tailor coding
  agents to repositories using context files, such as AGENTS.md. Although this
  practice is strongly encouraged by agent developers, there is currently no
  rigorous investigation into whether such context files are actually
  effective for real-world tasks. In this work, we study this question and
  evaluate coding agents' task completion performance in two complementary
  settings: established SWE-bench tasks from popular repositories, with
  LLM-generated context files, and a novel collection of issues from
  repositories containing developer-committed context files. Surprisingly, we
  find that providing context files does not generally im"
notes: "ETH Zurich / LogicStar on AGENTS.md context files: no general
  improvement in task success, over 20% more inference cost, across LLMs,
  agents, and both LLM-generated and developer-committed files. Contests
  guide-file. Masood [27]."
