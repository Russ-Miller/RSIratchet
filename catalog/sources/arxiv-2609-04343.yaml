brief: >-
  Removing from the input any concept the model's own explanation did not
  cite, then re-querying on the reduced input, makes explanations more
  faithful at test time without touching weights. The intuition is that this
  strips hidden influences while leaving the credited concepts intact.


  The paper separates 2 failure modes: incompleteness (the explanation omits
  factors that did influence the answer) and unsoundness (it cites factors
  that did not). Most existing test-time work targets unsoundness; this method
  targets incompleteness, where omitted factors are called hidden concepts.
  Evaluation spans 2 datasets, multiple model families, and 2 independent
  faithfulness metrics.


  The reported result is directional only: faithfulness improves over both
  standard prompting and prompting that explicitly asks for faithful
  explanations. The source text available here gives no effect sizes, so the
  magnitude of the gain cannot be judged.


  The design includes 2 prompting baselines and 2 metrics, which is the right
  shape for attribution, but no ablation of the removal step, no
  matched-compute comparison, and no independent replication are described.
  The illustrated motivating case is a stereotype-sensitive hiring question;
  whether the approach holds for long-form reasoning, agentic tasks, or
  accuracy-critical settings is untested.


  If you audit model explanations, this is a cheap intervention worth trying,
  but you will need the full paper to size the benefit.
