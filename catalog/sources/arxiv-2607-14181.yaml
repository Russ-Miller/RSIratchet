brief: >-
  4-bit post-training quantization mostly preserves code-generation
  correctness, but which method you pick matters more than the bit width, and
  the sensitivity to prompt complexity depends on the base model rather than
  the technique.


  6 weight-only PTQ methods (GPTQ, AWQ, QuIP#, AQLM, BitsAndBytes, GGUF) at
  4-bit were applied to Qwen2.5-Coder-7B-Instruct and CodeLlama-7B-Instruct,
  and evaluated on McEval, CoderEval and BigCodeBench in Python and Java, for
  pass@1 and for SonarCloud maintainability, reliability, security and
  complexity.


  AQLM matched or beat FP16 repeatedly (BCB-Python CodeLlama 0.27 vs FP 0.23,
  significant, OR = 0.62), while QuIP# degraded most (0.12 on BCB-Python; 0.08
  vs FP 0.25 on McEval-Java). Security hotspots stayed at 0 everywhere; AWQ
  raised Java code smells (328 vs 274; d = −0.346, d = −0.394), BitsAndBytes
  gave the largest Python complexity effect (CoC d = −0.487). For CodeLlama, 5
  of 6 techniques showed positive correlation between prompt entropy and
  degradation (QuIP# r = +0.325); for Qwen almost none did.


  Effects were measured against matched FP16 baselines with McNemar and
  Wilcoxon tests, Holm–Bonferroni correction and Cliff's delta; a 10-run
  Friedman check ruled out inference noise on 1 configuration, and the entropy
  confound was rechecked within BigCodeBench alone.


  Only 7B models, 2 families, temperature 0, WikiText-2 calibration, 1 static
  analyzer, and small McEval subsets (42 Python, 53 Java tasks).


  Treat quantization technique as a deployment choice with model-specific
  consequences, not a neutral compression step.
