brief: >-
  Adding about 5M multilingual OCR samples to post-training cuts a general
  MLLM's tendency to invent text that is not in the image, with most of the
  effect coming from fine-tuning rather than prompting.


  The setup is an AnyMAL-style MLLM with a LLaMA-3 70B backbone, frozen
  MetaCLIP ViT and Perceiver resampler, adapted with LoRA (r = 256, α = 512)
  on roughly 5M OCR-oriented samples in English, Spanish, French, Italian and
  German, built from about 1M source examples plus synthetic rendering and
  in-situ text replacement (SAM 2 masks, inpainting, style-matched rendering).
  No OCR engine, extracted text, or boxes at inference.


  On about 3,000 held-out image-question-answer samples, completeness rises
  71.3 to 84.6, hallucination falls 18.3% to 5.5%, BLEU-1 rises 52.3 to 80.2;
  hallucination under blur drops 24.8% to 6.6% and under rotation 21.4% to
  5.8%. Public gains are small: DocVQA 81.5 to 82.3, TextVQA 80.5 to 82.0,
  VQAv2 flat at 81.4; CoT adds only 82.5 and 82.2.


  The SFT-versus-CoT split is ablated within 1 model, but the headline numbers
  come from an internal benchmark with an LLM-based hallucination judge and no
  matched-data control separating OCR supervision from extra training volume.
  Only 5 European languages at scale; Qwen2.5-VL-7B still leads on DocVQA and
  MMBench.


  Treat this as evidence that OCR grounding is a data problem, not an
  architecture problem, with most of the measured gain living on the authors'
  own benchmark.
