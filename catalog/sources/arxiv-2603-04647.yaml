brief: >-
  Constraining a RAG generator to treat retrieved passages as an explicit
  control factor, rather than as background context, is claimed to raise
  factual reliability without hurting fluency.


  The proposed method couples two components: a shared semantic space in which
  queries and candidate evidence are scored for relevance, intended to
  suppress noisy retrieval and semantic drift, and an explicit evidence
  constraint applied at generation time that narrows the expressible content
  to what the evidence supports. Retrieval and generation stages are modelled
  jointly rather than as a pipeline.


  The source reports only that comparisons show stable improvements across
  multiple generation quality metrics. No numbers, datasets, retrievers, or
  base models are named in the text available, so the size of the effect
  cannot be assessed.


  The evidence here is asserted rather than shown. There is no stated
  baseline, no ablation separating the alignment component from the constraint
  component, and no named benchmark or model family, so the two mechanisms
  cannot be attributed independently and the headline claim rests on
  self-description.


  Untested: whether the constraint degrades answers when retrieval fails
  outright, behaviour on multi-hop or long-form generation, and transfer
  across model scales.


  Treat this as a design proposal worth reading for the architecture, not as
  evidence that evidence-constrained decoding works.
