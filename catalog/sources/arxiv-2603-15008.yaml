brief: >-
  Handing video QA models perfect ground-truth visual clues lifts accuracy by
  roughly 20 points across architecturally different backbones, which locates
  the bottleneck in clue extraction rather than downstream reasoning.


  ClueNet fine-tunes VideoLLaMA3 (SigLIP-SO400M encoder, Qwen2.5-7B-Instruct
  LLM) in 2 stages: decoupled supervision of clue generation and clue-grounded
  answering, then inference supervision with a differentiable Adaptive Clue
  Filter scoring each clue quintuplet (start, end, subject, predicate, object)
  on semantic relevance and visual faithfulness. Evaluated on NExT-QA, STAR,
  and MVBench against GPT-4o, Qwen-VL-Max, InternVideo2.5, Qwen2.5-VL and
  others at 16 input frames.


  ClueNet reaches 77.6% on STAR (+5.5 over VideoLLaMA3), 84.3% on NExT-QA
  (+2.8 over Qwen2.5-VL), 69.8% average on MVBench vs 68.7% for
  InternVideo2.5. In the oracle setting Qwen2.5-VL gains +22.9% and
  InternVideo2.5 +21.1%; ClueNet reaches 94.8% oracle accuracy.


  The ablation isolates components: Stage 1 alone loses 1.3% on STAR, Stage 2
  adds +3.0%, keyframe selection +0.3%, ACF +2.5%, and visual compression cuts
  GFLOPs from 54,197.96 to 40,622.84 for -0.3% accuracy. Baselines were
  re-implemented by the authors at matched frame counts, but only 1 base model
  was fine-tuned, so cross-backbone claims rest on the oracle experiment
  rather than full training.


  Gains concentrate on temporal and interaction splits; static attribute tasks
  and the Feasibility split, which needs unobservable commonsense, do not
  improve, and ClueNet trails InternVideo2.5 by 1.3% there.


  If your video pipeline hallucinates, the evidence here says fix clue
  extraction before scaling the reasoner.
