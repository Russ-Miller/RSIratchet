summary: "Multi-modal Large Language Models (MLLMs) have significantly
  advanced video reasoning, yet Video Question Answering (VideoQA) remains
  challenging due to its demand for temporal causal reasoning and
  evidence-grounded answer generation. Prevailing end-to-end MLLM frameworks
  lack explicit structured reasoning between visual perception and answer
  derivation, causing severe hallucinations and poor interpretability.
  Existing methods also fail to address three core gaps: faithful visual clue
  extraction, utility-aware clue filtering, and end-to-end clue-answer
  alignment. Inspired by hierarchical human"
