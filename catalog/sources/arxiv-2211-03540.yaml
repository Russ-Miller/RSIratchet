brief: >-
  Non-expert humans chatting with an unreliable RLHF dialog model beat both
  the model alone and their own unaided performance on questions neither can
  reliably answer. This is the first empirical test of the sandwiching setup
  for scalable oversight.


  Anthropic ran 2 question-answering tasks with a 52B helpful-only RLHF
  assistant: MMLU exam questions, and QuALITY reading comprehension under a
  5-minute limit on ~5,000-word stories. 10 Surge AI participants (2 outliers
  dropped) each answered 100 validation questions assisted and 100 unassisted,
  with a chat pane and a conversation reset button.


  Individual accuracy: 57.2 unassisted vs 65.6 for best-of-20 chain-of-thought
  vs 75.4 human+model on MMLU; 48.6 vs 66.9 vs 76.8 on QuALITY. Weighted
  majority vote reached 78.0 and 86.0, still under expert estimates of 90.0
  and 93.5. Calibration got worse with assistance (CE 12 and 18 on MMLU).


  The comparison is measured and within-participant, with automatic model
  baselines including 5-shot and best-of-20 CoT. But 2 of 10 participants were
  removed for outperforming the model, creating a selection effect toward
  positive results, answers were revealed after each question, and 1 model and
  1 size were tested.


  Nothing here covers fine-tuning-based oversight, free-form tasks, or
  adversarial models; multiple-choice QA is close to training data.


  Treat this as evidence the paradigm is runnable, not that chat-based
  oversight is sufficient.
