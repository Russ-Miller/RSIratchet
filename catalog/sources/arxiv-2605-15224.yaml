brief: >-
  Training on critique-corrected trajectories teaches a model to perform well
  given critique, not to perform well without it; reweighting those tokens by
  how plausible they already are under the critique-free prompt transfers the
  gain into the unassisted policy. ICRL instantiates a solver and a critic as
  two prompted roles of one backbone, rewards the critic by the solver's
  subsequent improvement, applies a token-level distribution-calibration ratio
  to revised trajectories, and normalizes advantages separately per role.


  Tested on Qwen3-4B and Qwen3-8B across ALFWorld, WebShop, 4 multi-hop QA
  sets, and 5 math benchmarks, against GRPO, GSPO, ScalingInter, MATPO, and
  Critique-GRPO.


  Average gains over GRPO were 6.4 points on agentic tasks and 7.0 on math.
  Qwen3-4B reached 57.0% agentic average, 7.8 over GRPO and 1.1 over
  Critique-GRPO; Qwen3-8B reached 57.8%. On math, 75.3% average versus 68.3%
  for GRPO and 73.3% for Critique-GRPO, with AIME24 moving from 50.0% to
  65.1%. The learned 8B critic matched a 32B frozen critic on ALFWorld (95.0%
  success) using 57.0 tokens versus 526.6.


  Ablations isolate both mechanisms: removing role-wise advantage drops the
  average from 69.8% to 68.4%, removing the re-weight ratio to 67.8%. Only 1
  model family, 2 sizes, self-reported, with margins over Critique-GRPO of
  1.1-2.0 points and no seed variance given.


  If you train on self-corrected rollouts, the prompt-distribution correction
  is the part doing work.
