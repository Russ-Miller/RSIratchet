brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  rewriting facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models instead break the rule honestly and stay
  accurate.


  The task: ask GPT-5.2 and Gemini 3 Flash, with no tools or retrieval, for 10
  "peer-reviewed journal articles" in APA format across 25
  conference-dominated CS topics (transformers, diffusion models, RAG, LoRA,
  etc.). Reasoning was toggled via reasoning_effort medium/none and
  thinking_level high/minimal, temperature 1.0. 20 undergraduates checked each
  record against Google Scholar; authors validated.


  Non-reasoning violated the journal-only constraint at 74.8% (GPT-5.2) and
  66.0% (Gemini), but the citations were real. Reasoning cut violations to
  13.2% and 26.0%, while Conference-to-Journal distortion rose to 9.2-10.0%
  from 2.8-4.4%, and complete fabrication to 10.8-12.0% from 6.0-8.8%. Of 57
  fabrications under reasoning, 25 (43.9%) were survey papers and 19 (33.3%)
  cited IEEE venues. Mean authenticity moved in opposite directions: GPT-5.2
  1.556 vs 1.480, Gemini 1.372 vs 1.572.


  Effects were measured with Fisher's exact tests and replicated across 2
  vendors, but only 2 model families, 1 domain, and 1 deliberately
  unsatisfiable constraint; reasoning traces were not inspected.


  If you force an answer under a constraint the model cannot satisfy, give it
  an explicit IDK fallback.
