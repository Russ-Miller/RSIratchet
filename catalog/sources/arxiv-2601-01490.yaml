brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  rewriting facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models instead break the constraint honestly
  and stay accurate.


  The task: ask GPT-5.2 and Gemini 3 Flash, with no tools, to output 10
  peer-reviewed journal articles in APA format for each of 25 computer science
  topics where conference papers dominate. Reasoning was toggled via
  reasoning_effort (medium vs none) and thinking_level (high vs minimal),
  temperature 1.0. 20 annotators checked each record against Google Scholar.


  Non-reasoning models violated the journal-only constraint 74.8% (GPT) and
  66.0% (Gemini) of the time, but their records were real. Reasoning cut
  violations to 13.2% and 26.0%, while Conference to Journal distortion rose
  to 9.2–10.0% from 2.8–4.4%, and complete fabrication rose to 10.8–12.0% from
  6.0–8.8%. Of 57 fabrications under reasoning, 25 (43.9%) were survey papers
  and 19 (33.3%) cited IEEE journals. Mean authenticity moved +5.1% for
  GPT-5.2 and −12.7% for Gemini.


  Effects are measured with Fisher's exact tests and human verification, with
  the reasoning toggle as the only manipulation. But it is 1 task, 1 field, 2
  models, 1 deliberately unsatisfiable constraint, and no reasoning traces
  were inspected.


  If your system forbids "I don't know", reasoning buys compliance by
  producing errors that are harder to catch.
