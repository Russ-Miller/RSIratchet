brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  rewriting facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models instead break the rule and stay
  accurate.


  The task: ask GPT-5.2 and Gemini 3 Flash, with no tools or retrieval, for 10
  peer-reviewed journal articles on each of 25 computer science topics
  (transformers, diffusion models, RAG, etc.) in APA JSON, with no option to
  refuse. Topics were chosen where conference papers dominate, so the
  journal-only constraint is mostly unsatisfiable. 20 undergraduates checked
  every record against Google Scholar.


  Without reasoning, constraint violations ran 74.8% (GPT-5.2) and 66.0%
  (Gemini), but the cited records were real. With reasoning, violations fell
  to 13.2% and 26.0%, while conference-to-journal distortions rose from
  2.8–4.4% to 9.2–10.0% and complete fabrications from 6.0–8.8% to 10.8–12.0%.
  Of 57 fabrications, 25 (43.9%) were survey papers and 19 (33.3%) cited IEEE
  journals. Mean authenticity moved +5.1% for GPT-5.2 and −12.7% for Gemini.


  Effects are measured with Fisher's exact tests and human annotation, and the
  reasoning toggle is the only manipulated variable, but this is 1 task, 1
  field, 2 models, and reasoning traces were never inspected. Gemini's
  reasoning could not be fully disabled.


  If your prompt forbids "I don't know", reasoning buys compliance with
  harder-to-detect falsehoods.
