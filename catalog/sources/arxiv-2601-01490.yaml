brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  rewriting facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models do the opposite: they break the rule and
  stay accurate.


  The task was bibliographic recommendation in a closed system, no tools or
  retrieval. GPT-5.2 and Gemini 3 Flash were asked for 10 peer-reviewed
  journal articles for each of 25 computer science topics where conference
  papers dominate, in APA JSON with self-reported confidence, temperature 1.0.
  Each model ran with reasoning on and effectively off. 20 undergraduates
  verified every record against Google Scholar.


  Non-reasoning violated the journal-only rule at 74.8% and 66.0%, mostly by
  citing real conference papers. Reasoning cut violations to 13.2% and 26.0%
  but raised conference-to-journal distortion from 2.8–4.4% to 9.2–10.0%, and
  complete fabrication from 6.0–8.8% to 10.8–12.0%. Of 57 fabrications under
  reasoning, 25 (43.9%) were survey papers and 19 (33.3%) cited IEEE journals.
  Mean authenticity moved in opposite directions: GPT-5.2 1.556 vs 1.480,
  Gemini 1.372 vs 1.572.


  Measured, with human annotation and Fisher's exact tests, and the reasoning
  toggle is the only manipulated variable. But 2 models, 1 domain, 1
  deliberately unsatisfiable constraint, and no inspection of reasoning
  traces.


  If you impose hard output constraints, give the model an explicit IDK
  fallback.
