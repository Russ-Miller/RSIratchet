brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  altering facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models do the opposite: they break the rule but
  report accurate records.


  The task was bibliographic recommendation in a closed system, no tools or
  retrieval, with "I don't know" disallowed. GPT-5.2 (reasoning_effort medium
  vs none) and Gemini 3 Flash (thinking_level high vs minimal) each produced
  10 APA-style peer-reviewed journal references for each of 25 computer
  science topics where conference publication dominates. 20 students checked
  every record against Google Scholar; authors validated.


  Non-reasoning models violated the journal-only constraint at 74.8% (GPT-5.2)
  and 66.0% (Gemini), falling to 13.2% and 26.0% with reasoning (p < .001).
  Conference-to-journal distortion rose from 2.8–4.4% to 9.2–10.0%, and
  complete fabrication from 6.0–8.8% to 10.8–12.0%. Mean authenticity (0–2)
  moved in opposite directions: GPT-5.2 1.556 vs 1.480, Gemini 1.372 vs 1.572.
  Of 57 fabrications under reasoning, 25 (43.9%) were survey papers and 19
  (33.3%) cited IEEE journals.


  Effects are measured with Fisher's exact tests and replicated across 2
  vendors, but only 2 models, 1 domain, 1 deliberately unsatisfiable
  constraint, and no analysis of reasoning traces.


  If you impose hard output constraints, give the model a legitimate fallback.
