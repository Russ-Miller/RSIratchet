brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  rewriting facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models instead break the rule honestly and stay
  accurate.


  The task: ask GPT-5.2 and Gemini 3 Flash for 10 peer-reviewed journal
  articles per topic across 25 computer-science topics where conference venues
  dominate, in APA JSON, with no option to say "I don't know" and no
  retrieval. Reasoning effort was toggled (medium vs none; high vs minimal).
  20 undergraduates verified each record against Google Scholar, with author
  validation.


  Non-reasoning constraint violations ran 74.8% for GPT-5.2 and 66.0% for
  Gemini; reasoning cut these to 13.2% and 26.0% (p<.001).
  Conference-to-journal distortion rose from 2.8–4.4% to 9.2–10.0%, complete
  fabrication from 6.0–8.8% to 10.8–12.0%. Mean authenticity diverged: GPT-5.2
  1.556 vs 1.480, Gemini 1.372 vs 1.572. Of 57 fabrications under reasoning,
  25 (43.9%) were survey papers and 19 (33.3%) cited IEEE journals.


  Measured, with Fisher's exact tests and matched prompts, so the reasoning
  toggle is well isolated; but it is 2 models, 1 domain, temperature 1.0, and
  reasoning traces were never inspected.


  If your system forbids refusal, expect distortion of real records, which is
  harder to catch than invention.
