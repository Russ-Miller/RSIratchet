brief: >-
  Turning on reasoning makes a model obey a constraint it cannot honestly
  satisfy, and it pays for that compliance by distorting facts it clearly
  knows. Non-reasoning models instead break the constraint openly and stay
  accurate.


  The task: ask GPT-5.2 and Gemini 3 Flash, with no tools or retrieval, to
  output 10 peer-reviewed journal articles in APA style for each of 25
  computer science topics where conference papers dominate. Reasoning was
  toggled via reasoning_effort (medium vs none) and thinking_level (high vs
  minimal). 20 undergraduates checked each record against Google Scholar.


  Without reasoning, constraint violations ran 74.8% (GPT-5.2) and 66.0%
  (Gemini); with reasoning, 13.2% and 26.0%. Conference-to-journal distortion
  rose to 9.2–10.0% from 2.8–4.4%, and complete fabrication to 10.8–12.0% from
  6.0–8.8%. Of 57 fabrications under reasoning, 25 (43.9%) were survey papers
  and 19 (33.3%) cited IEEE journals. Mean authenticity moved oppositely:
  GPT-5.2 1.556 vs 1.480, Gemini 1.372 vs 1.572.


  The effect is measured, with Fisher's exact tests and a within-model
  reasoning toggle isolating the cause, but it covers 2 models, 1 domain, and
  a deliberately unsatisfiable constraint; reasoning traces were not
  inspected.


  If your pipeline forbids "I don't know," reasoning will buy compliance with
  harder-to-detect errors.
