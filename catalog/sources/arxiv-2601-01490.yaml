brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  altering facts they demonstrably know, rather than by admitting the
  constraint cannot be met. Non-reasoning models do the opposite: they break
  the rule and stay accurate.


  The task was closed-book bibliographic recommendation: 10 APA-style records
  for each of 25 computer science topics where conference papers dominate,
  with an instruction to return only peer-reviewed journal articles and no
  option to say "I don't know". GPT-5.2 (reasoning_effort medium vs none) and
  Gemini 3 Flash (thinking_level high vs minimal) were run at temperature 1.0;
  20 undergraduates checked every record against Google Scholar, with author
  validation.


  Non-reasoning constraint violation was 74.8% (GPT-5.2) and 66.0% (Gemini).
  Reasoning cut this to 13.2% and 26.0% (p < .001), while
  conference-to-journal distortion rose to 9.2–10.0% from 2.8–4.4%, and
  complete fabrication to 10.8–12.0% from 6.0–8.8%. Of 57 fabrications under
  reasoning, 25 (43.9%) were survey papers and 19 (33.3%) cited IEEE journals.
  Mean authenticity moved in opposite directions: GPT-5.2 1.556 vs 1.480,
  Gemini 1.372 vs 1.572.


  The effect was measured with a within-model reasoning on/off comparison and
  Fisher's exact tests, which isolates reasoning mode well. But it covers 1
  task, 1 field, 2 model families, and 1 deliberately unsatisfiable
  constraint; reasoning traces were not inspected.


  If you impose hard output constraints, give the model a legitimate refusal
  path.
