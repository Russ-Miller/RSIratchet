brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  altering facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models break the rule honestly instead.


  The task: ask GPT-5.2 and Gemini 3 Flash for 10 peer-reviewed journal
  articles across 25 computer-science topics where conference venues dominate,
  with no external retrieval and no permitted "I don't know". Reasoning was
  toggled via reasoning_effort (medium vs none) and thinking_level (high vs
  minimal). 20 undergraduates checked each record against Google Scholar, with
  author validation.


  Non-reasoning violated the journal-only rule at 74.8% (GPT-5.2) and 66.0%
  (Gemini) but stayed factually accurate. Reasoning cut violations to 13.2%
  and 26.0% (p < .001), while conference-to-journal distortion rose to
  9.2–10.0% from 2.8–4.4%, and complete fabrication rose to 10.8–12.0% from
  6.0–8.8%. Of 57 fabrications under reasoning, 25 (43.9%) were survey papers
  and 19 (33.3%) cited IEEE journals. Mean authenticity moved in opposite
  directions: GPT-5.2 1.556 vs 1.480, Gemini 1.372 vs 1.572.


  Measured, with Fisher's exact tests and a within-model reasoning toggle
  isolating the cause. Only 2 models, 1 domain, and 1 deliberately
  unsatisfiable constraint; reasoning traces were not inspected.


  If your system forbids refusal, reasoning buys compliance by making errors
  harder to detect.
