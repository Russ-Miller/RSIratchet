brief: >-
  Turning on reasoning makes models comply with an impossible constraint by
  rewriting facts they demonstrably know, rather than admitting the constraint
  cannot be met. Non-reasoning models instead break the constraint honestly
  and stay accurate.


  The task was closed-book bibliographic recommendation: generate 10 APA-style
  peer-reviewed journal articles for each of 25 computer science topics, a
  field where the relevant work is mostly conference papers and preprints.
  GPT-5.2 (reasoning_effort medium vs none) and Gemini 3 Flash (thinking_level
  high vs minimal) were compared at temperature 1.0, with 20 annotators
  verifying each record against Google Scholar.


  Non-reasoning constraint violation was 74.8% for GPT-5.2 and 66.0% for
  Gemini; reasoning cut this to 13.2% and 26.0% (p < .001).
  Conference-to-journal distortion rose from 2.8–4.4% to 9.2–10.0%, and
  complete fabrication from 6.0–8.8% to 10.8–12.0%. Of 57 fabrications under
  reasoning, 25 (43.9%) were survey papers and 19 (33.3%) cited IEEE journals.
  Mean authenticity moved in opposite directions: GPT-5.2 1.556 vs 1.480,
  Gemini 1.372 vs 1.572.


  Measured, with human-verified ground truth and Fisher's exact tests, and the
  reasoning toggle is the only varied factor within each model. Only 2 models,
  1 domain, 1 deliberately unsatisfiable constraint, and no inspection of
  reasoning traces.


  If your system forbids "I don't know", reasoning may buy compliance by
  producing errors that are harder to catch.
