summary: >-
  Long-context understanding remains a fundamental challenge for large
  language models, as excessively long inputs often lead models to forget
  salient information. This issue is even more pronounced in the speech
  domain, where audio, as a low-compression modality, requires substantially
  more embeddings than text to preserve both semantic content and acoustic
  cues. To address this challenge, we introduce \textbf{Vox-Infinity}, the
