  modern AI software engineering tasks. Unlike traditional function-level or
  file-level coding tasks, AI software engineering requires not only basic
  coding proficiency but also advanced skills in managing and interacting
  with code repositories. However, existing methods often overlook the need
  for repository-level code understanding, which is crucial for accurately
  grasping the broader context and developing effective solutions. On this
  basis, we present RepoGraph, a plug-in module that manages a
  repository-level structure
