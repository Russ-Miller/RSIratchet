summary: Large Language Models (LLMs) excel in code generation yet struggle
  with modern AI software engineering tasks. Unlike traditional function-level
  or file-level coding tasks, AI software engineering requires not only basic
  coding proficiency but also advanced skills in managing and interacting with
  code repositories. However, existing methods often overlook the need for
  repository-level code understanding, which is crucial for accurately
  grasping the broader context and developing effective solutions. On this
  basis, we present RepoGraph, a plug-in module that manages a
  repository-level structure
ingested_at: 2026-09-19
brief: >-
  Giving a code agent a line-level dependency graph of the repository improves
  issue resolution for both procedural and agent-style frameworks, but the
  gains are small in absolute terms. RepoGraph parses a repo with tree-sitter
  into an AST-derived graph where nodes are code lines classified as
  definition or reference, edges are invoke and contain relations, and
  built-in or third-party calls are filtered out; k-hop ego-graphs around a
  search term are flattened into prompts or exposed as a search_repograph
  action.


  On SWE-bench-Lite with GPT-4 and GPT-4o, resolve rate rose from 2.67 to 5.33
  for RAG, 27.33 to 29.67 for Agentless, 19.00 to 21.33 for AutoCodeRover, and
  18.33 to 20.33 for SWE-agent, an average relative improvement of 32.8%.
  Localization accuracy improved most at file level (up to 5.6 points) and
  least at line level (1.6-2.7 points). On 2,665 Python CrossCodeEval samples,
  code-match EM went from 10.5 to 28.7 with GPT-4o and 10.2 to 19.7 with
  Deepseek-Coder.


  Effects were measured against each baseline's own configuration, with token
  and cost accounting reported (e.g. Agentless $0.34 to $0.39, 42,376 to
  47,323 tokens), plus a variant ablation showing 2-hop flattening degrades
  performance to 26.00, below baseline. There is no matched-token-budget
  control, and gains are 2-3 points on 300 problems, so some could be noise.
  Only Python was tested; error analysis shows contextual misalignment, not
  localization, remains the dominant failure.


  Treat structural retrieval as a cheap add-on that mainly fixes file-level
  localization, not patch quality.
