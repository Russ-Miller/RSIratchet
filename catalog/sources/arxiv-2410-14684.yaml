summary: Large Language Models (LLMs) excel in code generation yet struggle
  with modern AI software engineering tasks. Unlike traditional function-level
  or file-level coding tasks, AI software engineering requires not only basic
  coding proficiency but also advanced skills in managing and interacting with
  code repositories. However, existing methods often overlook the need for
  repository-level code understanding, which is crucial for accurately
  grasping the broader context and developing effective solutions. On this
  basis, we present RepoGraph, a plug-in module that manages a
  repository-level structure
ingested_at: 2026-09-19
brief: >-
  Giving an LLM a line-level dependency graph of a repository, rather than
  file-level retrieval or a flat directory listing, improves issue resolution
  for both procedural and agent-based software engineering systems. RepoGraph
  parses every Python file with tree-sitter into an AST-derived graph whose
  nodes are code lines tagged as definitions or references, filters out
  built-in and third-party calls, and retrieves k-hop ego-graphs around a
  search term.


  It was plugged into 4 frameworks on SWE-bench-Lite: RAG and Agentless
  (procedural), SWE-agent and AutoCodeRover (agent), using GPT-4 and GPT-4o.


  Resolve rate rose for all 4: RAG 2.67 to 5.33, Agentless 27.33 to 29.67,
  AutoCodeRover 19.00 to 21.33, SWE-agent 18.33 to 20.33, an average relative
  gain of 32.8%. File-level localization accuracy improved 4.4-5.6 points;
  line-level only 1.6-2.7. On a 2,665-sample Python subset of CrossCodeEval,
  code-match EM went 10.5 to 28.7 with GPT-4o and 10.2 to 19.7 with
  Deepseek-Coder-V2-Lite-Instruct.


  Gains are measured against the same baselines at matched configuration, but
  token use also rose (Agentless $0.34/42,376 tokens to $0.39/47,323), so the
  comparison is not at equal budget. An ablation over retrieval variants shows
  2-hop + flatten drops resolve rate to 26.00, below baseline; 1-hop +
  summarization gives 28.33.


  Only Python was tested, only SWE-bench-Lite, and headline numbers are
  single-run with no seed variance. Treat the gain as real but small relative
  to baseline spread, and sensitive to how much graph context you inject.
