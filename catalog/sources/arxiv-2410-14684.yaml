summary: Large Language Models (LLMs) excel in code generation yet struggle
  with modern AI software engineering tasks. Unlike traditional function-level
  or file-level coding tasks, AI software engineering requires not only basic
  coding proficiency but also advanced skills in managing and interacting with
  code repositories. However, existing methods often overlook the need for
  repository-level code understanding, which is crucial for accurately
  grasping the broader context and developing effective solutions. On this
  basis, we present RepoGraph, a plug-in module that manages a
  repository-level structure
ingested_at: 2026-09-19
brief: >-
  Giving an LLM a line-level dependency graph of the repository, rather than
  file-level retrieval, improves issue localization and resolve rates for both
  agent and procedural SWE frameworks. RepoGraph parses every Python file with
  tree-sitter into an AST, keeps only function/class definition and reference
  lines, filters out builtin and third-party calls, and builds a graph with
  "contain" and "invoke" edges; a k-hop ego-graph around a search term is
  flattened into the prompt or exposed to agents as a search_repograph action.


  It was plugged into 4 open-source systems on SWE-bench-Lite: RAG and
  Agentless (procedural), AutoCodeRover and SWE-agent (agent), on GPT-4 and
  GPT-4o. Resolve rate rose 2.67 to 5.33 for RAG, 27.33 to 29.67 for
  Agentless, 19.00 to 21.33 for AutoCodeRover, 18.33 to 20.33 for SWE-agent,
  an average relative gain of 32.8%. File-level localization accuracy improved
  more (+4.4 to +5.6) than line-level (+1.6 to +2.7). On 2,665 Python
  CrossCodeEval samples, GPT-4o exact match went 10.5 to 28.7.


  Gains are measured against each baseline's own configuration, so the
  ablation is clean per system, but cost is not matched: tokens rise in every
  case (SWE-agent 498,346 to 518,792). A variant sweep shows 2-hop flattened
  graphs drop resolve rate to 26.00, below baseline, so the benefit is
  sensitive to retrieval depth.


  Only Python was tested, and contextual misalignment remains the dominant
  error type. Worth adopting if your pipeline already does file-level
  localization.
