summary: Large Language Models (LLMs) excel in code generation yet struggle
  with modern AI software engineering tasks. Unlike traditional function-level
  or file-level coding tasks, AI software engineering requires not only basic
  coding proficiency but also advanced skills in managing and interacting with
  code repositories. However, existing methods often overlook the need for
  repository-level code understanding, which is crucial for accurately
  grasping the broader context and developing effective solutions. On this
  basis, we present RepoGraph, a plug-in module that manages a
  repository-level structure
ingested_at: 2026-09-19
brief: >-
  Giving an LLM a line-level dependency graph of a repository, rather than
  file-level retrieval, improves issue localization more than it improves
  final patch correctness. RepoGraph parses a repo with tree-sitter into an
  AST-derived graph where nodes are code lines tagged as definitions or
  references and edges are "invoke" and "contain" relations, then retrieves
  k-hop ego-graphs around a search term. It was plugged into 4 SWE-bench-Lite
  systems: RAG and Agentless (procedural), SWE-agent and AutoCodeRover
  (agent), on GPT-4 and GPT-4o.


  Resolve rate rose in all 4 cases: RAG 2.67 to 5.33, Agentless 27.33 to
  29.67, AutoCodeRover 19.00 to 21.33, SWE-agent 18.33 to 20.33, an average
  relative gain of 32.8%. Localization gains were larger at file level (+4.4
  to +5.6) than line level (+1.6 to +2.7). On 2,665 Python CrossCodeEval
  samples, GPT-4o code-match EM went 10.5 to 28.7.


  Evidence is measured with matched baseline configurations, plus an ablation
  over retrieval hop count and summarization: 2-hop flattened context dropped
  resolve rate to 26.00%, below baseline, so more graph context is not
  monotonically better. Costs rose with the plug-in ($0.34 to $0.39 for
  Agentless; +$0.18 for SWE-agent), and no token-matched control baseline is
  reported. Only SWE-bench-Lite, Python, and 3 proprietary-plus-1-open LLM
  backbones were tested.


  If you build repo agents, expect structural context to fix where to look
  more than what to write.
