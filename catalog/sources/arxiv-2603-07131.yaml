summary: >-
  Large Vision Language Models (LVLMs) show immense potential for automated
  ophthalmic diagnosis. However, their clinical deployment is severely
  hindered by lacking domain-specific knowledge. In this work, we identify
  two structural deficiencies hindering reliable medical reasoning: 1) the
  Perception Gap, where general-purpose visual encoders fail to resolve
  fine-grained pathological cues (e.g., microaneurysms); and 2) the
  Reasoning Gap, where sparse visual evidence is progressively overridden by
