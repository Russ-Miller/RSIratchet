summary: Despite remarkable progress in Vision-Language-Action models (VLAs)
  for robot manipulation, these large pre-trained models require fine-tuning
  to be deployed in specific environments. These fine-tuned models are highly
  sensitive to camera viewpoint changes that frequently occur in unstructured
  environments. In this paper, we propose a zero-shot camera adaptation
  framework without additional demonstration data, policy fine-tuning, or
  architectural modification. Our key idea is to virtually adjust test-time
  camera observations to match the training camera configuration in real-time.
