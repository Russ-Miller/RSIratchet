brief: >-
  Fixing a fine-tuned VLA's viewpoint brittleness can be done entirely at the
  input, by synthesizing the training camera's view from the test camera at
  each control step, with the policy frozen.


  AnyCamVLA plugs a feed-forward novel view synthesis model (LVSM, 171M
  parameters) in front of OpenVLA-OFT and pi 0.5 on LIBERO, perturbing either
  the agent or wrist camera at 3 levels, plus a real Franka setup with 4 tasks
  and 20 demos each.


  On agent-camera perturbation across all LIBERO suites, pi 0.5 falls from
  92.4% to 39.9% at large shifts; Ours-pi averages 94.5% versus 87.2% for
  viewpoint-augmented fine-tuning and 86.1% for GeoAwareVLA. On wrist-camera
  perturbation on LIBERO-Long, GeoAwareVLA collapses below 10% (5.2% average)
  while Ours-pi reaches 88.6%, near the 92.4% original-view ceiling. Latency
  is 36.55 ms for 2 views at 256x256 on an RTX 4090.


  Measured, with an ablation isolating the synthesis choice: homography scores
  31.7%, ground-truth-depth reprojection 81.1%, and pre-trained LVSM without
  simulation fine-tuning only 33.2%, so the simulation result depends on a
  domain-adaptation step on 491 rendered scenes.


  Boundaries: the real-world comparison is 10 rollouts per task against 1 base
  policy, handheld-camera results are qualitative only, calibrated camera
  parameters are assumed, and synthesis fails with single source views or
  heavy occlusion.


  If you are paying for viewpoint-augmented VLA fine-tuning, an input-side
  view adapter is the cheaper comparison to beat.
