summary: >-
  Large Language Models (LLMs) have recently demonstrated strong
  capabilities in automated travel itinerary generation. However, real-
  world travel planning is inherently uncertain: transportation delays,
  crowd fluctuations, and unexpected stochastic delays frequently inval-
  idate otherwise feasible schedules. Existing benchmarks like TravelPlanner
  and TripCraft assume deterministic environments, evaluating only static
  constraint satisfaction and ignoring whether generated plans remain robust
  when such uncertainties arise. To address this limitation, we introduce
  UTP-Bench1 , a large-scale bench
