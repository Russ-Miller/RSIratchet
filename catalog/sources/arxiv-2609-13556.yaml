summary: >-
  Large Language Models (LLMs) have shown remarkable proficiency on
  general-purpose tasks, yet their performance often degrades in
  highly-specialized technical domains. Moreover, little is known about how
  parametric knowledge of domain-specific terms is encoded within these
  models. We address this gap by contributing two novel medical jargon
  evaluation benchmarks and evaluate a general-purpose Llama-3.1 model
  against a variant fine-tuned on medical-domain data. Surprisingly, the
  general-purpose model outperforms the medically fine-tuned model on both
  tasks. Using mechanistic interpretability too
