summary: >-
  Large vision-language models (LVLMs) often hallucinate, generating content
  that the input image does not support. Preventing such content during
  decoding calls for a candidate-specific measure of how strongly the image
  supports the token under consideration. The model's visual-token states
  offer a natural source of this evidence because projecting each state
  through the output head reveals which vocabulary items that position
  favors. These position-wise readouts cannot be pooled directly because
  their probability magnitudes are not comparable across visual positions.
