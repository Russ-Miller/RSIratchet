brief: >-
  Video world models used as RL simulators collapse under small visual
  perturbations of the initial state, and two fixes — style augmentation
  constrained by depth/segmentation priors, and training on the model's own
  predicted latents — reduce that collapse and raise downstream policy
  success.


  Sword uses Wan 2.2 TI2V as a diffusion-transformer backbone, 4 context
  frames predicting 8 future frames, trained on 1,600 LIBERO-Spatial rollout
  episodes of 512 frames each (1,500 train / 100 eval). Style augmentation
  comes from Cosmos-Transfer 2.5 with DepthAnything, GroundingDINO and SAM2
  priors. Dynamic Latent Bootstrapping caches predicted latents in VAE space,
  cutting context storage from hundreds of GB to under 20 GB.


  Against WoVR on clean LIBERO, FVD drops 61.26 to 35.61; on the 1:1 raw+OOD
  mixture, FID drops 119.62 to 32.59 and FVD 198.84 to 111.19. GRPO
  post-training of OpenVLA-OFT reaches 61.72% success at step 172 versus
  53.12% for WoVR.


  Evidence is measured, with a DLB ablation (mixed FVD 110.71 to 86.84) and an
  8-way full-factorial cache design sweep, so DLB's contribution is isolated.
  The style-augmentation component is not ablated separately, and the OOD test
  set is generated by the same augmentation pipeline used in training, which
  weakens the generalization claim.


  Only 1 baseline, 1 backbone, 1 benchmark suite (LIBERO-Spatial), and no
  real-robot transfer.


  Treat this as evidence that exposure-bias fixes matter for simulator
  fidelity, not as a settled generalization result.
