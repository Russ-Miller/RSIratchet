summary: >-
  The reliability of Large Language Models (LLMs) for API calling degrades
  in multilingual settings. A common failure occurs when a model selects the
  correct tool but generates argument values in an inconsistent language,
  which we term Argument Language Mismatch (ALM). Although semantically
  correct, such outputs are operationally invalid and not captured by
  standard API-calling metrics. We revisit post-training strategies for
  mitigating ALM and find that, in our benchmark, supervised fine-tuning
  (SFT) provides a strong baseline, substantially improving argument
  language consistency and end-to-en
