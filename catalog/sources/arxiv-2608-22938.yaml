brief: >-
  Keeping an LLM judge blind to execution results beats letting it see them,
  when reranking sampled Verilog candidates. Exposing test outcomes anchors
  the reasoner on them and costs accuracy.


  EAHC reranks 10 samples per problem from 9 generators (GPT-5, DeepSeek-V3,
  GLM-4.6, Qwen2.5-Coder, OpenCoder, Seed-Coder, HaVen, VeriPrefer, CodeV-R1)
  on VerilogEval-v2 (156 problems) and ResBench (56 problems). A Qwen3-4B
  judge fine-tuned on 47K compiler-verified traces scores candidates; a RAG
  testbench generator over a 53K corpus supplies execution vectors; candidates
  with identical execution vectors get one shared score.


  Average Pass@1 rises from 53.99% to 65.10% on VerilogEval-v2 and 53.18% to
  68.25% on ResBench, +5.91% and +4.96% over CodeT-GPT, first in 15 of 18
  configurations. Independent fusion beats interactive fusion on every model
  (+4.49% and +4.56%). Judge scores disagree on 15.3% and 27.4% of
  execution-equivalent pairs, and on 5.2% and 16.4% of byte-identical pairs.


  Ablations isolate both channels (+7.12% and +5.75%), and interactive vs
  independent differs only in the prompt with the same checkpoint, so no
  training-level comparison. CodeT-GPT still wins on 3 strong-generator
  configurations. Generated testbenches show 12.8% and 6.6% false-accept
  rates.


  If you rerank with a judge, do not feed it test results.
