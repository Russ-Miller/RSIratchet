brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The usual prompt-engineering advice to assign an expert
  persona gets no support here.


  The test covered 6 models on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice items spanning science, engineering, and law. Three prompt
  conditions were compared against a no-persona baseline: in-domain expert
  personas ("you are a physics expert" on physics problems), domain-mismatched
  expert personas (physics expert on law problems), and low-knowledge personas
  (layperson, young child, toddler).


  In-domain expert personas had no significant effect on accuracy, with Gemini
  2.0 Flash the one exception. Mismatched expert personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas were
  generally harmful to accuracy.


  The effect was measured against a matched no-persona baseline across 2
  benchmarks and 6 models, which is the right comparison for the claim. The
  source text gives no per-model numbers, confidence intervals, or sample
  sizes, so the size of the null is not visible here.


  The scope is factual accuracy on multiple-choice questions only. Nothing is
  said about open-ended generation, tone, style, refusal behaviour, or agentic
  tasks, where personas may still do work.


  If you are adding expert personas to system prompts hoping for better
  answers, this suggests you are spending tokens for nothing.
