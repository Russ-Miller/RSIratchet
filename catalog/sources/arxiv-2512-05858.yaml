brief: >-
  Telling a model it is a physics expert does not make it answer physics
  questions better. Expert personas showed no consistent gain over a plain
  no-persona baseline on hard objective multiple-choice questions.


  The setup: six models prompted on GPQA Diamond and MMLU-Pro, graduate-level
  questions across science, engineering, and law. Three persona conditions
  were compared against no persona: in-domain expert (physics expert on
  physics problems), off-domain expert (physics expert on law problems), and
  low-knowledge personas (layperson, young child, toddler).


  In-domain expert personas had no significant impact on accuracy, with Gemini
  2.0 Flash the one exception. Domain-mismatched expert personas produced
  marginal differences and sometimes degraded performance. Low-knowledge
  personas were generally harmful to accuracy.


  The effect is measured, with a matched no-persona baseline and a deliberate
  contrast between matched and mismatched expertise, which isolates whether
  the content of the persona matters rather than the mere presence of a role
  instruction. The source reports no accuracy figures or significance tests
  here, so the size of the null is not quantifiable from what is given.


  The scope is factual accuracy on multiple-choice items only. Nothing is said
  about open-ended generation, tone, style, or agentic tasks, where personas
  may still do work.


  Stop spending prompt tokens on expert role-play when you want correct
  answers.
