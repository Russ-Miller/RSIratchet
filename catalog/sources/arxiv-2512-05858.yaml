brief: >-
  Telling a model it is a physics expert does not make it better at physics
  questions. Persona prompts, a staple of prompt-engineering advice, produce
  no consistent accuracy gain on hard objective questions.


  The test covers 6 models on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice items spanning science, engineering, and law, compared
  against a no-persona baseline. Three persona conditions were run: in-domain
  experts matched to the question type, off-domain experts deliberately
  mismatched (a physics expert answering law problems), and low-knowledge
  personas (layperson, young child, toddler).


  In-domain expert personas had no significant impact on accuracy, with Gemini
  2.0 Flash the single exception. Domain-mismatched personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas were
  generally harmful to accuracy.


  The effect was measured against a matched no-persona baseline across 2
  benchmarks and 6 models, which is the right comparison; the report is a
  short applied-testing note, and the source given here reports directions
  rather than effect sizes, so magnitudes cannot be checked.


  The claim is about factual accuracy on multiple-choice items only. Nothing
  here speaks to open-ended generation, reasoning traces, or the tone and
  style effects personas are often actually used for.


  If you are adding expert personas to improve correctness, drop them.
