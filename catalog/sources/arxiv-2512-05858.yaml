brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  factual questions. The widespread prompting advice to assign expert personas
  gets no support here.


  Six models were tested on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions spanning science, engineering, and law, under
  three persona conditions: in-domain expert ("you are a physics expert" on
  physics items), off-domain expert (physics expert on law items), and
  low-knowledge personas (layperson, young child, toddler), each against a
  no-persona baseline.


  In-domain expert personas had no significant effect on accuracy, with Gemini
  2.0 Flash the one exception. Domain-mismatched personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas were
  generally harmful to accuracy.


  The effect was measured against a matched no-persona baseline on the same
  items, which isolates the persona string as the only varied factor. The
  source text reports no per-model accuracy figures, so the size of the null
  is not quantifiable from what is given; the number of persona phrasings per
  condition is also unstated.


  Scope is objective multiple-choice accuracy only. It says nothing about
  open-ended generation, tone, style, or tasks where a persona shapes format
  rather than correctness.


  If you are adding expert personas to boost correctness, drop them and spend
  the prompt budget elsewhere.
