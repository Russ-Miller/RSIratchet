summary: Compares in-domain and mismatched expert personas with no-persona
  baselines on GPQA Diamond and MMLU-Pro across six models. Expert roles
  generally did not improve factual accuracy; results varied by model, and
  mismatched roles could degrade it. The authors note personas may still
  affect tone.
ingested_at: 2026-11-09
brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The common advice to open prompts with "you are a
  physics expert" has no consistent payoff.


  The test covered 6 models on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice items spanning science, engineering, and law. Three persona
  conditions were compared against a no-persona baseline: in-domain expert
  personas, domain-mismatched expert personas (a physics expert answering law
  questions), and low-knowledge personas (layperson, young child, toddler).


  In-domain expert personas had no significant impact on accuracy, with Gemini
  2.0 Flash the single exception. Domain-mismatched personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas
  generally hurt accuracy.


  The effect is measured against a matched no-persona baseline across 2
  benchmarks and 6 models, which is the right comparison for the claim. The
  source gives no accuracy numbers, confidence intervals, or per-model
  breakdowns here, so the size of the Gemini exception and of the
  low-knowledge degradation cannot be checked from the report text alone.


  The scope is factual accuracy on multiple-choice items only. Nothing here
  speaks to personas for tone, style, refusal behaviour, open-ended writing,
  or agentic tasks.


  Drop expert personas from accuracy-critical prompts, and keep them only
  where you want a particular voice.
