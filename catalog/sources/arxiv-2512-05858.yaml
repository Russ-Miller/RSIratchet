brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The widely repeated prompting advice to assign an
  expert persona has no consistent payoff for factual correctness.


  The test covered 6 models on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions across science, engineering, and law. Three
  conditions were compared against a no-persona baseline: in-domain expert
  personas matched to the question type, off-domain expert personas
  deliberately mismatched (a physics expert answering law questions), and
  low-knowledge personas such as layperson, young child, and toddler.


  In-domain experts produced no significant change, with Gemini 2.0 Flash the
  sole exception. Mismatched experts gave marginal differences and sometimes
  degraded accuracy. Low-knowledge personas were generally harmful. The report
  gives no aggregate effect sizes in the text here.


  The effect is measured against a direct no-persona control on 2 benchmarks
  and 6 models, which isolates the persona instruction itself. Significance
  testing is mentioned but figures are not reported in this summary.


  The scope is accuracy on multiple-choice items only. Nothing is claimed
  about open-ended generation, reasoning traces, tone, or style, where
  personas may still matter.


  Treat expert personas as a stylistic control, not an accuracy lever.
