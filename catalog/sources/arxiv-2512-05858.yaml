brief: >-
  Telling a model it is a physics expert does not make it answer physics
  questions better. Persona prompts, the most widely repeated piece of prompt
  folklore, show no consistent accuracy benefit on hard objective questions.


  The setup: 6 models evaluated on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions spanning science, engineering, and law, against a
  no-persona baseline. Three conditions were tested: in-domain expert personas
  matched to the question type, off-domain expert personas deliberately
  mismatched (a physics expert answering law questions), and low-knowledge
  personas such as layperson, young child, and toddler.


  In-domain expert personas had no significant effect, with Gemini 2.0 Flash
  the single exception. Domain-mismatched personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas were
  generally harmful to accuracy.


  The effect is measured against an explicit no-persona control across 2
  benchmarks and 6 models, which is the right comparison; the source reports
  direction and significance rather than per-model point estimates, so effect
  sizes are not available here.


  The boundary is stated by the authors: this concerns answer accuracy on
  objective multiple-choice items only. Personas may still change tone, style,
  or usability, and open-ended or subjective tasks were not tested.


  If you are spending prompt tokens on expert framing to improve factual
  correctness, you can stop.
