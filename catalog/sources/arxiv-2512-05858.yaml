summary: Compares in-domain and mismatched expert personas with no-persona
  baselines on GPQA Diamond and MMLU-Pro across six models. Expert roles
  generally did not improve factual accuracy; results varied by model, and
  mismatched roles could degrade it. The authors note personas may still
  affect tone.
ingested_at: 2026-11-09
brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  factual questions. The widely repeated advice to open prompts with "you are
  a physics expert" gets no support here.


  The setup is 6 models evaluated on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions across science, engineering, and law, under 3
  persona conditions plus a no-persona baseline: in-domain expert,
  domain-mismatched expert (a physics expert persona on law problems), and
  low-knowledge personas (layperson, young child, toddler).


  In-domain expert personas had no significant effect on accuracy, with Gemini
  2.0 Flash the single exception. Domain-mismatched personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas
  generally reduced accuracy.


  The effect is measured against a matched no-persona baseline on the same
  items, which isolates the persona string as the only varied factor. The
  source reports no effect sizes or per-model accuracy numbers in the text
  given here, so the size of the degradation from low-knowledge personas
  cannot be judged from this summary alone.


  The scope is objective multiple-choice accuracy only. Nothing here speaks to
  tone, style, refusal behaviour, open-ended generation, or agentic tasks,
  where personas may still do work.


  Drop expert personas from accuracy-critical prompts; keep them only if you
  want them for voice.
