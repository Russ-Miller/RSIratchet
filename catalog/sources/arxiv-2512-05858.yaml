brief: >-
  Telling a model it is a physics expert does not make it better at physics
  questions. Persona prompts are close to inert for factual accuracy, and
  negative personas actively hurt.


  The setup: 6 models evaluated on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions spanning science, engineering, and law, compared
  against a no-persona baseline. Three conditions were tested: in-domain
  expert personas matched to the question type, off-domain expert personas
  deliberately mismatched (a physics expert answering law questions), and
  low-knowledge personas such as layperson, young child, and toddler.


  In-domain experts produced no significant change, with Gemini 2.0 Flash the
  single exception. Domain-mismatched experts produced marginal differences
  and sometimes degraded accuracy. Low-knowledge personas were generally
  harmful. The report does not give per-model accuracy figures in the text
  available here, so the results are stated qualitatively.


  The comparison is a direct matched baseline with no persona, across 2
  benchmarks and 6 models, which isolates the persona string as the only
  varied element. No reasoning-trace analysis or prompt-sensitivity sweep
  beyond the persona wording is described.


  The scope is accuracy on objective multiple-choice items only. Personas may
  still change tone, style, or audience fit, none of which was measured here,
  and open-ended generation was not tested.


  If you are adding expert personas to system prompts expecting a correctness
  gain, drop them.
