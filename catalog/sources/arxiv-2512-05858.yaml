summary: Compares in-domain and mismatched expert personas with no-persona
  baselines on GPQA Diamond and MMLU-Pro across six models. Expert roles
  generally did not improve factual accuracy; results varied by model, and
  mismatched roles could degrade it. The authors note personas may still
  affect tone.
ingested_at: 2026-11-09
brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The widely repeated prompting advice of assigning an
  expert persona has no consistent payoff for factual correctness.


  The test covered 6 models on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions spanning science, engineering, and law, against a
  no-persona baseline. Three persona conditions were compared: in-domain
  experts ("you are a physics expert" on physics problems), off-domain experts
  (a physics expert on law problems), and low-knowledge personas (layperson,
  young child, toddler).


  In-domain expert personas had no significant impact on accuracy, with Gemini
  2.0 Flash the one exception. Domain-mismatched personas produced marginal
  differences and sometimes degraded performance. Low-knowledge personas were
  generally harmful to accuracy.


  The effect is measured, with a matched no-persona baseline and a clean
  contrast between matched and mismatched expertise, which isolates the
  persona rather than the extra instruction length. The report gives no
  per-model accuracy figures in this summary, so effect sizes cannot be judged
  here.


  The claim is limited to accuracy on multiple-choice factual questions.
  Nothing is said about open-ended generation, tone, style, or safety
  behavior, where personas may still matter.


  Treat persona prompts as a stylistic control, not an accuracy lever.
