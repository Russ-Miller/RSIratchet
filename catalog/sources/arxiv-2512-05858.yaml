brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The common prompting advice to assign an expert persona
  gets no support here.


  The test covers 6 models on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions in science, engineering, and law, compared against
  a no-persona baseline. Three persona conditions were run: in-domain experts
  matched to the question type, off-domain experts deliberately mismatched (a
  physics expert answering law questions), and low-knowledge personas such as
  layperson, young child, and toddler.


  In-domain expert personas had no significant effect on accuracy, with Gemini
  2.0 Flash as the single exception. Domain-mismatched experts produced
  marginal differences and sometimes degraded performance. Low-knowledge
  personas were generally harmful to accuracy.


  The effect was measured against a matched no-persona baseline across both
  benchmarks and all 6 models, which is the right comparison for the claim.
  The source text reports no per-model accuracy numbers, so the size of the
  null is not visible here.


  The scope is factual accuracy on multiple-choice items only. Personas may
  still change tone, style, or suitability for other tasks, none of which was
  tested.


  If you are adding expert personas to prompts expecting better answers, drop
  them.
