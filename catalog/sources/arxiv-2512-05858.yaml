summary: Compares in-domain and mismatched expert personas with no-persona
  baselines on GPQA Diamond and MMLU-Pro across six models. Expert roles
  generally did not improve factual accuracy; results varied by model, and
  mismatched roles could degrade it. The authors note personas may still
  affect tone.
