title: 'Prompting Science Report 4: Playing Pretend: Expert Personas Don’t Improve Factual Accuracy'
year: 2025
date: '2025-12-05'
arxiv_id: '2512.05858'
url: https://arxiv.org/abs/2512.05858
tags: [prompting, persona, factual-accuracy]
summary: >-
  Compares in-domain and mismatched expert personas with no-persona baselines
  on GPQA Diamond and MMLU-Pro across six models. Expert roles generally did
  not improve factual accuracy; results varied by model, and mismatched roles
  could degrade it. The authors note personas may still affect tone.
