brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The common prompt-engineering advice to assign an
  expert persona gets no support here on factual accuracy.


  The fourth report in a series tested 6 models on GPQA Diamond and MMLU-Pro,
  graduate-level multiple-choice questions spanning science, engineering, and
  law, against a no-persona baseline. Three conditions: in-domain expert
  personas ("you are a physics expert" on physics items), domain-mismatched
  expert personas (physics expert on law items), and low-knowledge personas
  (layperson, young child, toddler).


  In-domain expert personas had no significant impact, with Gemini 2.0 Flash
  the one exception. Mismatched personas produced marginal differences and
  sometimes degraded performance. Low-knowledge personas were generally
  harmful to accuracy.


  The effect is measured, with a matched no-persona baseline and systematic
  variation of persona type across 2 benchmarks and 6 models, which isolates
  the persona manipulation. The source gives no per-model accuracy figures, so
  the size of any effect is not visible here.


  The scope is answer accuracy on multiple-choice items only. It says nothing
  about personas for tone, style, refusal behavior, open-ended generation, or
  agentic tasks.


  If you are adding expert personas to prompts expecting better factual
  answers, drop them and spend the tokens elsewhere.
