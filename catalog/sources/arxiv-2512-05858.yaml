brief: >-
  Telling a model it is a domain expert does not make it more accurate on hard
  objective questions. The upside widely assumed for persona prompting does
  not appear; the downside from low-knowledge personas does.


  The setup: 6 models evaluated on GPQA Diamond and MMLU-Pro, graduate-level
  multiple-choice questions spanning science, engineering, and law, under 3
  persona conditions plus a no-persona baseline.


  In-domain expert personas ("you are a physics expert" on physics problems)
  had no significant effect, with Gemini 2.0 Flash the one exception.
  Domain-mismatched expert personas (physics expert on law problems) produced
  marginal differences and sometimes degraded performance. Low-knowledge
  personas (layperson, young child, toddler) generally reduced accuracy.


  The effect is measured against a matched no-persona baseline across 2
  benchmarks and 6 models, which is the right comparison for the claim being
  made. The source reports directions and significance rather than per-model
  accuracy numbers, so the size of the degradation is not recoverable here.


  The scope is accuracy on objective multiple-choice items only. Nothing is
  said about open-ended generation, tone, style, refusal behavior, or tasks
  where a persona changes what kind of answer is wanted.


  If you are adding expert personas to prompts to raise factual correctness,
  drop them and test the plain prompt.
