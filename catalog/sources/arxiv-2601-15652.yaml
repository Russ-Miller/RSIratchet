brief: >-
  Checking whether a model's reasoning traces agree with each other does not
  detect hallucination. In PCIB, a hallucination detector built from 4
  interpretable signals, the Rationalization signal (Jaccard overlap across M
  generated reasoning traces) failed to separate hallucinated from factual
  answers, which the authors attribute to models generating coherent
  explanations for false premises.


  The setup: (Q, C, A) triples from a 200-example subset of HaluBench,
  balanced 50% hallucination / 50% factual. Signals are Uptake (KL between
  answer likelihood with and without context), Stress (JS divergence of
  entailment probabilities under paraphrase), Conflict (NLI contradiction),
  and Rationalization, fed to small classifiers (<1M parameters).


  The unsupervised theory-guided aggregation reaches 0.8017 AUROC; supervised
  BASE features reach 0.8274; adding 3 engineered features (Entity-Focused
  Uptake, Context Adherence, Falsifiability) lifts a Random Forest to 0.8669
  (+4.95%). Reported inference is 5ms vs 5s for Lynx, trained on 200 vs 15,000
  samples.


  Evidence is thin. n=200, no held-out split described, no confidence
  intervals, and the Lynx/GPT-4o comparison mixes accuracy on 15K samples
  against AUROC on 200 — not a like-for-like baseline. The BASE/IMPROVED
  ablation is the one clean comparison.


  Untested on multilingual data, summarization, or extrinsic hallucination.
  Treat the Rationalization negative as a hypothesis worth replicating, not a
  settled result.
