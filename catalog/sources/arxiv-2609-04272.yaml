summary: >-
  This study examines the ability of large language models (LLMs) to predict
  the risk of weather-related forced outages in the distribution grid in a
  zero-shot framework, without labeled training data. The problem is
  formulated as a binary severity classification task across three forecast
  horizons (3h, 6h, 12h), using six years of outage records and
  high-resolution weather data for a utility service area in central Texas.
