  predict the risk of weather-related forced outages in the distribution grid
  in a zero-shot framework, without labeled training data. The problem is
  formulated as a binary severity classification task across three forecast
  horizons (3h, 6h, 12h), using six years of outage records and
  high-resolution weather data for a utility service area in central Texas.
  Four zero-shot LLMs are benchmarked against two supervised classifiers
  across two input configurations: one using current weather observations and
