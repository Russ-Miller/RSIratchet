brief: >-
  Zero-shot GPT models reading raw weather features lose to small supervised
  classifiers on a rare-event grid outage task, and the gap is mostly
  precision.


  The task is binary high/low severity classification of weather-driven forced
  outages in a central Texas utility service area over 6 years (2018-2023), at
  3h, 6h and 12h horizons, with thresholds set to a ~5% positive rate. GPT-4o,
  GPT-4o-mini, GPT-4.1 and GPT-4.1-mini get an identical prompt with either
  full-window forecast weather or current observations only; LightGBM and
  Logistic Regression are trained with Leave-One-Year-Out cross-validation on
  the same held-out years.


  With forecast, LightGBM reaches macro-F1 0.74 at 3h and 0.67 at 12h; the
  best LLM is 0.61-0.63, a gap of 0.04 to 0.13. GPT-4o-mini collapses into
  near-constant positive prediction (recall 0.78-0.97, precision 0.05-0.07).
  Adding forecast weather helps ML consistently (+0.06, +9.8% for LightGBM at
  12h) but barely moves GPT-4.1-mini (+0.00 at 3h).


  Evidence: measured, same folds for both paradigms, with a
  weather-versus-outage causality check (Granger F = 2,853 at lag 1h). But 1
  utility, 1 model family, no prompt tuning, no threshold calibration, no
  in-context examples, and the interpretability claim is argued from sample
  rationales, not tested with operators.


  Treat zero-shot LLMs here as a cheap fallback where labels are absent, not a
  replacement.
