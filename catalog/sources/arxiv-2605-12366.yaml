brief: >-
  Language models used as transcript monitors miss dangerous agent actions far
  more often when the same action sits inside a long transcript, so monitor
  evaluations run on short transcripts overstate real recall.


  Opus 4.6, GPT 5.4 Thinking, and Gemini 3.1 Pro were given coding-agent
  transcripts and asked to flag malicious actions. Two constructions: 148
  MonitorBench transcripts (5k–16k tokens, agent covertly disables a firewall)
  padded with benign Claude Code sessions, and blatant data-exfiltration
  "needles" injected into 80 real Claude Code transcripts spanning 5k–1M
  tokens.


  All 3 models missed attacks 2x to 30x more often after 800K tokens of benign
  context. Opus 4.6 with thinking fell from 98.6% to 88% recall on padded
  MonitorBench, and from 99.7% at 100K to 69% at 800K on the needle task.
  Non-thinking Opus dropped to 5% detection with 500K before and 100K after.
  Detection is worst mid-transcript. Reminders inserted between tool calls
  (<3% token overhead) helped on needles but not on subtle MonitorBench
  attacks; incremental monitoring and more reasoning also helped. Fine-tuning
  GPT-4.1 improved in-distribution needle AUC but failed to transfer, and
  combining proxy datasets fell below baseline.


  Measured, with Wilson intervals, McNemar tests, and paired comparisons;
  false positives verified below 2%. The authors note recall gains could
  partly reflect calibration shifts, and only localized single-step attacks
  were tested.


  Treat short-transcript monitor benchmarks as upper bounds.
