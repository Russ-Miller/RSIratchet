summary: >-
  Agentic AI systems built on large language models can plan over multiple
  steps, use external tools, retain information in memory, and coordinate
  with other agents. These capabilities make them more useful than static
  language models, but they also introduce new security and operational
  risks. Untrusted content from websites, emails, documents, and databases
  can enter the same context as system instructions; persistent memory can
