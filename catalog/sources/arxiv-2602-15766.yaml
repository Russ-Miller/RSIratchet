summary: >-
  Large Audio Language Models struggle to disentangle overlapping events in
  complex acoustic scenes, yielding temporally inconsistent captions and
  frequent hallucinations. We introduce Timestamped Audio Captioner (TAC), a
  model that produces temporally grounded audio descriptions at varying
  degrees of detail and resolution. TAC is trained with a synthetic data
  pipeline that constructs challenging and dynamic mixtures from real-world
