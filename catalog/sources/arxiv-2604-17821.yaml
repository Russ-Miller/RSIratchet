  autonomous web agents to execute natural language instructions directly on
  real-world webpages. However, existing agents often struggle with complex
  tasks involving dynamic interactions and long-horizon execution due to rigid
  planning strategies and hallucination-prone reasoning. To address these
  limitations, we propose WebUncertainty, a novel autonomous agent framework
  designed to tackle dual-level uncertainty in planning and reasoning.
