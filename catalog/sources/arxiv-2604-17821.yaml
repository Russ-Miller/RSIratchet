brief: >-
  Asking a web agent to self-report confidence over several candidate actions,
  then splitting that into "low overall confidence" (epistemic) and "confident
  but split" (aleatoric) signals, is enough to steer an MCTS search better
  than standard MCTS reward alone. WebUncertainty also lets an analysis agent
  score task uncertainty and switch between explicit one-shot decomposition
  and implicit step-by-step planning.


  The system is evaluated on WebArena (812 tasks, text-only accessibility
  trees) and a curated 129-task WebVoyager subset across 13 live sites,
  against Browser Use, Agent-E, WebPilot and AgentOccam, each run on both
  GPT-4-Turbo and Qwen-Max.


  Success rate reaches 46.9% on WebArena with GPT-4-Turbo against AgentOccam's
  43.1% and WebPilot's 37.6%, and 65.9% vs 64.3% on WebVoyager. On Qwen-Max
  the WebVoyager gap is larger (63.6% vs 58.9%), and average time per task is
  351.4s vs WebPilot's 803.7s.


  Ablations isolate the two mechanisms on Qwen-Max: removing ConActU costs
  9.3% on WebVoyager and 3.4% on WebArena, more than freezing the planner to
  explicit-only (39.2%) or implicit-only (38.2%). Sensitivity over δ and τ is
  reported. There is no matched-token-budget baseline, and confidence scores
  are self-reported by the LLM rather than taken from logits.


  Gains over AgentOccam on GPT-4-Turbo are small (3.8 and 1.6 points), the
  Qwen-Max WebArena multisite split is worse than baselines (10.4%), and the
  setup is text-only so visually encoded pages are untested.


  If you run tree-search web agents, the uncertainty split is the component
  worth copying.
