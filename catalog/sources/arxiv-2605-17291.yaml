summary: >-
  Reinforcement Learning with Verifiable Rewards (RLVR) is widely used to
  improve reasoning in large language models, but rewards only final-answer
  correctness with no supervision over intermediate steps. Rubric-based
  methods such as Rubrics as Rewards (RaR) introduce finer-grained
  supervision by scoring rollouts against structured criteria, yet the
  rubric scores are still aggregated into a single scalar applied to the
  entire response, causing three weaknesses: loss of multi-criterion
  structure, uniform supervision of correct and incorrect steps, and reward
  hacking through unbounded self-correct
