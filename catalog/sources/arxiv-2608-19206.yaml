summary: >-
  Contemporary Large Language Models (LLMs) are increasingly aligned to
  suppress hallucinations, prioritizing factual retrieval over combinatorial
  creativity. While crucial for mitigating misinformation, this alignment
  may also restrict speculative Research and Development (R&D) by
  encouraging what this work operationally treats as semantic overfitting
  and diversity collapse. In this paper, we propose a Rust-based multi-agent
  orchestration that uses the contrast between narrative daydreaming and
  executive control as a functional analogy, not as a neurocognitive claim.
