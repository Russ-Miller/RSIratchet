summary: "Recent large language models (LLMs) have demonstrated strong
  capabilities in understanding and generating code, from competitive
  programming to repository-level software engineering. In emerging agentic
  systems, code is no longer only a target output. It increasingly serves as
  an operational substrate for agent reasoning, acting, environment modeling,
  and execution-based verification. We frame this shift through the lens of
  agent harnesses and introduce code as agent harness: a unified view that
  centers code as the basis for agent infrastructure. To systematically study
  this perspective, we organize the survey around three connected layers.
