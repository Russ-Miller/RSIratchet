summary: >-
  Large Language Models (LLMs) have achieved impressive performance in
  natural language-to-code generation; however, their ability to follow
  structured algorithmic reasoning remains insufficiently understood. We
  introduce Pseudo2Code, a benchmark designed to systematically evaluate the
  impact of structured pseudocode on code generation quality and algorithmic
  faithfulness. The benchmark consists of 300 manually validated real-world
  programming tasks spanning multiple domains and three difficulty levels
