summary: >-
  What if the twelve jurors of Sidney Lumet's 12 Angry Men (1957) were not
  men, but large language models? Would the one juror who disagrees still be
  able to change everyone's mind? This paper instantiates that scenario as a
  multi-agent benchmark for LLM deliberation: twelve agents, each
  conditioned on a film-faithful persona, debate the film's murder case
  using multi-agent framework. Two models representing opposite ends of the
  RLHF spectrum are tested: GPT-4o (closed-source, heavy alignment) and
  Llama-4-Scout (open-weight, lighter alignment), across three conditions
  (baseline, open-minded prom
