summary: >-
  Multimodal large language models (MLLMs) have shown strong potential for
  image quality assessment (IQA) by improving consistency between quality
  ratings and their underlying reasoning. However, most approaches supervise
  reasoning through human-provided ratings and rarely examine whether it
  faithfully reflects image quality. Rating accuracy alone does not ensure
  faithful reasoning; a shared reward also obscures supervision sources and
  may reinforce unfaithful reasoning when a correct rating occurs by chance.
