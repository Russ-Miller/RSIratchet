  data collected from non-traditional sources such as consumer transactions,
  web traffic, and prediction markets - can provide timely signals about
  firms' operating activities and broader market conditions. These signals
  may reveal information that is not captured by traditional public sources
  and can therefore provide complementary information for forecasting firms'
  future financial performance. However, firm-level alternative data often
  have limited historical coverage, are relevant only to specific prediction
