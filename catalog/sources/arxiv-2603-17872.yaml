brief: >-
  Tiered retrieval with claim-level verification helps a small model most
  where facts are narrow and time-bound, and barely at all where the model
  already knows the answer. The gain is not uniform across hallucination
  types.


  The pipeline is a 4-phase LangGraph graph: intrinsic verification with early
  exit, a domain detector routing to trusted archives before general web
  search via Tavily, document grading to filter distractors, and regeneration
  with atomic-claim scoring, falling back to a refusal. Llama 3.1 8B does
  generation, claim extraction and grading at temperature 0; Gemma3 27B judges
  against a zero-shot baseline over 650 queries from TimeQA v2, FreshQA v2,
  HaluEval General, MMLU Global Facts and TruthfulQA.


  Win rates: 83.7% on TimeQA v2, 78.0% on MMLU Global Facts, 64.7% on FreshQA
  v2, 54.7% on TruthfulQA, 50.0% on HaluEval General, 62.3% combined.
  Groundedness sat between 78.8% and 86.4% on factual-answer rows, with MMLU
  an outlier at 66.9%. Retrieval was skipped for 20% of HaluEval queries. 65
  losses were traced to 6 failure modes, led by parametric competition (~30)
  and false-premise overclaiming (~14).


  Evidence is measured but weak in design: 1 model family, an LLM judge, no
  matched-compute baseline, and no ablation isolating which of the 4 phases
  contributes. TimeQA ran only 86 of 150 queries after API quota exhaustion,
  with 64 recorded as ties. FreshQA groundedness of 19.2% reflects 116 denial
  answers scored 0/0 by design.


  Treat the win rates as evidence about 8B-scale parametric gaps, not about
  retrieval generally.
