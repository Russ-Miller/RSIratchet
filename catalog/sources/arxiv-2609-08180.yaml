  produce more accurate and preference-aligned outputs using relevant records
  retrieved from user histories. Personalized language models typically
  prepend a fixed number of retrieved user records, even when additional
  history is redundant, harmful, or unrelated to a user's distinctive
  behavior. We study minimal sufficient personalization: constructing the
  least costly ordered profile for each input while preserving the utility
  achievable from a retrieved candidate pool. We introduce ENOUGH, a method
