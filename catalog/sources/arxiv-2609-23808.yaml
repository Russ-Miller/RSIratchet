summary: >-
  While test-time scaling enhances Large Language Model (LLM) agents in
  long-horizon software engineering (SWE), sparse binary rewards (Pass/Fail)
  create a severe credit assignment crisis and waste failed exploratory
  trajectories. Current trajectory optimization and scaling methods are
  costly and structurally limited, relying on heuristic state reuse without
  causal diagnosis or delayed scalar scoring without actionable online
  guidance. We propose FLARE (Full-Lifecycle Alignment and Reward Engine), a
  novel dense supervision paradigm driven by a lightweight Generative Reward
  Model (GRM). First, RA
