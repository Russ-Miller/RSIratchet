summary: Abstract not retrievable programmatically at ingestion; this summary is
  written from the title and the forwarder's note, not the paper's text. Kushmerick's
  wrapper induction (AAAI-98 workshop; Artificial Intelligence 118, 2000) learns
  delimiter-based extractors, wrappers, from labelled example pages so the same
  wrapper can be run over the rest of a template-like collection. Forwarded as the
  historical ancestor of generate-a-locator-once-and-reuse-it, and the right citation
  when the documents share a template.
notes: 'Forwarded by Russ 2026-09-19 as one of ten papers on locators: generating
  a reusable regex, extractor, SQL query or XPath once so the subset can be pulled
  without calling the model again.'
