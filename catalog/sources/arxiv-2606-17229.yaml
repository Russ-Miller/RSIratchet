summary: >-
  A model that lies while knowing the truth is the central case ELK cannot
  handle with behavioral evaluation alone. We ask whether such deception
  leaves an internal signature distinguishing it from honest error. Our key
  move is a control for wrongness: we contrast a sleeper agent (knows the
  truth, lies on trigger) against a naive liar (fine-tuned to emit the same
  wrong answers with no honest training). Both produce identical wrong
  outputs; any difference is about knowledge conflict, not incorrectness. We
