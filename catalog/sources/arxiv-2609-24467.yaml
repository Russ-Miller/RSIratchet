summary: >-
  Music festival lineups emerge from complex relationships among artists,
  genres, releases, labels, and past performances, making the prediction of
  future lineups a natural fit for temporal knowledge graph (TKG)
  forecasting. In this work, we present a TKG covering 380 festivals over 55
  years, comprising more than 90K festival performance quadruples along with
  information on festivals, artist tours, and artist metadata, and release
  it as a resource for TKG forecasting evaluation. We formalize festival
  lineup forecasting as temporal link prediction between artists and
  festivals at future timestamp
