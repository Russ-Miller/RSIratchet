brief: >-
  Adding a code-guided module to a knowledge-distillation chain-of-thought
  pipeline is reported to push top-k answer accuracy above 95% on
  question-answering and math benchmarks, but the reporting is too thin to
  verify the claim.


  The method decomposes a prompt into sub-tasks, uses code as an explicit
  control mechanism for exploring a knowledge graph, and injects that code
  into the chain-of-thought prompt as external structured input. Evaluation
  uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP, and Dr. SPIDER, scored
  with HIT@1, HIT@3, HIT@5.


  Adding the code module lifts the base chain model from 82.36 to 99.33 HIT@1
  on WebQSP, 81.36 to 97.86 on CWQ, and 86.29 to 94.10 on Dr. SPIDER. Averages
  are reported as 98.40, 96.83, 95.51, against KG-LLM-PR at 91.06,
  LLM-SubKG-Sum at 92.23, RAG at 90.23, and Self-Check at 91.25 on HIT@1.
  Headline gains are given as 15.64%, 13.38%, 13.28%.


  The one isolating comparison is the with/without code module ablation.
  Otherwise there is no per-model breakdown for GPT-4 versus LLaMA 3.3, no
  stated test-set sizes or variance, no matched compute baseline, and HIT@K is
  an odd metric for GSM8K-style generation. Dr. SPIDER appears with 2
  different HIT@1 values across tables.


  The authors note inference overhead and dependence on well-structured
  external knowledge; open-ended and multimodal generation were not tested.


  Treat the 95%+ numbers as unreplicated until the evaluation protocol is
  specified.
