brief: >-
  Adding a code-guided module to a knowledge-distillation chain-of-thought
  pipeline is reported to push top-1 answer accuracy above 95% on
  knowledge-graph QA and math word problems, but the reporting is thin enough
  that the claim should be treated as unverified.


  The method decomposes a prompt into sub-tasks, uses code as an explicit
  control mechanism for exploring a knowledge graph, and inserts that code
  into the chain-of-thought prompt as external structured input. Evaluation
  uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP and Dr. SPIDER, scored
  with HIT@1, HIT@3 and HIT@5.


  Adding the code module raised HIT@1 from 82.36 to 99.33 on WebQSP, 81.36 to
  97.86 on CWQ, 82.06 to 98.23 on GSM8K, 85.26 to 98.19 on MWP, and 86.29 to
  94.10 on Dr. SPIDER. Averages reported as 98.40 HIT@1 against 91.06 for
  KG-LLM-PR, 92.23 for LLM-SubKG-Sum, 90.23 for RAG, and 91.25 for Self-Check.


  The effect is measured, but the design does not isolate it: the paper never
  states which model produced which table, HIT@K is applied to GSM8K and MWP
  without explaining candidate ranking there, prompt-perturbation robustness
  is asserted with no perturbed-vs-clean contrast, and there is no
  cost-matched baseline despite the admitted inference overhead. Table 1 and
  Table 2 also disagree on Dr. SPIDER HIT@1 (94.10 vs 98.12).


  Open-ended generation and multimodal settings are untested, and the method
  presupposes a well-formed knowledge graph.


  Treat the 95%+ figures as a claim needing replication before updating on
  code-guided grounding.
