brief: >-
  Adding a code module that drives knowledge-graph exploration and is injected
  into chain-of-thought prompts is reported to lift HIT@K on question
  answering and math reasoning to above 95%, a level that should prompt
  scrutiny of the evaluation rather than belief in the method.


  The setup is a "knowledge distillation chain-style model" (KDCM) evaluated
  with GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP and Dr. SPIDER, scored
  with HIT@1, HIT@3 and HIT@5, and compared against KG-LLM-PR, LLM-SubKG-Sum,
  RAG and Self-Check.


  Adding the code module raises HIT@1 on WebQSP from 82.36 to 99.33, on CWQ
  from 81.36 to 97.86, and on GSM8K from 82.06 to 98.23. Averages across
  datasets are 98.40 / 96.83 / 95.51, against 90.23 / 90.28 / 90.18 for RAG
  and 91.25 / 92.35 / 91.27 for Self-Check. Headline gains are 15.64%, 13.38%
  and 13.28%.


  Evidence is thin. The code module is the only ablated component, no
  per-model breakdown is given for GPT-4 versus LLaMA 3.3, no token or compute
  budget is matched, prompt-perturbation robustness is asserted rather than
  described, and HIT@K is a retrieval metric applied to generation. The whole
  simulation runs on 1 laptop-class machine.


  Open-ended generation and multimodal tasks are untested, and the method
  needs structured external knowledge to exist.


  Treat the 95%+ numbers as unreplicated until the evaluation protocol is
  specified.
