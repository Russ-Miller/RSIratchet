brief: >-
  Adding a code-guided module to a knowledge-distillation chain-of-thought
  pipeline is reported to push HIT@K above 95% on knowledge-graph QA and math
  benchmarks, but the reporting is too thin to attribute the effect.


  The method decomposes a prompt into sub-tasks, uses code as an explicit
  control mechanism for knowledge-graph exploration, and inserts that code
  into the chain-of-thought prompt as external structured knowledge.
  Evaluation uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP, and Dr.
  SPIDER, scored with HIT@1, HIT@3, HIT@5.


  Adding the code module to the base chain model moves WebQSP HIT@1 from 82.36
  to 99.33 and Dr. SPIDER HIT@1 from 86.29 to 94.10; averages are 98.35,
  96.74, and 95.49. The abstract reports gains of 15.64%, 13.38%, and 13.28%.
  Against KG-LLM-PR, LLM-SubKG-Sum, RAG, and Self-Check, the method averages
  98.40 HIT@1 versus 90.23–92.23.


  The effect is measured, not isolated. There is no ablation separating the
  knowledge graph from the code representation, no matched compute or token
  budget despite the authors conceding higher inference cost, no variance or
  seed reporting, and results for GPT-4 and LLaMA 3.3 are not broken out.
  Robustness to "ambiguous" prompts is asserted without describing the
  perturbations. Open-ended and multimodal generation are untested.


  Treat the headline numbers as unverified until an ablation separates code
  from retrieval.
