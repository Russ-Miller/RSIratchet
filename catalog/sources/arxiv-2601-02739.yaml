brief: >-
  Adding a code module that guides knowledge-graph exploration, and folding
  that code into chain-of-thought prompts, is reported to push HIT@K above 95%
  on knowledge and math reasoning sets, which is a claim strong enough to be
  worth scrutinising rather than accepting.


  The method extends a knowledge distillation chain-style model: prompts are
  decomposed into sub-tasks, a code-guided chain produces intermediate steps
  under external structured-knowledge constraints, then an answer is emitted.
  Evaluation uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP, and Dr.
  SPIDER, scored by HIT@1, HIT@3, HIT@5.


  Reported averages are 98.35 HIT@1, 96.74 HIT@3, 95.49 HIT@5, against
  KG-LLM-PR at 91.06/91.78/90.22, RAG at 90.23/90.28/90.18, and Self-Check at
  91.25/92.35/91.27. The abstract states gains of 15.64%, 13.38%, 13.28%. On
  WebQSP, KDCM goes from 82.36 to 99.33 HIT@1 with the code module.


  The code module is isolated by an ablation against KDCM alone, but the paper
  gives no per-model breakdown for GPT-4 versus LLaMA 3.3, no variance or
  seeds, no matched compute baseline, and HIT@K is used in place of standard
  GSM8K accuracy. Robustness to ambiguous prompts is asserted, not measured
  against stated perturbations.


  The authors note the method needs well-structured external knowledge and is
  untested on open-ended and multimodal generation.


  Treat the headline numbers as unverified until the metric definition on math
  sets is clarified.
