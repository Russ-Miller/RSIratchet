brief: >-
  Adding a code module to a knowledge-distillation chain-of-thought pipeline
  is reported to push HIT@K above 95% on 5 question-answering and math
  datasets, but the evidence as presented is thin enough that the size of the
  effect should not be taken at face value.


  The method decomposes a prompt into sub-tasks, uses code to guide
  knowledge-graph exploration, and injects that code into the chain-of-thought
  prompt as external structured input. Evaluation uses GPT-4 and LLaMA 3.3 on
  WebQSP, CWQ, GSM8K, MWP and Dr. SPIDER, scored with HIT@1/3/5.


  Adding the code module moves WebQSP HIT@1 from 82.36 to 99.33, CWQ from
  81.36 to 97.86, GSM8K from 82.06 to 98.23, MWP from 85.26 to 98.19, Dr.
  SPIDER from 86.29 to 94.10. Averages are 98.35 HIT@1, 96.74 HIT@3, 95.49
  HIT@5, against 91.06 for KG-LLM-PR, 92.23 for LLM-SubKG-Sum, 90.23 for RAG
  and 91.25 for Self-Check.


  The code module is ablated against the chain model without it, which
  isolates that component. Nothing else is: there is no per-model breakdown
  for GPT-4 versus LLaMA 3.3, no matched compute or token budget against the
  baselines, no variance or seeds, and two Dr. SPIDER HIT@1 numbers in the
  paper disagree (94.10 and 98.12). 98%+ HIT@1 on GSM8K and CWQ is far above
  commonly reported ranges and is not explained.


  The authors note that the method needs well-structured external knowledge
  and suitable code representations, and that open-ended generation and
  multimodal settings were not tested.


  Treat this as a direction worth probing rather than a measured result you
  can rely on.
