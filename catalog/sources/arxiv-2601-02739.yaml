brief: >-
  Adding a code-guided module to a knowledge-distillation chain-of-thought
  pipeline is reported to push HIT@K above 95% on knowledge-graph QA and math
  word problems, a claim whose size should make you check the methodology
  before updating.


  The setup: a "knowledge distillation chain-style model" (KDCM) that
  decomposes a prompt into sub-tasks and uses code as an explicit control
  mechanism for knowledge-graph exploration, with the code also inserted into
  the chain-of-thought prompt. Evaluation uses GPT-4 and LLaMA 3.3 on WebQSP,
  CWQ, GSM8K, MWP, and Dr. SPIDER, scored by HIT@1, HIT@3, HIT@5.


  Reported gains: HIT@1, HIT@3, HIT@5 improve by 15.64%, 13.38%, 13.28%. On
  WebQSP, KDCM goes from 82.36 / 83.14 / 80.26 to 99.33 / 97.38 / 95.28.
  Averages of 98.40 / 96.83 / 95.51 are reported against KG-LLM-PR (91.06 /
  91.78 / 90.22), RAG (90.23 / 90.28 / 90.18), and Self-Check (91.25 / 92.35 /
  91.27).


  Evidence is thin. There is 1 ablation (code module on/off), but no per-model
  breakdown for GPT-4 versus LLaMA 3.3, no matched compute or token budget, no
  error analysis, no statement of how GSM8K accuracy becomes a top-K retrieval
  metric, and no independent replication. Applying HIT@5 to math word problems
  is not justified in the text.


  The authors note that inference cost rises and that open-ended generation
  and multimodal settings are untested.


  Treat the headline numbers as unverified until the evaluation protocol is
  specified.
