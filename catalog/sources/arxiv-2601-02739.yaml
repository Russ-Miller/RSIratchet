brief: >-
  Adding a code module to a knowledge-distillation chain-of-thought pipeline
  is reported to push HIT@K above 95% on knowledge-graph QA and math word
  problem benchmarks, but the reporting is thin enough that the claim is hard
  to check.


  The method decomposes a prompt into sub-tasks, uses code as an explicit
  control mechanism to guide knowledge-graph exploration, and inserts that
  code into the chain-of-thought prompt as external structured input.
  Evaluation uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP and Dr.
  SPIDER, scored with HIT@1/@3/@5.


  Adding the code module raises HIT@1 on WebQSP from 82.36 to 99.33 and on CWQ
  from 81.36 to 97.86; averaged gains are reported as 15.64%, 13.38% and
  13.28% for HIT@1, HIT@3 and HIT@5. Against KG-LLM-PR, LLM-SubKG-Sum, RAG and
  Self-Check, the method averages 98.40 / 96.83 / 95.51 versus 90.23-92.23 at
  HIT@1.


  The comparison is an ablation of the code module plus 4 external baselines,
  said to run under identical inference settings, but no per-model breakdown
  separates GPT-4 from LLaMA 3.3, no variance or seed count is given, no
  matched compute budget is reported, and HIT@K on GSM8K is an unusual metric
  choice. The authors note higher inference overhead and dependence on
  well-structured external knowledge; open-ended and multimodal generation
  were not tested.


  Treat the numbers as unverified until the setup is specified more precisely.
