brief: >-
  Adding a code module that guides knowledge-graph exploration and is injected
  into chain-of-thought prompts is reported to push top-k answer accuracy
  above 95% on knowledge and math QA, though the reporting is too thin to
  verify the claim.


  The method extends a "knowledge distillation chain-style" model: the prompt
  is decomposed into sub-tasks, code-guided steps constrain intermediate
  reasoning against structured external knowledge, and the final answer is
  grounded in validated steps. GPT-4 and LLaMA 3.3 are the base models;
  datasets are WebQSP, CWQ, GSM8K, MWP, and Dr. SPIDER, scored with
  HIT@1/@3/@5.


  Against the chain model without the code module, HIT@1, HIT@3 and HIT@5
  improve by 15.64%, 13.38%, and 13.28%. Averages reach 98.35, 96.74, 95.49.
  Against KG-LLM-PR, LLM-SubKG-Sum, RAG and Self-Check, the reported means are
  98.40/96.83/95.51 versus 90.17–92.35 for the baselines.


  The effect is measured only as aggregate table numbers. There is no
  breakdown by model, so GPT-4 and LLaMA 3.3 results are not separable; no
  matched compute or token budget baseline; no variance, seeds, or
  significance; the robustness claim about ambiguous prompts is asserted
  without a prompt-perturbation table.


  Untested: open-ended generation, multimodal tasks, domains lacking
  structured knowledge or code representations. Inference cost rises.


  Treat the 95%+ figures as unreplicated self-report rather than a reference
  point.
