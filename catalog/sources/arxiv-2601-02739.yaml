brief: >-
  Adding a code module that guides knowledge-graph exploration and is inserted
  into chain-of-thought prompts is reported to push HIT@K above 95% on
  question-answering and math benchmarks, a claim the paper's reporting does
  not let you check.


  The system extends a "knowledge distillation chain" model with code-guided
  retrieval over structured knowledge, decomposing prompts into sub-tasks and
  constraining intermediate steps. GPT-4 and LLaMA 3.3 are the base models;
  evaluation covers WebQSP, CWQ, GSM8K, MWP, and Dr. SPIDER, scored with
  HIT@1/3/5.


  Average reported gains over the chain model without the code module are
  15.64%, 13.38%, and 13.28% on HIT@1, HIT@3, HIT@5. The method averages
  98.40, 96.83, 95.51 against RAG at 90.23, 90.28, 90.18 and Self-Check at
  91.25, 92.35, 91.27. WebQSP HIT@1 is 99.33.


  Evidence is thin. There is 1 ablation, the presence or absence of the code
  module, but no per-model breakdown, no matched compute or token budget, no
  variance across runs, and no statement of which model produced which table.
  GSM8K and MWP are scored with a retrieval metric, HIT@K, which is an odd fit
  for arithmetic. Hardware listed is a laptop CPU with 16 GB of memory.


  Untested: open-ended generation, multimodal tasks, and domains without
  structured knowledge. Treat the headline numbers as unverified.
