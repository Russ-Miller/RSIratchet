brief: >-
  Adding a code-guided module to a knowledge-distillation chain-of-thought
  pipeline is reported to push top-k answer accuracy above 95% on
  question-answering and math benchmarks, though the reporting is thin enough
  that the claim is hard to check.


  The method decomposes a prompt into sub-tasks, uses code as an explicit
  control mechanism for exploring a knowledge graph, and injects that code
  into the chain-of-thought prompt as external structured input. Evaluation
  uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP, and Dr. SPIDER, scored
  with HIT@1, HIT@3, HIT@5.


  Against the chain model without the code module, HIT@1, HIT@3, and HIT@5
  improve by 15.64%, 13.38%, and 13.28%. Averages reach 98.35, 96.74, 95.49
  across the 5 datasets. Reported comparisons against KG-LLM-PR,
  LLM-SubKG-Sum, RAG, and Self-Check put those between 90.17 and 92.35.


  The one isolation that exists is the with/without code-module comparison in
  Table 1. Nothing else is controlled: HIT@1 of 98.23 on GSM8K, a free-form
  math dataset, is not explained as a retrieval metric, per-model results for
  GPT-4 versus LLaMA 3.3 are never separated, and no token or compute budget
  is matched despite the authors conceding higher inference cost.


  Treat the magnitudes as unverified; the structured-constraint idea is the
  part worth taking.
