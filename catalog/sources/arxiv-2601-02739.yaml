brief: >-
  Adding a code-guided module to a knowledge-distillation chain-of-thought
  pipeline is reported to push HIT@K above 95% on knowledge and math QA, but
  the reporting is thin enough that the claim is hard to check.


  The method decomposes a prompt into sub-tasks, uses code as an explicit
  control mechanism for exploring a knowledge graph, and injects that code
  into the chain-of-thought prompt as external structured input. Evaluation
  uses GPT-4 and LLaMA 3.3 on WebQSP, CWQ, GSM8K, MWP and Dr. SPIDER, scored
  with HIT@1, HIT@3 and HIT@5.


  Adding the code module raises HIT@1 on WebQSP from 82.36 to 99.33 and on Dr.
  SPIDER from 86.29 to 94.10. Averages across datasets are 98.35, 96.74 and
  95.49. Against KG-LLM-PR, LLM-SubKG-Sum, RAG and Self-Check, the method
  reports 98.40 / 96.83 / 95.51 versus 90.17-92.35 for the others. Headline
  gains are 15.64%, 13.38% and 13.28%.


  Evidence is weak. There is 1 ablation (with and without the code module) and
  no per-model breakdown, so GPT-4 and LLaMA 3.3 results cannot be separated.
  Robustness to ambiguous prompts is asserted, not measured against a stated
  perturbation set. No matched compute budget, no variance, no significance
  test. HIT@1 near 99 on GSM8K-style math is far outside typical reported
  ranges and is unexplained.


  The authors note untested areas: open-ended generation and multimodal tasks,
  plus dependence on available structured knowledge.


  Treat the numbers as unverified until an independent run exists.
