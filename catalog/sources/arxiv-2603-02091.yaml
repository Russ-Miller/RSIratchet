brief: >-
  RL fine-tuning on template-generated questions about entirely fictional
  people transfers to real-world multi-hop question answering, despite zero
  factual overlap. The training signal costs nothing to produce and needs no
  LLM verifier.


  The setup: GRPO fine-tuning of Qwen3-0.6B, Qwen3-1.7B, Qwen2.5-1.5B-Instruct
  and Phi-4-mini-reasoning (0.6-4B) on 4 rule-generated datasets (PhantomWiki,
  GSM-Infinite, ReasoningGym Family-Relationships and Knights-Knaves), 10K
  samples each, 1 epoch, evaluated on 500-question subsamples of HotpotQA,
  2WikiMultihopQA, MuSiQue, CofCA and SynthWorlds-RM in distractor form.


  Qwen3-0.6B trained on PhantomWiki gains 56% to 131% relative F1. Gains hold
  across families and sizes, largest for the smallest models, and scale
  monotonically with training samples with no overfitting. SFT on GSM-Infinite
  solution traces lifts GSM-Infinite accuracy from 0.0241 to 0.7735 for
  Qwen3-0.6B but leaves HotpotQA flat (0.3569 to 0.3995), while RL reaches
  0.4786.


  Evidence is measured, with 2 seeds per run and standard errors. A
  format-only reward ablation isolates the cause: Qwen3 and Phi gain nothing
  from format reward, so their transfer is composition, but
  Qwen2.5-1.5B-Instruct jumps from 0.02 to 0.43 on HotpotQA, meaning its
  transfer is partly formatting. Held-out fictional worlds and out-of-domain
  hop counts rule out memorized-knowledge surfacing.


  All models are under 7B; in-domain real-world data still beats synthetic
  transfer, and only knowledge composition was tested. If you lack verifiable
  reasoning data, generators may substitute for annotation.
