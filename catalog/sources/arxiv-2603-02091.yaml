  generated from frontier LLMs, or scored by LLM-based verifiers. All three
  have considerable limitations: human-annotated datasets are small and
  expensive to curate, LLM-generated data is hallucination-prone and costly,
  and LLM-based verifiers are inaccurate and slow. In this work, we
