summary: >-
  Reinforcement Learning (RL) has been shown to significantly boost
  reasoning capabilities of large language models (LLMs) in math, coding,
  and multi-hop reasoning tasks. However, RL fine-tuning requires abundant
  high-quality verifiable data, often sourced from human annotations,
  generated from frontier LLMs, or scored by LLM-based verifiers. All three
  have considerable limitations: human-annotated datasets are small and
  expensive to curate, LLM-generated data is hallucination-prone and costly,
  and LLM-based verifiers are inaccurate and slow. In this work, we
  investigate a cheaper alternative: R
