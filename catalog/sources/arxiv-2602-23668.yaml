summary: >-
  Large language model (LLM) agents typically rely on reactive
  decision-making paradigms such as ReAct, selecting actions conditioned on
  growing execution histories. While effective for short tasks, these
  approaches often lead to redundant tool usage, unstable reasoning, and
  high token consumption in complex long-horizon tasks involving branching,
  iteration, or multi-tool coordination. To address these limitations, this
