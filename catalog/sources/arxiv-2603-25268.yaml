summary: >-
  We introduce CRAFT, a multi-agent benchmark for evaluating pragmatic
  communication in large language models under strict partial information.
  In this setting, multiple agents with complementary but incomplete views
  must coordinate through natural language to construct a shared 3D
  structure that no single agent can fully observe. We formalize this
