brief: >-
  Generating synthetic fine-tuning questions that are explicitly optimized to
  maximize disagreement between a weak model and a document-grounded expert
  beats entity-extraction augmentation while using far fewer training tokens.


  The framework pairs a target model (LLaMA3-8b) and a strong expert model,
  both given a legal contract as context, and uses TextGrad in reverse: a
  feedback model compares the two answers, a guidance model writes an editing
  instruction, and a revision model rewrites the question to widen the gap.
  Final questions are paired with expert answers and used for supervised
  fine-tuning. Evaluation covers the 3 most-referenced CUAD contracts in
  LegalBench, 491 questions across 36 tasks, few-shot, no retrieval.


  Accuracy averaged 82.7 against 69.5 for the unmodified base model, 79.6 for
  EntiGraph, 75.8 for model-independent QA, 75.0 for Knowledge-Instruct, and
  71.9 for 6x paraphrasing. That is a 18.99% improvement over base and 3.89%
  over EntiGraph with about 70x fewer training tokens (96k vs 6.7M).


  The comparison is to published augmentation methods at their own token
  counts, not at matched budgets, and 1 model family, 1 domain, and 3
  documents are tested. A sensitivity analysis over refinement iterations
  shows accuracy rising with more steps, but no ablation separates the
  adversarial objective from simply using expert answers.


  If you fine-tune on small corpora, targeting measured weak-model failures
  may matter more than corpus size.
