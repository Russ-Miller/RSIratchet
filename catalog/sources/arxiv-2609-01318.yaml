brief: >-
  Diffusion vision-language models invert several known autoregressive failure
  modes rather than inheriting them: they trend toward no-bias on yes/no
  visual queries, and they pick the longest answer option so consistently that
  accuracy collapses when the correct choice is short.


  6 dLVLMs (LLaDA-V, LaViDa-LLaDA, LaViDa-Dream, MMaDA-MixCoT, Dream-VL,
  Dimple) were compared against 7 AR baselines on POPE and CHAIR (MSCOCO),
  FairFace demographic recognition, and length-controlled fine-grained MCQA on
  CUB and Stanford Dogs.


  Where AR models like mPLUG-Owl answer yes on 98.67% of adversarial POPE
  items, dLVLMs sit at 35-45% Yes%. On CUB without class names, LaViDa-Dream
  scores 2.80% when the correct option is short versus 96.50% when it is long;
  Qwen2.5-VL reaches 50.70% in the shorter-correct condition. MMaDA-MixCoT
  scores 0.00% on Latino Hispanic and Southeast Asian faces at tight crop, and
  shows a -23.34 female-male gender gap where AR gaps stay within +3.22 to
  -2.71.


  Evidence is mostly measured with useful controls: Dimple and LLaVA-Next
  share training data, and an AR-style decoding swap on fixed weights cut
  Dimple's linguistic error from 13.8% to 2.0% while CHAIR_I moved only 19.59%
  to 16.23%, separating fluency from grounding. Commit-step predicts
  CHAIR-flagged hallucinated tokens at ROC-AUC 0.699 and 0.667 on 2 backbones.
  Linguistic judging is GPT-4o-mini with no human validation, and vision
  encoder and scale confounds remain.


  Treat diffusion decoding as a distinct reliability profile, not a milder
  version of the AR one.
