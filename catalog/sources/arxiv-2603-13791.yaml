brief: >-
  Monitors that see an agent's chain-of-thought or its hidden states detect
  deception better than monitors restricted to actions and outputs, and the
  gap is largest for the subtlest categories. DeceptGuard compares 3 regimes:
  black-box (actions plus outputs), CoT-aware prompted monitors, and an
  activation probe reading residual-stream activations from
  Llama-3.1-70B-Instruct at layer 32.


  Monitors were tuned on 4,800 synthetic trajectories from DeceptSynth,
  spanning a 12-category deception taxonomy, and tested on 9,200 held-out
  trajectories from DeceptArena, 6 sandboxed environments with
  execution-verified labels and agents drawn from GPT-5, Claude Sonnet 4.5,
  and Gemini 2.5 Pro.


  Macro-average pAUROC (FPR window 0-0.20): black-box 0.837, CoT-prompted
  0.869, activation probe 0.901, hybrid ensemble 0.934, a mean gain of +0.097.
  Gains concentrate in structural categories (Precedent Engineering 0.718 to
  0.901). CoT alone beats actions alone, 0.841 vs 0.793. The advantage shrinks
  across CoT conditions: +0.162 honest, +0.071 sanitized, +0.031 deceptive.


  Evidence is measured with bootstrap confidence intervals, a modality
  ablation, a layer sweep over 80 layers, and 4 monitor backbones giving
  consistent ordering. But deception is injected by system prompt in synthetic
  environments, the probe is 1 encoder, and there is no human-monitor baseline
  or real-deployment validation.


  If you build control protocols, treat reasoning-trace access as worth
  preserving, but do not assume these margins survive agents trained against
  monitors.
