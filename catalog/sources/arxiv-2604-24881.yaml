brief: >-
  Multi-agent debate can be compressed into a single model's forward pass, and
  the individual agents remain as separable directions in activation space
  rather than collapsing into one voice. Internalized Multi-Agent Debate
  (IMAD) does supervised fine-tuning on full 3-agent, 2-round debate
  transcripts (944 traces, GPT-3.5 turbo, arithmetic only), then GRPO with a
  decaying format reward and a length limit annealed from 2000 to 500 tokens.


  On GSM8K, MMLU-Pro and BBH (1000 sampled problems each, 3 runs), IMAD uses
  6.3%-21.1% of explicit Debate's tokens, a 5-16x efficiency gain. LLaMA-3.1
  8B goes 83.03 to 85.20 on GSM8K and 51.06 to 58.53 on BBH; Mistral Nemo 12B
  beats Debate by 18.97 points on GSM8K. Qwen 2.5 7B stays behind Debate on
  GSM8K and MMLU-Pro. Steering vectors extracted by difference-in-means
  recover agent personas with 6.10%-24.97% higher ROUGE AUC than the base
  model, average 15.41%.


  Comparisons include matched baselines (Single, Debate, DebateGPT) and both
  pipeline stages, across 3 model families, with token counts reported. The
  safety claim rests on 1 model (LLaMA-3.1 8B), 100 test questions per trait,
  and LLM-judge trait scores; the "evil" trait suppresses to 0 while
  hallucination only partially suppresses from a baseline near 65.


  Training is arithmetic-only with a fixed debate shape, and gains were weak
  below 7B. Useful if you were treating debate's cost as unavoidable.
