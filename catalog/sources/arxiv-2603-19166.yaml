brief: >-
  VLMs asked to turn a metric-semantic instruction like "2 meters to the right
  of the fridge" into a 3D waypoint do not enforce the distance; they pick the
  nearest object satisfying the direction. Decomposing the query into anchor,
  predicate and metric terms, having a VLM parameterise a kernel for each, and
  multiplying them into a goal density fixes the metric part.


  MAPG runs an Orchestrator, Grounding Agent, Spatial Agent and Verifier over
  an online 3D scene graph, emitting a von Mises-Fisher directional kernel
  times a radial Gaussian metric kernel, sampled for RRT*. Evaluated on
  MAPG-Bench, a new set of 30 HM3D indoor scenes with 100 annotated queries,
  plus HM-EQA.


  Against GraphEQA, object-to-world error falls from 5.82 m to 0.07 m, yaw
  from 13.5 to 1.9, pitch from 27.9 to 4.4, task success 0.78 to 0.98.
  Object-to-object error 0.07 m vs SRGPT's 0.50 m. On HM-EQA, Claude Opus 4.6
  reaches 0.71 vs GraphEQA's 0.67.


  Ablations swap the spatial reasoner for curated chain-of-thought at matched
  pipeline: object selection drops 0.42 to 0.20, and under occlusion explicit
  reasoning gives 0.50 vs 0.30. 4 backbones share the pipeline, isolating
  structure from model choice.


  Commonsense accuracy stays low (0.08-0.30), the benchmark is author-built
  and author-annotated, and real-world evidence is 3 queries on 1 robot. Treat
  the gain as an interface design result, not better VLM spatial cognition.
