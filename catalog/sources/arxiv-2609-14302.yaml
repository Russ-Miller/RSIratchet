url: https://arxiv.org/abs/2609.14302
tags: [ingested]
summary: >-
  Can financial vision-language models (VLMs) turn chart evidence into
  reliable action recommendations? Existing hallucination evaluations are
  mostly claim-centric; they assess whether generated statements are
  supported, but not whether evidence remains traceable through rationale,
  confidence, and final action. We introduce E2A-Bench, a 969-query
  benchmark for financial chart reasoning, constructed from 323 HS300
  constituents under three input modalities with deterministic OHLCV-derived
  evidence anchors. E2A-Bench evaluates grounding, reasoning-action
  consistency, evidence-confidence calibration
