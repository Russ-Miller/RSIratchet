summary: >-
  High-stakes reasoning tasks necessitate transparent and verifiable
  workflows, yet conventional single-model large language models (LLMs)
  often struggle with hallucination and low interpretability under zero-shot
  paradigms. To address this general AI challenge, we propose a Multi-Agent
  Audit Framework that simulates a collaborative, multi-step verification
  process. We empirically validate this architecture in the sensitive domain
  of clinical mental health screening using a modular LangChain workflow.
  Our framework decomposes the reasoning process into a Perception Agent,
  Knowledge Retrieval-Aug
