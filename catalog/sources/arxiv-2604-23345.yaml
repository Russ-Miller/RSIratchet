brief: >-
  LLM-inferred constraints help a dialogue policy only if they are verified
  and mapped into ontology slots first; feeding raw LLM text into the state
  hurts. VLK-RL elicits explicit and implicit cross-domain feasibility
  constraints from a respondent LLM, has a judge LLM cross-examine them over
  up to 5 rounds, then normalizes survivors into slot-value pairs via
  Sentence-BERT matching (threshold 0.7) before PPO policy learning.


  Tested on MultiWOZ 2.1 and Frames in ConvLab-2, with Qwen2-7B-Instruct,
  Qwen1.5-14B-Chat and GPT-4o-mini as off-the-shelf backbones, against PPO,
  ACGOS, GALAXY, GDP-Zero, TransferTOD and CAPID.


  On MultiWOZ 2.1, success rises from 0.6024 for the best baseline (GDP-Zero)
  to 0.7214 for VLK-RL (Qwen-14B), with average turns dropping from 22.22 to
  17.35. On Frames, success goes 0.5890 to 0.7239. Human evaluation with 30
  annotators gives SR 0.5124 vs 0.4120 and HR 3.18 vs 2.63 on MultiWOZ.


  Effects are measured, averaged over 5 seeds, with 4 ablations isolating
  cross-examination, the text-to-slot mapper, RL, and the LLM; removing
  cross-examination or the mapper each drops performance, so the gain is not
  from LLM knowledge alone. Baselines are not matched on inference compute,
  and the extra LLM calls add latency the paper acknowledges but does not
  quantify.


  Only 2 datasets, 1 RL algorithm in the main table, and constraints outside
  the ontology schema are discarded.


  If you are wiring an LLM into a long-horizon controller, treat the state
  interface, not the prompt, as the thing to engineer.
