summary: >-
  Reinforcement learning (RL) has emerged as a powerful approach for
  improving reasoning in language and vision-language models, yet its
  strongest successes still depend heavily on ground-truth supervision
  (e.g., verifiable reward). Such annotations are costly to obtain and
  become increasingly scarce as reasoning capabilities advance beyond what
  humans can reliably evaluate. Self-rewarding RL reduces this dependence by
  enabling models to derive reward signals from their own completions.
