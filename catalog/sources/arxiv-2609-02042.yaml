summary: >-
  Large language model (LLM) agents for long-horizon interactive tasks
  typically follow a ReAct-style protocol, issuing one primitive action per
  LLM round. While this enables frequent replanning, it is inefficient for
  long-horizon tasks where many rounds are spent on routine action
  sequences. A natural alternative is to let the agent emit variable-length
  action chunks. However, naively training such policies with standard
