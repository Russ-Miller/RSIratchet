summary: >-
  Automatic prompt optimization is a promising approach for adapting large
  language models (LLMs) to downstream tasks, yet existing methods typically
  search for a specific prompt specialized to a fixed task. This paradigm
  limits generalization across heterogeneous queries and prevents models
  from accumulating reusable prompting knowledge over time. In this paper,
  we propose MemAPO, a memory-driven framework that reconceptualizes prompt
  optimization as generalizable and self-evolving experience accumulation.
  MemAPO maintains a dual-memory mechanism that distills successful
  reasoning trajectories
