brief: >-
  Benchmark scores do not cleanly stand in for capabilities, and the 2
  existing formal fixes both fail for the same reason: they let model scale
  masquerade as a latent ability. This thesis proposes the structured
  capabilities model, which treats scale as an upstream cause of capabilities
  and capabilities as causes of observed scores up to measurement error,
  combining latent factor models with observational scaling laws.


  The model is fit to OpenLLM Leaderboard v2 results, using raw per-subtask
  BIG-Bench Hard accuracies rather than the leaderboard's single aggregate: p
  = 19 benchmark indicators across m = 4,395 LLMs after dropping 181 models
  with incomplete results, from an original 4,576 models spanning 64
  architectures.


  Compared with latent factor models, the structured capabilities model
  reports better parsimonious fit indices and removes a dominant factor that
  acts as a scale proxy; prior work shows this factor with average loading
  0.81 explaining 65.6 % of benchmark variance in Ilić and Gignac, and factor
  correlation 0.70 with log parameter count in Burnell et al. Compared with
  observational scaling laws, whose first 3 principal components explain 96.7
  % of variance with the first alone at ~ 80 %, it predicts held-out
  benchmarks with higher accuracy.


  Evidence is a model-comparison exercise on 1 leaderboard and 1 benchmark
  family, with no causal inference claimed and no independent replication; the
  source text provided here stops before reporting the author's own fit
  statistics.


  Treat a dominant factor in LLM capability models as a scale artefact until
  scale is modelled explicitly.
