brief: >-
  Benchmark scores alone do not identify what capability a model has, and the
  leading formal attempts to recover capabilities from scores mostly recover
  model scale. The structured capabilities model is proposed to separate the
  two: scale feeds capabilities, capabilities feed observed scores up to
  measurement error.


  The setup uses the OpenLLM Leaderboard v2, which at closure held results for
  4,576 LLMs across 6 benchmarks spanning 64 architectures. The author takes
  BIG-Bench Hard subtask accuracies, recombining split tasks to p = 19
  indicators and dropping 181 models with incomplete results, leaving m =
  4,395 LLMs. Two comparisons are run: exploratory factor analysis with and
  without log parameter count as an upstream variable, and observational
  scaling laws versus structured capabilities on held-out benchmark
  extrapolation.


  Prior work is the main quantitative anchor. Burnell et al. fit 3 factors on
  29 LLMs with CFI = 0.70, TLI = 0.61, RMSEA = 0.26 and mean inter-task
  correlation 0.56, with their dominant factor correlating 0.70 with log
  parameter count. Ilić and Gignac's "Artificial General Ability" factor has
  average loading 0.81 and accounts for 65.6% of variance. Ruan et al.'s first
  3 principal components explain 96.7% of variance, the first alone ~80%.


  The abstract reports better parsimonious fit indices and higher
  out-of-distribution predictive accuracy for the new model, but the source
  text here stops before the results, so the improvements are stated rather
  than shown with figures. Evidence is 1 leaderboard, 1 benchmark family
  (BBH), open-weight models only, multiple-choice scoring, and no causal
  inference is claimed.


  If you read benchmark scores as capability estimates, this gives you a
  concrete reason to suspect you are reading parameter count instead.
