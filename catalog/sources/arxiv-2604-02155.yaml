summary: "How much should a language agent think before taking action?
  Chain-of-thought (CoT) reasoning is widely assumed to improve agent
  performance, but the relationship between reasoning length and accuracy in
  structured tool-use settings remains poorly understood. We present a
  systematic study of CoT budget effects on function-calling agents, sweeping
  six token budgets (0--512) across 200 tasks from the Berkeley Function
  Calling Leaderboard v3 Multiple benchmark. Our central finding is a striking
  non-monotonic pattern on Qwen2.5-1.5B-Instruct: brief reasoning (32 tokens)
  dramatically improves accur"
