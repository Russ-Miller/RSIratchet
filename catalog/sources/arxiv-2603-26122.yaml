brief: >-
  Giving a dermatology agent a memory of past cases it writes guidelines from,
  rather than a fixed textbook retrieval base, raises fine-grained and
  rare-disease diagnosis accuracy without any retraining. SkinGPT-X splits the
  task across a Vision Agent (Qwen3-VL) that only describes morphology, a
  Diagnosis Agent (PanDerm) that emits top-5 candidates, RAG over an Oxford
  dermatology handbook, and a Case-Review Agent (Qwen3-A30) that cross-checks
  against the top-5 visually similar historical cases and evolved guidelines.


  Against MedGemma, Hulu-Med, Qwen3-VL and a dataset-finetuned PanDerm on
  Dermnet, HAM10000, DDI31 and Fitzpatrick-17k, it reports +9.6% accuracy on
  DDI31 and +13% weighted F1 on Dermnet, HAM10000 ACC 86.6%, and on a rebuilt
  498-class Dermnet498 an ACC of 63.4% (+5.4%) versus PanDerm's 58.0%. On a
  new 564-sample, 8-class rare disease set it gains +9.8% accuracy and +10%
  Cohen's Kappa.


  The memory mechanism is isolated by ablation: removing it drops
  Fitzpatrick-17k ACC from 70.7% to 68.4%, and costs +10.1% ACC on Dermnet498,
  all p < 0.001. 2 dermatologists blind-reviewed 600 evolutionary cases,
  scoring guidelines 3.8-4.8 on a 5-point scale.


  Caveats: the strongest baseline shares the backbone used inside the system,
  so the comparison is not model-matched; no equal-compute baseline is
  reported; the rare disease images are scraped from web sources, and latency
  plus cross-center imaging shift are acknowledged but untested.


  If you build retrieval-based medical agents, this argues the win comes from
  distilled case guidelines, not larger static knowledge bases.
