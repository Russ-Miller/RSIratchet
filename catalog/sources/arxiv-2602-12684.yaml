brief: >-
  Conditioning a VLA's next action chunk on the previously committed actions
  makes the policy less reactive, because later-timestep predictions can copy
  the prefix instead of attending to vision and language. Blocking that
  shortcut with a Λ-shape attention mask recovers reactivity while keeping
  chunk-to-chunk continuity.


  Xiaomi-Robotics-0 pairs Qwen3-VL-4B-Instruct with a 16-layer diffusion
  transformer (4.7B parameters total), pre-trained on about 200M robot
  timesteps and over 80M vision-language samples, then post-trained for
  asynchronous execution. Evaluation covers LIBERO, CALVIN, SimplerEnv, 10 VL
  benchmarks, and 2 bimanual real-robot tasks (Lego Disassembly, Towel
  Folding) on an RTX 4090 at 80 ms latency.


  Reported numbers: 98.7% average on LIBERO, 85.5% and 74.7% on Google Robot
  visual matching and variant aggregation, 79.2% on WidowX, CALVIN average
  length 4.80 (ABCD→D) and 4.75 (ABC→D). On Towel Folding it reaches 1.2
  pcs/min versus 1 pcs/min for π0.5, a synchronous variant, and a training-RTC
  variant. ERQA is 40.8 versus 40.0 for the base VLM; dropping VL data gives
  0.0 on all 10 VL benchmarks.


  The attention-mask claim rests on 1 comparison against a training-RTC
  variant plus a qualitative failure description (repeated flinging loops), on
  2 tasks with few trials: 3 trials per Lego configuration, 2 30-minute towel
  rollouts. The Λ-mask and the RoPE offset and loss reweighting are not
  separated. Simulation results are self-reported against published baselines,
  not rerun.


  Treat the mask as a plausible fix with thin real-robot evidence rather than
  a settled result.
