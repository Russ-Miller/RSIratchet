brief: >-
  Retrieving ontology-aligned triples from a telecom knowledge graph beats
  retrieving text passages for standards-heavy question answering, and keeping
  that graph updated matters more than the retrieval format once the network
  state changes.


  KG-RAG parses 3GPP and O-RAN documents into provenance-tagged triples,
  filters retrieval by predicted ontology type, verbalizes the top-k triples
  into sentences, and prompts GPT-4o-mini. It is evaluated on SPEC5G
  summarization and QA over Tspec-LLM, TeleQnA, and ORAN-Bench-13K against
  LLM-only, passage RAG, self-RAG, and RAPTOR.


  Reported average accuracy gains are 14.3% over RAG and 21.6% over LLM-only.
  Under a stream of injected configuration and telemetry events, dynamic
  updates lift post-change QA accuracy from 72.1% to 84.0% and cut the
  staleness rate from 37.8% to 11.4%, with 5.2 s median and 14.7 s P95
  event-to-answer delay. KG construction takes 24.6/13.8/8.9 min; query
  latency is 860–1080 ms mean.


  The static-vs-dynamic comparison isolates the update mechanism cleanly. The
  main QA and summarization comparisons do not: figures are read off charts,
  no per-dataset numbers are given in text, there is no matched token-budget
  or matched-corpus baseline, and 1 model (GPT-4o-mini) is used throughout.
  Hallucination categories are self-defined and self-scored.


  Treat the dynamic-update result as the usable claim and the headline
  accuracy gains as unaudited.
