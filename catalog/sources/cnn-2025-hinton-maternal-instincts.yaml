notes: "Hinton's Ai4 keynote argument as reported: build maternal instincts
  into superintelligence rather than trying to keep it under control; the
  mother-and-infant case as the only natural example of a weaker agent
  controlling a stronger one Reports Hinton's keynote at the Ai4 conference,
  Las Vegas, 12 August 2025. Author from the page's author meta tag; date is
