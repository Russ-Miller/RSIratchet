summary: >-
  Large language models (LLMs) may abandon correct positions when users push
  back, exhibiting a failure mode known as sycophancy. Existing evaluations
  typically use short, pre-specified conversations and may therefore miss
  failures that emerge under sustained, adaptive disagreement. We introduce
  SPINE, a benchmark in which an LLM proxy plays a persistent but mistaken
  user and adaptively challenges a target model for up to 25 turns. We
