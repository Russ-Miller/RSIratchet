brief: >-
  Frontier VLMs are not reliable reward models for real robot rollouts, and a
  4B/8B model finetuned on targeted reward data beats them. RoboReward builds
  training data by "inverse-HER": taking success-heavy Open X-Embodiment
  demonstrations and generating negatives through counterfactual instruction
  relabeling and temporal clipping, plus organic successes and failures from
  RoboArena on DROID.


  RoboRewardBench covers 2,831 human-verified episodes across 14 embodiment
  types; 22 VLMs predict a 1-5 end-of-episode progress score, scored by MAE.
  RoboReward 8B gets the lowest overall MAE (0.665), ahead of GPT-5 mini
  (0.691), GPT-5 (0.811), Gemini 3 Pro Preview (0.851) and Gemini Robotics-ER
  1.5 (0.906, rank 11). At fixed architecture the gain is 0.892 to 0.665 for
  8B and 1.032 to 0.845 for 4B. In real WidowX RL with DSRL over 20 trials per
  task, RoboReward 8B lifts the base policy from 5% to 50% and 10% to 80%,
  versus 10% and 45% with Gemini Robotics-ER 1.5 and 75% and 90% with human
  rewards.


  Data-mixture ablations on the 4B isolate the augmentation: dropping
  negatives moves overall MAE to 1.450 while RoboArena stays at 0.797. Robot
  results are 2 short-horizon tasks, 1 arm, 1 base policy; per-subset errors
  swing widely (RoboReward 8B hits 1.394 on UTokyo xArm Bimanual). Treat
  offline reward MAE as a usable proxy for downstream RL gains.
