brief: >-
  Frontier vision-language models are unreliable at scoring robot episode
  progress, and a 4B/8B model finetuned on targeted reward data beats them.
  RoboRewardBench asks a model to watch a full rollout video plus its task
  instruction and output a 1-5 progress score, scored by mean absolute error.


  The benchmark covers 2,831 human-verified episodes across 14 embodiments,
  drawn from Open X-Embodiment and RoboArena. Because OXE is nearly all
  successes, negatives were synthesized by counterfactually relabeling videos
  with wrong or near-miss instructions and by clipping successful videos
  early, yielding 54,135 generated examples and a 45,072-pair training set.


  Across 22 VLMs, RoboReward 8B ranks 1 with 0.665 MAE, ahead of GPT-5 mini
  (0.691), GPT-5 (0.811), Gemini 3 Pro (0.851), and Gemini Robotics-ER 1.5
  (0.906, rank 11). Same-architecture gains are isolated: 8B improves on
  Qwen3-VL Instruct 8B by 0.227 MAE. In real WidowX RL with DSRL, RoboReward
  8B lifted success from 5% to 50% and 10% to 80%, versus 75%/90% with human
  rewards and 10%/45% with Gemini Robotics-ER 1.5.


  Ablations show removing negative augmentation costs 1.450 vs 0.845 overall
  while barely changing RoboArena (0.797 vs 0.806). The real-robot test is 2
  short tasks, 20 trials each, 1 robot; long-horizon multi-stage tasks are
  untested, and per-subset errors swing widely even for the best model.


  If you plan RL from VLM rewards, off-the-shelf frontier models are likely
  the weak link.
