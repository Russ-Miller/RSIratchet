brief: >-
  Frontier VLMs are unreliable at scoring how far a robot got on a task, and a
  8B model finetuned on targeted reward data beats all of them.
  RoboRewardBench asks a model to watch a full rollout video plus a task
  instruction and emit a discrete progress score in {1,...,5}, scored by mean
  absolute error against human-verified labels.


  The test set is 2,831 episodes across 14 embodiments, drawn from Open
  X-Embodiment and RoboArena, with negatives synthesized by counterfactually
  swapping in near-miss instructions and by clipping successful videos early.
  22 VLMs were evaluated.


  RoboReward 8B gets 0.665 overall MAE, ahead of GPT-5 mini (0.691), GPT-5
  (0.811), Gemini 3 Pro Preview (0.851) and Gemini Robotics-ER 1.5 (0.906,
  rank 11). Per-subset errors swing hard: GPT-5 scores 0.283 on Austin VIOLA
  but 1.366 on Tokyo PR2; RoboReward 8B itself hits 1.394 on UTokyo xArm
  Bimanual.


  Evidence is measured, with a matched-architecture comparison (Qwen3-VL 8B
  goes 0.892 to 0.665) and data-mixture ablations: dropping negative
  augmentation moves overall MAE to 1.450 while leaving RoboArena nearly
  unchanged (0.797 vs 0.806). Real-robot RL used 2 tasks, 20 trials each, on 1
  WidowX arm: RoboReward 8B lifts success from 5% to 50% and 10% to 80%,
  against human rewards at 75% and 90%, and Gemini Robotics-ER 1.5 at 10% and
  45%.


  Scope is short-horizon, end-of-episode rewards; long-horizon multi-stage
  credit assignment was not tested, and training labels are VLM-generated.


  If you plan to use an off-the-shelf frontier VLM as a robot reward signal,
  expect uneven per-embodiment failure and consider finetuning a small model
  instead.
