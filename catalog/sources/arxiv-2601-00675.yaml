brief: >-
  Frontier VLMs are unreliable as reward models for real robot rollouts, and a
  4B/8B model finetuned on targeted reward data beats them. RoboReward builds
  training data from Open X-Embodiment and RoboArena, using counterfactual
  relabeling (same video, swapped instruction) and temporal clipping to
  manufacture failures and near-misses in a success-heavy corpus, with
  episodes scored on a 1-5 progress rubric.


  RoboRewardBench covers 2,831 human-verified episodes across 14 embodiments;
  22 VLMs were scored by mean absolute error. RoboReward 8B leads at 0.665
  overall, ahead of GPT-5 mini (0.691), GPT-5 (0.811), Gemini 3 Pro (0.851)
  and Gemini Robotics-ER 1.5 (0.906, rank 11). Same-architecture gains: 0.892
  to 0.665 at 8B, 1.032 to 0.845 at 4B. In real WidowX RL with DSRL,
  RoboReward 8B lifted success from 5% to 50% and 10% to 80%, vs 10% and 45%
  for Gemini Robotics-ER 1.5, and 75%/90% for human rewards.


  The causal chain is measured: simulation showed reward MAE correlates with
  RL return (r = 0.83), and data ablations isolate the augmentations (removing
  negatives: 1.450 overall but 0.797 on RoboArena). Real-robot evidence is
  thin: 2 tasks, 20 trials each, 1 robot, short horizons only.


  If you plan RL fine-tuning on real hardware, a small finetuned reward model
  is a better bet than prompting a frontier VLM.
