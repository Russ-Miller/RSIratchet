brief: >-
  Frontier vision-language models are unreliable at scoring robot episode
  progress, and a 4B/8B model finetuned on targeted reward data beats them.
  RoboRewardBench asks a model to assign a 1-5 end-of-episode progress score
  given a task instruction and a rollout video, built from Open X-Embodiment
  and RoboArena, with success-heavy OXE data augmented by counterfactual
  instruction relabeling and temporal clipping to manufacture failures and
  near-misses.


  22 VLMs were evaluated on 2,831 human-verified episodes across 14
  embodiments. RoboReward 8B (finetuned Qwen3-VL) reached the lowest overall
  MAE at 0.665, ahead of GPT-5 mini (0.691), GPT-5 (0.811), Gemini 3 Pro
  (0.851) and Gemini Robotics-ER 1.5 (0.906, rank 11). Per-subset variance is
  large: GPT-5 scores 0.283 on Austin VIOLA but 1.366 on Tokyo PR2; RoboReward
  8B itself hits 1.394 on UTokyo xArm Bimanual.


  Evidence is reasonably isolated. Same-architecture comparisons show the gain
  comes from supervision (8B: 0.892 to 0.665). Ablations show dropping
  negative augmentation moves overall MAE from 0.845 to 1.450 while leaving
  RoboArena nearly unchanged. Real-robot RL on a WidowX arm over 20 trials per
  task: RoboReward 8B lifted success from 5% to 50% and 10% to 80%, versus
  75%/90% with human rewards and 10%/45% with Gemini Robotics-ER 1.5.


  Only 2 short-horizon real tasks, 1 robot platform, and no long-horizon
  multi-stage evaluation. If you were planning to use an off-the-shelf
  frontier VLM as a robot reward signal, this suggests a small finetuned model
  is the better bet.
