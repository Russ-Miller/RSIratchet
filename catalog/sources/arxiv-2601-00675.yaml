brief: >-
  Frontier vision-language models are unreliable at scoring robot episode
  progress, and a 4B/8B model finetuned on targeted reward data beats them.
  RoboReward builds training data by "inverse-HER": successful demonstrations
  are counterfactually relabeled with failed or near-miss instructions, and
  clipped to earlier endpoints to create partial-progress negatives.


  Data comes from Open X-Embodiment and RoboArena; 45,072 training pairs,
  6,232 validation, and a 2,831-sample human-verified test split
  (RoboRewardBench) with task descriptions disjoint across splits. 22 VLMs
  predict a 1-5 end-of-episode progress score, scored by MAE.


  RoboReward 8B ranks 1st at 0.665 overall MAE, ahead of GPT-5 mini (0.691),
  GPT-5 (0.811), Gemini 3 Pro (0.851), and Gemini Robotics-ER 1.5 (0.906, rank
  11). Same-architecture gains: 0.892 to 0.665 at 8B, 1.032 to 0.845 at 4B. In
  real WidowX RL with DSRL, RoboReward 8B lifts success from 5% to 50% and 10%
  to 80% over 20 trials per task, versus 75%/90% for human rewards and 10%/45%
  for Gemini Robotics-ER 1.5.


  Ablations isolate the augmentation: dropping negative augmentation moves
  overall MAE to 1.450 while leaving RoboArena nearly unchanged (0.797 vs
  0.806). The real-robot evidence is 2 tasks, 1 robot, 20 trials each, no
  matched-compute baseline. Per-subset errors swing widely for every model,
  including RoboReward 8B (1.394 on UTokyo xArm Bimanual).


  Treat reward modeling, not RL algorithms, as the current bottleneck for
  real-world robot RL.
