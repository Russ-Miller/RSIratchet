brief: >-
  Frontier VLMs are unreliable at scoring robot episode progress, and a 8B
  model finetuned on targeted reward data beats all of them. RoboReward 8B
  gets the lowest overall mean absolute error on RoboRewardBench, ahead of
  GPT-5, Gemini 3 Pro, and Gemini Robotics-ER 1.5.


  The benchmark covers 2,831 robot episodes across 14 embodiment types, drawn
  from Open X-Embodiment and RoboArena, with each episode scored 1–5 for
  end-state progress and the test split human-verified. Since OXE is
  success-heavy, negatives were synthesized by counterfactually relabeling
  instructions for fixed videos and by clipping successful rollouts early,
  yielding 54,135 generated examples. Qwen3-VL 4B/8B were finetuned on 45,072
  training pairs.


  RoboReward 8B reaches 0.665 MAE vs 0.691 for GPT-5 mini, 0.811 for GPT-5,
  0.906 for Gemini Robotics-ER 1.5. Same-architecture gain: 0.892 to 0.665. In
  real WidowX RL with DSRL, it lifted the base policy from 5% to 50% and 10%
  to 80% over 20 trials per task, against 75%/90% for human rewards and
  10%/45% for Gemini Robotics-ER 1.5.


  Evidence is measured, with data-mixture ablations isolating negative
  augmentation (overall MAE 1.450 without it) and clipping (1.075). Real-robot
  RL is only 2 short-horizon tasks on 1 platform, 20 trials each, no
  multi-seed. Per-subset errors swing widely for every model, including
  RoboReward 8B (1.394 on UTokyo xArm Bimanual).


  If you want automated rewards for real robot RL, small targeted finetunes
  currently beat frontier VLMs.
