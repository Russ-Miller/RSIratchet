brief: >-
  Frontier VLMs are unreliable as reward models for real robot episodes, and a
  4B/8B model finetuned on targeted progress-labelled data beats all of them.
  RoboReward builds training data by "inverse-HER": holding a successful video
  fixed while an LLM swaps in failed or near-miss instructions, plus clipping
  successful rollouts early to make partial-progress negatives, filtered by a
  VLM validator.


  RoboRewardBench scores 22 proprietary and open VLMs on 2,831 human-verified
  episodes from Open X-Embodiment and RoboArena, across 14 embodiments,
  predicting a 1–5 progress label. Training set is 45,072 pairs with task
  descriptions disjoint across splits.


  RoboReward 8B gets the best overall MAE (0.665) vs GPT-5 mini (0.691), GPT-5
  (0.811), Gemini 3 Pro (0.851), Gemini Robotics-ER 1.5 (0.906, rank 11).
  Same-architecture gain is 0.892 to 0.665 at 8B and 1.032 to 0.845 at 4B. In
  real WidowX RL with DSRL, the 8B reward lifts a base policy from 5% to 50%
  and 10% to 80% over 20 trials per task, vs human rewards at 75% and 90% and
  Gemini Robotics-ER 1.5 at 10% and 45%.


  Ablations isolate the augmentation: dropping negatives moves overall MAE to
  1.450 while leaving RoboArena nearly unchanged (0.797 vs 0.806). Per-subset
  errors swing widely for every model, including RoboReward 8B (1.394 on
  UTokyo xArm Bimanual). Only short-horizon, single-stage tasks; real-robot RL
  covers 2 tasks on 1 arm.


  Treat reward modelling, not RL algorithms, as the binding constraint on
  real-world robot RL.
