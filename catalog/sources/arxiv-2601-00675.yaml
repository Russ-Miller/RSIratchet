brief: >-
  Frontier vision-language models are unreliable at scoring robot episode
  progress, and a 4B/8B model finetuned on targeted reward data beats all of
  them. RoboReward builds a reward dataset from Open X-Embodiment and
  RoboArena, with negatives synthesized by counterfactual instruction
  relabeling and by clipping successful videos to earlier endpoints; 45,072
  training pairs, and a human-verified test split (RoboRewardBench) of 2,831
  episodes across 14 embodiments, scored on a 1-5 progress rubric.


  Across 22 VLMs, RoboReward 8B gets the lowest overall MAE (0.665), ahead of
  GPT-5 mini (0.691), GPT-5 (0.811), Gemini 3 Pro Preview (0.851) and Gemini
  Robotics-ER 1.5 (0.906, rank 11). Same-architecture gains are 0.892 to 0.665
  (8B) and 1.032 to 0.845 (4B). In real WidowX RL with DSRL, RoboReward 8B
  lifts the base policy from 5% to 50% and 10% to 80% over 20 trials per task,
  versus 75%/90% for human rewards and 10%/45% for Gemini Robotics-ER 1.5.


  Evidence includes matched-backbone comparisons and data-mixture ablations:
  dropping negative augmentation moves overall MAE to 1.450 while leaving
  RoboArena nearly unchanged (0.797 vs 0.806).


  Limits: 2 real tasks, 1 robot, short-horizon episodic rewards, and
  per-subset errors swing widely even for the best model (1.394 on UTokyo xArm
  Bimanual).


  If you assumed embodied-trained frontier models already suffice as reward
  signals, this argues otherwise.
