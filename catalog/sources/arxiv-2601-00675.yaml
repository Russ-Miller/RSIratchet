brief: >-
  Frontier VLMs are not reliable reward models for real robot rollouts, and a
  4B/8B model finetuned on targeted reward data beats them. RoboReward builds
  training data by counterfactually relabeling successful Open X-Embodiment
  episodes with wrong or near-miss instructions and by clipping videos to
  earlier endpoints, yielding partial-progress negatives, plus RoboArena
  rollouts with human progress scores.


  Models predict a 1-5 end-of-episode progress score; RoboRewardBench holds
  2,831 human-verified test episodes across 14 embodiments, with 22 VLMs
  evaluated by mean absolute error. Training set is 45,072 episode-reward
  pairs; the base models are Qwen3-VL 4B and 8B.


  RoboReward 8B reaches 0.665 MAE overall, ahead of GPT-5 mini (0.691), GPT-5
  (0.811), Gemini 3 Pro Preview (0.851) and Gemini Robotics-ER 1.5 (0.906).
  Same-architecture gain is 0.892 to 0.665 at 8B and 1.032 to 0.845 at 4B. In
  real WidowX RL with DSRL, RoboReward 8B lifted success from 5% to 50% and
  10% to 80%, versus 10% and 45% with Gemini Robotics-ER 1.5, and 75% and 90%
  with human rewards.


  The architecture-matched comparison and the data-mixture ablations isolate
  the cause: dropping negative augmentation moves overall MAE to 1.450 while
  leaving RoboArena nearly unchanged (0.797 vs 0.806). Real-robot evidence is
  2 tasks, 20 trials each, 1 robot, short-horizon only; per-subset errors
  swing widely, and RoboReward 8B is weak on some subsets (1.394 on UTokyo
  xArm Bimanual). Treat offline reward MAE as a usable proxy for downstream RL
  gains, with long-horizon tasks untested.
