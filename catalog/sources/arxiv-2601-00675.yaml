brief: >-
  Frontier VLMs are unreliable at scoring robot episode progress, and a 8B
  model finetuned on targeted reward data beats all of them. RoboReward builds
  a reward dataset from Open X-Embodiment and RoboArena, filling the gap of
  failure examples by counterfactually relabeling successful videos with wrong
  or near-miss instructions and by clipping rollouts to create
  partial-progress outcomes.


  RoboRewardBench evaluates 22 proprietary and open VLMs on 2,831
  human-verified episodes across 14 embodiments, scoring end-of-episode
  progress on a 1-5 rubric, measured by mean absolute error. RoboReward 8B
  (Qwen3-VL finetuned on 45,072 pairs) ranks 1 at 0.665 MAE, ahead of GPT-5
  mini (0.691), GPT-5 (0.811), Gemini 3 Pro (0.851) and Gemini Robotics-ER 1.5
  (0.906, rank 11). Same-architecture gain over Qwen3-VL Instruct 8B is 0.227
  MAE.


  The causal chain is measured, not just argued. Data ablations isolate the
  augmentation: dropping negatives raises overall MAE to 1.450 while leaving
  RoboArena nearly unchanged (0.797 vs 0.806). In real RL on a WidowX arm with
  DSRL, RoboReward 8B lifts success from 5% to 50% and 10% to 80% on 2 tasks
  over 20 trials, versus 75%/90% with human rewards and 10%/45% with Gemini
  Robotics-ER 1.5.


  The robot trial count is small, 2 tasks on 1 platform, and performance is
  uneven per subset: RoboReward 8B scores 1.394 on UTokyo xArm Bimanual.
  Long-horizon multi-stage tasks were not tested.


  If you planned to use an off-the-shelf frontier VLM as a robot reward, a
  small finetuned model is likely cheaper and better.
