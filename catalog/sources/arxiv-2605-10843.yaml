brief: >-
  Disagreement among culturally grounded persona prompts, not their consensus,
  is a usable steering signal for moral alignment at inference time. DISCA
  instantiates each country as 4 World-Values-Survey-grounded persona agents,
  converts the spread of their decision-token logit gaps into a bounded,
  loss-averse correction, and shrinks that correction toward zero when 2
  independent half-budget passes disagree.


  Evaluation covers 20 countries on MultiTP (Moral Machine trolley dilemmas, 6
  attributes), with misalignment measured as L2 distance to human AMCE
  vectors, plus an open-ended track and BLEnD factual QA. 28 model-method
  combinations across 12 architectures from 270M to 70B were swept; 7
  open-weight backbones are reported.


  Macro MIS falls 10-24% on the 6 backbones at or above 3.8B, 3.4% on a 2B
  model, and 2-7% on open-ended scenarios. Phi-4 (14B) reaches 0.346 MIS,
  below vanilla Llama-3.3-70B. On the Phi-4 grid DISCA beats PRISM-style
  prompting (0.384), MC-Dropout (0.403), activation steering (0.430), and 2
  oracle baselines fitted on human AMCEs (0.506, 0.513).


  Evidence is measured, with 3 seeds, 9 robustness checks, and a 4-way
  ablation; removing personas costs the most (16-18 of 20 countries hurt per
  backbone). No reward-guided decoding baseline, and gains come from a metric
  that is a survey statistic, not legitimacy.


  It does not transfer to factual recall, and costs roughly 4x vanilla
  latency. Useful if you need per-country value calibration without weights or
  training data.
