brief: >-
  Disagreement between culturally grounded personas, not their consensus,
  carries the steering signal for country-level moral alignment, and
  exploiting it at decoding time beats prompting, activation steering, and
  even oracle-calibrated scalar corrections.


  DISCA instantiates each country as 4 World-Values-Survey-grounded persona
  agents (3 age cohorts plus a country aggregate), converts within-panel
  variance of decision-token logit gaps into a bounded loss-averse correction,
  and shrinks it when 2 independent half-budget passes disagree. Evaluation is
  on MultiTP trolley scenarios against Moral Machine human AMCE vectors, 20
  countries, 7 open-weight backbones from 5 families (2B-70B), with an
  open-ended track and BLEnD factual QA.


  Macro misalignment drops 10-24% on the 6 backbones at or above 3.8B, 3.4% on
  the 2B model, and 2-7% on open-ended scenarios. On the Phi-4 grid DISCA
  reaches 0.346 MIS versus 0.454 vanilla, 0.430 activation steering, and
  0.506-0.513 for oracle margin/temperature scaling. Phi-4 (14B) with DISCA
  beats vanilla Llama-3.3-70B.


  Measured, with a 4-choice ablation on 3 backbones isolating persona
  diversity as the dominant component (16-18 of 20 countries hurt when
  removed), 3 seeds, and matched compute for the dual-pass gate. Baselines are
  run on 1 backbone only.


  It does not transfer to factual recall, needs decision-token logprobs, costs
  roughly 4x vanilla latency, and some 30B+ models degrade.


  If you serve a black-box model globally, logit-level persona disagreement is
  a cheaper lever than per-country tuning.
