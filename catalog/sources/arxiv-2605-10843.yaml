brief: >-
  Disagreement among demographic personas, not their consensus, is the useful
  steering signal for making a frozen model match a country's moral
  preferences at inference time. DISCA instantiates each country as 4
  World-Values-Survey-grounded persona agents, converts the spread of their
  decision-token logit gaps into a bounded loss-averse correction, and shrinks
  that correction toward zero when 2 independent passes disagree.


  Evaluation is on MultiTP, the multilingual Moral Machine trolley benchmark,
  scored as l2 distance (MIS) between model and human AMCE vectors over 20
  countries and 7 open-weight backbones from 2B to 70B.


  Macro MIS falls 10-24% on the 6 backbones at or above 3.8B, 3.4% on the 2B
  model, and 2-7% on open-ended scenarios. On the Phi-4 grid DISCA reaches
  0.346 against 0.454 vanilla, 0.384 for a PRISM-style prompt, 0.430 for
  activation steering, and even beats 2 oracle baselines fit on human AMCEs
  (0.506, 0.513). Phi-4 with DISCA beats a vanilla 70B.


  Evidenced with a 4-component ablation on 3 backbones (removing personas is
  the largest loss, 16-18 of 20 countries hurt), 3 seeds, and per-country
  wins. All backbones are open-weight; results depend on access to
  decision-token logits.


  It does not transfer to factual cultural QA on BLEnD, costs roughly 4x
  vanilla latency, and aligns to a survey statistic rather than judged
  legitimacy.


  If you need per-country value calibration without training, treat ensemble
  variance as a gate rather than noise.
