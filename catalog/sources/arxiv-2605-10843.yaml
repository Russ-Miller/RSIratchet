brief: >-
  Disagreement between culturally grounded personas, not their consensus, is
  the usable steering signal: scaling a logit correction down when personas
  diverge improves country-level moral alignment without any weight updates.
  This inverts the ensemble convention of treating spread as noise.


  DISCA instantiates each country as 4 World-Values-Survey-grounded persona
  agents (3 age cohorts plus a country-wide aggregate), converts the panel's
  logit-gap variance into a bounded, loss-averse correction via
  prospect-theoretic importance sampling, and gates it by running the sampler
  twice on disjoint sub-budgets. Evaluation is on MultiTP trolley scenarios,
  misalignment measured as L2 distance to human Moral Machine AMCE vectors,
  over 20 countries and 7 open-weight backbones (2B-70B) from 5 families.


  Macro MIS falls 10-24% on the 6 backbones at or above 3.8B, 3.4% on the 2B
  model, and 2-7% on open-ended scenarios. Phi-4 (14B) with DISCA reaches
  0.346 MIS, below vanilla Llama-3.3-70B. On the Phi-4 grid it beats every
  training-free baseline (PRISM prompt 0.384, activation steering 0.430,
  vanilla 0.454) and 2 oracle baselines fitted on human AMCE (0.506, 0.513).


  Evidence includes a 4-way ablation across 3 backbones (removing personas
  costs the most, +.047 to +.061 MIS), 3 seeds, and a compute-matched
  dual-pass design. The comparison is against the paper's own baseline
  implementations; no independent replication.


  It does not transfer to BLEnD factual cultural QA, needs decision-token
  logprobs, costs roughly 4x vanilla latency, and some 30B+ models degrade.


  If you serve many countries from one frozen model, this is the cheapest
  intervention with a measured effect.
