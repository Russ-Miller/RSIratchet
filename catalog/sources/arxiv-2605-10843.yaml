brief: >-
  Disagreement between demographic personas, not their consensus, is the
  useful signal for steering a frozen model toward a country's moral
  preferences at inference time. DISCA instantiates each country as 4
  World-Values-Survey-grounded persona agents (3 age cohorts plus a country
  aggregate), reads the decision-token logit gap from each, and converts
  within-panel variance into a bounded, loss-averse correction that shrinks
  toward zero when 2 independent half-budget passes disagree.


  On MultiTP, the multilingual Moral Machine trolley benchmark, across 20
  countries and 7 open-weight backbones (2B-70B, 5 families), macro
  misalignment drops 10-24% on the 6 backbones at or above 3.8B, 3.4% on the
  2B Gemma, and 2-7% on open-ended scenarios. Phi-4 (14B) with DISCA reaches
  0.346 MIS, below vanilla Llama-3.3-70B. On the Phi-4 grid DISCA beats every
  training-free baseline (PRISM prompt 0.384, MC-Dropout 0.403, activation
  steering 0.430, vanilla 0.454) and 2 oracle baselines that fit a per-country
  scalar on human AMCEs (0.506, 0.513).


  Evidence is measured, with a 4-way ablation on 3 backbones isolating the
  persona panel as the dominant component (removing it hurts 16-18 of 20
  countries), 3 seeds, and matched compute for the dual pass. Self-run, no
  independent replication; latency is about 4x vanilla.


  It does not transfer to factual cultural QA on BLEnD, needs logprob access,
  and some 30B+ models degrade. Treat panel variance as a reliability
  statistic, not noise to average out.
