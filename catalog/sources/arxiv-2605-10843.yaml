brief: >-
  Disagreement between demographic personas, not their consensus, carries the
  steering signal for cultural alignment: the spread of persona logit gaps
  tells you how much of a correction to apply, and shrinking the correction
  when personas disagree beats applying the average.


  DISCA instantiates each country as 4 World-Values-Survey-grounded persona
  agents (3 age cohorts plus a country aggregate), converts their within-panel
  variance into a bounded, loss-averse logit correction via Prospect-Theory
  importance sampling, and gates it with a dual-pass agreement check.
  Evaluation is on MultiTP, the multilingual Moral Machine trolley benchmark,
  against country-level human AMCE vectors, over 20 countries and 7
  open-weight backbones from 5 families (2B-70B).


  Macro misalignment falls 10-24% on the 6 backbones at 3.8B or larger, 3.4%
  on the 2B model, and 2-7% on open-ended scenarios. On the Phi-4 grid DISCA
  reaches 0.346 MIS versus 0.454 vanilla, 0.384 for a PRISM-style prompt,
  0.430 for activation steering, and even beats oracle baselines fit on human
  AMCEs (0.506, 0.513). Phi-4 with DISCA undercuts a vanilla 70B.


  Effects are measured with 3 seeds, 9 robustness checks, and a component
  ablation: removing personas costs the most (+.047-.061 MIS, hurting 16-18 of
  20 countries), the gate and debiasing less.


  It does not transfer to factual recall: on BLEnD cultural QA there is no
  gain, since corrections tuned for a scalar logit gap become noise over a
  ~32k vocabulary. It also needs decision-token logprobs, costs roughly 4x
  vanilla latency, and some 30B+ models degrade.


  If you serve many countries behind an API that returns logprobs, this is a
  cheap value-steering knob, but only for forced-choice decisions.
