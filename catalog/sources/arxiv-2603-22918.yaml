summary: Video understanding with multimodal large language models (MLLMs)
  remains challenging due to the long token sequences of videos, which contain
  extensive temporal dependencies and redundant frames. Existing approaches
  typically treat MLLMs as passive recognizers, processing entire videos or
  uniformly sampled frames without adaptive reasoning. Recent agent-based
  methods introduce external tools, yet still depend on manually designed
  workflows and perception-first strategies, resulting in inefficiency on long
  videos. We present EVA, an Efficient Reinforcement Learning framework for
  End-to-End Vid
