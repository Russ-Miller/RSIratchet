brief: >-
  Letting a video model plan before it looks at any frames, then choosing its
  own temporal window, frame count and resolution, cuts visual tokens by more
  than an order of magnitude while matching or beating dense uniform sampling.
  EVA builds this on Qwen2.5-VL-7B-Instruct, trained in 3 stages: SFT on 10k
  synthetic summary-plan-action-reflection trajectories, KTO on 11k labelled
  success/failure frame-selection strategies, then GRPO on 9.6k open-ended and
  1.1k multiple-choice QA, on 32 H100 GPUs.


  On LSDBench, EVA reaches 51.0 with 10.3k visual tokens, against Qwen2.5-VL
  at 52.5 with 499.2k tokens and Gemini-2.0-Flash at 56.2 with 696.6k.
  EVA-GRPO scores 55.0 on LongVideoBench, 68.3 on MLVU, 48.4/60.2 on
  VideoMME-Long/Overall, 43.3 on LVBench, and 37.2 zero-shot on Video-Holmes,
  above FrameThinker and Video-R1 at comparable effective frame counts.


  The stage ablation is measured: SFT uses the most frames and rounds and
  scores lowest, KTO cuts both, GRPO cuts frames further but raises rounds and
  scores highest. A data-composition ablation shows mixed multiple-choice plus
  open-ended GRPO data beats either alone on VideoMME. Frame counts for EVA
  are estimated by assuming 650 tokens per frame, not counted; baselines are
  cited from another paper rather than rerun. 1 base model, 1 model size.


  The prose reports 51.8 at 6.2K tokens while Table 1 lists 51.0 at 10.3k, so
  treat the efficiency headline as approximate.
