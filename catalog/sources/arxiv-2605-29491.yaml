brief: >-
  Bigger models are worse at ignoring instruction-like noise buried in
  reference text. Scaling makes them more eager to treat editorial comments,
  TODO notes and UI residues as commands rather than as passive data.


  DistractionIF embeds 3 low-salience distractor intents (sampled from a pool
  of over 40) inside delimited reference text for tasks like translation,
  extraction and format conversion, rendered into 3 paradigms: single-turn,
  multi-turn, and system-prompt-driven. Scoring is conjunctive over 5 binary
  rubric items, judged by GPT-4o; models span Qwen3 0.6B-235B, DeepSeek v3.2,
  Kimi-k2, GPT-5.1 and Gemini-3-Pro.


  In Qwen3 non-thinking mode, macro-average pass rate falls from 65.97 at 0.6B
  to 37.6 at 235B-A22B, consistent across all 3 paradigms. Perplexity analysis
  on 131 canonical failure cases shows the robustness margin ratio (PPL of bad
  path over gold path) compressing from 2.24 at 0.6B to 1.30 at 32B. GRPO on
  2,000 single-turn instances lifts Qwen3-8B from 54.00 to 66.00 single-turn
  and 60.00 to 75.50 system-prompt, with IFEval 82.07 to 82.99.


  The scaling trend is measured, but only cleanly within 1 family; the authors
  concede MoE architecture and scale are confounded in the thinking-mode
  reversal, and RL was tested on 1 model at 1 size with no
  alternative-training baseline. Judge validity rests on a
  200-instance-per-model manual audit.


  If you build RAG or agent pipelines, do not assume the stronger model
  handles dirty context better.
