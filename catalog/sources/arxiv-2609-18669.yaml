summary: >-
  Multi-Modal Motion Planning (M$^3$P) requires joint reasoning over
  continuous motions and discrete mode transitions, making it difficult to
  solve efficiently. For instance, a bipedal robot may walk to a target
  location and then use its arms to grasp an object. This scenario captures
  both mode transitions and continuous dynamics, yielding feasible paths
  that neither purely discrete nor continuous planners can handle. While
