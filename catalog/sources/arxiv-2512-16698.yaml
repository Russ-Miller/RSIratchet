brief: >-
  Splitting diagram-grounded geometry into a perception agent and a reasoning
  agent helps weaker open-source models and mostly hurts a strong proprietary
  one. The gain comes from the interpreter's quality, not from decomposition
  itself.


  The pipeline, Interpreter-Solver, has a VLM emit formal predicates from the
  diagram and question, then an LLM solve from those predicates alone. Tested
  zero-shot on Geometry3K (601 test problems), MathVerse (788 mini-test),
  OlympiadBench, and We-Math, with Qwen-2.5-VL 7B/32B (4-bit) and
  Gemini-2.0-Flash; Phi-4 and Qwen3-8B also serve as solvers.


  Multi-agent gives Qwen-2.5-VL 7B +6.8 on Geometry3K and +9.4 on
  OlympiadBench, 32B +3.3 and +6.67. Gemini-2.0-Flash loses in multi-agent
  mode on Geometry3K (83.86% vs 85.19%), MathVerse (-0.45) and OlympiadBench
  (-2.46), gaining only +1.74 on We-Math. Qwen 7B drops -6.0 on MathVerse.


  An interpreter ablation isolates the cause: with Qwen-2.5-7B as interpreter
  the Qwen-3 solver reaches 42.26%, rising to 79.53% with Gemini. A
  cosine-similarity check on predicate fidelity tracks the same ordering
  (Gemini 0.849, GPT-4o mini 0.794, Qwen-2.5 0.677).


  All interpreters in the main table are Gemini, so open-source "gains" partly
  reflect a stronger perception model. Zero-shot only, fixed prompts, 4-bit
  quantization, free-form scoring by Gemini-as-judge.


  Treat agentic decomposition as a way to borrow a better perception model,
  not a general win.
