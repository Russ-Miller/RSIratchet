brief: >-
  Splitting diagram-grounded geometry into a perception agent and a reasoning
  agent helps weaker open-source models and mostly hurts a strong proprietary
  one. The gain tracks the quality of the perception step, not the existence
  of decomposition.


  The pipeline, Interpreter-Solver, has a VLM emit formal literals from the
  diagram and question, then an LLM solve from those literals plus the
  question. Zero-shot, frozen weights, 4-bit quantized open models, evaluated
  on Geometry3K (601 test problems), MathVerse (788 mini-test), OlympiadBench,
  and We-Math, with Qwen-2.5-VL 7B/32B and Gemini-2.0-Flash; Phi-4 and
  Qwen3-8B serve as solvers.


  Qwen-2.5-VL 7B gains +6.8 on Geometry3K and +9.4 on OlympiadBench; 32B gains
  +3.3 and +6.67. Gemini-2.0-Flash loses on Geometry3K (83.86% vs 85.19%),
  MathVerse (-0.45) and OlympiadBench (-2.46), but gains +1.74 on We-Math.
  Qwen 7B drops -6.0 on MathVerse.


  The interpreter ablation isolates the cause: holding solvers fixed, accuracy
  rises from 35.77%/42.26% with a Qwen-2.5 7B interpreter to 70.05%/79.53%
  with Gemini, matching embedding-similarity scores of 0.677 vs 0.849 for
  extracted predicates.


  Comparisons to prior work (AutoGPS 81.6%, OpenVLThinker 47.9%) are
  cross-paper, not matched-compute. Only 2 model families, 1 prompting setup,
  no fine-tuning, no full-precision open models, Pass@3 scoring, and free-form
  grading by Gemini-as-judge.


  Treat agentic decomposition as a fix for weak visual parsing, not a default.
