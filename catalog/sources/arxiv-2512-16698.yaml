brief: >-
  Splitting diagram-grounded geometry into a perception agent and a reasoning
  agent helps weaker open-source models and mostly hurts a strong proprietary
  one. Decomposition is not free structure; it is a substitute for perception
  the model already has.


  The pipeline is Interpreter-Solver: a VLM emits formal predicates from the
  diagram and question, then an LLM solves from those literals only. Compared
  against the same model doing end-to-end single-agent zero-shot inference on
  Geometry3K (601 multiple-choice test problems), MathVerse (788 mini-test),
  OlympiadBench and We-Math, with Qwen-2.5-VL 7B/32B (4-bit) and
  Gemini-2.0-Flash.


  Qwen-2.5-VL 7B gains +6.8 on Geometry3K and +9.4 on OlympiadBench; 32B gains
  +3.3 and +6.67. Gemini-2.0-Flash loses on Geometry3K (83.86% vs 85.19%),
  MathVerse (-0.45) and OlympiadBench (-2.46), gaining only on We-Math
  (+1.74). Qwen 7B drops -6.0 on MathVerse.


  The cause is isolated by an Interpreter-swap ablation: accuracy rises
  monotonically from 35.77%/42.26% (Qwen-2.5-7B interpreter) to 70.05%/79.53%
  (Gemini), and predicate-description cosine similarity tracks it (0.849
  Gemini, 0.677 Qwen-2.5). All multi-agent runs fix the Interpreter to
  Gemini-2.0-Flash, so the open-source gains partly import a stronger
  perceiver.


  Zero-shot only, frozen weights, fixed prompts, 4-bit open models, 2 model
  families, free-form scoring by Gemini-as-judge.


  Treat agentic decomposition as a perception crutch to be selected per model,
  not a default.
