summary: >-
  Physical AI requires more than increasingly large robot datasets:
  intelligent robots acquire knowledge through continuous interaction with
  the physical world. We argue that the defining scientific resource of
  Physical AI is therefore not raw robot data alone, but robot experience -
  physically grounded interaction whose observations, actions, embodiment,
  context, and outcomes preserve the perception-action-consequence loop. We
  introduce the Robot Data Factory (RDF), a mission-driven infrastructure
  and methodology for continuously generating, validating, benchmarking, and
  reusing such experience
