summary: >-
  Prompt injection is ranked as the most critical vulnerability in large
  language model (LLM) deployments by the OWASP Top 10 for LLM Applications,
  yet existing defenses operate at isolated pipeline stages and remain
  incomplete. Input filters cannot inspect retrieved documents, while output
  monitors cannot prevent malicious payloads from reaching the model.
