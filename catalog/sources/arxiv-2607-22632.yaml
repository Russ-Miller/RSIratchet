summary: >-
  The rapid rise of vlogs as a personalized storytelling medium has created
  a demand for automated systems to evaluate and refine vlog editing plans.
  However, vlog assessment is highly subjective and remains challenging due
  to a lack of standardized criteria, dataset and benchmark, and effective
  reward models. To address these challenges, we define a comprehensive vlog
  evaluation framework guided by professional vlog creators and product
  managers, establishing a taxonomy of six key dimensions, i.e., Creativity,
  Consistency, Concept Design, Cinematography, Narration, and Pacing.
