brief: >-
  Most of the gain in secure code generation comes from pairing LLMs with a
  static analyzer, not from having LLMs check each other. Multi-LLMSecCodeEval
  runs 10 pipelines (single-model, ensemble, LLM-only collaborative, hybrid)
  over generation, detection and patching, using CodeLLaMA-7B, Mistral-7B,
  Meta-LLaMA, GPT-3.5 and GPT-4o on SecLLMEval (112 samples, 38 C, 74 Python)
  and SecLLMHolmes (106 samples, 69 C, 37 Python), with CodeQL as the final
  judge.


  Ensembles filtered by CodeQL beat the single-model baseline by up to 47.3%
  on SecLLMEval and 19.3% on SecLLMHolmes; LLM-only collaboration
  (cross-verification, majority voting, chain-of-debate) gained 8.9-22.3% on
  SecLLMEval and was flat or negative on SecLLMHolmes (P6 down 1.42%, P9 down
  0.47%). The hybrid P10 reached 97.32% and 99.06%, and a P10 of 3 small
  models left 3.6% and 1.9% insecure versus 12.5%/27.4% for GPT-OSS and
  43.8%/30.2% for Gemma-27B. Detection stayed weak: single-model
  precision/recall/F1 under 0.35, best ensembles F1 0.36-0.37.


  The pipeline comparison is measured and holds model and evaluator choice
  fixed, and a tool ablation swapping CodeQL for Bandit shows Bandit marks
  every Python sample secure, so Secure% tracks analyzer rigor as much as
  model behavior. Only C and Python, small curated benchmarks, no functional
  correctness check, 1 primary analyzer.


  If you orchestrate LLMs for security, spend effort on the verifier, not on
  more debate rounds.
