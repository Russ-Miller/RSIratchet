brief: >-
  Models can tell that a question is unanswerable far more reliably than they
  can tell that they themselves cannot answer it, and reasoning-mode variants
  are worse at the latter despite higher accuracy.


  UA-Bench frames abstention as a 3-way decision: answer, "Data Uncertain"
  (ambiguous or underspecified input), or "Model Uncertain" (well-posed but
  beyond the model). It draws over 3,500 questions from 6 datasets, GAIA,
  MuSiQue and SelfAware for knowledge-intensive, OlympiadBench-math and
  GSM8K/MATH-MiP for reasoning-intensive, and evaluates 18 frontier models.


  On knowledge tasks Qwen3-8B reaches 69.8% DU-F1 against 4.0% MU-F1; Gemini 3
  Flash 72.0% versus 29.0%. Accuracy does not predict attribution:
  Qwen3-4B-Instruct hits 72.3% accuracy on reasoning with 23.3% MU-F1, and
  Qwen3-235B-A22B's thinking variant raises reasoning accuracy to 80.0% while
  MU-F1 collapses from 84.8% to 0.0%. GRPO training on 5,000 synthetic math
  rewrites lifts Qwen3-4B-Instruct reasoning MU-F1 to 53.5% and Qwen3-8B to
  60.8% without hurting accuracy.


  The RL result includes a matched baseline trained only on answerable data,
  which degrades attribution (AVG-F1 17.3). Prompt ablations show attribution
  does not change which questions are refused. Only 2 models were trained, 1
  family, and model uncertainty is defined by the model's own errors, so
  labels shift with capability. Compound cases, where ill-posedness is itself
  unrecognizable, are excluded.


  If you depend on refusal to route to clarification versus tool use, that
  routing signal is currently unreliable.
