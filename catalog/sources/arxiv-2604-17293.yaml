summary: Reliable Large Language Models (LLMs) should abstain when confidence
  is insufficient. However, prior studies often treat refusal as a generic "I
  don't know'', failing to distinguish input-level ambiguity (data
  uncertainty) from capability limitations (model uncertainty). This lack of
  distinction limits downstream action decisions like requesting clarification
  or invoking external tools. In this work, we introduce UA-Bench, a benchmark
  of over 3,500 questions drawn from six datasets spanning knowledge-intensive
  and reasoning-intensive tasks, designed to evaluate explicit uncertainty
  attribution
