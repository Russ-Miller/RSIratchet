brief: >-
  Omission, not fabrication, is the dominant hallucination mode in
  LLM-generated bug report summaries, and it is also the mode detectors miss.
  In an exploratory check on 80 Mozilla bug reports summarized by Llama 3.2,
  47.9% of summaries contained missing information while only 12.3% contained
  fabricated content, with 3 annotators at Cohen's Kappa = 0.85.


  The authors built a benchmark from the BugsRepo structured subset (10,304
  reports), converted structured reports to narrative form with Mistral-7B,
  filtered with a modified PARENT metric (threshold 0.50 retained 7,768
  reports, 75.39%), and injected controlled add/remove/reorder hallucinations
  into Steps-to-Reproduce, Actual Behavior and Expected Behavior. A multitask
  LoRA detector jointly predicts report-level hallucination, affected section,
  and type.


  Fine-tuned Ministral-3B reached 0.898 report accuracy, 0.846 section
  micro-F1 and 0.836 type macro-F1, against prompting baselines that topped
  out at 0.683 report accuracy. Scale did not help: Mistral-7B and LLaMA-8B
  scored slightly lower. Removal hallucinations stayed hard, F1 0.525 with
  recall 0.383, and 73 of 163 errors (44.8%) were missed implicit or omitted
  information.


  Hallucinations are synthetic, so detection numbers are on injected
  perturbations, not organic model errors; prompting comparisons are present
  but fine-tuning gets the data advantage. 1 dataset, 1 bug tracker, no
  real-world annotated test set.


  If you are building a faithfulness guardrail for technical summaries, budget
  your effort on detecting what was dropped.
