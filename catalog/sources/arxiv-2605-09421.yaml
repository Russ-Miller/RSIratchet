brief: >-
  Structuring an LLM's authorship judgment as explicit belief revision, rather
  than parallel agent debate, is what makes multi-agent code authorship
  verification hold up across datasets and language pairs.


  MACAA pairs a Coordinator with 4 Expert Agents (layout, lexical, syntactic,
  programming-pattern) and runs AGM-style expansion, contraction, and revision
  over their reports. All agents and the 5 LLM baselines use
  Qwen3-80B-Instruct at temperature 0.1 with identical tool budgets;
  comparison also includes 3 supervised methods on GCJ C++, GitHub Java,
  GitHub C (500 balanced pairs each) and CodeNet cross-language pairs (200 per
  pair).


  MACAA reaches 89.15% F1 on GCJ C++ and 74.84% on GitHub C, versus MAS-Debate
  at 52.38% and 49.86%, but loses on GitHub Java (85.37% vs 88.10%).
  Cross-language, it holds 69.06%–76.39% across divergence levels and 80.00%
  on 500 mixed pairs, against 19.20%–50.00% for all baselines. Ablations:
  removing expansion collapses F1 to 19.35%/11.11%; removing revision drops
  cross-language F1 to 61.82%.


  The shared backbone and matched tool budget isolate architecture from model
  capability, and the ablation is run on the same splits. But it is 1 model
  family, 1 scale, high-resource languages only, no obfuscated or enterprise
  code, and no accounting of the extra LLM calls, so cost-adjusted gains are
  unknown.


  Treat agent debate as insufficient on its own; the evidence-reweighting step
  is where the gain sits.
