brief: >-
  Organizing multi-agent reasoning around explicit belief operations, rather
  than around parallelism or debate, is what makes LLM code authorship
  verification stable across heterogeneous code pairs. MACAA pairs a
  Coordinator with 4 Expert Agents (layout, lexical, syntactic, programming
  pattern) and labels its stages with the AGM operations expansion,
  contraction, and revision, all training-free.


  Evaluation uses 500 balanced pairs each from GCJ C++, GitHub Java, GitHub C,
  plus CodeNet cross-language pairs at 200 pairs per language pair and a
  500-pair mixed set, against 8 baselines including supervised Stylo-ML,
  Forsee, CLAVE and LLM Direct, chain-of-thought, ReAct, MAS-Pipeline,
  MAS-Debate.


  MACAA reaches 89.15% F1 on GCJ C++ and 74.84% on GitHub C, but loses on
  GitHub Java (85.37% vs MAS-Debate 88.10%). Cross-language it holds
  69.06%–76.39% and 80.00% on the mixed set, where baselines span 19.20% to
  50.00%.


  The ablation is the strongest evidence: removing expansion collapses F1 to
  19.35% / 11.11%, removing revision to 77.61% / 61.82%. Expansion's removal
  also disables the rest of the chain, so it is not cleanly isolated. LLM
  baselines share the backbone and tool budget; agent weight shifts (Pattern
  0.4810 cross-language vs Syntactic 0.0671) are reported without a
  fixed-weight control.


  Only Qwen3-80B-Instruct was tested, only high-resource languages, no
  obfuscated or enterprise code, and the extra LLM-call cost is unquantified.


  Treat this as evidence that evidence-reliability calibration, not agent
  count, drives cross-language authorship gains.
