summary: "Code authorship attribution (CAA) supports software forensics,
  plagiarism detection, and intellectual property protection. However,
  existing supervised CAA approaches suffer from scarce training data and
  closed-world assumptions: they require sufficient labeled code from fixed
  candidate-author sets, making training difficult in low-data cases and
  predictions unreliable for open-world test pairs with unseen samples, or
  heterogeneous code pairs. Large language models remove task-specific
  training, but direct prompting depends on costly expert-designed prompts,
  can hallucinate over complex hetero"
