summary: "Personal AI stacks, like OpenClaw and Hermes Agent, are becoming
  central to daily work, yet they route nearly every query (often over
  sensitive local data) to cloud-hosted frontier models. Replacing frontier
  models with local models inside existing stacks does not work: swapping
  Claude Opus 4.6 for Qwen3.5-9B drops accuracy by 25-39 pp across personal AI
  tasks like PinchBench and GAIA. Existing stacks bundle agentic prompts, tool
  descriptions, memory configuration, and runtime settings around a specific
  cloud model. Only the prompts can be tuned, and state-of-the-art prompt
  optimizers close just 5 pp of the local-cloud gap on their own. This
  motivates a decomposed personal AI stack: one that exposes individual
  primitives which can be optimized individually or jointly to close the
  local-cloud gap. We present OpenJarvis, an architecture that represents a
  personal AI system as a typed spec …"
