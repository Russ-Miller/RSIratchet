  post-training paradigm that improves policy optimization through dense
  token-level supervision from a privileged self-teacher. Despite its
  promise, OPSD remains largely underexplored for Video Large Language
  Models (Video-LLMs). Existing methods typically construct privileged
  teachers by augmenting their context with additional information while
  keeping the primary input unchanged for both teacher and student. Video
