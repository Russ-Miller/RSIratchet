brief: >-
  Showing a vision model the rendered frames of a physics animation, rather
  than the code that produced it, catches physics errors that execution-based
  testing cannot. The claim here is demonstrated, not measured against a
  controlled baseline.


  The system is a 4-agent pipeline on Claude Sonnet 4.5 and Haiku 4.5: a
  natural language interpreter, a requirements generator that rescales physics
  parameters for 24 FPS animation, a matplotlib code generator with
  self-correction over up to 5 attempts, and a validator that runs the
  animation, captures 8 PNG frames at uniform intervals, and asks the vision
  model for PASS/FAIL/UNCERTAIN per criterion. 10 scenarios across 7 domains,
  from FDTD electromagnetics and Rayleigh-Taylor instability to SE Asia
  population growth.


  The perceptual validator rated the pipeline at 91% average physics accuracy,
  with 86% of scenarios hitting the >=85% threshold, at roughly $0.20 per
  animation. Single-shot generation failed in 3 of 4 compared scenarios, with
  checkerboard instability in FDTD and missing vortex shedding in CFD.


  Evidence is weak. The accuracy score comes from the system's own validator,
  the single-shot baseline is a 40% figure borrowed from a GPT-4 paper on
  different problems, the visual comparison is author-judged on 4 cases, and
  the authors concede larger samples are needed. 1 model family, 2D matplotlib
  only.


  Treat this as an architecture sketch, not a measurement.
