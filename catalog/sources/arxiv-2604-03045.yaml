brief: >-
  Where you intervene in a video model's decoder matters more than how hard
  you intervene: middle layers are where token-relevant visual evidence is
  aligned, and repairing grounding there beats early- or late-layer
  correction.


  STEAR is a training-free inference-time method that flags risky decoding
  steps by normalized entropy (threshold tau = 0.85, monitored over layers
  5-16), picks the top 10% attention-salient patches as token-conditioned
  evidence, reinjects that evidence into middle-layer FFNs, and launches a
  temporally perturbed counterfactual branch from the trigger layer for
  contrastive decoding over a single video encode. Tested on LLaVA-Video-7B,
  InternVL2.5-8B and Qwen2.5-VL-7B across EventHallusion, VidHalluc, NExT-QA
  and MVBench against VCD, MemVR, TCD and DINO-HEAL.


  On LLaVA-Video-7B, EventHallusion rises 46.70 to 54.77 and the Misleading
  split 43.13 to 73.53; averages improve 52.37 to 56.05, 70.40 to 74.10, and
  65.97 to 68.44 across the 3 backbones. Latency is 1.89x baseline versus
  2.42x for VCD and 2.25x for TCD, with 1 encoding pass instead of 2.


  Ablations isolate the components: removing the uncertainty trigger drops
  EventHallusion to 48.41, removing counterfactual decoding to 47.92,
  late-layer-only reinjection to 47.19. Random patches instead of KES cost
  little (54.03), so evidence localization is a weaker factor than branch
  consistency.


  Gains on general understanding are small (MVBench 41.28 to 41.74), the layer
  diagnostic relies on benchmark-annotated evidence regions, and only 7-8B
  models were tested. Useful if you are choosing where in a decoder to apply
  hallucination fixes.
