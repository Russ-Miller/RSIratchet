summary: >-
  Reliable uncertainty quantification (UQ) is essential for deploying large
  language model (LLM) agents in complex interactive environments. Existing
  UQ methods largely rely on local signals, such as token probabilities,
  predictive entropy, or per-step confidence, and therefore overlook the
  long-range dependencies through which errors accumulate across an
  execution trajectory. As a result, they may fail to identify agent
  failures whose causes originate several reasoning or interaction steps
