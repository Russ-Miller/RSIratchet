brief: >-
  Audio language models lose temporal alignment as recordings get longer, and
  a two-stage global-to-local reasoning loop with audio cropping as a tool
  recovers much of it. Timestamp drift is concrete: Gemini-2.5-Pro predicted
  captions ending at 27:48 for a 23:27 clip.


  LAT-Audio builds on Qwen3-Omni-30B-A3B-Instruct. It first emits a global
  timeline of 2–5 segments, then runs Think-With-Audio Chain-of-Thought,
  calling crop_audio for up to 4 steps. Training uses LAT-Chronicle, a 1.2k
  hour Chinese/English dataset (7K timeline samples, 30K trajectories, 2.5K
  GRPO instances). Evaluation is on LAT-Bench (human-verified, audio to 30
  minutes, tasks: dense captioning, temporal grounding, targeted captioning)
  and a BLAB subset.


  On LAT-Bench TAG it beats Gemini-2.5-Pro by 17.1%, and by 13.8% on BLAB
  advertisement localization; DAC improves 10.11% relative over
  Gemini-3.0-Pro. Across 15+ minute audio, TAG falls 68.4 to 35.2 for
  LAT-Audio versus 62.6 to 16.1 for Gemini-2.5-Pro.


  Ablations isolate parts: removing the global timeline, TWA-CoT, or Stage-3
  RL each degrades results, and QA-only SFT sits ~22% below full LAT-Audio.
  Sliding-window baselines at 60-second chunks are included. Caveats: 1
  backbone, benchmark and training data share a pipeline, and Gemini baselines
  are API-accessed with default decoding.


  If you work on long audio, treat timeline-then-crop as the stronger default
  over chunking.
