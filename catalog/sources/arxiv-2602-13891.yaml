brief: >-
  Speech naturalness scoring improves when the reward model is made to extract
  acoustic features and reason over them in text, rather than regressing audio
  directly to a scalar. That reframes naturalness evaluation as a generative
  reasoning task instead of a regression one.


  The Generative Speech Reward Model (GSRM) is trained in two stages:
  interpretable acoustic feature extraction, then feature-grounded
  chain-of-thought reasoning that produces an explainable judgment. Training
  used a curated human feedback set of 31k expert ratings, and evaluation
  included an out-of-domain benchmark built from real-world user-assistant
  speech interactions.


  GSRM is reported to outperform existing speech naturalness predictors, with
  model-human correlation approaching human inter-rater consistency. It was
  also used as a verifier for online RLHF on a speech LLM, with reported gains
  in generated speech naturalness.


  The source gives one figure, the 31k rating count; all correlation and RLHF
  results are described qualitatively with no numbers, no named baselines, and
  no stated matched-budget comparison. Whether the reasoning stage or the
  extra labelled data drives the gain is not isolated here.


  Coverage beyond naturalness, other languages, and other speech LLM families
  is not addressed, and the RLHF result rests on the authors' own evaluation.


  If you build speech reward models, this is an argument for generative,
  feature-grounded judges over scalar regressors, pending published numbers.
