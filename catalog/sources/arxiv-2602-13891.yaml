summary: Recent advances in speech language models, such as GPT-4o Voice Mode
  and Gemini Live, have demonstrated promising speech generation capabilities.
  Nevertheless, the aesthetic naturalness of the synthesized audio still lags
  behind that of human speech. Enhancing generation quality requires a
  reliable evaluator of speech naturalness. However, existing naturalness
  evaluators typically regress raw audio to scalar scores, offering limited
  interpretability of the evaluation and moreover fail to generalize to speech
  across different taxonomies. Inspired by recent advances in generative
  reward modeling
