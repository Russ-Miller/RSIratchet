brief: >-
  Speech naturalness evaluation gets better when the reward model first
  extracts interpretable acoustic features and then reasons over them in a
  chain of thought, rather than regressing raw audio to a scalar score. The
  usual MOS-style predictors are both opaque and poor at generalizing across
  speech taxonomies.


  GSRM is trained on a curated human feedback set of 31k expert ratings, with
  a separate out-of-domain benchmark built from real-world user-assistant
  speech interactions. The model produces a feature extraction stage followed
  by feature-grounded reasoning before issuing a judgment.


  Reported results are qualitative in the source: GSRM outperforms existing
  speech naturalness predictors, with model-human correlation on naturalness
  score prediction approaching human inter-rater consistency. It is also used
  as a verifier for online RLHF and reportedly raises the naturalness of
  speech LLM generations. No per-benchmark correlation figures, baseline
  names, or RLHF deltas are given in the text available here.


  The effect on evaluation accuracy is measured against prior predictors and
  anchored to an inter-rater ceiling, which is the right comparison; the RLHF
  gain is demonstrated rather than isolated, with no ablation separating the
  feature-extraction stage from the reasoning stage reported here.


  Scope is naturalness only, not semantics, latency, or speaker consistency,
  and the human ratings come from one expert pool. If you are building reward
  signals for speech generation, this argues for decomposed generative judges
  over scalar regressors.
