summary: >-
  Modern image classification models excel when trained on single
  task-specific datasets but often struggle to generalize across domains and
  difficulty levels. We propose ARMDIL, an Adaptive Router for Multi-Domain
  Image Classification with LLMs. ARMDIL is an ensemble that uses a
  multimodal large language model (MLLM) agent to dynamically route each
