summary: Humans write code in a fundamentally interactive manner and rely on
  constant execution feedback to correct errors, resolve ambiguities, and
  decompose tasks. While LLMs have recently exhibited promising coding
  capabilities, current coding benchmarks mostly consider a static
  instruction-to-code sequence transduction process, which has the potential
  for error propagation and a disconnect between the generated code and its
  final execution environment. To address this gap, we introduce InterCode, a
  lightweight, flexible, and easy-to-use framework of interactive coding as a
  standard reinforcement learning (RL) environment, with code as actions and
  execution feedback as observations. Our framework is language and platform
  agnostic, uses self-contained Docker environments to provide safe and
  reproducible execution, and is compatible out-of-the-box with traditional
