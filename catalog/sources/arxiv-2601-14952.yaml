summary: >-
  While large language models now handle million-token contexts, their
  capacity for reasoning across entire document repositories remains largely
  untested. Existing benchmarks are inadequate, as they are mostly limited
  to single long texts or rely on a "sparse retrieval" assumption-that
  answers can be derived from a few relevant chunks. This assumption fails
  for true corpus-level analysis, where evidence is highly dispersed across
  hundreds of documents and answers require global integration, comparison,
  and statistical aggregation. To address this critical gap, we introduce
  CorpusQA, a new bench
