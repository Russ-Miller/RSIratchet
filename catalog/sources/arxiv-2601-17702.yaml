brief: >-
  A model's own attention states, discretized by sparse autoencoders, can
  serve as the retriever for its long context, matching a reranked RAG
  pipeline without an external embedding model while keeping GPU memory
  constant. The catch is that the endogenous signal alone is weaker than BM25;
  the gains come only from fusing the two.


  S3-Attention trains Top-k SAEs on key projections, streams the context in
  chunks, writes feature IDs into a CPU inverted index, and discards the KV
  cache. Evaluated on 9 LongBench datasets (single-doc QA, multi-doc QA,
  summarization) with Llama-3.1-8B-Instruct, Qwen2-7B-Instruct and
  Mistral-7B-Instruct-v0.3.


  S3-Hybrid averages 24.87 vs FullKV 25.01 on Llama-3 (99.4% retention), 23.24
  vs 23.40 on Mistral, 18.80 vs 18.92 on Qwen2. S3-Pure is worse than BM25
  everywhere (22.60 vs 24.25 on Llama-3). On Qasper it beats full context
  (21.50 vs 20.56). On HotpotQA, answer recall 0.8400 and KL to full-context
  next-token distribution 0.2154, vs 0.7700/0.3831 for RAG.


  RAG is run at a matched token budget with reranking, and there is a
  cumulative layer ablation (Qasper 21.41 to 22.75). Absolute scores vary
  across environments, and the authors restrict claims to within-protocol
  retention.


  The prototype is slower in wall-clock than FullKV, so this buys memory, not
  speed.
