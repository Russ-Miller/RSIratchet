brief: >-
  Rewriting a harmful prompt in an emotionally warm or anxious style, without
  changing its meaning, breaks safety refusals more reliably than hostile
  phrasing does.


  Harmful instructions were sampled from 3 corpora (156 MultiJail, 156
  JailbreakHub, 200 HarmBench) and recast into 11 linguistic styles twice:
  once via handcrafted templates, once via GPT-4.1 contextualized rewrites. 16
  instruction-tuned models were queried zero-shot at temperature 0, with
  GPT-4.1 as the Ethical/Unethical judge.


  Attack success rose by up to +57 percentage points. Qwen2.5-0.5B went from
  23.1 to 74.4 on MultiJail and 35.5 to 74.0 on HarmBench; LLaMA-3.2-3B from
  7.0 to 64.5 on HarmBench; GPT-4o mini and Grok4 rose roughly 20 pp and 19
  pp. Fearful, curious and compassionate styles led on unique-to-neutral ASR
  (up to 9.7 on HarmBench), while threatening and scolding styles were weakest
  (1.1-1.6). A GPT-4.1 style-neutralization preprocessing step cut ASR
  sharply, e.g. LLaMA-3.1-8B from 60.9 to 7.0 on JailbreakHub.


  The effect is measured against matched neutral prompts, and the
  neutralization step supplies a rough causal control for paraphrasing
  confounds. Judge reliability was checked on 400 samples against 2 annotators
  (Cohen's kappa 0.94), with GPT-4.1 showing 6.0% false negatives on
  rhetorically framed cases.


  Single-turn, text-only, 1 judge model, no adaptive adversary and no
  adversarial-training baseline. Scaling attenuates but does not remove the
  gap: Qwen2.5-72B still reaches 15.4 on JailbreakHub.


  If your red-teaming suite only varies semantics, it is understating your
  model's exposure.
