summary: Large Language Models (LLMs) are commonly evaluated for robustness
  against paraphrased or semantically equivalent jailbreak prompts, yet little
  attention has been paid to linguistic variation as an attack surface. In
  this work, we systematically study how linguistic styles such as fear or
  curiosity can reframe harmful intent and elicit unsafe responses from
  aligned models. We construct style-augmented jailbreak benchmark by
  transforming prompts from 3 standard datasets into 11 distinct linguistic
  styles using handcrafted templates and LLM-based rewrites, while preserving
