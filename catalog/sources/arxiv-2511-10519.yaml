brief: >-
  Rewriting a harmful prompt in an emotionally warm or anxious voice, without
  changing its meaning, breaks safety training that holds against the neutral
  phrasing. Fear, curiosity and compassion work better than hostility or
  threats.


  156, 156 and 200 prompts were sampled from MultiJail, JailbreakHub and
  HarmBench, then rendered in 11 linguistic styles twice over: handcrafted
  templates and GPT-4.1 contextualized rewrites. 16 instruction-tuned models
  were tested zero-shot at temperature 0, with GPT-4.1 as the
  unethical/ethical judge.


  Attack success rose by up to +57 percentage points. Qwen2.5-0.5B went from
  23% to 74% on MultiJail and 35.5% to 74.0% on HarmBench; Llama-3.2-3B from
  7.0% to 64.5% on HarmBench; GPT-4o mini and Grok4 rose by roughly 20 pp and
  19 pp. Scaling dampens but does not remove the effect (Qwen2.5-72B stays at
  6.4–15.4%). Per-style, fearful and curious lead on ASR uniquely attributable
  to style. Passing inputs through a GPT-4.1 style-neutralization step cut ASR
  back toward baseline, e.g. Llama-3.1-8B from 60.9% to 7.0% on JailbreakHub.


  The neutralization arm acts as the control that separates style from
  incidental paraphrase. Weaknesses: 1 judge model, validated on a 400-sample
  human subset (Cohen's κ 0.94 between annotators) where GPT-4.1 had 6.0%
  false negatives on exactly the rhetorical cases at issue; single-turn,
  text-only, no adaptive adversary, 11 styles only.


  If your red-teaming suite varies semantics but not register, it is missing a
  large fraction of reachable failures.
