brief: >-
  Rewriting a harmful prompt in an emotionally warm or anxious style, without
  changing its meaning, breaks safety guardrails that hold under neutral
  phrasing. Fear, curiosity and compassion work better than hostility or
  threats.


  Prompts sampled from MultiJail (156), JailbreakHub (156) and HarmBench (200)
  were recast into 11 linguistic styles, once via handcrafted templates and
  once via GPT-4.1 contextualized rewrites, then run zero-shot at temperature
  0 against 16 instruction-tuned models (LLaMA 3.x, Qwen2.5 0.5B-72B,
  Ministral-8B, Phi-4-mini, Command R+, GPT-4o mini, Grok4). GPT-4.1 judged
  each response Ethical or Unethical.


  Attack success rose by up to +57 percentage points. Qwen2.5-0.5B went 23.1
  to 74.4 on MultiJail; LLaMA-3.2-3B went 7.0 to 64.5 on HarmBench; GPT-4o
  mini and Grok4 rose roughly 20 pp and 19 pp. Contextualized rewrites beat
  templates. Scale reduces but does not remove the effect (Qwen2.5-72B stays
  at 6.4-15.4). A GPT-4.1 style-neutralization preprocessor cut ASR back
  toward baseline, e.g. LLaMA-3.1-8B from 60.9 to 7.0 on JailbreakHub.


  The style factor is isolated by holding prompts fixed and by the
  neutralization arm, which also controls for incidental paraphrasing. Judging
  rests on 1 model, GPT-4.1, validated on 400 samples against 2 annotators
  (Cohen's κ 0.94), where it showed 6.0% false negatives on rhetorically
  framed harm, so absolute ASR may be understated. Single-turn text only; no
  sarcasm, humor, mixed styles, adaptive adversaries, or multimodal cases.


  If your red-teaming suite only varies semantics, it is missing a large and
  cheap attack surface.
