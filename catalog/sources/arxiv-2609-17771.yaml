summary: >-
  Approaches to incorporating human awareness into mobile robot
  decision-making mainly focus on collision avoidance in low-level motion
  planning, often overlooking the challenges posed by human presence and
  high-level behavior. To address this vacancy, we present HINT-Plan, a
  novel approach to integrate human intention prediction into robot task
  planning. HINT-Plan employs Vision Language Models (VLMs) to anticipate
