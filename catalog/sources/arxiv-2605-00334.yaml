brief: >-
  Small open-weight models already cover the short-horizon, structured tool
  use that dominates agent pipelines, and the frontier advantage is confined
  to long-horizon planning under persistent constraints, where neither side
  works.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier across 6
  tiers (no-tool instruction following, single tool call, 2-tool chain,
  branching, multi-source synthesis, long-horizon planning), over 8 abstract
  tools and an in-memory fixture database with no live APIs. 16 open-weight
  models from 0.27 B to 32 B served via Ollama were compared with GPT-5 across
  16,542 scored runs, native tool calling only, temperature 0.


  Paired over 270 observations, gemma4:26b matched GPT-5 at the pre-registered
  ±10 pp margin (Δ = +0.4 pp, 90% CI [−4.0, +5.1]), at ~60% overall TCR,
  roughly 15x cheaper on Mac self-hosting, 3x on cloud GPU, 2.5x faster per
  passed task. It beat GPT-5 on no-tool tasks (100% vs 80%, Δ = +20.0 pp) and
  lost on long-horizon planning (0% vs 10.2%). No open-weight model cleared
  any 60–90% reliability bar on tiers C, D, or E.


  Effects were measured with paired bootstrap CIs, pre-registered TOST margins
  and Holm correction, plus a failure-mode cascade; per-tier n = 45 leaves
  B/C/D descriptive only. Ablations isolated causes well: explicit-submission
  prompting lifted ministral-3:8b on 1 task by +100 pp and was null on 4 other
  models, while a plan/execute/submit prompt regressed every model tested
  (ministral-3:8b −33 pp).


  Only 1 frontier anchor, 5 tasks per tier, no human baseline, abstract tools
  rather than live APIs or GUIs.


  Use it as a static routing prior, not as evidence about open environments.
