brief: >-
  Small open-weight models handle short, structured tool calls as reliably as
  a frontier model, and the gap is confined to long-horizon planning under
  persistent constraints, where neither side works. AgentFloor is a
  deterministic 30-task ladder, 5 tasks per tier across 6 tiers (no-tool
  instruction following, single tool, 2-tool chain, branching, multi-source
  synthesis, long-horizon planning), over 8 abstract tools and an in-memory
  fixture DB, with 16 open-weight models from 0.27B to 32B plus GPT-5, 16,542
  scored runs.


  Paired across 30 tasks (n = 270), gemma4:26b matches GPT-5 at a
  pre-registered ±10 pp margin (Δ = +0.4 pp, 90% CI [−4.0, +5.1]), at about
  15x lower cost on Mac self-hosting, 3x on cloud GPU, and 2.5x faster per
  passed task. Open-weight is strictly better on no-tool instruction following
  (100% vs 80%, Δ = +20.0 pp) and equivalent on single-tool use; GPT-5 is
  strictly better on tier E (10% vs 0%, Δ = −10.2 pp).


  Effects are measured with paired bootstrap CIs, TOST equivalence, and Holm
  correction, with a failure-mode cascade. Per-tier samples (n = 45) are too
  small to certify equivalence on chaining, branching, or synthesis; 1
  frontier anchor only; no human baseline; abstract tools, no live APIs or GUI
  grounding.


  Ablations show no universal lever: explicit-submission gave +100 pp on 1
  model on 1 task and was null elsewhere; a plan/execute/submit prompt
  regressed every model tested (ministral-3:8b −33 pp).


  Use it as a routing prior: send routine calls to sub-5B models, reserve
  frontier calls for long-horizon planning.
