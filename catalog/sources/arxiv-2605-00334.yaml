brief: >-
  Small open-weight models handle short, structured tool-use calls as reliably
  as a frontier model, and the residual frontier advantage sits almost
  entirely in long-horizon planning under persistent constraints, where
  neither side is usable.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier, across 6
  tiers (no-tool instruction following, single tool call, 2-tool chain,
  branching, multi-source synthesis, long-horizon planning), over 8 abstract
  tools and an in-memory fixture database with no live APIs. 16 open-weight
  models from 0.27 B to 32 B, served via Ollama, were compared against GPT-5
  across 16,542 scored runs, native tool calling only, temperature 0.


  Paired across 30 tasks (n = 270), gemma4:26b and GPT-5 are equivalent at a
  pre-registered ±10 pp margin (Δ = +0.4 pp, 90% CI [−4.0, +5.1]), at about
  15x lower cost on Mac self-hosting and 2.5x faster per passed task.
  Open-weight is strictly higher on A0 (100% vs 80%, Δ = +20.0 pp) and GPT-5
  strictly better on E (10% vs 0%, Δ = −10.2 pp). On A0, A, and B, sub-5 B
  models clear 70%–80% reliability bars; no model clears even 60% on C, D, or
  E.


  The aggregate claim is measured with pre-registered TOST and bootstrap CIs;
  per-tier paired n = 45 is too small to certify equivalence on B, C, D
  despite point estimates within 9 pp. Ablations show each effective
  intervention helped 1 model on 1 cell, and a plan/execute/submit prompt
  regressed all 4 models tested (ministral-3:8b −33 pp).


  Only 1 frontier anchor, 5 tasks per tier, abstract tools, no human baseline.
  Useful if you are deciding which agent calls to route away from a flagship
  model.
