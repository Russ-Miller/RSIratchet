brief: >-
  Small open-weight models handle short, structured tool-calling as well as a
  frontier model, and the gap is confined to long-horizon planning under
  persistent constraints, where neither side works.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier across 6
  tiers (no-tool instruction following, single tool call, 2-tool chaining,
  branching, multi-source synthesis, long-horizon planning), using 8 abstract
  tools over an in-memory fixture database with no live APIs. 16 open-weight
  models from 0.27B to 32B served via Ollama were compared to GPT-5 across
  16,542 scored runs, native tool calling only, temperature 0.


  Paired across 30 tasks (n = 270), gemma4:26b and GPT-5 are equivalent at a
  pre-registered ±10 pp margin (Δ = +0.4 pp, 90% CI [−4.0, +5.1]), at about
  15x lower cost on Mac self-hosting, 3x on cloud GPU, and 2.5x faster per
  passed task. Open-weight is strictly higher on the no-tool tier (100% vs
  80%, Δ = +20.0 pp) and strictly lower on tier E (0% vs 10.2%, Δ = −10.2 pp).


  The comparison is pre-registered, bootstrapped, and failure-mode-coded;
  tier-E failures differ in kind (GPT-5: F5 39%, F5b 24%; gemma4:26b: F4 41%,
  F1 36%). Per-tier B/C/D verdicts are descriptive only, underpowered at n =
  45.


  Ablations found no universal fix: a plan/execute/submit prompt regressed all
  4 models tested (ministral-3:8b −33 pp), while an explicit-submission
  instruction gave +100 pp on 1 model on 1 task.


  Only 1 frontier model, 5 tasks per tier, no human baseline, abstract tools
  rather than live APIs.


  Treat routing as tier-dependent: sub-5B models for routine calls, frontier
  only for sustained constraint tracking.
