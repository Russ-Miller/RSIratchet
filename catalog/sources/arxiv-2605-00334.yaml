brief: >-
  Small open-weight models cover the routine, short-horizon parts of an agent
  workflow; the frontier advantage is confined to long-horizon planning under
  persistent constraints, and even there nobody is reliable.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier across 6
  tiers (no-tool instruction following, single tool, 2-tool chain, branching,
  multi-source synthesis, long-horizon planning), using 8 abstract tools over
  an in-memory fixture database, native tool calling only, temperature 0. 16
  open-weight models from 0.27 B to 32 B served via Ollama plus GPT-5, 16,542
  scored runs.


  Paired over 270 observations, gemma4:26b matches GPT-5 (Δ = + 0.4 pp, 90% CI
  [ − 4.0 , + 5.1 ]) at ~60% overall TCR, 15 × cheaper on Mac, 2.5 × faster
  per passed task. It beats GPT-5 on A0 (100% vs 80%) and loses on E (0% vs
  10.2%). No open-weight model clears a 60% bar on C, D, or E.


  Effects are measured with pre-registered TOST at ± 10 pp and 10,000-resample
  bootstrap CIs. B, C, and D verdicts stay descriptive: n = 45 per tier gives
  CIs 24–35 pp wide. Failure-mode cascades show GPT-5 failing on E by
  resignation (F5 39%) and gemma4:26b by step exhaustion (F4 41%) and
  hallucinated tools (F1 36%), which explains why interventions are
  model-specific; a plan/execute/submit prompt regressed all 4 models tested,
  up to − 33 pp.


  Only 1 frontier model, no human baseline, abstract tools rather than live
  APIs or GUIs. Useful if you are setting a routing floor rather than
  estimating open-environment agent performance.
