summary: "Production agentic systems make many model calls per user request,
  and most of those calls are short, structured, and routine. This raises a
  practical routing question that existing evaluations do not directly answer:
  which parts of an agent workflow truly require large frontier intelligence,
  and which can be handled by smaller models? We introduce AgentFloor, a
  deterministic 30-task benchmark organized as a six-tier capability ladder,
  spanning instruction following, tool use, multi-step coordination, and
  long-horizon planning under persistent constraints. We evaluate 16
  open-weight models, from 0.27B to 32B parameters, alongside GPT-5 across
  16,542 scored runs. Our results reveal a clear boundary of model necessity.
  Small and mid-sized open-weight models are already sufficient for much of
  the short-horizon, structured tool use work that dominates real agent
  pipelines, and in aggregate, …"
