brief: >-
  Small open-weight models handle short, structured tool calls as well as a
  frontier model, and the gap is concentrated almost entirely in long-horizon
  planning under persistent constraints, where neither side is reliable.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier across 6
  tiers (no-tool instruction following, single tool, 2-tool chain, branching,
  multi-source synthesis, long-horizon planning), over 8 abstract tools and an
  in-memory fixture database, with 16 open-weight models from 0.27B to 32B
  plus GPT-5, 16,542 scored runs.


  Paired across 30 tasks (n = 270), gemma4:26b vs GPT-5 gives Δ = + 0.4 pp,
  90% CI [ − 4.0 , + 5.1 ], at roughly 15 × cheaper on Mac self-hosting and
  2.5 × faster per passed task. Open-weight is strictly better on no-tool
  instruction following (100.0% vs 80.0%, + 20.0 pp) and GPT-5 strictly better
  on tier E (10% vs 0%, Δ = − 10.2 pp). C, D, and E clear no reliability
  target in [ 60 , 90 ].


  Effects are measured with pre-registered ± 10 pp TOST, 10,000-resample
  bootstraps and Holm correction; per-tier B/C/D comparisons are underpowered
  at n = 45 and are reported descriptively. Tier-E failure modes differ
  sharply: GPT-5 F5 39%, F5b 24%; gemma4:26b F4 41%, F1 36%.


  Only 1 frontier anchor, 5 tasks per tier, abstract tools with no live APIs,
  no GUI grounding, no human baseline. Interventions were model-specific; a
  plan/execute/submit prompt regressed all 4 models tested.


  Use it as a routing prior, not a capability ceiling.
