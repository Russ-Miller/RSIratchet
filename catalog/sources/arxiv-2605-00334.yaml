brief: >-
  Small open-weight models match GPT-5 on routine, short-horizon tool use, and
  the frontier advantage is confined to long-horizon planning under persistent
  constraints, where neither side is reliable.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier, across 6
  tiers (A0 no-tool instruction following, A single tool call, B 2-tool chain,
  C branching, D multi-source synthesis, E long-horizon planning), using 8
  abstract tools over an in-memory fixture database with no live APIs. 16
  open-weight models from 0.27B to 32B served via Ollama were compared with
  GPT-5 over 16,542 scored runs, native tool calling only, temperature 0.


  Paired across 30 tasks (n = 270), gemma4:26b vs GPT-5 gives Δ = +0.4 pp, 90%
  CI [−4.0, +5.1], both near 60% overall TCR, at $0.0022 vs $0.0327 per passed
  task (about 15x cheaper on Mac, 3x on cloud GPU) and 2.5x faster.
  Open-weight is strictly higher on A0 (100% vs 80%, +20.0 pp) and equivalent
  on A; on E, GPT-5 leads at 10% vs 0% (Δ = −10.2 pp). No open-weight model
  clears a 60%–90% reliability bar on C, D, or E.


  Evidence is pre-registered with ±10 pp TOST margins and 10,000-resample
  bootstraps, but only GPT-5 serves as the frontier anchor, and per-tier n =
  45 leaves B, C, D descriptive only (CIs 24–35 pp wide). Failure cascades
  show GPT-5 failing on E by resignation (F5 39%, F5b 24%) and gemma4:26b by
  step exhaustion and hallucinated tools (F4 41%, F1 36%), which explains why
  interventions are model-specific: explicit-submission lifted ministral-3:8b
  on E1 by +100 pp and nothing else, while a plan/execute/submit prompt
  regressed every model tested (ministral-3:8b −33 pp).


  No human baseline, no second frontier anchor, no live APIs or GUI grounding,
  and 5 tasks per tier. If you route agent calls, the lower tiers can go to
  sub-5B models with no measured accuracy cost here.
