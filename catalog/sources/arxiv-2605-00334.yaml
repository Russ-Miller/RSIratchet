brief: >-
  Small open-weight models handle short, structured tool calls as reliably as
  a frontier model, and the gap is concentrated almost entirely in
  long-horizon planning under persistent constraints.


  AgentFloor is a deterministic 30-task benchmark, 5 tasks per tier, across 6
  tiers (no-tool instruction following, single tool, 2-tool chain, branching,
  multi-source synthesis, long-horizon planning) over 8 abstract tools and an
  in-memory fixture database. 16 open-weight models from 0.27B to 32B served
  via Ollama plus GPT-5, 16,542 scored runs, temperature 0, native
  tool-calling only.


  Paired over 270 observations, gemma4:26b matched GPT-5 at a pre-registered
  ±10 pp margin (Δ = +0.4 pp, 90% CI [−4.0, +5.1]), at about 15x cheaper on
  Mac self-hosting, 3x on cloud GPU, 2.5x faster per passed task. It beat
  GPT-5 on no-tool tasks (100% vs 80%, Δ = +20.0 pp) and was equivalent on
  single-tool. On long-horizon planning GPT-5 led 10% vs 0%. No open-weight
  model cleared even a 60% reliability bar on tiers C, D or E.


  Effects are measured with paired bootstrap TOST, pre-registered margins,
  Holm correction, and a failure cascade; tier-level comparisons on B, C, D
  are underpowered at n = 45 and stay descriptive. Only 1 frontier anchor, no
  human baseline, abstract tools rather than live APIs.


  Ablations found no universal lever: explicit-submission gave +100 pp on 1
  model on 1 task and was null elsewhere, and a plan/execute/submit prompt
  regressed every model tested (ministral-3:8b −33 pp).


  Use this as a routing prior, not an open-environment capability estimate.
