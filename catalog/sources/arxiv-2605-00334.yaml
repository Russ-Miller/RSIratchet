brief: >-
  Small open-weight models match a frontier model on short-horizon, structured
  tool use, and the gap is confined to long-horizon planning under persistent
  constraints. AgentFloor is a deterministic 30-task benchmark, 5 tasks per
  tier, across 6 tiers (no-tool instruction following, single tool call,
  2-tool chain, branching, multi-source synthesis, long-horizon planning) over
  8 abstract tools and an in-memory fixture database, with native tool calling
  only, temperature 0, and 16 open-weight models from 0.27 B to 32 B plus
  GPT-5 across 16,542 scored runs.


  Paired across 30 tasks (n = 270), gemma4:26b and GPT-5 are equivalent at a
  pre-registered ±10 pp margin (Δ = +0.4 pp, 90% CI [−4.0, +5.1]), at about
  15x cheaper on Mac self-hosting, 3x on cloud GPU, and 2.5x faster per passed
  task. Open-weight is strictly higher on no-tool tasks (100% vs 80%, Δ =
  +20.0 pp) and strictly lower on long-horizon planning (0% vs 10.2%, Δ =
  −10.2 pp). C, D and E clear no reliability threshold in [60, 90] for any
  open-weight model.


  Effects are measured with bootstrap CIs (10,000 resamples), pre-registered
  TOST, and Holm correction; the margin was fixed before analysis. The authors
  state plainly that per-tier samples (n = 45) are underpowered, so B/C/D
  verdicts stay descriptive.


  Ablations isolate mechanism rather than scale: an explicit-submission prompt
  gave +100 pp on ministral-3:8b on E1 and nothing on 4 other models, and a
  plan/execute/submit prompt regressed every model tested (ministral-3:8b −33
  pp).


  Only 1 frontier anchor, abstract tools, no live APIs or GUIs, no human
  baseline. Use it as a routing prior, not an end-to-end agent estimate.
