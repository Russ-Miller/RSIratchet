brief: >-
  Giving a sub-7B model a passage that is guaranteed to contain the answer
  does not get the answer out of it, and adding any context destroys knowledge
  the model already had. Five instruction-tuned models (SmolLM2-360M,
  Qwen2.5-1.5B/3B/7B, Llama-3.1-8B) were run on 1,000 NQ + HotpotQA questions
  under no retrieval, BM25, dense (E5-large-v2), and an oracle condition drawn
  from the same 500K-passage Wikipedia corpus, with each (model, question)
  pair labelled Known or Unknown by its no-retrieval result.


  On Unknown questions with oracle passages, EM reaches only 14.6% at 7B,
  12.8% at 3B, 10.0% at 1.5B, 0.0% at 360M. On Known questions, retrieval
  overturns 42–64% of previously correct answers; for models below 7B the
  oracle-vs-noisy difference is not significant (1.5B p = 0.26, 3B p = 0.07).
  Net EM change from dense retrieval is negative at every scale (−1.3 to
  −2.9pp). Error analysis of 2,588 oracle failures finds irrelevant generation
  dominant (61–100%).


  The oracle design isolates utilization from retrieval quality cleanly, with
  bootstrap CIs, McNemar tests with Bonferroni correction, a 3-prompt
  ablation, and an FP16 Llama-3.1-8B cross-architecture check. Weak spots: the
  360M Known set is n = 11, the prompt ablation covers 1 model on 200
  questions, failure categories are heuristic (89% agreement on 96 samples),
  and local models are all 4-bit.


  Scope is English Wikipedia extractive QA only; generative and
  background-knowledge tasks untested. If you are shipping RAG on a small
  model, measure the net trade-off before assuming retrieval helps.
