brief: >-
  Truthfulness and visual-perception behaviours in vision-language models sit
  in different attention heads, and the truthfulness direction is not a single
  fixed vector: it shifts with the semantic content of the query, so a static
  steering vector leaves gains on the table.


  DMAS is a training-free intervention for LLaVAv1.5 7B and QwenVL 7B.
  Activation analysis on 3,000 SEED and AMBER samples put the strongest
  truthfulness heads in layer 30 and the strongest visual-perception heads in
  layer 31, and t-SNE of per-cluster activation differences separated 4
  semantic clusters. At inference the method retrieves the nearest cluster's
  truthfulness vector by sentence-embedding similarity and adds it, plus a
  noise-contrast visual vector, to the top-K heads.


  MME total score rose 94.66 on LLaVAv1.5 and 46 on QwenVL, beating ICT by
  10.89 and VAF by 5. CHAIR sentence-level hallucination fell from 51.0 to
  30.8, 5 points below VTI, while image-level 11.4 roughly matched VTI's 11.1.
  ScienceQA accuracy went 52.75 to 62.27 and ViQuAE 43.38 to 56.00.


  The dynamic-vs-fixed-vector comparison and the 2-way ablation isolate both
  components; the cluster count and intervention strength sweeps show the gain
  collapses when alpha, beta or K get large. Only 2 7B models, self-run
  baselines, no larger or non-English settings.


  If you steer activations, make the vector query-dependent.
