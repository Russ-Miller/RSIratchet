summary: "Large Vision-Language Models (LVLMs) exhibit outstanding performance
  on vision-language tasks but struggle with hallucination problems. Through
  in-depth analysis of LVLM activation patterns, we reveal two key findings:
  1) truthfulness and visual perception capabilities predominantly engage
  different subsets of attention heads within the model architecture; and 2)
  truthfulness steering vectors vary significantly across different semantic
  contexts. Based on these observations, we propose Dynamic Multimodal
  Activation Steering, a training-free approach for hallucination mitigation.
