summary: >-
  Large language model (LLM)-based multi-agent systems tackle complex
  reasoning by orchestrating how multiple agents are configured and how they
  collaborate. A central challenge is to adapt orchestration to the evolving
  collaboration state. Routing from the query alone cannot adapt to
  intermediate progress or errors, which hurts accuracy. Routing from the
  complete execution history supplies this missing context, but forces later
  decisions to process every prior step, including redundant or low-utility
  ones. This creates an execution-history overload that inflates cost.
