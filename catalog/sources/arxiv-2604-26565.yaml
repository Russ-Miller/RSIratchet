brief: >-
  Pairing a large vision-language model for perception with a text-only
  reasoning LLM for global correction produces better temporally grounded
  video annotations than either alone, without any training. The VLM supplies
  noisy visual timestamps as scaffolding; the reasoning model merges,
  deduplicates, and rectifies them against the full transcript.


  The pipeline filters HowTo100M videos (keeping those with at least 75%
  instructional content), segments them into shots, generates candidate steps
  with Qwen2.5-VL-72B, then refines with DeepSeek-R1-671B. Output is
  DenseStep2M: 99.2K videos, 1.9M steps, 19.0 steps per video, 10.5 words per
  step. DenseCaption100 (100 videos, 11.0 human-annotated steps/video) is the
  human-written yardstick.


  On YouCook2 the training-free pipeline reaches METEOR 9.4 vs 6.1 for CM2
  without pretraining, CIDEr 33.6 vs 31.7, SODA_c 5.6 vs 5.3. On
  DenseCaption100 the full pipeline reaches F1 75.81 and mIoU 42.90; removing
  DeepSeek-R1 drops precision from 67.79 to 57.39 and mIoU from 42.90 to
  32.87; removing VLM timestamps drops mIoU to 41.16.


  Ablations isolate VLM capacity, the refinement stage, and the timestamp
  scaffold. Downstream, a vision-agnostic ASR-only control dataset is the
  matched baseline: fine-tuned Qwen2.5-VL-3B gains +4.2% R1-mIoU in captioning
  and +8.6% grounding mIoU over it.


  Boundaries: the data is 59.06% Food and Entertaining, and retrieval
  fine-tuning costs general-domain accuracy (MSRVTT T2V -4.0 for the embedding
  model). Useful if you need dense procedural supervision without human
  labeling.
