brief: >-
  Scaling an autoregressive language model to 175B parameters makes in-context
  learning from a handful of prompt examples competitive with task-specific
  fine-tuning on some benchmarks, without any gradient updates.


  GPT-3 and 7 smaller models (125M to 175B, all trained on 300 billion tokens)
  were evaluated on over two dozen NLP datasets plus synthetic probes (word
  unscrambling, 3-digit arithmetic, using a novel word), each in zero-, one-,
  and few-shot settings with K typically 10 to 100 demonstrations in a
  2048-token context.


  Few-shot GPT-3 reaches 86.4% on LAMBADA (prior SOTA 68.0), 71.2% on TriviaQA
  closed-book (above fine-tuned T5-11B+SSM at 60.5), 85.0 F1 on CoQA, 20.5
  perplexity on PTB versus 35.8 SOTA, and 71.8 average on SuperGLUE with 32
  examples, above fine-tuned BERT-Large at 69.0. Weak points: WiC at 49.4%
  (chance), RACE-h 46.8%, DROP 36.5, ARC Challenge 51.5%, and En→Ro
  translation over 10 BLEU below unsupervised NMT.


  Effects are measured across 8 model sizes, so the scaling claim is well
  supported; the zero/one/few-shot gap widens with capacity. No fine-tuned
  GPT-3 baseline was run, a filtering bug left some test-set overlap, and
  contamination analysis is the authors' own.


  Read it as the evidence that prompt-only task specification scales, with
  per-task variance large enough that aggregate numbers mislead.
