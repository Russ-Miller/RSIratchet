summary: >-
  LLM-powered agents struggle with personalization when users issue raw,
  underspecified queries. In this setting, agents must infer latent intent,
  extract preferences from noisy interaction histories, and select among
  competing alternatives. Existing benchmarks rarely test this capability,
  as they often rely on user-refined queries or simplified histories. We
  introduce personalized product search (PPS), a testbed for agentic
  personalization under raw queries and diverse histories. We construct
