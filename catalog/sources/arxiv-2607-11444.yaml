  contributes little on the target domain, and standard supervised fine-tuning
  (SFT) leaves the composition of this pool unchanged. We propose a simple,
  budget-preserving pipeline that realigns the expert pool to the target
  domain before fine-tuning. Given a target domain, we (1) prune the experts
