brief: >-
  Half the expert pool of a pretrained MoE contributes little on a target
  domain, and standard fine-tuning leaves that dead capacity in place.
  Deleting the least domain-salient half and regrowing it from the survivors,
  before any SFT, recovers it at identical parameter count and inference cost.


  UMoE scores experts with REAP saliency on 1024 calibration samples from the
  SFT data, prunes 50%, copies each survivor into a freed slot, then perturbs
  parent and copy independently (sigma = 0.05, router row plus MLP), then runs
  ordinary full-parameter SFT. Tested on Qwen3-30B-A3B and Qwen3.5-35B-A3B
  over math, code, science, tool-use, and agentic coding, 12 benchmarks.


  Math average rose +3.40 and +1.67 on the two models; SWE-bench Verified
  pass@1 went 16.2% to 22.2%; GPQA-Diamond +3.10. All 15 paired data-scaling
  comparisons favored UMoE. On an in-house corpus where Direct SFT already
  beat Qwen3-30B-A3B-Thinking (82.81 vs. 81.06), UMoE added +1.36.


  The comparison is matched: same data, same hyperparameters, only
  initialization differs, and ablations isolate pruning criterion and
  perturbation placement (one-sided noise scores 33.61, below Direct SFT at
  37.85). The mechanism claim is tested by post-hoc pruning: cutting Direct
  SFT to 64 experts costs 0.12, cutting UMoE costs 5.00.


  No third architecture family, no RL stage, and the pruning ratio is fixed at
  50% throughout.


  If you post-train MoEs for a domain, reorganizing the pool is a free lever.
