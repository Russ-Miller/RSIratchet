summary: >-
  Knowledge-intensive reasoning requires Large Language Models (LLMs) to
  ground answers in provided evidence. When evidence is insufficient, it is
  desirable that models abstain rather than confidently generating
  unsupported answers. Existing abstention methods rely on uncertainty
  estimation or evidence sufficiency checks, but neither tests whether the
  reasoning process for generation, driven by the interaction of provided
  evidence and the model's internal memory parameters, is actually grounded
