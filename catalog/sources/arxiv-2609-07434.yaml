summary: >-
  Natural-language Computer-Aided Design (CAD) code generation aims to turn
  design intent into executable and editable parametric programs. Large
  language models (LLMs) make this goal increasingly practical, but useful
  systems must preserve the construction process behind the rendered
  geometry. Existing benchmarks and methods mostly focus on how closely the
  generated CAD model matches the reference geometry, often using metrics
  such as Intersection over Union (IoU). Such metrics can miss errors in
  part decomposition, construction hierarchy, Boolean operations, sketch
  structure, and geometric rel
