brief: >-
  Vision-language models attend more to image tokens when asked to caption an
  image than when asked other visual questions, and copying that attention
  shift into non-caption queries at inference cuts object hallucination. CAST
  probes attention heads with an SVM classifier to find heads that separate
  caption from non-caption queries, averages the output difference over 1,000
  VQA samples from the LLaVA-1.5-7b pretraining set, and adds that shift
  vector to the Top-K heads at decoding time, with no training.


  Tested on LLaVA-1.5-7b, Qwen-VL-Chat and LLaVA-NeXT across POPE, CHAIR,
  MMHal-Bench, MHumanEval and MME. POPE accuracy rises +5.64% and F1 +5.50% on
  average; CHAIR CS and CI drop 6.43 points; MMHal-Bench score +0.16 with VH
  rate down 2.95%. Time-to-first-token goes from 99.8ms to 102.2ms, versus
  160.1ms for VCD. 65.92% of heads show increased visual attention under
  caption queries, concentrated in layers 7-20.


  Effects are measured against 4 training-free baselines (VCD, OPERA, PAI,
  VTI) at comparable settings, with ablations on steering intensity, head
  count, caption-query choice, and a precomputed-versus-on-the-fly comparison,
  which isolates the mechanism reasonably well.


  All models are 7b-class open LVLMs; appendices claim broader models but the
  main tables do not cover closed models or non-object hallucination. If you
  serve an LVLM, this is a near-free latency-neutral alternative to
  contrastive decoding.
