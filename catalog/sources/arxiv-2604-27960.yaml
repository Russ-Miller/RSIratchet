brief: >-
  Letting an LLM write Answer Set Programming code and then repair it from
  solver feedback beats having the model reason directly, and the repair loop,
  not any hand-authored domain knowledge, is what does the work. ASP's
  nonmonotonic stable model semantics also beats SMT on defeasible tasks,
  where SMT-based pipelines fall below the standalone LLM.


  LLM+ASP translates a problem description into a clingo program with a
  task-agnostic prompt, runs it, and feeds solver output back for UPDATE or
  PASS decisions. Tested with Gemini 2.5 Pro, Gemini 2.5 Flash, o4-mini,
  DeepSeek R1-0528 and DeepSeek V3 on ZebraLogic XL and a custom XXL set,
  SudokuBench, Mystery Blocksworld, MultiLogicNMR and BoardgameQA, 3 trials
  each.


  Average accuracy rises from 51.3% baseline to 78.0%. Ablating revision drops
  it to 54.6%, at 2.18 revisions on average. On ZL-XXL, 24.2% to 71.3%;
  SudokuBench 8.4% to 59.8%. A 2.6k-token compact reference beats a 22k-token
  one (73.1% vs 70.0%), with syntax errors 84 to 41 to 16. On MultiLogicNMR,
  ASP reaches 92.9% skeptical vs 35.8% for SMT.


  The revision ablation and the matched zero-shot ASP-vs-SMT comparison
  isolate the causes well. BoardgameQA shows no gain (82.4% vs 84.7%) and may
  be contaminated; DeepSeek V3 reaches only 45.0% with a 37.33% false-accept
  rate, so the loop does not rescue non-reasoning models.


  If you are routing hard constraint or defeasible problems, pick the
  formalism by task type and budget revisions rather than prompt engineering.
