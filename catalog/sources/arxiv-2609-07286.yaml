  answering "yes" to absent sound events, thus undermining reliability in
  audio question answering. We propose Token-Adaptive Decoding (TAD), a
  training-free strategy for hallucination mitigation that grounds the
  initial yes/no decision by contrasting logits under real audio with a
  matched silent reference. TAD introduces a token-adaptive,
