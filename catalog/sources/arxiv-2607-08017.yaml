summary: >-
  Large-Language Models (LLMs) can be prone to flawed and unfaithful
  reasoning that decoding strategies like Self-Consistency (SC) fail to
  detect as they evaluate only final-answer agreement while ignoring the
  logical validity of intermediate steps. This raises three fundamental
  questions: How can we reliably quantify uncertainty in LLM reasoning? Can
  semantic, structural, and causal awareness select more faithful reasoning
  compared to naïve majority voting? and How robust is reasoning topology
  under adversarial conditions? To address these questions, we introduce
