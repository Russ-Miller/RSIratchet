brief: >-
  Self-consistency accuracy in small models is partly built on "lucky
  guesses": correct answers reached through flawed intermediate reasoning, and
  filtering for reasoning structure removes them at a cost in nominal
  accuracy.


  GraphEVAL converts 20 sampled chains-of-thought per question (T = 0.7, 3-6
  steps) into causal DAGs via a separate decomposer (GPT-4o), scores pairwise
  Semantic-Structural Graph Edit Distance, and derives an uncertainty metric
  (GRCS) plus a medoid-based decoding rule (Graph Self-Consistency). Models:
  Llama 3.1 8B, Phi-4 (14B), DeepSeek R1 Distill-Llama-70B, on GSM8K, BoolQ,
  StrategyQA, MedQA, GPQA Diamond.


  GRCS gives the strongest negative correlation with faithfulness in 8 of 15
  model-dataset pairs and stays negative in 14 out of 15 (93.3%), where
  dispersion, entropy, Topo-UQ and CoTA flip positive in places. GSC costs
  Llama 3.1 8B -7.6 points on GSM8K and -9.0 on MedQA, is roughly flat for
  Phi-4 (+2.5 BoolQ, -2.0 GPQA), and is non-significant for DeepSeek R1. In
  audited disagreement cases GSC wins are faithful 79.5% of the time versus
  57.6% for SC (+21.9 pp, p < 0.05).


  Effects were measured, with McNemar and Wilcoxon tests, an adversarial
  medoid ablation showing negative accuracy-faithfulness slopes for Llama (p =
  0.011) and Phi-4 (p = 0.010), and human-plus-Gemini-3-Pro annotation at
  Cohen's κ = 0.913. Faithfulness ground truth rests on Early Answering,
  bootstrapped over 20 questions, 10 responses each; the judge is itself an
  LLM.


  The signal weakens on the most capable model (DeepSeek R1, r = -0.01, p =
  0.856), and chains were capped at 6 steps, so long-horizon compositional
  reasoning is untested. Treat SC accuracy on small models as an upper bound
  that includes unfaithful paths.
