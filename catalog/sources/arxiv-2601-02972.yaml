brief: >-
  Penalizing tokens generated after the first correct answer inside a
  reasoning trace cuts chain-of-thought length by a quarter to a half with
  roughly a point of accuracy loss, and the gains grow with model size while
  reversing on small models.


  The method is 2-stage: supervised fine-tuning on either shortest-correct
  rejection samples or on traces with the post-think summary stripped, then
  GRPO with a length penalty equal to the proportion of tokens after the first
  correct answer. Training used 13K math problems from DeepScaleR; evaluation
  covered 7 tasks spanning MATH-500, AIME 24/25, GPQA-Diamond,
  LiveCodeBenchv6, LongBenchv2, and CommonsenseQA, on Qwen3-1.7B/8B/32B and
  DeepSeek-R1-Qwen-7B-Distill.


  Responses shortened 28% on Qwen3-8B and 40% on Qwen3-32B, with accuracy
  drops of 1.6 and 2.5 points. Area under the Overthinking-Adjusted Accuracy
  curve reached 76.6, 5 points over the base model and 2.5 over the next-best
  baseline.


  Component ablations separate SFT from RL: RL without SFT gives the
  second-shortest traces but lower AUC (73.2 vs 75.5 and 76.6). 6
  efficient-reasoning baselines were run at matched settings.


  It does not hold everywhere. On Qwen3-1.7B AUC fell from 65.4 to 62.1, and
  on DeepSeek-R1-7B from 62.1 to 59.6; length reductions on LiveCodeBench and
  LongBenchv2 were only 8-14%, where plain SFT and RL without a penalty won. 1
  model family, dense only, math-only training.


  If you are budgeting inference for larger reasoning models, an
  answer-anchored penalty beats fixed thinking budgets.
