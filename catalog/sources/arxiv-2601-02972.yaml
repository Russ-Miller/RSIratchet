brief: >-
  Penalizing tokens generated after the first correct answer inside a
  reasoning trace cuts response length without the accuracy collapse that
  fixed thinking budgets cause. The penalty is adaptive: it is the share of
  tokens after the first correct answer, so a model that answers wrong then
  self-corrects is not punished.


  The method is SFT (either rejection sampling the shortest correct response,
  or stripping the post-think summary) followed by GRPO with that penalty.
  Tested on Qwen3-1.7B/8B/32B and DeepSeek-R1-Qwen-7B-Distill, trained on 13K
  DeepScaleR math problems, evaluated on MATH-500, AIME 24/25, GPQA-Diamond,
  CommonsenseQA, LiveCodeBench v6 and LongBench v2.


  Responses shorten 28% for Qwen3-8B and 40% for Qwen3-32B, with accuracy
  drops of 1.6 and 2.5 points. On area under the Overthinking-Adjusted
  Accuracy curve, Format-Adaptive-Answer scores 76.6 on Qwen3-8B, 5 points
  over the base model and 2.5 over the next best of 7 baselines including
  hard, soft, normalized length penalties and TWYN.


  Component ablations are run: RL without SFT reaches 73.2 AUC versus 76.6, so
  the SFT stage carries part of the gain. Training is math-only and 1 dense
  model family.


  The gain does not transfer everywhere: on LiveCodeBench and LongBench v2
  plain SFT and RL without penalty win, and on Qwen3-1.7B (62.1 vs 65.4) and
  the DeepSeek distill (59.6 vs 62.1) AUC falls below base despite shorter
  outputs. Smaller models may not be worth compressing this way.
