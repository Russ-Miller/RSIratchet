summary: The reasoning capabilities of large language models (LLMs) have
  improved substantially through increased test-time computation, typically in
  the form of intermediate tokens known as chain-of-thought (CoT). However,
  CoT often becomes unnecessarily long, increasing computation cost without
  actual accuracy gains or sometimes even degrading performance, a phenomenon
  known as ``overthinking''. We propose a multi-stage efficient reasoning
  method that combines supervised fine-tuning -- via rejection sampling or
  reasoning trace reformatting -- with reinforcement learning using an
  adaptive length penal
ingested_at: 2026-11-17
brief: >-
  Penalizing only the tokens a reasoning model generates after its first
  correct answer shortens chains of thought without the accuracy collapse that
  fixed thinking budgets cause. The penalty is adaptive: traces that never
  reach a correct answer get no penalty, so self-correction survives while
  redundant self-verification is suppressed.


  The pipeline is SFT (either shortest-correct rejection sampling or
  reformatting traces to drop the post-think summary) followed by GRPO with
  that length reward, trained on 13K DeepScaleR math problems. Evaluated on
  Qwen3-1.7B/8B/32B and DeepSeek-R1-Qwen-7B-Distill across MATH-500, AIME 24,
  AIME 25, GPQA-Diamond, CommonsenseQA, LiveCodeBench v6, and LongBench v2.


  Response length drops 28% for Qwen3-8B and 40% for Qwen3-32B, with accuracy
  drops of 1.6 and 2.5 points. On AUC OAA for Qwen3-8B, Format-Adaptive-Answer
  scores 76.6 against 71.6 for the base model and 74.0 for the best baselines
  (SFT and TWYN).


  Measured, with 6 competing efficient-reasoning baselines and component
  ablations separating SFT from RL: RL without SFT reaches 73.2 AUC OAA versus
  76.6 for the full pipeline. Gains are not universal. On Qwen3-1.7B (62.1 vs
  65.4) and DeepSeek-R1-7B (59.7 vs 62.1), AUC OAA falls below base.
  Hard-Length wins on LongBench v2; training was math-only, dense Qwen models,
  no MoE, no non-reasoning tasks.


  If you are paying for long CoT at 8B+, this is a cheap trade worth testing.
