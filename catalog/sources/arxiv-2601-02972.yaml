brief: >-
  Penalizing tokens generated after the first correct answer in a reasoning
  trace cuts response length without forcing a fixed thinking budget, and the
  saving grows with model size.


  The method is 2-stage: SFT on either shortest-correct rejection-sampled
  traces or on traces with the post-thinking summary stripped, then GRPO with
  a length penalty equal to the proportion of tokens after the first correct
  answer. Training used 13K DeepScaleR math problems; evaluation covered
  MATH-500, AIME 24/25, GPQA-Diamond, CommonsenseQA, LiveCodeBenchv6 and
  LongBenchv2 on Qwen3-1.7B/8B/32B and DeepSeek-R1-Qwen-7B-Distill.


  Response length fell 28% for Qwen3-8B and 40% for Qwen3-32B, with accuracy
  drops of 1.6 and 2.5 points. Average AUC OAA for Format-Adaptive-Answer was
  76.6, 5 points above the base model and 2.5 above the next best method.


  The effect is measured against 7 efficient-reasoning baselines run under the
  same 16,384-token cap, with component ablations separating SFT from RL: RL
  without SFT gave shorter traces but lower AUC OAA (73.2 vs 76.6).


  It does not hold everywhere. On LiveCodeBench and LongBenchv2 plain SFT and
  Hard-Length 16k win, and on Qwen3-1.7B and DeepSeek-R1-7B AUC OAA dropped
  below base despite shorter traces. Training was math-only, dense Qwen
  models, no non-reasoning tasks.


  If you ship a large reasoning model, this is a cheap post-hoc trim; for
  small models, check the metric you care about.
