brief: >-
  Penalizing only the tokens a reasoning model emits after it has already
  stated a correct answer cuts chain-of-thought length without forcing a fixed
  thinking budget. The penalty is the fraction of trace after the first
  correct answer, applied only when the final answer is correct, so
  self-correction stays unpunished while redundant self-verification is
  discouraged.


  The pipeline is SFT (either shortest-correct rejection sampling or stripping
  the post-think summary) followed by GRPO with that penalty, trained on 13K
  DeepScaleR math problems and evaluated on MATH-500, AIME 24, AIME 25,
  GPQA-Diamond, CommonsenseQA, LiveCodeBench v6 and LongBench v2.


  On Qwen3-8B, length falls 28% (Adaptive-Answer) and 33%
  (Format-Adaptive-Answer) with about a one-point accuracy loss; Qwen3-32B
  drops 40% with a 2.5-point loss. AUC OAA reaches 76.6, 5 points over the
  base model and 2.5 over the next best. Reductions were largest on MATH-500
  (36%/50%) and smallest on LiveCodeBench (11%/8%).


  Evidence includes 6 baselines at the same 16,384-token cap and component
  ablations separating SFT from RL: RL without SFT gives shorter traces but
  lower AUC OAA. On Qwen3-1.7B and DeepSeek-R1-Qwen-7B-Distill, AUC OAA falls
  below base despite shorter traces.


  Training was math-only, dense Qwen models, and non-reasoning tasks were not
  measured.


  Use it if you want adaptive length cuts on large models; small models may
  not gain.
