brief: >-
  Penalizing tokens generated after the first correct answer, rather than
  capping a thinking budget, cuts reasoning length while leaving accuracy
  nearly intact. The penalty is adaptive: traces stay longer on harder
  problems and self-correction goes unpunished when the first answer was
  wrong.


  The method is SFT (either rejection sampling for the shortest correct trace,
  or reformatting to drop the post-think summary) followed by GRPO with a
  length penalty equal to the fraction of tokens after the first correct
  answer. Trained on 13K DeepScaleR math problems, evaluated on MATH-500, AIME
  24, AIME 25, GPQA-Diamond, CommonsenseQA, LiveCodeBench v6 and LongBench v2,
  using Qwen3-1.7B/8B/32B and DeepSeek-R1-Qwen-7B-Distill.


  Response length drops 28% for Qwen3-8B and 40% for Qwen3-32B, with accuracy
  losses of 1.6 and 2.5 points. On AUC OAA, Format-Adaptive-Answer scores 76.6
  versus 71.6 for the base model and 74.0 for the best baselines (SFT, TWYN).


  Measured against 7 efficient-reasoning baselines including hard, soft and
  normalized length penalties, with component ablations separating SFT from
  RL: RL without SFT reaches 73.2 AUC OAA, below both full methods.


  Gains are weakest off the math training domain. On LiveCodeBench and
  LongBench v2 the methods are dominated by Hard-Length and plain SFT, and on
  Qwen3-1.7B and DeepSeek-R1-7B AUC OAA falls below base despite shorter
  traces. 1 dense model family; no MoE.


  If you use fixed thinking budgets, an answer-position penalty is the
  stronger default on math and QA.
