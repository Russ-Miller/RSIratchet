brief: >-
  Penalizing tokens generated after a reasoning model's first correct answer,
  rather than imposing a fixed thinking budget, cuts chain-of-thought length
  while leaving accuracy mostly intact. The penalty leaves self-correction
  alone: if no correct answer appears, no penalty applies.


  The method (Adaptive-Answer and Format-Adaptive-Answer) is SFT on either
  shortest-correct rejection-sampled traces or traces with the post-think
  summary stripped, followed by GRPO with the length penalty. Training used
  13K math problems from DeepScaleR; evaluation covered MATH-500, AIME 24,
  AIME 25, GPQA-Diamond, CommonsenseQA, LiveCodeBenchv6 and LongBenchv2 on
  Qwen3-1.7B/8B/32B and DeepSeek-R1-Qwen-7B-Distill.


  Response length fell 28% for Qwen3-8B and 40-41% for Qwen3-32B, with
  accuracy drops of 1.6 and 2.5 points. AUC OAA reached 76.6 on Qwen3-8B, 5
  points over the base model and 2.5 over the next-best method (TWYN and SFT
  at 74.0).


  Measured, with 6 competing efficient-reasoning baselines trained under
  matched settings and component ablations separating SFT from RL: RL without
  SFT gives 73.2 AUC OAA versus 76.6 for the full pipeline.


  It does not hold on LiveCodeBench and LongBenchv2, where plain SFT and a 16k
  hard cutoff win, nor on Qwen3-1.7B or the DeepSeek distill, where AUC OAA
  drops below base. Dense Qwen models only; no non-reasoning tasks tested.


  If you are tuning for inference cost on math-like reasoning, the
  first-correct-answer penalty is worth trying over budget forcing.
