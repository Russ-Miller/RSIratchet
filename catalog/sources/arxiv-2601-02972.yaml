brief: >-
  Penalizing tokens generated after a reasoning model's first correct answer,
  rather than imposing a fixed thinking budget, cuts chain-of-thought length
  while leaving accuracy nearly intact, and the gains grow with model size.


  The method is 2-stage: SFT on either shortest-correct rejection-sampled
  traces (Adaptive-Answer) or traces with the post-think summary stripped
  (Format-Adaptive-Answer), then GRPO with a length penalty equal to the
  proportion of tokens after the first correct answer. Training used 13K math
  problems from DeepScaleR; evaluation spanned MATH-500, AIME 24/25,
  GPQA-Diamond, CommonsenseQA, LiveCodeBenchv6 and LongBenchv2, on
  Qwen3-1.7B/8B/32B and DeepSeek-R1-Qwen-7B-Distill.


  Response length fell 28% for Qwen3-8B and 40-41% for Qwen3-32B, with
  accuracy drops of 1.6 and 2.5 points. AUC OAA for Format-Adaptive-Answer
  reached 76.6 on Qwen3-8B, 5 points above the base model and 2.5 above the
  next best method (SFT and TWYN at 74.0).


  Measured, with 7 baselines at the same 16,384-token cap and component
  ablations separating SFT from RL (RL without SFT: 68.8 accuracy, 73.2 AUC
  OAA).


  It does not hold everywhere: on LiveCodeBench and LongBenchv2 plain SFT and
  Hard-Length 16k win, and on Qwen3-1.7B and DeepSeek-R1-7B AUC OAA falls
  below base. Training was math-only, dense Qwen models, no non-reasoning task
  evaluation.


  If you are fitting length penalties, the first-correct-answer anchor is a
  cheap alternative to budget forcing.
