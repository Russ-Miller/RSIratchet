brief: "Reward models and LLM judges cannot reliably tell a good agent
  trajectory from a plausible near-miss, and they get worse as the trajectory
  gets longer. Plan-RewardBench puts 2 candidate trajectories (tool calls plus
  executed tool outputs) side by side under a fixed tool registry and user
  intent, across 4 families: Safety Refusal, Tool-Irrelevance/Unavailability,
  Complex Planning, and Robust Error Recovery. Pairs come mostly from natural
  multi-model rollouts (70%), plus minimal-edit perturbations (22%) and
  rule-based injections (8%), labelled by a 3-judge panel with meta-review and
  a human audit (Cohen's kappa 0.71-0.86). 21 evaluators were tested:
  discriminative scalar RMs, generative RMs, and general LLM judges, with A/B
  order swapping for pairwise inputs. No model clears 70% macro-average.
  Qwen-Plus leads at 69.96%, a 70B scalar RM is close behind at 69.21%, and
  Llama-3.2-8B-Instruct sits near chance at 50.67%. Safety is the most spread
  family: 40.69-84.80% among LLM judges, while open scalar RMs cluster at
  49-57%. Above 32k tokens several judges fall below chance; pairwise judges
  collapse faster than pointwise RMs. Diagnosed failure modes include
  rewarding unnecessary tool calls, ignoring mid-trajectory constraint
  changes, and crediting blind retries. Context is held fixed within each
  pair, so the measured variable is trajectory quality alone, though gold
  labels for planning are partly LLM-derived and subjective. English,
  text-only, single-agent. If you use an LLM as a reward signal in agentic RL,
  expect it to be noisy on long horizons."
