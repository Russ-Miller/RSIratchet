summary: The ML community is rapidly exploring techniques for prompting
  language models (LMs) and for stacking them into pipelines that solve
  complex tasks. Unfortunately, existing LM pipelines are typically
  implemented using hard-coded &#34;prompt templates&#34;, i.e. lengthy
  strings discovered via trial and error. Toward a more systematic approach
  for developing and optimizing LM pipelines, we introduce DSPy, a programming
  model that abstracts LM pipelines as text transformation graphs, i.e.
  imperative computational graphs where LMs are invoked through declarative
  modules. DSPy modules are parameterized, meaning they can learn (by creating
  and collecting demonstrations) how to apply compositions of prompting,
  finetuning, augmentation, and reasoning techniques. We design a compiler
  that will optimize any DSPy pipeline to maximize a given metric. We conduct
