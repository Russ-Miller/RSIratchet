summary: >-
  When reinforcement learning (RL) is used for post-training automatic
  speech recognition (ASR), the reward almost always lives in the text
  space: it compares a hypothesis with the reference and never checks
  whether the hypothesis is supported by the audio. On highly regular speech
  this licenses a shortcut - guessing from a strong language prior rather
  than listening. Once the acoustics degrade, the shortcut runs unchecked
  and emits fluent but ungrounded words, i.e., insertion errors. We propose
  an acoustic-fidelity reward: a GRPO reward augmented with a separately
  pretrained, permanently frozen
notes: >-
