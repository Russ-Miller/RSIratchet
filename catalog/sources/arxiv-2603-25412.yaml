  content safety (i.e., detecting harmful, biased, or factually incorrect
  outputs), while treating the underlying reasoning chain as an opaque
  intermediate artifact. We argue that reasoning safety constitutes a
  fundamental security dimension orthogonal to content safety: the requirement
  that a model's reasoning trajectory be logically consistent, computationally
