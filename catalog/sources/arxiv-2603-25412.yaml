brief: >-
  Prompting an off-the-shelf LLM with an explicit 9-type error taxonomy turns
  it into a step-level reasoning-error localizer; remove the taxonomy and the
  same model collapses on structural failures like reasoning loops.


  The authors define "reasoning safety" (logical consistency, computational
  efficiency, manipulation resistance), annotate 4,155 chains from
  ProcessBench (Omni-MATH, GSM8K) plus 4 attacks (BadChain, Preemptive Answer
  Attack, OverThink, Deadlock), and build a parallel monitor that inspects
  each \n\n-delimited step and can interrupt generation.


  On a 450-chain static benchmark, position accuracy reaches 87.11% with
  Gemini-3-Flash, versus 68.00% for Qwen2.5-Math-PRM-7B and 36.22% for the
  LLM-as-Critic hallucination baseline; false positive rate on 193 clean
  chains is 1.04% vs 84.46% for LCM. BadChain ASR falls from 0.78 to 0.00 on
  DeepSeek-V3.2; Deadlock token amplification drops from 33.86x to 0.11x on
  DeepSeek-R1-Distill-Llama-8B.


  The taxonomy ablation is the cleanest evidence: identical prompt minus
  taxonomy drops Gemini-3-Flash reasoning-loop localization from 94.00% to
  2.00%, overall 87.11% to 63.11%. Weaknesses: no matched-token-budget
  baseline, PRM thresholding details thin, monitor latency measured only under
  attack, and ground truth comes from the authors' own annotation by majority
  vote.


  Missing-constraint errors stay hard (42.00% at best). Attacks are 4 known
  ones; adaptive evasion is claimed but not shown here.


  If you are building CoT guardrails, the taxonomy in the prompt, not the
  backend model, is the lever.
