summary: >-
  Large Language Models (LLMs) struggle with long-context code due to window
  limitations. Existing textual code compression methods mitigate this via
  selective filtering but often disrupt dependency closure, causing semantic
  fragmentation. To address this, we introduce LongCodeOCR, a visual
  compression framework that renders code into compressed two-dimensional
  image sequences for Vision-Language Models (VLMs). By preserving a global
  view, this approach avoids the dependency breakage inherent in filtering.
