brief: >-
  Rendering long code contexts into images and feeding them to a
  vision-language model beats text-side pruning on tasks that need global
  structure, but loses on tasks that need exact symbols.


  LongCodeOCR renders code into 2D image sequences and is compared against
  LongCodeZip and prompt-compression baselines (LLMLingua, LLMLingua-2, RAG
  variants, random line deletion) at matched compression ratios. Models:
  Qwen3-8B for text, Qwen3-VL-8B and Glyph (9B) for vision. Benchmarks: Long
  Module Summarization (139 instances), LongCodeQA (443 instances, 98 repos),
  Long Code Completion (500 Python instances), RepoBench-P XF-F.


  On summarization at ~1.7x, CompScore is 87.25 vs 50.40 for LongCodeZip
  (+36.85) and 58.18 for LLMLingua-2. RepoBench-P ES rises from 39.48 to 50.22
  (Qwen3-VL-8B) and 60.68 (Glyph) at 2.0x. At 1M tokens on LongCodeQA, 72.00
  vs 64.00, with compression latency ~1 minute vs ~4.3 h and 0
  compression-stage LLM tokens vs 221.76M.


  Ratios are matched per benchmark and the text/vision models share a family,
  which isolates representation reasonably well. Glyph is 9B, not 8B.


  The fidelity ceiling is real: on LCC 16k+, Qwen3-VL-8B Exact Match collapses
  to 2.08 while ES stays at 38.38, and LongCodeZip leads at 512k (74.47 vs
  65.96). Only 8-9B open models were tested.


  If your pipeline needs repository-wide coverage rather than character-exact
  output, visual compression is worth trying.
