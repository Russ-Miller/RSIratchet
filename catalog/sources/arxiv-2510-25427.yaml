brief: >-
  Lean provers that clear 75%+ on MiniF2F solve close to 1 in 10
  research-level theorems. RLMEval draws 613 blueprint theorems, the
  high-level named results linked from the informal blueprint rather than the
  auxiliary lemmas that make up 68.3% of theorems on average, from 6 real Lean
  4 projects (Carleson, FLT, PFR, PNT, FLT3, TLB).


  Tasks are neural theorem proving from a formal statement and proof
  autoformalization from an informal proof plus statement, each in an easy
  mode with full project lemmas and a normal mode with blueprint theorems
  only. Models: Llemma-7B, DeepSeek-Prover-V1.5-RL, DeepSeek-Prover-V2-7B,
  Goedel-Prover-SFT, KiminaProver-7B, at pass@128.


  Best result is 10.3% pass@128 for DeepSeek-Prover-V2-7B on autoformalization
  in normal mode, against its reported 75%+ on MiniF2F at pass@32. Access to
  auxiliary lemmas lifts that model from 8.8% to 14.7% (NTP) and 10.3% to
  16.7%. Informal proofs add about 1.5 points. Per-project spread runs from
  32.1% on FLT3 to 2.73% on Carleson, tracking human proof length. Successful
  model proofs average 2.5–6.0 lines versus 16.6 for humans.


  The easy/normal contrast is a clean within-model manipulation; contamination
  is unquantified for all models except Llemma-7B, and only the 7B DeepSeek
  variant was run, at pass@128 rather than pass@8192, so scores are lower
  bounds.


  Treat MiniF2F numbers as uninformative about research formalization utility.
