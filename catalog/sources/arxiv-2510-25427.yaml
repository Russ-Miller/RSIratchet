summary: Despite impressive results on curated benchmarks, the practical
  impact of large language models (LLMs) on research-level neural theorem
  proving and proof autoformalization is still limited. We introduce RLMEval,
  an evaluation suite for these tasks, focusing on research-level mathematics
  from real-world Lean formalization projects. RLMEval targets the evaluation
  of neural theorem proving and proof autoformalization on challenging
  research-level theorems by leveraging real Lean Blueprint formalization
  projects. Our evaluation of state-of-the-art models on RLMEval, comprising
  613 theorems from 6
