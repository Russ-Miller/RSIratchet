brief: >-
  Lean provers that clear 75%+ on MiniF2F solve close to nothing on the main
  theorems of real research formalization projects. RLMEval draws 613
  blueprint theorems from 6 active Lean 4 projects (Carleson, FLT, PFR, PNT,
  FLT3, TLB), deliberately excluding the auxiliary lemmas that make up 68.3 %
  of theorems on average and are far shorter (6.6 vs 16.6 lines of proof).


  DeepSeek-Prover-V2-7B, DeepSeek-Prover-V1.5-RL, Goedel-Prover-SFT,
  KiminaProver-7B and a Llemma-7B baseline were run at pass@128 on 2 tasks:
  proving from the formal statement, and autoformalizing a given informal
  proof. Best result was 10.3 % on autoformalization in normal mode, against
  75 %+ on MiniF2F at pass@32 for the same model. Access to project auxiliary
  lemmas (easy mode) lifted it to 16.7 %; the informal proof added only ~1.5
  percentage points over bare proving (8.8 % to 10.3 %). Success is
  concentrated on short proofs: model proofs average 2.5–6.0 lines against
  16.6 human. Per-project spread runs from 32.1 % on FLT3 to 2.73 % on
  Carleson.


  The gap is measured, across 5 models and 2 context conditions, with a
  pre-contamination baseline (Llemma predates all project commits). Only 7B
  models were tested, sampling stopped at pass@128 versus pass@8192 elsewhere,
  and context is simple in-file truncation, so absolute numbers understate the
  ceiling.


  Treat MiniF2F-style scores as uninformative about research formalization
  utility.
