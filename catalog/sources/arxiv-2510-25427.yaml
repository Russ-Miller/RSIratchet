ingested_at: 2026-09-19
brief: >-
  Lean provers that clear 75%+ on MiniF2F solve close to nothing on the
  high-level theorems of real research formalization projects. RLMEval
  collects 613 blueprint theorems (the conceptually significant results linked
  in a project's informal blueprint, not the auxiliary lemmas that make up
  68.3% of theorems on average) from 6 Lean 4 projects: Carleson, FLT, PFR,
  PNT, FLT3, TLB. Tasks are neural theorem proving from a formal statement and
  proof autoformalization from an informal proof plus statement, in an easy
  mode with all project lemmas in context and a normal mode where
  non-blueprint lemmas are removed.


  At pass@128, the best model, DeepSeek-Prover-V2-7B, reaches 10.3% on
  autoformalization in normal mode and 14.7% on NTP in easy mode;
  Goedel-Prover-SFT and KiminaProver-7B fall to 4.9% and 4.2%. Informal proofs
  add about 1.5 percentage points. Per-project spread runs from 32.1% on FLT3
  to 2.73% on Carleson, tracking human proof length. Successful model proofs
  average 2.5-6.0 lines against a 16.6-line human average.


  The measurement is clean and the easy/normal contrast isolates the value of
  auxiliary lemmas, but only 5 models are tested, all at 7B, and pass@128 is
  far below the pass@8192 budgets used on MiniF2F, so the numbers are a floor.
  Contamination is unquantified for all models except Llemma-7B.


  Treat competition-benchmark prover scores as a poor predictor of usefulness
  on live formalization projects.
