  from real-world Lean formalization projects. RLMEval targets the evaluation
  of neural theorem proving and proof autoformalization on challenging
  research-level theorems by leveraging real Lean Blueprint formalization
  projects. Our evaluation of state-of-the-art models on RLMEval, comprising
