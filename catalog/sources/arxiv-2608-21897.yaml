summary: >-
  Reliable planning requires converting natural-language instructions into
  executable symbolic specifications, yet large language models remain
  brittle without costly PDDL annotations and may exploit solver success in
  semantically unfaithful ways. We study how to learn faithful
  natural-language-to-PDDL formalization using only solver feedback, without
  human-written demonstrations. We propose a solvergrounded multi-role
  reinforcement learning framework where a single language model acts as an
  Actor, Judge, and Editor for generation, verification, and repair. The
  Actor proposes PDDL specifications
