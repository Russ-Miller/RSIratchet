summary: >-
  Vision Language Models (VLMs) have emerged in the robotic domain as a
  powerful tool that enables environmental perception with language context,
  serving as a catalyst for open-vocabulary tasks like ObjectNav. Yet, their
  computational footprint typically confines them to cloud execution,
  hindering low-latency inference with local deployment on
  resource-constrained robots. To address this challenge, we present a
  distillation strategy that transfers complex spatial-semantic reasoning
  from large frontier models into a lightweight, 4B-parameter local VLM for
