brief: >-
  Strategic planning, not tool selection, is what stops agents on stateful
  enterprise workflows: handing models a human-written plan lifts success by
  14–35 percentage points, while adding distractor tools barely matters.


  EnterpriseOps-Gym is a containerized sandbox with 164 relational database
  tables and 512 tools across 8 domains (CSM, ITSM, HR, Email, Calendar,
  Teams, Drive, Hybrid), holding 1,150 expert-authored tasks with SQL
  final-state verifiers checking goal completion, referential integrity,
  policy compliance and side effects. Expert trajectories average 9.15 steps,
  up to 34. 14 frontier models were run in a ReAct loop with oracle tool
  retrieval.


  Claude Opus 4.5 leads at 37.4% average pass@1; best open model DeepSeek-V3.2
  (High) reaches 24.5%. ITSM (28.5%) and Hybrid (30.7%) are hardest. On 30
  infeasible tasks, the best refusal-without-side-effects rate is 53.9%.
  Accuracy falls monotonically with horizon, roughly 35% at 4 steps to under
  20% by step 16.


  The planning claim is measured, not argued: distractor ablations (+5/+10/+15
  tools) changed completion by about +1.0%, and plan-conditioned runs compared
  Claude-generated plans against human plans with the executor held fixed.
  Only 3 models and 3 domains were tested in that ablation, and 1 model
  carried the thinking-budget study.


  Treat tool retrieval as solved here and policy-aware plan generation as the
  open problem.
