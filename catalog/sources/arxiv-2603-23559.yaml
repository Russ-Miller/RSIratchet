summary: >-
  GUI agents are rapidly shifting from multi-module pipelines to end-to-end,
  native vision-language models (VLMs) that perceive raw screenshots and
  directly interact with digital devices. Despite rapid progress on general
  GUI tasks, CAPTCHA solving remains a major challenge. On the other hand,
  although specialized CAPTCHA solving pipelines exist, they cannot handle
  general GUI tasks. To address this gap, we introduce ReCAP: a
  CAPTCHA-capable native GUI agent that solves modern, interactive CAPTCHA
  challenges while retaining general GUI-agent performance. We first develop
  a dynamic CAPTCHA system
