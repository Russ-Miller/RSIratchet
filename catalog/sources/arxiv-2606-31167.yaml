summary: >-
  VLA models have emerged as a powerful paradigm for transferring semantic
  knowledge from web-scale data to physical robotic control. However,
  current single-frame architectures suffer from intrinsic limitations:
  temporal myopia that discards historical dynamics, reasoning gaps between
  high-level instructions and low-level motor commands, and inference
  inefficiency due to autoregressive scalar decoding. In this work, we
  propose MIRTH, a unified framework designed to address these challenges.
