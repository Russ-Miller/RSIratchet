brief: >-
  You can run final-state agent evaluation without building a deterministic
  backend: an LLM state tracker inferring a structured proxy database state
  from the full trace yields rankings that match expected capability ordering
  and training signal that transfers.


  The setup is Proxy State-Based Evaluation at PayPal: 208 synthetic
  e-commerce and account-management scenarios (157 train, 51 test), each
  specifying user goal, user/system facts, expected final state and expected
  agent reply. 5 cooperating LLM components (reasoning agent, user simulator,
  2 tool simulators, state tracker, judge) run ReAct-style rollouts, 10 per
  scenario, with T_max = 10 turns.


  Goal completion tracked model strength and reasoning effort (GPT-5 high
  85.76 vs medium 80.53%). SFT on filtered GPT-5 trajectories lifted
  Qwen3-30B-A3B-Thinking-2507 from 65.64% to 77.34%; RFT on own successes only
  reached 67.11%. GC fell with turn depth (74.75% short vs 42.75% long), with
  SFT gaining +26.69 pp on long.


  Evidence is measured, with targeted ablations: weakening the state tracker
  to GPT-4o raised tool hallucination from 1.33% ± 0.53 to 3.61% ± 0.88;
  removing system or user facts monotonically raised the matching
  hallucination side. Swapping simulator and judge to Gemini-2.5-Pro preserved
  rankings and SFT gains, which blunts the single-family circularity worry.
  Human-judge agreement exceeds 90%, but annotation is in-house, scenarios are
  synthetic, state-transition validation covers 50 transitions, and RFT used
  only 1 open-weight base model.


  If deterministic backends are your bottleneck, this is a cheaper substitute
  whose reliability hinges on scenario completeness.
