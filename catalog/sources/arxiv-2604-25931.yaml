summary: >-
  We identify a previously unknown calibration property of large language
  models: providing one confirmed intermediate fact toward a multi-step
  reasoning chain increases the model's confident-wrong-answer rate before
  full evidence eliminates it. We call this anchored confabulation: a
  partial anchor commits the model to confident parametric completion of
  remaining reasoning steps. We formalize it as Parametric Hallucination
  Confidence (PHC) and establish it across six lines of evidence including a
  causal injection experiment (PHC 0.613 to 0.656 to 0.595 to 0.536, N=160)
  and capability scaling acr
notes: >-
