summary: >-
  Current cultural evaluations for large language models (LLMs) often reduce
  culture to single-turn factual recall via MCQs, failing to capture a
  common use case: users seeking practical help over multiple turns in
  culturally grounded scenarios. We introduce CultureConverse, a scalable,
  multilingual simulation and evaluation harness for culturally grounded
  assistant dialogue that covers 10 East and Southeast Asian regions, 58
  subgroup identities, and 7 domains. Each simulated and evaluated episode
  produces a scored interaction where the assistant assists the user and
  infers cultural constraints
