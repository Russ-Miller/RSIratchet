summary: Large Language Models (LLMs) enhance their problem-solving capability
  by utilizing external tools. However, in open-world scenarios with massive
  and evolving tool repositories, existing methods relying on static embedding
  retrieval or parameter memorization of tools struggle to align user intent
  with tool semantics or generalize to unseen tools, respectively, leading to
  suboptimal accuracy of open-world tool retrieval and execution. To address
  these, we present ToolOmni, a unified agentic framework that enables LLMs
  for open-world tool use by proactive retrieval and grounded execution within
