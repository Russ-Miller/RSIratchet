brief: >-
  Prompt-based self-repair now works for every model tested, including an 8B
  open-weight model, reversing the earlier conclusion that weaker models are
  harmed by repairing their own code. Feeding back the raw Python error
  traceback was enough; no fine-tuning.


  The setup: 7 models across 3 families (Llama 3.1 8B, Llama 3.3 70B, Llama 4
  Scout with 16 experts, Llama 4 Maverick with 128 experts, Qwen3 32B, Gemini
  2.5 Flash, Gemini 2.5 Pro), greedy decoding at temperature = 0.0, on
  HumanEval (164 problems) and MBPP Sanitized (257 problems), with up to 5
  attempts per problem.


  Gains ran +4.9 to +17.1 pp on HumanEval and +16.0 to +30.0 pp on MBPP, with
  Gemini 2.5 Flash finishing highest (96.3% HumanEval, 93.8% MBPP). 2 repair
  rounds capture 76–95% of achievable gain. Error type predicts repair
  success: name errors repaired at ~77%, assertion errors (logical mistakes)
  only ~45%. Chain-of-thought repair prompts added up to +5.5 pp of repair
  delta over minimal prompting for the 70B model.


  Effects are measured, with a prompt ablation (minimal, explain-then-fix,
  CoT) and a token-efficiency comparison against independent resampling. No
  fine-tuned-model control, and the gains are pass-rate deltas, not
  matched-token comparisons for every model.


  Boundary: 2 short-form Python benchmarks only, no competition-level or
  repository-scale tasks, and the hardest category (assertion errors) remains
  the bottleneck.


  If you deploy repair loops, budget 2 rounds and expect logical errors to
  survive them.
