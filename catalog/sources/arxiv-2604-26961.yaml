summary: >-
  Static program slicing is a fundamental software engineering technique for
  isolating code relevant to specific variables. While recent learning-based
  approaches using language models (LMs) show promise in automating slice
  prediction, they suffer from inaccurate dependency modeling and
  unconstrained generation, where LMs fail to capture precise data flow
  relations and produce slices containing hallucinated tokens and
  statements. To address these challenges, we propose Sliceformer, a novel
  approach that reformulates static program slicing as a
