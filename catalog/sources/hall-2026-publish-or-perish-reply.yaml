archived_text: |
  Consequence of a "publish or perish" academic mindset rather than anything serious.

  No one really *reviews* such nonsense. Academics are now basically having fun writing science fiction for social media clicks 😀

  It's an industry that's beginning to resemble postmodern "critical theory" content. Journals that exist so papers can be written for academics to pad out their resumes with fancy titled pieces that do nothing to genuinely advance the knowledge of humankind.
