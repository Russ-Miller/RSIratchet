summary: >-
  Clinical diagnosis is an active evidence-seeking process in which
  clinicians acquire evidence, update competing hypotheses, and decide when
  the available evidence is sufficient for diagnosis. Yet many medical
  diagnosis systems built around large language models (LLMs) still
  formulate diagnosis as static case-to-answer prediction, with limited
  support for evidence acquisition. Agentic LLMs offer a dynamic alternative
  through tool use and intermediate diagnostic trajectories, but existing
  systems often under-specify how patient evidence should be exposed,
  scaffolded, and controlled at runtime. W
