brief: >-
  Training a small multimodal reward model on human judgments of critique
  text, then using it for GRPO, produces an image-editing evaluator whose
  written explanations and scalar scores both align better with human raters
  than zero-shot frontier MLLMs.


  ReasonEdit-22K pairs 22K edited images with 113,898 CoT critiques from 9
  small MLLMs, scored by 5 expert raters on logicality, accuracy and
  usefulness (1,366,776 scores), plus 12K human-curated CoT samples. RE-Reward
  is a Qwen3.5-4B regressor with AdaLoRA; ReasonEdit is a Qwen-3.5-9B
  evaluator trained with SFT then GRPO using RE-Reward signals.


  RE-Reward reaches SRCC 0.8958/0.9323/0.9428 on the 3 critique dimensions,
  above Gemini-3-Flash (0.8438/0.8587/0.8676) and ChatGPT-5.4. On EBench-18K,
  ReasonEdit beats LMM4Edit on all 9 metrics (e.g. instruction alignment SRCC
  0.9209 vs 0.8830). Out of distribution it leads on 5 benchmarks, including
  GenAI-Bench 83.90% vs 65.72% and ImagenHub SRCC 0.7566 vs 0.4162.


  The SFT-vs-GRPO ablation is run across 3 backbones over 5 inference runs,
  which isolates the two stages; SFT alone supplies most of the gain, GRPO
  adds a smaller increment. The CoT quality comparison against GPT-5 and
  Gemini-2.5 Pro uses text-similarity metrics against the authors' own curated
  references, so it favours their format, and zero-shot baselines were not
  fine-tuned. Training data derives largely from EBench-18K.


  If you need diagnostic rather than scalar editing evaluation, a 4B reward
  head on dense human critique ratings is a cheaper route than prompting a
  frontier model.
