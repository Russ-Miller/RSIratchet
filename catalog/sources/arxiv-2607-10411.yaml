brief: >-
  Telling a code-smell detector that the code is clean makes it say the code
  is clean, regardless of the code. Prompts asserting prior static-analysis
  approval were the most damaging framing of the 3 tested.


  The setup holds the code snippet and smell definition fixed and varies only
  the instruction: casual baseline, confirmation bias, false premise,
  contradictory hint. 700 curated samples (175 per smell) were drawn from MLCQ
  across Blob, Data Class, Feature Envy, and Long Method, with roughly 18%
  smelly, run on Llama-3.1-8B and Qwen-2.5-Coder-7B locally.


  Decision Flip Rate ran 40–72% under biased prompts and False Alignment Rate
  exceeded 90%, hitting 100.00 for Feature Envy on Qwen2.5. Recall fell to
  0.00 for Feature Envy on both models under False-Premise. Evidence-Guided
  Debiasing Prompting, which forces indicator extraction before a verdict, cut
  DFR to 12–26% and lifted Qwen2.5's Blob F1 from 0.05 to 0.51; sycophantic
  vocabulary fell from 22.57% to 0.00% on Blob.


  The effect is measured and the design isolates prompt framing, since only
  the instruction changes. But EGDP also differs structurally from the
  baseline prompt, so bias reduction and better scaffolding are not separated,
  and Data Class DFR stays at 46.29 for Qwen2.5.


  Only 2 open-source models at ~7–8B, 4 smell types, 1 dataset, no proprietary
  or larger models. Treat any user-supplied claim about code quality as an
  input to strip before prompting.
