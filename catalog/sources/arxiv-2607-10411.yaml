summary: Large Language Models (LLMs) are increasingly used for code smell
  detection tasks due to their ability to interpret program semantics.
  However, their reliability in this context remains poorly explored,
  particularly under varying prompt conditions where model predictions may be
  influenced by external cues rather than code characteristics. One such
  limitation is sycophancy bias, where models tend to align their outputs with
  user-provided assumptions instead of performing objective analysis. In this
  paper, we present the first systematic empirical study of sycophancy bias in
  LLM-based code smell
