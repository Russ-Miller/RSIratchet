summary: >-
  Humans can apply ideas learned in one context to substantially different
  situations. We call this process of searching for and constructing novel
  recombinations of learned relationships to solve new problems
  \textit{out-of-distribution (OOD) reasoning}. The capacity for large
  language models (LLMs) to support OOD reasoning underpins proposals for
  generally intelligent systems. However, this property is challenging to
  measure because most problems admit many decompositions, some involving
  shallow subproblems and others involving subproblems that may have been
  memorized from the training data. T
