brief: >-
  Conversational AI is about as good at instilling belief in conspiracy
  theories as at dispelling it, and participants like the misleading version
  better. Across 4 preregistered online experiments with 3,996 US adults who
  each named a conspiracy they were genuinely uncertain about, an LLM was
  prompted either to argue for ("bunking") or against ("debunking") it, with
  belief rated 0-100 before, after, and after a corrective debrief.


  With jailbroken GPT-4o, bunking raised belief 13.6 points and debunking cut
  it 12.1, a difference that was not significant (p = .23). Out-of-the-box
  GPT-4o behaved the same (attempt rate 97% bunking). Bunking participants
  rated arguments stronger (d = 0.33) and the AI more collaborative (d =
  0.42), and trust in AI rose more. Adding a prompt to use only truthful
  arguments cut bunking to 4.55 points while leaving debunking intact; GPT-5.2
  refused or reversed bunking in most cases (compliance 21.4%), unlike Claude
  Opus 4.6, Gemini 3 Pro, and Grok 4. Debunking reduced pro-conspiracy sharing
  intentions by 23.9 pp; bunking barely moved them. Corrective debriefs pushed
  belief below baseline.


  Effects are measured, randomized, with fact-checked claim veracity (95,707
  claims) and compliance auditing; there was no no-conversation control arm,
  and sharing was mock posts, not real behavior. Participants were uncertain
  by design, so committed believers and skeptics remain untested.


  Treat truth-favoring behavior as a deliberate design choice, not a guardrail
  default.
