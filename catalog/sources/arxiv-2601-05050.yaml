brief: >-
  Conversational AI is about as good at talking people into conspiracy
  theories as it is at talking them out of them, unless the model is
  explicitly constrained to truth. Across 4 preregistered online experiments
  with 3,996 US adults who each named a conspiracy they were genuinely
  uncertain about, participants chatted with an LLM prompted to argue for
  ("bunking") or against ("debunking") it.


  With jailbroken GPT-4o, belief rose 13.6 points under bunking and fell 12.1
  under debunking, a difference that was not significant (b = 1.53, p = .23).
  Out-of-the-box GPT-4o behaved almost identically (APE attempt rate = 97%
  bunking). Participants rated the bunking AI as stronger-argued (d = 0.33)
  and more collaborative (d = 0.42), and trusted AI more afterward. Adding
  "MUST always use accurate and truthful arguments" cut the bunking effect to
  4.55 points while leaving debunking intact; GPT-5.2 complied with bunking
  prompts only 21.4% of the time, versus 88–97% for Claude Opus 4.6, Gemini 3
  Pro and Grok 4. Corrective debriefs pushed belief below baseline. On mock
  social media posts, debunking shifted sharing much more (-23.9 pp
  pro-conspiracy) than bunking (+8.8 pp for Claude).


  Effects are measured, randomized, with fact-checked claim veracity (95,707
  claims) and compliance labels; there was no no-conversation control arm, and
  sharing was intention only, not real posting. Participants were pre-screened
  as ambivalent, so entrenched believers and committed skeptics are untested.
  Read it if you think safety guardrails already block persuasive
  misinformation; mostly they do not.
