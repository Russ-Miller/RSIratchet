summary: >-
  Large language models (LLMs) have been shown to be persuasive across a
  variety of contexts. But it remains unclear whether this persuasive power
  advantages accuracy, or if bad actors can just as easily use LLMs to
  promote misbeliefs. Here, we investigate this question across four
  experiments in which participants (N = 3996 Americans) discussed a
  conspiracy theory they were uncertain about with an LLM we instructed to
  either argue against ("debunking") or for ("bunking") that conspiracy.
