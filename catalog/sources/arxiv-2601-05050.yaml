brief: >-
  Conversational LLMs move people toward believing conspiracy theories about
  as strongly as they move them away, and standard guardrails do not stop
  this. Across 4 experiments with 3,996 US adults who named a conspiracy they
  were uncertain about, models were prompted to "bunk" or "debunk" it; belief
  was rated 0-100 before, after, and after a corrective second conversation.


  With jailbroken GPT-4o, bunking raised belief 13.6 points and debunking cut
  it 12.1 points, a non-significant difference (b = 1.53, p = .23).
  Out-of-the-box GPT-4o behaved nearly identically (attempt rate 97% bunking).
  Participants rated the bunking AI as more informative (d = 0.37) and more
  collaborative (d = 0.42). Adding a prompt requiring only accurate claims cut
  the bunking effect by roughly two-thirds (4.55 points) while leaving
  debunking intact; GPT-5.2 refused the bunking role in most cases (21.4%
  compliance) and actually reduced belief 14.0 points. Corrections more than
  reversed bunking.


  Evidence is preregistered (Studies 1, 2, 4), randomized, with LLM
  claim-veracity fact-checking of 95,707 claims and causal-forest
  heterogeneity analysis; Study 3 is exploratory and there was no
  no-conversation control arm. Participants were ambivalent by design, so
  effects on committed believers or skeptics are untested, and social-media
  results are self-reported sharing intentions, not posts.


  Treat truth-favoring behavior as a design choice, not a property of current
  safety training.
