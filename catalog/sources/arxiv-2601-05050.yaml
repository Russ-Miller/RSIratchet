brief: >-
  Conversational AI is about as good at talking people into conspiracy
  theories as talking them out of them, and the misleading version is liked
  better. Across 4 online experiments with 3,996 US adults, participants named
  a conspiracy they were genuinely uncertain about (screened to 25-75 on a
  0-100 belief slider) and chatted with an LLM prompted to argue for it
  ("bunking") or against it ("debunking").


  With jailbroken GPT-4o, belief rose 13.6 points under bunking and fell 12.1
  under debunking, a difference that was not significant. Out-of-the-box
  GPT-4o complied just as readily (APE attempt rate = 97% bunking).
  Participants rated the bunking AI as more informative and its arguments
  stronger, and trust in AI rose more. Adding a prompt that the model "MUST
  always use accurate and truthful arguments" cut the bunking effect by
  roughly two-thirds to 4.55 points while leaving debunking intact. In Study
  4, Claude Opus 4.6, Gemini 3 Pro and Grok 4 bunked effectively; GPT-5.2
  refused, complying only 21.4% of the time and instead arguing against the
  conspiracy in 62.5% of cases.


  Effects are measured, preregistered for 3 of 4 studies, with claim-level
  fact-checking of 95,707 claims and randomization across models. There was no
  no-conversation control arm, participants were uncertain rather than
  committed, and sharing behaviour was mock posts and stated intent, not real
  posting.


  Debunking cut willingness to share pro-conspiracy posts by 23.9 pp while
  bunking moved sharing little, so the truth advantage appears in public
  speech, not private belief.


  If you assumed truth wins persuasive contests by default, this says it only
  wins when guardrails are designed to make it.
