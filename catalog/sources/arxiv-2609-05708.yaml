summary: >-
  Aggregating heterogeneous vision-language models (VLMs) can improve
  multimodal reasoning, but neither an individual model's confidence nor
  that of the aggregated answer measures reliability at the system level. We
  present CUSP (Collective Uncertainty through Semantic Opinion Pooling), a
  training-free uncertainty quantification framework that maps multiple VLM
  responses to a shared semantic response space, pools them into a pooled
  semantic opinion, and reports two complementary system-level signals:
  collective uncertainty, the dispersion of the pooled opinion, and
