brief: >-
  Letting a validator model write a critique and having the generator retry
  beats scaling the validator up. On GSM8K, a 70B or 120B validator gave
  almost no advantage over a small one in single-shot checking, while adding a
  critique-and-regenerate loop lifted every configuration.


  The setup fixes llama-3.1-8b-instant as the generator and varies only the
  validator across 8 configurations: llama-3.1-8b-instant, gpt-oss-20b,
  llama-3.3-70b-versatile, gpt-oss-120b, each in single-shot and
  critique-plus-multi-round mode, on the full GSM8K test set (1,319 examples),
  inference only, generation temperature 0.2 and validation temperature 0.0.


  Single-shot accuracy spans 72.55% to 80.14%; critique-guided spans 85.44% to
  93.56%. Going 70B (80.14%) to 120B (80.06%) changed nothing. Validator size
  from 8B to 20B gave +6.30% without critique and +4.93% with it, against a
  12-16% gain attributed to retries, which recovered 161-210 samples per run.


  The critique ablation holds generator, prompts, dataset and decoding
  constant, so the comparison does isolate the loop, but it is not matched on
  token or call budget: critique runs get up to 3 generations per problem
  versus 1.


  Correctness is judged by the validator itself, with only an optional
  programmatic answer override, so leniency is not ruled out. 1 benchmark, 1
  generator, grade-school arithmetic only; the 93.56% versus RDoLT's 90.98%
  comparison is across different base models.


  If you are choosing between a bigger verifier and a retry loop, the retry
  loop is the cheaper lever here.
