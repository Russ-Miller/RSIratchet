brief: >-
  Teaching a 7B video model to narrow down from whole video to specific clips,
  step by step, beats copying free-form rationales written by a much larger
  model, and it cuts hallucination instead of increasing it. Video-R1's SFT
  rationales, generated by Qwen2.5-VL-72B, actually make hallucination worse
  than the untrained baseline.


  Video-ToC builds SFT rationales by segmenting video into clips, placing them
  in a segment tree, backtracking from LLM-selected key clips to the root, and
  summarizing the path with Llama-3.3-70B-Instruct. 1,000 SFT samples plus
  2,000 GRPO samples with a reasoning-demand reward (exp of negative
  correct-rate over 8 no-thinking trials) train Qwen2.5-VL-7B.


  At 16 frames, average over 6 benchmarks goes 52.9 baseline, 56.9 Video-R1,
  58.2 Video-ToC; the SFT-only model reaches 56.6, matching full Video-R1. On
  VideoHallucer, Video-R1 drops to 45.4 average versus 50.5 baseline, while
  Video-ToC reaches 51.9.


  Ablations isolate the pieces: a single-cue SFT set differing only in
  rationale pattern scores 61.8/61.0/54.5 on MMVU/MVBench/VideoMME against
  65.3/63.3/56.6 for tree-of-cue; GRPO without SFT reaches only
  63.8/61.1/54.3; the demand reward adds 0.5-1.0 over vanilla GRPO. Training
  data counts are matched within each ablation.


  Only 1 base model and 1 size, 16-64 frames, and the Video-R1 comparison is
  not retrained on identical data. If you build video reasoning SFT sets, the
  rationale pattern matters more than the annotator's strength.
