brief: >-
  Fixing catastrophic forgetting does not make a fine-tuned model able to use
  its general skills on domain tasks. Models can keep producing complete
  reasoning chains after legal fine-tuning while still failing to bring legal
  knowledge into those chains.


  The authors define General Capabilities Integration (GCI): train on 1 domain
  task, test on tasks needing both that domain knowledge and a general skill.
  In the Chinese legal domain they build 3 task groups: Article QA to
  Reasoning/Calculation, Article QA to Ethic/Contamination safety dialogues,
  and Legal IE to Event Summary/MRC. They propose ALoRA, which adds a
  multi-head attention module over LoRA so the adapter sees preceding tokens.


  Baselines expose the gap: 6 baselines reach 100 on "Chain" (complete
  reasoning rate) while BLEU_R stays low. DAS improves the training task but
  leaves test performance near the untuned chat model, with Score_E of 2, same
  as the general LLM. ALoRA reaches Score_E 47.94 on Ethic and average 20.73
  on reasoning/calculation, beating the best baseline by 0.87.


  Ablations isolate the attention module: removing it drops reasoning by
  nearly 10, and raising LoRA rank from 8 to 16 at matched-ish parameter count
  gains only about 0.7.


  Only the legal domain, 1 base model in the main tables, and GPT-4 as judge
  for safety scores. ALoRA degrades on long verdicts in Event Summary.


  If you evaluate domain fine-tunes only on retained general benchmarks, you
  are measuring the easier problem.
