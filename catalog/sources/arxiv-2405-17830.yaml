brief: >-
  Fixing catastrophic forgetting does not make a domain-tuned model able to
  use its general skills on domain tasks. Models fine-tuned on Chinese legal
  article QA kept their instruction-following format but stopped applying
  arithmetic or reasoning to the law they retrieved.


  The authors define General Capabilities Integration (GCI) and build 3
  train/test task pairs in the legal domain: Article QA to Reasoning and
  Calculation; Article QA to Ethic and Contamination safety dialogues; Legal
  IE to Event Summary and MRC. Baselines include LoRA SFT, wise-ft at 4 mixing
  weights, L1/L2/KL regularization, DAS, MixTraining and MixDA*. They propose
  ALoRA, which adds a multi-head attention module over LoRA plus a KL
  regularizer.


  6 baselines reach 100 on "Chain" (complete reasoning chains) while BLEU_R
  stays low, separating forgetting from integration. DAS raises training-task
  scores but leaves Calculation BLEU at 5.85 versus the general LLM's 6.91.
  ALoRA's best average on Reasoning/Calculation beats baselines by 0.87; on
  safety, Score_E rises from 2.00 for the general LLM and DAS to 47.94. MRC
  gains 1.81 BLEU and 2.68 ROUGE.


  Evidence is measured, with an ablation removing residual, KL and attention,
  and a rank-16 LoRA control for parameter count. Margins over the strongest
  baselines are small, Ethic and Contamination are scored by GPT-4, and ALoRA
  degrades on long-verdict Event Summary. Only the legal domain was tested;
  finance, healthcare, education are not.


  Treat forgetting benchmarks as insufficient evidence that a domain model
  retains usable general skills.
