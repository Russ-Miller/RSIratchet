summary: The performance on general tasks decreases after Large Language
  Models (LLMs) are fine-tuned on domain-specific tasks, the phenomenon is
  known as Catastrophic Forgetting (CF). However, this paper presents a
  further challenge for real application of domain-specific LLMs beyond CF,
  called General Capabilities Integration (GCI), which necessitates the
  integration of both the general capabilities and domain knowledge within a
  single instance. The objective of GCI is not merely to retain previously
  acquired general capabilities alongside new domain knowledge, but to
  harmonize and utilize both sets
