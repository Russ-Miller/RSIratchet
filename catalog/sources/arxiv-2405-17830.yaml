brief: >-
  Fixing catastrophic forgetting does not make a domain-tuned model able to
  use its general skills on domain tasks. A legal LLM can keep producing
  complete reasoning chains and still fail to bring the relevant statute into
  the answer, which the authors frame as a separate problem: General
  Capabilities Integration (GCI).


  They build 3 groups of Chinese legal tasks where training and testing share
  the same law articles but testing additionally needs a general skill:
  Article QA to Reasoning/Calculation, Article QA to Ethic/Contamination
  safety dialogues, and Legal IE to Event Summary/MRC. Baselines include LoRA
  SFT, wise-ft, L1/L2/KL regularization, DAS, MixTraining and a reimplemented
  MixDA*. ALoRA adds a multi-head attention module over LoRA so the adapter
  can read preceding tokens.


  6 baselines reach 100 on "Chain" while BLEU R stays low. DAS raises
  training-task scores but leaves test tasks near the untuned chat model, with
  Score E of 2 for both. ALoRA reaches average 20.73 on reasoning/calculation,
  0.87 above the best baseline, and Score E of 47.94 on Ethic.


  Ablations remove attention, residual, and KL, and match parameters by
  raising LoRA rank 8 to 16; removing attention costs nearly 10, extra
  parameters gain about 0.7. Only 1 domain, and scores for safety come from
  GPT-4 judging. ALoRA loses on Event Summary, where long verdicts strain the
  attention adapter.


  Treat forgetting benchmarks as insufficient evidence that a fine-tuned model
  is usable.
