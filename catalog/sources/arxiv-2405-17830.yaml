brief: >-
  Fixing catastrophic forgetting does not make a fine-tuned model able to use
  its general skills on domain tasks. After legal fine-tuning, models kept the
  surface form of general reasoning while failing to join it with legal
  knowledge: 6 baselines reached 100 on "Chain" (rate of producing a complete
  reasoning chain) yet scored low on BLEU_R, the content score conditioned on
  a correct choice.


  The authors define General Capabilities Integration (GCI) and build 3
  train/test task groups in Chinese law: Article QA to Reasoning and
  Calculation, Article QA to Ethic and Contamination, Legal IE to Event
  Summary and MRC. Data comes from CAIL, public verdicts, legal consulting
  logs, and GPT-4 expansion of hand-written seeds; GPT-4 also judges the
  safety scores.


  ALoRA adds a multi-head attention module over LoRA so the adapter reads
  preceding tokens. On Reasoning/Calculation it reaches average 19.50
  (domain-only) and 20.73 (mixed), beating the best baseline by 0.87; on MRC
  it gains 1.81 BLEU and 2.68 ROUGE. DAS, a CF method, scores 2 on Score_E,
  same as the untuned chat model.


  Ablations isolate the parts: removing attention costs nearly 10 on
  reasoning, and raising LoRA rank from 8 to 16 to match parameters gives only
  about 0.7, so the gain is not parameter count. Caveats: 1 domain, Chinese
  legal only, GPT-4-as-judge for safety, and ALoRA degrades on long-verdict
  Event Summary when trained on domain data alone.


  If you evaluate domain fine-tuning only by general-benchmark retention, you
  are measuring the wrong thing.
