summary: >-
  Zero-shot waypoint navigation requires vision-language models to select,
  from the current first-person observation, a sequence of spatial actions
  that is feasible for the agent and reaches the goal, placing joint demands
  on the integrated spatial intelligence of today's foundation VLMs.
  Existing spatial-intelligence benchmarks primarily evaluate isolated
  judgments of relations, directions, or targets and therefore do not
  directly measure the integrated navigation ability required to combine
