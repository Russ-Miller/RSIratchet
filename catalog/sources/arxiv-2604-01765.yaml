brief: >-
  Adding an explicit depth-generation head to a driving world-action model
  improves both the imagined future video and the planned trajectory, and
  depth plus video together beat either alone. DriveDreamer-Policy routes
  Qwen3-VL-2B over multi-view images, a language instruction, and the current
  action into 3 groups of learnable queries (64 depth, 64 video, 8 action)
  with a causal depth-to-video-to-action attention mask, feeding 3 diffusion
  experts: a pixel-space depth generator initialized from PPD, a
  Wan-2.1-T2V-1.3B video generator, and an action generator.


  On Navsim navtest the model reaches 89.2 PDMS (v1) and 88.7 EPDMS (v2),
  above DriveVLA-W0 at 86.1 EPDMS and PWM at 88.1 PDMS. Video FVD drops from
  85.95 to 53.59 against PWM; depth AbsRel is 8.1 versus 9.3 for a
  Navsim-finetuned PPD. The modality ablation under identical training budgets
  gives 88.0 PDMS action-only, 88.5 with depth, 88.9 with video, 89.2 with
  both; removing depth from video training worsens FVD from 53.59 to 65.82.


  The ablations are matched-budget and isolate each modality cleanly, but
  comparisons to prior planners use their reported numbers rather than a
  reimplementation, and depth is scored against Depth Anything 3 pseudo-labels
  that also served as training targets, so depth gains are partly
  self-referential.


  Evidence covers 1 benchmark family, 1 backbone, 144x256 resolution and a
  9-frame horizon; closed-loop driving in simulation and longer rollouts are
  untested. Treat geometry as a cheap auxiliary target for world-action models
  rather than a validated safety mechanism.
