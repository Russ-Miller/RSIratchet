brief: >-
  A 0.6B model trained on synthesized token-level error labels detects
  reasoning hallucinations better than a 32B reasoning model doing the same
  job by writing critiques. TokenHD skips step segmentation entirely: it
  scores every token in free-form text directly.


  The pipeline prompts 4 critic models (R1-Qwen3-8B, QwQ-32B, GPT-4.1,
  o4-mini) to mark hallucinated spans, restores spans to exact text (98.10%
  recovery), maps them to tokens, and aggregates with learned per-critic
  weights. Detectors are Qwen3 0.6B-8B, trained on math data from a
  GPT-4o-mini policy, evaluated against GPT-5/o3 labels on Math-500,
  AIME-2024/2025, OlympiadBench-Math, plus GPQA, OlympiadBench-Phy, FinQA and
  2 code benchmarks.


  TokenHD-0.6B reaches 63.64 F1 on hallucinated Math-500 samples versus 55.05
  for QwQ-32B and 9.86 for the untrained Qwen3-0.6B; TokenHD-8B reaches 64.55,
  against 71.39 for o4-mini. Adaptive ensembling lifted label quality by
  17.95, 12.01 and 8.8 points over uniform averaging across 3 critic
  combinations.


  Ablations on ensembling and importance weighting hold the non-hallucinated
  recall near 96 for comparison, which isolates those choices. Labeler-model
  ground truth is itself LLM-generated, with only human spot ratings (4.63/5
  math, 4.55/5 code).


  Transfer is uneven: the math-only 8B detector drops to 41.42 on Math-500
  under a Gemini-2.0-Flash policy and 22.35 on Code-Elo; mixed training
  recovers code (73.61) but weight merging degrades math recall badly (down to
  26.88 for DARE).


  If you use PRMs for error localization, this suggests token-level
  supervision from critic ensembles is a cheaper substitute, within the policy
  distribution you trained on.
