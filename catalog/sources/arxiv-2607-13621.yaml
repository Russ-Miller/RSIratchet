brief: >-
  Splitting a vision-language-action policy into separate seeking and
  following heads only helps if the router gets explicit stage supervision; an
  unsupervised router performs no better than a single shared head.


  UESF-Bench builds on Habitat 3.0 with 4859 SMPL-X avatars, 777 of the 890
  HM3D/MP3D scenes, 15905 episodes and 1.43M samples, split 11,310 train /
  1510 val / 3085 test with no scene overlap. The agent gets one fused
  instruction naming a person who starts out of view, must find them, then
  hold 1-3 m while facing them. SeekFollow-VLA uses a Qwen3-4B backbone with
  DINO-V3 and SigLIP towers, and 3 action heads are compared.


  Single-person: task success 0.35 for the task-driven dual head vs 0.04
  single head and 0.05 phase-aware dual head; Search SPL 0.53 vs 0.30 and
  0.27; following ratio 0.92 vs 0.85. Multi-person with 2-7 distractors: 0.20
  vs 0.04 and 0.04, SPL 0.55, but following ratio drops to 0.82, below the
  phase-aware head's 0.85, and collision rate rises to 0.33 from 0.06.


  The 3 variants differ only in the head, so the auxiliary stage loss is
  isolated. But all 3 share 1 backbone, there is no external baseline,
  simulation only, and absolute success stays low.


  Treat stage labels, not head count, as the lever for multi-phase embodied
  policies.
