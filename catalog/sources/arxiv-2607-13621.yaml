summary: >-
  Language-guided human following is an important capability for embodied
  agents, but existing benchmarks typically assume that the target person is
  visible at the start of an episode. This setting simplifies the problem
  and overlooks a more realistic requirement: an agent often needs to first
  find a language-described target and then persistently follow that target
  in a dynamic environment. While recent work has started to study human
  search, existing settings are typically evaluated in task-specific
  scenarios and often rely on stronger prior knowledge of the environment.
