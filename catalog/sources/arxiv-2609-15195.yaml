summary: >-
  Embodied navigation requires agents to ground instructions or object goals
  in spatial observations and translate plans into successful execution. As
  multimodal large language models (MLLMs) become increasingly capable, they
  offer stronger support for navigation without task-specific training;
  however, improved semantic reasoning alone does not ensure that proposed
  actions remain consistent with spatial evidence, task progress, and
  execution outcomes. We introduce HarnessVLN, a zero-shot, training-free
  framework that unifies instruction-following and object-goal navigation
  through a shared Agen
