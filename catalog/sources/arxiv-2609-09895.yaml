  conflict with spatiotemporal evidence. Existing benchmarks mainly evaluate
  model hallucinations, and heterogeneous mechanisms make detector
  reliability difficult to compare. We introduce VidHalLoc, a benchmark that
  evaluates hallucination detection methods under a unified diagnostic
