summary: >-
  Large language models (LLMs) increasingly interact with external
  environments and accumulate substantial behavioral experience, yet
  existing agent benchmarks largely evaluate them as fixed policies. It
  therefore remains unclear whether an agent can actively test its behavior,
  judge the resulting experience, and use that experience to improve future
  decisions. We introduce \textbf{S\textsuperscript{3}Gym}, an interactive
  benchmark for evaluating LLM self-improvement through three coupled
  capabilities: \textbf{Self-Testing}, \textbf{Self-Judging}, and
  \textbf{Self-Improvement}. S$^3$Gym separate
notes: >-
  Filed as a source on harness-self-improvement from the classifier's
  judgement that the paper is about it (measures, medium): It introduces a
  benchmark characterizing whether agents can use their own interaction
