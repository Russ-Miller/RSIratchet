summary: >-
  Code generation benchmarks are widely used to evaluate Large Language
  Models (LLMs), but benchmark data leakage into training sets can inflate
  performance and undermine evaluation validity. DetectLeak, a method
  specifically designed for code generation benchmark leakage detection,
  relies on perplexity scores to identify likely leaked samples. However,
  perplexity mainly reflects general familiarity with code patterns and may
  perform poorly on complex or rare samples. It also overlooks other useful
  signals, such as code similarity, functional correctness, and semantic
  representations. To address
