summary: >-
  Vision-Language-Action (VLA) models have demonstrated remarkable
  generalization in robotic manipulation via large-scale multimodal
  pretraining. However, VLA models are mainly trained on 2D-centric
  observations, which inherently constrains their capacity for precise
  spatial manipulation. Previous methods enhance 3D awareness by introducing
  implicit spatial priors, but still lack explicit geometry guidance. In
  this paper, we propose Bridge3D that integrates both implicit and explicit
