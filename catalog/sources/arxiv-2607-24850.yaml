summary: >-
  Recent advances in large language models (LLMs) have enabled search agents
  to autonomously tackle complex tasks across extended search and reasoning
  horizons. However, training effective search agents remains challenging
  due to the lack of scalable and long-horizon tasks, and the difficulty of
  evaluating and correcting intermediate reasoning and tool-use behaviors.
