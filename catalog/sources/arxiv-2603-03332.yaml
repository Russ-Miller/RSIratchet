summary: "Chain-of-Thought (CoT) prompting has emerged as a foundational
  technique for eliciting reasoning from Large Language Models (LLMs), yet the
  robustness of this approach to corruptions in intermediate reasoning steps
  remains poorly understood. This paper presents a comprehensive empirical
  evaluation of LLM robustness to a structured taxonomy of 5 CoT perturbation
  types: \\textit{MathError, UnitConversion, Sycophancy, SkippedSteps,} and
  \\textit{ExtraSteps}. We evaluate 13 models spanning three orders of
  magnitude in parameter count, testing their ability to complete mathematical
  reasoning tasks de"
