summary: >-
  Vision-language models are increasingly serving as the reasoning core of
  embodied agents. Robot execution is inherently iterative: each action
  reshapes the scene and physical state, continually renewing what must be
  perceived, reasoned about, and verified. Meeting these demands requires
  complementary capabilities that differ in supervision signals, prediction
  formats, and verification criteria. Existing approaches typically develop
  these capabilities against isolated, task-specific objectives, leaving
  open how they should be organized and integrated around execution as a
