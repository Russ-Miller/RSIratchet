summary: >-
  Large language model agents are increasingly deployed for long-horizon
  task execution, raising a central granularity question for trajectory
  evaluation: whole-trajectory verification is too coarse to capture
  concrete failures and their associated evidence in long trajectories,
  while atomic-step scoring is too fine-grained, noise-sensitive, and
  computationally expensive. This granularity gap makes a single-reference
