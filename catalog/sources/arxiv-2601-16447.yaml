  performance in reasoning tasks such as mathematics and coding, matching or
  surpassing human capabilities. However, these impressive reasoning abilities
  face significant challenges in specialized domains. Taking Go as an example,
  although AlphaGo has established the high performance ceiling of AI systems
  in Go, mainstream LLMs still struggle to reach even beginner-level
  proficiency, let alone perform natural language reasoning. This performance
  gap between general-purpose LLMs and domain experts is significantly
