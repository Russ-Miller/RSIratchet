brief: >-
  A general LLM can be pushed to professional-level Go move prediction without
  losing math and code ability, but only if the cold-start data is structured
  expert annotation rather than raw labels or general long-CoT alone. LoGos is
  built from Qwen2.5-7B-Base and 32B-Base by mixing a 10-million-scale
  KataGo-annotated next-move dataset and a 100K commentary set with distilled
  long-CoT reasoning data, then running GRPO with a tiered reward over
  KataGo's top-10 moves and win-rate estimates.


  On KataGo-Bench-1K, a 1,000-sample benchmark where a prediction counts as
  correct if it falls in KataGo's candidate set, LoGos(32B) scores 88.6 and
  LoGos(7B) 88.1, against 34.3 for Claude3.7-Sonnet, 17.6 for DeepSeek-R1, and
  87.8 for KataGo-HumanSL-9d. General benchmarks hold up: LoGos(32B) gets 63.6
  GPQA-Diamond and 50.9 LiveCodeBench versus 56.1 and 36.5 for
  DeepSeek-R1-Distill-Qwen-32B.


  The causal claims are backed by ablations. RL without cold start on 4
  instruct/distill models never reaches beginner level (67.36%); replacing the
  heuristic template with direct prediction caps the 7B at below 50% versus
  88%. Reward-shape and data-ratio ablations are included.


  Boundaries: 1 model family, 1 domain, and human raters judged only 55.6% of
  explanations correct despite 96.5% move accuracy. Move-sequence input
  degrades with game length; 2-D board rendering fixes it.


  Treat structured expert annotation, not reasoning data, as the scarce
  ingredient for domain transfer.
