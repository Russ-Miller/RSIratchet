brief: >-
  Dense, partially credited rewards let a 3B Text-to-SQL model reach accuracy
  that sparse 0/1 execution rewards cannot deliver at that scale. FINER-SQL
  first distills reasoning traces from 4 teachers (DeepSeek-R1, GPT-oss-120B,
  Qwen-2.5-72B-Instruct, GPT-4o) into Qwen2.5-Coder 0.5B/1.5B/3B, then runs
  GRPO with 4 reward terms: format, execution (0/1/2), a memory reward scoring
  cosine similarity of the reasoning trace to verified traces retrieved from
  other databases, and an atomic reward scoring Jaccard overlap of parsed SQL
  operations against an execution-verified reference pool.


  On BIRD Dev the 3B model reaches 67.73% EX and on Spider Dev 85.0%, against
  Reasoning-SQL 14B at 65.31%, SQL-R1 14B at 67.10%, and Alpha-SQL 14B at
  68.70%. Latency is 5.57 s/sample at ~10GB VRAM versus 1802.00s for Alpha-SQL
  14B. GRPO lifted the 0.5B model from 42.9% to 49.3% EX over 2000 steps and
  the 3B from 63.4% to 67.7%.


  Evidence is measured, with ablations removing each reward, sweeps over
  candidate count (1–50), temperature, memory top-k and retrieval scope, and 4
  shaping-function settings. Baselines are taken from published numbers, not
  rerun; comparisons to Alpha-SQL or SQL-R1 are not matched on inference token
  budget, and models trained on large synthetic corpora were excluded by
  choice.


  All results come from 1 model family and 2 benchmarks, with inference always
  using 30 candidates plus majority voting and an external 0.6B schema
  reranker, so the gain is not attributable to RL alone. If you want
  on-premise Text-to-SQL under 24GB, this is the configuration to copy.
