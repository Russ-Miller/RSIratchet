brief: >-
  Reasoning multimodal models get final answers right far more often than
  their intermediate chains of thought hold up to step-level checking, so
  those chains are a poor explanation of the decision. Perception
  hallucinations are the most common type but the least predictive of a wrong
  answer; reasoning hallucinations are what track failure.


  MM-THEBench contains 1,340 questions (1,182 single-image, 39 multi-image,
  119 video; 835 multiple-choice, 505 open-ended) drawn from MathVision,
  MMMU-pro, HallusionBench, CharXiv, Video-MME and others, with human-verified
  atomic reasoning steps and per-step rubrics across Knowledge, Perception and
  Reasoning. 14 models were scored by a Qwen-3-32B judge at answer, step and
  rubric level.


  On images, Qwen3-VL-235B-A22B-Thinking led on answer accuracy at 70.62%, but
  step precision for explicit-thinking models ran 17.43%-25.56% against recall
  of 40.82%-58.34%: chains cover the needed steps while padding heavily.
  Hallucination rates were below 15% on correct answers and above 30% on
  incorrect ones. Spatial subcategories dominated in both perception and
  reasoning. Longer chains correlated weakly with reasoning hallucinations (r
  < 0.25, p < 0.01); perception correlations were mostly non-significant (r <
  0.12).


  Evidence is measured, not argued, with a 300-instance human meta-evaluation
  showing answer-level deviation below 1%. But steps were generated by
  Gemini-2.5-Pro, which is also evaluated and tops most columns, and closed
  models' chains are reconstructed from CoT prompting rather than real traces.
  Video covers only 5 models.


  If you monitor CoTs, grade reasoning steps, not perception steps.
