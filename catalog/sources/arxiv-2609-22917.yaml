summary: >-
  Non-technical stakeholders frequently cannot write the SQL needed to
  extract insights from operational databases. We built and evaluated a
  Text-to-SQL agent that closes this gap end to end: a six-node LangGraph
  StateGraph checks question relevance, fetches the live schema, generates
  PostgreSQL, validates it with a dry run, retries on failure, executes the
  query, and narrates the result set in plain English. The agent uses prompt
  engineering only; no model was fine-tuned. We evaluated it on the Chicago
  Crime dataset (approximately 8.5 million records, 22 attributes) against a
