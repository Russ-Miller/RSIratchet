brief: >-
  Reward models that look competent at telling a good counseling reply from a
  bad one largely fail when the same judgment is posed as picking the best of
  4 candidates. PRMB evaluates 16 discriminative and LLM-as-judge reward
  models on multi-session CBT counseling built from 118 validated cases of 6
  sessions each, 13893 prompts, 6948 pairwise pairs and 6945 Best-of-4
  queries, with rejected responses engineered to embody 21 client-reported
  negative experience categories as subtle rather than overt harms.


  Overall accuracy spans 52.57% to 76.73%. The best model,
  Llama-3.1-8B-Instruct-RM-RB2, gets 86.46% pairwise but 67.00% BoN; the
  average pairwise–BoN gap exceeds 20 percentage points. Models detect overt
  therapist misbehavior better than cumulative experiential harms (Cluster IV
  pairwise 79.4%). Inference-time heuristics mostly hurt: on
  LLaMA-3.2-3B-Instruct, Self-Refine drops pairwise to 48.00% and BoN to
  20.71%; only RAG helps consistently (+8.12% BoN on that model).


  Evidence is measured, not argued. 200 pairs were checked by 3 licensed CBT
  practitioners, who picked the constructed chosen response 86%, 92% and 94%
  of the time. Downstream validity rests on Spearman ρ = 0.700 (p ≈ 0.036)
  against BERTScore over 4 policy models, versus 0.633 for RewardBench2 — a
  weak, surface-level proxy with few ranked points.


  Negatives are synthetic and anchored to single reference responses, so
  plural valid therapeutic replies are penalized. Treat pairwise reward-model
  scores as an upper bound on alignment in long-horizon dialogue.
