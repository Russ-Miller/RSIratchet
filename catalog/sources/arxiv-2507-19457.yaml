summary: Large language models (LLMs) are increasingly adapted to downstream
  tasks via reinforcement learning (RL) methods like Group Relative Policy
  Optimization (GRPO), which often require thousands of rollouts to learn new
  tasks. We argue that the interpretable nature of language often provides a
  much richer learning medium for LLMs, compared to policy gradients derived
  from sparse, scalar rewards. To test this, we introduce GEPA
  (Genetic-Pareto), a prompt optimizer that thoroughly incorporates natural
  language reflection to learn high-level rules from trial and error. Given
  any AI system containing one or more LLM prompts, GEPA samples trajectories
  (e.g., reasoning, tool calls, and tool outputs) and reflects on them in
  natural language to diagnose problems, propose and test prompt updates, and
  combine complementary lessons from the Pareto frontier of its own attempts.
