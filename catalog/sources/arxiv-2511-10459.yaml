brief: >-
  County-level local knowledge is a weak spot that neither scale nor web
  search reliably fixes. On numerical questions about U.S. counties, no model
  tested exceeded 15.5% accuracy.


  LocalBench contains 14,782 QA pairs across 526 U.S. counties in 49 states,
  built from Census-style indicators (34 localness indicators), local
  subreddit discourse, and the NELA-Local news corpus, and labelled against a
  Localness framework spanning physical, cognitive, and relational dimensions.
  13 models were evaluated, including GPT-4o, GPT-4.1, Gemini-2.5-Pro/Flash,
  Claude-Sonnet-4/3.7, and 5 Qwen3 sizes, in closed-book and web-augmented
  settings.


  Best non-numerical accuracy was 56.8% (Gemini-2.5-Pro+Grounding, GPT-judge).
  Search grounding helped Gemini (+13.6%) and hurt GPT-4.1 (-11.4%) on
  non-numerical QA, though both gained on numerical (+5.3% and +9.3%). Scaling
  did not help: Qwen3-235B-A22B (27.3%) trailed the 30B, 32B, and 14B dense
  models. GPT-4o answered only 39.8% of numerical questions.


  Effects were measured, with 3 seeds per model, paired t-tests with
  Bonferroni correction, and Cohen's d; the GPT-4o-mini judge matched humans
  on 96% of 200 samples and the QA filter reached F1 0.94. Architectural
  explanations for the scaling and retrieval results are argued, not isolated
  by ablation.


  English-only, U.S.-only, 2020-2025, with rural counties underrepresented.


  If you are building place-aware civic or journalism tools, assume numerical
  local facts are unreliable and that retrieval helps only for some model
  families.
