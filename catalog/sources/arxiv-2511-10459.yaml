brief: >-
  County-level local knowledge is a hard failure mode for current LLMs, and
  neither scale nor web search reliably fixes it. LocalBench contains 14,782
  validated QA pairs across 526 U.S. counties in 49 states, built from
  Census/USDA indicators (34 localness indicators), local subreddit threads,
  and the NELA-Local news corpus, organized by the Localness Conceptual
  Framework into physical, cognitive, and relational domains.


  Across 13 models (GPT-4o, GPT-4.1, Gemini-2.5-Pro/Flash,
  Claude-Sonnet-4/3.7, 5 Qwen3 sizes) the best non-numerical score is 56.8%
  GPT Judge accuracy (Gemini-2.5-Pro+Grounding), while numerical Census
  questions stay at 2.2% to 15.5%. Search grounding helps Gemini (+13.6%) but
  hurts GPT-4.1 (-11.4%) on non-numerical items, and both search
  configurations answer less often (100.0% down to 92.9% and 91.7%).
  Qwen3-235B-A22B (MoE) underperforms the 32B and 14B dense models.


  Evidence is measured: 3 seeds per model, paired t-tests with Bonferroni
  correction, Cohen's d, and human checks on the pipeline (F1 0.94 for the QA
  filter, 96% judge-human agreement). The scaling claim rests on 1 open-weight
  family, and web augmentation on 2 model families, so the architectural
  explanation is argued rather than isolated. English, U.S.-only, 2020-2025.


  If you assume retrieval solves grounding, this is a counterexample worth
  checking against your stack.
