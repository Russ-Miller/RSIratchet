brief: >-
  County-level local knowledge is a place where scale and web search both fail
  to help reliably. On LocalBench, the best model reaches 56.8% accuracy on
  narrative-style questions and no model exceeds 15.5% on numerical local
  reasoning.


  LocalBench contains 14,782 QA pairs across 526 U.S. counties in 49 states,
  built from Census/USDA indicators (34 localness indicators), local subreddit
  discourse, and the NELA-Local news corpus, labeled by the
  physical/cognitive/relational Localness framework. 13 models were tested
  closed-book and, for GPT-4.1 and Gemini-2.5-Pro, with web search.


  Gemini-2.5-Pro+Grounding led non-numerical QA at 56.8% GPT-Judge accuracy
  (+13.6% over closed-book), while GPT-4.1+Web fell 11.4%. Numerical accuracy
  ranged 2.2%–15.5%. Within Qwen3, the 235B MoE underperformed the 30B, 32B
  and 14B models. Answer rates dropped from 100.0% to 92.9% and 91.7% under
  retrieval; GPT-4o answered only 39.8% of numerical items.


  Evidence is measured: 3 seeds per model, paired t-tests with Bonferroni
  correction, Cohen's d, and human validation of the QA filter (F1 0.94),
  localness labels (94.2% precision) and the GPT judge (96% agreement). Census
  pairs skipped quality filtering, and the architectural explanation for the
  numerical failure is argued, not isolated.


  U.S.-only, English-only, 2020–2025, rural counties underrepresented; only 2
  models had search variants.


  Treat retrieval augmentation as model-dependent rather than a default fix
  for place-specific grounding.
