summary: >-
  Multimodal Large Language Models (MLLMs) have achieved strong performance
  on a wide range of vision-language tasks, but often fail under imperfect
  or shifted contexts. A reliable MLLM should refuse truly out-of-context
  (OOC) questions with subject-level context shifts while still answering
  shifted in-context (Shifted IC) questions with non-subject context shifts.
