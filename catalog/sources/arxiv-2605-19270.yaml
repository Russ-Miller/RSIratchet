brief: >-
  Breaking a prompt's context into atomic facts and scoring each one for
  omission, distortion, topic-shifting and vagueness detects LLM deception
  better than asking a judge model for a holistic verdict. Decor runs 3
  agents: a units-construction agent that splits context into atomic
  propositions and assigns each a strategic impact weight of 1-3, an auditing
  agent that scores each unit on the 4 Information Manipulation Theory
  dimensions, and an aggregation step producing a weighted deception index.


  Evaluation covers 600 DeceptionBench scenarios across 5 domains, all
  human-annotated by 2 experts (Cohen's κ 0.870 thought, 0.836 response), plus
  47 multi-turn OpenDeception dialogues.


  With GPT-4o as backbone, Decor reaches 0.935 response AUROC against 0.931
  for CoT Red-Handed, 0.924 for Constitutional Monitor and 0.899 zero-shot.
  The gap widens on thought traces: 0.920 vs 0.810 for Constitutional Monitor.
  On multi-turn, Decor gets 0.654 while DeceptionBench (0.304) and zero-shot
  (0.399) fall below chance.


  Effects are measured with matched backbones and ablations: removing impact
  weighting drops response AUROC to 0.910, removing decomposition to 0.891,
  and 15 backbones span 0.875-0.974.


  The response-level margin over the strongest baselines is small,
  OpenDeception uses only 47 GPT-4o dialogues with large standard deviations
  (±0.064), and ground truth comes from 1 generator model (DeepSeek-R1).


  If you audit deception with LLM judges, decomposition plus dimension-level
  scoring mainly buys you reasoning-trace and multi-turn coverage, not large
  single-turn gains.
