summary: "Vision-Language-Action (VLA) models have emerged as a promising
  paradigm for robotic manipulation by leveraging pre-trained vision-language
  representations. However, current VLA training methods suffer from two
  critical limitations: poor generalization to novel environments and low
  training efficiency requiring extensive demonstrations. We introduce
  Agentic-VLA, an agentic training framework that enables VLAs to efficiently
  adapt online through three key innovations: (1) Adaptive Reward Synthesis,
  which dynamically generates and adjusts reward functions based on the VLA's
  current capabilities"
