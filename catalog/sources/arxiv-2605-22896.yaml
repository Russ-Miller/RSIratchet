brief: >-
  Letting a language model decompose a task into sub-goals, reweighting those
  sub-goals by what the policy currently fails at, and warm-starting from
  stored weights of semantically similar tasks beats generic curricula and
  novelty bonuses for online RL adaptation of a VLA.


  Agentic-VLA applies 3 components to OpenVLA-OFT with GRPO: adaptive reward
  synthesis using Llama-3-8B decomposition and the VLAC progress critic,
  VLM-generated language exploration hints injected into the prompt during
  rollouts only, and a 100-entry memory bank of adapted weights retrieved with
  k = 3. Evaluated on LIBERO's 4 suites and a subset of dual-arm RoboTwin 2.0.


  Average LIBERO success rate is 97.8, +12.3 over the SFT baseline on Long and
  +2.0 over EVOLVE-VLA. 1-shot average goes 43.6 to 70.5. Transfer from
  LIBERO-Long to LIBERO-Object rises from 0.0 to 31.2, against 96.6 fully
  supervised. 700 iterations and 22.4k rollouts to 90% on Long versus 1,680
  and 53.8k, a 2.4 x speedup. On RoboTwin Hard the subset average is 34.7
  against 16.3 for π 0.


  Evidence is stronger than typical: 5 seeds on LIBERO, additive and
  subtractive ablations, and matched-budget substitutions where ARS is swapped
  for uniform, fixed-schedule, and learning-progress curricula, LGE for RND
  and ICM, and EM for random retrieval. Baselines are reproduced by the
  authors, not independently; LM decomposition sits within 0.3 of a human
  oracle, so headroom there is small.


  All results are simulated, 1 base model, no physical robot; reward hacking
  and memory scaling are unaddressed. Treat capability-aware sub-goal
  weighting as the component worth copying.
