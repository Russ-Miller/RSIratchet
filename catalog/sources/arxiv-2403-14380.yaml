summary: "The development and popularization of large language models (LLMs)
  have raised concerns that they will be used to create tailor-made,
  convincing arguments to push false or misleading narratives online. Early
  work has found that language models can generate content perceived as at
  least on par and often more persuasive than human-written messages. However,
  there is still limited knowledge about LLMs&#39; persuasive capabilities in
  direct conversations with human counterparts and how personalization can
  improve their performance. In this pre-registered study, we analyze the
  effect of AI-driven persuasion in a controlled, harmless setting. We create
  a web-based platform where participants engage in short, multiple-round
  debates with a live opponent. Each participant is randomly assigned to one
  of four treatment conditions, corresponding to a two-by-two factorial
  design: (1) Games are either…"
