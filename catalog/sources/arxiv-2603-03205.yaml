brief: >-
  Making refusal an explicit action in the agent's action space, rather than
  an implicit product of chain-of-thought, is what produces agentic safety;
  scale alone does not. Without a refusal mechanism, GPT-4o and GPT-5 never
  refuse harmful tool-use tasks at all.


  MOSAIC structures inference as plan, check, then act or refuse, with a
  <safety_thoughts> block the model learns when to invoke and a terminal
  refusal_tool. Training uses GRPO with an LLM judge making pairwise
  trajectory comparisons (n = 4 rollouts, aggregated into group-relative
  rewards) on Agent-SafetyBench, then evaluates zero-shot on AgentHarm, Agent
  Security Bench, BFCL v3, and PrivacyLens with Qwen2.5-7B-Instruct,
  Qwen3-4B-Thinking, and Phi-4.


  Gains are model-adaptive rather than uniformly conservative: Qwen2.5 harm
  0.18 to 0.09 with refusal 0.74 to 0.87; Qwen3 benign completion 0.44 to 0.85
  and over a 4x token reduction; Phi-4 benign over-refusal 0.43 to 0.19 but
  DPI ASR worsens 0.19 to 0.28. BFCL multi-turn accuracy rises 21.0 to 28.5;
  PrivacyLens leakage 0.32 to 0.26 on Qwen2.5.


  Two ablations isolate the mechanism: a think-only variant with refusal
  available drops refusal to 0.59, and pointwise scalar rewards drop refusal
  to 0.79 and raise DPI ASR to 0.51. Both on Qwen2.5 only. Rewards and most
  harm scores come from LLM judges, and frontier-model comparisons are
  scaffolding-only, not trained.


  Treat the scaffolding, not the post-training, as the main lever.
