summary: "Agentic language models operate in a fundamentally different safety
  regime than chat models: they must plan, call tools, and execute
  long-horizon actions where a single misstep, such as accessing files or
  entering credentials, can cause irreversible harm. Existing alignment
  methods, largely optimized for static generation and task completion, break
  down in these settings due to sequential decision-making, adversarial tool
  feedback, and overconfident intermediate reasoning. We introduce MOSAIC, a
  post-training framework that aligns agents for safe multi-step tool use by
  making safety decisions"
notes: "Filed as a source on tool-use from the classifier's judgement that the
