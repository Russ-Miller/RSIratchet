summary: >-
  Large Language Models (LLMs) are increasingly used as interfaces for
  information retrieval, but they remain prone to hallucinations and
  faithfulness errors, in which the generated answers diverge from the
  retrieved evidence. While Retrieval-Augmented Generation (RAG) and recent
  hybrid or semi-extractive approaches mitigate this issue, they do not
  guarantee that quoted or extracted spans are verbatim from the retrieved
  context. This limitation can have severe consequences in safety-critical
  domains, where answers must exactly match certified documentation. We
