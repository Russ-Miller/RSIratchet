brief: >-
  Pruning a web page down to visible text plus structure, and having a weak
  model first extract the target values and their "cue texts", lets a stronger
  model write reusable XPath queries from only 3 seeded pages. XPath Agent
  splits the job into an information-extraction stage and an XPath-programming
  stage, with a static bottom-up XPath generator (including class and id
  attributes) and an evaluator loop capped at 3 rounds that reports missing
  and redundant matches back to the model.


  Evaluation uses the SWDE dataset: 90 websites across 9 domains, 20414 pages,
  with 32 pages sampled per task. Reported results: GPT 4o reaches 0.7413
  accuracy, 0.8561 precision, 0.8467 recall, 0.8514 F1; GPT 4o mini
  0.6613/0.8056/0.7868/0.7961; Claude 3.5 0.6191/0.6916/0.8551/0.7647;
  DeepSeek V2.5 0.5794/0.6764/0.8017/0.7337. Sanitization cut page size to
  10%-20% on average over about 10k sampled pages.


  The headline claims of reduced token usage and faster clock time are
  asserted, not tabulated; the comparison to AutoCrawler is a prose discussion
  with no shared numbers, there is no matched-budget ablation, and the paper's
  own error analysis section is empty. Text discussing the table also
  contradicts the table, naming Claude 3.5 as best when GPT 4o leads.


  Treat the pipeline design as worth borrowing and the efficiency claim as
  unverified.
