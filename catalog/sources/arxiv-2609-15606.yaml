summary: >-
  Multimodal Large Language Models (MLLMs) have achieved remarkable progress
  on short video understanding yet remain limited on long videos due to the
  limited visual context window. Prevailing approaches rely on uniform frame
  sampling or recent coarse-to-fine agentic zooming, both of which struggle
  to localize sparse, decisive evidence in sufficiently long videos. We
  formulate long video understanding as a \textbf{Sequential Evidence
  Acquisition (SEA)} problem, in which an agent reads the video turn by turn
  along the temporal axis, deciding at each turn how fast to watch, what
  evidence to retain
