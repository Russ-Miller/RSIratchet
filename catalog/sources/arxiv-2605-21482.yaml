brief: >-
  Finding web evidence is no longer the limiting step for deep research
  agents; composing it into a number and knowing when to abstain is.
  DeepWeb-Bench frames each task as an 8x8 matrix of entities against
  analytical dimensions over one industry domain, with a fixed split of 1
  Retrieval, 4 Derivation, 1 Calibration, and 2 Reasoning dimensions, 100
  tasks and 6,400 cells, each cell graded on a 4-tier rubric against a
  reference answer with 4-level source provenance.


  9 frontier configurations were run with only benchmark-provided search,
  page-visit and PDF tools, 200 tool calls and 30 minutes per task. Codex CLI
  + GPT-5.5 scored 33.37%, Claude Opus 4.7 31.84%, Kimi K2.6 16.79%,
  cross-model mean 27.17%. Retrieval was the highest family at 32.83% against
  26.10% Derivation, 27.73% Calibration, 26.19% Reasoning. In 500
  human-labeled failing cells, retrieval gaps were 12-14%; incomplete
  derivation dominated the top 4 models at 31% and hallucinated precision the
  other 5 at 38%. Mean pairwise Spearman across tasks was 0.61, per-case
  disagreement up to 18.8 percentage points.


  The family decomposition is measured, not argued, and the per-cell rubric
  isolates calibration from retrieval; grading is automated by GPT-5.5 with
  200-cell human validation at 0.82 agreement. Grader and strongest model
  share a family, failure-mode labels come from 2 annotators, and the domains
  are all quantitative business/industry analysis.


  Treat retrieval benchmarks as near-exhausted and target numerical
  composition and abstention instead.
