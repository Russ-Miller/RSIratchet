summary: >-
  Large language models often struggle to recognize their knowledge limits
  in closed-book question answering, leading to confident hallucinations.
  While decomposed prompting is typically used to improve accuracy, we
  investigate its impact on reliability. We evaluate three task-equivalent
  prompting regimes: Direct, Assistive, and Incremental, across different
  model scales and multi-hop QA benchmarks. We find that although accuracy
  gains from decomposition diminish in frontier models, disagreements
  between prompting regimes remain highly indicative of potential errors.
