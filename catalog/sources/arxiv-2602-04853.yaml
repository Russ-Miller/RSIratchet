brief: >-
  Question decomposition stops helping frontier models answer correctly, but
  the disagreement between direct and decomposed answers becomes a strong
  error detector. The accuracy benefit and the diagnostic benefit trade off
  with scale.


  The setup fixes a manually verified gold decomposition per question in a
  DSL, then runs 3 task-equivalent regimes: Direct, Assistive (all sub-answers
  in 1 call), and Incremental (1 call per hop). 9 instruction-tuned models
  from Mistral-7B up to GPT-5.1, Gemini-2.5-Pro and Flash, across 6 multi-hop
  QA sets (Bamboogle, FRAMES, MuSiQue, CRAG, HotpotQA, Mintaka), 1,433
  filtered instances, with Gemini-2.5-Flash as semantic judge.


  Non-frontier models gain double digits (Qwen-72B +26.8% on Bamboogle);
  frontier models sit near parity or negative (GPT-5.1 -7.8 Incremental on
  MuSiQue). Correct Direct answers concentrate among consistent cases,
  exceeding 50x for Gemini Pro. Disagreement-Based Abstention beats the
  Are-You-Sure baseline on F1 in 17 of 18 model-dataset pairs, mostly via
  recall (Llama-70B Bamboogle recall 37 to 90).


  Evidenced by measurement, with the plan held fixed to rule out planning
  errors, and cost reported: DBA-A uses 4 calls and 5.64x Direct tokens versus
  8 and 6.51x for self-consistency. No matched-budget comparison is the main
  gap, and the judge is 1 model.


  It fails where errors are stable: 67% of frontier disagreement cases had
  both regimes wrong, and on CRAG frontier models produce consistent errors
  that DBA misses. It also assumes access to good decompositions.


  If you want closed-book abstention without training or retrieval, prompt
  twice with different structure and compare.
