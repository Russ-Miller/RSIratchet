brief: >-
  Question decomposition stops buying accuracy once models get strong enough,
  but the disagreement between a direct answer and a decomposed one becomes a
  usable error detector. Frontier models gain little or lose accuracy from
  explicit decomposition, while their cross-regime agreement concentrates
  correct answers sharply.


  The setup fixes a gold decomposition per question in a DSL, manually
  verified, and runs 3 task-equivalent regimes: Direct, Assistive (all
  sub-answers in 1 call), Incremental (1 call per hop). 9 instruction-tuned
  LLMs (Mistral-7B through GPT-5.1, Gemini-2.5-Pro/Flash) on 6 multi-hop QA
  sets (Bamboogle, FRAMES, MuSiQue, CRAG, HotpotQA, Mintaka), 1,433 filtered
  instances, LLM-as-judge for semantic equivalence.


  Qwen-72B gains +26.8% on Bamboogle from decomposition; GPT-5.1 and Gemini
  mostly sit at near-parity or negative. Their "Reliability Multiplier"
  (correct-and-consistent over correct-and-inconsistent) exceeds 50x for
  Gemini Pro and stays near 1 for 8B models. Disagreement-Based Abstention
  beats the Are-You-Sure baseline on F1 in 17 of 18 model-dataset pairs, with
  GPT-5.1 F1 gains of +18 to +28 on Bamboogle, HotpotQA, MuSiQue, and
  Llama-70B Bamboogle recall rising from 37 to 90.


  Evidence is measured, with a fixed verified plan removing planning error as
  a confound, and a token-cost table (DBA-A 5.64x Direct, self-consistency
  6.51x) giving a partial budget comparison; self-consistency is reported only
  in an appendix, and the abstention table shows 3 of 9 models in the main
  text. The signal fails where errors are stable: 67% of frontier disagreement
  cases had both regimes wrong, and DBA recall drops on CRAG. It also assumes
  access to good decompositions. Useful if you want abstention without
  fine-tuning or retrieval, and can pay ~5x tokens.
