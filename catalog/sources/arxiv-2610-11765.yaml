summary: "Large Language Models (LLMs) increasingly ship with explicit
  &#34;thinking modes&#34;, yet their counterpart, &#34;no-thinking&#34;, has
  received far less attention. We study LLMs&#39; no-thinking behavior along
  two axes. a. How to measure no-thinking? Prior work typically defines
  no-thinking through proxies such as a disabled thinking mode or the absence
  of long traces. These proxies are unreliable: disabled thinking modes may
  still emit reasoning, while long traces may contain filler rather than
  genuine inference. We instead normalize each response into a pre-answer
  trace and final answer, and evaluate it at three levels: (i) Empty-Thinking
  Rate for strict answer-only compliance; (ii) instruction-aware
  Question-Pre-answer Relevance for similarity between the question and
  pre-answer trace; and (iii) LLM-as-judge Explicit Inference Rate for visible
  explicit inference. Together, these met…"
