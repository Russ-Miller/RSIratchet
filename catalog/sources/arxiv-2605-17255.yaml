brief: >-
  Models that can sketch a correct informal argument for applied-math textbook
  exercises mostly cannot turn it into a Lean proof, and the gap is large:
  pass@1 informal accuracy of 70.0%–83.8% against verified Lean accuracy below
  20% for the strongest non-agentic baseline.


  CAM-Bench is 1,000 Lean 4 proof targets drawn from 778 self-contained
  textbook exercises in optimization, numerical linear algebra, and numerical
  analysis, built by a dependency-recovery pipeline that reconstructs local
  definitions, notation and inherited assumptions before formalizing. Scoring
  is file-level: all sorry blocks must be filled and the file must compile.


  Under pass@32, Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6 19.28%,
  Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%. An agentic
  repair harness takes GPT-5.4 from 11.70% to 44.00%, at 1.96M tokens per
  instance versus 0.26–0.70M for non-agentic runs. On 200 randomly sampled
  instances with an 8-hour budget, M2F solves 143/200 (71.5%) and Aristotle
  125/200 (62.5%).


  The agentic comparison fixes instance set, wall-clock budget and a strict
  external validation script, but token budgets are not matched between
  agentic and pass@32 settings. Error labels are multi-label and
  hand-assigned; construction quality rests on LLM-as-a-judge review logs
  (92.5% of Lean declarations judged usable).


  If you benchmark provers on Olympiad-style sets, this gives you a harder,
  context-dependent applied-math axis where Mathlib infrastructure is often
  absent.
