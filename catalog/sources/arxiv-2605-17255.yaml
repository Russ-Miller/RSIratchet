summary: Formal theorem-proving benchmarks enable mechanically verifiable
  evaluation of mathematical reasoning in large language models. However,
  existing benchmarks mainly focus on Olympiad-style problems and algebraic
  domains, leaving computational and applied mathematics underrepresented. We
  introduce CAM-Bench, a Lean 4 theorem-proving benchmark of 1,000 Lean proof
  targets in computational and applied mathematics, with coverage spanning
  optimization, numerical linear algebra, and numerical analysis. These
  problems are adapted from textbook exercises and often depend on locally
  introduced definition
ingested_at: 2026-09-19
brief: >-
  Models can produce informally correct applied-mathematics arguments while
  failing to verify them in Lean, and compiler-interactive agents close much
  of that gap. CAM-Bench formalizes textbook exercises in optimization,
  numerical linear algebra, and numerical analysis into 1,000 Lean 4 proof
  targets drawn from 778 self-contained exercises, built by a
  dependency-recovery pipeline that reconstructs local definitions, notation,
  and elementary results before translation.


  Under pass@32 with file-level success (all sorry blocks filled and the file
  compiling), Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6 19.28%,
  Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%, against
  pass@1 informal accuracy of 70.0%–83.8%. An agentic repair harness lifts
  GPT-5.4 to 44.00% at 1.96M tokens per instance versus 0.26–0.70M for
  non-agentic runs. On 200 randomly sampled instances with an 8-hour budget
  and strict recompilation checks, M2F solves 143/200 (71.5%) and Aristotle
  125/200 (62.5%).


  The agentic gain is measured but not matched on token budget, so cost and
  method are confounded; benchmark validity rests partly on LLM-as-a-judge
  review, with 92.5% of candidate Lean declarations judged usable. Failure
  labels are multi-label and hand-inspected, dominated by long-horizon proof
  control (71.5% for pass@32) and Mathlib grounding (72.6%).


  Treat verified applied-math proving as roughly a third solved at best, and
  budget accordingly.
