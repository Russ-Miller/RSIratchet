brief: >-
  Frontier models can state applied-mathematics arguments informally far more
  often than they can get Lean to accept them, and the gap closes mainly
  through compiler-interactive agents rather than more sampling.


  CAM-Bench is a Lean 4 benchmark of 1,000 proof targets drawn from 778
  textbook exercises in optimization, numerical linear algebra, and numerical
  analysis, built by a recursive dependency-recovery pipeline that
  reconstructs local definitions, notation, and inherited assumptions before
  formalization. A file counts as solved only if every sorry is filled and the
  file verifies.


  Under pass@32, Deepseek-v4-pro reaches 19.67% verified Lean accuracy,
  Claude-sonnet-4.6 19.28%, Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%,
  Kimi-k2.6 2.25%, while pass@1 informal accuracy for the same models runs
  70.0%-83.8%. An agentic repair harness lifts GPT-5.4 to 44.00% at about
  1.96M tokens per instance versus 0.26-0.70M for non-agentic runs. On 200
  sampled instances with an 8-hour budget, M2F solves 143/200 (71.5%) and
  Aristotle 125/200 (62.5%).


  The agentic comparison is matched on instances, budget, and validation
  script, and rejects sorry, axiom, or statement edits; the GPT-5.4 agentic
  gain is not matched on token budget. Failure labels are multi-label
  LLM-inspected, and 7.5% of candidate declarations were judged unusable by an
  LLM judge.


  If you cite pass@k numbers as a ceiling on formal reasoning, execution
  feedback moves them more than sampling does.
