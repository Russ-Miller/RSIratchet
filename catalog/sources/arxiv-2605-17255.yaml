brief: >-
  Frontier models can state applied-math arguments informally far better than
  they can verify them in Lean, and the gap is large: informal pass@1 of
  70.0%-83.8% against verified Lean accuracy below 20% at pass@32.


  CAM-Bench is 1,000 Lean 4 proof targets drawn from 778 textbook exercises in
  optimization, numerical linear algebra, and numerical analysis, built by a
  dependency-recovery pipeline that reconstructs local definitions, notation,
  and inherited assumptions before formalization. Success is file-level: every
  sorry in a file must be filled and the file must compile.


  Among non-agentic pass@32 baselines, Deepseek-v4-pro reaches 19.67%,
  Claude-sonnet-4.6 19.28%, Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%,
  Kimi-k2.6 2.25%. An agentic repair harness takes GPT-5.4 to 44.00%, at about
  1.96M tokens per instance versus 0.26-0.70M for the baselines. On 200
  sampled instances with an 8-hour budget each, M2F solves 143/200 (71.5%) and
  Aristotle 125/200 (62.5%).


  The agentic comparison holds the instance set, wall-clock budget, and
  validation script fixed, and rejects sorry, axiom, or statement-altering
  artifacts. The pass@32 and agentic settings are not matched on token budget,
  so the 11.70%-to-44.00% jump confounds scaffolding with compute. Failure
  labels are multi-label and hand-assigned; construction quality rests on
  LLM-as-a-judge review (92.5% of Lean declarations judged usable).


  Use this if you want a formal benchmark where Mathlib coverage, not
  competition-style cleverness, is the binding constraint.
