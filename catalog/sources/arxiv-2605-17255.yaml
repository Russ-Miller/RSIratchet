brief: >-
  Models that get the informal mathematical argument right still mostly fail
  to produce a machine-checked Lean proof of it, and the gap is largest in
  applied mathematics that depends on local textbook context. CAM-Bench is a
  Lean 4 benchmark of 1,000 proof targets drawn from 778 textbook exercises in
  optimization, numerical linear algebra, and numerical analysis, built with a
  recursive dependency-recovery pipeline that reconstructs chapter-local
  definitions, notation, and lemmas before formalizing each exercise into
  blocks. Scoring is file-level: all sorry blocks must be filled and the file
  must verify.


  Under pass@32, Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6 19.28%,
  Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%, while pass@1
  informal accuracy for the same models runs 70.0%–83.8%. An agentic harness
  with compiler feedback and Lean MCP tools lifts GPT-5.4 to 44.00%, at 1.96M
  tokens per instance against 0.26–0.70M for non-agentic runs. On 200 randomly
  sampled instances under an 8-hour budget and strict recompile checks, M2F
  solves 143/200 (71.5%) and Aristotle 125/200 (62.5%).


  The agentic gain is measured but not budget-matched against non-agentic
  sampling, so compute and tool access are confounded. Failure labels are
  multi-label and hand-assigned; semantic validation of the benchmark itself
  relies on LLM-as-a-judge logs, with 92.5% of Lean declarations judged
  usable. Treat low pass@k numbers here as a grounding failure in Mathlib and
  long-horizon decomposition, not a reasoning failure.
