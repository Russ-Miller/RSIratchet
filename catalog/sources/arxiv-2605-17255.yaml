brief: >-
  Frontier models can state the high-level math argument for
  applied-mathematics textbook exercises and still fail to produce a Lean
  proof of it, and the gap closes mostly through compiler-interactive agents
  rather than more sampling.


  CAM-Bench is 1,000 Lean 4 proof targets drawn from 778 textbook exercises in
  optimization, numerical linear algebra, and numerical analysis, built by a
  recursive dependency-recovery pipeline that reconstructs local definitions,
  notation, and inherited assumptions before translating each exercise into
  blocks of Lean. Scoring is file-level: every sorry must be filled and the
  file must compile.


  Under pass@32, Deepseek-v4-pro reaches 19.67% verified Lean accuracy,
  Claude-sonnet-4.6 19.28%, Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%,
  Kimi-k2.6 2.25%, while pass@1 informal accuracy for the same models runs
  70.0%–83.8%. An agentic repair harness lifts GPT-5.4 to 44.00% at about
  1.96M tokens per instance versus 0.26–0.70M for non-agentic runs. On 200
  sampled instances with an 8-hour budget, M2F solves 143/200 (71.5%) and
  Aristotle 125/200 (62.5%).


  The agentic comparison uses a matched instance set, budget, and validation
  script that rejects sorry, admit, and axiom artifacts; the GPT-5.4 agentic
  gain is not matched on token budget. Failure labels are multi-label
  LLM-inspected, not disjoint, and semantic validation of the benchmark itself
  leans on LLM-as-a-judge, with 92.5% of candidate Lean declarations judged
  usable.


  Treat verified applied-math formalization as roughly 3x harder than it looks
  from informal scoring, and budget tokens accordingly.
