summary: Formal theorem-proving benchmarks enable mechanically verifiable
  evaluation of mathematical reasoning in large language models. However,
  existing benchmarks mainly focus on Olympiad-style problems and algebraic
  domains, leaving computational and applied mathematics underrepresented. We
  introduce CAM-Bench, a Lean 4 theorem-proving benchmark of 1,000 Lean proof
  targets in computational and applied mathematics, with coverage spanning
  optimization, numerical linear algebra, and numerical analysis. These
  problems are adapted from textbook exercises and often depend on locally
  introduced definition
ingested_at: 2026-09-19
brief: >-
  Models can produce the right informal argument for applied-mathematics
  exercises and still fail to verify it in Lean, and the gap closes mainly
  through compiler-interactive agents rather than more sampling. CAM-Bench
  contains 1,000 Lean 4 proof targets drawn from 778 textbook exercises in
  optimization, numerical linear algebra, and numerical analysis, built by a
  dependency-recovery pipeline that reconstructs local definitions, notation,
  and elementary results before formalizing each exercise into blocks
  validated by compilation and semantic review.


  Under pass@32 with file-level success, Deepseek-v4-pro reaches 19.67%,
  Claude-sonnet-4.6 19.28%, Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%,
  Kimi-k2.6 2.25%, while pass@1 informal accuracy sits at 70.0%–83.8%. An
  agentic repair harness lifts GPT-5.4 to 44.00% at about 1.96M tokens per
  instance versus 0.26–0.70M for non-agentic runs. On 200 randomly sampled
  instances with an 8-hour budget each, M2F solves 143/200 (71.5%) and
  Aristotle 125/200 (62.5%).


  The agentic comparison is matched on instances, budget, and validation
  script, and strict checks reject sorry, admit, axiom, or unresolved exact?;
  the GPT-5.4 agentic gain is not matched on token budget. Failure labels are
  multi-label and hand-assigned, so attribution across library grounding
  (72.6% for pass@32), type discipline (50.8%), and long-horizon control
  (71.5%) is indicative rather than disjoint. Benchmark construction itself
  leans on LLM-as-a-judge review: source-level usable yield rose from 26.5% to
  54.3% after repair, and 92.5% of Lean declarations were judged usable.


  Use it if you want a formal benchmark that is unsaturated and stresses
  Mathlib grounding rather than olympiad algebra.
