summary: Formal theorem-proving benchmarks enable mechanically verifiable
  evaluation of mathematical reasoning in large language models. However,
  existing benchmarks mainly focus on Olympiad-style problems and algebraic
  domains, leaving computational and applied mathematics underrepresented. We
  introduce CAM-Bench, a Lean 4 theorem-proving benchmark of 1,000 Lean proof
  targets in computational and applied mathematics, with coverage spanning
  optimization, numerical linear algebra, and numerical analysis. These
  problems are adapted from textbook exercises and often depend on locally
  introduced definition
ingested_at: 2026-09-19
brief: >-
  Models that state an applied-math argument correctly in prose usually still
  cannot get it past Lean's kernel, and the gap is large. CAM-Bench is a Lean
  4 benchmark of 1,000 proof targets derived from 778 textbook exercises in
  optimization, numerical linear algebra, and numerical analysis, built by a
  dependency-recovery pipeline that reconstructs local definitions, notation,
  and elementary results so each exercise becomes a self-contained target.
  Scoring is file-level: every sorry must be filled and the file must verify.


  Under pass@32, Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6 19.28%,
  Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%, while pass@1
  informal accuracy sits at 70.0%–83.8%. An agentic repair harness with
  compiler feedback and Lean MCP tools lifts GPT-5.4 to 44.00%, at 1.96M
  tokens per instance versus 0.26–0.70M for non-agentic runs. On 200 randomly
  sampled instances with an 8-hour budget each, M2F solves 143/200 (71.5%) and
  Aristotle 125/200 (62.5%).


  The agentic comparison is matched on instance set, time budget, and
  validation script, but the GPT-5.4 agentic gain is not matched on token
  budget, so compute and execution feedback are confounded. Construction
  quality rests on LLM-as-a-judge review logs: 26.5% accepted initially, 54.3%
  usable after repair, 92.5% of Lean declarations judged usable.


  Failure labels are multi-label, not disjoint: long-horizon decomposition and
  Mathlib grounding dominate. Treat verified pass rates on Olympiad benchmarks
  as a poor predictor of applied formalization.
