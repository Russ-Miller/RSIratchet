brief: >-
  Models that write a plausible informal proof of an applied-math exercise
  usually cannot get it past the Lean kernel, and the gap is large. CAM-Bench
  is a Lean 4 benchmark of 1,000 proof targets drawn from 778 textbook
  exercises in optimization, numerical linear algebra, and numerical analysis,
  built by a dependency-recovery pipeline that reconstructs local definitions,
  notation, and elementary results before formalizing each statement blockwise
  with compiler and semantic review.


  Under pass@32, with an instance counted solved only if the whole Lean file
  verifies, Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6 19.28%,
  Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%, while pass@1
  informal accuracy for the same models sits at 70.0%–83.8%. An agentic
  harness with compiler feedback and Lean MCP tools lifts GPT-5.4 to 44.00%,
  at 1.96M tokens per instance versus 0.26–0.70M for non-agentic runs. On 200
  sampled instances with an 8-hour budget, M2F solves 143/200 (71.5%) and
  Aristotle 125/200 (62.5%).


  The agentic comparison is matched on instances, budget, and validation
  script, but the GPT-5.4 agentic gain is not matched on token budget, so cost
  and scaffolding are confounded. Failure labels are multi-label LLM-assisted
  judgments, and benchmark construction itself relies on LLM-as-a-judge
  review, with 92.5% of candidate Lean declarations judged usable.


  If you treat informal math scores as a proxy for formal competence, this
  gives a concrete counterexample in applied mathematics.
