summary: Formal theorem-proving benchmarks enable mechanically verifiable
  evaluation of mathematical reasoning in large language models. However,
  existing benchmarks mainly focus on Olympiad-style problems and algebraic
  domains, leaving computational and applied mathematics underrepresented. We
  introduce CAM-Bench, a Lean 4 theorem-proving benchmark of 1,000 Lean proof
  targets in computational and applied mathematics, with coverage spanning
  optimization, numerical linear algebra, and numerical analysis. These
  problems are adapted from textbook exercises and often depend on locally
  introduced definition
