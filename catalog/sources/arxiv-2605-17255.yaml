brief: >-
  Models that get the mathematics right in prose still fail to produce a Lean
  proof of it: on applied-math textbook problems, informal pass@1 accuracy of
  70.0%-83.8% collapses to under 20% verified Lean accuracy.


  CAM-Bench is 1,000 Lean 4 proof targets drawn from 778 textbook exercises in
  optimization, numerical linear algebra, and numerical analysis, built by a
  dependency-recovery pipeline that reconstructs local definitions, notation,
  and assumptions before formalization. Scoring is file-level: an instance
  counts only if every sorry is filled and the file compiles.


  Under pass@32, Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6 19.28%,
  Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%. An agentic
  repair harness with compiler feedback lifts GPT-5.4 to 44.00%, at 1.96M
  tokens per instance versus 0.26-0.70M for non-agentic runs. On 200 sampled
  instances with an 8-hour budget, M2F solves 143/200 (71.5%) and Aristotle
  125/200 (62.5%).


  The agentic comparison fixes instance set, budget, and validation script,
  and rejects sorry, axiom, or altered statements. Token cost is reported but
  not matched across settings, so compute and the agentic scaffold are
  confounded. Benchmark construction leans on LLM-as-a-judge review; 92.5% of
  Lean declarations were judged usable.


  Failure labels are multi-label, not disjoint: library grounding 72.6% and
  long-horizon control 71.5% dominate for pass@32.


  If you treat informal math scores as a proxy for formal competence, this is
  a counterexample.
