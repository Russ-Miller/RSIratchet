brief: >-
  Frontier models can state the right informal argument for applied-math
  textbook exercises and still fail to verify it in Lean: informal pass@1
  accuracy sits at 70.0%-83.8% while the best non-agentic pass@32 verified
  accuracy stays below 20%.


  CAM-Bench is a Lean 4 benchmark of 1,000 proof targets drawn from 778
  textbook exercises in optimization, numerical linear algebra, and numerical
  analysis, built by a dependency-recovery pipeline that reconstructs local
  definitions, notation, and inherited assumptions before formalization.
  Success is file-level: every sorry in the file must be filled and the file
  must compile.


  Among pass@32 baselines, Deepseek-v4-pro reaches 19.67%, Claude-sonnet-4.6
  19.28%, Gemini-3.1-pro-preview 18.38%, GPT-5.4 11.70%, Kimi-k2.6 2.25%. An
  agentic repair harness lifts GPT-5.4 to 44.00%, at 1.96M tokens per instance
  versus 0.26-0.70M for non-agentic runs. On 200 sampled instances with an
  8-hour budget, M2F solves 143/200 (71.5%) and Aristotle 125/200 (62.5%).


  Evidence is measured, with a matched protocol across the two external agents
  but not across the agentic and pass@32 settings, where token cost differs by
  roughly an order of magnitude. Construction quality rests on LLM-as-a-judge
  review logs: 54.3% source-level yield, 92.5% of Lean declarations judged
  usable. Failure labels are multi-label and hand-inspected, so the three
  error categories are not disjoint proportions.


  If you track formal reasoning, treat this as evidence that the bottleneck is
  Mathlib grounding and long-horizon decomposition, not mathematical insight.
