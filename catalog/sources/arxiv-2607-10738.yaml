summary: "Recent advances in equipping Large Language Models (LLMs) with
  search tools and outcome-reward reinforcement learning (RL) have achieved
  new state-of-the-art results on open-domain QA tasks. However, we argue that
  current training paradigms harbor a critical vulnerability: they
  predominantly reward correct answers but fail to penalize fabricated ones
  when retrieval fails, thereby implicitly exacerbating hallucinations. To
  address this, we propose Abstention-Aware Reinforcement Learning (AWA-RL),
  which dynamically shapes the abstention reward utilizing the model's
  query-specific prior capabilit"
