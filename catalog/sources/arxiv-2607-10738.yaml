brief: >-
  Search agents trained with outcome-reward RL fabricate answers when
  retrieval fails, and the fix is to make the abstention reward depend on the
  model's estimated prior success rate for each query rather than a fixed
  constant. AWA-RL sets the refusal reward to 1 minus the model's prior
  correctness probability, passed through a single "courage" exponent, then
  adjusts it per batch when the empirical refusal rate drifts from
  expectation.


  The setup is Qwen2.5-7B-Instruct, cold-started on 5,000 search trajectories
  from GPT-oss-120b, then GRPO on 5,000 queries against a Wikipedia search
  environment, evaluated on HotpotQA, 2WikiMultiHopQA and MuSiQue with
  GPT-oss-120b as judge.


  At the best courage setting, cold-start AWA-RL reaches RA-F1 0.585 versus
  0.556 for the non-abstaining baseline, with Precision 0.559 to 0.662 and
  Accuracy 0.552 to 0.529. The baselines fail differently: a static refusal
  reward of 0.05 in from-scratch RL collapses to 99.9% refusal, and injecting
  30% unanswerable queries from scratch gives 52.2% refusal.


  Comparisons are measured against matched baselines across refusal-data
  ratios, static reward values and courage values, so the mechanism is
  isolated reasonably well. Only 1 model at 1 scale, only multi-hop QA, and
  the headline gain in the abstract (2.9% RA-F1) differs from the 5.2% claimed
  in the introduction.


  If you train search agents, expect query-conditioned refusal rewards to buy
  precision where flat ones hack or collapse.
