brief: >-
  Online visual perturbation augmentation during fine-tuning of a lightweight
  VLA policy raises success on transparent-labware manipulation more than it
  raises success on coarse tasks, and retrieval-augmented VLM state checking
  beats the same VLM without retrieval.


  BioProVLA-Agent pairs an LLM that parses natural-language wet-lab protocols
  into subtasks with preconditions and completion criteria, a VLM-RAG
  verifier, and SmolVLA executing on a So-ARM101 platform costing roughly
  800-850 USD. The benchmark covers 15 atomic tasks, 6 composite workflows,
  and 3 bimanual tasks, with 100 teleoperated demonstrations per atomic task.


  AugSmolVLA lifts Place Cryotube to Red Rack from 40.00% to 65.00% and Place
  Centrifuge Tube to Orange Rack from 43.33% to 53.33% over SmolVLA, while
  Close Centrifuge Lid is already 100.00% for both. On composite tasks it
  reaches 72.50% and 75.00% completion versus 62.50% for SmolVLA.
  RAG-Doubao-Seed-2.0-Pro verifies 82.67% (62/75) of states versus 73.33% for
  the same model without retrieval. Among 5 LLM parsers, Qwen3.6-Plus leads
  with F1 0.7062 on action parsing but only 0.4387 on precondition generation.


  The augmentation comparison is a matched-policy ablation; the agent
  framework itself is not ablated, so closed-loop verification's contribution
  to end-to-end task success is argued rather than measured. Verification uses
  75 hand-labelled images, atomic tasks 3 repeats, composite tasks 20 trials,
  1 robot platform, no end-to-end protocol-to-execution success numbers
  reported here.


  Treat this as evidence that cheap lighting augmentation and retrieval help
  transparent-object manipulation, not that the multi-agent stack is
  validated.
