summary: Biological laboratory automation can reduce repetitive manual work
  and improve reproducibility, but reliable embodied execution in wet-lab
  environments remains challenging. Protocols are often unstructured, labware
  is frequently transparent or reflective, and multi-step procedures require
  state-aware execution beyond one-shot instruction following. Existing
  robotic systems often rely on costly hardware, fixed workflows, dedicated
  instruments, or robotics-oriented interfaces. Here, we introduce
  BioProVLA-Agent, an affordable, protocol-driven, vision-enhanced embodied
  multi-agent system enabled
