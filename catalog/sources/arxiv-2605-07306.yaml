brief: >-
  Online visual-perturbation augmentation during fine-tuning of a small VLA
  policy raises execution stability on transparent, reflective lab glassware
  more than it raises performance on well-lit tasks, and retrieval-augmented
  VLM state checking beats the same VLM alone at deciding whether a step is
  ready or done.


  BioProVLA-Agent runs on a So-ARM101 arm platform costing approximately
  800-850 USD, with an LLM parsing protocols into subtasks, a VLM-RAG agent
  verifying pre- and postconditions, and SmolVLA executing. The benchmark
  covers 15 atomic tasks, 6 composite workflows, and 3 bimanual tasks, with
  100 teleoperated demonstrations per atomic task.


  AugSmolVLA lifted precise placement most: Place Cryotube to Red Rack from
  40.00% to 65.00%, Place Centrifuge Tube to Orange Rack from 43.33% to
  53.33%, Discard Cryotube from 48.33% to 55.00%. Composite completion reached
  72.50% on desktop tidying and 75.00% on waste cleanup versus 62.50% for
  SmolVLA. RAG-Doubao-Seed-2.0-Pro verified 82.67% (62/75) of cases against
  73.33% for the base model. On protocol parsing, Qwen3.6-Plus led with F1
  0.7062 for actions but only 0.4387 for preconditions.


  The VLA comparison is measured against ACT, X-VLA, and unaugmented SmolVLA
  on the same data, which isolates the augmentation; curriculum staging is not
  separately ablated, and single tasks use 3 repeats only.


  Unverified is whether closed-loop verification itself improves end-to-end
  success, since no ablation removes the verification agent. Treat this as
  evidence that cheap augmentation and retrieval help perception-limited lab
  manipulation, not that the multi-agent loop does.
