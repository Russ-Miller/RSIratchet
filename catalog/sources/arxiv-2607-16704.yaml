summary: >-
  Large language models frequently violate fundamental scientific principles
  when generating technical content, undermining their reliability in
  scientific applications. We introduce Scientific Feasibility Control SFC,
  a graph-structured conformal prediction framework that provides
  statistical guarantees for scientific reasoning validity through
  progressive absolute-coherent-factuality validation. Our approach
  decomposes scientific reasoning into atomic absolute-coherent-factuality
  units requiring both individual correctness against physical laws and
  logical substantiation from preceding context
