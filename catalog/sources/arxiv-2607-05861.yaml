summary: "Large reasoning models (LRMs) improve language model capabilities by
  generating explicit thinking traces before final answers. In
  factuality-oriented question answering (QA), such thinking often improves
  overall performance by helping the model recover relevant knowledge and
  refine its answers. However, we find that this benefit is not uniform at the
  instance level: explicit thinking can also overturn correct non-thinking
  answers and lead to factual drift. We refer to this failure mode as
  \\emph{thinking-induced hallucination}. To explain this phenomenon, we
