summary: >-
  Large language models can contribute useful ideas to mathematical
  research, yet long-horizon proof attempts remain difficult to coordinate,
  evaluate, and reproduce. We present Albilich, an open-source agentic
  harness for autoresearch in mathematics that combines long-horizon
  reasoning, computer algebra systems (CAS), literature retrieval, and
  persistent SQLite-based context management. We evaluate Albilich on the
  RealMath benchmark (Zhang et al. 2025) and on open problems in group
  theory from the Kourovka Notebook (Khukhro and Mazurov 2026). It solved
