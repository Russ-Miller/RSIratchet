summary: >-
  Errors in radiology reports can adversely affect patient treatment, yet
  automated report quality assurance remains challenging because errors are
  often subtle and require domain expertise to detect. Although large
  language models (LLMs) have recently been proposed for radiology report
  verification, their ability to detect clinically meaningful errors beyond
  chest X-ray datasets remains under-explored. To this end, we present the
