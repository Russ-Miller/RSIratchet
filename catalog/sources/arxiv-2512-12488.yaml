brief: >-
  Default cultural alignment in flagship LLMs points at the United States
  regardless of where the model was built, and asking a model to be French
  moves it closer to the US instead.


  Eight models (DeepSeek-V3, V3.1, GPT-5, GPT-4.1, GPT-4, Claude Opus 4, Llama
  3.1 405B, Mistral Large 2411) each answered the 24-question VSM13 survey 50
  times per condition, with no cultural prompt and with system prompts for
  China, France, India, Iran, Japan and the US, scored on Hofstede's 6
  dimensions and compared to real survey values by summed absolute distance.


  5 of 8 models sat closest to the US with no prompt; DeepSeek-V3.1 and GPT-5
  were nearest at 52.13 and 87.13. Cultural prompting reduced total distance
  for 7 of 8, best for DeepSeek-V3.1 (1,037.01 to 792.42, 30.87%), while Llama
  3.1 moved away in 5 of 6 cases (+27.33%). France worsened (1,310.12 to
  1,488.7, +13.63%) and all 8 France-prompted models landed closer to US
  values. No model reached strong alignment with China.


  Effect is measured, not argued, with 56 populations and a matched no-prompt
  baseline; populations are 50 responses each versus the hundreds in
  Hofstede's human samples, only 6 countries, temperature fixed at maximum,
  and Gemini dropped for instruction-following failures.


  Treat country of origin as no guide to a model's cultural defaults.
