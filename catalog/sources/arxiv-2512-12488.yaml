brief: >-
  Language models default to US cultural values regardless of where they were
  built, and telling a model to answer as French pushes it closer to the
  United States rather than to France.


  The VSM13 survey behind Hofstede's 6 cultural dimensions was administered to
  DeepSeek-V3, DeepSeek-V3.1, GPT-5, GPT-4.1, GPT-4, Llama 3.1 405B, Mistral
  Large 2411, and Claude Opus 4, with 50 responses per population at maximum
  temperature, no system prompt plus cultural prompts for China, France,
  India, Iran, Japan, and the US, for 56 populations. Alignment is the summed
  absolute distance across dimensions to real survey values.


  5 of 8 models sat closest to the US unprompted; DeepSeek-V3.1 at 52.13 and
  GPT-5 at 87.13. Cultural prompting cut total distance for 7 of 8 models,
  most for DeepSeek-V3.1 (30.87%, 1,037.01 to 792.42); Llama 3.1 moved away in
  5 of 6 cases (+27.33%). Prompting for France made things worse overall
  (1,310.12 to 1,488.7) while every model moved nearer the US, average
  distance 72.45. No model reached strong alignment with China.


  Measured, not argued, but Hofstede's own populations run in the hundreds,
  only 6 countries were used, and Gemini was dropped for instruction-following
  failures. The dimension scores also depend on 1 or 2 questions each.


  Treat cultural prompting as a partial shift toward a US-anchored baseline,
  not a culture switch.
