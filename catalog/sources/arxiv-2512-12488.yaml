summary: Culture is the bedrock of human interaction; it dictates how we
  perceive and respond to everyday interactions. As the field of
  human-computer interaction grows via the rise of generative Large Language
  Models (LLMs), the cultural alignment of these models become an important
  field of study. This work, using the VSM13 International Survey and
  Hofstede's cultural dimensions, identifies the cultural alignment of popular
  LLMs (DeepSeek-V3, V3.1, GPT-5, GPT-4.1, GPT-4, Claude Opus 4, Llama 3.1,
  and Mistral Large). We then use cultural prompting, or using system prompts
  to shift the cultural alignme
