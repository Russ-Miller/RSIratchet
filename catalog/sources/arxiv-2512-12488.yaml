brief: >-
  Language models default to United States cultural values regardless of where
  they were built, and telling a model to answer as a French person moves it
  closer to the US than to France.


  The VSM13 survey of Hofstede's 6 cultural dimensions was administered to
  DeepSeek-V3, DeepSeek-V3.1, GPT-5, GPT-4.1, GPT-4, Llama 3.1 405B, Mistral
  Large 2411, and Claude Opus 4, each sampled 50 times per condition at
  maximum temperature, with no cultural prompt and with system prompts for
  China, France, India, Iran, Japan, and the United States. Alignment is the
  summed absolute distance across dimensions to real-world country scores.


  Without prompting, 5 of 8 models sat closest to the US, DeepSeek-V3.1 at
  52.13 and GPT-5 at 87.13. Cultural prompting reduced total distance for 7 of
  8 models, best for DeepSeek-V3.1 at 30.87% (1,037.01 to 792.42); Llama 3.1
  moved away in 5 of 6 cases, worsening 27.33%. Prompting for France raised
  total distance 13.63% (1,310.12 to 1,488.70) while US distance fell 11.54%.
  No model achieved strong alignment with China.


  The effect is measured, and the France result is consistent across all 8
  models, which makes it hard to dismiss as noise. But populations are 50
  responses where Hofstede's own surveys average in the hundreds, only 6
  countries were tested, Gemini was dropped for instruction-following
  failures, and the survey is self-report rather than behaviour.


  Treat cultural prompting as a partial nudge, not a fix, and expect a US
  prior underneath.
