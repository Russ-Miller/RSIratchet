brief: >-
  Default cultural alignment of flagship LLMs skews American, and asking a
  model to adopt another culture moves it only partway, with France a striking
  failure case where every model prompted for French culture landed closer to
  US values.


  The VSM13 survey behind Hofstede's 6 cultural dimensions was administered to
  DeepSeek-V3, DeepSeek-V3.1, GPT-5, GPT-4.1, GPT-4, Llama 3.1 405B, Mistral
  Large 2411, and Claude Opus 4, with no cultural prompt and with system
  prompts for China, France, India, Iran, Japan, and the United States. That
  is 56 model-country populations, 50 survey runs each, temperature at
  maximum, seeds 1-8400. Alignment is the summed absolute distance across
  dimensions to real country scores.


  5 of 8 models aligned closest to the US by default; DeepSeek-V3.1 and GPT-5
  were nearest at 52.13 and 87.13. Cultural prompting cut total distance for 7
  of 8 models, best for DeepSeek-V3.1 (30.87%, 1,037.01 to 792.42); Llama 3.1
  moved away in 5 of 6 cases (+27.33%). No model reached strong alignment with
  China. Prompting for France raised distance 13.63% (1,310.12 to 1,488.7)
  while US distance fell 11.54%.


  The effect is measured, not argued, but the instrument is a single survey, 6
  countries, and 50 responses per cell against Hofstede's human samples in the
  hundreds. Gemini was dropped for instruction-following failures. Treat
  country-of-origin as no predictor of a model's cultural defaults.
