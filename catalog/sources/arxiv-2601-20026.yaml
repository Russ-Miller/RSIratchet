brief: >-
  Adjusting token-sequence probabilities by their local sensitivity, before
  computing semantic entropy, improves confabulation detection over entropy
  methods that take those probabilities at face value. The claim is that
  aleatoric uncertainty in sequence probabilities, not just semantic
  clustering quality, drives detection errors.


  The method (SRE-UQ) treats the kernel mean embedding of sequence
  probabilities as the wave function of a quantum tensor network, uses
  first-order perturbation theory on the Hamiltonian to get a per-sequence
  uncertainty, then re-estimates probabilities by maximizing Renyi entropy
  with a KL penalty scaled inversely by that uncertainty. Clustering uses
  DeBERTa-large MNLI bidirectional entailment. Evaluation covers TriviaQA,
  NQ-Open, SVAMP and SQuAD on Falcon-RW 1B, LLaMA-3.2 1B, LLaMA-2 7B/13B and
  chat variants, and Mistral 7B, at 16-bit, 8-bit and 4-bit.


  Results are reported as pairwise win-rate matrices over 116 experimental
  scenarios, on AUROC and AURAC, against naive entropy, semantic entropy,
  discrete semantic entropy, embedding regression, and p(True). SRE-UQ wins or
  matches throughout, including under 4-bit quantization.


  Evidence is measured but summarized: the main figures are win rates, not
  absolute AUROC/AURAC values in the text, and no ablation separates the
  Renyi-entropy switch from the perturbation-based adjustment. One worked
  example illustrates the mechanism.


  Boundaries: 1B-13B open-weight models only, no GPT-4-scale check, requires
  token-level probabilities, so black-box APIs are excluded, and entropy
  estimates inherit DeBERTa entailment errors.


  If you already run semantic entropy, this suggests recalibrating sequence
  probabilities first, and that quantized deployments do not break the
  ranking.
