summary: >-
  Chain-of-Thought (CoT) reasoning has been shown to improve the performance
  of large language models (LLMs), yet existing optimization methods largely
  rely on outcome-based feedback, leaving the logical validity of
  intermediate reasoning steps largely unverified. To address the gap
  whereby LLMs arrive at correct final answers through logically flawed
  intermediate reasoning chains, we propose LogicTrack, a neuro-symbolic
  framework that audits reasoning trajectories by auto-formalizing each
