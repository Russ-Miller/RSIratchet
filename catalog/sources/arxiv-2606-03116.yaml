brief: >-
  Audio language models asked for a single holistic match/mismatch verdict on
  audio-instruction pairs perform near chance; decomposing the instruction
  into binary rubric items and averaging item-level yes-probabilities lifts
  the same models by double digits without any training.


  AnyAudio-Judge Bench holds 7,920 samples in symmetric English and Chinese
  across speech, sound, music, and mixed audio, with a 1:1
  positive-to-negative ratio and hard negatives built by instruction swapping
  and LLM attribute perturbation. 7 judges were tested under both prompts; a
  dedicated evaluator was trained from Qwen3-Omni-30B-A3B-Captioner on a
  105K-sample corpus with per-rubric labels and CoT rationales, via SFT then
  GRPO on 8,454 retained hard samples.


  Kimi-Audio-7B-Instruct moves from 50.93 to 70.84 average accuracy (Chinese)
  under rubric prompting; Qwen2.5-Omni-7B from 51.76 to 71.93. Gemini-2.5-Pro
  is the exception, dropping from 80.01 to 78.31. The trained judge reaches
  85.26 Chinese and 84.45 English. Ablation: holistic 65.33, rubric 76.66,
  +SFT 84.02, +SFT+GRPO 85.26.


  The paradigm-versus-training split is isolated by that ablation, and the
  training corpus is drawn from sources disjoint from the benchmark. External
  validation is 1 dataset, PAM, where correlations are 0.614 LCC against 0.472
  for CLAPScore.


  Benchmark labels were themselves filtered by Gemini and CLAP, so negatives
  inherit those models' blind spots, and rubric decomposition can miss
  implicit constraints.


  If you use an LALM as an alignment judge, switch to item-level decomposition
  before assuming the model lacks the grounding.
