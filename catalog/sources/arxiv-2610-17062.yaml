summary: "We propose a mitigation to reward hacking in reinforcement learning.
  Our setup involves a misspecified reward function that gives rise to
  unintended behavior, and a monitor used to detect unintended behavior. As
  with frontier AI systems, the monitor makes systematic errors. Consequently,
  using the monitor for data filtering or to apply a reward penalty fails to
  prevent the model from learning unintended behavior (&#34;reward
  hacking&#34;). To address this problem, we introduce GRAFT: Gradient Routing
  Adapter Fine Tuning. Rather than penalizing or filtering flagged samples
  during training, GRAFT constrains gradient updates on those samples to a
  sacrificial set of new parameters. This has two benefits: First, because the
  monitor is not part of the reward function, the model does not learn to hide
  misbehavior. Second, ablating the sacrificial parameters reduces or entirely
  stops the uninten…"
