archived_text: |
  Hashimoto's rule for AI agents is that every mistake becomes a permanent fix. This playbook turns it into six layers.

  The document was compiled independently from work by HashiCorp cofounder Mitchell Hashimoto, OpenAI, Martin Fowler, LangChain, and Cursor, and it argues the model is the least important part of an agent. It boils everything down to one formula. Agent equals model plus harness.

  The harness is everything wrapped around the model. Rule files it reads before starting, tests that check its work after, a loop that retries and then escalates, files that remember state between sessions, permissions that decide what it can touch, and logs that show what it did.

  The evidence is what makes the playbook worth reading. Hold the model fixed, change only the harness, and the results move more than a model upgrade would.

  LangChain's coding agent climbed from outside the top 30 to 5th on Terminal Bench 2.0 without touching the model. An OpenAI team shipped a million-line codebase across roughly 1,500 pull requests with no manually written code, and estimated it took a tenth of the time writing it by hand would have. One practitioner's write-up cited in the playbook reports the same Claude Sonnet 4.5 going from 31 percent to 75 percent on the GAIA benchmark with only the harness changed.

  The idea I keep coming back to is that ratchet. Every time the agent makes a mistake, you engineer a fix so it never makes that mistake again. The fix lives in a rule file entry, a test, or a permission boundary that holds for every future run, instead of a prompt tweak that dies with the conversation.

  The playbook's tell for a healthy system is that the rule file grows fast at first and then slows down. Early on you're adding several rules a day, and once the common failures are covered it settles to about one a week.

  It also draws a line around when not to bother. One-off questions and brainstorming don't need any of this. The harness earns its cost when the same workflow runs repeatedly, mistakes have consequences, and nobody is watching.

  The model is the intelligence. The harness is the reason it ships.
