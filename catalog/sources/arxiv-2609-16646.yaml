  scientific methodologies beyond benchmark scores---using models as
  instruments for understanding behavior. We address this by asking: can we
  use large vision-language models (LVLMs) as experimental instruments for
  studying their own failure dynamics? Focusing on visual hallucination, we
  introduce SAFE, a training-free decoding framework that contrasts
  visually-grounded and vision-ablated generation paths to produce a
  token-level contrastive grounding score that identifies when the model
