brief: >-
  Most of the claimed benefit from task-adaptive agent topology selection is
  also obtained by simply sampling 1 strong model repeatedly at the same token
  budget. AdaptOrch decomposes a task into a dependency DAG, computes
  parallelism width, critical path depth and coupling density, then routes to
  1 of 4 topologies (parallel, sequential, hierarchical, hybrid) in O(|V|+|E|)
  time, with a synthesis protocol that re-routes on low consistency.


  Evaluation uses 5 near-matched models (GPT-4o-mini, Claude 3.5 Haiku, Gemini
  2.0 Flash, Llama 3.3 70B, Qwen 2.5 72B) on SWE-bench Verified, GPQA Diamond
  and HotpotQA, 3 runs each.


  AdaptOrch reaches 52.6 on SWE-bench, 53.1 on GPQA, 76.4 F1 on HotpotQA,
  versus 42.8/46.2/68.3 for Single Best. A compute-matched Self-MoA baseline
  gets 51.5/52.3/75.5, recovering 89% of the gains. Static-Parallel falls
  below Single Best on GPQA, so wrong topology hurts. Router agrees with an
  exhaustive oracle on 81.2% of 698 instances.


  The matched-budget Self-MoA comparison and component ablations (synthesis
  -5.5, routing -2.8) do isolate the contribution, but the ablation magnitudes
  in the appendix (4.7-8.3 points) do not match Table 4, thresholds were tuned
  on a 15% dev split by the authors, and all results are self-reported from 1
  group.


  No gain on atomic or fully coupled tasks; untested on creative writing,
  long-form and multimodal work.


  If you are choosing between orchestration engineering and more samples from
  1 model, the cheap option captures most of the win here.
