  comparable benchmark performance, the traditional paradigm of selecting a
  single best model per task yields diminishing returns. We argue that
  orchestration topology -- the structural composition of how multiple agents
  are coordinated, parallelized, and synthesized -- now dominates system-level
  performance over individual model capability. We present AdaptOrch, a formal
  framework for task-adaptive multi-agent orchestration that dynamically
  selects among four canonical topologies (parallel, sequential, hierarchical,
  and hybrid) bas
