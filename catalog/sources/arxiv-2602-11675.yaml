brief: >-
  Stronger reasoning models resist "Are you sure?" reprompting on causal
  questions but fix their answers when critique names confounders and
  back-door paths. The authors call this Epistemic Stubbornness, and frame the
  underlying failure as Rung Collapse: answering an interventional query with
  associational reasoning, which outcome reward cannot penalize.


  Epistemic Regret Minimization (ERM) critiques the exposed reasoning trace
  instead of the answer. Tests span 1,360 CausalT5K scenarios across 6 models
  (GPT-3.5 Turbo, Llama 3.3 70B, GPT-4 Turbo, Gemini 2.5 Flash, GPT-5.2,
  Claude Sonnet 3.5), with a cross-episode factorial on 466 Wolf Cases and a
  confounded linear-Gaussian simulation.


  GPT-4 Turbo and GPT-5.2 recover 31.4% and 24.5% under outcome-only
  reprompting versus 90.5% and 77.6% under ERM critique. Self-consistency,
  Best-of-N and Self-Refine recover 30.8%, 15.9%, 14.8% versus 52.9% for
  outcome-only; ERM reaches 64.1% with 4.1% residual collapse. In simulation,
  regret is 8.82 ± 0.14 versus RLVR's 349.22 ± 0.00.


  Evidence is stronger than usual: a matched-richness control isolates causal
  vocabulary for GPT-4T (+5.9 pp, p = 0.006) but not GPT-5.2 (p = 0.093), plus
  a scenario-blind judge and a memory-reset ablation.


  The headline gains use a benchmark-derived rationale and error-direction
  cue; label-free critique trades recovery for 0% false-flips. No end-to-end
  policy training; the benchmark is built to make L1 shortcuts fail.


  If you evaluate self-correction, separate outcome feedback from structural
  critique.
