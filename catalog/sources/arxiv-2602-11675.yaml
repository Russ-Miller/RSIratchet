summary: >-
  Large language models can answer causal questions correctly for the wrong
  reasons. Current RL methods reward \emph{what} a model concludes but
  ignore \emph{why}, reinforcing correlational shortcuts -- a failure we
  call \emph{Reward Entrenchment}. We introduce \emph{Epistemic Regret
  Minimization} (\erm), a framework that critiques the causal
  \emph{structure} of a model's reasoning trace rather than its answer.
  Applying established causal principles, \erm flags unexamined confounders,
  correlation--intervention conflation, and unchecked back-door paths from
