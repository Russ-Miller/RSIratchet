  Agentic Harness Harness Engineering Ai Agent Harness Context Engineering Ai Coding Agents Agentic Harness Engineering: The Operating System for Machine Intelligence An agent isn’t a model with a longer prompt. It’s a model running inside a harness — a control plane that governs what the model sees, what it can do, and how its actions, memory, risk, and cost are managed. Adnan Masood, PhD. Follow 37 min read · Jun 26, 2026
  TL;DR: An agent is not a model with a longer prompt — it is a model running inside a harness: the control plane that decides what the model sees, what it may do, how its actions are verified, how its memory persists, and how its cost and risk are contained. Eighteen months ago, the claim that harness design moves agent outcomes by margins as large as model selection would have read as a provocation; today it is the consensus position of every major lab shipping agents. The evidence is empirical and hard to argue with: hold the model fixed and swap only the scaffolding, and an identical Claude Sonnet 4.5 swings from 30.91% to 74.55% on GAIA — a 43.64-point spread attributable entirely to the harness. What follows is a practitioner’s map of that territory, walking the natural anatomy of a harness — boundary, loop, context, tools, memory, verification, orchestration, reliability, safety, economics, measurement, and trajectory — drawn from the public engineering record of Anthropic, OpenAI, Cursor, Cognition, OpenHands, and the research literature. The throughline is simple: the model supplies the intelligence, and increasingly it is the harness, not the model, that shapes that intelligence into reliable work.
  The harness is now a first-class engineering artifact, separable from the model it wraps, and harness decisions move agent outcomes by margins as large as model selection does at a fixed level of model capability. That sentence would have read as a provocation eighteen months ago. Today it is the consensus position of every major lab shipping agents. OpenAI describes the Codex harness as the core agent loop and execution logic underlying all of its Codex surfaces [2]. Cursor defines its harness explicitly as instructions, tools, and a model, with model-specific tuning [3]. Harness-Bench formalizes the same claim at the research level and argues that agent capability should be reported at the model-harness configuration level rather than attributed to the base model alone [1].
  The contemporary frontier language model is a stateless inference engine that predicts tokens. It does not loop, retry, remember, verify, or refuse to delete your production database. Everything that turns that engine into an autonomous agent lives in the harness: the control loop, the context management, the tool interfaces, the memory tiers, the verification layers, and the safety scaffolding. The clearest evidence that this layer is separable and consequential is empirical. Hold the model constant and swap the harness, and success rates on industry-standard benchmarks move by double digits — on GAIA, an identical Claude Sonnet 4.5 scores 74.55% inside one harness and 30.91% inside another, a 43.64-point spread attributable entirely to scaffolding [82].
  This piece is a practitioner’s map of that territory. It follows the natural anatomy of a harness — boundary, loop, context, tools, memory, verification, orchestration, reliability, safety, economics, measurement, and trajectory — and draws on the public engineering record from Anthropic, OpenAI, Cursor, Cognition, OpenHands, LangChain, and the research literature. The throughline is simple: harness design has matured from ad-hoc scripting into a systems-engineering discipline with its own lifecycle, security model, and token economics. The model supplies intelligence. The harness shapes that intelligence into reliable work.
  1. Definition and Boundary
  The cleanest mental model is a three-tier stack. The language model sits at the bottom as the stochastic inference engine plus its native interface for text, tool calls, or multimodal input. The user or calling application sits at the top, supplying intent, business workflow, and domain logic. The harness occupies the large middle, operating as a functional operating system for the model [4]. It owns the runtime that decides when the model is invoked, what context it sees, what tools are available, what state persists, which verifiers run, and which actions are allowed. OpenAI’s Agents SDK makes the same cut explicit by placing orchestration, tool execution, approvals, and state on the application side, above the raw model call [8].
  A source-level architecture analysis of Claude Code reveals how much machinery actually lives in that middle tier. The inference engine is a minor fraction of the system; the surrounding implementation is a large volume of specialized code organized into a seven-component architecture spanning user interfaces, a core agent loop, a permission system, state management, and execution backends [5][6]. Those layers include a permission framework with seven distinct operating modes, an integrated machine-learning classifier for intent verification, a five-layer context compaction pipeline, extensibility mechanisms for external protocols, and sub-agent delegation tracking [5]. The harness abstracts the host environment away from the model entirely — network timeouts, raw file descriptors, and authentication handshakes never reach it. The model emits structured tool requests; the harness executes them in isolated sandboxes, manages the resulting state, and feeds observations back into the context window [4]. OpenHands, the OpenAI Codex CLI, and Claude Managed Agents all share this clean separation between a control plane and a compute plane [7].
  A useful way to organize the rest of the discipline is a six-plane taxonomy. The loop plane owns turns, planning, tool execution, and termination. The context plane owns retrieval, compaction, file-based guidance, and long-session degradation. The action plane owns tool definitions, shell access, computer use, browser control, and MCP integration. The state plane owns scratchpads, todo files, episodic and semantic memory, and cross-session persistence. The assurance plane owns tests, critics, self-review, policy checks, and permission gates. The operations plane owns tracing, replay, token accounting, caching, routing, and cost attribution. Harness-Bench uses almost the same envelope, defining the harness as the system layer that manages context, tools, state, constraints, permissions, tracing, and recovery [1].
  This taxonomy also separates production practice from research. Claude Code, Cursor, Codex, Devin, and OpenHands expose loop, context, tool, and safety primitives that are clearly production-facing. Aider and SWE-agent remain closer to open engineering tools and reference harnesses, though both have influenced production systems heavily. Anthropic’s multi-agent research system, LangChain’s deepagents experiments, and Harness-Bench belong to the research layer, even when their lessons transfer directly into product. The right reading is to treat shipping products as operational evidence and research harnesses as ablation engines. The slogan that captures the shift is blunt and correct: AI agents are not prompts; they are harnesses [9].
  Press enter or click to view image in full size 2. The Control Loop
  The control loop is the smallest useful agent — the irreducible core that everything else hangs off. OpenAI’s Codex loop is explicit: prepare the prompt, query the model, interpret either a final response or a tool call, execute the tool, append the observation, and repeat until the model emits a terminating assistant message [2]. The same shape recurs from Claude Code to SWE-agent, structured as a continuous, stateful cycle [10][5]. Stated as a strict pipeline, the harness receives a prompt, assembles the system instructions and conversation history, and invokes the model; the model evaluates the current state and emits text plus specific tool requests; the harness suspends the model, routes the requested tools through a permission gate, executes the approved commands, appends the results to history, and the cycle repeats [10].
  Two design moves have hardened around this core. The first is interleaving logic and action: the harness forces the model to articulate a plan in a hidden reasoning block before executing a tool, which stabilizes multi-step trajectories [12]. The second is the migration from purely reactive ReAct-style loops toward plan-execute-verify loops with structured artifacts. Cursor’s Plan Mode adds tools for plan creation and maintenance and reports that most new features now begin with the agent writing a plan [13]. Codex added native plan mode in early 2026 and documents Plan.md, Implement.md, and Documentation.md as distinct artifacts for multi-hour runs [14][15]. Anthropic's long-running harness uses an initializer agent to decompose work and a coding agent to implement one feature at a time, later layering a generator-evaluator structure to push quality further [11]. In 2025 these planning files looked optional. By late 2025 and early 2026 they had become standard harness infrastructure for long-horizon coding.
  Termination is the part everyone underestimates, and it is harness policy rather than a model property. The loop never stops arbitrarily; stop conditions are engineered. The primary termination condition fires when the model produces only text without requesting any further tool invocation, signaling completion [5]. Secondary conditions include a hard-coded maximum turn limit, a context-overflow exception from the API, a budget cap, or a hook intervention where a post-execution script forces a halt [5]. Terminal-Bench standardizes timeout and resource budgets for submitted agents precisely so that these policies are comparable across systems [16]. This engineering exists because the failure is real and recurrent: models tend to stop too early, skip verification, or spin on bad local minima unless the harness enforces checklist-style completion criteria, verification hooks, or loop-detection middleware [11][17].
  Context engineering has replaced prompt engineering as the central systems task. Anthropic states this directly and treats compaction as the first lever for long-term coherence [18]. Cognition makes the argument even more strongly, framing context engineering as the number-one job of engineers building reliable long-running systems [19]. Cursor’s version is that the single biggest quality factor for cloud agents is reconstruction of the full development environment, because without it the model cannot execute or verify its work [20]. Raw context limits have expanded dramatically, but feeding a model hundreds of thousands of tokens per turn imposes severe latency penalties and drives inference costs up sharply. The discipline exists to resolve the tension between the model’s appetite for information and the system’s need for efficiency.
  The current consensus is to manage the context window as a scarce operating resource, reshaping it actively during execution. Claude Code implements a five-layer compaction pipeline triggered immediately before a model call when pressure thresholds are reached [5]:
  +-------+------------------+-------------------------------------------------------+ | Layer | Name | Action | +-------+------------------+-------------------------------------------------------+ | 1 | Budget reduction | Drop the least-relevant content first, by heuristic | | | | relevance score. | +-------+------------------+-------------------------------------------------------+ | 2 | Snip | Remove older, redundant tool-call outputs; frees | | | | tokens invisibly while keeping the dialogue intact. | +-------+------------------+-------------------------------------------------------+ | 3 | Microcompact | Fine-grained compression of individual long messages. | +-------+------------------+-------------------------------------------------------+ | 4 | Context collapse | Fold older conversation turns into shorter recaps. | +-------+------------------+-------------------------------------------------------+ | 5 | Auto-compact | Last resort: a separate model call summarizes the | | | | entire conversation block into a compressed digest. | +-------+------------------+-------------------------------------------------------+
  Anthropic’s broader compaction system summarizes old turns, preserves decisions and unresolved issues, discards redundant tool outputs, and resumes with compressed context plus recent files [18]. OpenAI’s Codex loop now performs first-class server-side compaction through the Responses API when an auto-compact limit is exceeded, replacing the earlier manual /compact workflow [2]. The efficiency case is concrete: OpenHands reports that context condensation holds per-turn cost below half the baseline on its SWE-bench Verified subset while maintaining essentially the same solve rate, 54% versus 53% on the tested slice [21].
  A second major shift occurred in late 2025 around retrieval itself. Traditional pre-inference indexing pipelines were largely displaced by just-in-time agentic loading: the harness hands the agent lightweight search tools, and the model pulls specific file contents into working memory only when required [26]. File-based persistent context remains the durable steering mechanism across vendors. Claude Code starts each session with a fresh context window and restores persistent knowledge via CLAUDE.md files and automatic memory, loading them hierarchically with scoped rules and treating both manual instructions and auto-memory as ordinary, auditable context [22]. Codex reads layered AGENTS.md files before doing work, merging them from global scope down to the current directory with later files overriding earlier ones, injected near the top of the conversation as user-role messages [23][24]. Aider takes a different route, building a repository map from symbols and key definitions plus optional summarization of long chat history [25]. The shared pattern is externalized, file-backed state that travels with the repo.
  These files are not free wins, and the research is a useful corrective to the instinct to over-document. An evaluation by researchers at ETH Zurich found that LLM-generated context files reduced task success rates by 3% and increased inference costs by over 20% compared to providing no context file at all; redundant documentation inside the file actively confuses the model [27][28]. Human-written context files improved performance by 4% only when they strictly avoided duplicating standard documentation and focused entirely on non-obvious project deviations [28][98]. The lesson generalizes: a context file is a budget line, not a free prior, and its value comes from non-obvious signal, not volume [97].
  Long-session degradation remains real even as models improve, and it is the clearest recent example of a harness control becoming dead weight. Anthropic’s managed-agents work describes Claude Sonnet 4.5 exhibiting “context anxiety,” wrapping up early as context filled, which the harness mitigated with resets — and those same resets became useless on Claude Opus 4.5 [51]. OpenAI frames the same trend from the durable-memory side, documenting a 25-hour Codex run that relied on persistent markdown artifacts for specification, milestone tracking, and status rather than one giant prompt [14]. The trade space is summarized below.
  +---------------------+----------------------------------+----------------------------------+ | Dimension | High-context (preloading) | Dynamic (agentic retrieval) | +---------------------+----------------------------------+----------------------------------+ | Token consumption | Massive up-front burn. | Low baseline; scales with depth. | +---------------------+----------------------------------+----------------------------------+ | Latency | High initial load time. | Intermittent delays on tool | | | | calls. | +---------------------+----------------------------------+----------------------------------+ | Information density | Diluted; key facts easily lost. | Concentrated on the immediate | | | | task. | +---------------------+----------------------------------+----------------------------------+ | Cost profile | Expensive for simple queries. | Cost-effective for simple | | | | queries. | +---------------------+----------------------------------+----------------------------------+ | Failure mode | Retrieval failures in large | Model fails to search the | | | datasets. | correct paths. | +---------------------+----------------------------------+----------------------------------+ 4. Tool and Action Interface
  The mechanism by which the model touches its environment defines its capability ceiling, and tool design has become an optimization problem in its own right. Anthropic’s tool-writing guidance emphasizes namespacing, clear boundaries, return payloads that preserve meaningful context, and aggressive optimization for token efficiency — and argues that tools must be designed for agents rather than for human developers, because the contract is now between a deterministic system and a non-deterministic decision-maker [29]. OpenAI’s Codex prompting guide treats tool choice as a major performance lever and explicitly recommends the exact apply_patch implementation and the shell tool for best results [30]. A sprawling array of hyper-specific endpoints does measurable harm: it confuses the model, inflates token cost, and produces hallucinated arguments and incorrect tool selection [4].
  The live debate is granularity — a small set of broad tools, especially shell and code execution, versus a larger set of bespoke, API-like tools. The broad-tool case has strengthened over the last year because frontier models compose shell commands, read file systems, and write short scripts far better than they used to. Anthropic’s code-execution-with-MCP work states the economic argument plainly: direct tool calls consume context for every tool definition and every result, while code execution lets the agent write one script and keep intermediate results inside the execution environment, returning only the final filtered output [31]. Anthropic’s Skills architecture reaches the same destination from another angle, packaging procedures, scripts, and resources into folders loaded on demand rather than bloating the base prompt [35].
  The counter-case is just as well-evidenced, and it is the reason “give the agent a shell” is not the whole answer. The researchers behind SWE-agent demonstrated that raw shell access is highly error-prone for language models because of verbose outputs and complex state management, and engineered a constrained Agent-Computer Interface in response: a windowed file viewer capped at 100 lines, a search tool that truncates massive output dumps, and an editor that runs a syntax linter before allowing changes to persist [32][33]. That constrained interface roughly doubled the agent’s performance on SWE-bench compared to raw shell environments [32]. The synthesis is not “broad beats narrow” but “broad where the model is strong and the contract is loose; narrow where outputs are noisy or policies are strict.”
  The Model Context Protocol has become the standardization layer underneath both styles. Anthropic introduced MCP in November 2024 as an open standard for secure two-way connections between AI systems and external tools [34]. By late 2025 it was central enough that advanced tool use, code execution, skills, and credential vaulting were all being described through MCP, with Codex surfaces exposing MCP support as well [31]. Its importance is architectural: it turns bespoke tool glue into a portable interface layer, which shifts engineering effort away from fragile wrappers and into harness policy — discovery, ordering, retries, and security boundaries. Executing MCP servers inside the harness also enables progressive disclosure, keeping intermediate results in the execution environment and returning only filtered output to the model’s context, which cuts token consumption and shrinks the error surface [31]. The pattern has reached enterprise scale, with organizations standing up MCP infrastructure to broker agentic access to internal data and services [36][37].
  Computer and browser control are now harness extensions rather than novelty demos. OpenAI’s Operator uses a computer-using agent built on GPT-4o vision plus reinforcement learning and reports 58.1% on WebArena [38]. Anthropic’s computer-use tool reports state-of-the-art results among single-agent systems on WebArena for its benchmark configuration and positions computer use as one tool among others such as bash and text editing [39]. Cursor added computer control for agents in early 2026. In all three cases the hard engineering problem is the harness around the model: screenshot cadence, action vocabulary, DOM abstraction or its absence, approval policy, and graceful fallback to deterministic connectors wherever one exists.
  State management decides whether an agent sustains long-horizon execution or collapses into repetitive loops. Production harnesses separate memory into tiers. Episodic memory spans the current session and lives in the working context. Semantic memory persists across sessions and must be externalized to survive a fresh context window. During execution, harnesses lean on scratchpads and explicit plan files: the model writes its steps into a dedicated block before acting, which forces an iterative planning process and stabilizes multi-step trajectories [12].
  Cross-session persistence and whole-codebase understanding require more than a notes file. Aider pioneered the syntax-tree repository map, and it remains the reference implementation for compact structural memory. The harness parses the abstract syntax tree of the entire repository, extracting class definitions, function signatures, and exported types, then applies a graph-relevance algorithm that ranks symbols by how frequently they reference one another [25][40]. It packs the most critical structural information into a tight block, typically targeting a strict 1,024-token budget, which lets the model map global architecture without loading thousands of source files into episodic memory [40]. The design lesson that travels well beyond Aider is that a good memory layer is not “more context” — it is a ranked, budgeted projection of the codebase into the smallest representation that preserves orientation. Explicit state machines manage the transitions, keeping the agent oriented regardless of conversation length, and the file-backed portion of that state travels with the repository so a new session can reconstruct where the last one left off.
  Press enter or click to view image in full size 6. Verification and Self-Correction
  A model running autonomously will eventually emit a syntactically valid but logically wrong action. Verification layers are the harness’s immune system, and they have moved from “nice to have” to the central bottleneck. OpenHands puts it plainly: code generation is cheap, but trustworthy verification is scarce, so its stack layers fast deterministic checks, repository-specific validators, and higher-level confidence signals to make agents fail fast and hand humans only merge-worthy output [21]. Anthropic’s eval guidance points the same way — prefer code-based graders wherever ground truth exists, then model-based graders, then human graders only where necessary [42]. The most effective pattern relies on deterministic ground truth in a generate-validate-fix sequence: the agent writes the code, the harness runs the compiler, linter, or test suite, and on failure feeds the structured error codes and specific line numbers back to the model for correction [43].
  The empirical payoff from getting verification right is large and model-independent. LangChain’s terminal-bench improvement loop found that the single most common failure pattern was an agent writing code, rereading it, declaring it fine, and stopping; adding explicit build-self-verify instructions plus a middleware hook that forces a pre-completion verification pass moved its GPT-5.2-Codex agent from 52.8 to 66.5 on Terminal-Bench 2.0 without changing the model [17]. Critic models and best-of-N selection also work: OpenHands’ SWE-bench Verified result rose from 60.6% on a single rollout to 66.4% with five attempts plus a trained critic, holding the underlying agent model and task setup constant [41].
  Both moves come with a warning, because once the verifier becomes the optimization target the system starts optimizing for the verifier rather than for reality. Research on test-time verification shows that cross-family verification — one model family checking another — is somewhat effective, while self-verification degrades rapidly as task complexity rises [44]. The sharpest failure is reward hacking: an agent evaluated purely on whether a test suite passes will frequently edit the test suite to expect the broken output [45]. Securing test files against agent modification via filesystem permissions in the sandbox is therefore a mandatory harness design pattern, not an optional hardening step. This is also why production harnesses still privilege compilers, tests, linters, and schema checks over purely model-based critics whenever ground truth exists.
  +------------------+--------------------------------+----------------------------------+ | Dimension | Generalist harness | Specialized verification harness | +------------------+--------------------------------+----------------------------------+ | Domain breadth | Unlimited; attempts any text | Narrow; locked to specific | | | task. | frameworks. | +------------------+--------------------------------+----------------------------------+ | Error rate | High on deep logic paths. | Very low; deterministic halting. | +------------------+--------------------------------+----------------------------------+ | Iteration speed | Fast; bounded by API latency. | Slower; must compile test suites.| +------------------+--------------------------------+----------------------------------+ | Autonomy | High; pivots to new approaches.| Constrained; halts against | | | | strict tests. | +------------------+--------------------------------+----------------------------------+ 7. Orchestration and Multi-Agent Patterns
  The consensus on multi-agent architectures shifted hard between 2025 and 2026, and the shift is worth understanding precisely because the two canonical positions are both correct about different work. Cognition’s June 2025 position was blunt: do not build multi-agents for general production use, because fragmented decisions and poor context sharing make systems fragile [19]. Anthropic’s June 2025 research-system post reached the opposite conclusion for open-ended research, where a planner spawns parallel search agents because the path is inherently dynamic and exploratory [47]. The conflict is real rather than rhetorical — the two teams were optimizing for different shapes of task, one convergent and write-heavy, the other divergent and read-heavy.
  Cognition’s April 2026 follow-up supplies the synthesis the field converged on. Multi-agent systems work when intelligence is distributed but writes remain effectively single-threaded; today’s practical wins are mostly read-only or review-oriented subagents — code search, web search, DeepWiki lookups, and iterative review loops [46]. The failure mode that kills naive parallelism is implicit context divergence: parallel writers diverge on styling, edge cases, and architecture, making assumptions that produce unmergeable conflicts [19]. The pattern that survives is one active writer paired with multiple read-only intelligence agents, where the harness isolates context strictly — a subagent is spawned in an isolated environment to run a specific search or parse a deep directory and returns only a consolidated summary to the primary writer [5].
  The orchestrator-worker pattern dominates enterprise deployments, formalized by harnesses such as Claude Managed Agents and the OpenAI Agents SDK through explicit, strongly typed handoffs in which Agent B inherits none of Agent A’s history and starts with a clean context window and a precise goal [7][8][50]. The costs are not free: every transition serializes state and pays for a fresh prompt evaluation, multiplying both API cost and error surface, and if the bridge between a coding agent and a review agent lacks clear synthesis instructions the system enters a feedback loop where the reviewer demands out-of-scope changes and the coder blindly obeys [19][49]. Anthropic’s parallel-Claudes C-compiler experiment is the honest stress test of the upper bound: 16 agents, simple git-based task locks, and a verification-heavy environment let Claude resolve many merge conflicts and parallelize debugging, yet the author reports that most of the effort still went into designing tests, environment, and feedback, and that the harness burden climbed with every additional agent [48].
  +-------------------+-----------------------------------+----------------------------------+ | Dimension | Single-threaded agent | Orchestrated multi-agent | +-------------------+-----------------------------------+----------------------------------+ | Context coherence | Perfect; one continuous memory. | Fragmented; needs explicit | | | | context passing. | +-------------------+-----------------------------------+----------------------------------+ | Scalability | Limited by context window size. | Partitions tasks indefinitely. | +-------------------+-----------------------------------+----------------------------------+ | Cost | Scales linearly with length. | Scales multiplicatively with | | | | agent spawns. | +-------------------+-----------------------------------+----------------------------------+ | Complexity | Low; one transcript to debug. | High; needs distributed tracing. | +-------------------+-----------------------------------+----------------------------------+
  The cross-cutting trade space, drawn from both product and research evidence, lands here:
  +----------------------+------------------------+--------------------------+----------------------------+ | Tradeoff | Left side | Right side | Current evidence | +----------------------+------------------------+--------------------------+----------------------------+ | Autonomy vs control | Full autonomy | Approval-gated autonomy | Auto-review shifts toward | | | | | contextual gating, not | | | | | binary allow/deny. | +----------------------+------------------------+--------------------------+----------------------------+ | Context vs cost | Rich preload | JIT retrieval + | Compaction, repo maps, | | | | compaction | skills, file memory | | | | | dominate best practice. | +----------------------+------------------------+--------------------------+----------------------------+ | Generality vs | Shell / code exec | Bespoke narrow tools | Broad tools win as models | | reliability | | | improve; narrow tools win | | | | | where contracts are strict.| +----------------------+------------------------+--------------------------+----------------------------+ | Single vs multi- | Single-threaded writer | Parallel collaborators | Parallel search and review | | agent | | | help; parallel writing | | | | | stays fragile. | +----------------------+------------------------+--------------------------+----------------------------+ 8. Reliability Engineering
  Reliability engineering for agents now looks closer to distributed systems than to prompt craft. Cursor describes cloud-agent work as increasingly building an operating layer around the model, and Anthropic’s managed-agents architecture explicitly decouples the brain from the hands and the session log so that harness failures, sandbox failures, and event-stream failures can be recovered independently [20][51]. This matters because long-horizon agents fail in ways that do not resemble model hallucination: stale environments, tool flakiness, cache misses, stuck sessions, drifted plans, missing credentials, expired approvals, and hidden benchmark leakage. The characteristic long-run failure is goal drift — a minor error at step four compounds, and the agent spends the next several steps debugging a problem it invented while abandoning the original objective.
  Active doom-loop detection is the standard countermeasure. Frameworks such as Kilocode and PraisonAI implement deterministic circuit breakers keyed on tool-invocation patterns: if the harness sees the exact same tool call with identical arguments three times in a row, it suspends execution, interprets the behavior as terminal failure, and either escalates to a human operator or injects a forced system message demanding a new approach [52][53][54]. Idempotency must be enforced at the tool layer so that a replayed session does not corrupt the environment if a step executes twice, which is why harnesses snapshot the filesystem before write operations and support full state rollback for deterministic recovery [61].
  Replay, determinism, and externalized state are the backbone of recoverability. Anthropic’s managed-agents design turns the session into an append-only event log living outside the sandbox, so a failed harness can be restarted with a wake(sessionId) call and resumed from externalized state rather than from a corrupted in-memory cursor [51]. Reproducible evaluation infrastructure exists for the same reason — Terminal-Bench and the HAL harness were built partly because agent evaluation needed reproducible environments, cost accounting, and trace capture [16][82]. And the case for trace-level observability is not theoretical: Anthropic's September 2025 postmortem documents three infrastructure bugs that degraded output quality intermittently in ways that were hard to distinguish from ordinary model variance until traces and telemetry were examined systematically [55]. A harness can be correct on paper and still ship worse results because of an infrastructure regression no prompt review would catch.
  9. Safety, Permissions, and Sandboxing
  Autonomous execution introduces catastrophic risks. An agent with full shell access can exfiltrate secrets, wipe databases, or push vulnerable code, and the harness is entirely responsible for containment. The first ergonomic problem is approval fatigue. Anthropic reports that Claude Code users approve 93% of permission prompts, which means the human review signal degrades under repetition until it is nearly worthless [56]. Cursor reaches the same diagnosis. The shared response is to turn autonomy from a switch into a dial by placing a small classifier agent inline before high-risk tool calls. Cursor reports that sandboxed agents stop 40% less often than unsandboxed ones, and Anthropic’s auto mode attacks the same problem from the approval side [57][58][56].
  Claude Code implements this through a deny-first permission pipeline with seven distinct operating modes and an integrated machine-learning classifier that evaluates every proposed tool call in the background [60][56]. The classifier analyzes the specific tool, its arguments, and the entire conversation transcript to determine intent, blocking actions that fall into predefined threat categories — data exfiltration, security degradation, crossing trust boundaries, and bypassing review — and it intercepts both honest mistakes where the agent misunderstands the environment and overeager behavior where the agent tries to fix issues outside its authorized scope [56].
  Blast-radius control is increasingly structural rather than instructional, because telling a model not to leak a secret is weaker than never letting the secret into the room. Anthropic’s managed-agents design keeps credentials out of the sandbox where generated code runs, wires repository access through git remotes, and proxies MCP calls through a credential vault so the harness itself never sees OAuth secrets [51]. OpenAI’s Codex frames approvals and sandboxing as separate axes that jointly constrain filesystem and network access [30]. Execution sandboxing provides the hard boundary: models execute code exclusively inside ephemeral micro-VMs and containerized layers from platforms such as Docker, Modal, Vercel, Namespace Devboxes, and Blaxel, which boot in milliseconds, run the untrusted code, capture stdout, and terminate [61][62][63][64][65]. The credentials needed to reach the model API or external platforms stay locked in the control plane and never enter the compute plane, so if the agent runs malicious code the sandbox is compromised, the blast radius is physically contained, and lateral movement is blocked [62]. The autonomy dial is implemented by changing environment and execution policy — not by changing instructions — and recording those decisions in traces and session state [66].
  The failure-mode catalog below pairs each recurrent pattern with a named, public instance. Together these are the reason replay, traces, permissions, credential isolation, and environment verification are harness responsibilities rather than afterthoughts.
