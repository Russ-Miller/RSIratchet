  The benchmark story has conflicts that should be surfaced rather than hidden, because they are now part of the engineering surface. HAL has paused some leaderboard updates while focusing on reliability measurement. TAU-bench removed a few-shot scaffold from its public leaderboard in December 2025 after test examples leaked into its demonstration file [83]. WebArena’s original evaluation has been revised by WebArena Verified, which reports an 11.3-percentage-point reduction in false negatives and documents inflated or brittle scoring in parts of the earlier setup [86]. Berkeley RDI reports that major agent benchmarks — including SWE-bench, WebArena, GAIA, and Terminal-Bench — can be exploited by attack agents that game the scorer rather than solve tasks, producing near-perfect scores without doing the work [87]. Independent and laboratory evaluations also diverge: Vals AI reports Claude Fable 5 at 95.00% under mini-SWE-agent while internal reports place it near 79.6% on similar internal harnesses, and some suites explicitly account for harness fallbacks in which a model rejects complex tasks and defers them to a different model in the routing layer [75][76][77]. None of this invalidates benchmarking. It means harness engineering now includes evaluation-harness engineering, and that benchmarking a standalone model on an agentic task is inherently flawed — evaluators must report the specific model-harness pair.
  Press enter or click to view image in full size 12. Model-Harness Co-Design and Trajectory
  The near-term direction is co-design followed by selective thinning, and three labs articulate it from three different products. Cognition’s SWE-1.5 work argues the entire stack — model, inference, and harness — has to be reimagined as one system [88]. Anthropic’s managed-agents post says harness assumptions go stale as models improve, so stable interfaces should be designed to outlast any particular harness implementation [51]. OpenAI’s 2026 Codex writing says engineers are shifting from writing code to designing environments, specifying intent, and building the feedback loops that let agents do reliable work [89]. The relationship between model and harness is dynamic, and the optimal harness is moving in two directions at once.
  It is thinning in some places. Ad hoc summarization became first-class compaction. Free-form prompting became AGENTS.md, CLAUDE.md, skills, and scoped rules. Handcrafted per-task orchestration is giving way to standardized shells, apply_patch, MCP, durable session logs, and markdown state. The concrete examples are instructive: Sonnet-era context resets became useless on Opus 4.5, and the Responses API absorbed compaction into the platform [51][2]. This is the bitter lesson applied to scaffolding — abstractions that expose broad action spaces and cheap feedback survive longer than brittle handcrafted control logic, and complex multi-agent debate structures and rigid planning chains that were mandatory for earlier generations are now actively detrimental to frontier models, which perform best given simple tools and minimal interference [96][12]. The endpoint of this trend is visible in models like Cursor's Composer, where reinforcement learning internalizes agentic behavior directly into the weights, so the harness no longer needs to heavily constrain the action space when the model natively predicts optimal multi-file edits and tool sequences [72][93].
  It is thickening in other places. Permissions, cost control, environment reconstruction, session durability, traceability, and benchmark integrity remain external to the model and unlikely to disappear. Cursor’s claim that the full development environment is the single biggest quality factor for cloud agents matters most here — the same model in the wrong VM, with missing dependencies or no verifier access, behaves like a weaker system [59]. Anthropic and OpenAI now treat sandboxes and sessions as first-class control-plane objects, and Symphony extends the trend upward by turning issue trackers into orchestrators for always-on coding agents, which raised landed pull requests on some OpenAI teams by 500% [90]. Multi-agent systems will consolidate around a narrower set of patterns, and the winning architecture over the next year is likely to be one authoritative writer loop, many bounded specialists, deterministic verifiers, file-backed state, stable session logs, and a permissioned execution substrate [47][46][48].
  Two structural forces frame the longer arc. Execution sandboxing is commoditizing as native API-level integrations between model providers and secure micro-VM hosts make custom execution planes unnecessary, which shifts competitive advantage away from the infrastructure of the loop and toward proprietary context, specialized tools, and domain-specific verification logic plugged into a standardized harness [61]. And the field still lacks a widely adopted public benchmark that varies harnesses under common conditions while covering live external state, strong safety boundaries, and long-horizon persistence all at once. Harness-Bench is the clearest recent attempt to make the harness itself measurable, and its central recommendation is the right one: report model-harness configurations, not model names alone [1]. The trajectory of the discipline points beyond manual tuning toward the automated design of agentic systems, where meta-agents search the architectural space to generate task-specific harnesses dynamically [5].
  The next phase of agent engineering will therefore look less like prompt craft and more like systems engineering of a control plane. Devin building Devin, Codex running for 25 hours on durable markdown, sixteen Claudes sharing a C compiler behind git locks — these are not demos of model intelligence so much as demonstrations of harness discipline [91][92][14][48]. The model supplies the intelligence. The harness shapes that intelligence into reliable work, and increasingly it is the harness, not the model, that separates a working agent from an impressive one.
