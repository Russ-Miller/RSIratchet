  The harness, not the raw prompt, is usually the primary driver of operational cost. In a multi-step session the conversation history grows linearly while token processing cost grows quadratically, so where the harness puts its tokens matters more than how clever any single prompt is. Codex states that model sampling dominates cost and names the exact triggers for prompt-cache misses: changing tool order, model, sandbox configuration, approval mode, or working directory mid-run [2]. Anthropic’s MCP code-execution argument is the structural complement — direct tool calls burn context on every definition and result, while code execution keeps intermediate results inside the tool environment [31].
  Prompt caching is the lever that changes the economics of the loop. Providers store the pre-computed state of processed prompt prefixes, so if a harness keeps its system prompt, tool schemas, and core instructions perfectly static at the top of the context window, the API retrieves that state at a fraction of the cost [70]. The quantitative anchors come from two directions and should be read as a range rather than a single number. OpenAI’s guidance reports that prompt caching can cut time-to-first-token latency by up to 80% and input token cost by up to 90%, with the entire repeated prefix — tools and schemas included — cacheable [67]. Independent evaluation of long-horizon agentic workloads reports production harnesses achieving up to 80% token-cost reduction and roughly 30% latency reduction [70][71]. The pricing magnitude is concrete on OpenAI’s own pricing page: GPT-5.5 standard input runs $5.00 per 1M tokens versus $0.50 cached, and GPT-5.3-Codex runs $1.75 input versus $0.175 cached [69]. The corollary is a hard rule of harness hygiene — dynamically injecting timestamps or rotating session IDs into the system prompt breaks exact-prefix matching and silently escalates cost [68].
  Per-step model routing is the next cost-quality frontier, though public practice still trails the idea. The stable pattern is cheap models or rule-based checks for gating and retrieval, stronger models for planning and verification, and external tools for deterministic operations [94]. Cursor’s safety classifier is already a per-step routed reviewer sitting directly in the action path, Anthropic’s auto mode uses a similar classifier for permissions, and Codex subagents are explicit but spawn only when asked [58][56][2]. The control question is no longer whether to route; it is where to route without destroying cache locality and trace comprehensibility. The most advanced version of treating the prompt as managed application state comes from Cursor, which pioneered dynamic prompt rendering via a JSX-based compilation design: every element in the context is assigned a priority score, and when the total exceeds the token limit a binary-search algorithm evicts the lowest-priority elements so the model never crashes on overflow [72][73][74].
