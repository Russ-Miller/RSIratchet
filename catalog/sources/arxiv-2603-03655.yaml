brief: >-
  Constraining a drug discovery agent to pre-written workflow graphs, rather
  than letting it plan freely, yields small accuracy gains and avoids some
  failure modes, but absolute performance on expert tasks stays near 20%.


  Mozi splits the agent into a supervisor-worker control plane with role-based
  tool filtering and a LangGraph workflow plane encoding target identification
  through lead optimization as stateful skill graphs with human-in-the-loop
  gates. Evaluation is on PharmaBench, 88 tasks built from TDC, an HLE drug
  discovery subset, and auxiliary sources, plus 3 end-to-end case studies.


  With Qwen3-235B, Mozi reaches 33/54 classification accuracy against Biomni's
  20/54, 6/26 MCQ against 4/26, and SMAPE 1.169 against 1.599 on 8 regression
  tasks. On 28 HLE tasks, Mozi scores 21.42% with Deepseek-V3.2, versus 17.86%
  for Biomni with Claude-4.5-Sonnet and 10.71% for Gemini-2.5-Pro with web
  search. Case studies ran on 4x NVIDIA A6000 48GB GPUs, screening 377,760
  compounds in 35 minutes for Parkinson's.


  The comparison is architecture-vs-architecture, not ablated: no run isolates
  governance from skill graphs from HITL, and the authors state the benchmark
  conflates model priors, tool robustness, and orchestration. Sample sizes are
  tiny (26, 54, 28 tasks), and case study outcomes are in silico proxies with
  docking and ipTM scores, no wet-lab validation. The authors report their own
  agents still hallucinate tool parameters and loop on failed calls.


  Treat this as an engineering report on containment of agent failures, not
  evidence that governance raises scientific capability.
