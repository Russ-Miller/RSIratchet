summary: "Despite rapid progress on AI benchmarks, the real-world meaning of
  benchmark performance remains unclear. To quantify the capabilities of AI
  systems in terms of human capabilities, we propose a new metric:
  50%-task-completion time horizon. This is the time humans typically take to
  complete tasks that AI models can complete with 50% success rate. We first
  timed humans with relevant domain expertise on a combination of RE-Bench,
  HCAST, and 66 novel shorter tasks. On these tasks, current frontier AI
  models such as Claude 3.7 Sonnet have a 50% time horizon of around 50
  minutes. Furthermore, frontier AI time horizon has been doubling
  approximately every seven months since 2019, though the trend may have
  accelerated in 2024. The increase in AI models&#39; time horizons seems to
  be primarily driven by greater reliability and ability to adapt to mistakes,
  combined with better logical reasoning a…"
