brief: >-
  The length of software task an AI agent can finish at 50% reliability has
  doubled roughly every 7 months since 2019, giving a single scale on which
  GPT-2 and o3 can be compared. METR timed skilled human baseliners on 170
  tasks spanning 1 second to 30 hours, combining HCAST (97 tasks), RE-Bench (7
  eight-hour ML research tasks), and 66 new single-step Software Atomic
  Actions, then ran 12 frontier models with 8 attempts per agent/task pair and
  fit a logistic curve to recover the 50% success duration.


  GPT-2 sits at 2 seconds, o3 at about 110 minutes, with a doubling time of
  207 days (95% CI 166-240 days). The 80% time horizon follows a similar slope
  (204 days) but sits 4-6x shorter, so moderate-length tasks are not reliably
  completed. o3 lies above the long-run line (p = 0.006).


  Errors come from a 3-level hierarchical bootstrap over families, tasks and
  runs, plus sensitivity checks over weighting and regularization; the slope
  is better identified than any single model's horizon. Replication on
  SWE-bench Verified holds the exponential but at ~70 days, which the authors
  attribute to annotator time estimates.


  Scope: software and ML research only, automatically scored tasks, and
  performance drops on higher-"messiness" tasks. Internal PR tests show
  contractors take 5-18x longer than maintainers, so horizon depends heavily
  on which humans you compare against.


  Treat time horizon as a comparable capability axis, but not yet as a
  real-world job-automation forecast.
