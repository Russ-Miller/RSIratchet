brief: >-
  Fine-tuning vision-language models on driving data buys in-domain QA gains
  while stripping out the ability to notice rare objects in the scene, and
  parameter-efficient tuning does not escape the trade-off either. Fidelity
  Driving Bench measures this: 180K scenes and 900K QA pairs consolidated from
  15 sources, with a 1,000-image long-tail test set mined by IDF rarity
  scoring and manually verified, scored by LLM judges on scene description,
  Traffic-QA, and a Noteworthy Objects' Perception Recall that feeds a
  Knowledge Retention Rate.


  Published driving VLMs retain 30%-74% of base-model object perception;
  RecogDrive-8B reaches 74% KRR, WiseAD 30%. LoRA retains more than full
  tuning but degrades long-tail perception anyway, e.g. InternVL3-2B NoPR
  falls 50.8 to 30.8. The proposed Driving Expert Adapter, which routes
  frozen-backbone LoRA experts and learnable prompts, reaches 79.0% KRR on
  Qwen2.5VL-3B versus 68.4% for ImpromptuVLA-3B and 64.3% for full tuning,
  with T-QA 41.0 vs 28.7 base.


  Measured, with a component ablation (TAEM alone 74.4%, plus prompt adapter
  79.0%) and a judge-swap check across Qwen3-Max, Gemini-2.5-Pro and GPT-5
  that preserves rankings. The main DEA results come from 1 backbone, the test
  set was annotated by Qwen3VL-235B and scored mainly by a Qwen judge, and no
  closed-loop driving or planning outcome is evaluated.


  If you fine-tune VLMs for a narrow domain, measure retention on held-out
  rare cases, not just in-domain accuracy.
