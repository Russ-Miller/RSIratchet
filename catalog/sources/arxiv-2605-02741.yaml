brief: "Stronger coding models write more bloated code, not cleaner code, and
  detailed prompting does not fix it. On 90 randomly sampled CodeContest
  problems, solutions from Gemini 2.5 Pro, Llama 3.3 70b, deepseek-coder-v2
  16b, and Qwen3-Coder 30b/480b were scanned with the PyExamine static
  analyzer and compared to 1 randomly sampled human submission per problem.
  Qwen-Coder-480b produced 11 Long Method instances zero-shot against 1 for
  the human baseline; the human baseline alone showed Temporal Field smells (4
  instances), absent in all model output. Few-shot prompts with coding
  standards and boilerplate made it worse: Long Method rose from 11 to 13 for
  Qwen-480b and 5 to 8 for Gemini. In a second experiment, MetaGPT (Qwen-Coder
  480B) built repositories for 5 application scenarios across 4 escalating
  requirement stages. Defects shifted to Too Many Branches, High Response for
  a Class, Scattered Functionality, and Unstable Dependency. Total lines of
  code correlated with architectural smells at ρ = 0.94, p < 0.001;
  requirement specificity had no effect (p > 0.8). Evidence is measured but
  thin: raw counts, not densities, 1 human submission per problem, no
  iterative debug loop, 1 agent framework, 20 repositories, and the authors
  themselves flag Feature Envy and Potential Shotgun Surgery as false
  positives in algorithmic code. Treat maintainability as a separate axis from
  pass rates when evaluating code agents."
