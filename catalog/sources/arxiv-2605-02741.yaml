brief: >-
  Stronger code models write structurally worse code, not better: capability
  tracks method bloat rather than hygiene, and detailed prompting does not fix
  it.


  Two experiments. First, 90 randomly sampled CodeContest problems solved by
  deepseek-coder-v2 (16b), Llama3 (70b), Qwen Coder (30b and 480b), and Gemini
  2.5 Pro under zero-shot and few-shot prompts, with 1 verified human
  submission per problem as control, all scanned by the PyExamine static
  analyzer. Second, MetaGPT (Qwen-Coder 480B backend) building full
  repositories across 5 application scenarios, each with 4 stages of
  increasing requirement specificity.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for
  humans; few-shot raised it to 13, and Gemini went from 5 to 8. Humans
  instead showed 4 Temporal Field smells, absent from all LLM output. In the
  agent setting, defects shifted to Too Many Branches, High Response for a
  Class, and Unstable Dependency. Total lines of code correlated with
  architectural smells at ρ = 0.94, p < 0.001; requirement stage had no
  effect, p > 0.8.


  The smell counts are measured, but the samples are tiny, raw counts are not
  normalized per solution in Experiment I, and the authors concede Feature
  Envy and Potential Shotgun Surgery are false-positive prone here. Experiment
  I had no iterative debug loop; Experiment II used 1 agent framework and 1
  backing model, so claims about agentic decay generalize only to the MetaGPT
  paradigm.


  Treat correctness benchmarks as silent on maintainability, and do not expect
  prompt detail to buy architecture.
