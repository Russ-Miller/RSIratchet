brief: >-
  Stronger coding models write more bloated code, not cleaner code, and
  detailed prompting does not fix it. The defect signature of LLM output also
  differs in kind from human output rather than being smaller.


  Two experiments. First, 90 problems randomly sampled from CodeContest solved
  in Python by deepseek-coder-v2(16b), Llama3 (70b), Qwen Coder(30b), Qwen
  Coder(480b) and Gemini-2.5-pro under Zero-Shot and Few-Shot prompts, with 1
  randomly sampled human submission per problem as control, all scanned by
  PyExamine. Second, MetaGPT (backed by Qwen-Coder 480B) built full
  repositories for 5 scenarios across 4 incrementally specified stages.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for the
  human baseline; humans alone showed Temporal Field (4 instances). Few-shot
  prompting raised Long Method to 13 for Qwen-480b and from 5 to 8 for
  Gemini-2.5-pro. In the repository experiment, Total Lines of Code correlated
  with architectural smells at rho = 0.94, p < 0.001, files at rho = 0.72, p <
  0.001, while prompt stage had no effect (p > 0.8).


  Measured, not argued, but counts are small and unnormalised, Feature Envy
  and Potential Shotgun Surgery were discarded as false-positive-prone, 1
  agent framework was tested, and Experiment I had no debugging loop, so
  self-correction is untested.


  Treat code volume, not model capability, as your maintainability risk
  signal.
