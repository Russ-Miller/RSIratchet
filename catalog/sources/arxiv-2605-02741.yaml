brief: >-
  More capable code models write worse-structured code, not better. Stronger
  models pack more procedural logic into single blocks, and detailed prompting
  does not fix it.


  Two experiments with PyExamine static analysis: 90 randomly sampled
  CodeContest problems solved zero-shot and few-shot by
  deepseek-coder-v2(16b), Llama3(70b), Qwen Coder 30b and 480b, and
  Gemini-2.5-pro, against 1 randomly sampled verified human submission per
  problem; then 5 application scenarios x 4 escalating prompt stages generated
  as full repositories by MetaGPT running Qwen-Coder 480B.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for the
  human baseline; few-shot prompting raised it to 13, and Gemini-2.5-pro from
  5 to 8. Temporal Field appeared only in human code (4 instances). In the
  repository setting the profile shifted to Too Many Branches, High Response
  for a Class, Potential Improper API Usage, Scattered Functionality and
  Unstable Dependency. Total lines of code correlated with architectural
  smells at ρ=0.94 (p<0.001); prompt stage had no effect (p>0.8).


  The trends are measured, but Experiment II rests on 20 repositories from 1
  framework and 1 model, with correlational statistics and no matched-volume
  comparison, so volume and decay are not disentangled. The authors also
  report false positives for Feature Envy and Potential Shotgun Surgery, and
  ran no iterative debug loop.


  Treat maintainability as an unmet axis: correctness benchmarks tell you
  nothing about it, and prompts will not buy it.
