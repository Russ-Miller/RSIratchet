brief: >-
  Stronger code models write worse-structured code, not better: capability
  gains show up as method bloat, and more detailed prompts do not fix it.


  Two experiments, both scored with the static analyzer PyExamine. Experiment
  I: 90 randomly sampled CodeContest problems solved zero-shot and few-shot by
  deepseek-coder-v2 (16b), Llama3 (70b), Qwen Coder (30b and 480b), and Gemini
  2.5 Pro, against a human baseline of 1 verified submission per problem.
  Experiment II: MetaGPT with Qwen-Coder 480B generating full repositories
  across 5 scenarios, each with 4 prompts of increasing specificity.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for the
  human baseline; few-shot prompting raised it to 13, and Gemini from 5 to 8.
  Humans alone showed Temporal Field smells (4 instances). In repositories,
  defects shifted to Too Many Branches, High Response for a Class, and
  Scattered Functionality. Total lines of code correlated with architectural
  smells at ρ = 0.94 (p < 0.001); requirement specificity had no effect (p >
  0.8).


  Measured, not argued, but counts are small and absolute, FE and PSS were
  discarded as false positives after manual audit, and the architecture half
  rests on 1 framework, 1 model, and 20 repositories. No iterative debug loop,
  so this is first-pass output only.


  If you use smell counts as a quality proxy, expect volume, not prompt
  quality, to drive them.
