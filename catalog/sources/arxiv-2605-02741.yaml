brief: >-
  More capable code models write worse-structured code, not better, and
  prompting does not fix it. Across 90 CodeContest problems solved by
  deepseek-coder-v2 (16b), Llama3 (70b), Qwen Coder (30b and 480b) and Gemini
  2.5 Pro, and 20 full repositories generated by MetaGPT (5 application
  scenarios x 4 escalating requirement stages, Qwen-Coder 480B backend),
  static analysis with PyExamine was used to count code, structural and
  architectural smells.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot against 1 for
  the human baseline; few-shot prompting with explicit coding standards raised
  it to 13, and Gemini from 5 to 8. Humans instead showed 4 Temporal Field
  instances, absent from all LLM output. In the MetaGPT repositories, Total
  Lines of Code correlated with architectural smells at rho=0.94 (p<0.001),
  with structural smells at 0.59 (p=0.007) and code smells at 0.53 (p=0.017);
  requirement specificity (Stage) had no effect (p>0.8).


  This is correlational. No matched-budget baseline, no iterative debug loop,
  1 agent framework, 1 static analysis tool, and the authors themselves flag
  Feature Envy and Potential Shotgun Surgery as unreliable here. Sample sizes
  are small enough that non-parametric tests were required.


  If you evaluate agent output on pass rates alone, you are missing a
  volume-driven decay that better prompts do not touch.
