brief: >-
  Stronger coding models write longer, more bloated methods, not cleaner ones,
  and detailed prompting does not fix it. Code volume, not requirement
  specificity, predicts architectural decay in agent-built systems.


  Two experiments. First, 90 randomly sampled CodeContest problems solved by
  deepseek-coder-v2(16b), Llama3(70b), Qwen Coder(30b), Qwen Coder(480b) and
  Gemini-2.5-pro under zero-shot and few-shot prompts, with 1 human submission
  per problem as control, all scanned by PyExamine. Second, MetaGPT (backed by
  Qwen-Coder 480B) generating full repositories for 5 application scenarios
  across 4 incremental requirement stages.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for the
  human baseline; few-shot raised it to 13, and Gemini from 5 to 8. Humans
  alone showed Temporal Field smells (4 instances). In the repository
  experiment, Total Lines of Code correlated with architectural smells at ρ =
  0.94, p < 0.001, file count at ρ = 0.72, while requirement stage had no
  effect (p > 0.8).


  The smell counts are measured, but the correlations rest on 20 generated
  repositories from 1 framework, and the authors note PyExamine false
  positives for Feature Envy and Potential Shotgun Surgery, which they
  exclude. No iterative debug loop, so these are first-pass habits only;
  Experiment II is MetaGPT-specific.


  Treat maintainability as a separate axis from pass rates when evaluating
  coding agents.
