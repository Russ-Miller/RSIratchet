brief: >-
  Stronger coding models write structurally worse code, not better. On 90
  problems sampled from CodeContest, Qwen-Coder-480b produced 11 Long Method
  smells zero-shot against 1 for a human baseline submission per problem,
  while Llama3 70b produced 0 — smaller models often fail before writing
  enough code to trip length thresholds. Humans instead showed the
  state-encapsulation smell Temporal Field (4 instances), absent from all LLM
  output.


  Structured few-shot prompting with coding standards and boilerplate did not
  help: Long Method rose from 11 to 13 for Qwen-Coder-480b and 5 to 8 for
  Gemini-2.5-pro. In the second experiment, MetaGPT built 5 applications
  across 4 incremental requirement stages each, using Qwen-Coder 480B. Total
  lines of code correlated with architectural smells at ρ = 0.94 (p < 0.001),
  file count at ρ = 0.72, while requirement specificity (Stage) had no effect
  (p > 0.8). Dominant smells shifted to Too Many Branches, High Response for a
  Class, Scattered Functionality and Unstable Dependency.


  Smells were measured by one static tool, PyExamine; the authors audited and
  discarded Feature Envy and Potential Shotgun Surgery as
  false-positive-prone. Experiment II is 25 repositories from 1 framework, 1
  model, with no iterative debug loop and no human-built comparison. Treat
  correctness benchmarks as silent about maintainability.
