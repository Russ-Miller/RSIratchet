brief: >-
  Stronger coding models write structurally worse code, not better. On 90
  problems sampled from CodeContest, Qwen-Coder-480b produced 11 Long Method
  smells in the zero-shot setting versus 1 for a randomly sampled human
  submission per problem, and humans were the only authors of Temporal Field
  smells (4 instances), suggesting LLMs encapsulate state but fail to
  decompose procedures.


  Adding a structured few-shot prompt with coding standards and boilerplate
  made this worse: Long Method rose from 11 to 13 for Qwen-Coder-480b and from
  5 to 8 for Gemini-2.5-pro. In a second experiment, MetaGPT (backed by
  Qwen-Coder 480B) built 5 applications across 4 incremental requirement
  stages each; the dominant smells shifted to Too Many Branches, High Response
  for a Class, Potential Improper API Usage, Scattered Functionality and
  Unstable Dependency. Total lines of code correlated with architectural
  smells at ρ = 0.94, p < 0.001, while requirement specificity (Stage) had no
  effect (p > 0.8).


  Detection is entirely by one static tool, PyExamine, and the authors
  themselves found systematic false positives for Feature Envy and Potential
  Shotgun Surgery and excluded them. Experiment I ran with no iterative debug
  loop; Experiment II used 1 agent framework and 20 generated repositories, so
  the correlations rest on a small sample.


  Treat correctness benchmarks as silent on maintainability, and don't expect
  prompt detail to fix it.
