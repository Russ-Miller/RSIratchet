brief: >-
  Stronger coding models write structurally worse code, not better: capability
  correlates with method bloat, and more detailed prompts do not fix it.


  Two experiments. First, 5 models (Gemini 2.5 Pro, Llama 3.3 70b,
  deepseek-coder-v2 16b, qwen3-coder 30b and 480b) solved 90 randomly sampled
  CodeContest problems under Zero-Shot and Few-Shot prompts, with 1 verified
  human submission per problem as control; PyExamine detected smells. Second,
  MetaGPT (Qwen-Coder 480B) generated full repositories for 5 application
  scenarios across 4 incrementally more specific prompt stages.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for the
  human baseline; few-shot prompting raised it to 13, and Gemini from 5 to 8.
  Humans alone showed Temporal Field smells (4 instances). In the repository
  setting, defects shifted to Too Many Branches, High Response for a Class,
  Potential Improper API Usage, Scattered Functionality and Unstable
  Dependency. Total lines of code correlated with architectural smells at
  rho=0.94 (p<0.001); prompt stage had no effect (p>0.8).


  Effects are measured, but with small samples, no iterative debug loop, and 1
  agent framework. The authors also audited the tool and discarded Feature
  Envy and Potential Shotgun Surgery as false-positive prone; raw counts are
  not normalized per solution.


  Treat correctness benchmarks as silent on maintainability when choosing a
  code agent.
