brief: >-
  Stronger coding models write more bloated code, not cleaner code, and better
  prompting does not fix it. Across 90 randomly sampled CodeContest problems,
  5 models (Gemini 2.5 Pro, Llama 3.3 70b, deepseek-coder-v2 16b, qwen3-coder
  30b and 480b) were prompted zero-shot and few-shot, and their Python output
  was scanned with the PyExamine static analyzer against a human submission
  control.


  Qwen-Coder-480b produced 11 Long Method instances zero-shot versus 1 for the
  human baseline; few-shot prompting raised it to 13, and Gemini from 5 to 8.
  Humans instead showed 4 Temporal Field smells, absent from all LLM output.
  In the second experiment, MetaGPT (Qwen-Coder 480B) built repositories for 5
  scenarios across 4 escalating requirement stages; defects shifted to Too
  Many Branches, High Response for a Class, Scattered Functionality and
  Unstable Dependency. Total lines of code correlated with architectural
  smells at ρ=0.94 (p<0.001), file count at ρ=0.72 (p<0.001), while prompt
  stage had no effect (p>0.8).


  All effects are measured, but the second experiment rests on 1 framework and
  20 generated projects, with no iterative debug loop and no human-written
  system baseline. The authors also found Feature Envy and Potential Shotgun
  Surgery detections unreliable on algorithmic code and excluded them.


  Treat correctness benchmarks as silent on maintainability.
