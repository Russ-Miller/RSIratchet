brief: >-
  Mixing embodied trajectories, driving logs and web data from the first
  pretraining stage, rather than fine-tuning an internet-pretrained VLM
  afterwards, yields a 2B robot policy that beats 3B-5B baselines on
  real-world tabletop manipulation.


  DM0 pairs a Qwen3-1.7B VLM plus perception encoder with a flow-matching
  action expert, trained in 3 stages (1.2T tokens pretraining in 370K steps,
  then 200M mid-training samples, 50M post-training samples). Action-expert
  gradients are blocked from the VLM on embodied data; an Embodied Spatial
  Scaffolding objective adds subtask, goal box, end-effector trajectory and
  discrete action prediction as a spatial chain of thought. Evaluation is the
  real-world RoboChallenge Table30 suite across UR5, Franka, ARX5 and ALOHA.


  DM0-Specialist reaches 62.00% average success versus 51.67 for
  GigaBrain-0.1, 51.00 for Spirit-v1.5 and 42.67 for pi 0.5. DM0-Generalist
  reaches 37.3/49.08 success/score against 17.67/31.27 for pi 0.5-generalist
  and 9.0/20.22 for pi 0-generalist.


  The comparison is to published baselines on a shared benchmark, but there is
  no ablation isolating the embodied-native pretraining, the hybrid gradient
  strategy or the scaffolding, and no matched data or compute baseline.
  Multimodal retention is shown only as qualitative VQA transcripts, not
  benchmark scores.


  Several tasks still score 0 for every model, including wipe the table and
  make vegetarian sandwich. Treat this as evidence that data mixture at
  pretraining matters for control, not yet as evidence for which component
  does the work.
