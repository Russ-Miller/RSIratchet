summary: Building generalist embodied agents capable of solving complex
  real-world tasks remains a fundamental challenge in AI. Multimodal Large
  Language Models (MLLMs) have significantly advanced the reasoning
  capabilities of such agents through strong vision-language knowledge and
  chain-of-thought (CoT) reasoning, yet remain brittle when faced with
  challenging out-of-distribution scenarios. To address this, we propose
  Verifier-Guided Action Selection (VegAS), a test-time framework designed to
  improve the robustness of MLLM-based embodied agents through an explicit
  verification step. At inference time
