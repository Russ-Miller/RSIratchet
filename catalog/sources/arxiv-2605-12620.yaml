brief: >-
  Best-of-N action selection only helps embodied agents if the verifier is
  trained on synthetic failures; an off-the-shelf MLLM used as a verifier
  gives no gain at all.


  VeGAS samples N candidate high-level actions with chain-of-thought
  rationales from a Qwen2.5-VL-3B-Instruct policy, scores each with a
  generative verifier (same base model, finetuned), and executes the
  top-scoring one. Verifier training data comes from prompting o3 to corrupt
  successful trajectories into realistic failures (wrong object, wrong
  receptacle, precondition violation) with per-action verdicts. Benchmarks:
  LangR in Habitat 2.0 (8 tasks, 100 instructions each) and EB-ALFRED (6
  tasks, 50 instructions each).


  On LangR, CoT policy scores 65%, zero-shot verifier 64%, finetuned verifier
  71%; Multiple Objects gains roughly 36% relative. On EB-ALFRED, 44% → 44%
  (zero-shot) → 49%. The 3B verifier lifts Qwen-2.5-VL-72B from 30% to 38% and
  InternVL-3.5-38B from 24% to 35%.


  The zero-shot-verifier arm isolates the training pipeline as the cause, and
  self-consistency is compared at matched LLM calls, with VeGAS scaling
  better. Replication spans 2 model families (Gemma-3-4B shows the same
  pattern: 48% → 51%) and 3 runs per verifier config.


  Limits: candidate coverage is judged by o3, not ground truth; spatial tasks
  regress for Gemma (28% → 25%); removing image input changes nothing (71% vs
  71%), so the verifier may be reading the CoT, not the scene. Treat verifier
  finetuning, not sampling, as the lever.
