brief: >-
  Refusal in instruction-tuned models sits on a small number of
  residual-stream directions, and which direction actually carries refusal
  differs by model, so variance dominance does not predict behavioral
  importance. Skin-Deep measures this geometry on the unmodified checkpoint,
  using contrastive PCA between aligned and version-matched base models on 500
  harmful and 500 benign length-matched prompts, and summarizes it in a
  Geometric Fragility Score.


  The pool is 21 instruction-tuned models at 3B–32B, split into overlapping
  cohorts: 4 core models, 16 for raw-prompt ranking, 8 for chat-template
  extraction, 6 for ablation, and a LoRA set.


  Held-out cPCA separation is strong for the core models (Cohen's d 2.71–3.23,
  probe accuracy 0.904–0.959), with a minimum held-out effect of 1.69 across
  the 14-model split-sample check. Ablating a direction at the peak layer
  lowers refusal in 4 of 6 models, with the effective direction varying:
  PCA-PC1 for Llama (0.14 to 0.02), Arditi for Qwen (0.86 to 0.68) and SOLAR
  (0.22 to 0.06); random directions barely move rates.


  Ablation effects are isolated by random-direction and non-leading-PCA
  controls and Wilson 95% intervals; cross-model CKA has a prompt-shuffle
  null. The predictive claim is weak: 1 model (Gemma) among initially safe
  LoRA cases has both the lowest score and the lowest endpoint compliance
  (mean 0.68), with multi-seed runs only for some entries. No calibrated
  forecast, English only, no MoE or larger models.


  Treat GFS as a hypothesis about pre-update screening, not a working
  predictor.
