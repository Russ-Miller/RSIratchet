summary: >-
  Alignment tuning is meant to make harmful-request refusal robust, yet this
  safety behavior can be erased by a small set of benign fine-tuning
  examples. This is a deployment risk for open-weight models because a
  checkpoint can pass refusal tests at release time and later lose refusal
  under low-cost downstream fine-tuning. Prior work has established these
  refusal failures, but existing studies do not show how to detect this
  fragility in the aligned model itself before an attack or fine-tuning
  intervention is run. We introduce Skin-Deep, a geometric diagnostic that
  detects alignment fragility dir
