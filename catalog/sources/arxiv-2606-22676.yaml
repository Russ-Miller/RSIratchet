brief: >-
  Refusal in aligned models sits on a small set of residual-stream directions
  that differ by model, and a purely geometric reading of an unmodified
  checkpoint tracks, weakly, how it behaves after benign fine-tuning.
  Skin-Deep contrasts aligned and version-matched base activations with
  contrastive PCA, ablates candidate directions, and aggregates layer-wise
  separation, depth, and angle from the Arditi refusal direction into a
  Geometric Fragility Score.


  The pool is 21 instruction-tuned models at 3B–32B, split into overlapping
  cohorts, with 500 harmful and 500 benign length-matched prompts drawn from
  AdvBench, HarmBench, BeaverTails, Alpaca and OASST.


  Held-out cPCA separation runs 2.71–3.23 Cohen's d on the 4 core models with
  probe accuracy 0.904–0.959; the minimum across a 14-model check is 1.69.
  Ablation lowered refusal in 4 of 6 models, but via different directions:
  PCA-PC1 for Llama (0.14 to 0.02), Arditi for Qwen (0.86 to 0.68) and SOLAR
  (0.22 to 0.06), while random directions stayed near baseline. After benign
  LoRA on 200 Alpaca examples, only Gemma-2-9B stayed below full compliance
  (mean 0.68, range 0.48–0.80), and it was also the lowest-scoring initially
  safe model.


  The direction effects are measured with random and non-leading-PCA controls
  and Wilson intervals, so specificity is isolated. The score-to-behavior link
  is not: 1 endpoint, 1 fine-tuning protocol, and a single model
  distinguishing itself among a few checkpoints. Treat GFS as a hypothesis,
  not a predictor.
