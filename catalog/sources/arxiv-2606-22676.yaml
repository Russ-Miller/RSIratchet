brief: >-
  Refusal in instruction-tuned models sits on a low-rank set of
  residual-stream directions, and which direction actually carries refusal
  differs per model, so variance dominance does not predict behavioral
  importance. Skin-Deep measures this geometry on the unmodified checkpoint
  and summarizes it in a Geometric Fragility Score (GFS).


  The method contrasts aligned and version-matched base activations via
  contrastive PCA on 500 harmful requests (AdvBench, HarmBench, BeaverTails)
  and 500 length-matched benign instructions (Alpaca, OASST), across 21
  instruction-tuned models at 3B-32B in 5 overlapping cohorts.


  Split-sample cPCA directions separate held-out prompts (Cohen's d 3.23
  Llama-3.1-8B, 2.97 Qwen-2.5-7B, 2.71 Mistral-7B-v0.3, 2.88 Gemma-2-9B;
  minimum 1.69 across a 14-model check). Ablating a direction cut refusal in 4
  of 6 models, with the effective direction varying: PCA-PC1 for Llama (0.14
  to 0.02), Arditi for Qwen (0.86 to 0.68) and SOLAR (0.22 to 0.06); random
  directions moved rates little. After benign LoRA on 200 Alpaca examples, all
  models but Gemma reached full harmful compliance; Gemma, the lowest-GFS
  initially safe model, averaged 0.68 (sd 0.17, range 0.48-0.80).


  Evidence is measured with random-direction and non-leading-PCA controls,
  Wilson intervals, prompt-shuffle CKA nulls and weighting ablations. The
  predictive claim rests on 1 model being distinguishable in a small
  heterogeneous LoRA cohort, 1 harmless-data protocol, English only, no
  calibration across attacks.


  Treat GFS as a hypothesis-generating pre-fine-tuning signal, not a forecast.
