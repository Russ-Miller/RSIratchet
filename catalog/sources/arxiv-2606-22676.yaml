brief: >-
  Refusal in aligned chat models sits on a small number of residual-stream
  directions, but which direction actually carries the behavior differs per
  model, so variance dominance is a poor guide to what to ablate.


  Skin-Deep compares aligned and version-matched base checkpoints with
  contrastive PCA on 500 harmful requests (AdvBench, HarmBench, BeaverTails)
  and 500 length-matched benign instructions (Alpaca, OASST), across 21
  instruction-tuned models at 3B-32B, then summarizes the layer profile as a
  Geometric Fragility Score.


  Held-out cPCA separation is large for the core 4 models (Cohen's d
  2.71-3.23, probe accuracy 0.904-0.959), with a minimum held-out effect of
  1.69 across a 14-model check. Ablation lowered refusal in 4 of 6 models,
  with different effective directions: PCA-PC1 took Llama from 0.14 to 0.02,
  the Arditi direction took Qwen 0.86 to 0.68 and SOLAR 0.22 to 0.06, while
  random directions stayed near baseline.


  Evidence is mixed in strength. Separation is well controlled (split-sample
  fits, PERMANOVA with 1000 permutations, prompt-shuffle CKA null,
  random-direction and non-leading-PCA controls). The headline fragility claim
  is much thinner: among initially safe models, only Gemma stayed below full
  harmful compliance at n=200 benign LoRA examples (mean 0.68, range
  0.48-0.80), and it was also lowest-scoring, which is a single endpoint
  association in a small heterogeneous cohort.


  English only, open weights, no MoE, 1 harmless-data protocol, and the score
  is not a calibrated forecast. Treat GFS as a hypothesis worth testing, not a
  screening tool.
