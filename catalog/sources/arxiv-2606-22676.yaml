brief: >-
  Refusal in aligned models sits on a low-rank set of residual-stream
  directions, and you can measure that geometry before touching the weights --
  but the measurement buys only a weak behavioral prediction. Skin-Deep
  contrasts aligned and version-matched base checkpoints on 500 harmful and
  500 benign length-matched prompts (AdvBench, HarmBench, BeaverTails vs
  Alpaca, OASST), fits contrastive PCA directions per layer, and aggregates
  separation, depth, and distance from the Arditi refusal direction into a
  Geometric Fragility Score. 21 instruction-tuned models, 3B-32B, in 5
  overlapping cohorts.


  Held-out cPCA separation is large for the core 4 models (Cohen's d
  2.71-3.23, probe accuracy 0.904-0.959), with a minimum of 1.69 across a
  14-model check. Ablating 1 direction cuts refusal in 4 of 6 models, but the
  effective direction differs: PCA-PC1 for Llama (0.14 to 0.02), Arditi for
  Qwen (0.86 to 0.68) and SOLAR (0.22 to 0.06). Random directions move
  nothing.


  Evidence is mixed in strength. Ablations have random-direction and
  non-leading-PCA controls plus Wilson intervals; cross-model CKA has a
  prompt-shuffle null. The headline fine-tuning claim rests on 1 model: among
  initially safe checkpoints, lowest-GFS Gemma-2-9B is the only one not at
  full compliance after benign LoRA at n=200 (mean 0.68, SD 0.17, range
  0.48-0.80). That is 1 data point, not a calibrated predictor.


  English only, open weights, no MoE, 1 harmless-data protocol. Treat GFS as a
  hypothesis about pre-update screening, not a working test.
