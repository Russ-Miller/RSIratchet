summary: "Reinforcement Learning with Verifiable Rewards (RLVR) has
  significantly advanced the reasoning capabilities of Large Language Models
  (LLMs) by optimizing them against factual outcomes. However, this paradigm
  falters in long-context scenarios, as its reliance on internal parametric
  knowledge is ill-suited for tasks requiring contextual grounding--the
  ability to find and reason over externally provided information. We identify
  a key reason for this failure: a reward based solely on the final answer is
  too sparse to effectively guide the model for identifying relevant evidence.
  We formally prove"
