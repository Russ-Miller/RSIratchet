brief: >-
  Defenses that score well on prompt-injection benchmarks often do so by
  refusing or isolating contextual input, which breaks agents on tasks where
  runtime observations are supposed to drive the next action. This SoK argues
  that limitation is structural across the field, not incidental.


  The authors reviewed 78 papers collected to Oct. 20, 2025 (37 attack, 41
  defense), taxonomised attacks by payload generation (heuristic vs
  optimization) and defenses by intervention stage (text, model, execution),
  then built AgentPI, a benchmark of 5 context-dependent task types with
  matched context-aware attacks (action switching, parameter manipulation,
  branch divergence, reasoning corruption, delegation exploitation), and
  evaluated 8 defenses on attack success rate, utility, time and tokens.


  Counts carry the argument: 34 out of 41 defenses support only static tasks,
  6 out of 41 intervene below segment granularity, 0 protect availability, and
  all 5 surveyed benchmarks use only direct tasks with template attacks.
  Execution-level defenses enforce action boundaries but cost up to 3x the
  baseline; text-level filters are cheap and weak.


  The taxonomy counts are literature coding, not measurement, and the
  8-defense evaluation is the authors' own benchmark with no independent
  replication; the text here gives no per-defense numbers. Treat the trilemma
  claim as a framing that reorganises what to measure, not as a settled
  ranking of defenses.
