brief: "Prompt injection defenses that score well on existing benchmarks often
  do so by suppressing or rejecting contextual input, which breaks agents on
  tasks where runtime observations legitimately determine the next action.
  This SoK categorizes 78 papers collected to Oct. 20, 2025: 37 attack papers
  by payload generation (23 out of 37 heuristic, 14 out of 37 optimization)
  and 41 defense papers by intervention stage (text, model, execution). It
  reports that 34 out of 41 defenses cannot support context-dependent tasks,
  17 out of 41 cover confidentiality, and none protect availability, while
  optimization-based attacks remain largely untested by defense evaluations.
  To close the gap the authors build AgentPI, 5 context-dependent task types
  paired with context-aware attacks spanning control flow, logic flow, and
  authority flow, and evaluate 8 defenses on attack success rate, utility,
  time, and tokens. The headline empirical claim is a trilemma: no tested
  defense achieves high trustworthiness, high utility, and low latency at
  once, with execution-level monitors costing up to 3x the baseline and
  text-level filters cheap but weak. Most quantitative support is
  paper-counting over a manually curated Google Scholar corpus; the AgentPI
  results are self-run, with per-defense numbers residing in figures not
  reproduced in the text, and no independent replication or exhaustive defense
  coverage. Treat it as a map of the field plus an evaluation-design argument,
  not as a defense leaderboard."
