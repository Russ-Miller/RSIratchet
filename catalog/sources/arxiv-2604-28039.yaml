brief: >-
  Frontier multimodal models top out around 0.79 accuracy on expert-written
  questions about scientific spectra, and most open models sit near or below
  0.56. SpecVQA covers 7 spectrum types (NMR, IR, XRD, Raman, MS, UV-Vis, XPS)
  with 620 figures and 3,100 QA pairs drawn from peer-reviewed literature,
  split into 2,080 descriptive (L0) and 1,020 reasoning (L1) items, each in
  Chinese and English, plus a second track asking models to reconstruct the
  dense numerical curve underlying a plot.


  Gemini-3-Flash-Preview leads at 0.7872 overall, ahead of
  Gemini-3-Pro-Preview (0.7787) and GPT-5 high (0.7059); Claude-4.5-Sonnet
  reaches 0.5941 and DeepSeek-VL2 0.3753. Reasoning questions score below
  descriptive ones for nearly every model. On curve reconstruction, scored by
  normalized Chamfer, Hausdorff and Wasserstein distances, a Qwen3-VL-4B
  fine-tuned with the authors' RDP-plus-uniform sampling and cubic-spline
  reconstruction reaches 0.9776/0.9595/0.9810 versus 0.4146/0.3827/0.4159
  without sampling, at 6.7 percentage of the original visual token length.


  The sampling ablation is matched on backbone and data volume, so the
  attribution is reasonably clean, but grading is done by GPT-o4-mini against
  reference answers with a 5-point tolerance, and the QA pairs themselves were
  distilled by GPT-o4-mini and Gemini-2.5-Pro before expert revision, which
  may favour those families. The fine-tuned model's QA scores do not appear in
  the leaderboard table. Treat this as evidence that spectral reading, not
  general chart reading, remains the bottleneck.
