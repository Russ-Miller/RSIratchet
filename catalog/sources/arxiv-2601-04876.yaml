brief: >-
  Audio language models lose most of their accuracy once audio runs past a few
  minutes, and the drop happens at the short-to-middle transition rather than
  gradually at the long end.


  ChronosAudio is a synthetic benchmark built by reading SQuAD text with the
  F5-TTS engine: 36,000 test instances from 6,000 clips, 237h total,
  stratified into short (30s~5min), middle (5min~10min), and long
  (10min~20min), across 6 tasks (Dictation, Localization, Transcription,
  Multi-Speaker, Comprehension, Summary). 16 models were scored via API with
  an ensemble LLM-as-a-judge, averaged over 5 rounds.


  Average performance falls from 21.30 to 3.37 short-to-long. Closed-source
  Transcription goes 42.66 to 15.64 to 3.86; open-source goes 28.06 to 9.49 to
  0.00. Localization is 0.00 for every model at middle and long. Summary
  separates the groups: 59.22 closed vs 14.14 open on long audio. Attention
  maps on 3 open models show the diagonal structure diffusing by the last
  segment. Fine-tuning with Sparse Attention lifts Qwen2.5-Omni-3B Dictation
  from 14.90 to 20.90 (93% of its 22.50 short baseline) but Transcription only
  to 25.20 against a 50.10 short peak.


  The degradation is measured; the attention-dilution explanation is visual
  and correlational, and closed models were not inspected. Audio is synthetic,
  clean, and English-only, so noise and cross-lingual behaviour are untested,
  as are training-based fixes.


  Treat current ALLM transcription and temporal grounding as unusable beyond
  roughly 5 minutes.
