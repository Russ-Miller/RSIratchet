brief: >-
  How facts are spread through a long context, not just how far in they sit,
  can break retrieval outright, and "don't make it up" prompts can make it
  worse. Both effects are model-specific rather than universal.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comedie Humaine (~2M tokens, chosen to block parametric leakage)
  and scores 30 questions per quiz with a GPT-5-mini judge at temperature=0.
  Protocol A sweeps context length and fact depth from 10% to 100% (200
  quizzes per model); Protocol B pins context at 100% capacity and disperses
  10 facts under 9 distributions (18 quizzes per model). Models:
  Gemini-2.5-flash, ChatGPT-5-mini, Claude-4.5-haiku, Deepseek-v3.2-chat.


  Gemini and Deepseek stay near-ceiling (98.4% and 99.4% aggregate literal
  extraction). Claude-4.5-haiku drops to 58.5% aggregate logical inference and
  48.0% at capacity. ChatGPT-5-mini's anti-hallucination prompt cuts
  extraction at capacity from 89.0% to 72.0% and inference from 88.0% to 68.0%
  while raising faithfulness from 73.0% to 90.0%; under centrally clustered
  distributions its scores hit 0% (Arcsine 10/10 vs Lorentzian 0/10, Fisher's
  exact p = 1.08 × 10 − 5).


  Evidence is measured and the two sweeps separate length from distribution,
  but each cell is 1 quiz of 30 questions, 1 corpus, 1 judge model, 4 small
  production models, and a binary standard-vs-strict prompt contrast with no
  intermediate severities. The MoE-versus-dense explanation is labelled a
  hypothesis, not tested.


  If you are replacing RAG with long context, test distribution robustness per
  model before trusting the window size.
