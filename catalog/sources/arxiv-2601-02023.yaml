brief: >-
  How facts are spread through a long context, not just how far in they sit,
  determines whether a model finds them, and "don't make it up" prompts can
  zero out retrieval of facts that are present. The authors call these
  Distributional Collapse and the Safety Tax.


  The setup is an extended needle-in-a-haystack benchmark built on Balzac's La
  Comedie Humaine (~2M tokens) to avoid parametric leakage, with synthetic
  facts about fictional characters and 30 quiz questions graded by GPT-5-mini.
  Protocol A sweeps context length and fact depth from 10% to 100% in 10%
  steps (200 quizzes per model); Protocol B fixes context at 100% capacity and
  disperses 10 facts under 9 distributions (18 quizzes per model). Models:
  Gemini-2.5-flash, ChatGPT-5-mini, Claude-4.5-haiku, Deepseek-v3.2-chat, all
  at temperature=0.


  Gemini and Deepseek stay near ceiling (98.4% and 99.4% aggregate
  extraction). ChatGPT-5-mini falls from 90.3% aggregate to 72.0% extraction
  at capacity under anti-hallucination prompts, and drops to 0% extraction and
  inference under centrally clustered Normal/Lorentzian distributions.
  Claude-4.5-haiku aggregates 58.5% logical inference and <=20% reasoning
  under Arcsine, which places facts only at the edges, separating dispersion
  effects from lost-in-the-middle.


  Evidence is measured, with prompt condition and distribution varied
  separately; the distribution effect is backed by one Fisher's Exact Test
  (10/10 vs 0/10, p = 1.08 x 10-5) on a single model. Only 4 small production
  models, 1 fictional corpus, 1 rigid anti-hallucination phrasing, and an LLM
  judge. Mechanistic claims about MoE are flagged by the authors as untested
  speculation.


  If you are replacing RAG with long context, stress-test the dispersal
  pattern and the refusal prompt before trusting advertised window size.
