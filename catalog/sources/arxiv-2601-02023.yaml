brief: >-
  How facts are spread through a long context can matter more than how long
  the context is, and "don't make it up" prompts can wipe out correct
  retrieval entirely. Both effects are model-specific rather than universal.


  The setup is an extended needle-in-a-haystack benchmark built on Balzac's La
  Comedie Humaine (~2M tokens) to avoid parametric leakage, with synthetic
  facts about fictional characters and 30 quiz questions graded by GPT-5-mini.
  4 models were tested: Gemini-2.5-flash (1M), ChatGPT-5-mini (272k),
  Claude-4.5-haiku (~175k), Deepseek-v3.2-chat (128k). Protocol A sweeps
  context length and fact depth from 10% to 100% (200 quizzes per model);
  Protocol B fixes context at 100% capacity and disperses 10 facts across 9
  statistical distributions (18 quizzes per model).


  Gemini and Deepseek stayed near-ceiling. Claude-4.5-haiku fell to 58.5%
  aggregate logical inference and 48% at capacity. Anti-hallucination
  prompting cut ChatGPT-5-mini's extraction at capacity from 89.0% to 72.0%
  and inference from 88% to 68%, while raising faithfulness from 73.0% to
  90.0%; under centrally clustered distributions (Normal, Lorentzian) its
  scores hit 0%. Arcsine 10/10 vs Lorentzian 0/10 gives Fisher's exact p =
  1.08 × 10 − 5.


  Effects are measured, with prompt condition isolated by matched pairs, but 1
  run per cell, deterministic decoding, an LLM judge, and no
  architecture-level attribution; the MoE explanation is explicitly a
  hypothesis. Only 4 small production models, 1 fictional corpus without
  tables or jargon, and 1 severity level of safety prompt.


  If you replace RAG with long context, test your model against dispersed
  facts before trusting it.
