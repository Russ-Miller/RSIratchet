brief: >-
  How facts are spread through a long context, not just how far in they sit,
  determines whether a model finds them, and "don't make it up" instructions
  can suppress correct answers that are plainly present in the text.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comedie Humaine (~2M tokens, chosen to block parametric leakage)
  and quizzes 4 models: Gemini-2.5-flash (1M), ChatGPT-5-mini (272k),
  Claude-4.5-haiku (~175k), Deepseek-v3.2-chat (128k). Protocol A sweeps
  context length 10%-100% and fact depth 10%-100% (200 quizzes per model);
  Protocol B fixes context at 100% capacity and scatters 10 facts under 9
  distributions (18 quizzes per model). Literal extraction, logical inference,
  and faithfulness are scored separately by a GPT-5-mini judge at
  temperature=0.


  Gemini and Deepseek stay near-ceiling. ChatGPT-5-mini's extraction at
  capacity falls from 89.0% to 72.0% under the anti-hallucination prompt, and
  inference from 88.0% to 68.0%, while faithfulness rises from 73.0% to 90.0%.
  Under centrally clustered distributions its extraction and inference hit 0%.
  Claude-4.5-haiku shows U-shaped decay, with inference at 48.0% at capacity.


  The prompt effect is cleanly isolated by matched standard-vs-AH pairs; the
  distribution claim rests on 1 Fisher's Exact Test (10/10 vs 0/10, p =
  1.08e-5) on a single model. Each cell is 30 questions, graded by an LLM
  judge, on 1 fiction corpus with no tables or formatting noise, and 4 small
  production models only.


  Treat nominal context length and safety prompts as things to stress-test per
  model before deployment.
