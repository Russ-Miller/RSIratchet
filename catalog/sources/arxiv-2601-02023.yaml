brief: >-
  How facts are spread through a long context, not just how far in they sit,
  determines whether a model finds them, and "don't make it up" prompts can
  cost more accuracy than they buy in faithfulness. Both effects are
  model-specific rather than universal.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comedie Humaine (~2M tokens), chosen to block parametric
  leakage, and quizzes Gemini-2.5-flash (1M), ChatGPT-5-mini (272k),
  Claude-4.5-haiku (~175k) and Deepseek-v3.2-chat (128k) on 30 questions,
  graded by GPT-5-mini at temperature=0. Protocol A sweeps context length and
  fact depth from 10% to 100% (200 quizzes per model); Protocol B pins context
  at 100% capacity and disperses 10 facts under 9 statistical distributions.


  Gemini and Deepseek stay near-ceiling (98.4% and 99.4% aggregate literal
  extraction). ChatGPT-5-mini drops from 90.3% aggregate to 72.0% at capacity
  under anti-hallucination prompts, with logical inference at 68.0%, and falls
  to 0% extraction and inference under centrally clustered Lorentzian and
  Normal distributions. Claude-4.5-haiku reaches only 58.5% logical inference
  and collapses to <=20% under Arcsine, where facts sit at the edges.


  Evidence is measured across a dense grid, with one Fisher's Exact Test (p =
  1.08e-5) comparing Arcsine 10/10 against Lorentzian 0/10. Architectural
  explanations are explicitly labelled hypothesis; closed models prevent
  attribution.


  Only 4 cost-efficient production models, 1 narrative corpus without tables
  or jargon, which the authors call a best-case scenario.


  Validate a candidate model against dispersed-fact stress tests before
  replacing retrieval with long context.
