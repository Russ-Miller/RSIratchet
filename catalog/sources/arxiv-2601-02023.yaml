brief: >-
  How facts are spread through a long context matters as much as where they
  sit, and "don't make it up" prompts can cost more accuracy than they buy in
  faithfulness. Both effects are model-specific rather than universal.


  The setup is an extended needle-in-a-haystack benchmark built on Balzac's La
  Comedie Humaine (~2M tokens) to avoid parametric leakage, with synthetic
  facts about fictional characters and 30 quiz questions graded by GPT-5-mini.
  Protocol A sweeps context length and fact depth from 10% to 100% in 10%
  steps (200 quizzes per model); Protocol B fixes context at 100% capacity and
  injects 10 facts under 9 statistical distributions (18 quizzes per model).
  Models: Gemini-2.5-flash, ChatGPT-5-mini, Claude-4.5-haiku,
  Deepseek-v3.2-chat.


  Gemini and Deepseek stayed near-ceiling (98.4% and 99.4% aggregate
  extraction). ChatGPT-5-mini fell from 90.3% aggregate to 72.0% extraction at
  capacity under anti-hallucination prompts, with logical inference at 68.0%,
  while faithfulness rose from 73.0% to 90.0%. Claude-4.5-haiku managed 58.5%
  aggregate inference, dropping to 48.0% at capacity. Under centrally
  clustered distributions, ChatGPT-5-mini hit 0% with AH prompts; Arcsine
  (10/10) vs Lorentzian (0/10) gives Fisher's exact p = 1.08 x 10-5.


  Evidence is measured, with prompt condition cleanly varied and length held
  fixed in Protocol B, but it rests on 1 corpus, 1 fiction domain, 4 small
  production models, 30 questions per quiz, and an LLM judge. The
  architectural explanation (MoE vs dense) is explicitly a hypothesis, not
  tested.


  Validate a candidate long-context model against dispersed-fact stress tests
  before trusting its advertised window.
