brief: >-
  How facts are spread through a long context, not just how far in they sit,
  can break retrieval outright, and "don't make it up" prompts can make it
  worse. Spatial dispersion is a failure mode distinct from
  lost-in-the-middle.


  The benchmark extends needle-in-a-haystack using Balzac's La Comedie Humaine
  (~2M tokens) as a leakage-free haystack, with synthetic facts about
  fictional characters. 4 models were tested: Gemini-2.5-flash (1M),
  ChatGPT-5-mini (272k), Claude-4.5-haiku (~175k), Deepseek-v3.2-chat (128k).
  Protocol A sweeps 10 context lengths x 10 depths x 2 prompt conditions (200
  quizzes per model); Protocol B fixes context at 100% capacity and scatters
  10 facts under 9 distributions. Probes separate literal extraction, logical
  inference, and faithfulness, graded by GPT-5-mini at temperature=0.


  Gemini and Deepseek stay near-ceiling (98.4% and 99.4% aggregate
  extraction). ChatGPT-5-mini's extraction falls from 90.3% aggregate to 72.0%
  at capacity under anti-hallucination prompts, and drops to 0% extraction and
  inference under centrally clustered Lorentzian and Normal distributions.
  Claude-4.5-haiku's logical inference sits at 58.5% aggregate and 48.0% at
  capacity, and stays below 20% even under Arcsine, which puts facts at the
  edges.


  Evidence is measured, with one Fisher's exact test (10/10 vs 0/10, p =
  1.08e-5) isolating the distributional effect. The architectural explanation
  (MoE vs dense) is explicitly labeled a hypothesis; internals of 3 of the 4
  systems are undisclosed.


  Only 4 cost-efficient production models, 1 fictional corpus without tables
  or jargon, 1 strict anti-hallucination phrasing. Softer safety wordings were
  not tested.


  If you replace RAG with long-context prompting, test the candidate model
  against dispersed facts before trusting it.
