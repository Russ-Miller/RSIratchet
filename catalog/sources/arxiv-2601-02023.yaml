brief: >-
  How facts are spread through a long context, not just how far in they sit,
  determines whether a model finds them, and "don't make it up" prompts can
  cost more accuracy than they buy in faithfulness. Both effects are
  model-specific rather than universal.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comedie Humaine (~2M tokens), chosen to block parametric
  leakage, and quizzes Gemini-2.5-flash (1M context), ChatGPT-5-mini (272k),
  Claude-4.5-haiku (~175k) and Deepseek-v3.2-chat (128k) on 30 questions,
  graded by GPT-5-mini. Protocol A sweeps context length and fact depth in 10%
  steps (200 quizzes per model); Protocol B fixes context at 100% capacity and
  scatters 10 facts under 9 distributions (18 quizzes per model).


  Gemini and Deepseek hold near-ceiling literal extraction (98.4% and 99.4%
  aggregate). ChatGPT-5-mini falls from 89.0% to 72.0% extraction at capacity
  under the anti-hallucination prompt, and to 0% extraction and inference
  under centrally clustered Normal and Lorentzian placements, while its
  faithfulness rises from 74.1% to 89.8%. Claude-4.5-haiku's logical inference
  sits at 58.5% aggregate and collapses to 20% or below under the edge-heavy
  Arcsine distribution, which the authors use to argue dispersion is separate
  from lost-in-the-middle.


  Effects are measured with matched standard-vs-AH pairs, but only 1 corpus, 4
  small production models, 30 questions per quiz, and a single Fisher's test
  (p = 1.08 x 10-5) on 10/10 vs 0/10. The MoE explanation is explicitly a
  hypothesis. Nothing here covers formatted enterprise documents or large
  reasoning models.


  Treat nominal context window and safety prompting as things to stress-test
  per model before deployment.
