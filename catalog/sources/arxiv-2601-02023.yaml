brief: >-
  How facts are spread through a long context, and whether you add a "don't
  make it up" instruction, can matter more than where any single fact sits.
  Two failure modes are separated: Distributional Collapse, where dispersed or
  centrally clustered evidence breaks retrieval, and a Safety Tax, where
  anti-hallucination prompts cause refusal of facts that are present.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comedie Humaine (~2M tokens) to avoid parametric leakage, and
  tests Gemini-2.5-flash (1M), ChatGPT-5-mini (272k), Claude-4.5-haiku (~175k)
  and Deepseek-v3.2-chat (128k) at temperature=0. Protocol A sweeps 10 context
  lengths x 10 depths x 2 prompt conditions (200 quizzes per model); Protocol
  B fixes context at 100% capacity and scatters 10 facts under 9 distributions
  (18 quizzes per model). Literal extraction, logical inference and
  faithfulness are graded separately by a GPT-5-mini judge.


  Gemini and Deepseek stay near-ceiling (98.4% and 99.4% aggregate
  extraction). Claude-4.5-haiku falls to 48.0% inference at capacity.
  ChatGPT-5-mini's extraction at capacity drops from 89.0% standard to 72.0%
  with the AH prompt, and collapses to 0% extraction and inference under
  Lorentzian and Normal distributions, versus 10/10 correct under Arcsine
  (Fisher's exact p = 1.08 x 10-5). Claude collapses to <=20% inference even
  under Arcsine, which the authors use to argue the effect is not
  lost-in-the-middle.


  Evidence is measured, with matched prompt conditions, but grading is by a
  single LLM judge, 1 corpus, 1 quiz of 30 questions, and only small
  production models. The architectural MoE explanation is explicitly a
  hypothesis. Treat nominal context length as uninformative and stress-test
  distribution before deployment.
