brief: >-
  How facts are spread through a long context, and whether you tell the model
  not to make things up, can matter more than context length itself. Two
  failure modes appear: evidence dispersed across the window degrades
  retrieval independently of position, and "Don't Make It Up" prompts push
  some models into refusing facts that are present.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comédie Humaine (~2M tokens) to block parametric leakage, then
  quizzes Gemini-2.5-flash (1M), ChatGPT-5-mini (272k), Claude-4.5-haiku
  (~175k) and Deepseek-v3.2-chat (128k) on 30 questions, graded by GPT-5-mini.
  Protocol A sweeps 10 context lengths x 10 depths x 2 prompts (200 quizzes
  per model); Protocol B fixes context at 100% capacity and places 10 facts
  under 9 statistical distributions (18 quizzes per model).


  Gemini and Deepseek stay near-ceiling (98.4% and 99.4% aggregate literal
  extraction). Claude-4.5-haiku is weakest on logical inference (58.5%
  aggregate, 48.0% at capacity). The anti-hallucination prompt costs
  ChatGPT-5-mini extraction at capacity, 89.0% to 72.0%, and inference 88.0%
  to 68.0%, while raising faithfulness 73.0% to 90.0%. Under central
  clustering (Lorentzian, Normal) its scores fall to 0%.


  Evidence is measured, with a matched standard-prompt control isolating the
  prompt effect, and a Fisher's Exact Test on Arcsine (10/10) versus
  Lorentzian (0/10) giving p = 1.08 × 10 − 5. But it is 4 models, 1 corpus, 30
  questions per quiz, and an LLM judge.


  The corpus is uniform narrative without tables or jargon, so this is a best
  case; the MoE explanation offered for the robust models is a hypothesis, not
  tested. Validate your own model against dispersion before replacing
  retrieval with a big window.
