brief: >-
  How facts are spread through a long context, not just how far in they sit,
  determines whether a model finds them, and "don't make it up" prompts can
  drive a model to refuse facts that are plainly present. Both effects are
  strongly model-specific.


  The setup is an extended needle-in-a-haystack benchmark built on Balzac's La
  Comedie Humaine (~2M tokens) with synthetic fictional facts, avoiding
  parametric leakage. 4 models were tested: Gemini-2.5-flash (1M),
  ChatGPT-5-mini (272k), Claude-4.5-haiku (~175k), Deepseek-v3.2-chat (128k).
  Protocol A swept 10 context lengths x 10 depths x 2 prompts (200 quizzes per
  model); Protocol B fixed context at 100% capacity and dispersed 10 facts
  across 9 statistical distributions. Literal extraction, logical inference,
  and faithfulness were scored separately by a GPT-5-mini judge at
  temperature=0.


  Gemini and Deepseek stayed near ceiling (98.4% and 99.4% aggregate
  extraction). Claude-4.5-haiku fell to 58.5% aggregate inference and 48.0% at
  capacity. ChatGPT-5-mini's extraction at capacity dropped from 89.0%
  standard to 72.0% with the anti-hallucination prompt, inference from 88.0%
  to 68.0%, while faithfulness rose from 73.0% to 90.0%. Under centrally
  clustered distributions (Lorentzian, Normal), ChatGPT-5-mini hit 0% with the
  safety prompt; Fisher's exact test against Arcsine (10/10 correct) gives p =
  1.08 x 10-5.


  Effects are measured with a clean paired prompt comparison, but the quiz is
  30 questions per condition, the significance test covers 1 model on 1 pair
  of distributions, and the MoE-versus-dense explanation is explicitly
  labelled speculation. The corpus is a single uniform narrative with no
  tables or jargon, which the authors call a best-case scenario; no
  reasoning-heavy frontier models were tested.


  If you are replacing RAG with long-context prompting, test your candidate
  model against dispersed facts and against your own safety prompt before
  trusting its recall.
