brief: >-
  How facts are spread through a long context, not just how far in they sit,
  determines whether a model finds them. Adding a "Don't Make It Up"
  instruction can push a model to refuse facts that are plainly present.


  The benchmark injects synthetic facts about fictional characters into
  Balzac's La Comedie Humaine (~2M tokens), chosen to block parametric
  leakage, and quizzes Gemini-2.5-flash (1M), ChatGPT-5-mini (272k),
  Claude-4.5-haiku (~175k) and Deepseek-v3.2-chat (128k) on 30 questions,
  graded by GPT-5-mini at temperature=0. Protocol A sweeps context length and
  fact depth from 10% to 100% (200 quizzes per model); Protocol B fixes
  context at 100% capacity and scatters 10 facts under 9 distributions.


  Gemini and Deepseek hold near-ceiling extraction (98.4%, 99.4% aggregate).
  ChatGPT-5-mini's extraction at capacity falls from 89.0% standard to 72.0%
  with the anti-hallucination prompt, while faithfulness rises from 73.0% to
  90.0%. Claude's logical inference sits at 48.0% at capacity. Under central
  clustering (Normal, Lorentzian) ChatGPT-5-mini scores 0% with the safety
  prompt; Fisher's Exact against Arcsine (10/10 vs 0/10) gives p = 1.08 × 10 −
  5.


  The prompt contrast is a clean matched comparison, but it is 1 corpus, 4
  small production models, and 1 severity level of safety prompt; the authors
  call the clean narrative a best-case setting and the MoE explanation
  untested.


  Treat nominal context length as unrelated to retrieval reliability, and test
  safety prompts for over-refusal before shipping them.
