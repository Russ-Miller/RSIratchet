brief: >-
  How facts are spread through a long context, not just how far in, determines
  whether a model finds them, and "don't make it up" instructions can suppress
  correct answers that are present in the text.


  The authors built an extended needle-in-a-haystack benchmark on Balzac's La
  Comedie Humaine (~2M tokens), chosen to avoid parametric leakage, and
  injected synthetic facts about fictional characters. 4 models were tested:
  Gemini-2.5-flash (1M), ChatGPT-5-mini (272k), Claude-4.5-haiku (~175k),
  Deepseek-v3.2-chat (128k). Protocol A swept context length and fact depth
  from 10% to 100% in 10% steps (200 quizzes per model); Protocol B fixed
  context at 100% capacity and scattered 10 facts under 9 statistical
  distributions. Grading was by GPT-5-mini at temperature=0.0.


  Gemini and Deepseek stayed near-ceiling (98.4% and 99.4% aggregate literal
  extraction). ChatGPT-5-mini's extraction fell from 89.0% to 72.0% at
  capacity under the anti-hallucination prompt, with inference at 68.0%;
  faithfulness rose from 73.0% to 90.0%. Under centrally clustered
  (Lorentzian, Normal) distributions, ChatGPT-5-mini scored 0% on both
  extraction and inference with the safety prompt. Claude-4.5-haiku managed
  58.5% aggregate logical inference, dropping to 48.0% at capacity.


  The distribution effect was isolated by holding context length fixed, and a
  Fisher's Exact Test on Arcsine (10/10) versus Lorentzian (0/10) gave p =
  1.08 × 10 − 5. But each cell is 10 facts or 30 questions, 1 run at
  temperature 0, and the architectural explanation (MoE vs dense) is
  explicitly labelled speculation.


  Only 4 small production models, 1 fictional narrative corpus with no tables
  or jargon, and 1 rigid phrasing of the safety prompt were tested; the
  authors call this a best-case scenario. If you are replacing RAG with long
  context, test your candidate model against dispersed evidence before
  trusting the window size.
