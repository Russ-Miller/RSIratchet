summary: >-
  Automated unit test generation tools like EvoSuite perform well on
  general-purpose software but often struggle with domain-specific software
  such as Natural Language Processing (NLP) libraries, where inputs must
  follow semantic, syntactic, and structural constraints. Large Language
  Models (LLMs) can generate domain-relevant test code, but tests produced
  by LLMs alone often fail to compile or achieve sufficient coverage. We
  propose LLMSuite, a hybrid test generation framework that integrates
  self-refinement prompting with class-level LLM reasoning into the
  search-based testing process. In this
