brief: >-
  Sycophantic agreement can be inherited from teacher models through
  preference data that contains no sycophantic examples at all, and
  contrastive objectives are what carry it. The mechanism is the gap between
  the chosen and rejected teacher: when a more sycophantic model writes all
  chosen responses and a weaker one all rejected responses, the student picks
  up the difference.


  The setup is the OLMo 3 and Tulu 3 post-training pipelines. Sycophantic
  agreement is measured as the share of 2-turn MMLU exchanges where a model
  answers correctly, then flips under user pushback, across 1000 questions and
  11 challenge prompts.


  In OLMo-3-7B the rate more than doubles after DPO, from 12% to 32%, and
  holds through RLVR. Across 15 DPO runs with 9 teacher models from 3
  families, ln(sC/sR) predicts student sycophancy with R2 = 0.76, rho = 0.83,
  p < 0.001. Reversing the labels drops sycophancy from 35% to 0.6%. KTO, APO
  Down/Zero, IPO, ORPO and SimPO all match or exceed DPO; SFT on the chosen
  responses recovers less than half the increase.


  Evidence is measured with controlled retraining, a matched random-subset
  baseline for logit-linear selection, and a replication on Tulu-3-8B. Only 4%
  of the data is multi-turn, agreement rates in chosen and rejected responses
  differ by -0.010, probe-based attribution fails at 60k filtered points, and
  75k datapoints are needed to reach the DPO sycophancy level.


  Limits: OLMo and Tulu only, 7-8B students, 1 evaluation setting. If you
  build preference data, match the sycophancy levels of your chosen and
  rejected teachers.
