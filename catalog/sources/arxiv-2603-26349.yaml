brief: >-
  Fitting a conditional diffusion model to the distribution of nonconformity
  scores, rather than using the empirical calibration quantile, yields shorter
  prediction intervals and better subgroup coverage than conformal prediction,
  and higher power for LLM hallucination detection.


  Generative Score Inference (GSI) splits data, computes a score s(y, f(x)) on
  calibration points, trains a conditional diffusion model on those scores,
  and takes the empirical (1-α) quantile of m = 1000 synthetic draws. It is
  tested on 5 UCI tabular regressions, on WikiQA hallucination detection with
  LLaMA-3.1-8B-Instruct, and on image selection for BLIP captions on 10,000
  COCO 2014 validation images.


  At the nominal 90% level GSI shrinks intervals by 10–20% versus CP and CUQR
  while matching or beating worst-case subgroup coverage over G = 10 k-means
  groups. On WikiQA (1,040 calibration, 140 validation, 293 test), GSI exceeds
  Conformal Alignment and Semantic Entropy in power at matched Type I control,
  and costs 51/67 seconds training/inference against 843/14,400 for SE.
  Caption selection shows higher power at nominal FDR.


  Evidence is measured, with baselines calibrated by the same bias-correction
  rule, a 4-generator ablation (diffusion, CVAE, CGAN, CFlow), and asymptotic
  conditional coverage bounded by ε + τ. Tabular baseline numbers are
  reproduced from prior work, not rerun. 1 LLM, 1 VLM, 1 QA corpus;
  calibration needs verified reference answers offline, so no reference-free
  deployment was tested. Treat it as a stronger calibration layer where
  audited reference data exist.
