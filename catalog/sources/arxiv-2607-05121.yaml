summary: >-
  Large language models are known to be sensitive to prompt formulation.
  Even minor variations in wording can substantially degrade performance.
  This sensitivity reveals an opportunity: if prompt phrasing can harm
  performance, can it be used to improve it? To investigate this question,
  we introduce a search-based approach that identifies and evolves a set of
  natural language transformation rules with strong downstream effects on
  coding performance. We then propose DUALFIX, a staged repair pipeline that
  combines the evolved transformation rules with execution-feedback repair,
