brief: >-
  Storing user habits in two separate places — a natural-language experience
  pool and an app-keyed memory — lets a mobile agent resolve ambiguous
  instructions without any parameter updates. Me-Agent combines User
  Preference Learning, which runs multiple rollouts per instruction, scores
  them with a VLM reward model over screenshots, and edits an experience pool
  via ADD/UPDATE/Delete/KEEP, with a Hierarchical Preference Memory holding
  app categories at level 1 and per-app workflows and content preferences at
  level 2.


  Evaluation uses User FingerTip, built by stripping app names (Type I) or
  replacing content with vague references like "my favorite" (Type II): 60
  users, 33 applications, 12 categories, 300 Type I and 267 Type II
  instructions, 15 training and 5 test instructions per user.


  App Selection Accuracy reaches 1.000 on both types against 0.600/0.400 for
  Mobile-Agent-v2/E on Type I and 0.200 for both on Type II. Type II BERTScore
  rises to 0.725 from 0.526/0.549. On the E dataset, task completion is 0.893
  vs 0.639, but task success rate is 0.600, below Mobile-Agent-E's 0.667.


  Evidence includes an incremental ablation (BASE, +UPL, +HPM, both) and 3
  backbones (GPT-4o, Claude-3.5-Sonnet, Gemini-2.5-Pro), with matched action
  space and perception models. The ablation is reported only as a figure with
  no numbers in text, baselines are 2, and group size is just 2 rollouts.


  The benchmark's ground truth is the user's most frequent app, so perfect ASA
  partly reflects a frequency-matching task; learned UI positions break on app
  updates, and no location or mood context is modeled.


  Treat this as evidence that context-space preference storage substitutes for
  fine-tuning in agents, not as proof of general task-success gains.
