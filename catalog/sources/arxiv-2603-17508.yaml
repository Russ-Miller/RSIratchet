brief: >-
  Multimodal models can produce code that runs but cannot reproduce the
  picture it came from: execution rates sit near 90-99% while parameter-level
  accuracy stays near 40% for frontier models.


  Omni-I2C contains 1,080 curated image-code pairs across 5 languages (Python,
  LaTeX, HTML, SVG, SMILES), 8 subjects and 45 figure types, scored on 3 axes:
  LMM-judged visual fidelity (S_img), Functional Coverage (S_func), and
  Parametric Accuracy (S_para) checked against pre-extracted, human-verified
  checklists. 13 models were run, 4 proprietary and 9 open-weight (7B-241B).


  Gemini 3 Pro leads overall at S_func 62.2, S_para 41.4, S_img 76.1; Claude
  Sonnet 4.5 has the highest execution rate at 97.2%. Open-weight average is
  S_func 42.6, S_para 32.1. LaTeX is the weakest category (proprietary average
  S_func 46.7 vs 62.6 on Python). Qwen3-VL-32B beats the larger
  Qwen2.5-VL-72B.


  Evidence is a measured leaderboard plus two validation studies: the S_img
  prompt beats 4 prior image-level metrics against human rankings (Kendall's τ
  0.8304 with GPT 4.1), and 3 code judges agree at Kendall's W 0.7618. Error
  taxonomy comes from a manual audit of 240 instances, with entity and layout
  errors over 60%.


  Scoring still depends on LLM judges, and no natural scene images are
  included. Prompting moves results a lot: Hint-Enhanced lifts InternVL3.5-8B
  execution from 72.04% to 88.40%, so single-prompt rankings are fragile.


  Use this if you need a precision-sensitive probe of visual grounding rather
  than another chart-to-code score.
