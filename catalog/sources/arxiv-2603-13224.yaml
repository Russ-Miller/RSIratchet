brief: >-
  Rewards that judge rendered images element by element beat both
  text-edit-distance and vision-encoder similarity for vision-to-code RL, and
  the standard proxies hack rather than improve.


  Visual-ERM is an 8B generative reward model trained on Qwen3-VL-8B-Instruct
  over discrepancy-annotated reference/prediction image pairs (category,
  severity, location, description), labelled by GPT-5-mini and filtered by
  rendering-consistency checks. It supplies a bounded scalar plus
  render-success term for GRPO on chart-to-code (ChartMimic),
  table-to-markdown (OmniDocBench v1/v1.5, olmOCRBench) and SVG-to-code
  (UniSVG), and its discrepancy list doubles as feedback for reflection.


  RL with Visual-ERM lifts Qwen3-VL-8B-Instruct by +8.4 on chart-to-code, +2.7
  on table-to-markdown and +4.1 on SVG. DINO-based reward degrades tables
  (65.3 vs 76.8 base) and the strong VinciCoder SVG policy; TEDS-based reward
  rises on its own proxy but gives 74.8 average. On the new 1,335-instance
  VC-RewardBench, Visual-ERM reaches 42.1 F1-hard against 29.5 for
  Qwen3-VL-235B-Instruct and 40.6 for Gemini-3-Flash. 3 rounds of reflection
  add +8.0, with returns fading at 4 rounds.


  The reward baselines are matched within the same GRPO setup, so attribution
  to the reward signal is clean; the judge is LLM-as-Judge, the teacher and
  benchmark annotators overlap in model family (GPT-5-mini, Gemini), and
  everything is 1 policy scale, 8B, 3 task types.


  If you are doing RL on rendering tasks, stop using embedding similarity as
  the reward.
