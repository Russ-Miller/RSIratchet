brief: >-
  A 4B policy trained only to route between frozen expert models and skills
  can outscore frontier multimodal models that answer directly. Maestro treats
  model selection and skill invocation as one compositional action
  (<search>Model@@Skill: Query</search>), formalises it as a finite-horizon
  POMDP, and trains with GRPO on outcome plus format rewards only, with no
  step-level routing supervision.


  The orchestrator is Qwen3-VL-4B-Thinking, trained on 9,200 samples from 7
  datasets, over 5 frozen experts (GLM-4.6V-Flash, Chart-R1,
  Qwen3-VL-8B-Instruct, Intern-S1-mini, MedGemma) and a 2-tier skill library
  of 5 Level-1 and 8 Level-2 skills, evaluated on 10 multimodal benchmarks.


  Average accuracy is 70.1%, above GPT-5 (69.3%) and Gemini-2.5-Pro (68.7%),
  with the gain concentrated on domain-specific tasks (Geometry3K 77.4% vs
  GPT-4o 34.1%) and little or no gain elsewhere (ChartQA +0.1, Slake +0.0,
  TallyQA +0.4). Adding 2 unseen experts and 4 new skills without retraining
  lifts 4 specialized OOD benchmarks from 52.7% to 59.5%. Reported latency is
  2.88s and 648.20 tokens, the lowest among compared methods.


  Ablations isolate the parts: removing the model pool costs -12.1%
  (Geometry3K 77.4%→22.3%), removing skills -2.7%, removing the format reward
  -13.1%. Baselines are not budget-matched, since Maestro calls 9B-class
  experts the single-model baselines do not get.


  MathVision stays at 43.4%, below GPT-5's 61.5%, so routing does not
  substitute for frontier reasoning. BFCL-V4 and tau2-bench results are
  reported but with thin setup detail. Useful if you are deciding between
  scaling a backbone and training a router over experts you already host.
