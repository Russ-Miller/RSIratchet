summary: >-
  Foundation models in language and multimodality achieve strong
  generalization by aligning heterogeneous data under a unified formulation
  and training at scale. In this report, we investigate whether this scaling
  recipe can be applied to robotic manipulation to achieve genuine
  generalization. This is challenging because, unlike text, manipulation
  data is heterogeneous by nature, expensive to collect, and narrow in
  diversity, making alignment and scale simultaneously difficult. We present
