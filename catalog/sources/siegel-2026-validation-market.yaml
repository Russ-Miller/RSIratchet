  Please repost the crap out of this until @elonmusk or @Gwynne_Shotwell replies to it:

  Grokipedia is dead. I'd like to rescue it, starting with scientific data, which is critical to intelligence (artificial or not) ...

  1. LLMs have a GIGO problem. They ingest tons of wrong information and spew it out with certainty.

  2. Peer-reviewed research is a disaster. It's a $10 billion industry with bad incentives and terrible results. Feynman would not be happy.

  3. Far too many global crises are caused by fake, weaponized, political, and simply incompetent science.

  I believe the ONLY way to fix it is not with programming and training, but with an open, two-sided market mechanism where you make money if you're right and you lose money if you're wrong. It's not a prediction market, it's a validation market.

  This skin-in-the-game approach will produce the world's most accurate science data, and much more. It's better than community notes. It could become the basis for an entirely new media company that complements X.com.

  DM me and I'll send you my deck.

  Sincerely,

  David Siegel
