summary: >-
  Evaluation of long-context Large Language Models (LLMs) has advanced
  rapidly. However, most existing benchmarks are limited to the document
  level and focus mainly on high-resource languages, leaving many
  fine-grained challenges insufficiently evaluated. To address this gap, we
  present MGAL, the first multilingual, granularity- and position-aware
  long-context benchmark. MGAL is constructed from United Nations (UN)
  reports spanning 8K to 128K tokens across the six official UN languages.
