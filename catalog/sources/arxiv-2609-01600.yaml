summary: >-
  Dynamic agent harnesses let language models change the software that
  shapes their own execution. This flexibility brings a new reasoning
  burden: a local plugin change can propagate through dependencies and
  cleanup. We introduce CordisBench, a 1,200-question benchmark of this
  lifecycle reasoning. It combines a controlled formal setting with programs
  executed against Cordis, a runtime that manages component dependencies and
  cleanup, and asks models to identify affected components, predict state
