summary: >-
  Aspect Sentiment Triplet Extraction (ASTE) requires jointly identifying
  (aspect, opinion, sentiment) triples from a given review sentence. While
  large language models (LLMs) achieve strong zero-shot performance on many
  NLP benchmarks, their effectiveness on ASTE remains limited, as
  single-pass generation forces the model to determine span boundaries,
  opinion grouping, and sentiment polarity in a single decoding step. Common
  remedies, such as few-shot in-context learning and chain-of-thought
  prompting, offer only marginal improvements and rely heavily on either
  in-domain demonstrations sampled
