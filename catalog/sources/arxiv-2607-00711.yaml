summary: >-
  Large Language Models have emerged as programming assistants. However, the
  efficacy of code generation is constrained by the quality of input
  requirements, which are frequently ambiguous, incomplete, or
  underspecified. While LLMs excel at one-shot code synthesis, their ability
  to proactively clarify intent remains underexplored, as a critical trait
  for robust software engineering. Existing benchmarks largely overlook this
  interactive bottleneck, assuming perfectly specified prompts that do not
  reflect the iterative nature of requirement elicitation. To bridge this
  gap, we introduce ClarifyCode
