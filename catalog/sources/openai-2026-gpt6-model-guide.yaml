archived_text: |
  A model guide for the GPT-6 family
  Practical tips for getting the best results from GPT-6 models while managing time and cost

  TL;DR
  Run effectively in production. Use caching and compaction to manage context and cost. Measure task success and latency, and plan for monitoring and data controls.
  Match the model to your workload. Balance capability, cost, and latency by choosing the model, reasoning effort, and speed that fit the task.
  Adjust your prompts and skills. Keep prompts, skills, and repository instructions consistent about what the model should deliver, what it can do independently, and what counts as done.
  Keep long-running work on track. Use steering, async tools, and delegation to handle updates and independent work. Set clear boundaries for when the model should ask for input.

  Keep efficiency in mind. Cut context the task doesn't need while keeping the evidence it does. Where your application supports it, run independent tasks together so one slow step doesn't hold up unrelated work.
  Match the model to the workload. Think of the model choice and reasoning level as an intelligence/price tradeoff. Choose model capability and reasoning effort to fit the task.
  Give the model a clear assignment. Start with the result you want, who it's for, the relevant context and constraints, and what counts as done.
  Keep skill descriptions short and explicit about when each skill should run, load supporting details only when needed, and replace rigid recipes with guidance suited to the models your team uses.
  Explain when particular documents and tests are relevant, and explicitly authorize safe routine workflows.
  State which actions can proceed independently and which require approval, replacing blanket “always ask” rules with clear boundaries.
  Define what “done” includes—implementing the change, running it, inspecting the result, and fixing failures—and identify any decisions that require review.
  In the API, use steering, asynchronous tools, and parallel work to keep long-running tasks moving. Delegate independent subtasks.
