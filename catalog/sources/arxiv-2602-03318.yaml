brief: >-
  Retrieving verified worked examples helps optimization modeling more than
  letting agents debug their own failed code, though both help and they fix
  different failure modes.


  MIRROR is a training-free multi-agent pipeline (parameter extraction,
  modeling advisor, mathematical modeling, code generation) that emits Gurobi
  code, with two additions: hierarchical retrieval over a curated library of
  602 verified problem-model-code triplets, and iterative adaptive revision
  that re-runs modeling and code agents on execution failure using separate
  local memory pools. Backbone is qwen-plus-2025-09-11 at temperature 0,
  evaluated pass@1 on NL4Opt, Mamo-EasyLP, Mamo-ComplexLP, IndustryOR, and
  ComplexOR.


  Macro average is 71.88% versus 69.58% for OptiTree, 68.20% for COE, 61.28%
  for ORMind, 53.57% for OptiMUS, and 58.52% for CoT on the same backbone. On
  qwen3-30B, 51.74% to 63.89%. Ablation: removing HRAG drops to 67.90%,
  removing IAR to 71.14%, removing both to 65.82%. Average compile error rate
  falls from 8.06% to 1.91% with both.


  Ablations are component-level and agent-level, and token budgets are
  reported (1068k for MIRROR vs 1527k for COE on IndustryOR), so the accuracy
  gain is not purely compute. Caveats: 1 backbone family for the main table,
  learning-based baselines copied from other papers, and 163 Mamo-EasyLP
  instances feed the exemplar library.


  If you build OR agents, prioritize a verified exemplar library over more
  self-debugging rounds.
