  fragile process ill-suited to novel scenarios. While large language models
  (LLMs) can automatically translate natural language into optimization
  models, existing approaches either rely on costly post-training or employ
  multi-agent frameworks, yet most still lack reliable collaborative error
  correction and task-specific retrieval, often leading to incorrect outputs.
