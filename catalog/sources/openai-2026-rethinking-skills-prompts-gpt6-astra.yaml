  Sep 11, 2026
  Rethinking skills and prompts for GPT-6 Astra
  Revisit skill descriptions, AGENTS.md, and task prompts to avoid bloated context.
  Author: Eric Provencher

  Coding agents have come a long way, and best practices are changing fast. With more capable models, what used to require a lot of handholding and scaffolding no longer does.
  These instructions can take many forms: skills, AGENTS.md, and your task prompts are all shaping how the model gets work done.
  Skill descriptions should be as short as possible while making it clear when the model should use them. Keep them clear about when they apply.
  Progressive disclosure is useful: for skills with multiple workflows, make the root document a minimal router that points to supporting docs and scripts. Give the model enough guidance to know where to look without forcing it to read things that don't matter in the moment.
  Many skills were written as elaborate itineraries or recipes. Models have gotten much better at understanding nuance and ambiguity, so overly specific guidance can now hinder results where it previously helped.
  Because AGENTS.md applies whenever the model works in your repository, frequently revisit each instruction and ask whether it is still needed.
  Previous models needed encouragement to run tests and check their work. GPT-6 Astra does that on its own, so the same instructions can lead to unnecessary testing.
  GPT-6 Astra is thorough, but it can be more tentative about how far to take a task. You can use AGENTS.md to give it permission for a specific workflow you know is safe.
  If a previous model led you to add strong boundary language, reconsider it when using GPT-6 Astra. The model may take it too seriously and stop work when you would prefer it to continue.
  Define completion before starting long-running work; clarify what done includes and where the model should stop.
