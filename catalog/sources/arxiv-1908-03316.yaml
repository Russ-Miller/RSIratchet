brief: >-
  Natural language descriptions alone are too ambiguous to specify regular
  expressions, and examples alone are too weak, but parsing the description
  into a partial program sketch and letting an example-driven search fill the
  holes recovers most of the intent. Regel parses an English regex description
  with a SEMPRE-based semantic parser into a hierarchical sketch (holes
  annotated with required leaf components), then runs a programming-by-example
  engine that uses the sketch hints for over/under-approximation pruning and
  encodes integer repeat bounds as symbolic integers solved with Z3.


  Evaluation covers over 300 regexes: 200 adapted from the DeepRegex data set
  (average 4 positive and 5 negative examples each) and 122 harder tasks
  scraped from StackOverflow with ground truth hand-converted to the DSL.
  Regel finds the intended regex in 80% of cases, against 43% for DeepRegex
  (natural language only) and 26% for Regel-Pbe (examples only, unconstrained
  sketch). The PBE engine completes sketches an order of magnitude faster than
  an adaptation of AlphaRegex given the same sketch. A user study with 20
  participants found users twice as likely to produce the intended regex with
  Regel.


  The ablations are informative: the examples-only and language-only baselines
  are the same system with one modality removed, and AlphaRegex was given the
  sketch, isolating the search algorithm. Weaknesses are in the data: h-sketch
  training labels for the StackOverflow set were written manually by the
  authors, DeepRegex examples were solicited after the fact, and success is
  credited if the target appears in the top k (k=1 with 10s, k=5 with 60s),
  with up to 4 rounds of extra examples. Nothing here tests modern seq2seq or
  LLM parsers, which the authors deliberately avoided for data reasons.


  If you care about spec-from-language tasks, this is evidence that the useful
  role of language is structural scaffolding, not the final program.
