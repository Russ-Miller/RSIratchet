brief: >-
  Combining a natural-language description with positive/negative examples
  solves regex synthesis tasks that neither modality solves alone, because
  descriptions are ambiguous and examples underdetermine intent.


  Regel parses an English description with a SEMPRE-based semantic parser into
  a "hierarchical sketch" of constrained holes, then runs a
  programming-by-example engine that uses the sketch both to prune via
  over/under-approximation and to solve integer constants in Repeat operators
  with Z3. Evaluation covers over 300 regexes from 2 sources: 200 benchmarks
  adapted from the DeepRegex data set (average 4 positive and 5 negative
  examples each) and 122 harder StackOverflow tasks with ground truth
  converted into the DSL.


  Regel finds the intended regex in 80% of cases against 43% for the NLP-only
  DeepRegex baseline and 26% for pure PBE. Its PBE engine is an order of
  magnitude faster at sketch completion than an adaptation of AlphaRegex, even
  when AlphaRegex's search is given the sketch. In a user study with 20
  participants, users were twice as likely to produce the intended regex with
  Regel.


  The modality comparison is measured with matched time budget t and result
  count k across tools, and the AlphaRegex comparison isolates the search
  algorithm by giving it the same sketch. Training sketches were constructed
  by the authors, manually for the StackOverflow set, which couples the parser
  to the benchmarks. Examples were solicited from users rather than drawn from
  the original posts for the DeepRegex set, and the tool is compared against 1
  neural baseline only.


  If you treat text-to-regex as a pure language task, this suggests the
  examples are doing much of the work.
