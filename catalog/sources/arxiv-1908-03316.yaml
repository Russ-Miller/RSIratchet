summary: In this paper, we propose a multi-modal synthesis technique for
  automatically constructing regular expressions (regexes) from a combination
  of examples and natural language. Using multiple modalities is useful in
  this context because natural language alone is often highly ambiguous,
  whereas examples in isolation are often not sufficient for conveying user
  intent. Our proposed technique first parses the English description into a
  so-called hierarchical sketch that guides our programming-by-example (PBE)
  engine. Since the hierarchical sketch captures crucial hints, the PBE engine
  can leverage this information to both prioritize the search as well as make
  useful deductions for pruning the search space. We have implemented the
  proposed technique in a tool called Regel and evaluate it on over three
  hundred regexes. Our evaluation shows that Regel achieves 80% accuracy
