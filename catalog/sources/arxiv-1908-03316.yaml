brief: >-
  Combining a natural-language description with positive/negative examples
  solves far more regex synthesis tasks than either modality alone. The
  authors parse the English into a "hierarchical sketch" with constrained
  holes, then run a programming-by-example engine that uses the sketch hints
  both to order the search and to prune via over-/under-approximations, plus
  symbolic integers solved with Z3 instead of enumerating constants.


  The tool, Regel, is evaluated on over 300 regexes from 2 sources: 200
  benchmarks adapted from the DeepRegex data set (augmented with examples, on
  average 4 positive and 5 negative each) and 122 harder StackOverflow tasks
  with ground-truth regexes converted into their DSL.


  Regel finds the intended regex in 80% of cases, against 43% for DeepRegex
  (seq2seq from language only) and 26% for a PBE-only variant that starts from
  a single unconstrained hole. Against an adaptation of AlphaRegex, their PBE
  engine is an order of magnitude faster at sketch completion even when
  AlphaRegex's search is given the sketch. A user study with 20 participants
  found users twice as likely to produce the intended regex with Regel.


  The PBE-only ablation shares Regel's search engine, so the sketch
  contribution is isolated; the AlphaRegex comparison also controls for sketch
  access. Weaker points: sketch training labels were hand-written for the
  StackOverflow set, and the interactive protocol feeds 2 extra examples per
  failed iteration up to 4 iterations.


  How far this generalizes past a restricted regex DSL, and whether modern
  seq2seq or LLM parsers would close the gap, is untested.


  If you treat natural language as the whole specification, this argues
  examples are the cheaper way to resolve its ambiguity.
