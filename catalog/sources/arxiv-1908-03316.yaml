brief: >-
  Combining a natural-language sketch with positive/negative examples solves
  far more regex synthesis tasks than either modality alone. The claim is that
  English descriptions give the scaffolding and examples resolve the
  ambiguity, and neither works well in isolation.


  Regel parses an English description with a SEMPRE-based semantic parser into
  a "hierarchical sketch" with constrained holes, then runs a
  programming-by-example engine that uses the sketch hints to prune via
  over/under-approximations and solves integer constants in Repeat operators
  with Z3. Evaluation covers over 300 regexes: 200 adapted from the DeepRegex
  data set (average 4 positive and 5 negative examples each) and 122 harder
  tasks scraped from StackOverflow with ground truth transcribed into their
  DSL.


  Regel finds the intended regex in 80% of cases, against 43% for DeepRegex
  (NLP only) and 26% for a pure PBE variant of the same engine. Against an
  adaptation of AlphaRegex given the same sketch, sketch completion is an
  order of magnitude faster. A user study with 20 participants found users
  twice as likely to produce the intended regex with Regel.


  The ablation is well matched: Regel-Pbe is the same search engine with a
  single unconstrained hole, so the gain is attributable to the sketch. But
  h-sketch training labels were hand-written by the authors for the
  StackOverflow set, which couples the result to their own annotation choices,
  and benchmarks count as solved if the target is in the top k (1 for
  DeepRegex data, 5 for StackOverflow).


  If you build program synthesizers, this is evidence that cheap, imprecise NL
  parses are useful as search guidance rather than as final output.
