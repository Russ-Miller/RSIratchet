brief: >-
  RL-finetuned vision-language models can be flipped by text alone: inserting
  a misleading caption, or seeding the chain-of-thought with a wrong premise,
  drops accuracy on basic spatial questions that humans would answer
  unchanged, and models often give the right answer while their CoT asserts
  the opposite.


  The setup covers 5 open models finetuned from Qwen2.5-VL-7B-Instruct
  (SpaceR, Video-R1, Vision-R1, VLAA-Thinker, ViGoRL-Spatial), plus o3,
  o4-mini, Gemini-2.5-Pro and Gemini-3.1-Pro, on 3DSRBench, CV-Bench,
  Spatial-MM, WhatsUp and 3 further VQA sets, with Stop-Think, Wrong-Think and
  Wrong-Caption perturbations.


  Adding an uninformative think tag leaves accuracy roughly flat but raises
  answer entropy for every model (Vision-R1 from 2.4 × 10 − 5 to 0.10 on
  3DSRBench). Confidence under the clean prompt predicts robustness: P base
  reaches AUROC 0.958 for SpaceR on Stop-Think vs 0.732 for negative entropy,
  while Vision-R1 sits at 0.565, near chance. Faithfulness judging used 3
  judges with 89.2-94.2 strict 3-way agreement.


  Evidence is measured, with judge triangulation, an abstention control
  showing failures are not mere uncertainty, and controlled GRPO runs over 3
  data mixtures. Caveats: 1 main base model, 7B scale, seed variance sometimes
  exceeding dataset effects, closed-model Wrong-Think only approximated by
  prompting.


  Adversarial augmentation fixes caption robustness but not faithfulness
  drift; a faithfulness reward aligns CoT but collapses onto shortcuts when
  combined. Treat accuracy-only VLM scores as unreliable about reasoning.
