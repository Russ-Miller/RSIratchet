brief: >-
  RL-finetuned vision-language models can keep their accuracy under misleading
  text while their chain-of-thought asserts the opposite, and RL training
  itself widens that gap between answer and reasoning.


  5 open-source reasoning models finetuned from Qwen2.5-VL-7B-Instruct
  (SpaceR, Video-R1, Vision-R1, VLAA-Thinker, ViGoRL-Spatial) plus o3,
  o4-mini, Gemini-2.5-Pro and Gemini-3.1-Pro were tested on 3DSRBench,
  CV-Bench, Spatial-MM and WhatsUp under 3 perturbations: suppressed reasoning
  (Stop-Think), a seeded wrong CoT (Wrong-Think), and a misleading caption
  (Wrong-Caption).


  Misleading captions and CoT prefixes cut accuracy across open models, with
  recovery when a disclaimer like "but I think" is appended; answer entropy
  rises under Stop-Think for every model (Vision-R1 from 2.4e-5 to 0.10 on
  3DSRBench). Base-prompt probability on the correct letter predicts
  robustness better than entropy (SpaceR AUROC 0.958 vs 0.732 for Stop-Think;
  Vision-R1 0.565). Controlled GRPO runs on SAT2+Pixmo-Count, with and without
  Geometry3K and with correct/incorrect caption and think augmentation, show
  accuracy rising while faithfulness drifts down.


  Faithfulness is judged by Qwen3-32B, cross-checked against GPT-OSS-120B and
  Llama-3.1-70B-Instruct with 89.2–94.2% strict 3-way agreement. The
  finetuning arms are a dataset-composition ablation, not a matched-budget
  comparison, and the authors flag seed variance exceeding dataset effects.


  All base models are 7–8B Qwen2.5-VL or InternVL3; closed models could not be
  forced to start from the wrong CoT, only prompted to. Adding faithfulness to
  the reward enforces consistency but collapses onto shortcuts when combined
  with augmentation.


  Treat accuracy on spatial VQA benchmarks as uninformative about whether the
  CoT matches the answer.
