summary: >-
  Large language models are being organized into multi-agent systems with
  specialized roles, but whether such specialization produces distinct
  forecasts and whether subsequent synthesis improves utility remains
  unclear. In this study, we carried out a live, prospective evaluation over
  the final 56 matches of the information-dense 2026 FIFA World Cup, keeping
  a frontier foundation model constant while assigning two primary
  forecasting agents contrasting specialist roles: a quantitative specialist
  focusing on structured performance statistics and a news specialist
  focusing on current injuries, tac
