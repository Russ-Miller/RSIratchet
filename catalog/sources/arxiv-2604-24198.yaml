brief: >-
  Process reward models trained on math transfer badly to data analysis
  agents: they mark logically wrong code as correct when it executes cleanly,
  and punish exploratory steps that recover. Giving the verifier its own code
  interpreter and a 3-valued reward fixes both.


  DataPRM is a 4B generative PRM in the ReAct loop that runs code against the
  data, calls document and image tools, and scores each agent step as 1.0, 0.5
  (correctable grounding error), or 0.0. Training used 7K step annotations
  from Qwen3-235B-A22B-Instruct trajectories, labelled by DeepSeek-V3.2.
  Evaluation: 78 data-analysis tasks from ScienceAgentBench and DABStep, with
  Qwen3-235B-A22B-Instruct as policy.


  At Best-of-16 on DABStep DataPRM reaches 40.89% average versus 38.00%
  majority vote, 39.77% self-rewarding with the 235B policy, and 29.11% for
  Qwen2.5-Math-PRM-72B, which degrades as N grows (31.33% at 8). RL with the
  process reward hits 78.73% on DABench and 64.84% on TableBench, with entropy
  holding near 0.18 instead of collapsing to 0.12 under outcome-only reward.


  Ablations isolate the pieces: environment access, multi-turn, and ternary
  reward each add, and the Hard subset moves 32.01%→32.80%→33.86%. Filtering
  ablation is included; aggressive filtering hurts at N=16.


  One policy model, one PRM size, no ML/DL or model-training tasks. If you
  supervise code agents, text-only step verification is the weak link.
