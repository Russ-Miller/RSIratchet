summary: >-
  While Multimodal Large Language Models (MLLMs) have achieved remarkable
  progress across diverse tasks, they suffer from hallucinations where
  generated outputs contradict or misrepresent input semantics. Existing
  research typically addresses hallucination detection within a single
  modality or task type, limiting generalizability. We introduce OmniHallu,
  a unified hallucination detection framework spanning both comprehension
