summary: >-
  Three-way logical question answering (QA) assigns one of $\text{True}$,
  $\text{False}$, or $\text{Unknown}$ to a hypothesis $H$ given a premise
  set $S$. We study this task as a compact compositional inference problem:
  predictions for $H$ and for a mechanically negated hypothesis $\neg H$
  should agree under a deterministic negation map. Despite this simple
  structure, large language models (LLMs) can exhibit two practical failure
  modes: (i) negation inconsistency, where answers to $H$ and $\neg H$
  violate the required label mapping, and (ii) epistemic $\text{Unknown}$,
  where the model abstains e
