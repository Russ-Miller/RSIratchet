summary: >-
  Future 6G networks will rely on Large Language Model (LLM) agents to
  manage the Radio Access Network (RAN). However, current architectures
  assume inter-agent messages convey objective facts. A message is instead a
  \emph{trace} of the sender's reasoning: it carries a subjective
  conclusion, so a syntactically valid report can propagate an AI
  hallucination and trigger a cascading outage invisible to protocol
  validation. Reading such a trace requires a Theory of Mind (ToM)---before
  acting, the receiver must model what the peer believes, and what a peer in
  that position should have believed. Modeli
