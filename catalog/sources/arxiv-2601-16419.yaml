brief: >-
  Telling a multimodal model about a domain in text does not help it; encoding
  the same prior as an optimization constraint does. Domain prompts and
  auxiliary captions left Qwen2.5-VL essentially unchanged on remote sensing
  classification, and captions generated by an MLLM made it worse (UCM 8.91 to
  6.42, NWPU 14.9 to 10.5).


  The proposed fix runs GRPO with Visual-RFT reward functions plus 2
  additions: a KL constraint between the policy distribution and the
  distribution obtained from domain-transformed inputs (random rotation for
  remote sensing, symmetric transforms for medical imaging), and advantage
  reweighting by the JS divergence to that same distribution. Tested on 6
  remote sensing datasets, 5 MedMNIST v2 datasets, and DIOR grounding, under
  1/2/4/8-shot, with Qwen2.5-VL-3B (7B for grounding).


  Average gains over SFT were +2.9, +2.6, +4.7, +7.8 points on remote sensing
  across 1- to 8-shot, +0.6 to +2.7 on medical imaging, and +3.2 and +2.5 mAP
  on DIOR grounding.


  Effects are measured with matched-shot SFT and Visual-RFT baselines, plus
  ablations separating the constraint from the reward shaping, an output-level
  constraint comparison, and a data-augmentation control (SFT+DA stays at 10.2
  vs 16.1 at 1-shot) that isolates the gain from the augmentation itself.


  Boundaries: 1 model family, few-shot only, 2 hand-chosen priors, no
  compute-matched check on RL's extra forward passes, and medical gains are
  small at 1-shot.


  If you are adapting a VLM to a specialist domain, treat priors as reward
  structure rather than prompt text.
