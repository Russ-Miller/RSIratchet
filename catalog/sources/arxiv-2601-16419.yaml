summary: >-
  Multimodal large language models (MLLMs) have shown remarkable
  capabilities in multimodal perception and understanding tasks. However,
  their effectiveness in specialized domains, such as remote sensing and
  medical imaging, remains limited. A natural approach to domain adaptation
  is to inject domain knowledge through textual instructions, prompts, or
  auxiliary captions. Surprisingly, we find that such input-level domain
  knowledge injection yields little to no improvement on scientific
  multimodal tasks, even when the domain knowledge is explicitly provided.
