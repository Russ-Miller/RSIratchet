brief: >-
  Pixel-level segmentation metrics do not track whether a vision-language
  model downstream still describes a scene correctly. Moderate drops in
  conventional segmentation scores coincide with severe language-side
  failures.


  The setup uses semantic segmentation on Cityscapes as a stand-in upstream
  perception module, feeding its output into multiple contrastive and
  generative VLMs. Corruptions are designed to be perception-realistic rather
  than adversarial, and applied under controlled conditions so degradation
  magnitude is known.


  Reported failures are hallucinated object mentions, omission of
  safety-critical entities, and inconsistent safety judgments. The authors
  define language-level misalignment metrics for hallucination, critical
  omission, and safety misinterpretation, and relate them to segmentation
  quality. The source text gives no numeric results, so the size of the gap
  between segmentation loss and semantic failure is stated qualitatively only.


  Evidence is a measured correlation study across several VLMs on 1 dataset,
  with corruption severity as the manipulated variable, which does isolate
  perception degradation as the cause. The misalignment metrics are proposed
  by the same authors and not externally validated.


  Boundary: 1 perception task, 1 urban driving dataset, no test of whether
  end-to-end VLMs that skip an explicit segmentation stage behave the same
  way.


  If you evaluate a perception stack by mIoU alone, this argues that number is
  not a safety guarantee for anything downstream.
