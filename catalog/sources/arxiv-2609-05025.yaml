summary: Hallucination-where a language model generates outputs that are
  factually incorrect or unsupported by the source-is a major challenge for
  both prompted and fine-tuned language models. Detecting hallucinations is
  difficult due to the opaque reasoning processes of LLMs, which often provide
  little insight into why a model's output may be inaccurate. In this work, we
  investigate whether an LLM can use an alternative, low level, symbolic
  competence such as SQL for unsupervised hallucination detection in some high
  level task. For this, we make an LLM build an SQL database from reference
  documents. T
