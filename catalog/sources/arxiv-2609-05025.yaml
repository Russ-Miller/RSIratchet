brief: >-
  Making an LLM dump reference documents into a SQL database, then querying
  it, raises unsupervised hallucination detection to roughly the level of
  supervised fine-tuned detectors, mainly by cutting false positives.


  TeQHallu is a 5-step pipeline: inspect schema, find missing facts, insert
  tuples, generate SELECT queries against the sampled response's claims, then
  reconcile the SQL evidence with an initial neural-only judgement. Evaluation
  covers RAGTruth (question answering, data-to-text, summarisation, 900
  document-response pairs per test set) and the task-oriented portion of
  DiaHalu (210 dialogues), with Gemini-2.5-Flash as the main backbone.


  On RAGTruth, macro F1 rises from 61.6 for direct prediction to 71.3, above
  fine-tuned Llama-2-13B (71.8 precision-recall profile aside, 71.8 F1 is
  comparable) and lettuceedetect-large-v1 (72.8), below RAG-HAT (78.0).
  Precision moves 48.2 to 61.7. On DiaHalu, F1 goes 53.48 to 58.11.


  The design isolates the cause reasonably well: matched-prompt direct
  prediction, an atomic-fact-checking baseline (65.7), a JSON key-value
  baseline (64.9), and an ablation showing strict symbolic ID intersection is
  worse (39.7) than feeding IDs to the LLM. A manual audit of 150 documents
  puts SQL parsing accuracy at 85.33%, with cascading errors in 5.33% of
  cases. Gains shrink on weaker text-to-SQL backbones: GPT-OSS sees 68.7 to
  68.6.


  Costs are 5 API calls and ~4.5k-9.7k input tokens per sample versus 1 call.
  No human evaluation of the claimed interpretability benefit.


  Worth considering if you want auditable detection without fine-tuning and
  can pay 5x inference.
