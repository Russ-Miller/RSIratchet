brief: >-
  Building an explicit evidence graph before generating a question, rather
  than after, is what makes synthetic long-context SFT data hard and faithful
  enough to matter. LongCrafter pairs a hand-built taxonomy of 32 fine-grained
  long-context task types with a 3-stage pipeline: task-aligned context
  assembly, extraction of cross-paragraph evidence nodes and dependency edges,
  then instruction and citation-by-step response generation, all run with
  GLM-5 to produce 2,000 samples.


  Trained with LoRA on Qwen2.5-7B and LLaMA-3.1-8B, the data reaches overall
  averages of 45.15% and 45.71% across LongBench, LongBench v2 and LooGLE,
  beating the second-best SFT baseline by +5.80 and +5.30 points and the
  official post-trained models by +2.41 and +5.25. With gold evidence moved
  among 20 candidate documents, retrieval accuracy stays near-perfect at
  positions 1-20, while baselines fall to about 71% (LongFaith on LLaMA) and
  40% (LongReward on Qwen).


  Evidence is measured, with matched 2,000-sample budgets across 4 baselines,
  2 backbones, and ablations: dropping the evidence graph costs 12.64 and
  11.89 points; dropping citations costs 5.25 and 4.08. Weaker points: data
  quality and difficulty are scored by GPT-5 as judge (human ICC 0.82/0.87,
  Spearman 0.63/0.74), answer correctness is also GPT-5-judged, LooGLE uses
  100 sampled examples per subtask, and only 7-8B models with LoRA were
  tested.


  If you synthesize long-context training data, order the pipeline so evidence
  structure precedes question generation.
