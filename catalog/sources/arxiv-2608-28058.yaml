brief: >-
  Hallucinated tokens in vision-language models carry a measurable signature
  in hidden states: large Jensen-Shannon divergence between adjacent decoder
  layers and large drift across decoding steps, both concentrated in
  middle-to-late layers. Damping those two divergences at inference reduces
  hallucination without training.


  Dynamic Alignment Compensation (DAC) adds a residual from the previous layer
  when inter-layer JS exceeds a threshold (LSC) and pulls the current-token
  state back toward a cached previous-step state when temporal JS exceeds a
  threshold (SSC). It is evaluated on 9 benchmarks (POPE, CHAIR,
  HallusionBench, MME, MM-Vet, MMBench, MMBench-CN, TextVQA, LLaVA-Bench)
  across LLaVA-1.5, Qwen-VL-Chat, Qwen2.5-VL-3B/7B, Qwen3-VL-4B,
  LLaVA-NeXT-7B.


  On LLaVA-1.5, CHAIR Cs/Ci falls from 47.6/13.3 to 28.2/7.3, POPE average
  accuracy rises 79.83 to 87.32, HallusionBench qACC 8.13 to 17.05. Per-token
  latency goes from 36.8 to 37.1 ms.


  The component ablation on MM-Vet separates LSC (33.3) from SSC (33.0)
  against a 31.1 baseline, and dataset-level JS diagnostics on CHAIR back the
  mechanism. Recall drops on CHAIR (80.6 to 72.0) and output length shortens
  (99.7 to 88.9); the length-normalized check is deferred to an appendix.
  Comparisons come from 1 group, no independent replication.


  Untested: closed-source models, video, multi-image, long-context. Thresholds
  are fixed, not tuned per dataset.


  If you run open-source LVLMs, this is a near-free decoding change worth
  trying before contrastive decoding methods that cost 2x latency.
