summary: >-
  Background. Large language models are increasingly used to help write
  biomedical text but may fabricate references to nonexistent work. How
  often large language models do so is not well characterized. Methods. We
  prompted 26 language models from eight developers (2023 to 2026) to supply
  a missing reference for each of 69 biomedical passages across ten domains.
  References were classified as verifiable (real paper with a resolving
  identifier), partial matches (real paper without a resolving identifier),
  fabricated (no matching indexed paper), or declined (the model refused to
  supply a reference)
