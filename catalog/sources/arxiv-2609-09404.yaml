summary: >-
  Agentic AI frameworks let a language model plan, keep memory, and call
  tools that reach real files, mail, and services. Most of these agents also
  read images, which gives an attacker a way to put text into the agent's
  context without going through the user. We present MMPIBench, a
  reproducible benchmark that measures what happens next. It delivers a
  fixed set of attacks through six visual carriers (OCR text, overlays, EXIF
  metadata, QR codes, fake interfaces, and hybrids) and records how far each
  injected instruction travels through the agent, from perception through
  planning to the tool call.
notes: >-
