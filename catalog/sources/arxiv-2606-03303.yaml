brief: >-
  A general-purpose LLM that cannot prove a single Lean theorem in one shot
  can reach state-of-the-art formal proving once wrapped in a
  decomposition-plus-compiler-feedback loop, with no specialized prover model.
  LEAP builds an AND-OR DAG of subgoals, drafts informal blueprints,
  translates them into sorry-gated Lean sketches, and uses an LLM reviewer to
  reject useless decompositions. Backend is Gemini-3.1-pro; baselines are
  Gemini-3.1-pro alone, Goedel-Prover-V2-32B, Hilbert, and Aristotle, on
  Putnam 2025 and a new Lean-IMO-Bench of 60 expert-formalized IMO-ProofBench
  statements.


  On Putnam 2025, both direct baselines solve 0.0 at pass@128; Hilbert 33.3,
  Aristotle 75.0, LEAP 100.0 with rollout=2. On Lean-IMO-Bench, LEAP reaches
  83.3% Basic and 56.7% Advanced against Gemini-3.1-Pro at 20.0/3.3 and
  Aristotle at 76.7/20.0.


  Two ablations isolate parts of the design. Removing DAG sharing drops Basic
  from 83.3 to 73.3 and Advanced from 56.7 to 40.0; compiler-feedback revision
  lifts Gemini from 20.0 to 36.6 Pass@1 while Goedel falls from 10.0 to 6.6.
  The reviewer ablation rests on 1 problem, Putnam A5.


  Geometry stays near zero for every method (16.7 Basic, 12.5 Advanced for
  LEAP). Budgets are not matched: LEAP uses up to 3.0k LLM calls on A5,
  Aristotle is closed-source, and Hilbert was time-capped at 7 days.


  If you assumed formal proving needs fine-tuned provers, the bottleneck looks
  more like scaffolding than language.
