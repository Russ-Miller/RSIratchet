brief: >-
  Hallucination splits into separable failure modes rather than one
  capability: frontier models read directly observed state almost perfectly
  while still failing at multi-step state tracking, forward simulation, and
  knowing when to abstain. Extended thinking does not reliably fix the latter.


  HalluWorld specifies a reference world, a view function, and a conflict
  policy, then auto-labels errors in 3 domains: MiniGrid gridworlds (33
  levels, 839 probes, 3 serializers), chess from Lichess positions advanced by
  k=14 random legal moves (7 levels, 350 probes), and terminal traces from 132
  Terminal-Bench trajectories over 110 tasks (529 probes). 5 probe categories
  (perceptual, memory, causal, uncertainty, compound) are scored rule-based,
  no LLM judge.


  In gridworlds reasoning models reach 5.0-8.1% overall hallucination vs
  12.6-15.4% for non-reasoning frontier and open models, but causal probes
  stay high (Opus 4.6 20.1%, GPT-5.5 25.3%). Thinking lowered perceptual error
  (Sonnet 2.8%->1.1%) and raised causal error (19.7%->24.0%). Terminal
  uncertainty probes are hardest: GPT-5.5 and o3 cap at 76.9% accuracy.


  The serializer and FEN manipulations are clean one-factor variations, and
  ground truth comes from simulator state. The thinking vs non-thinking
  terminal comparison is not budget-matched: 16384 vs 256 output tokens, which
  the authors flag as an upper bound. Terminal probes were generated and
  difficulty-rated by gpt-5.4 itself.


  Use it if you want hallucination reported per failure mode instead of as one
  number.
