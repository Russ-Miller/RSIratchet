summary: >-
  Multimodal large language models excel on short clips but struggle on
  hour-long videos in an online setting, where frames are processed
  incrementally under limited memory. Existing online methods either retain
  compact visual representations that lack semantic structure, or build
  higher-level memory stores organized around temporal proximity rather than
  explicit causal links, leaving multi-hop narrative reasoning to be
  reconstructed by the LLM at every query. We bridge this gap with
  \textsc{Homer}, a Hierarchical Online Memory Exploration and Reasoning
