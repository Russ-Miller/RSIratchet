brief: >-
  Letting an autoformalizer call a Lean 4 compiler and an LLM consistency
  judge mid-generation, then revise, lifts semantic consistency far more than
  training on more informal-formal pairs does.


  ATF trains Qwen3-32B in 3 stages: cold start on 24K Claude-4-Sonnet
  tool-calling trajectories, expert iteration over a 178,469-entry
  NuminaMath-1.5 subset, then DPO on 10K pairs favoring fewer revisions.
  Evaluation covers FormalMath-Lite, ProverBench, and out-of-distribution
  CombiBench, 16 samples at temperature 0.6.


  ATF-32B Pass@1 consistency reaches 94.51% on FormalMath-Lite, 89.78% on
  ProverBench, and 65.38% on CombiBench, beating Goedel-V2-Formalizer-32B by
  9.1%, 10.08%, and 29.13%. Human evaluation on 100 instances per benchmark, 3
  experts each, gives 95.00/85.00/49.00 versus 92.00/81.00/22.00.


  The effect is isolated by ablation: removing both tools drops CombiBench
  consistency to 23.69% Pass@1, syntax-check-only reaches 41.68%. Revision
  budget was capped so output lengths roughly match Goedel-V2-Formalizer-32B,
  an approximate rather than exact token-matched baseline. The consistency
  metric uses the same QWQ-32B plus Qwen3-32B ensemble the model trains
  against; its correlation with human judgment is 0.746, and its FNR is
  0.4033.


  Only 1 base model family and Lean 4 v4.15 were tested, and the tool judges
  nothing about provability. If you build formalizers, verifier feedback in
  the loop looks cheaper than more data.
