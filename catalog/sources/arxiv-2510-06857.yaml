brief: >-
  Giving an autoformalizer live access to a Lean 4 compiler and an LLM
  consistency judge during generation, rather than only training on clean
  informal-formal pairs, moves semantic consistency far more than syntax. ATF
  trains Qwen3-32B in 3 stages (cold-start on 24K Claude-4-Sonnet tool-calling
  trajectories from NuminaMath-1.5, expert iteration, then DPO on 10K pairs
  favoring fewer revisions) and calls a syntax tool plus an ensemble vote of
  QWQ-32B and Qwen3-32B for consistency, evaluated on FormalMath-Lite,
  ProverBench and out-of-distribution CombiBench against Kimina, StepFun and
  Goedel-V2 formalizers.


  ATF-32B reaches Pass@1 consistency of 94.51% on FormalMath-Lite, 89.78% on
  ProverBench and 65.38% on CombiBench, beating Goedel-V2-Formalizer-32B by
  9.1%, 10.08% and 29.13%. Human evaluation on 100 sampled instances per
  benchmark, 3 experts each, gives 95/85/49 vs 92/81/22 for Goedel-V2-32B.


  Ablations isolate the tools: removing both drops CombiBench consistency to
  23.69% Pass@1; syntax-only reaches 41.68%. Revision budget was capped so
  output length roughly matched Goedel-V2-Formalizer-32B, which is the nearest
  thing to a matched-budget comparison. Consistency is scored by the paper's
  own judge tool, correlating 0.746 with humans, and the judge's ensemble has
  a 0.4033 false negative rate.


  Only 1 base family was trained, and consistency gains per revision decay
  sharply, from 69.5% on attempt 1 to 8.8% on attempt 8.


  If you generate formal statements at scale, add compiler and judge feedback
  in-loop before buying a bigger formalizer.
