ingested_at: 2026-09-19
brief: >-
  Letting a formalizer call a Lean 4 compiler and an LLM consistency judge
  mid-generation, then revise, lifts semantic consistency far more than
  scaling the model does. ATF trains Qwen3-32B in 3 stages: cold start on 24K
  Claude-4-Sonnet tool-call trajectories, expert iteration over a
  178,469-query NuminaMath-1.5 subset, then DPO on 10K pairs to cut useless
  revisions.


  Against Kimina-Autoformalizer-7B, StepFun-Formalizer-7B/32B and
  Goedel-V2-Formalizer-8B/32B on FormalMath-Lite, ProverBench and
  out-of-distribution CombiBench, ATF-32B Pass@1 consistency reaches 94.51%,
  89.78% and 65.38%, beating Goedel-V2-Formalizer-32B by 9.1%, 10.08% and
  29.13%. On CombiBench it hits 100% syntax and 96.00% consistency at Pass@16.
  Revision budget was capped so output length roughly matched
  Goedel-V2-Formalizer-32B.


  The cause is isolated by ablation: removing both tools drops CombiBench
  consistency Pass@1 to 23.69%, syntax-only gives 41.68%, and each training
  stage is reported separately. Human evaluation on 100 sampled instances per
  benchmark, 3 experts each, agrees with the tool judge at Pearson 0.746.


  Limits: 1 base model family, 1 Lean version (4.15), consistency judged
  largely by an ensemble of QWQ-32B and Qwen3-32B whose own FPR is 0.0579 and
  recall only 0.5967, and no downstream prover results. Revision success
  decays from 69.5% on attempt 1 to 8.8% by attempt 8.


  If you generate formal statements, budget for verifier-in-the-loop revision
  rather than a bigger formalizer.
