brief: >-
  Letting a formalizer call a Lean 4 compiler and an LLM consistency judge
  during generation, then revise, fixes most of what specialized
  autoformalizers get wrong, especially semantic misalignment.


  ATF trains Qwen3-32B (and an 8B distilled variant) in 3 stages: cold-start
  on 24K Claude-4-Sonnet tool-calling trajectories from a 178k NuminaMath-1.5
  subset, expert iteration, then DPO on 10K pairs to cut ineffective
  revisions. Evaluation covers FormalMath-Lite, ProverBench, and
  out-of-distribution CombiBench, 16 samples at temperature 0.6, against
  Kimina-Autoformalizer-7B, StepFun-Formalizer-7B/32B, and
  Goedel-V2-Formalizer-8B/32B.


  ATF-32B Pass@1 consistency reaches 94.51% on FormalMath-Lite, 89.78% on
  ProverBench, and 65.38% on CombiBench, beating Goedel-V2-Formalizer-32B by
  9.1%, 10.08%, and 29.13%. Human evaluation on 100 instances per benchmark, 3
  experts each, gives 95.00 / 85.00 / 49.00 versus 92.00 / 81.00 / 22.00.


  Ablations isolate the tools: removing both drops CombiBench consistency to
  23.69% Pass@1; syntax-only reaches 41.68%. Revision count was capped to make
  output length roughly match Goedel-V2-Formalizer-32B, so the budget
  comparison is approximate, not matched. The consistency metric and the
  training signal share the same judge, and the judge's own recall is low
  (ensemble TPR 0.5967); human-tool Pearson correlation is 0.746.


  If you build formalization pipelines, verifier-in-the-loop generation is
  worth more than more supervised pairs.
