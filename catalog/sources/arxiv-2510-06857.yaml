brief: >-
  Letting an autoformalizer call a Lean 4 compiler and an LLM-judge
  consistency checker during generation, then revise, closes most of the
  semantic-alignment gap that end-to-end formalizers leave open.


  ATF trains Qwen3-32B in 3 stages: cold start on 24K Claude-4-Sonnet
  tool-calling trajectories, expert iteration on a 178,469-entry
  NuminaMath-1.5 subset, and DPO on 10K pairs favoring fewer revisions.
  Evaluation covers FormalMath-Lite, ProverBench, and out-of-distribution
  CombiBench against Kimina-Autoformalizer-7B, StepFun-Formalizer-7B/32B, and
  Goedel-V2-Formalizer-8B/32B, with 16 samples at temperature 0.6.


  ATF-32B reaches Pass@1 consistency of 94.51% on FormalMath-Lite, 89.78% on
  ProverBench, and 65.38% on CombiBench, beating Goedel-V2-Formalizer-32B by
  9.1%, 10.08%, and 29.13%. Human evaluation on 100 instances per benchmark, 3
  experts each, gives 49.00% on CombiBench versus 22.00% for the strongest
  baseline.


  Ablations isolate the tools: removing both drops CombiBench consistency to
  23.69% Pass@1, and syntax check alone gives 41.68%. Output lengths were
  tuned to roughly match Goedel-V2-Formalizer-32B, so the budget comparison is
  approximate rather than controlled. The consistency judge is an ensemble of
  QWQ-32B and Qwen3-32B with FPR 0.0579 but FNR 0.4033, and correlates with
  human judgment at 0.746.


  Only 1 base model family and Lean 4 v4.15 were tested; proof success
  downstream was not measured.


  If you build formalization pipelines, verifier-in-the-loop generation is
  worth more than more training data.
