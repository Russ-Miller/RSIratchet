brief: >-
  Letting a formalizer call a Lean 4 compiler and an LLM consistency judge
  during generation, then revise, raises semantic consistency far more than
  training on more informal-formal pairs does.


  ATF trains Qwen3-32B in 3 stages: cold-start on 24K Claude-4-Sonnet
  tool-calling trajectories, expert iteration over a 178,469-query
  NuminaMath-1.5 subset, and DPO on 10K pairs favouring fewer revisions. The
  consistency tool is an ensemble vote of QWQ-32B and Qwen3-32B, chosen on an
  800-query perturbation benchmark where it cut false positive rate to 0.0579
  versus 0.0950 for Qwen3-32B alone.


  On FormalMath-Lite, ProverBench and CombiBench, ATF-32B reaches Pass@1
  consistency of 94.51%, 89.78% and 65.38%, beating Goedel-V2-Formalizer-32B
  by 9.1%, 10.08% and 29.13%. Human evaluation on 100 instances per benchmark,
  3 experts each, gives 95.00, 85.00 and 49.00 versus 92.00, 81.00 and 22.00.


  Ablations isolate the tools: removing both drops CombiBench consistency to
  23.69% Pass@1; syntax-only gives 41.68%. Revision attempts were capped so
  output lengths roughly match the strongest baseline, which is the closest
  thing to a matched-budget comparison. Baselines do not get the same tool
  loop, so part of the gap is tool access rather than training.


  One model family, Lean 4 v4.15, competition math only. Consistency is partly
  scored by the same judge ATF trains against; Pearson correlation with humans
  is 0.746. Treat verifier-in-the-loop generation as the cheaper lever than
  more formalization data.
