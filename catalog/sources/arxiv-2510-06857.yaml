brief: >-
  Letting a formalizer call a Lean 4 compiler and an LLM-judge consistency
  checker during generation, then revise from the feedback, raises semantic
  consistency far more than training on more informal-formal pairs does.


  ATF trains Qwen3-32B in 3 stages: cold start on 24K Claude-4-Sonnet
  tool-calling trajectories, expert iteration over a 178,469-query subset of
  NuminaMath-1.5, then DPO on 10K pairs favouring fewer revisions. Consistency
  checking uses an ensemble vote of QWQ-32B and Qwen3-32B, which cut false
  positive rate from 0.0829/0.0950 to 0.0579 on an 800-query perturbation
  benchmark. Evaluation covers FormalMath-Lite, ProverBench, and
  out-of-distribution CombiBench, 16 samples at temperature 0.6.


  ATF-32B Pass@1 consistency reaches 94.51%, 89.78%, and 65.38%, beating
  Goedel-V2-Formalizer-32B by 9.1%, 10.08%, and 29.13%. On 100 human-rated
  instances per benchmark, ATF-32B scores 95/85/49 against 92/81/22 for
  Goedel-V2-32B; tool and human judgments correlate at 0.746.


  Ablations isolate the cause: removing both tools drops CombiBench
  consistency to 23.69% Pass@1, syntax-only to 41.68%. Output length was
  matched to Goedel-V2-Formalizer-32B, so the gain is not just extra tokens.


  Boundaries: 1 base model family, Lean 4 v4.15, competition math only, and
  consistency success per revision decays from 69.5% to 8.8% by the 8th
  attempt.


  If you build formalization pipelines, put the verifier inside the loop
  rather than after it.
