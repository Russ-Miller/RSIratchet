brief: >-
  Video LLMs that handle object and event existence well still fail at
  reasoning about relations between events, often falling below random chance
  when asked to classify causal, temporal, or subevent links. VERHallu builds
  this test from counterintuitive but physically grounded clips: Mr. Bean
  episodes and 2 films, about 25 hours of source, cut into 574 clips of
  roughly 1-2 minutes, yielding 7676 verified samples across 967 QA, 967
  counterfactual QA, and 5742 relation classification items, with
  human-written distractors reflecting language-only and vision-language
  priors.


  Across 14 open 7B-8B models, all except VideoLLaMA3-7B score below the
  random baselines of 33.3% on relation classification, and most QA accuracy
  sits under 40%. Human accuracy is 86.9-96.8%. MVBench rank does not predict
  VERHallu rank: InternVL-3-8B leads MVBench at 75.4 but scores 15.6 on CFQA.
  Scale does not fix it; Qwen-VL-2.5-72B gets 31.0/34.1/33.4 on the 3 RC
  types. The proposed training-free Key-Frame Propagating method reweights
  frames around top-k key frames in layers 8-15, lifting LLaVA-NeXT-7B
  RC-Subevent by +39.1% and SRH from 6.5 to 17.9, while costing CFQA -6.0% on
  QwenVL-2.5-7B.


  KFP is compared against VCD at similar inference speed, with ablations on
  layer range, m, and beta, but only 2 models carry it. The benchmark is 1
  narrow visual domain. Treat existing video hallucination scores as
  uninformative about relational reasoning.
