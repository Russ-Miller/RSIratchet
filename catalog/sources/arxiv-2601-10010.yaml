brief: >-
  VideoLLMs that look strong on video benchmarks mostly fail at inferring
  relations between events, performing at or below chance on directional
  relation classification. VERHallu builds 7676 manually verified samples from
  574 clips cut from Mr. Bean episodes and films (about 25 hours), covering
  causal, temporal, and subevent relations across 3 task types: relation
  classification (5742 samples), question answering (967), and counterfactual
  QA (967) where the queried event is absent.


  Across 14 open 7B-8B models, all except VideoLLaMA3-7B score below the 33.3
  random baseline on relation classification; most QA accuracy sits under 40%.
  MVBench rank does not transfer: InternVL-3-8B scores 75.4 on MVBench but
  15.6 on CFQA. Larger models do not fix it (Qwen-VL-2.5-72B: 28.9 QA-Causal),
  and ChatGPT-4o reaches 24.5 RC-Causal against human 86.9.


  The mitigation, Key-Frame Propagating, reweights visual tokens around top-k
  attended frames in layers 8-15 at inference. It is measured against the
  unmodified model and against VCD. LLaVA-NeXT-7B RC-Subevent goes 16.7 to
  55.8, SRH 6.5 to 17.9; QwenVL-2.5-7B SRH 27.8 to 43.5 but CFQA drops 6.0.


  Layer and hyperparameter ablations (m=5, beta=0.6) are reported; only 2
  models were modified, and the data come from 1 narrow comedy domain. Treat
  prior hallucination scores as uninformative about relational reasoning.
