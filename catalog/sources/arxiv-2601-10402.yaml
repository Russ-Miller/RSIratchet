brief: >-
  Tiering an agent's context by how stable and reusable each piece is, rather
  than just summarizing history linearly, raises performance on 24-hour
  machine learning engineering tasks. ML-Master 2.0 organizes context into 3
  caches: raw execution traces for the active phase, phase-level distilled
  knowledge, and task-level wisdom embedded and retrieved across tasks, with
  explicit promotion and eviction rules between tiers.


  Evaluation is on OpenAI's MLE-Bench, 75 Kaggle competitions, with
  Deepseek-V3.2-Speciale as backbone, 24-hour budget per task, 2 RTX 4090
  GPUs, and 407 non-overlapping Kaggle competitions used to warm up the wisdom
  store. Baselines are taken from previously reported MLE-Bench numbers, not
  re-run.


  Average medal rate is 56.4%, against 50.7% for Leeroo on
  Gemini-3-pro-preview and 29.3% for ML-Master on Deepseek-R1. By complexity:
  75.8% low, 50.9% medium, 42.2% high. Valid submission rate 95.6%,
  above-median 63.1%, gold 19.6% which is below FM Agent's 22.7%.


  Main results average 3 seeds. The ablation does not: it is 1 run per
  configuration on MLE-Bench-Lite, 1 backbone. Removing L1 drops medal rate to
  22.7%, removing L2 to 59.1%, removing L3 to 54.5%. The context-length claim,
  200k down to ~70k, comes from 1 task. No matched-token-budget baseline, and
  backbone differs from every comparison system, so architecture and model are
  confounded.


  Treat the headline as strong evidence for hierarchical context on MLE, weak
  evidence for which tier does the work.
