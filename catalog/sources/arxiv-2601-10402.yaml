brief: >-
  Tiering an agent's context by how stable and reusable each piece is, rather
  than concatenating or summarizing history linearly, raises performance on
  24-hour machine learning engineering runs. ML-Master 2.0 implements this as
  Hierarchical Cognitive Caching: L1 holds raw execution traces for the active
  research phase, L2 holds LLM-distilled phase summaries, L3 holds task-level
  wisdom retrieved across tasks by embedding similarity.


  Evaluation is on MLE-Bench, 75 Kaggle competitions, 24-hour budget per task,
  2 RTX 4090 GPUs, Deepseek-V3.2-Speciale as backbone, with 407
  non-overlapping Kaggle competitions used to warm up the L3 wisdom store.


  Average medal rate is 56.4%, against 50.7% for the best proprietary baseline
  (Leeroo on Gemini-3-pro-preview) and 29.3% for ML-Master. By complexity:
  75.8% low, 50.9% medium, 42.2% high. Valid submission rate 95.6%,
  above-median rate 63.1%, gold 19.6% (below FM Agent's 22.7%). Main results
  average 3 seeds; baselines are quoted from MLE-Bench reports, not re-run.


  The ablation is 1 run per configuration on MLE-Bench-Lite only: removing L2
  drops medal rate from 72.7% to 59.1%, removing L3 to 54.5%, removing L1 to
  22.7%. Context length on 1 task fell from over 200k to roughly 70k tokens.


  No matched-token-budget baseline, 1 backbone model, and the warm-up corpus
  gives this agent prior exposure competitors lack. Treat the ablation as
  suggestive and the headline gain as partly confounded with backbone and
  priors.
