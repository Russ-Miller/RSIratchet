brief: >-
  Progress in vision-language-action robotics is bounded by data
  infrastructure rather than model architecture, and current benchmarks cannot
  tell you why a policy fails on long-horizon tasks. This survey organizes VLA
  work into datasets, benchmarks, and data engines, covering representative
  works from 2023 to 2025.


  Datasets are split into real-world (Open X-Embodiment with 22 robots, RT-1,
  DROID, BridgeData V2, RH20T with 4 robots, Ego4D) and synthetic
  (SynGrasp-1B, RoboCasa, RoboGen, MimicGen), compared on embodiment,
  modality, and action space. Benchmarks are placed on 2 axes, task complexity
  and environment structure: tabletop short-horizon (Meta-World with 50 tasks,
  LIBERO, SimplerEnv), tabletop long-horizon (CALVIN, GemBench, COLOSSEUM with
  14 perturbation axes), and multi-scene (BEHAVIOR-1K, VLABench).


  Reported figures are collected from the primary papers, not re-measured.
  CALVIN success drops to 0.08 percent at 5 sequential instructions. Among
  data engines: Video2Policy reaches 88 percents simulation success across
  100+ videos; UMI collects across 30 real-world locations in 12 person-hours,
  3x faster, 71.7 percents zero-shot success; MimicGen generates 50k
  demonstrations from 200 human seeds; RoboGen reaches 77.4% across 69 tasks;
  IRASim improves Push-T from 0.637 to 0.961 IoU.


  No new experiments, no unified re-evaluation, and the scope excludes
  navigation and driving. Use it as a map of data resources and their gaps,
  not as evidence about any model.
