summary: >-
  Despite remarkable progress in Vision--Language--Action (VLA) models, a
  central bottleneck remains underexamined: the data infrastructure that
  underlies embodied learning. In this survey, we argue that future advances
  in VLA will depend less on model architecture and more on the co-design of
  high-fidelity data engines and structured evaluation protocols. To this
  end, we present a systematic, data-centric analysis of VLA research
  organized around three pillars: datasets, benchmarks, and data engines.
