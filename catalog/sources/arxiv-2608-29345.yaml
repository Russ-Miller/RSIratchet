summary: >-
  While recent Large Language Model (LLM)-based text-to-SQL systems achieve
  impressive performance on standard benchmarks, they struggle when user
  queries implicitly rely on domain-specific knowledge, such as business
  logic, data conventions, and analytical practices, that is neither
  captured by the schema nor explicitly stated in the natural language
  question. Historical SQL query logs offer a valuable source of such
