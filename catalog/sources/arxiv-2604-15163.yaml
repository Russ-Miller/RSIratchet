brief: >-
  Majority voting over sampled SQL candidates fails exactly where it matters:
  when a model's errors are systematic, consensus is on the wrong query. DPC
  instead checks each candidate against a Python/Pandas solution of the same
  question, executed on a synthesized miniature database.


  DPC clusters K candidates by execution result, pairs the top 2 clusters as
  Champion and Challenger, then uses a Slicer agent to prune the schema and a
  Tester agent to adversarially populate a Minimal Distinguishing Database on
  which the 2 candidates diverge. A Solver agent writes Pandas code as proxy
  ground truth; agreement is scored with a Hungarian-matching Bipartite
  Soft-F1. Evaluated on BIRD Mini-Dev (500 queries) and Spider test (2,147
  quries) with Qwen2.5-Coder-7B-Instruct, DeepSeek-V3.2 and GPT-5, N = 5.


  On BIRD, DeepSeek goes 51.2% (Self-Consistency) to 53.4%, GPT-5 50.4%
  (Multiple-Choice) to 51.2%, Qwen 46.4% to 47.6%. On the Majority-Incorrect
  subset, Self-Consistency scores 0% and DPC recovers 21.4%, at a cost of
  -3.0% on Majority-Correct. Token cost falls 4.2k to 3.8k versus
  Multiple-Choice.


  Evidence includes a 5-component ablation (Tester most critical, -1.4%), a
  candidate-size sweep (N 3-11, lead widening 1.2% to 2.4%), and plug-in tests
  on DAIL-SQL (+1.8%), CHESS (+1.0%), XiYanCoder-7B (+2.4%).


  Gains over Self-Consistency are 1-2 points absolute, latency rises ~3.6s,
  and no training-based verifier is compared. Worth it if your pipeline has a
  wide Pass@K gap you cannot close by voting.
