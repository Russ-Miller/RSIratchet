summary: >-
  Multimodal Large Language Models (MLLMs) are emerging as core reasoning
  modules for embodied agents, yet it remains unclear how well
  general-purpose models can solve long-horizon embodied tasks from a single
  high-level instruction. We introduce MissionBench, a benchmark for
  mission-level evaluation of MLLMs in aerial 3D environments. It comprises
  120 missions across five simulated 3D environments and four task families.
