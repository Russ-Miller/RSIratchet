  Language (NL) planning descriptions into PDDL problem instances. However,
  standard evaluation criteria such as syntactic validity or planner success
  can substantially overestimate faithfulness to the described task: a
  generated problem may be parseable and solvable while misrepresenting the
  intended initial state, goal, object structure, or optimization target.
