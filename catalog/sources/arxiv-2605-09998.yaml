summary: "Coding harnesses such as Claude Code and OpenHands wrap foundation
  models with tools, memory, and planning, but no equivalent exists for
  embodied agents&#39; long-horizon partial-observability decision-making. We
  first report our Gemini Plays Pokemon (GPP) experiments. With iterative
  human-in-the-loop harness refinement, GPP became the first AI system to
  complete Pokemon Blue, Yellow Legacy on hard mode, and Crystal without a
  lost battle. In the hardest stages, the agent itself began iterating on its
  strategy through long-context memory, surfacing emergent self-improvement
  signals alongside human-in-the-loop refinement. Continual Harness removes
  the human fully from this loop: a reset-free self-improving harness for
  embodied agents that formalizes and automates what we observed. Starting
  from only a minimal environment interface, the agent alternates between
  acting and refining its own p…"
