brief: >-
  An agent that rewrites its own prompt, sub-agents, skills and memory
  mid-episode can rebuild most of a hand-engineered scaffold from a bare
  screenshot-and-buttons interface, but only if the underlying model is strong
  enough; below a capability floor the same loop makes things worse.


  Continual Harness adds a Refiner that reads the last trajectory window every
  F steps and issues CRUD edits to the 4 harness components without resetting
  the environment. Evaluated on Pokemon Red and Emerald with Gemini 3 Pro,
  Flash and Flash-Lite, against a minimalist harness and the PokeAgent expert
  harness, at least 3 seeds, metric is cumulative button presses to milestone.
  A second loop trains Gemma-4 students via DAgger rollouts of K = 256 steps
  scored by a process reward model and relabelled by Gemini-3.1-pro.


  On Emerald with Pro, from-scratch refinement hits 100% of milestones at a
  $130 median versus 98% for $215, a ~40% cost cut. Flash is high variance
  (80% at $42 vs 77% at $30). Flash-Lite drops from 20% to 3-13%. Evolved
  navigation skills close from a near-half-cost penalty to single-digit
  deficit against a Dijkstra oracle.


  Evidence is measured with matched harness conditions, per-component
  ablations, and a Qwen3.5 negative control, but milestone curves are seed
  medians on 2 games in 1 genre, the reset-free versus reset comparison is
  absent, and no convergence point is established.


  Use it as evidence that self-scaffolding pays off only above a
  model-capability threshold.
