brief: >-
  Strip away navigation, low-level control, and verbose error messages, and
  vision-language agents stop being able to replan from what they see.
  AsgardBench, built on AI2-THOR, gives agents images, an action history, and
  only success/failure signals, then asks whether they can revise a plan
  mid-execution when observations contradict assumptions.


  The suite has 108 task instances across 12 task types in kitchens,
  bathrooms, and living rooms, with object cleanliness, fill state, and
  placement varied so one instruction branches into different valid action
  sequences. Each turn the model emits a full remaining plan; only the first
  action executes. Episodes end on goal completion, ten consecutive undoable
  actions, eight repeats, or a soft step limit of 1.5x the reference solution
  (minimum 15) and a hard limit of 2x (minimum 20).


  All but the weakest models more than doubled their success rate with images
  versus text-only, the reverse of ALFWorld-style findings. Detailed failure
  messages raised scores across the board, and for Qwen3-VL, Mistral-Large-3,
  and Maverick text-only plus detailed feedback matched or beat the image
  baseline; for Kimi-K5.2 and GPT-4o it did not. Invalid-object and unparsable
  errors were under 0.1%.


  Ablations removing the held-object hand overlay, the previous-state image,
  and the memory scaffold were run per model; the first two hurt everyone, the
  memory scaffold gave mixed results the authors decline to interpret. The
  paper reports no success-rate numbers in text, only figure references, and
  model coverage varies by condition for cost reasons. Scope is one simulator,
  one curated object set, and a plan-every-turn protocol that may favor
  planning-style LLMs over reactive policies.


  Use it if you want a visual-grounding test that feedback shortcuts cannot
  pass.
