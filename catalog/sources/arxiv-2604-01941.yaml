brief: >-
  Routing zero-reward samples from GRPO into supervised fine-tuning raises
  fine-grained naming accuracy, but it also inflates how many objects the
  model names and lowers precision. That tradeoff is the most useful thing
  here.


  ECAC is a captioning benchmark of 256,121 real kindergarten activity images
  across 35 areas, captioned by GPT-4o from expert-designed prompts and
  reviewed by 8 early childhood education graduate students, with teaching
  toys labeled foreground/background and low/medium/high specificity.
  Qwen2.5-VL-Instruction-3B was fine-tuned on 247,579 pairs, then trained with
  RSRS on 12,000 images, giving KinderMM-Cap-3B.


  TTS reaches 51.06 versus 38.07 for the 3B baseline and 45.25 for
  Qwen2.5-VL-7B; Gemma3-27B gets 10.74. The ablation separates stages: SFT
  42.42, +GRPO 49.61, +RSRS 51.07, with caption quality 86.20 vs 86.59.
  High-precision foreground naming moves from 0.02 to 0.09, still near zero.
  Predicted toy count rises 1.45 to 2.08 while precision falls 64.15 to 56.43,
  below SFT alone at 69.59.


  The staged ablation isolates RSRS from SFT and GRPO, and the reward function
  was checked against 4 human rankers on 100 images (τ = 0.67, ρ = 0.72). But
  there is 1 backbone, 1 domain, Chinese-language captions, and both reference
  captions and the overall quality judge are model-generated.


  Treat TTS gains as reward-hacking-prone: check prediction counts before
  crediting hybrid RL-SFT schemes.
