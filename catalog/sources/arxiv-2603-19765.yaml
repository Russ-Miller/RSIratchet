summary: >-
  Multimodal Large Language Models (MLLMs) suffer from hallucinations.
  Existing hallucination evaluation benchmarks are often limited by
  over-simplified tasks leading to saturated metrics, or insufficient
  diversity that fails to adequately assess the hallucination extent in
  state-of-the-art multimodal models. To address this gap, we propose FREAK,
  a comprehensive multimodal benchmark designed for fine-grained
  hallucination assessment in MLLMs. Through high-quality photorealistic
  images featuring fine-grained counter-commonsense edits, FREAK
  innovatively evaluates hallucination phenomena in detai
