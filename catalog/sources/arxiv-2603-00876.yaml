brief: >-
  Giving an LLM agent the same safety-checking tools as a symbolic controller
  is not enough: it will skip them. BioProAgent wraps a planner in a
  deterministic finite state machine that forces a Design-Verify-Rectify loop,
  and the gain comes from the forced routing rather than from better
  prompting.


  The setup is an extended BioProBench with 4 subsets (protocol drafting,
  hardware code generation, long-horizon orchestration with 9 protocols and
  547 atomic steps, and error correction against injected faults), a digitized
  registry of 22 instruments, and baselines ReAct, Reflexion, AutoGPT, Biomni
  and direct prompting, mostly on Gemini-3-Flash.


  Physical compliance reaches 0.956 versus 0.210 for ReAct; scientific score
  0.591 versus 0.455. On error correction, BioProAgent corrects 90.0% while
  every baseline scores 0.0%, with ReAct looping in 40.0% of cases.
  Long-horizon success is 100.0% versus 66.7% for AutoGPT, with 82% fewer
  tokens.


  Evidence is measured with paired t-tests (p < 0.001), matched toolsets
  across agents, and an ablation: removing the FSM drops C_s to 0.262 and
  Subset C to 0.000. An Oracle-ReAct variant with a forced interlock still
  scored 0% correction, which isolates grounding from gating.


  All of it is simulated against device APIs, 1 backbone for agent
  comparisons, and safety depends on a hand-registered hardware registry.


  Treat tool access as no guarantee of tool use in safety-critical pipelines.
