summary: >-
  Large Language Models (LLMs) are frequently confident, eloquent, and well
  versed. A natural question arises: do they know what they don't know? To
  answer this question, we borrow the concept of epistemic honesty and
  develop a novel metric to systematically evaluate whether an LLM
  appropriately acknowledges the boundaries of its knowledge. In this work,
  we introduce the Epistemic Honesty Quotient (EHQ), which reports three
  observable sub-scores across two operational axes (epistemic restraint and
  substantive-answer calibration), and construct EHQ-3000, a 3,000-question
  benchmark spanning Fabric
