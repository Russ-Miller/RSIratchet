id: scheel-2021-excess-of-positive-results
ref: SRC-0584
kind: paper
title: "An Excess of Positive Results: Comparing the Standard Psychology Literature With Registered Reports"
authors:
  - Anne M. Scheel
  - Mitchell R. M. J. Schijen
  - Daniël Lakens
year: 2021
date: "2021-04-01"
venue: Advances in Methods and Practices in Psychological Science 4(2)
url: https://doi.org/10.1177/25152459211007467
tags: [forwarded]
summary: >-
  Selectively publishing results that support the tested hypotheses
  ("positive" results) distorts the available evidence for scientific
  claims. In Registered Reports, peer review and the decision to publish take
  place before results are known. The authors compared the results in
  published Registered Reports (N = 71 as of November 2018) with a random
  sample of hypothesis-testing studies from the standard literature
  (N = 152) in psychology. Analysing the first hypothesis of each article,
  they found 96% positive results in standard reports but only 44% in
  Registered Reports, and suggest a plausible factor is the reduction of
  publication bias and/or Type I error inflation in the Registered Report
  literature.
