brief: >-
  Strong agentic scores on SWE-bench do not demonstrate long-context
  reasoning; they demonstrate decomposition into short-context steps. Hand a
  model all the needed files in one 64k prompt and it mostly cannot produce a
  working patch.


  The setup is SWE-bench Verified under mini-SWE-agent, a bash-only harness
  with a linear message history, on 100 samples, plus a second pipeline that
  uses BM25 ranking and then injects the gold-patch files to guarantee 100%
  recall at 64k tokens for single-shot patch generation.


  Agentically, GPT-5-nano resolved 31% on 100 samples (vs 34.8% on the full
  leaderboard set), DeepSeek R1-0528 30.3%, Qwen3-32B 15.2%. Trajectories
  stayed under 20k-30k tokens, and failed samples consumed more tokens than
  passed ones (GPT-5-nano 31 passed/69 failed; DeepSeek 30/69). Single-shot at
  64k, Qwen3-Coder-30B-A3B resolved 7% and GPT-5-nano 0%, with hallucinated
  diffs, nonexistent file targets, and malformed chunk headers.


  The retrieval confound is removed by construction, and the post-processing
  pipeline was manually checked as not the source of malformed patches. But
  the agentic and long-context arms use different models, 100 samples each, no
  matched-budget comparison, and the authors note they cannot separate "longer
  context hurts" from "harder issues need more tokens".


  Treat agentic SWE-bench results as evidence about scaffolding, not about
  usable context.
