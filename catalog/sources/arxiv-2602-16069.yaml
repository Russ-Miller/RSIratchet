  language models (LLMs) can directly reason over entire codebases.
  Concurrently, recent advances in LLMs have enabled strong performance on
  software engineering benchmarks, particularly when paired with agentic
  workflows. In this work, we systematically evaluate whether current LLMs
  can reliably perform long-context code debugging and patch generation.
