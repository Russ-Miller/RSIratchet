brief: >-
  Agentic success on SWE-bench is not evidence of long-context reasoning; it
  is evidence that task decomposition keeps each step short. When the same
  models are handed all the relevant files in one 64k-token prompt and asked
  for a patch, they mostly fail.


  The setup is SWE-bench Verified, 100 samples, run two ways: inside
  mini-SWE-agent (bash-only, linear message history, so token usage is
  measurable), and as single-shot patch generation where BM25-ranked chunks
  are augmented by injecting the gold-patch files, guaranteeing 100% retrieval
  recall at 64k context.


  Agentically, GPT-5-nano resolved 31% (vs 34.8% on the full-set leaderboard,
  a harness sanity check), DeepSeek R1-0528 30.3%, Qwen3-32B 15.2%.
  Trajectories stayed under 20k-30k tokens, and failed samples consumed more
  tokens than passed ones. Single-shot at 64k, Qwen3-Coder-30B-A3B resolved 7%
  and GPT-5-nano 0%, with hallucinated diffs, nonexistent file targets, and
  malformed chunk headers.


  The gap is measured, and retrieval is removed as a confound by construction.
  But the two settings use different models (compute limits blocked DeepSeek
  R1-0528 and Qwen3-32B at 64k), there is no context-length sweep, and the
  authors note they cannot separate "long context confuses the model" from
  "hard issues need more tokens".


  Treat agentic coding scores as decomposition benchmarks, not
  context-capacity benchmarks.
