summary: >-
  Large language models have demonstrated remarkable capabilities across
  diverse reasoning tasks, yet their performance on algorithmic reasoning
  remains limited. To handle this limitation, we propose PRIME
  (Policy-Reinforced Iterative Multi-agent Execution), a framework
  comprising three specialized agents, an executor for step-by-step
  reasoning, a verifier for constraint checking, and a coordinator for
  backtracking control, optimized through group relative policy
  optimization. For comprehensive evaluation, we introduce PRIME-Bench, the
  largest algorithmic reasoning benchmark to date, comprising
