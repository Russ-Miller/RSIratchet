brief: >-
  Training a small vision-language model with online RL on a large, diverse
  set of real-website tasks lets it beat GPT-4o and GPT-5-Thinking on web
  tasks from websites never seen in training. WebGym assembles 292,092 tasks
  across 127,645 websites, seeded from 10 existing benchmarks and expanded by
  decomposing GPT-4o-generated rubric fact groups into easier subtasks, with a
  held-out set of 1,167 tasks each from a distinct unseen website.


  Qwen3-VL-Instruct-8B trained with a REINFORCE-style filtered behavior
  cloning update rises from 26.2% to 42.9% success on the OOD test set,
  against 27.1% for GPT-4o and 29.8% for GPT-5-Thinking. An asynchronous
  rollout server gives a 4-5x speedup: 1.8k rollouts in 48.6 minutes on 64
  CPUs versus 264 minutes synchronous.


  Scaling dimensions were ablated one at a time on a shared recipe: 31.0%
  excluding half the subdomains, 34.5% biased to hard, 36.9% easy-only, 38.2%
  uniform sampling, 42.9% with a shortened step budget of (10, 20, 30). Memory
  prompting and a repeated-action penalty were ablated separately. Evaluation
  is LLM-judged; rubric-guided judging was checked against humans on only 80
  trajectories, and judges were sometimes overly strict.


  One model family, one scale, one RL algorithm, no baseline at matched
  compute against proprietary models. If you build web agents, the
  breadth-over-hardness result is the actionable part.
