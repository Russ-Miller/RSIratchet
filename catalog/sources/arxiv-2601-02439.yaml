brief: >-
  Training an 8B vision-language model with a simple REINFORCE-style recipe on
  a very large, rubric-scored web task set beats GPT-4o and GPT-5-Thinking on
  held-out websites. Breadth of easy tasks, not concentration on hard ones, is
  what drives the generalization.


  WebGym aggregates 10 existing web benchmarks into 292,092 tasks across
  127,645 websites, each annotated by GPT-4o with a rubric of fact groups;
  difficulty equals the fact count, and tasks are decomposed into easier
  subsets. The test split has 1,167 tasks, each from a website absent from
  training. Policy is Qwen3-VL-8B-Instruct in coordinate mode, trained with
  binary terminal rewards and filtered BC (positive gradient only).


  Success rate rises from 26.2% to 42.9%, versus 27.1% for GPT-4o and 29.8%
  for GPT-5-Thinking (on a 300-task subset where GPT-4o scored 25.6%). An
  asynchronous rollout server gives 4-5x speedup; 1.8k rollouts at 13.2
  average steps take 48.6 minutes on 64 CPUs versus 264 minutes synchronously.


  Scaling is isolated by ablation: excluding domains 31.0%, hard-biased 34.5%,
  easy-only 36.9%, uniform 38.2%, shortened horizon (10,20,30) 42.9%. Memory
  prompt and a repeated-action penalty are ablated separately.


  Caveats: 1 model family, 1 size, GPT-4o used as both task generator and
  judge, judge validated on only 80 human-annotated trajectories, and rubrics
  skew strict (recall drops).


  If you train web agents, prioritize website diversity and tight step caps
  over hard-task curricula.
