brief: >-
  Online RL on a large, rubric-graded set of live-website tasks lifts an 8B
  vision-language agent above GPT-4o and GPT-5-Thinking on websites it never
  saw in training. WebGym aggregates 10 existing benchmarks into 292,092
  training tasks across 127,645 websites, generates per-task evaluation
  rubrics as "fact groups" with GPT-4o, decomposes tasks into easier variants,
  and holds out 1,167 OOD tasks each from a distinct unseen website. The agent
  is Qwen3-VL-Instruct-8B trained with plain REINFORCE on binary rubric
  rewards.


  Success on the OOD test set rises from 26.2% to 42.9%, versus 27.1% for
  GPT-4o and 29.8% for GPT-5-Thinking (300-task subsample). An asynchronous
  rollout server gives a 4-5x speedup: 1,800 trajectories averaging 13.2 steps
  in 48.6 minutes on 64 CPUs against 264 minutes synchronous.


  The scaling claims are ablated one factor at a time on the same test set:
  31.0% with half the subdomains removed, 34.5% biased to hard, 36.9%
  easy-only, 38.2% uniform sampling, 42.9% after shortening the step budget
  from (15,30,45) to (10,20,30). Memory prompt and a repeated-action penalty
  are each ablated separately. Evaluator agreement is checked against humans
  on only 80 trajectories, and rubrics skew strict, cutting recall.


  One base model family, one size, 2 seeds on the main curve, and no
  matched-compute baseline against the proprietary models, which were run with
  Set-of-Marks rather than coordinates. If you assumed web-agent RL needs hard
  tasks, note that easy-only beat hard-biased here.
