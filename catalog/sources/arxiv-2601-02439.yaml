brief: >-
  An 8B open vision-language model trained with filtered behavior cloning on a
  large, rubric-evaluated web task set beats GPT-4o and GPT-5-Thinking on web
  tasks drawn entirely from websites never seen in training. WebGym aggregates
  10 existing benchmarks into 292,092 tasks across 127,645 websites, generates
  GPT-4o rubrics as fact groups, decomposes tasks into easier subsets, and
  holds out 1,167 tasks each from a distinct unseen website.


  Qwen3-VL-Instruct-8B goes from 26.2% to 42.9% success; GPT-4o reaches 27.1%
  and GPT-5-Thinking 29.8%. An asynchronous rollout server gives 4-5x speedup
  over synchronous collection (1.8k rollouts in 48.6 minutes vs 264 minutes on
  64 CPUs).


  The scaling claims are supported by ablations on 1 model at a fixed recipe:
  removing half the subdomains caps peak at 31.0%, hard-biased sampling 34.5%,
  easy-only 36.9%, uniform 38.2%, shortened horizon 42.9%. Gains are
  single-run peaks on 1 test set, with no matched-compute baseline against
  other training environments, and the evaluator is itself GPT-4o, validated
  on only 80 human-annotated trajectories.


  Unexplored: larger models, the Thinking variant beyond early training, and
  whether rubric strictness biases the reward. Useful if you are deciding
  whether web-agent gains come from task scale and breadth rather than
  algorithm choice.
