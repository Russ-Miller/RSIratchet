brief: >-
  Online RL on a large, rubric-graded task set lifts an 8B vision-language web
  agent above GPT-5-Thinking on websites it never saw in training. WebGym
  aggregates 10 existing web benchmarks into 292,092 tasks over 127,645
  websites, generates GPT-4o rubrics as "fact groups", decomposes seed tasks
  into easier subsets, and holds out 1,167 OOD tasks each from a distinct
  unseen website.


  Qwen3-VL-Instruct-8B trained with REINFORCE on successful trajectories only
  goes from 26.2% to 42.9% success, against 27.1% for GPT-4o and 29.8% for
  GPT-5-Thinking. An asynchronous rollout server gives a 4-5x speedup: 1.8k
  rollouts in 48.6 minutes on 64 CPUs versus 264 minutes synchronous.


  The scaling claims are ablated sequentially on a shared test set: removing
  half the subdomains drops peak to 31.0%, then breadth 34.5%, easy-only
  36.9%, uniform sampling 38.2%, shortened horizon 42.9%. Memory prompt and a
  repeated-action penalty are each ablated. Rubric evaluation agreement is
  checked against human labels on only 80 trajectories, and GPT-5 only on a
  300-task subset.


  One base model family, one size, one RL algorithm with no baseline term; the
  Thinking variant was abandoned early. Proprietary baselines use Set-of-Marks
  rather than coordinates, so the comparison is not matched on interface.


  If you assumed small open models lose to frontier models on live web tasks,
  the environment, not the model, may be the binding constraint.
