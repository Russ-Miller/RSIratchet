brief: >-
  Training a small open-weight VLM with online RL on a large, diverse task set
  lets it beat GPT-4o and GPT-5-Thinking on web tasks from websites it has
  never seen. WebGym aggregates 10 existing benchmarks, infers websites and
  rubrics with GPT-4o, and decomposes rubric fact groups into easier variants,
  yielding 292,092 training tasks across 127,645 websites plus a 1,167-task
  out-of-distribution test split where every test website is removed from
  training.


  REINFORCE with binary rubric rewards on Qwen3-VL-Instruct-8B raises test
  success from 26.2% to 42.9%, against 27.1% for GPT-4o, 29.8% for
  GPT-5-Thinking, and 28.2% for Qwen3-VL-Thinking-8B. An asynchronous rollout
  server gives a 4-5x speedup: 1,800 trajectories averaging 13.2 steps in 48.6
  minutes on 64 CPUs versus 264 minutes synchronously.


  Scaling dimensions were ablated one at a time from a 31.0% baseline: breadth
  +3.5, easy-task size +2.4, uniform difficulty depth +1.3, shortened horizon
  +4.8. Memory prompting and a repeated-action penalty were each ablated
  separately. Evaluator agreement was checked against humans on only 80
  trajectories, and the judge is GPT-4o, the same model that wrote the
  rubrics.


  One model family, one size, one RL algorithm with no baseline or negative
  gradient; proprietary models were run with Set-of-Marks prompting rather
  than coordinates, so the comparison is not grounding-matched.


  Treat task-set breadth, not algorithm choice, as the main lever for
  web-agent generalization.
