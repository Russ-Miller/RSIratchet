brief: >-
  Training an 8B open vision-language model with a simple REINFORCE-style
  filtered-BC loss on a large, rubric-graded set of live-web tasks can push it
  past GPT-4o and GPT-5-Thinking on held-out websites. The gains come mostly
  from task-set scale and sampling choices, not from a sophisticated RL
  algorithm.


  WebGym aggregates 10 existing web benchmarks into 292,092 training tasks
  over 127,645 websites, labels each with GPT-4o-generated fact-group rubrics,
  and procedurally decomposes hard tasks into easier variants. A test split of
  1,167 tasks uses only websites absent from training. An asynchronous rollout
  server replaces synchronous batching.


  Qwen3-VL-Instruct-8B goes from 26.2% to 42.9% success; GPT-4o scores 27.1%
  and GPT-5-Thinking 29.8%. Rollout throughput improves 4-5x (1.8k rollouts in
  48.6 minutes vs 264 minutes at 64 CPUs). A scaling ladder attributes +3.5%
  to domain breadth, +2.4% to easy-task volume, +1.3% to uniform difficulty
  sampling, and +4.8% to shortening the per-episode step cap from (15,30,45)
  to (10,20,30).


  Each dimension was ablated with a held-constant recipe, and the memory
  prompt and repetition penalty were ablated separately. But evaluation is
  LLM-judged, validated against humans on only 80 trajectories, and
  proprietary baselines used Set-of-Marks rather than coordinates, so the
  cross-model comparison is not matched on observation format or compute. 1
  model family, 1 size.


  If you train web agents, the actionable claims are that easy-task breadth
  beats hard-task upweighting and that tighter step budgets help.
