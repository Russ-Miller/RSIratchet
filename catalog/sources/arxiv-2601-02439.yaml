brief: >-
  Filtered behavior cloning on self-generated web rollouts lifts an 8B
  vision-language model past GPT-5-Thinking on held-out websites, and the task
  mix that works best is uniform over difficulty rather than biased toward
  hard tasks.


  WebGym aggregates 10 web benchmarks into 292,092 tasks across 127,645
  websites, each annotated by GPT-4o with a rubric of fact groups; difficulty
  is the fact count, and tasks are decomposed into easier subsets. The test
  split holds 1,167 tasks, each from a website absent from training.
  Qwen3-VL-Instruct-8B is trained with REINFORCE on binary rubric rewards.


  Success rate rises from 26.2% to 42.9%, against 27.1% for GPT-4o and 29.8%
  for GPT-5-Thinking. Ablations trace the gain: excluding half the subdomains
  caps peak at 31.0%, hard-biased sampling 34.5%, easy-only 36.9%, uniform
  38.2%, and shortening the step cap from (15,30,45) to (10,20,30) reaches
  42.9%. The async rollout system gives 4-5x speedup; 64 CPUs collect 1.8k
  rollouts in 48.6 minutes versus 264 synchronous.


  Scaling dimensions are ablated one at a time but mostly as single runs on 1
  model family at 8B; proprietary baselines use Set-of-Marks rather than
  coordinates, so the comparison is not matched. Rubric-evaluator agreement
  rests on 80 human-annotated trajectories, and the judge is GPT-4o, which
  also wrote the rubrics.


  If you train web agents, the depth-vs-breadth result and the horizon cap are
  the actionable parts.
