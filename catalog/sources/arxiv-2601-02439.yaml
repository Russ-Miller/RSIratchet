brief: >-
  An 8B open-weight vision-language model trained with a plain REINFORCE-style
  filtered behavior-cloning update on a large web task set beats GPT-4o and
  GPT-5-Thinking on held-out websites. WebGym assembles 292,092 tasks across
  127,645 websites from 10 existing benchmarks, annotates each with
  GPT-4o-generated rubrics organized as fact groups, and decomposes hard tasks
  into easier subsets. An asynchronous rollout server collects 1,800
  trajectories averaging 13.2 steps in 30 minutes on 128 CPUs and 24 H100s,
  4-5x faster than synchronous collection; at 64 CPUs, 48.6 minutes vs 264
  minutes.


  Qwen3-VL-Instruct-8B goes from 26.2% to 42.9% on a 1,167-task
  out-of-distribution split where every test website is absent from training.
  GPT-4o scores 27.1%, GPT-5-Thinking 29.8%. The ablation ladder attributes
  gains to domain breadth (31.0 to 34.5), easy-task volume (36.9), uniform
  difficulty sampling (38.2), and a shortened step budget (42.9).


  Ablations are measured and sequential rather than factorial, so later gains
  are conditioned on earlier choices. 1 base model family, 1 RL algorithm, no
  baseline at matched compute, and evaluation uses an LLM judge validated on
  only 80 human-annotated trajectories. The judge is also the reward signal,
  so its biases are not independent of training.


  If you assumed web-agent gains require frontier-scale models, the task-set
  scaling story here is the counterweight.
