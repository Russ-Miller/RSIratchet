brief: >-
  An 8B open-weight VLM trained with simple filtered-REINFORCE on a large,
  rubric-graded web task set beats GPT-4o and GPT-5-Thinking on web tasks
  drawn entirely from websites never seen in training.


  WebGym aggregates 10 existing benchmarks and training sets into 292,092
  tasks across 127,645 websites, using GPT-4o to attach fact-group rubrics and
  procedurally decompose tasks into easier variants. Agents act on screenshots
  with coordinate clicks. The held-out set is 1,167 tasks, each from a
  distinct website removed from training.


  Qwen3-VL-Instruct-8B goes from 26.2% to 42.9% success; GPT-4o scores 27.1%,
  GPT-5-Thinking 29.8% on a 300-task subset. An asynchronous rollout server
  gives a 4-5x speedup over synchronous collection (1.8k rollouts in 48.6
  minutes vs 264 minutes on 64 CPUs).


  The scaling claims are ablated on one axis at a time against a common
  recipe: removing half the subdomains gives 31.0%, hard-biased sampling
  34.5%, easy-only 36.9%, uniform sampling 38.2%, shortened horizon 42.9%.
  Memory prompting and a repeated-action penalty were each ablated. Evaluation
  rests on an LLM judge validated against humans on only 80 trajectories, and
  the judge family (GPT-4o) overlaps with the task constructor.


  One model family, one size, no comparison at matched compute against
  supervised fine-tuning. Useful if you are deciding whether small-model RL on
  web tasks generalizes off-domain.
