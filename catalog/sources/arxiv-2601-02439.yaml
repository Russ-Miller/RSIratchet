brief: >-
  An 8B open-weight vision-language model trained with simple filtered-BC
  reinforcement learning on a large web task set beats GPT-4o and
  GPT-5-Thinking on held-out websites. WebGym aggregates 10 seed benchmarks
  (InSTA-v3, PAE-WebVoyager, AgentSynth, BrowseComp, GAIA-Web, Mind2Web
  variants, others) into 292,092 tasks over 127,645 websites, each annotated
  by GPT-4o with fact-group rubrics, then decomposed into easier variants; a
  test split of 1,167 tasks uses only websites absent from training.


  Qwen3-VL-Instruct-8B goes from 26.2% to 42.9% success; GPT-4o scores 27.1%,
  GPT-5-Thinking 29.8% on a 300-task subset. An asynchronous rollout server
  gives 4-5x speedup: 1,800 trajectories averaging 13.2 steps in 48.6 minutes
  on 64 CPUs versus 264 minutes synchronous.


  The scaling claims come from single-run ablations on one model family:
  excluding half the subdomains peaks at 31.0%, hard-biased sampling 34.5%,
  easy-only 36.9%, uniform 38.2%, shortened horizon 42.9%. Memory prompting
  and a repeated-action penalty were ablated separately. The rubric evaluator
  was validated against human labels on only 80 trajectories, and rubrics skew
  strict, cutting recall for GPT-4o.


  Not tested: larger models, thinking models past early training, or
  non-visual agents. Reward is LLM-judged, so absolute numbers depend on judge
  strictness.


  If you assumed web-agent gains needed proprietary scale, task-set breadth
  plus cheap RL is a cheaper lever.
