brief: >-
  Online RL on a large, rubric-graded task set lifts an 8B open
  vision-language model past GPT-5-Thinking on web tasks drawn entirely from
  websites unseen in training. The gain comes less from algorithm choice than
  from task set scale, diversity, and a shortened training horizon.


  WebGym aggregates 10 existing web benchmarks into 292,092 tasks over 127,645
  websites, generating fact-group rubrics with GPT-4o and decomposing seed
  tasks into easier variants. Qwen3-VL-Instruct-8B is trained with REINFORCE
  on binary terminal rewards, using an asynchronous rollout server that
  collects 1,800 trajectories averaging 13.2 steps in 30 minutes on 128 CPUs
  and 24 H100s.


  Success on the 1,167-task out-of-distribution split rises from 26.2% to
  42.9%, against GPT-4o at 27.1% and GPT-5-Thinking at 29.8% on a 300-task
  subset. Ablations stack: excluding half the subdomains caps peak at 31.0%,
  hard-biased sampling 34.5%, easy-only 36.9%, uniform 38.2%, and shortening
  per-episode step caps from (15,30,45) to (10,20,30) reaches 42.9%.


  Effects are measured with matched recipes varying 1 factor, though on 1
  model family, 1 size, and with GPT-4o as both rubric author and judge; the
  judge was validated on only 80 human-annotated trajectories, and rubrics
  skew strict, cutting recall.


  Baselines use Set-of-Marks rather than coordinates, so the proprietary
  comparison is not fully matched.


  If you train web agents, task breadth and horizon caps are worth more
  attention than the RL objective.
