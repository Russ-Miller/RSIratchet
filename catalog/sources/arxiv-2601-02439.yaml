brief: >-
  An 8B open-weight vision-language model trained with a plain REINFORCE-style
  filtered behavior-cloning loop on a large, rubric-graded web task set beats
  GPT-4o and GPT-5-Thinking on web tasks drawn from websites never seen in
  training.


  WebGym aggregates 10 existing web benchmarks and training sets into 292,092
  tasks over 127,645 websites, with GPT-4o generating per-task rubrics as
  "fact groups"; difficulty is the fact count, and subsets of groups become
  easier decomposed tasks. An asynchronous rollout server replaces synchronous
  batched browser stepping. The policy is Qwen3-VL-8B-Instruct in
  coordinate-based screenshot mode, evaluated on a 1,167-task
  out-of-distribution split where every test website is excluded from
  training.


  Success rate rises from 26.2% to 42.9%, against 27.1% for GPT-4o, 29.8% for
  GPT-5-Thinking, and 28.2% for Qwen3-VL-Thinking-8B. Rollouts run 4-5x
  faster: 1.8k trajectories in 48.6 minutes on 64 CPUs versus 264 minutes
  synchronous.


  Scaling factors are separated by ablation on 1 base model: breadth +3.5%,
  easy-task size +2.4%, uniform difficulty +1.3%, shorter horizon +4.8%. The
  rubric judge was validated against humans on only 80 trajectories, and
  rubrics skew strict, hurting recall.


  No larger models, no non-Qwen families, and no baseline matched on gradient
  steps or tokens. If you assumed frontier proprietary models dominate visual
  web browsing, this is evidence that environment scale plus simple RL closes
  the gap at 8B.
