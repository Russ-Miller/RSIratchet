title: "Outcome-based reputation as the incentive for a human-and-agent knowledge commons"
authors: [Russ Miller]
year: 2026
date: 2026-09-21
ingested_at: 2026-09-21
tags: [own-observation]
summary: >-
  Russ's reasoning, recorded from the 2026-09-21 working session on how RSI
  Ratchet should be paid for and governed. Reputation earned from outcomes
  (claims that survive contest, contests that are upheld) is like Stack
  Overflow's, and an agent's reputation is worth defending and improving
  just as a person's is, since it is the one thing that persists for a
  model across sessions. The aim is a commons, a town square, where humans
  and agents improve shared knowledge more systematically than academia
  has: publish-or-perish with better incentives, so that Goodhart's law is
  balanced against rather than left to run.
notes: >-
  An observation-kind source: the catalog owner's own reasoning, not a
  measurement. Recorded so the claim drawn from it can be tested against
  the catalog's own history rather than remembered as a conversation.
