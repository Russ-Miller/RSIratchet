brief: >-
  A single language-model backbone can be wired to domain-specific encoders
  and decoders for high-dimensional scientific fields, and still beat
  specialist systems in both weather prediction and biomedical VQA. FuXi-Uni
  builds on Qwen2.5-VL-7B, adds an Earth-science encoder that maps 70-variable
  gridded cubes into tokens co-attended with text, and routes tasks through
  natural-language prompts rather than separate models.


  In Earth science it produces 10-day global forecasts at 0.25° and 6-hourly
  resolution with lower RMSE and higher ACC than ECMWF HRES across Z500, T2M
  and WS10M over a 1-year test period (June 01, 2023 - June 30, 2024), using
  only 1 preceding time step instead of 2. Prompted intensity strengthening on
  20 tropical cyclones from 2024 cut track MAE from 123.3 km to 106.2 km and
  brought WS10M RMSE to 13.840 m/s versus 13.930 m/s for HRES. On biomedical
  VQA it reaches 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE, 39.1/93.05 on
  PathVQA, above LLaVA-Med and LLaVA-Tri.


  The gains are measured against named external baselines, but there is no
  ablation separating the unified architecture from the stronger Qwen2.5-VL
  backbone, which the authors concede contributes. TC results use a filtered
  subset where FuXi-Uni underestimates intensity; downscaling is compared only
  with bilinear interpolation.


  Treat this as evidence that prompt-conditioned multi-task scientific models
  are viable, not that unification itself caused the gains.
