brief: >-
  A single language-conditioned model can do both high-dimensional numerical
  scientific prediction and biomedical image question answering, if the
  scientific data bypasses text tokenization and goes through domain encoders
  instead. FuXi-Uni builds on Qwen2.5-VL-7B, adds an Earth-science encoder
  that maps 70-variable gridded weather cubes into tokens co-attended with
  text, and uses task-specific decoders rather than diffusion.


  Tasks are selected by prompt: 10-day global forecasting at 0.25°, tropical
  cyclone forecast editing, downscaling from 1.5° to 0.25°, and VQA on
  VQA-RAD, SLAKE, PathVQA.


  Global forecasts beat ECMWF HRES on RMSE and ACC for Z500, T2M, WS10M over a
  1-year test period, using only 1 preceding time step rather than 2. After
  prompted intensity strengthening, WS10M RMSE on 20 TCs falls to 13.840 m/s
  vs 13.930 m/s for HRES, and track MAE drops from 123.3 km to 106.2 km. On
  VQA, FuXi-Uni reaches 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE,
  39.1/93.05 on PathVQA, above LLaVA-Med and LLaVA-Tri.


  Evidence is measured against strong external baselines, but the backbone
  differs from the LLaVA comparators, and the authors concede part of the VQA
  gain comes from that. No ablation separates unified training from per-task
  training. TC results use a filtered subset where FuXi-Uni underestimates
  intensity. Only 2 domains tested.


  Treat the cross-domain transfer claim as unproven; the per-task numbers
  stand.
