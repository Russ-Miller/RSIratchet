brief: >-
  A single language-model backbone can be wired to domain encoders and
  decoders so that one checkpoint does both 10-day global weather forecasting
  and biomedical visual question answering, driven by text prompts.


  FuXi-Uni builds on Qwen2.5-VL-7B, adding an Earth-science encoder that maps
  gridded fields (70 variables, 721x1440 at 0.25 degrees) into tokens
  co-attended with text, plus task decoders in place of diffusion. Prompts
  select forecasting, tropical cyclone intensity editing, or downscaling from
  1.5 to 0.25 degrees.


  Against ECMWF HRES over a 1-year test period, it reports lower RMSE and
  higher ACC for Z500, T2M and WS10M across all lead times, using only 1
  preceding time step rather than 2. On 20 TCs from 2024,
  intensity-strengthened forecasts reach 13.840 m/s WS10M RMSE vs 13.930 m/s
  for HRES, with track MAE falling from 123.3 km to 106.2 km. On biomedical
  VQA it reports 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE, 39.1/93.05 on
  PathVQA, above LLaVA-Med and LLaVA-Tri.


  Evidence is measured but confounded. The authors concede the backbone is
  stronger than LLaVA's, with no matched-backbone ablation; no ablation
  isolates unified training from domain decoders. TC results use a filtered
  subset keeping only cases where FuXi-Uni underestimates intensity, and there
  is no cross-domain transfer test.


  Treat this as an architecture demonstration, not evidence that joint
  scientific training helps.
