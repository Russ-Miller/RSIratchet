brief: >-
  A single language-model backbone can be wired to domain-specific encoders
  and decoders so that one checkpoint does both high-dimensional numerical
  prediction and ordinary visual question answering, selected by
  natural-language prompt. FuXi-Uni builds on Qwen2.5-VL-7B, adding an
  Earth-science encoder that maps gridded weather cubes (70 variables, 0.25°
  grids of 721 x 1440) into tokens shared with text, plus science decoders
  instead of diffusion decoders.


  On 10-day global forecasts at 0.25° and 6-hourly steps it reports lower RMSE
  and higher ACC than ECMWF HRES for Z500, T2M and WS10M over a 1-year test
  period, using only 1 preceding time step rather than 2. Prompted TC
  intensity strengthening cut WS10M RMSE to 13.840 m/s vs HRES 13.930 m/s and
  track MAE from 123.3 km to 106.2 km across 20 typhoons in 2024. On
  biomedical VQA it reaches 68.18/87.32 (VQA-RAD), 87.17/89.4 (SLAKE),
  39.1/93.05 (PathVQA), above LLaVA-Med and LLaVA-Tri.


  Evidence is measured against named external baselines, but the backbone
  advantage is acknowledged and not ablated: Qwen2.5-VL alone scores 53.2/79.7
  on VQA-RAD, so the unified-training contribution is not isolated. TC results
  use a filtered subset keeping only cases where FuXi-Uni underestimates
  intensity, which favours the edit. Downscaling is compared only to bilinear
  interpolation, not a trained super-resolution model, and only 2 domains were
  tested.


  Treat this as evidence that prompt-routed multi-task scientific models are
  feasible, not that unification itself caused the gains.
