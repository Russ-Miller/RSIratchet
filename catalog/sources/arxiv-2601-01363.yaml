brief: >-
  A single language-model backbone can be wired to domain-specific encoders
  and decoders so that one checkpoint does 0.25° global weather forecasting,
  prompt-driven tropical cyclone editing, spatial downscaling, and biomedical
  VQA, without collapsing high-dimensional fields into discrete text tokens.


  FuXi-Uni is built on Qwen2.5-VL-7B, with an Earth-science encoder taking a
  T=1 cube of C=70 variables at 721x1440, and task selection done entirely
  through text prompts. Earth tasks are evaluated against ERA5 and ECMWF HRES
  over June 01, 2023 - June 30, 2024; biomedical tasks on VQA-RAD, SLAKE,
  PathVQA.


  FuXi-Uni beats HRES on RMSE and ACC for Z500, T2M, WS10M across 10 days
  using only 1 input time step. On 20 TCs from 2024, intensity editing cuts
  WS10M RMSE to 13.840 m/s vs 13.930 m/s for HRES and track MAE from 123.3 km
  to 106.2 km. VQA accuracy: 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE,
  39.1/93.05 on PathVQA, above LLaVA-Tri (65.1/84.9, 86.4/89.2, 37.9/92.7).


  Evidence is measured but weakly isolated. The authors concede the VQA gains
  partly reflect a stronger backbone (Qwen2.5-VL alone scores 53.2/79.7 on
  VQA-RAD); there is no ablation separating unified training from backbone or
  domain pretraining, and no single-task Earth baseline at matched compute. TC
  results use a filtered subset keeping only cases where FuXi-Uni
  underestimates intensity relative to IBTrACS.


  Only 2 domains, 1 model size. Open-ended VQA remains far below closed-ended.
  Treat this as a feasibility demonstration of prompt-routed scientific
  generation, not proof that cross-domain training transfers.
