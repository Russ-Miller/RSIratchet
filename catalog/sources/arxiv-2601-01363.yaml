brief: >-
  A single multimodal model with domain-specific encoders and decoders, rather
  than text-only tokenization, can do both high-dimensional scientific
  generation and vision-language question answering without losing domain
  accuracy. FuXi-Uni builds on Qwen2.5-VL-7B, adds an Earth-science encoder
  for 70-variable gridded fields, and routes tasks through natural-language
  prompts.


  It produces 10-day global forecasts at 0.25° and 6-hourly resolution from a
  single input time step, with lower RMSE and higher ACC than ECMWF HRES for
  Z500, T2M and WS10M over a 1-year test period (June 01, 2023 - June 30,
  2024). Prompt-driven tropical cyclone intensity editing lowers WS10M RMSE to
  13.840 m/s vs 13.930 m/s for HRES, and cuts track MAE from 123.3 km to 106.2
  km, over 20 TCs in 2024. On biomedical VQA it reaches 68.18/87.32 on
  VQA-RAD, 87.17/89.4 on SLAKE, 39.1/93.05 on PathVQA, above LLaVA-Med and
  LLaVA-Tri.


  Effects are measured against external references (ERA5, IBTrACS, bilinear
  interpolation) but attribution is weak: the backbone is stronger than
  LLaVA's, which the authors acknowledge, and no ablation separates
  architecture from backbone. The TC result uses a dataset filtered to cases
  where the model underestimates intensity.


  Treat this as an existence proof for shared-latent scientific models, not
  evidence that unification itself causes the gains.
