brief: >-
  A single language-model backbone can be made to emit high-dimensional
  numerical scientific fields, not just text, by attaching domain encoders and
  decoders instead of discretizing everything into text tokens. FuXi-Uni
  builds on Qwen2.5-VL-7B, adds an Earth-science encoder for 70-variable
  gridded weather cubes, and routes tasks through natural-language prompts.


  Tasks covered: 10-day global forecasts at 0.25° and 6-hourly resolution,
  tropical cyclone forecast editing via prompt, downscaling from 1.5° to
  0.25°, and biomedical VQA on VQA-RAD, SLAKE, PathVQA.


  Against ECMWF HRES, FuXi-Uni reports lower RMSE and higher ACC for Z500, T2M
  and WS10M across all lead times over a 1-year test period (June 01, 2023 -
  June 30, 2024), using only 1 preceding time step rather than 2. Prompted
  intensity strengthening on 20 TCs from 2024 cuts WS10M RMSE to 13.840 m/s vs
  13.930 m/s for HRES, and track MAE from 123.3 km to 106.2 km. On VQA it
  reports 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE, 39.1/93.05 on PathVQA,
  above LLaVA-Med and LLaVA-Tri.


  Evidence is measured but not isolated. There is no ablation separating the
  unified architecture from the stronger Qwen2.5-VL backbone, which the
  authors concede drives part of the VQA gain. TC results are computed on a
  filtered subset where FuXi-Uni underestimates intensity relative to IBTrACS,
  and the downscaling baseline is bilinear interpolation only. 2 domains, 1
  model.


  Treat this as evidence that prompt-conditioned unified models can reach
  domain-specific skill levels, not yet that unification itself causes the
  gains.
