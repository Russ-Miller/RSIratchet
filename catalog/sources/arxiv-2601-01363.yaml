brief: >-
  A single language-conditioned model can hold both high-dimensional numerical
  prediction and vision-language understanding without losing domain
  performance, if scientific data is encoded by domain-specific tokenizers
  rather than discretized into text tokens. FuXi-Uni builds on Qwen2.5-VL-7B,
  adds an Earth-science encoder for gridded fields (70 variables, 0.25° global
  grids of 721x1440) and task decoders, and routes global forecasting,
  tropical-cyclone forecast editing, and downscaling through text prompts.


  On 10-day global forecasts at 0.25° and 6-hourly steps it beats ECMWF HRES
  on RMSE and ACC for Z500, T2M and WS10M over a 1-year test period, using
  only 1 input time step instead of the usual 2. Across 20 TCs in 2024,
  intensity-strengthened forecasts reach 13.840 m/s WS10M RMSE versus HRES at
  13.930 m/s, and track MAE drops from 123.3 km to 106.2 km. On biomedical VQA
  it reports 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE, 39.1/93.05 on
  PathVQA, above LLaVA-Med and LLaVA-Tri.


  The Earth-science results are measured against strong external references
  (ERA5, HRES-fc0, IBTrACS) with bilinear interpolation as the downscaling
  baseline. Attribution is weaker elsewhere: no ablation separates the unified
  architecture from the stronger Qwen2.5-VL backbone, which the authors
  concede, and the base Qwen2.5-VL numbers (53.2/79.7, 80.4/64.1, 8.5/64.9)
  show how much of the gain is fine-tuning.


  TC editing results use a filtered subset where FuXi-Uni underestimates
  intensity, so the gain is not an unconditional one. Only 2 domains were
  tested, and no cross-domain transfer benefit is demonstrated.


  Treat this as evidence that scientific tokenizers avoid the information loss
  of text-centric tokenization, not yet as evidence that unification itself
  helps.
