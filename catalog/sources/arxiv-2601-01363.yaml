brief: >-
  A single language-conditioned model can do global weather forecasting,
  tropical cyclone bias correction, downscaling, and biomedical VQA without
  collapsing high-dimensional fields into text tokens. FuXi-Uni keeps a
  Qwen2.5-VL-7B backbone but adds a domain encoder that maps 70-variable
  gridded atmospheric cubes into tokens co-attended with text, plus task
  decoders instead of diffusion; the task is selected purely by prompt text.


  On 10-day 0.25° forecasts over a 1-year test window (June 01, 2023 - June
  30, 2024) it reports lower RMSE and higher ACC than ECMWF HRES for Z500, T2M
  and WS10M, using only 1 preceding time step rather than 2. Prompt-driven
  intensity strengthening over 20 TCs from 2024 cuts WS10M RMSE to 13.840 m/s
  vs HRES 13.930 m/s and track MAE from 123.3 km to 106.2 km. On biomedical
  VQA it reports 68.18/87.32 (VQA-RAD), 87.17/89.4 (SLAKE), 39.1/93.05
  (PathVQA), above LLaVA-Med and LLaVA-Tri.


  Evidence is measured against external references (ERA5, HRES-fc0, IBTrACS)
  but the TC result uses a filtered subset containing only underestimation
  cases, and the authors concede part of the VQA gain comes from the stronger
  Qwen backbone. No ablation separates the science encoder from joint
  training, and no cross-domain transfer is demonstrated.


  Treat it as evidence that prompt-routed unification need not cost domain
  accuracy, not that joint training helps.
