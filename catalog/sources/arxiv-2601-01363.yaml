brief: >-
  A single language-model backbone can be wired to high-dimensional scientific
  fields directly, rather than discretizing them into text tokens, and still
  beat domain-specific systems on both numerical prediction and visual
  question answering. FuXi-Uni builds on Qwen2.5-VL-7B, adds an Earth-science
  encoder that maps a 4D cube of 70 meteorological variables into tokens
  co-attended with text, and uses task-specific prompts to switch between
  forecasting, tropical-cyclone editing, and downscaling.


  On 10-day global forecasts at 0.25° and 6-hourly resolution, it reports
  lower RMSE and higher ACC than ECMWF HRES for Z500, T2M and WS10M across all
  lead times, using only 1 preceding time step rather than 2. On 20 tropical
  cyclones from May–October 2024, prompt-driven intensity strengthening cut
  WS10M RMSE to 13.840 m/s vs 13.930 m/s for HRES and track MAE from 123.3 km
  to 106.2 km. On biomedical VQA it reports 68.18/87.32 (VQA-RAD), 87.17/89.4
  (SLAKE), 39.1/93.05 (PathVQA), above LLaVA-Med and LLaVA-Tri.


  Evidence is measured against external references (ERA5, HRES-fc0, IBTrACS)
  over a 1-year test period, but there is no ablation separating the shared
  backbone from the domain encoders, and the authors concede part of the VQA
  gain comes from the stronger Qwen2.5-VL base. The TC result uses a filtered
  subset where FuXi-Uni underestimates intensity relative to WRF. Only 2
  domains were tested, and cross-domain transfer was asserted rather than
  demonstrated.


  Treat this as evidence that language-interfaced control of numerical
  prediction is workable, not that joint training helps.
