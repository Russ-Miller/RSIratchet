brief: >-
  A single multimodal model with domain-specific encoders and decoders, rather
  than text-only tokenization, can do both high-dimensional scientific
  generation and vision-language understanding without losing domain
  performance. FuXi-Uni aligns gridded weather fields and medical images with
  language tokens in a shared backbone, so weather forecasting, tropical
  cyclone editing, and downscaling are all triggered by text prompts.


  The model builds on Qwen2.5-VL-7B, ingests a T=1, C=70 variable cube at
  0.25° (721x1440), and is tested on 10-day global forecasts, 20 tropical
  cyclones from May–October 2024, downscaling 1.5°→0.25°, and 3 biomedical VQA
  benchmarks.


  It beats ECMWF HRES on RMSE and ACC for Z500, T2M and WS10M across 10 days
  using only 1 input time step. After prompt-based intensity strengthening,
  WS10M RMSE is 13.840 m/s vs 13.930 m/s for HRES, and track MAE falls from
  123.3 km to 106.2 km. On VQA-RAD it scores 68.18 open / 87.32 closed vs 65.1
  / 84.9 for LLaVA-Tri; PathVQA open is 39.1 vs 37.9.


  Evidence is measured against strong external baselines, but the TC result
  uses a filtered subset of cases where FuXi-Uni underestimates intensity, and
  the authors concede the biomedical gains partly reflect the stronger Qwen
  backbone. No ablation separates unified training from the domain encoders.


  Only 2 domains were tested, 1 backbone, and open-ended VQA remains far
  behind closed-ended.


  Treat this as a plausible architecture proposal with real forecasting
  numbers, not a demonstrated cross-domain transfer benefit.
