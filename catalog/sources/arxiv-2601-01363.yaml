brief: >-
  A single language-model backbone can emit high-dimensional numerical
  scientific fields, not just text, if the tokenizer is domain-specific rather
  than a text-style discretizer. FuXi-Uni attaches Earth-science
  encoders/decoders to a pretrained Qwen2.5-VL-7B and routes tasks through
  natural-language prompts.


  The Earth-science input is a 1-step cube of 70 variables (5 upper-air
  variables over 13 pressure levels plus 5 surface variables); tasks are
  10-day global forecasting at 0.25°, tropical cyclone forecast editing, and
  downscaling from 1.5° to 0.25°. Biomedical use is visual question answering
  on VQA-RAD, SLAKE, and PathVQA.


  Forecasts beat ECMWF HRES on RMSE and ACC for Z500, T2M, WS10M across 10
  days, using only 1 input time step rather than the 2 used by prior AI
  models. After prompt-driven intensity strengthening on 20 TCs from 2024,
  WS10M RMSE fell to 13.840 m/s vs 13.930 m/s for HRES, and track MAE from
  123.3 km to 106.2 km. VQA: 68.18/87.32 on VQA-RAD, 87.17/89.4 on SLAKE,
  39.1/93.05 on PathVQA, above LLaVA-Med and LLaVA-Tri; the base Qwen2.5-VL
  scores 53.2/79.7, 80.4/64.1, 8.5/64.9.


  Evidence is measured against strong external baselines over a 1-year test
  window, but there is no ablation separating the science tokenizer from the
  backbone, and the authors concede part of the VQA gain comes from the
  stronger Qwen backbone. TC results use a filtered subset where FuXi-Uni
  underestimates intensity. Only 2 domains tested, no cross-domain transfer
  measured.


  Treat this as evidence that prompt-conditioned unified models can match
  specialist numerical systems, not yet that unification helps.
