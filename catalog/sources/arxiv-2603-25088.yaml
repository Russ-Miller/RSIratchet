summary: Multimodal Large Language Models often suffer from object
  hallucination. While existing research utilizes attention enhancement and
  visual retracing, we find these works lack sufficient interpretability
  regarding attention drift in final model stages. In this paper, we
  investigate the layer wise evolution of visual features and discover that
  hallucination stems from deep layer attention regressing toward initial
  visual noise from early layers. We observe that output reliability depends
  on acquiring visual anchors at intermediate layers rather than final layers.
