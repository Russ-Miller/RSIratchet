summary: >-
  Traditional ontologies describe domain structure but cannot generate novel
  artifacts. Large language models generate fluently but produce outputs
  lacking structural validity, hallucinating mechanisms without components,
  goals without end conditions. We introduce Generative Ontology, a
  framework synthesizing these complementary strengths: ontology provides
  the grammar; the LLM provides the creativity. Generative Ontology encodes
  domain knowledge as executable Pydantic schemas constraining LLM
  generation via DSPy signatures. A multi-agent pipeline assigns specialized
  roles: a Mechanics Architect
