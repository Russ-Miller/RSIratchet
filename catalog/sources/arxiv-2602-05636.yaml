brief: >-
  Forcing an LLM's output into a typed schema removes structural errors but
  does nothing for creative quality; the quality gain comes from splitting the
  task across specialized agents. GameGrammar encodes a tabletop-game ontology
  as Pydantic models bound to DSPy signatures, with retrieval over a
  BoardGameGeek corpus of 1,767 games and 5 role agents (Mechanics Architect,
  Theme Weaver, Component Designer, Balance Critic, Fun Factor Judge).


  The ablation ran 4 conditions x 10 prompts x 3 replications = 120 designs on
  Claude Sonnet 4 at temperature 0.7. Schema validation cut mean consistency
  errors from 5.03 to 0.10 (d = 4.78); ontology constraints took them to 0.00.
  Creative scores only moved at the full pipeline: strategic depth d = 1.59,
  elegance d = 1.14, fun d = 1.12, at ~27k tokens per design versus ~3.1k, an
  8.5x increase. Against 20 published board games reverse-engineered into the
  same schema, generated designs reached 100% completeness but trailed on fun
  (8.07 vs 8.90, d = 1.86) and replayability (7.63 vs 9.05, d = 1.59), with
  tension and social interaction at parity.


  The ablation isolates components cleanly and the cost comparison is
  reported, but scoring is by an LLM judge with no human calibration, 1 model
  family for both generation and evaluation, no playtesting, and a convenience
  sample of 20 reference games. A test-retest study (10 designs, 50
  evaluations) gives ICC 0.578–0.989, with replayability at 0.578.


  Treat schema constraints as a validity fix, not a quality lever.
