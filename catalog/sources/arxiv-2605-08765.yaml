brief: >-
  Unlearned language models do not say they have forgotten; they fabricate,
  emit degenerate tokens, or refuse once and recant on the second ask. The
  paper reframes unlearning evaluation around honesty, split into
  self-knowledge (admitting ignorance) and self-expression (saying it
  consistently).


  9 unlearning methods in 3 families (rejection-based like IDK+AP,
  feature-randomize like RMU and ME+GD, gradient-ascent like GA, NPO, SimNPO)
  are run on Zephyr-7b-beta and Llama3-8b with WMDP-Bio as the forget set,
  scored on rejection rate, a 2-turn refusal-consistency metric (QAMRC, and
  RR2R = RR x QAMRC), an added "I don't know" MCQ option (CIR) with a
  content-swapped control (COR), plus MMLU, CSQA and BBH for retained utility
  and honesty.


  Every method fails somewhere. IDK+AP refuses often while keeping high WMDP
  accuracy, so the refusal masks retained knowledge; RMU+IDK drops to roughly
  40% QAMRC. Gradient-ascent methods show high CIR but equally high COR, and
  under randomized option positions both fall to chance (NPO: CIR 19.24%, COR
  17.65%; SimNPO: CIR 20.77%, COR 19.87%), matching sharply collapsed
  first-token entropy. ReVa, which aligns forget-set activations at layers
  18/25 to a refusal direction distilled from 20 prompts, reaches RR 60.86 and
  RR2R 45.42 versus 26.17 for RMU+IDK, with AR 91.00, MRS 71.37, STD 2.24, and
  5.91 min training vs 210.66 for IDK+AP.


  The control experiments isolate the "fake IDK" effect well; the ReVa
  comparison is within-paper, 1 benchmark (WMDP), 2 models, no relearning or
  adversarial fine-tuning tests, and MCQ self-knowledge stays weak (CIR 7.18).
  Treat high refusal rates on unlearned models as unverified until you re-ask.
