brief: >-
  Unlearning methods that pass forgetting benchmarks still lie about what they
  forgot: they hallucinate forgotten facts, emit repetitive junk tokens, or
  refuse once and then answer on a follow-up question.


  The authors define honest unlearning as self-knowledge plus self-expression
  on both retain and forget sets, and build metrics for it: rejection rate
  (RR), 2-round rejection consistency (QAMRC), RR2R, Choose-IDK Rate (CIR)
  against a Choose Other Rate (COR) control, output variance (STD), agreement
  rate (AR), and misleading-robustness (MRS). 9 methods across 3 families
  (rejection-based, gradient-ascent, feature-randomize) were run on
  Zephyr-7b-beta and Llama3-8b with WMDP-Bio, plus CSQA and BBH.


  IDK fine-tuning masks rather than removes knowledge: it keeps high accuracy
  on the same questions, and RMU+IDK's QAMRC falls to around 40%.
  Gradient-ascent methods show high CIR only from position bias; with the
  special option shuffled among A-E, selection falls to chance (NPO: CIR
  19.24%, COR 17.65%; SimNPO: CIR 20.77%, COR 19.87%). Their proposed ReVa,
  aligning forget-set activations to a distilled refusal direction, reaches RR
  60.86 and RR2R 45.42 versus RMU+IDK's 63.41 and 26.17, with STD 2.24 and MRS
  71.37, in 5.91 minutes versus 210.66 for IDK+AP.


  The COR and randomized-position controls directly isolate fake abstention,
  which is the strongest part of the evidence; ReVa itself is self-evaluated
  on the authors' own metrics with no independent replication.


  Only WMDP is used, no relearning or adversarial fine-tuning attacks are
  tested, and ReVa's MCQ self-knowledge stays low (CIR 7.18).


  If you treat low forget-set accuracy or high "I don't know" rates as
  evidence of successful unlearning, both signals can be spurious.
