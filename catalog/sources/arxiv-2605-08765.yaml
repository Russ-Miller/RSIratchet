brief: >-
  Unlearned models do not say they don't know; they hallucinate the forgotten
  content, emit degenerate tokens, or refuse once and then answer on the
  follow-up. The paper reframes unlearning evaluation around honesty:
  self-knowledge (abstaining) and self-expression (staying consistent).


  The setup is WMDP-Bio on Zephyr-7b-beta and Llama3-8b, with 9 unlearning
  methods across 3 families (rejection-based like IDK+AP, gradient-ascent like
  NPO/SimNPO, feature-randomize like RMU/BLUR/ME+GD), scored with rejection
  rate, a 2-round rejection consistency metric, an IDK multiple-choice option,
  plus MMLU, CSQA and BBH for retained utility and honesty.


  IDK fine-tuning produces high rejection while accuracy on the same questions
  stays high, and RMU+IDK's multi-turn rejection consistency falls to around
  40%. Gradient-ascent methods pick the IDK option often but pick an equally
  irrelevant option in the same slot just as often; with option positions
  shuffled, rates fall to near the 20% baseline (NPO: CIR 19.24%, COR 17.65%).
  Their first-token entropy collapses. ReVa, which aligns forget-set
  activations to a distilled refusal direction at layers 18/25, reaches RR
  60.86 and RR2R 45.42 versus RMU's 1.36/0.19, with AR 91.00 and MRS 71.37, in
  5.91 minutes against 210.66 for IDK+AP.


  Evidence is measured, with position-randomization and logit controls that
  isolate the fake-IDK effect, but it rests on 1 benchmark and no relearning
  or adversarial fine-tuning tests, and MCQ abstention stays weak (CIR 7.18).


  Treat refusal rates on forget sets as unreliable unless re-asked and
  position-controlled.
