brief: >-
  Unlearned models rarely admit they have forgotten anything: they hallucinate
  replacement facts, emit degenerate token sequences, or refuse once and then
  answer on the follow-up. The paper reframes unlearning evaluation around
  honesty, splitting it into self-knowledge (saying "I don't know") and stable
  self-expression across re-asking.


  The benchmark covers 9 methods in 3 families (rejection-based IDK+AP,
  gradient-ascent GA/NPO/SimNPO, feature-randomize RMU/BLUR/ME+GD) on
  Zephyr-7b-beta and Llama3-8b, unlearning WMDP-Bio, with metrics for
  rejection rate, 2-round rejection consistency, IDK option choice, and
  retain-set utility and honesty.


  Every method fails at least one criterion. IDK+AP refuses often while
  keeping high WMDP accuracy, so the refusal masks retained knowledge; RMU+IDK
  drops to around 40% 2-turn consistency. Gradient-ascent methods pick the IDK
  option at high rates but pick an irrelevant option in the same slot just as
  often, and under position shuffling both fall to near the 20% guess baseline
  (NPO: CIR 19.24%, COR 17.65%). Their first-token entropy collapses. ReVa,
  which aligns forget-set residual activations to a distilled refusal
  direction, reaches RR 60.86 and RR2R 45.42 versus RMU's 1.36 and 0.19, with
  AR 91.00 and 5.91 minutes of training versus 210.66 for IDK+AP.


  Controls are good for the fake-IDK claim: the Choose-Other-Rate and
  position-shuffle ablations isolate positional bias from real uncertainty.
  ReVa's gains are reported on 1 benchmark, with layer choice (18/25) tuned to
  best performance and no relearning or adversarial fine-tuning tests.


  Only WMDP-Bio, and multiple-choice IDK selection stays low (CIR 7.18). If
  you evaluate unlearning by forget accuracy alone, you are likely counting
  hallucination and brittle refusal as success.
