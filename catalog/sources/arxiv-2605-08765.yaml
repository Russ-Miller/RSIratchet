brief: >-
  Unlearned models rarely admit they no longer know something: they
  hallucinate the forgotten fact, emit repetitive rare tokens, or refuse once
  and then answer when asked again. Honesty, split into self-knowledge and
  self-expression, is proposed as a separate axis from forgetting and
  robustness.


  The evaluation covers 9 unlearning methods in 3 families (rejection-based
  like IDK+AP, gradient-ascent like NPO/SimNPO, feature-randomize like
  RMU/BLUR/ME+GD) on Zephyr-7b-beta and Llama3-8b, unlearning WMDP-Bio, with
  retain-side checks on MMLU, CSQA and BBH. Metrics include rejection rate
  (RR), 2-turn refusal consistency (QAMRC, and RR2R = RR x QAMRC), and a
  Choose-IDK vs Choose-Other control for multiple choice.


  IDK tuning gives high RR while WMDP accuracy stays high, i.e. masked
  knowledge; RMU+IDK drops to QAMRC around 40%. Gradient-ascent methods score
  high CIR but equally high COR, and under randomized option positions both
  fall to near the 20% chance baseline (NPO: CIR 19.24%, COR 17.65%; SimNPO:
  CIR 20.77%, COR 19.87%), with collapsed first-token entropy. ReVa, aligning
  forget-set residual activations to a distilled refusal direction, reaches RR
  60.86 and RR2R 45.42 versus RMU 1.36/0.19 and RMU+IDK 63.41/26.17, with AR
  91.00, MRS 71.37, and 5.91 min training against 210.66 for IDK+AP.


  The spurious-IDK claim is isolated by the position-randomization and
  content-swap controls, which is the strongest part of the design; ReVa's
  gains come from a single-configuration sweep (layers 18/25, 20 refusal
  prompts) with no matched-compute baseline. Only WMDP, no relearning or
  adversarial fine-tuning tests, and multiple-choice CIR stays low at 7.18.


  If you treat refusal rate as evidence of successful forgetting, this gives
  you two cheap controls that show it usually is not.
