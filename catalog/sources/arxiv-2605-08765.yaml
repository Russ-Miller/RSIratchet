brief: >-
  Unlearning methods that look successful on forgetting benchmarks mostly
  produce dishonest models: they hallucinate forgotten facts, emit degenerate
  token sequences, or refuse once and then answer when asked again. The
  authors formalize "honest unlearning" as preserving utility and honesty on
  the retain set while refusing forgotten content stably, and build metrics
  for it (rejection rate, 2-round rejection consistency QAMRC, Choose-IDK Rate
  vs a Choose-Other control, STD, AR, MRS).


  They evaluate 9 methods across 3 families (rejection-based, gradient-ascent,
  feature-randomize) on WMDP-Bio with Zephyr-7b-beta and Llama3-8b, and add
  ReVa, which aligns residual-stream activations on forget inputs to a refusal
  direction distilled from 20 prompts an RMU-unlearned model already refused.


  IDK fine-tuning masks rather than removes knowledge: high RR with high WMDP
  accuracy, and RMU+IDK's QAMRC falls to around 40%. Gradient-ascent methods
  pick the IDK option often but pick an irrelevant option at the same position
  just as often; under randomized positions both drop to chance (NPO: CIR
  19.24%, COR 17.65%; SimNPO: CIR 20.77%, COR 19.87%). ReVa reaches RR 60.86,
  RR2R 45.42, STD 2.24, AR 91.00, versus RMU+IDK's RR2R 26.17, and trains in
  5.91 minutes vs 210.66 for IDK+AP.


  The position-swap control is the strongest piece of evidence here; the
  headline ReVa gains are single-benchmark (WMDP-Bio only), self-defined
  metrics, no relearning or adversarial fine-tuning tests, and MCQ
  self-knowledge stays weak (CIR 7.18).


  If you treat low forget-set accuracy as evidence of unlearning, add a re-ask
  and an option-position control before believing it.
