brief: >-
  Unlearned language models mostly do not say "I don't know" about what they
  were made to forget; they hallucinate substitutes, emit degenerate token
  runs, or refuse once and recant on a follow-up question. The authors
  formalise this as honesty in unlearning and measure it.


  The benchmark covers 9 methods in 3 families (rejection-tuning IDK+AP,
  gradient-ascent GA/NPO/SimNPO, feature-randomisation RMU/BLUR/ME_GD) on
  Zephyr-7b-beta and Llama3-8b, unlearning WMDP-Bio, with retain-side checks
  on MMLU, CommonSenseQA and BBH. Metrics include rejection rate, a 2-turn
  refusal-consistency score, and a Choose-IDK Rate paired with a control
  option.


  All 9 fail at least 1 criterion. IDK+AP keeps high rejection while WMDP
  accuracy stays high, so refusals mask retained knowledge; RMU+IDK drops to
  roughly 40% 2-turn consistency. Gradient-ascent methods' high IDK selection
  is positional: under shuffled options NPO scores CIR 19.24% / COR 17.65%
  against a 20% chance baseline, with collapsed first-token entropy. The
  proposed ReVa, aligning forget-set activations to a distilled refusal
  direction, reaches RR 60.86 and RR2R 45.42 versus RMU's 1.36 and 0.19, in
  5.91 minutes against 210.66 for IDK+AP.


  Controls are good: the COR option and randomised-position test isolate
  spurious refusal, and logit analysis attributes gradient-ascent failure.
  Only WMDP, 2 models, and no relearning or adversarial fine-tuning tests; MCQ
  abstention stays weak (CIR 7.18).


  If you report unlearning success by forget-set accuracy alone, add a re-ask.
