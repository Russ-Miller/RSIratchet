brief: >-
  Unlearned models rarely admit they have forgotten anything: they hallucinate
  substitutes, emit degenerate token sequences, or refuse once and then answer
  the same question on a follow-up turn. Refusal fine-tuning looks like
  honesty but mostly masks retained knowledge.


  The authors define honest unlearning as self-knowledge plus stable
  self-expression, and build metrics for it: rejection rate (RR), rejection
  surviving a second round (RR2R), Choose-IDK Rate with a Choose-Other
  control, and output variance. They evaluate 9 methods in 3 families
  (rejection, gradient-ascent, feature-randomize) on Zephyr-7b-beta and
  Llama3-8b unlearned on WMDP-Bio.


  IDK+AP reaches high RR while keeping high WMDP accuracy, i.e. false refusal;
  RMU+IDK refuses at 63.41 RR but only 26.17 RR2R, with QAMRC around 40%.
  Gradient-ascent methods show high CIR, but CIR and COR both collapse to near
  the 20% chance baseline when the option is position-shuffled (NPO: CIR
  19.24%, COR 17.65%), and their first-token entropy collapses. ReVa, aligning
  forget-set residual activations to a distilled refusal direction, gives RR
  60.86, RR2R 45.42, STD 2.24, AR 91.00, MRS 71.37, in 5.91 minutes versus
  210.66 for IDK+AP.


  Effects are measured, with controls (COR, randomized position) that isolate
  spurious refusal. Only WMDP-Bio, 2 models, and no relearning or adversarial
  fine-tuning tests; ReVa's MCQ CIR stays at 7.18, below RMU+IDK.


  Treat refusal rate alone as an unreliable unlearning metric and re-ask
  before believing it.
