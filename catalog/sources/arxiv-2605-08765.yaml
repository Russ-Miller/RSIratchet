brief: >-
  Models that have had knowledge removed by current unlearning methods do not
  admit they no longer know it: they hallucinate replacements, emit repetitive
  rare tokens, or refuse once and then answer when asked again. The failure is
  a honesty failure, not a forgetting failure, and it is distinct from the
  robustness criteria usually evaluated.


  The authors define honest unlearning as self-knowledge plus stable
  self-expression, and measure it with rejection rate (RR), rejection after a
  second-round follow-up (RR2R), Choose-IDK Rate against a Choose-Other
  control, output variance under prompt formatting changes (STD), agreement
  rate, and misleading robustness. 9 methods across 3 families
  (rejection-based, gradient-ascent, feature-randomize) were run on
  Zephyr-7b-beta and Llama3-8b with WMDP-Bio, plus CSQA and BBH for retained
  behaviour.


  IDK fine-tuning produces refusals while keeping high WMDP accuracy, i.e.
  masked knowledge; RMU+IDK reaches RR 63.41 but RR2R only 26.17, with
  second-turn consistency around 40%. Gradient-ascent methods show inflated
  IDK selection that collapses to chance when the option is shuffled (NPO: CIR
  19.24%, COR 17.65%), with very low first-token entropy. Their proposed ReVa,
  which aligns forget-set residual activations to a distilled refusal
  direction at layers 18/25, gives RR 60.86, RR2R 45.42, STD 2.24, AR 91.00,
  in 5.91 minutes versus 210.66 for IDK+AP.


  The spurious-IDK diagnosis is well isolated by the position-randomised
  control and the logit analysis. ReVa's gains are not: 1 benchmark
  (WMDP-Bio), self-defined metrics, no relearning or adversarial fine-tuning
  tests, and MCQ self-knowledge stays low (CIR 7.18).


  If you treat low forget-set accuracy as evidence of unlearning, add a
  second-turn re-ask before believing it.
