brief: >-
  Multiple-choice scores on long-context code QA overstate comprehension:
  remove the answer options and accuracy falls by 15-35 points in Python and
  30-60 points in COBOL, with the same questions and contexts.


  The authors extend LongCodeBench's Python set with new COBOL sets (OPPSCAL
  Medicare Pricer, plus an internal IBM enterprise system) and a Java set of
  114 questions from Elasticsearch, Cassandra, Dubbo and Kafka, giving 684
  Java instances across 32k-1024k token contexts. Models include GPT-4o,
  Claude-4.5-Sonnet, Gemini-2.5-Pro/Flash, Llama-3.1-405B, Mistral, Qwen and
  Granite, under shuffled options, open-ended generation judged by an LLM, and
  needle-in-a-haystack injections at Start/Middle/End.


  Claude-4.5-Sonnet goes from 80.5% with options at 32k to 42.5% without.
  Gemini-2.5-Pro drops 98.4% to 62.3% on OPPSCAL at 32k, and to 32.0% at 512k.
  Contrary to "lost in the middle", recency bias dominates: Granite-4-8B
  open-ended COBOL at 64k scores 15.56% Start, 35.56% Middle, 62.22% End.


  The format ablation is clean, holding question and context fixed. Open-ended
  grading is LLM-as-judge with no reported human agreement check; some cells
  are missing where context limits were exceeded, and COBOL question counts
  are not given.


  Java shows a much smaller gap, so the collapse is language-dependent rather
  than universal.


  Treat multiple-choice long-context code scores as a ceiling, not an
  estimate.
