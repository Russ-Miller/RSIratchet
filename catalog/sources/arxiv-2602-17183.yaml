summary: "Large language models (LLMs) increasingly assist software
  engineering tasks that require reasoning over long code contexts, yet their
  robustness under varying input conditions remains unclear. We conduct a
  systematic study of long-context code question answering using controlled
  ablations that test sensitivity to answer format, distractors, and context
  scale. Extending LongCodeBench Python dataset with new COBOL and Java
  question-answer sets, we evaluate state-of-the-art models under three
  settings: (i) shuffled multiple-choice options, (ii) open-ended questions
  and (iii) needle-in-a-haystack"
