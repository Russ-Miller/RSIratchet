brief: >-
  Applying hallucination-correction steering at every decoding step destroys
  factual generations, and gating corrections on a latent density signal
  recovers most of that loss. Un-gated intervention corrupted between 26% and
  90% of originally correct generations depending on the model.


  PCNet is a Probabilistic Circuit trained as a density estimator over a 128-d
  MLP projection of the final hidden state, scoring each token's exact
  negative log-likelihood; when NLL crosses a calibrated threshold it triggers
  PC-LDCD, a top-k lookahead in token space penalized by that density. Tested
  on Llama-3.2-1B, Qwen3-4B, Mistral-7B-v0.3 and Llama-3.1-8B over CoQA, SQuAD
  v2.0, TriviaQA and TruthfulQA.


  Detection AUROC reaches 0.98 on CoQA and SQuAD for the 8B model, averaging
  0.92 against HaloScope's 0.87; TruthfulQA stays hardest (0.66-0.81). Gating
  cut mean corruption to 53.7% and raised preservation to 79.3%; PC-LDCD gave
  the best True+Info on 3 of 4 models (Qwen3-4B 0.78, +0.28) and led on
  MC2/MC3, but not MC1.


  Effects are measured over 3 seeds against 4 detection and 5 correction
  baselines, with ablations on calibration size (n=50-1000) and projection
  dimension (32-512), plus a RAG comparison. Each correction method is run
  gated and un-gated, which isolates the gate.


  Only models up to 8B; calibration needs labeled factual/hallucinated states;
  RAG still wins on TriviaQA EM (0.465 vs 0.290).


  If you steer activations for truthfulness, measure what it costs on
  already-correct outputs.
