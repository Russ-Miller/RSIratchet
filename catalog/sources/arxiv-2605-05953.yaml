brief: >-
  Applying hallucination-correction steering at every token destroys
  generations that were already correct, so the useful move is to gate the
  correction on a detector. Un-gated intervention corrupted between 26% and
  90% of factual generations depending on the model.


  PCNet is a Probabilistic Circuit trained as a density estimator over a 128-d
  MLP projection of the final-layer residual stream, scoring each decoding
  step by exact negative log-likelihood. It gates PC-LDCD, a top-k lookahead
  in token space penalized by that density. Tested on 4 LLMs (Llama-3.2-1B,
  Qwen3-4B, Mistral-7B-v0.3, Llama-3.1-8B) across CoQA, SQuAD v2.0, TriviaQA,
  TruthfulQA.


  Detection AUROC averages 0.88-0.92 per model, beating Token NLL, SEP,
  HaloScope and AutoFact; TruthfulQA stays hardest (0.66-0.81). Gating cut
  mean corruption to 53.7% and raised preservation to 79.3%. PC-LDCD led
  True+Info on 3 of 4 models (Qwen3-4B 0.78, Mistral-7B 0.72) and led MC2/MC3
  throughout, but not MC1, where DoLa reached 0.76.


  Evidence is measured over 3 seeds against 5 correction baselines in both
  gated and un-gated form, plus ablations on calibration size (50-1000) and
  projection dimension (32-512), and a RAG comparison. Gating was applied to
  every baseline, which isolates the gate from the decoder.


  Limits: models up to 8B only, a labeled calibration set is required, and RAG
  still wins TriviaQA EM (0.465 vs 0.290).


  If you steer activations for truthfulness, measure what it costs you on the
  already-correct cases.
