brief: >-
  Training on data synthesized from a code graph beats retrieval-augmented
  prompting when a model has to write code against a codebase it never saw
  during pretraining. UCD-Training parses an unseen repository into a graph of
  files, classes, functions and globals, uses file-level dependency paths for
  continued pretraining, then fine-tunes on 3 synthesized data types with
  reasoning traces: single-hop relation data, compositional API data from
  internal test cases, and codebase utilization data converted from those
  tests.


  Evaluation uses UnseenCodeBench, 4 repositories created after 2025-03-01 (3
  C++, 1 Python), all post-dating the knowledge cutoffs of the evaluated
  models, built by 5 engineers over 100 person-hours. Trained models are
  Qwen3-8B-Base, Qwen3-14B-Base, Qwen2.5-Coder-14B-Base and
  Qwen2.5-Coder-32B-Base; RAG baselines include GPT-5.1, Claude-Sonnet-4.5,
  Gemini-3.0-Pro, DeepSeek-V3.1-Terminus and Qwen3-Coder-480B.


  Reported gains are 25.5% absolute over RAG with GPT-5.1, 7.2% to 26.1% Avg.
  pass@1 over OSS-Instruct and COTTON, and 36.0% pass@1 in a multi-codebase
  multi-language setting, still 4.7% to 23.6% above baselines.


  Training-based baselines were matched on data scale per codebase (35k, 20k,
  6k samples), and an ablation over data types and filters is promised but the
  result tables are absent from the text provided here, so the per-component
  attribution is unverified. Contamination control is argued from creation
  dates plus low base-model scores, not proven.


  Scope is 4 small repositories, 2 languages, 1 trained model family, 7B-32B.
  If you maintain a private or newly released library, this argues
  post-training on graph-derived synthetic usage data rather than more
  retrieval.
