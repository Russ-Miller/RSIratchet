summary: "Large language models (LLMs) undergo safety alignment after training
  and tuning, yet recent work shows that safety can be bypassed through
  jailbreak attacks. While many jailbreaks and defenses exist, their
  cross-lingual generalization remains underexplored. This paper presents the
  first systematic multilingual evaluation of jailbreaks and defenses across
  ten languages -- spanning high-, medium-, and low-resource languages --
  using six LLMs on HarmBench and AdvBench. We assess two jailbreak types:
  logical-expression-based and adversarial-prompt-based. For both types,
  attack success and defense"
ingested_at: 2026-09-19
brief: >-
  The usual story that low-resource languages are the weak point in safety
  alignment reverses once you add a jailbreak: high-resource languages are
  safer under plain harmful queries but more vulnerable under adversarial
  ones.


  6 LLMs (GPT-4o, Claude Sonnet 4, Qwen2.5-7b/14b, Llama3.1-8b/70b) were
  prompted with HarmBench (200 queries) and AdvBench (520 queries) across 10
  languages spanning low-resource (Bengali, Telugu, Swahili) to high-resource
  (English, Chinese, Spanish, German), under standard queries,
  logic-expression jailbreaks, and the Andriushchenko et al. prompt-suffix
  attack.


  English is the safest language on standard queries but the least safe under
  logic jailbreaking, while Telugu moves from third-least-safe to safest under
  both attacks. Andrius25 pushes open-source models to near-100% unsafe rates
  (Qwen14b 99.5 on HarmBench English); logic jailbreak works best on GPT-4o
  (61.0 English) and poorly on Sonnet4 (06.0). Unsafe rates for one model can
  differ by more than 50% across languages. Self-verification prompting helps
  stronger models and hurts Qwen7b (-300.0 in English on HarmBench). A
  response classifier trained only on Qwen7b standard-query answers reaches
  0.87-0.89 F1 on jailbreak responses but drops to 0.68 on other models'
  standard-query responses.


  Effects are measured, with LLM-as-judge labels validated by native
  annotators (Krippendorff's alpha 0.70-0.86, 100 examples per language,
  Swahili missing). Scaling evidence is thin: Llama70b beats Llama8b (p=0.04),
  Qwen14b vs 7b not (p=0.31). Invalid responses were discarded, 10 languages,
  4 model families, no fine-tuning defenses tested.


  Treat any single-language safety number, English included, as uninformative
  about the same model under attack elsewhere.
