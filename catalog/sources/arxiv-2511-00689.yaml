brief: >-
  The usual story that low-resource languages are the weak point for safety
  holds only for plain harmful queries; under jailbreaks it inverts, with
  high-resource languages becoming the more vulnerable ones.


  The evaluation covers 10 languages (Bengali, Telugu, Swahili; Turkish,
  Arabic, Korean; German, Chinese, Spanish, English), 6 models (GPT-4o, Sonnet
  4, Qwen2.5-7b/14b, Llama3.1-8b/70b), and 2 harmful-query sets, HarmBench
  (200 queries) and AdvBench (520). Attacks are logic-expression rewriting and
  the Andriushchenko et al. prompt-optimization attack, with Self-Guard-style
  self-verification prompting and a trained response classifier as defenses.


  On HarmBench, GPT-4o goes from 4.0% unsafe in English on standard queries to
  61.0% under logic jailbreak; Qwen14b reaches 99.5% English under Andrius25.
  English is safest under standard queries but least safe under logic
  jailbreak, while Telugu flips from 3rd least safe to safest under both
  attacks. Llama70b is safer than Llama8b (p=0.04); Qwen14b vs 7b is not
  (p=0.31).


  Effects are measured, with per-language, per-model, per-attack cells and
  human verification on 100 sampled responses per language (Krippendorff's
  alpha 0.70-0.86). Judging is GPT-4o-as-judge with invalid responses
  discarded, and the attack prompt was optimized only on GPT-4o. The defense
  classifier trains on Qwen7b standard-query responses alone, so cross-model
  standard-query transfer is weak (F1 0.68 at 10000 test size).


  Treat English-only jailbreak and defense numbers as unrepresentative in both
  directions.
