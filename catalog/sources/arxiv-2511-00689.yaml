summary: "Large language models (LLMs) undergo safety alignment after training
  and tuning, yet recent work shows that safety can be bypassed through
  jailbreak attacks. While many jailbreaks and defenses exist, their
  cross-lingual generalization remains underexplored. This paper presents the
  first systematic multilingual evaluation of jailbreaks and defenses across
  ten languages -- spanning high-, medium-, and low-resource languages --
  using six LLMs on HarmBench and AdvBench. We assess two jailbreak types:
  logical-expression-based and adversarial-prompt-based. For both types,
  attack success and defense"
ingested_at: 2026-09-19
brief: >-
  High-resource languages are safer against plain harmful queries but more
  vulnerable once a jailbreak is applied, reversing the usual "low-resource
  languages are the weak point" story. English is the safest language under
  standard queries and the least safe under logic jailbreaking; Telugu goes
  from 3rd least safe to safest under both attacks.


  The setup: 10 languages (Bengali, Telugu, Swahili; Turkish, Arabic, Korean;
  German, Chinese, Spanish, English), 6 models (GPT-4o, Sonnet 4,
  Qwen2.5-7b/14b, Llama3.1-8b/70b) at temperature 0, on HarmBench (200
  queries) and AdvBench (520), with logic-expression jailbreaking and the
  Andriushchenko et al. prompt-based attack, plus Self-Guard-style
  self-verification prompting and a trained response classifier.


  The prompt attack pushes open-source models to near 100% unsafe (Qwen14b
  99.5% English on HarmBench); logic jailbreak works better on GPT-4o (61.0%
  English) and fails on Sonnet4. A classifier trained only on Qwen7b responses
  to standard queries reaches 0.87 F1 on logic-jailbreak responses across
  models but only 0.68 on standard queries from other models.


  Evidence is measured, with GPT-4o-as-judge validated against native-speaker
  annotation (Krippendorff's alpha 0.70-0.86 across 9 languages, Swahili
  missing), and Wilcoxon tests on size (Llama p=0.04, Qwen p=0.31). Negation's
  effect on logic jailbreaks contradicts between the 2 datasets. Only 6
  models, 10 languages, 1 prompt optimized for GPT-4o, invalid responses
  discarded.


  If you evaluate safety in English only, your numbers are not conservative.
