brief: >-
  Giving a multimodal model an Euler or linear diagram alongside syllogistic
  premises does not improve its logical accuracy, and sometimes hurts it,
  unlike the facilitation effect seen in humans.


  The test used 285 validity-checking syllogisms from Ando et al. (2024), each
  labelled entailment, contradiction or neutral, and annotated for conversion
  cases, syllogistic figure, and content type (symbolic, congruent,
  incongruent). Claude 3.5 Sonnet and GPT-4o-mini were run via OpenRouter
  under 4 matched conditions: natural language, set-theoretic logical form,
  ASCII linear diagrams, and Euler diagrams as images.


  Claude scored 84.6 on NL, 84.6 on Logic, 81.1 on Linear, 84.2 on Euler;
  GPT-4o-mini 68.8, 71.2, 64.9, 67.0. Conversion cases fell under diagrams:
  Claude 84.2 on NL to 68.4 Linear and 73.7 Euler; GPT-4o-mini 52.6 to 42.1
  and 36.8. Neutral labels were the weak point (GPT-4o-mini 18.9-27.4; Claude
  48.4-63.2), and accuracy dropped from symbolic to incongruent content in
  every condition. Figure 1 beat Figure 4 throughout, matching the human
  figural effect.


  The condition comparison is controlled and within-dataset, but there are
  only 2 models, 1 prompt format, and single-run accuracies with no variance
  reported. The authors note this contradicts Ando et al. on the same task and
  attribute the discrepancy to model choice, so the null may be
  model-dependent.


  Treat diagram injection as an untested-to-negative intervention rather than
  a reliable prompting gain.
