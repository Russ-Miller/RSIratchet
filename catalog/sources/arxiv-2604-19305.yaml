brief: >-
  Feeding a repair model intermediate runtime values, obtained by having it
  insert its own print statements, fixes bugs that stack traces alone do not.
  The claim is that outcome-level failure symptoms let LLMs produce
  plausible-but-wrong patches that mask symptoms rather than fix root causes.


  DebugRepair has 3 parts: static slicing of the failing test to a minimal
  failure-triggering context, LLM-chosen instrumentation with a rule-based AST
  fallback when the instrumented code fails a consistency or compilation
  check, and a hierarchical repair loop (6 debugging sessions x 4 rounds, plus
  8 patch-augmentation queries, so 32 candidate patches per bug). Benchmarks:
  Defects4J V1.2 (391 bugs) and V2.0 (438), QuixBugs Java and Python (40
  each), HumanEval-Java (163), against 15 baselines.


  With GPT-3.5 it correctly fixes 224 Defects4J bugs (111 on V1.2, 113 on
  V2.0), 11 more than ReinFix at a smaller patch budget, 23 more than TSAPR,
  and all 40 QuixBugs in both languages. With DeepSeek-V3 it fixes 295, 59
  more than the second-best. Across 5 other backbones it fixes 51.3% more than
  vanilla on average.


  Baseline numbers on Defects4J are copied from original papers rather than
  rerun, except for 6 LLM baselines reproduced under DeepSeek-V3; the setting
  uses perfect fault localization. Gains concentrate in single-function and
  single-hunk bugs; on single-line bugs on V1.2 it trails ChatRepair and TSAPR
  (55 vs 57), consistent with traces adding context length without new
  evidence.


  If you build feedback-based repair loops, instrumentation traces are worth
  adding, and the authors argue the mechanism is orthogonal to retrieval and
  search-based tools.
