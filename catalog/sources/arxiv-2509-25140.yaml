brief: >-
  Agents that distill reasoning strategies from their own failures, not just
  successful trajectories, carry memory across tasks better than agents that
  store raw trajectories or success-only workflows. ReasoningBank writes each
  experience into a title/description/content memory item, labels success or
  failure with an LLM-as-a-judge and no ground truth, retrieves by embedding
  similarity, and appends new items as tasks stream in.


  Tested on WebArena (684 tasks, 5 subsets), Mind2Web
  cross-task/website/domain, and SWE-Bench-Verified, with Gemini-2.5-flash,
  Gemini-2.5-pro, and Claude-3.7-sonnet, against No Memory, Synapse, and AWM.


  Overall WebArena success rate rises +8.3, +7.2, and +4.6 over memory-free
  agents, with average steps down from 9.7 to 8.3 on flash; SWE-Bench-Verified
  resolve rate goes 34.2 to 38.8 (flash) and 54.0 to 57.4 (pro). Adding
  failure traces helps ReasoningBank (46.5 to 49.7) but hurts AWM (44.4 to
  42.2). Memory-aware test-time scaling at k=5 reaches 55.1 parallel vs 52.4
  for vanilla TTS; without memory, scaling only moves 39.0 to 42.2.


  Evidence is measured with matched baselines, ablations on failure traces and
  aggregation, and a judge-noise simulation (judge accuracy 72.7%; stable
  across 70%-90%). The scaling study is 1 model, 1 subset, and compute cost is
  not matched across k. Web and SWE agents only; no RL or weight-update
  comparison.


  If you are building long-running agents, failure-derived strategy memory is
  the cheaper lever than more rollouts.
