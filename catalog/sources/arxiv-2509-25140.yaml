brief: >-
  Distilling strategy-level lessons from an agent's own failures, not just its
  successes, is what makes accumulated memory pay off; storing raw
  trajectories or success-only workflows can make performance worse when
  failures are added.


  ReasoningBank stores title/description/content memory items extracted from
  each finished task, labelled success or failure by an LLM-as-a-judge with no
  ground truth, retrieved by embedding similarity for the next task. Tested on
  WebArena (684 tasks, 5 subsets), Mind2Web cross-task/website/domain, and
  SWE-Bench-Verified, with Gemini-2.5-flash, Gemini-2.5-pro and
  Claude-3.7-sonnet, against No Memory, Synapse (trajectories) and AWM
  (workflows).


  Overall WebArena success rate rises +8.3, +7.2 and +4.6 over memory-free
  agents across the 3 backbones; SWE-Bench-Verified resolve rate goes 34.2 to
  38.8 (flash) and 54.0 to 57.4 (pro), with fewer steps. Adding failure traces
  moves ReasoningBank from 46.5 to 49.7 on WebArena-Shopping while AWM drops
  44.4 to 42.2.


  Effects are measured with matched agent scaffolds and include ablations on
  failure use, scaling factor k, and judge accuracy (simulated 50%-100%; real
  judge 72.7%), plus a vanilla-TTS control (55.1 vs 52.4 at k=5). There is no
  equal-token-budget comparison against the no-memory agent, and the scaling
  study is 1 subset with 1 model.


  If you build streaming agents, failure-derived abstractions are the
  component worth adding before more test-time compute.
