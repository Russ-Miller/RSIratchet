brief: >-
  Agents that distill their own failures into reusable strategy notes
  outperform agents that store only successful trajectories or workflows.
  ReasoningBank converts each finished task, judged success or failure by an
  LLM-as-a-judge with no ground truth, into structured memory items (title,
  description, content) retrieved by embedding similarity for later tasks.


  Testing covers WebArena (684 tasks across 5 subsets), Mind2Web
  cross-task/website/domain splits, and SWE-Bench-Verified, on
  Gemini-2.5-flash, Gemini-2.5-pro and Claude-3.7-sonnet, against No Memory,
  Synapse (raw trajectories) and AWM (workflows).


  Overall WebArena success rate rises +8.3, +7.2, and +4.6 over memory-free
  agents across the 3 backbones, with fewer steps (up to 1.4 fewer than No
  Memory). On SWE-Bench-Verified, resolve rate goes 34.2 to 38.8 (flash) and
  54.0 to 57.4 (pro). Adding memory-aware test-time scaling pushes
  WebArena-Shopping from 49.7 at k=1 to 55.1 at k=5 parallel, versus 52.4 for
  vanilla TTS and 39.0-42.2 without memory.


  The failure-learning claim is isolated by ablation: adding failed traces
  helps ReasoningBank (46.5 to 49.7) but hurts AWM (44.4 to 42.2). Judge noise
  was simulated from 50% to 100% accuracy against a measured 72.7% baseline
  with little effect. Scaling curves come from 1 subset and 1 model; no
  matched token-budget baseline is reported.


  If you build streaming agents, failure-derived strategy memory is the
  cheaper lever than more rollouts alone.
