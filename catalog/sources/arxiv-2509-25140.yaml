summary: >-
  Proposes ReasoningBank, a memory store for LLM agents that extracts a
  natural-language "reasoning strategy" from each completed task and
  retrieves relevant ones to prime later attempts. Unlike prior memory
  mechanisms that store raw trajectories or only successful routines, it
  distills from both successes and failures, judging which is which with
  an LLM rather than ground truth. Also introduces memory-aware test-time
  scaling (MaTTS), which samples more trajectories per task to give the
  memory-writing step richer contrastive signal. Evaluated on WebArena and
  Mind2Web (web browsing) and SWE-Bench-Verified (software engineering).
