brief: >-
  Agents that distill reasoning strategies from their own failures, not just
  successful trajectories, keep improving across a stream of tasks, and memory
  quality determines whether test-time scaling pays off at all.


  ReasoningBank stores structured memory items (title, description, content)
  extracted from trajectories labeled success or failure by an LLM-as-a-judge
  with no ground truth, retrieved by embedding similarity for each new task.
  It was tested on WebArena, Mind2Web and SWE-Bench-Verified with
  Gemini-2.5-flash, Gemini-2.5-pro and Claude-3.7-sonnet, against No Memory,
  Synapse (raw trajectories) and AWM (successful workflows).


  Overall WebArena success rose +8.3, +7.2 and +4.6 over memory-free agents,
  with up to 1.4 fewer steps; SWE-Bench-Verified resolve rate went 34.2 to
  38.8 (flash) and 54.0 to 57.4 (pro). Adding failure traces helped
  ReasoningBank (46.5 to 49.7) but hurt AWM (44.4 to 42.2). Scaling to k=5
  parallel rollouts lifted ReasoningBank BoN 49.7 to 55.1, versus 39.0 to 42.2
  with no memory.


  Effects are measured against 3 memory baselines on 3 backbones, with
  ablations on failure traces, aggregation, and simulated judge accuracy
  (baseline judge accuracy 72.7%). The scaling study runs on 1 subset
  (WebArena-Shopping, flash only), and compute is not matched across memory
  conditions.


  If you are building long-running agents, failure-derived strategy memory is
  the part worth copying.
