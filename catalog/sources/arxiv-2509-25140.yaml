brief: >-
  Storing distilled reasoning strategies from both successful and failed agent
  trajectories beats storing raw trajectories or success-only workflows, and
  failures carry usable signal that existing memory designs cannot absorb.


  ReasoningBank keeps structured memory items (title, description, content)
  retrieved by embedding similarity at test time, with an LLM-as-a-judge
  supplying correctness labels since no ground truth is available in the
  streaming setting. Tested on WebArena, Mind2Web and SWE-Bench-Verified with
  Gemini-2.5-flash, Gemini-2.5-pro and Claude-3.7-sonnet, against No Memory,
  Synapse (trajectories) and AWM (workflows).


  Overall WebArena success rate rises by +8.3, +7.2 and +4.6 over memory-free
  agents across the 3 backbones; SWE-Bench-Verified resolve rate goes 34.2 to
  38.8 (flash) and 54.0 to 57.4 (pro), with fewer steps. Adding failures helps
  ReasoningBank (46.5 to 49.7) but hurts AWM (44.4 to 42.2). Memory-aware
  test-time scaling reaches 55.1 at k=5 parallel versus 52.4 for vanilla TTS
  and 42.2 without memory.


  Effects are measured with ablations that isolate memory source, aggregation
  and scaling factor, plus a judge-noise simulation showing stability between
  70%-90% accuracy against a measured 72.7% baseline judge accuracy. No
  matched-token-budget baseline is reported.


  Scaling analyses run on 1 subset (WebArena-Shopping) with 1 model; MaTTS is
  not evaluated on SWE-Bench or Mind2Web. If you build persistent agents,
  failure-derived strategy memory is worth the retrieval cost.
