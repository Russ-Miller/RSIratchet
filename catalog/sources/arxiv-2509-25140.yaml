brief: >-
  Agents that distill abstract reasoning strategies from their own failures,
  not just successful trajectories, carry memory across tasks better than
  agents that store raw trajectories or success-only workflows. ReasoningBank
  writes each finished task into structured memory items (title, description,
  content), labelled success or failure by an LLM-as-a-judge with no ground
  truth, then retrieves them for later tasks in a streaming test-time setting.


  Tested on WebArena (684 tasks, 5 subsets), Mind2Web, and SWE-Bench-Verified
  with Gemini-2.5-flash, Gemini-2.5-pro, and Claude-3.7-sonnet, against No
  Memory, Synapse (trajectories), and AWM (workflows).


  Overall WebArena success rate rises +8.3, +7.2, and +4.6 over memory-free
  agents across the 3 backbones, with up to 1.4 fewer steps. On
  SWE-Bench-Verified, resolve rate goes 34.2 to 38.8 (flash) and 54.0 to 57.4
  (pro). Adding failures helps ReasoningBank (46.5 to 49.7) but hurts AWM
  (44.4 to 42.2). Memory-aware test-time scaling lifts parallel BoN from 49.7
  at k=1 to 55.1 at k=5, versus 52.4 for scaling without memory-aware
  aggregation.


  Evidence is measured with matched baselines, ablations on failure traces and
  aggregation, and a judge-noise simulation showing stability at 70%-90% judge
  accuracy (base judge 72.7%).


  Scaling analysis uses 1 subset and 1 model; no equal-token-budget
  comparison; gains on the hardest Multi and cross-domain splits stay small in
  absolute terms.


  If you build persistent agents, failure traces are usable training signal
  only if memory is abstracted above the trajectory level.
