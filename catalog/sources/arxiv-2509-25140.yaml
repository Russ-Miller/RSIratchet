brief: >-
  Storing distilled reasoning strategies from an agent's own failures, not
  just its successes, is what makes test-time memory pay off, and it also
  makes test-time scaling work better. ReasoningBank extracts titled,
  described, content-bearing strategy items from both successful and failed
  trajectories, labeled by an LLM-as-a-judge with no ground truth, and
  retrieves them into the system prompt for later tasks.


  Testing covers WebArena (684 tasks across 5 subsets), Mind2Web
  cross-task/website/domain, and SWE-Bench-Verified, on Gemini-2.5-flash,
  Gemini-2.5-pro, and Claude-3.7-sonnet, against No Memory, trajectory memory
  (Synapse), and workflow memory (AWM).


  Overall WebArena success rate rises +8.3, +7.2, and +4.6 over memory-free
  agents; SWE-Bench-Verified resolve rate goes 34.2 to 38.8 (flash) and 54.0
  to 57.4 (pro). On WebArena-Shopping, adding failure traces helps
  ReasoningBank (46.5 to 49.7) but hurts AWM (44.4 to 42.2). Memory-aware
  scaling at k=5 reaches 55.1 parallel vs 52.4 for vanilla TTS and 42.2
  without memory.


  Effects are measured with ablations that isolate the pieces: memory-free
  scaling, scaling without aggregation, success-only vs success-plus-failure
  memory, and a judge-noise simulation showing stability from 70%-90% judge
  accuracy (measured baseline 72.7%).


  Scaling curves and most analyses come from 1 subset (WebArena-Shopping) with
  1 model, and MaTTS was not run on Mind2Web or SWE-Bench. Compute cost per
  task under scaling is deferred to an appendix, so equal-budget comparison is
  not in the main results.


  If you build streaming agents, extract failure lessons rather than archiving
  winning trajectories.
