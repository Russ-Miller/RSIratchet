brief: >-
  Storing distilled reasoning strategies from an agent's own failures, not
  just its successes, is where most of the gain in agent memory comes from.
  ReasoningBank converts each finished trajectory into structured memory items
  (title, description, content), labels success or failure with an
  LLM-as-a-judge and no ground truth, retrieves relevant items for the next
  task, and consolidates new ones back.


  Tested on WebArena (684 tasks, 5 subsets), Mind2Web
  cross-task/website/domain splits, and SWE-Bench-Verified, with
  Gemini-2.5-flash, Gemini-2.5-pro and Claude-3.7-sonnet, against No Memory,
  trajectory memory (Synapse) and workflow memory (AWM).


  Overall WebArena success rate rises +8.3, +7.2 and +4.6 over memory-free
  agents; SWE-Bench-Verified resolve rate goes 34.2 to 38.8 (flash) and 54.0
  to 57.4 (pro). Adding memory-aware test-time scaling at k=5 lifts
  WebArena-Shopping from 49.7 to 55.1 parallel, 54.5 sequential, versus 52.4
  and 51.9 for vanilla TTS and only 39.0-42.2 without memory.


  The ablations isolate the cause reasonably well: a success-only versus
  success-plus-failure comparison (ReasoningBank 46.5 to 49.7, AWM 44.4 down
  to 42.2), a no-aggregation TTS control, and a simulated judge-accuracy sweep
  around a measured 72.7% judge accuracy.


  Absolute success rates stay low in cross-domain Mind2Web (SR 1.6-1.7) and
  the WebArena Multi subset, and compute cost per task is not matched across
  memory conditions.


  If you build streaming agents, failure traces are worth storing.
