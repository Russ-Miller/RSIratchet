brief: >-
  Breadth-first, systematic exploration of a website produces better web-agent
  training data than homepage-seeded task proposals or random walks, and the
  exploration trace itself is useful twice: as grounding for task synthesis
  and as hints for trajectory refinement.


  AutoSurfer explores each site with a queue of pages and action traces,
  recursively expands menus and dropdowns, deduplicates repeated functionality
  across pages, samples dynamic elements but covers fixed ones, caps synthesis
  at 1,000 complex tasks, then refines each task tuple with SynthAgent's web
  agent and converts the result to SFT data. GPT-4.1 drives exploration and
  refinement; Qwen2.5-VL-7B-Instruct is fine-tuned and evaluated on WebArena
  across CMS, Gitlab, Reddit and Shopping, 1 task per template (57, 56, 26, 55
  tasks).


  Overall accuracy is 24.23% for the all-sites model and 23.71% for
  per-website models, against 19.59% for SynthAgent, 13.40% for OS-Genesis,
  4.64% for Explorer, and 9.36% for the untuned base. GPT-4.1 unfinetuned
  scores 25.77%. Task diversity is 0.7774 versus 0.7459 for OS-Genesis and
  SynthAgent.


  The refinement stage is isolated by 1 ablation on Reddit: 11.54% from
  exploration data alone versus 34.62% refined. Exploration and task-synthesis
  contributions are not separately ablated. Transfer is checked on
  Qwen3-VL-8B-Instruct for Reddit only (30.77% vs 3.85%), with no competing
  methods rerun.


  Absolute numbers are low by design, since a deliberately simple agent is
  used; Maps and Wikipedia and cross-website tasks are excluded.


  Treat exploration coverage, not refinement algorithms alone, as the
  bottleneck in synthetic web trajectory data.
