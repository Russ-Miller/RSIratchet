brief: >-
  Exploring a website breadth-first, rather than proposing tasks from the
  homepage or random-walking, produces synthetic trajectories that train a
  stronger small web agent. AutoSurfer maintains a queue of discovered pages
  with their action traces, recursively expands menus and dropdowns, samples
  dynamic elements sparingly, and then uses the exploration trace both to
  ground task synthesis and to hint a refinement agent.


  SFT data from GPT-4.1-driven exploration was used to fine-tune
  Qwen2.5-VL-7B-Instruct, evaluated on WebArena with 1 task per template: 57
  CMS, 56 Gitlab, 26 Reddit, 55 Shopping.


  Overall accuracy was 24.23 for a single multi-site model and 23.71 for
  per-website models, against 19.59 for SynthAgent, 13.40 for OS-Genesis, 4.64
  for Explorer, and 9.36 for the untuned base. The GPT-4.1 agent scored 25.77.
  Task diversity was 0.7774 versus 0.7459 for OS-Genesis and SynthAgent.


  Two ablations are reported: training on exploration data alone gave 11.54 on
  Reddit versus 34.62 after refinement, and Qwen3-VL-8B-Instruct went from
  3.85 to 30.77 on Reddit. Both are single-website, small-scale; the Qwen3
  transfer was not run for competing methods.


  Boundaries: 1 agent scaffold (SynthAgent's, deliberately simple, so absolute
  accuracies are low), Maps and Wikipedia excluded, single-website tasks only,
  no cross-website or long-horizon evaluation, and the generator and evaluator
  share a provider.


  If you are building site-specific agents, exploration coverage looks like
  the binding constraint rather than base model size.
