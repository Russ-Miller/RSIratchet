brief: >-
  A router that also critiques drafts and decides when to stop recovers most
  of the strongest agent's accuracy while calling it for under 25% of
  invocations, beating one-shot and RL routing baselines.


  The controller is trained with GRPO on a finite-horizon MDP whose composite
  reward scores both the routing choice and the verification judgment, with
  Lagrangian penalties enforcing per-agent usage caps. Two pools were tested:
  Qwen2.5-7B-Base controlling Qwen3-30B-A3B-Instruct, Qwen2.5-7B-Instruct and
  Qwen2.5-1.5B-Instruct; and Qwen3-4B-Base controlling Qwen3-30B-A3B-Instruct,
  Ministral-3-8B-Instruct and Llama-3-2-1B-Instruct. Training was on
  MATH-lighteval, evaluation on 7 math benchmarks.


  Average accuracy reached 0.805 in System 1 versus 0.691 for Router-R1, and
  0.823 versus 0.665 in System 2, against 0.859 for always using the strongest
  agent. Ablations show accuracy jumps from 1 to 2 turns then saturates, and
  that removing the Lagrange multipliers collapses routing onto the strongest
  agent and drops averages to 0.565 and 0.501.


  Effects are measured, with 2 controller/pool configurations, a matched usage
  constraint applied to baselines at evaluation, and ablations on turn budget
  and multipliers. There is no cost or latency accounting at equal token
  budget, and no independent replication.


  Scope is math reasoning only, where routing and verification correctness are
  rule-checkable; non-verifiable domains would need a learned judge, and the
  authors note added inference latency.


  If you run a mixed-capability model pool, expect iterative critique plus
  usage caps to beat one-shot routing, at the cost of extra turns.
