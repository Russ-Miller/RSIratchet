summary: "Multi-agent large language model (LLM) systems often rely on a
  controller to coordinate a pool of heterogeneous models, yet existing
  controllers are typically limited to one-shot routing: they select a model
  once and return its output directly. Such routing-only designs provide no
  mechanism to critique intermediate drafts or support iterative refinement.
