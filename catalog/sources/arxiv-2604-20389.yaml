brief: >-
  Passing general IT security benchmarks says little about whether a model
  knows vendor-specific procedures or formal industrial standards.
  CyberCertBench assembles multiple-choice questions scraped from
  certification exam banks for Cisco CCNx, Fortinet NSE, Fortinet ICS/SCADA
  and ISA/IEC 62443, alongside MMLU Computer Security and CyberMetric80, and
  evaluates a range of proprietary and open-weight models at 5-shot with
  temperature 0 and strict exact-match scoring.


  Against the 80% certification passing grade, top models clear the bar on
  Cisco CCNx and often on the conceptual Fortinet ICS/SCADA set, while on
  ISA/IEC 62443 only Claude 3.5 Sonnet passes at 81%. Fortinet NSE, which
  tests procedural vendor configuration, tops out at 62.4%. On the hardest
  ISA/IEC 62443 and Fortinet NSE items, even the largest models stay below
  40%, and the scaling curve is nearly flat. Qwen3 14B and Mistral Small 3.1
  24B match Llama 3.1 405B on average.


  The gradient is measured across 11 models in the headline comparison, but
  datasets are small (43–200 questions), drawn from community-run dump sites
  with acknowledged selection bias, and manually corrected rather than
  officially sourced. Contamination from those public sites is not tested.


  The interpretability contribution is weaker: a GPT-5 Proposer-Verifier
  scheme reaches only 39.0% average F1 for synthesized difficulty descriptions
  versus 33.3% random, and falls below chance on CyberMetric80.


  Treat general cybersecurity scores as no evidence of OT or vendor
  competence.
