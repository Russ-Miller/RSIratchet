brief: >-
  Strong scores on general IT security benchmarks do not transfer to
  vendor-specific procedures or formal industrial standards. Accuracy falls
  along a gradient of knowledge specificity, and scaling does not close the
  gap.


  CyberCertBench is a multiple-choice suite scraped from certification
  question banks (Cisco CCNx, Fortinet NSE, Fortinet ICS/SCADA, ISA/IEC
  62443), de-duplicated and manually label-checked, plus MMLU Computer
  Security and CyberMetric80 as baselines. Evaluation used 5-shot prompting,
  temperature 0, exact-match scoring, across proprietary and open-weight
  models.


  Against the 80% certification passing grade, top models pass on Cisco and
  often on the conceptual OT set. On ISA/IEC 62443 only Claude 3.5 Sonnet
  passes, at 81%; on Fortinet NSE the best score is 62.4%. On the hardest tier
  of ISA/IEC 62443 and Fortinet NSE, even the largest models stay below 40%,
  with a near-flat curve against parameter count. A filtered PRO split
  (removing questions 2 of 3 small models answer correctly, roughly 50% of
  items, 39.0%–67.4% by dataset) drops Qwen2.5 7B by 25 points and Ministral
  3B from 62% to 18%.


  Evidence is measured across 6 benchmarks, but datasets are small (43–200
  questions), sourced from community sites with selection bias, and the human
  baseline is a nominal passing score rather than measured experts. The
  Proposer-Verifier difficulty-explanation method reaches only 39.0% average
  F1 versus 33.3% random, with large variance, and uses GPT-5 to judge itself.


  Treat general cybersecurity benchmark scores as no evidence of OT or
  vendor-specific reliability.
