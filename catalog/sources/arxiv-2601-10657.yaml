brief: >-
  LLM-driven evolutionary search fails mostly for context reasons, not
  reasoning reasons: histories saturate with failed attempts, the model
  anchors to local hypotheses, and runs that do not find a good solution in
  the first few iterations rarely recover. PACEvolve attacks this with
  hierarchical context management (pruning and summarizing idea/hypothesis
  memory, with a permanent record of failures), momentum-based backtracking
  that reverts to an earlier state when a scale-invariant progress momentum
  drops below threshold, and a self-adaptive multi-island policy that chooses
  between backtracking and crossover based on absolute progress.


  Setup: LLM-SR nonlinear oscillator symbolic regression, 16 KernelBench
  kernels on 1 A100 40GB, and Modded NanoGPT on 8 H100s. 1000 iterations per
  run, 10 repeats, Gemini 2.5 Pro as backbone (Gemini 3 Pro for NanoGPT),
  against ShinkaEvolve, OpenEvolve, CodeEvolve, LLM-SR, uDSR.


  On LLM-SR, PACEvolve-Multi reaches -8.24 best and -7.64 P75 log10 NMSE
  versus -7.26 and -5.92 for the best baselines. On KernelBench it beats the
  leaderboard kernel in all 16 cases; Multi beats Single in 13/16, ties or
  beats ShinkaEvolve and CodeEvolve in 14/16, OpenEvolve in 15/16. It loses to
  PyTorch on MatMul (0.97x). On Modded NanoGPT v40 it cuts 142.8s to 140.2s.


  A cumulative ablation over the same 10-run distribution isolates each
  component: context management lifts mean and best but not worst,
  backtracking fixes the worst at slight cost to the best, crossover recovers
  both. That is a clean attribution, but on 1 task, 1 model family, and
  iteration-matched rather than token-matched budgets.


  Boundaries: gains on heavily optimized dense matmul are absent, and the
  NanoGPT result is a single run of incremental wins, not a distribution.


  If you build evolutionary agent scaffolds, this says memory hygiene and
  stagnation detection, not better prompts, are where the headroom is.
