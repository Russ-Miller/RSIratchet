brief: >-
  Computer-use agents can pass many intermediate checkpoints in real
  enterprise software and still almost never finish a workflow: the best model
  resolves under 4% of tasks end-to-end while scoring ~44% on weighted
  checkpoints.


  SaaS-Bench deploys 23 real open-source SaaS systems via Docker across 6
  professional domains, with 106 expert-vetted tasks (74 text-only, 32
  multimodal). Agents act only through browser-use, with DOM and screenshot
  observations, no database or API access, and environments reset to a fixed
  initial state before each run. 14 frontier models were scored on Resolved
  Score (all checkpoints pass) and weighted Checkpoint Score.


  Claude Opus 4.7 leads at 43.9% checkpoint score and 3.8% resolved; GPT-5.5
  High 43.8%, Opus 4.6 43.2%, and the weakest text-only models near 15.8%.
  Checkpoint pass rates decline monotonically from early to late stages for
  every model. Pass@3 adds roughly 8 pp over pass@1. Per-task scores fall from
  ~53% on the simplest tasks to under 20% on the longest, and 65% to 27% as
  checkpoints grow from ≤6 to ≥18.


  The decay, cascade, and variance claims are measured on trajectories, but
  failure-mode breakdowns come from a single model (Opus 4.6) and some case
  analyses rest on 1–3 runs of 1–2 tasks. Only 1 execution framework was
  tested; no scaffold ablation, no human baseline.


  If you cite checkpoint-style partial-credit scores as agent competence, this
  suggests they overstate deployable reliability by an order of magnitude.
