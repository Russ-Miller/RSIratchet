summary: >-
  This paper introduces and operationalizes summarization bias: a proposed
  systematic tendency of large language models (LLMs) to represent narrative
  meaning as an abstract summary label rather than as the reconstructable
  inferential structure that produces it. Within the Bulut Doctrine,
  narrative effect is theorized along a told-shown axis: in told mode,
  emotional and informational content is declared explicitly and requires
  little reader reconstruction; in shown mode, that content is suppressed at
  the surface and must be reconstructed from physical cues and indirection
  (Objective Projection).
notes: >-
  Filed as a source on judge-position-bias from the classifier's judgement
  that the paper is about it (measures, low): The paper proposes and
  operationalizes a measurement construct for a judge-side stylistic bias
  (rewarding told-mode explicitness) without demonstrating a fix or a
  regression, and explicitly states the bias is not yet validated. No claim
  has been drafted from it yet.
