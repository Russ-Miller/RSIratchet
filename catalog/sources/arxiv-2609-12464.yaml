summary: >-
  As enterprises modernize legacy monolithic systems to microservices, Large
  Language Models (LLMs) are heavily utilized for automated code
  translation. However, traditional vector-based Retrieval-Augmented
  Generation (Standard RAG) struggles to capture topological relationships.
  It fetches isolated chunks that sever inheritance chains, leading to high
  compilation failure rates. This paper introduces a Hierarchical
  Context-Resident Graph (HCRG) methodology to resolve these limitations.
