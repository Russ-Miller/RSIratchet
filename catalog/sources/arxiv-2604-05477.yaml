brief: >-
  Training a GUI agent to predict each action's expected screen effect and
  then check that effect on the next step removes the infinite-retry loops
  that otherwise kill offline-trained agents outright. VeriGUI wraps a
  Thinking-Verification-Action-Expectation cycle around Qwen2.5-VL-3B and -7B,
  trained in 2 stages: supervised fine-tuning on a 70:30 mix of success and
  synthetic failure trajectories, then GRPO with asymmetric verification
  rewards (+1.0 correct, -0.5 miss, -2.0 hallucinated success). Evaluation
  spans AndroidControl-High, AITW-Gen, GUI Odyssey, plus live MiniWoB++ and
  AndroidWorld.


  Under pseudo-online simulation all 3B baselines score 0 Sim-TSR; VeriGUI-3B
  reaches 16.7% and VeriGUI-7B 23.5%. Recovery Success Rate is 51.1% and 52.5%
  versus 45.5% for UI-TARS-7B and 21.9% for GPT-5.1. Live gains follow: 59.7%
  MiniWoB++ and 25.1% AndroidWorld for the 7B. Output tokens per step rise
  about 45%, but tokens per trajectory fall because loops end early.


  Stage and reward ablations isolate the contributions: Robust SFT lifts RSR
  from 29.7% to 45.5%, GRPO to 51.1%, and dropping the effect reward costs 3
  points. Both online benchmarks are unmodified, so the transfer claim is
  measured rather than argued, though all training sits on 1 model family.


  The simulated evaluation assumes failed actions leave the screen unchanged,
  so crashes, partial transitions and stray navigations are untested, and the
  authors note degradation with task length. If you train GUI agents offline,
  failure-injection data plus a hallucination penalty is a cheap substitute
  for live RL.
