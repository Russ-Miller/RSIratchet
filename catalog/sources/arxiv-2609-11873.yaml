summary: "Recursive self-improvement (RSI) enables AI systems to turn
  experience and feedback into persistent changes that improve both their
  capabilities and the process of future improvement. We first use the
  Headroom-Closed Index (HCI) to reveal the problems of existing LLMs, then
  introduce the RSI concept and its development roadmap: from
  improvement-execution autonomy, improvement-strategy autonomy,
  experience-acquisition autonomy, and environment-adaptation autonomy, to
  recursive meta-improvement. Next we examine RSI across scenarios (e.g.,
  scientific discovery, embodied intelligence, software engineering),
  highlighting their distinct requirements and development speeds. Drawing on
  diverse industry practices and preliminary empirical evidence, we connect
  RSI research with practical systems and identify key challenges to achieving
  genuine RSI."
notes: "Forwarded by Russ 2026-09-13: a survey and roadmap of recursive
