brief: >-
  Recursive self-improvement is best treated as a property of an improvement
  loop, not an algorithm, and by that criterion no current system demonstrates
  it: the papers surveyed keep archive maintenance, acceptance rules, and
  evaluator design in human hands. This survey builds a 5-level autonomy
  hierarchy (execution, strategy, experience acquisition, environment
  adaptation, recursive inheritance) plus a non-RSI baseline B0 for in-session
  refinement, and maps systems, techniques, and 4 application domains
  (science, embodied, software engineering, healthcare) onto it.


  To motivate the gap, the authors introduce the Headroom-Closed Index,
  normalizing scores against the 90th-percentile frontier in a benchmark's
  entry year, over 393 model-benchmark observations across 10 domains for
  2023-September 2026 releases. By 2026 advanced mathematics reaches 86.4 and
  graduate-level science 85.8, while software engineering sits at 52.6, search
  and terminal agents 56.8, and tool agents 39.9. Cited RSI results are mixed:
  A-Evolve-Training moved a 30B Nemotron external score from 0.80 to 0.86 over
  4 rounds against 0.87 for the top human submission; Darwin Godel Machine
  went from 20% to 50% on a SWE-bench subset; 14% of Godel Agent's 100 MGSM
  trials ended below the initial policy.


  The HCI trajectories are measured but built on weighted consensus over
  heterogeneous sources, with self-reported scores downweighted by 0.75 and 16
  of 33 audited results excluded for protocol mismatch; the post-2026
  extension is an explicit illustrative formula, not a prediction. Per-system
  claims are quoted from primary reports, not replicated, and many industrial
  sources are blogs and technical reports.


  Useful if you want a vocabulary for separating structural recursion from raw
  score gains when reading self-improvement claims.
