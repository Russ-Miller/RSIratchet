summary: >-
  Multimodal Large Language Models (MLLMs) have shown remarkable success in
  STEM domains, where progress is often driven by vertical, step-by-step
  deduction under relatively stable symbol systems. Their horizontal,
  interdisciplinary cultural reasoning, however, remains underexplored.We
  propose CM2, a multi-agent framework grounded in the cognitive pathway of
  human cultural interpretation. CM2 integrates multimodal perception,
