summary: >-
  Large language model (LLM)-based multi-agent systems (MAS) show strong
  promise for complex reasoning, planning, and tool-augmented tasks, but
  designing effective MAS architectures remains labor-intensive, brittle,
  and hard to generalize. Existing automatic MAS generation methods either
  rely on code generation, which often leads to executability and robustness
  failures, or impose rigid architectural templates that limit
  expressiveness and adaptability. We propose Evolutionary Generation of
  Multi-Agent Systems (EvoMAS), which formulates MAS generation as
  structured configuration generation. EvoM
