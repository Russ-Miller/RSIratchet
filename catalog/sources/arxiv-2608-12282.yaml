summary: >-
  Agents deployed in enterprise settings must reason across structured APIs
  and document collections, yet existing benchmarks evaluate these
  capabilities in isolation. We introduce VAKRA (e\textbf{V}aluating
  \textbf{A}PI and \textbf{K}nowledge \textbf{R}etrieval \textbf{A}gents), a
  benchmark of over $8{,}000$ executable APIs across $62$ domains with tasks
  spanning three settings of increasing difficulty: diverse API interaction
  styles, multi-hop reasoning over structured APIs, and multi-source
  reasoning with natural-language tool-use policy constraints. Correctness
  is verified by re-executing pr
