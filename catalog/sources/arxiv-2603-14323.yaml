brief: >-
  Medical multimodal LLMs attend to the wrong parts of a medical image even
  when the question is designed so the answer requires looking at a single
  annotated region, and that misalignment is domain-specific rather than a
  general model weakness.


  The authors built VGMED with 3 clinicians: 13,962 image–bounding-box pairs
  drawn from over 40 public medical segmentation datasets, expanded with
  GPT-4-generated localization and attribute questions into roughly 28K
  image–bbox–question triplets, plus a matched MS COCO set built through the
  same pipeline. Grounding is scored from LLM attention maps using attention
  ratio plus newly proposed KL and JS divergences against the box, across 8
  medical MLLMs including LLaVA-Med, LLaVA-Tri, HuatuoGPT-V-7B/34B, VILA-M3,
  and MedRegA.


  All 8 show lower AR and higher divergence on medical images than on natural
  ones, across most layers and both question types; general-domain LLaVA-v1.5
  also fails on medical images while medical models ground fine on COCO, which
  separates domain from model capacity.


  VGRefine, an inference-time attention triage plus knockout at layer 16,
  lifts HuatuoGPT-V by +5.6% on VQA-RAD and +11.3% on PathVQA, average 65.3%
  to 68.4%; MMMU Health & Medicine 45.8% to 47.2%; OmniMedVQA 71.3% to 74.4%
  with CT +7.5%, MRI +6.4%, X-Ray +8.1%. Ablations over K and p are reported.


  Caveats: the method is applied to 1 model only, some baseline numbers are
  copied from prior papers rather than re-run, attention is taken as a proxy
  for grounding without causal perturbation checks, and the human study is 5
  clinicians on 20 cases (76% preference).


  If you assumed medical MLLM errors were mostly missing clinical knowledge,
  this argues a sizeable share is localization that can be fixed without
  retraining.
