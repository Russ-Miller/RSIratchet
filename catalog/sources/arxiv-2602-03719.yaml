brief: >-
  Credit assignment in long-horizon search agents works better when you
  contrast alternative continuations from the same prefix than when you score
  intermediate states. The premise is non-monotonic correctness: early
  mistakes get fixed later, promising prefixes still fail, so state values
  mislead.


  BranPO truncates a trajectory at a late-stage point, resamples
  continuations, and keeps only branches whose outcomes diverge from the
  original, then applies prefix-level and branch-level group-relative
  advantages. Difficulty-aware branch sampling allocates budget by task
  accuracy; Redundant Step Masking zeroes advantages on superfluous tail
  search steps. Trained on Search-R1 and ASearcher with Qwen2.5-7B-Instruct
  and Qwen3-4B-Instruct.


  On 4 multi-hop QA benchmarks under Search-R1, BranPO averages 42.2% EM and
  53.2% F1, ahead of the strongest prior method by 3.3% EM and 4.5% F1. On
  ASearcher it beats GRPO on both backbones, where Tree-GRPO, ARPO and AEPO do
  not. On ALFWorld with a segment-level variant it reaches 93.6 vs 90.8 for
  GiGPO.


  Evidence is reasonable: ablations remove DBS (52.7 avg F1) and RSM (53.7 vs
  54.6), all RL methods warm-start from the same SFT model, and wall-clock
  training time is reported as comparable. Some baseline numbers are copied
  from original papers rather than rerun.


  Limited to Qwen models and search/embodied tasks; the sparse-reward rollout
  cost remains.
