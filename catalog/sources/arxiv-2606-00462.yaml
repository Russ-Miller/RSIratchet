summary: >-
  Short-form text rewriting is a constrained variant of paraphrasing in
  which limited context and high semantic density leave little room for
  variation. While large language models perform well on general
  paraphrasing, small language models (SLMs) often struggle with semantic
  fidelity and hallucination robustness in short-form settings. In this
  work, we present an empirical study of adapting an SLM, Phi Silica, for
  short-form rewrite through dataset curation, prompt distillation,
  parameter-efficient fine-tuning, and evaluation. We curate a dataset of
  short presentation-style text from public sli
