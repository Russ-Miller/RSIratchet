summary: >-
  Deploying Large Language Models (LLMs) in real-world dynamic environments
  raises the challenge of updating their pre-trained knowledge. While
  existing knowledge editing methods can reliably patch isolated facts, they
  frequently suffer from a \textit{reasoning gap}, where the model recalls
  the edited fact but fails to utilize it in multi-step reasoning chains.
