summary: >-
  Large language model (LLM)-based multi-agent systems (MAS) achieve strong
  performance by employing specialized multiple agents, yet their
  performance depends on the prompt design of each agent. For MAS prompt
  optimization, textual gradient methods that guide prompt updates using
  natural-language feedback have emerged as a leading paradigm. In this
  paper, we identify limitations in two stages of existing textual gradient
  approaches: gradient extraction and gradient aggregation. In gradient
  extraction, previous works select a target prompt without verifying
  whether modifying it resolves the fail
