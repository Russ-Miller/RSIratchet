brief: >-
  LLMs write RTL that passes functional simulation while failing security
  checks, and the bottleneck is missing weakness awareness in the
  specification rather than an inability to write defensive hardware.


  SecRTL-Gen contains 98 designs from OpenTitan, Hack@DAC 2021, CVA6 and PULP,
  each rendered in Verilog, SystemVerilog, VHDL and Amaranth Python for 392
  instances, spanning 5 resource-access CWE families, with black-box
  functional and security testbenches and specifications that deliberately
  omit security obligations. 5 frontier models (GPT-5.6, DeepSeek-v4, GLM-5.2,
  Mimo-v2.5, MiniMax-M3) were run under vanilla, self-think and CWE-cued
  prompts, 5 runs each.


  Vanilla prompts give 73.4%-79.4% functional pass but 14.5%-35.4% security
  pass; MiniMax-M3 has the best functional average (79.4%) and near-worst
  security (20.1%). CWE knowledge lifts mean security from 23.3% to 59.4% but
  drops functional pass from 76.3% to 60.1%. RTL-Obliger, which extracts a
  semantic graph and symbolically matches it against a CWE ontology before a
  two-stage revision, raises mean all-pass from 49.6% (SecV) and 51.4%
  (RESCUE) to 61.6%.


  Gains are measured with paired Wilcoxon tests (n=392 per model) and a
  leave-one-out ablation showing symbolic matching as the main driver (57.8%
  to 49.7%). Baselines are re-implementations, the ablation and agent
  comparison use 1 model and 1 run, and coverage is limited to port-observable
  access-control weaknesses, not side channels or fault injection.


  If you evaluate hardware generators on functional tests alone, you are
  measuring roughly a third of what matters.
