brief: >-
  Replacing rigid AST matching and fix templates with an LLM plus
  embedding-based retrieval raises multi-hunk and "sibling" bug repair
  substantially, but the gains depend heavily on fault localization quality
  and test coverage.


  SiblingRepair starts from spectrum-based fault localization, retrieves
  candidate sibling locations across all test-exercised code using TF-IDF
  pruning (top 100) then TEXT-EMBEDDING-ADA-002 cosine similarity, and prompts
  an LLM (DeepSeek-V3.2) to both select failure-relevant siblings and patch
  them, either simultaneously or one candidate at a time with promising
  patches carried forward. Evaluated on Defects4J v2.0.1 (835 bugs) and 17
  GHRB sibling bugs against Hercules, ITER, ARJACLM, and ThinkRepair, with a
  5-hour budget per bug.


  Under SBFL it correctly repairs 176 bugs vs 78 (ITER), 37 (ARJACLM), 28
  (Hercules); 23 sibling bugs vs 4 for Hercules; 76 multi-hunk vs 24. Under
  single perfect fault localization, 278 total, 124 multi-hunk, 29 sibling.
  Median time to a correct patch: 9 minutes (SBFL), 6 minutes (SPFL).


  Evidence is measured end-to-end with baselines rerun by the authors, and
  1,751 plausible patches manually judged, though the authors explicitly
  declined a standard ablation, so component contributions are described
  rather than isolated, and patch correctness is self-assessed.


  Boundaries: Java only, 1 primary model, and of 77 Defects4J sibling bugs 48
  fail — 18 from incomplete test coverage, 12 from retrieval misses, 11 from
  patch generation despite correct sibling selection. Candidate detection
  finds all sibling statements for only 53.2% (41/77) of bugs. GHRB results
  with GPT-3.5-Turbo, whose cutoff predates the dataset, were comparable,
  arguing against heavy leakage.


  If you track APR, retrieval plus LLM selection is now the stronger paradigm
  for related multi-location bugs, with localization and coverage as the
  binding constraint.
