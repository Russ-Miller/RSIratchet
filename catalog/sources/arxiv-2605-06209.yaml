summary: >-
  Developers often make similar mistakes across code locations implementing
  related functionalities. These locations, called siblings, share similar
  issues and require similar fixes. Accurately identifying siblings and
  consistently repairing them are crucial for automated program repair.
  Hercules is a SOTA technique designed for sibling repair. However, it is
  limited by strong assumptions about sibling locations and commit-history
  availability, rigid AST-based sibling matching, and inflexible
