summary: >-
  Large Language Models (LLMs) are powerful candidates for complex
  decision-making, leveraging vast encoded knowledge and remarkable
  zero-shot abilities. However, their adoption in high-stakes environments
  is hindered by their opacity; their outputs lack faithful explanations and
  cannot be effectively contested to correct errors, undermining
  trustworthiness. In this paper, we propose ART (Adaptive Reasoning Trees),
  a hierarchical method for claim verification. The process begins with a
  root claim, which branches into supporting and attacking child arguments.
