brief: >-
  Embodied LLM agents can cut inter-agent chatter by an order of magnitude and
  still plan better, if the implicit assumptions already present in their
  chain-of-thought are extracted and scored instead of resolved through
  dialogue.


  PCE splits the planning module into Planner (produces a reasoning trace),
  Composer (turns the trace's latent assumptions into a decision tree with
  True/False assumption nodes and actions at leaves, depth D = 3), and
  Evaluator (scores each root-to-leaf path by scenario likelihood, conditional
  gain, and execution cost). Tested on C-WAH (10 episodes, horizon 250) and
  TDW-MAT (24 episodes, 10 target objects, horizon 3000) against CoELA,
  REVECA, CaPo and CoTS, on GPT-4o mini, GPT-OSS:20B and Gemma3:4B.


  With GPT-4o mini, C-WAH Total Steps fall to 42.76 vs 46.80 (REVECA) and
  60.40 (CoELA), with 1.70 communication actions vs 9.88. TDW-MAT Total rises
  to 87.50 vs 81.25 and 62.50. Token Usages are comparable, not always lowest:
  44353.56 vs CaPo's 41702.00 on C-WAH, and 197807.29 vs CoELA's 113058.83 on
  TDW-MAT.


  Evidence is measured across 3 backbones, with component ablations (w/o
  Composer: 46.82 steps; w/o Evaluator: 47.34) and a scaling ablation showing
  a Planner-only variant improves only modestly from Gemma3:4B to 12B to 27B
  and from GPT-OSS low to high reasoning. The user study is small (12
  participants, 7-point Likert, 3 conditions) and self-run.


  Simulated household tasks only, mostly 2 agents; token advantage is not
  uniform.


  If you are paying for multi-agent dialogue, structured assumption scoring is
  the cheaper lever.
