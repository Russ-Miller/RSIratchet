summary: Embodied agents operating in multi-agent, partially observable, and
  decentralized environments must plan and act despite pervasive uncertainty
  about hidden objects and collaborators' intentions. Recent advances in
  applying Large Language Models (LLMs) to embodied agents have addressed many
  long-standing challenges, such as high-level goal decomposition and online
  adaptation. Yet, uncertainty is still primarily mitigated through frequent
  inter-agent communication. This incurs substantial token and time costs, and
  can disrupt established workflows, when human partners are involved. We
