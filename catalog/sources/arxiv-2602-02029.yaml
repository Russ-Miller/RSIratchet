  descriptions is a growing focus in operations research, yet current
  LLM-based approaches struggle with the composite constraints and
  appropriate modeling paradigms required by complex operational rules. To
  address this, we introduce the Canonical Intermediate Representation
  (CIR): a schema that LLMs explicitly generate between problem descriptions
  and optimization models. CIR encodes the semantics of operational rules
