summary: >-
  Large language models (LLMs) are increasingly used in peer review at major
  AI conferences, yet novelty remains a persistent weak point. Existing
  benchmarks assess novelty as a single holistic score, making it difficult
  to diagnose which dimension a model misjudges or whether its evidence is
  faithful. We present NovGauge, a human-anchored benchmark for fine-grained
  novelty assessment diagnosis. The benchmark contains 619 paper pairs and
  50 multi-paper sets, drawn from two expert sources: ICLR reviewer overlap
  claims and survey co-citations. Instances are independently labeled along
  three dimens
notes: >-
