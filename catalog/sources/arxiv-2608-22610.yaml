  and dynamically reused from skill banks, have become a central mechanism
  for enabling large language model (LLM)-based self-evolving agents to
  learn from past experience. Yet existing work has largely focused on the
  operational aspects of skills, such as acquisition, evolution, and
  retrieval, while leaving a more fundamental reliability question
