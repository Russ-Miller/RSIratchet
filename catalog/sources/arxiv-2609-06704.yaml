brief: >-
  Post-hoc explanations track the visual evidence that moves a model's
  predictions better than pre-answer chain-of-thought does, reversing the
  usual assumption that reasoning-before-answering is the more faithful
  format.


  The authors port the Counterfactual Test and Correlational Counterfactual
  Test to images as vCT and vCCT: a pipeline (Qwen2.5-VL-7B for object
  selection, Qwen-Image-Edit for inpainting, Grounding DINO plus SAM for
  filtering) builds minimally edited image pairs differing by 1 removed
  object, released as Counter-SNLI-VE and Counter-A-OKVQA. 8 open-source VLMs
  (Qwen3.5-9B, Qwen2.5-VL-32B, Qwen3-VL-30B-A3B, InternVL3-38B,
  InternVL3.5-38B, Ovis2.5-9B, Kimi-VL-A3B, R-4B) are queried in
  Predict-then-Explain and CoT modes; vCCT correlates total variation distance
  in answer probabilities with whether the removed object is mentioned.


  Mean vCCT is 0.303 (PE) vs 0.200 (CoT) on A-OKVQA and 0.264 vs 0.129 on
  SNLI-VE, with PE ahead in all 16 model-dataset pairs. Binary vCT saturates:
  0.951/0.930 on A-OKVQA, 0.949/0.895 on SNLI-VE.


  Evidence is measured with paired permutation tests, image-clustered
  bootstrap intervals, an accuracy-matched control (gap 0.110 vs 0.119), a
  directional-mention control, and a no-op reconstruction control on 500
  SNLI-VE rows where object removal shifts TVD 0.0960 vs 0.0348 under PE. A
  141-example audit found 87.9% correct edits and 92.2% correct mention
  detection; change-mention judging is itself a model (Qwen3-4B-Thinking).


  Scope is object removal on 2 datasets; color edits were only a 122-pair
  feasibility test (11/16 comparisons favor PE), and relations, counting and
  actions are untested, as are hidden reasoning traces.


  If you use vCT-style binary faithfulness scores, expect them to be
  uninformative and switch to a correlational metric.
