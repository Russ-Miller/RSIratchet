summary: Extracting structured data from web pages has long been a challenging research
  topic, particularly for domain-specific data on vertical websites. The advent
  of large language models (LLMs) has introduced new possibilities for this task,
  enabling high-accuracy information extraction from individual pages. However,
  due to the substantial costs associated with LLMs, this approach is often economically
  impractical and difficult to scale in industrial applications. To address these
  challenges we propose a new framework that leverages a multi-task decomposition
  strategy, enabling LLMs, despite their limitations in handling structured information,
  to learn robust XPath expressions from seed pages and apply them to unseen web
  pages. Experimental results on various structured web data extraction datasets
  demonstrate that this framework achieves state-of-the-art accuracy for vertical
  websites with minimal LLM interactions. Furthermore, our approach significantly
  outperforms the top prompting-based methods, Reflexion and COT, improving F1 scores
