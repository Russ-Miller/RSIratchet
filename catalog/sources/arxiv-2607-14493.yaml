summary: >-
  Large Language Models are increasingly deployed in Security Operations
  Centers for log analysis tasks including summarization, alert triage, and
  threat investigation. These systems ingest logs from external-facing
  services and process network logs as natural language contexts to generate
  security insights. We demonstrate that this architectural pattern
  introduces a critical vulnerability: adversaries can embed prompt
  injection payloads in log-generating fields that persist in storage and
  are executed when analysts query the LLM, achieving what we term passive
  prompt injection. We present LogIn
