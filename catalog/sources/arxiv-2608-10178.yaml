summary: >-
  Self-evolving harnesses are closed-loop systems in which an agent inspects
  its own rollouts and edits its prompts, tools, and memory. They reliably
  improve coding agents in evaluations, but prior work reports aggregate
  gains rather than analyzing what the evolved artifacts encode. It
  therefore remains unclear whether they encode benchmark-specific
  adaptations, language-specific engineering knowledge, or compensation for
  limitations of the underlying model. We disentangle these factors by
