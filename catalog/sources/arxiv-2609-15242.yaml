summary: >-
  Environmental, Social, and Governance (ESG) reporting is critical for
  corporate accountability, with Large Language Models (LLMs) and
  Retrieval-Augmented Generation (RAG) offering strong potential to automate
  KPI extraction. However, open-source LLM performance in domain-specific
  ESG tasks remains insufficiently understood. This paper evaluates
  open-source LLMs in ESG contexts using a structured framework and
  evaluation resource based on 498 real-world ESG reports from EU-listed
  companies (2010-2024). We evaluate seven open-source models (2B to 30B
  parameters) -- glm-4.7-flash, nemotron-3-nano
notes: >-
