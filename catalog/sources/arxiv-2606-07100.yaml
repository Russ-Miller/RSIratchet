summary: >-
  Visual-language action (VLA) models enable robots to predict actions
  directly from observations and language instructions, but their
  performance depends on large-scale, high-quality data and is limited by
  the scarcity of real-world robot action datasets. To facilitate VLA model
  learning with abundant unlabeled human videos, Latent Action Models (LAM)
  learn latent action representations from visual dynamics to provide
  additional supervision for VLA learning. However, LAM and VLA are
  typically trained separately, leaving LAM ungrounded during VLA training
  and VLA models constrained by frozen LAM
notes: >-
