summary: >-
  Large language models (LLMs) are increasingly deployed as interactive
  agents, yet their capacity for social and strategic reasoning over
  extended interaction remains poorly understood. Existing evaluations rely
  on static vignettes or single-game benchmarks that cannot capture the
  sustained, multi-faceted reasoning that real-world multi-agent settings
  demand. We introduce Mindgames, a multi-game arena and evaluation platform
  for LLM agents that operationalizes complementary reasoning demands
  relevant to ``theory of mind'': belief attribution under hidden
  information, opponent modeling through r
