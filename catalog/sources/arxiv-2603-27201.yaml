summary: >-
  Multimodal Chain-of-Thought (MCoT) models have demonstrated impressive
  capability in complex visual reasoning tasks. Unfortunately, recent
  studies reveal that they suffer from severe hallucination problems due to
  diminished visual attention during the generation process. However, visual
  attention decay is a well-studied problem in Large Vision-Language Models
  (LVLMs). Considering the fundamental differences in reasoning processes
