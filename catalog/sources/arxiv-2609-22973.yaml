summary: >-
  Adapting a pretrained Vision-Language-Action (VLA) model to a new robot,
  environment, or task requires demonstrations that are collected locally
  and often discarded. Federated learning is a promising approach to
  exploiting such distributed demonstrations by learning a shared policy.
  However, whether it can adapt large pretrained VLAs remains an open
  question, and a lack of reproducible benchmarks for pretrained VLAs and
  reusable training frameworks makes existing results difficult to compare.
