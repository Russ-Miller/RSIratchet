brief: >-
  Telling a code agent exactly what the fixed behavior should be, in
  executable form, rescues most of the bugs it fails blind — but the
  specification was validated against the known fix, so the number is an upper
  bound, not a deployable result.


  Prometheus splits repair into 3 roles: an Architect (Gemini-3.0-Pro) that
  reverse-engineers a Gherkin BDD scenario from the runtime failure report, an
  Engineer that checks the scenario fails on the buggy code and passes on the
  developer-fixed code, and a Fixer (Qwen-3.0-Coder) restricted to the single
  primary suspicious file. Evaluated on 680 Defects4J v3.0.1 defects across 16
  projects, with Closure excluded.


  The blind Fixer solved 520/680 (76.5%). Applying the spec-guided Fixer to
  the 160 failures rescued 119, a 74.4% rescue rate and a composite 639/680
  (93.97%). On those same 160 hard bugs, TSAPR resolved 22 and RepairAgent 27,
  a 4.4x gap. The Engineer consumes 58.2% of the 5,782,441 average tokens; the
  Architect only ~6.4%.


  The ablation is clean in one respect — the Enlightened Fixer gets a strict
  superset of the blind input — but the enlightened arm never ran on the 520
  already-solved bugs, there is no matched-token-budget blind baseline, and
  the oracle is the ground-truth fix the authors acknowledge is unavailable in
  practice. Single-file scope excludes multi-file defects (Time-1 degraded
  badly), and BDD failed on implicit binary protocols (Collections-8).


  Read the 93.97% as a measurement of how much headroom intent clarity
  represents, not as a repair rate.
