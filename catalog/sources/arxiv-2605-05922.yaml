brief: >-
  Separating chain-of-thought reasoning from reward prediction gives a video
  reward model both the generalization of CoT and the training stability of
  regression, which neither generative nor discriminative reward models get
  alone.


  DeScore builds on Qwen3-VL-8B: the MLLM writes a CoT, then a learnable query
  token plus a regression head emits a scalar reward. Training runs in 2
  stages, a discriminative cold start with Bradley-Terry loss and random CoT
  masking, then RL where GRPO shapes the reasoning while an auxiliary BT loss
  calibrates the score. Data is 22K human-annotated preference pairs over T2V
  outputs; evaluation covers an in-domain set of 1,469 pairs, GenAI (1.9k
  pairs) and VideoGen-Bench (26.5k pairs).


  DeScore reaches 0.734 in-domain, 0.765 Acc w/o Tie on GenAI and 0.768 on
  VideoGen-Bench, against 0.722 for the best discriminative baseline
  VideoAlign and 0.582 for the best generative baseline, with 76% less
  training data.


  Ablations isolate each piece: adding CoT lifts in-domain from 0.588 to
  0.615, random masking to 0.656; dropping the auxiliary BT loss in RL drops
  VideoGen-Bench from 0.768 to 0.648. Attention visualization supports the
  masking rationale.


  All results come from 1 backbone and 1 preference dataset built by the
  authors, with no independent replication and no inference-cost comparison
  against the single-chain generative baselines, which the extra forward pass
  adds to. Post-training gains on VBench are reported for Wan-2.1-1.3B under 2
  frameworks.


  If you train reward models, the lesson is that the score should not be a
  token in the reasoning chain.
