summary: >-
  Users often ask large language models (LLMs) to report how confident they
  are, but it is unclear whether such linguistic confidence tracks the
  model's internal confidence. We study this question across 8
  classification tasks, 2 generation tasks and 30 models from three
  families. For classification, we compare linguistic confidence with
  logits-based confidence along three axes: association, magnitude agreement
  and calibration. For generation, we test whether linguistic confidence
  tracks semantic-entropy-based uncertainty. The axes frequently diverge.
