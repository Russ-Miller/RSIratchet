summary: "Hallucinations, generating responses inconsistent with the visual
  input, remain a critical limitation of large vision-language models (LVLMs),
  especially in open-ended tasks such as image captioning and visual
  reasoning. In this work, we probe the layer-wise generation dynamics that
  drive hallucinations and propose a training-free mitigation strategy.
  Employing the Logit Lens, we examine how LVLMs construct next-token
  distributions across decoder layers, uncovering a pronounced
  commitment-depth gap: truthful tokens accumulate probability mass on their
  final candidates earlier than hallucinator"
