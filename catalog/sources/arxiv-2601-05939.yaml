brief: >-
  Hallucinated tokens in vision-language models commit to their final
  candidate set later in the decoder stack than truthful ones, and that gap
  can be used as an online signal to steer decoding. Applying the Logit Lens
  to InstructBLIP, LLaVA-1.5 and LLaVA-NeXT, the authors show truthful tokens
  accumulate higher top-K probability mass in mid-to-late layers (roughly
  layers 20-30), with separation holding for K in 20-80.


  Building on this, Context Embedding Injection reuses the hidden state of the
  last prompt token as a grounding anchor, blended into layer 10 during
  generation; a dynamic variant scales the blend weight by measured
  commitment. Evaluated on CHAIR (500 MSCOCO images), AMBER generative split,
  and MMHal-Bench (96 GPT-4-judged pairs), with 512 max new tokens.


  Dynamic CEI cuts LLaVA-1.5 CHAIR_s from 55.2 to 34.0 and InstructBLIP from
  55.6 to 32.2, versus 39.2 and 37.4 for the strongest baseline CAAC. AMBER
  HAL drops to 30 for InstructBLIP and 46.6 for LLaVA-NeXT, with COVER roughly
  unchanged.


  Effects are measured against 5 training-free baselines at their published
  settings, across 3 models; there is a scheduler ablation and alpha/beta
  sweep, but no matched-compute baseline despite dynamic CEI needing 2 forward
  passes per token. All models are 7B and COCO-style; no medical or driving
  domains tested. Analysis depends on annotated hallucination labels, though
  inference does not.


  If you work on decoding-time grounding, commitment depth is a cheap signal
  worth probing.
