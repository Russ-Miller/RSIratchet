description: >-
  Builds specification-plus-program-context completion tasks covering a
  DSL's classical-logic, timing and pulse constructs and LoRA fine-tunes on
  them, verified by a simulator that checks syntax, measurement
  distributions and execution schedu Filed by the drafting stage from
  QASM-Eval: A Dataset to Train and Evaluate LLMs on OpenQASM-3 Beyond
  Quantum Circuits (2605.30358) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: pass@1/pass@5 under a theme-held-out protocol
  against base models, cross-theme three-shot prompting, and LoRA on
  QCircuitBench and Agent-Q at matched token scale; Llama-8B-ours 46.93%
  pass@1 vs 9.98% base, 8.67% QCB, 5.83% AGQ, and 39.65% for zero-shot
  GPT-5.6-Terra; Llama-70B-ours 61.17%; verifier agreed with experts on
  189/200 audited tasks (kappa 0.89).. Nobody has vouched for it; add
  support or contest it on this page.
