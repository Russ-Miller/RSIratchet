id: keep-true-false-forecasting-questions-near-1-1
ref: TEC-0304
label: "Keep true and false forecasting questions near 1:1"
summary: >-
  Balance a forecasting question bank so that events that occurred and
  events constructed as false appear in roughly equal numbers, so the
  calibration score does not reward default skepticism.
description: >-
  Balance a forecasting question bank so that events that occurred and
  events constructed as false appear in roughly equal numbers, so the
  calibration score does not reward default skepticism. Filed by the
  drafting stage from SocietyBench: Forecasting Counterfactual Social-World
  Evolution (2608.04009) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Splitting the calibration bank by answer value showed a
  six-model mean of 76.1 on false items versus 60.3 on true items; dropping
  the designed-false subset moved the mean down 3.4 points, identifying it
  as the easiest subset.. Nobody has vouched for it; add support or contest
  it on this page.
