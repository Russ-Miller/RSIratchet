description: >-
  Train an LVLM to emit a structured list of localized discrepancies with
  severities between the reference image and the rendered prediction, then
  sum and normalize the severities into a bounded RL reward (plus a
  render-success term), reusing Filed by the drafting stage from Visual-ERM:
  Reward Modeling for Visual Equivalence (2603.13224) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: GRPO runs on three tasks
  against DINO- and TEDS-reward baselines and the SFT policy: +8.4 avg on
  ChartMimic, +2.7 on table-to-markdown benchmarks, +4.1 on UniSVG;
  reward-model quality measured on a new 1,335-instance image-pair
  discrepancy benchmark (VC-RewardBench) scored by LLM-as-judge F1 and
  severity correlation, where the 8B model beats Qwen3-VL-235B-Instruct..
  Nobody has vouched for it; add support or contest it on this page.
