  Hallucinate when Information Distribution Drifts in Synergy Heads
  (2609.09206) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: POPE F1 87.7 and accuracy 88.3 and MME total 669.8 on
  LLaVA-1.5-7B versus 85.4/84.0/565.3 beam-search baseline and above ~20
  published decoding and attention baselines; CHAIR_S 51.0 to 36.9 and
  CHAIR_I 15.2 to 10.7 with recall and output length maintained; gains
  repeated on five other backbones; head assignments 92-95% stable across
  four masking strategies.. Nobody has vouched for it; add support or
  contest it on this page.
