description: >-
  Train a LoRA camera adapter and a dedicated camera-action decoder on a
  large image-language-to-camera-movement dataset, then freeze the adapter
  and train a separate manipulation decoder on robot data, keeping the two
  action spaces decoupled Filed by the drafting stage from SaPaVe: Towards
  Active Perception and Manipulation in Vision-Language-Action Models for
  Robotics (2603.12193) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Real-world success rate on 4 active-manipulation task
  categories: 85.0% average vs 53.75% for GR00T-N1 and 45.0% for pi-0
  fine-tuned with unified action space; ablations removing stage 1 (53.75%),
  the decoupled action head (71.25%) and the camera adapter (73.75%)..
  Nobody has vouched for it; add support or contest it on this page.
