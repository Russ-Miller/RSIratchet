id: rl-fine-tune-rule-generated-synthetic-multi-hop
ref: TEC-0617
label: "RL fine-tune on rule-generated synthetic multi-hop data"
summary: >-
  Train with GRPO and exact-match or F1 rewards on template- and
  logic-program-generated questions over fictional worlds, instead of
  curating human or LLM-generated reasoning data.
description: >-
  Train with GRPO and exact-match or F1 rewards on template- and
  logic-program-generated questions over fictional worlds, instead of
  curating human or LLM-generated reasoning data. Filed by the drafting
  stage from Learning from Synthetic Data Improves Multi-hop Reasoning
  (2603.02091) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: F1 on 500-sample subsets of five real-world multi-hop
  benchmarks, versus the untuned base model and versus a format-reward-only
  control; Qwen3 and Phi already formatted answers correctly, so their gains
  cannot be format learning. SFT compared on GSM-inf accuracy and HotpotQA
  F1. Held-out fictional worlds and out-of-domain hop counts used to rule
  out memorization. Two training seeds per cell.. Nobody has vouched for it;
  add support or contest it on this page.
addresses: [multi-step-reasoning]
kind: training
sources: [arxiv-2603-02091]
status: proposed
