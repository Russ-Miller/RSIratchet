id: store-jailbreak-failures-wrapper-level-rules-persistent-memory
ref: TEC-0328
label: "Store jailbreak failures as wrapper-level rules in persisten"
summary: >-
  On a detected unsafe response, an LLM distills the attack's structural
  wrapper into a labelled rule in an external memory, and later inputs are
  classified into a wrapper label that selectively triggers at most two
  matching rules before gene
description: >-
  On a detected unsafe response, an LLM distills the attack's structural
  wrapper into a labelled rule in an external memory, and later inputs are
  classified into a wrapper label that selectively triggers at most two
  matching rules before gene Filed by the drafting stage from A
  Self-Evolving Multi-Agent Framework Defense against LLM Jailbreak Attacks
  (2608.26008) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: ASR-gpt (external GPT-4o-mini judge, threshold 7) and
  ASR-rej on AdvBench across four attack families and three models, against
  no-defense, safety prompt, Self-Reminder and AutoDefense baselines;
  MMLU/GSM8K utility stays within ~2 points; ablations removing triggering,
  enforcement or reflection each raise ASR.. Nobody has vouched for it; add
  support or contest it on this page.
