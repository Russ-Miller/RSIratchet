label: "Scale down hallucination-pathway components found by patchin"
summary: >-
  Identify components whose patching effect is larger on hallucinating than
  correct samples, then multiply their outputs by a fixed factor (or just
  the top-k by effect size) at every forward pass, with no retraining.
description: >-
  Identify components whose patching effect is larger on hallucinating than
  correct samples, then multiply their outputs by a fixed factor (or just
  the top-k by effect size) at every forward pass, with no retraining. Filed
  by the drafting stage from Dual-Pathway Circuits of Object Hallucination
  in Vision-Language Models (2605.13156) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: On a held-out 400-sample
  POPE-adversarial set with hyperparameters picked on a disjoint 100-sample
  selection set: 40-76% relative hallucination reduction at under 2pp
  accuracy cost across five models; random-component suppression at the same
  factor gave no reduction (and slightly raised hallucination, up to
  +7.2pp); scaling the grounding pathway to zero collapsed accuracy to
  chance; ITI and mean-difference projection on the same components were
  weaker or ineffective.. Nobody has vouched for it; add support or contest
  it on this page.
