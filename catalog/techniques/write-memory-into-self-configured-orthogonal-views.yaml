label: "Write memory into self-configured orthogonal views"
summary: >-
  Induce candidate schemas (views) from the interaction stream, pick a
  diverse subset by DPP, extract provenance-tagged memories under each view
  before indexing, then consolidate duplicates offline.
description: >-
  Induce candidate schemas (views) from the interaction stream, pick a
  diverse subset by DPP, extract provenance-tagged memories under each view
  before indexing, then consolidate duplicates offline. Filed by the
  drafting stage from AutoViewMem: Self-Configuring Orthogonal Views for
  Conversational Long-Term Memory (2609.21940) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: LoCoMo overall LLM-Judge 0.837
  vs 0.774 for single-view structured extraction and 0.683-0.783 for
  Mem0/MemGAS/MemoryBank/A-mem; no-positive rate 5.14% vs 5.53% single-view
  and 9.83% without consolidation; PersonaMem-32k accuracy 69.10 at 14B vs
  63.33 best baseline. Nobody has vouched for it; add support or contest it
  on this page.
