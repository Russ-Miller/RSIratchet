id: fuse-category-specific-agent-scores-trained-mlp
ref: TEC-0617
label: "Fuse category-specific agent scores with a trained MLP"
summary: >-
  Filter features, group them into conceptual categories, have one LLM agent
  emit a severity score per category, and train a small MLP to map the score
  vector to the final label.
description: >-
  Filter features, group them into conceptual categories, have one LLM agent
  emit a severity score per category, and train a small MLP to map the score
  vector to the final label. Filed by the drafting stage from
  TransportAgents: a multi-agents LLM framework for traffic accident
  severity prediction (2601.15519) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy and macro-F1 against k-shot,
  CoT, AutoGen, MLP-on-features, MLP+feature-selection and ordered logit on
  CPSRMS and NEISS across three backbones; ten stratified 80/20 resplits
  (70.69% +/- 1.76 vs 63.22% CoT); ablations removing feature selection,
  category organization, or individual agents; distributional comparison of
  predicted vs true severity.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [multi-model-coordination]
kind: process
