id: render-test-time-views-back-into-training-camera
ref: TEC-0769
label: "Render test-time views back into the training camera viewpoi"
summary: >-
  At each control step a feed-forward novel-view-synthesis model converts
  images from the current camera configuration into images as seen from the
  training cameras, which are then fed unchanged to the frozen VLA policy.
description: >-
  At each control step a feed-forward novel-view-synthesis model converts
  images from the current camera configuration into images as seen from the
  training cameras, which are then fed unchanged to the frozen VLA policy.
  Filed by the drafting stage from AnyCamVLA: Zero-Shot Camera Adaptation
  for Viewpoint Robust Vision-Language-Action Models (2603.05868) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: LIBERO
  success rates across four suites and three perturbation levels: Ours-pi
  94.5% average on agent-camera shifts vs 69.9% for base pi0.5, 87.2% for
  viewpoint-augmented fine-tuning, 86.1% for GeoAwareVLA; on wrist-camera
  shifts (LIBERO-Long) 88.6% vs 28.6% base, 83.1% augmented, 5.2%
  GeoAwareVLA. Ablation vs homography (31.7%) and depth reprojection
  (81.1%), and vs no synthesis-model fine-tuning (33.2%). Real-robot: 10
  trials per task on four tasks, progress and binary success near
  training-viewpoint levels.. Nobody has vouched for it; add support or
  contest it on this page.
