id: constitutional-training
ref: TEC-0006
label: Train against explicit principles
summary: Use a written set of principles to generate critiques and preferences, then train on them.
description: >-
  The model critiques and revises its own outputs against a list of
  principles, and a preference model trained on those judgments guides
  reinforcement learning. Produces models that refuse harmful actions while
  explaining why rather than going evasive.
addresses: [goal-conflict-safety]
kind: training
sources: [arxiv-2212-08073]
contexts: [chat-assistant, autonomous-agent]
requires: >-
  A vendor-side training method: application developers cannot apply it
  directly, so it explains differences between vendors rather than being
  something you deploy.
status: active
submitted_by: human:Russ-Miller
