id: expand-mcts-nodes-different-model-families
ref: TEC-0626
label: "Expand MCTS nodes with different model families"
summary: >-
  At each search-tree expansion, a different language model from a
  heterogeneous pool is selected (by UCB over its past rollout returns) to
  generate the candidate action, instead of resampling one model.
description: >-
  At each search-tree expansion, a different language model from a
  heterogeneous pool is selected (by UCB over its past rollout returns) to
  generate the candidate action, instead of resampling one model. Filed by
  the drafting stage from SYMPHONY: Synergistic Multi-agent Planning with
  Heterogeneous Language Model Assembly (2601.22623) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Branch-uniqueness counts at
  fixed expansion width 4 (over 80% all-distinct branches on MBPP with the
  full trio vs under 20% single-agent) plus task metrics against
  single-agent and single-model search baselines (HotpotQA EM 0.79, WebShop
  SR 0.72, MBPP pass@1 0.965 for the API configuration), with fewer node
  expansions than ToT/RAP/LATS; temperature scaling and adversarial
  prompting reported as weaker diversity sources.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [multi-model-coordination]
