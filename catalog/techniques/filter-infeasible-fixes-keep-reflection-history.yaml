id: filter-infeasible-fixes-keep-reflection-history
ref: TEC-0598
label: "Filter infeasible fixes and keep a reflection history"
summary: >-
  Each revision round discards proposed correction steps the model cannot
  execute (e.g. 'enhance the image') and conditions the rewrite on the
  accumulated list of all previous reflections so earlier failed strategies
  are not retried.
description: >-
  Each revision round discards proposed correction steps the model cannot
  execute (e.g. 'enhance the image') and conditions the rewrite on the
  accumulated list of all previous reflections so earlier failed strategies
  are not retried. Filed by the drafting stage from OCR-Agent: Agentic OCR
  with Capability and Memory Reflection (2602.21053) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Ablation on OCRBench v2
  against naive answering (38.4 English), CoT (42.0) and Self-Refine (43.4):
  capability filtering alone 45.9, memory alone 48.4, both 51.0; Chinese
  37.7 to 54.7, with per-round curves showing baselines flattening after
  round 1-2.. Nobody has vouched for it; add support or contest it on this
  page.
