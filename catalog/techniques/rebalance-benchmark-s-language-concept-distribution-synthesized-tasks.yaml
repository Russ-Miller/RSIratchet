description: >-
  Detect which programming-language concepts each benchmark task exercises,
  compare against the distribution in real projects, and prompt an LLM with
  real source code to synthesize tasks (description, solution, tests) for
  the missing or under Filed by the drafting stage from Assessing and
  Improving the Representativeness of Code Generation Benchmarks Using
  Knowledge Units (KUs) of Programming Languages -- An Empirical Study
  (2601.03780) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Jensen-Shannon distance between benchmark and
  real-project concept distributions fell from 0.335 to 0.118 (HumanEval)
  and 0.319 to 0.122 (MBPP) after adding 440 synthesized tasks; seven LLMs
  then dropped 12.54-44.82% on pass@1/3/5, reported as statistically
  significant with large effect size.. Nobody has vouched for it; add
  support or contest it on this page.
