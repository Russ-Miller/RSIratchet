id: read-control-decisions-off-hidden-states-output
ref: TEC-0330
label: "Read control decisions off hidden states, not the output"
summary: >-
  Attach two small heads to a frozen LLM that read hidden-state traces of
  its own generated tokens and emit a capability score (stay or defer to a
  stronger model) and a resolution score (clarify, call a tool, abstain, or
  answer directly).
description: >-
  Attach two small heads to a frozen LLM that read hidden-state traces of
  its own generated tokens and emit a capability score (stay or defer to a
  stronger model) and a resolution score (clarify, call a tool, abstain, or
  answer directly). Filed by the drafting stage from Multi-Head Latent
  Control: A Unified Interface for LLM Agent Decision Making (2607.14277)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  When2Call F1/accuracy against the backbone's own native action choice and
  against full-LLM When2Call SFT baselines; TriviaQA task score, tool-call
  precision and missed-required web calls against the backbone's native
  search behaviour; routed small-to-large execution scored on AndroidWorld,
  CharXiv, MathVerse, MathVista, ScreenSpot-Pro, SimpleVQA and MMLU-Pro with
  estimated paid API cost against always-large and always-small baselines;
  prefix-time ROC-AUC/AUPR/ECE ablations; compared against a prompted
  self-abstention baseline and token-level confidence.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [abstention-and-self-knowledge]
kind: architecture
sources: [arxiv-2607-14277]
status: proposed
