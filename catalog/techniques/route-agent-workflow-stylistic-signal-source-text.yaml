id: route-agent-workflow-stylistic-signal-source-text
ref: TEC-0814
label: "Route the agent workflow by a stylistic signal from the sour"
summary: >-
  Convert a source segment's word-length sequence into a wavelet-packet
  feature vector and use thresholds on its entropy and low-frequency energy
  to deterministically pick which ordered set of specialized translation
  agents runs.
description: >-
  Convert a source segment's word-length sequence into a wavelet-packet
  feature vector and use thresholds on its entropy and low-frequency energy
  to deterministically pick which ordered set of specialized translation
  agents runs. Filed by the drafting stage from SAMAS: A Spectrum-Guided
  Multi-Agent System for Achieving Style Fidelity in Literary Translation
  (2602.19840) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: XCOMET and COMETKIWI-23 on FLORES-200 and WMT24 against
  single-LLM and multi-agent baselines, plus an ablation against each fixed
  workflow (Qwen3-235B en->xx: 96.78 routed vs 91.33 and 95.86 fixed) and
  head-to-head human style-fidelity preference against five baselines..
  Nobody has vouched for it; add support or contest it on this page.
