id: tell-the-model-the-code-is-its-own
ref: TEC-0584
label: Tell the model the code is its own
summary: Say in the prompt that the codebase belongs to the model and that
  it will keep building on it, so it improves structure as it works rather
  than adding around it.
description: "One sentence in the system prompt, given by Anthropic for
  Claude Fable 5.2: “This codebase is yours: what it’s for and how it’s
  built are your call, and you’ll keep building on it.” Without it, or when
  the code is presented as someone else’s, the model tends to add to the
  existing structure and report nearby problems instead of fixing them. The
  cost is more output and unrequested changes, so leave it out where the
  user owns the code and wants it changed as little as possible. Evidence so
  far is the vendor’s own testing on small coding tasks."
addresses:
  - software-architecture
kind: prompting
