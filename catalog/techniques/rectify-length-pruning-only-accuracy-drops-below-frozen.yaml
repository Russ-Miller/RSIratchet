description: >-
  Post-training alternates between minimizing normalized response length and
  taking an accuracy-restoring gradient step, switching to the latter only
  when the current policy's minibatch accuracy falls below the frozen
  reference policy's by mo Filed by the drafting stage from
  Constraint-Rectified Training for Efficient Chain-of-Thought (2602.12526)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy and average token count on GSM8K, MATH500 and four out-domain
  math benchmarks against ThinkPrune, L1, O1-Pruner, ShorterBetter and ACPO,
  plus a per-problem breakdown of accuracy decrease/preserve/improve
  conditioned on length reduction (CRT 12.5% decrease on SAT Math vs 37.5%
  ThinkPrune-1k, 27.3% ACPO), and ablations against single-stage and
  primal-dual variants.. Nobody has vouched for it; add support or contest
  it on this page.
