description: >-
  Evaluate a generated plan by whether each activity gap and transport
  segment allocates buffer inside a risk-profile-scaled range derived from
  historical delay distributions and hourly crowd density, rather than by
  binary constraint satisfac Filed by the drafting stage from UTP-Bench:
  Uncertainty-aware Travel Planning Benchmark (2609.02421) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Applied to four
  LLMs and an agentic baseline over 3/5/7-day plans; the metrics separate
  models that binary final-pass rate collapses to near zero for, and expose
  model-specific patterns (Qwen3 degrading with horizon, Phi-4 strong crowd
  timing but weak buffering); no human-agreement study of the metrics is
  reported.. Nobody has vouched for it; add support or contest it on this
  page.
