description: >-
  During post-training for asynchronous execution, replace the action head's
  causal mask with a lambda-shaped mask so only the first few noisy action
  tokens can attend to the committed action prefix, and offset the prefix's
  RoPE indices so th Filed by the drafting stage from Xiaomi-Robotics-0: An
  Open-Sourced Vision-Language-Action Model with Real-Time Execution
  (2602.12684) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Real-robot throughput against a training-RTC asynchronous
  variant and a synchronous variant on two bimanual tasks: highest
  throughput on Lego disassembly at comparable success rate, and 1.2 pcs/min
  vs 1 pcs/min on towel folding, with the training-RTC variant observed
  looping on a failed flinging motion.. Nobody has vouched for it; add
  support or contest it on this page.
