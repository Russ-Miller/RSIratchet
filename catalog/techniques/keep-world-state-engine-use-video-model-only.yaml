description: >-
  An agent compiles natural-language instructions into executable programs
  whose state a lightweight engine maintains as state-augmented 3D oriented
  bounding boxes, which are deterministically projected into identity,
  semantic and motion cont Filed by the drafting stage from Programmable
  World Model (2609.10540) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: On CombatStateBench (50 clips), 94% Count Accuracy
  and 98% State Accuracy versus 40.75/8.00 for LingBot-World-V2 and
  32.00/58.00 for YUME under prompt switching, plus better VBench
  consistency scores; judged by a VLM given only RGB frames.. Nobody has
  vouched for it; add support or contest it on this page.
