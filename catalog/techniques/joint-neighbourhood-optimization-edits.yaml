id: joint-neighbourhood-optimization-edits
ref: TEC-0071
label: "Joint neighbourhood optimization for edits"
summary: >-
  Before writing an edit into parameters, optimize the target
  representations for the edited fact and its neighbours together,
  penalizing both failed propagation and leakage, and reject edit plans
  whose semantic risk is high.
description: >-
  Before writing an edit into parameters, optimize the target
  representations for the edited fact and its neighbours together,
  penalizing both failed propagation and leakage, and reject edit plans
  whose semantic risk is high. Filed by the drafting stage from Revisiting
  Ripple Effects in Knowledge Editing through Pressure-Aware Joint
  Neighborhood Optimization (2606.01610) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Propagation, preservation,
  specificity and consistency metrics on RippleEdits and ZsRE against SAKE
  and other baselines across three backbones; fluency drops at most 1.5%..
  Nobody has vouched for it; add support or contest it on this page.
