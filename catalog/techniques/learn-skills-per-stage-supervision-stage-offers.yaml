description: >-
  Distil reusable text skills for hypothesis generation from a
  multi-dimensional discriminator's critique of the whole generated
  hypothesis set, and skills for experiment design and execution from
  testing trajectories scored against ground-tr Filed by the drafting stage
  from HypoForge: A Self-Improving Multi-Agent Framework for Automated
  Hypothesis Generation and Testing via Scientific Skill Learning
  (2608.25770) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: On held-out HypoBench tasks: hypothesis quality 0.785 and
  Hit@K 0.648 versus 0.724/0.409 with no skill, 0.738/0.579 for an
  AI-generated skill, 0.761/0.497 for a human-designed skill, 0.719/0.472
  for HypoGeniC; test pass rate 0.659 versus 0.562 no-skill, 0.612
  human-designed, 0.589 ReAct, 0.417 POPPER. Ablations: removing
  discriminator feedback drops Hit@K to 0.491; removing execution outcomes
  drops pass rate to 0.565. Three runs. The generation quality metric is the
  same discriminator used as the training signal, so that number is not an
  independent check.. Nobody has vouched for it; add support or contest it
  on this page.
