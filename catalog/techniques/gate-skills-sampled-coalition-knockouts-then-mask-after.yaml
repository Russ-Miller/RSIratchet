id: gate-skills-sampled-coalition-knockouts-then-mask-after
ref: TEC-0130
label: "Gate skills on sampled coalition knockouts, then mask after "
summary: >-
  Accept a candidate skill only if sampled Monte-Carlo coalition knockout
  margins (plus a weighted outcome reward) beat the best bank so far, and at
  deployment greedily drop skills whose removal raises retrieval quality on
  unlabeled target-do
description: >-
  Accept a candidate skill only if sampled Monte-Carlo coalition knockout
  margins (plus a weighted outcome reward) beat the best bank so far, and at
  deployment greedily drop skills whose removal raises retrieval quality on
  unlabeled target-do Filed by the drafting stage from Coalition-Aware Skill
  Reliability for Self-Evolving Agents (2608.22610) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Matched-protocol comparison
  against the MemSkill baseline (gate is the only change) over three seeds:
  the combined method beat MemSkill on LoCoMo and LongMemEval LLM-judge
  scores and ALFWorld success rate; a K-controlled ablation showed the
  baseline gate's six accepted skills were collectively -1.38 pp; masking
  improved all six trained banks on HotpotQA-50 (avg 7.17 pp for MemSkill
  banks, 3.59 pp for CASS banks), and retrieval-quality scores correlated
  with label-based rankings at rho=+0.76 versus -0.18 for a policy-entropy
  signal.. Nobody has vouched for it; add support or contest it on this
  page.
