label: "Gate skills on sampled coalition knockouts, then mask after "
summary: >-
  At the acceptance gate, score a candidate bank by averaging Monte Carlo
  coalition-knockout margins combined with outcome reward; at deployment,
  greedily mask skills whose removal improves retrieval quality on unlabeled
  target-domain queries
description: >-
  At the acceptance gate, score a candidate bank by averaging Monte Carlo
  coalition-knockout margins combined with outcome reward; at deployment,
  greedily mask skills whose removal improves retrieval quality on unlabeled
  target-domain queries Filed by the drafting stage from Coalition-Aware
  Skill Reliability for Self-Evolving Agents (2608.22610) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Matched-protocol
  comparison against MemSkill and six memory-agent baselines over three
  seeds: LLM-judge average rose from 54.13 to 55.52 on conversational
  benchmarks and success rate from 77.05 to 79.66 on ALFWorld; the stricter
  gate accepted 1 of 12 candidates vs 6 of 12, and a K-controlled ablation
  found the baseline's extra admissions net -1.38 points; label-free masking
  improved all six trained banks, twice as much on baseline banks as on
  gated ones.. Nobody has vouched for it; add support or contest it on this
  page.
