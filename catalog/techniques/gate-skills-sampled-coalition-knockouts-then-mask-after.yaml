description: >-
  During skill accumulation, score a candidate bank by the averaged knockout
  margin of Monte-Carlo-sampled skill coalitions combined with outcome
  reward; after transfer, greedily mask skills whose removal raises
  retrieval quality on unlabeled Filed by the drafting stage from
  Coalition-Aware Skill Reliability for Self-Evolving Agents (2608.22610)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Matched-protocol comparison against MemSkill and six memory-agent
  baselines on LoCoMo, LongMemEval and ALFWorld (3 seeds): average F1 35.76
  vs 34.74 and LLM-judge 55.52 vs 54.13, ALFWorld success 79.66 vs 77.05. A
  K-controlled ablation found the outcome gate's six accepted skills
  collectively net-negative (-1.38 pp average). Masking raised HotpotQA-50
  judge score on all six trained banks (+7.17 pp average on MemSkill banks,
  +3.59 on CASS banks); retrieval-quality mask score correlated with
  label-based skill ranking at rho=+0.76 versus -0.18 for a policy-entropy
  signal.. Nobody has vouched for it; add support or contest it on this
  page.
