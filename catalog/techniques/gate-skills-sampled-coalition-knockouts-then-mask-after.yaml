id: gate-skills-sampled-coalition-knockouts-then-mask-after
ref: TEC-0130
label: "Gate skills on sampled coalition knockouts, then mask after "
summary: >-
  Admit a candidate skill only if sampled coalition knockout margins (Monte
  Carlo Shapley-style) plus outcome reward improve, and at deployment
  greedily mask transferred skills whose removal raises retrieval quality on
  unlabeled target querie
description: >-
  Admit a candidate skill only if sampled coalition knockout margins (Monte
  Carlo Shapley-style) plus outcome reward improve, and at deployment
  greedily mask transferred skills whose removal raises retrieval quality on
  unlabeled target querie Filed by the drafting stage from Coalition-Aware
  Skill Reliability for Self-Evolving Agents (2608.22610) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Matched-protocol
  comparison against MemSkill and six memory-agent baselines on LoCoMo,
  LongMemEval and ALFWorld (reported gains on F1, LLM-judge and success
  rate, three seeds); a K-controlled ablation showed the baseline gate's
  accepted skills were net -1.38pp; masking improved all six trained banks
  on HotpotQA-50 (+3.59pp on CASS banks, +7.17pp on MemSkill banks), and the
  unlabeled retrieval-quality signal correlated with label-based skill
  ranking at rho=+0.76 versus -0.18 for a policy-entropy signal.. Nobody has
  vouched for it; add support or contest it on this page.
