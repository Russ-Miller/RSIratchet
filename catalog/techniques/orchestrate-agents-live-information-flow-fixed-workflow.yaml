id: orchestrate-agents-live-information-flow-fixed-workflow
ref: TEC-0737
label: "Orchestrate agents by live information flow, not a fixed wor"
summary: >-
  A dedicated orchestrator agent receives the query, monitors progress, and
  dispatches natural-language inquiries or instructions to worker agents
  through a send/wait message toolkit, with no predefined task states or
  routing rules.
description: >-
  A dedicated orchestrator agent receives the query, monitors progress, and
  dispatches natural-language inquiries or instructions to worker agents
  through a send/wait message toolkit, with no predefined task states or
  routing rules. Filed by the drafting stage from Beyond Rule-Based
  Workflows: An Information-Flow-Orchestrated Multi-Agents Paradigm via
  Agent-to-Agent Communication from CORAL (2601.09883) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Pass@1 accuracy on GAIA
  validation (165 tasks) against a reimplemented OWL workflow baseline with
  matched roles and models, plus token-consumption CDFs: equal overall
  accuracy (64.24%) when all agents use Grok 4.1 Fast at slightly higher
  token cost, and 63.64% vs 55.15% when worker agents use GPT 4.1 Mini..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
