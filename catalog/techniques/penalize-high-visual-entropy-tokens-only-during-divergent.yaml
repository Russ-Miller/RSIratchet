description: >-
  Compute each candidate token's entropy over visual-token activation
  probabilities, flag a reasoning step as divergent when entropy exceeds a
  threshold, and at those steps only, multiply the decoding distribution by
  exp(-alpha * visual entro Filed by the drafting stage from Understanding
  and Mitigating Hallucinations in Multimodal Chain-of-Thought Models
  (2603.27201) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: CHAIR_S/CHAIR_I on Object HalBench, accuracy/F1 on three
  POPE splits, MMHalBench score, plus MathVista/MMStar/VSR, against DoLa,
  VCD, MemVR, FlexAC and against intervening on all thinking or normal-only
  steps (PixelReasoner-7B: 22.0 to 15.4 CHAIR_S divergent-only vs 16.1
  all-thinking vs 21.8 normal-only, MathVista 62.6 to 64.0 vs 61.4 vs
  62.7).. Nobody has vouched for it; add support or contest it on this page.
