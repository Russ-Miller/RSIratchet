description: >-
  Every extracted rule is written to a shared versioned store under a stable
  id, checked against 26 schema constraints, scored on five dimensions by an
  LLM judge whose minimum dimension decides auto-approve/review/reject, then
  filtered for du Filed by the drafting stage from SAGE: Governed Artifact
  Generation from Enterprise Guidelines (2609.17775) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Compared against a
  monolithic one-pass baseline with the same parser and same models on the
  same 115 documents: hallucination 3.2% vs 15.7%, duplication 3.0% vs
  10.3%, artifact rule coverage 93.7% vs 62.8%; a cumulative ablation
  attributes duplicate removal (117 units), 113 contradictions and 1,040
  gaps to the consistency layer specifically. The L2 judge was checked
  against 300 blind expert rule labels (F1 0.957, kappa 0.813).. Nobody has
  vouched for it; add support or contest it on this page.
