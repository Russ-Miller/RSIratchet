id: fine-tune-only-probe-selected-sycophancy-neurons
ref: TEC-0650
label: "Fine-tune only probe-selected sycophancy neurons"
summary: >-
  Train a linear probe on concatenated SAE features to score MLP neurons for
  sycophancy, decode the top ~3% back into the MLP basis, and update only
  those rows/columns via gradient masking during supervised fine-tuning.
description: >-
  Train a linear probe on concatenated SAE features to score MLP neurons for
  sycophancy, decode the top ~3% back into the MLP basis, and update only
  those rows/columns via gradient masking during supervised fine-tuning.
  Filed by the drafting stage from A Few Bad Neurons: Isolating and
  Surgically Correcting Sycophancy (2601.18939) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Sycophancy scores on Syco-Bench
  subtests, Open-Ended-Sycophancy, and NLP/POLI/PHIL preference rates,
  against the untrained model, synthetic-data intervention, supervised
  pinpoint tuning, and a residual-probe ablation.. Nobody has vouched for
  it; add support or contest it on this page.
