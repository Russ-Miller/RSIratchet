description: >-
  Extract one semantic unit from the question and one from the answer, build
  a verification question that uses the answer unit to ask for the question
  unit, answer it while injecting the primary stage's aggregated
  text-to-image attention, and Filed by the drafting stage from V-Loop:
  Visual Logical Loop Verification for Hallucination Detection in Medical
  Visual Question Answering (2601.18240) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: AUC and AUG for hallucination
  detection against GREEN-derived labels on three medical VQA test sets and
  three MLLMs, compared with AvgProb/MaxProb/AvgEnt/MaxEnt, Semantic
  Entropy, RadFlag and VASE; ablations removing the verification-question
  generator or the attention-consistency term each lower AUC/AUG, and
  combining with SE/RadFlag/VASE adds further gains.. Nobody has vouched for
  it; add support or contest it on this page.
