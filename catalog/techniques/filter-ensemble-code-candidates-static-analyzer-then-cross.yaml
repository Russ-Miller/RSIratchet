id: filter-ensemble-code-candidates-static-analyzer-then-cross
ref: TEC-0656
label: "Filter ensemble code candidates with a static analyzer, then"
summary: >-
  Several LLMs generate candidate code in parallel, a static analyzer
  (CodeQL) selects or flags candidates, and flagged ones are patched via
  cross-model explanation-guided verification before re-analysis.
description: >-
  Several LLMs generate candidate code in parallel, a static analyzer
  (CodeQL) selects or flags candidates, and flagged ones are patched via
  cross-model explanation-guided verification before re-analysis. Filed by
  the drafting stage from Does Teaming-Up LLMs Improve Secure Code
  Generation? A Comprehensive Evaluation with Multi-LLMSecCodeEval
  (2603.22717) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Secure-code rate under CodeQL on SecLLMEval and
  SecLLMHolmes: single-model baseline vs ensemble+CodeQL pipelines (up to
  +47.3% and +19.3%) vs LLM-only collaborative pipelines (+8.9-22.3% on one
  set, ~0 or negative on the other); the hybrid reached 97.32% and 99.06%..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
kind: process
sources: [arxiv-2603-22717]
status: proposed
