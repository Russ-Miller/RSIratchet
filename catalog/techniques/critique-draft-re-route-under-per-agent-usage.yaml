summary: >-
  Trains an LLM controller by multi-turn RL to, at each turn, evaluate the
  current agent draft, decide stop-or-continue, and pick the next agent,
  with a Lagrangian penalty on each agent's invocation share.
description: >-
  Trains an LLM controller by multi-turn RL to, at each turn, evaluate the
  current agent draft, decide stop-or-continue, and pick the next agent,
  with a Lagrangian penalty on each agent's invocation share. Filed by the
  drafting stage from Iterative Critique-and-Routing Controller for
  Multi-Agent Systems with Heterogeneous LLMs (2605.08686) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy on seven
  math benchmarks against Router-R1, RouterDC, RoBERTa and random routers,
  and controller-as-solver baselines, in two controller/agent-pool
  configurations; ablations on turn budget and on removing the Lagrange
  multipliers (which collapses routing to the strongest agent).. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
