id: distill-prompt-rules-clustered-zero-shot-failures
ref: TEC-0283
label: "Distill prompt rules from clustered zero-shot failures"
summary: >-
  Collect the model's own zero-shot failure cases, extract per-case error
  reports, aggregate them into a small set of global error patterns, and
  abstract those into a handful of explicit SQL generation rules placed in
  the prompt.
description: >-
  Collect the model's own zero-shot failure cases, extract per-case error
  reports, aggregate them into a small set of global error patterns, and
  abstract those into a handful of explicit SQL generation rules placed in
  the prompt. Filed by the drafting stage from ZAS-SQL: Distilling Rules
  from Failures for Zero-Shot Text-to-SQL (2606.08245) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Cumulative ablation on
  DeepSeek-V3: adding the rules gave +4.5 (Spider Dev), +6.7 (Test), +5.4
  (UrbanPlan) execution accuracy, the largest single step and 45-53% of
  total cumulative improvement over the DDL-only zero-shot baseline; full
  pipeline reached 87.2/87.8/81.3.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [formal-query-synthesis]
