id: rescale-audio-token-attention-one-bottleneck-layer
ref: TEC-0357
label: "Rescale audio-token attention at one bottleneck layer"
summary: >-
  At inference, multiply the pre-softmax attention logits from the final
  prompt token and task keyword tokens to audio tokens by a per-model
  coefficient, applied at a single layer chosen by a layer sweep.
description: >-
  At inference, multiply the pre-softmax attention logits from the final
  prompt token and task keyword tokens to audio tokens by a per-model
  coefficient, applied at a single layer chosen by a layer sweep. Filed by
  the drafting stage from A Closer Look at Failure Modes in Temporal
  Understanding of Large Audio-Language Models (2606.17417) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Fix rate on
  initially incorrect items (scaling ~20% vs ~10-16% for best upweighting)
  and accuracy on the three tasks: all-layer intervention dropped accuracy
  below baseline, while single-layer scaling raised average accuracy from
  55.9% to 59.1%.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [audio-understanding]
kind: decoding
