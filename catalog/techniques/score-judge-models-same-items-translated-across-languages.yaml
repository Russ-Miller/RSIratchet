summary: >-
  Translate each pairwise preference instance into many languages while
  keeping the image fixed, then report per-language accuracy and
  cross-language variance for each judge instead of a single English score.
description: >-
  Translate each pairwise preference instance into many languages while
  keeping the image fixed, then report per-language accuracy and
  cross-language variance for each judge instead of a single English score.
  Filed by the drafting stage from Lost in Translation: Do LVLM Judges
  Generalize Across Languages? (2604.19405) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Applied to 22 LVLMs over 60K+
  instances in 25 languages; cross-lingual rankings were stable when the
  translator was swapped for two weaker Gemini models, though absolute
  accuracy fell and variance rose.. Nobody has vouched for it; add support
  or contest it on this page.
