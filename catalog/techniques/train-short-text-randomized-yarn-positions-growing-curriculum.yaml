ref: TEC-0432
label: "Train on short text with randomized YaRN positions on a grow"
summary: >-
  During short-context fine-tuning, each token receives the YaRN positional
  encoding of a position drawn (sorted, without replacement) from a much
  longer range, with the maximum sampling length increased each epoch; plain
  YaRN is used at infe
description: >-
  During short-context fine-tuning, each token receives the YaRN positional
  encoding of a position drawn (sorted, without replacement) from a much
  longer range, with the maximum sampling length increased each epoch; plain
  YaRN is used at infe Filed by the drafting stage from Randomized YaRN
  Improves Length Generalization for Long-Context Reasoning (2606.23687)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  OOD accuracy averaged over length bins on BABILong (exact match), MRCR
  (similarity metric) and LongBench v2 (accuracy), against zero-shot,
  zero-shot+YaRN, LoRA, trained YaRN, RPE and PoSE; e.g. BABILong OOD
  average 90.3 vs 83.6 LoRA and 81.3 trained YaRN on Qwen2.5-7B; curriculum
  ablation costs 6.2 points on MRCR.. Nobody has vouched for it; add support
  or contest it on this page.
