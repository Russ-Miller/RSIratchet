id: condition-new-tool-creation-past-tool-creation-experience
ref: TEC-0623
label: "Condition new-tool creation on past tool-creation experience"
summary: >-
  Before generating a missing tool, retrieve distilled implementation
  guidelines and failure-fix pairs from a persistent tool-experience memory
  and include them in the generation prompt alongside the sub-task and web
  search results.
description: >-
  Before generating a missing tool, retrieve distilled implementation
  guidelines and failure-fix pairs from a persistent tool-experience memory
  and include them in the generation prompt alongside the sub-task and web
  search results. Filed by the drafting stage from Mem$^2$Evolve: Towards
  Self-Evolving Agents via Co-Evolutionary Capability Expansion and
  Experience Distillation (2604.10923) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: First-pass validity (tool passes all
  synthesized tests on the first attempt) rose from 53.1% to 72.4% on
  average across GAIA and AIME24/25, and average self-correction iterations
  fell from 1.01 to 0.48, against the same pipeline with experience guidance
  removed.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [harness-self-improvement]
