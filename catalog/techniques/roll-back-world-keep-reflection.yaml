description: >-
  On failure review, restore the environment and branch-local context to a
  selected earlier checkpoint while retaining outside the checkpoint a
  structured memory of task objective, reusable environment facts, past
  milestones, and failure anal Filed by the drafting stage from Rollback the
  World, Keep the Reflection: Rollback-Induced Reflection for Long-Horizon
  LLM Agents (2609.18304) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Success rate on ALFWorld, ScienceWorld and GAIA
  against ReAct, Reflexion, LATS, Self-Refine and GA-Rollback under the same
  backbones and budgets (average SR 47.00 vs 43.91 best baseline on
  Qwen3-14B; 69.43 vs 62.86 on DeepSeek-V3), plus component ablations on
  ScienceWorld showing +6.27 SR over reflection only and +7.38 over rollback
  only, with fewer than one executed rollback per task versus ~2.9 for
  GA-Rollback.. Nobody has vouched for it; add support or contest it on this
  page.
