description: >-
  Pre-train a vision-language model on broad financial corpora with an added
  loss penalizing valuations inconsistent with disclosed metrics, then LoRA
  fine-tune on an institution's own investment memos and risk rules. Filed
  by the drafting stage from Frontiers in FinTech: Multimodal Foundation
  Models for Financial Reporting and Decision Science (2608.22724) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: MAE and
  RMSE of target price versus analyst consensus on 200 listed companies,
  plus direction accuracy of Buy/Hold/Sell against consensus revision within
  90 days; baselines were GPT-4 zero-shot (24.3% MAE), FinGPT single-stage
  (18.7%), analyst-input DCF spreadsheet (16.2%), versus 13.1% for the
  two-stage system.. Nobody has vouched for it; add support or contest it on
  this page.
