description: >-
  Pre-train the model on large-scale public financial corpora with a loss
  penalizing valuations inconsistent with disclosed metrics, then
  LoRA/prompt-tune on an institution's own investment memos and risk rules.
  Filed by the drafting stage from Frontiers in FinTech: Multimodal
  Foundation Models for Financial Reporting and Decision Science
  (2608.22724) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean absolute error and RMSE of target price versus
  analyst consensus on 200 companies, plus Buy/Hold/Sell direction accuracy;
  reported MAE 13.1% versus 16.2% for the best baseline (analyst-input DCF)
  and 18.7% for single-stage FinGPT.. Nobody has vouched for it; add support
  or contest it on this page.
