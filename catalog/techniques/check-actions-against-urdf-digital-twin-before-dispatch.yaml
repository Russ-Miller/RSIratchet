id: check-actions-against-urdf-digital-twin-before-dispatch
ref: TEC-0471
label: "Check actions against a URDF digital twin before dispatch"
summary: >-
  Before any command reaches the hardware, it is run through forward
  dynamics simulation and collision detection in an Isaac Lab digital twin
  built from extended URDF models of each heterogeneous agent, and rejected
  if infeasible.
description: >-
  Before any command reaches the hardware, it is run through forward
  dynamics simulation and collision detection in an Isaac Lab digital twin
  built from extended URDF models of each heterogeneous agent, and rejected
  if infeasible. Filed by the drafting stage from ROSClaw: A Hierarchical
  Semantic-Physical Framework for Heterogeneous Multi-Agent Collaboration
  (2604.04664) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Not measured against a baseline: the paper reports
  successful end-to-end execution of a multi-robot fruit-transfer task and a
  seven-gimbal dance generated in about three minutes with human input
  limited to the initial instruction, with no ablation of the safeguard and
  no failure-rate comparison.. Nobody has vouched for it; add support or
  contest it on this page.
