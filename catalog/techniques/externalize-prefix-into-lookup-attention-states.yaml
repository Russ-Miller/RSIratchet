description: >-
  Precompute, cluster, and store attention outputs between prefix and
  calibration-query tokens per layer, then at inference retrieve the nearest
  centroid and merge it into self-attention via the online-softmax identity
  instead of attending to Filed by the drafting stage from Context
  Memorization for Efficient Long Context Generation (2605.18226) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  on five ManyICLBench classification tasks and two reasoning tasks versus
  in-context learning and KVzip at matched per-layer memory budgets, plus
  exact-match on RuleArena NBA (25.5% at 4K entries vs 24.1% for full 20K
  rulebook ICL and 21.2% zero-shot), and per-token attention latency over
  512 generated tokens (1.36x faster at 8K entries).. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [long-context-degradation]
kind: architecture
