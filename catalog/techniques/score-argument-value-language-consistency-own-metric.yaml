label: "Score argument-value language consistency as its own metric"
summary: >-
  Decompose tool-call evaluation into a conditional hierarchy — invocation
  detection, tool selection, argument completion, argument language
  consistency, full call match — so wrong-language argument values are
  separated from structural errors
description: >-
  Decompose tool-call evaluation into a conditional hierarchy — invocation
  detection, tool selection, argument completion, argument language
  consistency, full call match — so wrong-language argument values are
  separated from structural errors Filed by the drafting stage from When the
  API Speaks the Wrong Language: Revisiting Post-Training for Multilingual
  Tool Use (2608.11715) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to base and post-trained Qwen2.5-14B on two
  splits: base models score 91-95% on tool selection and argument completion
  but only 46-52% on argument language consistency and 22-32% on full
  function-call match, isolating language mismatch as the dominant residual
  error; no human validation of the metric reported.. Nobody has vouched for
  it; add support or contest it on this page.
