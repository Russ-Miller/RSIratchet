  executable, +30.6% functional correctness on average; ablation on
  Qwen3-Coder-30B-A3B isolates each module (Eoh +17/+15/+9, Reflect
  -1/+2/+7, full +19/+22/+23).. Nobody has vouched for it; add support or
  contest it on this page.
