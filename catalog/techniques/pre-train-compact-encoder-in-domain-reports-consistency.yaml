label: "Pre-train a compact encoder on in-domain reports for consist"
summary: >-
  Train a small BERT from scratch on a hospital's own radiology report
  corpus with masked language modelling plus a findings-conclusion
  consistency objective, then fine-tune it to classify synthetic reporting
  errors.
description: >-
  Train a small BERT from scratch on a hospital's own radiology report
  corpus with masked language modelling plus a findings-conclusion
  consistency objective, then fine-tune it to classify synthetic reporting
  errors. Filed by the drafting stage from Error Detection for PET/CT
  Radiology Reports: Domain-Specific vs Large Language Models (2608.30021)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Balanced accuracy on an 11,500-report synthetic benchmark: BERT-6 94.4% /
  FPR 5.8% vs 84.0% for the best prompted LLM (Llama-3.3-70B, prompt P7);
  LoRA-tuned Llama-3.3-70B 94.4%. Ablation shows MLM pre-training supplies
  most of the gain (BERT-6 56.5% to 93.7%). Lexical null models reach only
  69.9% balanced accuracy, ruling out keyword artefacts.. Nobody has vouched
  for it; add support or contest it on this page.
