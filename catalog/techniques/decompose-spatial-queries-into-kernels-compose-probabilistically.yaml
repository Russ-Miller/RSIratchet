description: >-
  An orchestrator splits a spatial instruction into anchor, predicate and
  metric clauses, separate agents resolve the anchor against a 3D scene
  graph and fit von Mises-Fisher directional and radial Gaussian distance
  kernels whose parameters a Filed by the drafting stage from Meanings and
  Measurements: Multi-Agent Probabilistic Grounding for Vision-Language
  Navigation (2603.19166) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: On MAPG-Bench (30 HM3D scenes, 100 annotated
  queries), object-to-world error fell from 5.82 m for the GraphEQA
  scene-graph baseline to 0.07 m, yaw 13.5 to 1.9 degrees, pitch 27.9 to
  4.4, task success 0.78 to 0.98; object-to-object error 0.50 m for SRGPT vs
  0.07 m. Ablation: replacing the explicit spatial reasoner with curated
  chain-of-thought dropped object-selection success from 0.42 to 0.20 (0.50
  to 0.30 under occlusion).. Nobody has vouched for it; add support or
  contest it on this page.
