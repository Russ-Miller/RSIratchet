description: >-
  The model re-feeds its own first-pass reasoning plus the original image
  back into itself to generate a reflection block, keeps only reflections
  that add corrective or new visual evidence, fine-tunes on those, then runs
  RL with a reward for Filed by the drafting stage from Reflect to Inform:
  Boosting Multimodal Reasoning via Information-Gain-Driven Verification
  (2603.26348) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Benchmark gains over the Qwen2.5-VL-7B base: V*-Bench
  76.4 to 83.8, ChartQA 83.7 to 88.8, OCRBench_v2 en 56.3 to 62.6, MathVerse
  49.2 to 53.1; staged ablation showing SFT alone lifts perception but
  barely moves MathVerse (+0.4) while RL adds +2.9; attention heatmaps
  showing a spike on visual tokens inside the reflection block; lower KL to
  the base policy and higher conditional entropy than GPT-5-distilled or
  Semantic-back reflections.. Nobody has vouched for it; add support or
  contest it on this page.
