id: correct-reasoning-inverting-named-typed-error-operator
ref: TEC-0112
label: "Correct reasoning by inverting a named typed error operator"
summary: >-
  Train a LoRA adapter to diagnose the active semantic error in a reasoning
  trace as an executable typed operator and then execute its inverse as a
  localized edit, repeating with an applicability check for a small number
  of iterations.
description: >-
  Train a LoRA adapter to diagnose the active semantic error in a reasoning
  trace as an executable typed operator and then execute its inverse as a
  localized edit, repeating with an applicability check for a small number
  of iterations. Filed by the drafting stage from Semantic Reasoning
  Denoising: Correcting Language Model Reasoning with Semantic Operators
  (2608.22090) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Six in-domain benchmarks (GSM8K, MATH, HumanEval+, MBPP,
  MMLU, PIQA) on a common Llama-3-8B-Instruct backbone: average 67.5 vs 64.3
  for the strongest baseline (DiffCoT) and 63.7 for SCoRe, over five seeds
  with Holm correction; seven cross-dataset transfer targets on two
  backbones; ablations show operator-only and adjacent-state-only objectives
  both lose points.. Nobody has vouched for it; add support or contest it on
  this page.
