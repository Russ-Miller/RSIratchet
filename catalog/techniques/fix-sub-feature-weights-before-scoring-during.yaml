description: >-
  A separate LLM call assigns per-instruction weights to leaf evaluation
  traits (content, format, impression sub-features) in a fixed tree, and
  leaf scores are then aggregated by those weights rather than by the
  judge's own implicit combinati Filed by the drafting stage from
  HoWToBench: Holistic Evaluation for LLM's Capability in Human-level
  Writing using Tree of Writing (2604.19071) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: System-level Pearson/Kendall/Spearman
  against human rankings of 9 LLM outputs on 221 instructions:
  0.93/0.83/0.93 overall vs 0.89/0.67/0.87 best auto-planned rubric and
  0.88/0.67/0.83 best auto-plan, at comparable cost; contribution-share
  fluctuation across 5 trials fell from mean 0.273 to 0.080; perturbation
  test (dropped or repeated paragraphs, genre transfer) lowered scores under
  the tree method while auto-planning and BLEU sometimes rose.. Nobody has
  vouched for it; add support or contest it on this page.
