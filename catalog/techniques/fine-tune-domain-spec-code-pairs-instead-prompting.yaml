description: >-
  LoRA supervised fine-tuning of a 7B code model on thousands of
  repository-level natural-language-specification-to-Solidity-contract pairs
  curated from OpenZeppelin, Synthetix and verified Etherscan contracts.
  Filed by the drafting stage from Repository-Level Solidity Code Generation
  with Large Language Models: From Prompting to Fine-Tuning (2606.19988)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  BLEU and SolidityScore (a Solidity-encoder embedding F1 with
  domain-weighted tokens) on a 547-sample held-out split of a 5,470-contract
  benchmark, compared against zero-shot, structured CoT, ICL and RAG with
  the same backbones; compilation success reported only as an auxiliary
  signal.. Nobody has vouched for it; add support or contest it on this
  page.
