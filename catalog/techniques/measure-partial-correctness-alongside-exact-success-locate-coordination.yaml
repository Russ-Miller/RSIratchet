id: measure-partial-correctness-alongside-exact-success-locate-coordination
ref: TEC-0597
label: "Measure partial correctness alongside exact success to locat"
summary: >-
  Scores each agent's answer on a continuous per-task quality measure as
  well as exact match, so the gap between the two isolates failure at the
  reasoning-integration stage rather than the communication stage.
description: >-
  Scores each agent's answer on a continuous per-task quality measure as
  well as exact match, so the gap between the two isolates failure at the
  reasoning-integration stage rather than the communication stage. Filed by
  the drafting stage from Silo-Bench: A Scalable Environment for Evaluating
  Distributed Coordination in Multi-Agent LLM Systems (2603.01045) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Applied
  across 1,620 runs; the PCS-SR gap (e.g. 88.0% vs 62.0% on Level-I for
  DeepSeek, 8-16% vs 0% on Level-III at N>=50) is used together with a
  rule-based plus two-annotator failure taxonomy (Cohen's kappa 0.87)
  attributing failures to premature submission 37.2%, consensus failure
  29.9%, computation error 28.6%. Not validated against an independent
  ground-truth labelling of where failure occurred.. Nobody has vouched for
  it; add support or contest it on this page.
