description: >-
  The agent stores successful past gameplay episodes, retrieves the few most
  similar to the current time and observation, and a gating rule decides
  whether to execute the retrieved action directly or reason anew by fusing
  the retrieved episod Filed by the drafting stage from LLMs Are Not Good
  Strategists, Yet Memory-Enhanced Agency Boosts Reasoning (2608.12626) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Win rate
  against built-in opponents across five strategy styles on two held-out
  maps: 67.5% (GPT-4o-mini) and 75.0% (GPT-4-turbo) at Level 5 versus 60.0%
  for the CoS baseline, and 30.0% versus 8.3% at Level 6; token use reported
  as 14.5% of CoS on matched models; ablations removing exploration
  (60.0%/17.5%) or contextual fusion (65.0%/12.5%) both lower win rate..
  Nobody has vouched for it; add support or contest it on this page.
