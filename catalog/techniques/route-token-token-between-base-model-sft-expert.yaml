id: route-token-token-between-base-model-sft-expert
ref: TEC-0191
label: "Route token by token between base model and SFT expert"
summary: >-
  Train a lightweight two-stage router on the base model's hidden states,
  labelled by tokens where the base's greedy prediction is wrong and the
  expert's is right, then at decoding mix the two next-token distributions
  with momentum smoothing
description: >-
  Train a lightweight two-stage router on the base model's hidden states,
  labelled by tokens where the base's greedy prediction is wrong and the
  expert's is right, then at decoding mix the two next-token distributions
  with momentum smoothing Filed by the drafting stage from CPR for LLMs:
  Critical-Point Routing against Catastrophic Forgetting in Domain
  Adaptation (2608.30158) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Four model-domain settings, six benchmarks;
  compared against vanilla SFT, DFT, EAFT, LfU, RouteLLM, Switch Generation,
  ensemble and contrastive decoding sharing the same base and expert;
  highest overall average in all settings, plus ablations on router
  architecture, momentum and thresholds, and wall-clock latency (1.40-1.44x
  expert-only vs 1.89-2.25x ensemble).. Nobody has vouched for it; add
  support or contest it on this page.
