description: >-
  A harness intercepts every planner command, checks it against retrieved
  spatial evidence, geometric feasibility, the active subgoal and past
  failure records, dispatches only if it passes, and refuses planner-issued
  stops unless semantic, ge Filed by the drafting stage from HarnessVLN:
  Unifying Training-Free Embodied Navigation through an Agent Harness
  (2609.15195) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Cumulative ablation on fixed 100-episode subsets: event
  memory +8.0/+7.0 SR points, graph retrieval +6.0/+1.0, stop validation
  +4.0/+2.0 on R2R and HM3D-OVON; full system beats prior training-free SOTA
  by 5.8, 12.1, 1.6 and 9.1 SR points on four benchmarks.. Nobody has
  vouched for it; add support or contest it on this page.
