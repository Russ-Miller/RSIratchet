label: "Arbitrate conflicting evidence streams by relevance-gated fu"
summary: >-
  Generate perception, retrieval and web-verification evidence with the same
  backbone, score each stream for relevance/accuracy/discriminativeness,
  softmax-weight them into a fused answer, and refine under six cultural
  rubric criteria.
description: >-
  Generate perception, retrieval and web-verification evidence with the same
  backbone, score each stream for relevance/accuracy/discriminativeness,
  softmax-weight them into a fused answer, and refine under six cultural
  rubric criteria. Filed by the drafting stage from CM2: Multimodal Cultural
  Reasoning via an Integrated Multi-Agent Framework (2608.30498) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: 4-way accuracy on
  442 CM2D items against CoT, Self-Refine, CoT-SC and Agent Debate on four
  backbones (e.g. llava-onevision-7b 23.53 to 50.68, best baseline 43.21;
  GPT4.1-mini 41.63 to 55.20, best baseline 54.30), plus module ablations
  and a conflict/consensus split where conflict-subset accuracy is 50.0/53.4
  vs 41.2/43.3 majority vote.. Nobody has vouched for it; add support or
  contest it on this page.
