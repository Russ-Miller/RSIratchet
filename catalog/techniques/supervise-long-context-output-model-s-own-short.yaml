id: supervise-long-context-output-model-s-own-short
ref: TEC-0895
label: "Supervise long-context output with the model's own short-con"
summary: >-
  The model answers from the full long context while the same weights,
  conditioned only on the extracted short evidence chunk, supply a per-token
  reverse-KL advantage used as the policy-gradient signal.
description: >-
  The model answers from the full long context while the same weights,
  conditioned only on the extracted short evidence chunk, supply a per-token
  reverse-KL advantage used as the policy-gradient signal. Filed by the
  drafting stage from OPSDL: On-Policy Self-Distillation for Long-Context
  Language Models (2604.17535) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: RULER per-length accuracy and LongBench V2 overall
  against the base instruct model, Long-SFT and LongPO; e.g. 7B total avg
  51.68 base, 53.99 SFT, 55.42 LongPO, 56.61 OPSDL; 128K gains of
  +48.70/+34.25/+30.29 over base at 7B/14B/32B; short-context retention
  checked on MMLU, ARC-C, HellaSwag, Winogrande, MT-Bench. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [long-context-degradation]
kind: training
sources: [arxiv-2604-17535]
status: proposed
