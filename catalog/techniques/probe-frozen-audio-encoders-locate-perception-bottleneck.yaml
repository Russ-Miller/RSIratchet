id: probe-frozen-audio-encoders-locate-perception-bottleneck
ref: TEC-0646
label: "Probe frozen audio encoders to locate the perception bottlen"
summary: >-
  Attach a small linear probe to the frozen audio encoder of an audio LLM
  and train it per attribute, comparing its accuracy against the full
  end-to-end model's answer accuracy on the same items.
description: >-
  Attach a small linear probe to the frozen audio encoder of an audio LLM
  and train it per attribute, comparing its accuracy against the full
  end-to-end model's answer accuracy on the same items. Filed by the
  drafting stage from SonicBench: Dissecting the Physical Perception
  Bottleneck in Large Audio Language Models (2601.11039) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Across eight model
  families, probe accuracy was at or above 0.60 on every encoder while the
  corresponding end-to-end models clustered near 0.50 chance; Qwen2.5-Omni
  and Qwen3-Omni were exceptions whose E2E accuracy reached or exceeded
  their probe.. Nobody has vouched for it; add support or contest it on this
  page.
