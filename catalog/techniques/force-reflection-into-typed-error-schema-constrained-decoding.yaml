id: force-reflection-into-typed-error-schema-constrained-decoding
ref: TEC-0676
label: "Force reflection into a typed error schema by constrained de"
summary: >-
  Use grammar-constrained decoding to make the reflector emit a JSON object
  naming one of five error types plus a correction rule, instead of
  free-text reflection.
description: >-
  Use grammar-constrained decoding to make the reflector emit a JSON object
  naming one of five error types plus a correction rule, instead of
  free-text reflection. Filed by the drafting stage from From Hallucination
  to Structure Snowballing: The Alignment Tax of Constrained Decoding in LLM
  Reflection (2604.06066) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Compared against free-text Reflexion on the same
  100 samples: accuracy fell from 50% to 38% (McNemar p about 0.059), 23
  correct cases flipped to wrong versus 11 the other way, 96 of 100
  first-round diagnoses were FORMATTING_MISMATCH, 58 samples repeated the
  same formatting error across all trials, and failing cases burned more
  thinking tokens (4,005 vs 2,850 average).. Nobody has vouched for it; add
  support or contest it on this page.
