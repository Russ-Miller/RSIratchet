id: classify-model-task-pairs-detectability-correctability
ref: TEC-0589
label: "Classify model-task pairs by detectability and correctabilit"
summary: >-
  Scores each model-task combination on whether errors are detectable before
  output commitment and correctable once detected, placing it in one of four
  governance regimes (Governable, Monitor Only, Steer Blind, Ungovernable).
description: >-
  Scores each model-task combination on whether errors are detectable before
  output commitment and correctable once detected, placing it in one of four
  governance regimes (Governable, Monitor Only, Steer Blind, Ungovernable).
  Filed by the drafting stage from Silent Commitment Failure in
  Instruction-Tuned Language Models: Evidence of Governability Divergence
  Across Architectures (2603.21415) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Not measured as an intervention; the
  matrix is a classification built from the measured spike ratios and
  correction rates, with a 2x2 experiment reporting a 52x spike-ratio
  difference between architectures versus ±0.32x from fine-tuning.. Nobody
  has vouched for it; add support or contest it on this page.
