id: parse-description-into-sketch-then-search-examples
ref: TEC-0049
label: "Parse the description into a sketch, then search with exampl"
summary: >-
  Convert the English description into a hierarchical sketch with
  constrained holes, then run a programming-by-example search that uses the
  sketch's hints both to prioritize expansion and to over/under-approximate
  partial programs for pruning
description: >-
  Convert the English description into a hierarchical sketch with
  constrained holes, then run a programming-by-example search that uses the
  sketch's hints both to prioritize expansion and to over/under-approximate
  partial programs for pruning Filed by the drafting stage from Multi-modal
  Synthesis of Regular Expressions (1908.03316) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Exact-match against
  ground-truth regexes on 200 adapted DeepRegex benchmarks and 122
  StackOverflow benchmarks, against an NL-only seq2seq baseline (DeepRegex)
  and an examples-only ablation of the same engine, plus a 20-participant
  user study where users were twice as likely to produce the intended
  regex.. Nobody has vouched for it; add support or contest it on this page.
