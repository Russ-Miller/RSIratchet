description: >-
  Accumulate natural-language user preferences from rollout-and-critique
  over past trajectories into a prompt-injected pool, and store app-specific
  workflows and content preferences in a separate hierarchical memory
  retrieved only for the res Filed by the drafting stage from Me-Agent: A
  Personalized Mobile Agent with Two-Level User Habit Learning for Enhanced
  Interaction (2601.20162) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: App Selection Accuracy, BERTScore, Preference
  Score, task completion/success rate on User FingerTip against
  Mobile-Agent-v2/E; ablation incrementally adding each module, where the
  preference-learning module mainly raised task completion and the
  hierarchical memory mainly raised semantic quality and preference
  alignment; also evaluated on the E dataset (TCR 0.893 vs 0.639 baseline)..
  Nobody has vouched for it; add support or contest it on this page.
