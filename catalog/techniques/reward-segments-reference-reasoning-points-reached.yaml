id: reward-segments-reference-reasoning-points-reached
ref: TEC-0185
label: "Reward segments by reference reasoning points reached"
summary: >-
  Split each sampled trajectory into segments and give each segment a reward
  equal to the increase in the count of reference-solution reasoning points
  it has reached, with credit shortcut so that reaching the goal counts all
  points.
description: >-
  Split each sampled trajectory into segments and give each segment a reward
  equal to the increase in the count of reference-solution reasoning points
  it has reached, with credit shortcut so that reaching the goal counts all
  points. Filed by the drafting stage from Long-Horizon Language Model
  Reinforcement Learning via Progressive Point Matching (2609.07303) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: GRPO
  baseline vs trajectory-level and segment-level variants on
  Multi-Countdown, Matrix Manipulation, GSM-Infinite (success 0.415 vs 0.084
  sparse at n=16; 0.191 vs 0.091 at n=24), Polaris pass@1/pass@8 at 16K
  eval, and a POPE-hard subset where base pass rate is ~0.004 at 8K; also a
  signal-to-noise theorem.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [long-horizon-execution]
kind: training
sources: [arxiv-2609-07303]
status: proposed
