description: >-
  Build training pairs by corrupting correct reasoning traces with typed
  error operators (premise deletion, relation reversal, value substitution,
  step reordering, conclusion substitution), train the model to name the
  active operator and reco Filed by the drafting stage from Semantic
  Reasoning Denoising: Correcting Language Model Reasoning with Semantic
  Operators (2608.22090) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Six in-domain benchmarks (GSM8K, MATH, HumanEval+, MBPP,
  MMLU, PIQA) on Llama-3-8B-Instruct: average 67.5 vs 64.3 for DiffCoT and
  63.7 for SCoRe, 59.4 base CoT; seven transfer targets on two backbones;
  ablations removing operator loss, adjacent-state loss, and each noise
  source all lower scores; five seeds with Holm correction.. Nobody has
  vouched for it; add support or contest it on this page.
