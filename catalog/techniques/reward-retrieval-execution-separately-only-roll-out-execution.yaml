label: "Reward retrieval and execution separately, and only roll out"
summary: >-
  Within one GRPO step, compute task-specific rewards and group-normalized
  advantages for the tool-retrieval and tool-execution spans separately,
  apply their updates sequentially rather than summing gradients, and
  generate execution rollouts
description: >-
