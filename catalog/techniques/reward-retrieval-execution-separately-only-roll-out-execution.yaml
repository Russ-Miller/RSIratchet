  generate execution rollouts Filed by the drafting stage from ToolOmni:
  Enabling Open-World Tool Use via Agentic learning with Proactive Retrieval
  and Grounded Execution (2604.13787) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Solvable Pass Rate on ToolBench
  (GPT-5 judge): full method 52.5%, w/o trajectory filter 38.5%, combined
  gradient update 42.6%, vanilla single-reward GRPO 50.8%; end-to-end SoPR
  54.13% vs 42.35% for a GPT-3.5 + ToolRetriever pipeline.. Nobody has
  vouched for it; add support or contest it on this page.
