id: score-hallucination-per-token-per-reasoning-step
ref: TEC-0540
label: "Score hallucination per token, not per reasoning step"
summary: >-
  Trains a small LM to output a hallucination probability for every token of
  a free-form response, supervised by adaptively weighted ensembles of
  critic-model span annotations and an importance-weighted cross-entropy
  loss.
description: >-
  Trains a small LM to output a hallucination probability for every token of
  a free-form response, supervised by adaptively weighted ensembles of
  critic-model span annotations and an importance-weighted cross-entropy
  loss. Filed by the drafting stage from Scalable Token-Level Hallucination
  Detection in Large Language Models (2605.12384) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Token-level F1 on hallucinated
  samples (S_incor) and recall on clean samples (S_cor) across Math-500,
  AIME-2024/2025, OlympiadBench-Math plus GPQA, OlympiadBench-Phy, FinQA;
  compared against backbone models, four critic models, labeler models, and
  Qwen2.5-Math-PRM-72B; ablations isolate adaptive ensembling and importance
  weighting.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [error-detection]
kind: training
