id: build-test-specialized-repository-knowledge-graph-test-agents
ref: TEC-0253
label: "Build a test-specialized repository knowledge graph for test"
summary: >-
  Static analysis builds a repository graph of code entities and
  dependencies with test-specific nodes and test-focal links, which also
  persists function summaries, test reports and root-cause analyses for
  agents to query via tools.
description: >-
  Static analysis builds a repository graph of code entities and
  dependencies with test-specific nodes and test-focal links, which also
  persists function summaries, test reports and root-cause analyses for
  agents to query via tools. Filed by the drafting stage from Multi-Agent
  LLM Collaboration for Unit Test Generation via Human-Testing-Inspired
  Workflows (2607.09101) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation on six Java projects: removing the knowledge
  graph dropped line coverage 92.34%->75.65%, branch 90.24%->72.62%,
  mutation 83.69%->66.12%; removing the reviewer cost ~4-8% relative and
  removing similar-test retrieval ~1-3%.. Nobody has vouched for it; add
  support or contest it on this page.
