description: >-
  During handheld demonstration, query the current policy on the same
  observation stream without executing it, record extra demonstration
  segments when an energy score between the human action chunk and the
  policy's sampled chunks exceeds a t Filed by the drafting stage from
  HIL-UMI: Bringing Human-in-the-Loop Post-Training of
  Vision-Language-Action Models to Universal Manipulation Interface
  (2609.20659) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean task progress score across rounds on four real tasks
  versus supervised fine-tuning on equal-budget ordinary UMI demonstrations,
  plus an ablation removing the advantage model and a comparison to
  real-robot HG-DAgger on Clean Up Table (higher score, 73.4 vs 412.99 ms
  per collected frame).. Nobody has vouched for it; add support or contest
  it on this page.
