  validated it by: Accuracy and average generated tokens on AIME25, MATH500,
  GSM8K, GPQA-D and LiveCodeBench against the two source models, five
  fixed-ratio merging methods at coefficient 0.8, and CMA-ES matched on
  prompts, search space and objective: 76.5 average accuracy at 73.0% of
