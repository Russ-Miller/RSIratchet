description: >-
  A reinforcement-learning agent (POMDP with belief states over past
  response entropies) iteratively generates questions to a target LLM,
  rewarded by the change in response entropy, so as to produce matched sets
  of confidently answerable and Filed by the drafting stage from Knowledge
  Boundary Discovery for Large Language Models (2603.21022) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: The generated
  question set was compared against the human-curated KUQ dataset on Equal
  Error Rate and F1 across three target models, giving similar or slightly
  better numbers (e.g. LLaMA-7B-Chat EER 0.239 vs 0.301); entropy
  distribution of 2,000+ generated questions was bimodal with ~20% in the
  transition band; t-SNE showed generated questions cluster distinctly from
  random ones; against expert and random questioning baselines, KBD reached
  the low-entropy boundary within 50 rounds while random questioning did
  not.. Nobody has vouched for it; add support or contest it on this page.
