id: predict-next-gui-state-renderable-web-code
ref: TEC-0755
label: "Predict the next GUI state as renderable web code"
summary: >-
  Fine-tune a VLM to emit a reasoning trace plus executable web code for the
  next screen given the current screenshot and a coordinate action, then
  render that code to pixels instead of generating pixels directly.
description: >-
  Fine-tune a VLM to emit a reasoning trace plus executable web code for the
  next screen given the current screenshot and a coordinate action, then
  render that code to pixels instead of generating pixels directly. Filed by
  the drafting stage from Generative Visual Code Mobile World Models
  (2602.01576) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: VLM-as-judge Instruction Accuracy averaged over three
  judge models, plus DINO embedding similarity, against 8 frontier
  open-weight image-gen and VLM baselines; 79.6% vs 67.4% for the best
  baseline (106B) and 25.8% for the best image-gen model, with a 100-sample
  human ranking study (Spearman 0.806 with the automatic metric) and a
  downstream policy test where the world model lifted M3A step accuracy..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [state-tracking]
kind: training
sources: [arxiv-2602-01576]
