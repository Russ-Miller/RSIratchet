description: >-
  A ~200K-parameter MLP scores cached tokens from attention mass, value
  norm, attention variance, entropy and position, and is trained with
  REINFORCE against a per-step negative KL between full-cache and
  pruned-cache next-token distributions. Filed by the drafting stage from
  DistillCache: KL-Guided Adaptive KV-Cache Eviction for Memory-Efficient
  LLM Inference (2608.08878) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: LongBench and reasoning accuracy across 12.5-100%
  budgets against full cache, H2O, SnapKV, and re-implemented
  ForesightKV/RLKV, plus perplexity increase, per-component latency and
  throughput; 5 training seeds; a supervised ranker on the same five
  features scored 37.8 vs 39.1 at 25% budget.. Nobody has vouched for it;
  add support or contest it on this page.
