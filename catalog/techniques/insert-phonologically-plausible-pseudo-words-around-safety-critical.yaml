id: insert-phonologically-plausible-pseudo-words-around-safety-critical
ref: TEC-0318
label: "Insert phonologically plausible pseudo-words around safety-c"
summary: >-
  Spoken obfuscation that inserts meaningless but phonologically plausible
  pseudo-words around harmful keywords at controlled density (10/30/50% of
  utterance length) while leaving every original word in place.
description: >-
  Spoken obfuscation that inserts meaningless but phonologically plausible
  pseudo-words around harmful keywords at controlled density (10/30/50% of
  utterance length) while leaving every original word in place. Filed by the
  drafting stage from SpeechJBB: Probing Safety Alignment and Comprehension
  in Large Audio Language Models under Code-Switched Speech (2606.06037)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Mean jailbreak success rose monotonically from 18.4% (no insertion) to
  20.3/22.5/24.6% at 10/30/50% insertion across nine models and 15 language
  settings (Friedman chi2(3)=12.07, p=0.007), while models attributed
  harmful meaning to the inserted tokens in only 3.7-16.8% of cases.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [jailbreak-robustness]
