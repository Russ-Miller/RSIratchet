id: split-text-to-sql-evaluation-database-question
ref: TEC-0061
label: "Split text-to-SQL evaluation by database, not by question"
summary: >-
  Evaluate SQL synthesis on databases and query patterns that never appear
  in training, so memorized question-query templates cannot be reused.
description: >-
  Evaluate SQL synthesis on databases and query patterns that never appear
  in training, so memorized question-query templates cannot be reused. Filed
  by the drafting stage from Spider: A Large-Scale Human-Labeled Dataset for
  Complex and Cross-Domain Semantic Parsing and Text-to-SQL Task
  (1809.08887) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Exact-match and per-component F1 for five models under an
  example split versus a database split of the same corpus; every model
  scored far lower under the database split, with TypeSQL dropping most
  (33.0 to 8.2 on test).. Nobody has vouched for it; add support or contest
  it on this page.
