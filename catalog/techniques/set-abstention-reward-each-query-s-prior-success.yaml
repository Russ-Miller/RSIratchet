label: "Set the abstention reward from each query's prior success ra"
summary: >-
  Before RL, estimate the abstain-free checkpoint's per-query success
  probability, set the refusal reward to one minus that probability raised
  to a tunable 'courage' exponent, and adjust it each batch by the gap
  between observed and expected
description: >-
  Before RL, estimate the abstain-free checkpoint's per-query success
  probability, set the refusal reward to one minus that probability raised
  to a tunable 'courage' exponent, and adjust it each batch by the gap
  between observed and expected Filed by the drafting stage from To Answer
  or to Abstain: Mitigating Search-Agent Hallucinations via Abstention-Aware
  Reinforcement Learning (2607.10738) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Averaged accuracy, refusal rate,
  precision and a precision/accuracy harmonic mean (RA-F1) over three
  multi-hop QA benchmarks, against non-abstaining RL, refusal-trajectory SFT
  mixing, unanswerable-query mixing, and static refusal rewards; best RA-F1
  0.585 vs 0.556 baseline.. Nobody has vouched for it; add support or
  contest it on this page.
