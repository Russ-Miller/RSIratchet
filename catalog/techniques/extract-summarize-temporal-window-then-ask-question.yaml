  window around the referenced event, concatenate multi-clip options onto
  one re-normalized timeline, and for long videos narrate 10-minute chunks
  and prepend the order Filed by the drafting stage from Optimizing
  Multimodal LLMs for Egocentric Video Understanding: A Solution for the
  HD-EPIC VQA Challenge (2601.10228) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Reported +3.0% overall accuracy over
  direct VQA with the same pre-processing; the combined fine-tuning/T-CoT
  ablation moves overall accuracy from 37.5% to 41.6% on HD-EPIC VQA, with
  the largest per-prototype gains on localization and ordering tasks..
