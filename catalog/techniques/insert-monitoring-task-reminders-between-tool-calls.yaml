id: insert-monitoring-task-reminders-between-tool-calls
ref: TEC-0502
label: "Insert monitoring-task reminders between tool calls"
summary: >-
  Repeats the monitor's classification instruction between every tool call
  and tool response in the transcript being classified, and/or monitors
  truncated sub-transcripts incrementally rather than only at the end.
description: >-
  Repeats the monitor's classification instruction between every tool call
  and tool response in the transcript being classified, and/or monitors
  truncated sub-transcripts incrementally rather than only at the end. Filed
  by the drafting stage from Classifier Context Rot: Monitor Performance
  Degrades with Context Length (2605.12366) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Recall on needle-injection and
  padded-MonitorBench evaluations versus the same prompt without reminders,
  paired McNemar tests; reminders raised needle detection for most models
  but not on subtle MonitorBench attacks, at <3% input-token overhead and no
  increase in false positives (verified <2% on clean transcripts).. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [reward-hacking]
kind: prompting
