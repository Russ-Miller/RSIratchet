id: retrieve-past-trajectories-abstracted-intent-scripts
ref: TEC-0370
label: "Retrieve past trajectories, not abstracted intent scripts"
summary: >-
  Index training-set user queries against their ground-truth tool-execution
  trajectories and prepend the top-k retrieved trajectories to the user
  turn, rather than retrieving clustered intent-level usage scripts.
description: >-
  Index training-set user queries against their ground-truth tool-execution
  trajectories and prepend the top-k retrieved trajectories to the user
  turn, rather than retrieving clustered intent-level usage scripts. Filed
  by the drafting stage from Pushing the Limits of LLM Tool Calling via
  Experiential Knowledge Integration and Activation (2606.10875) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Compared four
  knowledge forms (scenario trajectory, experience summary, script-style
  intent clustering, textual-style intent clustering, and all combined) on
  BFCL-V3 accuracy with Qwen3-8B/32B; instance-level forms gave the largest
  gains, the two instance forms were comparable to each other, and the 'All'
  combination did not add further gain.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [tool-use]
kind: retrieval
