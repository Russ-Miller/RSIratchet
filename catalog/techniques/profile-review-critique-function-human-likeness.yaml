  human critique are compared by what functions they perform rather than by
  textual overlap. Filed by the drafting stage from Beyond Human-Likeness:
  Mapping the Scientific Critique Profiles of LLMs and Human Reviewers
  (2609.01895) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to ICLR 2025 human reviews versus baseline- and
  expert-prompted LLM reviews; the scheme separated the two sources into
  distinct functional profiles that overlap metrics would score as similar.
  No external validation of the annotation scheme reported.. Nobody has
  vouched for it; add support or contest it on this page.
