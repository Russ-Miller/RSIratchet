id: consolidate-corpus-into-fixed-size-memory-chunk-chunk
ref: TEC-0595
label: "Consolidate the corpus into a fixed-size memory chunk by chu"
summary: >-
  Instead of retrieving top-k chunks, pass the corpus through the model
  sequentially in chunks, updating a fixed-size memory buffer, and answer
  only from the consolidated memory.
description: >-
  Instead of retrieving top-k chunks, pass the corpus through the model
  sequentially in chunks, updating a fixed-size memory buffer, and answer
  only from the consolidated memory. Filed by the drafting stage from
  CorpusQA: A 10 Million Token Benchmark for Corpus-Level Analysis and
  Reasoning (2601.14952) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy judged by an LLM judge against programmatically
  derived SQL ground truth on CorpusQA, compared against a RAG pipeline on
  the same backbone: 67.58 vs 55.85 at 128K, 44.95 vs 17.38 at 1M, 22.14 vs
  2.43 at 4M, 11.13 vs 1.20 at 10M. No matched-token-cost baseline
  reported.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [long-context-degradation]
kind: process
sources: [arxiv-2601-14952]
status: proposed
