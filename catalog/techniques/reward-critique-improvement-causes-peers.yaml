description: >-
  In multi-agent self-play, score each agent's critique by the increase in
  the critiqued peer's Bradley-Terry peer-ranking score after revision, and
  use that diagnostic reward (alongside solution-quality and
  majority-alignment rewards, with i Filed by the drafting stage from
  Conversation for Non-verifiable Learning: Self-Evolving LLMs through
  Meta-Evaluation (2601.21464) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Pass@1 on six verifiable reasoning benchmarks
  across four backbones against self-rewarding majority-vote baselines
  (Qwen3-8B DeepMath 87.1 vs 78.8, AIME24 76.5 vs 69.8), three
  non-verifiable benchmarks (+2.7-8.3 pp over SRT-M), ablation zeroing the
  diagnostic weight (DeepMath Pass@1 87.1 to 83.5, Rank-rho 0.78 to 0.55),
  and RewardBench-2 judge accuracy 52.3 to 58.6.. Nobody has vouched for it;
  add support or contest it on this page.
