description: >-
  Decompose a cumulative long-horizon score into reproducible per-model
  behavioral metrics (endgame investment shift, idle-cash ratio,
  contract-renewal lead, offers per signing, notebook rewrite similarity,
  tokens) and rank-normalize them int Filed by the drafting stage from
  FM-Bench: A Benchmark for Long-Horizon Management with Competing Agents
  (2608.18423) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Spearman correlations of each metric with final score
  across 15 models, reported with the same sign on all three seeds for three
  of the axes (endgame -0.58, idle cash -0.50, renewal lead +0.45) and a
  null for token spend (-0.19, p>0.38); not validated against any external
  ground truth of managerial skill.. Nobody has vouched for it; add support
  or contest it on this page.
