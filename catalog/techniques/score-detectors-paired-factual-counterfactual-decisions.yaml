id: score-detectors-paired-factual-counterfactual-decisions
ref: TEC-0110
label: "Score detectors on paired factual/counterfactual decisions"
summary: >-
  Evaluate a hallucination detector by requiring it to accept the factual
  answer and reject the minimally edited counterfactual for the same video,
  reporting the joint success rate rather than one-sided accuracy.
description: >-
  Evaluate a hallucination detector by requiring it to accept the factual
  answer and reject the minimally edited counterfactual for the same video,
  reporting the joint success rate rather than one-sided accuracy. Filed by
  the drafting stage from Can We Trust Video Hallucination Detectors?
  VidHalLoc for Evaluating the Evaluators (2609.09895) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Applied to fifteen
  detection methods on 2,000 paired samples; separates factual,
  counterfactual and joint accuracy, showing dedicated detectors peak at
  34.63% overall. No comparison against an independent human-detector
  reference for the protocol itself.. Nobody has vouched for it; add support
  or contest it on this page.
