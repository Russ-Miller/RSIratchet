description: >-
  A ReAct agent trained with GRPO on rollout-level rewards composes
  character-, token- and prompt-level edits to a robot instruction under a
  character and tool-call budget, using only black-box rollouts of the
  frozen policy. Filed by the drafting stage from SABER: A Stealthy Agentic
  Black-Box Attack Framework for Vision-Language-Action Models (2603.24935)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Measured against a frozen GPT-5-mini attacker with the same tool
  interface: comparable or slightly better attack metrics (ASR 16.7 vs 14.5)
  with 21.1% fewer tool calls and 54.7% fewer character edits; ablation
  shows GRPO without SFT cold-start drops ASR from 16.7 to 8.7.. Nobody has
  vouched for it; add support or contest it on this page.
