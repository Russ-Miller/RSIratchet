description: >-
  Scores how far a model can engage, suppress, dial, time-place and
  layer-target a concept in its residual stream under natural-language
  instruction, combining six measures into one conjunctive score. Filed by
  the drafting stage from Measuring Activation Control in Large Language
  Models (2608.21664) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to 25 open-weight models; score ranged
  0.059-0.538, rose across Olmo training checkpoints, and separated models
  whose suppression evaded four monitor families (suppression detection
  5-21% at 1% FPR versus near-ceiling for engagement).. Nobody has vouched
  for it; add support or contest it on this page.
