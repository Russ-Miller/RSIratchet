id: retrieve-clause-level-knowledge-database-s-sql-query
ref: TEC-0177
label: "Retrieve clause-level knowledge from a database's SQL query "
summary: >-
  Parse past SQL into five categories of clause-level fragments, describe
  each in natural language, retrieve by query- and component-level embedding
  similarity, then LLM-rerank before prepending to an existing few-shot
  text-to-SQL prompt.
description: >-
  Parse past SQL into five categories of clause-level fragments, describe
  each in natural language, retrieve by query- and component-level embedding
  similarity, then LLM-rerank before prepending to an existing few-shot
  text-to-SQL prompt. Filed by the drafting stage from BIRD-History: A
  Benchmark for History-Driven Text-to-SQL with Fine-Grained Knowledge
  Annotations (2608.29345) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Execution accuracy on BIRD-History (1,393 tasks, 11
  databases) against each pipeline's own retriever: DAIL-SQL 40.78 to 51.33,
  OpenSearch-SQL 59.15 to 60.95, N-rep 54.49 to 57.79, CodeS-7B 12.92 to
  18.95; retrieval F1 49.77 vs 28.69-34.88 for baseline retrievers;
  shot-count sweep shows EX peaking at 4 shots (61.31) with precision
  falling from 57.95 to 35.53 as recall rises to 83.07.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [formal-query-synthesis]
