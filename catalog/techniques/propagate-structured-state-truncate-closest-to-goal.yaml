description: >-
  Prompts a multimodal LLM to estimate the workstation state as a JSON
  object, propagate it forward through each predicted action, compute a
  numeric distance to the inferred goal state, and cut the action plan at
  the state with the lowest dis Filed by the drafting stage from STEP:
  State-Aware Task Estimation and Planning with Multi-Modal LLMs for
  Human-Robot Collaboration (2608.27225) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared against an AntGPT-style
  task-estimation-plus-action-prediction baseline with no state information
  on the same inputs: +32.8% action executability and -14.8% final-state
  error, at 30/50/70/90% task-completion splits; replicated across five
  OpenAI models on a 45-instance subset (STEP better on 4 of 5); LCS was
  lower than baseline and runtime rose from ~18s to ~148s.. Nobody has
  vouched for it; add support or contest it on this page.
