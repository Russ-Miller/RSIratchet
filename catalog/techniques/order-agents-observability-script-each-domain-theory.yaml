description: >-
  Decomposes mental-state inference into three agents that predict
  behaviour, then cognition conditioned on behaviour, then emotion
  conditioned on both, each prompted with a self-regulated-learning task
  specification for its dimension. Filed by the drafting stage from
  MOTOR-Bench: A Real-world Dataset and Multi-agent Framework for Zero-shot
  Human Mental State Understanding (2605.09703) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Macro-F1 averaged over the
  three dimensions on 1,440 clips: 42.77 vs 26.84 for the best single MLLM
  (InternVL-3.5) and 39.28 for CAMEL with 3 agents on the same backbone;
  ablations remove the agent split (34.81), the SRL priors (33.90), and the
  video input (39.47).. Nobody has vouched for it; add support or contest it
  on this page.
