id: reward-each-model-peer-model-s-majority-vote
ref: TEC-0314
label: "Reward each model by a peer model's majority vote, not its o"
summary: >-
  Train several parameter-disjoint models simultaneously with RL, where each
  model's rollouts are scored against the majority-vote answer of a
  different model in the cohort, passed along a directed ring.
description: >-
  Train several parameter-disjoint models simultaneously with RL, where each
  model's rollouts are scored against the majority-vote answer of a
  different model in the cohort, passed along a directed ring. Filed by the
  drafting stage from Co-RL: Unsupervised Reasoning Emerges from Diverse
  Cohort in Multi-agent RL (2608.17253) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Average gains of 3.0-8.6% over base
  across seven text benchmarks and 2.3-7.2% across four multimodal
  benchmarks, beating TTRL, RENT, Intuitor, Co-rewarding-II, MAPoRL and
  CoMAS (+4.0% over CoMAS with half the agents), with a compute-matched
  control where two TTRL-trained models are ensembled at inference.. Nobody
  has vouched for it; add support or contest it on this page.
