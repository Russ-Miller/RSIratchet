description: >-
  Fit one LoRA adapter by sequence-level SFT on reference tool sequences for
  workflow planning and a second by node-level GRPO with argument-match
  rewards for runtime argument grounding, so workflow errors and argument
  errors get separate cre Filed by the drafting stage from Earth-Agent-Pro:
  Towards Real-World Full-Chain Earth Observation with Agents (2609.12533)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  On Earth-Bench-Pro, the 2x2 adapter composition: base/base 38.31%
  LLM-as-Judge, planner-tuned only 44.76%, executor-tuned only 43.15%, both
  50.00%; planning-only evaluation raised TIO from 71.87 to 83.35, and
  oracle-plan executor evaluation raised judge accuracy from 46.37 to 52.82
  and parameter accuracy from 34.19 to 37.20.. Nobody has vouched for it;
  add support or contest it on this page.
