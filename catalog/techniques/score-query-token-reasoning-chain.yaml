id: score-query-token-reasoning-chain
ref: TEC-0528
label: "Score from a query token, not from the reasoning chain"
summary: >-
  Have the MLLM generate a chain of thought, then append a learnable
  [Reward] token whose hidden state a regression head maps to a scalar
  reward, trained with Bradley-Terry loss alongside GRPO on the reasoning.
description: >-
  Have the MLLM generate a chain of thought, then append a learnable
  [Reward] token whose hidden state a regression head maps to a scalar
  reward, trained with Bradley-Terry loss alongside GRPO on the reasoning.
  Filed by the drafting stage from Think, then Score: Decoupled Reasoning
  and Scoring for Video Reward Modeling (2605.05922) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Preference accuracy against
  human labels on 1,469 in-domain pairs plus GenAI and VideoGen-Bench; 0.768
  Acc w/o Tie on VideoGen-Bench vs 0.722 for the best discriminative
  baseline and 0.582 for the best generative baseline; ablation removing the
  auxiliary BT loss drops VideoGen-Bench from 0.768 to 0.648. Nobody has
  vouched for it; add support or contest it on this page.
