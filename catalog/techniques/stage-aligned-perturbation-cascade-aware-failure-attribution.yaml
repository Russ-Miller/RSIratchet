description: >-
  Perturbs tool-calling instances at one of four pipeline entry points
  (interface, intent, observation, runtime) and deterministically backtracks
  observed failures to the earliest failing stage, separating downstream
  symptoms from primary sou Filed by the drafting stage from
  ToolRobustBench: Stage-Wise Perturbation Evaluation and Failure Diagnosis
  for Tool-Calling Agents (2608.23635) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Counterfactual repair at the
  attributed stage recovered 71/98 failed instances (100% single-fault,
  82.1% cascade, 0% multi-fault); human audit on 30 ambiguous cases gave
  74.2% agreement; label-guided interventions worked as predicted (A-family
  alias fix 21/30 to 30/30; B-family S3 CoT 21/30 unchanged).. Nobody has
  vouched for it; add support or contest it on this page.
