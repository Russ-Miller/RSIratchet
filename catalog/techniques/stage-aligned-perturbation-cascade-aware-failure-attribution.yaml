ref: TEC-0209
label: "Stage-aligned perturbation with cascade-aware failure attrib"
summary: >-
  Perturbs tool interface, user intent, tool output, or runtime feedback
  separately and backtracks each observed failure to its earliest pipeline
  stage with deterministic rules rather than an LLM judge.
description: >-
  Perturbs tool interface, user intent, tool output, or runtime feedback
  separately and backtracks each observed failure to its earliest pipeline
  stage with deterministic rules rather than an LLM judge. Filed by the
  drafting stage from ToolRobustBench: Stage-Wise Perturbation Evaluation
  and Failure Diagnosis for Tool-Calling Agents (2608.23635) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Counterfactual
  repair at the attributed stage recovered 71/98 failed instances (100%
  single-fault, 82.1% cascade, 0% multi-fault); human audit on 30 ambiguous
  cases agreed 74.2%, boundary-violation agreement 93.3%; two targeted
  interventions on gpt-5.4-mini behaved as the labels predicted (S1 aliases
  21/30 to 30/30; S3 CoT 21/30 unchanged).. Nobody has vouched for it; add
  support or contest it on this page.
