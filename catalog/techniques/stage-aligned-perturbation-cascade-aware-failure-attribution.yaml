id: stage-aligned-perturbation-cascade-aware-failure-attribution
ref: TEC-0209
label: "Stage-aligned perturbation with cascade-aware failure attrib"
summary: >-
  Perturb each stage of the tool-call pipeline separately (interface,
  intent, returned evidence, runtime feedback) and backtrack each observed
  failure deterministically to the earliest stage that caused it.
description: >-
  Perturb each stage of the tool-call pipeline separately (interface,
  intent, returned evidence, runtime feedback) and backtrack each observed
  failure deterministically to the earliest stage that caused it. Filed by
  the drafting stage from ToolRobustBench: Stage-Wise Perturbation
  Evaluation and Failure Diagnosis for Tool-Calling Agents (2608.23635) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Counterfactual repair at the attributed stage resolved 71/98 failures
  (100% single-error, 82.1% cascade, 0% multi-fault); human audit of 30
  ambiguous cases agreed 74.2%; labels predicted that an S1 alias fix raised
  gpt-5.4-mini from 21/30 to 30/30 while an S3 CoT fix left it unchanged at
  21/30.. Nobody has vouched for it; add support or contest it on this page.
