id: stage-aligned-perturbation-cascade-aware-failure-attribution
ref: TEC-0210
label: "Stage-aligned perturbation with cascade-aware failure attrib"
summary: >-
  Perturbs a tool call at one pipeline entry point at a time (interface,
  intent, observation, runtime) and backtracks each observed failure
  deterministically to the earliest stage that caused it.
description: >-
  Perturbs a tool call at one pipeline entry point at a time (interface,
  intent, observation, runtime) and backtracks each observed failure
  deterministically to the earliest stage that caused it. Filed by the
  drafting stage from ToolRobustBench: Stage-Wise Perturbation Evaluation
  and Failure Diagnosis for Tool-Calling Agents (2608.23635) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Counterfactual
  repair at the attributed stage recovered 71/98 failed instances (100% for
  single-fault, 82.1% for cascades, 0% for multi-fault); human audit on 30
  ambiguous cases gave 74.2% agreement; labels predicted that an S1 alias
  fix raised gpt-5.4-mini from 21/30 to 30/30 while an S3 CoT fix changed
  nothing.. Nobody has vouched for it; add support or contest it on this
  page.
