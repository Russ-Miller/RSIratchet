description: >-
  Perturb a tool call at one of four pipeline entry points (interface,
  intent, tool output, runtime) and backtrack the observed failure label
  deterministically to the earliest responsible stage (selection, schema
  grounding, argument binding, Filed by the drafting stage from
  ToolRobustBench: Stage-Wise Perturbation Evaluation and Failure Diagnosis
  for Tool-Calling Agents (2608.23635) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Counterfactual repair at the
  attributed stage recovered 71/98 failed instances (100% single-error,
  82.1% cascade, 0% multi-fault); human audit on 30 ambiguous cases agreed
  74.2%, boundary-violation 93.3%; label-guided interventions: aliases for
  A-family raised gpt-5.4-mini from 21/30 to 30/30, while S3
  chain-of-thought for B-family left 21/30 unchanged.. Nobody has vouched
  for it; add support or contest it on this page.
