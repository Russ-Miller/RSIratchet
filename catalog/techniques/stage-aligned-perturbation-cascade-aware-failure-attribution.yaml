id: stage-aligned-perturbation-cascade-aware-failure-attribution
ref: TEC-0208
label: "Stage-aligned perturbation with cascade-aware failure attrib"
summary: >-
  Perturb a tool call at one pipeline stage at a time (interface, intent,
  observation, runtime) and backtrack each observed failure
  deterministically to the earliest stage that caused it, so downstream
  symptoms are not mistaken for the fault.
description: >-
  Perturb a tool call at one pipeline stage at a time (interface, intent,
  observation, runtime) and backtrack each observed failure
  deterministically to the earliest stage that caused it, so downstream
  symptoms are not mistaken for the fault. Filed by the drafting stage from
  ToolRobustBench: Stage-Wise Perturbation Evaluation and Failure Diagnosis
  for Tool-Calling Agents (2608.23635) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Counterfactual repair at the
  attributed stage recovered 71/98 failed instances (100% for single-fault,
  82.1% for cascades, 0% for multi-fault); human audit on 30 ambiguous cases
  gave 74.2% agreement; label-guided interventions worked as predicted
  (alias fix for interface failures 21/30 to 30/30; CoT argument prompting
  for intent failures 21/30 unchanged).. Nobody has vouched for it; add
  support or contest it on this page.
