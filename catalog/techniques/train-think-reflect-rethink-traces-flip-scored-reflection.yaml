id: train-think-reflect-rethink-traces-flip-scored-reflection
ref: TEC-0825
label: "Train on think-reflect-rethink traces with a flip-scored ref"
summary: >-
  Builds supervision where a teacher model critiques and revises a smaller
  model's initial reasoning, then fine-tunes with SFT plus GRPO whose reward
  credits reflections that turn wrong answers into right ones and penalizes
  the reverse.
description: >-
  Builds supervision where a teacher model critiques and revises a smaller
  model's initial reasoning, then fine-tunes with SFT plus GRPO whose reward
  credits reflections that turn wrong answers into right ones and penalizes
  the reverse. Filed by the drafting stage from SRVAU-R1: Enhancing Video
  Anomaly Understanding via Reflection-Aware Learning (2602.01004) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Multiple-choice QA accuracy and VAU-Eval judge scores on UCF-Crime and
  MSAD, plus temporal mIoU and R@0.3/0.5/0.7 on MSAD and ECVA, against
  frozen Qwen/InternVL baselines, VAU-R1, HolmesVAU, plain GRPO without
  reflection data, SFT-only, RL-only, and a two-step-thinking variant..
  Nobody has vouched for it; add support or contest it on this page.
