ref: TEC-0036
label: "Fuse repeated runs into a ranked review queue by vote count"
summary: >-
  Canonicalize candidates across many stochastic LLM runs, score each by the
  weighted count of runs that emitted it (uniform, or weighted by each model
  family's estimated log-likelihood ratio of validity), and rank the pool
  for human review.
description: >-
  Canonicalize candidates across many stochastic LLM runs, score each by the
  weighted count of runs that emitted it (uniform, or weighted by each model
  family's estimated log-likelihood ratio of validity), and rank the pool
  for human review. Filed by the drafting stage from Ensembling LLMs for
  AI-Augmented Cybersecurity Software Requirements Generation (2609.10316)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Measured AP and ROC AUC over the judged universe against every single run
  and configuration, a random-ranking reference, a pattern oracle, and a
  numerically optimized linear-fusion benchmark: uniform fusion exceeded the
  best configuration by 0.142 AP and 0.118 ROC AUC, Naive-Bayes weighting
  added 0.039 and 0.052 reaching 0.864 and 0.869; gains stayed positive in
  at least 92% of out-of-bag bootstrap resamples and in every
  structured-perturbation sample.. Nobody has vouched for it; add support or
  contest it on this page.
