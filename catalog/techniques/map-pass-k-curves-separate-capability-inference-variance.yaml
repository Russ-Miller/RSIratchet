summary: >-
  Evaluate an agent at a range of K in pass@K across training stages to tell
  whether failures come from the policy lacking a solution path or from
  unreliable single-shot selection.
description: >-
  Evaluate an agent at a range of K in pass@K across training stages to tell
  whether failures come from the policy lacking a solution path or from
  unreliable single-shot selection. Filed by the drafting stage from
  AgentCPM-Explore: Realizing Long-Horizon Deep Exploration for Edge-Scale
  Agents (2602.06485) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass@K curves on GAIA text-only across base, SFT, merged
  and RL checkpoints; RL shifted the pass@64 performance level down to
  pass@32 but moved pass@1 much less, which is the evidence offered for the
  variance interpretation.. Nobody has vouched for it; add support or
  contest it on this page.
