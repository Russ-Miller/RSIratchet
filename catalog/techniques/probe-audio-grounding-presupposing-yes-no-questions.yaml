id: probe-audio-grounding-presupposing-yes-no-questions
ref: TEC-0759
label: "Probe audio grounding with presupposing, not yes/no, questio"
summary: >-
  Replace explicit 'is X present' probes with questions that presuppose a
  non-existent sound and ask how/when/why about it, scoring whether the
  model rejects the false premise.
description: >-
  Replace explicit 'is X present' probes with questions that presuppose a
  non-existent sound and ask how/when/why about it, scoring whether the
  model rejects the false premise. Filed by the drafting stage from Audio
  Hallucination Attacks: Probing the Reliability of Large Audio Language
  Models (2603.29263) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Attack success rate on AHA-Eval rose from explicit to
  implicit queries for every model tested (e.g. Gemini 3 Pro random sounds
  10.88% to 59.67%; Audio Flamingo 3 1.90% to 87.05% on text attacks), with
  mean attention to audio tokens lower under implicit queries in
  Qwen2.5-Omni.. Nobody has vouched for it; add support or contest it on
  this page.
