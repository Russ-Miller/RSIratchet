description: >-
  Pose each conclusion and its negation as separate YES/NO queries, read
  normalized log-probabilities, and report the summed probability mass on
  decisive outcomes (commitment) and coverage alongside the
  negation-violation rate. Filed by the drafting stage from Coherence Under
  Commitment: Probing Generalization and Vacuous Memorization in LLM Logical
  Reasoning (2606.21083) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On FOLIO, Qwen2.5-3B had the lowest mean violation
  (0.025) but committed on only 7.4% of examples, while TinyLlama-1.1B had
  79.4% coverage and violations on 100%; coherence-only ranking placed the
  abstainer first. Rank ordering held across eight (\u03c4,\u03b4) settings,
  three elicitation formats (\u03c1=1.0), and LogiQA v2 (\u03c1=0.97). No
  independent human or downstream-utility check of the ranking.. Nobody has
  vouched for it; add support or contest it on this page.
