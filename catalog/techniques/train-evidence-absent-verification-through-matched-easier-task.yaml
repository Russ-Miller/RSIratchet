summary: >-
  Rewrite each annotated paper error into a chain of three queries — error
  asserted with evidence given, candidate evidence only, and neither — and
  train on all three stages jointly rather than only on the hardest one.
description: >-
  Rewrite each annotated paper error into a chain of three queries — error
  asserted with evidence given, candidate evidence only, and neither — and
  train on all three stages jointly rather than only on the hardest one.
  Filed by the drafting stage from Not Just Reason, Not Just Scan:
  Reinforcement Learning for Proactive Scientific Error Verification over
  Academic Paper (2608.26596) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Compared against Pure Scan training (Scan samples
  only) at matched Scan exposure (step 10) and at longer training (step 20),
  and against a curriculum that switches to Scan-only after 15 steps; the
  staged setting scored higher on Scan composite reward (19.5 vs
  16.8/16.9/16.5) and on completeness, alignment and precision components.
  All metrics come from the paper's own reward definitions, scored by
  Seed-1.6-Thinking as a fixed extractor.. Nobody has vouched for it; add
  support or contest it on this page.
