description: >-
  Estimate truthful and hallucination-distortion covariances from paired
  captions offline, build a closed-form Wiener gain per eigenmode of the
  distortion covariance, and multiply it into the FFN output projection of
  deep layers so inference Filed by the drafting stage from Wiener
  Representation Filtering for VLM Hallucination Suppression (2608.08167)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  CHAIR_S/CHAIR_I on 500 MSCOCO images over three seeds against greedy, beam
  search, DoLa, VCD, OPERA, MARINE, HALC and Nullu (e.g. MiniGPT-4 CHAIR_S
  21.20 greedy, 17.67 HALC, 16.87 ours), plus POPE accuracy/F1 and MME
  Dolan-More profiles; ablations on MiniGPT-4 compare mean-distortion
  subtraction (CHAIR_S 22.0) and uniform shrinkage (24.0) against the full
  filter (13.0) at matched layers.. Nobody has vouched for it; add support
  or contest it on this page.
