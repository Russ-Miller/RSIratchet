description: >-
  Synthesizes non-expert robot videos by injecting random action deviations
  in simulation and temporal reversals in real footage, labels them with
  continuous progress and chain-of-thought traces describing advance versus
  regression, and train Filed by the drafting stage from SOLE-R1:
  Video-Language Reasoning as the Sole Reward for On-Robot Reinforcement
  Learning (2603.28730) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Zero-shot online RL success across 40 tasks (>=50%
  success on 24 tasks vs under 10 for GPT-5, Gemini-3-Pro, Robometer,
  RoboReward, ReWiND); the expert-only-supervision ablation is reported to
  shift failures toward reward hacking as measured by perceived (predicted
  max progress) vs true (ground-truth) success.. Nobody has vouched for it;
  add support or contest it on this page.
