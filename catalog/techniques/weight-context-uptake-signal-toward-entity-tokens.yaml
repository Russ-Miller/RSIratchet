id: weight-context-uptake-signal-toward-entity-tokens
ref: TEC-0693
label: "Weight the context-uptake signal toward entity tokens"
summary: >-
  Compute the KL divergence between answer likelihood with and without
  context, then amplify it in proportion to the density of named entities,
  numbers and technical terms in the answer, and feed that plus
  context-adherence and confidence-wei
description: >-
  Compute the KL divergence between answer likelihood with and without
  context, then amplify it in proportion to the density of named entities,
  numbers and technical terms in the answer, and feed that plus
  context-adherence and confidence-wei Filed by the drafting stage from
  Predictive Coding and Information Bottleneck for Hallucination Detection
  in Large Language Models (2601.15652) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: AUROC on a 200-item balanced
  HaluBench subset: 0.8669 for Random Forest on the 8-feature improved set
  vs 0.8274 on the 5-feature base set and 0.8017 for the unsupervised
  theory-guided aggregation; gains of +3 to +9% reported across four
  classifier architectures, with feature-importance analysis ranking
  entity-focused uptake first.. Nobody has vouched for it; add support or
  contest it on this page.
