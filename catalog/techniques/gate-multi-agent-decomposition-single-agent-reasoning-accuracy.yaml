id: gate-multi-agent-decomposition-single-agent-reasoning-accuracy
ref: TEC-0619
label: "Gate multi-agent decomposition on single-agent reasoning acc"
summary: >-
  Run a three-agent analyst-strategist-generator pipeline only for backbones
  whose single-agent accuracy on the reasoning task is already well above
  floor, and skip it on tasks solvable by direct extraction.
description: >-
  Run a three-agent analyst-strategist-generator pipeline only for backbones
  whose single-agent accuracy on the reasoning task is already well above
  floor, and skip it on tasks solvable by direct extraction. Filed by the
  drafting stage from Scaling Trends for Multi-Hop Contextual Reasoning in
  Mid-Scale Language Models (2601.04254) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Success rates on 15 contextual and 15
  structured trials per model: LLaMA-3 8B rose 33.3% to 80.0% (p<0.001) and
  Mixtral 40.0% to 53.3% (p=0.014) on contextual tasks, while LLaMA-2 13B
  (6.7% to 20.0%) and DeepSeek-V2 16B showed no significant gain; on
  structured tasks Mixtral fell from 86.7% to 20.0% under multi-agent..
  Nobody has vouched for it; add support or contest it on this page.
