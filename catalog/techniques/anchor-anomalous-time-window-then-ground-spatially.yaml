description: >-
  A video reward model first scans uniformly sampled frames to predict an
  anomalous time window and anomaly type, then re-inspects a densely
  resampled crop of that window to confirm the anomaly and emit per-frame
  bounding boxes, trained with Filed by the drafting stage from CaC:
  Advancing Video Reward Models via Hierarchical Spatiotemporal
  Concentrating (2605.11723) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: On a held-out 1,000-video benchmark (500 normal/500
  anomalous), 81.7% overall accuracy versus 56.0% for the strongest of ten
  baselines (general VLMs, video reward models, AIGC detectors), +19.9
  points on an external Skyra-derived subset, and larger margins on the
  sparsest splits; ablations: single-turn retraining -8.3 points, removing
  temporal IoU reward -19%, removing each training stage -12 to -16%. Used
  as a reward with UnifiedReward for Best-of-N and Flow-GRPO on
  Wan-2.1-1.3B, expert-annotated anomaly rate fell 29.0% to 17.3%.. Nobody
  has vouched for it; add support or contest it on this page.
