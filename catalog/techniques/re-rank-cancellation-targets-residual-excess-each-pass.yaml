label: "Re-rank cancellation targets by residual excess each pass"
summary: >-
  After each forward-pass cancellation of hallucination-aligned hidden
  dimensions, re-score all dimensions by remaining activation excess above a
  grounded baseline and target the new top-N, repeating until robustness
  gain falls below toleranc
description: >-
  After each forward-pass cancellation of hallucination-aligned hidden
  dimensions, re-score all dimensions by remaining activation excess above a
  grounded baseline and target the new top-N, repeating until robustness
  gain falls below toleranc Filed by the drafting stage from H-Node Attack
  and Defense in Large Language Models (2603.26045) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Robustness rho = 1 -
  (defended/undefended attacker amplification) measured against single-pass
  fixed-node cancellation on four models: 0.082 to 0.689 (OPT), 0.078 to
  0.371 (Phi-3), 0.035 to 0.125 (LLaMA), 0.083 to 0.339 (Mistral);
  perplexity impact under 5% and MMLU within 3%. Not validated on
  generated-text hallucination rates (MC1/MC2 near chance under the bare
  prompt format).. Nobody has vouched for it; add support or contest it on
  this page.
