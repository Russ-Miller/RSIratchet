description: >-
  Before emitting the final query, the agent runs exploratory SQL to profile
  value distributions, formats and nulls, with the probes steered by
  directives deterministically keyword-matched from an inferred logical plan
  to a library of SQL pit Filed by the drafting stage from APEX-SQL: Talking
  to the data via Agentic Exploration for Text-to-SQL (2602.16720) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Execution
  accuracy and Pass@8 on Spider 2.0-Snow (53.03% EX, 68.44% Pass@8 with
  DeepSeek-R1) and BIRD-Dev (70.7%) against published baselines; ablations
  compare with/without exploration across eight backbones under oracle
  schema, and with/without the guidance directives (EX@8 drops 0.7-4.3
  points without them, with more exploration rounds needed).. Nobody has
  vouched for it; add support or contest it on this page.
