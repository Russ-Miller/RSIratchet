id: model-routing
ref: TEC-0085
label: "Route routine calls to a smaller model"
summary: >-
  Send the short, structured, routine calls in an agent pipeline to a small
  cheap model and reserve a frontier model for the steps that need deep
  planning or sustained constraint tracking.
description: >-
  Production agent systems make many model calls per user request, and most
  are short and routine: format a payload, pick a tool, extract a field,
  check a condition. Routing sends those to a small open-weight model and
  escalates only the narrow class of steps that need frontier capability.
  The technique lives or dies on the router: it has to decide, before the
  work is done, which class a step falls into, and a wrong escalation
  decision costs either money or the task. Distinct from a quorum or
  ensemble, where several models answer the same question
  (multi-model-coordination), and from a capability budget, which bounds
  what an agent may do rather than which model does it.
addresses: [tool-use, long-horizon-execution, planning]
kind: process
sources: [arxiv-2605-00334]
contexts: [autonomous-agent, coding-agent]
requires: >-
  At least two models of different cost, and a way to classify a step before
  running it. Cost savings assume the router is cheap relative to the
  frontier call it avoids.
status: active
