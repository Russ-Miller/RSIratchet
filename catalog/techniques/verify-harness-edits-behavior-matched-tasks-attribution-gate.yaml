id: verify-harness-edits-behavior-matched-tasks-attribution-gate
ref: TEC-0274
label: "Verify harness edits on behavior-matched tasks with an attri"
summary: >-
  For each proposed harness modification, select verification tasks linked
  to the supporting trajectories plus regression-risk tasks, run both old
  and new harness on them, and accept only if the trajectory evidence
  attributes the improvement
description: >-
  For each proposed harness modification, select verification tasks linked
  to the supporting trajectories plus regression-risk tasks, run both old
  and new harness on them, and accept only if the trajectory evidence
  attributes the improvement Filed by the drafting stage from Verify
  Smarter, Evolve Further: Efficient Harness Evolution through
  Behavior-Aware Verification (2608.27311) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Held-out pass@1 across 3 harnesses x
  4 benchmarks against the unmodified harness and three trajectory-based
  evolution baselines (Self-Harness, Meta-Harness, HarnessFix); best or
  tied-best in 8 of 12 pairs, average +7.6-13.6%, never below baseline
  harness. Ablations on OpenCode replace the behavior-aware batch with
  fixed, random and RHO-based batches (all fall back to the initial harness
  score) and replace the attribution gate with an aggregate-metric gate
  (gains only on Retail).. Nobody has vouched for it; add support or contest
  it on this page.
