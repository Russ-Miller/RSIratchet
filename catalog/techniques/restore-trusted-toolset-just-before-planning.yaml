id: restore-trusted-toolset-just-before-planning
ref: TEC-0111
label: "Restore the trusted toolset just before planning"
summary: >-
  Save the user's original tool list and overwrite whatever toolset the
  agent can see with it immediately before the planning step, so plans can
  only reference user-approved tools.
description: >-
  Save the user's original tool list and overwrite whatever toolset the
  agent can see with it immediately before the planning step, so plans can
  only reference user-approved tools. Filed by the drafting stage from
  Universal Defenses for Tool-Integrated LLM Agents Against Adversarial
  Attacks (2609.16098) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Attack success rate and original task success rate on the
  ASB benchmark across four open 7-9B models and GPT-3.5/GPT-4/GPT-5,
  against no defense and against ASB's paraphrasing and delimiter defenses;
  ASR fell to 0 on several models under IPI, MP and backdoor, while OTSR
  fell for GPT models under IPI/MP/backdoor.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [prompt-injection]
kind: tooling
sources: [arxiv-2609-16098]
status: proposed
