description: >-
  Generate reasoning traces for fine-tuning by reverse-engineering templated
  explanations that match extracted temporal features to candidate-model
  categories under known oracle labels, instead of querying a large model
  for the rationale. Filed by the drafting stage from REATS: LLM
  Reasoning-based Ensemble Learning for Adaptive Time Series Forecasting
  (2608.10149) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average MSE across eight benchmarks after SFT: Rule-CoT
  0.1210 vs GPT-CoT 0.1260 on the small-model candidate group (better on 6/8
  datasets) and 0.1455 vs 0.1456 on the foundation-model group; ablating CoT
  raised MSE from 0.1210 to 0.1315 in-distribution and from 0.1719 to 0.2675
  out-of-distribution.. Nobody has vouched for it; add support or contest it
  on this page.
