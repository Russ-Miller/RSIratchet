description: >-
  Train with GRPO where, alongside format and answer rewards, a frozen judge
  model scores the generated visual and acoustic reasoning steps for factual
  accuracy and completeness against extracted AU/emotion/pitch/prosody
  features, with sample Filed by the drafting stage from ThinkDeception: A
  Progressive Reinforcement Learning Framework for Interpretable Multimodal
  Deception Detection (2606.18988) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Classification accuracy and a 1-5
  reasoning quality score on four datasets: full model 73.76% average vs
  67.41% for standard GRPO (format+accuracy rewards only), 58.00% for SFT
  alone and 49.17% for the untuned backbone; removing the audio-visual
  consistency reward costs 4.5 points average accuracy and 0.5 reasoning
  score, removing the logic-alignment reward costs 2.85 points.. Nobody has
  vouched for it; add support or contest it on this page.
