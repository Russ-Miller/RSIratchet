id: retrieve-sibling-locations-embedding-similarity-then-llm-patch
ref: TEC-0516
label: "Retrieve sibling locations by embedding similarity, then LLM"
summary: >-
  From each suspicious location, prunes all test-exercised code by TF-IDF
  then embedding similarity to get sibling candidates, and has an LLM
  jointly or iteratively identify the failure-relevant siblings and emit
  consistent method-level patch
description: >-
