description: >-
  Produce an answer from parametric knowledge alone, use it as the DPO
  rejected sample against the retrieved documents to train an evidence-only
  answerer, then steer decoding of the final answer by adding the matched
  evidence segment's embedd Filed by the drafting stage from Guaranteeing
  Knowledge Integration with Joint Decoding for Retrieval-Augmented
  Generation (2604.08046) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Accuracy averaged over five lexical and semantic
  metrics on five QA datasets, plus a hallucination rate, entity precision
  and a 5-point human structure-coherence score, against Standard RAG,
  SelfRAG, RQ-RAG, SOLAR, DA-RAG, FLARE, DRAGIN and P-RAG on the same
  backbone and retriever; ablations remove DPO, length control, relevance
  control and segment fusion.. Nobody has vouched for it; add support or
  contest it on this page.
