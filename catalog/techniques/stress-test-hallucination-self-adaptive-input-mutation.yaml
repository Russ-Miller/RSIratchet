  validated it by: Compared standard, dynamic, heuristic-fuzz and RL-fuzz
  settings on the same seed items; generic hallucination rate rose under
  fuzzing for all models (e.g. Qwen2.5-VL-7B 0.298 to 0.365, GPT-5.2 0.282
