description: >-
  Train a LoRA denoiser to name the typed semantic error in a reasoning
  trace (type, location, corrupted and repaired proposition) and to
  reconstruct the adjacent lower-noise trace, then at inference repeatedly
  predict and apply an applicabil Filed by the drafting stage from Semantic
  Reasoning Denoising: Correcting Language Model Reasoning with Semantic
  Operators (2608.22090) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Average over six in-domain benchmarks 67.5 vs 64.3 for
  the strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe, with
  five seeds and Holm correction; cross-dataset transfer averages 76.4
  (Llama-3, base 67.7) and 80.2 (Qwen3, base 72.9); ablations show
  operator-only and adjacent-state-only variants losing several points on
  GSM8K, MATH, CSQA and BBH.. Nobody has vouched for it; add support or
  contest it on this page.
