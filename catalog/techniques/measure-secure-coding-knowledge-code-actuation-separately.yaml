description: >-
  Score a model on natural-language questions about secure coding
  principles, on executable functional-plus-exploit tests, and on whether
  the generated code implements a mapped sufficient defense strategy, so
  failures separate into missing kn Filed by the drafting stage from SoK: AI
  Secure Code Generation: Progress, Pitfalls, and Paths Forward (2606.25195)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Layer-1 scores correlate with CWEval secure-pass@1 across 10 base models
  (Spearman 0.71, p=0.025; BaxBench 0.63, p=0.056); actuation below
  knowledge in all 18 slices (Wilcoxon p<.001); compliance-vs-security
  crossing yields 1,100 secure-only vs 287 compliant-only cases (p<.001).
  Both LLM-assisted artifacts validated on stratified 100-item samples..
  Nobody has vouched for it; add support or contest it on this page.
