id: adapt-llm-test-time-clip-picked-caption
ref: TEC-0585
label: "Adapt the LLM at test time on a CLIP-picked caption"
summary: >-
  For each test image, sample several captions from an EMA teacher, pick the
  one with the highest sentence-averaged CLIP score as a pseudo-label, and
  take LoRA gradient steps on the student LLM, keeping the checkpoint with
  the best CLIP score
description: >-
  For each test image, sample several captions from an EMA teacher, pick the
  one with the highest sentence-averaged CLIP score as a pseudo-label, and
  take LoRA gradient steps on the student LLM, keeping the checkpoint with
  the best CLIP score Filed by the drafting stage from ClipTTT: CLIP-Guided
  Test-Time Training Helps LVLMs See Better (2603.26486) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_S/CHAIR_I
  averaged over 15 corruptions on LLaVA-1.5-7B (47.9/13.7 vs 55.6/15.4
  greedy and 52.8/15.3 for the best training-free baseline VAP), plus NoCaps
  near- and out-of-domain splits and a GPT-4o accuracy/detailedness
  judgement on clean images; ablations isolate selection-only (55.2 CHAIR_S)
  from full adaptation (45.6).. Nobody has vouched for it; add support or
  contest it on this page.
