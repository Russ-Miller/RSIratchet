id: chain-of-thought
ref: TEC-0003
label: Show intermediate steps
summary: Prompt the model to write out intermediate reasoning steps before the final answer.
description: >-
  Few-shot examples or a simple instruction that elicits step-by-step
  reasoning improve multi-step arithmetic and symbolic tasks in large
  models. Modern reasoning-tuned models do this by default, so the gain is
  largest on older or smaller models.
addresses: [arithmetic]
kind: prompting
sources: [arxiv-2201-11903]
contexts: [math, general]
status: active
