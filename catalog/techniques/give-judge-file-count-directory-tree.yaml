label: "Give the judge the file count and directory tree"
summary: >-
  Augments the reference-free evaluator prompt with the repository's total
  file count, a hierarchical structure listing, and anti-hallucination
  instructions before it scores paper-to-code fidelity.
description: >-
  Augments the reference-free evaluator prompt with the repository's total
  file count, a hierarchical structure listing, and anti-hallucination
  instructions before it scores paper-to-code fidelity. Filed by the
  drafting stage from HiRAS: A Hierarchical Multi-Agent Framework for
  Paper-to-Code Generation and Execution (2604.17745) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Pearson correlation with
  reference-based scores rose 0.423 to 0.862 (repository-level regression
  0.42 to 0.83); correlation with three expert annotators rose 0.50 to 0.72
  on 30 ICLR 2024 papers against 0.82 inter-annotator; naive empty and
  config-only baselines fall from 3.89/4.67 to 1.0/2.68. Ablation attributes
  gains separately to count, structure, and instruction changes.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [evaluation-validity]
