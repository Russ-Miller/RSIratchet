id: reward-short-reasoning-normalize-each-reward-separately
ref: TEC-0694
label: "Reward short reasoning and normalize each reward separately"
summary: >-
  In GRPO fine-tuning, add a binary reward for keeping the reasoning trace
  within a short character range alongside semantic accuracy rewards, and
  group-normalize each reward signal independently before summing into the
  advantage instead of n
description: >-
  In GRPO fine-tuning, add a binary reward for keeping the reasoning trace
  within a short character range alongside semantic accuracy rewards, and
  group-normalize each reward signal independently before summing into the
  advantage instead of n Filed by the drafting stage from Can Textual
  Reasoning Improve the Performance of MLLMs on Fine-grained Visual
  Classification? (2601.06993) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Accuracy on four FGVC benchmarks against Visual-RFT
  (LoRA and full FT), No-Thinking-RFT, SFT with and without CoT, and
  Finedefics-8B; reported average 86.5 vs 82.9 for Visual-RFT LoRA, with
  separate ablations isolating the per-reward normalization (+0.4 to +2.1
  points) and each ensemble reward component.. Nobody has vouched for it;
  add support or contest it on this page.
