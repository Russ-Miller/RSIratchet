description: >-
  Computes a per-generation score combining the NTK Gram determinant
  (representational adequacy), the log max per-step Jacobian norm (rollout
  amplification) and a negative log squared condition number (spectral
  instability), using small offli Filed by the drafting stage from
  HalluGuard: Demystifying Data-Driven and Reasoning-Driven Hallucinations
  in LLMs (2601.18753) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: AUROC/AUPRC against 11 baselines (Perplexity, LN-Entropy,
  Semantic Entropy, Energy, P(true), SelfCheckGPT, Lexical Sim, FActScore,
  RACE, Inside, MIND) on 10 benchmarks and 9 backbones; e.g. 81.76 AUROC on
  the reasoning set vs 80.8 for Inside, 84.59 vs 77.72 on RAGTruth; also
  used to guide beam search (MATH-500 81.0% vs 72.7% IO prompt).. Nobody has
  vouched for it; add support or contest it on this page.
