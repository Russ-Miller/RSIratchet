description: >-
  At each generated object token, average attention over mid-to-late layers,
  decode the top-k attended image tokens through the output head, and flag
  hallucination when no decoded token is semantically similar to the emitted
  word; then either Filed by the drafting stage from Same Attention,
  Different Truths: Put Logit-Lens over Visual Attention to Detect and
  Mitigate LVLM Object Hallucination (2608.07302) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Detection on 500 COCO images
  with CHAIR labels: F1 0.7932 vs 0.6842 (SVAR), 0.6811 (InterConf), 0.6182
  (Uncertainty Score). Mitigation: lowest CHAIR_S/CHAIR_I on four LVLMs
  (e.g. 26.8/10.0 vs PAI 29.8/13.2 on LLaVA-1.5-7B) and lowest AMBER
  CHAIR/Hal while keeping Cover at or above the greedy baseline.. Nobody has
  vouched for it; add support or contest it on this page.
