id: induce-dark-personas-fine-tuning-psychometric-items
ref: TEC-0683
label: "Induce dark personas by fine-tuning on psychometric items"
summary: >-
  Builds a tiny fine-tuning set from validated Dark Triad questionnaires
  (MACH-IV, NPI, SRP-III), pairing each item as prompt with the most extreme
  trait-consistent Likert answer, to create controlled model organisms of
  misalignment.
description: >-
  Builds a tiny fine-tuning set from validated Dark Triad questionnaires
  (MACH-IV, NPI, SRP-III), pairing each item as prompt with the most extreme
  trait-consistent Likert answer, to create controlled model organisms of
  misalignment. Filed by the drafting stage from "Dark Triad" Model
  Organisms of Misalignment: Narrow Fine-Tuning Mirrors Human Antisocial
  Behavior (2603.06816) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: MANOVA/ANOVA across fine-tuned variants vs non-fine-tuned
  baselines on the held-out SD3 (no shared items with training), ACME
  empathy subscales, congruent/incongruent moral dilemmas, and deception
  tasks; all effects p<0.001 with partial eta-squared .28-.68, and
  reversed-answer 'light' variants shifted below baseline.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [strategic-deception]
