label: "Use a general-purpose code agent for repository patching"
summary: >-
  Hand the vulnerability, PoV and commit diff to a general coding agent with
  generic shell/read/edit/plan tools instead of a purpose-built patching
  pipeline or agent team.
description: >-
  Hand the vulnerability, PoV and commit diff to a general coding agent with
  generic shell/read/edit/plan tools instead of a purpose-built patching
  pipeline or agent team. Filed by the drafting stage from A Systematic
  Study of LLM-Based Architectures for Automated Patching (2603.01257) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Patch
  success on 19 AIxCC Java delta-scan tasks, verified by independently
  re-running the full test suites (which caught three self-reported
  successes that failed tests or edited test files): Claude Code 16/19 vs
  single-agent 13/19 (Sonnet) and multi-agent 13/19 (GPT-5), 8/19 (Sonnet);
  token use was highest for Claude Code.. Nobody has vouched for it; add
  support or contest it on this page.
