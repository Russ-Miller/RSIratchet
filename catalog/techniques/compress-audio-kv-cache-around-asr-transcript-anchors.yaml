description: >-
  Slice the acoustic feature sequence by ASR timestamps, average-pool each
  transcribed span to its text length and add the aligned text embedding,
  keep untranscribed spans raw, then evict remaining tokens by attention
  scores accumulated with Filed by the drafting stage from VoxZip:
  Semantic-Anchored Temporal KV Cache Compression for Long-Context Audio
  Inference (2608.08569) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy against a Full-KV baseline and four text-domain
  KV compression baselines across Vox-Infinity, AudioMarathon, SPIRAL-Hard,
  MMAR, MMSU, MMAU, plus ablations removing semantic anchoring, removing
  untranscribed segments, text-only input, and sweeping the decay factor;
  efficiency measured at 64K context including ASR overhead.. Nobody has
  vouched for it; add support or contest it on this page.
