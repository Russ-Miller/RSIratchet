description: >-
  A perception agent parses the emergency description and flags which atomic
  functions in a pre-decoupled function library are affected; a second agent
  rewrites only those functions, which are then trial-executed and written
  back to the libra Filed by the drafting stage from MAFIG: Multi-agent
  Driven Formal Instruction Generation Framework (2604.10989) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Task success rate
  and average processing time on three self-built emergency-scheduling
  datasets. With no distillation, plugging three untuned 7-9B models into
  the architecture raised success from 17-36% to 31-69% while cutting
  average latency (e.g. Qwen2.5-Coder-7B on deck 17.45% to 48.91%, 0.39s to
  0.16s). With the distilled variant, success reached 98.49/94.97/97.50% at
  0.19-0.33s versus the best cloud baseline GLM-4.7 at 89.95/86.18/83.49%
  and 27-41s.. Nobody has vouched for it; add support or contest it on this
  page.
