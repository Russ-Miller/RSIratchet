id: reward-extracted-code-attributes-image-similarity
ref: TEC-0376
label: "Reward extracted code attributes, not image similarity"
summary: >-
  During RL on visual-to-code tasks, a lightweight auxiliary LLM parses both
  generated and reference code into discrete visual attributes and the
  policy is rewarded by soft recall of those attributes alongside execution
  and CLIP rewards.
description: >-
  During RL on visual-to-code tasks, a lightweight auxiliary LLM parses both
  generated and reference code into discrete visual attributes and the
  policy is rewarded by soft recall of those attributes alongside execution
  and CLIP rewards. Filed by the drafting stage from UniCoder: Unified
  Visual-to-Code Generation via Symbolic Rewards and Reference-Guided Code
  Optimization (2606.31732) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Ablation on four benchmarks: removing the attribute
  reward (CLIP-only) dropped Design2Code Position 0.925 to 0.875 and Color
  0.908 to 0.870, and ScreenBench Position 0.755 to 0.685, Color 0.734 to
  0.680, while CLIP scores stayed near their level.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [code-generation]
kind: training
sources: [arxiv-2606-31732]
status: proposed
