id: sample-visual-tokens-query-relevance-frames
ref: TEC-0845
label: "Sample visual tokens by query relevance, not frames"
summary: >-
  Inserts a module after the visual projector that scores every visual token
  against the pooled query embedding and keeps a differentiable top-K
  subset, reusing the dense-sampling positional encodings for the survivors.
description: >-
  Inserts a module after the visual projector that scores every visual token
  against the pooled query embedding and keeps a differentiable top-K
  subset, reusing the dense-sampling positional encodings for the survivors.
  Filed by the drafting stage from GroundVTS: Visual Token Sampling in
  Multimodal Large Language Models for Video Temporal Grounding (2604.02093)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Matched-budget ablation (FPS 2.0, rho 0.5) against frame-level pooling,
  uniform and random sampling: Charades-STA mIoU 50.1 vs 41.6 frame-level,
  29.3 uniform, 35.7 random; ActivityNet mIoU 36.0 vs 30.7/23.4/27.7.
  Removing positional encodings collapses mIoU to 9.5.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [video-temporal-reasoning]
