id: interleave-textual-timestamp-tokens-audio-tokens
ref: TEC-0717
label: "Interleave textual timestamp tokens with audio tokens"
summary: >-
  Before each one-second block of encoded audio tokens, insert a literal
  text token stating the elapsed time, so the LLM reads timestamps out of
  the sequence rather than decoding positional encodings.
description: >-
  Before each one-second block of encoded audio tokens, insert a literal
  text token stating the elapsed time, so the LLM reads timestamps out of
  the sequence rather than decoding positional encodings. Filed by the
  drafting stage from SpotSound: Enhancing Large Audio-Language Models with
  Fine-Grained Temporal Grounding (2604.13023) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Ablation on four grounding
  benchmarks (mIoU): for Qwen2-Audio, plain fine-tuning gave
  59.2/50.7/23.8/62.5, removing the 30s encoder limit added ~9-10 points
  (68.5/59.7/34.4/63.1), and adding interleaved timestamps added a further
  16.9/12.7/15.5/4.7 points (85.4/72.4/49.9/67.8); a similar gain held for
  Audio Flamingo 3.. Nobody has vouched for it; add support or contest it on
  this page.
