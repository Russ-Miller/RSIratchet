description: >-
  A hierarchical multi-agent pipeline where one agent summarizes a BDD
  step's intent from its scenario context, two sub-agents separately
  retrieve similar existing glue code and relevant project code, and a
  developer agent writes the glue cod Filed by the drafting stage from
  Bridging Behavior and Implementation: Automated Java Glue Code Generation
  for Behavior-Driven Development (2607.19703) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: API precision/recall/F1 against
  ground-truth glue code (0.660 F1 vs 0.416 few-shot, 0.284 plain
  prompting), CodeBLEU/METEOR/ROUGE-L (0.641/0.655/0.614 vs
  0.446/0.433/0.396), and a reference-aware LLM judge finding 46.1% directly
  usable; ablations removing each stage.. Nobody has vouched for it; add
  support or contest it on this page.
