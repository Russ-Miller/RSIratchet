id: debate-two-most-probable-labels-then-judge
ref: TEC-0633
label: "Debate the two most probable labels, then judge"
summary: >-
  A manager model scores the label distribution, the top two labels are
  randomly assigned to two debater agents who argue for them over two
  rounds, and a stronger judge model reads the transcript and picks the
  label.
description: >-
  A manager model scores the label distribution, the top two labels are
  randomly assigned to two debater agents who argue for them over two
  rounds, and a stronger judge model reads the transcript and picks the
  label. Filed by the drafting stage from Multi-Agent Dialectical Refinement
  for Enhanced Argument Classification (2603.27451) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Macro F1, weighted F1 and
  per-class F1 on the 1,266-component UKP test split against vanilla
  prompting, chain-of-thought, and a single stronger reasoning model given
  the judge's own prompt; MAD-ACC 85.7 vs 84.9 for the single reasoning
  agent, 79.2 CoT, 78.5 vanilla, and 89.5 for a fine-tuned supervised
  reference.. Nobody has vouched for it; add support or contest it on this
  page.
