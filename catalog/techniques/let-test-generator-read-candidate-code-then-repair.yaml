label: "Let the test generator read the candidate code, then repair "
summary: >-
  Trains one shared model in four stages — execution-reasoning SFT, RL for a
  Fixer that repairs a candidate from a failing test without breaking
  passing tests, RL for an Auditor that reads the repaired candidate and
  writes a bug-revealing tes
description: >-
  Trains one shared model in four stages — execution-reasoning SFT, RL for a
  Fixer that repairs a candidate from a failing test without breaking
  passing tests, RL for an Auditor that reads the repaired candidate and
  writes a bug-revealing tes Filed by the drafting stage from An Iterative
  Test-and-Repair Framework for Competitive Code Generation (2604.05560)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Pass@1 and average pass ratio on APPS, CodeContests, xCodeEval,
  LiveCodeBench v6 against CURE and Specine on the same 7B backbone at
  matched 20-call budget (average Pass@1 34.66% vs 23.13% CURE, 24.34%
  Specine) plus six ablations; blind-Auditor variant (no candidate code)
  drops average Pass@1 to 30.04%, Stage-B-only to 26.26%.. Nobody has
  vouched for it; add support or contest it on this page.
