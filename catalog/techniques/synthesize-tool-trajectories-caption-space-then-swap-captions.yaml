id: synthesize-tool-trajectories-caption-space-then-swap-captions
ref: TEC-0756
label: "Synthesize tool trajectories in caption space, then swap cap"
summary: >-
  A text-only agentic LLM generates multi-step temporal-retrieval and zoom
  trajectories over video captions, and the caption outputs are replaced
  with real frame tokens to produce video-interleaved training data for the
  VideoLLM.
description: >-
  A text-only agentic LLM generates multi-step temporal-retrieval and zoom
  trajectories over video captions, and the caption outputs are replaced
  with real frame tokens to produce video-interleaved training data for the
  VideoLLM. Filed by the drafting stage from VideoThinker: Building Agentic
  VideoLLMs with LLM-Guided Tool Reasoning (2601.15724) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy on MLVU
  (48.0 to 54.8), LVBench (38.3 to 48.9), VideoMME-long (50.0 to 53.7) and
  LongVideoBench (56.7 to 59.7) against the untrained Qwen2.5-VL-7B
  backbone, and +3.0-3.9 over a Qwen-235B caption-only language agent given
  the same tools; duration-split ablation shows parity under 2 minutes and
  +3.7/+5.6 points over 15 minutes.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [video-temporal-reasoning]
kind: training
sources: [arxiv-2601-15724]
