id: distilled-experience-memory
ref: TEC-0236
label: "Distill lessons from past attempts into memory"
summary: >-
  After each task, have the agent judge whether it succeeded, distill a
  short reusable strategy or warning from the attempt, store it, and
  retrieve only the relevant ones at the start of later tasks.
description: >-
  The agent keeps a growing bank of lessons rather than a log: each item is
  a generalisable strategy from a success or a preventative lesson from a
  failure, written in its own words and indexed for retrieval. At test time
  it retrieves the few items that match the new task, acts, judges the
  outcome, and writes back. It is Hashimoto's ratchet run inside the agent
  with no person in the loop, and it differs from a guide file in two ways
  that matter: lessons come from the agent's own judged outcomes, and only
  the relevant ones are read, rather than the whole file on every task. The
  judgment step is the weak point, since the agent grades its own work.
addresses: [harness-self-improvement]
kind: process
sources: [arxiv-2509-25140]
repos:
  - url: https://github.com/google-research/reasoning-bank
    note: Reference implementation of ReasoningBank, Apache-2.0.
    verified_on: "2026-10-19"
contexts: [autonomous-agent, coding-agent]
requires: >-
  A task stream long enough to accumulate lessons, a store with retrieval,
  and a success judge, ideally with access to ground truth.
status: active
