description: >-
  Train layer-wise linear probes to find the best hallucination-separating
  layer, take the top-50 signed-weight neurons, and during generation
  attenuate their activation excess above an 80th-percentile grounded
  baseline, scaled by the probe's Filed by the drafting stage from Adaptive
  Activation Cancellation for Hallucination Mitigation in Large Language
  Models (2603.10195) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Held-out TruthfulQA classification accuracy against the
  unmodified model and five post-hoc cancellation variants (+0.020 OPT-125M,
  +0.007 Phi-3-mini and LLaMA 3-8B); generation metrics at 8B (MC1 +0.04,
  MC2 +0.003, Token-F1 +0.003, n=100); WikiText-103 perplexity and a
  100-question MMLU subset reported unchanged; compared with ITI on probe
  selectivity and DoLA on MC1, where DoLA gains more MC1 (+0.08).. Nobody
  has vouched for it; add support or contest it on this page.
