description: >-
  For each failed run, inject a ground-truth-derived hint into one agent at
  a time in reverse execution order until the failure resolves, then
  contrast that agent's original and hint-corrected outputs to write its
  prompt update, clustering si Filed by the drafting stage from AgentGrad:
  Intervention-guided Prompt Optimization for Multi Agent Systems
  (2609.08572) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Against MIPROv2, TextGrad, GEPA and a no-optimization
  baseline on five MAS benchmarks, three seeds: average gain over
  no-optimization +11.76 with GPT-5-mini (vs +9.24 for GEPA) and +9.67 with
  Qwen3-8B; wall-clock optimization time 2.5x lower than the next-fastest
  baseline; ablation adds target identification (+1.44 HotpotQA, +3.84
  PUPA), agent-level supervision, and gradient clustering separately;
  optimized prompts also transferred best on five unseen in-domain
  benchmarks.. Nobody has vouched for it; add support or contest it on this
  page.
