id: position-swap-judging
ref: TEC-0015
label: Judge both orders and reconcile
summary: Run the judge with candidates in both orders and count a preference only when it holds in both.
description: >-
  For pairwise judging, call the judge twice with the candidates swapped.
  If the verdicts disagree, record a tie. Add a length-normalized rubric
  and never use a judge from the same model family as a candidate when it
  can be avoided.
addresses: [judge-position-bias]
kind: process
sources: [arxiv-2306-05685, arxiv-2305-17926]
