description: >-
  Decomposes the empathy reward into separate rubric-scored judgements of
  the model's internal analysis (resonation), its reply (expression) and a
  simulated user's reception, combined by harmonic mean, minus a bystander
  penalty for incoherent Filed by the drafting stage from PERM:
  Psychology-grounded Empathetic Reward Modeling for Large Language Models
  (2601.10532) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: EQ-Bench3 overall score 60.1 (base) to 66.6, above RLVER
  61.8, Partner 59.7, Skywork-Reward-V2 62.3, best-of-8 61.6 and both SFT
  variants; a 415-item industrial daily-conversation benchmark; and a
  68-participant blinded preference study where PERM beat the base model
  62.5-68.8% and the reward-model baseline 50.0-72.2%. Ablations: removing
  the resonation term costs the most (66.6 to 62.3); removing the bystander
  penalty raises warmth (12.7 to 13.1) but lowers pragmatic EI (13.4 to
  12.5).. Nobody has vouched for it; add support or contest it on this page.
