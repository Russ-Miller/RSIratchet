id: learn-reasoning-short-proxy-context-then-re-ground
ref: TEC-0717
label: "Learn the reasoning on a short proxy context, then re-ground"
summary: >-
  Collect chain-of-thought traces by RL-with-verifiable-rewards (or teacher
  sampling) on a short proxy context containing sufficient evidence, then
  supervised-fine-tune the same model to emit those traces when given the
  full long input.
description: >-
  Collect chain-of-thought traces by RL-with-verifiable-rewards (or teacher
  sampling) on a short proxy context containing sufficient evidence, then
  supervised-fine-tune the same model to emit those traces when given the
  full long input. Filed by the drafting stage from Long-Context Reasoning
  Through Proxy-Based Chain-of-Thought Tuning (2605.20201) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Exact match on
  SciTrek and GPT5-mini-judged accuracy on HotpotQA against zero-shot, SFT
  on full contexts, RLVR on full contexts, and SFT on teacher traces
  generated over full contexts; e.g. Qwen3-4B-Instruct SciTrek full-context
  EM 30.8 zero-shot, 32.9 RLVR-on-full, 31.6 SFT-on-teacher-full-traces,
  46.5 ProxyCoT-RL, with CoT tokens falling from 1,744 to 617; also
  out-of-domain transfer to Loong.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [long-context-degradation]
kind: training
sources: [arxiv-2605-20201]
status: proposed
