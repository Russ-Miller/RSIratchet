description: >-
  Alternates fast edits to an explicit textual state (validation-gated) with
  distillation into the policy, keeping only trajectories that the updated
  state makes newly or persistently better than state-free execution,
  weighted by per-token di Filed by the drafting stage from Experience
  Funnel: A State-Policy Alternating Loop for Self-Evolving Agents
  (2609.08919) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: SearchQA/ALFWorld/WebShop accuracy against state-only
  evolution (SkillOpt 53.9 avg), policy internalization (OPID 55.4), and
  co-evolution (SkillRL 56.2) versus 57.6 avg; ablation: selective 01+11
  consolidation 63.0% vs 58.9% unfiltered; state-free accuracy rose 58.1 to
  61.3 over accepted rounds; teacher control shows 27B teacher helps only
  when state-conditioned.. Nobody has vouched for it; add support or contest
  it on this page.
