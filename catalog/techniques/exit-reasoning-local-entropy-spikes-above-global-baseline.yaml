description: >-
  Tracks a ratio of windowed average token entropy to cumulative average
  token entropy during generation and inserts the end-of-thinking marker at
  a semantic boundary once the ratio crosses a threshold, with no proxy
  model or tentative-answer Filed by the drafting stage from Mitigating
  Overthinking in Large Reasoning Language Models via Reasoning Path
  Deviation Monitoring (2603.14251) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy and generated token length
  on GSM8K/AMC23/MATH500, AIME24-25/OlympiadBench, GPQA-Diamond against
  vanilla CoT, NoThinking, ThinkLess, Dynasor-CoT and DEER; average accuracy
  gain over vanilla CoT reported as 3.9% overall and 5.1% on distilled
  models; ablations removing the global baseline, the window, and the
  boundary trigger each lose accuracy.. Nobody has vouched for it; add
  support or contest it on this page.
