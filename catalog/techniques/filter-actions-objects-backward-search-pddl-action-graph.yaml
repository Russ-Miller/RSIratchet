description: >-
  Build an offline graph whose nodes are PDDL action schemas and whose edges
  link effects to preconditions, have the LLM propose a few candidate
  terminal actions for the instruction, then backward depth-first search to
  the minimal predecessor Filed by the drafting stage from Scale-Plan:
  Scalable Language-Enabled Task Planning for Heterogeneous Multi-Robot
  Teams (2603.08814) with status proposed: the paper introduces or tests it,
  and the claim drafted from the paper is its first evidence. The paper
  validated it by: Task completion rate, goal condition recall and
  executability on 49 MAT2-THOR tasks against LLM-as-planner, LLM+P, and two
  LaMMA-P variants (overall TCR 78% vs 53% for the strongest baseline), plus
  an ablation against no filtering (66%) and shallow LLM filtering (67%);
  complex-task TCR 59% vs 41-44%.. Nobody has vouched for it; add support or
  contest it on this page.
