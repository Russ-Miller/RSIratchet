  Sound: Reinforcement Learning with a Frozen Acoustic Judge to Curb ASR
  Insertion Hallucinations (2609.14455) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against a schedule-matched WER-only
  GRPO baseline on 33,282 utterance-condition instances: insertions fell
  28.3% on AMI-IHM and 22.3% on AMI-SDM (meeting-level clustered bootstrap
  CIs excluding zero), WER 35.89 to 34.71 on AMI-SDM (significant) and
  unchanged on the other five tiers; replicated over three seeds and
  leave-one-meeting-out; 32-best CTC rescoring of the baseline instead
  raised insertions.. Nobody has vouched for it; add support or contest it
