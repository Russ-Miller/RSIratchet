id: stop-reflection-loop-confirmed-sentinel-confidence-number
ref: TEC-0213
label: "Stop a reflection loop on a CONFIRMED sentinel, not a confid"
summary: >-
  Run generate-critique-revise until the critique emits a CONFIRMED token or
  a depth cap, instead of halting on the model's self-reported numeric
  confidence.
description: >-
  Run generate-critique-revise until the critique emits a CONFIRMED token or
  a depth cap, instead of halting on the model's self-reported numeric
  confidence. Filed by the drafting stage from Training-Free Inference-Time
  Self-Reflection and Cost-Bounded Early Stopping for Large Language Models
  (2608.18884) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: On BBH the sentinel stopped 82-88% of items at ~2.1
  generations with accuracy inside the 95% Wilson interval of single-shot,
  versus fixed-depth Self-Refine at 3 generations and 71.2% (single-shot
  73.8%); every confidence threshold >=0.6 halted on the first generation,
  so the numeric tag gave no selective stop.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
