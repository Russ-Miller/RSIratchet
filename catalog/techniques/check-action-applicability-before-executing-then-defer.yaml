description: >-
  Before each high-level action involving a dynamically-affordanced object,
  a vision-language module infers whether the object's latent precondition
  holds and, if not, suspends the action and picks a resolving action (wait,
  clean) instead of Filed by the drafting stage from ADAPT: Benchmarking
  Commonsense Planning under Unspecified Affordance Constraints (2604.14902)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Success rate and goal-condition rate plus path-length-weighted variants on
  DynAfford test seen/unseen against unmodified FILM, CAPEAM, MOCA,
  LLM-Planner and SayCan; FILM unseen SR 9.34 to 16.18, CAPEAM 19.39 to
  21.10; ablations removing LoRA fine-tuning (27.69 to 16.07 SR) and
  multimodal in-context exemplars (to 6.15).. Nobody has vouched for it; add
  support or contest it on this page.
