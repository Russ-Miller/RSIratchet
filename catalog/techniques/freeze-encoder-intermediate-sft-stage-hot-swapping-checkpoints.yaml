id: freeze-encoder-intermediate-sft-stage-hot-swapping-checkpoints
ref: TEC-0678
label: "Freeze the encoder in an intermediate SFT stage, hot-swappin"
summary: >-
  Between adaptor alignment and full joint fine-tuning, run an SFT stage
  with the encoder frozen and the adaptor plus LLM trained, periodically
  swapping in a newer encoder checkpoint from ongoing pretraining whenever
  representation similarity
description: >-
  Between adaptor alignment and full joint fine-tuning, run an SFT stage
  with the encoder frozen and the adaptor plus LLM trained, periodically
  swapping in a newer encoder checkpoint from ongoing pretraining whenever
  representation similarity Filed by the drafting stage from Rethinking
  Entropy Allocation in LLM-based ASR: Understanding the Dynamics between
  Speech Encoders and LLMs (2604.08003) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Ablating the stage raised
  hallucination rates (e.g. Mandarin 0.003% to 0.005%, dialect 0.122% to
  0.198%, code-switch 0.261% to 0.356%) and worsened CER/WER on all four
  scenario groups; encoder probes showed phonetic accessible information
  recovering during joint training with the stage and converging lower
  without it. Single system, no independent replication.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [hallucination]
kind: training
sources: [arxiv-2604-08003]
status: proposed
