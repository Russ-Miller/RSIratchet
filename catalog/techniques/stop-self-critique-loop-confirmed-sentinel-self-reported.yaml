id: stop-self-critique-loop-confirmed-sentinel-self-reported
ref: TEC-0212
label: "Stop a self-critique loop on a CONFIRMED sentinel, not self-"
summary: >-
  Run generate-critique-revise to a bounded depth but exit as soon as the
  critique returns a fixed CONFIRMED token, rather than when a numeric
  self-reported confidence crosses a threshold.
description: >-
  Run generate-critique-revise to a bounded depth but exit as soon as the
  critique returns a fixed CONFIRMED token, rather than when a numeric
  self-reported confidence crosses a threshold. Filed by the drafting stage
  from Training-Free Inference-Time Self-Reflection and Cost-Bounded Early
  Stopping for Large Language Models (2608.18884) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On BBH the sentinel stopped
  82-88% of items at ~2.1 generations with accuracy unchanged versus
  single-shot and versus fixed-depth Self-Refine (which fell to 71.2% at 3
  generations); a sweep of confidence thresholds 0.6-0.9 halted every item
  at the first generation, so the numeric tag provided no selective stopping
  point.. Nobody has vouched for it; add support or contest it on this page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
