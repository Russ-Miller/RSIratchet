  Enhancing LLM-Based Automated Program Repair via Self-Directed Debugging
  (2604.19305) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Correct fixes on Defects4J: 224 with GPT-3.5 (vs 201 for
  the best feedback-based baseline TSAPR, 213 for ReinFix) and 295 with
  DeepSeek-V3 (59 more than the second-best), at a patch budget of 32; 40/40
