description: >-
  Separate a social-interaction benchmark's measurement into subject-side
  signal coherence (trajectory, gaze, expression alignment) and
  participant-side signal sensitivity, so a failure can be attributed to
  production or to decoding rather th Filed by the drafting stage from
  Belief Without Behavior: Measuring the Translation of Theory of Mind into
  Coordinated Social Action in Vision-Language Models (2608.20975) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Applied
  across 13 models; outcome-level conformance scores that looked similar
  decomposed into distinct profiles (high positional bias vs. low signal
  production vs. coherent signals with near-zero uptake), and a
  structured-ToM reference architecture was the only system to clear both
  levels. Not validated against human judgement.. Nobody has vouched for it;
  add support or contest it on this page.
