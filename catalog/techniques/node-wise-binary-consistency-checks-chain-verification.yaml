id: node-wise-binary-consistency-checks-chain-verification
ref: TEC-0073
label: "Node-wise binary consistency checks for chain verification"
summary: >-
  Split a reasoning chain into dependent nodes, check each node's
  consistency with its inputs by a yes/no query, and report the first
  failing node, instead of asking a verifier to read and judge the entire
  chain.
