id: penalize-tokens-low-vision-ablation-log-prob-gap
ref: TEC-0114
label: "Penalize tokens with a low vision-ablation log-prob gap"
summary: >-
  Run a second decoding pass with the visual features zeroed, score each
  candidate token by the log-probability difference between the two paths,
  and subtract a decaying penalty from candidates whose score falls below a
  threshold.
description: >-
  Run a second decoding pass with the visual features zeroed, score each
  candidate token by the log-probability difference between the two paths,
  and subtract a decaying penalty from candidates whose score falls below a
  threshold. Filed by the drafting stage from What Do Hallucinations Reveal
  About Multimodal Reasoning? Diagnosing Visual Grounding Failures via
  Contrastive Decoding Probes (2609.16646) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared against Sample, Beam, OPERA,
  VCD, AGLA, SID and ICD on five benchmarks with LLaVA-1.5, InstructBLIP,
  Shikra. Large gain only on MMHalBench (3.55 overall vs 1.69 for OPERA,
  hallucination ratio 0.44 vs 0.74-0.83, single GPT judge over 96 samples);
  roughly tied or worse on HallusionBench, CHAIR sentence level, and MMMU.
  Outputs are shorter (95.3 vs 101.8 tokens), and length-normalized CHAIRs
  margins are small and reverse on Shikra.. Nobody has vouched for it; add
  support or contest it on this page.
