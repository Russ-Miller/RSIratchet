id: mix-model-s-own-self-generated-dialogues-before
ref: TEC-0733
label: "Mix in the model's own self-generated dialogues before fine-"
summary: >-
  Before SFT, sample question-answer pairs from the frozen base model itself
  (Magpie or bait-prompt style) and concatenate them 1:1 with the task data,
  leaving the optimizer and schedule unchanged.
description: >-
  Before SFT, sample question-answer pairs from the frozen base model itself
  (Magpie or bait-prompt style) and concatenate them 1:1 with the task data,
  leaving the optimizer and schedule unchanged. Filed by the drafting stage
  from Talking to Yourself: Defying Forgetting in Large Language Models
  (2602.20162) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: In-domain averaged ROUGE-L plus five general benchmarks
  (GSM8K, MMLU, IFEval, MedText, AGIEval_G, 5-shot) across 50
  model-by-benchmark-by-regime cells; beat Base in 50/50 for retention and
  was best in 40/50, against Task-only, layer-freezing, Task+Alpaca and
  Task+UltraChat baselines; a GPT-4o filter removing math/logic/code
  dialogues left GSM8K recovery nearly unchanged (74.2 to 73.7 on
  LLaMA3-8B).. Nobody has vouched for it; add support or contest it on this
  page.
