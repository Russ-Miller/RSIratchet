id: attenuate-ffn-output-critical-mid-late-layers-during
ref: TEC-0244
label: "Attenuate FFN output at critical mid-late layers during deco"
summary: >-
  Multiply the FFN output by (1-alpha) at a small set of mid-to-late decoder
  layers at inference, leaving attention untouched, to suppress language
  priors while keeping aggregated visual evidence.
description: >-
  Multiply the FFN output by (1-alpha) at a small set of mid-to-late decoder
  layers at inference, leaving attention untouched, to suppress language
  priors while keeping aggregated visual evidence. Filed by the drafting
  stage from FADE: Mitigating Hallucinations by Reducing Language-Prior
  Dominance in Large Vision-Language Models (2606.29431) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: POPE accuracy/F1,
  CHAIR_S/CHAIR_I with recall, MME perception, MMHal-Bench GPT-4 score
  across three 7B LVLMs versus greedy, PAI, VCD, DAMO, VISTA; latency and
  memory compared to the same baselines; alpha and layer sweeps on POPE..
  Nobody has vouched for it; add support or contest it on this page.
