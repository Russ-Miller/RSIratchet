id: put-code-walks-knowledge-graph-into-cot-prompt
ref: TEC-0780
label: "Put code that walks the knowledge graph into the CoT prompt"
summary: >-
  Decompose the prompt into sub-tasks, have a code module systematically
  explore a knowledge graph, and include that code as an external-knowledge
  component of the chain-of-thought prompt constraining intermediate steps.
description: >-
  Decompose the prompt into sub-tasks, have a code module systematically
  explore a knowledge graph, and include that code as an external-knowledge
  component of the chain-of-thought prompt constraining intermediate steps.
  Filed by the drafting stage from Mitigating Prompt-Induced Hallucinations
  in Large Language Models via Structured Reasoning (2601.02739) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: HIT@1/3/5 on five
  public datasets against the same knowledge-distillation chain model
  without the code module, plus comparisons to KG-LLM-PR, LLM-SubKG-Sum, RAG
  and Self-Check; no hallucination-specific metric, no human verification,
  no statistical testing.. Nobody has vouched for it; add support or contest
  it on this page.
addresses: [hallucination]
