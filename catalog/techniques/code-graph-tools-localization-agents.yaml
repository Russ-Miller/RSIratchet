description: >-
  Parse the repository once into a heterogeneous graph of code entities and
  their dependency edges, expose search, traverse and retrieve-entity tools
  over it, and let the agent hop across the graph from the issue's mentioned
  names to the func Filed by the drafting stage from LocAgent: Graph-Guided
  LLM Agents for Code Localization (2503.09089) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: File, module and function Acc@k
  on SWE-bench Lite and Loc-Bench against IR retrievers, procedural
  (Agentless) and agentic (MoatlessTools, OpenHands) baselines, with
  per-example cost; downstream Pass@1/Pass@10 with Agentless repair given
  each method's localization.. Nobody has vouched for it; add support or
  contest it on this page.
