description: >-
  Craft a poisoning input in which the trigger and malicious payload form
  one logically interdependent statement, with the trigger token sequence
  optimized to look like a named entity and to cluster tightly in embedding
  space while staying se Filed by the drafting stage from MemPoison:
  Bypassing Selective Memory Mechanisms to Plant Backdoors in LLM Agents
  (2605.29960) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Injection, retrieval and attack success rates plus benign
  accuracy on three agents (LongMemEval, MIRIAD, FinQA) across RAG and three
  memory pipelines, against Info-only, Naive Concat, AgentPoison and MINJA
  baselines; ablations remove each component (dropping the semantic bridge
  takes ASR to 0); also tested under perplexity filtering, paraphrasing,
  seven backbones, eight retrievers and 10-40 rounds of memory lifecycle
  evolution.. Nobody has vouched for it; add support or contest it on this
  page.
