id: pool-scores-user-s-own-samples-similar-users
ref: TEC-0743
label: "Pool scores from the user's own samples and from similar use"
summary: >-
  At inference, sample several scoring rubrics for the current user and
  additionally score the candidates under the inferred preferences of the n
  nearest users in the same learned prototype cluster, then average all
  scores.
description: >-
  At inference, sample several scoring rubrics for the current user and
  additionally score the candidates under the inferred preferences of the n
  nearest users in the same learned prototype cluster, then average all
  scores. Filed by the drafting stage from P-GenRM: Personalized Generative
  Reward Model with Test-time User-based Scaling (2602.12116) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy on
  Chatbot Arena-Personalized and PRISM-Personalized over 5 runs: base
  72.68/65.32, Ind-16+Pro-8 75.92/68.06, Ind-32 75.59/67.65, Ind-0+Pro-8
  66.90/57.65, Ind-16+Pro-16 72.59/64.61; prototype count swept 0-125 with a
  peak at 50.. Nobody has vouched for it; add support or contest it on this
  page.
