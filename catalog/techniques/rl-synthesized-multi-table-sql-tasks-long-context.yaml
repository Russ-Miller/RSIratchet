description: >-
  Aggregates 10,000+ real tables into SQLite environments, has an LLM
  generate retrieval, aggregation and JOIN queries with natural-language
  phrasings, executes them for ground-truth answers, keeps only items with
  intermediate pass rates, and Filed by the drafting stage from Probing How
  Scalable Table Data Enhances General Long-Context Reasoning (2603.21719)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Average accuracy across seven long-context benchmarks (LongBench-v2,
  Loong, BrowseCompLong, GSM-Infinite, Oolong, RULER, MRCR) against the
  untrained backbone: +8.24 for DS-R1-Distill-32B, +8.93 for 14B, +4.94 and
  +4.79 for the Qwen backbones; NIAH retrieval 87.95 to 99.40 (32B) and
  69.30 to 91.20 (14B); OOD gains on GPQA, AIME 2025, MultiChallenge,
  LiveCodeBench.. Nobody has vouched for it; add support or contest it on
  this page.
