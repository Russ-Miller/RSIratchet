id: let-agent-explore-hierarchical-skill-tree-demand
ref: TEC-0493
label: "Let the agent explore a hierarchical skill tree on demand"
summary: >-
  Encapsulates a large tool library into a three-layer tree (skill
  summaries, per-branch tool briefs, full tool docs) and makes expanding a
  layer an action in the agent's own decision space, so only the currently
  relevant tool text enters con
description: >-
  Encapsulates a large tool library into a three-layer tree (skill
  summaries, per-branch tool briefs, full tool docs) and makes expanding a
  layer an action in the agent's own decision space, so only the currently
  relevant tool text enters con Filed by the drafting stage from RS-Claw:
  Progressive Active Tool Exploration via Hierarchical Skill Trees for
  Remote Sensing Agents (2605.13391) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy, Tool-Any-Order and
  Tool-In-Order on 234 Earth-Bench questions in autonomous-planning and
  instruction-following modes versus flat full registration and a 19-tool
  RAG retrieval baseline, plus tokens per question and per turn; ablations
  removing the skill summary layer and randomizing skill groupings.. Nobody
  has vouched for it; add support or contest it on this page.
