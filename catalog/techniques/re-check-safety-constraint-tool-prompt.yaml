id: re-check-safety-constraint-tool-prompt
ref: TEC-0129
label: "Re-check the safety constraint in a tool, not the prompt"
summary: >-
  Ground objects as bounding boxes, have the agent propose a waypoint route,
  reject and replan any route that intersects the obstacle box (before and
  during motion), and pick the contact side by an adjacency test with the
  obstacle.
description: >-
  Ground objects as bounding boxes, have the agent propose a waypoint route,
  reject and replan any route that intersects the obstacle box (before and
  during motion), and pick the contact side by an adjacency test with the
  obstacle. Filed by the drafting stage from Coding Agents with an
  Obstacle-Aware Harness for Safe Robot Manipulation (2609.20822) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: On
  SafeLIBERO with 10 seeds per task across 32 tasks: 71.9% task success and
  87.5% collision avoidance with GPT-6, versus 31.0/59.0 for the same agent
  with skills but no harnesses, and 67.5/68.9 for AEGIS (barrier-function
  filter over the frozen policy); ablation holds prompt, skill memory and
  VLA fixed.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [embodied-control]
kind: tooling
