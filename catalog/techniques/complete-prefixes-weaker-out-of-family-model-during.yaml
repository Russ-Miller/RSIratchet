description: >-
  For a fraction of RLVR rollouts, prepend a truncated partial reasoning
  trajectory generated by a smaller, different-family model (cut at the
  largest step-to-step entropy drop) and train the target model to complete
  it. Filed by the drafting stage from Boosting LLM Exploration via
  Weak-Model Guidance in RLVR (2608.27420) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Average pass@1 to pass@128 over AIME
  2024/2025, AMC 2023, MATH 500, Minerva, OlympiadBench against vanilla GRPO
  and the untrained base model; ablations on injection probability, random
  vs entropy truncation, and same-family prefix generators; LLM-graded
  prefix quality distribution.. Nobody has vouched for it; add support or
  contest it on this page.
