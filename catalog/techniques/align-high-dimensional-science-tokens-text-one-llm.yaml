description: >-
  Domain-specific encoders turn high-dimensional gridded scientific data
  into structured tokens co-attended with text in a shared LLM, with domain
  decoders producing numerical fields, so forecasting, bias correction and
  downscaling are all dr Filed by the drafting stage from A unified
  multimodal understanding and generation model for cross-disciplinary
  scientific research (2601.01363) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Latitude-weighted RMSE and ACC for
  Z500, T2M, WS10M over a one-year test period against ECMWF HRES; TC track
  MAE and WS10M RMSE on 20 2024 typhoons against IBTrACS; downscaling
  RMSE/PSNR against bilinear interpolation; biomedical VQA accuracy on
  VQA-RAD, SLAKE, PathVQA.. Nobody has vouched for it; add support or
  contest it on this page.
