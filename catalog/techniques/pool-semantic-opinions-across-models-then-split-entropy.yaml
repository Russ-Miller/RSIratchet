summary: >-
  Cluster sampled free-form responses from several VLMs into
  semantic-equivalence classes, average each model's class distribution
  uniformly, and report the pooled entropy as collective uncertainty plus
  Jensen-Shannon divergence as model conf
description: >-
  Cluster sampled free-form responses from several VLMs into
  semantic-equivalence classes, average each model's class distribution
  uniformly, and report the pooled entropy as collective uncertainty plus
  Jensen-Shannon divergence as model conf Filed by the drafting stage from
  CUSP: Decomposable Collective Uncertainty for Multi-Agent Multimodal
  Reasoning (2609.05708) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: AUROC for prediction-error detection and AUARC for
  abstention against majority voting, naive lowest-entropy selection, and
  mean single-VLM reference: collective uncertainty 0.764 AUROC / 0.889
  AUARC in the small regime (4.7-15.8 points over baselines), 0.906/0.987
  large, JSD best in commercial at 0.819/0.910; pooled prediction accuracy
  up 13.0, 5.6, 8.7 points over the average single VLM; trajectory-level
  0.619 AUROC / 0.699 AUARC.. Nobody has vouched for it; add support or
  contest it on this page.
