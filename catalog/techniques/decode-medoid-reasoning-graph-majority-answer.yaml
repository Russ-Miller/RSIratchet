id: decode-medoid-reasoning-graph-majority-answer
ref: TEC-0257
label: "Decode from the medoid reasoning graph, not the majority ans"
summary: >-
  Sampled chains of thought are decomposed into atomic-fact causal DAGs,
  pairwise semantic-structural graph edit distances are computed, and the
  answer is read off the structurally central and peer-supported chain
  instead of by voting on fina
description: >-
  Sampled chains of thought are decomposed into atomic-fact causal DAGs,
  pairwise semantic-structural graph edit distances are computed, and the
  answer is read off the structurally central and peer-supported chain
  instead of by voting on fina Filed by the drafting stage from Can We Trust
  LLM's Logic? Quantifying Uncertainty, Coherence, and Robustness via a
  Graph-Based Framework (2607.08017) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy difference against
  self-consistency on five datasets with McNemar's test, plus an audit of
  disagreement cases labelled faithful or spurious by a human and an LLM
  judge (Cohen's kappa 0.913): 79.5% faithful wins for the medoid rule vs
  57.6% for self-consistency (+21.9 pp, Wilcoxon p<0.05), and adversarial
  ablation of the selected chain lowers faithfulness while leaving accuracy
  mostly unchanged.. Nobody has vouched for it; add support or contest it on
  this page.
