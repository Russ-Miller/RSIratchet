id: score-uncertainty-complexity-merged-reasoning-step-graph
ref: TEC-0346
label: "Score uncertainty by complexity of a merged reasoning-step g"
summary: >-
  Sample several chains of thought, merge semantically equivalent steps into
  a DAG using a bidirectional-entailment NLI model, and score uncertainty by
  graph width, height, or propagated per-step token uncertainty.
description: >-
  Sample several chains of thought, merge semantically equivalent steps into
  a DAG using a bidirectional-entailment NLI model, and score uncertainty by
  graph width, height, or propagated per-step token uncertainty. Filed by
  the drafting stage from GUT: Quantifying and Optimizing the Reasoning
  Uncertainty of LLMs via Graph Complexity (2609.05284) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by:
  Selective-generation PRR/AUROC/AUPRC against 45 white- and black-box
  uncertainty baselines across 4 Qwen3 scales and 5 datasets, with 1000-fold
  bootstrap; reported average gains of 11.79% PRR, 13.33% AUROC, 9.66% AUPRC
  over the best contender; ablations show node merging carries most of the
  signal for the propagation variant.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [multi-step-reasoning]
kind: decoding
