id: score-intermediate-repair-artifacts-just-patch
ref: TEC-0052
label: "Score intermediate repair artifacts, not just the patch"
summary: >-
  Require the repair model to also produce checkable intermediate artifacts
  (which tests trigger the bug, which lines execute before and after the
  patch, new bug-exposing tests) and grade those against execution evidence
  as a reliability sign
description: >-
  Require the repair model to also produce checkable intermediate artifacts
  (which tests trigger the bug, which lines execute before and after the
  patch, new bug-exposing tests) and grade those against execution evidence
  as a reliability sign Filed by the drafting stage from Better
  Understanding, Better Fixes? A Study of Hallucination in LLM-based
  Automated Program Repair (2609.04909) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Artifact accuracy was measured
  against instrumented execution (F1 for triggering-test identification and
  line coverage, validity of generated tests) and compared between Pass and
  Fail repairs; Pass repairs had higher artifact accuracy on average, but
  the distributions overlapped and the paper did not build or evaluate an
  actual patch-reliability classifier.. Nobody has vouched for it; add
  support or contest it on this page.
