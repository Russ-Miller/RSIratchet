id: re-weight-critique-guided-tokens-critique-free-plausibility
ref: TEC-0513
label: "Re-weight critique-guided tokens by critique-free plausibili"
summary: >-
  Revised trajectories are re-conditioned on the critique-free prompt and
  each token is scaled by the ratio of its critique-free to
  critique-conditioned probability, so critique-dependent tokens are
  down-weighted during the policy update.
description: >-
  Revised trajectories are re-conditioned on the critique-free prompt and
  each token is scaled by the ratio of its critique-free to
  critique-conditioned probability, so critique-dependent tokens are
  down-weighted during the policy update. Filed by the drafting stage from
  ICRL: Learning to Internalize Self-Critique with Reinforcement Learning
  (2605.15224) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average scores against GRPO, GSPO, ScalingInter, MATPO
  and Critique-GRPO on six agentic benchmarks and five math benchmarks (+7.8
  over GRPO and +1.1 over Critique-GRPO at 4B; +7.0 over GRPO on math at
  8B); ablation removing the re-weight ratio drops the four-benchmark
  average from 69.8 to 67.8.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [self-repair]
