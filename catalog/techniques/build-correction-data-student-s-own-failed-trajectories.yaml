  Solving for Native GUI Agents: Automated Reasoning-Action Data Generation
  and Self-Corrective Training (2603.23559) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Same base model and same
  expert-solution data with and without ~10k correction traces: overall
  solve rate 62.90% vs 71.90% on 1,000 held-out dynamic CAPTCHA instances,
  gains on all seven types (Slider +21.9pp, Text +16.8pp), average
  successful steps 1.60 vs 1.54.. Nobody has vouched for it; add support or
  contest it on this page.
