id: correct-reasoning-predicting-typed-error-operator-then-inverting
ref: TEC-0112
label: "Correct reasoning by predicting a typed error operator, then"
summary: >-
  Train a corrector on trajectories corrupted by executable typed error
  operators (real failures, synthetic corruptions, prefix interpolations) so
  at inference it repeatedly predicts the active error operator and applies
  its localized inverse
