label: "Verify LLM constraints by cross-examination, then map to slo"
summary: >-
  One LLM proposes explicit and implicit cross-domain constraints, a second
  LLM role probes and votes them true/false over up to five rounds, and
  surviving constraints are rule-parsed and Sentence-BERT-normalized into
  database-valid slot-valu
description: >-
