  Reasoning and Action: Hybrid LLM-RL Framework for Efficient Cross-Domain
  Task-Oriented Dialogue (2604.23345) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Success/Complete rates, dialogue-act
  P/R/F1 and average turns against PPO, ACGOS, GALAXY, GDP-Zero,
  TransferTOD, CAPID on MultiWOZ 2.1 and Frames (best variant 0.7214 and
