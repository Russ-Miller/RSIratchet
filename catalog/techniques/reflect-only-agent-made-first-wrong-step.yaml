id: reflect-only-agent-made-first-wrong-step
ref: TEC-0168
label: "Reflect only the agent that made the first wrong step"
summary: >-
  A process-reward model scores each step of a failed multi-agent
  trajectory, the first low-scoring step and its agent are identified, a
  corrected version of that step is generated and verified, and only that
  agent writes a reflection into it
description: >-
  A process-reward model scores each step of a failed multi-agent
  trajectory, the first low-scoring step and its agent are identified, a
  corrected version of that step is generated and verified, and only that
  agent writes a reflection into it Filed by the drafting stage from Finding
  Where the Buck Stops: An Automated Failure Attribution-Based Reflection
  Framework for Multi-Agent Collaboration (2608.28264) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Success rate on 100 sampled
  tasks per dataset over five trials: +22/26/27 points over initial success
  on HotPotQA, ChartQAPro, Mind2Web, above Reflexion, Retroformer and
  COPPER; ablation removing diagnosis+correction gave the largest drop; the
  attribution component beat All-at-once/Step-by-step/Binary-search on
  agent- and step-level accuracy on held-in and held-out Who&When data..
  Nobody has vouched for it; add support or contest it on this page.
