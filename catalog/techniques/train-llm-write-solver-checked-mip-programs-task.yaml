description: >-
  Supervised fine-tuning on single-modal MIP program demonstrations followed
  by GRPO with rewards for output format, discretization-API coverage,
  successful solver execution, and solver-verified trajectory correctness.
  Filed by the drafting stage from M$^3$P-R1: Reinforcement Learning for
  Large Language Model Guided Multi-Modal Motion Planning via MIP Code
  Generation (2609.18669) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Task success rate on 276 held-out LLMM3PBench
  problems versus prompt-only LLMs (GPT-5.2, Gemini 2.5 Flash, open models),
  PDDLStream, LLM+P, ReAct, sampling-based pipelines, and an Expert-MIP
  module-selection control; plus 40 real hardware scenarios at 87.5%. Reward
  ablations at matched 800-step budget show removing trajectory-correctness
  reward drops SR 84.8 to 50.3.. Nobody has vouched for it; add support or
  contest it on this page.
