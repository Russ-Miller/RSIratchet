id: gate-latent-memory-slot-updates-gru-style-gate
ref: TEC-0656
label: "Gate latent memory slot updates with a GRU-style gate"
summary: >-
  Adds a trainable fixed-size latent memory bank beside a frozen LLM, where
  cross-attention proposes a new slot state and a learned gate interpolates
  between the old and proposed state, with sparsity and entropy penalties on
  slot usage.
description: >-
  Adds a trainable fixed-size latent memory bank beside a frozen LLM, where
  cross-attention proposes a new slot state and a learned gate interpolates
  between the old and proposed state, with sparsity and entropy penalties on
  slot usage. Filed by the drafting stage from G-MemLLM: Gated Latent Memory
  Augmentation for Long-Context Reasoning in Large Language Models
  (2602.00015) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: HotpotQA EM/F1 (answer, supporting fact, joint) and ZsRE
  accuracy against the vanilla same-backbone model; GPT-2 answer F1 45.52 to
  54.08, Llama 3.1-8B supporting-fact F1 76.53 to 83.42, ZsRE score 55.63 to
  63.03; plus a slot-count ablation (512/1024/2048) showing saturation at
  1024.. Nobody has vouched for it; add support or contest it on this page.
