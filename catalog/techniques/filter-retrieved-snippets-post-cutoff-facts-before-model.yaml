description: >-
  An auxiliary model audits each date-restricted search result (title, URL,
  publication time, snippet, cutoff) blind to the question and gold answer,
  and removes results containing post-cutoff realized facts before they
  enter the forecaster's Filed by the drafting stage from OracleProto: A
  Reproducible Framework for Benchmarking LLM Forecasting via Knowledge
  Cutoffs and Temporal Masking (2605.03762) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Score under date-only versus
  date-plus-content-filter on 300 questions for four models, with paired
  question-cluster bootstrap CIs; plus a separate audit where a judge
  flagged 137/10,000 post-filter results as leaking, all 137 confirmed by
  humans and no leakage found in 1,000 sampled negatives.. Nobody has
  vouched for it; add support or contest it on this page.
