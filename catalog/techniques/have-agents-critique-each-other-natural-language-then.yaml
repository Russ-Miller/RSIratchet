description: >-
  Within each layer, every agent writes an explicit natural-language
  refinement instruction for each peer's draft (and for its own), agents
  revise on the collected instructions, and a synthesis agent combines the
  current layer's summary with Filed by the drafting stage from
  Attention-MoA: Enhancing Mixture-of-Agents via Inter-Agent Semantic
  Attention and Deep Residual Synthesis (2601.16596) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Length-controlled win rate
  on AlpacaEval 2.0 (91.15% vs 88.56% MoA, 78.20% RMoA), MT-Bench average
  (9.32 vs 9.13/8.82), FLASK win on 10 of 12 dimensions, and a depth sweep
  from 1 to 5 layers; early stopping cut tokens about 11%. All quality
  scores come from LLM judges; no per-component ablation separating the
  attention module from the residual module.. Nobody has vouched for it; add
  support or contest it on this page.
