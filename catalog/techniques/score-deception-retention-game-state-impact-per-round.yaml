description: >-
  Evaluates hidden-role agents with round-conditioned metrics — how often
  other players misidentify the agent's role, how each action shifts a
  continuous game-state advantage score, and how accurately the agent infers
  others' roles — instead Filed by the drafting stage from Evaluating Large
  Language Models in a Complex Hidden Role Game (2605.22826) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Applied across
  models and rule-based baselines in Secret Hitler; rule-based agents
  matched expert human voting decisions 86.7% of the time versus 59.7% for
  Llama 3.1 70B, and fascist LLM roles showed consistently negative impact
  scores; no independent validation of the metrics against human judgement
  is reported.. Nobody has vouched for it; add support or contest it on this
  page.
