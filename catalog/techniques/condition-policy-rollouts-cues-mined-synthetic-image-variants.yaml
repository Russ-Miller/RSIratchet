  Caption the image with the policy itself, generate image variants from
  those captions with a text-to-image diffusion model, aggregate the
  object-level content recurring across original-variant comparisons into a
  visual cue, then sample the Filed by the drafting stage from Vision-driven
  Preference Synthesis for Mitigating Hallucinations in VLMs (2606.28401)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Object HalBench response/mention rates and AMBER CHAIR/Hal./Cog. against
  13 prior mitigation baselines, plus MMStar/MMVP/CV-Bench general
  benchmarks; ablations swapping the captioner, the T2I model, the rollout
  source (self vs GPT-5 mini vs Qwen3-VL-30B), removing the cue, and
  replacing diffusion variants with crop/resize/mask/translation/video..
  Nobody has vouched for it; add support or contest it on this page.
