id: reward-judge-s-self-generated-rubric-scored-teacher
ref: TEC-0152
label: "Reward the judge's self-generated rubric, scored by a teache"
summary: >-
  The judge model emits an analysis segment, then task-generic and
  instruction-specific scoring criteria, then its evaluation, and during
  GRPO a stronger teacher model scores the generated criteria as one term of
  the reward.
description: >-
  The judge model emits an analysis segment, then task-generic and
  instruction-specific scoring criteria, then its evaluation, and during
  GRPO a stronger teacher model scores the generated criteria as one term of
  the reward. Filed by the drafting stage from UniRRM: Unified Reasoning
  Reward Models Across Languages and Evaluation Paradigms (2609.05910) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Pairwise
  accuracy on RewardBench, MM-Eval and JudgeBench against the untrained
  Qwen3-8B backbone (overall 0.809) and against ablations: dropping the
  rubric reward gives 0.854 and the full model 0.863; swapping the
  rubric-scoring teacher from Qwen3-32B to Qwen3-Flash to Qwen3-Max moves
  overall from 0.840 to 0.849 to 0.863.. Nobody has vouched for it; add
  support or contest it on this page.
