  against GPT-5-Chat on a fixed length-stratified ~1,000-item held-out set;
  baseline win+tie 23.8% vs fine-tuned 35.61%, hallucination 4.27 to 4.76;
  no human evaluation of the final set.. Nobody has vouched for it; add
  support or contest it on this page.
