id: vote-queries-answers-instead-debating
ref: TEC-0919
label: "Vote on queries and on answers instead of debating"
summary: >-
  Run N agents in parallel to each write a retrieval query, pool all
  retrieved passages, then run N agents in parallel to answer from that
  pooled evidence and take the majority answer, with no inter-agent
  interaction.
description: >-
  Run N agents in parallel to each write a retrieval query, pool all
  retrieved passages, then run N agents in parallel to answer from that
  pooled evidence and take the majority answer, with no inter-agent
  interaction. Filed by the drafting stage from Mitigating Hallucination on
  Hallucination in RAG via Ensemble Voting (2603.27253) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: EM/F1 on NQ,
  TriviaQA, PopQA, 2WikiMultihopQA, HotpotQA and StrategyQA against Naive
  RAG, IRCoT, Iter-RetGen, FLARE, SuRe, Self-RAG and the debate framework
  DRAG; voting beats Naive RAG on multi-hop (2Wiki EM 28.60 vs 14.80) but
  trails DRAG on 2Wiki, HotpotQA and StrategyQA (61.60 vs 69.20 EM), with an
  N=3/5/7 ablation showing voting accuracy rising with agent count.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
