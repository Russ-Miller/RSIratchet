description: >-
  Separate reward channels with token-level masks: human ratings update only
  the rating tokens, while reasoning tokens are rewarded by the quality
  change a frozen editor-plus-judge pair measures after revising the image
  according to that reas Filed by the drafting stage from MR-IQA-2: Faithful
  Image Quality Reflection via Fine-Grained Credit Assignment (2608.18579)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Mean judge-scored quality gain on a 5,866-image subset: baseline -0.136,
  rating-only -0.260, credit-masked reasoning reward +1.079 (98.8%
  positive); rating alignment held at 0.838/0.812 average PLCC/SRCC versus
  0.836/0.815 rating-only; direction of gains preserved when the editor
  (Mage-Flow) and judge (Q-Insight, GPT-5.6 Sol) are swapped.. Nobody has
  vouched for it; add support or contest it on this page.
