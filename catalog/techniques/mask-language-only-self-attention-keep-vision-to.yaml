id: mask-language-only-self-attention-keep-vision-to
ref: TEC-0100
label: "Mask language-only self-attention, keep vision-to-language f"
summary: >-
  At inference, apply mode-specific attention masks that suppress
  language-only self-attention in the late decoder layers so text tokens are
  forced to draw on visual tokens when attributing person attributes.
description: >-
  At inference, apply mode-specific attention masks that suppress
  language-only self-attention in the late decoder layers so text tokens are
  forced to draw on visual tokens when attributing person attributes. Filed
  by the drafting stage from ViD: Vision-Dominant Gender Bias Mitigation for
  Large Vision-Language Models (2609.16647) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Gender bias score on FACET (0.9274 to
  0.9928 for LLaVA), MS COCO (0.6708 to 0.9978), FairFace (0.5988 to 0.8782
  for Shikra), against six prior debiasing baselines; POPE accuracy and MMMU
  score held near baseline (LLaVA 82.63 to 83.06 POPE, 32.4 to 31.8 MMMU);
  coverage per attention mode reported (V2L 95.8% vs visual-only 9.3%,
  language-only 4.9%, L2V 0.2%).. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [visual-grounding]
