label: "Route the agent topology from the task's dependency DAG"
summary: >-
  Decompose the task into a dependency DAG with annotated coupling
  strengths, then pick parallel, sequential, hierarchical or hybrid agent
  execution in linear time from the DAG's parallelism width and coupling
  density.
description: >-
  Decompose the task into a dependency DAG with annotated coupling
  strengths, then pick parallel, sequential, hierarchical or hybrid agent
  execution in linear time from the DAG's parallelism width and coupling
  density. Filed by the drafting stage from AdaptOrch: Task-Adaptive
  Multi-Agent Orchestration in the Era of LLM Performance Convergence
  (2602.16873) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy against single-best-model, Mixture-of-Agents,
  LLM-Blender, and static parallel/sequential baselines on SWE-bench
  Verified, GPQA Diamond and HotpotQA; reported 52.6/53.1/76.4 vs
  42.8/46.2/68.3 for single best, with a compute-matched Self-MoA baseline
  recovering most of the gain and an ablation attributing -2.8 points to
  removing adaptive routing.. Nobody has vouched for it; add support or
  contest it on this page.
