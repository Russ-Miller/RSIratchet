description: >-
  Have the VLM draft a rationale with the answer as a hint, then compare the
  sample against a visually similar sample with a synonymous question to
  produce a contrastive analysis, and have an LLM rewrite the rationale
  using that analysis befo Filed by the drafting stage from Through the Lens
  of Contrast: Self-Improving Visual Reasoning in VLMs (2603.02556) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Finetuned
  Qwen2.5-VL-7B on the resulting 55K-sample set and scored six benchmarks
  (MMVP, HallusionBench, MathVista, MathVision, MMStar, MME-RealWorld)
  against the base model, three reproduced self-improving baselines (STaR,
  verifier-filtered, self-feedback) generating rationales on the same data,
  and four off-the-shelf reasoning datasets: average 58.1 vs 55.5 base and
  55.4 (STaR), 54.9 (verifier), 56.4 (feedback). Ablations: easy samples
  added hurt; negative pairs contribute more than positive on GQA; gains
  repeated on 3B and InternVL2.5-8B.. Nobody has vouched for it; add support
  or contest it on this page.
