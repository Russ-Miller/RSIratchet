id: calibrate-confidence-per-extracted-claim-per-response
ref: TEC-0098
label: "Calibrate confidence per extracted claim, not per response"
summary: >-
  Decompose a response into atomic claims, score each with a mixture of
  cross-sample consistency and self-verification, and fit temperature or
  Platt scaling at the claim level so low-confidence claims can be flagged
  for retrieval or human rev
description: >-
  Decompose a response into atomic claims, score each with a mixture of
  cross-sample consistency and self-verification, and fit temperature or
  Platt scaling at the claim level so low-confidence claims can be flagged
  for retrieval or human rev Filed by the drafting stage from Claim-Level
  Confidence Calibration for Reliable Decision Making with Large Language
  Models (2608.22483) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: ECE, smECE, Brier, AUROC, AURC against seven baselines
  (few-shot likelihood, CoT, verbalized confidence, PS, TS, LMvsLM,
  HalluMeasure) on TriviaQA and TruthfulQA; best case GPT-4o/TriviaQA ECE
  0.006 vs 0.096 for TS, but on GPT-4o/TruthfulQA ECE 0.412 vs 0.118 for
  TS.. Nobody has vouched for it; add support or contest it on this page.
