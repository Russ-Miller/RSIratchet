id: pre-filter-documents-extracted-metadata-before-chunk-search
ref: TEC-0473
label: "Pre-filter documents by extracted metadata before chunk sear"
summary: >-
  An extractor agent reads each filing's first ~1024 tokens for company,
  date and report type, and the search agent uses those fields as hard
  filters to restrict which documents' chunks enter hybrid dense+sparse
  retrieval.
description: >-
  An extractor agent reads each filing's first ~1024 tokens for company,
  date and report type, and the search agent uses those fields as hard
  filters to restrict which documents' chunks enter hybrid dense+sparse
  retrieval. Filed by the drafting stage from MimirRAG: A Multi-Agent RAG
  Framework for Financial Data Retrieval with Metadata Integration
  (2605.25030) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation on 150 FinanceBench questions: with metadata,
  GPT-4.1-mini reached 76.0% accuracy, Hit@1 0.65, Hit@5 0.81 and 1.59
  average documents retrieved; without metadata, 62.0%, Hit@1 0.53, Hit@5
  0.73. Full system with GPT-4.1 reached 82.7% against a 93.3% oracle and a
  65.3% naive-RAG reimplementation.. Nobody has vouched for it; add support
  or contest it on this page.
