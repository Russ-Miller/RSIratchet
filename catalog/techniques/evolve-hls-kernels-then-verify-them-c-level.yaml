description: >-
  A multi-agent loop that retrieves Vitis optimization strategies, evolves
  simulation-passing kernel candidates under an error pool, de-pragmatizes
  the best kernel to check functional correctness in plain C++ with
  generated test cases and rep Filed by the drafting stage from FPGAgent: An
  LLM-Assisted Framework for Autonomous HLS Code Generation and Verification
  in FPGA Environments (2608.23630) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against zero-shot pass@10 on 78
  HLS-Eval tasks: average +16.9 points synthesizable, +26.7 executable,
  +30.6 functional correctness; ablation isolating the two modules (base
  37.2% functional correctness, evolution-only 48.7%, reflection-only 46.2%,
  full 66.7% on Qwen3-Coder).. Nobody has vouched for it; add support or
  contest it on this page.
