label: "Learn when each agent retrieves, shares, drafts, or critique"
summary: >-
  Frames multi-agent document synthesis as a Dec-POMDP where each agent
  picks among Retrieve, Disseminate, Compose and Critique from a
  20-dimensional compact observation, with a shared actor-critic trained by
  IPPO on draft-quality deltas agai
description: >-
  Frames multi-agent document synthesis as a Dec-POMDP where each agent
