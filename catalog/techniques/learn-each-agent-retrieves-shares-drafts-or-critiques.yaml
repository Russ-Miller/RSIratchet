  Assembling the CREW: A Collaborative Multi-agent Reinforcement Learning
  Framework for Automated Related Work Generation (2609.15721) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: LLM-as-judge
  (three judges) overall score, citation verification rate, tokens and
  inference time against SRW, a HuggingGPT-style naive orchestrator, an
  architecture-matched LLM orchestrator, GPT-4o long-context and RAG, and
  PRIMERA; CREW 3.82 overall vs orchestrator 3.80, SRW 3.76, naive
  orchestrator 3.40.. Nobody has vouched for it; add support or contest it
  on this page.
