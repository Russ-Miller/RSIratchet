label: "Extract acoustic features first, then reason over them"
summary: >-
  Train a speech reward model to decompose naturalness judgement into an
  interpretable acoustic feature extraction stage followed by
  feature-grounded chain-of-thought reasoning, instead of regressing audio
  to a scalar score.
description: >-
  Train a speech reward model to decompose naturalness judgement into an
  interpretable acoustic feature extraction stage followed by
  feature-grounded chain-of-thought reasoning, instead of regressing audio
  to a scalar score. Filed by the drafting stage from GSRM: Generative
  Speech Reward Model for Speech RLHF (2602.13891) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Model-human correlation of
  naturalness scores against expert ratings, compared with existing scalar
  naturalness predictors and against human inter-rater consistency, plus
  naturalness of speech LLM generations when the model is used as an online
  RLHF verifier.. Nobody has vouched for it; add support or contest it on
  this page.
