id: score-recovery-model-s-own-real-failure-states
ref: TEC-0055
label: "Score recovery from the model's own real failure states"
summary: >-
  Build evaluation scenarios by replaying naturally occurring failure states
  from policy rollouts and measuring whether the policy still completes the
  original task, graded by how much state restoration the failure demands.
description: >-
  Build evaluation scenarios by replaying naturally occurring failure states
  from policy rollouts and measuring whether the policy still completes the
  original task, graded by how much state restoration the failure demands.
  Filed by the drafting stage from LIBERO-RECOVER: Beyond Task Success
  Towards Failure Recovery in Robotic Manipulation Models (2609.05178) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Applied
  to six policies; all showed over 50% drops from standard LIBERO success to
  recovery success, with monotone decline across the four recovery levels
  and rank inversions relative to standard LIBERO (Wan2-Policy +14.4 on
  LIBERO-100 but -5.0 under failures).. Nobody has vouched for it; add
  support or contest it on this page.
