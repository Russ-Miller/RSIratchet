label: "Supply the proof's own lemmas in context, not a reasoning te"
summary: >-
  Prepend the key lemmas invoked by the ground-truth proof to the prompt
  alongside the problem and algorithm description, instead of (or before)
  adding chain-of-thought instructions or the target approximation ratio.
description: >-
  Prepend the key lemmas invoked by the ground-truth proof to the prompt
  alongside the problem and algorithm description, instead of (or before)
  adding chain-of-thought instructions or the target approximation ratio.
  Filed by the drafting stage from Can LLMs Prove Robotic Path Planning
  Optimality? A Benchmark for Research-Level Algorithm Verification
  (2603.19464) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rate (final-answer and reasoning both >=7 on a
  1-10 LLM-judge scale) rose from 8.82-26.47% with no context to
  29.41-44.12% with lemmas; the oracle-ratio-only setting reached
  17.65-32.35%; adding CoT alone did not raise scores and increased counted
  hallucination errors (216 to 244 in the no-context setting).. Nobody has
  vouched for it; add support or contest it on this page.
