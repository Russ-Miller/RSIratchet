id: show-llm-bayesian-belief-state-history
ref: TEC-0153
label: "Show the LLM a Bayesian belief state, not the history"
summary: >-
  An external module runs a two-step Bayes filter over a specified POMDP and
  passes only the normalized posterior over latent states to the LLM, which
  selects an action from that posterior with no access to the
  action-observation log.
description: >-
  An external module runs a two-step Bayes filter over a specified POMDP and
  passes only the normalized posterior over latent states to the LLM, which
  selects an action from that posterior with no access to the
  action-observation log. Filed by the drafting stage from Belief-State
  Engine: Augmenting LLMs for Principled Planning Under Partial
  Observability (2609.10036) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Paired-seed comparison on Tiger POMDP and a
  red-team attack graph against a reactive LLM and a natural-language belief
  tracker, with task return, Brier/NLL/entropy calibration, and a
  decision-consistency JSD between belief-equivalent history pairs; on Tiger
  the BSE agent reached 38/40 success vs 32/40 reactive, but only 40 seeds,
  one sampling seed, and CoT/ReAct/QMDP/POMCP were not run.. Nobody has
  vouched for it; add support or contest it on this page.
