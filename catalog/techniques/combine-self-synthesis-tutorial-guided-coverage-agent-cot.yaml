description: >-
  Generate verified Rust+Verus programs by letting a fine-tuned model
  continue-write programs and proofs from scratch, steer coverage with
  per-knowledge-point tutorial seed programs, deduplicate and machine-verify
  them, and add a few thousand Filed by the drafting stage from Reducing the
  Costs of Proof Synthesis on Rust Systems by Scaling Up a Seed Training Set
  (2602.04910) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy@100 and @600 (with 5 debugging rounds) on
  VeruSAGE-Bench and VerusBench against the raw Qwen model and Qwen
  fine-tuned on SAFE and AlphaVerus data, plus o4-mini and Claude Sonnet
  4.5; VeruSAGE-Bench total 39%/49% vs 15%/20% for Part-1 only and 35%/41%
  for Part-2 only, while on VerusBench Part-1 only (79%/84%) exceeded the
  combined data (75%/83%).. Nobody has vouched for it; add support or
  contest it on this page.
