description: >-
  Samples several reasoning paths, merges semantically equivalent steps into
  one hypothesis graph, embeds nodes with semantic plus structural plus
  uncertainty features, and keeps only the long-lifespan connected
  components and loops as the re Filed by the drafting stage from Learning
  Global Hypothesis Space for Enhancing Synergistic Reasoning Chain
  (2602.09794) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Exact match on eight benchmarks against nine baselines
  including CoT-SC, ToT, GoT, FoT, AoT and AFlow on three backbones (average
  EM 68.0/67.6/68.3 vs 66.9/66.8/67.3 for AoT); path-selection comparison on
  MATH against shortest, max-confidence and human-selected paths; paraphrase
  perturbation changing 2.9% of answers versus 7.4% for max-confidence;
  weight ablation showing the semantic distance term is load-bearing; LLM
  calls fixed at 19 and tokens about 27-36% below ToT and AoT.. Nobody has
  vouched for it; add support or contest it on this page.
