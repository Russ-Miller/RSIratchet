id: elicit-rubric-criteria-several-evaluator-roles-then-pool
ref: TEC-0280
label: "Elicit rubric criteria from several evaluator roles, then po"
summary: >-
  Prompt the same model once per fixed evaluative role to emit compact
  weighted binary criteria, concatenate them with exact-duplicate removal,
  and score a response as the weighted fraction of criteria judged
  satisfied.
description: >-
  Prompt the same model once per fixed evaluative role to emit compact
  weighted binary criteria, concatenate them with exact-duplicate removal,
  and score a response as the weighted fraction of criteria judged
  satisfied. Filed by the drafting stage from Many Voices, One Reward:
  Multi-Role Rubric Generation for LLM Judging and Reward Modeling
  (2607.01830) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on RewardBench-2, JudgeBench and PPE against
  single-voice rubric generation with and without sample responses and
  against Chasing the Tail, across five backbones (reported gains 3.1-16.4
  points over the strongest baseline); a repeated-single-voice control with
  the same post-processing stayed 7.3 and 10.0 points below on RewardBench-2
  and JudgeBench; also used as the GRPO reward, improving BiGGen Bench by
  1.7 and HealthBench-Hard by 3.4 over the best single-voice reward.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [critique]
kind: prompting
