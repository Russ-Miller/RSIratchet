id: decouple-numerical-evolution-llm-reasoning
ref: TEC-0587
label: "Decouple numerical evolution from LLM reasoning"
summary: >-
  Run a pretrained diffusion simulator to evolve the physical field, project
  its output into topological semantic tokens, and let a frozen LLM reason
  and self-check against retrieved conservation laws rather than generate
  the forecast itself.
description: >-
  Run a pretrained diffusion simulator to evolve the physical field, project
  its output into topological semantic tokens, and let a frozen LLM reason
  and self-check against retrieved conservation laws rather than generate
  the forecast itself. Filed by the drafting stage from OMNIFLOW: A
  Physics-Grounded Multimodal Agent for Generalized Scientific Reasoning
  (2603.15797) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: RMSE/SSIM/PSNR against trained deep-learning surrogates
  on three benchmarks (reported best on all) and against zero-shot
  monolithic image models in pixel space (SSIM 0.55/0.69/0.71 vs 0.14-0.35);
  no component ablation separating the simulator from the symbolic projector
  or the physics critic.. Nobody has vouched for it; add support or contest
  it on this page.
