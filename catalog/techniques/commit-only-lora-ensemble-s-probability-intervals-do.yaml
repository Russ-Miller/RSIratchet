id: commit-only-lora-ensemble-s-probability-intervals-do
ref: TEC-0101
label: "Commit only when a LoRA ensemble's probability intervals do "
summary: >-
  Treat several independently fine-tuned LoRA adapters as a credal set,
  bound each candidate answer by its min and max probability over adapters,
  and answer only when a single candidate is undominated — otherwise return
  the surviving set.
description: >-
  Treat several independently fine-tuned LoRA adapters as a credal set,
  bound each candidate answer by its min and max probability over adapters,
  and answer only when a single candidate is undominated — otherwise return
  the surviving set. Filed by the drafting stage from Credal Large Language
  Models for Semantic Commitment under Uncertainty (2608.23244) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: AUROC for
  detecting the model's own errors and corrupted inputs, accuracy at 80%
  coverage, ECE/NLL, commit rate and accuracy-when-committed, against
  standard LLM entropy, semantic entropy, Laplace/Bayesian-LoRA, and the
  same adapters mean-pooled, on five datasets and three backbones.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [abstention-and-self-knowledge]
