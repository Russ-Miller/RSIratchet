id: slow-chunk-proposal-plus-fast-rl-trained-action
ref: TEC-0126
label: "Slow chunk proposal plus fast RL-trained action edit"
summary: >-
  A large VLA asynchronously samples candidate action chunks from an older
  observation, then a lightweight edit policy conditioned on the latest
  observation perturbs each candidate and a learned Q-function picks the
  best chunk to execute.
description: >-
  A large VLA asynchronously samples candidate action chunks from an older
  observation, then a lightweight edit policy conditioned on the latest
  observation perturbs each candidate and a learned Q-function picks the
  best chunk to execute. Filed by the drafting stage from Reinforcement
  Learning for Real-Time Vision-Language-Action Policies (2609.18207) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Success
  rate against RLPD, DSRL, DSRL+RTC, EXPO-FT, EXPO-FT+RTC and SFT baselines:
  best in 10/10 Kinetix environments (96.2% average under 4-step delay,
  above the 81.4% zero-delay RLPD baseline) and 29/30 average over four real
  tasks versus 25/30 for the strongest baseline, plus delay and speed
  sweeps.. Nobody has vouched for it; add support or contest it on this
  page.
