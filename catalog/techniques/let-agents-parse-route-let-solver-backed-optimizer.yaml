id: let-agents-parse-route-let-solver-backed-optimizer
ref: TEC-0328
label: "Let the agents parse and route, let a solver-backed optimize"
summary: >-
  Restricts LLM agents to drawing parsing, ontology-grounded retrieval, tool
  routing and candidate selection, while all candidate generation and
  scoring is done by a MILP-guided search over a graph representation
  validated by a physics solver
description: >-
  Restricts LLM agents to drawing parsing, ontology-grounded retrieval, tool
  routing and candidate selection, while all candidate generation and
  scoring is done by a MILP-guided search over a graph representation
  validated by a physics solver Filed by the drafting stage from A
  Multi-Agent Framework for Zero-Dimensional Reduced-Order Model Planning
  (2607.10994) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Compared against four ablations (single-agent ReAct
  with/without retrieval, compact CoT, multi-agent with NSGA-II) on success
  rate, per-objective improvement and runtime; reported 55.46% active power
  loss reduction on IEEE 69-bus, 90.45% cost reduction on Two-Loop, 3.15%
  seal leakage reduction in SAS inverse design, with reference-baseline gaps
  of 0.09-3.58% on the four public benchmarks.. Nobody has vouched for it;
  add support or contest it on this page.
