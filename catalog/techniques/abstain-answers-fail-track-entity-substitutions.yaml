id: abstain-answers-fail-track-entity-substitutions
ref: TEC-0238
label: "Abstain when answers fail to track entity substitutions"
summary: >-
  Replace entities in the question and evidence with type-matched synthetic
  names under a bijective mapping, re-ask, map the answer back, and abstain
  when back-mapped answers disagree with the original across sampled worlds.
description: >-
  Replace entities in the question and evidence with type-matched synthetic
  names under a bijective mapping, re-ask, map the answer back, and abstain
  when back-mapped answers disagree with the original across sampled worlds.
  Filed by the drafting stage from Twin Worlds: Equivariance-Based
  Abstention for Evidence-Grounded Reasoning (2608.28018) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Four benchmarks
  (HotpotQA, MIRAGE, FaithEval, FEVER) x three backbones against seven
  abstention baselines on F1/Acc/Reliability Score/Abstention Rate; on a
  200-item hard subset where self-consistency agreement >=0.8 and
  sufficiency score >=0.5, abstention rate 0.71 vs 0.09 and 0.11; ablation
  shows removing back-mapping costs 0.067-0.076 RS and using real Wikipedia
  entities instead of synthetic ones costs 0.103-0.115 RS; human agreement
  83.5%.. Nobody has vouched for it; add support or contest it on this page.
