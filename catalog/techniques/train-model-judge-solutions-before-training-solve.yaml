description: >-
  Split the RL budget: first run verifiable-reward RL where the model
  classifies sampled candidate solutions as correct or incorrect (balanced
  positives/negatives, hard negatives from mid-difficulty problems), then
  initialize ordinary answer- Filed by the drafting stage from JudgeRLVR:
  Judge First, Generate Second for Efficient Reasoning (2601.08468) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  and mean generation length on five math benchmarks and five out-of-domain
  benchmarks against a vanilla RLVR run with identical data, hyperparameters
  and total steps (+3.7 pp avg accuracy, -42% length in-domain; +4.5 pp
  out-of-domain); ablations show judging alone lengthens output and loses
  3.9 pp, and interleaving judge/generate data 1:1 loses 3.1 pp
  out-of-domain.. Nobody has vouched for it; add support or contest it on
  this page.
