description: >-
  Train a conditional diffusion model on calibration-set dissimilarity
  scores to approximate the score distribution given the input, draw
  synthetic samples to form a prediction set, and flag a hallucination when
  the acceptability threshold fa Filed by the drafting stage from Generative
  Score Inference for Multimodal Data (2603.26349) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Power at matched Type I error
  on 293 held-out WikiQA test instances, compared against Semantic Entropy
  (10 sampled answers, logistic calibration) and Conformal Alignment
  (XGBoost); also FDR and power on MS-COCO caption selection against
  Conformal Alignment.. Nobody has vouched for it; add support or contest it
  on this page.
