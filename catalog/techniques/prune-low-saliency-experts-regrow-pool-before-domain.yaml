  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against Direct SFT with identical
  data and hyperparameters: +3.40 math average (avg@32 over six competition
  benchmarks) on Qwen3-30B-A3B, +1.67 on Qwen3.5-35B-A3B, +6.0 pass@1 on
  SWE-bench Verified, positive on all 12 benchmarks across five domains and
  all 15 data-scale comparisons; post-hoc pruning of the trained model costs
  5.0 points for UMoE vs 0.12 for Direct SFT.. Nobody has vouched for it;
  add support or contest it on this page.
