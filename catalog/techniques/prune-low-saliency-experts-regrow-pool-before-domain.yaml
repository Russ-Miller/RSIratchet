id: prune-low-saliency-experts-regrow-pool-before-domain
ref: TEC-0304
label: "Prune low-saliency experts and regrow the pool before domain"
summary: >-
  Score each MoE expert on target-domain calibration data, drop the least
  salient half per layer, refill the freed slots by copying survivors with
  independent Gaussian perturbation to both copies, then run ordinary SFT.
description: >-
