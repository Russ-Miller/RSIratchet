id: feed-cached-self-predicted-latents-back-training-context
ref: TEC-0465
label: "Feed cached self-predicted latents back as training context"
summary: >-
  During training, a dynamic cache in VAE latent space stores the model's
  own predicted latents and progressively replaces ground-truth history as
  conditioning, on a linear decay schedule.
description: >-
  During training, a dynamic cache in VAE latent space stores the model's
  own predicted latents and progressively replaces ground-truth history as
  conditioning, on a linear decay schedule. Filed by the drafting stage from
  Sword: Style-Robust World Models as Simulators via Dynamic Latent
  Bootstrapping for VLA Policy Post-Training (2605.07288) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Ablation against
  an identical model without the bootstrapping cache: LPIPS/FID/FVD/FloLPIPS
  improved on both LIBERO-Original (FVD 48.46 to 32.17) and a 1:1 raw+OOD
  mixed set (FVD 110.71 to 86.84); GRPO post-training of OpenVLA-OFT reached
  61.72% vs 53.12% for WoVR at step 172.. Nobody has vouched for it; add
  support or contest it on this page.
