id: penalize-tokens-whose-pooled-rank-evidence-falls-below
ref: TEC-0155
label: "Penalize tokens whose pooled rank evidence falls below their"
summary: >-
  At prefill, pool each candidate token's reciprocal vocabulary rank across
  all visual-token readouts, and during decoding apply a bounded logit
  penalty to candidates whose pooled rank evidence falls below a
  token-specific reference median es
description: >-
  At prefill, pool each candidate token's reciprocal vocabulary rank across
  all visual-token readouts, and during decoding apply a bounded logit
  penalty to candidates whose pooled rank evidence falls below a
  token-specific reference median es Filed by the drafting stage from
  ReWEIGH the Evidence: Calibrating Token-Level Ordinal Visual Evidence to
  Mitigate Hallucinations in Large Vision-Language Models (2608.19075) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: CHAIR_I
  object-hallucination reduced by up to 21.3% on four 7B backbones with
  descriptive and general multimodal scores largely preserved; reductions
  reported across 11 models from six families up to 32B; 1.33% average added
  per-token latency; rank-derived suppression strengths unchanged under
  per-position rescaling while probability-derived strengths shifted ~0.045;
  token-specific medians cut held-out calibration error 91-92% versus a
  global reference and beat all 1,000 random token-to-reference
  reassignments.. Nobody has vouched for it; add support or contest it on
  this page.
