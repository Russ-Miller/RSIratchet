id: penalize-tokens-whose-pooled-rank-evidence-falls-below
ref: TEC-0155
label: "Penalize tokens whose pooled rank evidence falls below their"
summary: >-
  Aggregate each candidate token's vocabulary rank across all visual-token
  positions into a dense mean reciprocal rank cached at prefill, and apply a
  bounded logit penalty when that value falls below a token-specific
  reference median estimate
description: >-
  Aggregate each candidate token's vocabulary rank across all visual-token
  positions into a dense mean reciprocal rank cached at prefill, and apply a
  bounded logit penalty when that value falls below a token-specific
  reference median estimate Filed by the drafting stage from ReWEIGH the
  Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate
  Hallucinations in Large Vision-Language Models (2608.19075) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_I
  object-hallucination reduced by up to 21.3% on four 7B backbones with
  descriptive and general multimodal scores largely preserved; reductions
  reported across 11 models from six families up to 32B; 1.33% average added
  latency per token. Diagnostics: 90th/10th percentile probability ratio
  across visual positions 13.8x (LLaVA-1.5-7B) and 7.8x (Qwen2.5-VL-7B),
  only to 11.0x and 4.2x after affine equalization; rank-derived suppression
  strengths unchanged under order-preserving rescaling while
  probability-based ones shifted by ~0.045; token identity explains 66.4% of
  DMRR variability; token-specific medians cut held-out calibration error
  92%/91% versus a global reference on 4,969 disjoint images and beat all
  1,000 reference shuffles.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [visual-grounding]
