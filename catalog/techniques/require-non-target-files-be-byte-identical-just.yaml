id: require-non-target-files-be-byte-identical-just
ref: TEC-0364
label: "Require non-target files be byte-identical, not just task go"
summary: >-
  Score a task as successful only when all task-specific final-state
  evaluators pass and every pre-existing non-target file is unchanged
  between initial and final sandbox state.
description: >-
  Score a task as successful only when all task-specific final-state
  evaluators pass and every pre-existing non-target file is unchanged
  between initial and final sandbox state. Filed by the drafting stage from
  WorldBench: Culturally Grounded Benchmark for Multilingual Agents
  (2609.01056) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to nine agents; the combined metric (CTS)
  separated models differently from pass rate, with best model 49.2% CTS vs
  59.3% pass, and collateral edits appearing as a substantial failure
  category for all agents.. Nobody has vouched for it; add support or
  contest it on this page.
