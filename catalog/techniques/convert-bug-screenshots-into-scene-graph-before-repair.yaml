description: >-
  Fine-tune a vision-language model to emit a Mermaid-serialized semantic
  scene graph of GUI elements and their hierarchy/control-flow edges, and
  feed that graph, not the image or a caption, to the repair agent; on
  validation failure, crop th Filed by the drafting stage from SVRepair:
  Structured Visual Reasoning for Automated Program Repair (2602.06090) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Pass@1
  ablation: on MMCode, image-plus-caption 16.33% vs scene-graph 38.02%;
  CodeVision 89.02% vs 95.73%. On SWE-Bench M (517 instances) the full
  system resolved 186 (35.98%), tied with GUIRepair under the same GPT-o3
  coder; OmniGIRL visual subset 4/19 vs 0/19, n too small for a firm read.
  Scene-graph fidelity measured separately by Mermaid rendering accuracy
  (94.29%) and SSIM (0.7892) vs the 8B base (81.14%, 0.6868).. Nobody has
  vouched for it; add support or contest it on this page.
