id: rank-feed-forward-neurons-class-conditional-residual-contribution
ref: TEC-0139
label: "Rank feed-forward neurons by class-conditional residual cont"
summary: >-
  Score each MLP neuron at the final prompt token by the separation between
  hallucinated and truthful mean pre-to-post activation change scaled by its
  output-vector norm, then train a small classifier on the top-ranked
  neurons' features.
description: >-
  Score each MLP neuron at the final prompt token by the separation between
  hallucinated and truthful mean pre-to-post activation change scaled by its
  output-vector norm, then train a small classifier on the top-ranked
  neurons' features. Filed by the drafting stage from NeuroActiSep:
  Detecting Factual Hallucinations from Feed-Forward Neurons in a Single
  Pass (2609.14448) with status proposed: the paper introduces or tests it,
  and the claim drafted from the paper is its first evidence. The paper
  validated it by: AUROC on TriviaQA (held-out dev split) and TruthfulQA
  (5-fold) against perplexity, mean/min logits, P(True), and linear and MLP
  probes on mlp_out and resid_post; the neuron classifier ranked in the top
  two on all six model-dataset pairs.. Nobody has vouched for it; add
  support or contest it on this page.
