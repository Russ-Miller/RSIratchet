id: recursively-search-video-context-construction-program
ref: TEC-0252
label: "Recursively search the video context-construction program"
summary: >-
  An LLM proposer repeatedly rewrites the executable program that selects,
  retrieves and packs video evidence into a frozen VLM's bounded context,
  keeping only candidates that strictly improve development accuracy.
description: >-
  An LLM proposer repeatedly rewrites the executable program that selects,
  retrieves and packs video evidence into a frozen VLM's bounded context,
  keeping only candidates that strictly improve development accuracy. Filed
  by the drafting stage from VideoHarness-RSI: Recursive Harness
  Self-Improvement for Long-Video Understanding with Frozen Vision-Language
  Models (2608.24302) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: LVBench held-out accuracy (882 questions never used for
  promotion): AKS parent 46.6, searched CardinalityLedger 54.8, with paired
  bootstrap CI and exact McNemar; a capacity-matched AKS-90 control at
  similar cumulative visual tokens reached only 49.2; frozen transfer gave
  67.5 vs 66.9 on Video-MME and 75.0 vs 72.0 on MLVU.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [harness-self-improvement]
