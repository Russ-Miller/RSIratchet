id: reward-each-tool-call-whether-was-necessary
ref: TEC-0126
label: "Reward each tool call by whether it was necessary"
summary: >-
  During RL, an LLM judge labels each tool invocation as necessary or not
  given the question and tool input, and unnecessary calls get a fixed
  per-step penalty added to the final-answer reward.
description: >-
  During RL, an LLM judge labels each tool invocation as necessary or not
  given the question and tool input, and unnecessary calls get a fixed
  per-step penalty added to the final-answer reward. Filed by the drafting
  stage from Spurious Tool Use: When RL Agents Learn the Wrong Reason to Act
  (2609.16268) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Measured as the cue-present minus cue-absent search-call
  rate on DeepMath and GSM8K against the same RL run without the dense
  reward: spurious deltas of +9.5 to +39.2 points fell to ~0, with task
  accuracy equal or higher than the no-cue baseline.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [tool-use]
kind: training
sources: [arxiv-2609-16268]
status: proposed
