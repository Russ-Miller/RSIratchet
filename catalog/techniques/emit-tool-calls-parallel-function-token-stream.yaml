id: emit-tool-calls-parallel-function-token-stream
ref: TEC-0102
label: "Emit tool calls on a parallel function-token stream"
summary: >-
  Adds a dedicated autoregressive function channel, with its own head and
  start/end tool-call boundary tokens supervised alongside padding, running
  in parallel with the agent-text stream so tool calls are not serialized
  into the spoken respon
description: >-
  Adds a dedicated autoregressive function channel, with its own head and
  start/end tool-call boundary tokens supervised alongside padding, running
  in parallel with the agent-text stream so tool calls are not serialized
  into the spoken respon Filed by the drafting stage from NemotronLabs
  VoiceChat: An Open Full-duplex Speech-to-Speech Model with Tool Calling
  Capabilities (2609.21967) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Full-Duplex-Bench 3.0 tool-selection F1, argument
  accuracy and Pass@1 against Gemini Live 2.5 and 3.1; full-duplex behaviour
  checked on FDB 1.0/1.5 and VoiceBench, but no ablation against a
  serialized single-channel variant.. Nobody has vouched for it; add support
  or contest it on this page.
