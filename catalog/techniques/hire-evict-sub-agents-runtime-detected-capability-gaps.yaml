label: "Hire and evict sub-agents at runtime from detected capabilit"
summary: >-
  An asynchronous meta-cognition engine watches the conversation for
  capability gaps, instantiates a specialized sub-agent for each gap, evicts
  least-recently-used sub-agents under a resource cap, and prunes history to
  reduce refusal bias — w
