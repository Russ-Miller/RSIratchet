description: >-
  Build corrupted reasoning traces by composing typed, executable error
  operators, train an adapter to name the active operator and reconstruct
  the adjacent lower-noise trace, then at inference iteratively predict and
  apply applicability-chec Filed by the drafting stage from Semantic
  Reasoning Denoising: Correcting Language Model Reasoning with Semantic
  Operators (2608.22090) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Average 67.5 across six in-domain benchmarks versus 64.3
  for the strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe,
  five seeds, improvements significant after Holm correction; cross-dataset
  transfer averages 76.4 (Llama-3) and 80.2 (Qwen3); ablations removing
  operator-only or adjacent-state-only supervision lose on all four tasks..
  Nobody has vouched for it; add support or contest it on this page.
