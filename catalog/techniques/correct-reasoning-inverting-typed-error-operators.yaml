description: >-
  Build corrupted reasoning states by applying executable typed error
  operators to correct traces, train an adapter to diagnose the active
  operator and the adjacent lower-noise state, then at inference iteratively
  predict and apply applicabil Filed by the drafting stage from Semantic
  Reasoning Denoising: Correcting Language Model Reasoning with Semantic
  Operators (2608.22090) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Six in-domain benchmarks: average 67.5 vs 64.3 for the
  strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe, five seeds,
  significant after Holm correction; seven transfer targets improve base
  average from 67.7 to 76.4 (Llama-3) and 72.9 to 80.2 (Qwen3); ablations
  drop 2-7 points when a noise source or loss term is removed.. Nobody has
  vouched for it; add support or contest it on this page.
