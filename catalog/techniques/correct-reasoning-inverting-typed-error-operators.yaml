description: >-
  Build corrupted reasoning traces by composing typed executable error
  operators, train a LoRA denoiser to identify the active operator and the
  adjacent lower-noise state, then at inference iteratively predict and
  apply applicability-checked Filed by the drafting stage from Semantic
  Reasoning Denoising: Correcting Language Model Reasoning with Semantic
  Operators (2608.22090) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Average over six in-domain benchmarks 67.5 vs 64.3 for
  the strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe, five
  seeds, Holm-corrected; transfer averages 76.4 (Llama-3) and 80.2 (Qwen3)
  vs base 67.7 and 72.9; ablations show operator-only (e.g. 79.1 GSM8K) and
  adjacent-state-only variants both below full SRD.. Nobody has vouched for
  it; add support or contest it on this page.
