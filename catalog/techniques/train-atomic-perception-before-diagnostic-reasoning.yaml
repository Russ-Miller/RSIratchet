  inference.
description: >-
  LoRA fine-tune the model only on low-level perceptual tasks in the domain
  (tracer identification, image quality, organ recognition, abnormality
  detection), withholding diagnosis cases, then enable chain-of-thought at
  inference. Filed by the drafting stage from Unveiling and Bridging the
  Functional Perception Gap in MLLMs: Atomic Visual Alignment and
  Hierarchical Evaluation via PET-Bench (2601.02737) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Level-5 diagnosis accuracy
  on patients never seen in the atomic-task training split, against the same
  frozen backbone with and without CoT: gains of +1.3 to +8.3 points without
  CoT and +7.6 to +15.9 with CoT across MedGemma-4B, InternVL3-8B,
  Qwen2.5-VL-7B and Lingshu-7B.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [visual-grounding]
