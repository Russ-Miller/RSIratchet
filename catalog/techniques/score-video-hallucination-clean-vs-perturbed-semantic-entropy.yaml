description: >-
  Sample answers from both the original clip and
  photometrically/noise-perturbed variants, cluster answers into semantic
  hypotheses by sentence embeddings, and score reliability by entropy over a
  distribution sharpened by the clean-minus-pert Filed by the drafting stage
  from VideoHEDGE: Entropy-Based Hallucination Detection for Video-VLMs via
  Semantic Clustering and Spatiotemporal Perturbations (2601.08557) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: ROC-AUC
  against LLM-judge binary hallucination labels on 1,460 SoccerChat items,
  compared with Semantic Entropy and RadFlag computed on the same samples;
  VASE highest or near-highest in most model/task/clustering cells, rising
  from ~0.54 at 1 distortion to ~0.62-0.63 at 10.. Nobody has vouched for
  it; add support or contest it on this page.
