id: stop-self-critique-loop-confirmed-sentinel-confidence-tag
ref: TEC-0211
label: "Stop a self-critique loop on a CONFIRMED sentinel, not a con"
summary: >-
  Run generate-critique-revise to a fixed max depth but terminate as soon as
  the critique emits a CONFIRMED token, instead of terminating on the
  model's self-reported numeric confidence.
description: >-
  Run generate-critique-revise to a fixed max depth but terminate as soon as
  the critique emits a CONFIRMED token, instead of terminating on the
  model's self-reported numeric confidence. Filed by the drafting stage from
  Training-Free Inference-Time Self-Reflection and Cost-Bounded Early
  Stopping for Large Language Models (2608.18884) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On BBH the sentinel stopped
  82-88% of items at ~2.1 generations with accuracy unchanged versus
  single-shot and versus fixed-depth Self-Refine (which fell to 71.2%); a
  sweep of confidence thresholds tau in {0.6,0.7,0.8,0.9} halted every item
  at the first generation, so the numeric tag gave no selective working
  point.. Nobody has vouched for it; add support or contest it on this page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
