  Physical Sciences: A Multi-Agent Framework and Comprehensive Benchmark
  (2606.18648) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Overall accuracy on PhySciBench rose from 33.5% (Gemini
  Deep Research) to 41.0%, with per-component ablations of -3.0, -3.0 and
  -2.5 points and an all-three ablation of -6.5 points leaving only a
  1.0-point gap to the baseline; average 23.62% vs 20.87% across HLE, SGI-DR
  and FS-Research physics/chemistry subsets.. Nobody has vouched for it; add
  support or contest it on this page.
