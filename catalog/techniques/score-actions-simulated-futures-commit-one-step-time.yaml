label: "Score actions by simulated futures, commit one step at a tim"
summary: >-
  At each state, the agent expands a bounded set of candidate actions,
  simulates short trajectories (depth ~3), has an LLM score whole
  trajectories by comparison rather than step rewards, propagates those
  returns backward into action values,
description: >-
  At each state, the agent expands a bounded set of candidate actions,
  simulates short trajectories (depth ~3), has an LLM score whole
  trajectories by comparison rather than step rewards, propagates those
  returns backward into action values, Filed by the drafting stage from Why
  Reasoning Fails to Plan: A Planning-Centric Analysis of Long-Horizon
  Decision Making in LLM Agents (2601.22311) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Hits@1 on CWQ, WebQSP and GrailQA
  under two agent frameworks (ToG, PoG) and four backbones (LLaMA 8B/70B,
  GPT-4o-mini/4o), against single-step, beam-search and shallow-lookahead
  variants holding backbone, framework and evaluation signal fixed; plus
  mechanism metrics (first-step trap rate 55.6% single-step vs 17.8%, mean
  first-error step 1.6 vs 3.2, recovery after first error 5.4% vs 29.7%) and
  ALFWorld success (ReAct 61.3% vs 77.8%).. Nobody has vouched for it; add
  support or contest it on this page.
