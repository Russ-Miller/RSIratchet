description: >-
  Evaluate a reasoning-trace hallucination detector twice on the same traces
  — once with the final answer replaced by ground truth and canonicalized,
  once with answer-announcement steps deleted — and treat large AUC shifts
  from the unperturbe Filed by the drafting stage from Sanity Checks for
  Long-Form Hallucination Detection (2605.08346) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Applied across 7 baseline
  scorers x 5 models x 4 benchmarks, reporting AUC under Force vs Remove;
  several baselines shifted by over 20 points (RACE 76.17 Force to 54.67
  Remove on BBH-Tracking/Gemma-3-27B; 24.28 vs 59.01 on GPQA Diamond), while
  NSN sat at chance under Force and rose to 77-80 under Remove on MATH-500.
  A lexical-trajectory scorer (TRACT) computed after answer removal gave
  near-identical scores under both and stayed competitive in absolute AUC..
  Nobody has vouched for it; add support or contest it on this page.
