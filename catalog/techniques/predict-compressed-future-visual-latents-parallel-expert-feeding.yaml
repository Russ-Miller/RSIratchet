description: >-
  A third transformer expert encodes current and past multi-view frames with
  a VAE tokenizer, compresses them to 16 tokens per view, decodes the future
  frame latents in a single non-autoregressive pass, and passes those
  latents as conditionin Filed by the drafting stage from InternVLA-A1:
  Unifying Understanding, Generation and Action for Robotic Manipulation
  (2601.02456) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation removing the generation expert from InternVLA-A1
  (3B) with everything else held fixed: average success over 12 real-world
  tasks fell from 77.0% to 57.6%, with the full model better on 11 of 12
  tasks and the largest drops on the two dynamic tasks; against baselines,
  +4.4% over pi-0.5 on static tasks and +26.7% on dynamic ones, 30 rollouts
  per task.. Nobody has vouched for it; add support or contest it on this
  page.
