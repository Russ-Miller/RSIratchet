description: >-
  Alongside the binary goal check, compute per-trajectory construct scores
  from simulator-logged events — makespan versus an oracle reference,
  precedence-violation rate with a legality gate, shared-resource collision
  rate, and buffer overflow Filed by the drafting stage from CoCoBench: A
  Cooperative Coordination Benchmark for Embodied Multi-Agent Task Planning
  (2608.28266) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Cross-applying all four scoring functions to 897
  GPT-5.6-sol trajectories gave off-diagonal Pearson correlations within
  [-0.10, 0.16], indicating the four scores are largely non-redundant and
  not a re-encoding of binary success; per-model success and legality rates
  diverge in both directions.. Nobody has vouched for it; add support or
  contest it on this page.
