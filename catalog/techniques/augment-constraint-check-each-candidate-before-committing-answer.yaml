  checks the draft against task constraints and admits no fact absent from
  logged observations.
description: >-
  After an incremental reason-act-observe loop, the agent refines coarse
  matches, retries failed or geo-inconsistent calls, and a synthesis step
  checks the draft against task constraints and admits no fact absent from
  logged observations. Filed by the drafting stage from UrbanAgent: A
  Tool-Augmented Agent for Cross-System Urban Tasks (2608.03018) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Task success rate
  on UrbanEval: 0.71 overall vs 0.61 for the best baselines (native
  tool-calling, AutoGen); 64.0% vs 53.5% on the 200 executable queries;
  incomplete-task failures 20 vs 31-45; valid proactive augmentation rate
  0.96 vs 0.84; cost about 3x tokens per success.. Nobody has vouched for
  it; add support or contest it on this page.
