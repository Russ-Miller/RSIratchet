description: >-
  Classifies each response to an unanswerable boundary question as abstain,
  hedge, confident-correct or confident-wrong, computes calibration only on
  substantive answers, and pairs each context-withheld item with a
  restored-document version t Filed by the drafting stage from Do Large
  Language Models Know What They Don't Know II? A Fully Behavioral,
  Non-Cognitive Measure of Epistemic Honesty (2609.07879) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Applied to 42,000
  model-item records across 14 routes; classifier checked against two
  blinded human coders on a stratified 560-response sample (human-human
  kappa .913, classifier-human kappa .414 four-class, .667 binary); matched
  restored-span control gave 96.6% restraint on missing-span and 99.2%
  correct on restored-span, 95.8% passing both sides.. Nobody has vouched
  for it; add support or contest it on this page.
