label: "LoRA critic that verbalizes which parameter is ungrounded"
summary: >-
  A zero-initialized LoRA adapter runs concurrently with the frozen base
  model during tool-call generation and, at an appended trigger token, emits
  a structured label naming the ungrounded parameter, trained with loss
  masked to only that labe
description: >-
  A zero-initialized LoRA adapter runs concurrently with the frozen base
  model during tool-call generation and, at an appended trigger token, emits
  a structured label naming the ungrounded parameter, trained with loss
  masked to only that labe Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: AUROC/F1/AUPRC against an equivalent-scale fine-tuned
  external judge, a linear probe on base hidden states, and token/semantic
  entropy and SEP, on in-distribution (N=303) and ToolAlpaca OOD (N=522)
  sets: 0.966 vs 0.915 (judge) and 0.782 (probe) ID AUROC on Qwen3-4B, 0.925
  OOD; >80% exact parameter-match localization; in a ReAct loop, specific
  feedback gave parameter F1 61.2 vs 51.3 generic and 52.1 no intervention,
  false blocks 2.9% vs 9.4%.. Nobody has vouched for it; add support or
  contest it on this page.
