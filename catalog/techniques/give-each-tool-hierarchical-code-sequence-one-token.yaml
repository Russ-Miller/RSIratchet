id: give-each-tool-hierarchical-code-sequence-one-token
ref: TEC-0683
label: "Give each tool a hierarchical code sequence, not one token"
summary: >-
  Quantize tool-description embeddings with a residual VAE regularized by a
  tool co-occurrence graph, so each tool becomes a short sequence of shared
  codes the LLM is fine-tuned to generate under trie-constrained decoding.
description: >-
  Quantize tool-description embeddings with a residual VAE regularized by a
  tool co-occurrence graph, so each tool becomes a short sequence of shared
  codes the LLM is fine-tuned to generate under trie-constrained decoding.
  Filed by the drafting stage from ToolWeaver: Weaving Collaborative
  Semantics for Scalable Tool Use in Large Language Models (2601.21947) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  NDCG@1/3/5 on ToolBench I1-I3 against BM25, EmbSim, ToolRetriever and the
  one-token-per-tool ToolGen (I3 NDCG@1 88.00 vs 81.00); end-to-end SoPR on
  I3 52.19 vs 36.34; WikiText-2 PPL 25.36 vs 104.54 for ToolGen against a
  6.34 base; ablations on the collaborative weight, components, and four
  alternative tokenization schemes.. Nobody has vouched for it; add support
  or contest it on this page.
