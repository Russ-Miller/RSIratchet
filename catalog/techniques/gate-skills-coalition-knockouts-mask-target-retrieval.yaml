id: gate-skills-coalition-knockouts-mask-target-retrieval
ref: TEC-0129
label: "Gate skills on coalition knockouts, mask on target retrieval"
summary: >-
  At skill-acceptance time, score the candidate bank by averaging Monte
  Carlo coalition knockout margins alongside the outcome reward, and at
  deployment greedily mask transferred skills whose removal raises
  query-memory retrieval similarity o
description: >-
  At skill-acceptance time, score the candidate bank by averaging Monte
  Carlo coalition knockout margins alongside the outcome reward, and at
  deployment greedily mask transferred skills whose removal raises
  query-memory retrieval similarity o Filed by the drafting stage from
  Coalition-Aware Skill Reliability for Self-Evolving Agents (2608.22610)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Matched-protocol comparison against MemSkill and six memory-agent
  baselines: F1 and LLM-judge on LoCoMo/LongMemEval and success rate on
  ALFWorld seen/unseen (e.g. 55.52 vs 54.13 average L-J, 79.66 vs 77.05
  ALFWorld SR); a K-controlled ablation showed the outcome gate's six
  accepted skills were net -1.38 pp; masking improved all six trained banks
  on HotpotQA-50 (+7.17 pp average on MemSkill banks, +3.59 on CASS banks),
  and retrieval-quality scores correlated with label-based skill ranking at
  rho +0.76 versus -0.18 for a policy-entropy signal.. Nobody has vouched
  for it; add support or contest it on this page.
