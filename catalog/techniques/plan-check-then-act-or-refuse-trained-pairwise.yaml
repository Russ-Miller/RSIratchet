description: >-
  Restructures the agent step as plan, optional explicit safety-check block,
  then tool call or a terminal refusal call, and trains the whole loop with
  GRPO where per-trajectory reward comes from an LLM judge comparing pairs
  of rollouts for th Filed by the drafting stage from Learning When to Act
  or Refuse: Guarding Agentic Reasoning Models for Safe Multi-Step Tool Use
  (2603.03205) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Measured against the untrained base model on four
  held-out benchmarks: harmful-task harm score and refusal rate (AgentHarm),
  direct/indirect injection attack success and refusal (ASB), multi-turn
  tool accuracy (BFCL v3), leakage rate (PrivacyLens). Ablations replace the
  safety block with a generic think block and replace pairwise preferences
  with a pointwise scalar reward; both score worse on harm, refusal and
  injection ASR.. Nobody has vouched for it; add support or contest it on
  this page.
