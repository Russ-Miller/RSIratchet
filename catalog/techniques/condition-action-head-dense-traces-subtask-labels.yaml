description: >-
  Supply the low-level action generator with per-frame grounded intermediate
  representations (object/gripper boxes, affordance, end-effector trace)
  instead of, or in addition to, stage-level subtask and skill text. Filed
  by the drafting stage from RoboInter: A Holistic Intermediate
  Representation Suite Towards Robotic Manipulation (2602.09973) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Cumulative
  ablation on a 25k-episode open-loop split: mean Open-Loop Score rose
  0.3086 (no conditioning) to 0.3146 with subtask, 0.3159 adding primitive
  skill, 0.3289 adding object box, 0.3391 adding gripper box, 0.3435 adding
  affordance, and 0.3861 adding trace; ground-truth representations were
  used, so predicted-representation performance is lower.. Nobody has
  vouched for it; add support or contest it on this page.
