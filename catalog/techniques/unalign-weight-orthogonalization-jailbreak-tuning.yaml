id: unalign-weight-orthogonalization-jailbreak-tuning
ref: TEC-0912
label: "Unalign by weight orthogonalization, not jailbreak-tuning"
summary: >-
  Removes refusal behaviour by orthogonalizing each layer's output weights
  against an estimated refusal direction, with no gradient training, instead
  of fine-tuning on harmful samples.
description: >-
  Removes refusal behaviour by orthogonalizing each layer's output weights
  against an estimated refusal direction, with no gradient training, instead
  of fine-tuning on harmful samples. Filed by the drafting stage from
  Understanding the Effects of Safety Unalignment on Large Language Models
  (2604.02574) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: StrongREJECT refusal rates, AutoDAN-Turbo and
  CyberSecEval 3 attack success, TruthfulQA/TofuEval hallucination, and
  seven helpfulness benchmarks, each compared against the aligned base model
  and the jailbreak-tuned variant.. Nobody has vouched for it; add support
  or contest it on this page.
