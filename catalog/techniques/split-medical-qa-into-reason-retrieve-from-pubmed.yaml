  Framework for Medical AI: Leveraging Fine-Tuned GPT, LLaMA, and DeepSeek
  R1 for Evidence-Based and Bias-Aware Clinical Query Processing
  (2602.14158) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
