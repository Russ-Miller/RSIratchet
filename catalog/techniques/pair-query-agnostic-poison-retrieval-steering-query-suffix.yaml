description: >-
  An adversarial probe that appends a fixed suffix naming an attacker-chosen
  target question to any user query, so the retriever surfaces a small set
  of pre-inserted passages keyed on that question, which then supply the
  evidence the generato Filed by the drafting stage from PIDP-Attack:
  Combining Prompt Injection with Database Poisoning Attacks on
  Retrieval-Augmented Generation Systems (2603.25164) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Attack success rate (strict
  substring match on the attacker's answer) against PoisonedRAG, GGPP, GCG,
  Disinformation and corpus-poisoning-only baselines on NQ, HotpotQA and
  MS-MARCO across eight LLMs, with retrieval F1 reported separately to show
  poisoned passages actually entered the top-k; budget sweeps over poison
  count n and context size k.. Nobody has vouched for it; add support or
  contest it on this page.
