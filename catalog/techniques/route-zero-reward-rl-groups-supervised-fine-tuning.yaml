description: >-
  During GRPO training, samples whose whole sampled group earns zero reward
  are buffered and, once a batch accumulates, trained with supervised
  fine-tuning instead, so hard samples still produce gradients when the
  group advantage collapses to Filed by the drafting stage from Captioning
  Daily Activity Images in Early Childhood Education: Benchmark and
  Algorithm (2604.01941) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Compared against baseline, SFT-only and SFT+GRPO on the
  held-out ECAC split: toy-recognition score rose 49.61 to 51.07 with gains
  concentrated in medium/high-precision and background toy categories, while
  an MLLM-judged overall caption score stayed flat (86.59 vs 86.20); a
  separate precision table shows the cost.. Nobody has vouched for it; add
  support or contest it on this page.
