id: steer-caption-sensitive-attention-heads-caption-minus-noncaption
ref: TEC-0524
label: "Steer caption-sensitive attention heads with caption-minus-n"
summary: >-
  Probe attention heads whose last-token visual-only attention output
  distinguishes caption from non-caption queries, then at inference add a
  precomputed averaged output-difference vector to the top-K such heads.
description: >-
  Probe attention heads whose last-token visual-only attention output
  distinguishes caption from non-caption queries, then at inference add a
  precomputed averaged output-difference vector to the top-K such heads.
  Filed by the drafting stage from CAST: Mitigating Object Hallucination in
  Large Vision-Language Models via Caption-Guided Visual Attention Steering
  (2605.04641) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: POPE accuracy/F1 (+5.64/+5.50 avg over regular), CHAIR
  CS/CI down 6.43 points avg, MMHal-Bench score +0.16 and hallucination rate
  -2.95%, against VCD, OPERA, PAI and VTI baselines; MME held or improved;
  latency TTFT/TPOT ~1.0x base vs 1.6-2.7x for VCD/PAI. Nobody has vouched
  for it; add support or contest it on this page.
