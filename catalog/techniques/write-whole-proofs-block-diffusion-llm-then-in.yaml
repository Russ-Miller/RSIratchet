id: write-whole-proofs-block-diffusion-llm-then-in
ref: TEC-0423
label: "Write whole proofs with a block-diffusion LLM, then in-fill "
summary: >-
  Fine-tunes a block-diffusion LLM to write whole Lean 4 proofs, then
  re-masks the failing subgoal's proof body and refills it with a 512-token
  diffusion block so the correction sees both prefix and suffix context.
description: >-
  Fine-tunes a block-diffusion LLM to write whole Lean 4 proofs, then
  re-masks the failing subgoal's proof body and refills it with a 512-token
  diffusion block so the correction sees both prefix and suffix context.
  Filed by the drafting stage from Diffusion-Proof: Recipe for Formal
  Theorem Proving Beyond Auto-Regressive Generation (2606.19315) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: pass@32 on
  MiniF2F-Test (244) and ProofNet-Test (186) against an AR model fine-tuned
  on the identical 300k dataset; ablation shows the corrector alone adds
  1.64% on MiniF2F (4 of 122 problems) and nothing on ProofNet.. Nobody has
  vouched for it; add support or contest it on this page.
