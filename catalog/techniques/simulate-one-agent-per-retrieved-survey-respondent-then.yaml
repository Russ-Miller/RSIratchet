description: >-
  Retrieve ontology-consistent value relations and demographically similar
  survey respondents, instantiate a persona agent per respondent conditioned
  on that respondent's value summary, and have a judgment agent pick the
  answer by evidence gr Filed by the drafting stage from Toward Culturally
  Aligned LLMs through Ontology-Guided Multi-Agent Reasoning (2601.21700)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Binary accuracy on 2,000 sampled items across six regional surveys with
  four backbones, against zero-shot, role prompting, self-consistency,
  multi-agent debate, and ValuesRAG; plus ablations against a single-judge
  variant and a single value-inference-agent variant, and a K sweep over
  1/3/5/10.. Nobody has vouched for it; add support or contest it on this
  page.
