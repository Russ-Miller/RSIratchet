id: match-encoder-s-pre-training-corpus-target-domain
ref: TEC-0097
label: "Match the encoder's pre-training corpus to the target domain"
summary: >-
  Instead of transferring a general-domain-trained hallucination detector,
  fine-tune a domain-pretrained encoder on a small set of in-domain
  claim-evidence pairs.
description: >-
  Instead of transferring a general-domain-trained hallucination detector,
  fine-tune a domain-pretrained encoder on a small set of in-domain
  claim-evidence pairs. Filed by the drafting stage from Domain-Specific
  Hallucination Detection in Large Language Models (2609.11878) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: On 106 SciFact
  test examples: PubMedBERT fine-tuned on SciFact reached F1 0.627 / AUROC
  0.808, versus HaluEval-trained DeBERTa zero-shot (0.517 / 0.515), DeBERTa
  fine-tuned on SciFact (0.488 / 0.582), and HaluEval-then-SciFact
  sequential transfer (0.533 / 0.610).. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [domain-knowledge]
kind: training
sources: [arxiv-2609-11878]
status: proposed
