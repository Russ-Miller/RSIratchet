id: commit-only-one-answer-dominates-all-adapters-probability
ref: TEC-0103
label: "Commit only when one answer dominates all adapters' probabil"
summary: >-
  Treat an ensemble of LoRA adapters as a credal set, bound each candidate
  answer's probability by the min and max across adapters, and answer only
  when a single candidate survives interval dominance, otherwise return the
  surviving set.
description: >-
  Treat an ensemble of LoRA adapters as a credal set, bound each candidate
  answer's probability by the min and max across adapters, and answer only
  when a single candidate survives interval dominance, otherwise return the
  surviving set. Filed by the drafting stage from Credal Large Language
  Models for Semantic Commitment under Uncertainty (2608.23244) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: AUROC for
  detecting the model's own errors and corrupted inputs, accuracy at 80%
  coverage, ECE/NLL, commit rate and accuracy-when-committed, against
  standard LLM entropy, semantic entropy, Laplace/Bayesian-LoRA and the same
  adapters mean-pooled, on CoQA, TriviaQA, OpenBookQA, ARC-Challenge,
  AdvBench across three backbones.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [abstention-and-self-knowledge]
kind: decoding
