id: pick-lowest-entropy-model-s-answer-majority
ref: TEC-0354
label: "Pick the lowest-entropy model's answer, not the majority"
summary: >-
  Across several models each sampled multiple times, compute per-model
  normalized entropy over the answer distribution and output the top-1
  answer of the least uncertain model instead of counting votes.
description: >-
  Across several models each sampled multiple times, compute per-model
  normalized entropy over the answer distribution and output the top-1
  answer of the least uncertain model instead of counting votes. Filed by
  the drafting stage from Diversity Matters: Revisiting Test-Time Compute in
  Vision-Language Models (2605.30713) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy on six multiple-choice
  visual QA benchmarks (MathVista, MathVision, TQA, ScienceQA, MMStar, MMMU)
  against majority voting over the same outputs and against each individual
  model: average 66.56% vs 63.75% voting for four similar-sized cross-family
  models, and 71.68% vs 68.84% voting and 69.90% for the best single model
  in a 3B-72B Qwen ensemble; also tested on ARC-Easy and MMLU-Pro with
  text-only models.. Nobody has vouched for it; add support or contest it on
  this page.
