id: ask-about-generic-ai-agent-model-itself
ref: TEC-0091
label: "Ask about a generic AI agent, not the model itself"
summary: >-
  Replace first-person self-prediction questions with the same item-informed
  question about a capable AI agent in general, or use other measured models
  as the predictor, to remove the self-flattering bias without losing
  accuracy.
description: >-
  Replace first-person self-prediction questions with the same item-informed
  question about a capable AI agent in general, or use other measured models
  as the predictor, to remove the self-flattering bias without losing
  accuracy. Filed by the drafting stage from Strangers to Themselves: What
  Language Models Say About Themselves Is Generic (2609.09899) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Generic-subject
  item-informed questions scored r=+0.28 vs +0.24 for self-prediction
  (paired difference -0.03 [-0.10,+0.03]), with signed bias on harm-valenced
  evaluations shifted -0.15 for self-framed abstract reports; cross-model
  behavior mean, which never queries the model, reached +0.53.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [abstention-and-self-knowledge]
kind: prompting
sources: [arxiv-2609-09899]
status: proposed
