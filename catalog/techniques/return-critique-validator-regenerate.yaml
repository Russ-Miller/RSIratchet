id: return-critique-validator-regenerate
ref: TEC-0372
label: "Return a critique from the validator and regenerate"
summary: >-
  A separate validator model judges a generated solution and, when it fails,
  emits a critique that is fed back for a fresh generation attempt over up
  to three rounds.
description: >-
  A separate validator model judges a generated solution and, when it fails,
  emits a critique that is fed back for a fresh generation attempt over up
  to three rounds. Filed by the drafting stage from Critic-Guided
  Heterogeneous Multi-Agent Reasoning for Reliable Mathematical Problem
  Solving (2606.05704) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Eight configurations on the full 1,319-item GSM8K test
  set, crossing validator size/heterogeneity with critique on/off:
  72.55-80.14% without critique vs 85.44-93.56% with it, with per-round pass
  counts reported.. Nobody has vouched for it; add support or contest it on
  this page.
