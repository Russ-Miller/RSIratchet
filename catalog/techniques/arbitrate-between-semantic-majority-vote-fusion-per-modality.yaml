id: arbitrate-between-semantic-majority-vote-fusion-per-modality
ref: TEC-0591
label: "Arbitrate between semantic and majority-vote fusion of per-m"
summary: >-
  Run one LLM agent per sensor modality, then have a semantic fusion agent
  reason over all rationales, a statistical fusion agent justify the
  majority-voted label, and a final agent pick between the two in a single
  round.
description: >-
  Run one LLM agent per sensor modality, then have a semantic fusion agent
  reason over all rationales, a statistical fusion agent justify the
  majority-voted label, and a final agent pick between the two in a single
  round. Filed by the drafting stage from ConSensus: Multi-Agent
  Collaboration for Multimodal Sensing (2601.06453) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Accuracy on five sensing
  benchmarks against a single-agent concatenated-feature prompt (+7.1%
  average), self-consistency, self-refine, and four multi-agent debate
  methods (matches best debate baseline ReConcile, 72.3% vs 72.7%, at 12.7x
  fewer fusion tokens); robustness measured under 10/30/50% random modality
  omission, where hybrid beats statistical-only fusion by 9.1 and 18.4
  points at 30% and 50%.. Nobody has vouched for it; add support or contest
  it on this page.
