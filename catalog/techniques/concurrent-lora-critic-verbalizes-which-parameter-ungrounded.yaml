description: >-
  A zero-initialized LoRA adapter runs alongside the frozen base model
  during tool-call generation, with loss only on a trigger token and label,
  and emits a localized diagnostic such as 'ungrounded: date' that the
  harness injects as feedback Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: 0.966 AUROC and >80% exact-parameter localization
  in-distribution on Qwen3-4B versus 0.915 for an equivalent-scale
  fine-tuned external judge, 0.782 for a linear probe, and ~0.64-0.67 for
  entropy baselines; 0.925 AUROC out of distribution on ToolAlpaca;
  replicated on Llama-xLAM-2-8B (0.926 vs 0.833 probe ID); in a ReAct loop,
  specific feedback gave parameter F1 61.2 vs 52.1 base and 51.3
  generic-block, with false blocks 2.9% vs 9.4%.. Nobody has vouched for it;
  add support or contest it on this page.
