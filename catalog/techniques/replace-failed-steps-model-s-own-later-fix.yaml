description: >-
  During rollout collection, when code execution fails and a subsequent
  retry succeeds, roll the trajectory back to the failure point and graft in
  the corrected code — keeping the original reasoning when the two code
  versions are textually si Filed by the drafting stage from CLEANER:
  Self-Purified Trajectories Boost Agentic Reinforcement Learning
  (2601.15141) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Compared against a DAPO baseline with identical
  configuration minus the mechanism, on AIME24/25, GPQA and LiveCodeBench v6
  with Qwen3-4B-Instruct and Qwen2.5-7B-Instruct; reported average gains ~6%
  on AIME, 3-4% on GPQA, 5% on LiveCodeBench, and parity with DemyAgent-4B
  at 250 vs 750 RL steps. Tracked per-trajectory erroneous tool-call counts
  during training.. Nobody has vouched for it; add support or contest it on
  this page.
