description: >-
  A small refiner model (SFT plus DPO on verbose-to-concise patch pairs with
  distilled reasoning traces) is plugged in after an existing repair
  framework's patch generation to rewrite the candidate patch into a smaller
  one, with optional judg Filed by the drafting stage from Refine After
  Generation: Toward Correct and Concise Patches in LLM-based Program Repair
  (2608.13292) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: On SWE-bench Verified across four host systems
  (Agentless, SWE-agent, Moatless, OpenHands), average total changes
  relative to developer patches fell from +242.14% to +4.24% and net changes
  from +348.24% to -39.75%, while resolved instances were preserved or
  improved by up to +42; prompting Claude-4.5-Sonnet, Atomizer untangling,
  AdaPatcher and PRepair all shrank patches only by losing 29-217 resolved
  instances. Ablation: SFT alone over-compresses (resolves 276 avg, below
  the untrained 293); DPO restores 332.. Nobody has vouched for it; add
  support or contest it on this page.
