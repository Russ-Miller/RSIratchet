description: >-
  A separately fine-tuned critic model scores each candidate action for
  feasibility and goal progress, rejecting it below a threshold and
  returning a natural-language diagnostic that forces the actor to
  regenerate before anything touches the Filed by the drafting stage from
  Reward-Driven LLM Agent Workflows: Synthesizing POMDP Routing and
  Self-Correction for Autonomous Decision-Making (2607.17038) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Task success rate,
  average steps and a custom hallucination-error rate on 500 ALFWorld and
  500 WebShop episodes against zero-shot Base-LLM and standard ReAct with
  the same 8B backbone, plus ablations removing the critic and the graph
  memory (78.6% vs 61.2% vs 54.1% on ALFWorld).. Nobody has vouched for it;
  add support or contest it on this page.
