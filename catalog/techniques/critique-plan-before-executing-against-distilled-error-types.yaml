label: "Critique the plan before executing it, against distilled err"
summary: >-
  Before any action, a reflector checks the generated plan against three
  distilled planning-error types mined from past success/failure trajectory
  pairs and rewrites the plan, re-invoking the same check whenever execution
  stalls and triggers
description: >-
  Before any action, a reflector checks the generated plan against three
  distilled planning-error types mined from past success/failure trajectory
  pairs and rewrites the plan, re-invoking the same check whenever execution
  stalls and triggers Filed by the drafting stage from PreFlect: From
  Retrospective to Prospective Reflection in Large Language Model Agents
