  validated it by: pass@1 on GAIA validation (46.06 to 58.18 with GPT-4.1 on
  Smolagents; 50.30 to 60.61 on OWL) and SimpleQA
  correct/correct-given-attempted, against Reflexion and Self-Refine under
  identical tools and step budgets; ablations remove the distilled error set
  (-7.9 total) and dynamic re-planning (-6.7).. Nobody has vouched for it;
  add support or contest it on this page.
