id: coordinate-hypothesis-agents-generational-genetic-algorithm
ref: TEC-0107
label: "Coordinate hypothesis agents with a generational genetic alg"
summary: >-
  Specialized LLM agents generate, pairwise-score and semantically recombine
  or mutate structured hypotheses, with a genetic algorithm doing tournament
  parent selection and joint parent-offspring truncation to a fixed
  population.
description: >-
  Specialized LLM agents generate, pairwise-score and semantically recombine
  or mutate structured hypotheses, with a genetic algorithm doing tournament
  parent selection and joint parent-offspring truncation to a fixed
  population. Filed by the drafting stage from HypoEvolve: Genetic
  Algorithms Enable Multi-Agent LLMs to Discover Scientific Hypotheses
  (2609.15938) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean DepMap selectivity 0.171 and Open Targets
  association 0.426 versus 0.115/0.329 for the strongest of six task-matched
  baselines (Tree of Thoughts) and 0.039/0.163 for single-pass generation,
  on 26 and 29 shared cancer types with the selected hypothesis chosen
  before external scoring; gains repeated on 27 held-out cancer types..
  Nobody has vouched for it; add support or contest it on this page.
