description: >-
  Learn a unit hallucination direction by jointly training a classifier on
  the projection of the hidden state onto it and an adversary, via a
  gradient reversal layer, that is prevented from predicting the same label
  from the orthogonal residu Filed by the drafting stage from Adversarial
  Orthogonal Disentanglement for LVLM Hallucination Mitigation (2605.25377)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  POPE/AMBER/CHAIR/HallusionBench plus four utility benchmarks on three
  LVLMs against VCD, ASD, TruthPrInt, VASparse, PruneHal; the \u03bb=0
  ablation (equivalent to a plain linear probe) is reported as giving
  suboptimal mitigation and utility loss, with \u03bb=1.0 best. Nobody has
  vouched for it; add support or contest it on this page.
