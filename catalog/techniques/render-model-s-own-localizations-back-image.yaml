id: render-model-s-own-localizations-back-image
ref: TEC-0653
label: "Render the model's own localizations back as an image"
summary: >-
  The model emits pixel-level coordinates for each data point, those
  coordinates are drawn as markers on the original image, and the edited
  image is fed back to the same model to confirm or correct before a second
  pass parses values.
description: >-
  The model emits pixel-level coordinates for each data point, those
  coordinates are drawn as markers on the original image, and the edited
  image is fed back to the same model to confirm or correct before a second
  pass parses values. Filed by the drafting stage from Visual Self-Refine: A
  Pixel-Guided Paradigm for Accurate Chart Parsing (2602.16455) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: SCRM average
  precision on ChartP-Bench against the same model without the
  visual-feedback loop (38.41 vs 36.54 average, with the hard subset 37.66
  vs 35.14), plus per-round counts: 110 error charts fall to 51 after one
  round with 92.3% error recall and 88.2% precision on confirming
  already-correct localizations; later rounds leave the error count roughly
  flat. Cost rises from 1 to at least 3 forward passes.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [self-repair]
