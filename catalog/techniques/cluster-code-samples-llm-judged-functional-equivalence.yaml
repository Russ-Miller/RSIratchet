label: "Cluster code samples by LLM-judged functional equivalence"
summary: >-
  Replaces the NLI entailment step in semantic-entropy-style uncertainty
  scoring with an LLM asked whether two code snippets produce the same
  output for all valid inputs, then scores confidence from the resulting
  cluster distribution.
description: >-
  Replaces the NLI entailment step in semantic-entropy-style uncertainty
  scoring with an LLM asked whether two code snippets produce the same
  output for all valid inputs, then scores confidence from the resulting
  cluster distribution. Filed by the drafting stage from Functional Entropy:
  Predicting Functional Correctness in LLM-Generated Code with Uncertainty
  Quantification (2605.28500) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: AUROC for ranking functionally correct over
  incorrect code on LiveCodeBench (1,055 Python), MultiPL-E Java (386),
  LiveSQLBench (270), against NLI-based semantic entropy and sets,
  token-probability scores, embedding and CodeBLEU similarity, P(True) and
  verbalized confidence; functional methods top AUROC in 11 of 15
  model-benchmark cells, NLI clustering near chance (0.47-0.58) versus
  functional entropy up to 0.86 Python and 0.84 SQL; cluster purity against
  execution exceeded 93%.. Nobody has vouched for it; add support or contest
  it on this page.
