id: extract-structural-evidence-before-judging-code-smells
ref: TEC-0267
label: "Extract structural evidence before judging code smells"
summary: >-
  The prompt marks the user's assertion as an unverified external claim and
  makes the model fill a per-smell structural-indicator checklist before
  mapping the counted indicators to a severity verdict.
description: >-
  The prompt marks the user's assertion as an unverified external claim and
  makes the model fill a per-smell structural-indicator checklist before
  mapping the counted indicators to a severity verdict. Filed by the
  drafting stage from Mitigating LLM Sycophancy in Code Smell Detection
  Using Evidence-Guided Reasoning Prompts (2607.10411) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Decision Flip Rate and
  False Alignment Rate against three biased prompt framings, plus
  precision/recall/F1 against MLCQ labels and a lexical share of structural
  vs sycophantic vocabulary; no ablation separating the 'unverified claim'
  warning from the checklist.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [sycophancy]
kind: prompting
sources: [arxiv-2607-10411]
status: proposed
