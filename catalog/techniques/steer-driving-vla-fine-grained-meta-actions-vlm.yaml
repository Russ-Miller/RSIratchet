id: steer-driving-vla-fine-grained-meta-actions-vlm
ref: TEC-0834
label: "Steer a driving VLA with fine-grained meta-actions from a VL"
summary: >-
  A fine-tuned VLM reads camera, ego-state history and routing command,
  emits a reasoning trace and a motion-detailed meta-action (intensity and
  direction, not just 'turn left'), and the low-level action policy is
  conditioned on the meta-acti
description: >-
  A fine-tuned VLM reads camera, ego-state history and routing command,
  emits a reasoning trace and a motion-detailed meta-action (intensity and
  direction, not just 'turn left'), and the low-level action policy is
  conditioned on the meta-acti Filed by the drafting stage from SteerVLA:
  Steering Vision-Language-Action Models in Long-Tail Driving Scenarios
  (2602.08440) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Closed-loop CARLA driving score on Bench2Drive: 90.71 vs
  85.94 for SimLingo (+4.77), +8.04 on an 11-scenario long-tail subset;
  ablation separates the hierarchy (85.94 to 88.81) from the refined
  meta-action and reasoning labels (88.81 to 90.71).. Nobody has vouched for
  it; add support or contest it on this page.
