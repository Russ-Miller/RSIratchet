description: >-
  A planner agent decomposes an instruction into templated subtasks, and an
  executor agent carries each one out either by generating a single Python
  program against the robot API or by issuing step-by-step tool calls, with
  the mode chosen to Filed by the drafting stage from ALRM: Agentic LLM for
  Robotic Manipulation (2601.19510) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Average success rate and latency over
  56 instructions for ten models in both modes: Claude-4.1-Opus 93.5% (TaP)
  vs 92.6% (CaP); Falcon-H1-7B 84.3% (CaP) vs 14.8% (TaP); Llama-3.1-8B
  68.5% vs 3.7%; Granite-3.3-8B and Mistral-7B 0% under TaP. No ablation
  separating planner prompt from executor mode.. Nobody has vouched for it;
  add support or contest it on this page.
