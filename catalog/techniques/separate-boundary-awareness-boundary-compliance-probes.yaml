description: >-
  Ask the same role-played model a binary question about whether a target is
  inside the character's knowledge boundary, then separately ask a concrete
  factual multiple-choice question with an abstention option, and pair the
  two outcomes per i Filed by the drafting stage from CHARM: Character
  Hallucination for Multicultural Role Play Benchmark (2609.01352) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Applied
  to 680 awareness and 1,332 compliance items across six models;
  compliance-gap rate exceeded recognition-failure rate for every model
  (e.g. GPT-4o 91.3% awareness accuracy, 18.9% compliance accuracy, 72.1%
  gap vs 8.9% recognition failure), and a knowledge-verification probe
  confirmed 78-100% of factually correct gap cases in five of six models as
  parametric overrides.. Nobody has vouched for it; add support or contest
  it on this page.
