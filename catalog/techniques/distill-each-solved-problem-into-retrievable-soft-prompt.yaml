label: "Distill each solved problem into a retrievable soft-prompt m"
summary: >-
  After answering each streamed problem, train a 20-token soft prompt for a
  few GRPO steps using majority-vote self-rewards, store it keyed by input
  embedding, and on future inputs retrieve the nearest memory and let a
  verifier pick between t
description: >-
  After answering each streamed problem, train a 20-token soft prompt for a
  few GRPO steps using majority-vote self-rewards, store it keyed by input
  embedding, and on future inputs retrieve the nearest memory and let a
  verifier pick between t Filed by the drafting stage from Continual
  Self-Improvement with Lightweight Experiential Latent Memories
  (2606.17803) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Greedy pass@1 against zero-shot CoT, raw-trace ICL,
  Reasoning Bank, LAG, and offline full-model GRPO/TTRL on MATH500, AMC23,
  AIME24; e.g. Qwen AMC23 50 to 62.5, Llama MATH500 45 to 51.4, while ICL
  baselines fell below zero-shot on several cells.. Nobody has vouched for
  it; add support or contest it on this page.
