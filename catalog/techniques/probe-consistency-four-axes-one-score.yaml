label: "Probe consistency on four axes, not one score"
summary: >-
  Convert a binary question into an affirmative and a contradictory
  statement, re-ask each under semantically equivalent image transformations
  and paraphrases to form four consistency groups, and train a lightweight
  classifier on 14 within-gr
