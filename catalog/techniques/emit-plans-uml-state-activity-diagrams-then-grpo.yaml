description: >-
  The model outputs PlantUML class-diagram state abstraction inside <think>
  and a PlantUML activity-diagram plan inside <answer>, initialized by SFT
  on 1k expert diagrams and then refined by GRPO whose reward is the
  partition-wise embedding s Filed by the drafting stage from OOWM:
  Structuring Embodied Reasoning and Planning via Object-Oriented
  Programmatic World Modeling (2604.09580) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: On 1,000 held-out MRoom-30k
  instances, similarity 0.5694, recall 0.6744, F1 0.5904 versus text-CoT
  baseline 0.5498 / 0.6280 / 0.5811 and Graph-of-Thoughts 0.5383 / 0.5579 /
  0.5371; text baseline retained the highest precision (0.5489 vs 0.5326).
  Ablation: skipping SFT and running GRPO alone fails to converge at all..
  Nobody has vouched for it; add support or contest it on this page.
