label: "Feed raw frames and segmentation masks together, not masks a"
summary: >-
  Supplies the model with both the original video frames and the
  corresponding dynamic-object segmentation masks as a fused visual input,
  rather than replacing frames with mask-overlaid versions.
description: >-
  Supplies the model with both the original video frames and the
  corresponding dynamic-object segmentation masks as a fused visual input,
  rather than replacing frames with mask-overlaid versions. Filed by the
  drafting stage from Thinking in Dynamics: How Multimodal Large Language
  Models Perceive, Track, and Reason Dynamics in Physical 4D World
  (2603.12746) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Multiple-choice accuracy on Dyn-Bench with Qwen3-VL-8B:
  raw video 53.8 avg, masked frames only 53.8, mask-guided fusion 57.1, with
  the largest gains on inter-object (38.9 to 41.8) and camera-object (55.6
  to 60.0).. Nobody has vouched for it; add support or contest it on this
  page.
