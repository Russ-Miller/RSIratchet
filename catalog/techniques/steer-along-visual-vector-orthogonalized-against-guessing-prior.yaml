description: >-
  Extracts a visual-information direction by subtracting blind-state from
  image-conditioned hidden states, Gram-Schmidt-projects it off the no-image
  hallucination-minus-refusal direction, and adds it at one
  calibration-selected layer only whe Filed by the drafting stage from
  Revis: Sparse Latent Steering to Mitigate Object Hallucination in Large
  Vision-Language Models (2602.11824) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: POPE accuracy/recall/F1 and
  CHAIR_S/CHAIR_I against greedy decoding, VCD, M3ID, ONLY, AGLA and VTI;
  utility checked on MME, MM-Vet, MMMU-Pro. On Qwen2.5-VL CHAIR_S 31.00 to
  25.00 with MM-Vet 70.18 to 72.16, where VTI reached 9.00 CHAIR_S but
  dropped MM-Vet to 56.38. Ablations: removing the threshold caused collapse
  on LLaVA-1.5 and raised CHAIR_S on LLaVA-NeXT; shallow-layer injection was
  both less effective and harmful to MM-Vet. Latency 0.025s per token, equal
  to plain decoding.. Nobody has vouched for it; add support or contest it
  on this page.
