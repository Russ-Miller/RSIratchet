description: >-
  Maintain a requirement-level and component-level DAG plus their alignment,
  and apply split/merge/revise actions triggered by cohesion and coupling
  thresholds until no action fires, then generate code against the converged
  architecture. Filed by the drafting stage from Repo0: Design-Driven
  Zero-to-All Code Generation (2608.19854) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Functionality Coverage, Pass Rate and
  Voting Rate on three representative RepoCraft repositories against
  mini-SWE-agent, Paper2Code and RPG with a shared code-generation scaffold;
  on statsmodels with GPT-5 mini the metrics-guided loop beat no-evolution
  (coverage 75.90 to 80.68, pass 81.90 to 85.51) and all 1/3/5-round
  LLM-decided variants; ablation removing structural evolution cost up to
  13.33 pass-rate points.. Nobody has vouched for it; add support or contest
  it on this page.
