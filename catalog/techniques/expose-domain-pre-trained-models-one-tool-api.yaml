description: >-
  Wraps heterogeneous domain pre-trained models as stateless
  feature-extraction endpoints with declarative input specs, and has a
  planner rank candidates from the dataset's modality, channel count,
  sampling rate and class balance before code Filed by the drafting stage
  from NS-Copilot: An LLM-Driven Agent System for Autonomous Neuroscience
  Analysis (2609.01971) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Primary metric (macro F1 or balanced accuracy) over 8
  trials against general agents, scientific agents and two single-shot LLM
  coding baselines; plus a 'Vanilla' arm (same architecture, pre-trained
  models removed), whose initial round scored below Codex on AD (49.80 vs
  51.01) and PD (64.52 vs 65.52), and a held-out fixed-model comparison on
  WM (POYO-1 +6.82 pp over handcrafted features, better on 7 of 8 seeds)..
  Nobody has vouched for it; add support or contest it on this page.
