id: mix-few-reversed-video-rollouts-into-each-grpo
ref: TEC-0151
label: "Mix a few reversed-video rollouts into each GRPO group"
summary: >-
  During RL post-training of a video MLLM, sample most rollouts on the
  forward video and one on the time-reversed video in the same group, so
  group-relative advantage rewards using motion direction.
description: >-
  During RL post-training of a video MLLM, sample most rollouts on the
  forward video and one on the time-reversed video in the same group, so
  group-relative advantage rewards using motion direction. Filed by the
  drafting stage from COMET: Contrastive Motion-Enhanced Temporal Reasoning
  for Video Multimodal Large Language Models (2608.21030) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Same Stage-I
  checkpoint on Qwen3-VL-8B: average accuracy over six benchmarks 78.8 for 6
  forward + 1 reversed vs 78.0 for 7 forward + 0 reversed, 78.4 for 5+2,
  77.6 for 4+3; action tasks +4.9 pp and reasoning +2.1 pp over BL-GRPO,
  PerceptionTest -0.4 pp.. Nobody has vouched for it; add support or contest
  it on this page.
addresses: [video-temporal-reasoning]
kind: training
sources: [arxiv-2608-21030]
status: proposed
