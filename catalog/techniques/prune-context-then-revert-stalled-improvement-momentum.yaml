  Enabling Progress-Aware Consistent Evolution (2601.10657) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Log10 NMSE
  distribution (best, P75, mean, worst) over 10 runs of 1000 iterations on
  LLM-SR nonlinear oscillators against uDSR, LLM-SR, OpenEvolve, CodeEvolve
