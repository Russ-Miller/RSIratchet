id: weight-peers-cognitive-snr-divergence
ref: TEC-0306
label: "Weight peers by cognitive SNR, not by divergence"
summary: >-
  Each incoming agent message is weighted by the sender's asserted belief
  precision divided by the KL divergence between its reported belief and
  what the receiver's second-order model predicts a peer with that telemetry
  access should have rep
description: >-
  Each incoming agent message is weighted by the sender's asserted belief
  precision divided by the KL divergence between its reported belief and
  what the receiver's second-order model predicts a peer with that telemetry
  access should have rep Filed by the drafting stage from Agents That Model
  Agents: Five Principles Toward a Theory of Mind for 6G Networks
  (2609.01779) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ranking the four peers at storm onset averaged over 80
  rounds: cognitive SNR gave AUC 1.000 for identifying the single correct
  peer while a divergence gate gave AUC 0.000; the correct peer scored +7.8
  dB against -4.3 dB for the miscalibrated one, a ~13x trust-weight
  advantage. Recursion-depth sweep: depth 2 recovered the correct action in
  every trial (accuracy 1.000) vs 0.050 at depth 1 and 0.083 at depth 3..
  Nobody has vouched for it; add support or contest it on this page.
