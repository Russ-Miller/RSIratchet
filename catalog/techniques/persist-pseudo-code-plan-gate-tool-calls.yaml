id: persist-pseudo-code-plan-gate-tool-calls
ref: TEC-0091
label: "Persist a pseudo-code plan and gate tool calls to it"
summary: >-
  Before any action, the agent emits an ordered pseudo-code sequence of tool
  calls, stores it in scratchpad memory for the whole episode, and each
  subsequent invocation is restricted to the tool the plan names for that
  step unless replanning
description: >-
  Before any action, the agent emits an ordered pseudo-code sequence of tool
  calls, stores it in scratchpad memory for the whole episode, and each
  subsequent invocation is restricted to the tool the plan names for that
  step unless replanning Filed by the drafting stage from Bridging Thought
  and Action: Taming Long-Horizon Instability in Open-Source LLM Agents with
  a MetaTool-Enhanced ROS Framework (2609.13335) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Four-way ablation (prompting,
  transient plan, persistent plan, persistent plan plus constraint) across
  three task levels and four models, 20 trials each; plus 40 physical-robot
  trials showing repeated tool calls 19.0% to 6.1% and invalid calls 21.7%
  to 8.1% versus vanilla ROSA, and 30/40 success versus 23/40 for ROSA,
  20/40 CaP, 17/40 ReAct.. Nobody has vouched for it; add support or contest
  it on this page.
