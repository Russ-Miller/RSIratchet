id: prompt-noise-clips-plus-conservative-descriptions
ref: TEC-0521
label: "Prompt with noise clips plus conservative descriptions"
summary: >-
  Retrieves the acoustically most similar synthetic broadband-noise clips,
  each paired with a non-committal acoustics-level caption, and prepends
  them as in-context examples so the model hedges when acoustic evidence is
  weak.
description: >-
  Retrieves the acoustically most similar synthetic broadband-noise clips,
  each paired with a non-committal acoustics-level caption, and prepends
  them as in-context examples so the model hedges when acoustic evidence is
  weak. Filed by the drafting stage from Noise-Aware In-Context Learning for
  Hallucination Mitigation in ALLMs (2604.09021) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Hallucination rate on the
  1,000-sample Clotho-1K benchmark fell from 26.53% to 16.98% for
  Qwen2.5-Omni-7B, versus 27.54% for real-audio in-context examples;
  ablations varied shot count, noise duration, retrieval and description
  structure, and keyword-frequency counts showed fewer event/definite terms
  and more acoustic terms.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [hallucination]
kind: prompting
sources: [arxiv-2604-09021]
status: proposed
