id: accept-or-reject-each-generated-unit-semantic-gain
ref: TEC-0241
label: "Accept or reject each generated unit by semantic gain agains"
summary: >-
  Treat the LLM as a proposal distribution over sequence units and accept
  each unit with probability tied to its marginal mutual-information gain
  from clustering a trusted context set around it, re-prompting after
  rejection.
description: >-
  Treat the LLM as a proposal distribution over sequence units and accept
  each unit with probability tied to its marginal mutual-information gain
  from clustering a trusted context set around it, re-prompting after
  rejection. Filed by the drafting stage from Chain-based Adaptive
  Reconfiguration Over Lattices for Hallucination Reduction (2605.27706)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy, hallucination rate, latency and dollar cost versus a standard
  RAG pipeline on TruthfulQA, HaluEval and HotPotQA with two backbones;
  accuracy rose (e.g. 0.356 to 0.556 on TruthfulQA with GPT-5-nano) and cost
  fell, while latency rose.. Nobody has vouched for it; add support or
  contest it on this page.
