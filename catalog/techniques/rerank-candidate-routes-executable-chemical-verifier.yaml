id: rerank-candidate-routes-executable-chemical-verifier
ref: TEC-0320
label: "Rerank candidate routes with an executable chemical verifier"
summary: >-
  Take any backbone's top-10 candidate disconnections and reorder them by
  rule-based checks for functional-group competition, mechanistic
  plausibility and literature precedent, promoting unflagged routes above
  high-confidence flagged ones.
description: >-
  Take any backbone's top-10 candidate disconnections and reorder them by
  rule-based checks for functional-group competition, mechanistic
  plausibility and literature precedent, promoting unflagged routes above
  high-confidence flagged ones. Filed by the drafting stage from SureRoute:
  Toward a Hallucination-Free Self-Improving Platform for Retrosynthesis
  (2609.05450) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Expert-annotated top-1 chemical hallucination rate on 350
  industrial targets fell from 14.3-27.4% to 0-6.9% across ten backbones,
  and top-1 recall rose from 53.1% (plain ensemble) to 74.3%; but the
  post-rerank hallucination figure is measured by the same verifier that
  does the reranking, so it is partly definitional, and no independent
  held-out verifier or wet-lab check is reported.. Nobody has vouched for
  it; add support or contest it on this page.
