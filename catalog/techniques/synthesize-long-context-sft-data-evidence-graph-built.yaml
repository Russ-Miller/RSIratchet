description: >-
  Match documents to one of 32 fine-grained long-context task types, extract
  candidate evidence spans and their cross-paragraph dependency edges into a
  minimal sufficient graph, then generate the instruction from that graph
  and a response tha Filed by the drafting stage from LongCrafter: Towards
  Diverse Long-Context Understanding via Evidence-Graph-Guided Instruction
  Synthesis (2607.06160) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Average over LongBench, LongBench v2 and LooGLE: 45.15
  (Qwen2.5-7B) and 45.71 (LLaMA-3.1-8B), +5.80/+5.30 over the best of four
  SFT baselines at matched 2,000 samples and above the official post-trained
  models; ablations drop 12.64/11.89 points without the evidence graph and
  5.25/4.08 without citations; position probe shows flat retrieval accuracy
  across positions 1-20.. Nobody has vouched for it; add support or contest
  it on this page.
