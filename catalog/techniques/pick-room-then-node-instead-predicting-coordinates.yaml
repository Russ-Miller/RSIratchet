id: pick-room-then-node-instead-predicting-coordinates
ref: TEC-0636
label: "Pick a room, then a node, instead of predicting coordinates"
summary: >-
  Discretize a top-down map into segmented rooms and Poisson-disk-sampled
  navigable nodes, then query the MLLM twice — first to choose the target
  room, then the node within it — and hand that waypoint to a deterministic
  planner.
description: >-
  Discretize a top-down map into segmented rooms and Poisson-disk-sampled
  navigable nodes, then query the MLLM twice — first to choose the target
  room, then the node within it — and hand that waypoint to a deterministic
  planner. Filed by the drafting stage from ReasonNavi: Human-Inspired
  Global Map Reasoning for Zero-Shot Embodied Navigation (2602.15864) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Ablation
  on HM3D ObjNav success rate and SPL: direct coordinate prediction 12.3 SR
  / 6.13 SPL, single-stage global node selection 44.5 / 23.1, two-stage
  room-then-node 55.1 / 29.6, same backbone throughout.. Nobody has vouched
  for it; add support or contest it on this page.
