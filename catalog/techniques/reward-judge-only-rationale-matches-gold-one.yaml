id: reward-judge-only-rationale-matches-gold-one
ref: TEC-0824
label: "Reward the judge only when its rationale matches the gold on"
summary: >-
  During RL training of a generative reward model, grant reward only when
  both the preference label is correct and a separate meta-judge verifies
  the generated rationale covers the key discriminators of a gold reference
  rationale.
description: >-
  During RL training of a generative reward model, grant reward only when
  both the preference label is correct and a separate meta-judge verifies
  the generated rationale covers the key discriminators of a gold reference
  rationale. Filed by the drafting stage from R-Align: Enhancing Generative
  Reward Models through Rationale-Centric Meta-Judging (2602.06763) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Spurious-correctness rate and rationale-consistent accuracy on three
  repurposed RM benchmarks against the base model and an outcome-reward RLVR
  baseline (e.g. 14B HelpSteer3 F-Score 44.5 base, 40.1 RLVR, 54.0 R-Align),
  plus downstream actor average across STEM, code, instruction-following and
  general suites (59.4 RLVR vs 61.7 R-Align at 14B).. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [critique]
