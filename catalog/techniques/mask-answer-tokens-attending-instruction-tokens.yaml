id: mask-answer-tokens-attending-instruction-tokens
ref: TEC-0300
label: "Mask answer tokens from attending to instruction tokens"
summary: >-
  At inference, set pre-softmax attention logits from answer-token positions
  to instruction-token positions to minus infinity in every layer and head,
  so the answer can only be read off the generated chain of thought, paired
  with fine-tuning
description: >-
  At inference, set pre-softmax attention logits from answer-token positions
  to instruction-token positions to minus infinity in every layer and head,
  so the answer can only be read off the generated chain of thought, paired
  with fine-tuning Filed by the drafting stage from CASE: Causal Alignment
