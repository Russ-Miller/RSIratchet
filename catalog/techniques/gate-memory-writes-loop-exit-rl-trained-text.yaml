id: gate-memory-writes-loop-exit-rl-trained-text
ref: TEC-0652
label: "Gate memory writes and loop exit with RL-trained text gates"
summary: >-
  The agent emits two textual gates during chunk-by-chunk reading: memory is
  rewritten only when the update gate opens, and the loop halts when the
  exit gate opens, both trained by dedicated reward terms inside end-to-end
  RL.
description: >-
