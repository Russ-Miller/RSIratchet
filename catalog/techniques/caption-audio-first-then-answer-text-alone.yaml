id: caption-audio-first-then-answer-text-alone
ref: TEC-0468
label: "Caption the audio first, then answer from text alone"
summary: >-
  Instead of answering an audio question end-to-end, generate a detailed
  caption of the audio with the audio model and pass the caption plus
  question to a text-only LLM.
description: >-
  Instead of answering an audio question end-to-end, generate a detailed
  caption of the audio with the audio model and pass the caption plus
  question to a text-only LLM. Filed by the drafting stage from Audio
  Flamingo Next: Next-Generation Open Audio-Language Models for Speech,
  Sound, and Music (2604.10905) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: MMAU average 75.76 for the captioner pipeline
  vs 74.20 direct instruct and 75.01 chain-of-thought; MMAR 63.0 vs 59.7 and
  61.0; MMSU 63.3 vs 59.4 and 61.2. No ablation isolating caption quality
  from the text model's strength.. Nobody has vouched for it; add support or
  contest it on this page.
