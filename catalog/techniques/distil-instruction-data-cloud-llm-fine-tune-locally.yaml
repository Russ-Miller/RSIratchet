id: distil-instruction-data-cloud-llm-fine-tune-locally
ref: TEC-0602
label: "Distil instruction data from a cloud LLM, fine-tune locally"
summary: >-
  Use a >175B hosted model to generate instruction-style MITRE ATT&CK
  examples, then fine-tune a sub-2B local model on them because the small
  model cannot be tuned to instruction-following directly.
description: >-
  Use a >175B hosted model to generate instruction-style MITRE ATT&CK
  examples, then fine-tune a sub-2B local model on them because the small
  model cannot be tuned to instruction-following directly. Filed by the
  drafting stage from CyberLLM-FINDS 2025: Instruction-Tuned Fine-tuning of
  Domain-Specific LLMs with Retrieval-Augmented Generation and Graph
  Integration for MITRE Evaluation (2601.06779) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Qualitative inspection of
  generated responses plus an LLM-judge score over 5 MITRE queries comparing
  RAG, Graph+LLM and GraphRAG+GNN retrieval variants; no matched baseline on
  instruction-following accuracy before and after synthetic training..
  Nobody has vouched for it; add support or contest it on this page.
