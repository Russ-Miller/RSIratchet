description: >-
  Sample several answers, show them to the model, then ask for the
  probability that one specific answer is true; the extra samples act like
  considering alternatives and raise self-evaluation accuracy and
  calibration over judging a single answ Filed by the drafting stage from
  Language Models (Mostly) Know What They Know (2207.05221) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Calibration curves
  and AUROC/Brier-style plots on TriviaQA, arithmetic, Lambada, code and
  GSM8K-type sampling tasks across model sizes; 20-shot self-evaluation with
  visible samples compared against single-sample P(True). Shown for
  pretrained models only; RLHF models not tested.. Nobody has vouched for
  it; add support or contest it on this page.
