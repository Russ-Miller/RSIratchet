id: mix-reversed-video-samples-into-rl-group
ref: TEC-0150
label: "Mix reversed-video samples into the RL group"
summary: >-
  During GRPO, sample most responses on the forward video and a small
  minority on the time-reversed video in the same group, so group-relative
  advantage rewards using directional motion cues.
description: >-
  During GRPO, sample most responses on the forward video and a small
  minority on the time-reversed video in the same group, so group-relative
  advantage rewards using directional motion cues. Filed by the drafting
  stage from COMET: Contrastive Motion-Enhanced Temporal Reasoning for Video
  Multimodal Large Language Models (2608.21030) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Same Stage I checkpoint,
  Qwen3-VL-8B, group size 7: average accuracy 78.0 for 7+0 standard GRPO vs
  78.8 for 6+1, 78.4 for 5+2, 77.6 for 4+3; gains concentrated on action
  tasks (+4.9 pp over BL-GRPO at 8B), with PerceptionTest down 0.4 pp..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [video-temporal-reasoning]
kind: training
sources: [arxiv-2608-21030]
status: proposed
