description: >-
  During GRPO fine-tuning, feed domain-transformed images (rotations,
  symmetries) through the policy to form a domain-support distribution, add
  a KL term pulling the policy toward it, and reweight advantages by one
  minus the JS divergence fro Filed by the drafting stage from Learning
  Domain Knowledge in Multimodal Large Language Models through Reinforcement
  Fine-Tuning (2601.16419) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Few-shot accuracy on six remote sensing and five
  medical datasets plus DIOR mAP, against SFT, Visual-RFT, SFT/Visual-RFT
  with standard data augmentation, and an output-level constraint variant;
  reported gains over SFT of +0.6 to +7.8 average points depending on shot
  count.. Nobody has vouched for it; add support or contest it on this page.
