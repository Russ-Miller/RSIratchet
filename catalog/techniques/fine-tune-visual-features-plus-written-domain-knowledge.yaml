description: >-
  Augments each tabular crossing record with LLaVA-extracted scene
  descriptions and transportation domain-knowledge text before LoRA
  fine-tuning an LLM to predict the crossing decision. Filed by the drafting
  stage from A Vision-and-Knowledge Enhanced Large Language Model for
  Generalizable Pedestrian Crossing Behavior Inference (2601.00694) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Balanced
  accuracy on held-out sites against statistical and supervised baselines;
  ablations attribute +2.9% to the vision module and +4.1% to domain
  knowledge, with cross-site zero-shot and five-shot comparisons.. Nobody
  has vouched for it; add support or contest it on this page.
