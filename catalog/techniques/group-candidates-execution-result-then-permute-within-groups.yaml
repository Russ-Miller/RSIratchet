description: >-
  Replaces selector fine-tuning with retrieved structured criteria (schema
  grounding, SQL operations, expected output form) prepended to a listwise
  prompt, and mitigates position bias by shuffling only inside
  execution-result groups, aggregat Filed by the drafting stage from
  Replacing Training with Memory: Listwise Selection for Text-to-SQL
  (2609.00834) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Execution accuracy, selector calls and input tokens per
  query against greedy, majority voting, pointwise (Contextual-RM-32B),
  pairwise (CHASE-SQL style) and R3-SQL on the same candidate sets: 73.08 vs
  71.97 for R3-SQL on BIRD-dev at n=32, +2.02 over pairwise, 2.92x fewer
  tokens; ablations drop 0.55 (no memory) and 0.32 (no permutation);
  order-consistency rises 18.98 -> 23.04 (global shuffle) -> 29.04
  (group-based) -> 33.17 (with tie-break).. Nobody has vouched for it; add
  support or contest it on this page.
