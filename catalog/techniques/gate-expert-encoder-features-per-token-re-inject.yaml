description: >-
  Fuse a domain-specialist fundus encoder with the frozen general encoder
  through a sigmoid token-wise router, then re-inject the fused features as
  a zero-initialized, gated residual bias at the visual token positions of
  intermediate LLM laye Filed by the drafting stage from Deep Expert
  Injection for Anchoring Retinal VLMs with Domain-Specific Knowledge
  (2603.07131) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: TM4K closed VQA macro F1/recall/precision ablation
  against the Qwen2.5-VL fine-tuned baseline: baseline 55.72/69.12/51.22;
  expert stream with plain addition 64.23/81.30/55.10; gated fusion
  71.45/78.50/67.65; gated plus unconditional deep injection
  74.12/82.15/69.80; gated plus adaptive routing 78.07/82.42/77.33. Also
  compared to LLaVA-FT and three proprietary LVLMs on four benchmarks..
  Nobody has vouched for it; add support or contest it on this page.
