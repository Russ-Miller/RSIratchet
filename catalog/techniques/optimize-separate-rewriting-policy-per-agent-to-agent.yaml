id: optimize-separate-rewriting-policy-per-agent-to-agent
ref: TEC-0736
label: "Optimize a separate rewriting policy per agent-to-agent edge"
summary: >-
  A middleware intercepts every inter-agent message and rewrites it using a
  per-edge policy that is updated after each episode by assigning
  natural-language credit to specific communication edges and
  backpropagating it as textual gradients.
description: >-
  A middleware intercepts every inter-agent message and rewrites it using a
  per-edge policy that is updated after each episode by assigning
  natural-language credit to specific communication edges and
  backpropagating it as textual gradients. Filed by the drafting stage from
  Scaling Multi-agent Systems: A Smart Middleware for Improving Agent
  Interactions (2604.03430) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Mean accuracy over 5 training iterations on
  modified HotPotQA and MuSiQue, against an unmodified multi-agent system
  and against global (non-edge-assigned) TextGrad optimization; no
  per-component ablation and no report of variance across runs.. Nobody has
  vouched for it; add support or contest it on this page.
