id: center-rl-advantages-robust-estimator-batch-mean
ref: TEC-0608
label: "Center RL advantages with a robust estimator, not the batch "
summary: >-
  Partitions a batch of returns into blocks, fits a location estimate per
  block by minimizing an adaptive robust loss, takes the median of those
  block estimates, and uses it in place of the batch mean when normalizing
  advantages.
description: >-
  Partitions a batch of returns into blocks, fits a location estimate per
  block by minimizing an adaptive robust loss, takes the median of those
  block estimates, and uses it in place of the batch mean when normalizing
  advantages. Filed by the drafting stage from Adaptive Robust Estimator for
  Multi-Agent Reinforcement Learning (2603.21574) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy on MATH500
  (in-distribution) and AMC23, Gaokao2023en, MinervaMath, AIME24/25 against
  a matched GRPO baseline under injected Cauchy reward noise, plus
  degradation curves under group-level and within-group reward
  contamination; separately, training reward curves and NE/SR/OSR/SPL on
  aerial VLN against a FlightGPT GRPO baseline.. Nobody has vouched for it;
  add support or contest it on this page.
addresses: [multi-model-coordination]
kind: training
