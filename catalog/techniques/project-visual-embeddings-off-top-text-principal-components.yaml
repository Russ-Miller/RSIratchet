id: project-visual-embeddings-off-top-text-principal-components
ref: TEC-0502
label: "Project visual embeddings off the top text principal compone"
summary: >-
  Mean-center visual embeddings against a text manifold estimated by PCA
  over pretraining captions and subtract their projection onto the top k
  principal components, either at inference or inside the fine-tuning
  forward pass.
description: >-
  Mean-center visual embeddings against a text manifold estimated by PCA
  over pretraining captions and subtract their projection onto the top k
  principal components, either at inference or inside the fine-tuning
  forward pass. Filed by the drafting stage from When Language Overwrites
  Vision: Over-Alignment and Geometric Debiasing in Vision-Language Models
  (2605.08245) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: POPE, AMBER (CHAIR, HAL), CHAIR_i/CHAIR_s, MME and
  MMBench on LLaVA-1.5-7B and Qwen2.5-VL-7B against zero-shot and four
  training-free decoding baselines (VCD, SID, VISTA, DMAS); fine-tuned
  variant scored by CLAIR on VRSBench and TextCaps against standard SFT at
  matched data and budget; plus layer-wise linear probing (mAP on 80 COCO
  categories) and logit-lens decoding of image patches.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [visual-grounding]
