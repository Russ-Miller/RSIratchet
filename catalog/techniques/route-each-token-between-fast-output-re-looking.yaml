description: >-
  A compact controller reads the decoder hidden state, next-token entropy
  and global image features at each generation step and selects one of three
  computation paths (base FFN, cross-attention over visual features, or a
  meta-reasoning transf Filed by the drafting stage from Addressing
  Overthinking in Large Vision-Language Models via Gated
  Perception-Reasoning Optimization (2601.04442) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy and mean token count
  on five multimodal reasoning benchmarks against the untuned base model and
  against slow-thinking baselines (LMM-R1, R1-OneVision, OpenVLThinker,
  FAST); component ablations on MathVision and MathVerse; reported
  path-activation distribution (73% fast / 17% perception / 10% reasoning)..
  Nobody has vouched for it; add support or contest it on this page.
