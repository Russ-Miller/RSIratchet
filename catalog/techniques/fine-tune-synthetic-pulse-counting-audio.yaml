label: "Fine-tune on synthetic pulse-counting audio"
summary: >-
  Generates on-the-fly synthetic audio of 1-10 short sinusoidal pulses at
  random times and mel-band frequencies plus noise, and LoRA-fine-tunes the
  audio model to count them.
description: >-
  Generates on-the-fly synthetic audio of 1-10 short sinusoidal pulses at
  random times and mel-band frequencies plus noise, and LoRA-fine-tunes the
  audio model to count them. Filed by the drafting stage from SpectCount:
  Spectrotemporal Counting via Synthetic Signals Improves Large Audio
  Language Models (2606.06907) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Accuracy on MMAU-test-mini/test, MMAR, MMSU and
  AIR-Bench against reproduced base-model scores for two models, plus
  ablations removing frequency diversity or multi-pulse counting and
  restricting LoRA to one module.. Nobody has vouched for it; add support or
  contest it on this page.
