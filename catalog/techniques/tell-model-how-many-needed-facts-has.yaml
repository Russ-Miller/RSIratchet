id: tell-model-how-many-needed-facts-has
ref: TEC-0903
label: "Tell the model how many of the needed facts it has"
summary: >-
  Prepend a note stating that only k of n required facts were supplied and
  instruct the model to express genuine uncertainty about the rest.
description: >-
  Prepend a note stating that only k of n required facts were supplied and
  instruct the model to express genuine uncertainty about the rest. Filed by
  the drafting stage from Anchored Confabulation: Partial Evidence
  Non-Monotonically Amplifies Confident Hallucination in LLMs (2604.25931)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Confident-wrong AUC (PHC) at k=1 fell from 0.656 (significant) to 0.538
  (not significant) on the same 160 MuSiQue 3-hop queries, but the baseline
  and the mitigation were run on different models (Claude Sonnet vs GPT-4o),
  so the comparison is confounded.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [hallucination]
