description: >-
  Store vehicle components, mission types and required capabilities in an
  ontology with SWRL rules that infer capabilities from hardware/software,
  then put both the mission's required capabilities and the vehicle's
  inferred capabilities into Filed by the drafting stage from A Cognitive
  Architecture for Shared Autonomy in AUV Operations (2608.29347) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Feasibility-verdict accuracy over 5 runs per vehicle configuration per
  model, compared against the same prompt with the ontology requirements
  removed; with requirements GPT-OSS reached 100% on all three
  configurations, and without them the models mislabelled the
  partially-possible configuration and named the wrong missing component..
  Nobody has vouched for it; add support or contest it on this page.
