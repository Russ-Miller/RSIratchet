description: >-
  Equips an off-the-shelf LLM with a few domain-free graph primitives (get
  node by property, get neighbors, get unique property values, think) and
  lets it compose sequential tool calls into a reasoning chain instead of
  reading the serialized Filed by the drafting stage from GraphWalk:
  Enabling Reasoning in Large Language Models through Tool-Based Graph
  Navigation (2604.01610) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Correct-answer count, accuracy, precision/recall/F1
  and false positives over 120 queries per model, against a no-tool baseline
  with the full graph in context; mazes scored by whether any valid path was
  found (tool-equipped gpt-4.1 10/10 vs 1/10 no-tool); at 500 nodes
  gpt-4.1-with-tools 26.67% accuracy vs 10.83% no-tool and o4-mini 4.17%..
  Nobody has vouched for it; add support or contest it on this page.
