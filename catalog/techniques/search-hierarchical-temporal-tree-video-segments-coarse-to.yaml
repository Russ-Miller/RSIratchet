summary: >-
  Build a question-agnostic tree of contiguous video segments by recursive
  temporally constrained clustering with one key frame per node, then run an
  answer-retrieve-explore loop that expands only branches the model says it
  needs.
description: >-
  Build a question-agnostic tree of contiguous video segments by recursive
  temporally constrained clustering with one key frame per node, then run an
  answer-retrieve-explore loop that expands only branches the model says it
  needs. Filed by the drafting stage from Temporal Tree of Thought:
  Reasoning-Guided Visual Cue Search for Long-Video Understanding
  (2608.27871) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on VideoMME, LongVideoBench and LVBench with
  Qwen2.5-VL-7B at matched frame budget: +0.5%, +4.6%, +4.4% over the
  baseline.. Nobody has vouched for it; add support or contest it on this
  page.
