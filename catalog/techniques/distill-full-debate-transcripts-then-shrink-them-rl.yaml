description: >-
  Supervised fine-tune one model on complete tagged multi-agent debate
  traces, then run GRPO where the structure-tag reward decays to near zero
  and the answer must appear within an annealed token prefix, forcing the
  debate into the model's la Filed by the drafting stage from Latent Agents:
  A Post-Training Procedure for Internalized Multi-Agent Debate (2604.24881)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy and input+output tokens per question across three runs on GSM8K,
  MMLU-Pro and BBH against single-agent, explicit debate (Du et al.), and
  DebateGPT (final-output-only distillation), on three backbones; RL stage
  ablated against SFT-only.. Nobody has vouched for it; add support or
  contest it on this page.
