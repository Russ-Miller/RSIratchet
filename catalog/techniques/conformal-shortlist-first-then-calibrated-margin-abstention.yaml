description: >-
  Use conformal prediction to localize a top-k shortlist that contains the
  human-preferred response with probability 1-alpha, then accept a single
  answer only when its score margin within that shortlist clears a
  fixed-sequence-calibrated thre Filed by the drafting stage from
  Localize-Then-Decide Guarantees for LLM Judgments (2608.25824) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: On TL;DR, Chatbot
  Arena, HH-RLHF and AlpacaEval with three judge models at m=10 and target
  agreement 0.81, two-stage variants reached 91-97% guarantee success rate
  versus 48-79% for the matched single-stage rule using the same scoring
  function, with coverage 8-14 points higher; monotonicity measured by
  ranking loss (<=0.08 for both stages vs up to 0.46 single-stage).. Nobody
  has vouched for it; add support or contest it on this page.
