description: >-
  A Perceiver-style hypernetwork, meta-trained on the context-distillation
  KL objective across many documents, reads a context's per-layer
  activations in one forward pass and emits a LoRA adapter so later queries
  can be answered with the cont Filed by the drafting stage from
  Doc-to-LoRA: Learning to Instantly Internalize Contexts (2602.15902) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Needle
  retrieval accuracy versus the in-context base model across haystack
  lengths to 128K; ROUGE-L F1 relative to in-context upper bound on SQuAD,
  DROP, ROPES, 2WikiMultihopQA, MultiFieldQA, QASPER against per-prompt
  context distillation (oracle-query and 5/25/100 generated-query variants),
  T2L, LLMLingua-2 compression, and a no-context base model; plus update
  latency and peak update/inference memory.. Nobody has vouched for it; add
  support or contest it on this page.
