id: externalize-simulated-shell-state-into-virtual-filesystem-tree
ref: TEC-0295
label: "Externalize simulated shell state into a virtual filesystem "
summary: >-
  A memory manager parses state-changing commands into an explicit
  filesystem tree and prunes the command history, injecting that compact
  state into the generator's prompt instead of the raw interaction log.
description: >-
  A memory manager parses state-changing commands into an explicit
  filesystem tree and prunes the command history, injecting that compact
  state into the generator's prompt instead of the raw interaction log.
  Filed by the drafting stage from ShellGames: Speculative LLM-Driven SSH
  Deception (2606.17986) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation on the filesystem state-tracking task: with the
  memory manager, mean command-level accuracy 0.985 (relative paths) and
  0.976 (absolute) versus 0.955 and 0.861 without; at 200 commands
  relative-path accuracy rose from 0.865 to 0.985, while at 50-100 commands
  it fell slightly (1.0 to 0.98/0.99). Baselines: GPT-5.4-mini 0.920/0.673,
  ShelLM 0.490/0.336, E-ShelLM 0.533/0.570.. Nobody has vouched for it; add
  support or contest it on this page.
