description: >-
  Abstracts SQL queries into schema-independent skeletons, treats seed
  skeletons as fixed K-center centers, greedily selects external pool
  skeletons farthest from existing coverage, and re-instantiates each on a
  target training database with Filed by the drafting stage from COAL-SQL:
  Coverage-Guided Augmentation and Failure-Driven Learning for Text-to-SQL
  Post-Training (2609.20842) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Execution accuracy on BIRD dev, Spider test/dev,
  EHRSQL and Science Benchmark against random augmentation from the same
  pool at equal example count, plus skeleton n-gram coverage/recovery on
  BIRD dev versus OmniSQL-style synthesis (100% vs 73.3% unigram recovery)..
  Nobody has vouched for it; add support or contest it on this page.
