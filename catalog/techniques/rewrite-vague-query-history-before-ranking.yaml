id: rewrite-vague-query-history-before-ranking
ref: TEC-0369
label: "Rewrite the vague query from history before ranking"
summary: >-
  A separate agent rewrites the user's underspecified query using
  same-category records retrieved from their interaction history, and the
  rewritten query is then passed to the ranking model in a single prompt.
description: >-
  A separate agent rewrites the user's underspecified query using
  same-category records retrieved from their interaction history, and the
  rewritten query is then passed to the ranking model in a single prompt.
  Filed by the drafting stage from APeB: Benchmarking Personalization
  Ability of Large Language Model Agents (2607.03162) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Hit@1/Hit@5 on APeB intent
  queries across eight LLMs versus single-prompt, ReAct and Deerflow
  baselines; gains are consistent but small (e.g. Qwen3 24.9 to 26.3,
  GPT5.2Think 26.4 to 26.9), with rubric scores showing improved query
  inference and recommendation quality.. Nobody has vouched for it; add
  support or contest it on this page.
