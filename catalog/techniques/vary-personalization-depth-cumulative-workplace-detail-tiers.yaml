description: >-
  Generate phishing pretexts at four cumulative levels of recipient
  work-context detail and compare rated convincingness and stated action
  within participants. Filed by the drafting stage from Engineered
  Persuasion: Evaluating Personalized Pretexts in LLM-Generated Spear
  Phishing (2609.04410) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Linear and logistic mixed models with participant random
  intercepts: +2.40 convincingness points per level (95% CI 1.29-3.51),
  Level 4 vs Level 1 +7.61 points; odds of click intention +28% per level
  (OR 1.28, CI 1.13-1.46), Level 4 OR 2.29; relative risk of report vs
  delete fell 21.7% per level.. Nobody has vouched for it; add support or
  contest it on this page.
