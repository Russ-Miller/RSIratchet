id: externalize-agent-state-onto-fact-intent-dag
ref: TEC-0121
label: "Externalize agent state onto a fact-intent DAG"
summary: >-
  Store verified environment observations as immutable fact nodes in a
  persistent graph and allow an action only as an intent edge whose
  preconditions are already-verified facts, replacing in-context state
  maintenance.
description: >-
  Store verified environment observations as immutable fact nodes in a
  persistent graph and allow an action only as an intent edge whose
  preconditions are already-verified facts, replacing in-context state
  maintenance. Filed by the drafting stage from Staying on the Attack Path:
  Structured State for Long-Horizon Automated Penetration Testing
  (2609.07344) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Task success rate against five baselines (PentestGPT,
  PentestAgent, Pentest-R1, VulnBot, Claude Code) on real CTF challenges
  with Fisher's exact test, plus average rounds per successful task (~7 vs
  ~12-23.6) and an ablation removing only the intent retrieval module (33%
  and 48% more rounds on medium and hard, same solvable set).. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [long-horizon-execution]
kind: process
