id: stop-self-critique-confirmed-sentinel-confidence-score
ref: TEC-0212
label: "Stop self-critique on a CONFIRMED sentinel, not a confidence"
summary: >-
  Run a bounded generate-critique-revise loop over a frozen model and
  terminate as soon as the critique emits a CONFIRMED token, rather than at
  a fixed depth or at a self-reported numeric confidence threshold.
description: >-
  Run a bounded generate-critique-revise loop over a frozen model and
  terminate as soon as the critique emits a CONFIRMED token, rather than at
  a fixed depth or at a self-reported numeric confidence threshold. Filed by
  the drafting stage from Training-Free Inference-Time Self-Reflection and
  Cost-Bounded Early Stopping for Large Language Models (2608.18884) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  and mean tokens/calls per question against single-shot, self-consistency
  (k=2,3) and fixed-depth Self-Refine on BBH, GSM8K, MATH (n=500): matched
  accuracy on BBH at 2.15 generations vs 3.00, higher accuracy on GSM8K/MATH
  at lower token cost; a sweep of confidence thresholds 0.6-0.9 collapsed
  the loop to one generation on 100% of items, showing the numeric tag is
  not selective.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [self-repair]
