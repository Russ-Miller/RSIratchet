id: stop-self-critique-confirmed-sentinel-confidence-score
ref: TEC-0214
label: "Stop self-critique on a CONFIRMED sentinel, not a confidence"
summary: >-
  Run generate-critique-revise to a max depth but exit as soon as the
  critique emits a CONFIRMED token, instead of relying on the model's
  self-reported numeric confidence.
description: >-
  Run generate-critique-revise to a max depth but exit as soon as the
  critique emits a CONFIRMED token, instead of relying on the model's
  self-reported numeric confidence. Filed by the drafting stage from
  Training-Free Inference-Time Self-Reflection and Cost-Bounded Early
  Stopping for Large Language Models (2608.18884) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Compared against single-shot,
  self-consistency k=2/3, and fixed-depth Self-Refine at matched compute on
  n=500 splits; the sentinel stopped 82-88% of items at ~2.1 generations
  with equal or higher accuracy, while every numeric confidence threshold
  >=0.6 collapsed the loop to a single generation because declared
  confidence was never low.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
