description: >-
  A VLM reads image history, a hierarchical scene graph and the robot
  instruction to emit the human's latent goal as symbolic predicates, which
  are grounded with the robot goal into a single multi-agent PDDL-style
  problem and solved by a form Filed by the drafting stage from HINT-Plan:
  Human Intention-Aware Robot Task Planning in Context-Rich Environments
  using Vision Language Models (2609.17771) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Joint success rate 69.71% vs 35.50%
  for a VLM-as-planner baseline and 34.42% for GG-LLM, with paired cluster
  bootstrap CIs excluding zero; also higher robot and human goal completion
  and about half the functional-conflict rate.. Nobody has vouched for it;
  add support or contest it on this page.
