description: >-
  Supervised fine-tuning on the model's own reasoning chains with the bottom
  10% of importance-scored tokens removed, followed by preference
  optimization where the preferred sample is an expert-corrected reasoning
  chain and the rejected sampl Filed by the drafting stage from Seeing
  Through the Chain: Understanding and Mitigating Hallucinations in
  Multimodal Large Reasoning Models (2602.03380) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: CHAIR, POPE, AMBER and
  GPT-4-assisted SHR across five 7B MLRMs against vanilla, RLAIF-V and
  OPA-DPO baselines; e.g. Orsta-R1 CHAIR_S 40.7 to 35.3 and SHR down 14.05%,
  with MME/MMBench general scores preserved; ablations remove each loss term
  and the hallucination-inducing negatives.. Nobody has vouched for it; add
  support or contest it on this page.
