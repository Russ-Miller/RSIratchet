  gradients.
description: >-
  Trains the LoRA edit with an SFT loss plus a DPO loss contrasting the new
  answer against the model's prior answer, optimized under sharpness-aware
  minimization with PCGrad projection to reconcile the two objectives'
  gradients. Filed by the drafting stage from Conflict-Resolving and
  Sharpness-Aware Minimization for Generalized Knowledge Editing with
  Multiple Updates (2602.03696) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Generality (accuracy on paraphrased prompts)
  and specificity (MMLU) against LoRA SFT, MEMIT and F-Learning on three
  fact benchmarks and two backbones; continual-update efficacy and
  forgetting on cross-dataset injection and AToKe; outdated-answer retention
  rate on the same paraphrase prompts; UPass/SPass on CodeUpdateArena.
  Nobody has vouched for it; add support or contest it on this page.
addresses: [knowledge-updating]
