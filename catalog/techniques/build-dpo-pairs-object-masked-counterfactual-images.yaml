description: >-
  Iteratively mask a detected object out of a natural image until occlusion
  is complete, keep only images where the target model still asserts the
  object in at least 5 of 10 samples, then DPO on same-prefix sentence pairs
  where the rejected s Filed by the drafting stage from HII-DPO: Eliminate
  Hallucination via Accurate Hallucination-Inducing Counterfactual Images
  (2602.10425) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: On LLaVA-v1.5-7B/13B, lower CHAIR_s/CHAIR_i on Object
  HalBench and lower Hal/Cog on AMBER than SENTINEL, RLAIF-V, TPO, mDPO,
  Re-Align and HA-DPO, with VQAv2/TextVQA/ScienceQA/MM-Vet held near
  baseline; also lowest hallucination rate on the authors' own MOH
  benchmark. Ablations cover detection threshold and iterative masking. No
  independent replication; the benchmark is authored by the same group..
  Nobody has vouched for it; add support or contest it on this page.
