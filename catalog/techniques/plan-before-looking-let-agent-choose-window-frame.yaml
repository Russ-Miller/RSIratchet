description: >-
  The agent sees only the text query at step 0 and iterates
  summary-plan-action-reflection, calling a frame tool whose temporal
  window, frame count and spatial downsampling it sets itself, trained by
  SFT then KTO on labelled good/bad trajecto Filed by the drafting stage
  from EVA: Efficient Reinforcement Learning for End-to-End Video Agent
  (2603.22918) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on six video benchmarks against uniform-sampling
  MLLMs and prior adaptive agents (FrameThinker, VideoMTR, VideoAgent), with
  visual-token counts reported: LSDBench 51.0% at 10.3K tokens vs Qwen2.5-VL
  52.5% at 499K; MLVU 68.3 vs 59.1 for FrameThinker; LVBench 43.3 vs 36.6.
  Stage ablation (SFT/KTO/GRPO) and GRPO data-composition ablation
  (multi-choice vs open-ended vs mixed) reported.. Nobody has vouched for
  it; add support or contest it on this page.
