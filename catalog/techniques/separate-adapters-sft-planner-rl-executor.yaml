id: separate-adapters-sft-planner-rl-executor
ref: TEC-0405
label: "Separate adapters: SFT the planner, RL the executor"
summary: >-
  Train a high-level sub-goal generator by supervised fine-tuning and a
  low-level atomic-action executor by offline-to-online RL, on the same
  backbone but with distinct LoRA adapters activated per role.
description: >-
  Train a high-level sub-goal generator by supervised fine-tuning and a
  low-level atomic-action executor by offline-to-online RL, on the same
  backbone but with distinct LoRA adapters activated per role. Filed by the
  drafting stage from Multi$^2$: Hierarchical Multi-Agent Decision-Making
  with LLM-Based Agents in Interactive Environments (2606.03698) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Pass@1 on
  in-distribution and out-of-distribution splits of ScienceWorld, ALFWorld
  and TextCraft across three backbones, against ReAct, Reflexion, ADaPT,
  GRPO and Glider; ablations swapping which system gets SFT versus RL, flat
  versus hierarchical, and shared versus role-specific adapters.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
kind: training
