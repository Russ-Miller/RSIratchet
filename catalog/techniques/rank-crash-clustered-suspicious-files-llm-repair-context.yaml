description: >-
  Cluster crash reports by stack-trace similarity, score candidate files by
  proximity to the crash point, bucket specificity and in-group frequency,
  and put the top-ranked files' source plus a representative stack trace
  into a zero-shot repai Filed by the drafting stage from Integrating Crash
  Report Mining and LLMs for Bug Localization and Repair: An Industrial
  Report (2609.04483) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Manual two-rater grading (Cohen's kappa 0.88
  localization, 0.51 repair) of 760 responses on 38 bugs against developer
  corrective commits; ablation across four prompt configurations and five
  LLMs on an 8-bug subset. No no-ranking, no-clustering baseline on the full
  dataset; no test-based execution.. Nobody has vouched for it; add support
  or contest it on this page.
