description: >-
  At each decoding step, compute Laplacian energy of the last-query visual
  attention per candidate layer, then remap next-token logits by subtracting
  a weighted share of the LM-head output at the maximum-energy layer
  (optionally adding a conf Filed by the drafting stage from When Looking Is
  Not Enough: Visual Attention Structure Reveals Hallucination in MLLMs
  (2605.11559) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: CHAIR, POPE, HallusionBench, VideoHallucer plus general
  benchmarks (MME, MM-Vet, LLaVA-Bench) against vanilla decoding and
  training-free baselines (OPERA, VCD, ICD, DeCo, MemVR, AIR, DMAS); e.g.
  CHAIR average 32.7 to 26.2 on LLaVA-1.5 with recall roughly flat (77.1 to
  77.6); ablations substitute raw visual mass, text-side energy, Shannon
  entropy and fixed/all layer ranges, all weaker.. Nobody has vouched for
  it; add support or contest it on this page.
