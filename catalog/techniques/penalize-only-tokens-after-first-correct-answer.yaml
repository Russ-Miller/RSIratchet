  and Complete: Multi-stage Training For Adaptive Reasoning (2601.02972)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Average accuracy, mean token count and area under the
  Overthinking-Adjusted Accuracy curve across seven benchmarks, against the
  base model, no-thinking, shortest-correct SFT, and four RL length-penalty
  baselines (hard, soft, normalized, TWYN); best method scores 76.6 AUC_OAA
  vs 71.6 base and 74.0 second-best, with per-stage ablations.. Nobody has
