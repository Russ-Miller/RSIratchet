description: >-
  Builds a synthetic data pipeline that mixes single-source audio into
  templated polyphonic scenes with RMS-derived exact event timestamps, then
  LoRA-fine-tunes a LALM on prompts conditioned on randomly sampled caption
  style, merge threshold, Filed by the drafting stage from TAC: Timestamped
  Audio Captioning (2602.15766) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Event-F1, segment-F1, and a
  FLAM-confidence-based hallucination rate on the TACOS test set against
  Gemini 3 Pro, Qwen3-Omni and Audio Flamingo 3, plus one-at-a-time
  ablations of each pipeline component (removing multitask prompt sampling
  raised hallucination 4.9%->7.0%; removing continued pretraining
  4.9%->8.8%; removing TACOS real data dropped EvtF1 0.50->0.42).. Nobody
  has vouched for it; add support or contest it on this page.
