description: >-
  An LLM proposes candidate textual attributes from sampled responses and
  their rewards, each attribute is scored by the average reward difference
  over minimally rewritten counterfactual response pairs minus a frontier
  judge's win rate, and t Filed by the drafting stage from Automatically
  Finding Reward Model Biases (2602.15222) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Recovered known format biases (bold
  preference, list preference only on how-to prompts) consistent with prior
  work; 10 of 17 surfaced candidates stayed significant for both RM and
  judge on a held-out test set under partial-conjunction testing at p=0.01
  across three independent rewriter models; recall checked by injecting
  three regex-detectable biases with controlled signal-to-noise;
  depth-5/branch-4 evolution beat depth-3/branch-8 and best-of-N on a
  diversity-adjusted bias-strength metric, but in a single run per
  configuration.. Nobody has vouched for it; add support or contest it on
  this page.
