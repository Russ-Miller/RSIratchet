ref: TEC-0478
label: "Rank trajectories by inter-agent dependency, not pairwise wi"
summary: >-
  Samples many agent trajectories per question, scores each by how
  coherently it weights functionally coupled agents, and trains with a
  listwise DPO variant that demotes correct-but-weakly-coupled trajectories
  into the rejected set.
description: >-
  Samples many agent trajectories per question, scores each by how
  coherently it weights functionally coupled agents, and trains with a
  listwise DPO variant that demotes correct-but-weakly-coupled trajectories
  into the rejected set. Filed by the drafting stage from AMATA: Adaptive
  Multi-Agent Trajectory Alignment for Knowledge-Intensive Question
  Answering (2605.17352) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on five knowledge-intensive QA benchmarks
  (HealthQA, ARC-C, PopQA, SQuAD 1.1, ASQA) against vanilla DPO, full-order
  DPO, a global-local trajectory system (SMART) and RL baselines (GiGPO,
  SPA-RL); reported average 60.57 vs 55.70-56.55, with removal of the
  inter-agent loss the largest single ablation drop.. Nobody has vouched for
  it; add support or contest it on this page.
