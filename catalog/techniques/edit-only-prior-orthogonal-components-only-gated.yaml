description: >-
  At the final decoder layer, decompose each hidden state into an online
  weighted-SVD visual-evidence subspace, an anti-prior subspace built in its
  orthogonal complement, and a residual, then shrink the latter two with
  strengths set by visual Filed by the drafting stage from HulluEdit:
  Single-Pass Evidence-Consistent Subspace Editing for Mitigating
  Hallucinations in Large Vision-Language Models (2602.22727) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: POPE accuracy/F1
  on LLaVA-1.5-7B/13B and Qwen-VL-Chat against greedy, VCD, ICD, VAF, DeCo;
  CHAIR_i/CHAIR_s on MSCOCO against Nullu, HALC, OPERA, LURE; MME subtask
  scores; tokens-per-second throughput; component ablations (gating,
  orthogonal complement, weighted vs uniform SVD, fixed strengths).. Nobody
  has vouched for it; add support or contest it on this page.
