ref: TEC-0763
label: "Post-RL supervised fine-tuning on self-distilled correct out"
summary: >-
  After RL post-training, run a light SFT pass on the model's own sampled
  correct reasoning traces to re-impose a maximum-likelihood objective and
  restore calibrated output probabilities.
description: >-
  After RL post-training, run a light SFT pass on the model's own sampled
  correct reasoning traces to re-impose a maximum-likelihood objective and
  restore calibrated output probabilities. Filed by the drafting stage from
  Know When You're Wrong: Aligning Confidence with Correctness for LLM Error
  Detection (2603.06604) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On Qwen3-4B over seven tasks, SFT raised mean
  confidence-correctness AUROC from 0.806 to 0.879 and cut ECE from 0.163 to
  0.034, while GRPO (AUROC 0.809, ECE 0.135) and DPO (0.785, 0.117) did not;
  using dataset labels instead of self-distilled ones dropped GSM8K accuracy
  from 92.5% to 83.1%. No baseline isolating SFT data volume or a
  non-self-distilled matched control on all tasks.. Nobody has vouched for
  it; add support or contest it on this page.
