id: mix-reversed-video-rollouts-into-grpo-groups
ref: TEC-0151
label: "Mix reversed-video rollouts into GRPO groups"
summary: >-
  During RL post-training of a video model, each group of sampled responses
  contains mostly forward-video rollouts plus one time-reversed rollout of
  the same clip, so correctness reward forces the policy to use temporal
  direction.
description: >-
  During RL post-training of a video model, each group of sampled responses
  contains mostly forward-video rollouts plus one time-reversed rollout of
  the same clip, so correctness reward forces the policy to use temporal
  direction. Filed by the drafting stage from COMET: Contrastive
  Motion-Enhanced Temporal Reasoning for Video Multimodal Large Language
  Models (2608.21030) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Same Stage-I checkpoint, Qwen3-VL-8B, group size 7:
  average accuracy 78.0 for 7 forward + 0 reversed, 78.8 for 6+1, 78.4 for
  5+2, 77.6 for 4+3 across six benchmarks.. Nobody has vouched for it; add
  support or contest it on this page.
