id: reward-agreement-between-factor-influence-factor-mention
ref: TEC-0313
label: "Reward agreement between factor influence and factor mention"
summary: >-
  Train with GRPO using a per-sample binary reward that fires when the
  explanation mentions an inserted prompt factor if and only if that factor
  flipped the model's decision between the factual and counterfactual
  prompt.
description: >-
  Train with GRPO using a per-sample binary reward that fires when the
  explanation mentions an inserted prompt factor if and only if that factor
  flipped the model's decision between the factual and counterfactual
  prompt. Filed by the drafting stage from Training Large Language Models
  for Self-Explanation Faithfulness (2607.21090) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Dataset-level Phi-CCT
  correlation between influence and mention on train, test and OOD splits,
  against the base model and an SFT influence-detection baseline, with
  bootstrap CIs; reward gaming checked via completion length and
  prompt-overlap ratio, which showed shorter negatives but no parroting
  increase.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [explanation-faithfulness]
