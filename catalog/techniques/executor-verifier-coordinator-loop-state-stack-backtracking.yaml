description: >-
  Decomposes algorithmic execution into an agent that proposes each step, an
  agent that scores constraint violations on the resulting state, and a
  controller that proceeds, retries, or pops the state stack to backtrack,
  with the executor poli Filed by the drafting stage from PRIME:
  Policy-Reinforced Iterative Multi-agent Execution for Algorithmic
  Reasoning in Large Language Models (2602.11170) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Average accuracy over a
  self-built 86-task benchmark reported as 26.8% to 93.8% versus single-pass
  prompting; component ablation on the N-Queens case study shows removing
  the verification procedure costs the most (24.9 points at 8B, 8.1 at
  120B). No matched-compute or matched-token baseline, and the main text
  reports detailed results only for N-Queens.. Nobody has vouched for it;
  add support or contest it on this page.
