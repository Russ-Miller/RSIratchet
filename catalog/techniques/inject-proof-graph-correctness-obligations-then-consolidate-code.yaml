description: >-
  Parses reference Python into a region-level implementation graph, aligns
  those regions with kernel-checked Lean proof-flow transitions to generate
  region-level obligation text, trains the model jointly on code plus
  obligation/concept predic Filed by the drafting stage from
  GraphAlignCoder: Aligning Program and Proof Graphs for Code Generation
  (2608.11394) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass@1 solved counts against base model, code-only SFT
  and CodeRL on LiveCodeBench v6 (50 vs 38 CodeRL), BigCodeBench Hard (23 vs
  16) and BigCodeBench Full (363 vs 359); ablation shows injection alone
  reaches 44 on LCB v6 but drops BCB Full from 354 to 339, and
  consolidation-only reaches 49/352/19.. Nobody has vouched for it; add
  support or contest it on this page.
