description: >-
  Run adaptive adversarial and matched benign user agents against a stateful
  tool environment and label each complete trajectory Safe Completion,
  Correct Refusal, Unsafe Completion, Over-Refusal, or Indeterminate using
  executed tool actions a Filed by the drafting stage from BLINDSPOT: A
  Benchmark for Safety and Refusal Calibration in Long-Horizon Tool-Using
  Agents (2609.16305) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to more than 2,500 trajectories across 22 attack
  families and 35 scenarios; showed unsafe completion rates rising with turn
  budget (e.g. GPT-4o 5% at 1 turn to 22% at full horizon) and non-adaptive
  vs adaptive UCR gaps of 1.6x-4.0x, plus safe-twin over-refusal rates that
  separate broadly refusing models from calibrated ones.. Nobody has vouched
  for it; add support or contest it on this page.
