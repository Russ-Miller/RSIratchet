id: give-each-collaborating-agent-own-parameters-shared-policy
ref: TEC-0677
label: "Give each collaborating agent its own parameters, not a shar"
summary: >-
  Runs multi-agent tree search as the RL environment but assigns every agent
  an independent parameter set with its own buffer and asynchronously
  triggered updates, instead of sharing one policy across prompt-defined
  roles.
description: >-
  Runs multi-agent tree search as the RL environment but assigns every agent
  an independent parameter set with its own buffer and asynchronously
  triggered updates, instead of sharing one policy across prompt-defined
  roles. Filed by the drafting stage from MARTI-MARS$^2$: Scaling
  Multi-Agent Self-Search via Reinforcement Learning for Code Generation
  (2602.07848) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass@1 and Pass@1(MCTS) on LiveCodeBench v6 against
  vanilla GRPO single-agent and parameter-sharing multi-role training at
  matched data; Qwen3-8B Pass@1 +8.0 over base, +4.4 over GRPO, +2.9 over
  the homogeneous peak; Pass@1(MCTS) 62.3% vs 59.4% homogeneous and 58.3%
  GRPO; homogeneous reward standard deviation falls late in training..
  Nobody has vouched for it; add support or contest it on this page.
