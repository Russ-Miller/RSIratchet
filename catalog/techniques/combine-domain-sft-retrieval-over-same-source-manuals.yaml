id: combine-domain-sft-retrieval-over-same-source-manuals
ref: TEC-0611
label: "Combine domain SFT with retrieval over the same source manua"
summary: >-
  LoRA fine-tune a general model on instruction pairs auto-extracted from
  domain PDFs, and at inference retrieve top-k passages from a vector index
  over those same PDFs before generating.
description: >-
  LoRA fine-tune a general model on instruction pairs auto-extracted from
  domain PDFs, and at inference retrieve top-k passages from a vector index
  over those same PDFs before generating. Filed by the drafting stage from
  GSI Agent: Domain Knowledge Enhancement for Large Language Models in Green
  Stormwater Infrastructure (2603.15643) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: G-Eval on the domain set: RAG alone
  0.51, fine-tuning alone 0.63, both 0.72; BLEU-4 on the domain set 0.090
  (base) to 0.307, Sentence-BERT 0.544 to 0.742, with the general set at
  0.304 vs 0.305 BLEU-4. No human-expert numbers reported despite the metric
  being defined.. Nobody has vouched for it; add support or contest it on
  this page.
