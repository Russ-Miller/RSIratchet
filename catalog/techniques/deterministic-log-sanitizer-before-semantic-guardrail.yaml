description: >-
  Extract and truncate/mask suspected injection payloads at SIEM ingestion
  with regex decoders and atomic rules, then run an LLM self-check rail on
  the bounded, structured alert before and after the triage model. Filed by
  the drafting stage from Architecting the Secure AI-SOC: A Neurosymbolic
  Framework for Pipeline Integrity and Threat Mitigation (2609.10707) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Counts of
  blocked payloads per layer on 20 synthesized poisoned Wazuh alerts, plus
  one volumetric padding case; no baseline of either layer alone measured
  end-to-end, no utility/false-positive measurement on benign alerts..
  Nobody has vouched for it; add support or contest it on this page.
