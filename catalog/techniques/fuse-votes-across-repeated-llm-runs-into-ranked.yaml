description: >-
  Canonicalize candidate outputs across many stochastic runs and
  configurations, then score each candidate by a weighted count of runs that
  produced it (uniform, or weighted by each model family's estimated
  true/false-positive rates via Naive Filed by the drafting stage from
  Ensembling LLMs for AI-Augmented Cybersecurity Software Requirements
  Generation (2609.10316) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Expert-adjudicated gold standard of 72 valid
  requirements against 111 hallucinations; uniform fusion exceeded the best
  single configuration by 0.142 AP and 0.118 ROC AUC, Naive-Bayes weighting
  added 0.039 and 0.052 reaching 0.864 and 0.869; gains stayed positive in
  at least 92% of out-of-bag bootstrap resamples and every
  structured-perturbation sample. Weights were fitted on the same judged
  corpus, so prospective performance is not established.. Nobody has vouched
  for it; add support or contest it on this page.
