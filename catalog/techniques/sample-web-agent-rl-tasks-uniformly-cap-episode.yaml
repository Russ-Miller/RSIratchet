id: sample-web-agent-rl-tasks-uniformly-cap-episode
ref: TEC-0835
label: "Sample web-agent RL tasks uniformly and cap episode steps"
summary: >-
  Draw RL training tasks uniformly from the full difficulty distribution
  rather than upweighting hard ones, and lower the per-episode interaction
  cap (15/30/45 to 10/20/30 steps) to concentrate credit on early decisions.
description: >-
  Draw RL training tasks uniformly from the full difficulty distribution
  rather than upweighting hard ones, and lower the per-episode interaction
  cap (15/30/45 to 10/20/30 steps) to concentrate credit on early decisions.
  Filed by the drafting stage from WebGym: Scaling Training Environments for
  Visual Web Agents with Realistic Tasks (2601.02439) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Out-of-distribution success
  rate on 1,167 held-out tasks from unseen websites: exclude-domains 31.0%,
  hard-biased 34.5%, easy-only 36.9%, uniform 38.2%, uniform+short horizon
  42.9%, against untrained base 26.2% and GPT-4o 27.1%, GPT-5-Thinking
  29.8%.. Nobody has vouched for it; add support or contest it on this page.
