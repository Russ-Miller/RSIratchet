id: gate-new-skills-sampled-coalition-knockouts-mask-after
ref: TEC-0132
label: "Gate new skills on sampled coalition knockouts, mask after t"
summary: >-
  At acceptance time, score the candidate bank by Monte Carlo sampled
  coalition knockout margins combined with outcome reward instead of outcome
  reward alone; at deployment, greedily mask skills whose removal raises
  retrieval quality on unlab
description: >-
  At acceptance time, score the candidate bank by Monte Carlo sampled
  coalition knockout margins combined with outcome reward instead of outcome
  reward alone; at deployment, greedily mask skills whose removal raises
  retrieval quality on unlab Filed by the drafting stage from
  Coalition-Aware Skill Reliability for Self-Evolving Agents (2608.22610)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Matched-protocol comparison against the MemSkill baseline over three
  seeds: the coalition gate accepted 1 of 12 candidates vs 6 of 12, and a
  K-controlled ablation found the baseline's extra accepted skills net -1.38
  pp; masking improved all six trained banks on HotpotQA-50 (+7.17 pp
  average on baseline banks, +3.59 on gated banks). Overall benchmark gains
  over MemSkill are small (e.g. LoCoMo LLM-Judge 56.58 vs 54.78).. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [harness-self-improvement]
