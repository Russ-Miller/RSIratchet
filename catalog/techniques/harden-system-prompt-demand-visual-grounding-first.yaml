id: harden-system-prompt-demand-visual-grounding-first
ref: TEC-0704
label: "Harden the system prompt to demand visual grounding first"
summary: >-
  Prepend a system instruction that mandates the model keep answers anchored
  to visual evidence and not revise them on user assertion alone.
description: >-
  Prepend a system instruction that mandates the model keep answers anchored
  to visual evidence and not revise them on user assertion alone. Filed by
  the drafting stage from Spatiotemporal Sycophancy: Negation-Based
  Gaslighting in Video Large Language Models (2604.17873) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Sycophancy rate on
  GasVideo-1000 before vs after the hardened system prompt: Gemini-3-Pro
  fell 54.80% to 8.67%, Qwen3-VL only 71.89% to 64.00%, and some open models
  got slightly worse on multiple choice (LLaVA-NeXT 42.83% to 40.78% overall
  but 42.00% to 44.22% on MC), so the defense is model-dependent and does
  not eliminate belief reversal.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [sycophancy]
kind: prompting
sources: [arxiv-2604-17873]
status: proposed
