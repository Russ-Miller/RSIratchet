id: feed-integer-rounded-values-normalized-ones-llm-forecasters
ref: TEC-0034
label: "Feed integer-rounded values, not normalized ones, to LLM for"
summary: >-
  Round each numeric time-series value to the nearest integer before
  serializing it into the prompt, preserving the original scale instead of
  standardizing or instance-normalizing.
description: >-
  Round each numeric time-series value to the nearest integer before
  serializing it into the prompt, preserving the original scale instead of
  standardizing or instance-normalizing. Filed by the drafting stage from
  PRICE: A Systematic Study of LLM Adaptation Choices for Bitcoin Price
  Forecasting (2609.05235) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Validation-set MAPE/SMAPE/NRMSE on BTC/USDT hourly
  forecasting under a fixed zero-shot prompt with only the representation
  varied: rounded 3.01/3.05/0.05 vs raw 4.23/5.42/0.12, standard
  normalization 9.43/9.39/0.16, instance normalization 548.36/132.19/1.41;
  valid-output count unchanged at 1441.. Nobody has vouched for it; add
  support or contest it on this page.
