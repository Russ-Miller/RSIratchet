  exhaustion.
description: >-
  The harness selects all-to-all inter-agent communication while aggregate
  disagreement exceeds a threshold and a ring topology once it falls below,
  with a token budget decremented each round and a guard that halts on
  exhaustion. Filed by the drafting stage from A Control-Theoretic Approach
  for Resource-Aware Consensus in Multi-Agent AI (2608.25099) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by:
  Rounds-to-consensus and total input tokens for adaptive vs complete-only
  vs ring-only, on one planning task with three LLM backbones; adaptive used
  41,727 tokens / 9 rounds for GPT vs 67,593 / 12 complete-only and 60,858 /
  17 ring-only; Claude under complete-only exhausted the 100,000-token
  budget. No repeated trials or statistical test.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [multi-model-coordination]
