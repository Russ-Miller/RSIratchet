label: "Score generated CUDA against expert kernels, not naive basel"
summary: >-
  Fix the target GPU architecture and compare generated kernels' runtime
  against curated human-expert state-of-the-art implementations, gating
  performance credit on domain-specific semantic validators.
description: >-
  Fix the target GPU architecture and compare generated kernels' runtime
  against curated human-expert state-of-the-art implementations, gating
  performance credit on domain-specific semantic validators. Filed by the
  drafting stage from CUDAHercules: Benchmarking Hardware-Aware Expert-level
  CUDA Optimization for LLMs (2605.08467) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Applied to four models and two
  agentic frameworks; separates compile rate, pass rate, semantic validity
  and expert-relative speed, showing high pass rates coexisting with
  sub-0.5x speed and with Kevin32B (RL-tuned on KernelBench) scoring near
  zero.. Nobody has vouched for it; add support or contest it on this page.
