  fine-tunes end to end on p
description: >-
  Continually pre-trains a general LLM on biomedical corpora mixed with
  math/code/science replay data, then contrastively aligns frozen ESM2
  protein embeddings into the LLM's token space via a Q-Former projector and
  fine-tunes end to end on p Filed by the drafting stage from BioBridge:
  Bridging Proteins and Language for Enhanced Biological Reasoning with LLMs
  (2602.17680) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy/F1/Spearman on 16 PFMBench protein tasks against
  nine specialist PLMs and the untouched Qwen base, plus
  MMLU/RACE/AGIEval/OpenBookQA for retained general ability, plus two
  ablations removing pre-training or the encoder+projector.. Nobody has
  vouched for it; add support or contest it on this page.
