id: score-forecasts-confidence-weighted-order-book-executed-return
ref: TEC-0538
label: "Score forecasts by confidence-weighted order-book-executed r"
summary: >-
  Scales each trade's simulated capital by the model's stated confidence and
  executes it against the recorded CLOB snapshot, so overconfident wrong
  calls are penalised and slippage is charged.
description: >-
  Scales each trade's simulated capital by the model's stated confidence and
  executes it against the recorded CLOB snapshot, so overconfident wrong
  calls are penalised and slippage is charged. Filed by the drafting stage
  from PolyBench: Benchmarking LLM Forecasting and Trading Capabilities on
  Live Prediction Market Data (2604.14199) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared against unweighted return
  and directional accuracy over 36,165 predictions; confidence-weighted
  return exceeded the unweighted return for all seven models, and degraded
  as base lot size rose from $10 to $1,000 due to order-book depth.. Nobody
  has vouched for it; add support or contest it on this page.
