id: hierarchical-memory
ref: TEC-0012
label: Tiered memory managed by the model
summary: Keep a small working context and let the model page facts in and out of external storage.
description: >-
  Treat the context window as main memory and an external store as disk.
  The model uses tools to write durable facts out, search them, and pull
  them back in when needed. The working context stays small and relevant
  across sessions of any length.
