id: fully-specify-every-fact-simulator-will-need-scenario
ref: TEC-0616
label: "Fully specify every fact a simulator will need in the scenar"
summary: >-
  Write the scenario object to contain all user facts and initial
  system-state facts the user and tool simulators could need, and forbid the
  simulators from asserting anything not grounded in those facts or the
  agent's subquery.
description: >-
  Write the scenario object to contain all user facts and initial
  system-state facts the user and tool simulators could need, and forbid the
  simulators from asserting anything not grounded in those facts or the
  agent's subquery. Filed by the drafting stage from Toward Scalable
  Verifiable Reward: Proxy State-Based Evaluation for Multi-turn
  Tool-Calling LLM Agents (2602.16246) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Ablation randomly removing fractions
  of system or user facts: tool hallucination rate and user hallucination
  rate rise monotonically with removal; the complete specification yields
  1.33% tool and 0.67% user hallucination, and a weaker state tracker
  (GPT-4o) raises tool hallucination to 3.61%.. Nobody has vouched for it;
  add support or contest it on this page.
