id: decompose-observation-into-sub-goal-sub-view-before
ref: TEC-0108
label: "Decompose the observation into a sub-goal and sub-view befor"
summary: >-
  At inference, the agent splits each complex web observation into an
  aligned sub-goal and task-relevant sub-observation, self-scores the
  decomposition and action, and uses the passed/rejected trials as
  in-context demonstrations or as RL sign
description: >-
  At inference, the agent splits each complex web observation into an
  aligned sub-goal and task-relevant sub-observation, self-scores the
  decomposition and action, and uses the passed/rejected trials as
  in-context demonstrations or as RL sign Filed by the drafting stage from
  Learning Simple Test-Time Environments for LLM Web Agents (2608.29305)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Task success rate against no adaptation, SFT/RL with ground-truth rewards,
  TTT and TTRL: on CompWoB+ at 8 components 19%->61% (Qwen3-8B) and 46%->88%
  (GPT-4o-mini); on WebArena 12.1% base, 14.8% RL with ground truth, 12.5%
  TTT, 21.0% TTED-RL; WorkArena out-of-distribution 18.2%->22.7%. Ablations:
  removing sub-goal drops to 12.4%, sub-observation to 15.0%. Human
  agreement with reward labels 0.85 for TTED vs 0.71 TTT, 0.68 TTRL.. Nobody
  has vouched for it; add support or contest it on this page.
