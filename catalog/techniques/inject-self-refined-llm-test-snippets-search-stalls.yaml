description: >-
  When a search-based test generator makes no fitness progress for N
  generations, prompt an LLM at class level with an iterative
  self-refinement loop, parse its test snippets into the generator's
  internal representation, and merge them into t Filed by the drafting stage
  from Enhancing Automated Unit Test Generation for NLP Libraries Using
  Large Language Models (2609.14784) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Median branch coverage 68.60% vs
  58.03% (CodaMosa-J), 53.33% (EvoSuite), 32.64% (LLM-only); Wilcoxon
  p<<0.05, A12 0.72-0.85; mutation score 63.0% vs 52.0/58.0/38.26. Ablations
  show class-level context, self-refinement, and repeated calls each
  contribute; LLM-generated strings alone gave -1.4%.. Nobody has vouched
  for it; add support or contest it on this page.
