id: sufficiency-test-give-oracle-answer-then-ask-self
ref: TEC-0419
label: "Sufficiency test: give the oracle answer, then ask for a sel"
summary: >-
  Collect wrong answers, show the model its own reasoning plus the
  ground-truth answer and ask it to write leak-free hints, then re-ask the
  original question with those hints appended, as an upper bound on
  intrinsic self-correction.
description: >-
  Collect wrong answers, show the model its own reasoning plus the
  ground-truth answer and ask it to write leak-free hints, then re-ask the
  original question with those hints appended, as an upper bound on
  intrinsic self-correction. Filed by the drafting stage from More Yap Less
  Meaning: Uncovering Self-Improvement Behavior in SLMs (2606.08471) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Measured
  as accuracy change after hint injection versus initial accuracy across 8
  models, 5 datasets and 5 token budgets; average gain 4.4%, with KeyNMF
  topic overlap between helpful and unhelpful hints and a negative
  correlation between hint length and gain.. Nobody has vouched for it; add
  support or contest it on this page.
