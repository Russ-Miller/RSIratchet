id: store-repository-file-paths-inside-each-conversational-memory
ref: TEC-0839
label: "Store repository file paths inside each conversational memor"
summary: >-
  Extends a conversational memory system so each memory entry is a text
  description plus the path locations of associated repository artifacts,
  which are resolved (with fuzzy fallback) to fetch the actual code at
  retrieval time.
description: >-
  Extends a conversational memory system so each memory entry is a text
  description plus the path locations of associated repository artifacts,
  which are resolved (with fuzzy fallback) to fetch the actual code at
  retrieval time. Filed by the drafting stage from A Scalable Benchmark for
  Repository-Oriented Long-Horizon Conversational Context Management
  (2603.06358) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass@1 on execution-tested function generation against
  Vanilla RAG, MemGPT, LD-Agent and unmodified Mem0, plus an Empty lower
  bound and an Oracle upper bound, on 128 samples across three backbones;
  beat the best baseline on five of six subset-by-backbone cells (e.g.
  multi-hop DeepSeek-V3.2 37.50 vs 26.88).. Nobody has vouched for it; add
  support or contest it on this page.
