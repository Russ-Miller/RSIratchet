id: drop-blanket-row-limit-instructions-text-to-sql
ref: TEC-0096
label: "Drop blanket row-limit instructions from text-to-SQL prompts"
summary: >-
  Remove global output-shaping directives such as "LIMIT 10" from the
  SQL-generation system prompt so row count is decided by the question
  rather than the prompt.
description: >-
  Remove global output-shaping directives such as "LIMIT 10" from the
  SQL-generation system prompt so row count is decided by the question
  rather than the prompt. Filed by the drafting stage from An Iterative
  LangGraph Agent for Text-to-SQL: Natural Language Access to the Chicago
  Crime Database (2609.22917) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Two prompt revisions of the same agent on 100
  stratified questions: overall execution accuracy 47%->60% under a hybrid
  relational equivalence metric (12%->19% strict JSON match), valid SQL rate
  87%->93%, synthesis quality 3.91->4.34; hard-tier strict EX 7%->17%.
  Confounded with a concurrent relevance-checker keyword expansion.. Nobody
  has vouched for it; add support or contest it on this page.
