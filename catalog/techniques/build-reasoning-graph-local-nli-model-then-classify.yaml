description: >-
  Split a long chain of thought on transition keywords, link steps with
  entailment and contradiction edges predicted by a local NLI model instead
  of LLM calls, and train a graph attention network to predict whether the
  chain's final answer is Filed by the drafting stage from LCoT-GV: Graph
  Attention Networks for Verifying Long Reasoning Chains in Large Language
  Models (2608.30679) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy averaged over five runs against LCoT2Tree and a
  length-based classifier on four benchmarks: average 77.03 for the proposed
  method vs 74.68 for LCoT2Tree, with gains on LiveCodeBench and GPQA and
  losses on MATH and MMLU-Pro.. Nobody has vouched for it; add support or
  contest it on this page.
