id: render-knowledge-updates-shared-pool-extended-matching-items
ref: TEC-0313
label: "Render knowledge updates as shared-pool extended matching it"
summary: >-
  Group related update vignettes into one training instance with a shared
  answer option pool so the model must discriminate across vignettes between
  current and superseded recommendations.
description: >-
  Group related update vignettes into one training instance with a shared
  answer option pool so the model must discriminate across vignettes between
  current and superseded recommendations. Filed by the drafting stage from
  Dense Clinical Contrasts Enhance Medical Knowledge Updating in Large
  Language Models (2608.30405) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: SEER-Bench answer accuracy 57.6 to 64.8 and
  rationale accuracy 50.7 to 59.6 on Qwen3-4B, versus 61.5-62.7 answer
  accuracy for the three other same-budget formats; HealthBench retention
  0.247 to 0.263; replicated on Llama-3.1-8B and across 1.7B/8B/14B
  backbones; vignette-matched and density-matched controls reported in
  appendices.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [knowledge-updating]
kind: training
sources: [arxiv-2608-30405]
status: proposed
