id: render-long-code-into-images-instead-filtering-tokens
ref: TEC-0629
label: "Render long code into images instead of filtering tokens"
summary: >-
  Instead of pruning code units to fit a context budget, render the entire
  code context into a sequence of compressed images and feed them to a
  vision-language model as visual tokens.
description: >-
  Instead of pruning code units to fit a context budget, render the entire
  code context into a sequence of compressed images and feed them to a
  vision-language model as visual tokens. Filed by the drafting stage from
  Can Vision-Language Models Handle Long-Context Code? An Empirical Study on
  Visual Compression (2602.00746) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: CompScore on Long Module Summarization (87.25
  vs 50.40 for LongCodeZip at ~1.7x), ES on RepoBench-P (50.22-60.68 vs
  39.48 at 2.0x), LCC ES/EM, LongCodeQA accuracy at 512k-1M;
  compression-stage latency ~1 min vs ~4.3 h at 1M tokens. Exact Match on
  LCC drops sharply at 16k+ for Qwen3-VL-8B (EM 2.08).. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [long-context-degradation]
kind: retrieval
sources: [arxiv-2602-00746]
status: proposed
