description: >-
  Supervised fine-tuning on single-modal MIP program demonstrations followed
  by GRPO whose reward comes from solver execution status, API coverage,
  output format, and verified trajectory constraints, so the model emits an
  executable optimizat Filed by the drafting stage from M$^3$P-R1:
  Reinforcement Learning for Large Language Model Guided Multi-Modal Motion
  Planning via MIP Code Generation (2609.18669) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Task-level success rate on 276
  held-out LLMM3PBench problems plus OOD splits: 91.7% single-modal / 80.9%
  multi-modal vs 65.3/40.3 for the strongest prompt-only baseline (GPT-5.2),
  with stage and reward-term ablations at matched 200- and 800-step budgets,
  and 35/40 real hardware runs.. Nobody has vouched for it; add support or
  contest it on this page.
