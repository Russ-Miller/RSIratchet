id: track-tool-object-turn-video-plans-into-motion
ref: TEC-0905
label: "Track the tool, not the object, to turn video plans into mot"
summary: >-
  Segments the gripper in a world-model-generated video, extracts dense 3D
  point trajectories, fits a per-step rigid-body transform for 6-DoF
  end-effector commands, and predicts gripper aperture from a separate
  semantic-feature head.
description: >-
  Segments the gripper in a world-model-generated video, extracts dense 3D
  point trajectories, fits a per-step rigid-body transform for 6-DoF
  end-effector commands, and predicts gripper aperture from a separate
  semantic-feature head. Filed by the drafting stage from TC-IDM: Grounding
  Video Generation for Executable Zero-shot Robot Motion (2601.18323) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Real-robot success rates on 9 tasks binned easy/medium/hard, against
  ResNet-MLP, AVDC, AnyPos and a 2D-tracker IDM on ground-truth replay
  (93.3/53.3/28.9% vs baselines), and against pi-0 plus eight video-model
  IDM pipelines (61.11% average, 38.46% zero-shot deformable).. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [embodied-control]
