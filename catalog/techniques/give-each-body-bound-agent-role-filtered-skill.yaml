id: give-each-body-bound-agent-role-filtered-skill
ref: TEC-0037
label: "Give each body-bound agent a role-filtered skill menu"
summary: >-
  A commander parses the mission, assigns roles, and exposes to each
  UAV-bound agent only the top-ranked skills for its role, with agents
  choosing their own actions and passing directed peer messages instead of
  receiving a joint plan.
description: >-
  A commander parses the mission, assigns roles, and exposes to each
  UAV-bound agent only the top-ranked skills for its role, with agents
  choosing their own actions and passing directed peer messages instead of
  receiving a joint plan. Filed by the drafting stage from AeroWeaver: An
  Embodied-Agent Harness for Weaving Aerial Skills into Distributed,
  Adaptive Swarm Execution (2609.18520) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Mean undiscounted episode return over
  10 episodes on nine tasks against a centralized joint-action planner and
  HMAS-2 (central plan plus one local review round), plus three component
  ablations and per-episode token counts.. Nobody has vouched for it; add
  support or contest it on this page.
