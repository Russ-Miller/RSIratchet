id: amplify-intent-contrasting-intent-masked-logits
ref: TEC-0586
label: "Amplify intent by contrasting intent-masked logits"
summary: >-
  At each decoding step, compute logits with the user intent masked out,
  scale the difference from the unmasked logits by several strengths, and
  ensemble the resulting top tokens as beam-search candidates.
description: >-
  At each decoding step, compute logits with the user intent masked out,
  scale the difference from the unmasked logits by several strengths, and
  ensemble the resulting top tokens as beam-search candidates. Filed by the
  drafting stage from IntentCoding: Amplifying User Intent in Code
  Generation (2602.00066) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Accuracy on a purpose-built CodeConstraints
  benchmark (constraints combinatorially composed into levels 2-4) and
  IFEvalCode, plus pass@1 on HumanEval and LiveCodeBench, against greedy,
  beam search, nucleus sampling, AdapT and Selective Prompt Anchoring; up to
  71% relative gain on CodeConstraints and 29.3% pass@1 gain, including at
  beam size 1; a fixed-alpha sweep shows the optimal strength varies by
  model while the ensemble matches or beats it.. Nobody has vouched for it;
  add support or contest it on this page.
addresses: [code-generation]
kind: decoding
sources: [arxiv-2602-00066]
status: proposed
