label: "Train each agent role on downstream execution rewards"
summary: >-
  Optimizes the Planner with GRPO using the Coder's test-pass rate and
  estimated time complexity as a verifiable reward, then optimizes the Coder
  with pass rate plus memory-efficiency reward, each stage freezing the
  other agent.
description: >-
  Optimizes the Planner with GRPO using the Coder's test-pass rate and
  estimated time complexity as a verifiable reward, then optimizes the Coder
  with pass rate plus memory-efficiency reward, each stage freezing the
  other agent. Filed by the drafting stage from CoRe-Code: Collaborative
  Reinforcement Learning for Code Generation (2605.24812) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Pass@1/Pass@5/APR
  on four benchmarks against GRPO, Focused-DPO, CURE, CodeRL+ and against
  SCoT, Reflexion, MapCoder; ablations removing Planner RL or Coder RL; a
  defined collaboration-gain metric tracked over training.. Nobody has
  vouched for it; add support or contest it on this page.
