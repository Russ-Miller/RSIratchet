description: >-
  Specialized generation and critic agents produce murder-mystery scripts,
  multimodal clues and reasoning chains, which are used first for supervised
  fine-tuning and then for GRPO where an LLM ScoreAgent rewards
  role-consistent self-introduct Filed by the drafting stage from
  Collaborative Multi-Agent Scripts Generation for Enhancing
  Imperfect-Information Reasoning in Murder Mystery Games (2604.11741) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Seven
  metrics on WhodunitBench (multi-hop multimodal reasoning, case murder
  detail, role-playing, decision-making, three perception metrics) against
  the untrained backbone, 10 proprietary and open VLMs, and ablations
  removing SFT, removing RL, and removing the image-clue-match reward;
  LLM-judge scores checked against human judgments (Spearman 0.71 CMD, 0.62
  RP).. Nobody has vouched for it; add support or contest it on this page.
