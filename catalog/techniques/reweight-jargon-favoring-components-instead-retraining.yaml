description: >-
  Decompose output logits into per-attention-head and per-MLP direct
  contributions and learn a scalar weight per component on a small training
  split, suppressing the components that over-favor the jargon label at
  inference time without touchi Filed by the drafting stage from
  Domain-Specific Jargon in Large Language Models: A Comparative Analysis
  between General-Purpose and Specialist Models (2609.13556) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Reweighting raised
  UltraMedical's jargon-identification accuracy from 53.1 to 56.1 (McNemar
  p=0.01, by removing 270 false positives at the cost of 146 new false
  negatives), while the same procedure lowered Instruct by 1.0 point and
  changed both models' jargon-understanding accuracy by at most 0.2 points..
