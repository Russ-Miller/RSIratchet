label: "Exchange typed logical edges, not dialogue, between agents"
summary: >-
  Each modality agent builds a local evidence graph and agents update one
  another only by establishing typed edges (cascade, syndrome, exclusion,
  context) before an expert agent arbitrates the merged candidate graphs
  against a referral knowle
description: >-
  Each modality agent builds a local evidence graph and agents update one
  another only by establishing typed edges (cascade, syndrome, exclusion,
  context) before an expert agent arbitrates the merged candidate graphs
  against a referral knowle Filed by the drafting stage from Evidence,
  Logic, and Compliance: Multi-Agent Structured Graph Reasoning with Expert
  Arbitration for Medical Referral (2608.30938) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Referral F1 on 952 real
  inpatient cases: 95.3% vs 91.4% for MMA and 92.6% for ToR multi-agent
  baselines and 89.7% for GPT-5; replacing the graph with natural-language
  output cost 5.1 F1, removing inter-agent collaboration 6.1, removing the
  knowledge base 2.3; removing the cascade relation alone dropped F1 to
  90.6%, more than any other relation type. Nobody has vouched for it; add
  support or contest it on this page.
