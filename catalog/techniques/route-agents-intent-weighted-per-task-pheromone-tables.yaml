description: >-
  A fine-tuned ~1B router predicts a task-mixture distribution per query,
  which fuses separate per-task pheromone matrices into transition
  probabilities over a layered agent graph, with reinforcement applied
  asynchronously only to trajectorie Filed by the drafting stage from
  Efficient and Interpretable Multi-Agent LLM Routing via Ant Colony
  Optimization (2603.12933) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Average pass@1 over MMLU, GSM8K, MATH, HumanEval,
  MBPP (87.83 vs 85.93 for MasRouter, same model pool and inference budget);
  drop-in substitution into MacNet, GPTSwarm, HEnRY raised accuracy and
  lowered dollar cost; ablations against random routing (79.64) and no-SFT
  routers (83.42 at 1B, 86.48 with a GPT-4o-mini router); stress test to
  1000 concurrent workers.. Nobody has vouched for it; add support or
  contest it on this page.
