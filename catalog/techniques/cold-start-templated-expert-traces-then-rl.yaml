description: >-
  Convert engine annotations into step-structured natural-language traces
  (identify player, analyse candidate moves, summarise, emit structured
  answer), mix them with general long-CoT data for supervised fine-tuning,
  then run GRPO with a tier Filed by the drafting stage from Mixing Expert
  Knowledge: Bring Human Thoughts Back To the Game of Go (2601.16447) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  KataGo-Bench-1K prediction accuracy: 88.1% (7B) and 88.6% (32B) versus
  34.3% for the best general model and 87.8% for KataGo-HumanSL-9d; RL
  without cold start stayed below the 67.4% beginner reference; replacing
  the heuristic template with direct next-move prediction capped the 7B RL
  ceiling below 50%; general benchmarks (GPQA, MATH, AIME, LiveCodeBench)
  held or improved.. Nobody has vouched for it; add support or contest it on
  this page.
