id: route-each-agent-step-predicted-task-progress-gain
ref: TEC-0293
label: "Route each agent step by predicted task-progress gain"
summary: >-
  Scores intermediate workflow state into a progress value, predicts each
  candidate model's progress gain from structured and semantic features, and
  picks the model maximizing gain minus time/cost-budget penalties at every
  dispatch step.
description: >-
  Scores intermediate workflow state into a progress value, predicts each
  candidate model's progress gain from structured and semantic features, and
  picks the model maximizing gain minus time/cost-budget penalties at every
  dispatch step. Filed by the drafting stage from ProgRouter: Online
  Progress-Guided Orchestration for Multi-Agent LLM Workflows under
  Quality-Cost Tradeoffs (2608.25992) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Pass rate / citation precision,
  energy in Joules and wall-clock time against single-model policies,
  MasRouter (one-shot), CASCADIA (escalation) and an Educated Guessing
  baseline on four benchmarks, with a fixed long-term energy budget marking
  feasible methods; best or near-best among budget-satisfying methods on 3
  of 4 datasets, and 3.5 points below CASCADIA on MATH-500 at lower energy..
  Nobody has vouched for it; add support or contest it on this page.
