id: reward-abstention-tuned-ternary-rlvr-reward
ref: TEC-0650
label: "Reward abstention with a tuned ternary RLVR reward"
summary: >-
  Train with GRPO on a reward of +1 correct, -1 wrong, and a tuned scalar
  r_abs for emitting 'I don't know', optionally preceded by SFT that
  converts some answers to abstentions.
description: >-
  Train with GRPO on a reward of +1 correct, -1 wrong, and a tuned scalar
  r_abs for emitting 'I don't know', optionally preceded by SFT that
  converts some answers to abstentions. Filed by the drafting stage from
  Rewarding Intellectual Humility Learning When Not To Answer In Large
  Language Models (2601.20126) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Correct/incorrect/IDK response distributions on
  held-out ~100-sample MedMCQA and MATH sets, compared against the base
  model with and without an IDK option; r_abs swept from -0.95 to 0.3..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [abstention-and-self-knowledge]
