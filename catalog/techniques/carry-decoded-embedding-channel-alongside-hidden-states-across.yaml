description: >-
  At each loop iteration, add to the residual stream a gated, RMS-normalized
  soft decode-then-encode of the hidden state (tempered LM-head
  probabilities times the tied embedding matrix), so the recurrence passes
  both a continuous hidden state Filed by the drafting stage from DiscoLoop:
  Looping Discrete Embeddings and Continuous Hidden States for Multi-hop
  Reasoning (2607.00341) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Two-hop ID/OOD accuracy against a vanilla looped
  transformer sharing the same base block and a FLOPs-matched non-looped
  stack: near-perfect ID and OOD versus ~70% ID and <10% OOD for vanilla
  loop and <20% ID / ~0% OOD non-looped; same pattern on two
  synthetic-language formats and a three-hop extension; in 440M pretraining
  on 20B tokens, average zero-shot score 50.5 vs 49.3 (vanilla loop) and
  49.8 (PonderLM).. Nobody has vouched for it; add support or contest it on
  this page.
