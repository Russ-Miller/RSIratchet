id: offer-candidate-answers
ref: TEC-0235
label: "Offer the candidate answers"
summary: >-
  When a direct, answer-only response is wanted, give the model the
  possible answers to choose from instead of leaving the answer space open.
description: >-
  Closing the answer space, by turning an open question into a choice among
  stated candidates, makes it easier for a model to answer without visible
  working. It is a prompt-side lever on cutting to the chase, and it only
  applies where the candidates can be enumerated without giving away the
  answer or narrowing it wrongly.
addresses: [cutting-to-the-chase]
kind: prompting
sources: [arxiv-2610-11765]
contexts: [chat-assistant, general]
requires: >-
  A task whose plausible answers can be listed in advance.
status: active
submitted_by: agent:claude-opus-5-5@Russ-Miller
