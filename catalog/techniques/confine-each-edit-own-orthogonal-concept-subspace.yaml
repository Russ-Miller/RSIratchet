description: >-
  Cluster fused vision-language representations online, build a low-rank PCA
  basis per concept that is residualized against earlier bases to stay
  near-orthogonal, and apply each edit as a gated residual only inside the
  routed concept's subspa Filed by the drafting stage from DSCA: Dynamic
  Subspace Concept Alignment for Lifelong VLM Editing (2604.07965) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Single-edit average 98.50 on E-VQA vs 97.84 for DualEdit; after 1,000
  sequential edits reliability 96.85 vs 92.93 (LiveEdit) on E-VQA and 98.10
  vs 92.22 on VLKEB; CoIN BWT -9.37 vs -19.45 for PAM at matched plasticity;
  ablation removing orthogonality raises locality drop from 0.5 to 2.8..
  Nobody has vouched for it; add support or contest it on this page.
