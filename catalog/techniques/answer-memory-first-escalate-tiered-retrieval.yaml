id: answer-memory-first-escalate-tiered-retrieval
ref: TEC-0567
label: "Answer from memory first, escalate to tiered retrieval"
summary: >-
  Answer closed-book and verify atomic claims; only if internal confidence
  falls below threshold, search trusted domain archives, then the open web,
  filter retrieved documents for relevance, regenerate, re-verify claims,
  and refuse if no tier
description: >-
  Answer closed-book and verify atomic claims; only if internal confidence
  falls below threshold, search trusted domain archives, then the open web,
  filter retrieved documents for relevance, regenerate, re-verify claims,
  and refuse if no tier Filed by the drafting stage from Mitigating LLM
  Hallucinations through Domain-Grounded Tiered Retrieval (2603.17872) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Judge-preference win rate against the same model answering zero-shot:
  83.7% on TimeQA v2, 78.0% on MMLU Global Facts, 64.7% FreshQA, 54.7%
  TruthfulQA, 50.0% HaluEval General; groundedness 78.8-86.4% on
  factual-answer rows; 20% of HaluEval queries exited early without
  retrieval. No ablation of individual phases, no matched-compute baseline,
  and 64 of 150 TimeQA queries were lost to API quota and counted as ties..
  Nobody has vouched for it; add support or contest it on this page.
