label: "Reward the time intervals the agent chooses to visit"
summary: >-
  During RL, score the agent's video-tree navigation with an F1 over the
  overlap between the clips it requested and the annotated evidence
  intervals, plus a repeat-visit penalty, alongside the answer reward.
description: >-
  During RL, score the agent's video-tree navigation with an F1 over the
  overlap between the clips it requested and the annotated evidence
  intervals, plus a repeat-visit penalty, alongside the answer reward. Filed
  by the drafting stage from LongVideo-R1: Smart Navigation for Low-cost
  Long Video Understanding (2602.20913) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Ablation against the SFT checkpoint
  and against RL without the location reward: LVBench overall 41.6 (SFT) /
  45.8 (RL, no location reward) / 50.0 (full), with KIR 48.5/49.1/56.4 and
  TG 50.9/53.2/56.4; average 10.5 tool rounds versus Ego-R1's ~86 caption
  segments at comparable Video-MME accuracy.. Nobody has vouched for it; add
  support or contest it on this page.
