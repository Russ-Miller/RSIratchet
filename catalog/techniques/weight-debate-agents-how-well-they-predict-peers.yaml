description: >-
  Each round, agents privately submit both their own answer distribution and
  a prediction of the average peer distribution; Brier-score accuracy of the
  peer prediction exponentially updates each agent's influence weight in the
  final aggregati Filed by the drafting stage from Breaking the Martingale
  Curse: Multi-Agent Debate via Asymmetric Cognitive Potential Energy
  (2603.06801) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average accuracy over six challenging subsets vs majority
  voting, decentralized/centralized/sparse MAD, and single agent, on
  GPT-4o-mini (49.92% at T=3 vs 29.61% best baseline) and Qwen3-235B;
  ablations replacing peer prediction with self-confidence or uniform
  weights lose most of the gain. Per-dataset results include losses (e.g.
  MedQA 60.97->27.10 at T=3 on Qwen3) and non-monotonic behaviour in round
  count and agent count.. Nobody has vouched for it; add support or contest
  it on this page.
