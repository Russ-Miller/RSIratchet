id: retrain-both-agents-paths-summary-agent-approved
ref: TEC-0575
label: "Retrain both agents on paths the summary agent approved"
summary: >-
  The reasoning agent drafts a chain, the summary agent critiques it and
  answers, the reasoning agent revises on that feedback for up to three
  rounds, and the surviving trajectories are filtered and used to fine-tune
  both agents again.
description: >-
  The reasoning agent drafts a chain, the summary agent critiques it and
  answers, the reasoning agent revises on that feedback for up to three
  rounds, and the surviving trajectories are filtered and used to fine-tune
  both agents again. Filed by the drafting stage from Insight-V++: Towards
  Advanced Long-Chain Visual Reasoning with Multimodal Large Language Models
  (2603.18118) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average scores on 10 general image benchmarks, 6 advanced
  reasoning benchmarks (53.9 vs 51.5 for the RL multi-agent stage) and 6
  video benchmarks (54.2 vs 52.9), all against the same base model and the
  same multi-agent RL checkpoint.. Nobody has vouched for it; add support or
  contest it on this page.
