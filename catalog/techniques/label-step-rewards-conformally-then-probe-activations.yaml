  Agents (2604.19775) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Probe accuracy and F1 per layer and timestep on held-out
  in-distribution and out-of-distribution task sets in both environments; no
  baseline detector compared, and the steering follow-up (RepE direction
  added once at timestep 3) gave only +1.1% task accuracy against 2.8-6.8%
  for Best-of-N, RFT and DPO.. Nobody has vouched for it; add support or
  contest it on this page.
