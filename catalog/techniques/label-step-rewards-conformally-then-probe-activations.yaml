description: >-
  Estimate a step-wise reward by Monte Carlo rollout from each partial
  trajectory, convert it into a success or failure label with inductive
  conformal prediction at a chosen error level, and train linear probes on
  the agent's residual-stream Filed by the drafting stage from From Actions
