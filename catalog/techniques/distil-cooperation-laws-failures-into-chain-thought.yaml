description: >-
  Agents summarize recurring failure patterns into about five
  natural-language behavioral laws, keep only successful law-aligned traces,
  generate law-referencing reasoning for each action, and fine-tune the
  backbone on those traces, with the Filed by the drafting stage from
  LLawCo: Learning Laws of Cooperation for Modeling Embodied Multi-Agent
  Behavior (2606.28182) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rate and percentage-complete on PARTNR-Dialog
  (1,000 validation episodes) and TDW-MAT against ReAct, RoCo, CoELA and
  CommPARTNR with the same backbones: average +4.5% success on PARTNR-Dialog
  and +6.8% on TDW-MAT over the strongest communicative baseline; ablations
  removing SFT (-5% success), removing laws, and removing trace filtering
  each lose ground, and an inference-only RAG variant does not close the SFT
  gap. On LLaMA-3.1-8B it beats all communicative baselines (0.57) but
  trails ReAct (0.62). Three seeds give success 0.74/0.72/0.74.. Nobody has
  vouched for it; add support or contest it on this page.
