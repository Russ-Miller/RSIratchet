description: >-
  Aligns audio and video features to text, instruction-tunes on
  human-verified observe-think-summarize chains, adds RL with a reward for
  evidence that semantically matches the annotated cues, and masks fused
  tokens that score low on prompt re Filed by the drafting stage from
  DeceptionX: From Multimodal Evidence to Explainable Deception Detection
  (2606.11385) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy and F1 on DOLOs, Bag-of-Lies and MU3D against
  closed (GPT-4o, Gemini3Pro) and open (AffectGPT, Qwen2.5-Omni) MLLMs and
  six specialized detectors, plus a Semantic Evidence Alignment metric
  against annotated cues; ablations separate the three-stage pipeline from
  the token-masking module and sweep the mask count.. Nobody has vouched for
  it; add support or contest it on this page.
