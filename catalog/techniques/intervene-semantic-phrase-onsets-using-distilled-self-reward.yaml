description: >-
  Distils the LVLM's own phrase-level self-evaluation confidence into a
  lightweight CLIP-based reward model that scores each newly started phrase
  online and, when the score falls below a threshold, searches over
  alternative initial tokens and Filed by the drafting stage from Mitigating
  Multimodal Hallucination via Phase-wise Self-reward (2604.17982) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: CHAIR,
  Cover, Hal, Cog on AMBER; CHAIR_S/CHAIR_I on Object HalBench; MMHal-Bench
  overall and Hal; POPE accuracy/F1 — compared against base model and
  post-hoc baselines (VCD, M3ID, OPERA, AVISC, Octopus, ONLY, EAZY). CHAIR
  on AMBER for LLaVA-1.5-7B fell 7.8 to 3.9; phase-level hallucination
  accumulation rate 0.07% vs 0.35% base and 0.40% M3ID.. Nobody has vouched
  for it; add support or contest it on this page.
