ref: TEC-0249
label: "Build the RAG graph from token co-occurrence, not LLM extrac"
summary: >-
  Links corpus tokens by sliding-window co-occurrence into a weighted graph,
  expands query seed tokens with Personalized PageRank, scores candidate
  chunks by PPR-weighted BM25, then reranks by embedding similarity and
  iterates using named ent
description: >-
  Links corpus tokens by sliding-window co-occurrence into a weighted graph,
  expands query seed tokens with Personalized PageRank, scores candidate
  chunks by PPR-weighted BM25, then reranks by embedding similarity and
  iterates using named ent Filed by the drafting stage from Efficient
  Retrieval-Augmented Generation via Token Co-occurrence Graphs (2606.30093)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Recall@2/@5 and EM/F1 against NaiveRAG, HippoRAG2, LightRAG, GraphRAG,
  RAPTOR, KGP, ToG on three benchmarks, plus indexing time, end-to-end
  latency and context token count; ablations removing BM25 (marginal),
  replacing PPR with degree centrality (large drop), and removing reranking
  (large drop).. Nobody has vouched for it; add support or contest it on
  this page.
