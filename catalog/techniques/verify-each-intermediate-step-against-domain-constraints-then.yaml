description: >-
  After every tool call, a manager role re-reads structured global memory
  and classifies the output as pass/uncertain/fail on schema validity,
  sub-goal consistency and domain plausibility, replanning or re-routing on
  failure. Filed by the drafting stage from HiRS-Agent: A Hierarchical
  Multi-Agent System for Reliable Long-Horizon Remote Sensing Task Solving
  (2608.30672) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Architecture ablation on Earth-Bench with Qwen3-4B:
  adding the verifier to a flat agent raised Tool-Exact-Match from
  6.84/19.42 to 29.05/30.14 and Accuracy from 16.53/20.16 to 35.89/31.45;
  removing the verifier from the full system cut Exact by 11.30/12.43 and
  Accuracy by 4.03/2.82.. Nobody has vouched for it; add support or contest
  it on this page.
