description: >-
  Organizes agent context into three tiers — raw traces of the active phase,
  LLM-written summaries of completed phases, and task-level wisdom retrieved
  by embedding similarity at task start — with raw traces evicted once
  promoted. Filed by the drafting stage from Toward Ultra-Long-Horizon
  Agentic Science: Cognitive Accumulation for Machine Learning Engineering
  (2601.10402) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: MLE-Bench medal rate 56.4% averaged over 3 seeds vs 29.3%
  for the prior version of the same system and 50.7% for the best reported
  baseline; single-seed MLE-Bench-Lite ablations dropping each tier (no
  phase summaries: medal 59.1 vs 72.7; no cross-task wisdom: 54.5; no raw
  traces: 22.7); one context-length trace showing peak tokens cut from >200k
  to ~70k.. Nobody has vouched for it; add support or contest it on this
  page.
