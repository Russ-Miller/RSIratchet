description: >-
  At decoding steps with high token entropy, select the top-attention visual
  patches from middle-layer cross-attention, reinject them as key-value
  memory into those same middle layers, and additionally branch a temporally
  perturbed copy of th Filed by the drafting stage from STEAR: Layer-Aware
  Spatiotemporal Evidence Intervention for Hallucination Mitigation in Video
  Large Language Models (2604.03045) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy on EventHallusion,
  VidHalluc, NExT-QA and MVBench across three backbones against VCD, MemVR,
  TCD and DINO-HEAL baselines, plus ablations removing the uncertainty
  trigger (54.77 to 48.41 on EventHallusion) and relocating reinjection to
  early (49.63) or late (47.19, below the 47.43 baseline) layers.. Nobody
  has vouched for it; add support or contest it on this page.
