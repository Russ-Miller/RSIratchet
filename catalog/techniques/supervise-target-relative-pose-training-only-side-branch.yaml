id: supervise-target-relative-pose-training-only-side-branch
ref: TEC-0896
label: "Supervise target relative pose as a training-only side branc"
summary: >-
  Attach a compact transformer head after the LLM that predicts the tracked
  target's 3D relative position and yaw during training only, so the encoder
  embeds geometric priors into the features the flow-matching action expert
  consumes.
description: >-
  Attach a compact transformer head after the LLM that predicts the tracked
  target's 3D relative position and yaw during training only, so the encoder
  embeds geometric priors into the features the flow-matching action expert
  consumes. Filed by the drafting stage from UAV-Track VLA: Embodied Aerial
  Tracking via Vision-Language-Action Models (2604.02241) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Ablation against
  the same model without the head: seen maps far-distance pedestrian success
  61.76% vs 37.88% and tracked frames 269.65 vs 183.96; unseen maps 226.90
  vs 159.22 frames; vehicle gains much smaller and mixed.. Nobody has
  vouched for it; add support or contest it on this page.
