id: replace-domain-fine-tuning-retrieval-plus-execution-feedback
ref: TEC-0803
label: "Replace domain fine-tuning with retrieval plus execution-fee"
summary: >-
  Keep the general-purpose model unchanged and supply domain knowledge at
  inference time: retrieve Qiskit docs plus core source code (dense FAISS,
  k=4) into the prompt, then feed unit-test error messages back for up to
  five repair attempts.
description: >-
  Keep the general-purpose model unchanged and supply domain knowledge at
  inference time: retrieve Qiskit docs plus core source code (dense FAISS,
  k=4) into the prompt, then feed unit-test error messages back for up to
  five repair attempts. Filed by the drafting stage from Revisiting Quantum
  Code Generation: Where Should Domain Knowledge Live? (2603.22184) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: pass@1 on
  151 Qiskit-HumanEval tasks against a zero-shot baseline and the published
  fine-tuned Granite-20B baseline (46.5%); agentic repair raised every model
  (e.g. Opus 4.6 68.9% zero-shot to 85.4% at five repairs), while RAG alone
  gave modest and model-dependent gains, at 2-4x runtime.. Nobody has
  vouched for it; add support or contest it on this page.
