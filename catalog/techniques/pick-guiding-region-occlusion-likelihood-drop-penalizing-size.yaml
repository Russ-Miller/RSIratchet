id: pick-guiding-region-occlusion-likelihood-drop-penalizing-size
ref: TEC-0158
label: "Pick the guiding region by occlusion likelihood drop, penali"
summary: >-
  Propose many anatomical masks with a medical segmentation model, score
  each by the drop in draft-answer log-likelihood under two occlusion
  operators minus an area penalty and an occlusion-variance penalty, then
  use the winning compact mask
description: >-
  Propose many anatomical masks with a medical segmentation model, score
  each by the drop in draft-answer log-likelihood under two occlusion
  operators minus an area penalty and an occlusion-variance penalty, then
  use the winning compact mask Filed by the drafting stage from
  Counterfactual Anatomy-guided Spatial-Temporal Decoding for
  Annotation-Free Hallucination Mitigation in Medical VLMs (2608.17427) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Overall/closed/open accuracy on SLAKE and MIMIC-CXR across Phi-3.5V-Med,
  HuatuoGPT-Vision-7B, LLaVA-Med-7B against plain decoding, VCD, DoLA, OPERA
  and ground-truth-ROI ARCD; closed accuracy on SLAKE with Phi-3.5V-Med rose
  61.42 to 81.49. Ablations: random mask -4.4%, no area penalty -3.4%,
  single occlusion mode -3.3/-4.0%.. Nobody has vouched for it; add support
  or contest it on this page.
