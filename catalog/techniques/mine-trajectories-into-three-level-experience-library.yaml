  After each labelled run, an LLM distills successful and failed multi-agent
  trajectories into natural-language 'golden' and 'warning' entries, merges
  them by embedding similarity into a principle/pattern/case library, and
  retrieves relevant Filed by the drafting stage from EMR: Self-Evolving
  Medical Multi-Agent System via Experience Mining and Reuse (2609.15161)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy on nine medical QA sets against single-LLM, static multi-agent
  (MedAgents, MDAgents) and experience-based (ExpeL, ReasoningBank,
  G-Memory, MDTeamGPT, EvolveR) baselines; average accuracy 81.1 vs 77.8 for
  MDAgents on Qwen3-8B and 93.9 vs 92.4 on GPT-4o; ablations removing
  experience (-6.7 on MedQA) and each hierarchy level (cases -1.2, patterns
  -2.5, principles -4.6).. Nobody has vouched for it; add support or contest
  it on this page.
