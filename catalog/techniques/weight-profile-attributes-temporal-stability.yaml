id: weight-profile-attributes-temporal-stability
ref: TEC-0183
label: "Weight profile attributes by temporal stability"
summary: >-
  Distil a structured user profile incrementally from history, score each
  attribute by support, duration and recency combined with entropy
  weighting, and inject the score as a salience prior in the prompt.
description: >-
  Distil a structured user profile incrementally from history, score each
  attribute by support, duration and recency combined with entropy
  weighting, and inject the score as a salience prior in the prompt. Filed
  by the drafting stage from To Memories and Beyond: From Remembering to
  Knowing You across Long-Term Multimodal Personal Archives (2609.19167)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Swapped into EverMemOS's pipeline with retrieval and backbone fixed: beat
  full context on persona inference for all three readers (+0.6/+4.0/+4.3)
  and matched or beat it on prediction (0.0/+3.5/+1.8) at ~6k tokens vs
  ~123k; ablating the stability weighting lowered persona inference for all
  readers but raised open-ended assistance by about 2.4 points. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [long-term-memory]
kind: prompting
