description: >-
  An LLM reasoner iteratively picks an observation tool (broad parallel
  scan, dense single-segment focus, or stitched multi-segment verification)
  plus its time interval and frame rate, with timestamp anchors and a
  running entity table carried Filed by the drafting stage from LensWalk:
  Agentic Video Understanding by Planning How You See in Videos (2603.24558)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy on LVBench, LongVideoBench long, Video-MME long, EgoSchema, MMVU,
  Video-MMMU against single-pass 256-frame baselines and prior video agents;
  component ablation on Video-MME long (removing Scan Search -4.6, Stitch
  Verify -3.2, Segment Focus -1.9, anchors and memory ~0.3-0.6 each); token
  cost compared with caption-indexing agents.. Nobody has vouched for it;
  add support or contest it on this page.
