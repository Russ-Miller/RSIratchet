description: >-
  A multi-agent loop that retrieves Vitis optimization strategies, evolves a
  pool of candidate kernels scored by simulated latency and resources,
  verifies functional correctness by de-pragmatizing the kernel and running
  a generated C++ test p Filed by the drafting stage from FPGAgent: An
  LLM-Assisted Framework for Autonomous HLS Code Generation and Verification
  in FPGA Environments (2608.23630) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against zero-shot pass@10 on 78
  HLS-Eval tasks: average +16.9 points synthesizable rate, +26.7 executable,
  +30.6 functional correctness; ablation on Qwen3-Coder-30B gave base
  59.0/47.4/37.2, evolution only 80.1/66.7/48.7, reflection only
  57.7/50.0/46.2, full 83.3/75.6/66.7.. Nobody has vouched for it; add
  support or contest it on this page.
