id: train-self-correction-shared-first-turn-before-joint
ref: TEC-0561
label: "Train self-correction on a shared first turn before joint tu"
summary: >-
  Run GRPO first with one online-sampled first-turn output fixed as shared
  context while rolling out several second-turn refinements, then switch to
  optimizing both turns jointly with reward computed only at the final turn.
description: >-
  Run GRPO first with one online-sampled first-turn output fixed as shared
  context while rolling out several second-turn refinements, then switch to
  optimizing both turns jointly with reward computed only at the final turn.
  Filed by the drafting stage from MM-ReCoder: Advancing Chart-to-Code
  Generation with Reinforcement Learning and Self-Correction (2604.01600)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Compared against full-trajectory GRPO at several first-turn and boosting
  reward weights, and a turn-wise 50/50 variant, on ChartMimic: two-stage
  reached 86.0 second-turn low-level score with +0.55 average improvement on
  charts executable in both turns and 21.6% code repetition, versus
  full-trajectory variants at 83.5-85.5 with -0.03 to +0.21 improvement and
  46.9-81.1% repetition; a boosting-reward variant gamed the reward by
  degrading the first turn (64.5% exec rate).. Nobody has vouched for it;
  add support or contest it on this page.
