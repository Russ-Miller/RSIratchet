description: >-
  A multi-agent loop that evolves kernel candidates under
  simulation-performance selection, verifies functional correctness by
  de-HLSifying the kernel and running a generated C++ testbench, then
  generates host code and builds and runs the act Filed by the drafting
  stage from FPGAgent: An LLM-Assisted Framework for Autonomous HLS Code
  Generation and Verification in FPGA Environments (2608.23630) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Against zero-shot
  pass@10 on 78 HLS-Eval tasks: synthesizable rate +16.9 points on average,
  executable rate +26.7, functional correctness +30.6 (best 92.3% with
  Gemini 3.1 Pro). Ablation on Qwen3-Coder-30B shows the evolutionary module
  mainly lifts synthesizability/executability and the functional-reflection
  module mainly lifts correctness; full system solves 52 of 78 vs 29 for the
  base.. Nobody has vouched for it; add support or contest it on this page.
