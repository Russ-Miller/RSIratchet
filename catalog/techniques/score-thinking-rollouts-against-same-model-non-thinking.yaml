id: score-thinking-rollouts-against-same-model-non-thinking
ref: TEC-0359
label: "Score thinking rollouts against same-model non-thinking roll"
summary: >-
  Builds each GRPO rollout group from a mix of thinking and non-thinking
  trajectories for the same question, so a thinking trajectory's advantage
  drops whenever the model's own direct answer was more factually correct.
description: >-
  Builds each GRPO rollout group from a mix of thinking and non-thinking
  trajectories for the same question, so a thinking trajectory's advantage
  drops whenever the model's own direct answer was more factually correct.
  Filed by the drafting stage from Mitigating Factual Hallucination in Large
  Reasoning Models via Mixed-Mode Advantage Regularization (2607.05861) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Average
  accuracy over six factuality QA benchmarks against Fixed Think, Fixed
  Think+RL, Fixed NoThink+RL, Adaptive CLS/SFT/RL on the same curated data
  (Qwen3-4B 25.49% vs 23.31% for Fixed Think+RL; Qwen3-8B 29.57% vs 27.92%),
  plus instance-level transition ratios showing lower correct-to-incorrect
  flips, and math benchmarks (AMC23/AIME24/AIME25 Mean@16) to check retained
  reasoning.. Nobody has vouched for it; add support or contest it on this
  page.
