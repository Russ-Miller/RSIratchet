description: >-
  Aggregate failing trajectories across tasks into recurring failure groups,
  then run a fixed number of analyst-critic-engineer refinement passes plus
  a moderator to produce one modification specification, which a coding
  agent implements and Filed by the drafting stage from Ecdysis: Efficient
  and Effective Training of Runtime Harnesses for LLM Agents (2609.11677)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Average accuracy over 15 model-by-dataset cells rose from 58.67% (serial
  self-evolution) to 64.56% (aggregation only) to 69.56% (with refinement),
  Pass^3 from 46.67% to 60.00%; training time 1.03-1.84x faster than serial;
  held-out inference tokens 12.8% lower; total LLM calls 482 vs 881 for the
  baseline.. Nobody has vouched for it; add support or contest it on this
  page.
