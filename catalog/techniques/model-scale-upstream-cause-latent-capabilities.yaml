description: >-
  Fits a hybrid 'structured capabilities' model in which log parameter count
  feeds the latent capability factors through a logistic link, and those
  factors in turn explain benchmark scores up to item-specific measurement
  error. Filed by the drafting stage from Quantifying construct validity in
  large language model evaluations (2602.15532) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Compared against pure
  exploratory factor analysis on parsimonious fit indices (CFI/TLI/RMSEA)
  and against PCA-based observational scaling laws on prediction error for a
  held-out out-of-distribution benchmark, using OpenLLM Leaderboard BBH
  scores for 4,395 models.. Nobody has vouched for it; add support or
  contest it on this page.
