id: fine-tune-position-motion-threat-jointly-per-task
ref: TEC-0612
label: "Fine-tune position, motion and threat jointly, not per task"
summary: >-
  Merge the position-perception, movement-prediction and threat-analysis
  instruction datasets and LoRA-tune one model on the weighted sum of the
  three task losses instead of training a separate adapter per task.
description: >-
  Merge the position-perception, movement-prediction and threat-analysis
  instruction datasets and LoRA-tune one model on the weighted sum of the
  three task losses instead of training a separate adapter per task. Filed
  by the drafting stage from CogRail: Benchmarking VLMs in Cognitive
  Intrusion Perception for Intelligent Railway Transportation Systems
  (2601.09613) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Macro-F1 on held-out 20% splits of Cog-MRSI and
  Cog-RailSem19, against the same models zero-shot and individually
  fine-tuned; joint tuning won in 17 of 20 model-by-prompt-by-dataset
  configurations, with the best gains +12.6 points over individual tuning
  (Qwen2-VL, 75.31 F1) and +9.8 (Qwen2.5-VL, 76.11 F1).. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [video-temporal-reasoning]
kind: training
