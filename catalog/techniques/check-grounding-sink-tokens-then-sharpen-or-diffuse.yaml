description: >-
  At each generated punctuation or conjunction token, extract noun/adjective
  concepts from the preceding segment, compare the sink token's
  self-attention map over image tokens with a Grad-CAM attribution map for
  those concepts, and sharpen at Filed by the drafting stage from SAGE:
  Sink-Aware Grounded Decoding for Multimodal Hallucination Mitigation
  (2603.27898) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: CHAIR_S/CHAIR_I on 500 MSCOCO images and CHAIR_I plus
  Cover on 500 AMBER images across five VLMs, against six decoding baselines
  (OPERA, HALC, EAH, DML-LVLM, GIFT, LVLMs-Saliency); ablation replacing
  sink triggers with modulation every 10 tokens raised CHAIR_S from 21.3 to
  39.4 on LLaVA-1.5; Gemini-3-Pro judging of 100 captions; 10.8%
  decoding-time overhead.. Nobody has vouched for it; add support or contest
  it on this page.
