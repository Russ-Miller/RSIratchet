id: reward-reasoning-edit-justifies-rating
ref: TEC-0186
label: "Reward reasoning by the edit it justifies, not the rating"
summary: >-
  Train an IQA model with GRPO where reasoning tokens are credited by
  whether a frozen image editor, conditioned on that reasoning, actually
  raises a frozen judge's quality score, and rating tokens are credited
  separately by human MOS margins
description: >-
  Train an IQA model with GRPO where reasoning tokens are credited by
  whether a frozen image editor, conditioned on that reasoning, actually
  raises a frozen judge's quality score, and rating tokens are credited
  separately by human MOS margins Filed by the drafting stage from MR-IQA-2:
  Faithful Image Quality Reflection via Fine-Grained Credit Assignment
  (2608.18579) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean judge-score gain from reasoning-guided edits rose
  from -0.137 (baseline) and +0.213 (Q-Insight) to +0.789 for the trained
  actor, held direction across a swapped editor (Mage-Flow) and two swapped
  judges including GPT-5.6 Sol (81.4% preference in 3AFC), while average
  PLCC/SRCC stayed at 0.838/0.812, near the tool-augmented baseline.. Nobody
  has vouched for it; add support or contest it on this page.
