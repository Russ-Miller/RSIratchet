  Image Quality Reflection via Fine-Grained Credit Assignment (2608.18579)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Mean judge-scored quality gain from reasoning-guided edits on a
  5,866-image subset: +0.789 for the trained actor vs +0.213 for Q-Insight
  and -0.137 for the untrained backbone, holding under a swapped editor
  (Mage-Flow) and two swapped judges including GPT-5.6 Sol (81.4% 3AFC win
  rate); rating alignment stays comparable to prior methods.. Nobody has
  vouched for it; add support or contest it on this page.
