description: >-
  Build the video from a scenario and query specification first, so each
  extractive question has a one-to-one counterpart whose decisive evidence
  is deliberately spread across rooms and time. Filed by the drafting stage
  from Reasoning over Video: Evaluating How MLLMs Extract, Integrate, and
  Reconstruct Spatiotemporal Evidence (2603.13091) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Compared the same 14 models on
  five extractive tasks and their matched abstractive counterparts plus
  human and random baselines; sub-task decomposition attributed failures to
  counting, room-order memory and floor-plan reconstruction.. Nobody has
  vouched for it; add support or contest it on this page.
