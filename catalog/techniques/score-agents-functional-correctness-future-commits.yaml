label: "Score agents by functional correctness on future commits"
summary: >-
  Evaluate maintainability by having a dual architect-programmer agent loop
  iteratively evolve a base commit toward a later commit, and aggregate
  per-iteration normalized test-pass change with weights that favor later
  iterations.
description: >-
  Evaluate maintainability by having a dual architect-programmer agent loop
  iteratively evolve a base commit toward a later commit, and aggregate
  per-iteration normalized test-pass change with weights that favor later
  iterations. Filed by the drafting stage from SWE-CI: Evaluating Agent
  Capabilities in Maintaining Codebases via Continuous Integration
  (2603.03823) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to 20 models from 8 providers on 100 tasks;
  reported EvoScore rankings shift as the future-weighting parameter
  changes, plus zero-regression rate (most models under 0.25, two Claude
  Opus above 0.5). No comparison against an independent human
  maintainability judgement.. Nobody has vouched for it; add support or
  contest it on this page.
