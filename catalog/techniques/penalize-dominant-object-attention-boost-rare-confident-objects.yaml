description: >-
  At each decoder layer, scale pre-softmax attention logits per row by a
  penalty exponential in an object's size/persistence/attention-share
  dominance score and by a boost proportional to its rarity gated on
  detection confidence, inside a cau Filed by the drafting stage from See
  Fair, Speak Truth: Equitable Attention Improves Grounding and Reduces
  Hallucination in Vision-Language Alignment (2604.09749) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_S/CHAIR_I
  and POPE recall/precision/accuracy against the base model and against
  RoPE, FixVPE, EDVT, FarSight, ICD, VCD, OPERA; plus MMBench, LLaVA-W,
  MM-Vet, VizWiz, SQA, MSVD-QA, ActivityNet-QA and five GPT-4o-judged video
  captioning dimensions. No human evaluation; no reported
  object-coverage/recall metric on free-form captions beyond POPE and GPT-4o
  detail scores.. Nobody has vouched for it; add support or contest it on
  this page.
