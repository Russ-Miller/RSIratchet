description: >-
  Keep storage/retrieval, asynchronous trait extraction from finished
  sessions, and request-time selective context injection as three distinct
  components, so learning runs outside the request path and only relevant
  stored preferences enter th Filed by the drafting stage from MAPLE: A
  Sub-Agent Architecture for Memory, Learning, and Personalization in
  Agentic AI Systems (2602.13258) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: LLM-as-judge (Claude 3 Haiku) personalization
  score on 150 synthetic personas: 4.17 to 4.78 of 5 (Welch t=6.05, p<0.001,
  Cohen's d=0.95), trait incorporation 45% to 75%, perfect scores 15% to
  88%, against the same LLM with no persistent memory. Nobody has vouched
  for it; add support or contest it on this page.
