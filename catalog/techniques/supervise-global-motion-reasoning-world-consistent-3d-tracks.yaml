  fine-tuning supervision.
description: >-
  Lift video to world-frame 3D human poses, discretize root translation and
  orientation into spatial codes, and generate templated QA pairs used as
  fine-tuning supervision. Filed by the drafting stage from HumanMoveVQA:
  Can Video MLLMs reason about human movement in videos? (2606.27999) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Fine-tuning Qwen3-VL 8B on the generated data raised the chance-normalized
  score on EMDB from 12.83 to 37.88, with gains of +40.9pp on Numerical and
  +22.6pp on Trajectory Affordance; joint training across all seven
  categories beat per-category specialists.. Nobody has vouched for it; add
  support or contest it on this page.
