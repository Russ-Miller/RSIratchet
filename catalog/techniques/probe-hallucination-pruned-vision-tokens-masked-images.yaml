description: >-
  Builds latent-space negative samples by randomly pruning vision tokens to
  a handful, averages the original-minus-negative hidden-state difference
  into a hallucination direction, and subtracts it from hidden states in
  shallow layers, alongsi Filed by the drafting stage from One Token, Two
  Fates: A Unified Framework via Vision Token Manipulation Against MLLMs
  Hallucination (2603.10360) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: POPE accuracy/F1 across four MLLMs and three
  datasets (LLaVA-1.5 COCO 84.79 to 86.79 accuracy), CHAIR captioning
  scores, MMHal-Bench GPT-4 scoring, MME; ablation compares pruned-token
  negatives (86.11 COCO acc) against masked-image negatives (84.77, below
  vanilla); t-SNE shows pruned negatives cluster with originals while masked
  ones do not; 1.06x latency.. Nobody has vouched for it; add support or
  contest it on this page.
