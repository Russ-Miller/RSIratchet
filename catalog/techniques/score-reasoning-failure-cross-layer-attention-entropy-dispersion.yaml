ref: TEC-0121
label: "Score reasoning failure by cross-layer attention-entropy dis"
summary: >-
  At each generation step, average attention entropy per layer, take the
  standard deviation across layers, and aggregate these over the sequence as
  features for a logistic-regression hallucination classifier.
description: >-
  At each generation step, average attention entropy per layer, take the
  standard deviation across layers, and aggregate these over the sequence as
  features for a logistic-regression hallucination classifier. Filed by the
  drafting stage from Attention Dispersion as a Diagnostic Signal for
  Hallucination in Large Language Models (2609.18320) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: ROC-AUC under repeated
  stratified 5-fold cross-validation (10 repeats), against output-logit
  baseline features, with 95% CIs and one-sided Wilcoxon signed-rank tests;
  gains of +0.0093 to +0.0759 AUC.. Nobody has vouched for it; add support
  or contest it on this page.
