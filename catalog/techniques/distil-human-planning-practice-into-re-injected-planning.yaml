description: >-
  Adds a ~1000-token prompt block at run start and every 30 minutes that
  forbids mono-loop moves (single hold-out, repeated tweaks) and prescribes
  human practices (K-fold from version one, early ensembling, cached
  out-of-fold predictions, per Filed by the drafting stage from TraceML: An
  Empirical Analysis of Human-Agent Planning in Machine Learning Development
  (2608.26086) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Across all 7 paired competitions at fixed backend, tools,
  grader and 12h budget, varying only the prompt: 5 of 7 improved on best
  held-out score, 2 within ~0.01 noise, none regressed; three named
  behaviors moved onto the top-human value, while prohibitions overshot to
  zero and already-saturated practices did not move; an
  injection-cadence-only arm with the planning content stripped landed at or
  below baseline.. Nobody has vouched for it; add support or contest it on
  this page.
