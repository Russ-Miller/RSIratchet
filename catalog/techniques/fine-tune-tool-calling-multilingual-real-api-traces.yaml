ref: TEC-0615
label: "Fine-tune tool calling on multilingual real-API traces, not "
summary: >-
  LoRA fine-tune an open model on tool-calling tasks whose queries and APIs
  span many languages and regions, rather than on an English-only subset of
  the same corpus.
description: >-
  LoRA fine-tune an open model on tool-calling tasks whose queries and APIs
  span many languages and regions, rather than on an English-only subset of
  the same corpus. Filed by the drafting stage from Enhancing Tool Calling
  in LLMs with the International Tool Calling Dataset (2603.05515) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Fine-tuned Qwen2.5 3B/7B on the full ITC training set vs its English-only
  subset, evaluated on non-English test queries: full-multilingual training
  raised tool-selection recall by 42.0 points for Qwen2.5-7B-Instruct vs
  22.6 for English-only, and tool-invocation F1 by 34.6 vs 25.3 for
  Qwen2.5-Coder-7B; also tested out-of-domain on Nexus Raven, Seal-Tools and
  Tool-Alpaca.. Nobody has vouched for it; add support or contest it on this
  page.
