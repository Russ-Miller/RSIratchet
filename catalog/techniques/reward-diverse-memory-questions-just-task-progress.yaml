id: reward-diverse-memory-questions-just-task-progress
ref: TEC-0690
label: "Reward diverse memory questions, not just task progress"
summary: >-
  RL-fine-tunes a multimodal LLM with a multi-task reward over single-step
  action, frontier choice, and answers to varied memory-retrieval questions,
  so the agent learns to query its own episodic memory bank while
  navigating.
description: >-
  RL-fine-tunes a multimodal LLM with a multi-task reward over single-step
  action, frontier choice, and answers to varied memory-retrieval questions,
  so the agent learns to query its own episodic memory bank while
  navigating. Filed by the drafting stage from Explore with Long-term
  Memory: A Benchmark and Multimodal LLM-based Reinforcement Learning
  Framework for Embodied Exploration (2601.10744) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Success rate and SPL on
  LMEE-Bench (58 tasks, 272 goals) and GOAT-Bench Val Unseen subset (278
  subtasks), against a retrieval-augmented memory baseline (RA-Mem), 3D-Mem
  and Explore-EQA, plus an ablation varying the question type used in the
  reward.. Nobody has vouched for it; add support or contest it on this
  page.
