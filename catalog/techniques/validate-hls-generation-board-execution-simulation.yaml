description: >-
  A multi-agent loop that injects Vitis pragma documentation, evolves kernel
  candidates under simulation-performance selection, verifies functional
  correctness on a de-pragma'd C++ harness with targeted repair, then
  generates host code and co Filed by the drafting stage from FPGAgent: An
  LLM-Assisted Framework for Autonomous HLS Code Generation and Verification
  in FPGA Environments (2608.23630) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against zero-shot pass@10 on 78
  HLS-Eval tasks across five models: average +16.9% synthesizable, +26.7%
  executable, +30.6% functionally correct, best 92.3% correct with Gemini
  3.1 Pro; ablation isolates the two modules (eoh 80.1/66.7/48.7 vs reflect
  57.7/50.0/46.2 vs base 59.0/47.4/37.2).. Nobody has vouched for it; add
  support or contest it on this page.
