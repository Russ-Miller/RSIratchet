id: build-global-timeline-first-then-crop-re-listen
ref: TEC-0468
label: "Build a global timeline first, then crop and re-listen"
summary: >-
  The model predicts a coarse segment-level timeline over the whole
  recording, then runs multi-turn reasoning in which each step calls a
  crop_audio tool to re-encode a narrow span at full resolution before
  refining its timestamp or caption.
description: >-
  The model predicts a coarse segment-level timeline over the whole
  recording, then runs multi-turn reasoning in which each step calls a
  crop_audio tool to re-encode a narrow span at full resolution before
  refining its timestamp or caption. Filed by the drafting stage from
  Listening with Time: Precise Temporal Awareness for Long-Form Audio
  Understanding (2604.22245) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: mIoU and Recall@0.3/0.5/0.7 for grounding,
  IoU-gated FENSE for dense captioning, on LAT-Bench (ZH/EN) and BLAB
  advertisement localization against Gemini-2.5/3.0-Pro, Qwen3-Omni, and
  sliding-window variants; ablations removing the global timeline or the
  tool-use CoT each lose several points.. Nobody has vouched for it; add
  support or contest it on this page.
