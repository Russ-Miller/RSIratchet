id: steer-hidden-states-toward-cot-enriched-source-states
ref: TEC-0536
label: "Steer hidden states toward CoT-enriched source states"
summary: >-
  Train a small residual adapter on a frozen LLM's mid-to-late-layer hidden
  states with an MSE loss pulling source states toward states computed from
  the question plus its CoT rationale, plus an MMD loss matching source and
  target state distr
description: >-
  Train a small residual adapter on a frozen LLM's mid-to-late-layer hidden
  states with an MSE loss pulling source states toward states computed from
  the question plus its CoT rationale, plus an MMD loss matching source and
  target state distr Filed by the drafting stage from CoDA: Towards
  Effective Cross-domain Knowledge Transfer via CoT-guided Domain Adaptation
  (2604.19488) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on 8 source-to-target transfer directions across
  8 backbones against zero-shot, BM25/Embed/ConE retrieval, LoRA, P-tuning,
  CAA, CoT-Vectors and DIN; best average reported 85.0% on Gemma-3-27B vs
  82.4% for the strongest retrieval baseline and 77.2% zero-shot; ablations
  remove each loss term; t-SNE plus Silhouette/MMD/k-NN mixing used to check
  distribution alignment.. Nobody has vouched for it; add support or contest
  it on this page.
