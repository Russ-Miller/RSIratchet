description: >-
  Maps a bounded brightness/rotation perturbation region onto a Hilbert
  curve and searches it by Hölder optimisation with a margin-aware
  convergence rule, so each instance returns either a concrete
  counterexample or a bound covering every per Filed by the drafting stage
  from Validating, Not Sampling: Region-Level Robustness of Vision-Language
  and Vision-Language-Action Models (2609.22293) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Compared against uniform random
  sampling on the 2,835 VLA instances where a counterexample was found:
  sampling found nothing on 34 within a 17,000-draw budget and was slower
  from two iterations onward; against the original H2V on 100 robust
  instances it used 15.3x fewer queries in total and decided all 100 where
  H2V left 32 undecided. A k-draw sampling protocol wrongly called an
  instance robust in 50% of its robust reports at k=1, 42% at k=10, 6% at
  k=100.. Nobody has vouched for it; add support or contest it on this page.
