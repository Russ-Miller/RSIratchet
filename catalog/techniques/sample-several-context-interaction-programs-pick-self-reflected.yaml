description: >-
  Draws K candidate programs that query a long context held as an external
  variable, keeps those agreeing with the plurality answer, and selects the
  one with the best combination of verbalized per-step confidence and short
  reasoning trace. Filed by the drafting stage from Recursive Language
  Models Meet Uncertainty: The Surprising Effectiveness of Self-Reflective
  Program Search for Long Context (2603.15653) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy against RLM,
  CodeAct+BM25, summary agent and base model on three long-context
  benchmarks under a matched 600s-per-step time budget; up to 22 points over
  RLM (BrowseComp+ 37.1 to 59.7 on Qwen); ablations show the combined signal
  beats each single signal.. Nobody has vouched for it; add support or
  contest it on this page.
