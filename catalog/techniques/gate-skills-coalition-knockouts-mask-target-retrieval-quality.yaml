id: gate-skills-coalition-knockouts-mask-target-retrieval-quality
ref: TEC-0128
label: "Gate skills on coalition knockouts, mask by target retrieval"
summary: >-
  Admit a candidate skill only if its bank wins a Monte-Carlo average of
  coalition knockout margins blended with outcome reward, and at deployment
  greedily drop skills whose removal raises mean cosine retrieval similarity
  on unlabeled target
description: >-
  Admit a candidate skill only if its bank wins a Monte-Carlo average of
  coalition knockout margins blended with outcome reward, and at deployment
  greedily drop skills whose removal raises mean cosine retrieval similarity
  on unlabeled target Filed by the drafting stage from Coalition-Aware Skill
  Reliability for Self-Evolving Agents (2608.22610) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Matched-protocol comparison
  against MemSkill and six memory-agent baselines: LLM-judge average rose
  from 54.13 to 55.52 on conversational benchmarks and ALFWorld success from
  77.05 to 79.66; a K-controlled ablation showed the outcome gate's six
  accepted skills were net -1.38pp; masking improved HP-50 on all six
  trained banks (7.17pp avg on MemSkill banks, 3.59pp on CASS banks), and
  the retrieval signal correlated with label-based skill ranking at
  rho=+0.76 versus -0.18 for policy entropy.. Nobody has vouched for it; add
  support or contest it on this page.
