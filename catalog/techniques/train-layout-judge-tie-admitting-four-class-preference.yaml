id: train-layout-judge-tie-admitting-four-class-preference
ref: TEC-0666
label: "Train a layout judge on tie-admitting four-class preference "
summary: >-
  Fine-tune a VLM classifier on human layout-pair preferences annotated as
  left / right / both good / both bad, augmented with synthetically
  perturbed layouts labelled as bad, and use it as the reward signal for
  layout generation.
description: >-
  Fine-tune a VLM classifier on human layout-pair preferences annotated as
  left / right / both good / both bad, augmented with synthetically
  perturbed layouts labelled as bad, and use it as the reward signal for
  layout generation. Filed by the drafting stage from DesignSense: A Human
  Preference Dataset and Reward Modeling Framework for Graphic Layout
  Generation (2602.23438) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Against open-source reward models (ImageReward,
  HPSv3, PickScore) and proprietary VLM judges on 1,000 held-out
  human-annotated pairs: Macro F1 0.456 vs 0.295 best baseline, binary
  accuracy 0.732 vs 0.719; ablation removing perturbation augmentation drops
  Macro F1 to 0.406; downstream, swapping it in as the RL judge raised
  AesthetiQ win rate 14.27%->17.97% (GPT-4o judge) and best-of-10 selection
  raised win rate 16.6%->20.2% (GPT-5 judge, 20% of Crello test).. Nobody
  has vouched for it; add support or contest it on this page.
