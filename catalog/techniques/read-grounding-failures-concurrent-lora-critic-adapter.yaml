description: >-
  A zero-initialized LoRA adapter runs on the same tokens as the frozen base
  model during tool-call generation, with loss applied only to a trigger
  token and a localization label, so it verbalizes which parameter is
  ungrounded in one pass bef Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On Qwen3-4B the critic reached 0.966 ID / 0.925 OOD AUROC
  versus 0.782/0.616 for a linear probe on frozen states, 0.915/0.884 for an
  equal-scale fine-tuned external judge, and near-chance for token/semantic
  entropy and SEP; >80% exact parameter-match localization; replicated on
  Llama-xLAM-2-8B (0.926/0.649 vs probe 0.833/0.514, p<0.001 McNemar). A
  linear probe on the adapter's own states reached 0.915 OOD, and
  cross-trajectory activation patching at the trigger token flipped the
  output to 'ungrounded' in 96% of cases. In a closed ReAct loop, injecting
  the specific parameter name rather than a generic block raised parameter
  F1 from 51.3 to 61.2 ID and cut false blocks from 9.4% to 2.9%.. Nobody
  has vouched for it; add support or contest it on this page.
