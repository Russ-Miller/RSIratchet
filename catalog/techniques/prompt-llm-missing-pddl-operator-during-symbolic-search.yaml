label: "Prompt an LLM for the missing PDDL operator during symbolic "
summary: >-
  Breadth-first search over planning states where, at each state, an LLM is
  prompted (with self-consistency over five samples) to name one missing
  operator and its ordered effects, and a symbolic search-ahead checks
  whether a plan now exists.
description: >-
  Breadth-first search over planning states where, at each state, an LLM is
  prompted (with self-consistency over five samples) to name one missing
  operator and its ordered effects, and a symbolic search-ahead checks
  whether a plan now exists. Filed by the drafting stage from Novelty
  Adaptation Through Hybrid Large Language Model (LLM)-Symbolic Planning and
  LLM-guided Reinforcement Learning (2603.11351) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: 10 runs per domain against an
  RL Operator-Discovery baseline (10 PPO seeds, 1M timesteps cap): 10/10
  successes in three domains and 7/10 in the hardest, versus 10/10 for OD
  only in the easy kitchen domain and 0/10 elsewhere (>7h each); planner
  wall-clock 45-682 sec.. Nobody has vouched for it; add support or contest
  it on this page.
