label: "Fine-tune on staged answerability rationales, not answers al"
summary: >-
  Supervise the model on four explicit intermediate steps — identify the
  question's topic, quote relevant report text, decide whether the passage
  answers it, then answer or say 'Not provided' — instead of on the final
  answer only.
description: >-
  Supervise the model on four explicit intermediate steps — identify the
  question's topic, quote relevant report text, decide whether the passage
  answers it, then answer or say 'Not provided' — instead of on the final
  answer only. Filed by the drafting stage from ESG-Bench: Benchmarking
  Long-Context ESG Reports for Hallucination Mitigation (2603.13154) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Balanced
  accuracy and F1 on 300-400-item balanced test splits of ESG-Bench,
  HaluEval and BioASQ against no-fine-tuning and answer-only SFT baselines
  across three backbones; 4-step CoT best in 8 of 9 dataset-model cells
  (e.g. ESG-Bench Gemma 63.3 SFT vs 92.0; BioASQ Gemma 74.5 vs 99.5), while
  answer-only SFT fell below no fine-tuning in several cells.. Nobody has
  vouched for it; add support or contest it on this page.
