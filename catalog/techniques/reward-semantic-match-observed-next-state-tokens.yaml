description: >-
  Train the agent policy with GRPO to predict the next environment state,
  rewarding it when an off-the-shelf embedding model places the predicted
  state within a cosine-distance threshold of the realized state, after
  subsampling transitions a Filed by the drafting stage from Reinforcement
  World Model Learning for LLM-based Agents (2602.05842) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Task success on
  ALFWorld and tau2-Bench against the base model, world-model SFT on
  identical data, task-success-reward RL, and expert-data baselines (IWM,
  SR, imitation learning), 3 runs each; reported +19.6 and +6.9 points over
  base, and +6.9/+5.7 over direct policy RL when stacked before it;
  ablations swap the embedding reward for LLM-as-a-judge (real-valued and
  binarized), drop subsampling, and add a format-only-reward control..
  Nobody has vouched for it; add support or contest it on this page.
