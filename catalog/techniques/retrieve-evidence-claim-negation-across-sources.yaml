label: "Retrieve evidence for the claim and its negation across sour"
summary: >-
  Generate an explicit negation of each claim, retrieve and rank
  sentence-level evidence for both forms from Wikipedia, PubMed and Google,
  deduplicate and merge into one evidence set, then verify with a zero-shot
  LLM and report per-source lab
description: >-
  Generate an explicit negation of each claim, retrieve and rank
  sentence-level evidence for both forms from Wikipedia, PubMed and Google,
  deduplicate and merge into one evidence set, then verify with a zero-shot
  LLM and report per-source lab Filed by the drafting stage from
  Contradiction to Consensus: Dual Perspective, Multi Source Retrieval Based
  Claim Verification with Source Level Disagreement using LLM (2602.18693)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy, precision, recall and macro-F1 on four benchmarks against
  claim-only retrieval and against each single source; reported relative
  gains of roughly 2-10% accuracy from negation and double-digit relative F1
  gains from merging over weak sources, with merging below Google alone on
  LIAR.. Nobody has vouched for it; add support or contest it on this page.
