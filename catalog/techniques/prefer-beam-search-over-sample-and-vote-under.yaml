id: prefer-beam-search-over-sample-and-vote-under
ref: TEC-0161
label: "Prefer beam search over sample-and-vote under grammar constr"
summary: >-
  When output is masked to a formal grammar, spend inference budget on wider
  beams rather than on sampling several candidates and voting on their
  execution results.
description: >-
  When output is masked to a formal grammar, spend inference budget on wider
  beams rather than on sampling several candidates and voting on their
  execution results. Filed by the drafting stage from Beam Search,
  Self-Consistency, and the Limits of Inference-Time Scaling for
  Grammar-Constrained Text-to-SQL in Small Language Models (2608.25761) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Execution
  accuracy on the full 1,034-example Spider dev set at budgets 1, 2, 4, 8
  for four model sizes; paired McNemar exact tests on the 16 matched-budget
  cells — beam significantly better in 11, significantly worse in 0, ties in
  5.. Nobody has vouched for it; add support or contest it on this page.
