  Issue Localization with Code Ranking (2505.07849) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: File, module and function
  Acc@k on SWE-bench Lite and LocBench against prior code rankers and
  against MoatlessTools, Agentless, LocAgent and similar agents, with
  per-example cost; notes its own embedder beats LocAgent with Claude 3.5 on
  function Acc@10.. Nobody has vouched for it; add support or contest it on
  this page.
