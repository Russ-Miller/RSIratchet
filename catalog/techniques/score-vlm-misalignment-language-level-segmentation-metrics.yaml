description: >-
  Defines hallucination, critical-omission and safety-misinterpretation
  metrics over VLM text output and relates them to upstream segmentation
  quality under controlled corruption. Filed by the drafting stage from
  Semantic Misalignment in Vision-Language Models under Perceptual
  Degradation (2601.08355) with status proposed: the paper introduces or
