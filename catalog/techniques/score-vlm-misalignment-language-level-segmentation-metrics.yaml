  paper validated it by: Measured across multiple contrastive and generative
  VLMs on corrupted Cityscapes segmentations; shows language-level metrics
  degrade far more than conventional segmentation metrics. No external
  human-judgment validation of the metrics reported here.. Nobody has
  vouched for it; add support or contest it on this page.
