description: >-
  Splits long-horizon physical task management into deterministic perception
  agents, a synthesizing manager, a decision agent, an independent revision
  agent that may only adjust quantities, a deterministic safety guard, and a
  reflection agent Filed by the drafting stage from Toward Self-Adaptive
  Physical AI: Can LLM Agents Manage Long-Horizon Physical Tasks?
  (2609.13436) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Cumulative reward, maximum yield (WSO at maturity), and
  total N/P/K/irrigation use against no-intervention, fixed-schedule, and
  PPO baselines in two environments; one run each, no ablation of the
  individual mechanisms.. Nobody has vouched for it; add support or contest
  it on this page.
