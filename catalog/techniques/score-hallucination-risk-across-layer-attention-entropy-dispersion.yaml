id: score-hallucination-risk-across-layer-attention-entropy-dispersion
ref: TEC-0097
label: "Score hallucination risk from across-layer attention entropy"
summary: >-
  At each generation step, average attention entropy per layer, take the
  standard deviation of those entropies across layers, aggregate over the
  sequence, and use it as a feature for predicting reasoning failure.
description: >-
  At each generation step, average attention entropy per layer, take the
  standard deviation of those entropies across layers, aggregate over the
  sequence, and use it as a feature for predicting reasoning failure. Filed
  by the drafting stage from Attention Dispersion as a Diagnostic Signal for
  Hallucination in Large Language Models (2609.18320) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: ROC-AUC of a
  logistic-regression failure classifier under repeated stratified 5-fold
  CV, against a baseline using only output predictive entropy and sequence
  probability; gains 0.0093-0.0759 with Wilcoxon signed-rank p-values..
  Nobody has vouched for it; add support or contest it on this page.
