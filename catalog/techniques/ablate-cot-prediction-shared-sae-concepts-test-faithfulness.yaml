description: >-
  Encode the answer-position residual of a direct-prediction pass and a CoT
  pass with one shared sparse autoencoder, then zero the decoder
  contribution of the concepts active in both and measure the drop in answer
  probability. Filed by the drafting stage from From Concept Alignment to
  Causal Grounding: An Intervention Test of Chain-of-Thought Faithfulness
  (2609.23065) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Compared against random-subset, prediction-only, and
  norm-matched ablation controls (all near zero effect), a completeness
  check adding prediction-only features (negligible increment), a top-k
  magnitude upper bound (only marginally higher), and two SAE width/sparsity
  configurations (Pearson r > 0.8 across configurations).. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [explanation-faithfulness]
