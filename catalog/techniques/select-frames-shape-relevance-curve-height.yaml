description: >-
  Smooths the frame-query similarity sequence, segments it by slope and
  curvature into peak, rising, falling, boundary and background regions,
  allocates the frame budget across regions using a question-derived
  preference vector, and picks fra Filed by the drafting stage from RIDGE:
  Region-Informed Derivative-Guided Evidence Selection for Long Video
  Understanding (2608.29958) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Accuracy on Video-MME, LongVideoBench, MLVU,
  LVBench against uniform sampling and AKS, BOLT, MDP3, FOCUS; best in most
  of 12 model-benchmark cells; matched-scorer controls (CLIP, SigLIP) show
  +3.5 and +3.8 average points over BOLT and MDP3; component ablations each
  cost 0.6-1.6 points.. Nobody has vouched for it; add support or contest it
  on this page.
