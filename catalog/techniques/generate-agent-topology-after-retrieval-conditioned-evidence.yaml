description: >-
  Retrieve evidence first, then autoregressively generate the multi-agent
  DAG (roles and edges) conditioned on the retrieved evidence and its
  provenance, with a generator trained on execution-scored, cost-pruned
  candidate topologies. Filed by the drafting stage from When Evidence
  Shapes Collaboration: Knowledge-Conditioned Topology Generation for
  Multi-Agent Systems (2608.27984) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Controlled GPQA comparison holding
  backbone and top-3 retrieved evidence fixed with the verifier disabled: no
  topology 39.22%, query-conditioned G-Designer 45.34%, evidence-conditioned
  50.00% (50.75% with the KG verifier); also 78.68% vs 70.02% average over
  seven benchmarks and over 50% fewer tokens than LLM-Debate on GPQA.
  Topology size grows from 2.02 to 2.66 nodes when retrieved evidence is
  conflicting or low-relevance (100 hand-labelled StrategyQA cases).. Nobody
  has vouched for it; add support or contest it on this page.
