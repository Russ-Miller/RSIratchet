description: >-
  In on-policy self-distillation for video LLMs, the frozen self-teacher
  replays the student's trajectory while seeing only frames from the
  annotated evidence interval plus the gold answer, and token-level
  distillation is weighted by each tok Filed by the drafting stage from
  Video-OPSD: Exploiting Privileged Visual Evidence for On-Policy
  Self-Distillation in Video Large Language Models (2608.27065) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Average over five
  video benchmarks against SFT, standard OPSD and GRPO on three backbones:
  Video-OPSD beat standard OPSD in all 15 backbone-benchmark pairs (+1.3 to
  +2.1 average points) and matched or slightly beat GRPO at ~40% of its
  training time; ablations show teacher training-set accuracy 70.4% with
  evidence frames only vs 64.9% with 8 padding frames and 49.8% with 16
  uniform frames (no gold answer), and final average falls from 51.0 to 50.6
  to 50.4 as 4 then 8 non-evidence frames are added.. Nobody has vouched for
  it; add support or contest it on this page.
