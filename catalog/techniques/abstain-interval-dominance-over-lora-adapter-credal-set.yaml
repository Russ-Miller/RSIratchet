description: >-
  Train several differently-configured LoRA adapters on one frozen backbone,
  bound each candidate answer's probability by the min and max across
  adapters (adding unwritten-completion mass to upper bounds for generated
  answers), and answer onl Filed by the drafting stage from Credal Large
  Language Models for Semantic Commitment under Uncertainty (2608.23244)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Commit rate and accuracy-when-committed on clean vs corrupted inputs;
  AUROC for error and corruption detection; accuracy at 80% coverage and
  ECE/NLL against standard LLM entropy/max-prob, semantic entropy (NLI and
  cosine), Bayesian/Laplace-LoRA, and the same five adapters mean-pooled,
  across three backbones and five datasets.. Nobody has vouched for it; add
  support or contest it on this page.
