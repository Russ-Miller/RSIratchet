description: >-
  After breadth-first exploration discovers task-trajectory pairs, a web
  agent re-executes each task with the exploration trace supplied as a hint,
  rewriting the task description and producing a full-action-space
  trajectory for SFT. Filed by the drafting stage from AutoSurfer --
  Teaching Web Agents through Comprehensive Surfing, Learning, and Modeling
  (2604.27253) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: WebArena task-completion accuracy after fine-tuning
  Qwen2.5-VL-7B-Instruct: 24.23% overall vs 19.59% for SynthAgent, 13.40%
  OS-Genesis, 4.64% Explorer, 9.36% untuned base; ablation on Reddit gives
  34.62% refined vs 11.54% exploration-only.. Nobody has vouched for it; add
  support or contest it on this page.
