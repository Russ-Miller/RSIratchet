  Scalable Contrastive Branch Sampling for Long-Horizon Agentic
  Reinforcement Learning (2602.03719) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: EM/F1 and LLM-as-a-Judge on 2WikiMQA,
  HotpotQA, MuSiQue, Bamboogle against GRPO, process-reward (GiGPO,
  StepSearch, CriticSearch, ReasonRAG) and branch-sampling (Tree-GRPO, ARPO,
  AEPO) baselines: +3.3 EM / +4.5 F1 average over the best prior method
  under Search-R1; 93.6 vs 90.8 (GiGPO) on ALFWorld; ablations removing
  difficulty-aware sampling (-1.9 F1) and redundant-step masking (-0.9 F1)..
