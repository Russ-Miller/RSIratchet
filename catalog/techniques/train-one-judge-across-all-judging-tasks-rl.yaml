id: train-one-judge-across-all-judging-tasks-rl
ref: TEC-0667
label: "Train one judge across all judging tasks with RL, not SFT"
summary: >-
  Jointly optimizes a single multimodal judge over several evaluation
  datasets with GRPO using a weighted accuracy-plus-reasoning-format reward
  instead of supervised fine-tuning on aggregated labels.
description: >-
  Jointly optimizes a single multimodal judge over several evaluation
  datasets with GRPO using a weighted accuracy-plus-reasoning-format reward
  instead of supervised fine-tuning on aggregated labels. Filed by the
  drafting stage from Multi-Task Reinforcement Learning for Enhanced
  Multimodal LLM-as-a-Judge (2603.11665) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Macro-F1 on six in-distribution
  judging datasets (alignment, safety, image quality) against off-the-shelf
  prompting, single-task SFT, unified SFT and single-task RL, plus
  out-of-distribution Macro-F1 on MJ-Bench pairwise alignment and safety..
  Nobody has vouched for it; add support or contest it on this page.
