id: commit-valid-function-name-before-reasoning
ref: TEC-0473
label: "Commit to a valid function name before reasoning"
summary: >-
  Template the reasoning phase so the prompt ends at 'Function: ', forcing
  the model to emit a candidate tool name as its first tokens before any
  free reasoning or argument generation.
description: >-
  Template the reasoning phase so the prompt ends at 'Function: ', forcing
  the model to emit a candidate tool name as its first tokens before any
  free reasoning or argument generation. Filed by the drafting stage from
  Brief Is Better: Non-Monotonic Chain-of-Thought Budget Effects in
  Function-Calling Language Agents (2604.02155) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On 200 BFCL v3 Multiple tasks,
  FR-CoT matched free-form 32-token CoT accuracy (64.0% at 1.5B, McNemar
  p=0.896; 83.0% at 7B) while cutting function hallucination from 2.5% to
  0.0%, and beat a log-prob constrained-decoding baseline at 7B (83.0% vs
  63.5%, non-overlapping CIs); free-form 16-token CoT still scored higher on
  accuracy (71.5%/84.5%).. Nobody has vouched for it; add support or contest
  it on this page.
addresses: [hallucination]
kind: prompting
sources: [arxiv-2604-02155]
