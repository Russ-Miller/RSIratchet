id: use-certainty-only-rl-short-warm-up-then
ref: TEC-0436
label: "Use certainty-only RL as a short warm-up, then switch to ver"
summary: >-
  Train with intrinsic certainty rewards only in early steps and hand off to
  execution-verified GRPO before length and entropy collapse.
description: >-
  Train with intrinsic certainty rewards only in early steps and hand off to
  execution-verified GRPO before length and entropy collapse. Filed by the
  drafting stage from When Do Intrinsic Rewards Work for Code Reasoning? A
  Comprehensive Study (2606.20881) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: GRPO continued from a step-50
  self-certainty checkpoint reached 0.151 on LiveCodeBench v5, matching GRPO
  from scratch (0.154), while step-80 and step-105 checkpoints reached 0.125
  and 0.120 and did not recover in 40 further GRPO steps.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [code-generation]
kind: training
sources: [arxiv-2606-20881]
