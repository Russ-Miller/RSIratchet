ref: TEC-0130
label: "Suppress hallucinated logit directions and re-anchor on veri"
summary: >-
  At each sentence, an evaluator localizes hallucinated claim tokens into a
  hallucination memory used to build a vocabulary-level suppression
  direction applied to the logits, while the lowest-hallucination sentence
  so far is kept in an anchor
description: >-
  At each sentence, an evaluator localizes hallucinated claim tokens into a
  hallucination memory used to build a vocabulary-level suppression
  direction applied to the logits, while the lowest-hallucination sentence
  so far is kept in an anchor Filed by the drafting stage from Multi-Faceted
  Evaluation and Mitigation of Emotion Hallucinations in MLLMs (2609.11154)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Measured facet-wise and total Emotion Hallucination Rate against VCD, ICD,
  M3ID, EmotionHallucer and Best-of-N on three backbones and three datasets:
  total rate down 3.27-11.85 points, the only method reducing all six facets
  everywhere, with F1/recall on emotion prediction also rising; the
  evaluator itself agreed with three human annotators on 100 samples
  (Pearson 0.84, Spearman 0.92).. Nobody has vouched for it; add support or
  contest it on this page.
