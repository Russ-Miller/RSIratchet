id: atomic-fact-checking
ref: TEC-0001
label: Check long answers fact by fact
summary: Split a long answer into atomic claims and verify each against search or a corpus.
description: >-
  Decompose the output into individual factual claims, retrieve evidence
  for each, and label each as supported or not. Use it as a post-hoc filter
  on outputs or as an evaluation metric during development.
