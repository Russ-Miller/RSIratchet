id: reject-tool-calls-do-resolve-registered-tool-signature
ref: TEC-0151
label: "Reject tool calls that do not resolve to a registered tool a"
summary: >-
  Before any permission gate, check each emitted call's name against the
  closed-world tool registry and type-check its arguments against the
  declared signature, rejecting anything unresolved.
description: >-
  Before any permission gate, check each emitted call's name against the
  closed-world tool registry and type-check its arguments against the
  declared signature, rejecting anything unresolved. Filed by the drafting
  stage from Closed-World Resolution Against Tool Hallucination in LLM
  Agents (2609.19425) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On 322 live-model hallucinations and 400 scripted trials
  per class, the resolver rejected all H1-H3 cases while a gating-only stack
  executed them; but both the 322/322 execution and the 0/322 rejection are
  by-construction consequences of the fail-open threat model, and zero
  honest over-rejection is measured on the resolver's own honest-call
  generator, so only the emission counts are independent evidence.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [hallucination]
