id: rerank-candidate-next-states-executable-rule-scores
ref: TEC-0655
label: "Rerank candidate next states with executable rule scores"
summary: >-
  A weighted set of Python rule functions scores each candidate
  next-state/reward pair, and the scores multiply the LLM's candidate
  likelihoods in a log-linear reranker rather than entering the prompt.
description: >-
  A weighted set of Python rule functions scores each candidate
  next-state/reward pair, and the scores multiply the LLM's candidate
  likelihoods in a log-linear reranker rather than entering the prompt.
  Filed by the drafting stage from Neuro-Symbolic Synergy for World Modeling
  (2602.10480) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Next-state prediction accuracy on three environments
  against standalone neural WM, full-data SFT, GPT-5-mini, and WALL-E
  context injection; Phase 2 reranking beat WALL-E by 8.8 points (Llama) and
  2.9 points (Qwen) on ScienceWorld, and a WALL-E-2.0-style
  executable-feedback control averaged 49.0/56.5 versus 82.7/83.7.. Nobody
  has vouched for it; add support or contest it on this page.
