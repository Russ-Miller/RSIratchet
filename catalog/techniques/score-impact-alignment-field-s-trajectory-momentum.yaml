description: >-
  Papers are embedded into a continuous-time latent manifold with learned
  per-topic trajectory 'spines', and predicted impact is the cosine
  similarity between a paper's offset from its topic spine and that spine's
  instantaneous time derivativ Filed by the drafting stage from FAME:
  Forecasting Academic Impact via Continuous-Time Manifold Evolution
  (2605.07208) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Spearman rank correlation with realized composite impact
  over 18 sliding windows: FAME averages ~0.51-0.54 vs <0.25 for six
  frontier LLMs and SciJudge-4B, and 0.16-0.40 for
  XGBoost/SVR/Transformer/TGCN on raw embeddings; ablations show removing
  the vanguard loss causes the largest drop.. Nobody has vouched for it; add
  support or contest it on this page.
