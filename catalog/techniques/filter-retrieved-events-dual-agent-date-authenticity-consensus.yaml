id: filter-retrieved-events-dual-agent-date-authenticity-consensus
ref: TEC-0466
label: "Filter retrieved events by dual-agent date and authenticity "
summary: >-
  Retrieved auxiliary events are kept only when two independently prompted
  fact-checking agents (different model families) agree on both the event's
  factual authenticity and its public release date, discarding anything
  discordant.
description: >-
  Retrieved auxiliary events are kept only when two independently prompted
  fact-checking agents (different model families) agree on both the event's
  factual authenticity and its public release date, discarding anything
  discordant. Filed by the drafting stage from LEAF: A Living Benchmark for
  Event-Augmented Forecasting (2605.16358) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: 47 domain experts (mean 13.6 years
  experience) audited 500 tasks: unfiltered automated search matched
  verified publication dates in 61.0% of tasks and leaked future information
  in 8.6%; with the dual-agent filter, date accuracy rose to 81.0% and
  leakage fell to 1.6% (8 tasks), 5 of which were off by one calendar day
  against 3- and 7-day horizons. 1.6% of surviving events were judged
  fabrications, with 0% false-negative exclusion.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [evaluation-validity]
kind: retrieval
sources: [arxiv-2605-16358]
