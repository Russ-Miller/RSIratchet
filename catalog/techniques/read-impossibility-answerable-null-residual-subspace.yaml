id: read-impossibility-answerable-null-residual-subspace
ref: TEC-0252
label: "Read impossibility from the answerable-null residual subspac"
summary: >-
  Fit PCA on hidden states of answerable prompts, project all states out of
  that subspace, and score the mean-difference direction between answerable
  and impossible prompts by cosine to detect pre-generation impossibility.
description: >-
  Fit PCA on hidden states of answerable prompts, project all states out of
  that subspace, and score the mean-difference direction between answerable
  and impossible prompts by cosine to detect pre-generation impossibility.
  Filed by the drafting stage from Recognition-Refusal Misalignment in LLMs:
  Why Models Answer Structurally Unanswerable Questions (2608.29109) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  One-dimensional cosine probe on held-out answerable/unanswerable splits, 5
  seeds, 22 model-dataset cells: mean AUC 0.939 in the answerable-null
  subspace vs 0.907 full residual stream and 0.890 top-k answerable-PC
  subspace; generation-time steering along the direction changed
  invalidity-aware behaviour bidirectionally (+33 to +52pp gated flip over
  matched random directions) while random directions did not.. Nobody has
  vouched for it; add support or contest it on this page.
