ref: TEC-0339
label: "Paraphrase, generate QA, then self-DPO against own answers"
summary: >-
  Expand each new article into many paraphrases for continual pre-training
  and many QA pairs for SFT, then run DPO with the gold answer as chosen and
  the model's own post-SFT answer as rejected, iterating with freshly
  generated QA.
description: >-
  Expand each new article into many paraphrases for continual pre-training
  and many QA pairs for SFT, then run DPO with the gold answer as chosen and
  the model's own post-SFT answer as rejected, iterating with freshly
  generated QA. Filed by the drafting stage from PASTA: A Paraphrasing And
  Self-Training Approach for Knowledge Updating in LLMs (2606.28898) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  LLM-as-judge accuracy on held-out freshly generated QA about the same
  articles: 0.02 before training, 0.54-0.68 with the full pipeline, 0.82 at
  10x QA volume, versus 0.26 after seven iterations of SFT only; ablations
  removing CPT, SFT or DPO each drop final accuracy to 0.15-0.46; Japanese
  MT-Bench++ falls from 4.42 to about 3.8-4.2.. Nobody has vouched for it;
  add support or contest it on this page.
addresses: [knowledge-updating]
