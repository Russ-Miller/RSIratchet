description: >-
  Few-shot exemplars for code generation carry not only the problem and
  solution but an explanation of the solution strategy, with the shot count
  kept to one or two. Filed by the drafting stage from CL4SE: Benchmarking
  Context Learning on Software Engineering (2602.23047) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Pass@1 on 636
  held-out LeetCode problems with model-generated, manually checked test
  cases, compared against zero-shot and against the same exemplars without
  explanations, across five models and 0-5 shots.. Nobody has vouched for
  it; add support or contest it on this page.
