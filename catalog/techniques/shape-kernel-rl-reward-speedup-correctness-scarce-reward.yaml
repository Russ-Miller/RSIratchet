description: >-
  Reward a generated GPU kernel with zero if it fails to compile or
  validate, otherwise a logistic function of correctness plus measured
  speedup over the compiler baseline, with a shift parameter setting how
  much speedup is needed before the Filed by the drafting stage from
  Fine-Tuning GPT-5 for GPU Kernel Generation (2602.11000) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Single-attempt
  KernelBench: correctness 43.7% to 77.0%, fraction beating TorchInductor
  14.8% to 21.8%, geometric mean speedup 0.73x to 0.81x against the
  unmodified GPT-5 baseline and several frontier models; the
  speedup/correctness split is attributed by the authors to the shift value,
  not ablated.. Nobody has vouched for it; add support or contest it on this
  page.
