description: >-
  Extracts token-level log-likelihood, entropy, decoder hidden states,
  visual patch features and cross-modal aligned features from one frozen VLM
  forward pass, encodes each branch separately and fuses them with attention
  to predict a hallucin Filed by the drafting stage from FaithSCAN:
  Model-Driven Single-Pass Hallucination Detection for Faithful Visual
  Question Answering (2601.00269) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: AUROC, AURAC, F1@Best and RejAcc@50 against
  token-level, latent, semantic-entropy, SelfCheckGPT, P(True) and
  logistic-regression baselines on three backbones and three datasets, plus
  latency per 100 samples; OOD tested by cross-dataset transfer. Nobody has
  vouched for it; add support or contest it on this page.
