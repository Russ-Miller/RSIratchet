id: audit-agent-influence-belief-probes-exposure-logs
ref: TEC-0095
label: "Audit agent influence with belief probes and exposure logs"
summary: >-
  Instead of reading agent messages, score each agent's stance after every
  round with a fixed token-probability probe and log who saw which content
  from whom, so influence can be attributed to direct or peer-relayed
  exposure.
description: >-
  Instead of reading agent messages, score each agent's stance after every
  round with a fixed token-probability probe and log who saw which content
  from whom, so influence can be attributed to direct or peer-relayed
  exposure. Filed by the drafting stage from Belief Cascades Drive
  Persuasion in LLM Agent Networks (2608.25152) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Across 4,400 runs, per-exposure
  OLS regressions linked direct and peer-mediated exposure counts to
  next-round probe change (direct signs stable across all four backbones
  under two competing persuaders; peer-mediated PR2 exposure significantly
  negative on all four), whereas text markers showed 0.18% explicit
  reversals; no comparison against a human-judged ground truth of
  influence.. Nobody has vouched for it; add support or contest it on this
  page.
