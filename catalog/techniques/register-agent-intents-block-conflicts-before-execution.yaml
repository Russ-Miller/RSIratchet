id: register-agent-intents-block-conflicts-before-execution
ref: TEC-0779
label: "Register agent intents and block conflicts before execution"
summary: >-
  Middleware intercepts each agent action, registers its intended
  pre/post-conditions in a shared intent graph, checks for contradictory,
  resource-contending or causally invalid combinations, and resolves or
  blocks before the action commits.
description: >-
  Middleware intercepts each agent action, registers its intended
  pre/post-conditions in a shared intent graph, checks for contradictory,
  resource-contending or causally invalid combinations, and resolves or
  blocks before the action commits. Filed by the drafting stage from
  Semantic Consensus: Process-Aware Conflict Detection and Resolution for
  Enterprise Multi-Agent LLM Systems (2604.16339) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: 600 simulated runs (3 framework
  configurations x 4 scenarios x 50 runs): workflow completion 100% vs 25.1%
  for a calibrated judge-agent baseline, 0.8% schema-only, 0.2% ungoverned;
  detection recall 65.2% at 27.9% precision.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [multi-model-coordination]
