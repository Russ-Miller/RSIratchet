description: >-
  Score each CoT sentence against the supplied context with a hallucination
  process reward model, apply that reward to the sentence's tokens only when
  the final answer is correct, truncate at the first unfaithful step and
  regenerate the conti Filed by the drafting stage from Stop Rewarding
  Hallucinated Steps: Faithfulness-Aware Step-Level Reinforcement Learning
  for Small Reasoning Models (2602.05897) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Five open-book QA sets (SQuAD,
  NewsQA, TriviaQA, NQ, HotpotQA) on three small reasoning models; +7.29%
  answer F1 and +1.73% answer faithfulness over the best baseline (SFT, KD,
  Self-Refine, GRPO, FSPO), with per-sentence hallucination rate judged by
  Qwen3-32B falling (e.g. 21.03 to 7.52 on correct-answer cases for
  DPSK-1.5B); ablations show removing resampling costs 15.77 points of
  faithfulness. Judges are LLMs, and the PRM used for reward is also used in
  the loop.. Nobody has vouched for it; add support or contest it on this
  page.
