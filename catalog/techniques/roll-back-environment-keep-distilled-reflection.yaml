label: "Roll back the environment, keep the distilled reflection"
summary: >-
  On a triggered review, an agent restores a coarse-to-fine-selected earlier
  checkpoint while carrying forward a memory of objective, environment
  facts, past milestones and failure analysis, deliberately omitting
  current-state claims.
description: >-
  On a triggered review, an agent restores a coarse-to-fine-selected earlier
  checkpoint while carrying forward a memory of objective, environment
  facts, past milestones and failure analysis, deliberately omitting
  current-state claims. Filed by the drafting stage from Rollback the World,
  Keep the Reflection: Rollback-Induced Reflection for Long-Horizon LLM
  Agents (2609.18304) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rate on ALFWorld, ScienceWorld (plus dense
  reward) and GAIA against ReAct, Reflexion, LATS, Self-Refine and
  GA-Rollback under matched budgets: average SR 47.00 vs 43.91 best baseline
  (Qwen3-14B) and 69.43 vs 62.86 (DeepSeek-V3); ablations give 76.75 SR vs
  70.48 reflection-only and 69.37 rollback-only on ScienceWorld, with 0.92
  rollbacks per task vs 2.9 for GA-Rollback.. Nobody has vouched for it; add
  support or contest it on this page.
