description: >-
  Treats a frozen LLM with a query prompt as a convolution kernel over
  overlapping segments, recursively summarizes layer by layer with
  per-segment relevance scores that route critical raw segments straight to
  the final answer, and runs one c Filed by the drafting stage from ConvMem:
  Convolutional Memory for Long-Context Reasoning (2609.10441) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: F1 and Sub-EM on
  RULER-HotpotQA and RULER-2WikiMultiHopQA from 28k to 896k tokens against
  vanilla Qwen2.5-32B-Instruct, RAG-BM25, MemAgent-without-RL,
  Mem-alpha-without-RL, plus RL-trained MemAgent and Mem-alpha; component
  ablations on stride, skip connections, kernel size, and number of
  channels.. Nobody has vouched for it; add support or contest it on this
  page.
