description: >-
  A cross-encoder classifies each retrieved edited fact as relevant to the
  query, and if any is selected the model's log-probability for the first
  token of the original object is subtracted (weight 0.2) from the
  context-conditioned distributi Filed by the drafting stage from Towards
  Scalable Lifelong Knowledge Editing with Selective Knowledge Suppression
  (2604.19089) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average of reliability/generality/locality over 1,000
  sequential edits on ZSRE 0.9664, Counterfact 0.9296, RIPE 0.9818, above
  LTE, RECIPE, AlphaEdit, GRACE, ROME, MEMIT; ablation: removing the
  selector drops locality to 0.4612 while reliability stays 0.8898, removing
  the decoding step drops reliability 0.9543 to 0.8978 while locality stays
  0.9979; suppressing all tokens rather than the first lowers reliability to
  0.8477.. Nobody has vouched for it; add support or contest it on this
  page.
