id: fuse-clip-object-logits-lvlm-entropy-decoding
ref: TEC-0263
label: "Fuse CLIP object logits by LVLM entropy at decoding"
summary: >-
  At each decoding step, pick object tokens among the top-k candidates with
  WordNet, rescore them with CLIP similarity to the image, rescale the
  scores into the LVLM logit range, and blend the two with a weight equal to
  the LVLM's normalized
description: >-
  At each decoding step, pick object tokens among the top-k candidates with
  WordNet, rescore them with CLIP similarity to the image, rescale the
  scores into the LVLM logit range, and blend the two with a weight equal to
  the LVLM's normalized Filed by the drafting stage from Test-Time
  Hallucination Control in Large Vision-Language Models (2608.11474) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  CHAIR_S/CHAIR_I and BLEU on 500 MSCOCO images over three seeds, OPOPE
  accuracy/precision/F1, and GPT-4V scores on LLaVA-Bench, against greedy,
  beam, DoLa, OPERA, VCD, HALC, Woodpecker, LURE and Nullu; reported CHAIR_S
  14.27 vs 15.20 (Nullu) and 20.40 (greedy) on LLaVA-1.5, with throughput
  0.59 vs 0.72 items/s for greedy; ablations sweep the fixed coefficient and
  the candidate-pool size (best at 10).. Nobody has vouched for it; add
  support or contest it on this page.
