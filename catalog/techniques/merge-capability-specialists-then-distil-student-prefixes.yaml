id: merge-capability-specialists-then-distil-student-prefixes
ref: TEC-0294
label: "Merge capability specialists, then distil on student prefixe"
summary: >-
  Train one RL specialist per execution capability from a shared backbone,
  merge their task vectors with TIES, then refine the merged student by
  distilling from the routed specialist teacher on the student's own
  generated prefixes.
description: >-
  Train one RL specialist per execution capability from a shared backbone,
  merge their task vectors with TIES, then refine the merged student by
  distilling from the routed specialist teacher on the student's own
  generated prefixes. Filed by the drafting stage from Capek 0.5: An
  Execution-Centric Vision-Language Model for Embodied Intelligence
  (2608.06756) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Controlled ablation on 35B-A3B against the shared
  backbone, four standalone experts, Mix-RL, TIES-only and MOPD-only across
  eight capability benchmarks; TIES+MOPD best on 3 of 8 and second on the
  other 5, improving 7 of 8 over MOPD alone. Also 28/34 and 30/34 matched
  benchmark rows improved over the Qwen initialisations, and EB-HAB success
  46.0 to 63.0.. Nobody has vouched for it; add support or contest it on
  this page.
