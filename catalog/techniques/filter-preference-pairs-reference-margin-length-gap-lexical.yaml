description: >-
  Score each preference pair by a normalized composite of |reference-model
  per-token log-prob margin|, chosen-minus-rejected token length difference,
  and TF-IDF similarity to a general-capability corpus, then train DPO only
  on the lowest-risk Filed by the drafting stage from Preference Data
  Selection for Mitigating the Alignment Tax in Large Language Models
  (2608.24192) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Against Full, Random, and nine SFT/alignment
  data-selection baselines at a fixed 5% budget on HH-RLHF:
  general-capability drop 0.86/0.38 points (Llama/Qwen, helpfulness) versus
  5.35/2.31 for full-data DPO, while alignment gain stayed near the best
  baseline; bucket experiment shows forgetting rising from 0.08 to 3.48
  across reference-margin quantiles; ablation removing each score degrades
  either forgetting or alignment.. Nobody has vouched for it; add support or
  contest it on this page.
