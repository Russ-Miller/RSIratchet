id: keep-multi-entity-events-one-fact-reified-edges
ref: TEC-0673
label: "Keep multi-entity events as one fact, not reified edges"
summary: >-
  Represent a temporal fact as a set of actors, a relation, a set of
  recipients, a timestamp and qualifiers, so events with more than two
  primary entities stay a single prompt item instead of being reified or
  decomposed into many binary edges
description: >-
  Represent a temporal fact as a set of actors, a relation, a set of
  recipients, a timestamp and qualifiers, so events with more than two
  primary entities stay a single prompt item instead of being reified or
  decomposed into many binary edges Filed by the drafting stage from Toward
  Better Temporal Structures for Geopolitical Events Forecasting
  (2601.00430) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Relation-prediction accuracy and link-prediction Jaccard
  against reified HTKG on the same underlying data with matched information
  per query: +4.7 points relation accuracy and ~56.8% lower inference time
  with Qwen3-4B-Thinking-2507; up to +21.29% link-prediction performance and
  ~57.3% lower inference time with gemma-3-12b-it and Qwen3-4B-Thinking.
  Fully decomposed HTKG could not be run at all, exceeding the 32k context
  at 100 contextual facts.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [forecasting]
