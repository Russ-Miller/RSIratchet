id: externalize-expert-decision-tree-into-clinician-editable-rule
ref: TEC-0109
label: "Externalize the expert decision tree into a clinician-editab"
summary: >-
  Restrict the LLM to extracting canonical symptoms and patient context from
  a clinician-curated vocabulary, and let a deterministic rule engine owned
  by clinicians make the emergency decision.
description: >-
  Restrict the LLM to extracting canonical symptoms and patient context from
  a clinician-curated vocabulary, and let a deterministic rule engine owned
  by clinicians make the emergency decision. Filed by the drafting stage
  from Auditable Emergency Triage for Maternal and Newborn Care in India
  (2609.09356) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Stepwise ablation of four systems on 427 held-out queries
  with stratified bootstrap CIs; full decomposition matched the
  rules-in-prompt variant on recall and F1 (overlapping intervals) at 1.5x
  cost, plus deployment over 152,421 queries with 17.8% over-escalation and
  no reported rise in missed emergencies.. Nobody has vouched for it; add
  support or contest it on this page.
