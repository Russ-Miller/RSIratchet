id: gate-task-success-deterministic-state-predicates-judge-only
ref: TEC-0283
label: "Gate task success on deterministic state predicates, judge o"
summary: >-
  Score each turn against sandbox state predicates that must all pass, and
  call an LLM judge only for qualitative criteria such as communication and
  policy adherence, with no power to override a failed gate.
description: >-
  Score each turn against sandbox state predicates that must all pass, and
  call an LLM judge only for qualitative criteria such as communication and
  policy adherence, with no power to override a failed gate. Filed by the
  drafting stage from Benchmarking the Benchmarks: A Validity Audit of
  Tool-Calling Evaluation (2607.02577) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: On 70 tasks across six models (420
  model-task evaluations), the evaluator's verdicts agreed with expert
  trace-level judgment 95.5% of the time, above the audited benchmarks'
  69.0-90.0%, with all 19 disagreements being benchmark-stricter-than-human
  and no false passes; measured on a different task distribution than the
  audited benchmarks, so not a controlled comparison.. Nobody has vouched
  for it; add support or contest it on this page.
