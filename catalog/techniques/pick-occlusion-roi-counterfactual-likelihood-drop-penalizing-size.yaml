description: >-
  At inference, propose anatomical masks with a medical segmentation model,
  score each by the drop in log-likelihood of a draft answer when it is
  occluded minus an area penalty and an occlusion-mode variance penalty,
  then use the winner for c Filed by the drafting stage from Counterfactual
  Anatomy-guided Spatial-Temporal Decoding for Annotation-Free Hallucination
  Mitigation in Medical VLMs (2608.17427) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Overall/closed/open scores on SLAKE
  and MIMIC-CXR against plain decoding, VCD, DoLA, OPERA and GT-mask ARCD
  across three Med-VLMs; ablations removing the area penalty (-3.4%),
  replacing counterfactual selection with random masks (-4.4%), and using a
  single occlusion operator (-3.3%/-4.0%).. Nobody has vouched for it; add
  support or contest it on this page.
