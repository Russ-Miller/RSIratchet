description: >-
  Split a long document into segments processed by a chain of worker agents,
  pass a natural-language running state forward, drop segment outputs judged
  irrelevant, reconcile contradictions against the stored memory with a
  bounded retry loop, Filed by the drafting stage from LSTM-MAS: A Long
  Short-Term Memory Inspired Multi-Agent System for Long-Context
  Understanding (2601.11913) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: F1 and ROUGE-L on eight LongBench datasets against
  Vanilla, LightRAG, LONGAGENT and CoA at matched chunk length and base
  model; ablations removing judge, filter and manager separately on
  Qwen2.5-7B/14B.. Nobody has vouched for it; add support or contest it on
  this page.
