id: gate-worker-outputs-semantic-entropy-plus-density
ref: TEC-0270
label: "Gate worker outputs on semantic entropy plus density"
summary: >-
  The orchestrator resamples each worker response, computes semantic entropy
  and embedding-space semantic density, and accepts only if both clear
  thresholds, otherwise reprompts, reassigns, or delegates in parallel.
description: >-
  The orchestrator resamples each worker response, computes semantic entropy
  and embedding-space semantic density, and accepts only if both clear
  thresholds, otherwise reprompts, reassigns, or delegates in parallel.
  Filed by the drafting stage from Semantic Uncertainty-Guided Orchestration
  in Hierarchical Multi-Agent Systems (2608.14707) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy against the same
  system with metrics disabled across nine benchmarks: StrategyQA 78% vs
  70%, TruthfulQA 41% vs 19%, JailbreakBench 61% vs 25%, but MuSiQue 45% vs
  55% and HotpotQA 54% vs 68%; metric-isolation ablation showed either
  metric alone fell below the no-metric baseline.. Nobody has vouched for
  it; add support or contest it on this page.
