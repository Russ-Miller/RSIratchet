id: put-reversed-videos-rl-exploration-group
ref: TEC-0163
label: "Put reversed videos in the RL exploration group"
summary: >-
  During GRPO, each group mixes mostly forward-video rollouts with a small
  number of rollouts on the time-reversed video, so answering correctly
  requires using motion direction.
description: >-
  During GRPO, each group mixes mostly forward-video rollouts with a small
  number of rollouts on the time-reversed video, so answering correctly
  requires using motion direction. Filed by the drafting stage from COMET:
  Contrastive Motion-Enhanced Temporal Reasoning for Video Multimodal Large
  Language Models (2608.21030) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Ablation from one shared Stage-I checkpoint on
  Qwen3-VL-8B at fixed group size 7: average accuracy 76.5 (no RL), 78.0
  standard GRPO (7+0), 78.8 at 6+1, 78.4 at 5+2, 77.6 at 4+3; main table
  also shows gains over SFT, GRPO, Flow4Agent and TempFlex baselines across
  scales.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [video-temporal-reasoning]
kind: training
sources: [arxiv-2608-21030]
status: proposed
