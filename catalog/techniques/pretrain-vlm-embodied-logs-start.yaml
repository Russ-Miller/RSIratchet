description: >-
  Mixes web text, driving scenes and embodied interaction logs into one
  large-scale VLM pretraining run before attaching a flow-matching action
  expert whose gradients are blocked from the VLM on embodied data. Filed by
  the drafting stage from DM0: An Embodied-Native Vision-Language-Action
  Model towards Physical AI (2602.14974) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Success rate on 30 RoboChallenge
  Table30 tasks against GigaBrain-0.1, Spirit-v1.5, pi-0.5 and pi-0: 62.00%
  specialist vs 51.67/51.00/42.67, and 37.3 (score 49.08) generalist vs
  17.67 and 9.0; no ablation separating pretraining mix from the gradient
  strategy or spatial scaffolding.. Nobody has vouched for it; add support
  or contest it on this page.
