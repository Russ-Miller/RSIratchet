description: >-
  Run the generated animation in a subprocess, capture frames at uniform
  intervals, and have a vision-capable model score them against per-scenario
  physics criteria, routing failures back to either the requirements or the
  code-generation stag Filed by the drafting stage from Perceptual
  Self-Reflection in Agentic Physics Simulation Code Generation (2602.12311)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Qualitative comparison on 10 scenarios against single-shot generation: the
  pipeline was rated 91% average physics accuracy with 86% of scenarios
  above an 85% threshold, and single-shot output failed visibly in three of
  four side-by-side cases; the single-shot baseline rate (about 40%) is
  taken from prior published work, not run here.. Nobody has vouched for it;
  add support or contest it on this page.
