label: "Subtract the query-invariant attention template, then redist"
summary: >-
  At the first few layers, estimate each head's text-marginalized
  text-to-image attention as a structural-bias template, subtract it scaled
  by visual-token feature-variance saliency, and restore the removed
  probability mass in proportion to h
description: >-
  At the first few layers, estimate each head's text-marginalized
  text-to-image attention as a structural-bias template, subtract it scaled
  by visual-token feature-variance saliency, and restore the removed
  probability mass in proportion to h Filed by the drafting stage from
  Disentangling Semantic Attention from Structural Bias in the Attention
  Manifold (2607.24017) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: POPE accuracy 76.69 to 85.20 and F1 79.72 to 85.42 over
  regular decoding on LLaVA-v1.5; CHAIR_S 55.0 to 49.0, CHAIR_I 16.3 to
  14.0; post-negation GaslightingBench accuracy 24.71 to 41.74 (LLaVA-v1.5)
  and 19.81 to 34.04 (LLaVA-NeXT) versus 40.95/30.58 for GasEraser, with
  pre-negation accuracy preserved and latency 0.42 vs 1.05 s/it; ablations
  show text-side marginalization gives nearly all the gain (41.74 vs 34.28
  for image-side) and removing redistribution drops post-negation to 33.91..
  Nobody has vouched for it; add support or contest it on this page.
