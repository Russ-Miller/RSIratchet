description: >-
  Each agent emits a visual-evidence list plus an answer; a summary tool
  sorts the lists into consistent, complementary and conflicting items with
  a conflict ratio, the anchor agent regenerates from that pooled context,
  and a refine tool retu Filed by the drafting stage from M$^3$-ACE:
  Rectifying Visual Perception in Multimodal Math Reasoning via
  Multi-Agentic Context Engineering (2603.08369) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: MathVision accuracy against
  each anchor's own CoT baseline: Gemini-3 Pro 85.0 to 88.1 after one
  regeneration and 89.1 after refine-reflect; Claude-4.5 61.2 to 76.0; GPT-5
  72.0 to 81.3. The paper reports a comparison against answer-level
  aggregation only in an appendix, not in the main text.. Nobody has vouched
  for it; add support or contest it on this page.
