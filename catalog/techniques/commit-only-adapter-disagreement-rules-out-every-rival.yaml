description: >-
  Treat an ensemble of LoRA adapters as a credal set, bound each candidate
  answer by its min and max probability across adapters, and answer only
  when one candidate's lower bound dominates all others' upper bounds,
  otherwise return the surviv Filed by the drafting stage from Credal Large
  Language Models for Semantic Commitment under Uncertainty (2608.23244)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  AUROC for detecting the model's own errors and corrupted inputs vs
  standard LLM entropy, semantic entropy, Laplace/Bayesian-LoRA and
  mean-pooled LoRA ensemble; accuracy at 80% coverage; ECE/NLL; commit rate
  and accuracy-when-committed on clean vs corrupted passages across three
  backbones and five datasets.. Nobody has vouched for it; add support or
  contest it on this page.
