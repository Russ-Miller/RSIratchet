description: >-
  Evaluates continual-learning methods not only with standard forgetting
  metrics on seen tasks but also on disjoint general video understanding
  benchmarks plus compute and storage cost. Filed by the drafting stage from
  CL-VISTA: Benchmarking Continual Learning in Video Large Language Models
  (2604.00677) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to 10 CL methods on two backbones: MR-LoRA and
  DISCO had the best BWT (0.02, -0.85) yet fell 4.94 and 5.98 average points
  below LoRA-FT on five general benchmarks, with NExTQA dropping 15.98 and
  21.12 points.. Nobody has vouched for it; add support or contest it on
  this page.
