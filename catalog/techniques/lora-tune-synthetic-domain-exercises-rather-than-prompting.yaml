id: lora-tune-synthetic-domain-exercises-rather-than-prompting
ref: TEC-0715
label: "LoRA-tune on synthetic domain exercises rather than promptin"
summary: >-
  Generate and validate synthetic task-code pairs with a teacher LLM for a
  target library, then LoRA fine-tune a small open code model on them
  instead of inserting the same examples via few-shot or retrieval.
description: >-
  Generate and validate synthetic task-code pairs with a teacher LLM for a
  target library, then LoRA fine-tune a small open code model on them
  instead of inserting the same examples via few-shot or retrieval. Filed by
  the drafting stage from Exploring different approaches to customize
  language models for domain-specific text-to-code generation (2603.16526)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Pass@1 on HumanEval and BigBenchCode Scikit-learn/OpenCV subsets plus
  cosine similarity to held-out reference code, compared against the untuned
  baseline and against 3-shot and 3-document RAG with the same example
  pool.. Nobody has vouched for it; add support or contest it on this page.
