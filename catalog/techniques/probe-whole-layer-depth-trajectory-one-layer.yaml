id: probe-whole-layer-depth-trajectory-one-layer
ref: TEC-0507
label: "Probe the whole layer-depth trajectory, not one layer"
summary: >-
  Extracts per-layer statistical descriptors across uniformly sampled depths
  of a frozen LLM, encodes them with multi-scale attention and a
  layer-weighted transformer, and feeds out-of-fold embeddings to a stacked
  classifier ensemble.
description: >-
  Extracts per-layer statistical descriptors across uniformly sampled depths
  of a frozen LLM, encodes them with multi-scale attention and a
  layer-weighted transformer, and feeds out-of-fold embeddings to a stacked
  classifier ensemble. Filed by the drafting stage from MultiHaluDet:
  Multilingual Hallucination Detection via LLM Hidden State Probing
  (2605.24919) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: AUROC on HaluEval and TriviaQA with Mistral-7B and
  LLaMA2-7B against 13 baselines (confidence, consistency, single-layer
  probes, neural ODE/CDE/SDE trajectory models); reported 98.3-98.6 vs best
  baseline 85.1-95.4. Ablations: removing out-of-fold stacking costs ~10
  AUROC points, multi-scale attention ~7, final-layer-only trajectory ~5..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [hallucination]
kind: architecture
sources: [arxiv-2605-24919]
status: proposed
