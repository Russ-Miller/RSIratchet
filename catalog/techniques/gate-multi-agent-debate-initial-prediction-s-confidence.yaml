id: gate-multi-agent-debate-initial-prediction-s-confidence
ref: TEC-0301
label: "Gate multi-agent debate on the initial prediction's confiden"
summary: >-
  A manager model estimates label probabilities first and the
  Proponent-Opponent-Judge debate runs only when top-label confidence falls
  below a threshold, otherwise the initial label is accepted.
description: >-
  A manager model estimates label probabilities first and the
  Proponent-Opponent-Judge debate runs only when top-label confidence falls
  below a threshold, otherwise the initial label is accepted. Filed by the
  drafting stage from From Argument Components to Graphs: A Multi-Agent
  Debate with Confidence Gating for Argument Relations (2606.16047) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Macro F1
  on the UKP v2 80-essay test split: gated debate (tau=0.70, 14% of samples
  debated) 0.585 vs 0.578 for the strongest single-agent baseline (Gemini
  2.5 Pro reasoning), 0.561 for full debate, 0.562 manager-only; at tau=0.70
  debate improved 84 and worsened 48 predictions, vs 249 improved and 236
  worsened under full debate; 86% fewer debate initializations.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
