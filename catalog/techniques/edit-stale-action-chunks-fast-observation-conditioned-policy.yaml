id: edit-stale-action-chunks-fast-observation-conditioned-policy
ref: TEC-0085
label: "Edit stale action chunks with a fast observation-conditioned"
summary: >-
  A large VLA asynchronously samples candidate action chunks from an older
  observation while a lightweight RL edit policy perturbs them using the
  newest observation and a learned Q-function picks the highest-value chunk
  to execute.
description: >-
  A large VLA asynchronously samples candidate action chunks from an older
  observation while a lightweight RL edit policy perturbs them using the
  newest observation and a learned Q-function picks the highest-value chunk
  to execute. Filed by the drafting stage from Reinforcement Learning for
  Real-Time Vision-Language-Action Policies (2609.18207) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: On 10 Kinetix
  tasks with a 4-step base-policy delay it averaged 96.2% success versus
  81.4% for zero-delay RLPD and 14.5-34.5 points above delayed DSRL/EXPO-FT
  variants; on four real robot tasks it averaged 29/30 versus 25/30 for
  EXPO-FT w/ RTC and 12.5/30 for SFT, with 30 trials per task and training
  capped at 10 minutes of online data.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [embodied-control]
