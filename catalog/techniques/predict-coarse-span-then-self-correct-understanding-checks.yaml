description: >-
  Train the model in three stages — multi-task SFT on grounding plus
  query-clip matching and event-status classification, then CoT fine-tuning
  on 'predict an enclosing coarse segment, then zoom to the target' traces,
  then GRPO on hard cases — Filed by the drafting stage from OmniVTG: A
  Large-Scale Dataset and Training Paradigm for Open-World Video Temporal
  Grounding (2604.25276) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: R1@0.5 on the authors' test set and four public VTG
  benchmarks against Time-R1, UniTime and the untuned backbone; staged
  ablation shows SFT+CoT+RL 63.3 / 62.4 (rare) / 39.8 (ActivityNet) versus
  SFT alone 62.3 / 59.6 / 25.6 and SFT+RL without CoT 62.8 / 60.6 / 37.2,
  with content-aware coarse spans beating randomly shifted ones.. Nobody has
  vouched for it; add support or contest it on this page.
