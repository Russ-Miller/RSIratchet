  Hallucinations in Large Vision-Language Models via Cross-Modal Attention
  Drifts and Mask-Based Verification (2609.02028) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: ACC and AUROC against six
  detection baselines (IC, GLSim, NLL, Entropy, SVAR, DHCP) on three models
  and three datasets: best in 16 of 18 cells, with COCO-Caption AUROC gains
  of 5.6/8.4/4.6 points over the best baseline; ablations isolate each
  component (LLaVA drift-only AUROC 85.7, masking-only 72.8, combined 87.4)
  and compare masking-layer and masking-region choices.. Nobody has vouched
