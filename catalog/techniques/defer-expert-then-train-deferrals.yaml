id: defer-expert-then-train-deferrals
ref: TEC-0638
label: "Defer to an expert, then train on the deferrals"
summary: >-
  Agents pick among endorse-a-peer, generate-new, or defer-to-expert under a
  cost-aware GRPO reward, and every deferral event's expert answer is also
  used as a supervised fine-tuning sample for the backbone.
description: >-
  Agents pick among endorse-a-peer, generate-new, or defer-to-expert under a
  cost-aware GRPO reward, and every deferral event's expert answer is also
  used as a supervised fine-tuning sample for the backbone. Filed by the
  drafting stage from Adaptive Collaboration with Humans: Metacognitive
  Policy Optimization for Multi-Agent LLMs with Continual Learning
  (2603.07972) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on GSM8K/AMC/AIME/HumanEval/MMLU against
  single-agent prompting and multi-agent baselines (debate, DyLAN, GPTSwarm,
  AgentPrune, AFlow) on four backbones; staged ablation separating init
  policy, GRPO-only and full dual loop; and a transfer test swapping the
  DLPO-trained backbone into unchanged baseline pipelines.. Nobody has
  vouched for it; add support or contest it on this page.
