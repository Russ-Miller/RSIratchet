label: "Schema-validated tool calls plus verify-then-act motion chec"
summary: >-
  Restrict the LLM to typed tool calls carrying only semantic object
  references and bounded skill parameters, bind each accepted call to a
  fixed motion-planning template, and execute only trajectories that pass
  kinematic and collision checks
description: >-
  Restrict the LLM to typed tool calls carrying only semantic object
  references and bounded skill parameters, bind each accepted call to a
  fixed motion-planning template, and execute only trajectories that pass
  kinematic and collision checks Filed by the drafting stage from Bridging
  Semantics and Physics with Constrained LLMs for Safe and Trustworthy
  Robotic Manipulation (2608.29379) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: End-to-end success over 10 physical
  trials per task: 72.5% mean vs 50.0% for a scripted FSM/BT policy and
  47.5% for the same LLM without canonical sequencing; ablations removing
  safe-pose reset (-32.5 points) and retry (-47.5 points) versus removing
  the task graph (-25.0 points).. Nobody has vouched for it; add support or
  contest it on this page.
