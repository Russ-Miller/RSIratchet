label: "Predict the expected screen effect, then verify it next step"
summary: >-
  The agent emits thinking, a binary verification of the previous step
  against its own earlier effect prediction, the action, and a prediction of
  the resulting screen change, and is trained with SFT on injected-failure
  trajectories plus GRPO
description: >-
  The agent emits thinking, a binary verification of the previous step
  against its own earlier effect prediction, the action, and a prediction of
  the resulting screen change, and is trained with SFT on injected-failure
  trajectories plus GRPO Filed by the drafting stage from Don't Act Blindly:
  Robust GUI Automation via Action-Effect Verification and Self-Correction
  (2604.05477) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: On a failure-injection Robustness Benchmark from
  AndroidControl-High, Recovery Success Rate 51.1% (3B) and 52.5% (7B) vs
  45.5% best open baseline (UI-TARS-7B), Loop Rate 24.3%/15.6% vs 30.0% for
  Qwen2.5-VL-3B; ablations: Robust SFT lifts RSR 29.7->45.5, GRPO to 51.1;
  also gains on live MiniWoB++ and AndroidWorld.. Nobody has vouched for it;
  add support or contest it on this page.
