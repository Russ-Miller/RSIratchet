description: >-
  A frozen copy of the same policy is prompted with parametric-certainty,
  retrieval-quality and target-quadrant hints to produce calibrated
  reasoning traces, which supervise the hint-free student token by token
  with a per-quadrant choice of f Filed by the drafting stage from KbSD:
  Knowledge Boundary aware Self-Distillation for Behavioral Calibration in
  Agentic Search (2606.29863) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Unreliability rate (1 - F1 - refusal rate) across
  nine QA and agentic benchmarks: average 64.32 to 47.60 at 3B and 57.99 to
  41.18 at 7B against KbPO, with ablations removing the distillation loss
  (61.92) or fixing one KL direction (49.13 forward, 64.32 reverse).. Nobody
  has vouched for it; add support or contest it on this page.
