description: >-
  Modify the training environment's feedback rather than the agent: give
  explicit next-action hints in the first steps of an episode and the first
  half of training, then switch to richer state information in later steps
  and later training, ke Filed by the drafting stage from Environments as
  Scaffold: Enriching Feedback to Bootstrap Self-Evolving Agents in
  Long-Horizon Tasks (2609.08404) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Success rate on unenriched standard
  environments, compared against training in standard environments, across 2
  model scales x 3 RL algorithms x 2 benchmarks; average absolute gain 2.82
  points, with a hybrid schedule beating all four single strategies in the
  pilot study; regressions of 3-7 points on BFCL Miss Param / Miss Func
  splits.. Nobody has vouched for it; add support or contest it on this
  page.
