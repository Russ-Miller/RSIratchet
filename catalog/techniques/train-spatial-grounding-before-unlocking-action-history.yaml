id: train-spatial-grounding-before-unlocking-action-history
ref: TEC-0650
label: "Train spatial grounding before unlocking action history"
summary: >-
  Fine-tune the planner first with the action-history channel blocked so it
  must read the current frame, then resume full fine-tuning with history
  restored from that checkpoint.
description: >-
  Fine-tune the planner first with the action-history channel blocked so it
  must read the current frame, then resume full fine-tuning with history
  restored from that checkpoint. Filed by the drafting stage from SVLL:
  Staged Vision-Language Learning for Physically Grounded Embodied Task
  Planning (2603.11563) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On a sampled AI2-THOR test set: staged Stage-2 scored
  74.23% success, 84.16% valid-action rate and 8.25% loop rate versus a
  'Direct Stage 2' joint-SFT baseline at 68.04%, 78.37% and 10.31%; same
  backbone, data and metrics.. Nobody has vouched for it; add support or
  contest it on this page.
