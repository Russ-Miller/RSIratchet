id: replay-matched-trajectories-compare-confidence-to-action-maps
ref: TEC-0273
label: "Replay matched trajectories to compare confidence-to-action "
summary: >-
  Collect each question's answer and confidence at every retrieval depth
  once, then replay the identical stored states through controllers that
  differ only in the confidence score supplied, so action differences are
  attributable to the score
description: >-
  Collect each question's answer and confidence at every retrieval depth
  once, then replay the identical stored states through controllers that
  differ only in the confidence score supplied, so action differences are
  attributable to the score Filed by the drafting stage from Evaluating
  Confidence-Gated Retrieval with Matched Trajectory Replay (2608.26846)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Used to compare raw vs isotonic-calibrated verbalized confidence under an
  identical policy, budget and cost model on 2,457 test episodes across
  three models and two datasets, reporting overall accuracy, committed
  accuracy, coverage and mean retrieval actions jointly; no external
  baseline protocol compared.. Nobody has vouched for it; add support or
  contest it on this page.
