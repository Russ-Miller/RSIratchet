id: reward-output-shift-caused-constraint-tokens
ref: TEC-0338
label: "Reward the output shift caused by the constraint tokens"
summary: >-
  Adds to the RL reward the KL divergence between the model's output
  distribution on the full query and on the same query with constraint
  tokens deleted, so the policy is paid for letting constraints change its
  generation.
description: >-
  Adds to the RL reward the KL divergence between the model's output
  distribution on the full query and on the same query with constraint
  tokens deleted, so the policy is paid for letting constraints change its
  generation. Filed by the drafting stage from CARL: Constraint-Aware
  Reinforcement Learning for Planning with LLMs (2607.04854) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Qwen3-8B final
  pass rate on TravelPlanner 56.1% vs 45.0% RFT and 2.2% untrained;
  BlocksWorld 77.2 vs 73.8 RFT; gains replicated under PPO (81.6 vs 78.4)
  and DPO (53.8 vs 51.4); masking goals instead of constraints scored below
  RFT (70.4); attribution scores on constraint tokens shifted upward across
  the distribution.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [planning]
