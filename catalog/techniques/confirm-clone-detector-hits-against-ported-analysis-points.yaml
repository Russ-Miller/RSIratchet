description: >-
  Distil each disclosed CVE into explicit diagnostic analysis points, have
  one agent re-map those points to the candidate site in the target
  repository, and have a second agent verify them using tools that fetch
  function and struct definition Filed by the drafting stage from
  Multi-Agent End-to-End Vulnerability Management for Mitigating Recurring
  Vulnerabilities (2601.17762) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Ablation on 114 function-level pairs: removing the
  confirmation stage took false positives from 21 to 223, precision from
  76.4% to 26.6%, and end-to-end repair accuracy from 57.3% to 17.8%;
  removing the knowledge base instead cost only 21->32 FPs and 57.3%->49.5%.
  Full system beat six detection+repair tool combinations by 31.9-45.2
  points of repair accuracy.. Nobody has vouched for it; add support or
  contest it on this page.
