id: budget-reliability-per-step-instead-reporting-pass-rates
ref: TEC-0250
label: "Budget reliability per step instead of reporting pass rates"
summary: >-
  Fit a per-step reliability parameter from short-horizon runs and project
  it onto the target production horizon to predict success, instead of
  reporting aggregate benchmark pass rates.
description: >-
  Fit a per-step reliability parameter from short-horizon runs and project
  it onto the target production horizon to predict success, instead of
  reporting aggregate benchmark pass rates. Filed by the drafting stage from
  How Fast Do Agents Rot? An Empirical Study of Long-Horizon Degradation in
  LLM Agents for Production Decision-Making (2609.01660) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: The geometric law
  fit across nine models and five horizons; projected success falls from
  0.42 at GAIA-length horizons to 0.24 at hundred-step horizons. Not
  validated as an intervention that improves agents.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [long-horizon-execution]
kind: process
sources: [arxiv-2609-01660]
