description: >-
  Two model instances are prompted with opposing evaluative frames, argue
  independently in one round, and a third model picks between the arguments
  after identifying labels are stripped. Filed by the drafting stage from
  Durable Evaluation Framework: Adversarial Arbitration for Sycophancy
  Reduction in Large Language Models (2606.07532) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy on 200 stratified
  SycophancyEval questions against a single-model baseline (18.5%) and an
  instructed-opposition baseline (29.0%); best non-degenerate variant 48.5%
  (z=6.36, p<0.001 against both).. Nobody has vouched for it; add support or
  contest it on this page.
