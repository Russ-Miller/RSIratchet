id: flag-policy-language-paired-empty-tool-payload
ref: TEC-0286
label: "Flag policy language paired with an empty tool payload"
summary: >-
  A runtime check over each (tool payload, final response) pair that flags
  the response for review when the payload is null/empty/malformed and the
  response contains policy or authorization vocabulary.
description: >-
  A runtime check over each (tool payload, final response) pair that flags
  the response for review when the payload is null/empty/malformed and the
  response contains policy or authorization vocabulary. Filed by the
  drafting stage from Guardrails as Scapegoats: Auditing Unfaithful Safety
  Refusals in Tool-Augmented LLM Agents (2607.19449) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Applied to the 396 baseline
  trajectories it produced zero false positives among 395 non-USR responses,
  but missed the one baseline case, which used capability-limitation rather
  than policy wording; recall is bounded by the keyword list and was not
  measured on the ablation set.. Nobody has vouched for it; add support or
  contest it on this page.
