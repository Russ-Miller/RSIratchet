description: >-
  An MLLM is prompted with the image plus blur/brightness/contrast/noise
  statistics and outputs one of five domain labels, dispatching the image to
  the matching fine-tuned vision expert, with an UNSURE option falling back
  to the best balanced Filed by the drafting stage from MLLM-Routed
  Heterogeneous Ensembles for Robust Cross-Dataset Image Classification
  (2608.13463) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Unified-dataset top-1 accuracy: ARMDIL 90.78% vs best
  single backbone (balanced DINOv3) 89.61%, majority vote 90.47%, trained
  NN-Router 91.18%, oracle router 91.04%; per-domain routing accuracy
  78.2-99.8%.. Nobody has vouched for it; add support or contest it on this
  page.
