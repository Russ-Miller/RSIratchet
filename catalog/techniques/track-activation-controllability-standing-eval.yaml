id: track-activation-controllability-standing-eval
ref: TEC-0217
label: "Track activation controllability as a standing eval"
summary: >-
  Score each new model on six measures of how well it can engage, suppress,
  dial, time, sustain and layer-target a concept in its own residual stream
  on instruction, and combine them into one conjunctive controllability
  score.
description: >-
  Score each new model on six measures of how well it can engage, suppress,
  dial, time, sustain and layer-target a concept in its own residual stream
  on instruction, and combine them into one conjunctive controllability
  score. Filed by the drafting stage from Measuring Activation Control in
  Large Language Models (2608.21664) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Applied to 25 open-weight models;
  score ranged 0.059-0.538, did not track parameter count, and rose across
  Olmo training checkpoints — so it discriminates between models. Not
  validated as predicting real monitor failure on safety-relevant concepts..
  Nobody has vouched for it; add support or contest it on this page.
