description: >-
  Score a model on six atomic measures of how well it can engage, suppress,
  dial, time-place, sustain and layer-target a concept in its residual
  stream under instruction, combined into one conjunctive score, and watch
  the trend across model g Filed by the drafting stage from Measuring
  Activation Control in Large Language Models (2608.21664) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Scores ranged
  0.059-0.538 across 25 models and did not track parameter count or
  capability; rose across Olmo pre-training and post-training checkpoints
  (~0.09 to ~0.42); downstream monitor-evasion experiments showed
  suppression detected at only 5-21% at 1% FPR while engagement stayed near
  ceiling.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [strategic-deception]
