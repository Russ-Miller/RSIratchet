id: accept-skills-sampled-coalition-knockouts-mask-target-retrieval
ref: TEC-0087
label: "Accept skills on sampled coalition knockouts, mask on target"
summary: >-
  At the acceptance gate, score a candidate bank by the averaged knockout
  margin of Monte-Carlo-sampled skill coalitions combined with the outcome
  reward; at deployment, greedily drop skills whose removal raises mean
  cosine retrieval quality
description: >-
  At the acceptance gate, score a candidate bank by the averaged knockout
  margin of Monte-Carlo-sampled skill coalitions combined with the outcome
  reward; at deployment, greedily drop skills whose removal raises mean
  cosine retrieval quality Filed by the drafting stage from Coalition-Aware
  Skill Reliability for Self-Evolving Agents (2608.22610) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Matched-protocol
  comparison against MemSkill and six memory-agent baselines on four
  benchmarks over three seeds: the coalition gate accepted 1 of 12
  candidates vs MemSkill's 6, and a K-controlled ablation showed MemSkill's
  extra admissions were net -1.38 points on average; the label-free masking
  step improved LLM-judge score on HotpotQA-50 for all six trained banks
  (+3.59 points average on coalition-gated banks, +7.17 on baseline banks),
  and the entropy-based alternative signal anti-correlated with the
  label-based ranking (rho -0.18) while retrieval quality reached +0.76..
  Nobody has vouched for it; add support or contest it on this page.
