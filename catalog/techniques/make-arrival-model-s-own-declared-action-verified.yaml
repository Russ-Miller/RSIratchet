id: make-arrival-model-s-own-declared-action-verified
ref: TEC-0129
label: "Make arrival the model's own declared action, verified after"
summary: >-
  Instead of ending an episode by an external distance threshold, the agent
  exposes a 'finished' action the model emits, keeps flying, and a verifier
  later checks whether any declaration was within the success radius with
  the target visible.
description: >-
  Instead of ending an episode by an external distance threshold, the agent
  exposes a 'finished' action the model emits, keeps flying, and a verifier
  later checks whether any declaration was within the success radius with
  the target visible. Filed by the drafting stage from Evaluating Multimodal
  LLMs as Generalist Vision-Language-Action Agents for Drone Control:
  Commanding, Approaching, Tracking and Searching (2609.01404) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Scored 9 models
  over 80 single-drone and 20 four-drone episodes; comparing success rate to
  oracle-success (trajectory entered the radius) exposes a declaration gap
  invisible under threshold-based termination (e.g. Qwen3.5-9B 90% oracle vs
  35% success), and 61 of 337 never-declaring failures had entered the
  radius.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [embodied-control]
kind: process
