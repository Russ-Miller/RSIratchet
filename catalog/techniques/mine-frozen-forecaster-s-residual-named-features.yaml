id: mine-frozen-forecaster-s-residual-named-features
ref: TEC-0304
label: "Mine the frozen forecaster's residual for named features"
summary: >-
  Keeps the forecasting backbone frozen and mines its residual with a
  Monte-Carlo compositional search plus an LLM proposing named feature
  combinations, binary flags and code, admitting candidates through one
  source-blind validation gate into
description: >-
  Keeps the forecasting backbone frozen and mines its residual with a
  Monte-Carlo compositional search plus an LLM proposing named feature
  combinations, binary flags and code, admitting candidates through one
  source-blind validation gate into Filed by the drafting stage from When Do
  Corrective Features Help? An Agent for Corrective Feature Discovery on
  Black-Box Forecasters (2608.05207) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Mean reduction in test wMAPE versus
  the raw frozen backbone across 36 backbone-dataset cells under a
  rolling-origin, multi-seed protocol, against three external
  feature-engineering systems (TSFresh, CAAFE, LLM-FE) run through the
  identical gate and corrector, plus a no-LLM ablation, a covariate-only
  corrector, and a head-only fine-tune; paired Wilcoxon p<0.01, up to 27%
  error reduction on the weakest backbones, and the advantage holds at every
  feature budget K.. Nobody has vouched for it; add support or contest it on
  this page.
