id: make-critique-itself-produce-corrected-output
ref: TEC-0500
label: "Make the critique itself produce the corrected output"
summary: >-
  Require each human critique to be the sole input that drives a model from
  its pre-caption to the accepted post-caption, which forces critiques to be
  accurate, complete and to state the fix.
description: >-
  Require each human critique to be the sole input that drives a model from
  its pre-caption to the accepted post-caption, which forces critiques to be
  accurate, complete and to state the fix. Filed by the drafting stage from
  Building a Precise Video Language with Human-AI Oversight (2604.21718)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Ablation on controlled critique corruptions: full-quality critiques gave
  caption BLEU-4 18.2, reward accuracy 89.8, critique BLEU-4 41.7, versus
  12.1/47.1/21.9 (inaccurate), 12.5/56.6/28.7 (incomplete), 13.4/67.2/32.9
  (unhelpful), 12.7/62.0/26.2 (Gemini-2.5-Pro critiques with video), and
  14.8/73.1/35.7 before second-stage quality control.. Nobody has vouched
  for it; add support or contest it on this page.
