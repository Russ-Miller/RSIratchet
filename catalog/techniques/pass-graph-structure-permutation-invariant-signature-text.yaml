description: >-
  Summarize sampled graph neighborhoods for an LLM agent as a fixed-length
  vector of named graph statistics, keeping raw text only for the top-k
  semantically relevant nodes, so the observation is order-independent and
  does not grow with neigh Filed by the drafting stage from Multi-Agent
  Agentic Graph Learning via Structural Signatures (2609.09565) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy and
  Macro-F1 against single-agent and orchestration-based AGL baselines on
  four datasets (best accuracy on all four); an ablation that restores
  ReaGAN-style verbalized neighbors while keeping the numeric signature for
  collaboration routing produced the largest accuracy drop of four
  ablations; tokens per cross-agent message compared against serialized
  1-hop/2-hop neighborhoods.. Nobody has vouched for it; add support or
  contest it on this page.
