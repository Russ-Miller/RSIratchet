description: >-
  Estimate the model's confidence by a relevance-weighted semantic entropy,
  then either write its parametric knowledge out as text or retrieve
  external evidence, and have three agents induce conflict-resolution rules
  offline, detect answer-le Filed by the drafting stage from Navigating
  Unreliable Parametric and Contextual Knowledge: Explicit Knowledge
  Conflict Resolution for LLM Inference (2606.20245) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: EM and ROUGE-L against
  Direct, ICL, InstructRAG-ICL, TruthfulRAG and CK-PLUG on three conflict
  benchmarks (e.g. ConflictBank EM 0.549 vs 0.312 best baseline on
  Llama3.1-8B); ablation replacing the multi-agent module with
  chain-of-thought drops EM to 0.229, removing assessment/retrieval drops it
  to 0.480.. Nobody has vouched for it; add support or contest it on this
  page.
