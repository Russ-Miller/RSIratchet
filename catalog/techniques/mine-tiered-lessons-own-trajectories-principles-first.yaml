id: mine-tiered-lessons-own-trajectories-principles-first
ref: TEC-0103
label: "Mine tiered lessons from own trajectories, principles first"
summary: >-
  After each labelled run, an agent distills successes into 'golden' lessons
  and failures into 'warning' lessons, consolidates them by embedding
  similarity into a three-tier library (principles, patterns, cases), and
  retrieves from it top-dow
description: >-
  After each labelled run, an agent distills successes into 'golden' lessons
  and failures into 'warning' lessons, consolidates them by embedding
  similarity into a three-tier library (principles, patterns, cases), and
  retrieves from it top-dow Filed by the drafting stage from EMR:
  Self-Evolving Medical Multi-Agent System via Experience Mining and Reuse
  (2609.15161) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy over nine medical QA sets against single-LLM,
  static multi-agent (MedAgents, MDAgents) and experience-based baselines
  (ExpeL, ReasoningBank, G-Memory, MDTeamGPT, EvolveR); average accuracy
  81.1 vs 77.8 for MDAgents on Qwen3-8B and 93.9 vs 92.4 on GPT-4o;
  ablations remove experience (-6.7 on MedQA) versus removing planner and
  department agents (-2.9), and remove each tier (principles -4.6, patterns
  -2.5, cases -1.2).. Nobody has vouched for it; add support or contest it
  on this page.
