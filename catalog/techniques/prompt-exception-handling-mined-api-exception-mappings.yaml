id: prompt-exception-handling-mined-api-exception-mappings
ref: TEC-0765
label: "Prompt exception handling with mined API-exception mappings"
summary: >-
  Augments the generation prompt with an empirically mined API-to-exception
  mapping, a cross-file call trace around the target code, and a handling
  pattern abstracted from ~20 retrieved similar try-catch blocks.
description: >-
  Augments the generation prompt with an empirically mined API-to-exception
  mapping, a cross-file call trace around the target code, and a handling
  pattern abstracted from ~20 retrieved similar try-catch blocks. Filed by
  the drafting stage from CatchAll: Repository-Aware Exception Handling with
  Knowledge-Guided LLMs (2601.01271) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared against six baselines
  (Direct-Prompting, RepoCoder, ExAssist, Nexgen, Seeker, KPC) on RepoExEval
  (CodeBLEU 0.31 vs 0.27; intent accuracy 60.1% vs 48.0%) and
  RepoExEval-Exec (Pass@1 29% vs 25%), with a one-at-a-time ablation of the
  three knowledge components.. Nobody has vouched for it; add support or
  contest it on this page.
