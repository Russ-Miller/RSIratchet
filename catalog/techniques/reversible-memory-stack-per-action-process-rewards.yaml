description: >-
  Gives an RL-trained retrieval agent a LIFO memory stack with push/pop
  actions (plan, think, search, summary, backtrack, conclusion) and assigns
  format, retrieval-relevance and memory-usefulness rewards to the tokens of
  each action, plus bat Filed by the drafting stage from AgenticRag-R1:
  Agentic Reinforcement Learning with Stack Memory for Multi-Step Reasoning,
  Retrieval and Memorizing (2608.29622) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: F1 on seven QA benchmarks against
  No-RAG, naive RAG, agentic RAG and RL baselines (ReSearch, Search-R1,
  AEPO, ARPO, Mem1); average 33.55 vs 30.16 best baseline at 3B; ablations
  drop average to 27.37 without memory actions, 25.43 without rejection,
  19.94 without both process rewards.. Nobody has vouched for it; add
  support or contest it on this page.
