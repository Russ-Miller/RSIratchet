description: >-
  Maintains a population of agents, each a prompt template plus
  temperature/top-p/penalty/length settings, ranks them by validation
  accuracy, and updates non-elite agents by sampling hyperparameters around
  the top three and having an LLM edit Filed by the drafting stage from
  Agent-GWO: Collaborative Agents for Dynamic Prompt Optimization in Large
  Language Models (2604.18612) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Average accuracy over 11 benchmarks against CoT,
  CoT-SC, Self-Refine, AFlow, ToT, GoT, AoT on three backbones (e.g.
  GPT-4o-mini 74.6% CoT, 83.3% AoT, 84.0% Agent-GWO); ablations on agent
  count, iteration count, elite set size (m=3 best: GSM8K 95.9 vs 92.4 at
  m=1 and 94.1 at m=5), and decoding-hyperparameter sensitivity (within
  ~1.5%).. Nobody has vouched for it; add support or contest it on this
  page.
