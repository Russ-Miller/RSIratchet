description: >-
  A controller compiles a data-preparation runtime specification, generates
  a small pilot dataset, assesses it against domain-selected quality
  criteria, and emits an adapter that revises specific pipeline components
  while preserving their int Filed by the drafting stage from DataFoundry:
  Evolving Data Preparators via Recursive Self-Improvement (2608.29966) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Downstream benchmark averages after SFT on the produced data, versus
  DataFlow filtering pipelines, direct LLM generators, agent generators and
  skill generators including same-backbone controls: +3.3 Math, +1.3
  Finance, +1.4 Law, +2.2 Medical over the strongest competitor on
  Qwen2.5-7B, and +3.8/+6.2/+7.9/+5.9 over the same-backbone skill
  generator; round sweep shows Math 25.6 to 28.4 to 28.8 then 26.1.. Nobody
  has vouched for it; add support or contest it on this page.
