description: >-
  Tags split the reasoning trace into visual-only and audio-only spans, and
  an asymmetric attention mask stops visual reasoning tokens attending to
  audio inputs and audio reasoning tokens attending to video inputs or the
  visual span, with ful Filed by the drafting stage from Separate First,
  Fuse Later: Mitigating Cross-Modal Interference in Audio-Visual LLMs
  Reasoning with Modality-Specific Chain-of-Thought (2605.09906) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Ablation on
  AVHBench (VAH/AVH/MIS) and AVQA: train-free, tags alone moved MIS 66.36 to
  74.89 but dropped AVH 81.95 to 79.93 and left AVQA flat; adding the mask
  raised AVH to 83.98 and AVQA 89.61 to 92.11. Same ordering under GRPO
  training. No comparison against other isolation schemes such as two
  separate forward passes.. Nobody has vouched for it; add support or
  contest it on this page.
