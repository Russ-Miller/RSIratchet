id: update-only-stable-neurons-anchor-their-activations
ref: TEC-0209
label: "Update only stable neurons and anchor their activations"
summary: >-
  Select FFN neurons with low activation coefficient of variation, mask
  gradients to those neurons only, and after cross-entropy converges add an
  MSE term pulling current activations toward a pre-computed activation
  anchor.
description: >-
  Select FFN neurons with low activation coefficient of variation, mask
  gradients to those neurons only, and after cross-entropy converges add an
  MSE term pulling current activations toward a pre-computed activation
  anchor. Filed by the drafting stage from Neuron-Guided Fine-Tuning:
  Unlocking Efficient Alignment Mechanisms for Large Language Models
  (2609.05913) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: In-domain metric (GSM8K accuracy, ROUGE-L on
  DialogSum/BioInstruct) and a CF score averaging MMLU, BBH and TyDiQA,
  against full-parameter fine-tuning, a composite strong baseline (Data
  Whisperer + NCFT + CE), and per-module baselines (NeFT, NCFT, MathNeuro,
  LESS, Nuggets, CCS) at 1/5/10/100% data; reported gains of 4.66 in-domain
  and 9.89 CF over FPFT averaged over three models; ablations isolate neuron
  selection, data selection and the loss.. Nobody has vouched for it; add
  support or contest it on this page.
