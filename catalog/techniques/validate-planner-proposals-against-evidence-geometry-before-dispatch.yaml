description: >-
  A harness mediates every MLLM navigation command, checking supporting
  evidence, reachability, active subgoal and prior failures before calling
  tools, keeping event memory plus a spatiotemporal graph, and accepting a
  stop only when semantic, Filed by the drafting stage from HarnessVLN:
  Unifying Training-Free Embodied Navigation through an Agent Harness
  (2609.15195) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rates of 60.8 (R2R), 53.9 (RxR), 76.0 (HM3D-v2),
  59.3 (HM3D-OVON) versus prior training-free best, and cumulative ablations
  on 100-episode subsets: base 46.0/45.0 SR rising to 64.0/55.0 with memory,
  graph and stop validation; stop validation added 4.0 and 2.0 SR but
  lowered HM3D-OVON SPL from 34.2 to 33.0 and widened its OSR-SR gap..
  Nobody has vouched for it; add support or contest it on this page.
