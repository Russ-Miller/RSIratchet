id: debate-mixture-of-agents-rebut-revise-then-aggregate
ref: TEC-0250
label: "Debate-Mixture-of-Agents: rebut, revise, then aggregate"
summary: >-
  Each debater runs a presenter that drafts a diagnosis, a rebutter that
  attacks it for missing evidence and unsafe omissions, and a presenter
  revision; a separate aggregator then merges all revised hypotheses without
  forcing consensus.
description: >-
  Each debater runs a presenter that drafts a diagnosis, a rebutter that
  attacks it for missing evidence and unsafe omissions, and a presenter
  revision; a separate aggregator then merges all revised hypotheses without
  forcing consensus. Filed by the drafting stage from A Structured
  Debate-Mixture-of-Agents Framework for Complex Clinical Diagnostic
  Decision Support (2609.05069) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Top-1/top-3 exact-match accuracy and rubric
  safety rate against single-model prompting, a single model prompted to
  imitate the debate, MoA with the rebutter removed, and a MAC-style
  single-debater multi-round dialogue; on challenging cases GPT-4o rose from
  14.50% to 25.34% top-1 accuracy and 63.46% to 76.14% top-1 safety, with
  McNemar p<0.01, and all three ablations scored below the full topology..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
kind: process
sources: [arxiv-2609-05069]
status: proposed
