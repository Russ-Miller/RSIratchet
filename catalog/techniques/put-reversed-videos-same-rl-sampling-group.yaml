id: put-reversed-videos-same-rl-sampling-group
ref: TEC-0164
label: "Put reversed videos in the same RL sampling group"
summary: >-
  During GRPO, sample most responses on the forward video and a small
  minority on the time-reversed video within one group, so group-relative
  advantage rewards using temporal direction.
description: >-
  During GRPO, sample most responses on the forward video and a small
  minority on the time-reversed video within one group, so group-relative
  advantage rewards using temporal direction. Filed by the drafting stage
  from COMET: Contrastive Motion-Enhanced Temporal Reasoning for Video
  Multimodal Large Language Models (2608.21030) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Same Stage-I checkpoint on
  Qwen3-VL-8B: average accuracy over six benchmarks 76.5 (no RL), 78.0
  (standard GRPO 7+0), 78.8 (6+1), 78.4 (5+2), 77.6 (4+3); 1,000 sampled
  examples per benchmark.. Nobody has vouched for it; add support or contest
  it on this page.
