label: "Score forecasts prospectively on registered unresolved event"
summary: >-
  Register each unresolved match or tournament question, trigger
  schema-validated forecasts at fixed horizons before kickoff, archive
  prompt, model version, tool traces and cost, and only then resolve the
  outcome.
description: >-
  Register each unresolved match or tournament question, trigger
  schema-validated forecasts at fixed horizons before kickoff, archive
  prompt, model version, tool traces and cost, and only then resolve the
  outcome. Filed by the drafting stage from LLM-SoccerArena: Benchmarking
  LLMs on Real-World Predictions in Sports (2607.24573) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Not measured as an
  intervention; the protocol is used to produce the reported Brier/log-loss
  comparisons, and forecast quality was additionally benchmarked against
  de-vigged closing bookmaker odds (Gemini 0.497 vs market 0.498).. Nobody
  has vouched for it; add support or contest it on this page.
