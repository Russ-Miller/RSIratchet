label: "Re-anchor late-layer attention to mid-layer visual anchors"
summary: >-
  At inference, identify visually sensitive and insensitive attention heads
  by their mean attention mass on image tokens, extract a positive saliency
  mask from mid-layer sensitive heads and a negative mask from first-layer
  insensitive heads,
description: >-
  At inference, identify visually sensitive and insensitive attention heads
  by their mean attention mass on image tokens, extract a positive saliency
  mask from mid-layer sensitive heads and a negative mask from first-layer
  insensitive heads, Filed by the drafting stage from Visual Attention
  Drifts,but Anchors Hold:Mitigating Hallucination in Multimodal Large
  Language Models via Cross-Layer Visual Anchors (2603.25088) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: POPE F1/accuracy
  averaged over MSCOCO, A-OKVQA and GQA against greedy, beam search, MemVR,
  ClearSight and IMCCD; CHAIR_i/CHAIR_s plus recall on 500 MSCOCO images;
  MME hallucination subsets and full set. Beats baselines on LLaVA-1.5 and
  InstructBLIP, trails IMCCD on some POPE Qwen-VL splits. Ablation:
  positive-only and negative-only each give part of the gain, and inverting
  the two anchors drops MME hallucination score below the untouched
  baseline.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [visual-grounding]
