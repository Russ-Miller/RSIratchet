id: calibrate-raw-uncertainty-scores-against-correctness-labels
ref: TEC-0603
label: "Calibrate raw uncertainty scores against correctness labels"
summary: >-
  Trains a small MLP on (uncertainty score, correctness label) pairs with
  binary cross-entropy plus an auxiliary pairwise ranking term to map the
  raw score to a truth-aligned probability of correctness.
description: >-
  Trains a small MLP on (uncertainty score, correctness label) pairs with
  binary cross-entropy plus an auxiliary pairwise ranking term to map the
  raw score to a truth-aligned probability of correctness. Filed by the
  drafting stage from Towards Reliable Truth-Aligned Uncertainty Estimation
  in Large Language Models (2604.00445) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: ECE and AUC on 10 uncertainty metrics
  x 5 models x 3 QA datasets against the uncalibrated scores and against
  CUE; ECE dropped by roughly 10-70 points in most cells while AUC changes
  were often near zero; few-shot (8-128 labels) and label-corrupted variants
  retained ECE gains but lost AUC.. Nobody has vouched for it; add support
  or contest it on this page.
