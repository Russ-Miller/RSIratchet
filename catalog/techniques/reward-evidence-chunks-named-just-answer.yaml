id: reward-evidence-chunks-named-just-answer
ref: TEC-0614
label: "Reward the evidence chunks named, not just the answer"
summary: >-
  During RL, the model first emits identifiers of the context chunks it is
  grounding on, and receives an F-beta reward against annotated gold chunks
  blended with the answer-correctness reward, alongside the usual outcome
  reward.
description: >-
  During RL, the model first emits identifiers of the context chunks it is
  grounding on, and receives an F-beta reward against annotated gold chunks
  blended with the answer-correctness reward, alongside the usual outcome
  reward. Filed by the drafting stage from LongRLVR: Long-Context
  Reinforcement Learning Requires Verifiable Context Rewards (2603.02146)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy on RULER-QA, LongBench v2 and LongReason against SFT and
  outcome-only GRPO on identical data: Qwen2.5-14B-1M RULER-QA 73.17 to
  88.90, LongBench v2 39.8 to 46.5; ablations show answer-only reward
  stagnates contextual recall and context-only reward degrades downstream
  accuracy over training.. Nobody has vouched for it; add support or contest
  it on this page.
addresses: [long-context-degradation]
kind: training
sources: [arxiv-2603-02146]
status: proposed
