id: write-memory-frames-fixed-chunk-schedule-events
ref: TEC-0151
label: "Write memory frames on a fixed chunk schedule, not on events"
summary: >-
  Append one observation frame to the policy's visual memory at every
  action-chunk boundary instead of triggering writes on predicted subtask
  changes or motion thresholds.
description: >-
  Append one observation frame to the policy's visual memory at every
  action-chunk boundary instead of triggering writes on predicted subtask
  changes or motion thresholds. Filed by the drafting stage from
  ActiveArena: Benchmarking and Understanding Active Perception in Robotic
  Manipulation (2609.24124) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Task success rate across 35 tasks: chunk writing
  62.97 ID / 47.60 OOD at 12 frames vs subtask writing 28.11 / 16.00 and
  motion writing 32.80 / 22.69; memory-free baseline 27.37 / 6.12. Capacity
  6 to 12 helped chunk writing but hurt motion writing in most settings..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [embodied-control]
kind: architecture
sources: [arxiv-2609-24124]
status: proposed
