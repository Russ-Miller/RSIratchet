id: query-time-series-through-code-context
ref: TEC-0306
label: "Query the time series through code, not in context"
summary: >-
  Store the full recording as a variable in a sandboxed Python REPL and let
  the model iteratively emit code (and optionally render plots or spawn
  sub-agents) to inspect segments before committing a structured answer.
description: >-
  Store the full recording as a variable in a sandboxed Python REPL and let
  the model iteratively emit code (and optionally render plots or spawn
  sub-agents) to inspect segments before committing a structured answer.
  Filed by the drafting stage from TimeRLM: Recursive Language Models Enable
  Precise Anomaly Localization in Long-Context Time-Series (2608.03391) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: On
  AnomalyXL-Localize, IoU 0.682 vs at most 0.329 for all single-pass LLM,
  TSLM and fine-tuned 32B Toto baselines; classify-with-evidence 0.745 vs
  below 0.08; zero-shot ECG/sleep IoU 0.271 vs under 0.004 for every TSLM.
  Scalar-magnitude task did not improve (0.440 to 0.480).. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [long-context-degradation]
kind: tooling
sources: [arxiv-2608-03391]
status: proposed
