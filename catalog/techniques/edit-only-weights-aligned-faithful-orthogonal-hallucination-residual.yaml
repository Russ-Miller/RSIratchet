description: >-
  Extract the hallucination component as the residual of hallucinated hidden
  states after projecting onto the SVD subspace of faithful hidden states,
  then null-space-project only the top-K weight vectors whose cosine
  similarity to that residu Filed by the drafting stage from Mitigating
  Hallucinations in Large Vision-Language Models without Performance
  Degradation (2604.20366) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: CHAIR_S/CHAIR_I and BLEU on MSCOCO, POPE F1 under
  random/popular/adversarial sampling, HallusionBench, MME subsets and
  LLaVA-Bench accuracy/detailedness, against Nullu, HALC, OPERA, VCD, LURE,
  DoLa and greedy decoding; plus PCA visualisation of hidden-state drift and
  a count of modified parameters (42% and 37% fewer perturbations than
  whole-layer editing).. Nobody has vouched for it; add support or contest
  it on this page.
