id: gate-inter-agent-handoffs-phase-calibrated-uncertainty
ref: TEC-0292
label: "Gate inter-agent handoffs on phase-calibrated uncertainty"
summary: >-
  Intercept each agent-to-agent handoff, score the response's uncertainty
  from token log-probabilities, and trigger retrieval augmentation only when
  the score exceeds a per-subtask threshold calibrated from past correct
  responses.
description: >-
  Intercept each agent-to-agent handoff, score the response's uncertainty
  from token log-probabilities, and trigger retrieval augmentation only when
  the score exceeds a per-subtask threshold calibrated from past correct
  responses. Filed by the drafting stage from UA-ChatDev: Uncertainty-Aware
  Multi-Agent Collaboration for Reliable Software Development (2607.02186)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Ablation against the same pipeline without the uncertainty module on SRDD:
  overall quality 0.578 to 0.649 (Qwen 2.5) and 0.557 to 0.596 (Gemma 2),
  executability 0.779 to 0.859 and 0.794 to 0.840; also compared to
  GPT-Engineer, MetaGPT and ChatDev baselines (ChatDev Q 0.395), with
  duration and token cost reported separately.. Nobody has vouched for it;
  add support or contest it on this page.
