id: align-vla-diffusion-features-online-jointly-trained-lam
ref: TEC-0242
label: "Align VLA diffusion features with an online, jointly trained"
summary: >-
  Adds a cosine-similarity loss between the VLA diffusion transformer's deep
  intermediate features and the latent action model's pre-quantization
  latent, and backpropagates into both models instead of freezing the LAM.
description: >-
  Adds a cosine-similarity loss between the VLA diffusion transformer's deep
  intermediate features and the latent action model's pre-quantization
  latent, and backpropagates into both models instead of freezing the LAM.
  Filed by the drafting stage from LARA: Latent Action Representation
  Alignment for Vision-Language-Action Models (2606.07100) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Manipulation
  success rate on LIBERO, SIMPLER-ENV, GR1-Sim-24(30) and a 50-demo real
  Unitree G1 benchmark: ~10% average gain over a DiT-only baseline
  pretrained on the same OXE data, ~5% as post-training on GR00T-N1.6 and
  pi0.5, and 42.8 to 49.5 average SIMPLER success when the refined LAM's
  tokens replace a vanilla LAM's as Moto-GPT pseudo-labels; an ablation on
  LIBERO-Long compares joint optimization against a frozen LAM at the same
  alignment depth.. Nobody has vouched for it; add support or contest it on
  this page.
