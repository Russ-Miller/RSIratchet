description: >-
  Profiles each attention head by how much its 2D visual attention map's
  spatial covariance structure changes between adjacent decoding steps, then
  adds a scaled bonus to the pre-softmax visual attention scores of the
  low-similarity 'dynamic' Filed by the drafting stage from ACT Now:
  Preempting LVLM Hallucinations via Adaptive Context Integration
  (2604.00983) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: POPE accuracy 85.2 to 88.0, MME hallucination total 638.3
  to 668.3, CHAIR_S 51.4 to 33.0 and CHAIR_I 15.2 to 9.3 on LLaVA-1.5-7B,
  with gains on five more backbones; ablated against uniform ('Global') head
  amplification, which cut MME from 638.3 to 630.0, and against four
  alternative head-profiling metrics and a guidance-shift sweep toward
  static heads.. Nobody has vouched for it; add support or contest it on
  this page.
