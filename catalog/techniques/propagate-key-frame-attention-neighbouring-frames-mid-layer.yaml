id: propagate-key-frame-attention-neighbouring-frames-mid-layer
ref: TEC-0640
label: "Propagate key-frame attention to neighbouring frames mid-lay"
summary: >-
  At intermediate decoder layers, rank frames by attention, then
  Gaussian-weight and boost the visual tokens of frames adjacent to the
  top-k key frames before the MLP, blending with the original hidden state.
description: >-
  At intermediate decoder layers, rank frames by attention, then
  Gaussian-weight and boost the visual tokens of frames adjacent to the
  top-k key frames before the MLP, blending with the original hidden state.
  Filed by the drafting stage from VERHallu: Evaluating and Mitigating Event
  Relation Hallucination in Video Large Language Models (2601.10010) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  on VERHallu relation classification, QA and counterfactual QA against the
  unmodified model and a Visual Contrastive Decoding baseline; LLaVA-NeXT-7B
  gained broadly (RC-subevent 16.7 to 55.8, SRH 6.5 to 17.9) while
  QwenVL-2.5-7B gained on QA-subevent (40.7 to 45.3) and lost on CFQA (50.6
  to 44.6); layer sweep showed the trade-off concentrated in layers 10-15;
  inference speed roughly unchanged.. Nobody has vouched for it; add support
  or contest it on this page.
