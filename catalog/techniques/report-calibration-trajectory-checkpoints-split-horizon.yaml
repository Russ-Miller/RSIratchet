id: report-calibration-trajectory-checkpoints-split-horizon
ref: TEC-0283
label: "Report calibration at trajectory checkpoints, split by horiz"
summary: >-
  Score a reliability estimate against the independently observed task
  outcome at each checkpoint index along a trajectory, reported separately
  per horizon with group sizes, instead of pooling all checkpoints or
  scoring only the final answer.
description: >-
  Score a reliability estimate against the independently observed task
  outcome at each checkpoint index along a trajectory, reported separately
  per horizon with group sizes, instead of pooling all checkpoints or
  scoring only the final answer. Filed by the drafting stage from
  Uncertainty Quantification for LLM Agents: A Taxonomy, an Evaluation
  Protocol, and an Empirical Study (2609.07395) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Computed (TC-ECE) on real agent
  traces from four models across three tasks up to a 50-step budget; pooling
  checkpoints hid overconfidence that was visible only at late horizons, and
  the agent's own stated confidence did not consistently beat a step-index
  baseline. No comparison against an alternative trajectory-calibration
  metric.. Nobody has vouched for it; add support or contest it on this
  page.
