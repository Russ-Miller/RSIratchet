id: monitor-each-reasoning-step-against-explicit-error-taxonomy
ref: TEC-0573
label: "Monitor each reasoning step against an explicit error taxono"
summary: >-
  An external LLM runs in parallel with the target model, inspecting each
  newly emitted reasoning step against a nine-subtype error taxonomy
  embedded in its prompt and interrupting generation when a step is flagged
  unsafe.
description: >-
  An external LLM runs in parallel with the target model, inspecting each
  newly emitted reasoning step against a nine-subtype error taxonomy
  embedded in its prompt and interrupting generation when a step is flagged
  unsafe. Filed by the drafting stage from Beyond Content Safety: Real-Time
  Monitoring for Reasoning Vulnerabilities in Large Language Models
  (2603.25412) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Position accuracy of the first erroneous step on 450
  annotated chains (87.11% best backend vs 68% for Qwen2.5-Math-PRM-7B and
  36.22% for an LLM-as-critic hallucination detector), 1.04% false-positive
  rate on 193 clean chains, plus attack-success and token-amplification
  reductions under four live attacks.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [multi-step-reasoning]
kind: process
