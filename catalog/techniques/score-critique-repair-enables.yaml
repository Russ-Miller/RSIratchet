id: score-critique-repair-enables
ref: TEC-0066
label: "Score a critique by the repair it enables"
summary: >-
  Instead of rating a critique's text, hand it to a fixed repair agent and
  measure the improvement of the artefact after repair, so a critique is
  judged by what a reader can do with it.
description: >-
  Instead of rating a critique's text, hand it to a fixed repair agent and
  measure the improvement of the artefact after repair, so a critique is
  judged by what a reader can do with it. Filed by the drafting stage from
  UXBench: Measuring the Actionability of LLM-Generated UX Critiques
  (2606.16262) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Repair-lift scores over seven rubric dimensions for eight
  models on ten fixture families, cross-checked by blind human validation;
  single domain (web UX).. Nobody has vouched for it; add support or contest
  it on this page.
