id: mask-erroneous-peer-memories-between-debate-rounds
ref: TEC-0719
label: "Mask erroneous peer memories between debate rounds"
summary: >-
  Before each debate round after the first, each agent evaluates the
  previous round's peer responses and zeroes out the ones judged wrong (or
  keeps only the lowest-perplexity one), so the next round conditions only
  on retained memories.
description: >-
  Before each debate round after the first, each agent evaluates the
  previous round's peer responses and zeroes out the ones judged wrong (or
  keeps only the lowest-perplexity one), so the next round conditions only
  on retained memories. Filed by the drafting stage from Multi-Agent Debate
  with Memory Masking (2603.20215) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy with standard deviation over
  five seeds on AIME24/25, MMLU-Pro, MATH, GSM8K against CoT, CoT-SC, plain
  MAD and Sparse MAD, with token consumption reported relative to MAD..
  Nobody has vouched for it; add support or contest it on this page.
