id: penalize-tokens-whose-pooled-visual-rank-falls-below
ref: TEC-0153
label: "Penalize tokens whose pooled visual rank falls below their o"
summary: >-
  At decoding time, pool each candidate token's reciprocal vocabulary rank
  across all visual-token positions (cached once during prefill) and apply a
  bounded logit penalty only when that pooled evidence falls below a
  token-specific reference
description: >-
  At decoding time, pool each candidate token's reciprocal vocabulary rank
  across all visual-token positions (cached once during prefill) and apply a
  bounded logit penalty only when that pooled evidence falls below a
  token-specific reference Filed by the drafting stage from ReWEIGH the
  Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate
  Hallucinations in Large Vision-Language Models (2608.19075) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_I
  object-hallucination reduced by up to 21.3% on four 7B backbones with
  descriptive and general multimodal scores largely preserved or improved;
  reductions extend to 11 models across six families up to 32B; added
  latency 1.33% per token. Calibration validated out-of-sample:
  token-specific medians fit on 500 COCO images cut held-out calibration
  error 92% (LLaVA-1.5-7B) and 91% (Qwen2.5-VL-7B) versus a single global
  reference, and beat all 1,000 random token-to-reference reassignments.
  Rank-derived suppression strengths were exactly unchanged under
  position-scale permutation, while probability-derived ones shifted by
  0.045-0.046.. Nobody has vouched for it; add support or contest it on this
  page.
