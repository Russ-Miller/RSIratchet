description: >-
  Instead of concatenating retrieved preferences, generate candidate intents
  under each memory-use mode, have the model compare the observed query
  against an idealized query it would expect under each intent, and combine
  that ranking with an Filed by the drafting stage from How Does
  Personalized Memory Shape LLM Behavior? Benchmarking Rational Preference
  Utilization in Personalized Assistants (2601.16621) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Intent-match macro/micro
  accuracy and an LLM-judge error-severity score on RPEval versus Vanilla,
  Reminder, CoT, CoT-SC and Self-Refine baselines (macro 0.240 vs 0.067 best
  baseline, severity 2.49 vs 3.49), plus resolution of ~80% of logged bad
  cases from a deployed commercial assistant (macro 0.734 vs 0.482).. Nobody
  has vouched for it; add support or contest it on this page.
