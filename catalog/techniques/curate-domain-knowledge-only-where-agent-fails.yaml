id: curate-domain-knowledge-only-where-agent-fails
ref: TEC-0633
label: "Curate domain knowledge only where the agent fails"
summary: >-
  Give the agent a real unsolved enterprise problem, have it emit a
  checklist of missing domain facts, have a human answer only those,
  structure the answers as typed version-controlled entities, and re-run
  until the human accepts.
description: >-
  Give the agent a real unsolved enterprise problem, have it emit a
  checklist of missing domain facts, have a human answer only those,
  structure the answers as typed version-controlled entities, and re-run
  until the human accepts. Filed by the drafting stage from Demand-Driven
  Context: A Methodology for Building Enterprise Knowledge Bases Through
  Agent Failure (2603.14057) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Not measured against any baseline: the paper
  reports 46 entities over nine cycles, new entities falling from 8 to 2,
  reuse ratio rising 0.0 to 0.75, and correction loops absent in the last
  three cycles, all on a synthetic domain with authors as both curator and
  judge.. Nobody has vouched for it; add support or contest it on this page.
