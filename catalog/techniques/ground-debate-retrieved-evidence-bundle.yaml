description: >-
  Run a retrieval pipeline (chunking, MITRE enrichment, sandboxed grep/jq
  search, similarity-filtered snippet mining) first, then have two models
  debate over that fixed evidence bundle with a verifier that rejects claims
  not matched to a snip Filed by the drafting stage from Small, Free, and
  Effective: Orchestrating Open-Weight Small Language Models to Outperform
  Single LLM for Malware Analysis (2607.20216) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Component ablation on the
  609-question benchmark: full hybrid 35.30% overall (Easy 38.14, Hard
  27.27); removing evidence collection drops Easy to 25.50; removing debate
  drops Hard to 20.00; removing the grounding constraint costs ~1.5 points
  overall; baselines include the best solo SLM (16.58%) and ungrounded
  Gemini 3 Pro (34.77%), with grounded Gemini still higher at 38.22%..
  Nobody has vouched for it; add support or contest it on this page.
