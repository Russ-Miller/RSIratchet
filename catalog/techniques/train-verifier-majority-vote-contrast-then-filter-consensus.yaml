description: >-
  One model alternates generator and verifier roles in multi-turn RL:
  majority voting supplies balanced positive/negative verification targets
  to train the verifier, and the improving verifier filters self-consistent
  errors out of the pseudo- Filed by the drafting stage from CoVerRL:
  Breaking the Consensus Trap in Label-Free Reasoning via Generator-Verifier
  Co-Evolution (2603.17775) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Self-verification accuracy on
  MATH500/AMC/AIME24/GPQA (e.g. Qwen2.5-7B 54.0 to 86.5 on MATH500),
  RewardBench scores against untrained base models and larger models, and
  downstream accuracy vs TTRL (+4.7 to +5.9 average); ablations remove
  filtering, verifier updates, self-correction and answer-anchored
  grouping.. Nobody has vouched for it; add support or contest it on this
  page.
