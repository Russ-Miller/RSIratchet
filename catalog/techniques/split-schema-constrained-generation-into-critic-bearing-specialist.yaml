description: >-
  Decompose an ontology into domains and assign each to an agent with a
  stated professional concern (mechanics, theme, components, a balance
  critic that hunts exploits, an experience judge), running generation
  sequentially and critique before Filed by the drafting stage from
  Generative Ontology: When Structured Knowledge Learns to Create
  (2602.05636) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation over 4 conditions x 10 prompts x 3 replications:
  consistency errors fell 5.03 to 0.10 with schema alone (d=4.78), to 0 with
  ontology; creative scores moved only from the single-agent ontology
  condition to the full pipeline (fun d=1.12, strategic depth d=1.59,
  elegance d=1.14), at ~8.5x token cost. Replayability and social
  interaction did not separate any conditions, and the evaluator's ICC for
  replayability was only 0.578.. Nobody has vouched for it; add support or
  contest it on this page.
