id: rank-reward-models-their-maximum-disagreement-pairs
ref: TEC-0755
label: "Rank reward models on their maximum-disagreement pairs"
summary: >-
  For every pair of reward models, pick the prompt-response pairs where
  their normalized preference gaps differ most, have an oracle judge
  adjudicate only those, and aggregate the outcomes with a Bradley-Terry
  model into a global ranking.
description: >-
  For every pair of reward models, pick the prompt-response pairs where
  their normalized preference gaps differ most, have an oracle judge
  adjudicate only those, and aggregate the outcomes with a Bradley-Terry
  model into a global ranking. Filed by the drafting stage from Evaluating
  Reward Model Generalization via Pairwise Maximum Discrepancy Competitions
  (2601.16987) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Produced a global BT ranking and oracle-agreement rates
  over 450 selected pairs; ranking stable across five random seeds and
  across k from 5 to 100 (Spearman above 0.95), while randomly sampled pairs
  gave unstable rankings; three LLM judges agreed 94.5-96% with each other
  and 92.5-94.5% with a three-researcher human majority vote. No measurement
  of whether the new ranking better predicts downstream alignment outcomes..
  Nobody has vouched for it; add support or contest it on this page.
