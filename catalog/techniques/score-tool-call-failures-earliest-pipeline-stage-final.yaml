description: >-
  Deterministically backtracks an observed tool-call failure label through a
  fixed stage order (tool selection, schema grounding, argument binding,
  output/runtime handling) to attribute it to the earliest source stage and
  flag cascades and bo Filed by the drafting stage from ToolRobustBench:
  Stage-Wise Perturbation Evaluation and Failure Diagnosis for Tool-Calling
  Agents (2608.23635) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Counterfactual repair at the attributed stage recovered
  71/98 failed instances (100% for single-fault, 82.1% for cascades, 0% for
  multi-fault); human audit on 30 ambiguous cases agreed 74.2%; and the
  labels predicted which fix worked — alias clarification for interface
  failures lifted gpt-5.4-mini from 21/30 to 30/30, while argument-binding
  chain-of-thought for intent failures changed nothing (21/30 both).. Nobody
  has vouched for it; add support or contest it on this page.
