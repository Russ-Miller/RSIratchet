description: >-
  Lift the VLM's panoramic response map to a directional log-likelihood on
  the sphere, store the running log-posterior as spherical-harmonic
  coefficients, propagate it under agent rotation with Wigner-D matrices,
  and decode the direction from Filed by the drafting stage from EAGOR:
  Embodied Reasoning in Omni-direction (2607.06165) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Against three ERP-space
  baselines (Centroid, Centroid-Circ, Grid) with the same backbone: map-free
  navigation success 94% vs 82/62/82, steps 50.2 vs 61.0/77.8/63.6, mean
  angular error 33.8 vs 45.9/46.5/54.2 degrees, temporal inconsistency 2.6
  vs 7.3-19.2 degrees/step; on HOS and OSR-Bench, adding it raised accuracy
  for every backbone (Qwen2.5-VL-7B 27.24 to 40.10 on HOS, 16.8 to 25.2 on
  OSR-Bench).. Nobody has vouched for it; add support or contest it on this
  page.
