description: >-
  Builds a directed attention graph over image patches, query tokens and
  generated tokens from a single forward pass of a frozen LVLM and
  classifies each response token with alternating GNN, ViT and GRU blocks,
  with a streaming variant that r Filed by the drafting stage from UniProbe:
  A Learnable Token-Level Hallucination Detector for Large VLMs using
  Multi-Structural Internal Representations (2608.10835) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Token-level F1 on
  MHALO (63.2 F1_M / 52.9 F1_IoU on GLM-4V vs 59.1/49.8 for HaloDet, which
  fine-tunes all backbone weights) and HalLoc across three backbones; POPE
  object-hallucination F1 41.0 to 63.1 and AUC 75 to 90; streaming guardrail
  cut CHAIR_i/CHAIR_s from 18.0/37.2 to 8.2/16.6 at 1.06x latency with SPICE
  and word count preserved. Ablations: flat MLP and Transformer probes trail
  by over 30 F1_M; removing the graph costs 10.1, removing the response GRU
  4.6.. Nobody has vouched for it; add support or contest it on this page.
