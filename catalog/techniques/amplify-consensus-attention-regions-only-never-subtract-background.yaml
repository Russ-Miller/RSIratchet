description: >-
  At decoding time, add a spatially budgeted, median-consensus-weighted term
  to pre-softmax visual attention logits for heads that deviate from the
  inter-head median, relying on softmax competition rather than explicit
  background penalties to Filed by the drafting stage from Mitigating Object
  Hallucinations in Vision-Language Models through Region-Aware Attention
  Recalibration (2605.24957) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: CHAIR on 500 MSCOCO images with LLaVA-1.5-7B:
  additive-only gave C_S 20.4 / C_I 4.9 / F1 76.4 vs greedy 53.0 / 15.6 /
  76.7; add-subtract variants gave C_S 31.6, 36.2, 41.4 at beta 0.5, 1.0,
  2.0 with F1 rising to 78.4.. Nobody has vouched for it; add support or
  contest it on this page.
