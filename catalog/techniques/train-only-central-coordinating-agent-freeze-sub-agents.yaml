id: train-only-central-coordinating-agent-freeze-sub-agents
ref: TEC-0367
label: "Train only the central coordinating agent, freeze sub-agents"
summary: >-
  Treats sub-agents as part of the environment and applies RL gradients only
  to the central agent's policy, with trajectories reconstructed from
  captured per-session interface call records.
description: >-
  Treats sub-agents as part of the environment and applies RL gradients only
  to the central agent's policy, with trajectories reconstructed from
  captured per-session interface call records. Filed by the drafting stage
  from Harness-RL: Black-Box Reinforcement Learning with Action-Args
  Decoupling for Central-Agent Multi-Agent Harnesses (2608.29641) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Token-level F1 and accuracy across seven multi-hop QA benchmarks with
  Qwen2.5-3B, central-only vs all-agent joint training under the same
  optimization scheme.. Nobody has vouched for it; add support or contest it
  on this page.
