id: induce-contrast-model-penalizing-correct-tokens
ref: TEC-0682
label: "Induce the contrast model by penalizing correct tokens"
summary: >-
  Train the negative model on factual data with a reversed loss term on the
  factual-answer token positions (plus an attention mask that blocks those
  positions from influencing later tokens), then subtract its logits from
  the positive model's
description: >-
  Train the negative model on factual data with a reversed loss term on the
  factual-answer token positions (plus an attention mask that blocks those
  positions from influencing later tokens), then subtract its logits from
  the positive model's Filed by the drafting stage from DHI: Leveraging
  Diverse Hallucination Induction for Enhanced Contrastive Factuality
  Control in Large Language Models (2601.01156) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: TruthfulQA MC1/MC2/MC3
  (41.9/72.6/45.0, avg 53.2) vs ICD on the same model pair (40.5/69.7/41.3,
  avg 50.5) and greedy 7B-Chat (avg 40.1); FactScore 68.1 vs ICD 66.3;
  component ablations each cost 0.7-1.8 average points, and an
  induction-strength sweep shows an inverted-U peaking at alpha=0.05..
  Nobody has vouched for it; add support or contest it on this page.
