id: resample-correct-continuations-truncated-failed-traces
ref: TEC-0330
label: "Resample correct continuations from truncated failed traces"
summary: >-
  Cut each failed reasoning trajectory at an intermediate step, resample
  continuations until one reaches the verified answer, and fine-tune only on
  the continuation tokens with the erroneous prefix held as masked context.
description: >-
  Cut each failed reasoning trajectory at an intermediate step, resample
  continuations until one reaches the verified answer, and fine-tune only on
  the continuation tokens with the erroneous prefix held as masked context.
  Filed by the drafting stage from Reflective Recovery: A Self-Supervised
  Method for Reasoning by Learning from Mistakes (2609.19156) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Pass@1 on AIME
  2024/2025, LiveCodeBench, GPQA, OlympiadBench, Minerva against RFT at
  equal trajectory count (e.g. 7B AIME 2025 37.5 vs 34.7 RFT vs 30.0 base;
  Minerva 47.8 vs 46.7); scaling curves 2k-10k showing RFT dropping 35.3 to
  30.0 on AIME 2025 while the method keeps rising.. Nobody has vouched for
  it; add support or contest it on this page.
