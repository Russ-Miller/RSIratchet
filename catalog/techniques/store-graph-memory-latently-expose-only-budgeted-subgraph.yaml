id: store-graph-memory-latently-expose-only-budgeted-subgraph
ref: TEC-0737
label: "Store the graph memory latently, expose only a budgeted subg"
summary: >-
  Build a capped entity-relation graph from streamed chunks, embed its
  edges, retrieve a top-k subgraph in latent space conditioned on the
  question, and serialize only that subgraph into a frozen reasoner's
  prompt.
description: >-
  Build a capped entity-relation graph from streamed chunks, embed its
  edges, retrieve a top-k subgraph in latent space conditioned on the
  question, and serialize only that subgraph into a frozen reasoner's
  prompt. Filed by the drafting stage from Implicit Graph, Explicit
  Retrieval: Towards Efficient and Interpretable Long-horizon Memory for
  Large Language Models (2601.03417) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Answer accuracy and ROUGE-L on 2,600
  held-out QA instances versus reasoner-only, RAG, and five memory systems;
  average accuracy 56.08/58.64/63.34% at 1.5B/3B/8B, best at every scale.
  Ablations remove retrieval, swap in BFS retrieval, or go fully explicit,
  all scoring lower. Inference time stays flat (12-14s) to 10k tokens..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [long-context-degradation]
kind: retrieval
sources: [arxiv-2601-03417]
