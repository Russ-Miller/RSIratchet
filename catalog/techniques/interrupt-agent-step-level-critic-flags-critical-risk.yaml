description: >-
  A lightweight generative reward model, trained on causal-chain-backtracked
  step labels from failed trajectories plus injected errors in successful
  ones, asynchronously diagnoses the agent's last completed step and forces
  regeneration of the Filed by the drafting stage from FLARE: A
  Full-Lifecycle Dense Supervision Paradigm for Long-Horizon Coding Agents
  via Generative Reward Model (2609.23808) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Fail-to-pass Pass@N on initially
  failed tasks and pass-to-pass Avg@N on initially successful tasks, against
  global resampling, blind breakpoint rollout, and post-hoc RADAR-guided
  replay at matched branch budgets, with agent output tokens and turns
  reported; also ROC-AUC of the derived trajectory score and downstream
  SFT/RL pass rates.. Nobody has vouched for it; add support or contest it
  on this page.
