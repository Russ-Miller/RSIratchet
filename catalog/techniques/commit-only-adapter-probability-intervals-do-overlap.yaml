label: "Commit only when adapter probability intervals do not overla"
summary: >-
  Read an ensemble of LoRA adapters as a credal set, bound each candidate
  answer (token or meaning cluster) by its min and max probability across
  adapters plus unexplored decoding mass, and answer only when a single
  candidate is undominated.
description: >-
  Read an ensemble of LoRA adapters as a credal set, bound each candidate
  answer (token or meaning cluster) by its min and max probability across
  adapters plus unexplored decoding mass, and answer only when a single
  candidate is undominated. Filed by the drafting stage from Credal Large
  Language Models for Semantic Commitment under Uncertainty (2608.23244)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  AUROC for detecting own errors and corrupted inputs, accuracy at 80%
  coverage, ECE/NLL, commit rate and accuracy-when-committed, against
  single-model entropy, semantic entropy, Laplace/Bayesian-LoRA, and
  mean-pooled LoRA ensemble, on three backbones and five datasets.. Nobody
  has vouched for it; add support or contest it on this page.
