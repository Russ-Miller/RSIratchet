description: >-
  Read an ensemble of LoRA adapters as a credal set, bound each candidate
  answer's probability by its min and max over adapters, and answer only
  when one candidate's lower bound beats all others' upper bounds, otherwise
  return the surviving s Filed by the drafting stage from Credal Large
  Language Models for Semantic Commitment under Uncertainty (2608.23244)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  AUROC for detecting the model's own errors and corrupted inputs, accuracy
  at 80% coverage, ECE/NLL, gold-in-set rate, and commit rate on clean vs
  corrupted context, against standard LLM entropy, mean-pooled LoRA
  ensemble, Bayesian/Laplace-LoRA, and semantic entropy, on three backbones
  and five datasets.. Nobody has vouched for it; add support or contest it
  on this page.
