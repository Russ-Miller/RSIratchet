label: "Retrieve, judge sufficiency, then rewrite the query from fai"
summary: >-
  Turns memory retrieval into a loop: fine-grained top-K retrieval plus a
  neighbouring-chunk window expansion, a judge step that decides whether the
  accumulated evidence answers the question, and a query-rewriting step that
  decomposes or prun
description: >-
  Turns memory retrieval into a loop: fine-grained top-K retrieval plus a
  neighbouring-chunk window expansion, a judge step that decides whether the
  accumulated evidence answers the question, and a query-rewriting step that
  decomposes or prun Filed by the drafting stage from MemCoT: Test-Time
  Scaling through Memory-Driven Chain-of-Thought (2604.08216) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Answer F1 on
  LoCoMo (single-hop, multi-hop, open-domain, temporal) and LLM-as-a-Judge
  score on LongMemEval-S, against full-context, RAG, Mem0, MemoryOS,
  HippoRAG, A-Mem, CAM, CompassMem, Mnemis; overall 58.03 vs 52.18
  (CompassMem) on GPT-4o-mini, 52.01 vs 33.79 on Qwen2.5-7B, 88.0 vs 87.2 on
  LongMemEval-S. Ablation: removing the zoom-out window costs 4.1 F1
  overall.. Nobody has vouched for it; add support or contest it on this
  page.
