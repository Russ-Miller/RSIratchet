id: diagnose-tool-call-failures-pipeline-stage-cascade-backtracking
ref: TEC-0116
label: "Diagnose tool-call failures by pipeline stage with cascade b"
summary: >-
  Perturb one pipeline stage at a time and score the earliest failed stage,
  backtracking downstream symptoms to their upstream source instead of
  recording only the final error label.
description: >-
  Perturb one pipeline stage at a time and score the earliest failed stage,
  backtracking downstream symptoms to their upstream source instead of
  recording only the final error label. Filed by the drafting stage from
  ToolRobustBench: Stage-Wise Perturbation Evaluation and Failure Diagnosis
  for Tool-Calling Agents (2608.23635) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Counterfactual repair at the
  attributed stage recovered 71/98 failed instances; human audit on 30
  ambiguous cases agreed 74.2%; labels predicted that S1 alias clarification
  fixed A-family failures (21/30 to 30/30) while S3 chain-of-thought did not
  help B-family (21/30 unchanged).. Nobody has vouched for it; add support
  or contest it on this page.
