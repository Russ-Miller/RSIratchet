id: distill-external-grounding-checks-into-hidden-state-probe
ref: TEC-0642
label: "Distill external grounding checks into a hidden-state probe"
summary: >-
  Label generated answers offline with substring match, embedding similarity
  and an LLM judge, then train a small classifier on the generator's
  per-layer hidden states so that at inference only the probe and the
  activations are needed.
description: >-
  Label generated answers offline with substring match, embedding similarity
  and an LLM judge, then train a small classifier on the generator's
  per-layer hidden states so that at inference only the probe and the
  activations are needed. Filed by the drafting stage from Weakly Supervised
  Distillation of Hallucination Signals into Transformer Representations
  (2604.06277) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: 5-fold CV plus a separate 5,000-row held-out test set:
  best probe AUC 0.8577, F1 0.6644, ECE 0.1025, against output-level
  cosine/token-F1 similarity baselines at AUC 0.41-0.42; probe latency
  0.15-6.7 ms against ~4.33 s generation.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [hallucination]
kind: training
