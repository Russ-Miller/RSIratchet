id: report-per-family-spread-aggregate-agent-score
ref: TEC-0166
label: "Report per-family spread, not an aggregate agent score"
summary: >-
  Split an agent benchmark into skill-isolated families with
  verifier-computed gold (canonical SQL, exact DAG schedule, closed-form
  lambda) and report per-family accuracy plus token cost from one
  instrumented run instead of a blended score.
description: >-
  Split an agent benchmark into skill-isolated families with
  verifier-computed gold (canonical SQL, exact DAG schedule, closed-form
  lambda) and report per-family accuracy plus token cost from one
  instrumented run instead of a blended score. Filed by the drafting stage
  from BekchiAI: Measuring, Observing, and Controlling LLM Agents in One
  Click (2608.26867) with status proposed: the paper introduces or tests it,
  and the claim drafted from the paper is its first evidence. The paper
  validated it by: Four models scored on 13 families; overall scores
  0.88/0.86/0.82/0.71 while gpt-oss-120b led ug_fetch (0.78) and ug_imposter
  (0.89) yet scored 0.24 on sql_analytics and 0.25 on tool_error_recovery.
  No human validation of the families' construct validity.. Nobody has
  vouched for it; add support or contest it on this page.
