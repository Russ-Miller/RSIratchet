id: refine-ensemble-forecast-prior-trained-small-llm
ref: TEC-0515
label: "Refine an ensemble forecast prior with a trained small LLM"
summary: >-
  A frozen LLM plans diagnostic tool calls guided by retrieved past tool-use
  trajectories, and a small LLM trained by SFT plus
  reward-for-improvement-over-prior rewrites the ensemble forecast into
  refined numbers.
description: >-
  A frozen LLM plans diagnostic tool calls guided by retrieved past tool-use
  trajectories, and a small LLM trained by SFT plus
  reward-for-improvement-over-prior rewrites the ensemble forecast into
  refined numbers. Filed by the drafting stage from CastFlow: Bridging
  Evidence Acquisition and Accurate Prediction in Agentic Time Series
  Forecasting (2604.27840) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: MSE/MAE against 21 baselines on ten benchmarks:
  lowest on nine datasets (18 of 20 dataset-metric cells), losing on PJM;
  ablations show removing the anchorer (prior) gives the largest error rise
  of any tool category (WP MSE 1720 to 2718) and removing either training
  stage raises error.. Nobody has vouched for it; add support or contest it
  on this page.
