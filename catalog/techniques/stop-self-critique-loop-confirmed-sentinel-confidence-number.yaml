id: stop-self-critique-loop-confirmed-sentinel-confidence-number
ref: TEC-0213
label: "Stop the self-critique loop on a CONFIRMED sentinel, not a c"
summary: >-
  Run generate-critique-revise to a bounded depth but halt as soon as the
  critique emits a categorical CONFIRMED token, instead of halting on a
  self-reported numeric confidence threshold.
description: >-
  Run generate-critique-revise to a bounded depth but halt as soon as the
  critique emits a categorical CONFIRMED token, instead of halting on a
  self-reported numeric confidence threshold. Filed by the drafting stage
  from Training-Free Inference-Time Self-Reflection and Cost-Bounded Early
  Stopping for Large Language Models (2608.18884) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On BBH n=500 the sentinel's
  first-step decisions were correct in 78% of cases (16% false confirmations
  of wrong answers); it stopped 82-88% of items at ~2.1 generations with no
  accuracy loss, cutting depth-3 worst-case tokens by ~60%. By contrast
  every numeric threshold from 0.6 to 0.9 fired on the first generation for
  100% of items, so the numeric tag gave no selective stopping point..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
