id: stop-self-critique-loop-confirmed-sentinel-confidence-number
ref: TEC-0210
label: "Stop a self-critique loop on a CONFIRMED sentinel, not a con"
summary: >-
  Run generate-critique-revise to a bounded depth but exit as soon as the
  critique emits a fixed CONFIRMED token, instead of exiting on the model's
  self-reported numeric confidence.
description: >-
  Run generate-critique-revise to a bounded depth but exit as soon as the
  critique emits a fixed CONFIRMED token, instead of exiting on the model's
  self-reported numeric confidence. Filed by the drafting stage from
  Training-Free Inference-Time Self-Reflection and Cost-Bounded Early
  Stopping for Large Language Models (2608.18884) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On BBH the sentinel stopped
  82-88% of items at accuracy inside the single-shot Wilson interval with
  ~2.1 generations per question, versus fixed-depth Self-Refine at 3
  generations and 71.2% accuracy; every numeric confidence threshold at or
  above 0.6 fired on the first generation, collapsing the loop to
  single-shot.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
