description: >-
  Construct a per-mission manager tree in which horizontal managers hand out
  concurrent assignments to their children and vertical managers decompose
  the mission into ordered phases and advance only when completion
  conditions are met, with re Filed by the drafting stage from ORCH:
  Organizational Principles Enable Collective Intelligence in Embodied AI
  (2609.11737) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Against four prior embodied multi-agent frameworks
  (CAMON, COELA, HMAS-2, Embodied) on 25 missions x 8 LLMs x 5 seeds:
  human-designed hierarchies improved final score 63.97% and execution
  efficiency (AUC of progress) 74.29% on average, LLM-generated ones 43.63%
  and 52.53%; first-place rank frequency 32.6% vs 5.8-16.2% for baselines;
  Type-II ANOVA showed a significant algorithm main effect and no
  significant algorithm-by-LLM interaction; success rates 35.2-53.1% vs
  6.9-13.5%.. Nobody has vouched for it; add support or contest it on this
  page.
