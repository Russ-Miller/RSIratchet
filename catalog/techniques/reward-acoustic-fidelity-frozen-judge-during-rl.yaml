id: reward-acoustic-fidelity-frozen-judge-during-rl
ref: TEC-0093
label: "Reward acoustic fidelity with a frozen judge during RL"
summary: >-
  Augments the text-space -WER GRPO reward with a group-normalized score
  from a permanently frozen, non-autoregressive CTC model that measures how
  well each sampled transcription aligns to the audio, used at training time
  only.
description: >-
  Augments the text-space -WER GRPO reward with a group-normalized score
  from a permanently frozen, non-autoregressive CTC model that measures how
  well each sampled transcription aligns to the audio, used at training time
  only. Filed by the drafting stage from Grounded in Sound: Reinforcement
  Learning with a Frozen Acoustic Judge to Curb ASR Insertion Hallucinations
  (2609.14455) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Insertion counts and WER on 33,282 utterance-condition
  instances over six difficulty tiers against a schedule-matched mu=0
  WER-GRPO baseline sharing identical data and schedule; meeting-level
  clustered bootstrap CIs, three seeds, leave-one-meeting-out, plus
  counterfactual probes on unintelligible audio, a 32-best CTC rescoring
  comparison, and insertion-AURC under policy-only confidence.. Nobody has
  vouched for it; add support or contest it on this page.
