description: >-
  Build a simple document graph (article, section, paragraph, chunk with
  link/next/previous edges) and give the agent fixed, handwritten
  Cypher-backed tools for discovery, structural navigation and relational
  lookup instead of letting it writ Filed by the drafting stage from
  Reducing Hallucinations in Complex Question Answering using Simple
  Graph-based Retrieval-Augmented Generation (long version) (2606.05901)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Median over three runs on 510 MoNaCo questions vs vector-RAG and zero-shot
  baselines: factual-correctness precision 0.36 vs 0.15 vs 0.43, recall 0.33
  vs 0.13 vs 0.39, answer relevancy 0.61 vs 0.35 vs 0.80, fine-grained
  truthfulness 63 vs 35 vs 40.5; fully correct 142 vs 58 vs 174 answers,
  wrong-answer counts 191 vs 84 vs 301; total tokens 45,695 vs 41,694. No
  per-tool ablation.. Nobody has vouched for it; add support or contest it
  on this page.
