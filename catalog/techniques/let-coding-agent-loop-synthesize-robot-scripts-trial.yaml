label: "Let a coding-agent loop synthesize robot scripts by trial an"
summary: >-
  Hand an off-the-shelf software-engineering agent framework the simulator
  API and a task instruction, and let its existing reason-act-observe loop
  write, run and revise Python control scripts until the environment's own
  success check passes.
description: >-
  Hand an off-the-shelf software-engineering agent framework the simulator
  API and a task instruction, and let its existing reason-act-observe loop
  write, run and revise Python control scripts until the environment's own
  success check passes. Filed by the drafting stage from Demonstration-Free
  Robotic Control via LLM Agents (2601.20334) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Success rate over 120 LIBERO
  tasks, 14 ManiSkill3 tasks x 5 seeds, and 50 MetaWorld tasks, against
  published VLA baselines trained with ~100 demonstrations (SmolVLA, pi0,
  OpenVLA, Diffusion Policy); traces post-hoc screened by an automated
  reviewer for hardcoded coordinates or brute-force search, with two
  MetaWorld successes excluded.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [embodied-control]
