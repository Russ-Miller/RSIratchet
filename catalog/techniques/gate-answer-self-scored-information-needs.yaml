id: gate-answer-self-scored-information-needs
ref: TEC-0115
label: "Gate the answer on self-scored information needs"
summary: >-
  Before answering, the model enumerates the information units the question
  requires, assigns each a confidence score, and commits to an answer only
  if the aggregate score passes a fixed threshold, otherwise abstaining.
description: >-
  Before answering, the model enumerates the information units the question
  requires, assigns each a confidence score, and commits to an answer only
  if the aggregate score passes a fixed threshold, otherwise abstaining.
  Filed by the drafting stage from When Should LLMs Abstain?
  Chain-of-Self-Questioning for Selective Risk Control (2609.17516) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Compared
  against forced-choice Direct and chain-of-thought baselines on 817
  balanced-option TruthfulQA-MC items across 11 models: wrong-commitment
  rate fell from 13.1% to 8.9% and answered accuracy rose from 86.9% to
  89.7% at 87.6% coverage, with 11/11 models improving on both axes (paired
  one-sided Wilcoxon p=0.00049); an abstention audit paired each abstention
  with the CoT outcome, and a 300-item NQ short-answer run with 5 models
  showed the same direction.. Nobody has vouched for it; add support or
  contest it on this page.
