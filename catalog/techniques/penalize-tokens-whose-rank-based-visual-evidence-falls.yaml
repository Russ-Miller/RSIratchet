id: penalize-tokens-whose-rank-based-visual-evidence-falls
ref: TEC-0155
label: "Penalize tokens whose rank-based visual evidence falls below"
summary: >-
  Project each visual-token hidden state through the output head, pool
  candidate tokens' vocabulary ranks across visual positions into a dense
  mean reciprocal rank cached at prefill, and apply a bounded logit penalty
  when a candidate falls be
description: >-
  Project each visual-token hidden state through the output head, pool
  candidate tokens' vocabulary ranks across visual positions into a dense
  mean reciprocal rank cached at prefill, and apply a bounded logit penalty
  when a candidate falls be Filed by the drafting stage from ReWEIGH the
  Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate
  Hallucinations in Large Vision-Language Models (2608.19075) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_I
  object-hallucination rate on four 7B backbones (up to 21.3% reduction)
  with descriptive and general multimodal scores reported as largely
  preserved or improved; extended to 11 models from six families up to 32B;
  1.33% average added per-token latency; ablations show rank-derived
  suppression strengths unchanged under position-wise rescaling while
  probability-derived ones shift, and token-specific medians cut held-out
  calibration error ~92% versus a global reference and beat all 1,000 random
  token-to-reference reassignments.. Nobody has vouched for it; add support
  or contest it on this page.
