id: train-language-id-through-linguistic-family-hierarchical-softmax
ref: TEC-0429
label: "Train language ID through a linguistic-family hierarchical s"
summary: >-
  Replace the flat 42-way softmax head with a root-family-subfamily-language
  tree where each internal node has its own linear classifier and the
  language score is the product of branch probabilities.
description: >-
  Replace the flat 42-way softmax head with a root-family-subfamily-language
  tree where each internal node has its own linear classifier and the
  language score is the product of branch probabilities. Filed by the
  drafting stage from A Comparative Study of Pre-trained Speech Encoders and
  Training Objectives for Large-Scale Indic Spoken Language Identification
  (2606.09317) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Macro accuracy on three benchmarks against CE and
  CE+SupCon baselines on the same encoders: Whisper 74.2/73.8/75.8 vs CE
  71.8/72.7/68.3; FastConformer 67.7/91.4/90.0 vs CE 67.6/89.9/87.4.. Nobody
  has vouched for it; add support or contest it on this page.
