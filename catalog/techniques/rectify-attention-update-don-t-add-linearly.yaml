description: >-
  During fine-tuning, the LoRA attention-score delta is passed through a
  saturating function that sharply separates irrelevant from relevant tokens
  while capping boosts to relevant ones, with the saturation scale ramped
  from zero over the fir Filed by the drafting stage from Tackling the
  Inherent Difficulty of Noise Filtering in RAG (2601.01896) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy
  (answer-contains-ground-truth; short-answer coverage for ASQA) on NQ,
  TriviaQA, HotpotQA, 2WikiMultiHopQA, ASQA with DPR-retrieved distractors,
  against vanilla prompting and plain LoRA at matched rank; mean across
  datasets 50.2 vanilla, 72.0 LoRA, 74.2 at xi=5. Ablations against xi*tanh
  alone, xi*tanh+x, and a sigmoid variant. Attention-gap analysis shows
  widened score margin on answer-bearing tokens.. Nobody has vouched for it;
  add support or contest it on this page.
