description: >-
  During fine-tuning, visual observations are perturbed with brightness,
  contrast, low-light and overexposure operators whose intensity rises
  across training stages, ending with mixed original/augmented inputs,
  instead of building an offline Filed by the drafting stage from
  BioProVLA-Agent: An Affordable, Protocol-Driven, Vision-Enhanced
  VLA-Enabled Embodied Multi-Agent System with Closed-Loop-Capable Reasoning
  for Biological Laboratory Manipulation (2605.07306) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Success rate over 3
  repeated runs per atomic task and completion rate over 20 trials per
  composite task, against ACT, X-VLA and unaugmented SmolVLA: placing a
  cryotube in the red rack rose 40.00% to 65.00% and a centrifuge tube in
  the orange rack 43.33% to 53.33%, while lid tasks moved little (e.g. open
  water bath lid 78.33% unchanged); composite completion rose on all six
  workflows (desktop tidying 62.5% to 72.5%).. Nobody has vouched for it;
  add support or contest it on this page.
