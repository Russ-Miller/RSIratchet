id: score-uncertainty-methods-correlation-between-score-change-hallucination
ref: TEC-0800
label: "Score uncertainty methods by correlation between score chang"
summary: >-
  Perturb an input in one modality, measure whether the uncertainty score
  rises (Uncertainty Reflection Rate) and whether that rise correlates with
  the answer flipping to a hallucination (point-biserial Hallucination
  Consistency Coefficient).
description: >-
  Perturb an input in one modality, measure whether the uncertainty score
  rises (Uncertainty Reflection Rate) and whether that rise correlates with
  the answer flipping to a hallucination (point-biserial Hallucination
  Consistency Coefficient). Filed by the drafting stage from VLM-UQBench: A
  Benchmark for Modality-Specific and Cross-Modality Uncertainties in Vision
  Language Models (2602.09214) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Applied to nine UQ methods across four VLMs on
  VizWiz, VQAv2 and CLEVR subsets; reported as heatmaps of HCC per method
  per perturbation, alongside AUROC/F1 on human-labelled modality subsets.
  Not validated against an external measure of UQ usefulness.. Nobody has
  vouched for it; add support or contest it on this page.
