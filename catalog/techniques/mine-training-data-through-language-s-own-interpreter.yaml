description: >-
  Generate candidate programs from natural-language instructions with a
  frontier LLM, keep only those that pass a deterministic-wording filter,
  compile and run in the target language's binary, produce non-trivial
  output, and pass an independe Filed by the drafting stage from LLM-Based
  FORM Code Generation with Verification-Driven Fine-Tuning (2609.23367)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  840 single-attempt tasks across four benchmarks: 97.7% exact output match
  on 664 deterministic tasks vs 75.5% for GLM-5.2 and 62.3% for DeepSeek-V4
  Flash (non-overlapping 95% CIs); 83.0% execution and 18.0% strict match on
  Instruct-100 vs 65.0%/5.6% best frontier (McNemar p<=0.007); no lead on
  the 41- and 22-task benchmarks (p>=0.375); MMLU -2.6pp, GSM8K -1.5pp,
  HumanEval -0.6pp.. Nobody has vouched for it; add support or contest it on
  this page.
