description: >-
  Relabel segments of a world-model policy's own on-policy rollouts with
  VLM-generated instructions, add a behaviour-cloning plus
  instruction-completion loss to the Dreamer objectives, and at inference
  let a frozen VLM planner emit sparse tex Filed by the drafting stage from
  Decoupling Planning and Control for Instructable Agents (2608.26788) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Official
  per-environment metrics on seven environments against controller-only,
  direct VLM action generation, a fine-tuned VLA (RT-2), DreamerV3, MAPPO
  and QMIX; ablation over instruction source (VLM-generated 11.1, template
  9.9, clustered 8.9, random strings 8.3, none 8.2, environment-derived 11.4
  on Minecraft Diamond); instruction-following accuracy 86-97% across
  planners.. Nobody has vouched for it; add support or contest it on this
  page.
