description: >-
  Score a mitigation on discriminative probing, open-ended description and
  per-attribute structured querying separately, with claims routed to
  layer-appropriate evidence and insufficiently-evidenced claims marked
  undetermined rather than coun Filed by the drafting stage from Music
  Hallucination in Audio-Language Models: A Hierarchical Formulation and
  Empirical Study (2609.20195) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Paired exact-prompt comparisons of ADD-M v1/v2 and
  TPA on four open-source models: probing accuracy gains of +1.0 to +4.7 pp
  coexisted with higher free-form hallucination rates for all four, and
  structured accuracy improving for only one; cross-paradigm rank
  correlations were weak (Disc.-Free rho 0.17, Free-Struct. rho 0.18)..
  Nobody has vouched for it; add support or contest it on this page.
