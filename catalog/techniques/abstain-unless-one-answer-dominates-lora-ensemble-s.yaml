description: >-
  Treat an ensemble of LoRA adapters as a credal set, bound each candidate
  answer's probability by the min and max over adapters (adding
  unwritten-completion mass to the upper bound), and answer only when one
  candidate's lower bound exceeds a Filed by the drafting stage from Credal
  Large Language Models for Semantic Commitment under Uncertainty
  (2608.23244) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: AUROC for detecting the model's own errors and corrupted
  inputs, accuracy at 80% coverage, ECE/NLL, commit rate and
  accuracy-when-committed, against standard LLM entropy/max-prob,
  mean-pooled LoRA ensemble, Bayesian/Laplace-LoRA, and semantic entropy on
  five datasets and three backbones.. Nobody has vouched for it; add support
  or contest it on this page.
