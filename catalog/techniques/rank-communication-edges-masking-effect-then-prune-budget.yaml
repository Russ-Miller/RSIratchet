  Efficient and Explainable Communication Topologies for LLM-based
  Multi-Agent Systems via Causal Inference (2608.12921) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy and
  measured online token usage versus each unpruned generator across 24
  generator-dataset cells: tokens fell in all 24 (10.6%-44.0%), accuracy
  rose in 16; ablations show removing the causal masking signal costs about
  4 accuracy points on MMLU and HumanEval and most of the token saving, and
  removing semantic entropy costs about 2-3 points.. Nobody has vouched for
  it; add support or contest it on this page.
