description: >-
  Splits requirement parsing, quantum-suitability analysis, blueprinting,
  encoding, code generation, review, execution and verification across
  separate agents, each with curated task knowledge, Qiskit coding
  conventions and executable tool fe Filed by the drafting stage from
  Leveraging LLM-Based Agentic Systems to Generate Quantum Applications for
  Test Optimization (2607.00939) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: pass@1 for compilation (1.000), execution and
  final combination (0.967) over 20 requirements x 3 runs, plus QUBO-value
  reduction ratio against a genetic-algorithm baseline (medians 57.6 TCS,
  89.1 TCM); ablations removing skill, knowledge, review and multi-agent
  decomposition all scored lower, with the skill ablation almost never
  compiling.. Nobody has vouched for it; add support or contest it on this
  page.
