description: >-
  Run CAE simulation tasks with an off-the-shelf coding-agent harness (file,
  shell, multi-turn, execution feedback) and no simulation-specific roles,
  retrieval pipeline or reflection prompt, while requiring the agent to read
  the relevant solv Filed by the drafting stage from What Do CAE Simulation
  Agents Really Need Beyond a Generic Harness? (2609.03718) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Task success under
  each benchmark's native criterion: FoamBench 96.4% (106/110) vs the
  specialized system's published 88.2%, MCP-SIM 100% vs 91.7%, ties
  elsewhere and 33.3% on FEABench; ablations on FoamBench show must-read
  tutorials 80.9% to 96.4%, repair budget 71.8% to 96.4%, and a
  scripted-reflection prompt changing nothing (96.4% both).. Nobody has
  vouched for it; add support or contest it on this page.
