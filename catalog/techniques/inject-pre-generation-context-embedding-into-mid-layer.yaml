id: inject-pre-generation-context-embedding-into-mid-layer
ref: TEC-0629
label: "Inject the pre-generation context embedding into mid-layer h"
summary: >-
  Extract the final-layer hidden state at the last prompt token before
  generation and blend it, with a fixed or commitment-mass-dependent weight,
  into each generated token's hidden state at a chosen mid decoder layer.
description: >-
  Extract the final-layer hidden state at the last prompt token before
  generation and blend it, with a fixed or commitment-mass-dependent weight,
  into each generated token's hidden state at a chosen mid decoder layer.
  Filed by the drafting stage from Context-Aware Decoding for Faithful
  Vision-Language Generation (2601.05939) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: CHAIR_s/CHAIR_i on 500 MSCOCO images,
  AMBER generative CHAIR/HAL/COVER, and GPT-4-judged MMHal-Bench
  Score/HalRate, against base decoding and five training-free baselines
  (OPERA, VCD, AvisC, M3ID, CAAC) across three LVLMs; dynamic variant lowest
  hallucination overall, static second.. Nobody has vouched for it; add
  support or contest it on this page.
