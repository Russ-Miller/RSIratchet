description: >-
  On a triggered review, restore environment and branch-local context to a
  coarse-to-fine-selected earlier checkpoint while updating a memory held
  outside checkpoints that stores objective, reusable environment knowledge,
  prior-attempt milest Filed by the drafting stage from Rollback the World,
  Keep the Reflection: Rollback-Induced Reflection for Long-Horizon LLM
  Agents (2609.18304) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rate on ALFWorld, ScienceWorld (plus dense
  reward) and GAIA against ReAct, Reflexion, LATS, Self-Refine and
  GA-Rollback under matched backbones and budgets: best average SR on both
  backbones (+3.09 points on Qwen3-14B, +6.57 on DeepSeek-V3), and ablations
  on ScienceWorld/DeepSeek-V3 where reflection-only scores 70.48 SR and
  rollback-only 69.37 versus 76.75 for the full method, with fewer than one
  executed rollback per task versus about 2.9 for GA-Rollback.. Nobody has
  vouched for it; add support or contest it on this page.
