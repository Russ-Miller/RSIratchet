id: inject-llm-test-snippets-into-search-stalls
ref: TEC-0040
label: "Inject LLM test snippets into search when it stalls"
summary: >-
  When the evolutionary test generator makes no fitness progress for a set
  number of generations, prompt an LLM at class level with self-refinement
  to write test cases, parse them into the search tool's internal
  representation, and merge them
description: >-
  When the evolutionary test generator makes no fitness progress for a set
  number of generations, prompt an LLM at class level with self-refinement
  to write test cases, parse them into the search tool's internal
  representation, and merge them Filed by the drafting stage from Enhancing
  Automated Unit Test Generation for NLP Libraries Using Large Language
  Models (2609.14784) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Median branch coverage 68.60% vs 58.03% for a Java
  reimplementation of CodaMOSA, 53.33% for EvoSuite and 32.64% for LLM-only;
  mutation score 63.0% vs 52.0/58.0/38.26; Wilcoxon p<<0.05 with A12
  0.72-0.85 on coverage, 0.57-0.64 on mutation; ablations on prompting
  strategy, context level, LLM choice and call count.. Nobody has vouched
  for it; add support or contest it on this page.
