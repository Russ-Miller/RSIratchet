summary: >-
  Segments recorded trajectories into page contexts, parameterized action
  templates, workflows and domain definitions, stored as indexed JSON the
  agent reads on demand during a task.
description: >-
  Segments recorded trajectories into page contexts, parameterized action
  templates, workflows and domain definitions, stored as indexed JSON the
  agent reads on demand during a task. Filed by the drafting stage from
  Environment Maps: Structured Environmental Representations for
  Long-Horizon Agents (2603.23610) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: WebArena Verified binary success on
  812 tasks: 28.2% with maps vs 23.3% with raw trace access vs 14.2% no
  prior knowledge, same agent stack and same default file tools;
  per-environment GitLab 8.3/11.7/22.8%, CMS 11.5/15.4/22.5%, Reddit
  13.2/58.5/60.4%, Map 32.1/34.9/34.9%; multi-site tasks 0/48 under both
  knowledge conditions.. Nobody has vouched for it; add support or contest
  it on this page.
