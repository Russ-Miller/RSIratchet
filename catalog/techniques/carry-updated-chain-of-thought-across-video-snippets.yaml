description: >-
  The model reasons over only the newest video snippet plus the
  chain-of-thought it wrote on the previous iteration, updating the recorded
  task decomposition and step-completion status each turn, and predicts
  progress from the share of comple Filed by the drafting stage from
  Recurrent Reasoning with Vision-Language Models for Estimating
  Long-Horizon Embodied Task Progress (2603.17312) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Progress MAE, increment MAE,
  bin accuracy and completion accuracy on held-out ALFRED (669 items) and
  Ego4D (529 items) benchmarks versus API models, open-source VLMs, LIV,
  ROVER and GVL-SFT; plus an ablation comparing an identically trained
  full-video-input variant on MAE and inference time binned by video
  duration.. Nobody has vouched for it; add support or contest it on this
  page.
