description: >-
  Generates supervision in which an actor model emits explicit
  THOUGHT/ACTION/OBSERVATION steps that are atomic knowledge-graph
  operations, with a mid-step symbolic verifier correcting any action that
  leaves the intended path, and fine-tunes Filed by the drafting stage from
  VIRAASAT: Traversing Novel Paths for Indian Cultural Reasoning
  (2602.18429) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Exact-match State/Answer/Full Match on a 643-item test
  split: Qwen2.5-7B Full Match 36.70% with CoT-SFT vs 57.54% with trace-SFT;
  3B 34.26% vs 50.70%; ablations on 1k train/100 test show removing the
  verifier drops Full Match 52->36 and stripping ACTION/OBSERVATION spans
  drops it 52->9; OOD multiple-choice on a SANSKRITI subset is unchanged or
  slightly better.. Nobody has vouched for it; add support or contest it on
  this page.
