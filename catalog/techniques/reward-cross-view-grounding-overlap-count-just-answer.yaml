ref: TEC-0626
label: "Reward cross-view grounding and overlap count, not just the "
summary: >-
  After CoT supervised fine-tuning, GRPO is run with a reward that adds IoU
  on bounding boxes cited in the reasoning trace and an exact-match term on
  the number of objects visible in more than one view, alongside
  final-answer correctness.
description: >-
  After CoT supervised fine-tuning, GRPO is run with a reward that adds IoU
  on bounding boxes cited in the reasoning trace and an exact-match term on
  the number of objects visible in more than one view, alongside
  final-answer correctness. Filed by the drafting stage from Ego to World:
  Collaborative Spatial Reasoning in Embodied Systems via Reinforcement
  Learning (2603.14811) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Measured on the paper's E2W benchmark against zero-shot
  proprietary and open models, SFT-only, and RL-from-scratch; leave-one-out
  ablation of each reward term (removing the grounding term costs over 21
  points on grasping, removing the overlap term costs ~4.5 on counting),
  plus Where2Place transfer (50.9 vs 46.8 RoboPoint) and a two-task
  real-robot trial (65% and 30% vs 0%).. Nobody has vouched for it; add
  support or contest it on this page.
