id: weight-llm-numerical-forecasts-backtest-error-covariance
ref: TEC-0547
label: "Weight LLM and numerical forecasts by backtest error covaria"
summary: >-
  Produces a numerical forecast anchor plus decoupled macro and micro LLM
  contextual trajectories, then merges them in closed form by Gaussian
  conjugacy using error covariances estimated on leakage-free rolling
  backtest folds.
description: >-
  Produces a numerical forecast anchor plus decoupled macro and micro LLM
  contextual trajectories, then merges them in closed form by Gaussian
  conjugacy using error covariances estimated on leakage-free rolling
  backtest folds. Filed by the drafting stage from Nexus : An Agentic
  Framework for Context-Aware Time Series Forecasting (2605.14389) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  MAE/RMSE/MAPE on Leaf (weather, electricity, equities, commodities),
  wNMAE/wNRMSE on GIFT-CTX, MASE on GIFT-Eval, against supervised deep
  models, LLM-reprogramming models, six zero-shot TSFMs and same-backbone
  benchmark prompting; component ablation shows no single stream dominates
  and removing calibration raises error in every domain (Weather MAE
  +4.4%).. Nobody has vouched for it; add support or contest it on this
  page.
