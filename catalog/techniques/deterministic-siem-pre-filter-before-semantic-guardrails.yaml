description: >-
  Sanitize and length-bound log payloads with SIEM decoders and atomic rules
  at ingestion, then pass the structured alert through LLM self-check input
  and output rails before and after the SOC model acts. Filed by the
  drafting stage from Architecting the Secure AI-SOC: A Neurosymbolic
  Framework for Pipeline Integrity and Threat Mitigation (2609.10707) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Counts of
  blocked payloads per layer on a synthesized set of 20 injected Wazuh
  alerts, plus one volumetric log-poisoning simulation; no undefended
  baseline rate, no false-positive measurement on benign alerts, no latency
  numbers.. Nobody has vouched for it; add support or contest it on this
  page.
