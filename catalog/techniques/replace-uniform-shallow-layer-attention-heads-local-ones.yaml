id: replace-uniform-shallow-layer-attention-heads-local-ones
ref: TEC-0795
label: "Replace uniform shallow-layer attention heads with local one"
summary: >-
  At inference, rank each shallow layer's attention heads by how closely
  they match a uniform distribution and overwrite the top 10% most uniform
  heads' attention maps with the most local head's map (or the mean of the
  most local ones).
description: >-
  At inference, rank each shallow layer's attention heads by how closely
  they match a uniform distribution and overwrite the top 10% most uniform
  heads' attention maps with the most local head's map (or the mean of the
  most local ones). Filed by the drafting stage from ART: Attention
  Replacement Technique to Improve Factuality in LLMs (2604.06393) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  vs vanilla greedy decoding on five benchmarks across seven open models;
  ablations on k, replacement direction (replacing local with uniform
  collapses accuracy), and scattered-source replacement; compared against
  ITI, ACT, DoLa and beam search.. Nobody has vouched for it; add support or
  contest it on this page.
