label: "Give the test generator repo exploration instead of pasted d"
summary: >-
  Replace a fixed white-box prompt containing the entry function plus its
  dependencies with an agent loop that browses the repository itself before
  writing tests that must fail pre-fix and pass post-fix.
description: >-
  Replace a fixed white-box prompt containing the entry function plus its
  dependencies with an agent loop that browses the repository itself before
  writing tests that must fail pre-fix and pass post-fix. Filed by the
  drafting stage from TestExplora: Benchmarking LLMs for Proactive Bug
  Discovery via Repository-Level Test Generation (2602.10471) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Fail-to-Pass rate
  on TestExplora-Lite (330 PRs) against the same backbone given all
  dependencies in context: GPT-5-mini 12.79 -> 17.27 (SWEAgent) and 14.55
  (TraeAgent); o4-mini 5.92 -> 9.42 and 12.16; head-pass rate also rose,
  with pass@5 reaching 29.7.. Nobody has vouched for it; add support or
  contest it on this page.
