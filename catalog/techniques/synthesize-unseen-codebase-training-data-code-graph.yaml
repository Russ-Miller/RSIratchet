description: >-
  Parse an unfamiliar codebase into a graph of entities and dependency/call
  edges, use it to order files for dependency-preserving continued
  pretraining, and to synthesize reasoning-augmented SFT data covering
  single-hop relations, test-deriv Filed by the drafting stage from
  Unseen-Codebases-Domain Data Synthesis and Training Based on Code Graphs
  (2602.20799) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Compilation@1 and pass@1 on UnseenCodeBench (four
  post-cutoff repos, 4 x ~60-64 hand-checked tasks) against RAG with five
  frontier models and against OSS-Instruct and COTTON fine-tuning at matched
  data scale; reported 25.5 absolute points over RAG with GPT-5.1 and
  7.2-26.1 points over synthesis baselines, plus 36.0% pass@1 in a
  multi-codebase single-model setting.. Nobody has vouched for it; add
  support or contest it on this page.
