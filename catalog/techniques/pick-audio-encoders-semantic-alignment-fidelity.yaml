description: >-
  When choosing an audio front end for an audio-LLM, select encoders whose
  training imposed text/semantic constraints (weakly supervised or
  semantically distilled) instead of maximizing reconstruction fidelity or
  preferring continuous over di Filed by the drafting stage from Discrete
  vs. Continuous: A Comprehensive Study of Unified Audio Understanding in
  LALMs (2609.22851) with status proposed: the paper introduces or tests it,
  and the claim drafted from the paper is its first evidence. The paper
  validated it by: Nine encoders compared under identical task configs on
  ~20 datasets across speech/sound/music; Whisper led overall (0.735 vs
  0.418 for Wav2Vec2 at 135M), SpeechTokenizer beat HuBERT on emotion
  recognition, DAC and WavTokenizer scored lowest on semantic tasks despite
  higher fidelity; performance fell in about 53% of encoder-task configs
  when the backbone was scaled.. Nobody has vouched for it; add support or
  contest it on this page.
