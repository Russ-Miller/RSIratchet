label: "Select ICL examples by prototype distance in a learned low-d"
summary: >-
  Train a small projection network plus class prototypes on frozen-LLM
  hidden states with a manifold-preservation loss and proxy-anchor loss,
  then pick demonstrations nearest the learned prototypes once for the whole
  dataset.
description: >-
  Train a small projection network plus class prototypes on frozen-LLM
  hidden states with a manifold-preservation loss and proxy-anchor loss,
  then pick demonstrations nearest the learned prototypes once for the whole
  dataset. Filed by the drafting stage from Geometry-Aware Hallucination
  Detection in Large Language Models (2601.06196) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy on HaluEval
  dialogue/summarization/QA and FEVER across six models versus KNN,
  clustering, BM25, perplexity, SA-ICL, AdaICL and Top-k+Con-E baselines at
  equal shot count; gains up to 9.9 points on Mistral-7B
  dialogue/summarization, with BM25 ahead on some QA settings at small
  scale. Single run, temperature 0.. Nobody has vouched for it; add support
  or contest it on this page.
