id: index-stream-shallow-layer-kvs-answer-deep-only
ref: TEC-0289
label: "Index the stream with shallow-layer KVs, answer deep only on"
summary: >-
  Streaming frames pass through only the shallow language layers whose KVs
  form a full-history index; at query time a text-only logit gate decides
  whether history is needed, cross-layer token voting plus max-min diversity
  picks evidence units
description: >-
  Streaming frames pass through only the shallow language layers whose KVs
  form a full-history index; at query time a text-only logit gate decides
  whether history is needed, cross-layer token voting plus max-min diversity
  picks evidence units Filed by the drafting stage from ShallowStream: Index
  Shallow then Answer Deep for Streaming Video Understanding (2609.02780)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  OVO-Bench and StreamingBench accuracy against online MLLMs and
  training-free offline-to-online baselines (ReKV, HERMES, SimpleStream,
  OASIS, CausalMem, LiveVLM) on two backbones, plus measured per-frame
  prefill, 20s end-to-end latency and peak GPU memory on an RTX 5090;
  ablations isolate the gate (48.7% retrieval on Backward vs 4.9% on
  Real-Time), token voting (59.48% vs 58.91% pooled Q-K, 57.47% SigLIP) and
  diversity (59.77% to 61.21%).. Nobody has vouched for it; add support or
  contest it on this page.
