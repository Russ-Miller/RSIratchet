description: >-
  Run the model twice on the same query, once with the true object-centric
  3D scene graph and once with a copy whose category labels and object
  centroids/extents are perturbed, then subtract a scaled share of the
  perturbed-context logits befo Filed by the drafting stage from 3D-VCD:
  Hallucination Mitigation in 3D-LLM Embodied Agents through Visual
  Contrastive Decoding (2604.08645) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: 3D-POPE
  precision/recall/F1/accuracy/yes-rate across Random, Popular and
  Adversarial splits against 3D-LLM, 3D-VisTA and LEO baselines (Random:
  accuracy 50.07 to 67.99, yes-rate 99.81 to 75.15); HEAL CHAIR object and
  state hallucination rates with and without the contrast on two instruct
  models; ablation over 11 distortion types showing all beat the baseline
  F1.. Nobody has vouched for it; add support or contest it on this page.
