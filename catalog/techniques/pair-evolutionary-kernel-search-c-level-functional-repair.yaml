description: >-
  An agent pipeline that retrieves Vitis optimization strategies, evolves a
  pool of synthesizable HLS kernels under simulation feedback, then
  de-pragmas each kernel to verify and repair functional correctness in
  C/C++ before generating host c Filed by the drafting stage from FPGAgent:
  An LLM-Assisted Framework for Autonomous HLS Code Generation and
  Verification in FPGA Environments (2608.23630) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Synthesizable, executable and
  functional-correctness rates on 78 HLS-Eval tasks against zero-shot
  pass@10 across five models (average +16.9%, +26.7%, +30.6%; 92.3%
  correctness with Gemini 3.1 Pro), plus a four-variant ablation on
  Qwen3-Coder-30B-A3B (base 59.0/47.4/37.2; evolution only 80.1/66.7/48.7;
  reflection only 57.7/50.0/46.2; full 83.3/75.6/66.7) and an error-type
  breakdown.. Nobody has vouched for it; add support or contest it on this
  page.
