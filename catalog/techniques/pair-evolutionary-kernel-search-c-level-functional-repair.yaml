description: >-
  A multi-agent pipeline that injects Vitis HLS optimization documentation,
  evolves kernel candidates under simulation feedback with an error pool,
  then de-pragmas the kernel to verify and repair functional correctness in
  C++, before generati Filed by the drafting stage from FPGAgent: An
  LLM-Assisted Framework for Autonomous HLS Code Generation and Verification
  in FPGA Environments (2608.23630) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against zero-shot pass@10 on 78
  HLS-Eval tasks: average +16.9% synthesizable, +26.7% executable, +30.6%
  functional correctness; best 92.3% correctness with Gemini 3.1 Pro.
  Ablation on Qwen3-Coder-30B-A3B: evolution-only 80.1/66.7/48.7,
  reflection-only 57.7/50.0/46.2 (synthesizability slightly down), full
  83.3/75.6/66.7 from a base of 59.0/47.4/37.2.. Nobody has vouched for it;
  add support or contest it on this page.
