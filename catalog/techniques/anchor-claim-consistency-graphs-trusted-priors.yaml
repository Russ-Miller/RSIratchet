label: "Anchor claim-consistency graphs to trusted priors"
summary: >-
  Decompose sampled responses and trusted source documents into atomic
  claims, build a weighted bipartite graph where prior-entailed edges cost
  least, and label each claim Grounded, Refuted, or Boundary by weighted
  closeness centrality.
description: >-
  Decompose sampled responses and trusted source documents into atomic
  claims, build a weighted bipartite graph where prior-entailed edges cost
  least, and label each claim Grounded, Refuted, or Boundary by weighted
  closeness centrality. Filed by the drafting stage from GRACE:
  Graph-Grounded Reflective Agent Copilot Engine for Expert-in-the-Loop
  Knowledge Expansion (2609.04442) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: QA accuracy and answerability against
  zero-shot partial/full context, RAG, and GraphRAG on 100 QASPER papers and
  50 QuALITY articles; plus a confusion matrix against an LLM oracle showing
  97.6% grounding precision and 85.5% of hallucinated claims placed in
  Boundary/Refuted.. Nobody has vouched for it; add support or contest it on
  this page.
