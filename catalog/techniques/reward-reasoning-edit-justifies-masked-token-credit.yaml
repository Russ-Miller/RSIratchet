id: reward-reasoning-edit-justifies-masked-token-credit
ref: TEC-0185
label: "Reward reasoning by the edit it justifies, with masked token"
summary: >-
  An actor writes quality reasoning and a rating; a frozen editor applies
  edits conditioned on that reasoning, a frozen judge scores the quality
  change, and that change rewards only the reasoning tokens while human
  ratings reward only the rat
description: >-
  An actor writes quality reasoning and a rating; a frozen editor applies
  edits conditioned on that reasoning, a frozen judge scores the quality
  change, and that change rewards only the reasoning tokens while human
  ratings reward only the rat Filed by the drafting stage from MR-IQA-2:
  Faithful Image Quality Reflection via Fine-Grained Credit Assignment
  (2608.18579) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean judge-scored quality gain after reasoning-guided
  editing on a 5,866-image subset: +1.079 (credit mask) and +1.442 (no mask)
  versus -0.136 baseline and -0.260 rating-only, with rating PLCC/SRCC held
  competitive (0.838/0.812); gains persisted under a swapped editor
  (Mage-Flow) and swapped judges (Q-Insight, GPT-5.6 Sol, 81.4% 3AFC
  preference). The unmasked variant's larger gain came with collapse to a
  single universal edit, so raw gain alone does not show image-conditioned
  reasoning.. Nobody has vouched for it; add support or contest it on this
  page.
