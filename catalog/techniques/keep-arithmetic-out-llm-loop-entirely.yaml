id: keep-arithmetic-out-llm-loop-entirely
ref: TEC-0322
label: "Keep arithmetic out of the LLM loop entirely"
summary: >-
  LLM agents only route, extract parameters, plan and phrase, while
  deterministic Python engines do all rate lookup, calendar/day-count,
  compounding and rule application.
description: >-
  LLM agents only route, extract parameters, plan and phrase, while
  deterministic Python engines do all rate lookup, calendar/day-count,
  compounding and rule application. Filed by the drafting stage from CIFQA:
  A Deterministic Tool-Grounded Multi-Agent LLM Framework for Financial
  Query Answering (2608.26114) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Accuracy on 101 calculation-intensive queries:
  95.54% with a Llama-Scout-17B backbone versus 83.66% Claude Sonnet 4.6,
  70.30% Gemini 3, 45.05% GPT-5.3, all given complete formulas and rate
  cards; 89.60% with a 70B and 68.81% with an 8B backbone; module ablations
  drop accuracy to 48% (rolling-year) and 76.7% (rate lookup).. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
kind: tooling
sources: [arxiv-2608-26114]
status: proposed
