description: >-
  An actor states quality reasoning and a rating; a frozen diffusion editor
  applies the edit the reasoning implies, a frozen judge scores the quality
  change, and that change rewards only the reasoning tokens while human
  ratings reward only th Filed by the drafting stage from MR-IQA-2: Faithful
  Image Quality Reflection via Fine-Grained Credit Assignment (2608.18579)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Mean judge-scored quality gain from reasoning-guided editing on a
  5,866-image test subset: +0.789 for the trained actor vs +0.213 for
  Q-Insight and -0.137 for the untrained Qwen3.5-4B, with the direction
  preserved under a swapped editor (Mage-Flow) and two swapped judges
  (Q-Insight, GPT-5.6 Sol, 81.4% 3AFC preference); rating alignment held at
  avg PLCC/SRCC 0.840/0.816.. Nobody has vouched for it; add support or
  contest it on this page.
