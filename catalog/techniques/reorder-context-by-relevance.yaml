id: reorder-context-by-relevance
ref: TEC-0018
label: Put important material first or last
summary: Order retrieved documents so the most relevant sit at the start and end of the prompt.
description: >-
  Because recall is best at the edges of the context, rank retrieved
  passages by relevance and place the top ones first and last, weakest in
  the middle. Also truncate aggressively: fewer, better passages beat many.
addresses: [long-context-degradation]
kind: prompting
sources: [arxiv-2307-03172]
