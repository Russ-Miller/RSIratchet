description: >-
  From ten unlabeled target observations, score each functional region of a
  VLA by combining CKA against a cached source reference with reference-free
  gradient and MC-dropout sensitivity, then set per-region LoRA rank
  proportional to the scor Filed by the drafting stage from Not All Layers
  Need Tuning: Diagnosing and Directing Adaptation in Vision-Language-Action
  Models (2609.18084) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Diagnostic scores ranked regions against measured
  region-isolated parameter displacement at median Spearman 0.91; at a
  matched budget of roughly half uniform rank-32, the allocation beat
  uniform-matched LoRA, DoRA, (IA)^3, AdaLoRA, LoRA-SP, random and
  dominant-region-only allocation on all five architectures on LIBERO and
  CALVIN (5 seeds, 50 rollouts/task), and on the xArm-7 language shift
  reached 21/30 vs 22/30 for full fine-tuning at 0.04% of its trainable
  parameters; random allocation at the same budget collapsed to 42.8% vs
  73.4%.. Nobody has vouched for it; add support or contest it on this page.
