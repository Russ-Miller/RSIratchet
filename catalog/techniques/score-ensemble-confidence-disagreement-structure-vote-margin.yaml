description: >-
  Prompt the same model to rate six properties of the disagreement among
  agents' reasoning (evidence overlap, minority novelty, minority argument
  strength, majority hedging, complexity, where reasoning diverges) and feed
  those plus the vote f Filed by the drafting stage from DiscoUQ: Structured
  Disagreement Analysis for Uncertainty Quantification in LLM Agent
  Ensembles (2603.20975) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: 5-fold cross-validated AUROC and ECE on StrategyQA, MMLU,
  TruthfulQA, ARC-Challenge against six baselines including an LLM
  aggregator reading all agent responses: average AUROC 0.802 vs 0.791 best
  baseline, ECE 0.036 vs 0.098; leave-one-benchmark-out training gave the
  same average AUROC (0.802).. Nobody has vouched for it; add support or
  contest it on this page.
