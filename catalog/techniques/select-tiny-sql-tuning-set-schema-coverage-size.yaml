description: >-
  Filter candidate text-to-SQL examples by dual-model difficulty, attach the
  shortest correct chain-of-thought, score each on four LLM-judged quality
  dimensions, then use a genetic search to pick a small subset maximizing
  table/column coverag Filed by the drafting stage from LIMIT: Less Is More
  for Instruction Tuning in Text-to-SQL (2609.24186) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: BIRD-Dev EX 69.1% and
  Spider-Dev 88.9% with self-consistency@8 from 796 and 863 samples, versus
  67.0% for DB-Explore with 16,457 samples and 63.9-64.2% for OmniSQL
  trained on 2.5M; ablation removing the coverage term drops SFT accuracy
  from 65.4% to 58.4%.. Nobody has vouched for it; add support or contest it
  on this page.
