id: delete-one-context-example-question-uniquely-needs
ref: TEC-0252
label: "Delete the one context example a question uniquely needs"
summary: >-
  Score each context example by how many questions require tokens only it
  supplies (Question Damage Score), then delete the highest-scoring example
  to make a matched, structurally unanswerable variant of the same task.
description: >-
  Score each context example by how many questions require tokens only it
  supplies (Question Damage Score), then delete the highest-scoring example
  to make a matched, structurally unanswerable variant of the same task.
  Filed by the drafting stage from Load-Bearing Context: The Question Damage
  Score for Evaluating Context Reliance in Linguistic Reasoning (2608.27756)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Applied to 53 UKLO puzzles, classifying 45 as fragile and 8 as robust;
  cross-checked by LLM-as-judge agreement with the structural label (Gemini
  71% recall at 94% precision), and used to surface 21 puzzles where Gemini
  matched or beat its original score on a judged-unsolvable variant. Nobody
  has vouched for it; add support or contest it on this page.
