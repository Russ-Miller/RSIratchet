description: >-
  Locate layers with low CKA or high MoE routing drift, take an SVD of their
  historical-task activations on a small fixed calibration set, and project
  gradients onto the orthogonal complement of that subspace during
  target-task training. Filed by the drafting stage from Mechanistic
  Analysis of Catastrophic Forgetting in Large Language Models During
  Continual Fine-tuning (2601.18699) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: On Llama 4 Scout after code-to-math
  adaptation: Task A (code) 74.8% vs 35.1% standard fine-tuning, 58.4% LoRA,
  56.1% EWC, 72.1% 10% replay, with Task B (math) 75.1% vs 76.8% standard,
  at 1.09x overhead; rank-ratio sweep shows retention and adaptation trade
  off monotonically.. Nobody has vouched for it; add support or contest it
  on this page.
