description: >-
  A zero-initialized LoRA adapter runs concurrently with the frozen base
  model during tool-call generation, trained with loss only on a trigger
  token and label, so it restructures the residual stream and then emits a
  localized verdict like 'u Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Detection AUROC 0.966 ID / 0.925 OOD on Qwen3-4B vs
  0.915/0.884 for an equal-scale fine-tuned external judge, 0.782/0.616 for
  a linear probe, and ~0.5 for entropy baselines; >80% exact-parameter
  localization; in a closed ReAct loop, specific feedback gave parameter F1
  61.2 vs 51.3 generic and 52.1 base, false blocks 2.9% vs 9.4%, recovery
  rate 37.0% vs 23.9%; <10ms overhead in vLLM.. Nobody has vouched for it;
  add support or contest it on this page.
