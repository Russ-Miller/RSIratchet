summary: >-
  Flag a generation as hallucinated when the hidden state's geometric margin
  to the nearest memorized fact basin exceeds a threshold, instead of
  thresholding output entropy.
description: >-
  Flag a generation as hallucinated when the hidden state's geometric margin
  to the nearest memorized fact basin exceeds a threshold, instead of
  thresholding output entropy. Filed by the drafting stage from Attractor
  Geometry of Transformer Memory: From Conflict Arbitration to Confident
  Hallucination (2605.05686) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Separation of correct recall from hallucination on
  the synthetic task with zero false refusals, against entropy-based
  detection which rejected the vast majority of correct outputs; separation
  also held on natural-language factual queries.. Nobody has vouched for it;
  add support or contest it on this page.
