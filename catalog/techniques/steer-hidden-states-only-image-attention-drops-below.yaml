ref: TEC-0429
label: "Steer hidden states only when image attention drops below a "
summary: >-
  Reads mean pre-softmax image attention at selected mid-to-late layers each
  decoding step and, only when it falls below a threshold, adds the
  closed-form minimum-norm residual-stream edit that lifts it back, before
  the Q/K/V projections.
description: >-
  Reads mean pre-softmax image attention at selected mid-to-late layers each
  decoding step and, only when it falls below a threshold, adds the
  closed-form minimum-norm residual-stream edit that lifts it back, before
  the Q/K/V projections. Filed by the drafting stage from Mitigating
  Hallucination in Vision-Language Models through Barrier-Regulated Adaptive
  Closed-form Steering (2605.29881) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: CHAIR_s down to 9.4 points lower than
  baseline with recall within 2 points, POPE overall F1 +2.73, MME +14 and
  best MMHal, versus VCD, VDD-None, PAI and SPIN baselines; an always-on
  variant of the same correction injects extra objects and flips 28
  correctly grounded POPE answers.. Nobody has vouched for it; add support
  or contest it on this page.
