description: >-
  Dual seeking and following action heads are fused by routing weights from
  an MLP router whose logits are additionally trained with a cross-entropy
  loss against a ground-truth seeking/following stage label derived from
  when the target was fi Filed by the drafting stage from UESF-Bench:
  Benchmarking and Probing for Unified Embodied Seeking and Following
  (2607.13621) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Task Success Rate, Collision Rate, Following Ratio and
  Search SPL on held-out UESF-Bench test scenes, against a single shared
  head and an unsupervised phase-aware router under an identical backbone;
  routing weights plotted over an episode show a sharp seek-to-follow
  switch.. Nobody has vouched for it; add support or contest it on this
  page.
