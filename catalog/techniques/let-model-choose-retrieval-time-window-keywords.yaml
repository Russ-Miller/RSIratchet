summary: >-
  Train an MLLM agent to emit, per turn, either a retrieval action with an
  inferred time period plus keywords over typed memory stores (core,
  semantic, episodic, procedural) or a final answer, and separately update a
  Big-Five personality vect
description: >-
  Train an MLLM agent to emit, per turn, either a retrieval action with an
  inferred time period plus keywords over typed memory stores (core,
  semantic, episodic, procedural) or a final answer, and separately update a
  Big-Five personality vect Filed by the drafting stage from PersonaVLM:
  Long-Term Personalized Multimodal LLMs (2604.13074) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Accuracy on Persona-MME
  (2,000+ cases, 200 personas) and PERSONAMEM at 32k and 128k context
  against full-context and top-5 RAG baselines on the same backbone, plus
  GPT-4o and InternVL3-8B/38B; SFT-only and SFT+GRPO variants reported
  separately (e.g. 128k Persona-MME 54.48 base, 59.01 RAG, 67.18 SFT, 71.05
  RL).. Nobody has vouched for it; add support or contest it on this page.
