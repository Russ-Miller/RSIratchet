description: >-
  Treats a query-prompted frozen LLM as a convolution kernel that summarizes
  overlapping text windows in parallel, recursing over summaries layer by
  layer, with high-relevance raw segments skipped forward to the final
  answer and a separate ch Filed by the drafting stage from ConvMem:
  Convolutional Memory for Long-Context Reasoning (2609.10441) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: F1 and Sub-EM on
  RULER-HotpotQA and RULER-2WikiMultiHopQA at six context lengths against
  vanilla Qwen2.5-32B, RAG-BM25, MemAgent-w/o-RL, Mem-alpha-w/o-RL, and
  RL-trained MemAgent and Mem-alpha; ablations on stride, skip connections,
  channel count, kernel size.. Nobody has vouched for it; add support or
  contest it on this page.
