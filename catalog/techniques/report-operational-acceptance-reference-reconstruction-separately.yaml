description: >-
  Use parser, domain-conformance, planner, VAL and LLM-critic checks as the
  online stopping criterion, but compute renaming-invariant structural match
  and semantic equivalence against curated reference problems offline as a
  separate benchmark Filed by the drafting stage from Grounded Evaluation
  and Repair for NL-to-PDDL Problem Generation (2609.09898) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Measured on
  60-instance runs per setting: on PDDL 2.1, final operational success 0.500
  (baseline) and 0.733 (few-shot) against final structural match 0.000 and
  0.067, with 0.500 and 0.667 of examples operationally accepted but
  structurally unmatched; on Planetarium+FS, 0.583 operational versus 0.417
  semantic and structural. A manual audit of 24 outputs found the LLM critic
  agreed with human faithfulness judgment in 13/24 cases.. Nobody has
  vouched for it; add support or contest it on this page.
