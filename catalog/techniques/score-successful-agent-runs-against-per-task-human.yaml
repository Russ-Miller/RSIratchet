description: >-
  Gate on task success, then multiplicatively discount each excess tool call
  and each excess user-facing turn beyond human-annotated per-task reference
  counts, with the two penalties fitted from blinded human pairwise
  preferences. Filed by the drafting stage from RideWay: Benchmarking
  Efficient Task Completion for Tool-Using Language Agents (2609.17985) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: 78.7%
  accuracy on task-disjoint held-out human pairwise preferences (90.6% when
  turns differ, 50% — chance — when only tool calls differ), Kendall tau_b
  0.573, positive tau_b on all 10 listwise tasks; equal-cost length baseline
  0.773, turn-first lexicographic 0.800 (statistically tied).. Nobody has
  vouched for it; add support or contest it on this page.
