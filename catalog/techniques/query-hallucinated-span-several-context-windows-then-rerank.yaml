id: query-hallucinated-span-several-context-windows-then-rerank
ref: TEC-0782
label: "Query a hallucinated span with several context windows, then"
summary: >-
  For each hallucinated span, build multiple queries from the span and
  different surrounding context windows, pool their FAISS dense-retrieval
  candidates, and rerank the union with a cross-encoder.
description: >-
  For each hallucinated span, build multiple queries from the span and
  different surrounding context windows, pool their FAISS dense-retrieval
  candidates, and rerank the union with a cross-encoder. Filed by the
  drafting stage from HART: Data-Driven Hallucination Attribution and
  Evidence-Based Tracing for Large Language Models (2603.05828) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Ablation on the
  authors' own hallucination-tracing test split: dense embedding alone R@1
  0.4133; plus cross-encoder 0.5172; plus multi-query 0.6244; full method
  0.7068. Full method also beat BM25, DPR, Sentence-BERT and
  cross-encoder-only on Recall@k, nDCG@k and MRR on both model-derived
  datasets.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [hallucination]
kind: retrieval
sources: [arxiv-2603-05828]
status: proposed
