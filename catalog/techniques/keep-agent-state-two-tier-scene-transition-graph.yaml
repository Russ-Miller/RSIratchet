description: >-
  Parse each observation into a scene graph that is updated in place, encode
  it with a GAT into an embedding, link those embeddings by the actions
  taken into a session transition graph used for loop detection and
  retrieval of structurally sim Filed by the drafting stage from Embodied
  Task Planning via Graph-Informed Action Generation with Large Language
  Models (2601.21841) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass@1 on Robotouille Synchronous/Asynchronous and
  ALFWorld against ReCAP, ReAct, ExpeL and CoT with matched system prompts
  (up to +19/+37/+15 points); noise ablation at 0, 1-per-10-step and
  1-per-5-step injection rates; per-step prefill token counts (12k vs 41k vs
  57k) and FLOPs.. Nobody has vouched for it; add support or contest it on
  this page.
