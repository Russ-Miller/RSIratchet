description: >-
  Each stakeholder is instantiated as an agent that, each round, is prompted
  to summarize every other agent's past textual policies into an empirical
  mixture and then write a new policy that maximizes its own payoff against
  that mixture, with Filed by the drafting stage from Enhancing
  Decision-Making with Large Language Models through Multi-Agent Fictitious
  Play (2606.19308) with status proposed: the paper introduces or tests it,
  and the claim drafted from the paper is its first evidence. The paper
  validated it by: Round-robin tournament utility across 9 methods (average
  0.533 vs 0.527 for ToM, 0.496 debate, 0.477 self-reflection) and
  robustness as the minimum utility over 10 rounds of an evolving attacker
  (0.421 vs 0.369 ToM); ablation replacing the aggregate with the opponent's
  latest policy scored lower on both (0.491/0.374).. Nobody has vouched for
  it; add support or contest it on this page.
