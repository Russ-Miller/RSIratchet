id: split-streaming-video-into-latency-frontend-asynchronous-memory
ref: TEC-0412
label: "Split streaming video into a latency frontend and an asynchr"
summary: >-
  Frontend workers handle dispatch and proactive monitoring while backend
  workers asynchronously build a hierarchical event and entity memory with
  retained key frames, and route recall and external search on demand.
description: >-
  Frontend workers handle dispatch and proactive monitoring while backend
  workers asynchronously build a hierarchical event and entity memory with
  retained key frames, and route recall and external search on demand. Filed
  by the drafting stage from StreamArena: Toward Continuous, Interactive,
  and Long-Horizon Agentic Streaming Video Understanding (2608.05703) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: On
  StreamArena it ranked first among streaming systems on all four
  capabilities, improving 53.7-228.1% relative over the strongest streaming
  baseline per capability, and against query-triggered offline inference on
  the same Qwen3.5-397B-A17B backbone it cut pooled query-to-answer latency
  66.2% (81.4s to 27.5s) while retaining 89.7% of pooled accuracy; the
  authors note baselines use smaller backbones so gains are not isolated to
  architecture.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [video-temporal-reasoning]
kind: architecture
