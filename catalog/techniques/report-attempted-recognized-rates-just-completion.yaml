description: >-
  Instrument the agent pipeline to record the furthest stage an injected
  payload reaches and use a judge panel to label whether the agent attempted
  the attack and whether it explicitly recognized the injection, alongside
  the deterministic com Filed by the drafting stage from An Experimental
  Evaluation of Multimodal Prompt Injection Attacks on Agentic AI Frameworks
  (2609.09404) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied across 720 runs; attempts (12.8%) exceeded
  completions (1.11%) by an order of magnitude and stage labels separated
  perception-stage refusals (170) from unexplained planning-stage non-action
  (303), distinctions the completion metric collapses. No independent
  validation of the judge panel against human labels in this paper (voting
  rule borrowed from prior work).. Nobody has vouched for it; add support or
  contest it on this page.
