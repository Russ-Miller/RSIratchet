summary: >-
  Adapts a general base model to a specialist domain in three stages:
  continual pre-training on a curated domain corpus mixed with general data,
  SFT on verified chain-of-thought triplets, then DAPO RL with exact-match,
  reward-model and format
description: >-
  Adapts a general base model to a specialist domain in three stages:
  continual pre-training on a curated domain corpus mixed with general data,
  SFT on verified chain-of-thought triplets, then DAPO RL with exact-match,
  reward-model and format Filed by the drafting stage from Enhancing Fitness
  Intelligence through Domain-Specific LLM Post-Training (2607.02118) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Certification-exam scores (ACSM-EP, NSCA-CSCS) versus Qwen3 base models
  and open/closed baselines, plus a general-capability suite (MMLU-Redux,
  MATH-500, HumanEval, IFEval and others) to check retention; stage
  ablations at 8B show CPT alone drops General-Bench 67.90 to 66.24 while
  SFT recovers it to 70.12, and dropping CPT costs 2.69 ACSM-EP points..
  Nobody has vouched for it; add support or contest it on this page.
