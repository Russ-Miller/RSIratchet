description: >-
  Instead of retrieving once up front, each round builds a new query from
  the recent debate messages, the agent's self-identified evidence gap and
  the prior round's reflection, admitting only documents above a novelty
  threshold against the ex Filed by the drafting stage from Courtroom-Style
  Multi-Agent Debate with Progressive RAG and Role-Switching for
  Controversial Claim Verification (2603.28488) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Ablation on the same 120
  Check-COVID claims: removing P-RAG dropped accuracy 81.7% to 74.2% and
  halved the evidence pool (67.5 to 37.5 items) while mean inter-judge kappa
  rose 0.468 to 0.599; compared against single-call RAG (80.0% in-domain,
  63.0% on HealthVer) and standard two-agent MAD (71.7%), with McNemar's
  test on a paired 100-claim HealthVer subset (chi2=8.04, p=0.0046) against
  standard MAD.. Nobody has vouched for it; add support or contest it on
  this page.
