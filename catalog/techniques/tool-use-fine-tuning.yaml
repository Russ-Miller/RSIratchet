id: tool-use-fine-tuning
ref: TEC-0027
label: Fine-tune on tool-call traces
summary: Train the model on examples of deciding when to call a tool and how to use the result.
description: >-
  Generate or collect traces of tool calls with their arguments and
  results, filter for calls that helped, and fine-tune. Toolformer does this
  self-supervised for simple tools; ToolBench does it at scale for real
  APIs.
