id: regularize-vla-rl-toward-frozen-sft-policy-then
ref: TEC-0346
label: "Regularize VLA RL toward the frozen SFT policy, then decay"
summary: >-
  Adds a KL penalty between the current LoRA policy and the frozen SFT
  reference policy to the PPO loss, held at a high weight early and annealed
  to zero over training.
description: >-
  Adds a KL penalty between the current LoRA policy and the frozen SFT
  reference policy to the PPO loss, held at a high weight early and annealed
  to zero over training. Filed by the drafting stage from Leveraging Offline
  Supervision for Efficient and Generalizable Reinforcement Learning in
  Large-Scale Vision-Language-Action Models (2607.19399) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: In-distribution
  (64 episodes) and out-of-distribution (960 episodes over 15 shifted
  environments) success rates: RefKL at 1M steps 0.93 IND / 0.77 OOD vs
  plain PPO at 1M 0.75/0.64 and plain PPO at 2M 0.92/0.77; SFT-init PPO
  0.87/0.69; DataBC 0.91/0.74; beta ablation shows stronger initial guidance
  is better and no-curriculum is worse (0.86/0.75).. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [embodied-control]
kind: training
