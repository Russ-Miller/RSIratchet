description: >-
  Turn a success-heavy robot demonstration corpus into reward-model training
  data by holding the video fixed while swapping in counterfactual
  instructions the video only partly satisfies, and by truncating successful
  rollouts to earlier endpo Filed by the drafting stage from RoboReward:
  General-Purpose Vision-Language Reward Models for Robotics (2601.00675)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Ablations on the 4B model against the human-verified RoboRewardBench:
  removing all negative augmentation raised overall MAE from 0.845 to 1.450,
  removing only the clipped negatives raised it to 1.075, while MAE on the
  organic RoboArena subset barely moved (0.806 / 0.797 / 0.813); the 8B
  model trained on the full mixture also raised real-robot RL success over a
  frontier embodied-reasoning VLM reward (50% vs 10% and 80% vs 45% on two
  tasks, 20 trials each).. Nobody has vouched for it; add support or contest
  it on this page.
