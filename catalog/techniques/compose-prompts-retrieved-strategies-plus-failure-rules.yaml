description: >-
  Distils solved trajectories into indexed reusable strategy templates and
  failed ones into generalized error rules, then retrieves the top-k similar
  templates plus all error rules per query to build the prompt, updating the
  two stores by add Filed by the drafting stage from Generalizable
  Self-Evolving Memory for Automatic Prompt Optimization (2603.21520) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  on six tasks against four prompting baselines and five APO baselines
  (ProTeGi, OPRO, TextGrad, PromptBreeder, SPO); best average on both
  backbones (70.7 vs 63.6 for TextGrad on GPT-4o-mini) at ~57% lower
  optimization dollar cost; cross-domain mix (Gaokao MathQA + History) where
  baselines degrade; ablations on each memory store and on top-k (peak at
  k=3).. Nobody has vouched for it; add support or contest it on this page.
addresses: [harness-self-improvement]
