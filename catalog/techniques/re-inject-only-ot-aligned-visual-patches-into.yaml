id: re-inject-only-ot-aligned-visual-patches-into
ref: TEC-0789
label: "Re-inject only OT-aligned visual patches into the FFN"
summary: >-
  Condense visual tokens to those farthest from their mean prototype, score
  cropped image patches by entropic optimal-transport distance to the hidden
  states, and add only the below-threshold patches' embeddings into each
  decoder block's feed
description: >-
  Condense visual tokens to those farthest from their mean prototype, score
  cropped image patches by entropic optimal-transport distance to the hidden
  states, and add only the below-threshold patches' embeddings into each
  decoder block's feed Filed by the drafting stage from Look Carefully:
  Adaptive Visual Reinforcements in Multimodal Large Language Models for
  Hallucination Mitigation (2602.24041) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: CHAIR_S/CHAIR_I and BLEU on 500
  MSCOCO images and POPE accuracy/F1 on MSCOCO, A-OKVQA and GQA against
  vanilla decoding, VCD, MemVR and VAF, across three backbones; general
  capability checked on MME, MMBench and LLaVA-Bench; component ablation
  separates prototype reduction (22.7 to 20.2 CHAIR_S) from OT patch
  selection (22.7 to 22.3) with both at 19.8; latency 2.07s vs 1.68s
  baseline.. Nobody has vouched for it; add support or contest it on this
  page.
