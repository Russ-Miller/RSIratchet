id: abstain-unless-noise-perturbed-latent-paths-agree
ref: TEC-0461
label: "Abstain unless noise-perturbed latent paths agree"
summary: >-
  Injects decaying Gaussian noise into the hidden state fed back through the
  model across latent reasoning steps, producing several trajectories per
  query, and answers only when enough of them agree on the final answer.
description: >-
  Injects decaying Gaussian noise into the hidden state fed back through the
  model across latent reasoning steps, producing several trajectories per
  query, and answers only when enough of them agree on the final answer.
  Filed by the drafting stage from NoisyCoconut: Counterfactual Consensus
  via Latent Space Reasoning (2605.08221) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy and coverage at agreement
  thresholds from 2/5 to 5/5 against single-path greedy decoding, across 5
  models x 3 benchmarks (1000 questions each); on GSM8K no baseline exceeded
  75% while all models exceeded 90% at unanimity with coverage 31-53%;
  noise-scale sweep fitted sigmoid degradation curves with R2 >= 0.94. No
  matched-compute comparison against token-level self-consistency or
  semantic entropy.. Nobody has vouched for it; add support or contest it on
  this page.
