  Adversarial QA for Improving Domain-Specific LLMs (2602.18137) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy on three
  contract-specific LegalBench subsets: 82.7% average vs 69.5% base model,
  79.6% EntiGraph (6.7M tokens vs 96k), 75.8% non-adversarial LLM-written
  questions, 71.9% paraphrase, 75.0% Knowledge-Instruct; a sensitivity
  analysis varying refinement iterations shows accuracy rising with more
  steps.. Nobody has vouched for it; add support or contest it on this page.
