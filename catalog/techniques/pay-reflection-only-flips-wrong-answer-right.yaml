  Benchmark and Framework for Industrial Anomaly Detection (2603.00055) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Ablation
  over four reflection-reward configurations on the authors' M3-AD-Bench,
  measuring accuracy, balanced accuracy, anomaly-type score and IoU-based
  localization F1; the cost-plus-penalty variant beat positive-only
