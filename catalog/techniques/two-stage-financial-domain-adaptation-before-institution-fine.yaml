description: >-
  Pre-train a vision-language model on financial statements, research
  reports and policy documents with an added financial-consistency loss,
  then fine-tune on an institution's own investment memos and risk rules
  with LoRA. Filed by the drafting stage from Frontiers in FinTech:
  Multimodal Foundation Models for Financial Reporting and Decision Science
  (2608.22724) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean absolute error and RMSE of target price versus
  analyst consensus on 200 companies, plus a direction-accuracy measure;
  FinVision 13.1% MAE versus 16.2% for the best baseline and 18.7% for
  single-stage FinGPT.. Nobody has vouched for it; add support or contest it
  on this page.
