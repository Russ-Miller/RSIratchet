id: co-train-skill-extractor-solver-downstream-transfer-reward
ref: TEC-0468
label: "Co-train skill extractor and solver on downstream transfer r"
summary: >-
  One shared policy both writes candidate skills from a finished trajectory
  and solves retrieved related tasks conditioned on them, with each skill
  rewarded by the mean downstream success it produces and the
  skill-conditioned rollouts reused
description: >-
  One shared policy both writes candidate skills from a finished trajectory
  and solves retrieved related tasks conditioned on them, with each skill
  rewarded by the mean downstream success it produces and the
  skill-conditioned rollouts reused Filed by the drafting stage from
  Evolving-RL: End-to-End Optimization of Experience-Driven Self-Evolving
  Capability within Agents (2605.10663) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: ALFWorld success rate and Mind2Web
  action accuracy against GRPO, prompt-based memory baselines (ExpeL,
  Memento, ReasoningBank) and SkillRL; ablation isolating extractor-only,
  solver-only and joint objectives; irrelevant-skill control; cross-policy
  skill transfer to base and GRPO models. Unseen-task success 44.6% (GRPO
  with skills) to 88.6%; solver-only reached 69.7% with skills vs 70.3%
  without.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [harness-self-improvement]
