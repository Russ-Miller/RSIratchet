description: >-
  Augments the output schema with span and answer confidence values and
  trains with GRPO whose reward adds a Brier penalty against realised
  rollout correctness, a group-level ECE bonus, an abstention term
  supervised by group accuracy, and a s Filed by the drafting stage from
  SAVOR: Self-Aware Visual Grounding via Confidence-Calibrated Reinforcement
  Learning for Multimodal Hallucination Mitigation (2609.16601) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: ECE (15 bins),
  Brier, AUROC of 1-confidence, Selective-Risk@90 on POPE-adv and
  HallusionBench versus base, HA-DPO, RLHF-V and vanilla GRPO; ECE on
  POPE-adv 0.272 (GRPO) to 0.085, with hallucination metrics (POPE F1, AMBER
  CHAIR, MMHal) also best and MME/MMBench/MMStar/SEED unchanged; ablation
  removing the calibration reward returns ECE to 0.268 with accuracy nearly
  flat.. Nobody has vouched for it; add support or contest it on this page.
