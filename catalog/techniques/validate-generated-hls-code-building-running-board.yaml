description: >-
  A multi-agent pipeline that generates HLS kernels under evolutionary
  search with synthesis-log feedback, verifies functional correctness by
  de-HLSifying the kernel and running a generated C++ test program, then
  generates host code and build Filed by the drafting stage from FPGAgent:
  An LLM-Assisted Framework for Autonomous HLS Code Generation and
  Verification in FPGA Environments (2608.23630) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Against zero-shot pass@10 on 78
  HLS-Eval tasks with five models: average +16.9 points synthesizable rate,
  +26.7 executable rate, +30.6 functional correctness; ablation isolates the
  evolutionary module (mostly synthesizability/executability) from the
  functional reflection module (mostly correctness).. Nobody has vouched for
  it; add support or contest it on this page.
