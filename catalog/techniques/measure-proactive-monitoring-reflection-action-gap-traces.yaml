description: >-
  Compute, from an agent's tool-call log, the share of non-infrastructure
  calls spent querying global state (PMR) and the fraction of commitments
  stated in its planning diary that are executed within the next K turns
  (RAG@K). Filed by the drafting stage from CivBench: A Long-Horizon
  Benchmark for Tool-Mediated Agents in Civilization VI (2609.02459) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Commitments extracted and labelled by an LLM against a fixed rubric;
  validated on a stratified sample of 50 commitments labelled independently
  by an author, 92.0% agreement, Cohen's kappa 0.879. Linked to outcomes via
  a missed-warning analysis: in 7 of 20 detectable defeats no
  victory-progress query occurred in the 20-turn window before game end..
  Nobody has vouched for it; add support or contest it on this page.
