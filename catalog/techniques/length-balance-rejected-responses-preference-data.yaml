id: length-balance-rejected-responses-preference-data
ref: TEC-0128
label: "Length-balance rejected responses in preference data"
summary: >-
  Rewrite refusal and rejected responses to match the length and structure
  of the preferred grounded answer while preserving the underlying grounding
  failure, so preference learning cannot key on length.
description: >-
  Rewrite refusal and rejected responses to match the length and structure
  of the preferred grounded answer while preserving the underlying grounding
  failure, so preference learning cannot key on length. Filed by the
  drafting stage from Building Legal Reward Models for Grounding and
  Abstention (2609.14739) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Pairwise accuracy on LegalRewardBench: Ministral-8B
  59.3 baseline, 67.6 with CJB-only DPO, 66.0 with CJB+original legal pairs,
  81.8 with length-augmented legal pairs, 84.9 with CJB+length-augmented;
  same ordering for Gemma 2-2B.. Nobody has vouched for it; add support or
  contest it on this page.
