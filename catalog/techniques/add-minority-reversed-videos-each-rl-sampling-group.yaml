description: >-
  During GRPO post-training, each prompt's rollout group contains mostly
  forward-video samples plus a small number of samples on the temporally
  reversed video, with the same question and reference answer, so temporal
  order becomes part of the Filed by the drafting stage from COMET:
  Contrastive Motion-Enhanced Temporal Reasoning for Video Multimodal Large
  Language Models (2608.21030) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Same Stage-I checkpoint on Qwen3-VL-8B, group size
  7: average accuracy 78.0 for 7+0 standard GRPO, 78.8 for 6+1, 78.4 for
  5+2, 77.6 for 4+3, versus 76.5 before RL; also compared against Flow4Agent
  and TempFlex reproduced on the same backbone.. Nobody has vouched for it;
  add support or contest it on this page.
