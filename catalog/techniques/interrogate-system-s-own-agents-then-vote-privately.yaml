id: interrogate-system-s-own-agents-then-vote-privately
ref: TEC-0332
label: "Interrogate the system's own agents, then vote privately"
summary: >-
  Each agent in the multi-agent system writes a self-assessment, exchanges
  reports with peers through structured interrogation, then privately emits
  a binary accusation vector over a hazard space of agents, software,
  hardware and human actors
description: >-
  Each agent in the multi-agent system writes a self-assessment, exchanges
  reports with peers through structured interrogation, then privately emits
  a binary accusation vector over a hazard space of agents, software,
  hardware and human actors Filed by the drafting stage from POIROT:
  Interrogating Agents for Failure Detection in Multi-Agent Systems
  (2606.02282) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Fault-attribution accuracy against injected ground-truth
  fault vectors versus a single external LLM evaluator given the full
  context in one pass: gains of +6.7 to +25.6 pp overall on CORTEX, +9.8 to
  +41.7 pp on TradingAgents, and a logistic regression showing the
  POIROT-by-complexity-quartile interaction OR = 1.60, p = 0.008 on
  Who&When; the best single agent's vote fell 14.3-21.3 pp below the
  aggregate.. Nobody has vouched for it; add support or contest it on this
  page.
