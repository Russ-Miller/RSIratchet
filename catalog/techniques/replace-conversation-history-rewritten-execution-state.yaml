description: >-
  At each step the model sees only the immutable skill spec, the current
  structured state and the latest observation, emits a JSON state patch plus
  an action, and has its reasoning trace discarded after the runtime
  validates and merges the pa Filed by the drafting stage from SKILL.state:
  Scalable Long-Horizon Agent Skills (2608.26263) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On a 500-shelf warehouse
  simulation with Gemini-3-Flash over 5 seeds, accuracy at T=200 was 0.94 vs
  0.74 (ReAct), 0.84 (summary memory) and 0.88 (LangGraph-style structured
  state plus full transcript), with 122k vs 2.6-6.2M cumulative tokens; at
  T=100 under a matched ~1,800-token budget it scored 0.94 vs 0.18 sliding
  window, 0.52 summary-capped and 0.22 LLMLingua. Also highest pass rate on
  InterCode CTF (54.2% vs 46.4% best baseline) and both tau-Bench domains..
  Nobody has vouched for it; add support or contest it on this page.
