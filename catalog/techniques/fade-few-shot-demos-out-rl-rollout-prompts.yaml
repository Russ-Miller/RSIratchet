id: fade-few-shot-demos-out-rl-rollout-prompts
ref: TEC-0644
label: "Fade few-shot demos out of RL rollout prompts"
summary: >-
  During RL training the rollout prompt carries a few tool-use
  demonstrations, and the demonstration count is reduced in stages until the
  policy acts zero-shot, replacing an SFT cold start.
description: >-
  During RL training the rollout prompt carries a few tool-use
  demonstrations, and the demonstration count is reduced in stages until the
  policy acts zero-shot, replacing an SFT cold start. Filed by the drafting
  stage from In-Context Reinforcement Learning for Tool Use in Large
  Language Models (2603.08068) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Exact-match accuracy on TriviaQA, HotpotQA, 2Wiki,
  Musique, Bamboogle against Search-R1, ZeroSearch, ParallelSearch, SFT,
  rejection sampling and O2-Searcher (+8.94 average at 3B, +7.34 at 7B;
  40.16 vs 37.26 over the SFT-using O2-Searcher); AIME2024/2025 against
  ReTool.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [tool-use]
kind: training
