id: constrain-tool-calls-persisted-pseudo-code-plan
ref: TEC-0030
label: "Constrain tool calls to a persisted pseudo-code plan"
summary: >-
  Before any task tool runs, the agent emits an ordered pseudo-code plan of
  tool calls, stores it in scratchpad memory for the whole episode, and the
  harness zeroes the probability of any tool outside the plan's current step
  unless replanning
description: >-
  Before any task tool runs, the agent emits an ordered pseudo-code plan of
  tool calls, stores it in scratchpad memory for the whole episode, and the
  harness zeroes the probability of any tool outside the plan's current step
  unless replanning Filed by the drafting stage from Bridging Thought and
  Action: Taming Long-Horizon Instability in Open-Source LLM Agents with a
  MetaTool-Enhanced ROS Framework (2609.13335) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Four-configuration ablation
  (prompting, transient plan, persistent plan, persistent plan + execution
  constraint) over 20 trials per task per model in Gazebo, and 40 hardware
  trials measuring repeated tool calls (19.0%→6.1%), invalid calls
  (21.7%→8.1%) and success rate (23/40→30/40) against vanilla ROSA, ReAct
  and Code-as-Policies re-implementations.. Nobody has vouched for it; add
  support or contest it on this page.
