description: >-
  Encodes each canonical pipeline stage as a persistent directed graph whose
  nodes validate and clean inputs/outputs against a schema before passing
  artifacts to computational tools, with human approval gates at
  high-uncertainty transitions, Filed by the drafting stage from Mozi:
  Governed Autonomy for Drug Discovery LLM Agents (2603.03655) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: PharmaBench (88
  tasks): classification accuracy 33/54 vs 20/54 for Biomni at Qwen3-235B,
  regression SMAPE 1.169 vs 1.599; HLE drug-discovery subset 6/28 best. Plus
  three end-to-end runs reporting docking failure counts and wall-clock
  times, and an AlphaFold3 ipTM comparison of generated LRRK2 binders
  against a Phase II clinical compound.. Nobody has vouched for it; add
  support or contest it on this page.
