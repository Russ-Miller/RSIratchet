description: >-
  Pre-generate a pool of random DAG communication topologies and train a GCN
  classifier to pick one per query, instead of learning per-edge inclusion
  probabilities, while a separate policy picks which LLM fills each proposer
  and synthesizer s Filed by the drafting stage from HieraMAS: Optimizing
  Intra-Node LLM Mixtures and Inter-Node Topology for Multi-Agent Systems
  (2602.20229) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation on MATH and MMLU-Redux against the same system
  with the graph classifier removed (three random graphs averaged): -3.45
  and -3.36 points accuracy; and against all-nodes-GPT-5-Mini, which gained
  1.1 points on MATH at $2.56 vs $1.52 and lost 0.8 points on MMLU-Redux at
  $3.92 vs $1.29. Main table reports 94.61% average vs 92.78% for full-graph
  and 92.69% for AFlow.. Nobody has vouched for it; add support or contest
  it on this page.
