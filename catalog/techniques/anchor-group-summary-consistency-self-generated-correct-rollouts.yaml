label: "Anchor group summary consistency on self-generated correct r"
summary: >-
  In GRPO, force the model to emit an ordered event summary before
  reasoning, down-weight summary tokens that diverge from the token-wise
  center of the group's correct rollouts, and scale an entropy-based
  diversity bonus on the thinking token
description: >-
  In GRPO, force the model to emit an ordered event summary before
  reasoning, down-weight summary tokens that diverge from the token-wise
  center of the group's correct rollouts, and scale an entropy-based
  diversity bonus on the thinking token Filed by the drafting stage from
  Reinforcing Structured Chain-of-Thought for Video Understanding
  (2603.25942) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablations on EventFlowQA (42.37 base → 56.10 full
  self-supervised variant; dynamic diversity beats static 52.22 vs 49.13 and
  56.10 vs 55.78) plus seven public VideoQA benchmarks where the RL-only
  model matches or exceeds SFT+RL pipelines on most metrics; no
  matched-compute control for the extra structure.. Nobody has vouched for
  it; add support or contest it on this page.
