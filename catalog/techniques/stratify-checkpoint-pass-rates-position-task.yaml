id: stratify-checkpoint-pass-rates-position-task
ref: TEC-0476
label: "Stratify checkpoint pass rates by position in the task"
summary: >-
  Instead of reporting one aggregate partial-credit score, bin a task's
  verification checkpoints into early, middle and late stages and report
  pass rate per stage alongside strict all-checkpoint completion.
description: >-
  Instead of reporting one aggregate partial-credit score, bin a task's
  verification checkpoints into early, middle and late stages and report
  pass rate per stage alongside strict all-checkpoint completion. Filed by
  the drafting stage from SaaS-Bench: Can Computer-Use Agents Leverage
  Real-World SaaS to Solve Professional Workflows? (2605.15777) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Applied to
  trajectories of the evaluated models; all models showed a monotonic
  early-to-late decline, and the authors use this to explain the large
  checkpoint-versus-resolved gap. Not validated as improving agent
  performance, only as a diagnostic.. Nobody has vouched for it; add support
  or contest it on this page.
