description: >-
  Replaces agent-managed scratchpads with a system-managed three-layer
  memory (full logs for recent weeks, ~200-word summaries, ~50-word
  milestones) and splits each simulated day into four plannable blocks.
  Filed by the drafting stage from Agentopia on a Consumer GPU: A
  Reduced-Scale Long-Horizon Port with an 8B Model (2608.24215) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Only weakly: a
  52-week memory-off run showed L2/L3 artifacts disappear (an implementation
  dependency, not a behavioral effect), and a single unseeded 10-week M vs
  M+T comparison showed 2.72x more records per agent-week and lower lexical
  duplication but a higher missing-field rate (7.75% vs 1.57%); the authors
  disclaim causal behavioral claims.. Nobody has vouched for it; add support
  or contest it on this page.
