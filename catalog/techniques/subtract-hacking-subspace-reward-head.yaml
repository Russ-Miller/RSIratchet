description: >-
  Estimate per-category hacking directions as the mean gold-to-hacked
  hidden-state shift over pairs the reward model got wrong, orthonormalize
  them by SVD, and subtract the reward-head vector's projection onto that
  subspace without any gradie Filed by the drafting stage from HARVE:
  Hacking-Aware Reward-Head Vector Editing for Robust Reward Models
  (2606.03131) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Gold-preference rate on a held-out split of
  RewardHackBench (967 pairs, 13 subcategories) and on RM-Bench Hard, across
  eight reward models, against the unedited model and two data-augmented
  fine-tuning baselines (3:1 and 5:1 mixtures); reported +21.1 points on
  target subcategories over base and +13.7 over the stronger fine-tune, +2.4
  on RM-Bench; component ablation compares style-only,
  style-orthogonal-only, and joint removal (+16.67 pp joint vs -0.81 and
  +5.32 mean).. Nobody has vouched for it; add support or contest it on this
  page.
