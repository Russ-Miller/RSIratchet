id: condition-reasoning-credit-spatio-temporal-evidence
ref: TEC-0088
label: "Condition reasoning credit on spatio-temporal evidence"
summary: >-
  Require the model to output timestamped audio and visual evidence
  intervals and multiply its answer correctness by a soft
  temporal-plus-semantic evidence score, so ungrounded correct answers earn
  no evidence credit.
description: >-
  Require the model to output timestamped audio and visual evidence
  intervals and multiply its answer correctness by a soft
  temporal-plus-semantic evidence score, so ungrounded correct answers earn
  no evidence credit. Filed by the drafting stage from Video-HolmesV2: Can
  MLLMs Reason with Spatio-Temporal Audio-Visual Evidence in Long Videos?
  (2609.17248) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to three models on 4,000 QA pairs over 784
  videos; separated a 55.1%-accuracy open model (evidence 8.5) from a
  73.1%-accuracy proprietary model (evidence 35.2). No human validation of
  the evidence metric reported.. Nobody has vouched for it; add support or
  contest it on this page.
