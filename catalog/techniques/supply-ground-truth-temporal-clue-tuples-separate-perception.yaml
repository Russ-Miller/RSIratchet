description: >-
  Feed the model human-annotated subject-predicate-object clues with frame
  spans in addition to video and question, bypassing the model's own clue
  extraction, to measure the perception ceiling. Filed by the drafting stage
  from Clue Matters: Leveraging Latent Visual Clues to Empower Video
  Reasoning (2603.15008) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on STAR with and without oracle clues across
  five backbones; gains of about 21-23 points, with ClueNet reaching 94.8%
  and a residual ~5.2% gap concentrated in the Feasibility split requiring
  unobservable commonsense.. Nobody has vouched for it; add support or
  contest it on this page.
