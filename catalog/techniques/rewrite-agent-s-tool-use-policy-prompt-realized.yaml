description: >-
  A separate Policy Agent reads a batch of decision traces paired with
  realized portfolio returns and rewrites the trading agent's whole system
  prompt — tool selection, query formulation, verification and sizing rules
  — before the next batch Filed by the drafting stage from EvolveTrade:
  Experience-Driven Policy Refinement for Self-Evolving LLM Trading Agents
  (2609.17632) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Sharpe ratio, cumulative return, max drawdown, win rate
  and volatility against rule-based baselines (SPY, B&H, MACD, KDJ&RSI, ZMR,
  SMA), a static tool-calling agent, a tool-free evolving agent, and a
  strategy-only evolving agent (ATLAS-style), across six market regimes and
  a 50-day horizon; plus per-day maps of which analytic metrics appear in
  code-interpreter calls.. Nobody has vouched for it; add support or contest
  it on this page.
