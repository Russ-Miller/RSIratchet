description: >-
  Past trajectories are summarized into skill and lesson nodes linked by
  embedding similarity, and a lightweight PPO-trained copilot picks per-task
  how far to diffuse over that graph and how much to weight historical
  utility against semantic Filed by the drafting stage from ExpHarness:
  Model-Agnostic Experience Learning through a Trainable Harness
  (2605.30712) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Weighted average scores against No-Memory, six
  retrieval-centric memory baselines and three LLM-centric retrieval
  baselines: +12.1% and +4.5% relative over the strongest static baseline
  (MemRL) for the small and large executors, +21.4% and +12.7% over S3 on
  agentic tasks, with 12.7-21.6% fewer environment steps than the
  lowest-step baseline; four ablations (similarity filtering, flat pool, no
  diffusion, no utility ranking) all score below the full method.. Nobody
  has vouched for it; add support or contest it on this page.
