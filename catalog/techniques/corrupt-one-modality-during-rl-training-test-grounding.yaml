id: corrupt-one-modality-during-rl-training-test-grounding
ref: TEC-0478
label: "Corrupt one modality during RL training to test grounding"
summary: >-
  Train and evaluate the same RL recipe with blanked images, randomly
  swapped images, or stripped text conditions, and compare against clean
  training to see how much of the gain depends on that modality.
description: >-
  Train and evaluate the same RL recipe with blanked images, randomly
  swapped images, or stripped text conditions, and compare against clean
  training to see how much of the gain depends on that modality. Filed by
  the drafting stage from Understanding the Role of Hallucination in
  Reinforcement Post-Training of Multimodal Reasoning Models (2604.03179)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Measured as paired training runs on three datasets and two model sizes,
  reporting accuracy on four multimodal math benchmarks against both the
  untrained base model and clean GRPO; corrupted training beat the base
  model everywhere and matched or exceeded clean GRPO at 7B.. Nobody has
  vouched for it; add support or contest it on this page.
