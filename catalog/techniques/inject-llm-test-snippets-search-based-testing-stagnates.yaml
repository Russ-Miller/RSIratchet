description: >-
  When an evolutionary test generator makes no fitness progress for 20
  generations, prompt an LLM at class level with self-refinement to write
  test snippets, parse them into the generator's internal representation,
  and merge them into the pop Filed by the drafting stage from Enhancing
  Automated Unit Test Generation for NLP Libraries Using Large Language
  Models (2609.14784) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Median branch coverage 68.60% vs 58.03% for a Java
  re-implementation of CodaMOSA, 53.33% for EvoSuite, 32.64% for LLM-only;
  line coverage 73.49% vs 65.62/57.50/43.00; mutation score 63.0% vs
  52.0/58.0/38.26. Wilcoxon signed-rank p<0.05, A12 0.72-0.85 for coverage
  but only 0.57-0.64 for mutation. Ablations: zero-shot prompting,
  method-level context, single LLM call, MOSA instead of DynaMOSA, and
  LLM-generated string pool only (which fell 1.4% below EvoSuite) all scored
  below the default.. Nobody has vouched for it; add support or contest it
  on this page.
