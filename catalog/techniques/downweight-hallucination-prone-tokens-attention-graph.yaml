summary: >-
  Builds a token-level graph from self-attention weights plus gradient-based
  influence, scores each token's causal contribution, and reduces the
  influence of high-risk nodes during generation.
description: >-
  Builds a token-level graph from self-attention weights plus gradient-based
  influence, scores each token's causal contribution, and reduces the
  influence of high-risk nodes during generation. Filed by the drafting
  stage from Unmasking Hallucinations: A Causal Graph-Attention Perspective
  on Factual Reliability in Large Language Models (2604.04020) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Reported 27.8%
  reduction in hallucination rate and 16.4% improvement in factual accuracy
  on TruthfulQA and HotpotQA against retrieval-augmented generation
  baselines; no ablation, model identity, or variance reported in the
  available text.. Nobody has vouched for it; add support or contest it on
  this page.
