id: rank-sampled-sketch-traces-estimated-causal-effect
ref: TEC-0737
label: "Rank sampled sketch traces by estimated causal effect"
summary: >-
  Sample many short sketch-style reasoning traces at varied temperature,
  cluster their embeddings, build a similarity-ranked in-context prompt per
  cluster representative, and return the answer with the highest
  front-door-estimated causal effe
description: >-
  Sample many short sketch-style reasoning traces at varied temperature,
  cluster their embeddings, build a similarity-ranked in-context prompt per
  cluster representative, and return the answer with the highest
  front-door-estimated causal effe Filed by the drafting stage from
  Debiasing Large Language Models via Adaptive Causal Prompting with
  Sketch-of-Thought (2601.08108) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Accuracy/EM/F1 on GSM8K, MATH, CommonsenseQA,
  StrategyQA, HotpotQA, MuSiQue and FEVER across three backbones against
  ICL, CoT, CoT-SC, SoT, CAD, DeCoT and Causal Prompting; plus average
  reasoning-step counts, an ablation removing causal-effect weighting and
  clustering, and HotpotQA perturbation (noise-injected, shuffled evidence)
  runs.. Nobody has vouched for it; add support or contest it on this page.
