label: "Attribute tool-call failures to the earliest pipeline stage"
summary: >-
  Score each failed tool call by backtracking the observed error label to
  the earliest compatible upstream stage (selection, schema grounding,
  argument binding, feedback handling) using deterministic rules, so
  downstream symptoms are not mist
description: >-
  Score each failed tool call by backtracking the observed error label to
  the earliest compatible upstream stage (selection, schema grounding,
  argument binding, feedback handling) using deterministic rules, so
  downstream symptoms are not mist Filed by the drafting stage from
  ToolRobustBench: Stage-Wise Perturbation Evaluation and Failure Diagnosis
  for Tool-Calling Agents (2608.23635) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Counterfactual repair at the
  attributed stage recovered 71/98 failed instances (100% for single-error
  cases, 82.1% for cascades, 0% for multi-fault); human audit on 30
  ambiguous cases gave 74.2% agreement; boundary-violation rate 0.006 for
  the runtime family despite a 0.638 cascade rate. Labels also predicted
  intervention outcomes on gpt-5.4-mini: aliases fixed A-family failures
  21/30 to 30/30, while S3 chain-of-thought left B-family at 21/30.. Nobody
  has vouched for it; add support or contest it on this page.
