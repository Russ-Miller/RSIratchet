description: >-
  A judge reads the model's exposed reasoning trace and flags structural
  causal faults — unexamined confounders, correlation-intervention
  conflation, unchecked back-door paths — and returns that critique for
  revision, without access to the co Filed by the drafting stage from
  Epistemic Regret Minimization: Label-Free Causal Critique Beyond Outcome
  Reward (2602.11675) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Recovery rate on each model's failed cases across 1,360
  CausalT5K scenarios and six models, against outcome-only reprompting,
  self-consistency, Best-of-N and Self-Refine; GPT-4 Turbo 31.4% to 90.5%
  and GPT-5.2 24.5% to 77.6% (McNemar p<.001), residual rung collapse 4% vs
  55-70% for the test-time baselines; a matched-length non-causal control
  isolated the causal vocabulary for GPT-4 Turbo (58.7% vs 52.8%, p=0.006)
  but not for GPT-5.2 (p=0.093).. Nobody has vouched for it; add support or
  contest it on this page.
