description: >-
  An actor states quality-limiting factors and a rating; a frozen editor
  edits the image according to those factors, a frozen judge scores the
  change, and that change rewards only the reasoning tokens while human
  ratings reward only the ratin Filed by the drafting stage from MR-IQA-2:
  Faithful Image Quality Reflection via Fine-Grained Credit Assignment
  (2608.18579) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean judge-scored quality gain on a 5,866-image subset:
  +0.789 for the trained actor vs +0.213 for Q-Insight and -0.137 for the
  untrained backbone; direction preserved when the editor is swapped
  (Mage-Flow) and when the judge is swapped (Q-Insight, GPT-5.6 Sol, 81.4%
  3AFC win); rating accuracy stayed near the best comparable baselines..
  Nobody has vouched for it; add support or contest it on this page.
