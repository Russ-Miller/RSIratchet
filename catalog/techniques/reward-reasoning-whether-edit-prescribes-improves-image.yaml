label: "Reward reasoning by whether an edit it prescribes improves t"
summary: >-
  An actor states quality-limiting factors and a rating; a frozen editor
  edits the image per that reasoning, a frozen judge scores the change, and
  that change rewards only the reasoning tokens while human ratings reward
  only the rating tokens
description: >-
  An actor states quality-limiting factors and a rating; a frozen editor
  edits the image per that reasoning, a frozen judge scores the change, and
  that change rewards only the reasoning tokens while human ratings reward
  only the rating tokens Filed by the drafting stage from MR-IQA-2: Faithful
  Image Quality Reflection via Fine-Grained Credit Assignment (2608.18579)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Mean judge-scored quality gain on a 5,866-image subset across six IQA
  datasets: +0.789 for the trained actor vs +0.213 for Q-Insight and -0.137
  for the untrained backbone, with direction preserved under a swapped
  editor (Mage-Flow) and two alternative judges including GPT-5.6 Sol (81.4%
  3AFC wins); rating PLCC/SRCC held at 0.838/0.812 average, comparable to
  baselines. Without the credit mask the raw gain was higher (+1.442) but
  collapsed to a single normalized edit, so raw gain alone does not
  establish image-conditioned reasoning.. Nobody has vouched for it; add
  support or contest it on this page.
