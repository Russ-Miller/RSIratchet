id: subtract-shuffled-frame-reward-baseline-normalize-globally
ref: TEC-0579
label: "Subtract a shuffled-frame reward baseline and normalize glob"
summary: >-
  During RL rollout, score each sampled response against the reward of a
  greedy response on the same video with frames shuffled, then normalize
  these calibrated rewards across the entire mini-batch instead of within
  each sampled group.
description: >-
  During RL rollout, score each sampled response against the reward of a
  greedy response on the same video with frames shuffled, then normalize
  these calibrated rewards across the entire mini-batch instead of within
  each sampled group. Filed by the drafting stage from Incentivizing
  Temporal-Awareness in Egocentric Video Understanding Models (2603.27184)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy on EgoSchema (temporal/others splits), EgoPlan, EgoPlan2, VLM4D,
  EgoTempo against GRPO and GSPO baselines trained with identical data and
  hyperparameters; e.g. EgoSchema 49.6 vs 46.5 (GRPO), EgoPlan2 42.3 vs
  37.1, EgoTempo 45.2 vs 40.0; plus reward-AUC over 3000 steps.. Nobody has
  vouched for it; add support or contest it on this page.
