id: mix-reversed-video-rollouts-into-grpo-group
ref: TEC-0151
label: "Mix reversed-video rollouts into the GRPO group"
summary: >-
  During RL post-training of a video MLLM, each sampled group contains
  mostly forward-video responses plus one reversed-video response with the
  same question and answer, so temporal order becomes part of the reward
  signal.
description: >-
  During RL post-training of a video MLLM, each sampled group contains
  mostly forward-video responses plus one reversed-video response with the
  same question and answer, so temporal order becomes part of the reward
  signal. Filed by the drafting stage from COMET: Contrastive
  Motion-Enhanced Temporal Reasoning for Video Multimodal Large Language
  Models (2608.21030) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: From the same Stage I checkpoint on Qwen3-VL-8B with
  group size 7: average accuracy 78.0 for 7+0 standard GRPO vs 78.8 for 6+1,
  78.4 for 5+2, 77.6 for 4+3; also beats reproduced Flow4Agent and TempFlex
  baselines at three scales.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [video-temporal-reasoning]
kind: training
sources: [arxiv-2608-21030]
status: proposed
