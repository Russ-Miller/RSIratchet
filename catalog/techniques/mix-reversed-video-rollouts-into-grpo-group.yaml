id: mix-reversed-video-rollouts-into-grpo-group
ref: TEC-0153
label: "Mix reversed-video rollouts into the GRPO group"
summary: >-
  During RL post-training, each group of sampled responses contains mostly
  forward-video rollouts plus one reversed-video rollout with the same
  question, so correctness reward forces the policy to use directional
  motion cues.
description: >-
  During RL post-training, each group of sampled responses contains mostly
  forward-video rollouts plus one reversed-video rollout with the same
  question, so correctness reward forces the policy to use directional
  motion cues. Filed by the drafting stage from COMET: Contrastive
  Motion-Enhanced Temporal Reasoning for Video Multimodal Large Language
  Models (2608.21030) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: From an identical Stage-I checkpoint (Qwen3-VL-8B),
  average accuracy over six benchmarks: 76.5 before RL, 78.0 with standard
  GRPO (7 forward), 78.8 with 6+1, 78.4 with 5+2, 77.6 with 4+3; forward and
  reversed accuracy tracked over training.. Nobody has vouched for it; add
  support or contest it on this page.
