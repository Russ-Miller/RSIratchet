id: mask-question-token-attention-low-evidence-visual-tokens
ref: TEC-0612
label: "Mask question-token attention to low-evidence visual tokens"
summary: >-
  Aggregate attention from the top-K heads that best align with annotated
  regions, binarize it by suppressing the lowest-magnitude half, and apply
  that mask to question-to-image attention at one mid decoder layer during
  inference.
description: >-
  Aggregate attention from the top-K heads that best align with annotated
  regions, binarize it by suppressing the lowest-magnitude half, and apply
  that mask to question-to-image attention at one mid decoder layer during
  inference. Filed by the drafting stage from How Do Medical MLLMs Fail? A
  Study on Visual Grounding in Medical Images (2603.14323) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Zero-shot accuracy
  on VQA-RAD, SLAKE, PathVQA, PMC-VQA (weighted avg 65.3 to 68.4), MMMU
  Health & Medicine (45.8 to 47.2) and OmniMedVQA across 8 modalities (71.3
  to 74.4), against the unmodified same model and prior medical/general MLLM
  baselines; plus a blinded 5-clinician preference study on 20 cases (76%
  preference) for the attention maps.. Nobody has vouched for it; add
  support or contest it on this page.
