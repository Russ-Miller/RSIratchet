description: >-
  A success-gated metric multiplicatively discounts a completed trajectory
  for tool calls and user-facing turns beyond per-task human reference
  floors, with the two penalty weights fitted from blinded human pairwise
  efficiency preferences via Filed by the drafting stage from RideWay:
  Benchmarking Efficient Task Completion for Tool-Using Language Agents
  (2609.17985) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Held-out task-disjoint pairwise preference prediction:
  78.7% accuracy, Kendall tau_b 0.573, versus 0.773 for equal-cost length,
  0.394 tool-only, 0.925 turn-only at 0.71 coverage; turn-first
  lexicographic tied at 0.800; plus a 10-task listwise check (all tau_b
  positive, mean 0.488) and stability to +/-1-2 floor perturbations.. Nobody
  has vouched for it; add support or contest it on this page.
