label: "Score successful trajectories by excess turns and tool calls"
summary: >-
  A success-gated metric that multiplicatively discounts a passing
  trajectory for tool calls and user-facing turns beyond human-annotated
  per-task reference floors, with the two penalties fit from blinded human
  pairwise efficiency preferences
description: >-
  A success-gated metric that multiplicatively discounts a passing
  trajectory for tool calls and user-facing turns beyond human-annotated
  per-task reference floors, with the two penalties fit from blinded human
  pairwise efficiency preferences Filed by the drafting stage from RideWay:
  Benchmarking Efficient Task Completion for Tool-Using Language Agents
  (2609.17985) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: 78.7% accuracy on task-disjoint held-out human pairwise
  preferences (90.6% when turns differ, 50.0% chance-level when only tool
  calls differ); Kendall tau_b 0.573 pairwise and positive on all 10
  listwise tasks; beats tool-only and equal-cost-length baselines but
  statistically tied with a turn-first lexicographic rule.. Nobody has
  vouched for it; add support or contest it on this page.
