label: "Add a test-time-trained nonlinear memory beside sliding-wind"
summary: >-
  Replaces full attention in a pretrained LLM with a parallel pair of
  sliding-window attention and a nonlinear memory network whose weights are
  updated online by gradient descent on a reconstruction loss, fused by a
  learned per-channel gate a
description: >-
  Replaces full attention in a pretrained LLM with a parallel pair of
  sliding-window attention and a nonlinear memory network whose weights are
  updated online by gradient descent on a reconstruction loss, fused by a
  learned per-channel gate a Filed by the drafting stage from AllMem: A
  Memory-centric Recipe for Efficient Long-context Modeling (2602.13680)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy against the unmodified Qwen3 teacher, sliding-window-plus-sink
  attention, and a Mamba-2 memory variant at matched parameters on LongBench
  (6 subtasks, avg 37k tokens), InfiniteBench and LV-Eval at 128k, plus
  short-sequence benchmarks (C-Eval, MMLU-Redux, MATH-500, LiveCodeBench)
  and measured FLOPs and cache size.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [long-context-degradation]
