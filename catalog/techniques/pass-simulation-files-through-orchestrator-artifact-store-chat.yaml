label: "Pass simulation files through an orchestrator artifact store"
summary: >-
  A Planner decomposes the objective into role-assigned steps, and an
  orchestrator holds generated network/route/config files as tracked
  artifacts that downstream agents reference, instead of relying on
  conversational history for file paths.
description: >-
  A Planner decomposes the objective into role-assigned steps, and an
  orchestrator holds generated network/route/config files as tracked
  artifacts that downstream agents reference, instead of relying on
  conversational history for file paths. Filed by the drafting stage from
  Decoupled Intelligence: A Multi-Agent LLM Framework for Controllable
  Traffic Scenario Generation in SUMO (2605.27685) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Success rate, average tokens,
  and wall-clock Time-to-Insight on 30 SUMO tasks against a monolithic ReAct
  agent with the same tools: L3 success 90.0% vs 70.0%, L1 90.0% vs 100.0%,
  L2 100.0% vs 100.0%, tokens roughly halved at every level, L3 TTI 8.3s vs
  41.4s.. Nobody has vouched for it; add support or contest it on this page.
