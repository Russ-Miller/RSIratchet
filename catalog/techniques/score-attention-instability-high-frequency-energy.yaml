description: >-
  Treat each head's attention over context and prior generated tokens as a
  discrete signal, high-pass filter it (Fourier, wavelet or Laplacian), and
  feed the per-head L2 energy of the high-frequency component into a
  logistic-regression halluc Filed by the drafting stage from Detecting
  Contextual Hallucinations in LLMs with Frequency-Aware Attention
  (2602.18145) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Token- and span-level F1/AUROC on RAGTruth (QA, D2T,
  Summ) and HalluRAG across three models, against SelfCheckGPT, RefChecker,
  EigenScore, ReDeEP, Lookback-Lens, attention-variance and
  attention-entropy; Fourier-high averaged 0.8052/0.8198/0.8532 AUROC vs
  Lookback-Lens 0.7871/0.8031/0.8478; ablation shows high-pass beats
  low-pass and full-spectrum features.. Nobody has vouched for it; add
  support or contest it on this page.
