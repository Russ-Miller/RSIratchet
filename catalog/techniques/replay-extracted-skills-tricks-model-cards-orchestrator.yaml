label: "Replay extracted skills, tricks and model cards to the orche"
summary: >-
  Run the swarm, summarize trajectories into SKILL.md workflow patterns, a
  trick library, and per-backbone model cards, and reinject all three into
  the orchestrator's prompt at inference.
description: >-
  Run the swarm, summarize trajectories into SKILL.md workflow patterns, a
  trick library, and per-backbone model cards, and reinject all three into
  the orchestrator's prompt at inference. Filed by the drafting stage from
  SwarmBench: Can Large Language Models Act as Agent Swarm Orchestrators?
  (2608.30661) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Task accuracy against the same swarm framework without
  experience injection, plus single-agent, Best-of-N, multi-model voting and
  AOrchestra baselines: +6.42 on RCA, +6.46 on LTG, +2.92 on WS, +0.25 on
  MTU; transfer of GPT-5.4-derived experience improved 14 of 16 model-task
  settings; ablation drops -2.49 avg without model cards, -1.75 without
  tricks, -1.22 without skills.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [multi-model-coordination]
