description: >-
  Learns a second discrete latent action code from start-goal end-effector
  point-cloud transitions, shared across embodiments via a unified bimanual
  code, pair-consistent random 3D transforms, and forward/backward
  transition training, and use Filed by the drafting stage from GALA:
  Geometry-Aware Latent Action Modeling for Vision-Language-Action Model
  Pretraining across Embodiments (2609.21948) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Frozen-latent MLP probing of
  end-effector translation/rotation/finger angle error on a held-out XHand
  split; cross-embodiment grasp/hold/release retrieval (R@1 45.67 vs 33.37
  without point clouds, 38.69 without the unification designs); RoboCasa
  GR-1 24-task success (55.7% vs 50.9% image-only, 54.4% without
  unification; 68.3% under multi-embodiment co-training); 4 real tasks, 50
  trials each (75.5% vs 68.5% without unification, 71.5% HARP-VLA).. Nobody
  has vouched for it; add support or contest it on this page.
