description: >-
  Propose anatomical masks with a medical segmentation model, score each by
  the log-likelihood drop of a draft answer under two occlusion operators
  minus an area penalty, and use the top compact mask for
  classifier-free-guidance plus step-wis Filed by the drafting stage from
  Counterfactual Anatomy-guided Spatial-Temporal Decoding for
  Annotation-Free Hallucination Mitigation in Medical VLMs (2608.17427) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Overall/open/closed accuracy on SLAKE and MIMIC-CXR across Phi-3.5V-Med,
  HuatuoGPT-Vision-7B and LLaVA-Med-7B against plain decoding, VCD, DoLA,
  OPERA and GT-mask ARCD; ablations removing the area penalty (-3.4%),
  replacing counterfactual selection with random masks (-4.4%), and using a
  single occlusion mode.. Nobody has vouched for it; add support or contest
  it on this page.
