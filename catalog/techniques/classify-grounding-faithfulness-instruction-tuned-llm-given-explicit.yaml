description: >-
  Serialize context, prompt and response into a prompt that first states the
  task and the three hallucination label definitions with worked examples,
  then LoRA-fine-tune a 4B instruction model to emit the label. Filed by the
  drafting stage from DSC2025 -- ViHallu Challenge: Detecting Hallucination
  in Vietnamese LLMs (2601.04711) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Private test macro-F1 of 84.80% for a single
  LoRA-tuned Qwen3-4B-Instruct against a fine-tuned PhoBERT encoder baseline
  at 32.83% on the same 2,000-sample private split.. Nobody has vouched for
  it; add support or contest it on this page.
