description: >-
  Seeds retrieval with query-similar knowledge triplets, iteratively merges
  adjacent triplets into beam-pruned 'HyperNode' reasoning paths, then
  scores source passages by a precomputed triple-to-passage index weighted
  by path distance, backfi Filed by the drafting stage from HELP: HyperNode
  Expansion and Logical Path-Guided Evidence Localization for Accurate and
  Efficient GraphRAG (2602.20926) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Token-level F1 on NQ, PopQA, MuSiQue, 2Wiki,
  HotpotQA, LV-Eval against HippoRAG2, LinearRAG, HyperGraphRAG, NV-Embed-v2
  and BM25/GTR under HippoRAG2's protocol (avg F1 55.3 vs 54.6 for
  HippoRAG2), plus retrieval latency for 1,000 queries (16.5x-28.8x faster
  than HippoRAG2); ablations over context quota M, expansion hops N, beam
  size, and a second backbone.. Nobody has vouched for it; add support or
  contest it on this page.
