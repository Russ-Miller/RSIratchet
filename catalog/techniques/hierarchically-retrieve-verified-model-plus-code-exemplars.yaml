description: >-
  Builds a curated library of optimization instances each carrying a
  verified mathematical model and executable solver code, annotated with
  problem class and subproblem type, then retrieves per query by
  embedding-plus-MMR filtering followed b Filed by the drafting stage from
  MIRROR: A Multi-Agent Framework with Iterative Adaptive Revision and
  Hierarchical Retrieval for Optimization Modeling in Operations Research
  (2602.03318) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation of pass@1 across five benchmarks: full system
  71.88 macro average vs 67.90 without retrieval, 71.14 without the revision
  loop, 65.82 without both; error decomposition shows average compile-error
  rate falling from 8.06% to 2.60% with revision alone and wrong-answer rate
  rising more when retrieval is removed.. Nobody has vouched for it; add
  support or contest it on this page.
