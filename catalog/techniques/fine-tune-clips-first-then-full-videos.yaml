id: fine-tune-clips-first-then-full-videos
ref: TEC-0487
label: "Fine-tune on clips first, then full videos"
summary: >-
  Two-stage supervised fine-tuning that first teaches per-clip inconsistency
  detection and category, then continues on long videos for multi-event
  temporal localization and reasoning.
description: >-
  Two-stage supervised fine-tuning that first teaches per-clip inconsistency
  detection and category, then continues on long videos for multi-event
  temporal localization and reasoning. Filed by the drafting stage from
  AVID: A Benchmark for Omni-Modal Audio-Visual Inconsistency Understanding
  via Agent-Driven Construction (2604.13593) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Ablation on four arms (base,
  segment-only, full-video-only, two-stage): segment-only moved full-video
  R@0.5 from 8.3% to 4.6%; full-video-only moved segment classification from
  55.0% to 51.2%; two-stage reached R@0.5 39.2%, mIoU 36.1% and segment
  detection 61.3%, above the best compared model's mIoU of 26.2%.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [video-temporal-reasoning]
kind: training
sources: [arxiv-2604-13593]
status: proposed
