label: "Verbalized confidence after listing alternatives"
summary: >-
  Prompt the model to produce several candidate answers and then state a
  numeric confidence for each, and use the stated number rather than token
  log-probabilities as the confidence signal for deferral or abstention.
description: >-
  Prompt the model to produce several candidate answers and then state a
  numeric confidence for each, and use the stated number rather than token
  log-probabilities as the confidence signal for deferral or abstention.
  Filed by the drafting stage from Just Ask for Calibration: Strategies for
  Eliciting Calibrated Confidence Scores from Language Models Fine-Tuned
  with Human Feedback (2305.14975) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Expected calibration error, Brier
  score and selective accuracy on TriviaQA, SciQ and TruthfulQA comparing
  raw log-probabilities, verbalized numbers, verbalized words and
  multi-candidate prompting across five RLHF models; chain-of-thought
  variant tested and found not to help.. Nobody has vouched for it; add
  support or contest it on this page.
