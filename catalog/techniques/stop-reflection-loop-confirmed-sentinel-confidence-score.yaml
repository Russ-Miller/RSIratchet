id: stop-reflection-loop-confirmed-sentinel-confidence-score
ref: TEC-0214
label: "Stop a reflection loop on a CONFIRMED sentinel, not a confid"
summary: >-
  Run the critique-revise loop until the critique emits a fixed CONFIRMED
  token or a depth cap is hit, instead of halting on the model's
  self-reported numeric confidence.
description: >-
  Run the critique-revise loop until the critique emits a fixed CONFIRMED
  token or a depth cap is hit, instead of halting on the model's
  self-reported numeric confidence. Filed by the drafting stage from
  Training-Free Inference-Time Self-Reflection and Cost-Bounded Early
  Stopping for Large Language Models (2608.18884) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: On BBH (n=500) the sentinel
  stopped 82-88% of items at ~2.1 generations with accuracy inside the
  always-loop Wilson interval, and a confusion matrix put correct
  self-assessment at 78%; a sweep of confidence thresholds 0.6-0.9 halted
  every item at the first generation, so the numeric tag gave no selective
  stopping point. Fixed-depth Self-Refine scored lower on BBH (71.2% vs
  74.0%).. Nobody has vouched for it; add support or contest it on this
  page.
