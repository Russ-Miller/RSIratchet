id: mask-decoding-input-tokens-then-reject-ast-similarity
ref: TEC-0735
label: "Mask decoding to input tokens, then reject on AST-similarity"
summary: >-
  At each decoding step set the logit of any token absent from the input
  code to minus infinity, and at each completed statement boundary kill the
  beam path if tree-similarity edit distance to the input AST stops
  increasing.
