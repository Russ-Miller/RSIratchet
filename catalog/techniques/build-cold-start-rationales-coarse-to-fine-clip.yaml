id: build-cold-start-rationales-coarse-to-fine-clip
ref: TEC-0466
label: "Build cold-start rationales by coarse-to-fine clip localizat"
summary: >-
  Segment a video into clips, build a tree over them, select the clips
  needed for the question, and summarize the root-to-leaf backtracking path
  into a step-by-step 'progressively locate the cue' rationale used for
  supervised fine-tuning.
description: >-
  Segment a video into clips, build a tree over them, select the clips
  needed for the question, and summarize the root-to-leaf backtracking path
  into a step-by-step 'progressively locate the cue' rationale used for
  supervised fine-tuning. Filed by the drafting stage from Video-ToC: Video
  Tree-of-Cue Reasoning (2604.20473) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared against the same pipeline
  producing single-step cue rationales (Video-SingleCue-SFT-1k): MMVU 65.3
  vs 61.8, MVBench 63.3 vs 61.0, VideoMME 56.6 vs 54.5, baseline
  59.2/57.4/53.1; and against Video-R1-SFT on six benchmarks. Hallucination
  compared on VideoHallucer: baseline 50.5, Video-R1 45.4, Video-ToC 51.9..
  Nobody has vouched for it; add support or contest it on this page.
