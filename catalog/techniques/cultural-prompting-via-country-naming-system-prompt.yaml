label: "Cultural prompting via a country-naming system prompt"
summary: >-
  State the target country in the system prompt so the model answers
  survey-style questions as a member of that culture; measured as reduced
  distance to the country's Hofstede profile.
description: >-
  State the target country in the system prompt so the model answers
  survey-style questions as a member of that culture; measured as reduced
  distance to the country's Hofstede profile. Filed by the drafting stage
  from The American Ghost in the Machine: How language models align
  culturally and the effects of cultural prompting (2512.12488) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Hofstede-dimension
  distance before and after prompting for six countries across eight models;
  seven of eight moved closer, gains 11-22% by country, Japan and China
  least matched.. Nobody has vouched for it; add support or contest it on
  this page.
