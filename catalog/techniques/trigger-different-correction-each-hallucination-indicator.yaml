description: >-
  During decoding it monitors visual-attention entropy and output-image
  correlation per layer and step, and when either crosses a threshold
  applies the matching fix — hidden-state contrast against a
  descriptive-prompt path for attention drift Filed by the drafting stage
  from DICA: Dual-Indicator Guided Contrastive Alignment in Multimodal Large
  Language Models (2607.23944) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: POPE accuracy/F1 across three sampling splits and
  three source datasets against VCD, OPERA, M3ID, AvisC, MoD; CHAIR_s 41.8 /
  CHAIR_i 11.5 on LLaVA-1.5 (best among baselines); MME total 661.5 / 648.3;
  ablations removing each module drop scores, with the attention-entropy
  module costing more; a transition table reports 37.4% of triggered wrong
  answers repaired against 1.5% of correct answers broken.. Nobody has
  vouched for it; add support or contest it on this page.
