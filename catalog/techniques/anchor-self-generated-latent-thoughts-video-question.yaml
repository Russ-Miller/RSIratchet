description: >-
  During decoding the model emits a short run of continuous hidden states
  instead of tokens, each one re-injected with cross-attended video and
  question features, and trained with contrastive
  latent-video/latent-question alignment plus divers Filed by the drafting
  stage from VideoLatent: Video-Language Learning via Latent Self-Forcing
  (2606.22870) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on 14 video benchmarks against the same
  backbone, CoT-trained video models (Video-R1, Open-o3-Video, OneThinker,
  VideoRFT) and latent-reasoning baselines (Monet, LVR, Mull-Token) under
  matched frames and resolution; ablations removing each loss term and each
  injected feature stream; latent-step sweep on LongVideoBench.. Nobody has
  vouched for it; add support or contest it on this page.
