description: >-
  A benchmark of five context-dependent task types (tool-name selection,
  parameter filling, conditional branching, functional calculation, explicit
  delegation) paired with context-aware attacks whose payloads are coupled
  to the runtime observ Filed by the drafting stage from The Landscape of
  Prompt Injection Threats in LLM Agents: From Taxonomy to Analysis
  (2602.10453) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Eight defenses scored on attack success rate, agent
  utility, and time/token cost; execution-level defenses reached up to ~3x
  baseline cost or refused early, text-level defenses were cheap but weak,
  and no defense achieved trustworthiness, utility and low latency
  together.. Nobody has vouched for it; add support or contest it on this
  page.
