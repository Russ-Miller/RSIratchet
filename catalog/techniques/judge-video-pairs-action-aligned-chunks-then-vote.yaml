id: judge-video-pairs-action-aligned-chunks-then-vote
ref: TEC-0302
label: "Judge video pairs in action-aligned chunks, then vote"
summary: >-
  Decompose a paired video comparison into chunks of four consecutive
  actions, judge each chunk's action consistency and visual quality from a
  six-image structured evidence panel, and aggregate chunk verdicts by
  voting into video-level prefer
description: >-
  Decompose a paired video comparison into chunks of four consecutive
  actions, judge each chunk's action consistency and visual quality from a
  six-image structured evidence panel, and aggregate chunk verdicts by
  voting into video-level prefer Filed by the drafting stage from
  WorldReward: Reward Modeling for Camera-Conditioned World Models
  (2609.03952) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Three-way agreement (incl. Tie) with majority human
  labels on 760 pairs: 77.63/81.32/73.03 on action/appearance/motion vs
  GPT-5.5 at 74.21/79.87/69.47 and Gemini 3.1 Pro at 65.79/80.13/60.79;
  ablations removing source image, frame grid or action panels each lower
  average agreement by about 1.3-2.5 points; used as RL reward it beat
  WorldCompass's split geometry+image rewards on action adherence and HPSv3
  in all six horizon settings.. Nobody has vouched for it; add support or
  contest it on this page.
