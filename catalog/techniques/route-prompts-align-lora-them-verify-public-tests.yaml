label: "Route prompts, align LoRA to them, verify on public tests"
summary: >-
  Picks a task-specific prompt template by keyword heuristics, fine-tunes a
  LoRA adapter on training inputs rewritten into that same template style,
  then samples several programs and returns the one passing the most visible
  public tests.
description: >-
  Picks a task-specific prompt template by keyword heuristics, fine-tunes a
  LoRA adapter on training inputs rewritten into that same template style,
  then samples several programs and returns the one passing the most visible
  public tests. Filed by the drafting stage from Route-Align-Verify for
  Functional Correctness in Code Generation (2608.03341) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: pass@1 on MBPP:
  base 0.8276/0.7528 (sanitized/full) vs full pipeline 0.8911/0.8520;
  Route+Align without verification only 0.8366/0.7640; repeated 120-task
  subsets gave a 95% CI of [0.0250,0.1417] on Full and [-0.0194,0.0722] on
  Sanitized; Jaccard contamination check found zero overlap.. Nobody has
  vouched for it; add support or contest it on this page.
