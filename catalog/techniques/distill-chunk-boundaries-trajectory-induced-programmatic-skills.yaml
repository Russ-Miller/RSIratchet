  target, and train the primi Filed by the drafting stage from Act More,
  Decide Less: Skill-Guided Adaptive Action Chunking for Long-Horizon LLM
  Agents (2609.02042) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rate and average LLM decision rounds on ALFWorld
  and ScienceWorld seen/unseen splits against zero-shot, ReAct, Reflexion,
  RLOO, GRPO, GiGPO and a variable-length multi-action GRPO under a matched
  rollout budget: ALFWorld 96.1/94.5 vs 89.1/83.6 for GiGPO at 5.0/5.2
  rounds; ScienceWorld 67.2/61.7 vs 35.9/34.4; ablations removing skills
  (86.7/88.3) or chunk-aware advantage (90.6/89.1) each lose part of the
  gain.. Nobody has vouched for it; add support or contest it on this page.
