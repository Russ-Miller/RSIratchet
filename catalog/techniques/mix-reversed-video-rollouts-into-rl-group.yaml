id: mix-reversed-video-rollouts-into-rl-group
ref: TEC-0151
label: "Mix reversed-video rollouts into the RL group"
summary: >-
  During GRPO, sample most rollouts on the forward video and a small
  minority on the time-reversed video in the same group, so temporal order
  becomes part of the reward-driven exploration.
description: >-
  During GRPO, sample most rollouts on the forward video and a small
  minority on the time-reversed video in the same group, so temporal order
  becomes part of the reward-driven exploration. Filed by the drafting stage
  from COMET: Contrastive Motion-Enhanced Temporal Reasoning for Video
  Multimodal Large Language Models (2608.21030) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Optimization ablation from an
  identical Stage-I checkpoint on Qwen3-VL-8B: average accuracy 76.5 (no
  RL), 78.0 standard GRPO (7+0), 78.8 at 6+1, 78.4 at 5+2, 77.6 at 4+3;
  gains concentrated on action tasks, with PerceptionTest slightly below the
  BL-GRPO baseline.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [video-temporal-reasoning]
