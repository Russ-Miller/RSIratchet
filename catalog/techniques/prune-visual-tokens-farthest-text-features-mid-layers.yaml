id: prune-visual-tokens-farthest-text-features-mid-layers
ref: TEC-0347
label: "Prune visual tokens farthest from text features at mid layer"
summary: >-
  At a selected intermediate LLM layer, score each visual token by its
  minimum negative attention to the last 50% of text tokens and drop the top
  r% most distant ones as out-of-distribution, training-free.
description: >-
  At a selected intermediate LLM layer, score each visual token by its
  minimum negative attention to the last 50% of text tokens and drop the top
  r% most distant ones as out-of-distribution, training-free. Filed by the
  drafting stage from Visual Token Compression Enhances Robustness of MLLMs
  (2607.22716) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average refuse-to-answer rate on three jailbreak
  benchmarks rose from 20.38% to 33.67% and harmless-output rate from 39.97%
  to 50.09% on Qwen-2.5-VL, above four prior visual-token-compression
  baselines; HallusionBench accuracy 59.73% to 60.48%; MME
  perception/cognition slightly above vanilla, OCRBench lower (861 to 753);
  ablations against pruning smallest-distance and random tokens.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [jailbreak-robustness]
kind: decoding
sources: [arxiv-2607-22716]
status: proposed
