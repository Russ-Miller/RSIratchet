id: score-counseling-judges-best-of-n-pairwise
ref: TEC-0594
label: "Score counseling judges by Best-of-N, not pairwise"
summary: >-
  Evaluates a reward model by whether it ranks the clinically grounded
  response above all four subtly-flawed distractors, rather than above a
  single rejected response.
description: >-
  Evaluates a reward model by whether it ranks the clinically grounded
  response above all four subtly-flawed distractors, rather than above a
  single rejected response. Filed by the drafting stage from PRMB:
  Benchmarking Reward Models in Long-Horizon CBT-based Counseling Dialogue
  (2603.11494) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Benchmark rankings from this protocol correlated with
  downstream Best-of-16 selection quality (BERTScore against reference
  counselor responses, pooled over four policy models) at Spearman 0.700
  (p~0.036), above RewardBench2's 0.633 (p~0.067).. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [critique]
kind: process
