id: supply-expert-authored-plan-executor-agent
ref: TEC-0596
label: "Supply an expert-authored plan to the executor agent"
summary: >-
  Decouple planning from execution by giving the ReAct executor a
  human-written, policy-grounded step-by-step plan instead of letting it
  plan itself.
description: >-
  Decouple planning from execution by giving the ReAct executor a
  human-written, policy-grounded step-by-step plan instead of letting it
  plan itself. Filed by the drafting stage from EnterpriseOps-Gym:
  Environments and Evaluations for Stateful Agentic Planning and Tool Use in
  Enterprise Settings (2603.13594) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Pass@1 on CSM, ITSM and HR for
  Kimi-K2, Qwen3-30B and Qwen3-4B against the same models' ReAct baselines
  and against plans auto-generated by Claude Sonnet 4.5: human plans gained
  14-35 points versus 5-13 for model-generated plans.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [planning]
kind: prompting
sources: [arxiv-2603-13594]
status: proposed
