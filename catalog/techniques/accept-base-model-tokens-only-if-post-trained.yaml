description: >-
  At each reasoning turn, the pre-post-training base model generates
  single-step grounding-verification or answer prefixes, and the
  post-trained search model accepts those tokens in parallel only where a
  weighted product of both models' token Filed by the drafting stage from
  Self-Prophetic Decoding to Unlock Visual Search in LVLMs (2605.28741) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  on 12 splits of 4 visual-search benchmarks (VisualProbe-test, V* Bench,
  HR-Bench 4K/8K) against the unmodified post-trained baselines (gains +0.5
  to +4.4 points) and on MME-RealWorld, ScienceQA, OCRBench, CVBench;
  ablated against a naive prompting interface (46.2 vs 50.5 on VisualProbe
  hard), against removing each of the two prophet modes, and across
  thresholds 0.2-0.35; acceptance rate 74-81%, speedup 1.03-1.07x.. Nobody
  has vouched for it; add support or contest it on this page.
