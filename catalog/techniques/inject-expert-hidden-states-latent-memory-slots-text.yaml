  StsScore and GPT-4o rubric scores on held-out test sets of two
  private-domain benchmarks against Base-Model-Only, RAG/GraphRAG/xRAG,
  Prompt-Tuning, LoRA SFT and BLADE; general-domain EM over six open QA
  sets; ablations on the three training stages and slot count (4 best);
  efficiency measured as added tokens, TFLOPs and latency per query.. Nobody
