id: inject-expert-hidden-states-latent-memory-slots-text
ref: TEC-0713
label: "Inject expert hidden states as latent memory slots, not text"
summary: >-
  A small domain-adapted expert generates background for the query; its
  multi-layer hidden states are compressed into a fixed number of slots,
  fused per slot across layers, projected through a gated residual into the
  frozen base model's embed
