label: "Fuse frame- and clip-level similarity, then adapt the query "
summary: >-
  Compute query-video cosine similarities at both frame and sliding-window
  clip granularity, project clip scores onto the frame timeline with a
  triangular kernel and mix them with a fixed weight, and separately
  optimize a single additive offs
description: >-
  Compute query-video cosine similarities at both frame and sliding-window
  clip granularity, project clip scores onto the frame timeline with a
  triangular kernel and mix them with a fixed weight, and separately
  optimize a single additive offs Filed by the drafting stage from DSE-VTG:
  Dual-Side Enhancement for Training-Free Video Temporal Grounding
  (2609.08850) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Charades-STA mIoU 51.30 vs 45.69 for the strongest prior
  training-free method (TAG), and vs 45.41/44.03 when TAG/TFVTG are re-run
  on the same backbone; QVHighlights 38.64 mAP vs 33.15. Component ablation:
  45.69 base, 47.06 with Q-TTA only, 50.25 with MSF only, 51.30 both.
  Granularity ablation on the same backbone: frame-only 47.06, clip-only
  42.82, fused 51.30. Also OOD splits Charades-CG and Charades-CD.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [video-temporal-reasoning]
