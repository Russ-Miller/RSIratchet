  visual-token hidden-state readouts, cache it, and at decoding apply a
  bounded logit penalty to candidates whose pooled rank evidence falls below
  a token-specific refer
description: >-
  At prefill, aggregate each vocabulary token's reciprocal rank across all
  visual-token hidden-state readouts, cache it, and at decoding apply a
  bounded logit penalty to candidates whose pooled rank evidence falls below
  a token-specific refer Filed by the drafting stage from ReWEIGH the
  Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate
  Hallucinations in Large Vision-Language Models (2608.19075) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_I
  hallucinated-object rate on four 7B backbones fell by up to 21.3% with
  descriptive and general multimodal scores largely preserved or improved;
  reductions reported across 11 models from six families up to 32B; 1.33%
  average added latency per token. Token-specific references cut held-out
  calibration error by 91-92% versus a single global reference and beat all
  1,000 random token-to-reference reassignments. Rank-derived suppression
  strengths unchanged under position-wise rescaling, while
  probability-derived ones shifted by ~0.045.. Nobody has vouched for it;
  add support or contest it on this page.
