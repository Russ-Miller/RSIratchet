  Demystifying LLM-based Software Engineering Agents (2407.01489) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Contains-ground-truth rate after each localization step on SWE-bench Lite
  with GPT-4o (file-level 78.7% prompting, 67.7% embedding, 81.7% combined),
  and end-to-end resolve rate and cost against contemporaneous open-source
  agents; no comparison against a tool-using agent given the same
  localization.. Nobody has vouched for it; add support or contest it on
  this page.
