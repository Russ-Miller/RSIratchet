id: supervise-abstention-evidence-ablated-inputs
ref: TEC-0129
label: "Supervise abstention on evidence-ablated inputs"
summary: >-
  Fine-tune a verifier on paired inputs — full context with the gold label
  and evidence, and the same context with gold evidence removed and target
  NOT_ENOUGH_INFO — with gold evidence sets first expanded by majority vote
  of three other LLMs.
description: >-
  Fine-tune a verifier on paired inputs — full context with the gold label
  and evidence, and the same context with gold evidence removed and target
  NOT_ENOUGH_INFO — with gold evidence sets first expanded by majority vote
  of three other LLMs. Filed by the drafting stage from Evaluating and
  Improving Evidence-Grounded Fact-Checking in LLMs via Multi-Round Evidence
  Ablation (2609.08943) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Measured on four datasets against the base model and
  standard SFT: Immediate Sensitivity on FEVER rose from 10.75 (SFT) to
  99.06, label accuracy 83.08 to 95.66 over Llama-3.1-8B; ablations show
  evidence ablation drives grounding metrics and evidence enhancement drives
  accuracy; replicated on Qwen-2.5-7B. Hidden-state probes show reduced
  drift toward the no-evidence representation.. Nobody has vouched for it;
  add support or contest it on this page.
