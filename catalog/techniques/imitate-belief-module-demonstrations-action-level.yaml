description: >-
  Fine-tunes a VLM on per-timestep motor and expression actions recorded
  from a hybrid architecture with an explicit theory-of-mind module. Filed
  by the drafting stage from Belief Without Behavior: Measuring the
  Translation of Theory of Mind into Coordinated Social Action in
  Vision-Language Models (2608.20975) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared fine-tuned InternVL-8B/14B
  against their base models on ToM Outcome Conformance Score and on
  trajectory, gaze, expressivity and signal-sensitivity metrics across four
  conditions; cooperative outcomes declined, 14B trajectory alignment turned
  negative, signal sensitivity stayed negative throughout.. Nobody has
  vouched for it; add support or contest it on this page.
