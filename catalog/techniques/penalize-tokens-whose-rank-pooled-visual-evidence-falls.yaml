description: >-
  At prefill, project every visual-token hidden state through the output
  head, pool each vocabulary item's reciprocal ranks across visual positions
  into a cached image-level score, and at each decoding step apply a bounded
  logit penalty to ca Filed by the drafting stage from ReWEIGH the Evidence:
  Calibrating Token-Level Ordinal Visual Evidence to Mitigate Hallucinations
  in Large Vision-Language Models (2608.19075) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: CHAIR-I hallucinated object
  mentions fell by up to 21.3% on four 7B backbones with descriptive and
  general multimodal scores largely preserved; reductions extended to 11
  models across six families up to 32B; 1.33% average added latency per
  token. Supporting ablations: rank-derived suppression strengths unchanged
  under order-preserving position rescaling while probability-derived ones
  shifted by ~0.045; token-specific medians cut held-out calibration error
  91-92% versus a global reference and beat all 1,000 random token-reference
  reassignments.. Nobody has vouched for it; add support or contest it on
  this page.
