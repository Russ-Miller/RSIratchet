id: penalize-tokens-whose-rank-pooled-visual-evidence-falls
ref: TEC-0156
label: "Penalize tokens whose rank-pooled visual evidence falls belo"
summary: >-
  During prefill, pool each candidate token's reciprocal vocabulary rank
  across all visual-token positions into one cached image-level evidence
  score, and at each decoding step apply a bounded logit penalty when that
  score falls below a token
description: >-
  During prefill, pool each candidate token's reciprocal vocabulary rank
  across all visual-token positions into one cached image-level evidence
  score, and at each decoding step apply a bounded logit penalty when that
  score falls below a token Filed by the drafting stage from ReWEIGH the
  Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate
  Hallucinations in Large Vision-Language Models (2608.19075) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_I
  hallucinated object mentions fell by up to 21.3% on four 7B backbones,
  with reductions reported across 11 models from six families up to 32B,
  while descriptive and general multimodal scores were largely preserved or
  improved; added latency 1.33% per token. Internal ablations: rank-derived
  suppression strengths unchanged under position-scale reassignment while
  probability-derived ones shifted by ~0.045; token-specific references cut
  held-out calibration error ~92%/91% versus a global reference and beat all
  1,000 random token-to-reference reassignments.. Nobody has vouched for it;
  add support or contest it on this page.
addresses: [visual-grounding]
