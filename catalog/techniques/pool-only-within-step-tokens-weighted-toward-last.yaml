id: pool-only-within-step-tokens-weighted-toward-last
ref: TEC-0742
label: "Pool only within-step tokens, weighted toward the last"
summary: >-
  Builds the step-level probe input by exponentially up-weighting later
  tokens within the current reasoning step and L2-normalizing, instead of
  summing or averaging hidden states over the whole prefix.
description: >-
  Builds the step-level probe input by exponentially up-weighting later
  tokens within the current reasoning step and L2-normalizing, instead of
  summing or averaging hidden states over the whole prefix. Filed by the
  drafting stage from Streaming Hallucination Detection in Long
  Chain-of-Thought Reasoning (2601.02170) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Step-level probe AUC/ACC/F1 against
  LLM-annotated step hallucination labels on three base models, versus TTPD,
  SAPLMA and a global-mean aggregation baseline trained with identical
  supervision (AUC 87.8 vs 82.3 on LLaMA, 86.7 vs 81.0 on Qwen, 93.3 vs 90.4
  on DeepSeek).. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [hallucination]
kind: architecture
