description: >-
  Under a fixed compute budget, repeatedly feed the current image and prompt
  to a VLM critic that emits a targeted sub-prompt and an action (continue,
  backtrack, restart, stop), applying each edit to the previous image rather
  than drawing ind Filed by the drafting stage from Iterative Refinement
  Improves Compositional Image Generation (2601.15286) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Compute-matched comparison
  against parallel sampling with the same verifier on ConceptMix (+16.9
  all-correct at k=7 for Qwen-Image), T2I-CompBench 3D-Spatial (+13.8),
  TIIF-Bench, and Visual Jenga full solve rate (64.29% to 76.79%); human
  preference 58.7% vs 41.3%; budget allocation ablation across B=1..16 and
  an action-space ablation.. Nobody has vouched for it; add support or
  contest it on this page.
