description: >-
  Splits a clinical severity prediction into a symptom-extraction agent, a
  RAG agent retrieving DSM-5-style criteria, a chain-of-thought reasoning
  agent, and an audit agent that cross-checks the rationale against the
  original transcript befor Filed by the drafting stage from A Multi-Agent
  Audit Framework for High-Stakes Reasoning: Evaluation and Interpretability
  in Clinical Mental Health Screening (2606.21123) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: MAE on 37 held-out DAIC-WOZ
  test sessions over three seeds against single-agent and CoT prompting
  (5.42/5.18/5.02 for Qwen2.5), with ablations removing each agent (+0.17 to
  +0.29 MAE); interpretability and hallucination figures come from the
  authors' own rubric with no stated annotator protocol.. Nobody has vouched
  for it; add support or contest it on this page.
