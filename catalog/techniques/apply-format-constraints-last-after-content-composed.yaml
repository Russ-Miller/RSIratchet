id: apply-format-constraints-last-after-content-composed
ref: TEC-0245
label: "Apply format constraints last, after content is composed"
summary: >-
  Generate content against decomposed subsets of content constraints first,
  aggregate the results, and only then reformat the aggregate to satisfy the
  structural constraints.
description: >-
  Generate content against decomposed subsets of content constraints first,
  aggregate the results, and only then reformat the aggregate to satisfy the
  structural constraints. Filed by the drafting stage from OmniCap-IF:
  Benchmarking and Improving Instruction Following Abilities for Omni-Video
  Captioning (2606.08572) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: On 500 sampled training triplets, checklist-based
  evaluation preferred the decomposed-and-aggregated responses to
  single-pass direct generation in 96.3% of cases; fine-tuning on the
  resulting 54K set lifted Qwen2.5-Omni-7B format CSR from 62.97 to 90.39
  and content CSR from 41.27 to 59.43.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [procedure-following]
