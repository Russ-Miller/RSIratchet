  Event-Conditioned Time-Series Prediction (2609.24677) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Applied to ten
  models; shows citation rates near 100% alongside CSDR under 22% on traffic
  series-side pairs, and separates endpoint correctness from pair
  consistency; no independent human check of the faithfulness metric
  itself.. Nobody has vouched for it; add support or contest it on this
  page.
