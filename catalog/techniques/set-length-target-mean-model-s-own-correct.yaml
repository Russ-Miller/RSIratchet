id: set-length-target-mean-model-s-own-correct
ref: TEC-0490
label: "Set the length target from the mean of the model's own corre"
summary: >-
  During RL, compute a per-prompt target length as the mean token length of
  that prompt's correct rollouts and give a symmetric reward that penalizes
  both longer and shorter responses, instead of using a global token budget.
description: >-
  During RL, compute a per-prompt target length as the mean token length of
  that prompt's correct rollouts and give a symmetric reward that penalizes
  both longer and shorter responses, instead of using a global token budget.
  Filed by the drafting stage from LEAD: Length-Efficient Adaptive and
  Dynamic Reasoning for Large Language Models (2605.09806) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Aggregator
  ablation on DeepSeek-R1-Distill-Qwen-1.5B: mean-of-correct reached 53.36
  average accuracy and 0.68 Accuracy-Efficiency Score, versus min-of-correct
  49.99/0.36, median-of-correct 50.13/0.34, and mean-of-all-rollouts
  51.47/0.58; training curves show min's own correct rollouts plateau below
  the efficiency reward the others reach.. Nobody has vouched for it; add
  support or contest it on this page.
