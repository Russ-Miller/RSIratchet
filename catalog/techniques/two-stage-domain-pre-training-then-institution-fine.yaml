description: >-
  Pre-train the model on a large financial corpus (filings, research
  reports, standards, market series) with a loss penalizing valuations
  inconsistent with disclosed metrics, then LoRA fine-tune on the deploying
  institution's investment memos Filed by the drafting stage from Frontiers
  in FinTech: Multimodal Foundation Models for Financial Reporting and
  Decision Science (2608.22724) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Mean absolute error and RMSE of target price
  versus analyst consensus on 200 companies, plus direction accuracy of
  Buy/Hold/Sell against consensus revision within 90 days: MAE 13.1% versus
  16.2% for the analyst-input DCF spreadsheet, 18.7% for single-stage
  FinGPT, 24.3% for GPT-4 zero-shot.. Nobody has vouched for it; add support
  or contest it on this page.
