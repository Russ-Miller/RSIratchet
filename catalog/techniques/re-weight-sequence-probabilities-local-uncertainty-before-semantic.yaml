description: >-
  Estimates how unstable each generation's sequence probability is under
  perturbation of a quantum tensor-network Hamiltonian whose eigenmode is
  the kernel embedding of those probabilities, then solves a per-sequence
  entropy-maximization with Filed by the drafting stage from Semantic
  Uncertainty Quantification of Hallucinations in LLMs: A Quantum Tensor
  Network Based Method (2601.20026) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: AUROC and AURAC pairwise win rates
  over 116 experiment cells spanning 4 datasets, 8 models and 3 quantization
  levels, against naive entropy, semantic entropy, discrete semantic
  entropy, supervised embedding regression and p(True); the adjusted variant
  wins or matches on both metrics throughout, but no absolute per-dataset
  numbers are given in the summary and no confidence intervals are
  reported.. Nobody has vouched for it; add support or contest it on this
  page.
