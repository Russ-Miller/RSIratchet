id: distill-reasoning-strategies-from-self-judged-trajectories
ref: TEC-0085
label: "Bank a distilled strategy from each self-judged attempt"
summary: >-
  After each task, have the model judge its own trajectory as success or
  failure, distill a short reusable strategy from it either way, and
  retrieve relevant strategies before the next attempt.
description: >-
  Three steps per task: retrieve strategies relevant to the new task from
  the store before acting; after acting, judge the trajectory success or
  failure with an LLM (no ground truth used); extract a short
  natural-language strategy from it regardless of outcome, and
  consolidate it into the store, where it can be retrieved for later
  tasks. Memory-aware test-time scaling (MaTTS) samples several
  trajectories for one task before this extraction step, so the strategy
  is written from a contrast between attempts rather than from one run.
addresses: [long-term-memory, harness-self-improvement]
ratchet_role: persistence
kind: process
sources: [arxiv-2509-25140]
status: proposed
