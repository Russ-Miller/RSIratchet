id: group-clips-into-narrative-memory-slots-then-retrieve
ref: TEC-0698
label: "Group clips into narrative memory slots, then retrieve"
summary: >-
  An MLLM assigns each clip to a narrative slot by temporal coherence and
  semantic similarity, and query-clip CLIP scores are boosted by the score
  of the slot the clip belongs to before top-k retrieval for the answering
  model.
description: >-
  An MLLM assigns each clip to a narrative slot by temporal coherence and
  semantic similarity, and query-clip CLIP scores are boosted by the score
  of the slot the clip belongs to before top-k retrieval for the answering
  model. Filed by the drafting stage from Narrative Aligned Long Form Video
  Question Answering (2603.19481) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Judged four-dimension scores on NA-VQA against
  zero-shot and fine-tuned Qwen2.5-VL-7B and long-form VLM baselines; full
  model 35.74 average vs 33.79 fine-tuned Qwen2.5-VL, with ablation removing
  narrative grouping costing most on far-distance evidence grounding (35.10
  to 32.70).. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [video-temporal-reasoning]
kind: retrieval
