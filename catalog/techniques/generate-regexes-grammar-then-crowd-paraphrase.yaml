id: generate-regexes-grammar-then-crowd-paraphrase
ref: TEC-0046
label: "Generate regexes from a grammar, then crowd-paraphrase"
summary: >-
  Build a large NL-to-regex training corpus by stochastically generating
  regexes with a small hand-written grammar that also emits rigid synthetic
  descriptions, then paying crowd workers to paraphrase those descriptions
  into fluent language.
description: >-
  Build a large NL-to-regex training corpus by stochastically generating
  regexes with a small hand-written grammar that also emits rigid synthetic
  descriptions, then paying crowd workers to paraphrase those descriptions
  into fluent language. Filed by the drafting stage from Neural Generation
  of Regular Expressions from Natural Language with Minimal Domain Knowledge
  (1608.03000) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: 10,000-pair corpus (NL-RX); a seq2seq model trained on it
  reached 58.2% DFA-equal accuracy on paraphrased test descriptions versus
  38.6% for the prior semantic-parsing state of the art and 16.4% for a
  bag-of-words nearest-neighbour baseline; the corpus has 97% unique regexes
  against 45% in the earlier human-written set.. Nobody has vouched for it;
  add support or contest it on this page.
addresses: [formal-query-synthesis]
kind: training
sources: [arxiv-1608-03000]
status: proposed
