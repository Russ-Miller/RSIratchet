description: >-
  Estimates factual confidence from the verdict-token probability margin and
  from NLI contradiction between rationales generated assuming the claim is
  true versus false, then uses the two scores to choose direct answering,
  targeted retrieval, Filed by the drafting stage from Fact-Checking with
  Large Language Models via Probabilistic Certainty and Consistency
  (2601.02574) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Expected Calibration Error against verbal confidence
  (e.g. SciFact 23.53 to 12.91 with Gemini-2.5-Pro; HoVer 39.37 to 20.76
  with GPT-4o-mini), and per-label F1 against Factool, FactCheck-GPT, SAFE
  and FIRE (HoVer False 0.66 to 0.76 with GPT-4o).. Nobody has vouched for
  it; add support or contest it on this page.
