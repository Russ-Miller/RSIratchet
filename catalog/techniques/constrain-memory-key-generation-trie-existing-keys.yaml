id: constrain-memory-key-generation-trie-existing-keys
ref: TEC-0476
label: "Constrain memory-key generation to a trie of existing keys"
summary: >-
  Store memory concepts as a dynamic prefix trie and mask decoding so the
  model can only generate token sequences that are valid existing memory
  keys, then expand retrieved seeds one hop over a co-occurrence graph.
description: >-
  Store memory concepts as a dynamic prefix trie and mask decoding so the
  model can only generate token sequences that are valid existing memory
  keys, then expand retrieved seeds one hop over a co-occurrence graph.
  Filed by the drafting stage from To Know is to Construct:
  Schema-Constrained Generation for Agent Memory (2604.20117) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: F1 and BLEU-1 on
  four LoCoMo categories against LoCoMo full-context, ReadAgent, MemoryBank,
  MemGPT and A-MEM on four backbones; ablation replacing constrained
  decoding with unconstrained generation plus embedding lookup drops
  multi-hop F1 39.5%. Nobody has vouched for it; add support or contest it
  on this page.
addresses: [long-term-memory]
