id: route-multi-agent-steps-over-gated-execution-memory
ref: TEC-0190
label: "Route multi-agent steps over a gated execution memory"
summary: >-
  A jointly trained router picks each step's role and backbone from a memory
  kept compact by learned write and retrieval gates, and halts when the
  memory holds enough evidence.
description: >-
  A jointly trained router picks each step's role and backbone from a memory
  kept compact by learned write and retrieval gates, and halts when the
  memory holds enough evidence. Filed by the drafting stage from Learning
  What to Retain: Gated-Memory Routing for Efficient Collaboration in
  Multi-Agent LLM Systems (2609.00237) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy and token cost on five
  benchmarks against query-only routing (MASRouter), full-history routing
  (Puppeteer), fixed topologies (MacNet), AFlow; best average accuracy,
  +2.44 points over strongest baseline, -31.9% HumanEval cost; leave-one-out
  ablation of each module; three seeds reported in appendix.. Nobody has
  vouched for it; add support or contest it on this page.
