label: "Route driving expertise through prompts and gated LoRA exper"
summary: >-
  Keeps the VLM frozen and injects driving knowledge via learnable prompt
  embeddings retrieved per question plus a gated mixture of
  scenario-specific LoRA experts.
description: >-
  Keeps the VLM frozen and injects driving knowledge via learnable prompt
  embeddings retrieved per question plus a gated mixture of
  scenario-specific LoRA experts. Filed by the drafting stage from The Blind
  Spot of Adaptation: Quantifying and Mitigating Forgetting in Fine-tuned
  Driving Models (2604.04857) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: On Qwen2.5VL-3B, knowledge retention rate 79.0%
  versus 68.4% for full fine-tuning (ImpromptuVLA-3B) and 64.6% for plain
  LoRA, with scene description 58.8 and Traffic-QA 41.0 versus base
  56.6/28.7; ablation removes prompt adapter (74.4%) and each component
  separately.. Nobody has vouched for it; add support or contest it on this
  page.
