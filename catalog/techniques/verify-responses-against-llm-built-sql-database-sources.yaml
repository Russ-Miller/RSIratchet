summary: >-
  Prompt the model to incrementally build a relational SQL database from the
  reference passages, generate SELECT queries for the claims in the
  response, and reconcile its initial neural hallucination judgement with
  the executed query results.
description: >-
  Prompt the model to incrementally build a relational SQL database from the
  reference passages, generate SELECT queries for the claims in the
  response, and reconcile its initial neural hallucination judgement with
  the executed query results. Filed by the drafting stage from Leveraging
  Low-Level Symbolic Competences for Unsupervised Grounding in Hallucination
  Detection (2609.05025) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Macro precision/recall/F1 on RAGTruth response-level
  detection (Gemini-2.5-Flash: 61.7/88.9/71.3 vs direct prediction
  48.2/95.4/61.6, atomic fact checking 65.7 F1, JSON key-value 64.9 F1;
  below fine-tuned RAG-HAT at 78.0), plus DiaHalu TOD F1 across Gemini-1.5
  Pro, GPT-4 and Gemini-2.5-Flash, an ablation on strict ID-intersection
  prediction, and a manual audit of SQL parsing fidelity (85.33% complete)..
  Nobody has vouched for it; add support or contest it on this page.
