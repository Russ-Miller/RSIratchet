description: >-
  Represent a multi-agent system as a declarative configuration (roles,
  prompts, tools, per-agent backbone, topology) and evolve it per task with
  feedback-conditioned mutation and crossover, keeping high-reward
  configurations in a pool and co Filed by the drafting stage from EvoMAS:
  Evolutionary Generation of Multi-Agent Systems (2602.06511) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Task accuracy and
  issue-resolution rate against single agents, seven human-designed MAS, and
  four automatic MAS generators across three backbones, plus execution rate;
  budget-matched controls (looped single agent, Best-of-6/10 with selection)
  at equal or larger token budgets, and meta-model, pool-quality, depth and
  judge-model ablations.. Nobody has vouched for it; add support or contest
  it on this page.
