id: retrieve-several-sql-exemplars-never-exactly-one
ref: TEC-0371
label: "Retrieve several SQL exemplars, never exactly one"
summary: >-
  Use a moderate number (around three) of BM25-retrieved question-SQL
  exemplars in the prompt rather than one, so no single
  lexically-similar-but-logically-different query dominates the structure
  the model copies.
description: >-
  Use a moderate number (around three) of BM25-retrieved question-SQL
  exemplars in the prompt rather than one, so no single
  lexically-similar-but-logically-different query dominates the structure
  the model copies. Filed by the drafting stage from Integrating Reasoning
  and Generalization in Text-to-SQL via Self-Enhanced Fine-Tuning
  (2606.15598) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Execution accuracy on Spider and BIRD swept over k; best
  at k=3, with k=1 below k=0, and a manual inspection of 100 k=1 cases
  finding roughly 70% had an exemplar lexically similar but with different
  SQL logic.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [formal-query-synthesis]
kind: retrieval
