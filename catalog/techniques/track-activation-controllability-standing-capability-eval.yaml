description: >-
  A benchmark scoring how well a model modulates its residual stream on
  instruction along six axes (engage, suppress, dial, temporal, coverage,
  layer targeting), combined into one conjunctive score tracked across model
  generations. Filed by the drafting stage from Measuring Activation Control
  in Large Language Models (2608.21664) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Applied to 25 open-weight models;
  score ranged 0.059-0.538 and did not track parameter count; rose across
  Olmo training checkpoints; downstream monitor-evasion experiments used the
  same setup. Not validated as predicting real deception risk.. Nobody has
  vouched for it; add support or contest it on this page.
