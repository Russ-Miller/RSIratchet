description: >-
  A teacher model turns a new-event knowledge graph into long-form synthetic
  news articles for next-token mid-training, plus preference pairs that
  reward chain-of-thought answers and punish outdated values,
  hallucinations, and unwarranted abs Filed by the drafting stage from
  Synthetic Worlds for Temporal Evaluation and Knowledge Updating in LLMs
  (2609.00184) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: QA accuracy on the ParallelEvents benchmark (single-hop,
  multi-hop, causal) after inserting 542 facts: 73.67% (LLaMA-3.1), 64.92%
  (Olmo-3), 79.07% (Gemma-3) versus best in-context baseline IKE at
  63.32/57.73/53.73%, graph-retrieval baselines at 17.09%, and
  LoRA/single-layer tuning at 12.02%; paired bootstrap significance;
  general-ability checks on MMLU-Pro, PopQA, IFEval, IFBench; portability
  check on MQuAKE-Remastered. Nobody has vouched for it; add support or
  contest it on this page.
