id: bound-injected-context-capping-state-categories-evicting-completed
ref: TEC-0253
label: "Bound injected context by capping state categories and evict"
summary: >-
  A three-layer memory writes agent state into a fixed set of categories and
  evicts finished items, so the context injected per step stays small
  regardless of how long the workflow runs.
description: >-
  A three-layer memory writes agent state into a fixed set of categories and
  evicts finished items, so the context injected per step stays small
  regardless of how long the workflow runs. Filed by the drafting stage from
  A hierarchical memory architecture overcomes context limits in
  long-horizon multi-agent computational modeling (2607.07666) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Reported
  injected-context token statistics (median 301, max 4,050), autonomous PKPD
  model selection, parameter recovery against single-agent baselines, and
  feature-level ablations of memory, retrieval and PI oversight; no
  matched-compute baseline reported.. Nobody has vouched for it; add support
  or contest it on this page.
