id: probe-derived-value-signal-free-process-reward
ref: TEC-0083
label: "Probe-derived value signal as a free process reward"
summary: >-
  Fit a linear TD probe on hidden states to get a per-step value estimate,
  take its step-to-step change as a reward prediction error, and use that as
  the scoring signal for best-of-n or search at inference, so no separate
  reward model is run.
description: >-
  Fit a linear TD probe on hidden states to get a per-step value estimate,
  take its step-to-step change as a reward prediction error, and use that as
  the scoring signal for best-of-n or search at inference, so no separate
  reward model is run. Filed by the drafting stage from Sparse Reward
  Subsystem in Large Language Models (2602.00986) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: MATH500 accuracy under search
  guided by the probe signal against greedy, random and implicit-PRM
  guidance; causal ablation of value neurons against random, magnitude and
  Wanda baselines across layers; transfer of value probes across datasets
  and models reported. Single 7B model family for the ablation.. Nobody has
  vouched for it; add support or contest it on this page.
