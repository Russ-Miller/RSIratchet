description: >-
  Before fine-tuning, score every weight by Jacobian-norm times weight
  magnitude times input activation, estimated with Hutchinson sampling over
  model-generated synthetic prompts, then freeze the top-scoring weights and
  update only the rest w Filed by the drafting stage from Model-Dowser:
  Data-Free Importance Probing to Mitigate Catastrophic Forgetting in
  Multimodal Large Language Models (2602.04509) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Harmonic mean of upstream
  zero-shot accuracy and downstream accuracy against Full-FT, DARE,
  Grafting, ModelTailor and SPIDER across four downstream datasets and
  fine-tuning depths from 4 to 32 layers; also compared against random
  masking at matched update ratios over three seeds, and score ranking
  compared to a real-data-estimated ranking by Spearman correlation
  (0.891).. Nobody has vouched for it; add support or contest it on this
  page.
