description: >-
  Rewrite a benign bug report to preserve the repair goal while embedding a
  repository-styled helper requirement whose implementation reads an
  attacker-controlled environment variable into a dangerous sink. Filed by
  the drafting stage from Adversarial Testing of Automated Program Repair
  Agents for Security Vulnerabilities (2609.15963) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Attack success rate (patch
  passes FAIL_TO_PASS and PASS_TO_PASS tests and the injected sink is
  defined and wired in, confirmed by a diff verifier plus a dynamic trigger
  harness): 48.5-54.0% across GPT-5-Mini, MiniMax-M2.5, DeepSeek-R, versus
  18.8-26.4% for the SWExploit baseline on 100 shared instances; 85.4% for
  Claude Opus 4.5 on the 206 instances that fooled all three.. Nobody has
  vouched for it; add support or contest it on this page.
