id: irreversible-action-gate
ref: TEC-0014
label: Gate irreversible actions outside the model
summary: Require an out-of-band approval for deletes, payments, sends, and other irreversible tool calls.
description: >-
  Classify tools by reversibility and have the harness, not the model,
  block irreversible calls until a human or a policy check approves. The
  model can request but cannot execute. This makes skipping a safety step
  impossible rather than merely discouraged.
addresses: [goal-conflict-safety]
ratchet_role: gate
kind: process
sources: [arxiv-2412-14470, arxiv-2607-14166]
contexts: [autonomous-agent, coding-agent, customer-support]
requires: >-
  Adds latency to every gated call, and requires classifying tools by
  reversibility up front.
status: active
submitted_by: human:Russ-Miller
