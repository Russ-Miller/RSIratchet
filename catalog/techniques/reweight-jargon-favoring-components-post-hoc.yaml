id: reweight-jargon-favoring-components-post-hoc
ref: TEC-0093
label: "Reweight jargon-favoring components post hoc"
summary: >-
  Decompose output logits into per-attention-head and per-MLP direct
  contributions and learn scalar weights on a training split, suppressing
  components that systematically push toward the jargon label.
description: >-
  Decompose output logits into per-attention-head and per-MLP direct
  contributions and learn scalar weights on a training split, suppressing
  components that systematically push toward the jargon label. Filed by the
  drafting stage from Domain-Specific Jargon in Large Language Models: A
  Comparative Analysis between General-Purpose and Specialist Models
  (2609.13556) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Raised UltraMedical's jargon-identification accuracy from
  53.1% to 56.1% (McNemar p=0.01) by correcting 270 false positives at the
  cost of 146 new false negatives; the same procedure lowered the Instruct
  model by 1.0% and changed jargon understanding by under 0.2% for both..
  Nobody has vouched for it; add support or contest it on this page.
