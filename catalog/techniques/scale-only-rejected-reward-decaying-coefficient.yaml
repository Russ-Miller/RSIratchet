description: >-
  Multiplies the rejected response's implicit reward by a per-batch
  stop-gradient coefficient, derived so it shrinks toward zero once the
  chosen-minus-rejected margin exceeds a target that scales with combined
  response length, thereby attenua Filed by the drafting stage from ACPO:
  Counteracting Likelihood Displacement in Vision-Language Alignment with
  Asymmetric Constraints (2603.22165) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: POPE, AMBER, HallusionBench,
  MM-IFEval plus seven general multimodal benchmarks against DPO, IPO,
  SimPO, beta-DPO and DPO-Shift on the same data; POPE 86.89 (DPO) vs 89.22
  (ACPO) vs 88.48 base at 14B; ablation forcing the coefficient to 1 returns
  POPE to 86.89; reward-trajectory plots and bootstrap test (p<0.01) on
  hallucination benchmarks.. Nobody has vouched for it; add support or
  contest it on this page.
