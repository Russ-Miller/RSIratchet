id: cold-start-small-seed-model-s-own-trajectories
ref: TEC-0265
label: "Cold-start from a small seed model's own trajectories, not a"
summary: >-
  Train one small seed model to the target behaviour by staged RL, have it
  generate and filter trajectories, and use those as the SFT cold start that
  activates the behaviour in larger target models.
description: >-
  Train one small seed model to the target behaviour by staged RL, have it
  generate and filter trajectories, and use those as the SFT cold start that
  activates the behaviour in larger target models. Filed by the drafting
  stage from Plan Before Search: Search Agents Need Plan (2605.28354) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Exact
  Match on seven open-domain QA benchmarks against a 72B-Instruct
  distillation arm holding trajectory count and pipeline fixed:
  self-bootstrapping won on all three target models (+1.4 EM average, 6 of 7
  benchmarks each), and the distillation arm's RL collapsed in multiple runs
  for Qwen2.5-7B-Base and Qwen3-4B-Base while self-bootstrapping stayed
  stable.. Nobody has vouched for it; add support or contest it on this
  page.
