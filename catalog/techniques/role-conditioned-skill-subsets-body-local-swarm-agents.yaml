id: role-conditioned-skill-subsets-body-local-swarm-agents
ref: TEC-0095
label: "Role-conditioned skill subsets with body-local swarm agents"
summary: >-
  Parse the mission to retrieve a task-level skill catalog, give each
  UAV-bound agent only the top-ranked skills for its assigned role, let
  agents exchange directed peer messages, and nudge skill scores by
  advantages estimated from role-index
description: >-
  Parse the mission to retrieve a task-level skill catalog, give each
  UAV-bound agent only the top-ranked skills for its assigned role, let
  agents exchange directed peer messages, and nudge skill scores by
  advantages estimated from role-index Filed by the drafting stage from
  AeroWeaver: An Embodied-Agent Harness for Weaving Aerial Skills into
  Distributed, Adaptive Swarm Execution (2609.18520) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Mean episode return over 10
  episodes on nine simulated tasks against a centralized planner and HMAS-2,
  plus three component ablations (no activation, no coordination reports,
  beta=0) and per-episode token counts.. Nobody has vouched for it; add
  support or contest it on this page.
