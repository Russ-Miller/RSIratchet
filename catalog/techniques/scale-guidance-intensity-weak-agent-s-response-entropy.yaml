description: >-
  The strong agent scores the weak agent's reply on five weighted entropy
  components (expression, uncertainty, structure, coherence, relevance) and
  picks light, moderate or intensive guidance against thresholds that decay
  over rounds, with su Filed by the drafting stage from Guided Collaboration
  in Heterogeneous LLM-Based Multi-Agent Systems via Entropy-Based
  Understanding Assessment and Experience Retrieval (2602.13639) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Average accuracy
  across four strong-weak pairs versus a no-guidance and a chain-of-thought
  baseline: GSM8K 45.0 to 64.0 (69.0 with retrieval), MBPP 36.5 to 43.5
  (46.0), CVRP 65.0 to 71.6 (81.3); CoT baselines were 51.0, 43.5, 66.6..
  Nobody has vouched for it; add support or contest it on this page.
