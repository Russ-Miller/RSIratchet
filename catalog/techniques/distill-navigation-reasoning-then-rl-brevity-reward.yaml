id: distill-navigation-reasoning-then-rl-brevity-reward
ref: TEC-0282
label: "Distill navigation reasoning, then RL a brevity reward"
summary: >-
  Fine-tune a small VLM on ~500 logged frontier-model navigation traces,
  then run LoRA GRPO in the simulator with a reward combining goal progress,
  exploration, termination correctness and an output-length brevity term.
description: >-
  Fine-tune a small VLM on ~500 logged frontier-model navigation traces,
  then run LoRA GRPO in the simulator with a reward combining goal progress,
  exploration, termination correctness and an output-length brevity term.
  Filed by the drafting stage from LocalNav: Distilling Frontier VLMs and
  Embodied RL for On-Device Object Goal Navigation (2606.27871) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Ablation table on
  a 100-episode HM3D OVON val_unseen subset: base 21% SR, SFT-Claude 47% SR
  at 535 tokens/query, SFT+RL 49% SR at 149 tokens/query; per-episode
  runtime on Jetson 305.2s to 86.0s, and 52.5s with IQ4-XS quantization.
  Zero-shot prompt-based brevity alternatives reported as either saving no
  tokens or degrading navigation.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [embodied-control]
