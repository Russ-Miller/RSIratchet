id: fine-tune-formulas-then-offload-each-formula-calculator
ref: TEC-0599
label: "Fine-tune for formulas, then offload each formula to a calcu"
summary: >-
  Supervised fine-tuning teaches the model to emit computable formulas
  inside <calc> tags, and an external calculator fills in each result during
  generation so arithmetic never accumulates in the model.
description: >-
  Supervised fine-tuning teaches the model to emit computable formulas
  inside <calc> tags, and an external calculator fills in each result during
  generation so arithmetic never accumulates in the model. Filed by the
  drafting stage from BankMathBench: A Benchmark for Numerical Reasoning in
  Banking Scenarios (2602.17072) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Exact-match accuracy on held-out BankMathBench
  splits versus zero-shot and plain SFT with the same backbones:
  tool-augmented SFT added roughly 21-24 points over SFT on basic and 62-73
  points on intermediate and advanced, with median relative numerical error
  falling to near zero.. Nobody has vouched for it; add support or contest
  it on this page.
addresses: [domain-knowledge]
kind: training
sources: [arxiv-2602-17072]
status: proposed
