  Filed by the drafting stage from Avenir-Web: Human-Experience-Imitating
  Multimodal Web Agents with Mixture of Grounding Experts (2602.02468) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Ablation
  on a 50-task Online-Mind2Web subset: removing Experience-Imitation
  Planning dropped success from 48.0% to 36.0%, the largest single-component
  drop (grounding -8.0, checklist -4.0); full system reached 53.7% on the
  300-task benchmark vs 30.0% for the best open-source baseline.. Nobody has
  vouched for it; add support or contest it on this page.
