id: retrieve-human-written-site-guides-before-acting
ref: TEC-0768
label: "Retrieve human-written site guides before acting"
summary: >-
  Before the execution loop starts, a search-capable model retrieves forums,
  help centers and user guides for the target site and distils them into 2-4
  imperative, selector-free directives that steer the agent's navigation.
description: >-
