  inference, and adds it plus Filed by the drafting stage from Dynamic
  Multimodal Activation Steering for Hallucination Mitigation in Large
  Vision-Language Models (2602.21704) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: MME total score +94.66 over the
  LLaVA-1.5 baseline and +10.89 over ICT; CHAIR_S 51.0 to 30.8 (vs VTI
  35.8); POPE accuracy and F1 above most baselines; ablation shows removing
  either vector loses ground and a fixed merged vector underperforms dynamic
  retrieval on every MME subtask.. Nobody has vouched for it; add support or
  contest it on this page.
