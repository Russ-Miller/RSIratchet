id: score-hallucination-detection-gold-hallucinated-tracks-jointly
ref: TEC-0411
label: "Score hallucination detection on gold and hallucinated track"
summary: >-
  Evaluate a detector separately on 1,000 ground-truth correct instances
  (expected verdict 'no') and on hallucinated candidates (expected 'yes'),
  then report the equally weighted mean of the two error rates so a constant
  responder scores 50%.
description: >-
  Evaluate a detector separately on 1,000 ground-truth correct instances
  (expected verdict 'no') and on hallucinated candidates (expected 'yes'),
  then report the equally weighted mean of the two error rates so a constant
  responder scores 50%. Filed by the drafting stage from BenHalluEval: A
  Multi-Task Hallucination Evaluation Framework for Large Language Models on
  Bengali (2605.31483) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied across 9 models x 4 tasks; the metric exposes
  models such as Mistral-nemo-12B (B-err 19.98%, A-err 87.70% on QA) and
  TituLLM-3B (near-constant verdicts, BHS ~50%) that single-track scoring
  would rank well; a weighting sensitivity analysis shows equal weighting is
  the only setting where no degenerate responder wins.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [hallucination]
kind: process
sources: [arxiv-2605-31483]
status: proposed
