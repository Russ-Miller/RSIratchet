id: replay-recorded-prefix-then-intervene-symptomatic-node
ref: TEC-0305
label: "Replay the recorded prefix, then intervene at the symptomati"
summary: >-
  Log every model and tool boundary interaction as an event-dependency
  graph, replay it deterministically up to a node flagged by symptom rules
  plus a semantic judge, inject a repair instruction conditioned on the
  symptom category, and resume
description: >-
  Log every model and tool boundary interaction as an event-dependency
  graph, replay it deterministically up to a node flagged by symptom rules
  plus a semantic judge, inject a repair instruction conditioned on the
  symptom category, and resume Filed by the drafting stage from Repair or
  Resample? Rethinking Failure Debugging in LLM Multi-Agent Systems
  (2608.25920) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass rate on 536 recorded failures against three
  task-level baselines given three attempts each and two node-level controls
  (random node, last node) given the same single replay intervention: 20.15%
  vs 6.90% best task-level, 3.73% random-node, 1.31% last-node; best on each
  of the three frameworks after Holm correction. Failure reproduction rose
  from 67.97% to 80.78% per execution.. Nobody has vouched for it; add
  support or contest it on this page.
