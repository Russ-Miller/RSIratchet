id: steer-over-focused-attention-instead-refusing-injected-request
ref: TEC-0608
label: "Steer over-focused attention instead of refusing the injecte"
summary: >-
  A probe over per-head attention-entropy features flags injected context,
  then the top-fraction attention weights in the flagged heads are
  multiplicatively damped before softmax so focus redistributes to the
  benign task context.
description: >-
  A probe over per-head attention-entropy features flags injected context,
  then the top-fraction attention weights in the flagged heads are
  multiplicatively damped before softmax so focus redistributes to the
  benign task context. Filed by the drafting stage from ICON: Indirect
  Prompt Injection Defense for Agents based on Inference-Time Correction
  (2602.20708) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Attack success rate and utility-under-attack on
  InjectAgent, AgentDojo and TrojanTools across three 8B backbones against
  template defenses, MELON tool filtering, and a fine-tuned guard model:
  average ASR 0.4% (vs 0.2% for the guard) with utility-under-attack about
  10 points above every baseline; OOD detection 80-98% with utility recovery
  48-70%; on three VLMs ASR 2.9% with 47.2% utility vs 28.8% for a
  commercial detector at 0% ASR.. Nobody has vouched for it; add support or
  contest it on this page.
