id: train-coder-against-own-failure-inducing-test-inputs
ref: TEC-0910
label: "Train the coder against its own failure-inducing test inputs"
summary: >-
  One LLM alternates between writing candidate programs and writing unit
  test inputs designed to crash them, then is fine-tuned on programs that
  survive and preference-optimized (KTO) toward tests that split passing
  from failing programs.
description: >-
  One LLM alternates between writing candidate programs and writing unit
  test inputs designed to crash them, then is fine-tuned on programs that
  survive and preference-optimized (KTO) toward tests that split passing
  from failing programs. Filed by the drafting stage from ACE: Self-Evolving
  LLM Coding Framework via Adversarial Unit Test Generation and Preference
  Optimization (2605.16299) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: pass@1/5/10 and average tokens per solution on
  CodeContests (in-distribution), MBPP and LiveCodeBench
  (out-of-distribution), against the instruct backbone, ReasonFlux-Coder and
  Qwen2.5-Coder baselines; ablations replacing the adversary with random
  prompt-perturbed tests (-4 pts pass@1), removing KTO (-5 pts), and
  removing SFT (largest drop).. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [code-generation]
kind: training
sources: [arxiv-2605-16299]
status: proposed
