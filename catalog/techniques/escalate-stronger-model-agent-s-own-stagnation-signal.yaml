id: escalate-stronger-model-agent-s-own-stagnation-signal
ref: TEC-0571
label: "Escalate to a stronger model on the agent's own stagnation s"
summary: >-
  The small model emits a binary progress indicator alongside each reasoning
  step; on FALSE, control passes to the large model for a bounded number of
  steps whose budget grows with consecutive failures, then returns.
description: >-
  The small model emits a binary progress indicator alongside each reasoning
  step; on FALSE, control passes to the large model for a bounded number of
  steps whose budget grows with consecutive failures, then returns. Filed by
  the drafting stage from AgentCollab: A Self-Evaluation-Driven
  Collaboration Paradigm for Efficient LLM Agents (2603.26034) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy, average
  reasoning steps and end-to-end speedup against small-only, large-only,
  random switching and five routing baselines (RouteLLM, FrugalGPT, TRiM,
  Miroflow, WeDAS) on BrowseComp_zh, HLE-math and WritingBench; e.g. DDV2
  BrowseComp_zh 18.3 (small) / 34.6 (large) / 33.9 at 1.36x speedup;
  ablations on budget growth k, check frequency, role assignment and
  cross-family pairings.. Nobody has vouched for it; add support or contest
  it on this page.
