description: >-
  Fine-tunes an LLM scorer with an InfoNCE loss that ranks one
  environment-valid action above a pool of 16 mined invalid actions (silent
  failures, explicit rejections, cross-task transplants) instead of
  classifying each state-action pair inde Filed by the drafting stage from
  CWM: Contrastive World Models for Action Feasibility Learning in Embodied
  Agent Pipelines (2602.22452) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: 605 held-out hard-negative instances scored by
  Precision@1, MRR, AUC-ROC against an identically-trained
  binary-cross-entropy SFT baseline, the untuned base model, and random
  scoring; plus gold-action retention and safety margin over 712/697 steps
  of out-of-distribution task episodes.. Nobody has vouched for it; add
  support or contest it on this page.
