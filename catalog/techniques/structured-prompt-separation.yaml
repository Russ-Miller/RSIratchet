id: structured-prompt-separation
ref: TEC-0025
label: Separate instructions from data
summary: Mark the boundary between trusted instructions and untrusted content, and train or prompt the model to honor it.
description: >-
  Wrap tool outputs and retrieved documents in reserved delimiters the
  model has been trained to treat as data, strip those delimiters from
  untrusted content, and rank instructions by source privilege. Without
  training access, the prompt-level version still helps: label every
  untrusted block and instruct the model to never follow instructions
  inside it.
addresses: [prompt-injection]
kind: training
sources: [arxiv-2402-06363, arxiv-2404-13208]
