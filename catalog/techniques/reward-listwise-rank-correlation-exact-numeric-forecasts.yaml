label: "Reward listwise rank correlation, not exact numeric forecast"
summary: >-
  Train the model with GRPO using a Spearman rank-correlation reward between
  its generated asset ordering and realized future returns, with a fixed
  penalty for malformed or hallucinated asset lists, then feed the ranking
  into Entropy Pooling
description: >-
  Train the model with GRPO using a Spearman rank-correlation reward between
  its generated asset ordering and realized future returns, with a fixed
  penalty for malformed or hallucinated asset lists, then feed the ranking
  into Entropy Pooling Filed by the drafting stage from FinRankGRPO:
  Optimizing LLMs for Listwise Financial Asset Ranking via Group Relative
  Policy Optimization (2609.24175) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared against equal weight,
  mean-variance, momentum, three commercial LLMs, and same-checkpoint
  SFT/standard-GRPO/NDCG@3/Kendall reward variants on Spearman, Kendall,
  NDCG@k, annualized return, Sharpe (0.636 best), and max drawdown, averaged
  over 5 trials; plus news-removal ablation (Sharpe 0.636 to 0.045) and a
  sentiment-inversion faithfulness check.. Nobody has vouched for it; add
  support or contest it on this page.
