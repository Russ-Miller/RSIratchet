description: >-
  Holds a fixed prompt schema (role, context, task, constraints, output
  format) and has a critic model emit natural-language improvements per
  section independently, appending them and running an LLM de-duplication
  pass before reassembly. Filed by the drafting stage from Modular Prompt
  Optimization: Optimizing Structured Prompts with Section-Local Textual
  Gradients (2601.04055) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Exact-match accuracy on 1,172 ARC-Challenge test items
  and 1,400 held-out MMLU items, against an untuned same-schema prompt and
  TextGrad; MPO best in all four cells (e.g. ARC LLaMA-3 79.10 vs 75.6
  TextGrad vs 75.0 untuned; MMLU LLaMA-3 61.50 vs 56.40 vs 57.21).. Nobody
  has vouched for it; add support or contest it on this page.
