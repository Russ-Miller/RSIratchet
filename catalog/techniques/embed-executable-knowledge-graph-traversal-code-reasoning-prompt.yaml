description: >-
  Adds a programmable module to a chain-of-thought distillation prompt that
  issues code-controlled traversals over an external knowledge graph, so
  each intermediate reasoning step is constrained by retrieved entities and
  relations rather than Filed by the drafting stage from KDCM: Reducing
  Hallucination in LLMs through Explicit Reasoning Structures (2601.04086)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  HIT@1/HIT@3/HIT@5 on WebQSP, CWQ, GSM8K, MWP and Dr. SPIDER against the
  same distillation chain without the code module and against KG-LLM-PR,
  LLM-SubKG-Sum, RAG and Self-Check; no error bars, no per-dataset ablation
  of which component helps, and no human check of whether gains are
  hallucination reduction rather than retrieval accuracy.. Nobody has
  vouched for it; add support or contest it on this page.
