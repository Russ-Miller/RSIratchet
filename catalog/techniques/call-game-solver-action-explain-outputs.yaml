description: >-
  Train the model (behavior cloning on tool-augmented traces, then PPO with
  answer, format and tool-execution rewards) to issue a single query to a
  unified poker solver API that returns the equilibrium action plus equity
  and range figures, an Filed by the drafting stage from How Far Are LLMs
  from Professional Poker Players? Revisiting Game-Theoretic Reasoning with
  Agentic Tool Use (2602.00528) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Net chip gain over 100 games with alternated
  positions against four traditional algorithms per environment: ToolPoker
  +6.8 average in Leduc and +45.0 in Limit Texas Hold'em versus -40.5 and
  -77.6 for the BC-RIRL policy-only variant, and -3.0 / -5.0 against the
  CFR+ and DeepCFR solvers; LLM-as-judge scores on heuristic reasoning,
  factual alignment and action-reasoning consistency near the professional
  reference, with ablations removing BC or RL each losing gameplay or
  factual alignment.. Nobody has vouched for it; add support or contest it
  on this page.
