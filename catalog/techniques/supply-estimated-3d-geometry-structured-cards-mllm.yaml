summary: >-
  Ground the question's objects, run monocular depth, camera calibration and
  orientation estimators to build camera, gravity-aligned world and
  object-local coordinates, and hand the MLLM task-agnostic 'cards' of
  measurements plus discrete sum
description: >-
  Ground the question's objects, run monocular depth, camera calibration and
  orientation estimators to build camera, gravity-aligned world and
  object-local coordinates, and hand the MLLM task-agnostic 'cards' of
  measurements plus discrete sum Filed by the drafting stage from Geo3R:
  Mitigating Spatial Reasoning Hallucination in Multimodal Large Language
  Models (2607.21085) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy over 18 tasks / 17,493 samples against the
  unaugmented backbone, four hallucination-mitigation baselines on
  LLaVA-1.5, a tool-augmented baseline (APC-VLM), and five spatially
  fine-tuned models: +7.06 points on Gemini-3-Flash, +10.90 on Qwen3-VL-8B,
  +2.87 on LLaVA-1.5, while the mitigation baselines moved within about 0.7
  points and APC-VLM lost 7.92; removing both cards returned accuracy near
  baseline.. Nobody has vouched for it; add support or contest it on this
  page.
