description: >-
  Builds the multi-agent communication graph node by node with a conditional
  discrete graph diffusion model whose ordering and denoising networks are
  biased by each agent's effective size (non-redundant in/out neighborhood),
  conditioned on th Filed by the drafting stage from RADAR: Redundancy-Aware
  Diffusion for Multi-Agent Communication Structure Generation (2605.09907)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy on six benchmarks vs. 20 baselines (average 90.32 vs. 88.57 for
  the strongest, ARG-Designer), token consumption on GSM8K (6.5e6 vs. 1.1e7
  for AgentPrune, 1.4e7 for AFlow), MMLU prompt-attack robustness, and
  ablations removing effective size (-2.61 MMLU), query conditioning
  (-4.58), utility loss (-0.70), and diffusion (-4.56).. Nobody has vouched
  for it; add support or contest it on this page.
