description: >-
  A benchmark that embeds think/don't-think/intensity/timing/layer
  instructions into a fixed transcription task and scores six measures of
  residual-stream modulation into one conjunctive controllability score.
  Filed by the drafting stage from Measuring Activation Control in Large
  Language Models (2608.21664) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Applied to 25 open-weight models; scores ranged
  0.059-0.538, did not track parameter count, rose across Olmo training
  checkpoints, and predicted which conditions evade four monitor families
  (suppression detection fell to 5-21% at 1% FPR while engagement stayed
  near ceiling).. Nobody has vouched for it; add support or contest it on
  this page.
