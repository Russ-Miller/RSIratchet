id: score-decision-pathway-just-outcome
ref: TEC-0351
label: "Score the decision pathway, not just the outcome"
summary: >-
  Extract guideline decision trees into reference step sequences, then score
  a model's generated pathway by LLM-judged step-level match aggregated with
  dynamic time warping against the reference.
description: >-
  Extract guideline decision trees into reference step sequences, then score
  a model's generated pathway by LLM-judged step-level match aggregated with
  dynamic time warping against the reference. Filed by the drafting stage
  from Benchmarking Clinical Decision Pathway Adherence in Large Language
  Models (2608.26592) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Pairwise human preference study on 200 sampled pathway
  pairs: the metric agreed with aggregated human preference 90.0% of the
  time, equal to the 90.0% agreement between two annotators; results held
  across three aggregation methods and two judge models (Kendall's W
  0.70-0.87).. Nobody has vouched for it; add support or contest it on this
  page.
