id: score-hls-generation-board-execution-synthesis
ref: TEC-0195
label: "Score HLS generation by board execution, not synthesis"
summary: >-
  Extend HLS code evaluation past simulation and synthesis by generating
  host code, building the FPGA executable, and running it on physical
  hardware, reporting synthesizable, executable, and functionally correct
  rates separately.
description: >-
  Extend HLS code evaluation past simulation and synthesis by generating
  host code, building the FPGA executable, and running it on physical
  hardware, reporting synthesizable, executable, and functionally correct
  rates separately. Filed by the drafting stage from FPGAgent: An
  LLM-Assisted Framework for Autonomous HLS Code Generation and Verification
  in FPGA Environments (2608.23630) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Applied to five models on 78 HLS-Eval
  tasks; the three staged rates diverge for every model (e.g. Gemini 3.1 Pro
  zero-shot 82.1% / 67.9% / 56.4%), and a motivating case shows a
  simulation-passing kernel failing place-and-route from aggressive
  unrolling. No comparison to an alternative evaluation protocol.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [evaluation-validity]
kind: process
sources: [arxiv-2608-23630]
status: proposed
