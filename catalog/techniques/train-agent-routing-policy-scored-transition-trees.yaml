id: train-agent-routing-policy-scored-transition-trees
ref: TEC-0680
label: "Train the agent-routing policy on scored transition trees"
summary: >-
  Expand a bounded tree of possible next-agent transitions per image-query,
  score leaves by task metric, propagate the max upward, and fine-tune an
  LLM on (memory snapshot -> best next agent) pairs to serve as the router.
description: >-
  Expand a bounded tree of possible next-agent transitions per image-query,
  score leaves by task metric, propagate the max upward, and fine-tune an
  LLM on (memory snapshot -> best next agent) pairs to serve as the router.
  Filed by the drafting stage from MATA: A Trainable Hierarchical Automaton
  System for Multi-Agent Visual Reasoning (2601.19204) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Accuracy on GQA, OK-VQA,
  RefCOCO/+/g and Ref-Adv plus per-query inference time, against three
  ablations sharing the same agents: exhaustive ensemble (avg weakest,
  34.58s/query), random transition, and an un-finetuned LLM router; SFT
  added about 6.4 points on GQA over the un-finetuned router at equal
  latency.. Nobody has vouched for it; add support or contest it on this
  page.
