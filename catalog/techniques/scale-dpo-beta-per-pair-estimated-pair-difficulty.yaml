description: >-
  Estimate each preference pair's difficulty from the normalized
  chosen-minus-rejected score gap under a frozen contrastive VLM and a
  frozen generative MLLM, fuse the two by their preference-classification
  accuracy, and use the result as a pe Filed by the drafting stage from
  DA-DPO: Cost-efficient Difficulty-aware Preference Optimization for
  Reducing MLLM Hallucinations (2601.00623) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against vanilla DPO on four
  hallucination benchmarks (AMBER, Object HalBench, MMHal, POPE) and four
  general benchmarks (LLaVA-Bench, GQA, SeedBench, MME): e.g. LLaVA-v1.5-7B
  AMBER generative HalRate 35.7 to 28.0, LLaVA-Bench 70.5 to 75.4, SeedBench
  57.8 to 64.8; also against removing 10/25/50% of easy samples, which
  fluctuated and underperformed on most metrics.. Nobody has vouched for it;
  add support or contest it on this page.
