description: >-
  A harness layer intercepts the MLLM planner's tool calls, checks each
  target for supporting observation provenance, geometric reachability and
  consistency with the active subgoal, and blocks stop requests until
  semantic, geometric and progr Filed by the drafting stage from HarnessVLN:
  Unifying Training-Free Embodied Navigation through an Agent Harness
  (2609.15195) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Cumulative ablation on fixed 100-episode subsets: base
  agent 46.0 SR (R2R) and 45.0 SR (HM3D-OVON) rose to 64.0 and 55.0 with
  event memory, graph retrieval and stop validation; stop validation alone
  added 4.0 and 2.0 SR but lowered OVON SPL from 34.2 to 33.0 and widened
  its OSR-SR gap from 18 to 19. Full system reported 60.8/53.9/76.0/59.3 SR
  on R2R/RxR/HM3D-v2/HM3D-OVON versus prior training-free bests.. Nobody has
  vouched for it; add support or contest it on this page.
