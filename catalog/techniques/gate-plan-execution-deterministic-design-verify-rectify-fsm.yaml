description: >-
  A finite state machine outside the model routes the agent between design,
  verification and rectification states, blocking execution of any generated
  instruction until a symbolic rule engine signals the hardware constraints
  pass, and compres Filed by the drafting stage from BioProAgent:
  Neuro-Symbolic Grounding for Constrained Scientific Planning (2603.00876)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Extended BioProBench subsets: physical compliance C_p 0.956 vs 0.210
  (ReAct), 0.911 (AutoGPT), 0.995 (direct prompting with trivially
  conservative code); parameter accuracy 0.610 vs 0.468; error-correction
  success 90% vs 0% for all three agent baselines including an Oracle-ReAct
  variant forced to retry until pass; ablation removing the FSM drops
  long-horizon S_code to 0.000, removing only verification drops C_p to
  0.902; 82% fewer tokens than AutoGPT on long-horizon tasks.. Nobody has
  vouched for it; add support or contest it on this page.
