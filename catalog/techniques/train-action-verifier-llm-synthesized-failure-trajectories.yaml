id: train-action-verifier-llm-synthesized-failure-trajectories
ref: TEC-0557
label: "Train the action verifier on LLM-synthesized failure traject"
summary: >-
  Prompt a teacher LLM to rewrite each successful embodied demonstration
  into a realistic failed variant (wrong object, wrong receptacle,
  precondition violation) with per-step correctness verdicts, then fine-tune
  an MLLM generative verifier o
description: >-
  Prompt a teacher LLM to rewrite each successful embodied demonstration
  into a realistic failed variant (wrong object, wrong receptacle,
  precondition violation) with per-step correctness verdicts, then fine-tune
  an MLLM generative verifier o Filed by the drafting stage from Think
  Twice, Act Once: Verifier-Guided Action Selection For Embodied Agents
  (2605.12620) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Success rate against a greedy CoT policy and a zero-shot
  verifier of the same backbone: LangR 65 -> 64 (zero-shot) -> 71
  (fine-tuned); EB-ALFRED 44 -> 44 -> 49 on Qwen-3B and 48 -> 48 -> 51 on
  Gemma-4B; also raised zero-shot Qwen2.5-VL-72B from 30 to 38; scaling
  curve compared against self-consistency at matched LLM calls.. Nobody has
  vouched for it; add support or contest it on this page.
