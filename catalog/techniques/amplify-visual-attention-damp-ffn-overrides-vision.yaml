id: amplify-visual-attention-damp-ffn-overrides-vision
ref: TEC-0585
label: "Amplify visual attention and damp FFN when it overrides visi"
summary: >-
  At inference, boosts attention to visual tokens (adaptively, as attention
  decays over decoding steps), suppresses the FFN residual update when it
  diverges from the attention update, and contrastively decodes against an
  image masked at regio
