description: >-
  An offline analyzer re-issues each recorded prompt N times and scores
  response agreement per step; steps below a consistency threshold are
  turned by an LLM into short guidelines stored in episodic memory and
  retrieved into future runs of si Filed by the drafting stage from Closing
  the Consistency Gap: Self-Evolving Agents That Learn to Stay on Course
  (2609.08832) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Pass^5, Mean@5 and normalized consistency over five runs
  per task on AppWorld test_normal (168 tasks, 336 similar-task
  evaluations), against the same agent with no guidelines; trajectory
  consistency also scored as a pass/fail predictor (AUROC 0.699 on 50
  test_challenge tasks).. Nobody has vouched for it; add support or contest
  it on this page.
