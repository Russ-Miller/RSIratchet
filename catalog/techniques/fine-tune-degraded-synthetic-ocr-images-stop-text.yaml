id: fine-tune-degraded-synthetic-ocr-images-stop-text
ref: TEC-0467
label: "Fine-tune on degraded synthetic OCR images to stop text inve"
summary: >-
  Builds ~5M multilingual OCR training samples by rendering translated text
  into scenes with controlled blur, rotation, occlusion and clutter, then
  LoRA-fine-tunes the MLLM so text reading is grounded in pixels rather than
  language priors.
description: >-
  Builds ~5M multilingual OCR training samples by rendering translated text
  into scenes with controlled blur, rotation, occlusion and clutter, then
  LoRA-fine-tunes the MLLM so text reading is grounded in pixels rather than
  language priors. Filed by the drafting stage from Multilingual OCR-Aware
  Fine-Tuning and Prompt-Guided Chain-of-Thought Reasoning for Multimodal
  Large Language Models (2605.16409) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Held-out ~3,000-sample real-world
  multilingual OCR benchmark against the same model before post-training:
  OCR completeness 71.3 to 84.6, hallucination 18.3% to 5.5%, BLEU-1 52.3 to
  80.2; public benchmarks (DocVQA, TextVQA, MMBench, VQAv2) show small OCR
  gains with no broad regression.. Nobody has vouched for it; add support or
  contest it on this page.
