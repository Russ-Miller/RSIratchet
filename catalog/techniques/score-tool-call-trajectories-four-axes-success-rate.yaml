description: >-
  Evaluate an agent's whole tool-calling trajectory on action correctness,
  execution efficiency, process quality and output quality with nine metrics
  (three deterministic, six LLM-judged against a reference trajectory)
  rather than a single en Filed by the drafting stage from FinTrace:
  Holistic Trajectory-Level Evaluation of LLM Tool Calling for Long-Horizon
  Financial Tasks (2604.10015) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Applied to 13 models; ranking stability checked
  with an out-of-family judge (Spearman 0.989), human annotation of 90
  trajectories on three metrics (judge-human weighted kappa 0.631-0.857),
  and leave-one-metric-out/median aggregation (Kendall tau >= 0.974). No
  external validation that the rubric predicts deployment outcomes.. Nobody
  has vouched for it; add support or contest it on this page.
