description: >-
  At each agent step, prefill at the top precision tier and feed the
  final-norm hidden state to a two-head linear probe that predicts action
  divergence times conditional criticality; decode the step at low precision
  unless the predicted criti Filed by the drafting stage from Dynamic
  Mixed-Precision Routing for Efficient Multi-step LLM Interaction
  (2602.02711) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Task success rate and per-task decode time against
  fixed-precision, random routing matched on low-bit token share, and
  first-k-steps schedules, on three agent benchmarks; DMR recovered 81% of
  the fixed-low-precision success gap on average at 2.44x FP16 decode
  speedup, versus at most 48% for heuristics; on ALFWorld+GPTQ 86.9% vs
  87.2% FP16 at 1.71x. Ablations compare router factorizations and a
  position-feature router (AUC 0.530 vs 0.745).. Nobody has vouched for it;
  add support or contest it on this page.
