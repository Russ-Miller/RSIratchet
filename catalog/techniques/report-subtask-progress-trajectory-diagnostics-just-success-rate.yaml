label: "Report subtask progress and trajectory diagnostics, not just"
summary: >-
  Score embodied navigation episodes on fraction of phases completed, final
  goal distance, collisions and step count alongside binary success, so
  partial progress and post-phase-transition stalls are visible.
description: >-
  Score embodied navigation episodes on fraction of phases completed, final
  goal distance, collisions and step count alongside binary success, so
  partial progress and post-phase-transition stalls are visible. Filed by
  the drafting stage from 4DSynth: Controllable Procedural World Synthesis
  for Dynamic Embodied Simulation (2608.26947) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Not measured as an
  intervention; the paper reports that SP exceeds SR on the two-phase tiers
  (Qwen 35.5% SP vs 18.2% SR on L2; 15.0% vs 4.5% on L3; Gemini 36.4% vs
  23.6% and 27.7% vs 18.2%) and shows a trajectory where the agent reaches
  goal 1 then ends 8.0 m from goal 2.. Nobody has vouched for it; add
  support or contest it on this page.
