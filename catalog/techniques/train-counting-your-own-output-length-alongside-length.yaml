id: train-counting-your-own-output-length-alongside-length
ref: TEC-0695
label: "Train on counting your own output length alongside length RL"
summary: >-
  During length-reward GRPO, replay the policy's own rollouts relabelled as
  'count the words in the text above' with the measured length as the
  target, and add that supervised loss to the RL loss under a
  cosine-decaying weight.
description: >-
  During length-reward GRPO, replay the policy's own rollouts relabelled as
  'count the words in the text above' with the measured length as the
  target, and add that supervised loss to the RL loss under a
  cosine-decaying weight. Filed by the drafting stage from LARFT: Closing
  the Cognition-Action Gap for Length Instruction Following in Large
  Language Models (2603.19255) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Length Score, Length Deviation, MAE and quality
  metrics on LIFEBench, LongBench and Lenctrl-Bench across four backbones
  versus untuned, SFT, GRPO-only, SFT+RL, Ruler and PositionID; reported
  +20.92 average over base models and +4.59 over the best RL baseline, with
  -1.45 on four general benchmarks. Ablations: awareness-SFT alone barely
  moved length following (46.0 to 46.8 on one model), awareness-then-RL beat
  plain RL by 3.93 but trailed joint training by 2.95, and removing the
  cosine schedule dropped LIFEBench LS from 80.57 to 73.44.. Nobody has
  vouched for it; add support or contest it on this page.
