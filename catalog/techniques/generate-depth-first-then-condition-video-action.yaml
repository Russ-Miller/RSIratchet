id: generate-depth-first-then-condition-video-action
ref: TEC-0495
label: "Generate depth first, then condition video and action on it"
summary: >-
  Appends separate depth, video and action query groups to an LLM with a
  causal mask so video queries read depth context and action queries read
  both, with lightweight diffusion experts decoding each modality.
description: >-
  Appends separate depth, video and action query groups to an LLM with a
  causal mask so video queries read depth context and action queries read
  both, with lightweight diffusion experts decoding each modality. Filed by
  the drafting stage from DriveDreamer-Policy: A Geometry-Grounded
  World-Action Model for Unified Generation and Planning (2604.01765) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Ablation
  on Navsim navtest: action-only 88.0 PDMS, depth+action 88.5, video+action
  88.9, depth+video+action 89.2; video quality improved from FVD 65.82 to
  53.59 and LPIPS 0.22 to 0.20 when depth was trained jointly; depth AbsRel
  8.1 vs 9.3 for a fine-tuned depth-only baseline.. Nobody has vouched for
  it; add support or contest it on this page.
