summary: >-
  Classify both H and NOT-H three ways, accept pairs consistent with the
  fixed negation map, re-query only the abstaining side, fall back to binary
  entailment probes when both abstain, and adjudicate decisive
  contradictions.
description: >-
  Classify both H and NOT-H three ways, accept pairs consistent with the
  fixed negation map, re-query only the abstaining side, fall back to binary
  entailment probes when both abstain, and adjudicate decisive
  contradictions. Filed by the drafting stage from Compositional
  Consistency-Guided Decoding for Three-Way Logical Question Answering
  (2604.06196) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy on FOLIO FOL validation rose 63.7 to 68.1
  (GPT-5.2, paired bootstrap CI +1.5 to +7.4) and 42.2 to 49.0 (Claude, CI
  +3.4 to +10.3) against a single-call baseline using the same prompt
  family; epistemic Unknown fell 41.5 to 36.3 and 72.6 to 53.3; answered
  accuracy rose on both models, so abstentions were not swapped for weak
  guesses. No matched-call self-consistency baseline was run.. Nobody has
  vouched for it; add support or contest it on this page.
