id: react-loop-over-controllable-video-inspection-tools
ref: TEC-0120
label: "ReAct loop over controllable video inspection tools"
summary: >-
  A single agent iteratively calls video observation tools where it sets the
  time interval, frame rate and resolution itself, judging evidence
  sufficiency each turn before answering.
description: >-
  A single agent iteratively calls video observation tools where it sets the
  time interval, frame rate and resolution itself, judging evidence
  sufficiency each turn before answering. Filed by the drafting stage from
  AgentVidBench: A Multi-Hop Video Question Answering Benchmark for
  Evaluating MLLM Agents (2609.21386) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Accuracy and trajectory score on
  AgentVidBench against single-turn and three agentic frameworks; best
  accuracy 0.58 with Gemini 2.5 Pro versus 0.51 single-turn and 0.56 AVP,
  with ablations removing each control axis lowering accuracy (e.g. 0.50
  without interval control).. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [video-temporal-reasoning]
kind: tooling
