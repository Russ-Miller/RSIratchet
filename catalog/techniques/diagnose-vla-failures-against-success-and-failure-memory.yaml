description: >-
  Wraps a frozen VLA policy with retrieval over a dual bank of past
  successful and failed executions, a vision-language orchestrator that
  attributes the likely failure cause, and a chain of tools that repaint,
  de-clutter, rewrite the instruct Filed by the drafting stage from
  RoboHarness: A Memory-Augmented Policy Harness for Vision-Language-Action
  Model Robustness via In-Context Adaptation (2603.24060) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Success rate
  against the unmodified frozen policy on 25 LIBERO-PRO and
  LIBERO-RoboHarness tasks, 199 randomized rollouts each: average absolute
  gain 56.6%, long-horizon chaining +89.1%, LIBERO-PRO Task 0.86% to 55.2%.
  Memory ablation uses average turns-to-success: no memory 7.40,
  success-only 1.47, dual 1.07; a clutter-removal variant scored 19.2% (no
  RAG), 48.8% (single-stage), 60.1% (dual-stage consolidation).. Nobody has
  vouched for it; add support or contest it on this page.
