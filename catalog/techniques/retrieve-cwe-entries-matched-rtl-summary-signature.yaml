  hardware keywords from th Filed by the drafting stage from SecureRAG-RTL:
  A Retrieval-Augmented, Multi-Agent, Zero-Shot LLM-Driven Framework for
  Hardware Vulnerability Detection (2603.05689) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Detection accuracy on 14
  vulnerabilities before vs after: small models 14.29% to 40.48%, medium
  29.76% to 52.38%, frontier 50.00% to 90.48%; ROUGE-L of extracted
  vulnerable snippets also rose.. Nobody has vouched for it; add support or
  contest it on this page.
