ref: TEC-0517
label: "Reward critique logicality, accuracy and usefulness, scored "
summary: >-
  Train a small MLLM reward model to regress human ratings of a critique's
  logicality, accuracy and usefulness, then GRPO-tune an evaluator judge
  against the weighted combination of those three scores after SFT on
  curated critiques.
description: >-
  Train a small MLLM reward model to regress human ratings of a critique's
  logicality, accuracy and usefulness, then GRPO-tune an evaluator judge
  against the weighted combination of those three scores after SFT on
  curated critiques. Filed by the drafting stage from ReasonEdit: Towards
  Interpretable Image Editing Evaluation via Reinforcement Learning
  (2605.07477) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Rank/linear correlation (SRCC, KRCC, PLCC) with human MOS
  on EBench-18K and zero-shot pairwise accuracy on five public editing
  benchmarks, plus text-similarity metrics (SimCSE, Word2Vec, METEOR, ROUGE)
  against curated reference critiques; ablated against base, GRPO-only and
  SFT-only variants on three backbones.. Nobody has vouched for it; add
  support or contest it on this page.
