id: reward-key-evidence-overlap-penalize-distractor-overlap
ref: TEC-0365
label: "Reward key-evidence overlap and penalize distractor overlap"
summary: >-
  Adds to the binary accuracy reward an n-gram overlap bonus against
  annotated support spans and a larger penalty for overlap with the rest of
  the prompt, with evidence annotations produced by an automated
  chunk-constrained QA generation pipe
description: >-
  Adds to the binary accuracy reward an n-gram overlap bonus against
  annotated support spans and a larger penalty for overlap with the rest of
  the prompt, with evidence annotations produced by an automated
  chunk-constrained QA generation pipe Filed by the drafting stage from Copy
  Less, Ground More: Overcoming Repetitive Copying in Long-Context Reasoning
  via Evidence-Aware Reinforcement Learning (2607.19345) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Average score on
  Ruler, LongBench-v2, BrowseComp-LC, GraphWalks and AA-LCR against
  accuracy-only GSPO and the base model: +1.5 to +2.8 points at 32k and +2.1
  to +4.6 at 128k across three model scales; grounding-only ablation falls
  up to 5.1 (32k) and 8.3 (128k) points below accuracy-only GSPO, and
  distractor-penalty-only (alpha=0) also scores below baseline (72.0 vs
  78.5); overlap rate and thinking length measured on Ruler and
  LongBench-v2.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [long-context-degradation]
kind: training
