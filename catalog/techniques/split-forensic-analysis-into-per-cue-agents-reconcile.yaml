description: >-
  Four MLLM agents each inspect the same sampled video frames for one
  forgery cue type and report observations without a verdict; a judge agent
  weighs the four reports (optionally plus the frames) and issues the
  real/fake decision and explana Filed by the drafting stage from
  Multi-Agent Forensic Reasoning for Generalizable Deepfake Video Detection
  (2608.06865) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Training-free comparison on the OOD split against Single,
  CoT, and three multi-turn variants with the same backbone: F1 33.53 vs
  13.24 (Single) and 11.29 (CoT) on Qwen2.5-VL-7B; after SFT plus GRPO the
  full system reaches 69.87 accuracy / 53.28 F1 vs 47.45 F1 for the best
  single-model baseline (Gemini-2.5-Pro). Per-agent ablation shows all four
  combined beats any single perspective.. Nobody has vouched for it; add
  support or contest it on this page.
