description: >-
  Translates an instruction into a first-order logic formula over
  constraints, generates a Python checker per logic constraint and a
  targeted prompt per semantic constraint, and solves the composed formula
  with Z3 to return a verdict plus the Filed by the drafting stage from
  Neuro-Symbolic Verification on Instruction Following of LLMs (2601.17789)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  On VifBench (820 labeled <instruction, output, result> tuples, 47.7% sat),
  F1 94.8% vs 69.1% for a two-shot LLM-as-judge with GPT-4.1, with gains of
  7.0-25.7 F1 points across five models; ablations show removing
  per-constraint code checkers (Nsvif-Neu) drops F1 to 84.0% and
  prompt-optimized judges (GEPA-CoT 67.1%, Conv-CoT 78.9%) stay below; false
  positives fall from 42.3% to 2.8%. With GPT-4o-mini the method scores
  37.3% F1, below its 66.6% baseline, because constraints are misclassified
  in 508 of 820 instructions.. Nobody has vouched for it; add support or
  contest it on this page.
