description: >-
  Before any action, the agent generates an ordered pseudo-code sequence of
  tool calls, writes it to a scratchpad that persists across the whole
  episode, and the executor admits only the plan-specified tool at each step
  unless replanning is t Filed by the drafting stage from Bridging Thought
  and Action: Taming Long-Horizon Instability in Open-Source LLM Agents with
  a MetaTool-Enhanced ROS Framework (2609.13335) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Four-configuration ablation
  (prompt only, transient plan, persistent plan, persistent plan plus
  execution constraint) over three task tiers and four models, 20 trials
  each; 40 hardware trials comparing repeated tool calls (19.0% to 6.1%),
  invalid calls (21.7% to 8.1%) and execution time against vanilla ROSA; and
  a 40-trial failure-mode comparison against re-implemented ReAct (17/40
  success), CaP (20/40), ROSA (23/40) and MetaTool (30/40).. Nobody has
  vouched for it; add support or contest it on this page.
