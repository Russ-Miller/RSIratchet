  rank evidence falls below
description: >-
  Projects each visual-position hidden state through the output head, pools
  candidate tokens' reciprocal vocabulary ranks across positions during
  prefill, and applies a bounded logit penalty when a candidate's pooled
  rank evidence falls below Filed by the drafting stage from ReWEIGH the
  Evidence: Calibrating Token-Level Ordinal Visual Evidence to Mitigate
  Hallucinations in Large Vision-Language Models (2608.19075) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_I object
  hallucination on four 7B backbones (reduced up to 21.3%), extended to 11
  models across six families up to 32B; descriptive and general multimodal
  scores reported as largely preserved or improved; latency overhead 1.33%
  per token; held-out calibration error on 4,969 disjoint COCO images versus
  a global reference and 1,000 random reference shuffles.. Nobody has
  vouched for it; add support or contest it on this page.
