description: >-
  Pre-train the model on a large financial corpus of filings, research
  reports, standards and market series, then fine-tune with LoRA on an
  institution's own investment memos and risk rules. Filed by the drafting
  stage from Frontiers in FinTech: Multimodal Foundation Models for
  Financial Reporting and Decision Science (2608.22724) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Mean absolute
  error and RMSE of target price versus analyst consensus on 200 companies,
  plus direction accuracy of Buy/Hold/Sell against consensus revision within
  90 days; reported MAE 13.1% versus 16.2% for the DCF spreadsheet and 18.7%
  for single-stage FinGPT.. Nobody has vouched for it; add support or
  contest it on this page.
