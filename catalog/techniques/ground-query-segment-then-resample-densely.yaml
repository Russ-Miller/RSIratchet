id: ground-query-segment-then-resample-densely
ref: TEC-0681
label: "Ground the query segment, then resample it densely"
summary: >-
  The video LLM is asked first to output the temporal segment relevant to
  the question, then re-samples that segment at high frame rate and answers
  from mixed high- and low-frequency visual tokens, with discrete temporal
  position tokens added
description: >-
  The video LLM is asked first to output the temporal segment relevant to
  the question, then re-samples that segment at high frame rate and answers
  from mixed high- and low-frequency visual tokens, with discrete temporal
  position tokens added Filed by the drafting stage from SlowFocus:
  Enhancing Fine-grained Temporal Understanding in Video LLM (2602.03589)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  On FineAction-CGR against VideoLLaMA, Video-ChatGPT, LLaMA-VID and
  VTimeLLM, plus a LLaMA-VID baseline retrained on the same stage-3 data:
  mIoU 66.68 vs 22.38 for that matched baseline, reasoning accuracy 53.10 vs
  24.81. Component ablation: low-frequency only 32.54 mIoU / 30.25 acc;
  adding dense sampling +8.87 acc; adding the temporal encoder +22.45 mIoU;
  raising high-frequency frames 10->20 +7.66 mIoU, 20->40 near-flat; mixing
  attention +1.42 acc. Coarse-grained video QA stays comparable to prior
  models.. Nobody has vouched for it; add support or contest it on this
  page.
