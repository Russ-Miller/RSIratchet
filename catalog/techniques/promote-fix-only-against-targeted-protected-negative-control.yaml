description: >-
  For each recurring failure, write a patch with an explicit scope and
  injection point, then admit it only if it fixes its targeted cases, leaves
  a protected regression suite unharmed, and does not fire on negative
  controls; refuse or defer c Filed by the drafting stage from FINSKILLOPS:
  A Self-Evolving Multi-Agent System for SEC Filing QA (2609.19680) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by:
  Correctness on an enhanced SEC-filing benchmark before and after evolved
  skills, a 12-round operational study reporting promotion counts and
  monitoring non-correct rate, and a gated-versus-ungated comparison showing
  the ungated variant wins on targeted cases while regressing protected
  ones. One domain.. Nobody has vouched for it; add support or contest it on
  this page.
