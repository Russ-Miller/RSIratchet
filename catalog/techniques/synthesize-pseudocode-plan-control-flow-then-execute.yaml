description: >-
  A planner LLM first emits a structured pseudocode blueprint (ordered
  subtasks, control-flow primitives, termination condition, iteration cap,
  per-step input/output interface), and a deterministic executor walks that
  plan, handing each subta Filed by the drafting stage from PseudoAct:
  Leveraging Pseudocode Synthesis for Flexible Planning and Action Control
  in Large Language Model Agents (2602.23668) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy and F1 on FEVER
  (88.24% / 83.35% vs DFSDT 67.31% / 64.16% and ReAct 60.78% / 62.63%) and
  accuracy on HotpotQA (82.14% vs DFSDT 73.21%, ReAct 46.40%), plus
  qualitative traces showing DFSDT emitting 60+ tool calls and hitting a
  recursion error where the planned agent terminates.. Nobody has vouched
  for it; add support or contest it on this page.
