label: "Baseline the critic's advantage on generator ensemble accura"
summary: >-
  Trains critic LoRA adapters with GRPO where the advantage is the critic's
  reward minus twice the per-instance average accuracy of the generator
  ensemble, so critics are rewarded for being right when generators are
  wrong.
description: >-
  Trains critic LoRA adapters with GRPO where the advantage is the critic's
  reward minus twice the per-instance average accuracy of the generator
  ensemble, so critics are rewarded for being right when generators are
  wrong. Filed by the drafting stage from MADA-RL: Multi-Agent Debate-Aware
  Reinforcement Learning for Parameter-Efficient Reasoning in Compact Models
  (2607.18006) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average accuracy over five math benchmarks (41.9 vs 39.9
  base, p<0.001) and an ablation replacing the counterfactual term with
  standard GRPO advantage (41.1, p=0.095); plus a critic improvement rate of
  19.6%, the highest of ten models placed in the critic role.. Nobody has
  vouched for it; add support or contest it on this page.
