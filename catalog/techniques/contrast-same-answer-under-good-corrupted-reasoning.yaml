ref: TEC-0273
label: "Contrast the same answer under good and corrupted reasoning"
summary: >-
  Adds a DPO term that fixes the preferred answer and contrasts its
  conditional likelihood under an MCTS-searched grounded CoT versus a CoT
  with its most image-attending tokens pruned, trained alongside standard
  response-level DPO.
description: >-
  Adds a DPO term that fixes the preferred answer and contrasts its
  conditional likelihood under an MCTS-searched grounded CoT versus a CoT
  with its most image-attending tokens pruned, trained alongside standard
  response-level DPO. Filed by the drafting stage from Reasoning Matters:
  Mitigate Hallucination in Multimodal Large Reasoning Models via
  Reasoning-Conditioned Preference Optimization (2605.27906) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: CHAIR_S on Object
  HalBench fell from 36.7 to 21.7 (R1-Onevision) and 34.0 to 21.3
  (MM-Eureka) versus vanilla, beating VCD, SID, RLAIF-V and OPA-DPO on all
  four models; POPE F1 best in all three splits; ablation shows removing the
  reasoning-conditioned loss is the largest single loss, with lambda=0.1 and
  20% pruning optimal.. Nobody has vouched for it; add support or contest it
  on this page.
