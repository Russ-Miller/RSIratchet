id: give-each-tool-own-lora-module-soft-mix
ref: TEC-0323
label: "Give each tool its own LoRA module and soft-mix them"
summary: >-
  Pre-trains one low-rank FFN adapter per tool from its documentation and
  traces, trains an MLP gating network to weight candidate tools from the
  context, then jointly fine-tunes the adapters under those weights so tool
  calls need no in-conte
description: >-
  Pre-trains one low-rank FFN adapter per tool from its documentation and
  traces, trains an MLP gating network to weight candidate tools from the
  context, then jointly fine-tunes the adapters under those weights so tool
  calls need no in-conte Filed by the drafting stage from ParaTool: Shifting
  Tool Representations from Context to Parameters (2605.29561) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Average pass rate
  on Stable ToolBench (69.57 vs 65.67 for Context+Docs&Examples on
  Llama3.1-8B; 75.95 vs 66.96 on Qwen2.5-7B) and AST accuracy on BFCL,
  against context-based, globally parameterized, ToolLLaMA, and three
  retrieval-selector baselines; plus FLOPs accounting showing ~92% less
  inference compute. Ablations compare soft weights against top-1,
  averaging, and an oracle selector.. Nobody has vouched for it; add support
  or contest it on this page.
