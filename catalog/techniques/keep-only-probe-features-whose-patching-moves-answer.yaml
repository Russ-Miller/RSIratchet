description: >-
  Decompose residual-stream activations with a sparse autoencoder, pick the
  layer with the largest activation-patching effect, keep only features
  whose directional patching raises the correct answer's probability above a
  threshold, then add t Filed by the drafting stage from MechELK: A
  Mechanistic Interpretability Framework for Eliciting Latent Knowledge in
  Large Language Models (2605.28825) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Elicitation accuracy, detection rate,
  false-positive rate and paraphrase consistency against direct probing,
  CCS, RepE, SAE-probing and layer-level activation patching on three
  benchmarks and three models; reported 82.3% vs 74.2% (CCS) elicitation
  accuracy on TruthfulQA/Llama-3-8B, FPR 12.7% vs 28.4% for direct probing,
  and an ablation showing removal of the causal-filtering step costs 6.2
  points accuracy and adds 11.6 points FPR.. Nobody has vouched for it; add
  support or contest it on this page.
