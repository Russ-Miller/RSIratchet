label: "Critique and rewrite sensitive spans instead of refusing"
summary: >-
  An evaluator agent emits structured per-category leakage verdicts on a
  draft answer and an editor agent rewrites only the flagged spans, looping
  until the evaluator reports clean or a 3-iteration budget runs out.
description: >-
  An evaluator agent emits structured per-category leakage verdicts on a
  draft answer and an editor agent rewrites only the flagged spans, looping
  until the evaluator reports clean or a 3-iteration budget runs out. Filed
  by the drafting stage from Beyond Refusal: Probing the Limits of Agentic
  Self-Correction for Semantic Sensitive Information (2602.21496) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: On
  SemSI-Bench across 13 models, mean leakage occurrence fell from 0.78 (no
  protection) to 0.51 and toxicity from 0.85 to 0.45, with mean utility
  (LLM-judged relevance/correctness/completeness, 0-10) falling 6.04 to
  5.45; compared against no-protection and a single-pass prompt-only
  control, plus LlamaGuard 4 and GPT-OSS-Safeguard-20B output filters, which
  scored 0.01 and 0.17 F1 at detecting the same leakage. Most of the gain is
  already present at the prompt-only control (0.55), so the loop itself adds
  only ~0.04 occurrence on average.. Nobody has vouched for it; add support
  or contest it on this page.
