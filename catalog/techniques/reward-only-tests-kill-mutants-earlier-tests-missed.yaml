description: >-
  Trains a test-generation policy with GRPO where each generated test is
  scored by the weighted set of mutants it kills that were not already
  killed by preceding tests, with an exponentially growing penalty for
  redundant tests and immediate t Filed by the drafting stage from MIST-RL:
  Mutation-based Incremental Suite Testing via Reinforcement Learning
  (2603.01409) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mutant kill rate and average suite length on HumanEval+,
  MBPP+, DS-1000 against Llama-3-8B-Instruct, CodeRM-8B and Qwen3-14B
  (HumanEval+ 74.03% vs 45.53% kill rate, suite length 6.14 vs 7.61), plus
  Pass@1 code reranking on HumanEval+ (48.78% vs 45.73% at N=10); ablations
  remove the incremental term (kill rate 74.03 to 65.1) and the penalty
  (length 6.14 to 14.20).. Nobody has vouched for it; add support or contest
  it on this page.
