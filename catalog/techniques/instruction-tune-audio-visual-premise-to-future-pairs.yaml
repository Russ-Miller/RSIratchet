description: >-
  LoRA fine-tune an omni-modal model on 7K audio-visual premise/future-event
  items that include an explicit written rationale linking the audio-visual
  premise to the predicted future event, with encoders frozen. Filed by the
  drafting stage from FutureOmni: Evaluating Future Forecasting from
  Omni-Modal Context for Multimodal LLMs (2601.13836) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Accuracy on the paper's own
  forecasting benchmark for three 7B open models (+1.03 to +3.87 points,
  with Speech category rising nearly 10 points for one model), plus
  out-of-domain gains on WorldSense, DailyOmni, JointAVBench,
  OmniVideoBench, Video-MME and MLVU (mostly under +3.4, some near zero or
  slightly negative).. Nobody has vouched for it; add support or contest it
  on this page.
