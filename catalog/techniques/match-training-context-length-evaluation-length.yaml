id: match-training-context-length-evaluation-length
ref: TEC-0730
label: "Match training context length to the evaluation length"
summary: >-
  Restrict the long-context training stage to example lengths close to the
  target benchmark's context length instead of adding a longer-context stage
  on top.
description: >-
  Restrict the long-context training stage to example lengths close to the
  target benchmark's context length instead of adding a longer-context stage
  on top. Filed by the drafting stage from How to Train Your Long-Context
  Visual Document Model (2602.15257) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Compared short-stage-only against
  short-plus-long-stage in three settings (SFT on Mistral Small 3.1 24B, SFT
  on Qwen3-VL 32B, LongPO on Qwen3-VL 32B); short-stage-only won on the
  visual-LC average in all three (+3.0, +1.4, +2.2) and on most individual
  benchmarks. Metric noise reported as sigma=0.33 over three runs.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [long-context-degradation]
kind: training
