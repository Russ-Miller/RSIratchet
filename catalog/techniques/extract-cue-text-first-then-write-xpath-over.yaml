id: extract-cue-text-first-then-write-xpath-over
ref: TEC-0045
label: "Extract cue text first, then write XPath over condensed HTML"
summary: >-
  Stage one prompts an LLM on a sanitized HTML tree to return target values
  plus the anchor text preceding them; stage two condenses the page around
  those nodes and prompts a stronger LLM to emit an XPath, refined by
  executing it on seed page
description: >-
  Stage one prompts an LLM on a sanitized HTML tree to return target values
  plus the anchor text preceding them; stage two condenses the page around
  those nodes and prompts a stronger LLM to emit an XPath, refined by
  executing it on seed page Filed by the drafting stage from XPath Agent: An
  Efficient XPath Programming Agent Based on LLM for Web Crawler
  (2502.15688) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Set-matching precision/recall/F1/accuracy on SWDE across
  four backbones (best: GPT-4o, F1 0.8514, accuracy 0.7413); sanitization
  measured to cut page size to roughly 10-20%. Comparison to AutoCrawler is
  discussed narratively, not tabulated, and no ablation isolates the
  cue-text component.. Nobody has vouched for it; add support or contest it
  on this page.
