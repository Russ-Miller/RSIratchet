id: separate-self-judged-scores-verifier-rewards-measure-both
ref: TEC-0205
label: "Separate self-judged scores from verifier rewards and measur"
summary: >-
  Withhold verifier-computed rewards from the agent during exploration while
  logging them benchmark-side, so the agent's own step scores can be
  compared against ground truth and against later held-out improvement.
description: >-
  Withhold verifier-computed rewards from the agent during exploration while
  logging them benchmark-side, so the agent's own step scores can be
  compared against ground truth and against later held-out improvement.
  Filed by the drafting stage from S3Gym: Can LLMs Turn Self-Testing and
  Self-Judging into Self-Improvement? (2608.31100) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: 116,117 transitions over 98
  runs: event agreement and normalized MAE per game, plus blockwise and
  run-level correlations with normalized score change (rho(A,g) = -0.010,
  rho(-E,g) = -0.018; run-level r = -0.23 with normalized above-baseline
  area).. Nobody has vouched for it; add support or contest it on this page.
addresses: [harness-self-improvement]
kind: process
