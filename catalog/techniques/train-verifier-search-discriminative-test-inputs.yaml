label: "Train a verifier to search for discriminative test inputs"
summary: >-
  An agent interacts with a code sandbox over multiple turns on a pair of
  candidate solutions, iteratively refining an input-generator program until
  it emits a valid input on which the two solutions disagree; trained by
  rejection fine-tuning
description: >-
  An agent interacts with a code sandbox over multiple turns on a pair of
  candidate solutions, iteratively refining an input-generator program until
  it emits a valid input on which the two solutions disagree; trained by
  rejection fine-tuning Filed by the drafting stage from Scaling Agentic
  Verifier for Competitive Coding (2602.04254) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Best@8 and Best@64 on five
  competitive-programming benchmarks against vanilla sampling, a grading
  reward model, MBR-Exec, CodeT, CodeRM and a random input generator at a
  matched 512-input budget; reported gains up to +10-15 absolute points,
  largest on the hardest benchmarks and hard difficulty tiers, and the
  trained 30B verifier beat a zero-shot 235B verifier.. Nobody has vouched
  for it; add support or contest it on this page.
