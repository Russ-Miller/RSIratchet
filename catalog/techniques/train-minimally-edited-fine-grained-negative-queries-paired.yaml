id: train-minimally-edited-fine-grained-negative-queries-paired
ref: TEC-0870
label: "Train on minimally-edited fine-grained negative queries, pai"
summary: >-
  Builds DPO preference pairs where the query itself contains one plausible
  but wrong object, attribute or relation among otherwise correct scene
  content, and includes the matching all-correct query so the model cannot
  learn to just say No.
description: >-
  Builds DPO preference pairs where the query itself contains one plausible
  but wrong object, attribute or relation among otherwise correct scene
  content, and includes the matching all-correct query so the model cannot
  learn to just say No. Filed by the drafting stage from FINER: MLLMs
  Hallucinate under Fine-grained Negative Queries (2603.17662) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Paired accuracy
  (both positive and negative variant correct) on FINER-CompreCap and
  FINER-DOCCI across four settings, against the untuned backbone and against
  prior hallucination fine-tuning methods (RLAIF-V, OPA-DPO, RLHF-V,
  LLaVA-RLHF); plus eight hallucination benchmarks and six general
  benchmarks to check for an alignment tax; ablations against SFT and
  negative-only DPO.. Nobody has vouched for it; add support or contest it
  on this page.
