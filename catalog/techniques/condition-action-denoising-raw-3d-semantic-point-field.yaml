description: >-
  Fuse frozen 3D-foundation-model features into VLM visual tokens, and let
  action hidden states cross-attend (with 3D RoPE) to an unencoded
  point-wise semantic field, inserted only in the diffusion blocks where
  linear probing shows degraded e Filed by the drafting stage from Bridge3D:
  Enabling Vision-Language-Action Models to See and Act in 3D (2609.24525)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Success rate on 10 RoboTwin 2.0 tasks (100 trials each, clean and
  randomized) against pi-0, Spatial Forcing, PointVLA, 3D Diffusion Policy;
  ablations removing each strategy (78.8 -> 90.4 -> 92.0 -> 95.6 avg),
  layer-position ablation, PointNet++ encoder ablation, and six real-robot
  tasks (RDT 34.3 vs Bridge3D 49.0 avg).. Nobody has vouched for it; add
  support or contest it on this page.
