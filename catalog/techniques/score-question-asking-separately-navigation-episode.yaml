description: >-
  Replace in-episode evaluation of human-agent dialogue with an offline
  protocol where a questioner sees only the target description and a
  sequence of edited distractor images, and must either ask the oracle a
  clarifying question or decide ma Filed by the drafting stage from
  Benchmarking Interaction, Beyond Policy: a Reproducible Benchmark for
  Collaborative Instance Object Navigation (2604.00265) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Measured success
  rate, finish rate, questions per observation and wall-clock time for 5
  systems across three oracle models on ~400 held-out episodes; oracle
  responses were additionally compared against human responses and reported
  as giving similar performance; episodes complete in seconds rather than
  the minutes a simulator episode needs.. Nobody has vouched for it; add
  support or contest it on this page.
