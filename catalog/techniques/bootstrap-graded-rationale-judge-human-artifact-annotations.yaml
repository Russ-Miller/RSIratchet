description: >-
  Human bounding-box artifact annotations are turned into gold rationales, a
  generator writes rationales at each of five quality levels which an
  evaluator re-scores and refines until the intended and predicted ratings
  match, and the paraphras Filed by the drafting stage from Pixels Don't Lie
  (But Your Detector Might): Bootstrapping MLLM-as-a-Judge for Trustworthy
  Deepfake Detection and Reasoning Supervision (2602.19715) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: RMSE/MSE and
  Spearman/Pearson correlation against human pointwise ratings, and pairwise
  agreement with human preferences, on a 100-sample two-annotator subset
  (Cohen's kappa ~0.80) plus a 1,000/2,000-sample held-out split, against 15
  prompted VLM baselines; plus a 10-participant user study preferring the
  pipeline rationales 70% of the time.. Nobody has vouched for it; add
  support or contest it on this page.
