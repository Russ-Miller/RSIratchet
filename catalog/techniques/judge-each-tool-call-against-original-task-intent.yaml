id: judge-each-tool-call-against-original-task-intent
ref: TEC-0702
label: "Judge each tool call against the original task intent"
summary: >-
  Before any high-risk tool invocation, a separate LLM judge is shown the
  task description and the proposed call and must emit ALLOW or BLOCK with a
  one-sentence rationale.
description: >-
  Before any high-risk tool invocation, a separate LLM judge is shown the
  task description and the proposed call and must emit ALLOW or BLOCK with a
  one-sentence rationale. Filed by the drafting stage from Governance
  Architecture for Autonomous Agent Systems: Threats, Framework, and
  Engineering Practice (2603.07191) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Interception rate and false-positive
  rate on 457 malicious plus 464 benign tool calls per language, against an
  unverified baseline (0% IR) and two NLI baselines (BART-MNLI 8-10% IR,
  mDeBERTa ~0%); generalization checked on InjecAgent (99-100%
  interception).. Nobody has vouched for it; add support or contest it on
  this page.
