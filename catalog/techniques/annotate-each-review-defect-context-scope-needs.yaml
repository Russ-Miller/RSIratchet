id: annotate-each-review-defect-context-scope-needs
ref: TEC-0591
label: "Annotate each review defect by the context scope it needs"
summary: >-
  Label every ground-truth review comment as diff-, file-, or
  repository-level so recall can be broken out by how much context the
  defect requires rather than reported as one number.
