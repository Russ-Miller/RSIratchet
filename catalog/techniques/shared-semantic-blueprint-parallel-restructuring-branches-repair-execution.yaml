description: >-
  One agent reconstructs the source program's states, operators and
  dependencies into a structured representation and a target-side blueprint;
  several agents then generate alternative tensor realizations under that
  blueprint, failures are rep Filed by the drafting stage from
  Semantics-Guided Automatic Tensorization for Multiobjective Evolutionary
  Algorithms: A Multi-Agent Framework (2609.02387) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Convergence pass rate over 240
  attempts per condition against one-shot translation with the same backend:
  78.75% vs 26.67% (Gemini 3 Flash), 65.42% vs 27.08% (DeepSeek V4 Pro),
  59.58% vs 16.67% (DeepSeek V4 Flash); coverage 48/48 MOEAs with at least
  one converged implementation vs 45/48 for the best one-shot condition;
  downstream fidelity 88.2% of 1,904 MOEA-problem comparisons passing the
  IGD tolerance criterion.. Nobody has vouched for it; add support or
  contest it on this page.
