label: "Let each agent choose its own communication action per round"
summary: >-
  Trains per-agent Q-heads over six discrete communication primitives with a
  topology-aware GNN+GRU encoder and a QMIX monotonic mixer, so the
  round-wise communication graph emerges from decentralized action choices
  rather than a central gene
description: >-
  Trains per-agent Q-heads over six discrete communication primitives with a
  topology-aware GNN+GRU encoder and a QMIX monotonic mixer, so the
  round-wise communication graph emerges from decentralized action choices
  rather than a central gene Filed by the drafting stage from Agent Q-Mix:
  Selecting the Right Action for LLM Multi-Agent Systems through
  Reinforcement Learning (2604.00344) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Median of three runs on seven
  benchmarks against single-agent, static debate, five adaptive-topology
  methods and four commercial frameworks; average accuracy 72.73% vs 68.60%
  (AutoGen) and 60.37% (GTD) on GPT-OSS:120B; token totals reported on three
  benchmarks; plus an adversarial-agent injection test on MMLU-Pro
  (2.86-point drop vs 8.57-10.00 for baselines).. Nobody has vouched for it;
  add support or contest it on this page.
