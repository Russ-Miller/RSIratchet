id: calibrate-confidence-per-atomic-claim-per-response
ref: TEC-0099
label: "Calibrate confidence per atomic claim, not per response"
summary: >-
  Split a response into atomic claims, score each by a mixture of
  self-verification confidence and frequency of support across sampled
  responses, then fit temperature or Platt scaling at the claim level so
  low-confidence claims can be flagged
description: >-
  Split a response into atomic claims, score each by a mixture of
  self-verification confidence and frequency of support across sampled
  responses, then fit temperature or Platt scaling at the claim level so
  low-confidence claims can be flagged Filed by the drafting stage from
  Claim-Level Confidence Calibration for Reliable Decision Making with Large
  Language Models (2608.22483) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: ECE, smECE, Brier, AUROC, AURC against seven
  baselines (few-shot likelihood, CoT, verbalized confidence, PS, TS,
  LMvsLM, HalluMeasure) on TriviaQA and TruthfulQA across six models; best
  on GPT-4o/TriviaQA (ECE 0.006 vs 0.096 for TS), worse than TS on
  GPT-4o/TruthfulQA (0.412 vs 0.118).. Nobody has vouched for it; add
  support or contest it on this page.
