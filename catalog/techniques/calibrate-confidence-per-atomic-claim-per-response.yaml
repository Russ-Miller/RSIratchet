id: calibrate-confidence-per-atomic-claim-per-response
ref: TEC-0099
label: "Calibrate confidence per atomic claim, not per response"
summary: >-
  Split a response into atomic verifiable claims, score each by a mixture of
  cross-sample consistency and self-verification, then fit temperature or
  Platt scaling at the claim level so a per-claim score can gate retrieval
  or human review.
description: >-
  Split a response into atomic verifiable claims, score each by a mixture of
  cross-sample consistency and self-verification, then fit temperature or
  Platt scaling at the claim level so a per-claim score can gate retrieval
  or human review. Filed by the drafting stage from Claim-Level Confidence
  Calibration for Reliable Decision Making with Large Language Models
  (2608.22483) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: ECE, smECE, Brier, AUROC, AURC against seven baselines
  (sequence likelihood, verbalized confidence, PS, TS, HalluMeasure, LMvsLM)
  on TriviaQA and TruthfulQA; best on GPT-4o/TriviaQA (ECE 0.006 vs 0.096
  for TS) but far worse on TruthfulQA (0.412 vs 0.118 for TS).. Nobody has
  vouched for it; add support or contest it on this page.
