id: calibrate-confidence-per-atomic-claim-per-response
ref: TEC-0098
label: "Calibrate confidence per atomic claim, not per response"
summary: >-
  Decompose a response into atomic claims, score each with a mixture of
  cross-sample consistency and self-verification, then fit temperature or
  Platt scaling at the claim level to produce per-claim accept/verify
  thresholds.
description: >-
  Decompose a response into atomic claims, score each with a mixture of
  cross-sample consistency and self-verification, then fit temperature or
  Platt scaling at the claim level to produce per-claim accept/verify
  thresholds. Filed by the drafting stage from Claim-Level Confidence
  Calibration for Reliable Decision Making with Large Language Models
  (2608.22483) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: ECE, smECE, Brier, AUROC, AURC against seven baselines
  (few-shot likelihood, CoT, verbalized confidence, PS, TS, LMvsLM,
  HalluMeasure) on TriviaQA and TruthfulQA; best on GPT-4o/TriviaQA (ECE
  0.006) but worse than temperature scaling on TruthfulQA for most models..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [abstention-and-self-knowledge]
kind: process
sources: [arxiv-2608-22483]
status: proposed
