id: calibrate-confidence-per-atomic-claim-per-response
ref: TEC-0100
label: "Calibrate confidence per atomic claim, not per response"
summary: >-
  Decompose a response into atomic claims, score each by self-verification
  mixed with cross-sample consistency, then fit temperature or Platt scaling
  at the claim level so each claim can be accepted, flagged for retrieval,
  or escalated.
description: >-
  Decompose a response into atomic claims, score each by self-verification
  mixed with cross-sample consistency, then fit temperature or Platt scaling
  at the claim level so each claim can be accepted, flagged for retrieval,
  or escalated. Filed by the drafting stage from Claim-Level Confidence
  Calibration for Reliable Decision Making with Large Language Models
  (2608.22483) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: ECE, smECE, Brier, AUROC, AURC against seven baselines
  (few-shot likelihood, CoT, verbalized confidence, PS, TS, LMvsLM,
  HalluMeasure) on TriviaQA and TruthfulQA across six models; on
  GPT-4o/TriviaQA ECE 0.006 versus 0.096 for temperature scaling, but on
  GPT-4o/TruthfulQA 0.412 versus 0.118 for temperature scaling.. Nobody has
  vouched for it; add support or contest it on this page.
