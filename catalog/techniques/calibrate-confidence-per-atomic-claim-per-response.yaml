  Confidence Calibration for Reliable Decision Making with Large Language
  Models (2608.22483) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: ECE, smECE, Brier, AUROC, AURC on TriviaQA and TruthfulQA
  against seven baselines (few-shot likelihood, CoT, verbalized confidence,
  PS, TS, LMvsLM, HalluMeasure) across six models; best on GPT-4o/TriviaQA
  (ECE 0.006 vs 0.096 for TS), worse than TS on GPT-4o/TruthfulQA (0.412 vs
  0.118).. Nobody has vouched for it; add support or contest it on this
  page.
