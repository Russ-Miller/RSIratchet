description: >-
  Each attempt is abstracted into a case node attached to a task anchor,
  linked by similarity edges and by directed fixed_by edges from a failed
  attempt to the attempt that corrected it, and retrieved cases are turned
  into typed hints (fix, w Filed by the drafting stage from EXG:
  Self-Evolving Agents with Experience Graphs (2605.17721) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: pass@1/pass@2 plus
  average LLM calls and latency against Reflexion, SE-Agent and ExpeL on
  four benchmarks; structural ablation on HumanEval where removing
  correction edges caused the largest drop, and hint-type ablation
  (no-memory 0.610 p@1, similar-only 0.823, warning-only 0.866, full
  0.872).. Nobody has vouched for it; add support or contest it on this
  page.
