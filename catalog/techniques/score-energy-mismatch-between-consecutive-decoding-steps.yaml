id: score-energy-mismatch-between-consecutive-decoding-steps
ref: TEC-0790
label: "Score the energy mismatch between consecutive decoding steps"
summary: >-
  Compute, at the exact-answer tokens, the difference between the sampled
  token's logit at step i and the negative log-sum-exp over the vocabulary
  at step i+1, and threshold that discrepancy as a training-free
  hallucination score.
description: >-
  Compute, at the exact-answer tokens, the difference between the sampled
  token's logit at step i and the negative log-sum-exp over the vocabulary
  at step i+1, and threshold that discrepancy as a training-free
  hallucination score. Filed by the drafting stage from Spilled Energy in
  Large Language Models (2602.18671) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: AuROC on nine benchmarks (HotpotQA,
  IMDB, Math, MNLI, Movies, TriviaQA, Winobias, Winogrande) across four LLMs
  plus synthetic multi-digit arithmetic with graded error magnitudes;
  baselines were logit confidence, p(true), and Orgad et al. probing
  classifiers evaluated cross-dataset (average 73.16 vs 64.16 for probes on
  LLaMA-3-Instruct).. Nobody has vouched for it; add support or contest it
  on this page.
