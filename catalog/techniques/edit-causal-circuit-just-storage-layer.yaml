label: "Edit the causal circuit, not just the storage layer"
summary: >-
  Identify the sparse subgraph of edges causally responsible for a multi-hop
  reasoning instance with integrated-gradient edge attribution, then apply
  LoRA exclusively to modules inside that circuit while freezing everything
  else.
description: >-
  Identify the sparse subgraph of edges causally responsible for a multi-hop
  reasoning instance with integrated-gradient edge attribution, then apply
  LoRA exclusively to modules inside that circuit while freezing everything
  else. Filed by the drafting stage from Addressing the Reasoning Gap:
  Mechanistic Circuit-Based Knowledge Editing in Large Language Models
  (2604.05876) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Multi-hop and single-hop accuracy on MQuAKE-3K-v2 against
  ROME, MEMIT, WISE, AlphaEdit, LoRA and CaKE; ablation on 1,000 cases
  showed multi-hop 67.73 for the circuit edit vs 39.30 full-graph, 26.00
  MLPs-only, 15.13 random edges of matched size; locality checked on MMLU
  and CommonsenseQA (shifts ~0.1-0.24%).. Nobody has vouched for it; add
  support or contest it on this page.
