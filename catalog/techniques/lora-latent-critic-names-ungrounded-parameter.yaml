description: >-
  A zero-initialized LoRA adapter runs concurrently with the frozen base
  model during tool-call generation and, on a trigger token, verbalizes a
  structured verdict (ok, wrong_tool, or ungrounded: <parameter>) that the
  harness uses to block ex Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On human-verified labels, 0.966 ID AUROC and 0.925 OOD
  AUROC versus 0.915/0.884 for an equivalent-scale fine-tuned external
  judge, 0.782/0.616 for a linear probe on frozen base states, and
  near-chance for token/semantic entropy and SEP; >80% exact parameter-match
  localization; replicated on Llama-xLAM-2-8B; in a closed-loop ReAct
  setting specific feedback gave parameter F1 61.2 vs 51.3 generic and 52.1
  no intervention, with false blocks 2.9% vs 9.4%; <10ms added latency in
  vLLM.. Nobody has vouched for it; add support or contest it on this page.
