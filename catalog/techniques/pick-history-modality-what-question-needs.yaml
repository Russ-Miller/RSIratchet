label: "Pick history modality by what the question needs"
summary: >-
  Feed long dialogue history as transcripts for lexical-recall questions and
  as raw audio for paralinguistic questions, rather than one format for all.
description: >-
  Feed long dialogue history as transcripts for lexical-recall questions and
  as raw audio for paralinguistic questions, rather than one format for all.
  Filed by the drafting stage from Vox-Infinity: Benchmarking the Limits of
  Long-Context Spoken Language Models (2609.22452) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Each model run twice on the
  same 13,516 QA pairs with text vs audio history; text won on Ultra
  Multi-Turn (71.3% vs 42.6% mean) and Personal Monologues, audio won on
  Beyond-Semantic for six of seven models, with the audio advantage rising
  from -0.6 to +6.6 points model-averaged when semantic emotion cues were
  controlled by synthesizing neutral text in emotional styles.. Nobody has
  vouched for it; add support or contest it on this page.
