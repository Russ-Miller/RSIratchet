description: >-
  Collect hidden states on harmful and harmless prompts, recover the
  low-rank safety subspace per layer, and compress its geometry into one
  score that ranks aligned checkpoints by how easily benign fine-tuning will
  erase refusal, so the fragi Filed by the drafting stage from Skin-Deep: A
  Geometric Diagnostic for Alignment Fragility in Large Language Model
  Representations (2606.22676) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Direction-ablation causal test on four models
  (non-overlapping 95% CIs), linear-probe accuracy at least 0.90 for the
  subspace, and a LoRA-fragility experiment where the score's top pick
  retained the most refusal; twenty-one models across six recipes.. Nobody
  has vouched for it; add support or contest it on this page.
