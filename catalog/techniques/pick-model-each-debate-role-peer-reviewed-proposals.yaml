description: >-
  Before the actual debate, every candidate model writes a role-specific
  draft answer for each role, all candidates score every draft against
  auto-generated role- and domain-specific criteria, and each role goes to
  the model with the highest Filed by the drafting stage from Dynamic Role
  Assignment for Multi-Agent Debate (2601.17152) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Accuracy on GPQA (full 448
  items), MathVision testmini (190 closed-form items) and RealWorldQA (437
  items) against uniform assignment (one model in all roles) and three
  random model-to-role assignments, inside MAD and DMAD; on GPQA the method
  reached 59.15% (MAD) and 66.29% (DMAD) versus best uniform 54.24%/58.93%
  and best random 55.58%/60.27%.. Nobody has vouched for it; add support or
  contest it on this page.
