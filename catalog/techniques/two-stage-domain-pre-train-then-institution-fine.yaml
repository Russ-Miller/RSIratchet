description: >-
  Pre-train the model on broad financial corpora (filings, research reports,
  standards, market data) and then fine-tune on the deploying institution's
  own investment memos and risk rules with LoRA. Filed by the drafting stage
  from Frontiers in FinTech: Multimodal Foundation Models for Financial
  Reporting and Decision Science (2608.22724) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Mean absolute error of target
  price versus analyst consensus on 200 companies: 13.1% versus 16.2% for
  the analyst-input DCF spreadsheet, 18.7% for FinGPT single-stage, 24.3%
  for GPT-4 zero-shot; direction accuracy 0.751 versus 0.703/0.671/0.614..
  Nobody has vouched for it; add support or contest it on this page.
