id: gate-answer-separate-self-verification-call-contradictions
ref: TEC-0255
label: "Gate the answer on a separate self-verification call for con"
summary: >-
  Run one extra call asking the same model only whether the input facts are
  sufficient and consistent, and override the solver's numeric answer with
  abstention when it returns the 'contradiction' label.
description: >-
  Run one extra call asking the same model only whether the input facts are
  sufficient and consistent, and override the solver's numeric answer with
  abstention when it returns the 'contradiction' label. Filed by the
  drafting stage from Solving versus Verifying: Catching Contradictions in
  Tax Reasoning Systems (2609.05928) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Across all six models, contradiction
  abstention rose from 0-43% (solver alone) to 70-83% with the gate, at a
  clean-accuracy cost of 0-5.1 percentage points; false-flag rate on clean
  inputs 0-5.5%. Compared against a self-consistency baseline over three
  solve runs, which flagged only 11-35% of contradictions at a higher
  false-flag rate.. Nobody has vouched for it; add support or contest it on
  this page.
