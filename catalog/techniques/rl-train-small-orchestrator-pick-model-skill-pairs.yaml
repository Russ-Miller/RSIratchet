description: >-
  A lightweight policy emits, at each reasoning step, a triplet of which
  frozen expert model, which skill, and what query to dispatch, trained by
  group-relative RL on final-answer correctness plus a protocol-format
  penalty with no step-level Filed by the drafting stage from Maestro:
  Reinforcement Learning to Orchestrate Hierarchical Model-Skill Ensembles
  (2605.22177) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Average accuracy over ten multimodal benchmarks: 70.1%
  versus GPT-5 69.3% and Gemini-2.5-Pro 68.7%, plus component ablations (no
  model pool -12.1, no skill library -2.7, neither 55.8%) and reward
  ablations (no format reward -13.1, no outcome reward -8.8); also 78.09 on
  BFCL-V4 and 72.9 on tau2-bench.. Nobody has vouched for it; add support or
  contest it on this page.
