id: generate-several-designs-then-select-change-impact-analysis
ref: TEC-0624
label: "Generate several designs, then select by change-impact analy"
summary: >-
  Instead of a single patch, the system brainstorms N implementation designs
  over a repository code graph, produces one patch per design, and picks the
  patch whose static dependency impact and regression/new-feature test
  outcomes score best.
description: >-
  Instead of a single patch, the system brainstorms N implementation designs
  over a repository code graph, produces one patch per design, and picks the
  patch whose static dependency impact and regression/new-feature test
  outcomes score best. Filed by the drafting stage from Architecture-Aware
  Multi-Design Generation for Repository-Level Feature Addition (2603.01814)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Success rate on NoCode-bench Verified: 39.47% with Gemini-2.5-Pro vs
  28.95% best baseline (Agentless); ablations removing multi-design (-38.47%
  relative success), patch evaluation (-33.32%), code graph (-12.83%);
  design-count sweep on DeepSeek-v3.2 peaks at N=5 (88.64% selection
  accuracy, 34.21% success) and falls to 28.95% at N=9.. Nobody has vouched
  for it; add support or contest it on this page.
