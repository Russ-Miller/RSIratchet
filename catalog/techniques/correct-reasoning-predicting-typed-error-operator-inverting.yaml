description: >-
  Train an adapter to diagnose the active semantic error in a reasoning
  trace as an executable operator (type, location, corrupted vs repaired
  proposition) and iteratively apply applicability-checked inverse operators
  instead of regenerating Filed by the drafting stage from Semantic
  Reasoning Denoising: Correcting Language Model Reasoning with Semantic
  Operators (2608.22090) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Six in-domain benchmarks (GSM8K, MATH, HumanEval+, MBPP,
  MMLU, PIQA) on Llama-3-8B-Instruct: average 67.5 vs 64.3 for the strongest
  same-backbone baseline (DiffCoT) and 63.7 for SCoRe, five seeds,
  Holm-corrected; seven transfer targets on two backbones; ablations
  removing each loss term and each noise source.. Nobody has vouched for it;
  add support or contest it on this page.
