id: train-judges-mcts-pairs-crossing-length-correctness
ref: TEC-0868
label: "Train judges on MCTS pairs crossing length with correctness"
summary: >-
  Run step-level MCTS rollouts on multimodal reasoning seeds to produce
  short-correct, short-error, long-correct and long-error trajectories, then
  pair them across both axes as chosen/rejected data for judge SFT and RL.
description: >-
  Run step-level MCTS rollouts on multimodal reasoning seeds to produce
  short-correct, short-error, long-correct and long-error trajectories, then
  pair them across both axes as chosen/rejected data for judge SFT and RL.
  Filed by the drafting stage from Advancing Multimodal Judge Models through
  a Capability-Oriented Benchmark and MCTS-Driven Data Generation
  (2603.00546) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Pairwise accuracy on the authors' length-bias-avoidance
  split: adding MCTS data moved Qwen3-VL-8B from 26.15 (open-source SFT
  only) to 34.22 (SFT) and 44.53 (DAPO RL), with similar shifts on four
  other backbones, while VL-RewardBench and Multimodal RewardBench scores
  held or rose; no independent benchmark of length bias used.. Nobody has
  vouched for it; add support or contest it on this page.
