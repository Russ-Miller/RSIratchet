id: make-retrieval-agent-loop-over-verse-level-toolset
ref: TEC-0634
label: "Make retrieval an agent loop over a verse-level toolset"
summary: >-
  Instead of one retrieval pass, the model plans, calls semantic search /
  verse read / metadata tools repeatedly, inspects the retrieved verses, and
  revises its answer with a citation before responding.
description: >-
  Instead of one retrieval pass, the model plans, calls semantic search /
  verse read / metadata tools repeatedly, inspects the retrieved verses, and
  revises its answer with a citation before responding. Filed by the
  drafting stage from From RAG to Agentic RAG for Faithful Islamic Question
  Answering (2601.07528) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: %Correct on the 3,810-item IslamicFaithQA benchmark under
  LLM-as-judge: Qwen3-4B-2507 21.85 base, 38.85 +RAG, 48.90 +Agentic RAG;
  Fanar-2-27B 48.65 base, 51.50 +RAG, 57.30 +Agentic RAG. Of 36 recovered
  cases, 24 were not_attempted-to-correct and 12 incorrect-to-correct. Cost:
  502 to 1,520 tokens, 0.52s to 3.45s latency, ~6 tool calls.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [hallucination]
kind: retrieval
