id: strip-explanatory-failure-messages-bare-success-failure
ref: TEC-0623
label: "Strip explanatory failure messages to bare success/failure"
summary: >-
  Restrict environment feedback to a binary success/failure signal per
  action so the agent must infer why an action failed from images rather
  than from text.
description: >-
  Restrict environment feedback to a binary success/failure signal per
  action so the agent must infer why an action failed from images rather
  than from text. Filed by the drafting stage from AsgardBench -- Evaluating
  Visually Grounded Interactive Planning Under Minimal Feedback (2603.15888)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Compared three feedback conditions (none, success/failure, detailed)
  crossed with image and text-only input across several models; detailed
  feedback raised scores for all models and let some text-only agents match
  the image baseline, while the no-feedback condition lowered scores..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [evaluation-validity]
