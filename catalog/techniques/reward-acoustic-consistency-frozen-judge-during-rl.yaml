description: >-
  Augments the GRPO reward for ASR post-training with a group-normalized
  score from a separately pretrained, permanently frozen CTC model that
  aligns each sampled transcription against the audio, while inference
  remains a single greedy decode Filed by the drafting stage from Grounded
  in Sound: Reinforcement Learning with a Frozen Acoustic Judge to Curb ASR
  Insertion Hallucinations (2609.14455) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Against a schedule-matched WER-only
  GRPO baseline on 33,282 utterance-condition instances: insertions fell
  28.3% (AMI-IHM) and 22.3% (AMI-SDM) with meeting-level clustered bootstrap
  CIs excluding zero, WER fell 35.89 to 34.71 on AMI-SDM and was unchanged
  on the other five tiers; replicated over three seeds and checkpoints
  800/900/1000; beat 32-best CTC rescoring of the baseline with one
  hypothesis; insertion-AURC lower in 4/4 selective-ASR settings.. Nobody
  has vouched for it; add support or contest it on this page.
