id: keep-rubric-reward-per-step-offset-outside-baseline
ref: TEC-0497
label: "Keep rubric reward as a per-step offset outside the baseline"
summary: >-
  Attributes each rubric item to the reasoning step it judges, normalizes
  per-step scores across rollouts, and adds them as a bounded offset to a
  separately normalized outcome advantage so rubric noise never enters the
  group baseline.
description: >-
  Attributes each rubric item to the reasoning step it judges, normalizes
  per-step scores across rollouts, and adds them as a bounded offset to a
  separately normalized outcome advantage so rubric noise never enters the
  group baseline. Filed by the drafting stage from Step-wise Rubric Rewards
  for LLM Reasoning (2605.17291) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Average accuracy over six math benchmarks vs
  GRPO, DAPO, RaR, GRPO-VPS, RGR-GRPO (+3.57 over RaR at 8B, +2.75 at 32B);
  self-correction looping rate on 960 AIME 2025 rollouts fell 48.1% to
  26.5%; Faithful Reasoning Rate 34.5% to 46.7%; ablation shows removing
  cross-rollout step normalization collapses training to 56.76 and merged
  scalar advantage scores 72.06 vs 72.53.. Nobody has vouched for it; add
  support or contest it on this page.
