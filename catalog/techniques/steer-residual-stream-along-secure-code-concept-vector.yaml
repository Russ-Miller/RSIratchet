description: >-
  Extract a difference-in-means vector between activations on secure and
  insecure code completions, find the layer where adding it most changes the
  model's secure/insecure choice, and add it to that layer's residual stream
  at every forward pa Filed by the drafting stage from Security-by-Design
  for LLM-Based Code Generation: Leveraging Internal Representations for
  Concept-Driven Steering Mechanisms (2603.11212) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: pass@1, secure@1pass,
  secure-pass@1 and SVEN security rate on CodeGuard+ and CWEval, averaged
  over 10 runs, against unsteered baselines and against SafeCoder
  fine-tuning, constrained decoding and secure-prefix prompting; negative
  steering used as a direction check.. Nobody has vouched for it; add
  support or contest it on this page.
