id: use-vlm-progress-only-initialize-value-function-then
ref: TEC-0562
label: "Use VLM progress only to initialize the value function, then"
summary: >-
  An LLM decomposes the task into scene-graph-grounded subgoals, a VLM
  scores per-step progress (median-filtered against hallucinated spikes) for
  a brief value-function initialization phase, after which PPO finetunes
  using only policy self-ce
description: >-
