id: scale-rope-positions-per-layer-searched-bezier-constrained
ref: TEC-0347
label: "Scale RoPE positions per layer, searched by Bezier-constrain"
summary: >-
  Assigns a distinct RoPE position-scaling factor to each transformer layer,
  with the per-layer factors read off a cubic Bezier curve whose control
  points are found by a genetic search on a few hundred position-varied
  examples.
description: >-
  Assigns a distinct RoPE position-scaling factor to each transformer layer,
  with the per-layer factors read off a cubic Bezier curve whose control
  points are found by a genetic search on a few hundred position-varied
  examples. Filed by the drafting stage from Mitigating Position Bias in
  Transformers via Layer-Specific Positional Embedding Scaling (2606.27705)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy at evidence positions 0-100% on MDQA and key-value retrieval
  against baseline, Positional Interpolation, Attention Buckets, Ms-PoE and
  MoICE; best average gain 11.2 points (Vicuna key-value, 80.9 to 92.1);
  transfer to ZeroSCROLLS/L-Eval; MMLU and C-Eval within ~1 point of
  baseline; inference time 0.71s/sample equal to baseline, vs 1.03 Ms-PoE
  and 1.72 MoICE.. Nobody has vouched for it; add support or contest it on
  this page.
addresses: [long-context-degradation]
kind: decoding
sources: [arxiv-2606-27705]
status: proposed
