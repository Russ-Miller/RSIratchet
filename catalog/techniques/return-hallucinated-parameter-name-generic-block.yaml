label: "Return the hallucinated parameter name, not a generic block"
summary: >-
  A zero-initialized LoRA adapter runs concurrently with the frozen base
  model, is trained only on a trigger token and label, and verbalizes which
  tool-call parameter is ungrounded; the harness blocks the call and injects
  that parameter name
description: >-
  A zero-initialized LoRA adapter runs concurrently with the frozen base
  model, is trained only on a trigger token and label, and verbalizes which
  tool-call parameter is ungrounded; the harness blocks the call and injects
  that parameter name Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: On 500 in-distribution and 200 ToolAlpaca
  out-of-distribution trajectories: parameter F1 61.2 with specific feedback
  vs 51.3 generic and 52.1 no intervention (ID); false block rate 2.9% vs
  9.4%; recovery rate 37.0% vs 23.9% (ID) and 29.3% vs 20.0% (OOD); failed
  retry attempts 1.06 vs 1.47. Detection itself reached 0.966 AUROC ID vs
  0.915 external judge and 0.782 linear probe.. Nobody has vouched for it;
  add support or contest it on this page.
