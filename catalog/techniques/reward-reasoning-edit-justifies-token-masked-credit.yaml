id: reward-reasoning-edit-justifies-token-masked-credit
ref: TEC-0184
label: "Reward reasoning by the edit it justifies, with token-masked"
summary: >-
  An editor revises the image according to the model's stated quality
  reasoning and a frozen judge scores the change; that change rewards only
  the reasoning tokens while human ratings reward only the rating tokens,
  via masked GRPO advantages.
description: >-
  An editor revises the image according to the model's stated quality
  reasoning and a frozen judge scores the change; that change rewards only
  the reasoning tokens while human ratings reward only the rating tokens,
  via masked GRPO advantages. Filed by the drafting stage from MR-IQA-2:
  Faithful Image Quality Reflection via Fine-Grained Credit Assignment
  (2608.18579) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean judge-scored quality gain from reasoning-guided
  editing rose from -0.136 (baseline) and -0.260 (rating-only) to +1.079
  with the credit mask, with rating alignment held at 0.838/0.812 average
  PLCC/SRCC; gains persisted when the editor was swapped (Mage-Flow) and
  judges swapped (Q-Insight, GPT-5.6 Sol, 81.4% 3AFC preference). The
  unmasked variant got a larger raw gain (+1.442) but collapsed to a
  near-universal edit.. Nobody has vouched for it; add support or contest it
  on this page.
