label: "Task-Method-Knowledge prompting"
summary: >-
  Give the model an explicit hierarchical model of the task: the goals, the
  methods that achieve each, and the knowledge of why each step is taken,
  drawn from the TMK framework in educational science, before asking it to
  plan.
description: >-
  Give the model an explicit hierarchical model of the task: the goals, the
  methods that achieve each, and the knowledge of why each step is taken,
  drawn from the TMK framework in educational science, before asking it to
  plan. Filed by the drafting stage from Knowledge Model Prompting Increases
  LLM Performance on Planning Tasks (2602.03900) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Plan validity on PlanBench
  Blocksworld variants with and without TMK across several models; gains up
  to 65.8 points on Random Blocksworld for o1; no gain for o1-mini on
  Mystery.. Nobody has vouched for it; add support or contest it on this
  page.
