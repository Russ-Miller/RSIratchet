id: interleave-move-rationale-redrawn-compact-grid-cot
ref: TEC-0603
label: "Interleave a move rationale with a redrawn compact grid in C"
summary: >-
  Train reasoning traces that, at each step, first state in natural language
  which move to take and then re-emit the whole map in a compact ASCII grid
  with the player moved.
description: >-
  Train reasoning traces that, at each step, first state in natural language
  which move to take and then re-emit the whole map in a compact ASCII grid
  with the player moved. Filed by the drafting stage from On the
  Out-of-Distribution Generalization of Reasoning in Multimodal LLMs for
  Simple Visual Planning Tasks (2602.15460) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Move-sequence validity simulated in
  the environment (no hole entered, ends on treasure), against same-model
  no-CoT, description-only, grid-only and table-only CoT variants, plus
  image-input and Mirage latent-reasoning baselines, on in-distribution
  3x3-6x6 maps and out-of-distribution 7x7-10x10 maps with and without
  controlled start-goal distance.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [planning]
kind: training
sources: [arxiv-2602-15460]
status: proposed
