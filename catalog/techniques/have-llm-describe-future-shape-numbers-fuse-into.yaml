description: >-
  An LLM calls statistical tools over the history and outputs a non-numeric
  morphology description, which is encoded and gate-fused into a time series
  foundation model's decoder, with the reasoner refined by RL that credits
  each turn by its m Filed by the drafting stage from KairosAgent: Agentic
  Time Series Forecasting with Fused Semantic Reasoning (2605.30002) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: MSE/MAE
  on Time-MMD (best in 6 of 8 domains against zero-shot TSFMs and full-shot
  supervised multimodal and unimodal models) and MAE/MASE on Time-IMM;
  ablations drop the morphology text (MASE worsens on four datasets) and
  swap turn-level for outcome-level RL, where outcome-level RL scored below
  SFT-only on all three reasoning domains and turn-level above both.. Nobody
  has vouched for it; add support or contest it on this page.
