description: >-
  A Planner-Composer-Evaluator pipeline turns the assumptions latent in an
  LLM's reasoning trace into a decision tree whose internal nodes are
  true/false environment assumptions and whose leaves are physical or
  communication actions, then pic Filed by the drafting stage from From
  Assumptions to Actions: Turning LLM Reasoning into Uncertainty-Aware
  Planning for Embodied Agents (2602.04326) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Total steps on C-WAH and
  transported-object rate on TDW-MAT against CoELA, REVECA, CaPo and CoTS
  under identical environments and three backbones; plus module ablations
  (removing Planner, Composer or Evaluator each degrades steps) and a
  12-participant user study on perceived efficiency and trust.. Nobody has
  vouched for it; add support or contest it on this page.
