description: >-
  Decode transient key projections into Top-k sparse-autoencoder feature IDs
  during a streaming prefill, build a CPU inverted index, discard the KV
  cache, then retrieve spans by query-feature co-activation unioned with
  BM25 and lead/tail posi Filed by the drafting stage from
  S$^3$-Attention:Attention-Aligned Endogenous Retrieval for Memory-Bounded
  Long-Context Inference (2601.17702) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: LongBench scores against a full-KV
  upper bound and BM25/RAG/KV-compression baselines under one protocol:
  hybrid retains 99.4% of full-context average on Llama-3.1-8B and ~99% on
  Mistral; the SAE-only ablation falls 2-3 points below BM25 on all three
  models. Also HotpotQA answer recall (0.84 hybrid vs 0.78 pure vs 0.77
  BM25/RAG) and KL to full-context next-token distribution.. Nobody has
  vouched for it; add support or contest it on this page.
