id: split-search-policy-weighting-candidate-generation
ref: TEC-0578
label: "Split search-policy weighting from candidate generation"
summary: >-
  One LLM agent reads the optimization history and outputs normalized
  weights over exploitation, informativeness, diversity and
  representativeness, and a second agent generates the next candidate by
  optimizing the weighted score.
