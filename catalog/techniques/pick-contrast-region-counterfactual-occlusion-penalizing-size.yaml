description: >-
  At inference, propose anatomical masks with a medical segmentation model,
  score each by the drop in answer log-likelihood under occlusion minus an
  area penalty, then use the top compact mask for classifier-free guidance
  plus a step-wise tem Filed by the drafting stage from Counterfactual
  Anatomy-guided Spatial-Temporal Decoding for Annotation-Free Hallucination
  Mitigation in Medical VLMs (2608.17427) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Overall and closed-ended accuracy on
  SLAKE and MIMIC-CXR against standard decoding, VCD, DoLA, OPERA, and
  GT-annotation-based ARCD, on Phi-3.5V-Med, HuatuoGPT-Vision-7B and
  LLaVA-Med-7B; ablations removing the area penalty (-3.4%), random mask
  selection (-4.4%), and each decoding branch.. Nobody has vouched for it;
  add support or contest it on this page.
