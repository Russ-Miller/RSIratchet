summary: >-
  At inference, propose anatomical masks with a medical segmentation model,
  score each by the drop in answer likelihood when it is occluded minus an
  area and occlusion-variance penalty, then use the top compact mask for
  classifier-free-guidan
description: >-
  At inference, propose anatomical masks with a medical segmentation model,
  score each by the drop in answer likelihood when it is occluded minus an
  area and occlusion-variance penalty, then use the top compact mask for
  classifier-free-guidan Filed by the drafting stage from Counterfactual
  Anatomy-guided Spatial-Temporal Decoding for Annotation-Free Hallucination
  Mitigation in Medical VLMs (2608.17427) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Overall/closed/open accuracy on SLAKE
  and MIMIC-CXR against plain decoding, VCD, DoLA, OPERA and
  ground-truth-ROI ARCD across three Med-VLMs; closed accuracy on
  Phi-3.5V-Med/SLAKE rose 61.42 to 81.49; ablations removing the area
  penalty (-3.4%), using random masks (-4.4%), or a single occlusion mode
  (-3.3/-4.0%).. Nobody has vouched for it; add support or contest it on
  this page.
