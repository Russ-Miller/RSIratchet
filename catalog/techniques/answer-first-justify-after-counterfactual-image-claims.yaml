id: answer-first-justify-after-counterfactual-image-claims
ref: TEC-0586
label: "Answer first, justify after, for counterfactual image claims"
summary: >-
  Have the model commit to an accept/reject verdict on a visual statement
  before producing any reasoning, instead of reasoning first.
description: >-
  Have the model commit to an accept/reject verdict on a visual statement
  before producing any reasoning, instead of reasoning first. Filed by the
  drafting stage from Once Correct, Still Wrong: Counterfactual
  Hallucination in Multilingual Vision-Language Models (2602.05437) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Compared
  against reasoning-first prompting on the CounterFactual Hallucination Rate
  (counterfactual acceptance conditioned on correctly answering the paired
  true statement) across the M2CQA benchmark; answer-first reported more
  robust, no absolute numbers given in the source text.. Nobody has vouched
  for it; add support or contest it on this page.
