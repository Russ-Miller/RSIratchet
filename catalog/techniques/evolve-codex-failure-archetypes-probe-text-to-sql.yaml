description: >-
  An agent loop generates vulnerability hypotheses per sample, builds
  targeted semantics-preserving perturbations guided by a growing codex of
  abstracted past failures, verifies them against the target model, and
  compresses new archetypes bac Filed by the drafting stage from Beyond
  Static Rules: Automated Discovery of Latent Vulnerabilities in Text-to-SQL
  (2607.03833) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Vulnerability Exposure Rate and Attempts per Discovery
  against a static expert-rule baseline built from
  Dr.Spider/SpiderSyn/ADVETA: VER 76.98% vs 50.66% on BIRD and 58.45% vs
  39.79% on Spider, with lower attempts per discovery; plus cross-model
  transfer gains and a 1,580-sample SFT mitigation run.. Nobody has vouched
  for it; add support or contest it on this page.
