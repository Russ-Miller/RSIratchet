description: >-
  Train a vision-language financial model in two stages: large-scale
  financial-corpus pre-training with a valuation-consistency loss, then
  parameter-efficient fine-tuning on an institution's own investment memos
  and risk rules. Filed by the drafting stage from Frontiers in FinTech:
  Multimodal Foundation Models for Financial Reporting and Decision Science
  (2608.22724) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean absolute error and RMSE of target price versus
  analyst consensus on 200 companies, plus direction accuracy of
  Buy/Hold/Sell against consensus revisions within 90 days; reported 13.1%
  MAE vs 16.2% for the best baseline and 18.7% for single-stage
  fine-tuning.. Nobody has vouched for it; add support or contest it on this
  page.
