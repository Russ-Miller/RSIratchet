id: probe-fixed-mid-network-layer-truthfulness
ref: TEC-0358
label: "Probe a fixed mid-network layer for truthfulness"
summary: >-
  Train a single affine logistic head on the last-token hidden state of one
  mid-network transformer block to classify a supplied answer as truthful or
  hallucinated from one forward pass.
description: >-
  Train a single affine logistic head on the last-token hidden state of one
  mid-network transformer block to classify a supplied answer as truthful or
  hallucinated from one forward pass. Filed by the drafting stage from
  Hallucination Is Linearly Decodable from Mid-Layer Hidden States in
  Quantized LLMs (2606.02628) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Best-block AUROC per model-dataset cell against
  INSIDE EigenScore (K=10), exact-match and embedding self-consistency
  (K=5), and attention entropy; probes exceeded the best sampling detector
  by at least 0.367 AUROC in all 12 cells, with 3 seeds (std <= 0.025) and
  classifier-free centroid/spread geometry as corroboration.. Nobody has
  vouched for it; add support or contest it on this page.
addresses: [hallucination]
