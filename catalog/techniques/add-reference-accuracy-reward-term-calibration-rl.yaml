id: add-reference-accuracy-reward-term-calibration-rl
ref: TEC-0239
label: "Add a reference-accuracy reward term to calibration RL"
summary: >-
  Alongside correctness and a threshold-based calibration reward, reward the
  policy for getting right a question the base model previously missed in
  all 10 samples and penalize it for getting wrong a question the base model
  previously got rig
description: >-
  Alongside correctness and a threshold-based calibration reward, reward the
  policy for getting right a question the base model previously missed in
  all 10 samples and penalize it for getting wrong a question the base model
  previously got rig Filed by the drafting stage from Scaling with
  Confidence: Calibrating Confidence of LLMs for Adaptive Test Time Scaling
  (2607.01612) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Accuracy, AUROC and binned ECE on eight text and
  multimodal benchmarks against Base, Self-Consistency, SFT+Ref, RLVR,
  SaySelf and RLCR, averaged over three seeds; ablation removing only the
  reference term (C3RL w/o Ref) showed consistently worse ECE at similar
  accuracy.. Nobody has vouched for it; add support or contest it on this
  page.
