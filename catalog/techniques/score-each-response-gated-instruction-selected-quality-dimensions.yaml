id: score-each-response-gated-instruction-selected-quality-dimensions
ref: TEC-0522
label: "Score each response on gated, instruction-selected quality d"
summary: >-
  A reward model predicts which of 21 dimensions are relevant from the
  instruction alone, scores the response on all dimensions, and combines
  only the top-k dimensions with learned weights into one reward in a single
  forward pass.
description: >-
  A reward model predicts which of 21 dimensions are relevant from the
  instruction alone, scores the response on all dimensions, and combines
  only the top-k dimensions with learned weights into one reward in a single
  forward pass. Filed by the drafting stage from Learning What Matters:
  Dynamic Dimension Selection and Aggregation for Interpretable
  Vision-Language Reward Modeling (2604.05445) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Controlled ablation on a fixed
  200k subset, VL-RewardBench overall/macro accuracy: scalar head
  64.55/60.87, 21 heads without per-dimension ranking loss 68.72/65.94,
  coarse 7-dimension supervision 67.12/64.20, fine 21-dimension without
  gating 69.77/68.51, full model 70.81/69.96; top-k sweep peaks at k=3. Full
  model on the complete dataset reaches 73.06 overall / 71.84 macro versus
  72.98/68.82 for Skywork-VL-Reward.. Nobody has vouched for it; add support
  or contest it on this page.
