description: >-
  Sample textual gradients only from examples the current prompt answers
  wrongly, generate several candidate prompts, and keep one only if its
  improvement on the hard batch beats a scheduled penalty times its
  regression on a held-back sample Filed by the drafting stage from STEVE:
  Stabilizing Textual Gradient-Based Prompt Optimization via Error-Driven
  Refinement and Regularized Verification (2609.23716) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: Accuracy on 10 reasoning
  benchmarks across three evaluator/optimizer models against Zero-shot CoT,
  Three-shot CoT, TextGrad and REVOLVE (average ~3.5 points over REVOLVE),
  plus a modernized run with gpt-5.4-mini/gpt-5.4 on BBEH, GSM8K-Platinum
  and DS-1000; ablations remove the gate (lower) and swap in full-dataset or
  correct-only gradients (lower, correct-only falls below the initial
  prompt).. Nobody has vouched for it; add support or contest it on this
  page.
