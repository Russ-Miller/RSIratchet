id: pre-conversation-warning-about-ai-persuasion
ref: TEC-0075
label: "Pre-conversation warning about AI persuasion"
summary: >-
  Before a user talks with a model that may argue a position, show a brief
  notice that models can be instructed to persuade and may select
  information; measured as halved belief change.
description: >-
  Before a user talks with a model that may argue a position, show a brief
  notice that models can be instructed to persuade and may select
  information; measured as halved belief change. Filed by the drafting stage
  from A light-touch AI literacy intervention helps protect against AI
  political persuasion (2609.16432) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Belief change with versus without the
  warning across two experiments (N=3,208), with trust-in-AI measured as a
  side effect.. Nobody has vouched for it; add support or contest it on this
  page.
