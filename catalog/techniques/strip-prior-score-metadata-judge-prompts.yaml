id: strip-prior-score-metadata-judge-prompts
ref: TEC-0269
label: "Strip prior-score metadata from judge prompts"
summary: >-
  Remove revision, attempt-index and prior-score fields from the judge's
  context so each evaluation sees only task, answer and rubric.
description: >-
  Remove revision, attempt-index and prior-score fields from the judge's
  context so each evaluation sees only task, answer and rubric. Filed by the
  drafting stage from Anchoring Bias in LLM-as-a-Judge Systems: Prior Scores
  Compromise Evaluation Independence (2608.25869) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Compared C0 (no metadata)
  against C2 (anchored metadata) over 185,271 valid evaluations with
  task-stratified bootstrap intervals; Chain-of-Thought and an explicit
  disregard-metadata warning were tested as alternatives and neither reduced
  the total effect on the numerical pair, though the warning zeroed the
  paired accuracy effect on the categorical task.. Nobody has vouched for
  it; add support or contest it on this page.
addresses: [critique]
kind: prompting
sources: [arxiv-2608-25869]
status: proposed
