id: fine-tune-synthesized-instruction-plus-completion-pairs
ref: TEC-0614
label: "Fine-tune on synthesized instruction-plus-completion pairs"
summary: >-
  Mine middle-code spans from GitHub Python files, have a strong code model
  write a matching fine-grained instruction for each span, and
  supervised-fine-tune the completion model on the resulting
  instruction-prefix-suffix-to-middle pairs.
description: >-
  Mine middle-code spans from GitHub Python files, have a strong code model
  write a matching fine-grained instruction for each span, and
  supervised-fine-tune the completion model on the resulting
  instruction-prefix-suffix-to-middle pairs. Filed by the drafting stage
  from Evaluating and Achieving Controllable Code Completion in Code LLM
  (2601.15879) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: SFT on 200k synthesized pairs raised the 32B model's
  average instruction-following rate from 22.8 to 66.6 on C3-Bench
  (scale-control adherence 16.9 to 80.7) with conventional completion
  benchmark scores reported as maintained; gains on the
  implementation-control side were smaller and bounded by the base model's
  pass@1. 10-gram decontamination against the benchmark was applied; no
  matched-data-volume control on a different objective.. Nobody has vouched
  for it; add support or contest it on this page.
addresses: [procedure-following]
