id: fine-tune-span-detector-code-tool-output-evidence
ref: TEC-0300
label: "Fine-tune a span detector on code and tool-output evidence"
summary: >-
  Builds grounded answers from gold repository patches and tool
  observations, injects localized edits to recover exact character spans,
  and fine-tunes a 2B generative model to emit unsupported spans with a
  category label.
description: >-
  Builds grounded answers from gold repository patches and tool
  observations, injects localized edits to recover exact character spans,
  and fine-tunes a 2B generative model to emit unsupported spans with a
  category label. Filed by the drafting stage from Beyond Document
  Grounding: Span-Level Hallucination Detection over Code, Tool Output, and
  Documents (2607.00895) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Character-overlap span P/R/F1 and example-F1 on a
  10,698-example unified test set split by grounding source, against
  LettuceDetect-large, answer-level faithfulness models (HHEM, Lynx,
  Granite-Guardian, MiniCheck), an mmBERT encoder, and zero-shot
  Nemotron-3-Ultra and gpt-oss-120b judges; also 81.8 RAGTruth example-F1
  and 0.724 English PsiloQA IoU.. Nobody has vouched for it; add support or
  contest it on this page.
