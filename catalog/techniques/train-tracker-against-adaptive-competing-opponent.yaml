label: "Train the tracker against an adaptive competing opponent"
summary: >-
  Run a second agent with the same architecture and SFT initialization but a
  reward shifted to a closer optimal following distance, so it contests the
  same target and generates escalating occlusion, path-crossing and blocking
  during the track
description: >-
  Run a second agent with the same architecture and SFT initialization but a
  reward shifted to a closer optimal following distance, so it contests the
  same target and generates escalating occlusion, path-crossing and blocking
  during the track Filed by the drafting stage from CoMaTrack: Competitive
  Multi-Agent Game-Theoretic Tracking with Vision-Language-Action Models
  (2603.22846) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation on EVT-Bench STT: SFT-only 88.2% SR / 85.4% TR /
  3.1% CR, single-agent RL 89.5 / 88.0 / 2.2, multi-agent RL 92.1 / 90.3 /
  0.9; plus a success-rate-versus-training-episodes curve under three
  opponent types where static obstacle gives marginal gains and random
  interference degrades.. Nobody has vouched for it; add support or contest
  it on this page.
