id: score-layer-to-layer-attention-entropy-spread-hallucination
ref: TEC-0053
label: "Score layer-to-layer attention entropy spread as a hallucina"
summary: >-
  At each generation step, compute the Shannon entropy of each layer's
  attention distribution and take the standard deviation across layers, then
  aggregate over the sequence as a feature for an error classifier.
description: >-
  At each generation step, compute the Shannon entropy of each layer's
  attention distribution and take the standard deviation across layers, then
  aggregate over the sequence as a feature for an error classifier. Filed by
  the drafting stage from Attention Dispersion as a Diagnostic Signal for
  Hallucination in Large Language Models (2609.18320) with status proposed:
  the paper introduces or tests it, and the claim drafted from the paper is
  its first evidence. The paper validated it by: ROC-AUC of a
  logistic-regression failure classifier under repeated stratified 5-fold
  CV, against an output-entropy/probability baseline, on GSM8K and MATH-500
  with Qwen2.5-1.5B/3B; gains 0.009-0.076 AUC with Wilcoxon p<0.01.. Nobody
  has vouched for it; add support or contest it on this page.
