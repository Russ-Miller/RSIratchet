id: condition-diffusion-forecaster-llm-temporal-memory
ref: TEC-0618
label: "Condition the diffusion forecaster on an LLM temporal memory"
summary: >-
  A LoRA-adapted first-six-layer GPT-2 encoder, pretrained with an
  autoregressive MSE loss, produces sequence representations that condition
  a UViT diffusion model trained to denoise history and future jointly with
  independently sampled times
description: >-
  A LoRA-adapted first-six-layer GPT-2 encoder, pretrained with an
  autoregressive MSE loss, produces sequence representations that condition
  a UViT diffusion model trained to denoise history and future jointly with
  independently sampled times Filed by the drafting stage from Enhancing
  few-shot time series forecasting with LLM-guided diffusion (2602.00040)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  MSE/MAE against LLM-based (TimeLLM, GPT4TS, CALF), Transformer (PatchTST,
  iTransformer, Crossformer) and diffusion (TMDM, TimeGrad, TimeDiff)
  baselines on seven datasets; a four-way Weather ablation swapping the
  conditioning source (LLM only, Autoformer+diffusion 0.357 MSE,
  RAG+diffusion 0.531, full 0.248); a GPT-2 layer-depth sweep; and a
  1/5/50/100% fine-tuning sweep on two ETT transfer pairs.. Nobody has
  vouched for it; add support or contest it on this page.
