id: judge-collaborative-panel-consensus-early-exit
ref: TEC-0695
label: "Judge by collaborative panel with consensus early exit"
summary: >-
  Several different LLMs independently score an item with confidence and
  justification, then share and revise their assessments over up to three
  rounds, stopping as soon as they agree and escalating unresolved cases to
  a stronger final judge.
description: >-
  Several different LLMs independently score an item with confidence and
  justification, then share and revise their assessments over up to three
  rounds, stopping as soon as they agree and escalating unresolved cases to
  a stronger final judge. Filed by the drafting stage from CollabEval:
  Enhancing LLM-as-a-Judge via Multi-Agent Collaboration (2603.00993) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Accuracy
  against SummEval human expert scores and Arena human preference winners,
  compared with each constituent model judging alone and with a sequential
  round-table/majority-vote baseline; also reports gap-size distribution of
  errors and over/under-evaluation ratios, and a debate-mechanism variant of
  the same panel.. Nobody has vouched for it; add support or contest it on
  this page.
