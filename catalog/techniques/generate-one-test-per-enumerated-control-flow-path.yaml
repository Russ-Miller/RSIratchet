label: "Generate one test per enumerated control-flow path"
summary: >-
  Builds a statement-level CFG per function, enumerates execution paths,
  synthesizes a separate test per path with helper calls restricted to a
  retrieved/declared operation map, then compiles, runs and repairs each
  test before merging.
description: >-
