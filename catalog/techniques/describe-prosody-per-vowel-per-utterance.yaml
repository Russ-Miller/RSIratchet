id: describe-prosody-per-vowel-per-utterance
ref: TEC-0596
label: "Describe prosody per vowel, not per utterance"
summary: >-
  Force-align the transcript, extract pitch, intensity and duration
  descriptors per vowel segment, normalize by speaker and vowel type, bin
  into ordinal words, and append those natural-language descriptors to the
  transcript given to a text-on
description: >-
  Force-align the transcript, extract pitch, intensity and duration
  descriptors per vowel segment, normalize by speaker and vowel type, bin
  into ordinal words, and append those natural-language descriptors to the
  transcript given to a text-on Filed by the drafting stage from
  VowelPrompt: Hearing Speech Emotions from Text via Vowel-level Prosodic
  Augmentation (2602.06270) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Unweighted accuracy and weighted F1 on IEMOCAP,
  MELD, CaFE, EmoDB, ASVP-ESD against a transcript-only prompt and
  SpeechCueLLM (utterance-level prosody text); zero-shot gains up to 7.8
  UACC over transcript-only on IEMOCAP with GPT-4o, and 1.5-2.7 weighted F1
  over SpeechCueLLM after SFT/GRPO.. Nobody has vouched for it; add support
  or contest it on this page.
