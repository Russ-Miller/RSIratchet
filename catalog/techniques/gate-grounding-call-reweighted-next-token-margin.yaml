description: >-
  At each decoding step it reweights the top-k candidates by support from a
  growing pool of textual visual observations, and when the reweighted
  top-two margin stays small it calls a small grounding VLM to pick the
  token and emit one reusable Filed by the drafting stage from See It, Say
  It, Sorted: An Iterative Training-Free Framework for Visually-Grounded
  Multimodal Reasoning in LVLMs (2602.21497) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: TreeBench overall accuracy against
  each unmodified backbone (e.g. Qwen2.5-VL-7B 37.0 to 47.9), against
  training-free baselines on the same backbone (Woodpecker 36.3, ViperGPT
  38.3, ControlMLLM 40.5, beam 38.8, self-consistency 39.0), against RL
  'think-with-images' models (DeepEyes-7B 37.5, Pixel-Reasoner-7B 39.0,
  TreeVGR-7B 50.4), plus RH-AUC 0.51 to 0.58 and five general benchmarks;
  ablation isolates supervisor (40.7), generic 3B decider (43.7) and
  grounding decider (47.9), with the 3B decider alone at 30.1.. Nobody has
  vouched for it; add support or contest it on this page.
