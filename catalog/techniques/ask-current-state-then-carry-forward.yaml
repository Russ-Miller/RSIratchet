id: ask-current-state-then-carry-forward
ref: TEC-0091
label: "Ask for the current state, then carry it forward"
summary: >-
  Instead of prompting the agent to forecast directly, have it search for
  and estimate the most recent period's distribution and use that estimate
  as the forecast.
description: >-
  Instead of prompting the agent to forecast directly, have it search for
  and estimate the most recent period's distribution and use that estimate
  as the forecast. Filed by the drafting stage from RAP: Research Attention
  Prediction Reveals Target-Conditioned Evidence Acquisition Biases
  (2609.10092) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: State-as-Forecast beat direct Forecast on episode-level
  Spearman agreement for all four diagnostic models under expanding-history
  access; frozen-evidence replay with byte-identical query traces and
  matched search-call budgets attributed a shared part of the gap to
  retrieval rather than readout.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [forecasting]
kind: prompting
sources: [arxiv-2609-10092]
status: proposed
