description: >-
  Trains a generator in three passes over retrieved evidence: SFT on
  context-saturated prompts with gold answers, DPO on pairs built from the
  model's own correct/incorrect generations under correct versus distractor
  evidence, and GRPO rewardi Filed by the drafting stage from Hit-RAG:
  Learning to Reason with Long Contexts via Preference Alignment
  (2603.07023) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Cumulative ablation on Qwen3-8B and Llama3.1-8B across
  seven QA datasets against no-retrieval and retrieval-only baselines; e.g.
  Qwen3-8B PopQA 20.6 (no RAG) to 52.1 (RAG) to 58.4 (+SFT) to 62.4 (+DPO)
  to 63.1 (+GRPO). No matched-compute or data-volume control for the staging
  itself.. Nobody has vouched for it; add support or contest it on this
  page.
