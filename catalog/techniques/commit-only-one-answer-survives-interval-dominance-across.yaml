description: >-
  Treat an ensemble of differently-configured LoRA adapters on a frozen
  backbone as a credal set, bound each candidate answer's probability by its
  min and max over adapters, and answer only when exactly one candidate is
  undominated — applied Filed by the drafting stage from Credal Large
  Language Models for Semantic Commitment under Uncertainty (2608.23244)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  AUROC for detecting the model's own errors and corrupted inputs, accuracy
  at 80% coverage, ECE/NLL, gold-in-set rate, and commit rate on clean vs
  corrupted prompts, against standard LLM entropy/max-prob, semantic entropy
  (NLI and cosine), Bayesian-LoRA KFAC, Laplace-LoRA, and the same five
  adapters mean-pooled, across three backbones and five datasets.. Nobody
  has vouched for it; add support or contest it on this page.
