description: >-
  Roll an LLM-generated action plan forward on an explicit graph world model
  of object relations, preconditions, effects and safety constraints, apply
  edits whose corrections follow from the action semantics, and return only
  unresolved semant Filed by the drafting stage from GAVEL: Graph World
  Models for Verified and Efficient Long-Horizon LLM Task Planning
  (2609.19315) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Single-task success on 100 BEHAVIOR-1K tasks: graph
  repair only reached 67.7% with Qwen3-4B at 1 LLM call vs 55.4% for
  SayPlan-style feedback replanning at 3.4 calls, and 76.2% vs 76.4% for
  Qwen3-8B; adding semantic-only re-queries gave 88.8% and 91.8% at 1.7 and
  1.5 calls. Multi-task: 92.6% vs 75.6% feedback-only and 60.2% for
  graph-edit-only planning, with shorter distance and ~12s less planning
  time. On a 100-instruction subset, GPT-5.6 Sol went 24.6% to 99.2% and
  Claude Sonnet 5 38.6% to 99.4%.. Nobody has vouched for it; add support or
  contest it on this page.
