id: interleave-forward-cot-predicted-image-then-inverse-cot
ref: TEC-0310
label: "Interleave forward CoT, predicted image, then inverse CoT be"
summary: >-
  In one autoregressive sequence the model writes a textual subgoal,
  generates the next-state image, then writes inverse-dynamics reasoning
  grounded on that image, and the action head attends to the whole chain.
description: >-
  In one autoregressive sequence the model writes a textual subgoal,
  generates the next-state image, then writes inverse-dynamics reasoning
  grounded on that image, and the action head attends to the whole chain.
  Filed by the drafting stage from ThinkingVLA: Interleaved Vision and
  Language Reasoning for Robotic Manipulation (2606.17937) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Success rate on 20
  RoboTwin 2.0 tasks (77.9% Easy / 29.3% Hard average, best on Horizon=2 and
  3) against pi-0, XVLA, UP-VLA and BagelVLA, plus five real ALOHA tasks
  against pi-0, pi-0.5 and UP-VLA, with component ablations removing each
  reasoning stage.. Nobody has vouched for it; add support or contest it on
  this page.
