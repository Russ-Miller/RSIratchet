description: >-
  A large VLA generates candidate action chunks asynchronously from an older
  observation, then a lightweight RL-trained edit policy adjusts those
  candidates using the observation available at execution time and a learned
  Q-function picks the Filed by the drafting stage from Reinforcement
  Learning for Real-Time Vision-Language-Action Policies (2609.18207) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Kinetix:
  96.2% average success under 4-step delay, above DSRL+RTC, EXPO-FT,
  EXPO-FT+RTC (by 20.1, 21.3, 14.5 points) and above the zero-delay RLPD
  baseline at 81.4%; real robot: average 29/30 trials vs 25/30 for EXPO-FT
  w/ RTC and 12.5/30 for the SFT starting policy, with online data capped at
  10 minutes per task.. Nobody has vouched for it; add support or contest it
  on this page.
