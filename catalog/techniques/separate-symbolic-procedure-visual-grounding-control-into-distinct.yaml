id: separate-symbolic-procedure-visual-grounding-control-into-distinct
ref: TEC-0637
label: "Separate symbolic procedure, visual grounding, and control i"
summary: >-
  An LLM emits a procedurally validated subtask sequence in language space
  with no visual input, a diffusion predictor plus VLM grounds each subtask
  into fixed action primitives, and an RL controller executes only those
  primitives.
description: >-
  An LLM emits a procedurally validated subtask sequence in language space
  with no visual input, a diffusion predictor plus VLM grounds each subtask
  into fixed action primitives, and an RL controller executes only those
  primitives. Filed by the drafting stage from CAPER: Constrained and
  Procedural Reasoning for Robotic Scientific Experiments (2602.09367) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Success
  rate on a 5-task scientific-experiment simulation benchmark (1,000 trials
  per task) against LLM+RL, VLM+RL and MP+VLM+RL ablations, plus 5
  long-horizon RLBench tasks against PerAct, OpenVLA, a re-implemented
  CoT-VLA and MoLe-CogAct, plus 10-40 real-robot trials per task.. Nobody
  has vouched for it; add support or contest it on this page.
