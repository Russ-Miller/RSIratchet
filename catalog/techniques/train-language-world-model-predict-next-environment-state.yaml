description: >-
  Train a language model in three stages (continual pre-training on
  environment trajectories, SFT on next-state-prediction reasoning traces,
  RL with a five-dimensional rubric judge plus rule-based verifier) so it
  simulates agentic environment Filed by the drafting stage from
  Qwen-AgentWorld: Language World Models for General Agents (2606.24597)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  AgentWorldBench, 2,170 out-of-distribution turn-level samples from
  frontier-agent trajectories on nine established benchmarks, scored by a
  reference-grounded GPT-5.2 judge on five dimensions; the trained 397B
  model averaged 58.71 vs 54.74 for its untrained base and 58.25 for the
  best frontier baseline, and the 35B model rose 47.73 to 56.39.. Nobody has
  vouched for it; add support or contest it on this page.
