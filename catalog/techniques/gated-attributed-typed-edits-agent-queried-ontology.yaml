description: >-
  Keep the semantic layer outside the prompt as queryable MCP tools; when
  the agent fails, diagnose from traces, attribute the failure to the
  schema, content or tool level, write a typed edit at that level, and keep
  it only if a paired evalua Filed by the drafting stage from EvoOntology: A
  Self-Evolving Ontology Layer for Data Agents (2609.15779) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Trajectory and
  message accuracy on DDR-Bench across six backbones against a no-ontology
  ReAct baseline and a static-prompt semantic layer; EX/VES on BIRD;
  step-wise and level-wise ablations averaged over four backbones.
  Developer-reported.. Nobody has vouched for it; add support or contest it
  on this page.
