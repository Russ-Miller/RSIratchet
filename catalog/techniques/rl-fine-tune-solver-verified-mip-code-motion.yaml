id: rl-fine-tune-solver-verified-mip-code-motion
ref: TEC-0094
label: "RL fine-tune on solver-verified MIP code for motion planning"
summary: >-
  SFT on single-modal MIP program demonstrations, then GRPO where rewards
  come from whether the generated CVXPY/Gurobi program executes and yields a
  solver-consistent, constraint-satisfying trajectory.
description: >-
  SFT on single-modal MIP program demonstrations, then GRPO where rewards
  come from whether the generated CVXPY/Gurobi program executes and yields a
  solver-consistent, constraint-satisfying trajectory. Filed by the drafting
  stage from M$^3$P-R1: Reinforcement Learning for Large Language Model
  Guided Multi-Modal Motion Planning via MIP Code Generation (2609.18669)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Success rate on LLMM3PBench (276 eval problems): 91.7% single-modal /
  80.9% multi-modal versus GPT-5.2 prompt-only at 65.3/40.3, plus symbolic
  and sampling baselines (PDDLStream 95.0/57.6, LLM+P 85.9/39.4); an
  Expert-MIP control where an LLM only picks fixed expert modules and
  predicts interface variables reached 100% single-modal but 55.6-63.2%
  multi-modal; reward ablations at matched 800 steps show removing
  trajectory-correctness reward drops SR 84.8 to 50.3; 87.5% (35/40) on
  Franka + Tello hardware.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [planning]
kind: training
