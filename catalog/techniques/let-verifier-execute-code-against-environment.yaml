description: >-
  Train a generative process reward model that runs a multi-turn ReAct loop
  with code execution and document/image tools to probe intermediate state
  before scoring a step, and assigns a ternary reward (correct / correctable
  grounding error / Filed by the drafting stage from Rewarding the
  Scientific Process: Process-Level Reward Modeling for Agentic Data
  Analysis (2604.24198) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Best-of-N with the 4B DataPRM beat majority voting,
  LLM-as-judge, self-rewarding with a 235B model, and PRMs up to 72B: +7.21%
  on ScienceAgentBench and +11.28% on DABStep; ablation isolates environment
  access (CoT 38.89 vs multi-turn-with-env 39.77 vs full 40.89 at N=16) and
  the ternary reward; also used as RL reward, reaching 78.73% DABench and
  64.84% TableBench over outcome-only rewards.. Nobody has vouched for it;
  add support or contest it on this page.
