description: >-
  Embeds an attack-specific helper requirement (attacker-controlled env-var
  input plus a dangerous sink wired into the repaired symbol) into an
  otherwise legitimate bug report, framed as ordinary maintenance work.
  Filed by the drafting stage from Adversarial Testing of Automated Program
  Repair Agents for Security Vulnerabilities (2609.15963) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Attack success
  rate (patch passes FAIL_TO_PASS and PASS_TO_PASS tests and contains the
  wired-in payload, confirmed by diff verifier plus a dynamic trigger
  harness) of 48.5-54.0% across three repair LLMs, versus 18.8-26.4% for the
  SWExploit baseline on 100 shared instances; 85.4% on the 206-instance
  subset with Claude Opus 4.5.. Nobody has vouched for it; add support or
  contest it on this page.
