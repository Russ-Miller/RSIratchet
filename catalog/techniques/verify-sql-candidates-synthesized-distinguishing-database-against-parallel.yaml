description: >-
  Cluster candidates by execution result, pick the two largest clusters,
  have agents synthesize a minimal schema slice and adversarial rows that
  make the two diverge, then pick whichever candidate's output best matches
  an independently genera Filed by the drafting stage from DPC:
  Training-Free Text-to-SQL Candidate Selection via Dual-Paradigm
  Consistency (2604.15163) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Execution accuracy on BIRD Mini-Dev (500 queries)
  and Spider Test (2,147) against random, execution-guided, self-consistency
  and multiple-choice selection: e.g. BIRD 53.4 vs 51.2 for self-consistency
  on DeepSeek-V3.2; also plugged into DAIL-SQL, CHESS, OmniSQL-7B,
  XiYanCoder-7B (+1.0 to +2.4 points over self-consistency); ablations
  remove Tester (-1.4), Slicer (-0.8), Python solver (-0.6), BS-F1 (-0.6)..
  Nobody has vouched for it; add support or contest it on this page.
