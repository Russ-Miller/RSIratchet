id: keep-inter-agent-handoffs-user-s-language
ref: TEC-0131
label: "Keep inter-agent handoffs in the user's language"
summary: >-
  Have agents pass extracted facts and answers to each other in the user's
  language instead of pivoting through English translation.
description: >-
  Have agents pass extracted facts and answers to each other in the user's
  language instead of pivoting through English translation. Filed by the
  drafting stage from Translating the Translator: Decomposing the Cost of
  English-Forced Inter-Agent Communication (2609.15079) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Exact Match and F1
  on 300 XQuAD items per language for Spanish, Arabic, Chinese, Hindi,
  native-handoff condition versus an otherwise identical English-pivot
  condition; all four paired differences significant under exact McNemar
  with Bonferroni correction, discordant pairs strongly asymmetric.. Nobody
  has vouched for it; add support or contest it on this page.
addresses: [multi-model-coordination]
kind: process
sources: [arxiv-2609-15079]
status: proposed
