description: >-
  A zero-initialised LoRA adapter runs alongside the frozen base model
  during tool-call generation, is trained with loss only on a trigger token
  and label, and then verbalises a localized verdict (ok / wrong_tool /
  ungrounded: <param>) used t Filed by the drafting stage from Actionable
  Hallucination Detection: Translating Latent Uncertainty into Agentic
  Critique (2608.10430) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Detection AUROC 0.966 ID / 0.925 OOD on Qwen3-4B versus
  0.915/0.884 for an equal-scale fine-tuned external judge, 0.782/0.616 for
  a linear probe, and roughly chance for semantic entropy; >80% exact
  parameter-match localization; in a closed-loop ReAct setting specific
  feedback gave parameter F1 61.2 vs 51.3 generic and 52.1 no intervention,
  false blocks 2.9% vs 9.4%, recovery rate 37.0% vs 23.9%; activation
  patching of the trigger-token state flipped the verdict in 96% of
  trajectories.. Nobody has vouched for it; add support or contest it on
  this page.
