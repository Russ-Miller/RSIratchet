description: >-
  Builds process-level preference pairs by comparing the model's own
  analyses that led to correct versus incorrect verdicts, trains them
  jointly with ordinary response-preference data in one generative
  objective, then at inference picks a hig Filed by the drafting stage from
  ReflectRM: Boosting Generative Reward Models via Self-Reflection within a
  Unified Judgment Framework (2604.07506) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Average accuracy over four reward
  benchmarks against the same backbone with reinforcement fine-tuning on
  preference data only (73.5 to 76.4 at 4B), plus a volume-matched control
  (17.1k pure preference data scored 79.1 vs 80.3 on R.B.+RMB) and ablations
  replacing the anchor or the reflection filter with random selection (-0.5
  and -1.0).. Nobody has vouched for it; add support or contest it on this
  page.
