id: reward-chain-of-thought-answer-consistency-just-correctness
ref: TEC-0625
label: "Reward chain-of-thought/answer consistency, not just correct"
summary: >-
  Grants RL reward only when the final answer is correct and an LLM judge
  finds the chain-of-thought consistent with it, optionally combined with
  correct/incorrect caption and CoT augmentations during rollouts.
description: >-
  Grants RL reward only when the final answer is correct and an LLM judge
  finds the chain-of-thought consistent with it, optionally combined with
  correct/incorrect caption and CoT augmentations during rollouts. Filed by
  the drafting stage from On Robustness and Chain-of-Thought Consistency of
  RL-Finetuned VLMs (2602.12506) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Compared against accuracy-only GRPO on the same
  data mixture; the faithfulness reward preserved CoT-answer consistency,
  but combined with augmentation the policy collapsed onto following
  correct-caption/correct-think augmentations and robustness gains were
  limited.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [explanation-faithfulness]
kind: training
sources: [arxiv-2602-12506]
status: proposed
