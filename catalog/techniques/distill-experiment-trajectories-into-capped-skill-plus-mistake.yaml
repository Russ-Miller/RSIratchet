label: "Distill experiment trajectories into a capped skill-plus-mis"
summary: >-
  An evolver LLM contrasts high- and low-reward trajectories after each
  round and maintains a bounded external bank of strategy skills and
  recurring-mistake records, retrieved into the frozen actor's context for
  later episodes.
description: >-
  An evolver LLM contrasts high- and low-reward trajectories after each
  round and maintains a bounded external bank of strategy skills and
  recurring-mistake records, retrieved into the frozen actor's context for
  later episodes. Filed by the drafting stage from Hierarchical
  Experimentalist Agents (2606.29315) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Held-out solve rate and mean turns
  per seed against zero-shot, ReAct, Reflexion, Episodic RAG, MemRL and
  budget-matched GRPO, across eight Interphyre levels plus four reasoning
  tasks, four games and DiscoverPhysics; frozen-bank controls swapped in
  wrong-level skills of comparable length (two_body 50.0% to 9.3%) and
  dropped the two highest-reward skills (down_to_earth 76.7% to 65.3%)
  versus no change for the two lowest.. Nobody has vouched for it; add
  support or contest it on this page.
