id: pair-compiler-reward-functional-alignment-reward
ref: TEC-0514
label: "Pair compiler reward with a functional-alignment reward"
summary: >-
  In RL for code translation, combine a compiler-error-count reward with a
  functional term (unit-test pass rate, or CodeBLEU against a reference when
  execution is infeasible) at equal weight rather than rewarding
  compilability alone.
description: >-
  In RL for code translation, combine a compiler-error-count reward with a
  functional term (unit-test pass rate, or CodeBLEU against a reference when
  execution is infeasible) at equal weight rather than rewarding
  compilability alone. Filed by the drafting stage from Dependency-Guided
  Repository-Level C-to-Rust Translation with Reinforcement Alignment
  (2604.02852) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Reward-weight ablation on the same 7B model:
  compilation-only (1:0) gave 97.9% compilation success but 0.0%
  computational accuracy; balanced (1:1) gave 60.7% compilation and the best
  43.5% accuracy; alignment-only (0:1) 58.6%/39.8%; alignment-heavy (1:2)
  60.8%/40.8%.. Nobody has vouched for it; add support or contest it on this
  page.
