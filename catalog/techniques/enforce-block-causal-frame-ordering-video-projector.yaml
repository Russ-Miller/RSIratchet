id: enforce-block-causal-frame-ordering-video-projector
ref: TEC-0621
label: "Enforce block-causal frame ordering in the video projector"
summary: >-
  The video-to-LLM projector uses a block-causal attention mask that allows
  attention within a frame and to earlier frames only, with a learnable
  summary token appended at the end of the sequence to aggregate the whole
  ordered history.
description: >-
  The video-to-LLM projector uses a block-causal attention mask that allows
  attention within a frame and to earlier frames only, with a learnable
  summary token appended at the end of the sequence to aggregate the whole
  ordered history. Filed by the drafting stage from V-CORE: Temporally
  Consistent Video Understanding for Video-LLM (2601.01804) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Ablation on
  NExT-QA with the same backbone and data: mean-pool+linear 53.8%,
  LSA+linear 55.6%, LSA+bidirectional transformer 58.0%, LSA+causal mask
  60.2%, plus terminal summary token 61.2%; sub-category breakdown shows
  +3.5 temporal and +5.2 causal over the bidirectional variant versus +0.9
  descriptive. Placing the summary token at the front instead of the end
  drops accuracy to 57.1%.. Nobody has vouched for it; add support or
  contest it on this page.
addresses: [video-temporal-reasoning]
kind: architecture
sources: [arxiv-2601-01804]
status: proposed
