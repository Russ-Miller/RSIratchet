ref: TEC-0031
label: "Coordinate agents with a generational genetic algorithm over"
summary: >-
  Specialized LLM agents generate, crossover, mutate and pairwise-rank a
  fixed-size hypothesis population, with joint parent-offspring truncation
  deciding what survives each generation.
description: >-
  Specialized LLM agents generate, crossover, mutate and pairwise-rank a
  fixed-size hypothesis population, with joint parent-offspring truncation
  deciding what survives each generation. Filed by the drafting stage from
  HypoEvolve: Genetic Algorithms Enable Multi-Agent LLMs to Discover
  Scientific Hypotheses (2609.15938) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Mean DepMap selectivity 0.171 and
  Open Targets 0.426 versus 0.115/0.329 for the strongest of six
  task-matched baselines (Tree of Thoughts) and 0.039/0.163 for single-pass
  generation, on 26 and 29 shared cancer types with retrieval, drug
  vocabulary and base model held fixed; gains persist on 27 held-out cancer
  types.. Nobody has vouched for it; add support or contest it on this page.
