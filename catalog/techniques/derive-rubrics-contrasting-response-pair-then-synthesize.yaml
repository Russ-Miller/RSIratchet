id: derive-rubrics-contrasting-response-pair-then-synthesize
ref: TEC-0595
label: "Derive rubrics by contrasting the response pair, then synthe"
summary: >-
  An LLM first profiles each response per relevant dimension with quoted
  evidence spans, then a teacher synthesizes the chosen-vs-rejected
  differences into a short rubric set used to condition the preference
  judgment.
description: >-
  An LLM first profiles each response per relevant dimension with quoted
  evidence spans, then a teacher synthesizes the chosen-vs-rejected
  differences into a short rubric set used to condition the preference
  judgment. Filed by the drafting stage from CDRRM: Contrast-Driven Rubric
  Generation for Reliable and Interpretable Reward Modeling (2603.08035)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Accuracy on RewardBench, RMBench and RMB against a direct no-rubric judge
  (76.4 avg) and a one-step rubric judge (79.0 avg) on the same Qwen3-8B
  backbone with matched training config; CDRRM-8B base reached 85.8 avg and
  81.1 on RMBench Hard, where the best baseline was 76.1.. Nobody has
  vouched for it; add support or contest it on this page.
