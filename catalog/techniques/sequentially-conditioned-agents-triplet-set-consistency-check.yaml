description: >-
  Decompose structured extraction into aspect, aspect-conditioned
  minimal-span opinion, sentiment, and a final whole-set verifier that drops
  ungrounded spans, calibrates polarity and merges duplicates, all on one
  frozen backbone. Filed by the drafting stage from MASTE: A Multi-Agent
  Pipeline for Zero-Shot Aspect Sentiment Triplet Extraction (2607.08080)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Precision/recall/F1 on four ASTE-Data-V2 datasets against GPT-4o
  zero-shot, few-shot, CoT and CoT+few-shot with the same backbone (e.g.
  72.31 vs 35.37 F1 on 14Res; +12.8 to +15.5 F1 over few-shot), plus
  ablations removing each agent and five additional backbones.. Nobody has
  vouched for it; add support or contest it on this page.
