description: >-
  Score a model on six measures of how well it modulates its own
  residual-stream concept projection on instruction (engage, suppress,
  intensity dial, temporal placement, token coverage, layer targeting),
  combined into one conjunctive score re Filed by the drafting stage from
  Measuring Activation Control in Large Language Models (2608.21664) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Applied
  to 25 models; scores ranged 0.059-0.538, did not track parameter count,
  and rose across Olmo training checkpoints — but the score is not validated
  against any external criterion of monitor evasion beyond the paper's own
  evasion experiments.. Nobody has vouched for it; add support or contest it
  on this page.
