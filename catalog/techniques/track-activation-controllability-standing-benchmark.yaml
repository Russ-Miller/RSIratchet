description: >-
  Score each model generation on six measures of how well it can engage,
  suppress, dial, time, sustain and layer-target a concept's residual-stream
  signal under instruction, combined into one conjunctive score. Filed by
  the drafting stage from Measuring Activation Control in Large Language
  Models (2608.21664) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to 25 models; scores ranged 0.059-0.538, did not
  track parameter count, and rose across Olmo training checkpoints; validity
  as a predictor of real evasion risk is not independently established..
  Nobody has vouched for it; add support or contest it on this page.
