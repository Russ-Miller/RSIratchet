description: >-
  Evaluate streaming voice agents on unscripted human recordings annotated
  for fillers, pauses, hesitations, false starts and self-corrections,
  reporting task pass rate separately per category alongside latency and
  turn-taking. Filed by the drafting stage from Full-Duplex-Bench-v3:
  Benchmarking Tool Use for Full-Duplex Voice Agents Under Real-World
  Disfluency (2604.04847) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Applied to six systems: aggregate Pass@1 ranged
  0.410-0.600 while per-category self-correction Pass@1 ranged 0.176-0.588,
  with the lowest self-correction score (cascaded, 0.176) coming from a
  system of middling aggregate accuracy (0.450) — so the per-category split
  reorders systems the aggregate does not. No baseline evaluation protocol
  compared.. Nobody has vouched for it; add support or contest it on this
  page.
