description: >-
  Re-ask a fixed question at every interval of a streaming context and
  decompose errors into delay before first correct answer, incorrect answers
  after a correct one within a stable phase, and phases never answered
  correctly. Filed by the drafting stage from Can Large Language Models Keep
  Up? Benchmarking Online Adaptation to Continual Knowledge Streams
  (2603.07392) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to five model configurations on OAKS-BABI; models
  with near-identical accuracy (Gemma 3 27B 37.8, GPT-OSS 120B 37.5)
  separated sharply on phase-miss (30.3 vs 15.1) and distraction (26.5 vs
  38.8), showing the decomposition distinguishes behaviours accuracy hides..
  Nobody has vouched for it; add support or contest it on this page.
