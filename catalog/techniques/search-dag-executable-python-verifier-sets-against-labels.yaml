description: >-
  An LLM synthesizes candidate Python verifier sets, which are then
  iteratively critiqued and edited from their false positives and negatives
  in a DAG search scored by F1 against target labels plus exploration, size
  and feasibility terms, ret Filed by the drafting stage from
  AutoPyVerifier: Learning Compact Executable Verifiers for Large Language
  Model Outputs (2604.22937) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: F1 of the induced verifier set's joint satisfaction
  against benchmark-evaluator correctness labels on AIME, LiveCodeBench,
  ComplexFuncBench and IFBench, compared with the initial LLM-generated
  verifier set from the same model; gains up to 55.0 F1 in-distribution and
  up to 54.4 F1 when the same verifiers are applied to a different base
  model's outputs; final sets held to 1-6 functions. Separately, exposing
  the verifiers as tools to GPT-4.1 raised task accuracy by 1.6-17.0
  points.. Nobody has vouched for it; add support or contest it on this
  page.
