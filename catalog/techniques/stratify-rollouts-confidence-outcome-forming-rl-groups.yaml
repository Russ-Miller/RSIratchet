  Anchoring Multimodal Reasoning Dynamics via Entropy-Guided Stratification
  (2609.07148) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Ablation on MathVista/MathVision/MMMU Pass@8: GRPO 60.7
