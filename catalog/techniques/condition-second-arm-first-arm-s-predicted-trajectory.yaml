summary: >-
  Decompose bimanual in-context action prediction into a leader agent that
  predicts its full single-arm trajectory and a follower agent that predicts
  its own trajectory with the leader's plan inserted into its observation
  dictionary.
description: >-
  Decompose bimanual in-context action prediction into a leader agent that
  predicts its full single-arm trajectory and a follower agent that predicts
  its own trajectory with the leader's plan inserted into its observation
  dictionary. Filed by the drafting stage from Bimanual Robot Manipulation
  via Multi-Agent In-Context Learning (2604.20348) with status proposed: the
  paper introduces or tests it, and the claim drafted from the paper is its
  first evidence. The paper validated it by: Average success over 13 TWIN
  tasks, 3 seeds x 100 episodes: 70.5% vs 64.4% for independent dual-agent
  and 60.6% for monolithic single-agent prediction, same GPT-5-mini backbone
  and same 10 demonstrations; an ablation that keeps sequential single-arm
  predictions but removes the leader-trajectory observation augmentation
  scores 65.0%; real-robot 53.3% vs 33.3% for the dual-agent baseline over
  10 trials on each of 3 tasks.. Nobody has vouched for it; add support or
  contest it on this page.
