description: >-
  Re-run an answer under visual degradation, blank-image replacement, and
  grounding/relation swaps to produce a three-coordinate signature used for
  failure-family diagnosis and to pick a matched correction prompt, rather
  than as an abstention Filed by the drafting stage from HalluPrism: When
  Multimodal Uncertainty Should Diagnose, Not Decide (2608.29193) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Pooled
  XGBoost failure-family AUROC over 58,440 examples rose from 0.78 with
  scalar confidence to 0.95 with the signature and 0.97 with confidence
  added; per-dataset gains 0.634 to 0.769 on HallusionBench and 0.707 to
  0.817 on VizWiz, near-neutral on VSR. Abstention AUROC fell under all
  three scalarizations (e.g. Qwen3-VL 0.81 to 0.73). Matched correction
  routing beat a generic prompt in 10 of 16 settings and cut break rate
  15.5% to 2.7% on Qwen3-VL/VSR.. Nobody has vouched for it; add support or
  contest it on this page.
