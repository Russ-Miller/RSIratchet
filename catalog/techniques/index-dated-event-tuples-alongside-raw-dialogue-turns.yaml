id: index-dated-event-tuples-alongside-raw-dialogue-turns
ref: TEC-0687
label: "Index dated event tuples alongside raw dialogue turns"
summary: >-
  Extract subject-verb-object events with normalized start/end datetime
  ranges and lexical aliases into a separate 'event calendar' index that an
  agent searches alongside an index of raw conversation turns.
description: >-
  Extract subject-verb-object events with normalized start/end datetime
  ranges and lexical aliases into a separate 'event calendar' index that an
  agent searches alongside an index of raw conversation turns. Filed by the
  drafting stage from Chronos: Temporal-Aware Conversational Agents with
  Structured Event Retrieval for Long-Term Memory (2603.16862) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Accuracy on
  LongMemEval-S: 92.60% with GPT-4o (vs 86.00% for the strongest GPT-4o
  baseline) and 95.60% with Claude Opus 4.6; leave-one-out ablation on 116
  questions isolates the event index as the largest single contributor..
  Nobody has vouched for it; add support or contest it on this page.
addresses: [long-term-memory]
kind: retrieval
