description: >-
  Parse both generated and reference captions into motion predicates with
  roles and temporal order (AMR plus dependency parsing), then use action
  F1, pairwise order correctness and direction agreement as a composite GRPO
  reward. Filed by the drafting stage from KPM-Bench: A Kinematic Parsing
  Motion Benchmark for Fine-grained Motion-centric Video Understanding
  (2602.17768) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: On a 215-video hand-annotated hallucination set,
  GPT-4.1-judged hallucination count fell 2.03 to 1.92 and the parser-based
  Mo-Hall score rose 0.607 to 0.619 versus the same SFT model without the
  reward, with GPT-Acc rising 67.83% to 71.80% and BLEU-1 falling 43.64 to
  43.25; QA accuracy was essentially unchanged (94.03 to 94.05).. Nobody has
  vouched for it; add support or contest it on this page.
