label: "Run text, formula and diagram extractors in parallel and mer"
summary: >-
  Processes each page of course material through a layout parser, a
  formula-to-LaTeX model and a vision LLM simultaneously, then merges the
  three outputs into one chunked, embedded representation for retrieval.
