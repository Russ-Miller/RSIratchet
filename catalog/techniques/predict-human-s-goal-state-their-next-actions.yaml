id: predict-human-s-goal-state-their-next-actions
ref: TEC-0046
label: "Predict the human's goal state, not their next actions"
summary: >-
  A VLM converts visual history, a scene graph, and the robot instruction
  into symbolic goal predicates for the human, which are grounded with the
  robot's goal into a multi-agent PDDL-style problem and solved by a formal
  planner.
description: >-
  A VLM converts visual history, a scene graph, and the robot instruction
  into symbolic goal predicates for the human, which are grounded with the
  robot's goal into a multi-agent PDDL-style problem and solved by a formal
  planner. Filed by the drafting stage from HINT-Plan: Human Intention-Aware
  Robot Task Planning in Context-Rich Environments using Vision Language
  Models (2609.17771) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Joint-plan success rate 69.71% vs 35.50% for
  VLM-as-planner and 34.42% for GG-LLM (paired cluster bootstrap CI +21.7 to
  +47.1); functional conflict rate roughly halved; oracle-goal ablation
  96.38%; 99.60% planner success on the 1,490 trials with both goals
  correct.. Nobody has vouched for it; add support or contest it on this
  page.
addresses: [planning]
