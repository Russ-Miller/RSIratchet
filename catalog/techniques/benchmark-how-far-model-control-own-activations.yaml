description: >-
  Prompt a model to engage, suppress, dial, time, and layer-target a concept
  during a fixed transcription task, read the residual-stream projection
  onto a concept direction, and combine six sensitivity measures into one
  conjunctive controllab Filed by the drafting stage from Measuring
  Activation Control in Large Language Models (2608.21664) with status
  proposed: the paper introduces or tests it, and the claim drafted from the
  paper is its first evidence. The paper validated it by: Scored 25
  open-weight models (S from 0.059 to 0.538) with cluster-bootstrap CIs;
  validated as meaningful by showing the score's suppression component
  predicts evasion of four monitor families, and that S rises across Olmo
  training checkpoints.. Nobody has vouched for it; add support or contest
  it on this page.
