description: >-
  Train the model first on a large public financial corpus (reports,
  standards, market series) with a financial-consistency loss, then LoRA
  fine-tune on the deploying institution's investment memos and risk rules.
  Filed by the drafting stage from Frontiers in FinTech: Multimodal
  Foundation Models for Financial Reporting and Decision Science
  (2608.22724) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean absolute error and RMSE of target price versus
  analyst consensus on 200 listed companies, plus direction accuracy;
  baselines were GPT-4 zero-shot (MAE 24.3%), FinGPT single-stage
  fine-tuning (18.7%), and an analyst-input DCF spreadsheet (16.2%), against
  13.1% for the two-stage system.. Nobody has vouched for it; add support or
  contest it on this page.
