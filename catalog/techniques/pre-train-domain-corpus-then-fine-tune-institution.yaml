description: >-
  Train a vision-language model first on large public financial corpora with
  a valuation-consistency loss, then fine-tune with LoRA on an institution's
  own investment memos and risk rules. Filed by the drafting stage from
  Frontiers in FinTech: Multimodal Foundation Models for Financial Reporting
  and Decision Science (2608.22724) with status proposed: the paper
  introduces or tests it, and the claim drafted from the paper is its first
  evidence. The paper validated it by: Mean absolute error of target price
  versus analyst consensus on 200 companies: 13.1% versus 16.2% for an
  analyst-input DCF spreadsheet, 18.7% for single-stage FinGPT, 24.3% for
  zero-shot GPT-4; direction accuracy 0.751 versus 0.703.. Nobody has
  vouched for it; add support or contest it on this page.
