id: build-dpo-negatives-stripping-constraints-degrading-image
ref: TEC-0596
label: "Build DPO negatives by stripping constraints, not degrading "
summary: >-
  Construct rejected responses for visual instruction-following preference
  data by re-prompting with a subset of the visual constraints removed,
  rather than by masking, editing, or deleting the image.
description: >-
  Construct rejected responses for visual instruction-following preference
  data by re-prompting with a subset of the visual constraints removed,
  rather than by masking, editing, or deleting the image. Filed by the
  drafting stage from Empowering Reliable Visual-Centric Instruction
  Following in MLLMs (2601.03198) with status proposed: the paper introduces
  or tests it, and the claim drafted from the paper is its first evidence.
  The paper validated it by: Ablation on VC-IFEval with
  Qwen2.5-VL-7B-Instruct: constraint-removal negatives reach 68.8 at full
  removal against 60.6 for 50% edited images and 59.3 for image-removed
  negatives, all over a 57.3 untuned baseline; general VQA scores (MMBench,
  MMVet, POPE) stay within about a point.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [procedure-following]
kind: training
sources: [arxiv-2601-03198]
status: proposed
