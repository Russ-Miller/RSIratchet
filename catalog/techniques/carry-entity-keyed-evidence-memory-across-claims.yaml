id: carry-entity-keyed-evidence-memory-across-claims
ref: TEC-0601
label: "Carry an entity-keyed evidence memory across claims"
summary: >-
  Index evidence retrieved while verifying each claim under the
  subject/object entities extracted from it, and recall it by BM25 plus
  semantic re-ranking to warm-start verification of later claims.
description: >-
  Index evidence retrieved while verifying each claim under the
  subject/object entities extracted from it, and recall it by BM25 plus
  semantic re-ranking to warm-start verification of later claims. Filed by
  the drafting stage from MERMAID: Memory-Enhanced Retrieval and Reasoning
  with Multi-Agent Iterative Knowledge Grounding for Veracity Assessment
  (2601.22361) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: With vs without memory on five benchmarks with
  GPT-5-mini: total tool calls 1,840 to 948 (-48.5%, per-dataset -26.0% to
  -76.1%) and Macro-F1 up on all five (+0.02 to +0.06); memory built by
  GPT-5-mini also lifted LLaMA-3.1-8B from 0.54 to 0.65 and OSS-20B from
  0.67 to 0.71 on FactCheck-Bench.. Nobody has vouched for it; add support
  or contest it on this page.
addresses: [fact-verification]
kind: retrieval
sources: [arxiv-2601-22361]
status: proposed
