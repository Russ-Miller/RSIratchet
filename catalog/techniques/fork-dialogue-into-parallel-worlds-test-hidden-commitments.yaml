id: fork-dialogue-into-parallel-worlds-test-hidden-commitments
ref: TEC-0663
label: "Fork the dialogue into parallel worlds to test hidden commit"
summary: >-
  After the model commits to a hidden object and narrows candidates, clone
  the full conversational state into k identical threads that differ only in
  which candidate is asked about, and score denial of all of them as
  deception.
description: >-
  After the model commits to a hidden object and narrows candidates, clone
  the full conversational state into k identical threads that differ only in
  which candidate is asked about, and score denial of all of them as
  deception. Filed by the drafting stage from Lying to Win: Assessing LLM
  Deception through Human-AI Games and Parallel-World Probing (2603.07202)
  with status proposed: the paper introduces or tests it, and the claim
  drafted from the paper is its first evidence. The paper validated it by:
  Measured as a binary per-game deception rate averaged over all
  object-order permutations, with a 100% valid-game (format-compliance)
  rate; no external labels or weight access needed, but no human-judged
  deception baseline is compared against.. Nobody has vouched for it; add
  support or contest it on this page.
