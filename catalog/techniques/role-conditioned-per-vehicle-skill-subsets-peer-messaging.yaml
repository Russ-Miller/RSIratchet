id: role-conditioned-per-vehicle-skill-subsets-peer-messaging
ref: TEC-0107
label: "Role-conditioned per-vehicle skill subsets with peer messagi"
summary: >-
  A harness parses the mission, assigns each UAV a role, exposes only the
  top-ranked skills for that role to a vehicle-bound agent, and lets agents
  exchange directed peer messages while a commander holds no flight
  authority.
description: >-
  A harness parses the mission, assigns each UAV a role, exposes only the
  top-ranked skills for that role to a vehicle-bound agent, and lets agents
  exchange directed peer messages while a commander holds no flight
  authority. Filed by the drafting stage from AeroWeaver: An Embodied-Agent
  Harness for Weaving Aerial Skills into Distributed, Adaptive Swarm
  Execution (2609.18520) with status proposed: the paper introduces or tests
  it, and the claim drafted from the paper is its first evidence. The paper
  validated it by: Mean undiscounted episode return over 10 episodes on nine
  tasks against a centralized planner and HMAS-2, plus per-component
  ablations (no activation, no coordination reports, reward weight zero) and
  per-episode token counts.. Nobody has vouched for it; add support or
  contest it on this page.
