  endpoint-wise best-of-N isolated-agent envelope on portfolio resilience
  (0.2474/0.2365 vs 0.1794), validated inventions (5.75/7.00 vs 2.75),
  held-out resilience, and best single artifact (0.2380 vs 0.3488), across
  four seeds and five checkpoints.. Nobody has vouched for it; add support
  or contest it on this page.
