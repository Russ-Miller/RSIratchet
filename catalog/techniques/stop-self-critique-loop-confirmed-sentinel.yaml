id: stop-self-critique-loop-confirmed-sentinel
ref: TEC-0212
label: "Stop the self-critique loop on a CONFIRMED sentinel"
summary: >-
  Run generate-critique-revise to a fixed max depth but exit as soon as the
  critique emits a CONFIRMED token, instead of trusting a self-reported
  numeric confidence tag.
description: >-
  Run generate-critique-revise to a fixed max depth but exit as soon as the
  critique emits a CONFIRMED token, instead of trusting a self-reported
  numeric confidence tag. Filed by the drafting stage from Training-Free
  Inference-Time Self-Reflection and Cost-Bounded Early Stopping for Large
  Language Models (2608.18884) with status proposed: the paper introduces or
  tests it, and the claim drafted from the paper is its first evidence. The
  paper validated it by: Early-stopped 82-88% of items at ~2.1 generations
  with accuracy equal to single-shot on BBH, and beat fixed-depth
  Self-Refine (74.0% vs 71.2% on BBH n=500) at lower token cost; a
  confidence-threshold sweep collapsed to one generation at every tau>=0.6,
  so the numeric tag gave no selective stop.. Nobody has vouched for it; add
  support or contest it on this page.
addresses: [self-repair]
kind: prompting
sources: [arxiv-2608-18884]
status: proposed
