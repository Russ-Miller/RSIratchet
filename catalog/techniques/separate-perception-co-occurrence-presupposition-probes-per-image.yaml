description: >-
  For each image, annotate a present object, an unrelated absent object, and
  a PMI-ranked plausible-but-absent object, then ask existence questions
  about all three plus an attribute question that presupposes the
  adversarial object exists, so Filed by the drafting stage from When
  Prompts Override Vision: Prompt-Induced Hallucinations in LVLMs
  (2604.21911) with status proposed: the paper introduces or tests it, and
  the claim drafted from the paper is its first evidence. The paper
  validated it by: Applied to 3K images per subset across five LVLMs; the
  monotone drop Rec_pos/Rec_rnd > Rec_adv > AdP is reported for every model
  and both candidate-object sources, with AdP judged by an LLM checking
  whether the response denies the false presupposition.. Nobody has vouched
  for it; add support or contest it on this page.
