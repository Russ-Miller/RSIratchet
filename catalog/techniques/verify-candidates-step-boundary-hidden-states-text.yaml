description: >-
  Extract the frozen generator's last-layer hidden states at reasoning-step
  delimiters, feed the step sequence to a 2-layer Transformer encoder, and
  score candidates with a tie-safe pairwise ranking loss trained on
  self-sampled trajectories w Filed by the drafting stage from HSRM:
  Hidden-State Reward Models for Test-Time Verification (2608.30841) with
  status proposed: the paper introduces or tests it, and the claim drafted
  from the paper is its first evidence. The paper validated it by: Best-of-8
  accuracy and within-problem AUROC against EORM-55M text-only verifier,
  Qwen2.5-Math-PRM-7B, single-pass, and oracle pass@8, over five seeds;
  matched or beat EORM in 15 of 16 generator-dataset settings and all 6
  Llama settings. An input-modality ablation on GSM8K held architecture size
  roughly fixed: text-only 82.23% / 0.519 AUROC vs last-hidden-state 86.11%
  / 0.691, isolating representation from capacity.. Nobody has vouched for
  it; add support or contest it on this page.
