id: knowledge-updating
ref: CAP-0026
label: "Absorbing and flexibly using new knowledge"
summary: >-
  Covers whether newly injected or post-training facts can be recalled
  under paraphrase, combined, and used to override stale beliefs; excludes
  retrieval-based grounding at inference time.
description: >-
  Proposed from the ingestion pipeline rather than chosen by hand. 2
  papers independently pointed at this same
  competence, arriving under 2 different names (knowledge-injection-
  generalization, knowledge-updating), which is the signal that it is a
  real recurring topic and not one author's framing. Two papers describe
  the same gap between storing and actually using new facts, which long-
  term-memory does not cover.
tags: [general]
match_terms: ["knowledge injection", "knowledge editing", "knowledge updating", "continual knowledge", "model editing", "knowledge update"]
group: knowledge
discriminator: >-
  Covers whether newly injected or post-training facts can be recalled
  under paraphrase, combined, and used to override stale beliefs; excludes
  retrieval-based grounding at inference time.
