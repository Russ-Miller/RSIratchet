id: output-diversity
ref: CAP-0034
label: "Keeping outputs and solution paths diverse"
summary: >-
  Covers mode collapse, entropy decline, and repeated attempts retreading
  the same strategy after sampling, fine-tuning, or RL; excludes single-
  answer accuracy and stylistic variety alone.
description: >-
  Proposed from the ingestion pipeline rather than chosen by hand. 3
  papers independently pointed at this same
  competence, arriving under 2 different names (solution-diversity,
  output-diversity), which is the signal that it is a real recurring topic
  and not one author's framing. Three papers converge on collapse of
  exploration as a measurable failure distinct from accuracy.
