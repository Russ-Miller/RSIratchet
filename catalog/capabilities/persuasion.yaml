id: persuasion
ref: CAP-0035
label: "Changing what a person believes or decides"
summary: >-
  How effectively a model shifts a person's beliefs or choices in
  conversation, relative to a human doing the same; the risk is the flip
  side of the capability, a system that can talk its operators out of
  constraining it.
description: >-
  Filed 2026-09-18 with Hinton's argument that a kill switch fails once the
  system can persuade the people who hold it. Distinct from strategic
  deception (inducing false beliefs on purpose) and from sycophancy (being
  persuaded): this is persuasive effect, measured, whether or not the
  content is true.
tags: [behavior, chat-assistant]
group: behavior
aliases: ["persuasiveness", "influence", "manipulation"]
match_terms: ["persuasion", "persuasive", "persuasiveness", "change minds", "opinion change"]
discriminator: >-
  In scope when the paper measures a change in human beliefs or decisions
  caused by model output, ideally against a human comparator. NOT in scope
  for deception without a persuasion measurement, or for sycophancy, where
  the model is the one being moved.
sources: [arxiv-2609-01188]
status: active
submitted_by: human:Russ-Miller
