id: decomposition
ref: CAP-0009
label: "Breaking a task into checkable parts"
summary: >-
  Whether a model can split a problem into sub-problems that are
  individually solvable and whose solutions recombine correctly; the
  failure is a decomposition that loses a constraint or double-counts.
description: >-
  Filed from Russ's capability map (2026-09-12). The catalog already holds
  a technique, checklist decomposition, whose efficacy claim says the gain
  comes from making requirements separately checkable. This capability is
  the underlying competence that technique relies on: can the model find
  the right parts. Distinct from planning (ordering and dependencies) and
  from multi-step reasoning (carrying a chain through).
tags: [reasoning]
group: reasoning
match_terms: ["decomposition", "decompose", "sub-question", "subtask", "least-to-most"]
discriminator: >-
  In scope when the paper measures whether model-produced decompositions
  are correct or complete, or compares decomposed against holistic
  solving. NOT in scope when decomposition is only a prompting technique
  applied to a benchmark with no measurement of the decomposition itself.
status: proposed
submitted_by: human:Russ-Miller
