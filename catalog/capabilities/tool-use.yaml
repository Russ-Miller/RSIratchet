id: tool-use
ref: CAP-0049
label: "Using the tools it is given"
summary: "Models often fail to reach for provided tools, skills, or documented procedures, call them with wrong arguments, or act on a stale or misread result."
description: >-
  Given a set of tools, skills, or API documentation, a capable model selects
  the right one for the task, calls it with correct arguments, reads what came
  back, and lets that result decide the next call. It prefers a provided tool
  over improvising from memory, and it asks or stops when no tool fits. The
  same capability covers the closed loop in a digital environment, where the
  "tool" is a browser, a shell, an operating system or a text game and each
  observation depends on the last action: perceive, act, observe, adjust. The
  characteristic failure there is acting on a state that has already changed
  or was never read. Embodied control covers the physical case; state
  tracking covers holding the state in mind between steps.
tags: [agentic, autonomous-agent, coding-agent, customer-support]
group: agentic
aliases: ["tool calling", "function calling", "API use", "skill utilization", "computer use", "environment interaction", "acting on an environment and reading what came back"]
techniques: [retrieve-tool-docs, tool-use-fine-tuning]
related: [procedure-following, self-repair, state-tracking, embodied-control]
match_terms: ["tool use", "tool-calling", "function calling", "agentic tool", "web agent", "browser agent", "OS agent", "computer use", "interactive environment", "environment feedback"]
discriminator: >-
  In scope when the paper measures whether a model picks, calls or chains
  provided tools correctly, or acts in an environment whose observations
  depend on its actions. NOT in scope for physical robots (embodied
  control), for holding state across steps without acting (state tracking),
  or for static QA over tool or environment descriptions.
