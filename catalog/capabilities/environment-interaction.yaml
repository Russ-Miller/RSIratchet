id: environment-interaction
ref: CAP-0012
label: "Acting on an environment and reading what came back"
summary: >-
  Whether an agent can take actions in a digital environment — a browser,
  a shell, a game, an operating system — observe the result, and update
  what it does next; the failure is acting on a stale or misread state.
description: >-
  Filed from Russ's capability map (2026-09-12). Embodied control covers
  the physical case; tool use covers calling a function correctly; state
  tracking covers holding the state in mind. This entry is the closed loop
  in a digital environment: perceive, act, observe, adjust, on benchmarks
  such as web navigation, OS-level tasks and text games.
tags: [agentic, autonomous-agent]
group: agentic
match_terms: ["web agent", "browser agent", "OS agent", "computer use", "interactive environment", "environment feedback"]
discriminator: >-
  In scope when the paper measures an agent acting in an environment with
  observations that depend on its actions. NOT in scope for physical
  robots (embodied control), for single tool calls without observation, or
  for static QA over environment descriptions.
status: proposed
submitted_by: human:Russ-Miller
