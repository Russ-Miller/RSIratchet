id: fine-tuning-retention
ref: CAP-0018
label: "Retaining skills and safety after fine-tuning"
summary: >-
  Covers loss of general capability, out-of-domain skill, or refusal
  behavior caused by domain, multimodal, or alignment fine-tuning;
  excludes in-domain accuracy gains and inference-time behavior shifts.
description: >-
  Proposed from the ingestion pipeline rather than chosen by hand. 5
  papers independently pointed at this same
  competence, arriving under 4 different names (catastrophic-forgetting,
  alignment-tax, multimodal-adaptation-forgetting, finetuning-alignment-
  fragility), which is the signal that it is a real recurring topic and
  not one author's framing. Recurs across four independent framings
  (capability forgetting and safety erosion) and is not covered by any
  existing entry.
