id: fine-tuning-retention
ref: CAP-0018
label: "Retaining skills and safety after fine-tuning"
summary: >-
  Covers loss of general capability, out-of-domain skill, refusal
  behavior, or output diversity caused by domain, multimodal, alignment or
  RL post-training; excludes in-domain accuracy gains and inference-time
  behavior shifts.
description: >-
  Proposed from the ingestion pipeline rather than chosen by hand. 5
  papers independently pointed at this same
  competence, arriving under 4 different names (catastrophic-forgetting,
  alignment-tax, multimodal-adaptation-forgetting, finetuning-alignment-
  fragility), which is the signal that it is a real recurring topic and
  not one author's framing. Recurs across four independent framings
  (capability forgetting and safety erosion) and is not covered by any
  existing entry. Absorbed output-diversity (2026-09-19): mode collapse,
  entropy decline and repeated attempts retreading one strategy after
  fine-tuning or RL are the same failure seen in the distribution rather
  than in accuracy, so post-training narrowing is filed here as a facet.
tags: [general]
group: behavior
aliases: ["catastrophic forgetting", "alignment tax", "mode collapse", "output diversity", "exploration collapse"]
match_terms: ["catastrophic forgetting", "alignment tax", "mode collapse", "entropy collapse", "output diversity", "solution diversity", "exploration collapse"]
discriminator: >-
  Covers loss of general capability, out-of-domain skill, refusal
  behavior, or diversity of outputs and solution paths caused by domain,
  multimodal, alignment or RL post-training; excludes in-domain accuracy
  gains, inference-time behavior shifts, and stylistic variety alone.
sources: [arxiv-2608-27420, arxiv-2609-04835]
merged_ids: [output-diversity, solution-diversity]
status: active
