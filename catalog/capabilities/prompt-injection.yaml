id: prompt-injection
ref: CAP-0038
label: "Following instructions hidden in data"
summary: "Models treat instructions found in retrieved documents, tool outputs, or web pages as if they came from the user."
description: >-
  A capable model treats content it reads through tools as data. It follows only instructions from the user and the system, and it flags text that tries to redirect it rather than acting on it.
