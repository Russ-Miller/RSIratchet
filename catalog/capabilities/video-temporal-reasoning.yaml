id: video-temporal-reasoning
ref: CAP-0050
label: Reasoning about time in video
summary: Tracking motion, ordering, causality, and change across video frames rather than treating video as isolated stills.
description: >-
  A model can describe a single frame well and still fail at what makes video
  video: what happened before what, how something moved, whether an action
  completed. This capability is about the temporal dimension specifically —
  grounding an answer in a span of time rather than a moment.
tags: [reasoning, context]
group: perception
modality: [video]
discriminator: >-
  In scope when the difficulty is temporal: event ordering, tracking across
  frames, before/after reasoning, long-video retrieval where position in time
  matters. NOT in scope: per-frame recognition that happens to use video as a
  source of images, or captioning benchmarks where a single keyframe would
  answer the question.
match_terms: ["video understanding", "temporal reasoning", "video question answering", "long video", "temporal grounding"]
sources: [arxiv-2609-08850, arxiv-2609-00505, arxiv-2609-17248, arxiv-2609-16722]
status: active
submitted_by: human:Russ-Miller
