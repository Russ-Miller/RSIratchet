id: jailbreak-robustness
ref: CAP-0024
label: "Refusing harmful requests under obfuscation"
summary: >-
  Covers maintaining refusal when harmful intent is wrapped in roleplay or
  encodings, harm that emerges only from combined segments, and unsafe
  content inside reasoning traces; excludes instructions injected via
  retrieved data.
description: >-
  Proposed from the ingestion pipeline rather than chosen by hand. 3
  papers in the review queue independently pointed at this same
  competence, arriving under 3 different names (jailbreak-robustness,
  reasoning-trace-safety, compositional-harm-detection), which is the
  signal that it is a real recurring topic and not one author's framing.
  Complements prompt-injection and goal-conflict-safety without
  duplicating them, with three supporting papers.
