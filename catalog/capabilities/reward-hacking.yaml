id: reward-hacking
ref: CAP-0054
label: "Gaming the measure instead of doing the task"
summary: >-
  Whether a model trained against a reward or a monitor learns the
  intended behaviour or learns to score well some other way, including
  ways the monitor cannot see.
description: >-
  Filed 2026-10-20 with the GRAFT paper, the first source whose subject is
  reward hacking itself; the catalog had only a sycophancy claim touching
  specification gaming. The adage behind it is Goodhart's law: a measure
  used as a target stops measuring. Neighbours: sycophancy is one
  particular hack (agreeing to be rated well); strategic deception is
  misleading on purpose; goal-conflict safety is dropping a rule to finish a
  task. This capability is the general case of optimising the proxy rather
  than the intent, during training or at inference.
tags: [behavior, security]
group: behavior
aliases: ["reward hacking", "specification gaming", "reward tampering", "Goodhart"]
match_terms: ["reward hacking", "reward hack", "specification gaming", "reward tampering", "reward misspecification", "reward model exploitation", "monitor"]
discriminator: >-
  In scope when the paper measures a model exploiting a misspecified reward,
  a judge or a monitor, or tests a method to prevent or remove that. NOT in
  scope for sycophancy toward a user (its own capability), for deliberate
  deception without a reward signal, or for benchmark contamination.
sources: [arxiv-2609-00213]
status: proposed
submitted_by: human:Russ-Miller
