id: procedure-following
ref: CAP-0037
label: "Following an unfamiliar procedure"
summary: "Models drift from a new multi-step procedure or set of constraints back to familiar routines."
description: >-
  When a task comes with explicit instructions, constraints, or a step-by-step workflow the model has not seen in training, a capable model follows it exactly, honors every constraint at once, and does not substitute a familiar but different routine.

  Also home to breaking a task into checkable parts. A separate
  "decomposition" capability was proposed on 2026-09-12 and folded in here
  on 2026-09-19: the competence the checklist-decomposition technique relies
  on is finding the right parts of a procedure, and no paper had measured
  the decomposition itself apart from that.
tags: [agentic, autonomous-agent, chat-assistant, coding-agent, customer-support]
group: agentic
aliases: ["instruction following", "constraint adherence", "workflow compliance"]
techniques: [checklist-decomposition]
related: [tool-use, sycophancy]
match_terms: ["instruction following", "instruction-following", "constraint satisfaction", "decomposition", "decompose", "sub-question", "subtask", "least-to-most"]
