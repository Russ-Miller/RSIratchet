label: "Saying it does not know"
summary: >-
  Covers detecting unanswerable or underspecified problems and gaps
  between what hidden states encode and what the model asserts; excludes
  ordinary accuracy on solvable problems.
description: >-
  Proposed from the ingestion pipeline rather than chosen by hand. 2
  papers independently pointed at this same
  competence, arriving under 2 different names (unsolvability-detection,
  latent-knowledge-readout), which is the signal that it is a real
  recurring topic and not one author's framing. Closely tied to
  hallucination but distinct enough as an abstention/calibration behavior
  to track separately.
