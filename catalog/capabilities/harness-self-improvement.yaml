id: harness-self-improvement
ref: CAP-0023
label: "Improving its own scaffolding from failures"
summary: >-
  Whether an agent system can read its own failure traces and rewrite the
  prompts, tools and policies it runs inside so later runs do better, with
  no person making the edit.
description: >-
  Filed 2026-09-14 when the DAIR harness-engineering collection arrived and
  the term matcher could route none of its "let the harness learn" papers
  (DSPy, GEPA, Darwin Gödel Machine, Meta-Harness, Continual Harness, Prime
  Agent): the map had no leaf for the competence this catalog's own
  ambition rests on. Fixing its own mistakes covers correcting an output;
  this covers correcting the system that produced it. The catalog's rule for
  evidence here is the one Hashimoto's ratchet and the Self-Harness paper
  set: a held-out split the promotion decision never reads, and a
  matched-compute baseline.
tags: [agentic, autonomous-agent, coding-agent]
group: agentic
aliases: ["self-improving agents", "harness optimization", "scaffold evolution", "prompt optimization"]
techniques: [self-harness-loop]
match_terms: ["self-improving", "self-improvement", "harness optimization", "prompt optimization", "scaffold", "meta-harness", "evolving agents", "self-evolving"]
discriminator: >-
  In scope when the paper's subject is a system editing its own prompts,
  tools, memory, or control code from traces or scores, with a measured
  before-and-after on tasks. NOT in scope for fine-tuning weights (that is
  training), for a model fixing one output (self repair), or for a person
  hand-editing a harness and measuring the effect (that is harness
  engineering, filed under the technique used).
sources: [arxiv-2609-15820, arxiv-2609-15161]
status: proposed
submitted_by: human:Russ-Miller
