id: cutting-to-the-chase
ref: CAP-0053
label: "Cutting to the chase"
summary: >-
  Giving the answer directly when that's what is asked, without preamble,
  restatement or visible working the reader didn't request; the failure is
  padding the model was told to skip, or skipping working the task needed.
description: >-
  Named by Russ, 2026-10-18, from the Thinking Inertia paper, which found
  that telling a model not to think, or switching its thinking mode off,
  does not reliably stop visible reasoning. The capability is about what the
  reader sees, not about internal computation: a model may reason privately
  and still answer directly, and that is success. It has two sides, and both
  belong here: the padding a model adds when told not to (preamble,
  restating the question, step-by-step working), and knowing when the
  shortcut is safe, since answering directly cost nothing on closed-answer
  questions and cost accuracy on open-ended ones. Over-long answers are
  among the commonest complaints about models, and the judge-bias claims
  already filed show judges reward length, which is one route by which
  models are trained toward padding.
tags: [behavior, chat-assistant]
group: behavior
aliases: ["answer-only compliance", "no-thinking", "concision", "verbosity", "overthinking"]
match_terms: ["no-thinking", "thinking mode", "answer-only", "verbosity", "verbose", "concise", "concision", "overthinking", "reasoning length", "thinking budget"]
discriminator: >-
  In scope when the paper measures whether a model gives a direct answer
  when asked, the length or padding of its output relative to what the task
  needed, or reasoning that persists or expands beyond what was requested.
  NOT in scope for whether stated reasoning is faithful (explanation
  faithfulness), for judges preferring longer answers (critique), or for
  internal reasoning that never reaches the output.
status: proposed
submitted_by: human:Russ-Miller
