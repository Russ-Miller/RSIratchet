id: formal-query-synthesis
ref: CAP-0052
label: "Writing a reusable locator: regex, SQL, XPath"
summary: >-
  Whether a model can turn an intent or a few examples into a grep
  pattern, regex, SQL query, XPath or jq path that selects the right
  subset, so the pattern runs over the whole collection without calling
  the model again.
description: >-
  Proposed 2026-09-19 from ten papers forwarded by Russ under the heading
  "grep-style locators": neural regex generation (Locascio 2016, SemRegex
  2018, REGEL 2019, Zelina 2024), example-driven extractors (FlashExtract
  2014, wrapper induction 2000), text-to-SQL (Spider 2018, the 2024
  survey) and XPath agents (2025). The pipeline's proposal stage judged
  three of the ten as pointing at a capability the map lacked and
  consolidated them into this one; the other seven it read as covered by
  code-generation, but they are filed here as sources because the set was
  forwarded as one idea. What makes it distinct from ordinary code
  generation is the success test: the artefact is judged by whether it
  selects the right subset (DFA equivalence, execution accuracy, transfer
  to unseen pages), not by whether it reads correctly, and many different
  strings mean the same thing. The practical stake is cost: a locator that
  works is paid for once; a model that must be called per document is
  paid for every time.
tags: [coding-agent, general]
group: coding
aliases: ["locator generation", "pattern synthesis", "text-to-SQL", "regex generation", "programming by example", "grep", "grep-style locators"]
match_terms: ["grep", "regular expression", "regex", "text-to-sql", "text to sql", "xpath", "jsonpath", "program synthesis", "programming by example", "wrapper induction", "semantic parsing"]
discriminator: >-
  In scope when the output is a pattern-language artefact (regex, SQL,
  XPath, CSS selector, jq, a grammar) and the paper measures whether it
  selects or matches correctly against intent or examples. NOT in scope
  for general code generation from a specification, nor for the model
  itself extracting the records at inference time without emitting a
  reusable pattern.
related: [code-generation, retrieval-utilization]
