id: scalable-oversight
ref: CAP-0042
label: "Being supervised by something weaker than itself"
summary: >-
  Whether a model's behaviour can be shaped and checked by a supervisor —
  a person or a weaker model — that cannot do the task as well; the failure
  is a supervisor that cannot tell a good answer from a convincing one.
description: >-
  Filed 2026-09-18 with Hinton's mother-and-infant argument: he says there
  are almost no natural cases of a less intelligent agent reliably
  controlling a more intelligent one. This is the capability that claim is
  about, and the weak-to-strong and scalable-oversight literature is where
  it is measured. Neighbours: critique is the model judging others' work;
  this is others judging the model's, when they are outmatched.
tags: [evaluation, behavior]
group: verification
aliases: ["weak-to-strong generalization", "scalable oversight", "superalignment"]
match_terms: ["scalable oversight", "weak-to-strong", "weak supervision of strong models", "superalignment", "corrigib"]
discriminator: >-
  In scope when the paper measures how well a weaker supervisor (a smaller
  model, a non-expert, a time-limited expert) can elicit, evaluate or
  correct a stronger model, or the conditions under which it fails. NOT in
  scope for models judging peers (critique), or for jailbreak robustness.
status: proposed
submitted_by: human:Russ-Miller
