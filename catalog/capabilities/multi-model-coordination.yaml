id: multi-model-coordination
ref: CAP-0031
label: "Getting more from several models than from one"
summary: >-
  Whether a system of several models or agents — debating, voting, dividing
  work, or sharing state — does better than its best single member; the
  failure is a quorum of copies that agree on the same mistake.
description: >-
  Filed 2026-09-17 when the Cache-to-Cache paper arrived and the map had no
  leaf for it, a week after the DAIR collection's multi-agent paper went to
  the proposal stage for the same reason. The adages "two heads are better
  than one" and Ashby's law of experience hold this catalog's prior: the
  gain depends on the heads being different, and instances of one model
  sharing a context are one head. Claims here are about the coordination
  mechanism itself — debate, majority vote, role division, verifier
  separation, or sharing internal state instead of text — measured against
  the strongest single model at matched cost. Independent verification of a
  producer's output sits under fixing its own mistakes.
tags: [agentic, autonomous-agent]
group: agentic
aliases: ["multi-agent systems", "ensembles", "model quorum", "mixture of agents", "LLM debate"]
match_terms: ["multi-agent", "multi-LLM", "mixture-of-agents", "multiagent", "ensemble of LLMs", "LLM debate", "majority voting", "self-consistency", "cache-to-cache"]
discriminator: >-
  In scope when the paper measures a system of several models or agents
  against a single-model baseline and attributes the difference to how
  they are combined or communicate. NOT in scope for a single model
  sampled several times with no combination rule, for a second model used
  only as a verifier (self repair), or for multi-agent RL environments
  where the subject is the environment.
