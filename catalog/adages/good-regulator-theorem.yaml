id: good-regulator-theorem
ref: ADG-0009
label: Good regulator theorem
statement: Every good regulator of a system must be a model of that system.
origin: >-
  Roger Conant and W. Ross Ashby, 1970. A theorem in cybernetics: to control
  something well you must, in effect, contain a model of it.
transfer: >-
  Read against language models the theorem cuts both ways. A model that acts
  well in an environment must hold some model of it — and the theorem says
  the quality of the action is bounded by the quality of that internal model,
  not by how well the next step is predicted. So it predicts a specific
  failure: an agent that predicts familiar traces well but holds an
  incoherent model of the world will fail as soon as the task leaves the
  traces. It also predicts the fix: give the agent an explicit, externally
  maintained model of the environment and its regulation improves.
evidence:
  - claim: models-predict-next-steps-well-can-still-hold
    verdict: holds
    note: >-
      Good next-step prediction with an incoherent implicit world model fails
      off the familiar traces — the theorem's bound, observed.
  - claim: partially-observable-text-environments-alfworld-scienceworld-letting-llm-agent
    verdict: holds
    note: >-
      Supplying an explicit state estimate of the environment raised task
      success over a memory of raw observations: a better model of the system
      made a better regulator.
status: active
