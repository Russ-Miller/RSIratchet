id: hashimotos-rule
label: Hashimoto's rule
aliases: ["Hashimoto's ratchet", "One rule per failure"]
statement: Every mistake becomes a permanent fix.
origin: >-
  Mitchell Hashimoto's practice as described in "My AI Adoption Journey"
  (February 2026), called the ratchet by the Harness Engineering playbook and
  named "Hashimoto's rule" by Alex Veremeyenko in a September 2026 post on
  the playbook. From software operations, where the older form is the
  blameless post-mortem whose output is a permanent fix, not a reminder.
sources: [hashimoto-2026-ai-adoption-journey, synthesis-2026-harness-engineering-playbook, veremeyenko-2026-hashimotos-rule]
transfer: >-
  The mechanism is that a fix placed in structure (a guide rule, a sensor, a
  permission) is applied on every future run without anyone remembering it,
  while a fix given in conversation dies with the session. That holds for
  models more strongly than for people, because a model has no memory across
  sessions to carry a spoken correction. The place it can fail is the guide
  layer: a rule the model reads but does not follow is a ratchet tooth that
  does not catch, so the ratchet works only where the fix is enforced rather
  than advised.
evidence:
  - claim: fixes-in-the-harness-compound-fixes-in-the-prompt-do-not
    verdict: holds
    note: >-
      States the mechanism directly: corrections in conversation are lost at
      session end; corrections as harness structure apply to every run.
  - claim: a-fixed-model-can-improve-its-own-harness-with-a-regression-gated-loop
    verdict: holds
    note: >-
      A loop that turns each failure cluster into a kept harness edit raised
      pass rate with the model frozen, which is the ratchet run by the agent
      itself.
  - claim: repository-context-files-do-not-raise-task-success-on-benchmark-coding
    verdict: narrows
    note: >-
      Rules written into a context file did not raise success on benchmark
      coding tasks. The ratchet's guide layer is advisory; the finding narrows
      the adage to fixes the harness enforces (sensors, permissions) rather
      than fixes it merely states.
  - claim: a-harness-pays-off-only-for-repeated-consequential-unsupervised-work
    verdict: narrows
    note: >-
      The rule presumes a next run. For one-off and exploratory work the
      permanent fix has nothing to apply to, so the rule is scoped to
      repeated, consequential, unsupervised workflows.
status: active
