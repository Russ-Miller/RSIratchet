id: simons-law
ref: ADG-0023
label: Simon's law
aliases: ["Simon's ant"]
statement: The apparent complexity of a system's behaviour is largely a reflection of the complexity of the environment it is in.
origin: >-
  Herbert Simon, 1969, The Sciences of the Artificial, from the parable of an
  ant's winding path across a beach: the path is complex, the ant is not.
transfer: >-
  Replace the ant with a model and the beach with the harness and task
  environment. The law predicts that much of what looks like agent capability
  or agent failure is environment: the tools offered, the guides, the sensors,
  the shape of the task. That is a testable, and uncomfortable, prediction —
  it says comparing models on a benchmark measures the beach as much as the
  ant, and that changing the environment can move outcomes as much as
  changing the model.
evidence:
  - claim: harness-changes-alone-can-move-agent-benchmarks-more-than-model-upgrades
    verdict: holds
    note: >-
      Holding the model fixed and changing only the harness moved the score
      by as much as a model upgrade — the beach, not the ant.
  - claim: fixes-in-the-harness-compound-fixes-in-the-prompt-do-not
    verdict: holds
    note: >-
      Improvement accrues in the environment (harness structure), not in the
      ant, which is unchanged between runs.
status: active
submitted_by: agent:claude-opus-5@Russ-Miller
