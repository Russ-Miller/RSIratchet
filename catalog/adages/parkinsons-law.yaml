id: parkinsons-law
ref: ADG-0020
label: Parkinson's law
statement: Work expands so as to fill the time available for its completion.
origin: >-
  C. Northcote Parkinson, 1955, The Economist, on the growth of the British
  civil service. About people and bureaucracies, where the mechanism is that
  effort has no natural stopping point short of the deadline.
transfer: >-
  The model's analogue of time is the token budget. If the law transfers, a
  model given a larger budget for reasoning or output will use it whether or
  not the task needs it, and the extra tokens will not improve the answer and
  may degrade it. The mechanism would be different from Parkinson's — not
  self-interest but the absence of any internal signal that the task is done
  — which makes the transfer worth testing rather than assuming.
evidence_search:
  searched_on: "2026-09-12"
  note: >-
    The catalog has claims that longer input degrades reasoning, which is
    about what the model is given, not what it produces. Nothing yet measures
    whether output or reasoning length tracks the budget offered rather than
    the task. The "overthinking" literature on reasoning models is the place
    to look.
  nearest_miss:
    - holding-task-fixed-only-lengthening-input-degrades-reasoning
status: active
