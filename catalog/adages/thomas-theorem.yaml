id: thomas-theorem
ref: ADG-0024
label: Thomas theorem
statement: If people define situations as real, they are real in their consequences.
origin: >-
  W. I. Thomas and Dorothy Swaine Thomas, 1928; developed by Robert K. Merton
  into the self-fulfilling prophecy. Sociology: belief acts on the world
  through the behaviour it produces.
transfer: >-
  A prompt defines the situation, and a model has no independent access to
  the world against which to doubt the definition. So a premise stated in the
  prompt should become real in its consequences for the model — it reasons
  from it, elaborates it, and answers within it — more completely than for a
  person, who at least has the option of checking. The prediction is that
  false premises are not merely accepted but built on, and that asking for
  more reasoning makes it worse, because reasoning elaborates the premise
  rather than questioning it.
evidence:
  - claim: questions-whose-premises-false-or-internally-contradictory-prompting-mid-size
    verdict: holds
    note: >-
      A false premise in the question became real in its consequences:
      step-by-step reasoning elaborated from it and lowered accuracy below
      plain answering.
  - claim: models-endorse-widely-held-falsehoods-showing-weak-verification
    verdict: holds
    note: >-
      A situation defined as real by many people is treated as real by the
      model, which does not check it against what it knows.
  - claim: models-readily-adopt-single-counter-memory-passage-when-coherent
    verdict: holds
    note: >-
      A single coherent passage redefines the situation and the model follows
      it, against its own prior knowledge.
status: active
