id: no-one-should-judge-their-own-cause
ref: ADG-0019
label: No one should be judge in their own cause
aliases: ["Nemo iudex in causa sua", "Don't grade your own homework"]
statement: A party with a stake in an outcome cannot be trusted to judge it.
origin: >-
  Roman law maxim (nemo iudex in causa sua), a pillar of natural justice in
  common-law systems. About conflict of interest in people: a judge who
  benefits from a verdict will, consciously or not, reach it.
transfer: >-
  A model has no stake in the ordinary sense, so if the maxim transfers it is
  for a different reason: the model that produced an output holds the same
  context, the same assumptions and the same blind spots that produced the
  error, so its review re-runs the mistake rather than catching it. That
  predicts the maxim holds when the reviewer shares the producer's context and
  weakens when the reviewer has independent grounding (a test result, a
  verifier, a different model with different context).
evidence:
  - claim: self-critique-without-grounding-unreliable
    verdict: holds
    note: >-
      Without an external signal, a model's own critique is unreliable and
      revision often turns a correct answer wrong.
  - claim: the-producing-agent-should-not-be-sole-judge-of-its-output
    verdict: holds
    note: >-
      Argued from the mechanism above: the producer holds the context that
      skewed the output, so verification belongs with a sensor or a separate
      verifier.
  - claim: deterministic-sensors-should-precede-llm-judges
    verdict: narrows
    note: >-
      Where a deterministic check exists it should come first; a model judge
      is acceptable only for properties no rule can express, and then as an
      advisory signal. The maxim holds for model judges, less for sensors.
status: active
