id: lehmans-law-of-increasing-complexity
ref: ADG-0017
label: Lehman's law of increasing complexity
aliases: ["Manny Lehman's law"]
statement: As a system evolves its complexity increases unless work is done to maintain or reduce it.
origin: >-
  Meir "Manny" Lehman, 1974 onward, the second of his laws of software
  evolution, from studying IBM's OS/360. About long-lived software in real
  organisations, where each change adds structure and nobody removes any.
transfer: >-
  An agent's context is a small evolving system: guide files, accumulated
  tool output, notes, prior turns. Each run adds to it and nothing removes
  anything by default. The law transfers if that accumulation has a cost,
  and the catalog says it does — irrelevant tokens degrade reasoning on their
  own — so the "work done to reduce it" clause becomes a design requirement:
  context has to be pruned, paged or compiled, or performance decays. The
  twist is that the maintenance work itself needs capability; handing a weak
  model the pruning tools makes it worse.
evidence:
  - claim: adding-irrelevant-tokens-alone-degrades-reasoning-mechanism-by
    verdict: holds
    note: >-
      The cost side of the law: accumulated irrelevant context degrades
      reasoning by itself, so growth without maintenance has a price.
  - claim: managing-context-explicitly-paging-information-out-bounded-window
    verdict: holds
    note: >-
      The maintenance side: explicitly paging context in and out sustains
      performance where unmanaged growth would not.
  - claim: handing-agent-context-editing-tools-delete-summarize-note-fold-prompt
    verdict: narrows
    note: >-
      The maintenance work is not free: mid-size models given pruning tools by
      prompt alone got worse. The law holds; the fix needs capability or
      training.
status: active
