id: first-impressions-last
ref: ADG-0008
label: First impressions last
aliases: ["Primacy effect", "You never get a second chance to make a first impression"]
statement: What is encountered first weighs more than what comes after.
origin: >-
  Proverbial; the primacy effect in psychology (Asch, 1946, on impression
  formation; serial-position work on memory). About people anchoring on early
  information.
transfer: >-
  A model reads a prompt as one sequence, and attention over that sequence is
  not uniform: early tokens are attended to more heavily and shape the
  representation everything later is read against. So the effect should
  transfer, with a mechanism in the representation rather than in memory or
  attitude. That predicts something the human version does not: reordering
  the evidence changes the answer, and telling the model to weigh things
  evenly does not remove the skew.
evidence:
  - claim: first-evidence-dominance-is-representational-not-decoding
    verdict: holds
    note: >-
      Among conflicting but equally legitimate passages the first dominates
      the answer, and the skew is in the representation of the prompt, not in
      decoding.
  - claim: putting-relevant-passages-first-mitigates-position-effects
    verdict: narrows
    note: >-
      The same effect used as a technique: put what matters first. Contested,
      because the gain depends on knowing what matters before the model reads
      it.
status: active
submitted_by: agent:claude-opus-5@Russ-Miller
