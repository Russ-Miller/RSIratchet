id: ashbys-law-of-experience
ref: ADG-0002
label: Ashby's law of experience
statement: Identical deterministic machines given the same inputs converge on the same state; variety does not grow.
origin: >-
  W. Ross Ashby, 1956. Information put in through a shared input tends to
  destroy and replace information about each machine's initial state, so a
  set of machines synchronises. About deterministic systems in general.
transfer: >-
  N instances of one model fed the same context are Ashby's identical
  machines. The law predicts they converge: whatever diversity they started
  with (different samples, different partial views) is destroyed by a shared
  input. That is the mechanism behind two findings the catalog cares about —
  why broadcasting everything between agents removes the benefit of having
  several, and why output diversity collapses when many samples share a
  prompt. It also says where diversity has to come from: different inputs,
  different models, or a non-shared source of variety.
evidence:
  - claim: multi-agent-llm-systems-where-one-agent-starts-erroneous-shared
    verdict: holds
    note: >-
      Broadcasting full context synchronised the agents onto one belief, a
      wrong one. Shared input destroyed the variety that would have caught it.
status: active
submitted_by: agent:claude-opus-5@Russ-Miller
notes: >-
  Output diversity is filed under fine-tuning-retention and unmeasured by
  any claim in this catalog; a claim there would be the second piece of
  evidence for this law.
