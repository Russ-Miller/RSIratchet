id: law-of-triviality
ref: ADG-0016
label: Law of triviality
aliases: ["Bikeshedding", "Parkinson's law of triviality"]
statement: People give disproportionate weight to trivial issues because those are the ones everyone can grasp.
origin: >-
  C. Northcote Parkinson, 1957: a committee approves a nuclear reactor in
  minutes and argues for hours over the bicycle shed. About attention in
  groups, where the mechanism is that easy-to-evaluate features attract
  evaluation.
transfer: >-
  The mechanism transfers to a model used as a judge: surface features —
  which answer came first, which is longer, which sounds like the judge's
  own style — are easy to evaluate and get weight that substance does not.
  But it does not obviously transfer to a model as a producer: there the
  catalog finds the opposite, models satisfying hard domain constraints while
  missing trivial formatting ones. So the law splits on role. As evaluator,
  the model bikesheds; as author, it under-attends to the shed.
evidence:
  - claim: identifies-position-verbosity-self-enhancement-biases-strong-judges-while
    verdict: holds
    note: >-
      Judges weight position, verbosity and self-similarity — the trivially
      graspable features — until those are specifically mitigated.
  - claim: raw-llm-judges-show-position-bias-gpt-4
    verdict: holds
    note: >-
      A verdict flipped by swapping the order of the candidates is weight
      given to the most trivial feature possible.
  - claim: scientific-tasks-where-domain-specific-constraint-general-presentation-constraint-letter
    verdict: breaks
    note: >-
      As a producer the model satisfied the hard domain constraint more often
      than the trivial presentation one: the reverse of bikeshedding.
status: active
