id: ashbys-law-of-requisite-variety
ref: ADG-0003
label: Ashby's law of requisite variety
aliases: ["Only variety can absorb variety", "Law of requisite complexity"]
statement: A regulator can only control a system if it has at least as many distinguishable responses as the disturbances it must handle.
origin: >-
  W. Ross Ashby, 1956, An Introduction to Cybernetics; Stafford Beer's
  phrasing is "variety absorbs variety". Boisot and McKelvey restated it as
  the law of requisite complexity. About control systems in general, treated
  by Ashby as a law of nature rather than a rule of thumb.
transfer: >-
  A harness is a regulator of a model, and the model's failure modes are the
  disturbances. The law then says what a harness engineer can and cannot do:
  a fixed set of rules, gates and sensors can only catch the failures it has
  a response for, and an open-ended model will produce disturbances outside
  that set. The prediction is that any control which covers fewer paths than
  the model can take will be bypassed, not by malice, but because the variety
  is simply there. It also says why the ratchet has to keep turning: each new
  failure is new variety the regulator must absorb.
evidence:
  - claim: an-approval-gate-holds-only-under-complete-mediation
    verdict: holds
    note: >-
      A gate that mediates one branch while a sibling's side effect runs has
      less variety than the system it regulates, and reads as a barrier
      without being one. The shipped frameworks have exactly this gap.
status: active
submitted_by: agent:claude-opus-5@Russ-Miller
notes: >-
  One claim is thin backing for a law this general. Wanted: any measured case
  where the number of distinct failure modes an agent exhibited was compared
  with the number of distinct checks its harness ran.
