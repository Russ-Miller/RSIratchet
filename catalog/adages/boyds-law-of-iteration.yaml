id: boyds-law-of-iteration
ref: ADG-0004
label: Boyd's law of iteration
statement: Speed of iteration beats quality of iteration.
origin: >-
  John Boyd's OODA-loop work on air combat, as applied to software by Jeff
  Atwood (2007). About learning faster than the opponent or the problem
  changes, on the assumption that each iteration teaches something.
transfer: >-
  An agent iterates for nearly free, so if the law transfers it transfers
  overwhelmingly — except that the law's silent premise is that each
  iteration carries real feedback. A model iterating on its own judgement
  gets no new information per loop and can iterate quickly toward a worse
  answer. So the prediction is sharp: fast iteration wins when a grounded
  signal closes each loop, and is worthless or harmful when the loop is
  closed by the model's own opinion.
evidence:
  - claim: grounded-reflection-improves-multistep-tasks
    verdict: narrows
    note: >-
      Iterating helps substantially when each loop is closed by a real
      environment signal — a test result, a tool error.
  - claim: self-critique-without-grounding-unreliable
    verdict: narrows
    note: >-
      Iterating on the model's own critique does not help and can degrade a
      correct answer. Speed without a signal is not learning.
  - claim: a-fixed-model-can-improve-its-own-harness-with-a-regression-gated-loop
    verdict: narrows
    note: >-
      Many fast iterations on the harness raised pass rate, but only because a
      regression gate rejected the ones that did not.
status: active
