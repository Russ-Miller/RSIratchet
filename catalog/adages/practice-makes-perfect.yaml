id: practice-makes-perfect
ref: ADG-0022
label: Practice makes perfect
statement: Doing a thing repeatedly makes you better at it.
origin: >-
  English proverb, from the Latin usus promptos facit; sixteenth-century
  English usage. About skill acquired through repetition, resting on memory
  that persists between attempts.
transfer: >-
  It should not transfer, and the reason is precise: the premise is memory
  across attempts, and a deployed model's weights do not change between
  sessions. Repetition within a session can help through in-context examples,
  but nothing carries over. Where the proverb appears to hold for an agent
  system, the practice is accumulating somewhere other than the model — in
  its harness, its guide files, its memory store — which is a different claim
  with a different failure mode.
evidence:
  - claim: fixes-in-the-harness-compound-fixes-in-the-prompt-do-not
    verdict: breaks
    note: >-
      A correction made in conversation is gone when the session ends. The
      model does not get better from having been corrected; the system does
      only if the correction is moved into structure.
  - claim: a-fixed-model-can-improve-its-own-harness-with-a-regression-gated-loop
    verdict: narrows
    note: >-
      Practice makes the harness perfect, not the model: with weights frozen,
      repeated failure-driven edits to the scaffolding raised pass rate.
status: active
submitted_by: agent:claude-opus-5@Russ-Miller
notes: >-
  Wanted: a measured comparison of the same model on the same task at
  attempt 1 and attempt 20 within one session, with and without the earlier
  attempts in context, to pin down how much in-session repetition buys.
