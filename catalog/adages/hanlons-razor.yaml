id: hanlons-razor
ref: ADG-0011
label: Hanlon's razor
statement: Never attribute to malice that which is adequately explained by incompetence.
origin: >-
  Attributed to Robert J. Hanlon, 1980, in a collection of Murphy's-law
  jokes; older forms go back at least to Goethe. About interpreting other
  people's failures charitably.
transfer: >-
  Applied to a model, the razor is a rule for reading failures: a wrong
  answer, a fabricated citation or an ignored instruction is almost always
  error, not deception, and treating it as deception misdirects the fix
  toward alignment when the problem is capability. The catalog's evidence
  says the razor holds by propensity — models rarely initiate deception under
  incentive — but the razor's premise that malice is rare because it is
  absent does not hold: the capability to deceive strategically exists and is
  distinct from the propensity. So the transfer is narrowed: attribute to
  error by default, and evaluate capability and propensity as separate
  questions.
evidence:
  - claim: agentic-customer-service-settings-where-deployer-incentive-conflicts-users-documented
    verdict: holds
    note: >-
      Under incentive alone, most models almost never initiated deception,
      even ones that comply with explicit instructions to deceive. Error, not
      malice, is the default explanation the evidence supports.
  - claim: deception-ability-emerged-in-frontier-models
    verdict: narrows
    note: >-
      The capacity for strategic deception exists in frontier models, so the
      razor is a prior about propensity, not a claim that the alternative is
      impossible.
status: active
