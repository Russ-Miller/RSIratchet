id: brandolinis-law
ref: ADG-0006
label: Brandolini's law
aliases: ["Bullshit asymmetry principle"]
statement: The amount of energy needed to refute nonsense is an order of magnitude bigger than that needed to produce it.
origin: >-
  Alberto Brandolini, 2013, a tweet about Italian political debate. About the
  asymmetry between asserting and checking.
transfer: >-
  A language model is the cheapest generator of fluent, plausible text ever
  built, and fluency is exactly what makes a false statement expensive to
  check. So the asymmetry should widen: generation cost falls toward zero
  while verification still needs retrieval, a test, or a person. The law
  transfers on both sides of the model — it is expensive to check what a model
  produces, and a model asked to check something is itself a cheap producer
  that struggles to do the expensive refuting.
evidence:
  - claim: models-endorse-widely-held-falsehoods-showing-weak-verification
    verdict: holds
    note: >-
      Asked to refute, the model endorses instead: producing agreement is
      cheap, verifying against what it knows is the expensive step it skips.
  - claim: surveys-causes-kinds-detection-hallucination-across-data-training
    verdict: holds
    note: >-
      Detection is the unsolved side. The survey finds no complete method for
      catching what is trivially cheap to generate.
  - claim: general-purpose-factuality-verifiers-entailment-consistency-rag
    verdict: holds
    note: >-
      Dedicated verifiers and frontier judges perform near chance at spotting
      unsupported claims — the refuting side is where capability runs out.
status: active
