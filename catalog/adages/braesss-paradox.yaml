id: braesss-paradox
ref: ADG-0005
label: Braess's paradox
statement: Adding capacity to a network can make its overall performance worse.
origin: >-
  Dietrich Braess, 1968, on road networks: a new road can raise everyone's
  journey time because each driver's selfish choice shifts the equilibrium.
  About systems where local improvements change global behaviour.
transfer: >-
  The paradox transfers wherever adding a resource changes what the model
  attends to rather than simply adding an option. More tools in the prompt
  means more schema to read and more wrong tools to pick; more agents with a
  shared channel means more routes for an error to spread; more
  context-management tools means more ways to damage the context. The
  mechanism is not selfish drivers but a fixed attention budget and a model
  that uses what it is given, so the prediction is that capacity added
  without a corresponding reason to ignore it will often cost more than it
  returns.
evidence:
  - claim: agent-must-work-over-very-large-tool-catalogue-wrapping
    verdict: holds
    note: >-
      Enumerating a large tool catalogue in the prompt hurt; hiding the
      schemas behind a natural-language wrapper — removing capacity from the
      model's view — helped more than any other stage.
  - claim: handing-agent-context-editing-tools-delete-summarize-note-fold-prompt
    verdict: holds
    note: >-
      Adding context-editing tools by prompt alone made mid-size models worse
      than having no such tools.
  - claim: multi-agent-llm-systems-where-one-agent-starts-erroneous-shared
    verdict: holds
    note: >-
      Adding communication links (full broadcast) raised the false-assertion
      rate above no links at all.
status: active
