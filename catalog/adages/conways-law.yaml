id: conways-law
ref: ADG-0007
label: Conway's law
statement: Organisations design systems that mirror their own communication structure.
origin: >-
  Melvin Conway, 1967, "How Do Committees Invent?". About human teams: the
  interfaces in a product fall where the interfaces between teams fall.
transfer: >-
  A multi-agent system is an organisation, and its communication structure is
  a design choice made explicitly in the harness — who talks to whom, what is
  broadcast, what is private. If the law transfers, the shape of the output
  (where its seams and inconsistencies fall) should be predictable from that
  topology. The mechanism with people is that communication cost shapes what
  gets coordinated; with agents the cost is near zero, so the law may hold for
  a different reason: what is shared shapes what is believed.
evidence_search:
  searched_on: "2026-09-12"
  note: >-
    The catalog has a claim that communication topology changes multi-agent
    error rates, which is the premise of the law but not its content: nothing
    yet shows the structure of an output mirroring the structure of the agents
    that produced it.
  nearest_miss:
    - multi-agent-llm-systems-where-one-agent-starts-erroneous-shared
status: active
