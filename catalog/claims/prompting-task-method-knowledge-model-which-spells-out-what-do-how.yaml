id: prompting-task-method-knowledge-model-which-spells-out-what-do-how
ref: CLM-0320
capability: planning
technique: task-method-knowledge-prompting
statement: >-
  Prompting with a Task-Method-Knowledge model, which spells out what to do,
  how, and why in a hierarchical structure, lifted o1 on the obfuscated
  Random Blocksworld set of PlanBench from about 32% to 97%, and o1-mini
  from about 9% to 27%, gains far beyond the roughly 1% that zero-shot
  chain-of-thought gave on PlanBench in earlier work; the smaller model did
  not benefit on the Mystery variant.
kind: observation
backing_strength: single-paper
observed_on:
  era: "PlanBench Blocksworld variants (standard, Mystery, Random), o1 and o1-mini among others, 2026; prompt-only intervention."
sources:
  - source: arxiv-2602-03900
    stance: supports
    note: >-
      Validated by: Plan validity on PlanBench Blocksworld variants with and
      without TMK across several models; gains up to 65.8 points on Random
      Blocksworld for o1; no gain for o1-mini on Mystery.. Large effect on
      one benchmark family; the TMK model is hand-authored per domain, which
      is the cost the paper does not price.
contested: false
