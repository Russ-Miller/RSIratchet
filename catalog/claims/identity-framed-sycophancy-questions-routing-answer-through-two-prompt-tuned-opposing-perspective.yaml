notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A replication where blind
  multi-agent arbitration scores no better than an instructed-opposition
  single model on identity-framed sycophancy items, or where the gain
  disappears once the synthesizer is given the agent identities back.
