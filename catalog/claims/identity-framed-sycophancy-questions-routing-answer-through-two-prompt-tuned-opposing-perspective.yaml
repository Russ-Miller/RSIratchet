id: identity-framed-sycophancy-questions-routing-answer-through-two-prompt-tuned-opposing-perspective
ref: CLM-0837
capability: sycophancy
technique: arbitrate-between-opposing-perspective-agents-origins-hidden
statement: >-
  On identity-framed sycophancy questions, routing the answer through two
  prompt-tuned opposing-perspective model instances plus a third synthesizer
  that sees both arguments with their origins stripped raises accuracy over
  a single model and over simply instructing one model to take an opposing
  view, while still leaving over half the questions wrong.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 stratified SycophancyEval questions, prompt-based instantiation only (no fine-tuning); variants did not differ significantly from each other at n=200 and an estimated 40% of qu"
sources:
  - source: arxiv-2606-07532
    stance: supports
    note: >-
      Validated by: Accuracy on 200 stratified SycophancyEval questions
      against a single-model baseline (18.5%) and an instructed-opposition
      baseline (29.0%); best non-degenerate variant 48.5% (z=6.36, p<0.001
      against both).. Measured on one benchmark slice (200 questions) with
      two baselines; five variants tested but not separable from each other
      at this n, and one high-scoring variant is acknowledged to be
      structurally degenerate. No test of whether the gain holds on
      non-identity-framed sycophancy or with fine-tuned rather than prompted
      agents.
contested: false
