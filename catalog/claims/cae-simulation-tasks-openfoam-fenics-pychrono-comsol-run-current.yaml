id: cae-simulation-tasks-openfoam-fenics-pychrono-comsol-run-current
ref: CLM-0579
capability: multi-model-coordination
technique: drop-cae-scaffolding-supply-solver-tutorials-instead
statement: >-
  For CAE simulation tasks (OpenFOAM, FEniCS, PyChrono, COMSOL) run with a
  current general-purpose coding-agent harness and a strong backbone, a
  single agent with no multi-agent role decomposition and no scripted
  self-critique matches or exceeds the published scores of multi-agent
  specialized CAE systems, because the harness itself supplies the
  multi-turn reasoning and execution-feedback repair the decomposition was
  built to compensate for.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Holds with information access, repair budget and benchmark scoring criterion matched; the specialized systems were not re-run on the same backbone, so backbone strength is confound"
sources:
  - source: arxiv-2609-03718
    stance: supports
    note: >-
      Validated by: Task success under each benchmark's native criterion:
      FoamBench 96.4% (106/110) vs the specialized system's published 88.2%,
      MCP-SIM 100% vs 91.7%, ties elsewhere and 33.3% on FEABench; ablations
      on FoamBench show must-read tutorials 80.9% to 96.4%, repair budget
      71.8% to 96.4%, and a scripted-reflection prompt changing nothing
      (96.4% both).. Measured on six benchmarks, but only FoamBench (110
      cases) is large and field-level scored; single run per configuration,
      no variance reported, several suites under 15 cases; [truncated]
