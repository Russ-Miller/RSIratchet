id: frozen-weight-multi-agent-image-diagnosis-pipeline-dermatology-accumulating-confirmed-cases
ref: CLM-1133
capability: harness-self-improvement
technique: distilled-experience-memory
statement: >-
  In a frozen-weight multi-agent image diagnosis pipeline for dermatology,
  accumulating confirmed cases and periodically distilling them into
  per-disease diagnostic guidelines that are retrieved at inference raises
  accuracy over the identical pipeline without that memory, and the gain is
  larger in high-cardinality label spaces than in coarse ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Dermatology image classification with a fine-tuned vision backbone supplying top-5 candidates; measured on Fitzpatrick-17k (~114 classes) and a 498-class Dermnet re-split; no held-"
sources:
  - source: arxiv-2603-26122
    stance: supports
    note: >-
      Measured: single-arm ablation (with vs without memory) on two
      datasets, with confidence intervals and t-tests. Does not isolate
      guideline distillation from similar-case retrieval, nor control for
      the extra context tokens the memory injects; no comparison against a
      static retrieval baseline of equal size. Clinical ratings are of the
      guidelines' plausibility, not of diagnostic gain.
contested: false
status: pending-review
last_checked_at: 2026-11-27
