id: tool-integrated-llm-agents-where-attack-works-adding-attacker-controlled-tools
ref: CLM-0371
capability: prompt-injection
technique: restore-trusted-toolset-just-before-planning
statement: >-
  For tool-integrated LLM agents where the attack works by adding
  attacker-controlled tools, overwriting the agent's visible toolset with
  the saved user toolset immediately before planning drives attack success
  to near zero across direct and indirect injection, memory poisoning and
  backdoor attacks, but its effect on benign task success is model-dependent
  — raising it for 7-9B open models and lowering it for GPT-3.5/GPT-4.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "ASB benchmark, 10 agent domains; attacks that operate by injecting or tampering with tools; requires white-box access to restore a trusted toolset before planning; not tested in dy"
sources:
