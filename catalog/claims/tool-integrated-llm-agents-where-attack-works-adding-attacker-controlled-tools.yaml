    stance: supports
    note: >-
      Validated by: Attack success rate and original task success rate on
      the ASB benchmark across four open 7-9B models and
      GPT-3.5/GPT-4/GPT-5, against no defense and against ASB's paraphrasing
      and delimiter defenses; ASR fell to 0 on several models under IPI, MP
      and backdoor, while OTSR fell for GPT models under IPI/MP/backdoor..
      Measured on one benchmark (ASB) with four attack families and seven
      models; [truncated]
