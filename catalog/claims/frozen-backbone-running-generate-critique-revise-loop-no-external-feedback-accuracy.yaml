id: frozen-backbone-running-generate-critique-revise-loop-no-external-feedback-accuracy
ref: CLM-0393
capability: self-repair
technique: stop-reflection-loop-confirmed-sentinel-confidence-score
statement: >-
  For a frozen backbone running a generate-critique-revise loop with no
  external feedback, the accuracy gain tracks how weak single-shot
  performance is on the benchmark: on clean multi-step reasoning where
  single-shot is already strong the loop leaves accuracy flat, while on
  harder math it raises accuracy substantially.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Training-free prompt-level self-critique on pure-reasoning benchmarks (BBH, GSM8K, MATH) with two frozen backbones; no tools or external verifier."
sources:
  - source: arxiv-2608-18884
    stance: supports
    note: >-
      Validated by: On BBH (n=500) the sentinel stopped 82-88% of items at
      ~2.1 generations with accuracy inside the always-loop Wilson interval,
      and a confusion matrix put correct self-assessment at 78%; a sweep of
      confidence thresholds 0.6-0.9 halted every item at the first
      generation, so the numeric tag gave no selective stopping point.
      Fixed-depth Self-Refine scored lower on BBH (71.2% vs 74.0%)..
