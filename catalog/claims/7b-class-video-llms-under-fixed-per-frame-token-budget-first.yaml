notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A matched-token-budget
  comparison in which uniform dense sampling, or query-conditioned selection
  without the grounding step, equals the two-stage ground-then-resample
  pipeline on fine-grained temporal grounding and reasoning; or ablations
  showing the temporal position tokens contribute nothing. Drafted stance
  toward frozen-7-8b-multimodal-models-long-video-qa-under-fixed-frame:
  supports -- Both find that allocating a fixed frame budget by query
  relevance rather than uniformly raises accuracy on temporally demanding
  video questions.
