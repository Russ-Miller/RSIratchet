id: frontier-mllms-asked-plan-landmark-grounded-route-5-minute-egocentric
ref: CLM-1099
capability: planning
statement: >-
  For frontier MLLMs asked to plan a landmark-grounded route from a 5+
  minute egocentric video, handing them a ground-truth cognitive map of the
  scene raises planning success only marginally (average target success rate
  still about 11.8%, navigation error about 5.29m), so the limit is
  structured multi-step spatial reasoning rather than extracting the layout
  from video.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Long egocentric indoor videos in Habitat-simulated scenes; models must emit a hierarchical cognitive map plus a landmark-grounded path, scored by simulator execution; tested on ope"
sources:
  - source: arxiv-2603-21577
    stance: supports
    note: >-
      Measured on a 2,300-2,650-sample test split across 246 Habitat scenes,
      comparing a no-map setting against an oracle-map setting for ~9
      models; reports +12.6 points target success and +8.1 points path
      success from the oracle map, from a near-floor baseline. The oracle
      condition isolates perception from reasoning, but the required output
      format (JSON map plus reasoning chain) may itself depress scores
      independently of spatial reasoning.
contested: false
status: pending-review
last_checked_at: 2026-11-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  route-planning success rises to near its own perception-free ceiling once
  a correct scene map is supplied, showing map construction was the binding
  constraint.
