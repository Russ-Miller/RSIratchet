id: long-horizon-financial-tool-calling-tasks-efficiency-style-metrics-step-count-redundancy
ref: CLM-0866
capability: long-horizon-execution
technique: score-tool-call-trajectories-four-axes-success-rate
statement: >-
  On long-horizon financial tool-calling tasks, efficiency-style metrics
  (step count, redundancy) reward degenerate agents: weak models that invoke
  very few or wrong tools score near-perfect on step efficiency and
  redundancy while scoring lowest on tool-selection F1, information
  utilization and answer quality, so efficiency or success-rate alone
  misranks them.
kind: observation
backing_strength: single-paper
observed_on:
  era: "800 expert-annotated trajectories over 34 financial task categories against 247 Financial Modeling Prep tools via MCP, 13 proprietary and open models, nine-metric rubric with LLM-j"
sources:
  - source: arxiv-2604-10015
    stance: supports
    note: >-
      Validated by: Applied to 13 models; ranking stability checked with an
      out-of-family judge (Spearman 0.989), human annotation of 90
      trajectories on three metrics (judge-human weighted kappa
      0.631-0.857), and leave-one-metric-out/median aggregation (Kendall tau
      >= 0.974). No external validation that the rubric predicts deployment
      outcomes.. Measured: Qwen-3.5-9B scores 1.000 step efficiency and
      1.000 redundancy with 0.109 tool-calling F1 and the lowest answer
      quality; Llama-3.3-70B shows the same pattern (0.939/0.998 vs 0.437
      F1). [truncated]
