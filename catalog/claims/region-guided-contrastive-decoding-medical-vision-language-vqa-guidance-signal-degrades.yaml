capability: visual-grounding
technique: pick-occlusion-roi-counterfactual-likelihood-drop-penalizing-size
statement: >-
  In region-guided contrastive decoding for medical vision-language VQA, the
  guidance signal degrades as the suppressed region gets larger, so compact
  automatically discovered masks (about 7% mean image coverage) outperform
  ground-truth bounding boxes (about 39% coverage), which can leave
  closed-ended accuracy below plain decoding.
