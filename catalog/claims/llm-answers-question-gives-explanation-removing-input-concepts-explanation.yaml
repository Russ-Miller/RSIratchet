id: llm-answers-question-gives-explanation-removing-input-concepts-explanation
capability: explanation-faithfulness
statement: >-
  When an LLM answers a question and gives an explanation, removing from the
  input the concepts its explanation did not credit and re-querying on the
  reduced input raises measured explanation faithfulness over both standard
  prompting and prompts that ask for faithfulness, because the removal
  deletes the unmentioned influences rather than asking the model to report
  them.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tested on two datasets with question-plus-explanation prompts across multiple model families, using two faithfulness metrics; targets incompleteness (omitted influences), not unsou"
sources:
  - source: arxiv-2609-04343
    stance: supports
    note: >-
      Measured on two datasets, several model families, two independent
      faithfulness metrics, against standard prompting and
      faithfulness-encouraging prompting baselines. Only the abstract and
      introduction were available, so effect sizes, metric definitions, and
      how reliably concepts are extracted are not verifiable here; the
      design does not isolate whether gains come from removal or from the
      second query.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Re-querying on the
  concept-reduced input yields no higher faithfulness than standard or
  faithfulness-encouraging prompting on the same datasets and metrics, or
  the gain disappears when the removal step is replaced by a no-op
  reduction. Proposed technique, not catalogued: Remove unmentioned concepts
  and re-query.
