id: collaborative-instance-object-navigation-agents-30b-parameters-or-less
ref: CLM-0825
capability: embodied-control
technique: score-question-asking-separately-navigation-episode
statement: >-
  For collaborative instance object navigation agents of 30B parameters or
  less, question-asking competence falls apart exactly where it is most
  needed: when the target description is category-only (the most ambiguous
  level), a fine-tuned 7B agent and a 30B VLM commit to immediate
  accept/reject decisions instead of asking (SR 0.06 and 0.02), while their
  success rises monotonically as the description adds color, feature and
  context (up to 0.68 and 0.54).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Navigation-ready VLMs (<=30B) evaluated on an offline question-asking protocol with generated distractor images, six graded description-specificity levels, and a VLM oracle; a fron"
sources:
  - source: arxiv-2604-00265
    stance: supports
    note: >-
      Validated by: Measured success rate, finish rate, questions per
      observation and wall-clock time for 5 systems across three oracle
      models on ~400 held-out episodes; oracle responses were additionally
      compared against human responses and reported as giving similar
      performance; episodes complete in seconds rather than the minutes a
      simulator episode needs.. Measured on the authors' own benchmark (~400
      test episodes, three oracles averaged) comparing a modular baseline
      (AIUTA), a fine-tuned 7B model, and a 30B VLM across six
      description-specificity levels. [truncated]
contested: false
