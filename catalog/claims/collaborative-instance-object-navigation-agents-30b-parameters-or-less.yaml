notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A sub-30B CoIN agent
  whose asking rate and success on category-only descriptions match or
  exceed its performance on richly specified descriptions, under the same
  distractor protocol.
