statement: >-
  For structured extraction from text files, web pages and spreadsheets, a
  few user-highlighted example fields are enough to synthesise a reusable
  extraction program that pulls the remaining fields without further
  interaction — the locator can be inferred from examples rather than
  written or re-invoked per record.
