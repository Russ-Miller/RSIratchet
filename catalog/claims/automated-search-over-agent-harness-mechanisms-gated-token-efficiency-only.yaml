id: automated-search-over-agent-harness-mechanisms-gated-token-efficiency-only
ref: CLM-0234
capability: harness-self-improvement
technique: self-harness-loop
statement: >-
  When an automated search over agent-harness mechanisms is gated on token
  efficiency with only a tolerance band on capability, the resulting full
  stack buys large token savings at a small but consistent score loss, and
  scores below the best single discovered mechanism — on EdgeBench the
  four-mechanism stack cut token traffic 44.7-49.0% and cost about a third
  while scoring 42.0 vs 44.8 for the base harness on GPT-5.6 Sol, whereas
  adding ObservationPack alone scored 47.2.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Coding/terminal agent harnesses (Pi-based) on EdgeBench, Terminal-Bench 4 and IMO 2026, with GPT-5.6 Sol as search backend and Opus 5 as held-out backend; search optimized efficien"
sources:
  - source: arxiv-2609-20519
    stance: supports
    note: >-
      Measured on one held-out benchmark suite with single runs per
      configuration and no variance reported; Terminal-Bench 4 shows the
      stack solving fewer tasks (15 vs 18) at lower cost, consistent with
      the score-for-efficiency trade. Add-one ablations are on the same
      benchmark used for the headline result.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where the
  efficiency-gated full stack matches or exceeds the base harness score, or
  where the best single mechanism does not outscore the combined stack, on
  held-out tasks. Drafted stance toward
  a-fixed-model-can-improve-its-own-harness-with-a-regression-gated-loop:
  supports -- It is another regression-gated self-improving harness loop
  that improves a measured objective with the model frozen, here efficiency
  rather than pass rate.
