id: multimodal-llms-answering-spatio-temporal-questions-about-dynamic-videos-overlaying
ref: CLM-1168
capability: video-temporal-reasoning
technique: feed-raw-frames-segmentation-masks-together-masks-alone
statement: >-
  For multimodal LLMs answering spatio-temporal questions about dynamic
  videos, overlaying object segmentation masks on frames alone does not
  improve accuracy, while supplying both the raw frames and the masks
  together does, with the gain concentrated in inter-object and
  camera-object motion questions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Measured on one general 8B video MLLM (Qwen3-VL-8B) over a benchmark of 1k dynamic videos with multiple-choice spatio-temporal questions; masks come from ground-truth/annotated seg"
sources:
  - source: arxiv-2603-12746
    stance: supports
    note: >-
      Validated by: Multiple-choice accuracy on Dyn-Bench with Qwen3-VL-8B:
      raw video 53.8 avg, masked frames only 53.8, mask-guided fusion 57.1,
      with the largest gains on inter-object (38.9 to 41.8) and
      camera-object (55.6 to 60.0).. Measured, but on a single backbone and
      a single benchmark the authors built; masks are annotation-quality, so
      the result does not isolate whether a pipeline with predicted masks
      would help. No cost or token-budget control reported.
contested: false
