id: multi-agent-pipelines-knowledge-intensive-qa-8b-backbone-deciding-collaboration-topology
ref: CLM-0691
capability: multi-model-coordination
technique: generate-agent-topology-after-retrieval-conditioned-evidence
statement: >-
  For multi-agent pipelines on knowledge-intensive QA with an 8B backbone,
  deciding the collaboration topology after retrieval and conditioning it on
  the retrieved evidence yields higher accuracy than generating the topology
  from query semantics alone with the same retrieved evidence available at
  execution.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen-3-8B agents and topology generator, top-3 evidence from a Wikipedia-derived provenance knowledge graph, topologies bounded to 6 nodes; gains concentrated on knowledge-intensiv"
sources:
  - source: arxiv-2608-27984
    stance: supports
    note: >-
      Validated by: Controlled GPQA comparison holding backbone and top-3
      retrieved evidence fixed with the verifier disabled: no topology
      39.22%, query-conditioned G-Designer 45.34%, evidence-conditioned
      50.00% (50.75% with the KG verifier); also 78.68% vs 70.02% average
      over seven benchmarks and over 50% fewer tokens than LLM-Debate on
      GPQA. Topology size grows from 2.02 to 2.66 nodes when retrieved
      evidence is conflicting or low-relevance (100 hand-labelled StrategyQA
      cases).. Measured on seven benchmarks with one backbone; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A controlled comparison on
  knowledge-intensive QA where, with backbone and retrieved passages held
  fixed, an evidence-conditioned topology generator performs no better than
  a query-conditioned one, or where the reported gap is reproduced by the
  extra training on execution-scored topologies rather than by conditioning
  on evidence.
