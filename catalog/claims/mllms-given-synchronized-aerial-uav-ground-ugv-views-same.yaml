id: mllms-given-synchronized-aerial-uav-ground-ugv-views-same
ref: CLM-0657
capability: embodied-control
statement: >-
  For MLLMs given synchronized aerial (UAV) and ground (UGV) views of the
  same scene, accuracy falls in a fixed order from scene perception to
  cross-view alignment to viewpoint-transformation reasoning to closed-loop
  navigation, with perception near human level and navigation far below it,
  so strong single-view perception does not indicate a view-consistent
  geometric representation.
kind: observation
backing_strength: single-paper
observed_on:
  era: "13 proprietary and open MLLMs, zero-shot, on 62k four-option dual-view VQA items and 115 closed-loop VLN episodes in 11 Unreal/AirSim outdoor environments"
sources:
  - source: arxiv-2606-28049
    stance: supports
    note: >-
      Measured: best average VQA accuracy is mid-50s against ~81% human,
      scene perception reaches 86-97% for most models, while best VLN
      success rate is 38.71% against 83.87% human. Dual-view input beats
      either single view for all five ablated models. All environments are
      simulated, all VQA is 4-way multiple choice, and the per-dimension
      ordering is read off aggregate accuracy rather than isolated by
      intervention, so the causal story that alignment errors propagate into
      navigation failure is argued, not demonstrated.
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model that scores at
  or near human level on cross-view alignment and viewpoint-transformation
  tasks while matching current perception scores, or one whose navigation
  success rate approaches its VQA accuracy, would break the stated ladder.
