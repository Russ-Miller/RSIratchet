statement: >-
  For current multimodal LLMs evaluated on hallucination benchmarks,
  semantics-preserving adversarial mutation of the image and prompt raises
  hallucination rates unevenly: object-level grounding stays relatively
  robust while instruction-level behaviours (refusing an unanswerable
  request, resisting authority-biased or misleading premises) degrade most,
  with refusal hallucination rates exceeding 0.9 under fuzzing.
