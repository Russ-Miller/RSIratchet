  - source: arxiv-2609-19156
    stance: supports
    note: >-
      Validated by: Pass@1 on AIME 2024/2025, LiveCodeBench, GPQA,
      OlympiadBench, Minerva against RFT at equal trajectory count (e.g. 7B
      AIME 2025 37.5 vs 34.7 RFT vs 30.0 base; Minerva 47.8 vs 46.7);
      scaling curves 2k-10k showing RFT dropping 35.3 to 30.0 on AIME 2025
      while the method keeps rising.. Measured on two model sizes and seven
      benchmarks against an RFT baseline matched on trajectory count; gains
      are a few points (2.8 on AIME 2025 at 7B) with only pass@1 reported
      and no seed variance or confidence intervals. [truncated]
