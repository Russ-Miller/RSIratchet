id: 7b-14b-distilled-reasoning-models-fine-tuned-fixed-pool-hard-math
ref: CLM-0537
capability: self-repair
technique: resample-correct-continuations-truncated-failed-traces
statement: >-
  For 7B-14B distilled reasoning models fine-tuned on a fixed pool of hard
  math problems, training on continuations resampled from truncated failed
  trajectories (with loss masked on the erroneous prefix) beats
  rejection-sampling fine-tuning on correct trajectories at matched data
  volume, and keeps improving from 2k to 10k examples where the
  positive-only baseline peaks and then declines.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "DeepSeek-R1-Distill-Qwen 7B/14B, 3k seed math problems, rule-based answer verifier, data volumes 2k-10k; truncation at half the failed chain worked better than three quarters."
