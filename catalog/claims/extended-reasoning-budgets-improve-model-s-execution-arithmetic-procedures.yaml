id: extended-reasoning-budgets-improve-model-s-execution-arithmetic-procedures
ref: CLM-0566
capability: arithmetic
technique: chain-of-thought
statement: >-
  Extended reasoning budgets improve a model's execution of arithmetic
  procedures on operands longer than those seen in training far more than
  they improve surface-form-to-value tasks like magnitude comparison and
  format conversion, because chain-of-thought supplies external working
  memory for carries and column alignment but cannot change how the input
  was tokenized.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Measured on Gemini 3 at MINIMAL vs HIGH thinking budget over Number Cookbook atomic tasks, temperature 0; in-domain procedural accuracy slightly declined under HIGH."
sources:
  - source: arxiv-2608-13129
    stance: supports
    note: >-
      Measured, but on one model family's two thinking settings across one
      atomic benchmark; the RG/PG split is the authors' own grouping of
      tasks, and no tokenizer was held fixed while reasoning varied, so the
      causal account is argued rather than isolated.
contested: false
