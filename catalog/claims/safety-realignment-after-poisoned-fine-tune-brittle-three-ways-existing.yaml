id: safety-realignment-after-poisoned-fine-tune-brittle-three-ways-existing
ref: CLM-0278
capability: fine-tuning-retention
technique: routed-on-policy-distillation-safety-task-teachers
statement: >-
  Safety realignment after a poisoned fine-tune is brittle in three ways:
  existing defenses (SSRD, RESTA, soft-SFT, rollback) often destroy the
  downstream skill they were meant to keep, lose more than 30% of their
  effect when the defender's prompt template differs from the attacker's,
  and a realigned model can be re-jailbroken by switching the system prompt;
  distilling on-policy from two frozen teachers, the original model for
  refusal and the fine-tuned model for the task, routed per token, cut
  attack success to about 2% under the defender's template while holding
  task score near pre-attack level.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Llama-2, Qwen2.5 and Gemma-2 bases, 2026; tasks SQL, SAMSum, NL2Bash; 700 BeaverTails harmful prompts judged by Qwen2.5-32B; residual risk remains when deployment and attacker temp"
sources:
  - source: arxiv-2607-27081
    stance: supports
    note: >-
      Validated by: Attack success rate and task score across three bases
      and three tasks under matched and mismatched attacker/defender
      templates against four realignment baselines; system-prompt
      re-jailbreak test.. Comprehensive template-mismatch design and honest
      reporting of residual cross-template risk; open models up to mid-size
      only; the harm judge is itself a model.
