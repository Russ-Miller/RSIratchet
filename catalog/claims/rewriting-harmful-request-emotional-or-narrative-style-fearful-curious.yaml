id: rewriting-harmful-request-emotional-or-narrative-style-fearful-curious
ref: CLM-0322
capability: jailbreak-robustness
technique: style-neutralization-before-safety-model-sees-prompt
statement: >-
  Rewriting a harmful request in an emotional or narrative style (fearful,
  curious, compassionate) while keeping its intent raises jailbreak success
  by up to 57 percentage points across 16 instruction-tuned models,
  contextual rewrites beating fixed templates, and the vulnerability does
  not shrink with model scale; a preprocessing step that has a second model
  strip stylistic cues cuts the success rate substantially.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three standard jailbreak datasets rewritten into 11 styles, 16 open and closed models, 2025; success judged automatically."
sources:
  - source: arxiv-2511-10519
    stance: supports
    note: >-
      Validated by: Jailbreak success rates with and without neutralization
      across the 16 models and 11 styles; utility cost of neutralization not
      reported in the excerpt read.. Large model set and a clear effect;
      'scaling-resistant' is the authors' reading of a cross-model
      comparison, not a controlled scaling study.
contested: false
