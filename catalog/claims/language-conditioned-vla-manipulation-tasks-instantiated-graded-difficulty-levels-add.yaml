id: language-conditioned-vla-manipulation-tasks-instantiated-graded-difficulty-levels-add
capability: embodied-control
statement: >-
  When language-conditioned VLA manipulation tasks are instantiated at
  graded difficulty levels that add spatial ambiguity (fine-grained spatial
  relations, precise placement) and procedural length (multi-stage plans
  requiring memory of completed steps), representative VLA models degrade on
  both axes, so success on predefined single-stage settings does not
  indicate spatial or long-horizon competence.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Representative VLA models evaluated on a simulated/collected manipulation benchmark with 10 task categories, 56 base tasks, 5 difficulty levels each, across multiple embodiments."
sources:
  - source: arxiv-2609-05324
    stance: supports
    note: >-
      Benchmark paper: 527K trajectories, 280 task variants, diagnostic
      metrics beyond binary success. The abstract reports qualitative
      failure directions (complex spatial relations, precise low-level
      execution, memory-intensive planning) without per-level numbers in the
      text given, and does not isolate which of perception, control, or
      memory causes the drop.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A VLA model that holds
  near-constant success rate across the five difficulty levels on these task
  families, with no drop on the spatial-ambiguity or memory-intensive
  planning categories. Proposed technique, not catalogued: Graded
  spatial-procedural difficulty benchmark for VLA models.
