id: models-must-apply-abstract-entity-independent-procedural-rules-drawn-shared
capability: procedure-following
statement: >-
  When models must apply abstract, entity-independent procedural rules drawn
  from a shared pool, accuracy is limited by locating the right rules rather
  than by applying them: giving only the gold rules yields much higher
  exact-match than embedding those same rules in a pool of 100 or 1,000, and
  accuracy falls as the pool grows.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Synthetic non-commonsense rules in first-order-logic and natural-language form, single-rule, parallel multi-rule and up to 4-hop QA; pools of 100 to 10,000 rules; tested on Qwen3-3"
sources:
  - source: arxiv-2608-22753
    stance: supports
    note: >-
      Gold-rule-only prompting reached 74.15-89.79% exact match for three
      strong models, while going from 100 to 1,000 rules lowered accuracy
      across models and both rule representations; retrieval tables show
      baseline Recall@1 collapsing at 10K rules. All rules are synthetic and
      deliberately non-commonsense, so the result isolates localization but
      may overstate mismatch relative to natural policy text. Multi-hop
      remains weak even with the paper's own method, so localization is not
      the only bottleneck.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Show models scoring no
  better with gold rules alone than with the same rules hidden in a
  1,000-rule pool, or show accuracy flat as the irrelevant-rule pool grows.
  Proposed technique, not catalogued: Step-triggered rule re-attention in
  the KV cache.
