id: 2b-instruction-tuned-multimodal-model-adapted-municipal-document-domain-green-stormwater
ref: CLM-0967
capability: domain-knowledge
technique: combine-domain-sft-retrieval-over-same-source-manuals
statement: >-
  For a 2B instruction-tuned multimodal model adapted to a
  municipal-document domain (green stormwater infrastructure), combining
  LoRA supervised fine-tuning on document-derived instruction pairs with
  retrieval over the same source manuals scores higher on domain QA than
  either component alone, while general-benchmark scores stay flat.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One 2B base model (Qwen3-VL-2B-Instruct), one domain, ~11k self-generated instruction examples drawn from the same municipal PDFs that form the retrieval corpus; general retention "
sources:
