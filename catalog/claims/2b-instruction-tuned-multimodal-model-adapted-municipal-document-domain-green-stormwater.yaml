    stance: supports
    note: >-
      Validated by: G-Eval on the domain set: RAG alone 0.51, fine-tuning
      alone 0.63, both 0.72; BLEU-4 on the domain set 0.090 (base) to 0.307,
      Sentence-BERT 0.544 to 0.742, with the general set at 0.304 vs 0.305
      BLEU-4. No human-expert numbers reported despite the metric being
      defined.. Measured on one model, one domain, one dataset the authors
      built themselves. The SFT targets and the evaluation references come
      from the same auto-generation pipeline over the same PDFs, so the
      large BLEU-4 and ROUGE jumps partly reflect learned output style
      rather than acquired knowledge; [truncated]
