id: vendor-specific-npu-kernel-dsls-ascendc-nearly-absent-pretraining-data
ref: CLM-1084
capability: code-generation
technique: train-dsl-chain-of-thought-then-rl-execution
statement: >-
  For vendor-specific NPU kernel DSLs (AscendC) that are nearly absent from
  pretraining data, general-purpose 7-8B LLMs produce essentially no working
  complex kernels zero-shot (compilation under 2% and 0% functional
  correctness on Level-2/3 tasks), while the same base model given domain
  chain-of-thought SFT plus execution-feedback RL reaches 95.5% Pass@10
  compilation and 64.3% functional correctness.
