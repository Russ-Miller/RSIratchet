    stance: supports
    note: >-
      Validated by: Compilation success and functional correctness on
      NPUKernelBench Level-1/2/3 tasks executed on Ascend hardware, against
      zero-shot general LLM baselines (0% functional correctness on complex
      kernels).. Measured on the authors' own benchmark with their own
      training data; baselines are only 7-8B open models (no frontier model
      zero-shot numbers given in the text), and the reported gain mixes
      Pass@10 for compilation against a zero-shot rate whose sampling budget
      is not stated. No ablation separating SFT from RL contribution is
      reported in this text.
