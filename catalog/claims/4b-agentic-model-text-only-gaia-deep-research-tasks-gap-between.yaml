notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A 4B agent whose pass@64 on
  GAIA text-only is close to its pass@1 (e.g. both near 60%), or one where
  RL raises pass@1 to near the pass@64 ceiling, would show the gap is a
  capability limit rather than a selection-variance limit.
