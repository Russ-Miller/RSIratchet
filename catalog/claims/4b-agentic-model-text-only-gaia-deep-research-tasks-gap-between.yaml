id: 4b-agentic-model-text-only-gaia-deep-research-tasks-gap-between
ref: CLM-0982
capability: long-horizon-execution
technique: map-pass-k-curves-separate-capability-inference-variance
statement: >-
  For a 4B agentic model on text-only GAIA deep-research tasks, the gap
  between single-shot and repeated-sampling success is far larger than the
  gap to larger models: the SFT checkpoint solves 97.09% of tasks at pass@64
  while pass@1 sits near 60-64%, so at this scale the limiting factor is
  selecting the right trajectory rather than possessing one.
kind: observation
backing_strength: single-paper
observed_on:
  era: "4B Qwen3-Thinking-based deep-research agent with search and page-reading tools, evaluated on the text-only GAIA subset; pass@K measured by repeated independent rollouts."
sources:
  - source: arxiv-2602-06485
    stance: supports
    note: >-
      Validated by: Pass@K curves on GAIA text-only across base, SFT, merged
      and RL checkpoints; RL shifted the pass@64 performance level down to
      pass@32 but moved pass@1 much less, which is the evidence offered for
      the variance interpretation.. Measured on one benchmark subset with
      one base model and one training pipeline; the 97.09% figure is a
      single reported pass@64 number with no confidence interval and no
      check that the 64 samples are not inflated by lucky tool returns or by
      GAIA's answer-matching being lenient. [truncated]
