    note: >-
      Validated by: Success rate on ALFWorld, ScienceWorld (plus dense
      reward) and GAIA against ReAct, Reflexion, LATS, Self-Refine and
      GA-Rollback under matched budgets: average SR 47.00 vs 43.91 best
      baseline (Qwen3-14B) and 69.43 vs 62.86 (DeepSeek-V3); ablations give
      76.75 SR vs 70.48 reflection-only and 69.37 rollback-only on
      ScienceWorld, with 0.92 rollbacks per task vs 2.9 for GA-Rollback..
      Measured on three benchmarks with two backbones and component
      ablations that isolate rollback from reflection; [truncated]
