id: long-horizon-llm-agents-environments-where-erroneous-action-changes-world
ref: CLM-0365
capability: long-horizon-execution
technique: roll-back-environment-keep-distilled-reflection
statement: >-
  For long-horizon LLM agents in environments where an erroneous action
  changes world state, restoring an earlier checkpoint and carrying forward
  a structured reflection memory that excludes branch-local state claims
  beats either intervention alone, because reflection alone cannot undo
  environmental damage and rollback alone re-explores the same failure.
