id: code-generation-prompt-combines-prompt-enforced-output-format-json-or-xml
ref: CLM-0031
capability: code-generation
statement: >-
  When a code-generation prompt combines a prompt-enforced output format
  (JSON or XML), a persona, and urgency framing at once, pass@1 on
  function-level Python problems can fall well below the sum of each
  constraint's individual effect, even when each constraint alone is neutral
  or helpful — observed in the GPT-4o family and absent in the GPT-4.1
  family and o3-mini.
kind: observation
backing_strength: single-paper
observed_on:
  era: "164 HumanEval+ problems, greedy decoding, five OpenAI models; format enforced by prompt instruction rather than API-level constrained decoding; prompt length confounded with constr"
sources:
  - source: arxiv-2609-03156
    stance: supports
    note: >-
      22,140 evaluations across 27 conditions and 5 models; interaction
      computed as residual against an additive main-effect prediction, with
      McNemar paired tests (e.g., OR 3.67, p=0.004 for best single vs worst
      triple on GPT-4o-mini). Single benchmark, single vendor, one sample
      per condition; token-length confound acknowledged by the authors and
      not isolated.
contested: false
status: pending-review
last_checked_at: 2026-09-09
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A factorial replication
  on other models and benchmarks where triple-constraint pass@1 matches the
  additive prediction within noise, or where the GPT-4o-family gaps vanish
  once prompt-token length is held constant. Proposed technique, not
  catalogued: Factorial compound-prompt reliability testing.
