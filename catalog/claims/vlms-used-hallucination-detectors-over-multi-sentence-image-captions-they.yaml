id: vlms-used-hallucination-detectors-over-multi-sentence-image-captions-they
ref: CLM-1030
capability: hallucination
statement: >-
  When VLMs are used as hallucination detectors over multi-sentence image
  captions, they are biased toward judging sentences near the start of the
  response as correct regardless of actual correctness, so detection recall
  is position-dependent within a caption.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Measured on captions generated by diverse VLMs with human segment-level hallucination annotations; detectors are themselves VLMs scoring caption segments."
sources:
  - source: arxiv-2603-15253
    stance: supports
    note: >-
      Argued from analysis of a new benchmark with segment-level human
      labels across multiple caption-generating VLMs; the source text states
      the positional finding but gives no numbers, no per-position
      accuracies, and no control for sentences at the start being genuinely
      more often correct (early sentences often describe salient, easily
      grounded content), so the design does not isolate position from
      content difficulty.
contested: false
status: pending-review
last_checked_at: 2026-11-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Shuffling or reordering
  caption sentences before detection leaves per-sentence detection accuracy
  unchanged, or detection accuracy is found independent of sentence position
  under segment-level human labels.
