      VLA (RT-2), DreamerV3, MAPPO and QMIX; ablation over instruction
      source (VLM-generated 11.1, template 9.9, clustered 8.9, random
      strings 8.3, none 8.2, environment-derived 11.4 on Minecraft Diamond);
