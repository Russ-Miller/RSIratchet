ref: CLM-0373
capability: embodied-control
technique: train-world-model-controller-vlm-relabelled-rollouts-then
statement: >-
  In embodied environments with high-frequency action spaces (Atari,
  Minecraft, Crafter, DMLab, Overcooked, Pico Park, MindCraft), pairing a
  frozen instruction-tuned VLM that emits sparse text instructions with a
  small world-model controller trained to follow them scores higher than
  either the same VLM emitting low-level actions directly or the same
  controller running without instructions, and the gain depends on the
  instructions carrying semantic content — random-string instructions score
  no better than no instructions at all.
