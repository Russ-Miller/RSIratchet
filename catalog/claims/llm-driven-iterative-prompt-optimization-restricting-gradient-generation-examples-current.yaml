id: llm-driven-iterative-prompt-optimization-restricting-gradient-generation-examples-current
ref: CLM-0368
capability: harness-self-improvement
technique: generate-prompt-edits-only-failures-gate-preservation-set
statement: >-
  In LLM-driven iterative prompt optimization, restricting gradient
  generation to examples the current prompt gets wrong and accepting a
  candidate edit only when its gain on hard cases exceeds a penalized
  regression on a preservation set of initially-correct examples yields
  higher final accuracy than unfiltered textual-gradient optimization, which
  degrades on some reasoning tasks below the zero-shot prompt.
