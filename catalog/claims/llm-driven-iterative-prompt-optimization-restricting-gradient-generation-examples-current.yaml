    note: >-
      Validated by: Accuracy on 10 reasoning benchmarks across three
      evaluator/optimizer models against Zero-shot CoT, Three-shot CoT,
      TextGrad and REVOLVE (average ~3.5 points over REVOLVE), plus a
      modernized run with gpt-5.4-mini/gpt-5.4 on BBEH, GSM8K-Platinum and
      DS-1000; ablations remove the gate (lower) and swap in full-dataset or
      correct-only gradients (lower, correct-only falls below the initial
      prompt).. Measured on 10 benchmarks x 3 optimizer models plus 4
