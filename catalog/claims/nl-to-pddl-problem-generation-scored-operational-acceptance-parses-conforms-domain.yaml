id: nl-to-pddl-problem-generation-scored-operational-acceptance-parses-conforms-domain
ref: CLM-0447
capability: evaluation-validity
technique: report-operational-acceptance-reference-reconstruction-separately
statement: >-
  When NL-to-PDDL problem generation is scored by operational acceptance
  (parses, conforms to domain, a planner finds a plan, VAL validates it, an
  LLM critic accepts), the score overstates faithfulness to the described
  task, and the gap widens for PDDL 2.1 temporal and numeric problems where
  operationally accepted instances can almost never reconstruct the curated
  reference encoding.
