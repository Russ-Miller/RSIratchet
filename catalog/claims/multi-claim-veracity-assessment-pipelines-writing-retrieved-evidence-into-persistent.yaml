id: multi-claim-veracity-assessment-pipelines-writing-retrieved-evidence-into-persistent
ref: CLM-1105
capability: fact-verification
technique: carry-entity-keyed-evidence-memory-across-claims
statement: >-
  In multi-claim veracity assessment pipelines, writing retrieved evidence
  into a persistent entity-keyed memory that is recalled for later related
  claims cuts external search calls roughly in half and raises macro-F1 by a
  few points, with the efficiency gain largest where claims share entities
  and the accuracy gain not tracking the efficiency gain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Five fact-checking/claim-verification datasets processed as a sequence of claims; GPT-5-mini backbone for the memory ablation; gains depend on topical overlap across claims."
sources:
  - source: arxiv-2601-22361
    stance: supports
    note: >-
      Validated by: With vs without memory on five benchmarks with
      GPT-5-mini: total tool calls 1,840 to 948 (-48.5%, per-dataset -26.0%
      to -76.1%) and Macro-F1 up on all five (+0.02 to +0.06); memory built
      by GPT-5-mini also lifted LLaMA-3.1-8B from 0.54 to 0.65 and OSS-20B
      from 0.67 to 0.71 on FactCheck-Bench.. Measured, single paper, one
      backbone for the key ablation; datasets are 100-example stratified
      samples for the natural-claim sets. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A controlled run where
  carrying evidence memory across a claim stream leaves retrieval call
  counts unchanged, or lowers macro-F1, on datasets with substantial
  cross-claim entity overlap.
