id: knowledge-editing-methods-such-rome-fine-tuning-insert-stated-fact-reliably
ref: CLM-0308
capability: knowledge-updating
statement: >-
  Knowledge-editing methods such as ROME and fine-tuning insert a stated
  fact reliably but do not carry its logical consequences: on multi-hop
  questions generated from knowledge-graph rules that the edit entails,
  accuracy is up to 24 points lower than on the directly edited fact, so an
  edited model can assert a new fact and still answer as if its implications
  never changed.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Rule-derived multi-hop questions from a knowledge graph around each edit, ROME and FT among others, 2026; open models."
sources:
  - source: arxiv-2606-10554
    stance: supports
    note: >-
      Consistent with the older ripple-effect literature; the rule-based
      construction makes the entailments precise. Methods tested are classic
      locate-and-edit and FT, not retrieval-based editing.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An editing method whose
  entailed-fact accuracy matches direct-fact accuracy on this benchmark.
