id: agent-harness-mines-reusable-rules-tools-own-labelled-diagnosis
ref: CLM-0532
capability: harness-self-improvement
technique: gate-harness-edits-both-source-cases-resampled-held
statement: >-
  When an agent harness mines reusable rules and tools from its own labelled
  diagnosis trajectories, promoting every proposal that helps the cases it
  was mined from makes the harness worse over time than not evolving at all,
  and only admitting a proposal when it also fails to regress on a freshly
  resampled held-out case set keeps accuracy climbing across successive
  evolution rounds.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Root cause analysis over microservice telemetry, general coding agents (Codex, Claude Code) with four backbones, 12 continuous-diagnosis windows over two public benchmarks; effect "
sources:
  - source: arxiv-2608-25661
    stance: supports
    note: >-
      Validated by: Per-window top-1 accuracy over 12 continuous-diagnosis
      windows on OpenRCA and RCAEval across four backbones: full system
      final-window A@1 0.83 vs 0.43 for the non-evolving harness and 0.33
      for the ungated variant (0.4 to 0.0 collapse on DeepSeek-V4); 37% of
      proposals rejected by the gate.. Measured ablation with three variants
      across four backbones and two benchmarks, with per-window curves
      rather than a single endpoint. [truncated]
