id: medical-visual-question-answering-4-8b-multimodal-models-detecting-hallucination
ref: CLM-1023
capability: hallucination
technique: verify-re-querying-answer-s-entity-back-question
statement: >-
  For medical visual question answering with 4-8B multimodal models,
  detecting hallucination by generating an inverted verification question
  (conditioned on the answer's semantic unit, re-querying the question's
  semantic unit) and checking the model's answer under reused primary visual
  attention separates hallucinated from grounded answers better than
  token-probability and sampling-based uncertainty scores, but the advantage
  holds mainly on open-ended items and shrinks on closed-ended ones where no
  inversion exists.
