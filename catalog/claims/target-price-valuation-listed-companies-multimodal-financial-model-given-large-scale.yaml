id: target-price-valuation-listed-companies-multimodal-financial-model-given-large-scale
ref: CLM-0679
capability: domain-knowledge
technique: two-stage-financial-domain-adaptation-corpus-pre-train
statement: >-
  For target-price valuation of listed companies, a multimodal financial
  model given large-scale financial-corpus pre-training followed by
  institution-specific fine-tuning has lower mean absolute valuation error
  than a general model prompted zero-shot, a single-stage fine-tuned
  financial LLM, and an analyst-parameterized DCF spreadsheet.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target price compared against independent analyst consensus; baselines are GPT-4 zero-shot, FinGPT single-stage fine-tuning, and an analyst-input DCF spreadsh"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Measured on one 200-company panel with analyst consensus as ground
      truth, no confidence intervals or seeds reported, and the pre-training
      corpus differs from the baselines' corpora, so the design does not
      isolate staging from data volume. Consensus price targets are a proxy,
      not realized value.
