id: one-shot-no-communication-self-play-where-independent-copies-same-llm-told
ref: CLM-0609
capability: multi-model-coordination
statement: >-
  In one-shot, no-communication self-play where independent copies of the
  same LLM are told their counterparts run the same model, models exceed the
  Nash baseline mainly in games whose optimal joint play requires matching
  actions (coordination, stag hunt, public goods) and fall below it in games
  requiring symmetry-breaking (anti-coordination, battle of the sexes), with
  several open-weight models scoring near the worst joint cell.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "One-shot matrix games, two players, no communication or shared memory, action labels rotated; 13 models from 1B-14B open-weight plus two hosted frontier models."
sources:
  - source: arxiv-2608-12547
    stance: supports
    note: >-
      Measured across ~53,000 game instances, 7 scored two-player archetypes
      at k=2-10, 12-30 trials each, scored against computed pure and mixed
      Nash equilibria with label rotation controlling position bias. Hosted
      models differ from open-weight in backend and trial count, so
      capability and provider effects are not separated; the
      matching-vs-differentiating explanation is argued from the score
      pattern, not tested by an intervention.
contested: false
status: pending-review
last_checked_at: 2026-10-23
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model that scores
  above Nash on anti-coordination and battle-of-the-sexes at rates
  comparable to its coordination/stag-hunt scores under the same
  no-communication one-shot protocol.
