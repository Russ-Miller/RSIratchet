id: deciding-robot-skill-has-finished-next-subtask-should-begin
ref: CLM-0363
capability: embodied-control
technique: distill-stage-transition-monitoring-via-student-self-explanations
statement: >-
  For deciding when a robot skill has finished and the next subtask should
  begin, general-purpose VLMs prompted zero-shot are near useless on
  long-horizon mobile manipulation (under 4% of transitions detected on
  BEHAVIOR-1K, including a frontier proprietary model), while a sub-1B
  student fine-tuned on compact self-explanations condensed from teacher
  reasoning over annotated demonstrations detects about 90% and lifts
  closed-loop task success from 0.30 to 0.53 against a 0.63 oracle.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Hierarchical robot control with a PDDL planner and learned low-level policies; LIBERO-Logic and six BEHAVIOR-1K tasks, 10 training trajectories per task; ground-truth subtask segme"
