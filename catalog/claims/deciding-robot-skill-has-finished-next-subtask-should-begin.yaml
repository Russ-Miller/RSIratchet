    stance: supports
    note: >-
      Validated by: Transition completion, full-trajectory rate,
      next-subtask accuracy and inference Hz against five prompted VLM
      baselines and two ROVER variants on LIBERO and BEHAVIOR-1K; ablations
      against full-teacher-CoT training (0% on BEHAVIOR-1K) and
      decision-only labels (37.7%); closed-loop success on BEHAVIOR-1K and
      20 trials on each of two real arms.. [truncated]
