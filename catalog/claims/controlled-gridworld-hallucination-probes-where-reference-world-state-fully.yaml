id: controlled-gridworld-hallucination-probes-where-reference-world-state-fully
ref: CLM-0812
capability: hallucination
statement: >-
  In controlled gridworld hallucination probes where the reference world
  state is fully specified, turning on extended thinking in the same model
  family slightly lowers hallucination on perceptual read-out of directly
  observed values while raising it on causal forward-simulation probes.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Claude Sonnet 4.6 and Opus 4.6 thinking vs non-thinking variants on HalluWorld-Grid probes; terminal domain showed a mixed, non-monotonic pattern instead."
sources:
  - source: arxiv-2605-19341
    stance: supports
    note: >-
      Measured hallucination rates by probe category across 33 gridworld
      levels and 839 probes; the thinking effect is reported for two Claude
      variants only (P 2.8->1.1 and 3.7->1.7; C 19.7->24.0 and 20.1->25.2),
      with no controlled token budget between thinking and non-thinking
      elsewhere in the paper, and the mechanism (extra reasoning
      confabulating intermediate states) is hypothesised rather than tested.
contested: false
status: pending-review
last_checked_at: 2026-11-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "chain-of-thought", which does not list this
  capability in addresses -- recorded, not asserted. Drafted confidence:
  low. Falsifier as drafted: A within-family thinking/non-thinking
  comparison on the same probes showing causal hallucination falling or flat
  with extended thinking across several model families. Drafted stance
  toward
  adversarially-edited-image-tasks-chain-of-thought-prompting-moves-multimodal-models:
  supports -- Both find extra reasoning moves hallucination in opposite
  directions depending on whether the probe is a direct read-out or requires
  simulation/perception-heavy inference.
