id: rl-reward-llm-reasoning-learned-reward-model-rather-than
ref: CLM-1046
capability: reward-hacking
statement: >-
  When an RL reward for LLM reasoning is a learned reward model rather than
  a verifiable rule-based signal, the policy visits increasingly distant
  regions of a combinatorially large, deterministic-transition state space
  during optimization, forcing the reward model to extrapolate beyond its
  training distribution and making its scores exploitable under minor
  surface reformulations.
kind: mechanism
backing_strength: mechanism-reasoning
observed_on:
  era: "RL fine-tuning of LLMs on multi-step reasoning where the reward comes from a parameterized model trained on a finite preference or correctness dataset; does not apply to verifiable"
sources:
  - source: arxiv-2602-09305
    stance: supports
    note: >-
      Argued, not measured: the survey derives the extrapolation argument
      from the deterministic-transition MDP formulation and cites prior work
      on reward-model overoptimization and score sensitivity to surface
      reformulations. No new experiment; the trade-off table contrasting
      model-based (medium hacking risk) against rule-based (low) is a
      synthesis of cited literature rather than a controlled comparison.
