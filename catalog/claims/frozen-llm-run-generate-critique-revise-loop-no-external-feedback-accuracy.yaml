notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A setup where an
  ungrounded self-critique loop raises accuracy by a margin outside the
  confidence interval on a task the model already answers correctly most of
  the time, or fails to gain on a task where single-shot accuracy is low.
  Drafted stance toward self-critique-without-grounding-unreliable: supports
  -- Ungrounded self-critique left clean-task accuracy flat and fixed-depth
  refinement actually lowered it (71.2% vs 73.8% single-shot on BBH),
  consistent with over-correction of correct answers.
