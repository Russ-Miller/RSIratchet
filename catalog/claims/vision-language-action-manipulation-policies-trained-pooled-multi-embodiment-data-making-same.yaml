id: vision-language-action-manipulation-policies-trained-pooled-multi-embodiment-data-making-same
ref: CLM-0762
capability: embodied-control
technique: align-motions-numerically-before-scaling-embodiment-data
statement: >-
  For vision-language-action manipulation policies trained on pooled
  multi-embodiment data, making the same physical motion numerically
  consistent across sources — a canonical state-action vector with
  per-dimension masking for absent degrees of freedom, end-effector actions
  expressed as camera-frame deltas, and camera geometry injected into the
  action head's attention — is what lets added data from other embodiments
  help rather than interfere.
