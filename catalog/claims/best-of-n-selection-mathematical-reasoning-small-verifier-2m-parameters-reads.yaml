notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A capacity-matched
  text-only verifier reading the same candidate solutions matching or
  beating the hidden-state verifier on best-of-N accuracy and within-problem
  AUROC across generators, or the hidden-state advantage disappearing once
  the text verifier is given the same training pool. Drafted stance toward
  reward-related-information-reasoning-model-s-hidden-states-concentrated-sparse:
  supports -- Both find that a reasoning model's hidden states carry
  correctness signal usable as a reward model for inference-time selection.
