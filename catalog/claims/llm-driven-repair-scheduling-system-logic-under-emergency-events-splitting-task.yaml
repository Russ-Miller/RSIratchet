id: llm-driven-repair-scheduling-system-logic-under-emergency-events-splitting-task
ref: CLM-1180
capability: multi-model-coordination
technique: localize-affected-modules-then-edit-only-those
statement: >-
  For LLM-driven repair of scheduling-system logic under emergency events,
  splitting the task into a perception agent that localizes which decoupled
  atomic functions the event affects and a decision agent that edits only
  those functions raises repair success rates for 7-9B local models far
  above the same models reasoning over the whole system context, and the
  localized pipeline also beats much larger cloud models on the most tightly
  constrained scenario.
kind: mechanism
