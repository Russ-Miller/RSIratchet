id: llm-generation-fpga-high-level-synthesis-code-natural-language-specifications-passing-c-simulation
ref: CLM-0422
capability: code-generation
technique: validate-hls-code-end-to-end-board-synthesis
statement: >-
  In LLM generation of FPGA high-level-synthesis code from natural-language
  specifications, passing C-simulation and synthesis does not imply the
  design builds into a board executable or produces correct outputs on
  hardware, because aggressive pipelining/unrolling and HLS memory inference
  cause timing-closure, routing, and simulation-vs-hardware mismatches that
  front-end checks never exercise.
