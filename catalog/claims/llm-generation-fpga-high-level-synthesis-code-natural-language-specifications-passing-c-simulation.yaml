    stance: supports
    note: >-
      Validated by: Against zero-shot pass@10 on 78 HLS-Eval tasks:
      synthesizable rate +16.9 points on average, executable rate +26.7,
      functional correctness +30.6 (best 92.3% with Gemini 3.1 Pro).
      Ablation on Qwen3-Coder-30B shows the evolutionary module mainly lifts
      synthesizability/executability and the functional-reflection module
      mainly lifts correctness; full system solves 52 of 78 vs 29 for the
      base.. Measured on one benchmark (78 filtered HLS-Eval tasks), one
