id: llm-driven-heuristic-discovery-combinatorial-optimization-tasks-tsp-cvrp-bi-objective
ref: CLM-0207
capability: self-repair
technique: self-harness-loop
statement: >-
  For LLM-driven heuristic discovery on combinatorial optimization tasks
  (TSP, CVRP, bi-objective and multi-component variants), letting an agent
  decide when to read, edit, diagnose and evaluate code while persisting
  each evaluation outcome as a retrievable experience card reaches better
  final heuristic quality than fixed evolutionary pipelines (EoH, ReEvo,
  FunSearch, MCTS-AHD, MEoH, MOTIF) at a fraction of their evaluation
  budget, and re-running the same task warm-started from the previous run's
  best code improves further round after round under a fixed budget.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six optimization heuristic-design tasks, 500-evaluation budget, three seeds, gpt-4o-mini and DeepSeek-V4-Flash; transfer gains reported to weaken outside aligned problem families, "
sources:
  - source: arxiv-2609-15820
    stance: supports
    note: >-
      Six tasks, three seeds, unified platform and instance splits;
      baselines run to the full 500 evaluations while AlgoEvo commits after
      ~27-275. Ablations separate cold vs warm start and rounds 0-4, and one
      cross-task transfer table. No matched-token-compute baseline, and the
      agentic loop plus skill hub plus experience bank are not fully
      separated from each other.
