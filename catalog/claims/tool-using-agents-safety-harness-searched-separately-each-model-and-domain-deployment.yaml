notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A single fixed
  expert-designed harness matching or beating per-cell searched harnesses on
  the same score (utility minus ASR) across the same model x domain grid, or
  the searched harnesses transferring no better than fixed ones to unseen
  suites. Drafted stance toward
  tool-using-agents-restricting-capabilities-harness-level-after-untrusted-content:
  supports -- Both find that harness-level enforcement keyed to action
  effects and provenance, rather than content wording, is what cuts
  indirect-injection success. Proposed technique, not catalogued:
  Per-deployment evolved safety harness.
