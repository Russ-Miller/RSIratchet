id: panels-heterogeneous-llm-judges-mistral-large-claude-haiku-sonnet
ref: CLM-1225
capability: critique
technique: judge-collaborative-panel-consensus-early-exit
statement: >-
  For panels of heterogeneous LLM judges (Mistral Large, Claude
  Haiku/Sonnet, Llama 3 70B) scoring summaries on rubric dimensions or
  picking the better of two chat responses, pooling independent judgments
  and discussing to consensus beats the single-judge baseline by only a
  couple of points, nearly all of the gain arrives by the first discussion
  round (relevance 49.4% at 1 round, 49.5% at 2, 48.5% at 3), and the panel
  does not beat every single judge on every dimension (a single Mistral
  judge scored 55.9% on consistency versus the panel's 48.2%).
kind: observation
backing_strength: single-paper
