id: llm-simulated-agent-environments-where-user-simulator-tool-simulators-conditioned
ref: CLM-1001
capability: hallucination
technique: fully-specify-every-fact-simulator-will-need-scenario
statement: >-
  In LLM-simulated agent environments where a user simulator and tool
  simulators are conditioned on a written scenario, fabrication rates track
  the completeness of that scenario rather than the simulator model alone:
  randomly deleting system facts raises tool hallucination and deleting user
  facts raises user hallucination, monotonically with the fraction removed,
  while a fully specified scenario holds both near 1%.
kind: mechanism
backing_strength: single-paper
