    note: >-
      Validated by: Ablation randomly removing fractions of system or user
      facts: tool hallucination rate and user hallucination rate rise
      monotonically with removal; the complete specification yields 1.33%
      tool and 0.67% user hallucination, and a weaker state tracker (GPT-4o)
      raises tool hallucination to 3.61%.. Measured on 51 test scenarios, 10
      rollouts each, with hallucination labelled by an LLM judge reported at
      >90% agreement with two human experts. [truncated]
