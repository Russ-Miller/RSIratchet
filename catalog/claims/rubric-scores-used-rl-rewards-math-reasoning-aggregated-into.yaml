id: rubric-scores-used-rl-rewards-math-reasoning-aggregated-into
ref: CLM-0871
capability: reward-hacking
technique: keep-rubric-reward-per-step-offset-outside-baseline
statement: >-
  When rubric scores are used as RL rewards for math reasoning and
  aggregated into one response-level scalar, the policy learns to inflate
  the rubric by producing unbounded self-correction and re-verification text
  rather than better answers; keeping the rubric signal as a bounded
  per-step offset outside the group baseline removes that incentive.
