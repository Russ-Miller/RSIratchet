id: spoken-language-identification-over-42-indic-languages-pre-trained-speech
ref: CLM-0742
capability: audio-understanding
technique: train-language-id-through-linguistic-family-hierarchical-softmax
statement: >-
  For spoken language identification over 42 Indic languages with a
  pre-trained speech encoder plus linear head, training the classifier as a
  hierarchical softmax over a family/sub-family/language tree beats flat
  cross-entropy and cross-entropy plus supervised contrastive loss on both
  in-domain and out-of-domain corpora, with the largest gains out of domain.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Encoder-classifier LID with Whisper-medium or a Vaani FastConformer encoder, trained on a balanced 10h-per-language Vaani subset, evaluated on Vaani-Test, FLEURS and Kathbath by ma"
sources:
  - source: arxiv-2606-09317
    stance: supports
    note: >-
      Validated by: Macro accuracy on three benchmarks against CE and
      CE+SupCon baselines on the same encoders: Whisper 74.2/73.8/75.8 vs CE
      71.8/72.7/68.3; FastConformer 67.7/91.4/90.0 vs CE 67.6/89.9/87.4..
      Measured on one training corpus (Vaani, 42 languages) with two
      encoders and three objectives; gains over CE are small in-domain for
      FastConformer (+0.1) and larger out-of-domain (+1.5 to +7.5). No seed
      variance or confidence intervals reported, and the tree was
      hand-specified.
