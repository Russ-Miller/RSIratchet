id: 430-tasks-distilled-real-professional-forum-threads-across-seven-domains
ref: CLM-0285
capability: domain-knowledge
statement: >-
  On 430 tasks distilled from real professional-forum threads across seven
  domains, the best model (GPT-5) scores about 54%, under the 60% passing
  line the authors set, with computer science and applied technology lowest
  at roughly 40-45%, so long-tail practitioner knowledge remains a gap even
  where standard benchmarks are saturated.
