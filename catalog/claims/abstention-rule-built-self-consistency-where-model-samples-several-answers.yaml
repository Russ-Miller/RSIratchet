id: abstention-rule-built-self-consistency-where-model-samples-several-answers
ref: CLM-0260
capability: abstention-and-self-knowledge
technique: conformal-abstention-self-consistency
statement: >-
  An abstention rule built from self-consistency, where the model samples
  several answers and itself scores how many agree with a candidate, can be
  thresholded by conformal prediction to bound the hallucination rate at a
  chosen level on closed-book QA; against log-probability confidence it
  abstains much less often on long-form answers (Temporal Sequences) for the
  same error bound and matches it on short answers (TriviaQA).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Closed-book, open-domain generative QA (TriviaQA, Temporal Sequences), 2024, with a held-out labelled calibration set; guarantee is on expected error under exchangeability."
sources:
  - source: arxiv-2405-01563
    stance: supports
    note: >-
      Validated by: Hallucination rate versus abstention rate curves on
      TriviaQA and Temporal Sequences against log-probability and prior
      self-consistency baselines; error bound verified empirically against
      manual labels on a 100-item calibration set.. Two datasets and one
      model family in the main results; the guarantee is statistical and
      holds only when the calibration set is drawn from the same
      distribution as use. Cost is k samples plus k self-evaluations per
      query.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Tasks where sampled
  answers agree confidently on a wrong answer (consistent hallucination),
  which would break the confidence score, or distribution shift between
  calibration and test that voids the bound in practice.
