id: large-audio-language-models-given-spoken-harmful-requests-jailbreak
ref: CLM-0646
capability: jailbreak-robustness
technique: insert-phonologically-plausible-pseudo-words-around-safety-critical
statement: >-
  For large audio language models given spoken harmful requests, jailbreak
  success rises in a consistent order — non-English/non-English
  code-switched speech above English/non-English code-switched above
  monolingual (mean JSR 20.9% vs 17.0% vs 16.4% over nine models and five
  European languages) — and this is not attributable to multilingual
  misunderstanding, since models with near-ceiling spoken ASR, SLU and
  reasoning scores (e.g. Voxtral at 72.9% Speech-MGSM) are among the most
  jailbroken (48.3% mean JSR).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine open and proprietary LALMs; clean TTS-synthesized speech (XTTS) from translated JailbreakBench prompts in English, German, Spanish, French, Italian plus ten code-switched pair"
sources:
  - source: arxiv-2606-06037
    stance: supports
    note: >-
      Validated by: Mean jailbreak success rose monotonically from 18.4% (no
      insertion) to 20.3/22.5/24.6% at 10/30/50% insertion across nine
      models and 15 language settings (Friedman chi2(3)=12.07, p=0.007),
      while models attributed harmful meaning to the inserted tokens in only
      3.7-16.8% of cases.. Measured: nine LALMs, 100 harmful plus 100
      matched benign JailbreakBench prompts, 5 languages and 10
      code-switched pairs, judged by GPT-4.1 with human validation (85%
      agreement, kappa 0.775; Refusal/Jailbroken confusion only 0.6%).
