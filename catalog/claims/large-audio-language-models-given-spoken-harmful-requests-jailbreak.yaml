notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication across
  these or newer LALMs in which monolingual non-English or code-switched
  speech yields jailbreak rates no higher than English monolingual speech,
  or in which the elevated jailbreak rate disappears once spoken
  comprehension (ASR/SLU/reasoning) is controlled for. Drafted stance toward
  across-ten-languages-six-models-harmbench-advbench-unsafe-response-rates:
  supports -- It extends the finding that safety measured in English does
  not transfer to other languages into the spoken and code-switched setting,
  with the worst case being pairs containing no English at all.
