id: llm-driven-multi-uav-swarm-tasks-simulation-binding-one-agent-each
ref: CLM-0338
capability: embodied-control
technique: role-conditioned-skill-subsets-body-local-swarm-agents
statement: >-
  For LLM-driven multi-UAV swarm tasks in simulation, binding one agent to
  each vehicle with a role-conditioned subset of the skill catalog and
  directed peer messages yields higher episode returns than a central
  planner that sees pooled team state and the full catalog, and the two
  largest contributors are the skill-subset restriction and the peer
  coordination reports rather than the reward-based skill-score correction.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine MPE-inspired tasks in an AirSim runtime, 22 predefined skills, 10 episodes per task-condition pair, DeepSeek V4-flash backbone; no physical hardware."
sources:
  - source: arxiv-2609-18520
    stance: supports
    note: >-
      Validated by: Mean episode return over 10 episodes on nine simulated
      tasks against a centralized planner and HMAS-2, plus three component
      ablations (no activation, no coordination reports, beta=0) and
      per-episode token counts.. Measured in simulation only, single
      backbone for the main table, 10 episodes per cell with small reported
      SDs; ablation scores are affine-normalized relative to the full
      system, so absolute effect sizes are hard to read. No statistical
      tests; authors are also the harness designers and baselines are
      in-house or adapted.
contested: false
status: pending-review
last_checked_at: 2026-09-21
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A replication where the
  centralized full-catalog planner matches or beats role-subset body-local
  agents on the same tasks and rewards, or where removing skill activation
  and coordination reports costs less return than removing the reward
  correction.
