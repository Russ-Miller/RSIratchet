id: llm-driven-multi-uav-swarm-tasks-simulation-binding-one-agent-each
ref: CLM-0363
capability: embodied-control
technique: role-conditioned-per-vehicle-skill-subsets-peer-messaging
statement: >-
  For LLM-driven multi-UAV swarm tasks in simulation, binding one agent to
  each vehicle with a role-conditioned subset of the skill catalog and
  directed peer messages yields higher episode returns than a central
  planner that sees pooled team state and the full skill list, and ablations
  attribute most of the gain to the skill-subset restriction and the peer
  reports rather than to the experience-based reward correction.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine MPE-inspired AirSim tasks, fixed 22-skill catalog, DeepSeek-V4-Flash backbone, 10 episodes per task-condition pair; simulation only, no physical UAVs."
sources:
  - source: arxiv-2609-18520
    stance: supports
    note: >-
      Validated by: Mean undiscounted episode return over 10 episodes on
      nine tasks against a centralized planner and HMAS-2, plus
      per-component ablations (no activation, no coordination reports,
      reward weight zero) and per-episode token counts.. Measured on nine
      simulated tasks, 10 episodes each, with two baselines and three
      ablations; returns reported as means with small SDs but no
      significance tests, and the ablation scores come from an affine
      rescaling the paper defines itself. Single paper, single lab, one main
      backbone; no physical execution.
contested: false
