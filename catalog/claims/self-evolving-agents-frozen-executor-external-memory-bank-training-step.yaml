id: self-evolving-agents-frozen-executor-external-memory-bank-training-step
ref: CLM-1064
capability: harness-self-improvement
technique: score-memory-edits-their-gain-neighbouring-queries
statement: >-
  For self-evolving agents with a frozen executor and an external memory
  bank, training the step that distills experience into memory entries
  matters more than training the step that decides how to update the bank:
  ablating extraction optimization cost about 4.7 points on average across
  five benchmarks versus about 0.7 points for ablating management
  optimization.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1B-4B Llama/Qwen memory-optimizer policies trained by GRPO on ~2,000 MMLU queries, with frozen Qwen3-8B, GPT-5.1 or Gemini-2.5-Flash executors, evaluated on AIME, GPQA-Diamond, HLE"
sources:
  - source: arxiv-2602-10652
    stance: supports
    note: >-
      Validated by: Accuracy and ALFWorld success/progress rate against
      No-Memory, Self-RAG, Memp and ReMem baselines across three frozen
      executors, with ablations removing extraction optimization, management
      optimization, and neighbourhood modeling, plus a neighbourhood-size
      sweep (N=1,3,5) and a 10-epoch continual-evolution run.. Measured,
      single paper. Ablation reports per-benchmark drops for two executors;
      the 4.7 vs 0.7 average is the authors' aggregate and some cells move
      the other way (HLE and HotpotQA improve slightly without management
      optimization). [truncated]
