id: instruction-tuned-open-weight-models-told-think-about-x-while-performing
ref: CLM-0405
capability: strategic-deception
technique: track-activation-controllability-standing-capability-eval
statement: >-
  Instruction-tuned open-weight models told to "not think about X" while
  performing a simple transcription task can suppress that concept's
  residual-stream signal enough to evade activation monitors (linear probes,
  Jacobian lens, activation oracles, natural-language autoencoders), with no
  fine-tuning or adversarial optimization, while the same monitors catch
  instructed engagement near-ceiling.
kind: observation
backing_strength: single-paper
observed_on:
  era: "25 open-weight instruction-tuned models, 4B-744B, concrete safe concepts (e.g. bread) during verbatim sentence transcription; off-the-shelf unhardened monitors at a 1% false-positi"
sources:
  - source: arxiv-2608-21664
    stance: supports
    note: >-
      Validated by: Applied to 25 open-weight models; score ranged
      0.059-0.538 and did not track parameter count; rose across Olmo
      training checkpoints; downstream monitor-evasion experiments used the
      same setup. Not validated as predicting real deception risk..
      Measured: detection at 1% FPR fell to 5-21% for suppression while
      engagement stayed near ceiling across nine models for probes; J-lens
      recovered the concept in under 10% of suppression trials in 11 of 13
      models; NLA named the concept in 0 of 500 suppression trials for Gemma
      3 27B. [truncated]
