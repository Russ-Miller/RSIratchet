id: region-guided-contrastive-decoding-medical-vision-language-models-compactness-guiding-region
ref: CLM-0471
capability: visual-grounding
technique: pick-contrastive-region-counterfactual-occlusion-penalizing-size
statement: >-
  In region-guided contrastive decoding for medical vision-language models,
  the compactness of the guiding region matters more than whether it is
  expert-annotated: automatically discovered masks selected by
  counterfactual occlusion (mean coverage about 7%) raise closed-ended
  Med-VQA accuracy above decoding guided by ground-truth bounding boxes
  (about 39% coverage), because suppressing a large region strips most
  visual evidence from the unconditional branch and dilutes the contrast.
