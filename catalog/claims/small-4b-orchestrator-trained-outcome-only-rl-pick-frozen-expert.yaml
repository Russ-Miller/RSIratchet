id: small-4b-orchestrator-trained-outcome-only-rl-pick-frozen-expert
ref: CLM-0825
capability: multi-model-coordination
technique: rl-train-small-orchestrator-pick-model-skill-pairs
statement: >-
  When a small (4B) orchestrator is trained with outcome-only RL to pick a
  (frozen expert model, skill) pair at each step on multimodal reasoning
  benchmarks, the measured gain comes mostly from access to the
  heterogeneous expert pool rather than from the skill library: removing the
  model pool costs about 12 points average accuracy while removing the skill
  library costs about 3.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Ten multimodal VQA/reasoning benchmarks (geometry, chart, medical, high-resolution perception), registry of five frozen 4B-10B expert VLMs and a two-tier skill library, Qwen3-VL-4B"
sources:
  - source: arxiv-2605-22177
    stance: supports
    note: >-
      Validated by: Average accuracy over ten multimodal benchmarks: 70.1%
      versus GPT-5 69.3% and Gemini-2.5-Pro 68.7%, plus component ablations
      (no model pool -12.1, no skill library -2.7, neither 55.8%) and reward
      ablations (no format reward -13.1, no outcome reward -8.8); also 78.09
      on BFCL-V4 and 72.9 on tau2-bench.. Measured via component ablation on
      the authors' own framework across ten benchmarks. The ablations are
      internal to one system and one orchestrator backbone, with no seed
      variance reported. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-02
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An ablation on the same
  registry showing the skill library contributes as much as or more than the
  expert pool, or showing that routing to a single best frozen expert per
  benchmark (no learned policy) reaches the same average accuracy.
