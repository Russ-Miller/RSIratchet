id: open-source-vision-language-models-post-trained-rl-or-critique-tuning-act
ref: CLM-0393
capability: critique
statement: >-
  When open-source vision-language models are post-trained with RL or
  critique tuning to act as judges of chart-to-code outputs, they become
  more likely to output Accept rather than better at verification:
  pairwise-comparison accuracy barely improves under an order-swapped
  protocol, while acceptance rates rise and specificity falls, so they
  ratify flawed but plausible-looking charts.
kind: observation
backing_strength: single-paper
observed_on:
  era: "26 proprietary and open-source LMMs (7B-72B) judging chart reproduction and chart editing outputs on the 1,653-instance ChartJudgeBench; base-vs-post-trained comparisons within the"
sources:
  - source: arxiv-2609-24210
    stance: supports
    note: >-
      Measured: accuracy, F1, recall, specificity on 315 reproduction and
      335 editing cases with near-balanced Accept/Reject labels from 5
      expert annotators, plus base-vs-post-trained pairs (LLaVA-Critic-R1
      98.1% recall / 9.4% specificity; edit accept rate 48.7% to 72.2%).
      Only two model families supply the before/after contrast, so the
      causal read on post-training is narrow; the perturbation-based CPA
      items are synthetic.
contested: false
status: pending-review
last_checked_at: 2026-09-26
