id: across-41-models-seven-multi-agent-benchmarks-gains-single-agent-capability
ref: CLM-0288
capability: multi-model-coordination
statement: >-
  Across 41 models and seven multi-agent benchmarks, gains in single-agent
  capability translate only weakly into multi-agent competence
  (understanding other agents, joint planning, efficient communication,
  adaptation); on the multi-agent planning task accuracy rose only about 30%
  across a family's full scale range, so coordination ability does not
  emerge from scaling alone and needs its own data and training.
kind: observation
backing_strength: single-paper
observed_on:
