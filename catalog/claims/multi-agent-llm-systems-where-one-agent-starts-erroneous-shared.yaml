id: multi-agent-llm-systems-where-one-agent-starts-erroneous-shared
ref: CLM-0098
capability: hallucination
statement: >-
  In multi-agent LLM systems where one agent starts with an erroneous shared
  belief, broadcasting every agent's full context at every step raises the
  rate of false assertions above doing no synchronization at all, because
  the error propagates to agents that were previously correct — and the harm
  appears only in tasks where one wrong fact cascades across semantically
  linked dimensions (destination to airport to weather), not where agent
  contexts are largely orthogonal.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Three-agent planning tasks with deliberately injected context mismatches, Claude Haiku agents; travel-planning domain showed the effect, software sprint planning did not."
sources:
  - source: arxiv-2606-21666
    stance: supports
    note: >-
      Measured on 30/30/15 trials in travel and 10/10/5 in software with one
      model. Full-broadcast HR 0.658 vs no-sync 0.492 (p=0.0022, d=1.18) in
      travel; effect absent in software. Errors were deliberately injected,
      so the result isolates propagation of a seeded false belief rather
      than naturally arising drift. Single author, single model, small n.
contested: false
status: pending-review
last_checked_at: 2026-09-09
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Full-context broadcast
  between agents matching or lowering hallucination rate relative to no
  synchronization in cascading-belief tasks, across models and
  injected-error setups. Proposed technique, not catalogued: threshold-gated
  context synchronization between agents.
