id: hallucination-metric-unsupported-claim-rate-computed-over-whatever-claims-model
ref: CLM-0201
capability: evaluation-validity
statement: >-
  When a hallucination metric is an unsupported-claim rate computed over
  whatever claims a model happens to make, models that avoid committing to
  verifiable claims or directional outputs score best, so the ranking partly
  measures abstention rather than grounding — on financial
  chart-to-recommendation tasks the lowest unsupported-claim model made
  directional recommendations on only 6.4% of queries and ranked near the
  bottom once coverage was factored in.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Claim-level hallucination rates on open-ended generation where the model may hedge, abstain, or emit no checkable claims; shown on 969 financial chart-reasoning queries across 20 v"
sources:
  - source: arxiv-2609-14302
    stance: supports
    note: >-
      Measured on one benchmark (323 HS300 stocks, three input modalities,
      ten deterministic OHLCV-derived evidence anchors) over 20 models; rank
      reversal is demonstrated by one clear pair (Gemma-4-E2B-It lowest UCR
      39.9% but 6.4% coverage and NDR 5.1%, vs Qwen2.5-VL-3B NDR 32.1% at
      82.5% coverage). Oracle-aided verification lowering claims while
      collapsing coverage is reported but only in aggregate. Claim
      extraction uses pattern-based detectors, so 'no verifiable claim
      extracted' may partly be a detector limit rather than genuine
      abstention; [truncated]
