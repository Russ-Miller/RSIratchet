id: self-evolving-agents-accumulate-reusable-skills-bank-admit-new-skill
ref: CLM-0483
capability: harness-self-improvement
technique: gate-skills-sampled-coalition-knockouts-then-mask-after
statement: >-
  For self-evolving agents that accumulate reusable skills in a bank and
  admit a new skill whenever aggregate task reward rises, the accepted
  skills can be collectively net-negative, because a bank-level reward
  change cannot identify which skill contributed and a skill's contribution
  depends on the other skills present and on the deployment domain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Skill-bank self-evolving agents (MemSkill-style) with an outcome-only acceptance gate, audited on LoCoMo, LongMemEval, HotpotQA and ALFWorld with a Llama-3.3-70B skill-extraction p"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against MemSkill and six
      memory-agent baselines: the coalition gate accepted 1 of 12 candidates
      versus MemSkill's 6, and a K-controlled ablation showed MemSkill's
      extra additions were -1.38 pp on average; label-free masking improved
      all six trained banks on HotpotQA-50 LLM-judge (+3.59 pp average on
      coalition-gated banks, +7.17 pp on baseline banks), and the
      retrieval-quality signal correlated with label-based skill ranking at
      rho=+0.76 versus -0.18 for a policy-entropy signal.. [truncated]
