    stance: supports
    note: >-
      Validated by: Not measured against human error-labelling agreement in
      the given text; validated indirectly by showing the metrics separate
      frameworks and scale monotonically within the LRAS family.. Measured
      on one benchmark with an LLM judge over 18 agent configurations;
      hard-case filtering (only items all six filter models failed) inflates
      absolute rates, and the judge's own reliability is only referenced to
      an appendix robustness analysis not included here.
