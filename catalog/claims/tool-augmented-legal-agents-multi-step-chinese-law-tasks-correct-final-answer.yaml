id: tool-augmented-legal-agents-multi-step-chinese-law-tasks-correct-final-answer
ref: CLM-0406
capability: hallucination
technique: judge-each-rubric-item-against-full-agent-trajectory
statement: >-
  For tool-augmented legal agents on multi-step Chinese-law tasks, a correct
  final answer does not indicate a clean reasoning trajectory: across 18
  agent configurations, trajectories that reach the right answer still
  contain at least one substantive legal hallucination about 68% of the time
  on average, and that rate barely moves with backbone scale or agentic
  framework (0.61-0.78), while procedural-process hallucination rates vary
  widely (0.07-0.85).
