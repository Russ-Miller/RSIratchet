id: tool-augmented-llm-must-acquire-withheld-constraints-through-queries-before
ref: CLM-1313
capability: tool-use
statement: >-
  When a tool-augmented LLM must acquire withheld constraints through
  queries before solving a deterministic logic puzzle, failures come far
  more from under-acquiring information and stopping too early than from
  faulty downstream deduction: reasoning errors stay around 2-7% while
  insufficient-information errors rise to about 46% on the largest
  instances, and models also keep querying after the solution is already
  determined.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Procedurally generated partially observed Zebra puzzles with a deterministic noise-free oracle, unique verifiable solutions, and 1-6 withheld clues; seven frontier and open models."
sources:
  - source: arxiv-2603-18614
    stance: supports
    note: >-
      Measured on 2000+ generated instances by decomposing failures on two
      axes (answer correct vs. final feasible set singleton), which the
      environment makes exactly computable. Also reports over-querying up to
      62.2% and that GPT-5 still uses 70-270% more calls than the
      constructive reference budget. Single environment, synthetic puzzles,
      deterministic oracle; transfer to noisy real tool settings is argued,
      not shown.
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An evaluation in the
  same environment showing reasoning errors (wrong answer with the feasible
  set already a singleton) at or above the rate of insufficient-information
  errors, or showing insufficient-information errors not rising with puzzle
  size and missing-clue count.
