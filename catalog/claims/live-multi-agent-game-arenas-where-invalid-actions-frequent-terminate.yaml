id: live-multi-agent-game-arenas-where-invalid-actions-frequent-terminate
ref: CLM-0661
capability: evaluation-validity
technique: flag-arena-rankings-error-rate-termination-depth
statement: >-
  In live multi-agent game arenas where invalid actions are frequent and can
  terminate a game, leaderboard rank partly measures an agent's robustness
  to opponents' rule-violations rather than its strategic skill, and this
  confound is environment-dependent: in Secret Mafia fewer than 1% of top
  models' games were error-free and the top agent witnessed opponent errors
  in 129 of 130 games while causing errors in 4, whereas Iterated Prisoner's
  Dilemma recorded zero errors across 1,012 games.
