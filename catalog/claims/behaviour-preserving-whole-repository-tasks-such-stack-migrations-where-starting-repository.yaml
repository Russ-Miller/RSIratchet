id: behaviour-preserving-whole-repository-tasks-such-stack-migrations-where-starting-repository
capability: evaluation-validity
statement: >-
  For behaviour-preserving whole-repository tasks such as stack migrations,
  where the starting repository already passes its test suite, a fixed
  behavioural test suite cannot distinguish a completed migration from an
  untouched or shim-wrapped repository, so adding more tests does not close
  the gap and a non-behavioural audit with veto power is required.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tasks where the starting state is already green — behaviour-preserving refactors, migrations, ports — not bug-fix tasks that have a red-to-green signal."
sources:
  - source: arxiv-2608-23564
    stance: supports
    note: >-
      Argued from task structure (the original repository passes any suite
      drawn from its own behaviour by construction) and measured on 520 runs
      across 8 models and 26 configurations on 20 migrations: 118 runs
      passed every one of 130,118 fixed checks, but 30 of those had not
      migrated at all and 60 more were broken by post-hoc agentic verifiers,
      leaving 28 (5.4%) accepted. Audit judge agreed with two human
      annotators on 140/156 runs, with disagreements skewed strict. Does not
      isolate how much of the audit's rejection power generalises beyond
      these 20 hand-built criteria sets.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: high. Falsifier as drafted: Show a purely behavioural
  suite that rejects untouched or forwarding-shim submissions on
  behaviour-preserving migration tasks, or show that submissions passing all
  fixed checks essentially never fail an independent migration audit.
  Proposed technique, not catalogued: Three-stage migration scoring:
  migration audit, fixed differential tests, then adversarial agentic
  verifiers.
