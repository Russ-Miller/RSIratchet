id: llm-agents-over-large-tool-libraries-100-remote-sensing-tools
ref: CLM-0802
capability: tool-use
technique: let-agent-explore-hierarchical-skill-tree-demand
statement: >-
  For LLM agents over large tool libraries (100+ remote-sensing tools),
  replacing flat registration of all tool descriptions with a three-layer
  skill tree the agent explores on demand — read skill summaries, expand a
  branch's brief tool descriptions, then load one tool's full documentation
  — raises task accuracy and cuts input tokens, with the largest gains on
  the weakest backbone.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Earth-Bench (234 RS analysis questions), ReAct harness, GPT-5 / DeepSeek-V3.1 / Qwen3-32b; advantage depends on the library containing redundant tools — with only the minimum requi"
sources:
  - source: arxiv-2605-13391
    stance: supports
    note: >-
      Validated by: Accuracy, Tool-Any-Order and Tool-In-Order on 234
      Earth-Bench questions in autonomous-planning and instruction-following
      modes versus flat full registration and a 19-tool RAG retrieval
      baseline, plus tokens per question and per turn; ablations removing
      the skill summary layer and randomizing skill groupings.. Measured on
      one benchmark (234 questions) across three models and two modes;
      reported +12.45 points over flat in Qwen3-32b AP mode with ~86% token
      compression, versus +3.00 on GPT-5. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-01
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On a comparable large
  tool library, an agent given flat registration matches or beats
  hierarchical on-demand exploration in task accuracy at equal or lower
  token cost, or the accuracy gain fails to grow as redundant tools are
  added.
