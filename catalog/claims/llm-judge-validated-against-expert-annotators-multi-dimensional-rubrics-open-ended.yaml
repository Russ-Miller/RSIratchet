id: llm-judge-validated-against-expert-annotators-multi-dimensional-rubrics-open-ended
capability: evaluation-validity
statement: >-
  When an LLM judge is validated against expert annotators on
  multi-dimensional rubrics for open-ended agent outputs, a single pooled
  agreement figure overstates reliability: per-dimension human-human
  agreement varies widely (substantial on a recall-style Completeness
  dimension, only slight to fair on Relevancy, Structural Clarity and Scope
  Adherence), the pooled statistic is inflated by between-dimension
  variation, and the judge's residual disagreements are directional
  (consistently one step stricter on Completeness, one step more generous on
  Structural Clarity) rather than noise.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Five expert annotators scoring 35 outputs of one deployed drug-discovery agent across four rubric dimensions; four candidate judge models; small set, and some dimensions had no neg"
sources:
  - source: arxiv-2608-21057
    stance: supports
    note: >-
      Measured: Fleiss's kappa and weighted Cohen's kappa per dimension and
      pooled; 700 individual judgments from 5 annotators on 35 items; judge
      disagreement direction counted by hand (7 strict on Completeness, 4
      generous on Structural Clarity). Single agent, single domain, small n;
      the class-imbalance confound is acknowledged by the authors.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A study where
  per-dimension human-human and judge-human agreement are close to the
  pooled figure, and judge deviations from the human majority are symmetric
  across dimensions rather than one-directional. Proposed technique, not
  catalogued: Dimension-wise judge–human alignment auditing.
