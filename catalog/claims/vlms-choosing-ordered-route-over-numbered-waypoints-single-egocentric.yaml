id: vlms-choosing-ordered-route-over-numbered-waypoints-single-egocentric
ref: CLM-0394
capability: embodied-control
statement: >-
  For VLMs choosing an ordered route over numbered waypoints in a single
  egocentric image, per-waypoint feasibility and the first action are judged
  well while the rest of the route is not: pooled over nine models, roughly
  88-96% of predictions take a legal first edge, but full-route legality
  falls to about 47% for a point agent and under 7% once the agent has a
  footprint, with most of the loss in intermediate edges rather than in
  output format.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot, single first-person RGB image with numbered waypoints and JSON output; feasibility scored against registered 3D scene geometry; indoor simulated scenes."
sources:
  - source: arxiv-2609-16610
    stance: supports
    note: >-
      Measured on 1,111 benchmark questions across nine VLMs, with route
      diagnostics decomposed into output validity, endpoint choice,
      first-edge legality and full-route legality; length- and
      waypoint-density stratification reported. Single benchmark, authors'
      own construction; human reference reaches 54.2 EgoPath Score versus
      28.6 for the best VLM.
contested: false
status: pending-review
last_checked_at: 2026-09-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose first-edge
  legality and full-route legality are close together, or whose
  embodied-route legality approaches its point-route legality, on the same
  benchmark.
