id: multi-turn-tool-agent-user-service-tasks-binary-task-success-does-rank
ref: CLM-0251
capability: evaluation-validity
technique: score-successful-trajectories-excess-turns-tool-calls
statement: >-
  For multi-turn tool-agent-user service tasks, binary task success does not
  rank agents by how much excess interaction they impose: among the
  highest-efficiency models success rate and a human-calibrated
  excess-effort score decouple, and the model with the highest success rate
  ranked only 10th on efficiency.
kind: observation
backing_strength: single-paper
observed_on:
  era: "58 Chinese-language ridehailing tasks, 24 non-thinking LLM agents, 3 attempts each, success gated by a 3-LLM judge panel; single domain and language."
sources:
  - source: arxiv-2609-17985
    stance: supports
    note: >-
      Validated by: 78.7% accuracy on task-disjoint held-out human pairwise
      preferences (90.6% when turns differ, 50.0% chance-level when only
      tool calls differ); Kendall tau_b 0.573 pairwise and positive on all
      10 listwise tasks; beats tool-only and equal-cost-length baselines but
      statistically tied with a turn-first lexicographic rule.. Measured:
      Spearman 0.785 overall but -0.161 among top 12 models (wide bootstrap
      interval); one sharp case (mimo). 496 successful trajectories, only
      10.3% at both effort floors. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On the same or
  comparable benchmarks, success rate correlating tightly with a
  human-validated excess-effort score across the whole model pool, including
  the top tier, with no rank inversions. Drafted stance toward
  multi-turn-tool-calling-benchmarks-score-whether-final-environment-state-matches:
  supports -- Both find that outcome-only scoring on multi-turn tool
  benchmarks conceals how the agent reached the final state.
