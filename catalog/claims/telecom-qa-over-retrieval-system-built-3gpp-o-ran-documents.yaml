technique: retrieve-ontology-aligned-triples-incrementally-updated-kg
statement: >-
  For telecom QA over a retrieval system built on 3GPP/O-RAN documents,
  retrieving ontology-aligned triples from a knowledge graph instead of text
  passages lowers reported hallucination rates and raises accuracy over
  passage RAG, and keeping the graph incrementally updated from live
  configuration and telemetry events is what prevents answers that reflect
  superseded network state.
