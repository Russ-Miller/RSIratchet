id: adding-explicit-don-t-make-up-say-you-don
ref: CLM-0997
capability: hallucination
statement: >-
  Adding an explicit 'don't make it up, say you don't know if it isn't in
  the text' instruction to long-context needle-in-a-haystack prompts raises
  faithfulness but costs literal extraction and inference accuracy on facts
  that are actually present, and the size of that cost is model-specific
  rather than general: for ChatGPT-5-mini at full context capacity
  extraction fell 89% to 72% and inference 88% to 68%, while
  Gemini-2.5-flash, Deepseek-v3.2-chat and Claude-4.5-haiku moved by a few
  points or not at all.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four production mid-tier models (Gemini-2.5-flash, ChatGPT-5-mini, Claude-4.5-haiku, Deepseek-v3.2-chat) on synthetic facts injected into a fiction corpus, 30-question quizzes grad"
sources:
  - source: arxiv-2601-02023
    stance: supports
    note: >-
      Measured: bivariate sweep of context length x fact depth (200
      quizzes/model) plus 18 distribution quizzes, each prompt condition
      paired. Isolates the prompt wording since everything else is held
      fixed. Weak points: one graded quiz set, one corpus, a single strict
      AH phrasing (no gradient of severity), LLM-judge grading, and only
      four models so the model-specificity rests on n=4.
contested: false
status: pending-review
last_checked_at: 2026-11-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Running the same
  dual-prompt sweep on a wider model set and finding anti-hallucination
  prompts leave extraction and inference accuracy on present facts unchanged
  across all models, or that the degradation is uniform rather than
  concentrated in particular models.
