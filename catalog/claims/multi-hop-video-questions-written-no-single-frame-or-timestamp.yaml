  Drafted confidence: medium. Falsifier as drafted: A replication where
  fixed-plan agentic frameworks match adaptive-control ones on these
  questions, or where single-turn MLLMs match the best agentic setups on
  multi-hop video QA. Drafted stance toward
  7b-multimodal-models-long-video-qa-multi-turn-agentic-exploration-harness:
  supports -- Both find that an agentic video-exploration harness can score
  below plain single-pass answering when the loop or its tools are poorly
  matched to the model.
