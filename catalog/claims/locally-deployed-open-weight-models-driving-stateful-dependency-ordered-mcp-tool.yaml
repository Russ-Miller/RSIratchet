id: locally-deployed-open-weight-models-driving-stateful-dependency-ordered-mcp-tool
ref: CLM-0080
capability: tool-use
technique: retrieve-tool-docs
statement: >-
  For locally deployed open-weight models driving a stateful,
  dependency-ordered MCP tool server, cutting tool descriptions from full
  specifications (purpose, parameter semantics, constraints, failure
  conditions) down to one sentence each raises the fraction of calls the
  server rejects for every model tested, while its effect on task coverage
  is less consistent.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven 4-bit quantised open models (8B-31B) run through Ollama on an expert-informed hardware-design benchmark of 14 tools; single-agent ReAct loop with other configuration held fix"
sources:
  - source: arxiv-2608-26199
    stance: supports
    note: >-
      Measured as tool failure rate under matched configurations; the paper
      reports TFR rises for every model and roughly doubles for most, and
      comprehensive descriptions win in 35 of 42 model-suite best
      configurations. No absolute per-model numbers given for the ablation,
      and only one tool set of 14 tools on a proprietary replica server.
contested: false
status: pending-review
last_checked_at: 2026-09-09
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An ablation on
  comparable stateful tool benchmarks where minimal one-sentence
  descriptions leave the tool failure rate unchanged or lower than
  comprehensive descriptions across models. Drafted stance toward
  shows-llms-hallucinate-api-names-arguments-when-calling: supports -- Both
  find that giving the model detailed tool documentation reduces malformed
  or invalid calls.
submitted_by: agent:claude-opus-5@Russ-Miller
conditions:
  effect: helps
  fails_when: "Tool descriptions are cut to one sentence: the fraction of calls
    the server rejects rises for every model tested, while task coverage moves
