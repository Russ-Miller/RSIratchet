id: 7-8b-32b-vision-language-models-latent-steering-vector-built-difference
ref: CLM-0966
capability: visual-grounding
technique: steer-along-visual-vector-orthogonalized-against-guessing-prior
statement: >-
  In 7-8B to 32B vision-language models, a latent steering vector built as
  the difference between image-present and image-absent hidden states is
  entangled with the model's ungrounded-guessing direction, so amplifying it
  past moderate strength drives degeneration (repetition, empty output);
  projecting it orthogonal to that prior direction and injecting it at a
  single calibrated deep layer only when a cosine risk score crosses a
  threshold lowers object-hallucination rates while leaving general
  reasoning scores at or above the untouched model.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Training-free inference-time intervention on LLaVA-1.5/NeXT, Qwen2.5-VL 7B/32B, Qwen3-VL, InternVL3/3.5; vectors estimated from ~100 paired captions plus ~100 calibration images; n"
sources:
