id: single-agent-procedural-tasks-where-relevant-state-fits-fixed-schema
ref: CLM-0569
capability: long-horizon-execution
technique: replace-conversation-history-rewritten-execution-state
statement: >-
  For single-agent procedural tasks where the relevant state fits a fixed
  schema known in advance, replacing the appended conversation transcript
  with a structured execution state that the model rewrites each step —
  discarding the reasoning trace once the state patch is validated — holds
  accuracy flat as the horizon grows while history-appending runtimes
  degrade, and the gain comes from the structure rather than the shorter
  prompt.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Single-agent procedural execution with a per-domain schema authored in advance; fails where the schema must be discovered during execution, where an observation's relevance is reco"
sources:
  - source: arxiv-2608-26263
    stance: supports
    note: >-
      Validated by: On a 500-shelf warehouse simulation with Gemini-3-Flash
      over 5 seeds, accuracy at T=200 was 0.94 vs 0.74 (ReAct), 0.84
      (summary memory) and 0.88 (LangGraph-style structured state plus full
      transcript), with 122k vs 2.6-6.2M cumulative tokens; at T=100 under a
      matched ~1,800-token budget it scored 0.94 vs 0.18 sliding window,
      0.52 summary-capped and 0.22 LLMLingua. Also highest pass rate on
      InterCode CTF (54.2% vs 46.4% best baseline) and both tau-Bench
      domains.. [truncated]
contested: false
status: pending-review
