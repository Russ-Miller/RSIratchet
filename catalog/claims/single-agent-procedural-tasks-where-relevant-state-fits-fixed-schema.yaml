notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A matched-budget
  comparison on long-horizon tasks where a transcript-based or
  compression-based runtime equals or beats the state-rewriting runtime on
  accuracy, or where the structured-state gain disappears once prompt length
  is held equal. Drafted stance toward
  llm-agents-long-horizon-web-penetration-testing-holding-backbone-model:
  supports -- Both find that moving global state out of the growing context
  onto an explicit external structure raises success most on the
  longest-horizon tasks.
