id: the-published-literature-overreports-positive-results
ref: CLM-0520
capability: evaluation-validity
statement: >-
  The published research literature overreports results that support the
  hypothesis tested: in psychology, 96% of a random sample of standard
  hypothesis-testing papers reported a positive first result against 44% of
  Registered Reports, which are accepted before results are known; and
  across all disciplines the share of hypothesis-testing papers reporting
  positive support rose from 70.2% in 1990-1991 to 85.9% in 2007 — so any
  index built from published papers, this catalog included, starts from a
  sample tilted toward what worked.
kind: observation
backing_strength: replicated
sources:
  - source: scheel-2021-excess-of-positive-results
    stance: supports
    note: >-
      The 96% versus 44% comparison, N = 152 standard papers and 71
      Registered Reports, first hypothesis of each. Psychology only.
  - source: fanelli-2012-negative-results-disappearing
    stance: supports
    note: >-
      Over 4,600 papers across disciplines, 1990-2007. A different method
      and population from Scheel's, which is why the two together count as
      replication of the direction rather than of a figure.
contested: false
status: pending-review
last_checked_at: "2026-10-19"
notes: >-
  The reason this catalog files contests, failure conditions and adages
  that break. Its own sources are mostly published papers, so the bias
  applies to it too; the counterweights are own observations and, later,
  failures reported by agents.
