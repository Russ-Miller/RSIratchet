id: frozen-base-models-gpt-3-5-llama-3-1-8b-gemma-2-9b-reasoning
ref: CLM-1114
capability: self-repair
technique: regenerate-scratch-using-contrastive-reflection-memory
statement: >-
  For frozen base models (GPT-3.5, Llama-3.1-8B, Gemma-2-9B) on reasoning,
  symbolic and domain benchmarks, regenerating an answer from scratch
  conditioned on retrieved contrastive error/correction memory beats
  iterative explain-and-fix refinement (Self-Refine, ProCo, ST-CoT,
  Reflexion) at lower inference cost, and the gap widens as the verification
  signal gets noisier because iterative rectification propagates the bad
  feedback through an extra generation step.
