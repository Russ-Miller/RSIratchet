id: 3b-14b-models-being-cold-started-multi-hop-retrieval-rl-sft-trajectories
ref: CLM-0534
capability: multi-step-reasoning
technique: cold-start-small-seed-model-s-own-trajectories
statement: >-
  For 3B-14B models being cold-started for multi-hop retrieval RL, SFT
  trajectories generated by a small same-scale seed model that already
  acquired the behaviour give higher final accuracy and more stable
  subsequent RL than correctness-filtered trajectories distilled from a 72B
  teacher, because the teacher's reasoning style lies outside the target's
  reproducible distribution.
