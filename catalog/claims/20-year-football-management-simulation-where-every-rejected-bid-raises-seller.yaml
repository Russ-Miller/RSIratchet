id: 20-year-football-management-simulation-where-every-rejected-bid-raises-seller
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year football-management simulation where every rejected bid
  raises a seller's hidden asking price, frontier LLM agents never infer the
  acceptance threshold from accumulated rejections: the field needs a median
  of 30 offers per completed signing (best model 9, worst 73) against 1.0
  for a script that reads the true threshold, with no improvement over the
  horizon.
kind: observation
backing_strength: single-paper
observed_on:
  era: "15 flagship models, three seeds, agents run with no chat history across stops and only a self-written notebook as carried state; hidden thresholds are never revealed, only accept/r"
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured as offers per completed signing across 15 models and three
      seeds in a deterministic engine, with a privileged truth-reading
      script as reference. Design does not separate failure to accumulate
      evidence in the notebook from failure to reason about it; the same
      winner bid far more often in the contested Arena, so bidding rate is
      partly strategic.
contested: false
status: pending-review
last_checked_at: 2026-10-12
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  offers-per-signing falls materially across the 20 years, or approaches the
  oracle's ~1.0, would show the threshold is learnable from rejection
  feedback in this setup.
