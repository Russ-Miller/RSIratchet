technique: let-agents-parse-route-let-solver-backed-optimizer
statement: >-
  On 0D engineering network design tasks (aero-engine secondary air systems,
  IEEE distribution reconfiguration, water-network sizing) where a physical
  solver scores every candidate, role-decomposed multi-agent orchestration
  only reaches its best reported scores when the candidate-generation
  optimizer is also swapped (NSGA-II to a MILP-guided hybrid), so the
  measured gain over a single ReAct agent cannot be attributed to agent
  decomposition alone.
