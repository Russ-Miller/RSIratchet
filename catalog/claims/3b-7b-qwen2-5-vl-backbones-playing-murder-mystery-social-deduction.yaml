capability: strategic-deception
technique: synthesize-deception-game-scripts-role-agents-then-rl
statement: >-
  For 3B-7B Qwen2.5-VL backbones playing murder mystery social deduction,
  two-stage training (LoRA SFT on multi-agent-synthesized scripts, then GRPO
  with LLM-judge and image-clue-match rewards) raises multi-hop multimodal
  reasoning and murderer identification well above the untrained backbone,
  while judged role-playing quality barely moves and can fall slightly at 7B
  (-0.29 on a 10-point scale).
