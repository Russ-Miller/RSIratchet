id: llms-used-relevance-judges-specialized-non-english-brazilian-portuguese-legal
ref: CLM-0634
capability: critique
statement: >-
  When LLMs are used as relevance judges on a specialized non-English
  (Brazilian Portuguese legal) retrieval collection, they assign
  systematically higher relevance grades than human experts (mean absolute
  error 0.46-0.66 on a 0-2 scale, Cohen's kappa with humans only 0.32-0.53),
  yet the resulting system rankings stay close to the human reference for
  rank-aware metrics (nDCG@10, MRR, Kendall's tau >= 0.90) and diverge for
  P@10 and R@10.
kind: observation
backing_strength: single-paper
observed_on:
  era: "46 queries, 812 judged query-document pairs, 15 retrieval systems (8 BM25 variants), three proprietary LLMs with two prompt styles; small collection where precision/recall metrics "
sources:
  - source: arxiv-2608-27746
    stance: supports
    note: >-
      Measured on one dataset the authors built: 3,048 human judgments from
      four experts aggregated into reference qrels, compared against six
      LLM-annotator configurations; bootstrap CIs over 46 queries often did
      not stay above tau=0.9, and the system pool is dominated by closely
      related BM25 variants, so ranking agreement is partly a property of a
      low-diversity pool. No fix proposed.
contested: false
status: pending-review
last_checked_at: 2026-10-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A larger Portuguese or
  other non-English specialized collection where LLM-generated qrels produce
  nDCG@10 or MRR rankings with Kendall's tau well below 0.9 against
  aggregated human qrels, or where LLM judges show no positive grading bias.
