notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Applying the same
  masked-attention procedure to other medical MLLMs (e.g. LLaVA-Med,
  VILA-M3) yields no accuracy gain or a loss, or an ablation masking
  randomly selected heads of equal count produces the same gain. Drafted
  stance toward
  7b-vision-language-models-llava-1-5-7b-qwen-vl-chat-inference-time-hidden-state-steering:
  supports -- Both find that attention/hidden-state interventions for
  grounding work only when selectively targeted rather than applied
  uniformly, here by selecting heads and a single layer.
