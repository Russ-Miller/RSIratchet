id: small-open-models-suffice-for-routine-agent-calls-not-for-long-horizon-planning
ref: CLM-0337
capability: tool-use
technique: model-routing
statement: >-
  On a 30-task ladder spanning instruction following, tool use, multi-step
  coordination and long-horizon planning, evaluated over 16 open-weight
  models from 0.27B to 32B against GPT-5 across 16,542 scored runs, small
  and mid-sized open models are already sufficient for the short-horizon
  structured tool use that makes up most calls in real agent pipelines, and
  the strongest open-weight model matches GPT-5 in aggregate — but the gap
  reappears on long-horizon planning that needs sustained coordination and
  constraint tracking, where frontier models still lead and neither side is
  reliable, and the boundary is not explained by model scale alone.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2026, 16 open-weight models 0.27B-32B and GPT-5 on the authors' own AgentFloor benchmark"
  task_type: autonomous-agent
conditions:
  effect: narrows
  needs:
    - separate-model
  helps_most: independent
  cost: low
  fails_when: >-
    The step needs long-horizon planning or constraint tracking over many
    steps, where the small model's shortfall reappears; and the routing rule
    itself does not transfer, since the paper finds failures respond to
    model-specific rather than universal interventions.
sources:
  - source: arxiv-2605-00334
    stance: supports
    note: >-
      The paper's own benchmark, harness and sweep, released with the run
      corpus. The aggregate is an average over a ladder whose lower tiers are
      short structured calls by construction, so "matches GPT-5" is a
      statement about that mix, not about frontier-level capability.
contested: false
status: pending-review
last_checked_at: "2026-09-26"
notes: >-
  Filed with the technique it argues for, model-routing, and as the
  contesting source on CLM-0012, which held that open models are far behind
  commercial ones on agent work. Single benchmark, designed by the authors
  who report the result, which is the main reason to hold it lightly.
