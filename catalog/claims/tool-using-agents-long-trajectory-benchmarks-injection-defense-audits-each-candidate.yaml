id: tool-using-agents-long-trajectory-benchmarks-injection-defense-audits-each-candidate
capability: prompt-injection
statement: >-
  For tool-using agents on long-trajectory benchmarks, an injection defense
  that audits each candidate action against a one-step-ahead predicted tool
  set holds attack success low while keeping task utility near the
  attack-free level, whereas defenses that fix a global plan or filter whole
  tool outputs lose utility because the predicted full trajectory almost
  never matches the executed one once environmental feedback arrives.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Multi-step tool agents with untrusted observations; measured on AgentDyn and AgentDojo with GPT-4o-mini, Gemini-2.5-Flash and DeepSeek-V4-Flash backends; requires log-probability a"
sources:
  - source: arxiv-2609-14987
    stance: supports
    note: >-
      Measured against 9 defense baselines on two benchmarks with three
      backends, reporting attack-free utility, under-attack utility and
      attack success rate. Planning-reference coverage is reported directly:
      step-wise next-tool prediction 58.7-72.2% no-attack and 54.2-69.6%
      under attack, versus global plans 9.7-16.1% no-attack and 0.00% under
      attack. Ablations show removing argument-level localization causes the
      largest degradation (ASR 3.0 to 24.5 on DailyLife). All numbers from
      the paper's own implementation; [truncated]
