id: agent-builds-whole-python-repository-natural-language-requirements-continuing-revise
ref: CLM-0357
capability: software-architecture
technique: evolve-repo-architecture-cohesion-coupling-gates-until-convergence
statement: >-
  When an agent builds a whole Python repository from natural-language
  requirements, continuing to revise the component architecture during
  generation — with split/merge triggered by explicit cohesion and coupling
  thresholds and stopped at convergence — yields higher functionality
  coverage and test pass rate than fixing the architecture in one planning
  pass, while letting the LLM decide restructuring freely over a fixed round
  budget over-decomposes and scores worse than metric-gated evolution.
