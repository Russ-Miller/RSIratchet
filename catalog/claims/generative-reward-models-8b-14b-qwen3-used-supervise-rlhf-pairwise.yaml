id: generative-reward-models-8b-14b-qwen3-used-supervise-rlhf-pairwise
ref: CLM-1091
capability: critique
technique: reward-judge-only-rationale-matches-gold-one
statement: >-
  For generative reward models (8B-14B Qwen3) used to supervise RLHF,
  pairwise label accuracy barely tracks downstream policy quality while the
  rate at which correct verdicts rest on rationales matching a gold judgment
  does: across evaluated judges, label accuracy correlated 0.22-0.38 with
  average downstream actor score and rationale-consistent accuracy
  0.92-0.96, and two judges with near-identical label accuracy produced
  opposite RLHF trajectories.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Pairwise preference judging on HelpSteer3, RewardBench2 and PPE-Preference; judges 8B-32B plus frontier APIs; downstream RLHF of a Qwen3-8B policy on Arena-Human-Preference prompts"
sources:
  - source: arxiv-2602-06763
    stance: supports
    note: >-
      Validated by: Spurious-correctness rate and rationale-consistent
      accuracy on three repurposed RM benchmarks against the base model and
      an outcome-reward RLVR baseline (e.g. 14B HelpSteer3 F-Score 44.5
      base, 40.1 RLVR, 54.0 R-Align), plus downstream actor average across
      STEM, code, instruction-following and general suites (59.4 RLVR vs
      61.7 R-Align at 14B).. Measured on three benchmarks and one policy
      backbone; correlations are computed over a small handful of judge
      variants, so the 0.92-0.96 figures rest on few points. [truncated]
contested: false
