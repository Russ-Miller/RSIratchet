id: search-agent-asked-forecast-future-distribution-rather-than-report
ref: CLM-0466
capability: forecasting
technique: ask-current-state-then-carry-forward
statement: >-
  When a search agent is asked to forecast a future distribution rather than
  report the current state over the same cumulative literature archive, the
  forward-looking target changes what it retrieves — it allocates a smaller
  share of retrieved documents to the most recent window, which is the more
  predictive evidence — so carrying the agent's own state estimate forward
  beats its explicit forecast.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Agents searching a temporally restricted arXiv corpus with a BM25 interface and full pre-cutoff (expanding-history) access; measured on four models (GPT-5.5, Qwen3.6-27B, GPT-OSS-1"
sources:
  - source: arxiv-2609-10092
    stance: supports
    note: >-
      Validated by: State-as-Forecast beat direct Forecast on episode-level
      Spearman agreement for all four diagnostic models under
      expanding-history access; frozen-evidence replay with byte-identical
      query traces and matched search-call budgets attributed a shared part
      of the gap to retrieval rather than readout.. Measured on 1,055
      held-out episodes across 211 fields with five rolling origins; four
      diagnostic models; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-01
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A setup where
  forecast-conditioned queries retrieve as large or larger a share of recent
  evidence as state-conditioned queries, or where direct forecasting matches
  or beats state carry-forward under matched search budgets on
  cumulative-history access.
