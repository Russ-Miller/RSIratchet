    stance: supports
    note: >-
      Validated by: Accuracy/precision/recall/F1 on AVHBench and
      perception-accuracy/hallucination-resistance on CMM against the base
      models, vanilla DPO and OmniDPO at matched epochs-equivalent budget;
      component ablations zeroing each term; hyperparameter sweeps; plus
      general benchmarks (DailyOmni, MVBench, MMAU) to check no capability
      loss.. Measured on two backbones and two hallucination benchmarks
      against DPO and OmniDPO baselines; [truncated]
