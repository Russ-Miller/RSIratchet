id: 7-8b-omni-audio-video-language-llms-adding-dpo-objective-kl-term
ref: CLM-1003
capability: hallucination
technique: train-preferences-modality-invariance-sensitivity-terms
statement: >-
  For 7-8B omni (audio-video-language) LLMs, adding to the DPO objective a
  KL term that keeps outputs stable when the prompt-irrelevant modality is
  corrupted and one that forces outputs to shift when the prompt-relevant
  modality is corrupted lowers cross-modal hallucination more than vanilla
  or multimodal DPO at matched training budget, and the invariance term must
  be weighted well below the sensitivity term because cross-modal evidence
  is sometimes legitimately useful.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-Omni 7B and MiniCPM-O 2.6 8B post-trained on an 18.1k automatically generated audio/visual preference set; evaluated on AVHBench and CMM cross-modal hallucination benchmark"
sources:
