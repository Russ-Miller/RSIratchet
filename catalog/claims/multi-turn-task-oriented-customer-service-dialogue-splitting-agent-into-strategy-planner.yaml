id: multi-turn-task-oriented-customer-service-dialogue-splitting-agent-into-strategy-planner
ref: CLM-1194
capability: long-horizon-execution
technique: plan-skill-sequence-separate-agent-execute-under-hard
statement: >-
  In multi-turn task-oriented customer-service dialogue, splitting the agent
  into a strategy planner that selects a skill sequence and a response
  generator constrained to execute it, with the planner trained by
  trajectory-level preference reward, raises sequence-level task completion
  over single-agent PPO and trajectory-preference baselines, and removing
  the planner lowers sequence-level success while leaving or raising n-gram
  overlap with references.
kind: observation
backing_strength: single-paper
observed_on:
  era: "E-commerce customer service and MultiWOZ dialogue datasets, Qwen 7B-14B backbones, reward partly from LLM judges and a teacher-generated reference skill sequence; evaluation is off"
sources:
  - source: arxiv-2602-15854
    stance: supports
    note: >-
      Validated by: Compared against untrained, SFT, PPO and Memento on four
      dialogue datasets using a sequence-level engagement metric (TSE), an
      LLM-judged per-turn metric (GRE), BLEU and G-Eval; ablation removed
      the planner agent, and mixed-agent swaps replaced each agent with a
      non-jointly-trained model.. Measured on four datasets (two internal
      e-commerce, Mgshop, MultiWOZ) with Qwen 7B/8B/14B. Reported gains: TSE
      +0.6-7.7% over PPO, +9-12% over Memento; ablation drops TSE 5.7% on
      TmallBrand-A while BLEU rises. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Under a fixed backbone and
  matched training compute, the decoupled planner-executor system scores no
  better than single-agent RL on sequence-level task completion, or the
  planner ablation leaves sequence-level success unchanged.
