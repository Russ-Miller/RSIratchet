id: long-context-tasks-built-8k-128k-token-un-reports-evidence-position-controlled
ref: CLM-0429
capability: long-context-degradation
statement: >-
  On long-context tasks built from 8K-128K-token UN reports with evidence
  position controlled, the middle-of-context accuracy dip appears for
  word-level QA and paragraph filling but inverts for sentence-level cloze,
  where most of 12 models score highest on mid-document targets — because
  mid-paragraph sentences carry concrete entities and connectives that match
  the surface cues models follow, while beginning and end sentences share
  confusable framing style.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Zero-shot evaluation of 12 long-context LLMs on multilingual UN reports (six official languages), with the instruction and answer options appended after the document."
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured across 12 models and six languages on a new benchmark with
      position stratification at document and paragraph level; the
      cue-following explanation rests on LLM-plus-human error categorization
      of cloze cases where over half of models fail, plus an option-order
      ablation (accuracy 0.16 with early distractors vs 0.24 with late), not
      on a controlled distractor-matched experiment.
contested: false
status: pending-review
last_checked_at: 2026-10-12
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A position-controlled
  sentence-cloze set in which distractors are matched for lexical overlap
  and connectives, where mid-document targets no longer score highest, would
  show the inversion is not driven by surface cues.
