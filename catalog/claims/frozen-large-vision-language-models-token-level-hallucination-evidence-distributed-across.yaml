id: frozen-large-vision-language-models-token-level-hallucination-evidence-distributed-across
ref: CLM-0579
capability: visual-grounding
technique: read-whole-computational-trace-graph-one-hidden-state
statement: >-
  In frozen large vision-language models, token-level hallucination evidence
  is distributed across the relational, spatial and sequential structure of
  the model's internal trace rather than contained in any single token's
  hidden state, so a detector that reads the attention graph over image
  patches, query and response tokens with interleaved GNN/ViT/GRU modules
  localizes hallucinated spans better than flat probes on the same
  activations.
