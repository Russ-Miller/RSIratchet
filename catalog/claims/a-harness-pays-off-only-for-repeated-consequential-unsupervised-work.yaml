id: a-harness-pays-off-only-for-repeated-consequential-unsupervised-work
ref: CLM-0008
capability: harness-self-improvement
statement: >-
  Guides, sensors and checkpoints pay for themselves only when the same
  workflow runs repeatedly, mistakes have real consequences, and no person
  is watching each run; single-turn questions, brainstorming and one-off
  tasks gain nothing from them and pay their cost in tokens and setup — so
  the decision to build a harness is a decision about the shape of the
  work, not about the model.
tags: [agentic]
kind: mechanism
backing_strength: mechanism-reasoning
sources:
  - source: synthesis-2026-harness-engineering-playbook
    stance: supports
    note: >-
      "When not to build a harness": earns its cost when the workflow
      repeats, failures matter, the agent runs unsupervised, or sessions
      accumulate; one-off and exploratory work does not benefit. Argued,
      not measured.
  - source: veremeyenko-2026-hashimotos-rule
    stance: supports
    note: >-
      Restates the playbook's line: one-off questions and brainstorming
      don't need any of this; the harness earns its cost when the same
      workflow runs repeatedly, mistakes have consequences, and nobody is
      watching. Secondary.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  The scoping half of Hashimoto's rule. "Every mistake becomes a permanent
  fix" presumes there will be a next run for the fix to apply to; where
  there is not, the fix is pure cost. This is also why the
  repository-context-file result (no lift on one-shot benchmark tasks) is
  compatible with the rule rather than a refutation of it: benchmark tasks
  are one-offs by construction.

  Untested: nobody has measured the crossover, the number of repetitions at
  which a harness's setup and per-run cost is repaid. That number would
  turn this from a rule of thumb into a decision procedure.
submitted_by: agent:claude-opus-5@Russ-Miller
