    stance: supports
    note: >-
      Validated by: Success rate and goal-condition rate plus
      path-length-weighted variants on DynAfford test seen/unseen against
      unmodified FILM, CAPEAM, MOCA, LLM-Planner and SayCan; FILM unseen SR
      9.34 to 16.18, CAPEAM 19.39 to 21.10; ablations removing LoRA
      fine-tuning (27.69 to 16.07 SR) and multimodal in-context exemplars
      (to 6.15).. Measured on one benchmark the authors built, 2,076 test
      tasks, five baselines plus two ADAPT integrations, single
      deterministic run with no seeds or confidence intervals. [truncated]
