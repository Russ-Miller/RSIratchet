id: instruction-following-household-agents-simulated-environments-where-target-object-s
ref: CLM-0845
capability: embodied-control
technique: check-action-applicability-before-executing-then-defer
statement: >-
  For instruction-following household agents in simulated environments where
  a target object's usability can be violated at runtime (occupied
  appliance, dirty cloth, used container) without the instruction saying so,
  intercepting each planned high-level action with an affordance check and
  deferring it until the precondition is resolved raises success and
  goal-condition rates over the same planners run unchanged, but the
  remaining gap is in visual state inference rather than planning: a
  symbolic heuristic given ground-truth simulator state scores far higher
  than the vision-based module (46.15% vs 27.69% SR on test unseen).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "AI2-THOR household tasks built on the ALFRED pipeline, three injected affordance categories (occupied, used, dirty), FILM and CAPEAM base planners, single-view egocentric observati"
