id: two-embodied-agents-must-guide-or-mislead-each-other
ref: CLM-0503
capability: embodied-control
statement: >-
  When two embodied agents must guide or mislead each other through
  movement, gaze and facial expression in a virtual environment, open-source
  VLMs up to 15B parameters do not convert imposed theory-of-mind
  constraints into matching behavior: most fail to produce directionally
  coherent nonverbal signals, and the few that do (e.g. internvl-14b,
  qwenvl-4b) are not decoded by the receiving agent, whose final choice
  tracks a fixed spatial preference instead.
kind: observation
backing_strength: single-paper
observed_on:
  era: "11 open-source VLMs plus a text-only baseline, at most 15B parameters, 200 trials per model, one interaction scenario (hidden reward in one of two boxes), cooperative/competitive c"
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured: trial-level ToM outcome conformance plus four signal-level
      metrics (trajectory, gaze, facial expressivity, signal sensitivity)
      across 4 conditions, 50 trials each, 13 models. Positional bias and
      uncertainty rate are reported to rule out degenerate strategies; three
      models could not even drive movement. A hybrid architecture with an
      explicit ToM module (PCM-LLM) cleared both bottlenecks, showing the
      task is solvable, but it is not a like-for-like comparator. Single
      scenario, no human reference.
contested: false
status: pending-review
last_checked_at: 2026-10-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A VLM in this size class
  showing condition-sensitive signal production and a signal sensitivity
  score that inverts between cooperative and competitive-ToM1 conditions,
  with low positional bias.
