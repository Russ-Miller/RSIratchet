id: 3b-8b-open-instruct-backbones-acting-text-based-interactive-environments-scienceworld
ref: CLM-0534
capability: multi-model-coordination
technique: separate-adapters-sft-planner-rl-executor
statement: >-
  For 3B-8B open instruct backbones acting in text-based interactive
  environments (ScienceWorld, ALFWorld, TextCraft), splitting the agent into
  a sub-goal planner trained by supervised fine-tuning and an action
  executor trained by offline-then-online RL, each on its own LoRA adapter,
  scores higher at pass@1 than a hierarchical baseline that separates roles
  by prompt while sharing one adapter, and the gain is largest on the
  hardest, longest tasks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text interactive benchmarks with hierarchical sub-goal training data available; 1.5B-8B open backbones; single-rollout pass@1 scoring."
sources:
  - source: arxiv-2606-03698
    stance: supports
    note: >-
      Validated by: Pass@1 on in-distribution and out-of-distribution splits
      of ScienceWorld, ALFWorld and TextCraft across three backbones,
      against ReAct, Reflexion, ADaPT, GRPO and Glider; ablations swapping
      which system gets SFT versus RL, flat versus hierarchical, and shared
      versus role-specific adapters.. Measured on three environments and
      three backbones with pass@1 and ID/OOD splits, plus component
      ablations on ScienceWorld with Llama-3.1 8B. [truncated]
