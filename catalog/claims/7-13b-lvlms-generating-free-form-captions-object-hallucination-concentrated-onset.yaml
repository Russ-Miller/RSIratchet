id: 7-13b-lvlms-generating-free-form-captions-object-hallucination-concentrated-onset
ref: CLM-1005
capability: visual-grounding
technique: intervene-semantic-phrase-onsets-using-distilled-self-reward
statement: >-
  In 7-13B LVLMs generating free-form captions, object hallucination is
  concentrated at the onset of each semantic phrase and declines for later
  tokens within that phrase, so triggering correction only at phase onsets
  lowers hallucination rates more than contrastive decoding applied
  uniformly at every step.
