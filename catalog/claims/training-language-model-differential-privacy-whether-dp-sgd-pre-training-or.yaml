id: training-language-model-differential-privacy-whether-dp-sgd-pre-training-or
ref: CLM-0177
capability: hallucination
statement: >-
  Training a language model with differential privacy — whether DP-SGD
  pre-training or DP LoRA fine-tuning — makes it generate more false claims
  about facts in its training data than a non-private counterpart, and the
  effect grows as the privacy budget tightens, because per-example gradient
  clipping plus noise prevents low-frequency facts from being acquired at
  all while flattening the next-token distribution onto incorrect
  alternatives.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Open-ended long-form generation of Wikipedia-style articles, scored by atomic-claim verification; GPT-J 6B fine-tuned at epsilon 8 and 16, and VaultGemma-1B pre-trained at epsilon "
sources:
  - source: arxiv-2609-00492
    stance: supports
    note: >-
      FactScore on three Wikipedia sets plus human annotation by 5 graduate
      students on 30 stratified AI articles; ordering non-DP > eps=16 >
      eps=8 held on both datasets, though one comparison was not significant
      and eps=8 was near the untrained base model on the AI set. Mechanism
      supported by nucleus/entropy measurements and a synthetic bigram
      replication rather than by intervention. Model-human agreement on
      claim support was low, so the automated metric is an imperfect proxy.
