notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A run where claim-level
  decomposition plus post-hoc calibration gives lower ECE than
  response-level temperature scaling on false-premise questions across most
  models, or where it fails to beat uncalibrated baselines on ordinary
  factual QA. Drafted stance toward
  abstention-rule-built-self-consistency-where-model-samples-several-answers:
  supports -- Both find self-consistency-derived confidence usable for
  abstention decisions, and this paper adds that the signal collapses when
  the model's errors are systematic rather than variable.
