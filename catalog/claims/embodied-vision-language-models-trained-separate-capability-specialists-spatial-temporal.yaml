id: embodied-vision-language-models-trained-separate-capability-specialists-spatial-temporal
ref: CLM-0585
capability: embodied-control
technique: merge-capability-specialists-then-distil-student-prefixes
statement: >-
  For embodied vision-language models trained as separate capability
  specialists (spatial, temporal, action guidance, state verification) from
  one backbone, consolidating them by TIES weight merging and then routed
  multi-teacher on-policy distillation retains more of each specialist's
  gain than either step alone or than mixed-data RL, which shows
  capability-specific biases.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two Qwen backbones (35B-A3B MoE, 2B dense); specialists trained with GRPO on verifiable rewards; retention measured on eight signature benchmarks under matched prompts and scorers."
sources:
  - source: arxiv-2608-06756
    stance: supports
    note: >-
      Validated by: Controlled ablation on 35B-A3B against the shared
      backbone, four standalone experts, Mix-RL, TIES-only and MOPD-only
      across eight capability benchmarks; TIES+MOPD best on 3 of 8 and
      second on the other 5, improving 7 of 8 over MOPD alone. Also 28/34
      and 30/34 matched benchmark rows improved over the Qwen
      initialisations, and EB-HAB success 46.0 to 63.0.. Measured on the
      authors' own harness with matched decoding per pair; [truncated]
