id: chart-to-code-tasks-built-authentic-large-datasets-multi-panel-composite-layouts
ref: CLM-1072
capability: code-generation
statement: >-
  On chart-to-code tasks built from authentic large datasets with
  multi-panel composite layouts, current VLMs score far below their results
  on single-panel chart-to-code benchmarks, and the failure modes split by
  model class: open-weight models fail mostly at execution (hallucinated
  libraries, invalid functions) and spatial layout, while proprietary models
  execute cleanly and fail at mapping data series to the right axes and
  attributes.
kind: observation
backing_strength: single-paper
observed_on:
  era: "14 proprietary and open-weight VLMs, Matplotlib code only, 2,896 instances across replication, reproduction from raw data, and multi-turn refinement; scored by a multi-agent judge "
sources:
  - source: arxiv-2603-25804
    stance: supports
    note: >-
      Measured: 14 models, three tasks, three runs averaged, greedy
      decoding. Open-weight models drop from ~75-85 normalized on ChartMimic
      to under 25 on the new benchmark; proprietary Gemini-3-Pro from >91%
      to ~50%. Error-type split is from a categorized analysis of failure
      cases, reported as proportions without per-model statistics. Judge
      reliability checked on 600 sampled tasks from one model only (Cohen's
      kappa 0.83), so judge validation does not cover all models. Scores are
      on the authors' own benchmark, so the degradation is partly a
      construction choice.
contested: false
status: pending-review
last_checked_at: 2026-11-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model set evaluated on
  both benchmark families where ranking and absolute normalized scores on
  complex multi-panel real-data charts track those on ChartMimic/Plot2Code,
  or where open-weight and proprietary models show the same error-type
  distribution.
