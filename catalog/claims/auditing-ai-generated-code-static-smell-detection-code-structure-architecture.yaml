id: auditing-ai-generated-code-static-smell-detection-code-structure-architecture
ref: CLM-0293
capability: software-architecture
statement: >-
  Auditing AI-generated code with static smell detection at code, structure
  and architecture level, from single-file tasks up to agent-built systems,
  more capable models produced more bloated and more coupled code, code
  volume was a near-perfect predictor of structural decay, and neither
  functional correctness nor more detailed prompting reduced it, so passing
  tests does not indicate maintainable design.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Python solutions from several LLMs and agent frameworks, PyExamine smell detection, zero- and few-shot, 2026; Spearman correlations."
sources:
  - source: arxiv-2605-02741
    stance: supports
    note: >-
      'Near-perfect' is the authors' description of a correlation; the
      reasoning-complexity trade-off is asserted across models without a
      controlled capability axis.
