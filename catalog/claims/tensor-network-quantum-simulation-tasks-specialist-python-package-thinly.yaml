id: tensor-network-quantum-simulation-tasks-specialist-python-package-thinly
ref: CLM-1079
capability: multi-model-coordination
technique: curated-package-docs-prompt-plus-role-split-simulation
statement: >-
  For tensor network quantum simulation tasks with a specialist Python
  package thinly covered in pretraining, embedding ~43k tokens of curated
  package documentation in the system prompt is the larger of two gains, and
  splitting the workflow into seven role-specialized agents with isolated
  contexts adds a further gain on top of it, across DeepSeek-V3.2, Gemini
  2.5 Pro and Claude Opus 4.5.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three benchmark tasks (2D transverse-field Ising DMRG, sub-Ohmic spin-boson TDVP dynamics, retinal photoisomerization), 5 runs each per model-configuration, scored 0-10 by the auth"
sources:
  - source: arxiv-2601-10194
    stance: supports
    note: >-
      Validated by: 0-10 rubric scores over 3 tasks x 5 runs x 3 LLM
      backends against a no-documentation single-agent baseline and a
      documentation-only single-agent baseline; multi-agent reached ~90%
      success overall, DeepSeek-V3.2 averaging 9.47 with 87% perfect runs,
      Gemini 2.5 Pro rising from 0.87 baseline to 8.13; score deductions
      decomposed by error type.. Measured, but small: 5 runs per cell,
      scored by a rubric the authors designed, with no inter-rater
      reliability reported and no compute- or token-matched control (the
      multi-agent arm also spends far more tokens). [truncated]
