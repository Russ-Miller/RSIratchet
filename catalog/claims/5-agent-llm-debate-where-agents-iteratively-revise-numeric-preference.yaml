id: 5-agent-llm-debate-where-agents-iteratively-revise-numeric-preference
ref: CLM-0539
capability: multi-model-coordination
technique: switch-dense-sparse-agent-topology-disagreement-falls
statement: >-
  In a 5-agent LLM debate where agents iteratively revise a numeric
  preference vector, switching from all-to-all to ring communication once
  aggregate disagreement falls below a threshold reaches consensus using
  fewer tokens than all-to-all throughout and in fewer rounds than
  ring-only, but it does not dominate for every backbone: with Gemini
  2.5-Flash all-to-all throughout converged in fewer rounds than the
  adaptive policy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five role-conditioned agents on one software-architecture planning prompt, 6-dimensional preference vectors, three backbones (GPT-5.4-Mini, Gemini 2.5-Flash, Claude Opus-4.8), one "
sources:
  - source: arxiv-2608-25099
    stance: supports
    note: >-
      Validated by: Rounds-to-consensus and total input tokens for adaptive
      vs complete-only vs ring-only, on one planning task with three LLM
      backbones; adaptive used 41,727 tokens / 9 rounds for GPT vs 67,593 /
      12 complete-only and 60,858 / 17 ring-only; Claude under complete-only
      exhausted the 100,000-token budget. No repeated trials or statistical
      test.. Measured, but on a single prompt with one run per cell and no
      variance reported; token counts were rescaled by hand-chosen constants
      per model to fit a common budget, so cross-model cost comparison is
      not meaningful. [truncated]
