id: 7-8b-video-llms-inference-time-hallucination-intervention-only-effective-layer
ref: CLM-0803
capability: hallucination
technique: repair-grounding-middle-layers-only-risky-tokens
statement: >-
  For 7-8B video LLMs, inference-time hallucination intervention is only
  effective when it is layer- and step-selective: reinjecting
  token-conditioned visual evidence into grounding-sensitive middle decoder
  layers at high-uncertainty decoding steps lowers event-hallucination
  error, while applying the same intervention at every token or at late
  layers gives little or no gain over the untouched baseline.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Three 7-8B video-LLM backbones (LLaVA-Video-7B, InternVL2.5-8B, Qwen2.5-VL-7B) on multiple-choice hallucination and video-QA benchmarks; middle layers defined as decoder layers 5-1"
sources:
  - source: arxiv-2604-03045
    stance: supports
    note: >-
      Validated by: Accuracy on EventHallusion, VidHalluc, NExT-QA and
      MVBench across three backbones against VCD, MemVR, TCD and DINO-HEAL
      baselines, plus ablations removing the uncertainty trigger (54.77 to
      48.41 on EventHallusion) and relocating reinjection to early (49.63)
      or late (47.19, below the 47.43 baseline) layers.. Measured on four
      benchmarks and three backbones with four inference-time baselines;
