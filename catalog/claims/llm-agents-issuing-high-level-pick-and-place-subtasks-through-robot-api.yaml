notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A 7-8B open model that
  matches or exceeds its own code-generation success rate under step-by-step
  tool calling on the same instruction set, or a large model whose
  tool-calling success collapses relative to code generation.
