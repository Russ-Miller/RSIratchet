id: preregistered-experiment-1-500-uk-adults-persuasive-chatbot-shifted
ref: CLM-0316
capability: persuasion
statement: >-
  In a preregistered experiment with 1,500 UK adults, a persuasive chatbot
  shifted attitudes on policy issues by about 12.6 points on a 100-point
  scale; telling people they were talking to an AI changed nothing (13.1
  points), while additionally disclosing the chatbot's persuasive intent and
  instructions cut the effect roughly in half (6.3 points).
kind: observation
backing_strength: single-paper
observed_on:
  era: "60 policy issues, identical chatbot across conditions, 2026; UK adults; single short conversation."
sources:
  - source: arxiv-2608-11794
    stance: supports
    note: >-
      Clean three-arm design; whether the halving persists when disclosure
      becomes routine is untested.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where
  identity disclosure alone reduces persuasion, or intent disclosure that
  loses its effect on repeat exposure.
