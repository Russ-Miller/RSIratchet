id: generational-genetic-search-over-llm-agent-generated-scientific-hypotheses-drug-repurposing
ref: CLM-0389
capability: multi-model-coordination
technique: coordinate-hypothesis-agents-generational-genetic-algorithm
statement: >-
  In a generational genetic search over LLM-agent-generated scientific
  hypotheses (drug repurposing across 34 cancer types), replacing
  fitness-guided parent selection with uniform random selection while
  holding the scientific roles, variation operators and hypothesis count
  fixed lowers the population's mean and minimum external evidence scores
  but leaves the maximum unchanged, and removing crossover or mutation
  altogether produces mixed shifts that do not survive multiple-testing
  correction — so the selection rule, not the semantic variation operators,
  is where the measurable coordination gain sits.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One base model (gpt-5.4-mini), population 6, 3 generations, drug repurposing hypotheses scored post hoc by DepMap selectivity and Open Targets association; operator ablations on on"
sources:
  - source: arxiv-2609-15938
    stance: supports
    note: >-
      Validated by: Mean DepMap selectivity 0.171 and Open Targets
      association 0.426 versus 0.115/0.329 for the strongest of six
      task-matched baselines (Tree of Thoughts) and 0.039/0.163 for
      single-pass generation, on 26 and 29 shared cancer types with the
      selected hypothesis chosen before external scoring; gains repeated on
      27 held-out cancer types.. Measured: 94 runs, 34 cancer types, two
      post-hoc biological metrics never used as search fitness, six
      shared-protocol baselines. The selection ablation is the only clean
      single-variable comparison; [truncated]
