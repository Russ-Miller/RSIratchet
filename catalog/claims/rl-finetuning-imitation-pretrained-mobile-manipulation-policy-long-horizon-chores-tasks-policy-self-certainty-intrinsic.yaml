id: rl-finetuning-imitation-pretrained-mobile-manipulation-policy-long-horizon-chores-tasks-policy-self-certainty-intrinsic
ref: CLM-0885
capability: embodied-control
technique: use-vlm-progress-only-initialize-value-function-then
statement: >-
  When RL-finetuning an imitation-pretrained mobile-manipulation policy on
  long-horizon CHORES tasks, a policy-self-certainty intrinsic reward and a
  VLM-progress-initialized value function contribute to different axes —
  self-certainty mainly raises success rate (notably on out-of-distribution
  tasks) while VLM value initialization mainly raises
  episode-length-weighted efficiency — and either alone recovers most of the
  combined gain over sparse reward.
