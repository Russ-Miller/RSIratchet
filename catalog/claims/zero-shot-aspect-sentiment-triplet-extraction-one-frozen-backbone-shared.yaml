id: zero-shot-aspect-sentiment-triplet-extraction-one-frozen-backbone-shared
ref: CLM-0714
capability: multi-model-coordination
technique: sequentially-conditioned-agents-triplet-set-consistency-check
statement: >-
  For zero-shot aspect sentiment triplet extraction with one frozen backbone
  shared across stages, splitting the task into sequentially conditioned
  agents (aspect, then aspect-conditioned opinion, then sentiment, then a
  triplet-set consistency check) raises exact-match F1 well above
  single-pass zero-shot and chain-of-thought prompting on the same backbone,
  and the gain comes mainly from precision rather than recall.
kind: mechanism
