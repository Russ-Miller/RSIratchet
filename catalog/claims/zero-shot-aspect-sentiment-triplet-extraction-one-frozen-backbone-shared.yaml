    note: >-
      Validated by: Precision/recall/F1 on four ASTE-Data-V2 datasets
      against GPT-4o zero-shot, few-shot, CoT and CoT+few-shot with the same
      backbone (e.g. 72.31 vs 35.37 F1 on 14Res; +12.8 to +15.5 F1 over
      few-shot), plus ablations removing each agent and five additional
      backbones.. Measured on four benchmarks with matched backbone
      baselines, plus agent ablations (average F1 67.28 full vs 40.76 with
