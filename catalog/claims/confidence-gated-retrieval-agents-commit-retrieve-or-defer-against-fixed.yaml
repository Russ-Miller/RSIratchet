      confidence under an identical policy, budget and cost model on 2,457
      test episodes across three models and two datasets, reporting overall
      accuracy, committed accuracy, coverage and mean retrieval actions
      jointly; no external baseline protocol compared.. Measured on 1,852
      HotpotQA and 605 MuSiQue episodes, three models, deterministic
      temperature-zero single generations, LLM judge for correctness with no
      human validation. [truncated]
