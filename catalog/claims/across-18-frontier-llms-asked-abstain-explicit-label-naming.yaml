id: across-18-frontier-llms-asked-abstain-explicit-label-naming
ref: CLM-1061
capability: abstention-and-self-knowledge
technique: reward-honest-attribution-uncertainty-type-rl
statement: >-
  Across 18 frontier LLMs asked to abstain with an explicit label naming
  why, recognizing that a question is underspecified is far easier than
  recognizing that a well-posed question exceeds the model's own capability
  (e.g. Qwen3-8B 69.8 data-uncertainty F1 vs 4.0 model-uncertainty F1 on
  knowledge-intensive tasks), and enabling thinking mode often makes the
  capability-limit side worse (Qwen3-235B on reasoning: 84.8 to 0.0).
kind: observation
backing_strength: single-paper
observed_on:
  era: "3,500+ questions from GAIA, MuSiQue, SelfAware, OlympiadBench-math, GSM8K-MiP, MATH-MiP; abstention expressed as one of two designated tokens; model uncertainty defined dynamically"
sources:
  - source: arxiv-2604-17293
    stance: supports
    note: >-
      Validated by: On Qwen3-4B-Instruct-2507 and Qwen3-8B (thinking),
      raised average uncertainty-attribution F1 (4B reasoning tasks 45.9 to
      61.0; 8B 33.0 to 63.5) over the backbone and over an answerable-only
      RL baseline, with answer accuracy unchanged; trained only on math,
      evaluated across all UA-Bench settings.. Measured on a new benchmark
      across 18 models with rule-based extraction of the abstention token
      plus an LLM judge only for answer correctness (100 sampled outputs
      manually checked, 1 judge mismatch). [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
