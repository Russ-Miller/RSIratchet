id: latent-factor-models-fitted-large-collections-llm-benchmark-scores
ref: CLM-1012
capability: evaluation-validity
technique: model-scale-upstream-cause-latent-capabilities
statement: >-
  When latent factor models are fitted to large collections of LLM benchmark
  scores, the dominant extracted 'general capability' factor is largely a
  proxy for model scale, because the models treat only benchmark scores and
  latent capabilities as variables and leave scale unmodelled; placing scale
  as an upstream cause of the capabilities instead yields capability
  estimates that fit more parsimoniously and generalise better to held-out
  benchmarks.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Populations of open-weight LLMs spanning a wide parameter range scored on a shared benchmark suite (here 19 BIG-Bench Hard subtasks over 4,395 OpenLLM Leaderboard models); does not"
sources:
  - source: arxiv-2602-15532
    stance: supports
    note: >-
      Validated by: Compared against pure exploratory factor analysis on
      parsimonious fit indices (CFI/TLI/RMSEA) and against PCA-based
      observational scaling laws on prediction error for a held-out
      out-of-distribution benchmark, using OpenLLM Leaderboard BBH scores
      for 4,395 models.. Argued from the mathematical relation between
      factor models and PCA plus reported scale correlations in two prior
      studies (r=0.70 with log parameters in one; ~25% of factor variance in
      the other), and tested by fitting three models on one benchmark suite
      (19 BBH subtasks, 4,395 models). [truncated]
