id: llm-agents-repetitive-business-workflows-generating-plan-retrieving-semantically
ref: CLM-1133
capability: planning
technique: rewrite-only-variable-nodes-retrieved-past-workflow
statement: >-
  For LLM agents on repetitive business workflows, generating a plan by
  retrieving a semantically similar past execution trajectory and
  regenerating only its variable nodes should cost fewer tokens than
  re-planning from scratch, because the structural skeleton of the plan is
  stable across queries that differ only in phrasing or parameters.
kind: mechanism
backing_strength: mechanism-reasoning
observed_on:
  era: "High-frequency, repetitive task domains where many queries map onto the same workflow topology; the paper reports no quantitative experiments and only estimates savings."
sources:
  - source: arxiv-2604-19756
    stance: supports
    note: >-
      Validated by: Not measured. The paper gives only a qualitative table
      against three baselines (real-time planning, static single trajectory,
      in-context learning) plus unsupported 'preliminary estimates' of >40%
      token reduction and a 20% success-rate gain on medium-similarity
      queries; no dataset, no runs, no numbers.. Argued only. The authors
      state explicitly that no quantitative experiments were conducted
      because the dataset is not yet built; [truncated]
