id: formal-persuasion-dialogues-uk-political-topic-llm-debaters-judged
ref: CLM-0602
capability: persuasion
statement: >-
  In formal persuasion dialogues on a UK political topic, LLM debaters are
  judged more persuasive than humans by crowd annotators (all nine LLM
  configurations occupied the top nine subjective ranks) while ranking far
  lower under argumentation-theoretic adjudication, where a human topped the
  logical ranking and humans took six of the top ten.
kind: observation
backing_strength: single-paper
observed_on:
  era: "192 debates on a single fixed UK political topic, 22 interlocutors (13 undergraduates, 9 configurations of GPT-4o, Grok-3, Mistral Medium), Bradley-Terry rankings from 9,702 crowd "
sources:
  - source: arxiv-2608-29738
    stance: supports
    note: >-
      Measured: two Bradley-Terry rankings over the same 22 interlocutors,
      192 adjudicated debates and 1,386 annotation instances with 7
      annotators each; ordinal Krippendorff's alpha between the rankings
      0.410. Weakly isolated: logical outcomes are self-adjudicated by the
      debating LLM, the logical win matrix is sparse, one high-ranking model
      never debated a human, and the authors report no significance testing.
      Inter-rater agreement on persuasiveness was low (nominal alpha 0.188)
      though aggregate rankings were stable across demographic subgroups.
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A replication with an
  independent neutral adjudicator and a denser win matrix showing LLM
  configurations ranking as highly on formal adjudication as on crowd
  judgement, or showing the gap is explained by sparsity of pairings rather
  than by argument quality.
