id: 102-ipc-blocksworld-instances-180-second-budget-classical-planner-fast
ref: CLM-0283
capability: planning
statement: >-
  On 102 IPC Blocksworld instances with a 180-second budget, a classical
  planner (Fast Downward) solved 85%, a model planning directly solved 64%,
  and the same model choosing one action at a time against a PDDL simulator
  with observe, reset and retry solved 67%, a consistent but small
  three-point gain at about 5.7 times the token cost, so interactive
  simulation helps a little and classical search still wins where a formal
  model exists.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Claude Haiku 4.5, Blocksworld only, PyPDDLEngine over MCP, 2026; uniform time budget."
sources:
  - source: arxiv-2603-06064
    stance: supports
    note: >-
      One small model and one domain; the cost-benefit ratio is the point,
      and the classical baseline's dominance matches PlanBench-era findings.
