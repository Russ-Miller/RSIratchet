id: long-multilingual-documents-8k-128k-tokens-six-un-languages-current
ref: CLM-0430
capability: long-context-degradation
statement: >-
  On long multilingual documents (8K-128K tokens, six UN languages), current
  LLMs score far higher on word-level span extraction than on sentence-,
  paragraph- and document-level tasks, and the familiar middle-of-context
  dip appears only at word and paragraph level — at sentence level accuracy
  peaks in the middle, because mid-document sentences carry concrete entity
  overlap that models match on instead of reasoning about discourse role.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot evaluation of 12 long-context LLMs on UN reports of 8K-128K tokens in Arabic, Chinese, English, French, Russian, Spanish; accuracy for word/sentence tasks, ROUGE-L and BL"
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured: 12 models, 420 items per task per language, six languages;
      averages 73.1/72.6 on word QA versus 21.1 cloze, 15.1 paragraph
      filling. Cross-granularity numbers use different metrics (accuracy vs
      ROUGE-L vs BLEU), so the fine-versus-coarse gap is not a like-for-like
      comparison. The surface-cue explanation for the mid-position sentence
      peak comes from LLM-plus-human error categorization on cases most
      models failed, not a controlled manipulation of lexical overlap.
contested: false
status: pending-review
last_checked_at: 2026-10-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A comparable benchmark
  where models score as well on paragraph/document-level recovery as on
  word-level extraction, or where sentence-level cloze also dips in the
  middle once distractor lexical overlap is balanced across positions.
  Automatic check flagged: figures not in the source: 73.1, 21.1.
