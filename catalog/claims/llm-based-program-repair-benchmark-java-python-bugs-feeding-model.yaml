id: llm-based-program-repair-benchmark-java-python-bugs-feeding-model
ref: CLM-0837
capability: debugging
technique: have-model-instrument-buggy-function-read-own-runtime
statement: >-
  For LLM-based program repair on benchmark Java and Python bugs, feeding
  the model intermediate runtime values captured by print statements it
  inserted itself into the buggy function repairs more bugs than iterating
  on outcome-level failure symptoms (stack traces, test errors) alone,
  because the symptom reveals where the failure surfaced but not which
  variable carried the wrong value.
