id: living-forecasting-benchmarks-retrieve-auxiliary-news-automated-search-measurable
ref: CLM-0852
capability: evaluation-validity
technique: filter-retrieved-events-dual-agent-date-authenticity-consensus
statement: >-
  In living forecasting benchmarks that retrieve auxiliary news by automated
  search, a measurable share of retrieved events leak post-cutoff outcomes
  (retrospective summaries, misdated articles) unless the retrieval is
  filtered, and requiring two independent fact-checking agents to agree on
  both factual authenticity and publication date cuts that leakage
  several-fold.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Event-augmented forecasting across five domains (markets, commodities, electricity, weather, Polymarket events); leakage judged by domain experts on 500 sampled tasks."
sources:
  - source: arxiv-2605-16358
    stance: supports
    note: >-
      Validated by: 47 domain experts (mean 13.6 years experience) audited
      500 tasks: unfiltered automated search matched verified publication
      dates in 61.0% of tasks and leaked future information in 8.6%; with
      the dual-agent filter, date accuracy rose to 81.0% and leakage fell to
      1.6% (8 tasks), 5 of which were off by one calendar day against 3- and
      7-day horizons. 1.6% of surviving events were judged fabrications,
      with 0% false-negative exclusion.. Measured by human expert annotation
      on 500 tasks (100 per domain) against a no-filter baseline on the same
      pipeline. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-06
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An expert audit of
  unfiltered automated retrieval in these domains finding leakage at or
  below the filtered rate, or a dual-agent consensus filter that fails to
  reduce measured leakage relative to single-agent or no filtering. Drafted
  stance toward
  across-llm-based-forecasting-systems-reported-accuracy-gains-frequently-cannot:
  supports -- It measures one of the named confounds directly — retrieval
  that reveals post-cutoff outcomes — and shows it occurs at a non-trivial
  rate in unaudited automated search.
