id: small-nano-scale-llms-generating-openacc-pragmas-c-kernels
ref: CLM-1226
capability: harness-self-improvement
technique: evolve-prompts-normalized-pragma-clause-mismatches
statement: >-
  For small 'nano'-scale LLMs generating OpenACC pragmas for C kernels,
  evolving the prompt from structured clause- and parameter-level mismatches
  against expert-curated gold pragmas raises compilation success sharply
  (GPT-4.1 Nano 66.7% to 93.3%, GPT-5 Nano 86.7% to 100% on 30 PolyBench
  kernels) while leaving peak kernel speedups flat or slightly lower,
  because the optimizer selects safer, more portable directives over
  aggressive hardware-mapping clauses.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-file PolyBench kernels with no inter-procedural data dependencies; four OpenAI model variants; NVIDIA nvc on one RTX 4070; gold pragmas hand-tuned with Nsight."
sources:
  - source: arxiv-2601-08884
    stance: supports
    note: >-
      Validated by: Compilation success over 120 model-benchmark pairs
      (78.3% to 95.8% aggregate, zero regressions) and count of benchmarks
      with speedup >1x (67 to 81); mean speedup on the commonly-compiling
      subset reported separately and mixed by model.. Measured: 30 PolyBench
      kernels x 4 models, best-of-5 runs, initial vs optimized prompt. No
      ablation separating the structured clause feedback from the GEPA
      search itself, and no held-out benchmark suite — prompts were
      optimized on 64 curated gold examples and evaluated on PolyBench,
      which was excluded from the gold corpus. [truncated]
