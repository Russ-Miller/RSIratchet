id: video-mllms-post-trained-grpo-including-small-minority-reversed-order-video
ref: CLM-0504
capability: video-temporal-reasoning
technique: mix-reversed-video-rollouts-into-grpo-group
statement: >-
  For video MLLMs post-trained with GRPO, including a small minority of
  reversed-order video rollouts in each sampling group (1 of 7) raises
  accuracy on action-centric and temporal-reasoning benchmarks over
  all-forward GRPO, while larger reversed proportions (2 or 3 of 7) give
  smaller gains and static-perception accuracy does not improve.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3-VL 2B/4B/8B and InternVL2.5-8B with an added direction-preserving motion branch, trained on Video-R1 splits, evaluated on 1,000-sample subsets of STAR, SSv2, NExT-QA, CLEVRER"
sources:
  - source: arxiv-2608-21030
    stance: supports
    note: >-
      Validated by: From an identical Stage-I checkpoint (Qwen3-VL-8B),
      average accuracy over six benchmarks: 76.5 before RL, 78.0 with
      standard GRPO (7 forward), 78.8 with 6+1, 78.4 with 5+2, 77.6 with
      4+3; forward and reversed accuracy tracked over training.. Measured on
      one backbone (8B) for the optimization ablation, with main results
      across four backbones; the reversed-ratio sweep is a single run per
      setting with no variance reported, and the motion-branch architecture
      is confounded with the RL change in the main table.
