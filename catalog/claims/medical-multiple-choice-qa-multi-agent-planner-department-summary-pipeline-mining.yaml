id: medical-multiple-choice-qa-multi-agent-planner-department-summary-pipeline-mining
ref: CLM-0342
capability: harness-self-improvement
technique: mine-trajectories-into-three-level-experience-library
statement: >-
  For medical multiple-choice QA with a multi-agent
  planner/department/summary pipeline, mining natural-language lessons from
  its own labelled reasoning trajectories into a three-level library
  (principles, patterns, cases) and retrieving them at inference raises
  accuracy over the same pipeline without experience, with abstract
  principle-level entries contributing more than concrete stored cases.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-only medical multiple-choice benchmarks (MedQA, MedMCQA, PubMedQA, MMLU/MMLU-Pro medical subsets), Qwen3-8B and GPT-4o backbones, five mining iterations, and mining requires g"
sources:
  - source: arxiv-2609-15161
    stance: supports
    note: >-
      Validated by: Accuracy on nine medical QA sets against single-LLM,
      static multi-agent (MedAgents, MDAgents) and experience-based (ExpeL,
      ReasoningBank, G-Memory, MDTeamGPT, EvolveR) baselines; average
      accuracy 81.1 vs 77.8 for MDAgents on Qwen3-8B and 93.9 vs 92.4 on
      GPT-4o; ablations removing experience (-6.7 on MedQA) and each
      hierarchy level (cases -1.2, patterns -2.5, principles -4.6)..
      Measured on nine benchmarks with two backbones, averaged over three
      runs, with component and hierarchy ablations and
      cross-model/cross-dataset transfer tables. [truncated]
contested: false
