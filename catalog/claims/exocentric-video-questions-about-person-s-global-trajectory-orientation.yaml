id: exocentric-video-questions-about-person-s-global-trajectory-orientation
ref: CLM-0601
capability: video-temporal-reasoning
technique: supervise-global-motion-reasoning-world-consistent-3d-tracks
statement: >-
  On exocentric video questions about a person's global trajectory and
  orientation in a first-frame-anchored world frame over 20-60 second clips,
  current proprietary and open video MLLMs score close to random chance
  (best zero-shot chance-normalized score about 16 on the EMDB split, versus
  about 79 for humans), with the worst performance on counting motion
  events, temporal ordering, and long-horizon displacement aggregation.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Multiple-choice QA generated deterministically from 3D SMPL-X motion tracks over EMDB, RICH and EgoBody videos; single-person motion only; no multi-person interaction."
sources:
  - source: arxiv-2606-27999
    stance: supports
    note: >-
      Validated by: Fine-tuning Qwen3-VL 8B on the generated data raised the
      chance-normalized score on EMDB from 12.83 to 37.88, with gains of
      +40.9pp on Numerical and +22.6pp on Trajectory Affordance; joint
      training across all seven categories beat per-category specialists..
      Measured on a 10,203-item benchmark across three source datasets, with
      per-category random-chance normalization and a human subset baseline;
      a text-only Gemini baseline scored 8.5, above GPT-4o, indicating some
      language-prior leakage. [truncated]
