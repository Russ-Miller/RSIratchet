    stance: supports
    note: >-
      Validated by: Accuracy on HaluEval dialogue/summarization/QA and FEVER
      across six models versus KNN, clustering, BM25, perplexity, SA-ICL,
      AdaICL and Top-k+Con-E baselines at equal shot count; gains up to 9.9
      points on Mistral-7B dialogue/summarization, with BM25 ahead on some
      QA settings at small scale. Single run, temperature 0.. Measured on
      two benchmarks, four task splits, eight models, against seven
      selection baselines, but single-run deterministic accuracy with no
      variance reported, no seeds, and margins on several models are 1-2
      points and within plausible noise; [truncated]
