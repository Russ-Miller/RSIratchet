id: selecting-in-context-demonstrations-hallucination-detection-frozen-2-7b-32b-llms
ref: CLM-1063
capability: hallucination
technique: select-icl-examples-prototype-distance-learned-low-dim
statement: >-
  When selecting in-context demonstrations for hallucination detection with
  frozen 2.7B-32B LLMs, choosing examples nearest to class prototypes
  learned in a compressed latent geometry beats lexical (BM25), perplexity,
  clustering and adaptive-ICL selection on dialogue and summarization
  judgments, while lexical retrieval stays competitive on QA items that ship
  an explicit supporting evidence snippet.
kind: observation
backing_strength: single-paper
