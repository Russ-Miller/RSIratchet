    stance: supports
    note: >-
      Validated by: Not measured; the survey argues for it from the
      asymmetry between mature attack literature and jailbreak-only
      defenses.. Argued, not measured: a survey synthesizing reported
      attacks (Multi-AudioJail, StyleBreak, WhisperInject, JALMBench) and
      noting that defenses are concentrated on jailbreak mitigation. No new
      experiment, no numbers given in the source text for the alignment-gap
      claim itself.
