id: large-audio-language-models-safety-alignment-inherited-text-only-rlhf
ref: CLM-0848
capability: audio-understanding
technique: align-audio-text-preference-pairs-text-alone
statement: >-
  In large audio language models, safety alignment inherited from text-only
  RLHF on the LLM backbone does not cover the acoustic channel, because
  malicious intent can be carried by paralinguistic realization (emotion,
  accent, prosody, speaker traits, imperceptible waveform perturbation) that
  is decoupled from the lexical content the alignment was trained on.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "End-to-end LALMs whose safety behaviour comes from a text-aligned LLM backbone with an audio encoder bolted on; stated as a synthesis across reported jailbreak and adversarial-audi"
sources:
