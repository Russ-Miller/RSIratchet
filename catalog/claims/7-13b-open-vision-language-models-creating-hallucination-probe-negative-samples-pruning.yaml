    stance: supports
    note: >-
      Validated by: POPE accuracy/F1 across four MLLMs and three datasets
      (LLaVA-1.5 COCO 84.79 to 86.79 accuracy), CHAIR captioning scores,
      MMHal-Bench GPT-4 scoring, MME; ablation compares pruned-token
      negatives (86.11 COCO acc) against masked-image negatives (84.77,
      below vanilla); t-SNE shows pruned negatives cluster with originals
      while masked ones do not; 1.06x latency.. Measured on four MLLMs and
      three POPE splits plus CHAIR/MME/MMHal-Bench; gains are modest (~2
      points POPE accuracy) and inconsistent on MiniGPT-4 and InstructBLIP
      where the method is sometimes second-best. [truncated]
