id: 7b-instruction-tuned-transformer-under-fixed-kv-cache-budget-training-small
ref: CLM-0539
capability: long-context-degradation
technique: learn-kv-eviction-matching-full-cache-output-distribution
statement: >-
  For a 7B instruction-tuned transformer under a fixed KV-cache budget,
  training a small policy to pick which cached tokens to keep by rewarding
  low KL divergence from the full-cache next-token distribution retains more
  long-context accuracy than attention-heuristic eviction (H2O, SnapKV), and
  the margin widens as the budget tightens and as context grows.
