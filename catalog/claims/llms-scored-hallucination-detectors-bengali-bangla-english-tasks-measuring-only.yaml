notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: If, on these tasks,
  models' hallucinated-candidate detection rates ranked them the same way as
  the balanced dual-track score — i.e. no model with a low miss rate had a
  high false-alarm rate on gold instances — the dual-track protocol would
  add nothing.
