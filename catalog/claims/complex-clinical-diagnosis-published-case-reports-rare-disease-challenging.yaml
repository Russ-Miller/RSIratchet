id: complex-clinical-diagnosis-published-case-reports-rare-disease-challenging
ref: CLM-0548
capability: multi-model-coordination
technique: debate-mixture-of-agents-rebut-revise-then-aggregate
statement: >-
  On complex clinical diagnosis from published case reports (rare disease
  and challenging cases), running several presenter-rebutter debater pairs
  on one backbone and synthesizing their revised hypotheses with an
  aggregator raises exact-match diagnostic accuracy and rated safety over
  the same model prompted once, while giving no measurable gain on
  multiple-choice clinical knowledge questions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "GPT-4o, GPT-3.5 and GPT-4o-mini backbones; 297 rare disease and 1,719 challenging published cases; accuracy graded by exact match to the reference diagnosis and safety by an LLM ju"
sources:
  - source: arxiv-2609-05069
    stance: supports
    note: >-
      Validated by: Top-1/top-3 exact-match accuracy and rubric safety rate
      against single-model prompting, a single model prompted to imitate the
      debate, MoA with the rebutter removed, and a MAC-style single-debater
      multi-round dialogue; on challenging cases GPT-4o rose from 14.50% to
      25.34% top-1 accuracy and 63.46% to 76.14% top-1 safety, with McNemar
      p<0.01, and all three ablations scored below the full topology..
      Measured on two case sets with paired one-sided McNemar tests and
      three ablation variants across three backbones; [truncated]
contested: false
