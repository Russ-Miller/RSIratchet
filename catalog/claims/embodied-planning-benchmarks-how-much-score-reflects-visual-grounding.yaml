id: embodied-planning-benchmarks-how-much-score-reflects-visual-grounding
ref: CLM-0975
capability: evaluation-validity
technique: strip-explanatory-failure-messages-bare-success-failure
statement: >-
  In embodied planning benchmarks, how much a score reflects visual
  grounding depends on the verbosity of action feedback: when failures are
  reported with explanatory messages ('Mug must be in the SinkBasin to
  clean'), text-only agents can match or exceed image-based agents on the
  same tasks, whereas with bare success/failure signals text-only
  performance falls to well under half the image-based rate.
