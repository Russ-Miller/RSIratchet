id: building-preference-data-teach-7-8b-instruct-models-follow-multi-constraint
ref: CLM-0027
capability: procedure-following
statement: >-
  When building preference data to teach 7-8B instruct models to follow
  multi-constraint instructions, perturbing each atomic constraint in
  several directions so the perturbed instruction's valid-response set
  contains, partly overlaps, or is disjoint from the original's — and
  pairing responses drawn from each sub-region — raises constraint adherence
  more than rejection sampling or teacher-correction pairs, and the gain
  holds on perturbed instruction variants the baselines barely improve on.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-7B-Instruct and Llama-3.1-8B-Instruct, DPO/KTO/online-DPO, 12k pairs, constraints that are checkable by executable code; tested on IFEval, IFBench, a perturbed set built by"
sources:
  - source: arxiv-2608-29352
    stance: supports
    note: >-
      Two backbones, three optimization methods, four test sets, fixed 12k
      training size, with ablations removing each relationship type and each
      pair region — each removal lowers accuracy. One of the four test sets
      (Perturbed-IF) is generated by the authors' own perturbation method,
      which favors the method; the data-scaling curve and the fixed budget
      do argue the gain is not just more data. Single group, no independent
      replication.
contested: false
status: pending-review
