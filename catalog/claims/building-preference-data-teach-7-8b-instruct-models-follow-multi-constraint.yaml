notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Matching the same 12k
  pair budget with disjoint-only or random perturbations yields the same
  constraint accuracy, or the advantage disappears on a held-out benchmark
  not built with the same perturbation procedure. Proposed technique, not
  catalogued: Cross-relational preference pairs over perturbed constraints.
