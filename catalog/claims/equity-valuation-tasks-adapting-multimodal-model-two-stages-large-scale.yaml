id: equity-valuation-tasks-adapting-multimodal-model-two-stages-large-scale
ref: CLM-0384
capability: domain-knowledge
technique: two-stage-financial-domain-adaptation-before-institution-fine
statement: >-
  For equity valuation tasks, adapting a multimodal model in two stages —
  large-scale financial-corpus pre-training followed by institution-specific
  fine-tuning — gives lower target-price error than zero-shot general
  models, single-stage fine-tuned financial models, or an analyst-input DCF
  spreadsheet.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target price scored against analyst consensus; baselines were GPT-4 zero-shot, FinGPT single-stage, and an analyst-input DCF spreadsheet"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error and RMSE of target price versus
      analyst consensus on 200 companies, plus a direction-accuracy measure;
      FinVision 13.1% MAE versus 16.2% for the best baseline and 18.7% for
      single-stage FinGPT.. Measured on one proprietary system against three
      baselines on 200 companies; the benchmark is analyst consensus rather
      than realized value, compute and data are not matched across arms, and
      the staging is confounded with corpus and loss changes. No ablation
      isolating stage structure.
