id: adversarially-edited-image-tasks-chain-of-thought-prompting-moves-multimodal-models
ref: CLM-0579
capability: visual-grounding
statement: >-
  On adversarially edited image tasks, chain-of-thought prompting moves
  multimodal models in opposite directions depending on the hallucination
  cause: it raises accuracy on counterfactual-attribute questions that pit
  language priors against the image (up to +8.9 points across 13 open
  models) while lowering it on perception-heavy before/after comparison and
  dense counting (down to -20.1 points), so CoT is not a general
  hallucination mitigation.
kind: observation
backing_strength: single-paper
observed_on:
  era: "13 open-weight MLLMs (Qwen2.5/3/3.5-VL, InternVL2.5/3, MiMO-VL, LLaVA) on 50K exam-style QA pairs over edited Visual Genome and FSC147 images; accuracy only, no human baseline."
sources:
  - source: arxiv-2605-29579
    stance: supports
    note: >-
      Measured: standard vs CoT accuracy per task for each model in one
      table. The direction is consistent across nearly all models for
      counterfactual attribute (gains) and for dense counting (losses),
      which is what makes the split credible; Alteration Tracing has two
      small-model exceptions where CoT helps. Attribution to 'visual
      uncertainty accumulating in long chains' is argued, not isolated.
      Sub-cause labels come from an LLM labelling CoT traces, not human
      annotation.
contested: false
status: pending-review
last_checked_at: 2026-10-31
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "chain-of-thought", which does not list this
  capability in addresses -- recorded, not asserted. Drafted confidence:
  medium. Falsifier as drafted: A model set where CoT raises accuracy on
  cross-image alteration tracing and dense counting by a comparable margin
  to its gain on counterfactual attribute, or where the
  counterfactual-attribute gain disappears.
