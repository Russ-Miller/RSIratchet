id: 10-day-global-weather-forecasting-0-25-degree-resolution-multimodal-model
ref: CLM-0956
capability: forecasting
technique: align-high-dimensional-science-tokens-text-one-llm
statement: >-
  For 10-day global weather forecasting at 0.25-degree resolution, a
  multimodal model that encodes gridded atmospheric fields as tokens aligned
  with language tokens in a shared LLM backbone, driven by task prompts, can
  reach lower RMSE and higher ACC than ECMWF HRES while using only one
  preceding time step as input.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Earth-science weather fields with 70 variables at 0.25 degrees, evaluated against ERA5 (model) and HRES-fc0 (baseline) over June 2023-June 2024; single-paper, no independent replic"
sources:
  - source: arxiv-2601-01363
    stance: supports
    note: >-
      Validated by: Latitude-weighted RMSE and ACC for Z500, T2M, WS10M over
      a one-year test period against ECMWF HRES; TC track MAE and WS10M RMSE
      on 20 2024 typhoons against IBTrACS; downscaling RMSE/PSNR against
      bilinear interpolation; biomedical VQA accuracy on VQA-RAD, SLAKE,
      PathVQA.. Measured on a one-year test window for three headline
      variables, with spatial RMSE maps at day 10. Reported by the model's
      authors, no independent replication, and no ablation isolating what
      the language alignment contributes over a plain gridded forecaster of
      the same capacity.
contested: false
