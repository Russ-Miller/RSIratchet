notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An independent evaluation
  under the same ERA5/HRES-fc0 protocol showing the unified multimodal
  model's Z500/T2M/WS10M RMSE at 10 days is no better than ECMWF HRES, or
  that the gain disappears once the comparison is made against a
  same-architecture forecast-only baseline.
