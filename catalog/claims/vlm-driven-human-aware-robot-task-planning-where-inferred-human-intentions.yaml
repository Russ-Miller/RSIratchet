id: vlm-driven-human-aware-robot-task-planning-where-inferred-human-intentions
ref: CLM-0352
capability: planning
technique: infer-human-intent-symbolic-goals-then-plan-multi
statement: >-
  In VLM-driven human-aware robot task planning where inferred human
  intentions are converted into symbolic goals and solved by a formal
  multi-agent planner, the bottleneck is the VLM's goal grounding rather
  than the planner: with correctly grounded human and robot goals the
  planner produces a valid conflict-free joint plan in about 99.6% of
  trials, while end-to-end success with predicted goals is about 70% and
  falls to about 26% on multi-item human activities.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Household VirtualHome simulation, four scenes, six scripted human activities, two robot task types, 2,400 trials per method, cooperative goal-consistent human assumed; GPT-5.6-Sol "
sources:
  - source: arxiv-2609-17771
    stance: supports
    note: >-
      Validated by: Joint success rate 69.71% vs 35.50% for a VLM-as-planner
      baseline and 34.42% for GG-LLM, with paired cluster bootstrap CIs
      excluding zero; also higher robot and human goal completion and about
      half the functional-conflict rate.. Measured in one simulator with
      scripted activities and an oracle-goal ablation that isolates
      grounding error; the planner's near-perfect rate holds only under the
      paper's assumption of a cooperative, goal-consistent human, and no
      real-robot or deviating-human test was run.
contested: false
