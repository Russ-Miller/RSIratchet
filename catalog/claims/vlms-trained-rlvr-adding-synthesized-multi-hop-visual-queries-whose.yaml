id: vlms-trained-rlvr-adding-synthesized-multi-hop-visual-queries-whose
ref: CLM-0947
capability: multi-step-reasoning
technique: synthesize-logically-dependent-multi-hop-visual-queries-rlvr
statement: >-
  For VLMs trained with RLVR, adding synthesized multi-hop visual queries
  whose hops are logically dependent — each later hop identifiable only from
  instances established earlier, with a single verifiable numeric answer —
  raises scores on most benchmarks the data was not built for, and
  truncating the chains to their last hop or latter half gives back most of
  the gain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Two Qwen3.5 MoE models (35B-A3B, 397B-A17B) post-SFT, SAPO RLVR, 24 image and video benchmarks; multi-hop data synthesized only from images with SAM3-segmentable instances"
sources:
  - source: arxiv-2603-17024
    stance: supports
    note: >-
      Validated by: RLVR on original data plus multi-hop data vs original
      data alone: 20 of 24 benchmarks improved on both models; hop-structure
      ablation on five benchmarks averaged 70.4 (full) vs 66.7 (half) vs
      64.3 (single hop); gains largest in the longest response-length bins..
      Measured on two models across 24 benchmarks with a shared pre-RLVR
      starting point and a three-way hop-structure ablation. Confounded by
      data volume: the multi-hop arm adds ~6-8k samples on top of the
      original data, and no equal-volume non-multi-hop control is reported.
