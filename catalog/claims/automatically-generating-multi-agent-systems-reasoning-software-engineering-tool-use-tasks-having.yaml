id: automatically-generating-multi-agent-systems-reasoning-software-engineering-tool-use-tasks-having
ref: CLM-1073
capability: multi-model-coordination
technique: evolve-structured-mas-configurations-generated-code
statement: >-
  When automatically generating multi-agent systems for reasoning,
  software-engineering and tool-use tasks, having an LLM emit a declarative
  configuration (agent prompts, tool sets, backbone models, communication
  topology) executed by a fixed runtime yields far higher execution rates
  than having it emit executable multi-agent code (above 96% vs 71.5% on
  BBEH and 1.2% on SWE-Bench-Lite for a code-generating baseline), and the
  resulting systems also score higher on task accuracy.
