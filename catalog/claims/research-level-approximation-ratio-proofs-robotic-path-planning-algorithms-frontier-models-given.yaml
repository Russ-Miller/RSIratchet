id: research-level-approximation-ratio-proofs-robotic-path-planning-algorithms-frontier-models-given
ref: CLM-0937
capability: domain-knowledge
technique: supply-proof-s-own-lemmas-context-reasoning-template
statement: >-
  On research-level approximation-ratio proofs for robotic path-planning
  algorithms, frontier models given only the problem and algorithm
  description produce valid proofs in at most about a quarter of tasks, and
  supplying the task's own domain lemmas in context raises proof validity
  more than generic chain-of-thought prompting or handing the model the
  ground-truth approximation ratio.
kind: observation
backing_strength: single-paper
observed_on:
  era: "34 proof tasks extracted from 11 published robotics papers, with problem and algorithm names anonymized to limit contamination; graded by an LLM judge against the paper's proof wit"
sources:
  - source: arxiv-2603-19464
    stance: supports
    note: >-
      Validated by: Success rate (final-answer and reasoning both >=7 on a
      1-10 LLM-judge scale) rose from 8.82-26.47% with no context to
      29.41-44.12% with lemmas; the oracle-ratio-only setting reached
      17.65-32.35%; adding CoT alone did not raise scores and increased
      counted hallucination errors (216 to 244 in the no-context setting)..
      Measured on 34 tasks across 4 models and 8 prompt conditions, scored
      1-10 by GPT-5.2 as judge against the paper's own proof, with 4 human
      annotators verifying extraction and judging quality. [truncated]
