id: vision-language-models-vqa-change-standard-uncertainty-scores-perplexity-semantic
ref: CLM-1334
capability: hallucination
technique: score-uncertainty-methods-correlation-between-score-change-hallucination
statement: >-
  For vision-language models on VQA, the change in standard uncertainty
  scores (perplexity, semantic entropy, DegMat, lexical similarity, p(True))
  when an input is perturbed correlates only weakly and inconsistently with
  whether the answer flips to a hallucination, and the correlation is lowest
  exactly for the visual degradations (e.g. blur) that cause the most
  hallucinations, while being higher for low-impact textual edits like
  typos.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine white-box and black-box UQ methods on Kosmos-2, LLaVA, Qwen-VL and GPT-4o-mini; hallucination measured as clean-correct becoming perturbed-incorrect on CLEVR attribute/existen"
sources:
  - source: arxiv-2602-09214
    stance: supports
    note: >-
      Validated by: Applied to nine UQ methods across four VLMs on VizWiz,
      VQAv2 and CLEVR subsets; reported as heatmaps of HCC per method per
      perturbation, alongside AUROC/F1 on human-labelled modality subsets.
      Not validated against an external measure of UQ usefulness.. Measured
      on 600 curated VizWiz samples plus VQ-FocusAmbiguity and
      CLEVR-generated hallucination subsets, four models, nine UQ methods.
      Hallucination rates under blur reach 64.7% (Qwen-VL, attribute) while
      HCC for blur is near zero or negative across models. [truncated]
contested: false
