capability: hallucination
technique: score-thinking-rollouts-against-same-model-non-thinking
statement: >-
  For Qwen3 reasoning models on closed-book factuality QA, explicit thinking
  is not uniformly helpful at the instance level \u2014 it flips roughly
  5-8% of correct non-thinking answers to incorrect across 1.7B-32B while
  correcting about 10-12% of incorrect ones \u2014 and putting non-thinking
  rollouts into the same GRPO advantage group as thinking rollouts, so
  thinking is scored against the model's own direct answer, raises average
  accuracy over both fixed-mode RL and adaptive mode-selection baselines.
