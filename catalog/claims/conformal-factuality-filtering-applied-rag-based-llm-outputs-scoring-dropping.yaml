id: conformal-factuality-filtering-applied-rag-based-llm-outputs-scoring-dropping
ref: CLM-1092
capability: abstention-and-self-knowledge
technique: conformal-abstention-self-consistency
statement: >-
  When conformal factuality filtering is applied to RAG-based LLM outputs by
  scoring and dropping atomic claims below a calibrated threshold, the
  coverage guarantee is bought with vacuity at high target factuality levels
  — an empty output counts as factual under empirical factuality — and the
  guarantee does not hold under distribution shift between calibration and
  deployment or when distractors are present.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "RAG pipelines with an oracle retriever supplying sufficient reference text, evaluated on open-ended biography, math and natural question answering with open-source models from 135M"
sources:
  - source: arxiv-2603-16817
    stance: supports
    note: >-
      Measured across three datasets (FActScore incl. a rare-entity subset,
      MATH, Natural Questions) and 13 open-source models with
      entailment-based and LLM-confidence scorers; the vacuity finding
      follows from the metric definition plus observed non-empty rates, and
      the robustness finding from shift/distractor conditions. Source text
      truncated before the results section, so effect sizes are not
      available.
