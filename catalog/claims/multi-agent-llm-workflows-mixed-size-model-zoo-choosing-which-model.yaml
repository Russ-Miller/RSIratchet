id: multi-agent-llm-workflows-mixed-size-model-zoo-choosing-which-model
ref: CLM-0558
capability: multi-model-coordination
technique: route-each-agent-step-predicted-task-progress-gain
statement: >-
  In multi-agent LLM workflows with a mixed-size model zoo, choosing which
  model instantiates each agent step-by-step from an online estimate of
  task-progress gain plus remaining time and cost budget keeps task quality
  near the best single-model policy at lower energy than one-shot
  query-level routing or stall-triggered escalation.
