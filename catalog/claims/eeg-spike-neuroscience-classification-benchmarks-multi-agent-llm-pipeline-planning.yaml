id: eeg-spike-neuroscience-classification-benchmarks-multi-agent-llm-pipeline-planning
ref: CLM-0597
capability: domain-knowledge
technique: expose-domain-pre-trained-models-one-tool-api
statement: >-
  On EEG and spike neuroscience classification benchmarks, a multi-agent LLM
  pipeline with planning, code generation and closed-loop retry does not by
  itself beat a single-shot LLM coding agent; the measured gain comes from
  making domain-specific pre-trained neural models addressable through one
  interface and choosing among them per dataset.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Three public datasets (Alzheimer's EEG, Parkinson's EEG, working-memory spikes), nine frozen pre-trained neuroscience models used as feature extractors, GPT-5.2 agents, 8 seeds per"
sources:
  - source: arxiv-2609-01971
    stance: supports
    note: >-
      Validated by: Primary metric (macro F1 or balanced accuracy) over 8
      trials against general agents, scientific agents and two single-shot
      LLM coding baselines; plus a 'Vanilla' arm (same architecture,
      pre-trained models removed), whose initial round scored below Codex on
      AD (49.80 vs 51.01) and PD (64.52 vs 65.52), and a held-out
      fixed-model comparison on WM (POYO-1 +6.82 pp over handcrafted
      features, better on 7 of 8 seeds).. [truncated]
