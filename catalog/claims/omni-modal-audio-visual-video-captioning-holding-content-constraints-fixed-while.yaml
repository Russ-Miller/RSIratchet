id: omni-modal-audio-visual-video-captioning-holding-content-constraints-fixed-while
ref: CLM-0702
capability: procedure-following
technique: apply-format-constraints-last-after-content-composed
statement: >-
  For omni-modal (audio-visual) video captioning, holding content
  constraints fixed while making the required output format more rigid —
  plain text, then styled markdown/lists, then strict JSON or forced-keyword
  syntax — lowers the share of content constraints the model satisfies, so
  stricter output formatting costs cross-modal reasoning accuracy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "14 omni-modal models on 30-90 second audio-visual clips; the tradeoff experiment used 1,200 curated samples across five models, with content constraints scored by an LLM judge answ"
sources:
  - source: arxiv-2606-08572
    stance: supports
    note: >-
      Validated by: On 500 sampled training triplets, checklist-based
      evaluation preferred the decomposed-and-aggregated responses to
      single-pass direct generation in 96.3% of cases; fine-tuning on the
      resulting 54K set lifted Qwen2.5-Omni-7B format CSR from 62.97 to
      90.39 and content CSR from 41.27 to 59.43.. Measured on 1,200 curated
      samples across five models with content constraints held constant and
      format level varied in three steps; the paper reports a continuous
      drop in content CSR but gives the result as a figure, not as numbers
      in the text. [truncated]
