id: open-source-vlms-asked-justify-answers-object-removal-counterfactual-image-pairs
ref: CLM-0215
capability: explanation-faithfulness
statement: >-
  For open-source VLMs asked to justify answers on object-removal
  counterfactual image pairs (A-OKVQA, SNLI-VE), explanations written after
  the answer is committed (Predict-then-Explain) mention the removed object
  more in proportion to how much its removal shifts the answer distribution
  than pre-answer step-by-step CoT does, so pre-answer reasoning is not the
  more faithful format here.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Eight open-source VLMs (9B-38B), single-object diffusion removal edits, answer distributions restricted to a fixed candidate set, visible prompted explanations with native thinking"
sources:
  - source: arxiv-2609-06704
    stance: supports
    note: >-
      Point-biserial correlation between TVD answer shift and LLM-judged
      mention of the removed object; PE beat CoT in all 16 model-dataset
      pairs (A-OKVQA mean 0.303 vs 0.200; SNLI-VE 0.264 vs 0.129) with
      paired permutation p<0.05, and held under accuracy-matched and
      original-image-only mention controls. Absolute correlations are
      modest, mention detection is a model judge (92.2% human agreement),
      edits are correct in ~88-93% of audited cases, and the test is
      behavioral, not mechanistic.
