id: encoding-harmful-request-base64-rot13-or-hex-lowers-full
ref: CLM-0297
capability: jailbreak-robustness
statement: >-
  Encoding a harmful request in Base64, ROT13 or hex lowers full compliance
  in six frontier chat models from about 76% (natural-language prompts) to
  about 59%, but the least-complied-with encoding still produced malicious
  output in about 54% of cases, so obfuscation by encoding is a weaker
  attack than plain non-English text yet is far from neutralized.
kind: observation
backing_strength: single-paper
observed_on:
  era: "DeepSeek, GPT, Gemini, Grok, Llama and Qwen chat models on phishing, deceptive-site and malware prompts, 2026; direct and multi-stage prompts; automatic compliance judging."
sources:
  - source: arxiv-2606-29602
    stance: supports
    note: >-
      Compliance rates this high suggest a permissive judge; the ordering
      (natural language > encodings, encodings still high) is the
      transferable part.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
