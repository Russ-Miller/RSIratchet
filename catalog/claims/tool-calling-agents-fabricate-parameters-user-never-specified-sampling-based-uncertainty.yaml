id: tool-calling-agents-fabricate-parameters-user-never-specified-sampling-based-uncertainty
ref: CLM-0496
capability: hallucination
technique: read-grounding-failures-concurrent-lora-critic-adapter
statement: >-
  For tool-calling agents that fabricate parameters the user never
  specified, sampling-based uncertainty signals (token and semantic entropy)
  fail to detect the error because the model generates the fabricated
  parameter confidently, while the grounding gap is present in the residual
  stream and can be read out by a zero-initialized LoRA adapter trained only
  on a localization label appended after the tool call.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Structured tool-calling with parameter-level grounding judged against dialogue history; Qwen3-4B and Llama-xLAM-2-8B base agents; in-distribution plus one OOD set (ToolAlpaca)."
sources:
  - source: arxiv-2608-10430
    stance: supports
    note: >-
      Validated by: On Qwen3-4B the critic reached 0.966 ID / 0.925 OOD
      AUROC versus 0.782/0.616 for a linear probe on frozen states,
      0.915/0.884 for an equal-scale fine-tuned external judge, and
      near-chance for token/semantic entropy and SEP; >80% exact
      parameter-match localization; replicated on Llama-xLAM-2-8B
      (0.926/0.649 vs probe 0.833/0.514, p<0.001 McNemar). A linear probe on
      the adapter's own states reached 0.915 OOD, and cross-trajectory
      activation patching at the trigger token flipped the output to
      'ungrounded' in 96% of cases. [truncated]
