statement: >-
  For tool-calling agents that fabricate parameters the user never
  specified, sampling-based uncertainty detectors (token and semantic
  entropy) fail because the model generates these fabrications confidently,
  while a zero-initialized LoRA adapter trained with a masked diagnostic
  objective on the frozen model's own hidden states detects and names the
  ungrounded parameter.
