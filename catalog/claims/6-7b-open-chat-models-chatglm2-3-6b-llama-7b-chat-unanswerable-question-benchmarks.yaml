id: 6-7b-open-chat-models-chatglm2-3-6b-llama-7b-chat-unanswerable-question-benchmarks
ref: CLM-0977
capability: abstention-and-self-knowledge
technique: probe-knowledge-boundary-entropy-rewarded-questioner
statement: >-
  For 6-7B open chat models (ChatGLM2/3-6B, LLaMA-7B-Chat) on
  unanswerable-question benchmarks, the entropy of the response's token
  distribution separates answerable from unanswerable questions better than
  probability-based confidence scores (min/first/product token probability,
  prior and posterior prompting, in-context IDK, verbalized confidence),
  with the margin concentrated in correctly flagging the unanswerable ones
  rather than in accuracy on answerable ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three unanswerable-question datasets (KUQ, Sware, Infeasible Benchmark); small open chat models; entropy thresholds selected by the authors from the observed distribution."
sources:
  - source: arxiv-2603-21022
    stance: supports
    note: >-
      Validated by: The generated question set was compared against the
      human-curated KUQ dataset on Equal Error Rate and F1 across three
      target models, giving similar or slightly better numbers (e.g.
      LLaMA-7B-Chat EER 0.239 vs 0.301); entropy distribution of 2,000+
      generated questions was bimodal with ~20% in the transition band;
      t-SNE showed generated questions cluster distinctly from random ones;
      against expert and random questioning baselines, KBD reached the
      low-entropy boundary within 50 rounds while random questioning did
      not.. [truncated]
