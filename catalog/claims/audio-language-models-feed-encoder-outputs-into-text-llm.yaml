id: audio-language-models-feed-encoder-outputs-into-text-llm
ref: CLM-0346
capability: audio-understanding
technique: pick-audio-encoders-semantic-alignment-fidelity
statement: >-
  In audio language models that feed encoder outputs into a text LLM,
  downstream understanding accuracy across speech, sound and music is set by
  how semantically text-aligned the encoder is rather than by whether its
  representation is discrete or continuous — reconstruction-oriented codecs
  with high acoustic fidelity underperform, semantically distilled
  tokenizers can beat their own continuous teacher, and scaling the LLM
  backbone does not recover the lost information.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Encoders frozen or lightly adapted, fed through a projector into 135M-8B text LLM backbones (SmolLM2 with LoRA, Llama-3 frozen-probing); understanding tasks only, not generation or"
sources:
  - source: arxiv-2609-22851
    stance: supports
    note: >-
      Validated by: Nine encoders compared under identical task configs on
      ~20 datasets across speech/sound/music; Whisper led overall (0.735 vs
      0.418 for Wav2Vec2 at 135M), SpeechTokenizer beat HuBERT on emotion
      recognition, DAC and WavTokenizer scored lowest on semantic tasks
      despite higher fidelity; performance fell in about 53% of encoder-task
      configs when the backbone was scaled.. Measured on one framework
      (UniARC) with nine encoders, four backbones, ~20 datasets, identical
      per-task configs. Projector is a simple MLP, which the authors note
      may itself bottleneck scaling; [truncated]
