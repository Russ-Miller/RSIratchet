  only-models-substantial-code-pretraining-track-entity-state: supports --
  Baseline VLMs degrade sharply on the harder long-range regime of
  ingredient-state questions (e.g. Qwen2.5-VL-7B from 30.7% to 3.3% on
  Ingredient Entry). Proposed technique, not catalogued: Separate event-log
  and inventory-ledger memories.
