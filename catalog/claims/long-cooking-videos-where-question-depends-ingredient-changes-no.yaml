id: long-cooking-videos-where-question-depends-ingredient-changes-no
capability: state-tracking
statement: >-
  For long cooking videos where a question depends on ingredient changes no
  longer visible, vision-language models fail to carry observed events
  forward into later answers, and adding generic retrieved-context RAG makes
  it worse, while splitting memory into a temporally anchored event log plus
  an explicitly updated inventory ledger recovers much of the gap.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Multiple-choice and numeric QA over 160 long cooking videos; Qwen3-VL 4B/8B backbones for the agent; proprietary and open VLMs as zero-shot baselines; observational only, no actuat"
sources:
  - source: arxiv-2609-07135
    stance: supports
    note: >-
      Single benchmark of 1,500 human-verified QA pairs; humans ~92% average
      vs GPT-4o 47.7% and Gemini 2.5 Pro 61.1%. Nutri-Vgent raises
      Qwen3-VL-8B from 53.4% to 62.3% while generic Vgent lowers it to
      31.7%. Ablation shows either memory alone lowers overall score below
      the visual-only baseline; the combination is highest. Easy splits dip
      slightly, attributed to retrieval overhead. No isolation of
      prompt/function-call differences from the memory structure itself.
contested: false
