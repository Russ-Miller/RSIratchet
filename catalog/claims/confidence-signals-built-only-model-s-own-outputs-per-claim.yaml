id: confidence-signals-built-only-model-s-own-outputs-per-claim
ref: CLM-0371
capability: abstention-and-self-knowledge
technique: calibrate-confidence-per-atomic-claim-per-response
statement: >-
  Confidence signals built only from a model's own outputs — per-claim
  self-verification plus cross-sample consistency, then post-hoc
  temperature/Platt scaling — lower claim-level calibration error on
  straightforward factual QA (TriviaQA) but get worse on adversarial
  false-premise questions (TruthfulQA), because the model samples the same
  wrong claim consistently and the signal faithfully reports its mistaken
  confidence.
kind: mechanism
backing_strength: single-paper
