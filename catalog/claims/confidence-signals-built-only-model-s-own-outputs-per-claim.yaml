sources:
  - source: arxiv-2608-22483
    stance: supports
    note: >-
      Validated by: ECE, smECE, Brier, AUROC, AURC against seven baselines
      (few-shot likelihood, CoT, verbalized confidence, PS, TS, LMvsLM,
      HalluMeasure) on TriviaQA and TruthfulQA across six models; on
      GPT-4o/TriviaQA ECE 0.006 versus 0.096 for temperature scaling, but on
      GPT-4o/TruthfulQA 0.412 versus 0.118 for temperature scaling..
      Measured on two datasets and six models with seven baselines, but
      results are mixed: the proposed method is not best on most TriviaQA
      rows (PS/TS often lower ECE), and the headline win is one
      model-dataset cell. [truncated]
