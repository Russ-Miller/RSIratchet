id: 128k-token-constraint-retrieval-tasks-find-longest-lexicographically-sorted-run-words
ref: CLM-0526
capability: long-context-degradation
statement: >-
  On ~128K-token constraint-retrieval tasks (find the longest
  lexicographically sorted run of words), frontier models' collapse under
  near-miss decoys comes from the decoys being scattered through the context
  rather than from their presence: with 8 scattered near-sorted decoys no
  tested model exceeds 2%, while clustering the same decoys next to the
  target restores accuracy to baseline levels (e.g. Opus 4.6 high 1%
  scattered vs 98% clustered).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Synthetic and LongBench-v2-derived word lists at ~128K-365K tokens, k=5 target runs, 8 decoys, 100 examples per variant, 16K output token budget; nine closed and open frontier mode"
sources:
  - source: arxiv-2607-08284
    stance: supports
    note: >-
      Measured accuracy across nine models on paired variants of the same
      task; the clustering manipulation isolates spatial arrangement while
      holding decoy count and construction fixed. Absolute numbers are low
      enough that some comparisons rest on a handful of correct items, and
      the mechanism ('models zone in on a distinctive region') is
      speculation, not tested.
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Running the same decoy
  sets clustered versus scattered and finding accuracy similarly low in both
  arrangements, or finding the clustered gain is an artifact of shorter
  effective search (e.g. persists when context is shortened to the cluster
  alone).
