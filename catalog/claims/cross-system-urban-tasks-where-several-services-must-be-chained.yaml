id: cross-system-urban-tasks-where-several-services-must-be-chained
ref: CLM-0557
capability: tool-use
technique: augment-constraint-check-each-candidate-before-committing-answer
statement: >-
  On cross-system urban tasks where several services must be chained under
  matched tools and budgets, the task-success gap between orchestration
  strategies is not explained by required-tool coverage, call ordering, or
  asking for missing inputs — those are near-saturated across strategies —
  but by whether the agent goes beyond the minimal toolchain to refine
  coarse results and verify each candidate against the stated constraints
  before answering.
kind: observation
backing_strength: single-paper
observed_on:
  era: "250-query UrbanEval benchmark over MCP urban services; main controlled setting GPT-5-mini, replicated in rank only across Gemini-2.5-flash, DeepSeek-V4-flash, Qwen3-235B-A22B; LLM "
sources:
  - source: arxiv-2608-03018
    stance: supports
    note: >-
      Validated by: Task success rate on UrbanEval: 0.71 overall vs 0.61 for
      the best baselines (native tool-calling, AutoGen); 64.0% vs 53.5% on
      the 200 executable queries; incomplete-task failures 20 vs 31-45;
      valid proactive augmentation rate 0.96 vs 0.84; cost about 3x tokens
      per success.. Measured on 250 queries, four backbones, four
      orchestration baselines with matched tools, schemas, temperature and
      budget. [truncated]
