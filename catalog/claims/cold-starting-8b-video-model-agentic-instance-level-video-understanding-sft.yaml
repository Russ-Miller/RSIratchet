id: cold-starting-8b-video-model-agentic-instance-level-video-understanding-sft
ref: CLM-0811
capability: video-temporal-reasoning
statement: >-
  When cold-starting an 8B video model for agentic instance-level video
  understanding by SFT on rejection-sampled tool-calling trajectories,
  trajectories from a same-family larger teacher (Qwen3-VL-235B-Thinking)
  yield a better student than trajectories from a stronger out-of-family
  teacher (Gemini-3.1-Pro), even though the out-of-family teacher solves
  more of the sampled data.
kind: mechanism
backing_strength: replicated
observed_on:
  era: "Single pair of teachers, one 8B Qwen3-VL student, instance-level video QA with two perception tools; SFT stage only."
sources:
  - source: arxiv-2605-16079
    stance: supports
    note: >-
      Measured: teacher accuracy on rejection-sampled set 78.4% vs 83.8%;
      resulting V2P-Bench student scores 70.4% vs 64.7%. Two teachers, one
      student, one benchmark; trajectory counts and filtering not reported
      as matched, so data volume is not isolated from family effect.
contested: false
status: pending-review
last_checked_at: 2026-11-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "cold-start-small-seed-model-s-own-trajectories",
  which does not list this capability in addresses -- recorded, not
  asserted. Drafted confidence: medium. Falsifier as drafted: A controlled
  comparison at matched trajectory count where the out-of-family stronger
  teacher yields an equal or better student across several backbones.
  Drafted stance toward
  3b-14b-models-being-cold-started-multi-hop-retrieval-rl-sft-trajectories:
  supports -- Both find that a stronger but distributionally distant
  teacher's trajectories transfer worse than closer-family trajectories
  during cold-start SFT.
