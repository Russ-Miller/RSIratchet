id: 7b-open-vision-language-models-llava-1-5-llava-next-qwen2-vl-minigpt-4
ref: CLM-1045
capability: visual-grounding
technique: contrast-peak-against-minimum-visual-attention-layers
statement: >-
  In 7B open vision-language models (LLaVA-1.5, LLaVA-NeXT, Qwen2-VL,
  MiniGPT-4, InstructBLIP), object hallucination can be reduced without an
  extra forward pass by contrasting the final-layer logits against two
  layers selected per token by attention mass on visual tokens — adding the
  logits of the peak-visual-attention layer and subtracting those of a
  minimum-attention layer below it.
