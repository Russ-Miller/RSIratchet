id: 7-12b-open-instruct-models-fine-tuning-single-model-full-multi-agent
ref: CLM-0794
capability: multi-model-coordination
technique: distill-full-debate-transcripts-then-shrink-them-rl
statement: >-
  For 7-12B open instruct models, fine-tuning a single model on full
  multi-agent debate transcripts (SFT) and then applying RL with a decaying
  format reward and a shrinking answer-position length limit matches or
  exceeds three-agent two-round explicit debate accuracy while using roughly
  6-21% of its tokens, and distilling only the final consensus answers
  instead of the full traces scores lower.
kind: observation
backing_strength: single-paper
observed_on:
  era: "LLaMA-3.1 8B, Qwen2.5 7B, Mistral Nemo 12B; training traces from GPT-3.5 debates on six-term two-digit arithmetic; evaluated on 1000-sample subsets of GSM8K, MMLU-Pro, BBH; gains n"
sources:
  - source: arxiv-2604-24881
    stance: supports
    note: >-
      Validated by: Accuracy and input+output tokens per question across
      three runs on GSM8K, MMLU-Pro and BBH against single-agent, explicit
      debate (Du et al.), and DebateGPT (final-output-only distillation), on
      three backbones; RL stage ablated against SFT-only.. Measured on three
      backbones and three benchmarks with three runs and standard errors;
      token counts reported. Design does not isolate how much of the gain is
      from the debate structure versus from fine-tuning on any
      GPT-3.5-generated reasoning traces, since no matched non-debate trace
      control is reported. [truncated]
contested: false
status: pending-review
