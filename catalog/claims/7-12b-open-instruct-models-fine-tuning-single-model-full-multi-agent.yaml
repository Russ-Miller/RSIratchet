notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where the
  internalized model, trained the same way, falls materially below explicit
  debate accuracy on most backbone-benchmark cells, or where
  final-answer-only distillation matches full-trace distillation at equal
  token budget. Drafted stance toward
  knowledge-math-medical-qa-benchmarks-8b-open-backbones-llama-3: supports
  -- Both find that debate's accuracy benefit can be reproduced inside one
  model at a fraction of the token cost, implying the gain comes from
  multi-perspective structure rather than inter-agent text exchange.
