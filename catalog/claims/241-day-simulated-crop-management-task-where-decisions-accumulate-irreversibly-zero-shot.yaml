id: 241-day-simulated-crop-management-task-where-decisions-accumulate-irreversibly-zero-shot
ref: CLM-0527
capability: long-horizon-execution
technique: role-split-physical-agent-loop-reflection-feedback
statement: >-
  In a 241-day simulated crop-management task where decisions accumulate
  irreversibly, a zero-shot multi-agent LLM framework (perception, manager,
  decision, revision, reflection) scores below a PPO policy trained in that
  same environment but far above the same PPO policy transferred to a
  shifted weather/location/soil environment, while using under 28% of its
  fertilizer and irrigation.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One crop simulator (WOFOSTGym lnpkw-v0), wheat, GPT-5.6 backbone, single run per policy per environment; no real-world deployment."
sources:
  - source: arxiv-2609-13436
    stance: supports
    note: >-
      Validated by: Cumulative reward, maximum yield (WSO at maturity), and
      total N/P/K/irrigation use against no-intervention, fixed-schedule,
      and PPO baselines in two environments; one run each, no ablation of
      the individual mechanisms.. Measured, but on a single simulator and
      apparently one episode per policy per environment, with no seed
      variance, no ablation of role separation versus reflection, and no
      matched-compute comparison (964 LLM calls, ~23.8M tokens per run
      versus a 2h44m PPO training). [truncated]
