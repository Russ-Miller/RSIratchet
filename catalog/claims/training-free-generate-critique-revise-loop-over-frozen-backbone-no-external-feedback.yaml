    stance: supports
    note: >-
      Validated by: On BBH the sentinel stopped 82-88% of items at accuracy
      inside the single-shot Wilson interval with ~2.1 generations per
      question, versus fixed-depth Self-Refine at 3 generations and 71.2%
      accuracy; every numeric confidence threshold at or above 0.6 fired on
      the first generation, collapsing the loop to single-shot.. Measured on
      three benchmarks, n=100 for probes and n=500 for the cross-benchmark
      and cross-model runs, with Wilson intervals and McNemar tests;
