ref: CLM-0499
capability: self-repair
technique: stop-self-critique-loop-confirmed-sentinel-confidence-number
statement: >-
  In a training-free generate-critique-revise loop over a frozen backbone
  with no external feedback, accuracy gains appear only where single-shot
  accuracy is already weak: on a benchmark the model mostly gets right the
  loop leaves accuracy flat, while on competition math where single-shot
  accuracy is low it adds double-digit points.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Pure-reasoning benchmarks with no tools; two frozen backbones (deepseek-v4-flash, Qwen2.5-72B); loop depth 3; critique produced by the same model."
