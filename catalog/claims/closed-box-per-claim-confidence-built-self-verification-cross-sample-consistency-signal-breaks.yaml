id: closed-box-per-claim-confidence-built-self-verification-cross-sample-consistency-signal-breaks
ref: CLM-0577
capability: abstention-and-self-knowledge
technique: calibrate-confidence-per-atomic-claim-per-response
statement: >-
  For closed-box per-claim confidence built from self-verification and
  cross-sample consistency, the signal breaks on adversarial false-premise
  questions because it faithfully reports the model's own mistaken
  confidence: on TruthfulQA with GPT-4o claim-level calibration reached ECE
  0.412 against 0.118 for response-level temperature scaling, while an
  active cross-examination protocol (LMvsLM) reached 0.112, so an external
  probe rather than a confidence estimate is what helps there.
