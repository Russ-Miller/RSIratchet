statement: >-
  For MLLM judges of text-guided image editing, supervised fine-tuning on
  human-curated chain-of-thought critiques carries most of the gain in both
  score-human correlation and critique text quality, while GRPO against a
  reward model trained on human ratings of critique logicality, accuracy and
  usefulness adds a smaller further gain on top of it.
