    note: >-
      Validated by: Rank/linear correlation (SRCC, KRCC, PLCC) with human
      MOS on EBench-18K and zero-shot pairwise accuracy on five public
      editing benchmarks, plus text-similarity metrics (SimCSE, Word2Vec,
      METEOR, ROUGE) against curated reference critiques; ablated against
      base, GRPO-only and SFT-only variants on three backbones.. Measured:
      ablation across three backbones over five runs reports base MOS SRCC
      ~0.42-0.50, GRPO-only ~0.82-0.84, SFT-only ~0.88-0.90, SFT+GRPO
