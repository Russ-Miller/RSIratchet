    stance: supports
    note: >-
      Validated by: MATH500 accuracy under search guided by the probe signal
      against greedy, random and implicit-PRM guidance; causal ablation of
      value neurons against random, magnitude and Wanda baselines across
      layers; transfer of value probes across datasets and models reported.
      Single 7B model family for the ablation.. The ablation is the strong
      result; the PRM gain is real but modest and lacks a trained-PRM
