id: reward-related-information-reasoning-model-s-hidden-states-concentrated-sparse
ref: CLM-0333
capability: error-detection
technique: probe-derived-value-signal-free-process-reward
statement: >-
  Reward-related information in a reasoning model's hidden states is
  concentrated in a sparse set of neurons: a linear probe trained with a
  temporal-difference objective finds 'value neurons' (under 1% per layer)
  whose activations predict expected correctness, and zeroing them in one
  layer drops MATH500 accuracy from 75% to an average 20% (as low as 1%),
  while zeroing the same number of random or magnitude-selected neurons
  costs 1-9 points; the step-to-step change in the probed value ('dopamine
  neurons', a stated analogy) used as a process reward for inference-time
  search lifted MATH500 from 72.2 to 77.8, above an implicit-PRM baseline at
  75.0.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-7B-SimpleRL-Zoo and similar RL-tuned open math models, MATH500, 2026; probes are linear on hidden states; PRM comparison is against greedy, random and implicit-PRM baseline"
sources:
