id: multi-task-procedural-video-understanding-small-1b-video-llm-decoder-replacing
ref: CLM-0441
capability: video-temporal-reasoning
technique: route-decoder-ffn-experts-task-identity-tokens
statement: >-
  For multi-task procedural video understanding with a small (1B) video-LLM
  decoder, replacing each decoder feed-forward block with task-specific
  expert copies and routing each video-prompt sample by its known task
  identity gives higher average top-1 accuracy across the five COIN tasks
  than the same expert topology run densely or with learned token-level or
  sample-level routing, with the largest gains on the procedure-forecasting
  tasks.
kind: observation
backing_strength: single-paper
