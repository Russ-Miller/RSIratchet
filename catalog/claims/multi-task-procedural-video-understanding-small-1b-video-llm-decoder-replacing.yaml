    stance: supports
    note: >-
      Validated by: COIN five-task average top-1 accuracy: 62.9% for
      task-index routing versus 61.5% dense all-expert activation, 61.4%
      learned token top-1, and 62.1% learned sample top-1, all under the
      same five-expert topology and backbone; also above matched 1B and 3B
      dense VideoLLM-online baselines (59.3, 59.9) and reported 8B baselines
      (61.8), while activating ~2B LLM parameters per sample.. Measured on
      one dataset (COIN) with a single 1B backbone and one training run per
      condition; [truncated]
