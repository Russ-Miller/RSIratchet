    note: >-
      Validated by: Applied to ICLR 2025 human reviews versus baseline- and
      expert-prompted LLM reviews; the scheme separated the two sources into
      distinct functional profiles that overlap metrics would score as
      similar. No external validation of the annotation scheme reported..
      Measured by annotating review points from ICLR 2025 against five
      frameworks, comparing human reviews with LLM reviews under two prompt
      conditions. [truncated]
