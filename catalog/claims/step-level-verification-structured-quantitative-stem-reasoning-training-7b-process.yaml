id: step-level-verification-structured-quantitative-stem-reasoning-training-7b-process
ref: CLM-0659
capability: error-detection
technique: train-step-verifier-only-symbolically-valid-wrong-steps
statement: >-
  For step-level verification of structured quantitative STEM reasoning,
  training a 7B process reward model only on hard negatives that are
  constructed to pass a deterministic symbolic verifier (swapped formula or
  unit-matched variable, with values recomputed so the math balances), and
  running the verifier as a hard filter before the PRM scores candidates,
  detects flawed steps better than monolithic PRMs that must judge
  arithmetic and logic together.
kind: mechanism
backing_strength: single-paper
