    note: >-
      Validated by: ProcessBench average F1 74.2 for verifier+CSP-PRM vs
      73.5 for Qwen2.5-Math-PRM-7B and 68.8 for the same CSP-PRM without the
      verifier; PRMBench soundness/sensitivity gains; Best-of-8 downstream
      average 51.5 vs 49.4 best baseline; perturbation ablation with
      identical positives gave 75.4 joint vs 71.2 logic-only and 70.9
      operand-only.. Measured on ProcessBench, PRMBench, Best-of-8 decoding
      and science benchmarks with one 7B backbone; verifier and CSP data are
      ablated separately and the two perturbation policies are isolated with
      identical positives. [truncated]
