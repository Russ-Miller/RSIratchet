  - source: arxiv-2604-00149
    stance: supports
    note: >-
      Validated by: Executability (pass@8) across 4 models x 4 task topics
      versus ReAct, ReAct-RAG and a one-shot variant; unit/integration test
      accuracy before and after correction; executability-vs-iteration
      curves; and number of physically valid reproductions on a 5-task dmrg
      subset compared with ground-truth figures.. Measured on the authors'
      own benchmark, which they also constructed; baselines are their own
      ReAct implementations and no matched-token-budget control is reported
      (PhysVEC uses substantially more tokens). [truncated]
