id: llm-agents-reproducing-research-level-quantum-many-body-simulations-third-party-libraries
ref: CLM-0855
capability: self-repair
technique: modularize-script-then-unit-test-physics-assert
statement: >-
  For LLM agents reproducing research-level quantum many-body simulations
  with third-party libraries (ITensors, NetKet, Qiskit, ORCA), ReAct-style
  execution-repair loops that surface only the first runtime error leave
  most scripts non-executable (generally under 50%, under 75% even with
  documentation retrieval), while forcing the script into modular 'element
  functions' and running unit plus integration tests over all of them at
  once pushes executability toward 100% in fewer iterations.
