id: verifying-chain-thought-decomposing-into-nodes-asking-binary-consistency
ref: CLM-0327
capability: multi-step-reasoning
technique: node-wise-binary-consistency-checks-chain-verification
statement: >-
  Verifying a chain of thought by decomposing it into nodes and asking
  binary consistency questions per node localizes errors better than judging
  the whole chain at once (F1 up 10-25% over CoT-based verifiers,
  error-localization accuracy far above an 8-vote end-to-end judge) while
  using 6-58 times fewer tokens, because whole-chain judging dilutes
  attention and multi-sampling pays for long generations.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Public multi-step reasoning datasets, training-free verification with open models, 2025; F1 and localization accuracy versus CoT verifiers and voting."
