id: claim-level-hallucination-detection-pipelines-over-image-video-audio-inputs
ref: CLM-0344
capability: hallucination
technique: atomic-fact-checking
statement: >-
  In claim-level hallucination detection pipelines over image, video and
  audio inputs (both comprehension and generation directions), decomposing
  an output into atomic claims contributes more to detection accuracy than
  ensembling several verifier models: removing decomposition costs about
  6.6-7.9 macro-F1 across six cross-modal tasks while removing multi-expert
  majority voting costs about 4.5-5.3.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Claim-level detection with a GPT-5.2 aggregator and modality-specific expert models, on a 10,000-sample benchmark spanning I2T, V2T, A2T, T2I, T2V, T2A; only one pipeline design te"
sources:
  - source: arxiv-2609-11244
    stance: supports
    note: >-
      Measured ablation on a 10,000-sample benchmark across six tasks; the
      gap between the two ablations is consistent in all six, but the
      comparison is within one pipeline with one decomposition model
      (GPT-4.1) and fixed expert sets, so it does not isolate decomposition
      quality from aggregator capacity.
