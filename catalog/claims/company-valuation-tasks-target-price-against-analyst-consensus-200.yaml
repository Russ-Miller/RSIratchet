ref: CLM-0370
capability: domain-knowledge
technique: two-stage-financial-domain-adaptation-corpus-pre-train
statement: >-
  For company valuation tasks (target price against analyst consensus on 200
  listed companies), a model given large-scale financial-corpus pre-training
  followed by institution-specific fine-tuning has lower mean absolute
  valuation error than the same class of model fine-tuned in a single stage
  or prompted zero-shot, and than an analyst-input DCF spreadsheet.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Valuation of listed companies benchmarked against analyst consensus price targets; single system, single evaluation panel, no ablation separating pre-training corpus from fine-tuni"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: MAE and RMSE of target price versus analyst consensus on
      200 listed companies, plus direction accuracy of Buy/Hold/Sell against
      consensus revision within 90 days; baselines were GPT-4 zero-shot
      (24.3% MAE), FinGPT single-stage (18.7%), analyst-input DCF
      spreadsheet (16.2%), versus 13.1% for the two-stage system.. Measured
      on one panel of 200 companies with consensus price targets as ground
      truth, which is itself an analyst artifact rather than realized value.
