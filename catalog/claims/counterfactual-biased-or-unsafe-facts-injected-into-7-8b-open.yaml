id: counterfactual-biased-or-unsafe-facts-injected-into-7-8b-open
ref: CLM-0822
capability: knowledge-updating
statement: >-
  When counterfactual, biased or unsafe facts are injected into 7-8B open
  instruct models by knowledge editing, the edit is recalled on single-hop
  queries far more often than it changes the final answer of multi-hop
  questions that depend on it (e.g. edit-wise success near 100% with
  multi-hop accuracy around 16-48%), while scores on general knowledge and
  reasoning benchmarks stay within about a point of the pre-edit model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "7-8B open instruct models (Llama3, Mistral, Qwen2.5) plus GPT-3.5/GPT-4/DeepSeek-R1, using parameter editing (ROME, MEMIT, KN) and in-context editing (IKE, WISE, MeLLo, DeepEdit, P"
sources:
  - source: arxiv-2605-10146
    stance: supports
    note: >-
      Measured across three open 7-8B models and three closed models with
      five to nine editing methods on four unified datasets; edit success,
      portability, locality and multi-hop accuracy are reported pre- and
      post-edit, and stealth is shown by four general benchmarks averaged
      over five sequential edits. Design does not isolate whether the
      multi-hop gap is a propagation failure or a baseline multi-hop
      reasoning limit, since pre-edit multi-hop accuracy is also low
      (12-22%).
contested: false
status: pending-review
last_checked_at: 2026-11-05
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An editing method whose
  multi-hop answer accuracy approaches its edit-wise success rate on
  MQuAKE-CF under the same models, or a benchmark showing injected edits
  visibly degrade BoolQ/GSM8K/NLI scores. Drafted stance toward
  knowledge-editing-methods-such-rome-fine-tuning-insert-stated-fact-reliably:
  supports -- It reports the same gap between a reliably inserted edit and
  its multi-hop consequences, here across more editing methods and risk
  categories.
