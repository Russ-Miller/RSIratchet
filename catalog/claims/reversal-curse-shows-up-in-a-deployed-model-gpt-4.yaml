statement: >-
  GPT-4 could reliably name a well-known celebrity's parent, but was far
  less reliable naming the celebrity when given the parent — the same
  directional-recall asymmetry demonstrated in smaller fine-tuned models,
  showing up in a deployed model that wasn't fine-tuned for the test.
