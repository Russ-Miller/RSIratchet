id: enterprise-scale-text-to-sql-spider-2-0-snow-oracle-schema-given-letting
ref: CLM-1006
capability: formal-query-synthesis
technique: probe-database-before-writing-sql-under-retrieved-directives
statement: >-
  On enterprise-scale text-to-SQL (Spider 2.0-Snow, oracle schema given),
  letting the agent execute exploratory probes against the live database
  before writing the final query raises execution accuracy for every
  backbone tested, but the gain scales with backbone capability — about 5
  points for GPT-4o versus 17-18 points for DeepSeek-V3.2 and GPT-4.1 — so
  exploration multiplies existing reasoning capacity rather than
  substituting for it.
kind: observation
backing_strength: single-paper
observed_on:
  era: "120-case Spider 2.0-Snow subset with ground-truth schema supplied; baseline is pure SQL generation with execution-error-guided refinement; eight samples per task."
sources:
  - source: arxiv-2602-16720
    stance: supports
    note: >-
      Validated by: Execution accuracy and Pass@8 on Spider 2.0-Snow (53.03%
      EX, 68.44% Pass@8 with DeepSeek-R1) and BIRD-Dev (70.7%) against
      published baselines; ablations compare with/without exploration across
      eight backbones under oracle schema, and with/without the guidance
      directives (EX@8 drops 0.7-4.3 points without them, with more
      exploration rounds needed).. Measured on a 120-case subset of one
      benchmark with oracle schema, eight backbones, three conditions.
      [truncated]
