id: rl-trained-multimodal-image-quality-assessment-models-supervising-stated-reasoning-rating-reward
ref: CLM-0477
capability: explanation-faithfulness
technique: supervise-reasoning-whether-edit-prescribes-improves-image
statement: >-
  In RL-trained multimodal image-quality-assessment models, supervising the
  stated reasoning with the rating reward alone can leave the reasoning less
  faithful than the untrained baseline: a rating-only variant reached the
  best rating alignment (avg PLCC/SRCC 0.836/0.815) while its
  reasoning-guided edits lowered judged image quality (mean gain -0.260 vs
  -0.136 for the untuned backbone), so rating accuracy is not a proxy for
  faithful reasoning.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "4B-class MLLM actors trained with GRPO on KonIQ-10k for blind IQA, with faithfulness operationalized as the quality gain from editing the image according to the stated reasoning, s"
