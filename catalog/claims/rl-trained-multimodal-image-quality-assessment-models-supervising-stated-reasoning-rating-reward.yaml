    stance: supports
    note: >-
      Validated by: Mean judge-scored quality gain from reasoning-guided
      editing on a 5,866-image test subset: +0.789 for the trained actor vs
      +0.213 for Q-Insight and -0.137 for the untrained Qwen3.5-4B, with the
      direction preserved under a swapped editor (Mage-Flow) and two swapped
      judges (Q-Insight, GPT-5.6 Sol, 81.4% 3AFC preference); rating
