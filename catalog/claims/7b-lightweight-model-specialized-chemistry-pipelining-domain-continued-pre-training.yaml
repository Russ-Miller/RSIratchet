    stance: supports
    note: >-
      Validated by: Hallucination score on the 471-question ChemJudge
      benchmark (79.46% reduction vs base model, better than GPT-4o mini),
      accuracy on ThChem 1.0/2.0 (79.45%/62.08%) and ChemBench (49.82%),
      plus a reported 20-40% F1 gain of the multi-agent synthesis over a
      single LLM on SQuAD 2.0; no baseline of equal-size
      single-model-synthesized chemistry data is reported.. Measured on one
      model, one domain, one 471-question judge benchmark with expert
      verification of deductions. [truncated]
