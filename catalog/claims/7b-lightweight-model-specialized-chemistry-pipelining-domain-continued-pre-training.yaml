id: 7b-lightweight-model-specialized-chemistry-pipelining-domain-continued-pre-training
ref: CLM-0547
capability: hallucination
technique: synthesize-training-data-role-split-generator-student-supervisor
statement: >-
  For a 7B lightweight model specialized to chemistry, pipelining domain
  continued pre-training, fine-tuning on multi-agent-synthesized
  chain-of-thought and QA data grounded in supplied source literature, and a
  final judge-scored adaptive training stage cuts the LLM-judged
  hallucination rate by about 79% relative to the base model, and the
  ablation reports the final adaptive stage is needed to undo the
  catastrophic forgetting introduced by full-parameter fine-tuning.
kind: observation
backing_strength: single-paper
