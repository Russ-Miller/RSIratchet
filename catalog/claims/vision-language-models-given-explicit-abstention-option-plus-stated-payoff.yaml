id: vision-language-models-given-explicit-abstention-option-plus-stated-payoff
ref: CLM-0691
capability: abstention-and-self-knowledge
statement: >-
  When vision-language models are given an explicit abstention option plus a
  stated payoff for correct, wrong and declined answers, quadrupling the
  penalty for a wrong answer barely changes how often they answer, so their
  abstention rate is largely insensitive to the stated cost of error across
  text, synthetic video and natural video recall tasks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine pretrained VLM families on an associative-recall memory task (candidate occurred in stream or not) with two prompt arms differing only by an appended payoff sentence (+3/-1 vs"
sources:
  - source: arxiv-2609-00103
    stance: supports
    note: >-
      Measured: coverage R per model under two payoff arms on three
      evaluation subsets (synthetic text, synthetic video, natural video).
      Paper reports no model abstains meaningfully more under the costlier
      arm, and some abstain more when guessing is cheaper. Payoff-scored
      comparison shows small movement in the right direction and most
      dropped questions were ones answered wrong in the other arm, so
      selectivity exists while responsiveness does not. Single paper;
      abstention elicited only by prompt framing, not by any trained
      mechanism.
contested: false
status: pending-review
last_checked_at: 2026-10-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Showing that models
  materially lower coverage when the wrong-answer penalty rises, under the
  same two-arm prompt protocol, on these or comparable recall tasks.
