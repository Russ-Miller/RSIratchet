id: llm-agent-asked-diagnose-enterprise-specific-incidents-has-no-curated
ref: CLM-1168
capability: domain-knowledge
technique: curate-domain-knowledge-only-where-agent-fails
statement: >-
  When an LLM agent is asked to diagnose enterprise-specific incidents it
  has no curated domain context for, it does not signal the gap but produces
  confidently plausible fabricated domain entities (e.g. a non-existent
  'data replication pipeline') and conflates identifiers across categories,
  so a human expert must reject and correct the output rather than merely
  extend it.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single synthetic retail order-fulfillment domain, nine incident-diagnosis cycles with one SRE-agent role; no model named, no baseline, judgements made by the authors acting as doma"
sources:
  - source: arxiv-2603-14057
    stance: supports
    note: >-
      Validated by: Not measured against any baseline: the paper reports 46
      entities over nine cycles, new entities falling from 8 to 2, reuse
      ratio rising 0.0 to 0.75, and correction loops absent in the last
      three cycles, all on a synthetic domain with authors as both curator
      and judge.. Argued from a single narrated cycle (cycle 6) in a
      synthetic domain the authors constructed; no model identified, no
      error rates, no comparison condition, and the same people who wrote
      the problems judged the outputs. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An agent given no
  enterprise domain context that reliably reports 'I lack information about
  this system' instead of naming non-existent systems, or a controlled count
  showing fabricated-entity rates no higher without curated context than
  with it.
