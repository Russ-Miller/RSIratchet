id: spoken-language-models-answering-questions-over-long-dialogue-histories
ref: CLM-0404
capability: audio-understanding
technique: pick-history-modality-what-question-needs
statement: >-
  For spoken language models answering questions over long dialogue
  histories, converting the history to transcripts beats keeping it as audio
  when the answer is a lexical detail (exact slot values across dense turns:
  mean 71.3% vs 42.6%), but loses when the answer depends on how something
  was said, where audio history wins for six of seven models and by a larger
  margin once lexical emotion cues are removed.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven spoken language models (Qwen3-Omni, GLM-4-Voice, AudioFlamingo3/Next, MiMo-Audio, Gemini-3.1-Pro, Qwen3.5-Plus) at a 32,768-token context, with text histories from SenseVoice"
sources:
  - source: arxiv-2609-22452
    stance: supports
    note: >-
      Validated by: Each model run twice on the same 13,516 QA pairs with
      text vs audio history; text won on Ultra Multi-Turn (71.3% vs 42.6%
      mean) and Personal Monologues, audio won on Beyond-Semantic for six of
      seven models, with the audio advantage rising from -0.6 to +6.6 points
      model-averaged when semantic emotion cues were controlled by
      synthesizing neutral text in emotional styles.. Measured on a
      purpose-built benchmark (1,474 sessions, 13,516 QA, 127.96h) with
      answer-provenance annotations; both modalities run on the same items,
      so the comparison is controlled. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model set where audio
  history matches or beats transcripts on exact lexical retrieval from long
  histories, or where transcripts match audio on emotion questions whose
  text is semantically neutral.
