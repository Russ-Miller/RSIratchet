  - source: arxiv-2601-08557
    stance: supports
    note: >-
      Validated by: ROC-AUC against LLM-judge binary hallucination labels on
      1,460 SoccerChat items, compared with Semantic Entropy and RadFlag
      computed on the same samples; VASE highest or near-highest in most
      model/task/clustering cells, rising from ~0.54 at 1 distortion to
      ~0.62-0.63 at 10.. Measured on one domain (soccer clips) with a single
      perturbation family (brightness/contrast/saturation/hue plus FFmpeg
      noise) and LLM-judge labels, no human adjudication; [truncated]
