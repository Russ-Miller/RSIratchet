id: 7b-video-vlms-answering-short-clip-soccer-questions-uncertainty-scores-computed
ref: CLM-0983
capability: hallucination
technique: score-video-hallucination-clean-vs-perturbed-semantic-entropy
statement: >-
  For 7B video-VLMs answering short-clip soccer questions, uncertainty
  scores computed only from clean-input samples (semantic entropy, RadFlag)
  separate hallucinated from supported answers near chance, while an entropy
  score that contrasts the semantic cluster distribution from clean clips
  against photometrically and spatiotemporally perturbed clips detects
  hallucination better, with the margin growing as more distorted variants
  are sampled.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three 7B Video-VLMs (Qwen2-VL, Qwen2.5-VL, a SoccerChat-finetuned model) on 1,460 short soccer clip QA/event-classification items, hallucination labels from an LLM judge; absolute "
