    stance: supports
    note: >-
      Validated by: Mean judge-scored quality gain from reasoning-guided
      editing rose from -0.136 (baseline) and -0.260 (rating-only) to +1.079
      with the credit mask, with rating alignment held at 0.838/0.812
      average PLCC/SRCC; gains persisted when the editor was swapped
      (Mage-Flow) and judges swapped (Q-Insight, GPT-5.6 Sol, 81.4% 3AFC
      preference). The unmasked variant got a larger raw gain (+1.442) but
      collapsed to a near-universal edit.. Measured on six IQA benchmarks
      with an ablation isolating rating-only versus masked credit
      assignment, plus editor and judge swaps. [truncated]
