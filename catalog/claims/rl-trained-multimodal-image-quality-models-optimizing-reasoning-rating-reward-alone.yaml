id: rl-trained-multimodal-image-quality-models-optimizing-reasoning-rating-reward-alone
ref: CLM-0478
capability: explanation-faithfulness
technique: reward-reasoning-edit-justifies-token-masked-credit
statement: >-
  In RL-trained multimodal image-quality models, optimizing reasoning with
  the rating reward alone raises rating alignment while leaving the stated
  reasoning unfaithful: rating-only training reached competitive PLCC/SRCC
  yet its reasoning-guided edits lowered judged image quality (mean gain
  -0.260, below the untrained baseline's -0.136), so rating accuracy is not
  evidence that the explanation names the real quality-limiting factors.
