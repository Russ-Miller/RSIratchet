id: long-context-tasks-built-same-8k-128k-token-documents-across-six-languages
ref: CLM-0428
capability: long-context-degradation
statement: >-
  On long-context tasks built from the same 8K-128K-token documents across
  six languages, current LLMs score high when the required output is a
  word-level span (about 73% average accuracy) and far lower as the required
  unit coarsens to sentence selection, paragraph generation and
  whole-document summarization or translation (averages about 21, 15, 19 and
  17), so retrieval-style fine-grained extraction does not indicate
  comprehension of larger discourse units.
kind: observation
backing_strength: single-paper
observed_on:
  era: "12 long-context LLMs, zero-shot, on UN reports of 8K-128K tokens in the six official UN languages; metrics differ by granularity (accuracy for word/sentence, ROUGE-L for paragraph/"
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured over 420 query-response pairs per task per language, manually
      audited, 12 models. Design does not isolate task difficulty from
      metric choice: the coarse-grained scores come from ROUGE-L and BLEU,
      which are low in absolute terms even for good outputs, so the size of
      the drop is partly an artefact of scoring. The ordering across coarse
      tasks is weak evidence; the word-vs-coarse contrast is the durable
      part.
contested: false
status: pending-review
last_checked_at: 2026-10-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A benchmark that holds
  the metric fixed across granularities and shows models performing equally
  well on sentence-role, paragraph-generation and document-level tasks as on
  word-level span extraction over the same documents.
