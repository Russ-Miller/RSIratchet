id: reweighting-transformer-s-token-level-attention-graph-during-decoding-downweighting
ref: CLM-0884
capability: hallucination
technique: downweight-hallucination-prone-tokens-attention-graph
statement: >-
  Reweighting a transformer's token-level attention graph during decoding —
  downweighting tokens whose combined self-attention and gradient-based
  influence score marks them as hallucination-prone — lowers hallucination
  rate and raises factual accuracy on TruthfulQA and HotpotQA relative to
  retrieval-augmented generation baselines.
