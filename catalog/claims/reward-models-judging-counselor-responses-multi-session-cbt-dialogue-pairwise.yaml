id: reward-models-judging-counselor-responses-multi-session-cbt-dialogue-pairwise
ref: CLM-0981
capability: critique
technique: score-counseling-judges-best-of-n-pairwise
statement: >-
  For reward models judging counselor responses in multi-session CBT
  dialogue, pairwise preference accuracy overstates reliability relative to
  Best-of-N selection against four subtly-flawed candidates: across 16
  discriminative and LLM-as-judge models, pairwise accuracy mostly sits
  between 73% and 84% while Best-of-N accuracy falls to 40-73%, an average
  gap above 20 points that is largest for generative judges.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Long-horizon, multi-session CBT counseling prompts built by progressive summarization; chosen responses are real counselor utterances, rejected ones are LLM-generated subtle therap"
sources:
  - source: arxiv-2603-11494
    stance: supports
    note: >-
      Validated by: Benchmark rankings from this protocol correlated with
      downstream Best-of-16 selection quality (BERTScore against reference
      counselor responses, pooled over four policy models) at Spearman 0.700
      (p~0.036), above RewardBench2's 0.633 (p~0.067).. Measured on ~6,948
      pairwise pairs and ~6,945 Best-of-4 queries from 118 six-session CBT
      cases, 16 reward models. [truncated]
