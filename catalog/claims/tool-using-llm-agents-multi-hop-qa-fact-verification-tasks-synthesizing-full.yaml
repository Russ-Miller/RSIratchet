notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Running the same backbone
  with a plain ReAct or DFSDT loop plus only a deterministic step/iteration
  cap matching the plan's k_max closes most of the accuracy gap on
  uncalibrated FEVER and HotpotQA, showing the gain comes from bounded
  termination rather than from the structured plan.
