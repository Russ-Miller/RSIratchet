    stance: supports
    note: >-
      Validated by: Correct-patch counts on 835 Defects4J bugs with manual
      patch inspection against developer ground truth, against Hercules,
      ITER and ARJACLM run in the same environment; plus 17 GHRB sibling
      bugs with a pre-dataset-cutoff model (GPT-3.5-Turbo) as a leakage
      control.. Measured on 835 Defects4J bugs plus 17 GHRB sibling bugs
      with manual correctness assessment of 1,751 plausible patches split
