id: multi-hunk-java-bug-repair-where-same-mistake-recurs-several
ref: CLM-0860
capability: debugging
technique: retrieve-sibling-locations-embedding-similarity-then-llm-patch
statement: >-
  For multi-hunk Java bug repair where the same mistake recurs at several
  code locations, retrieving sibling candidates by token plus embedding
  similarity over all test-exercised code and letting an LLM pick and patch
  them beats template-based sibling repair restricted to failing-test
  coverage and commit history (23 vs 4 sibling bugs, 76 vs 9 multi-hunk bugs
  on Defects4J under spectrum-based localization).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Java bugs in Defects4J v1.2/v2.0 and GHRB with reproducing test suites, 5-hour budget, DeepSeek-V3.2 backbone, spectrum-based or single-perfect fault localization."
