    note: >-
      Validated by: Accuracy on five knowledge-intensive QA benchmarks
      (HealthQA, ARC-C, PopQA, SQuAD 1.1, ASQA) against vanilla DPO,
      full-order DPO, a global-local trajectory system (SMART) and RL
      baselines (GiGPO, SPA-RL); reported average 60.57 vs 55.70-56.55, with
      removal of the inter-agent loss the largest single ablation drop..
      Measured on five QA benchmarks with one 7B backbone, with ablations
