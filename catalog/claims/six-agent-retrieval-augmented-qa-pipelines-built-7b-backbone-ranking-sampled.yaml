id: six-agent-retrieval-augmented-qa-pipelines-built-7b-backbone-ranking-sampled
ref: CLM-0824
capability: multi-model-coordination
technique: rank-trajectories-inter-agent-dependency-pairwise-win-loss
statement: >-
  In six-agent retrieval-augmented QA pipelines built on a 7B backbone,
  ranking sampled trajectories by how consistently they score tightly
  coupled agents (retriever, filter, locator) together — rather than by a
  single winning/losing pair or a full-order sort on raw preference scores —
  yields higher answer accuracy, because the score pattern across coupled
  agents carries the dependency information a single pairwise contrast
  discards.
kind: mechanism
backing_strength: single-paper
