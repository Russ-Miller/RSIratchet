id: personalized-generative-reward-model-llama-3-1-8b-judging-which-response
ref: CLM-1197
capability: critique
technique: pool-scores-user-s-own-samples-similar-users
statement: >-
  For a personalized generative reward model (LLaMA-3.1-8B) judging which
  response a given user prefers, aggregating scores sampled under similar
  users' inferred preferences substitutes efficiently for more samples of
  the user's own scoring scheme — 16 own-samples plus 8 similar-user samples
  beat 32 own-samples on Chatbot Arena-Personalized and PRISM-Personalized —
  but the substitution is bounded: adding similar-user scores without
  own-samples, or raising them to 16, scores below the unscaled model.
kind: observation
