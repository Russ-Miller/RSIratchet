    stance: supports
    note: >-
      Validated by: Accuracy on Chatbot Arena-Personalized and
      PRISM-Personalized over 5 runs: base 72.68/65.32, Ind-16+Pro-8
      75.92/68.06, Ind-32 75.59/67.65, Ind-0+Pro-8 66.90/57.65,
      Ind-16+Pro-16 72.59/64.61; prototype count swept 0-125 with a peak at
      50.. Measured on two personalized preference benchmarks with one 8B
      backbone, 5 runs, standard errors ~1.6-1.9% on Chatbot Arena where
      several scaling configurations differ by less than that spread; the
      ordering of Ind-16+Pro-8 over Ind-32 is within overlapping error bars
      on Chatbot Arena and clearer on PRISM. [truncated]
