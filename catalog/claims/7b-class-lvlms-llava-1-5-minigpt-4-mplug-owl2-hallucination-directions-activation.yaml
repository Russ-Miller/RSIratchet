id: 7b-class-lvlms-llava-1-5-minigpt-4-mplug-owl2-hallucination-directions-activation
ref: CLM-0554
capability: visual-grounding
technique: weight-several-hallucination-subspaces-per-image-one-global
statement: >-
  In 7B-class LVLMs (LLaVA-1.5, MiniGPT-4, mPLUG-Owl2), hallucination
  directions in activation space are not a single mode: clustering
  hallucinated-minus-faithful hidden-state differences into several low-rank
  subspaces and weighting them per test image lowers object-hallucination
  rates slightly below a single global null-space projection, with the
  margin small (CHAIR_I 5.30 to 4.92 on LLaVA-1.5) and inconsistent on
  yes/no existence probing.
