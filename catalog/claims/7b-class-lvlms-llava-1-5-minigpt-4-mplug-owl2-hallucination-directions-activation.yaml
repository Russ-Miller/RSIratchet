  which a single global subspace with the same total rank and the same
  masked-image probe matches the per-instance mixture on CHAIR and POPE, or
  in which randomly partitioned clusters work as well as the
  difference-vector clustering. Drafted stance toward
  training-free-inference-time-hallucination-interventions-7b-class-vision-language-models-increasing-intervention:
  supports -- The basis-rank ablation shows CHAIR_S falling monotonically
  from 16.2 to 11.3 as rank grows from 1 to 64 while BLEU falls from 15.6 to
  12.7, which the authors read as loss of grounded content, matching the
  claim that stronger intervention buys lower hallucination scores with
  reduced informativeness.
