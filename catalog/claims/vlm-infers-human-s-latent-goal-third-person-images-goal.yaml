id: vlm-infers-human-s-latent-goal-third-person-images-goal
ref: CLM-0269
capability: planning
technique: predict-human-s-goal-state-their-next-actions
statement: >-
  When a VLM infers a human's latent goal from third-person images and that
  goal is handed to a formal multi-agent symbolic planner, end-to-end
  joint-plan success is limited almost entirely by the goal-inference step,
  not the planner: with ground-truth goals substituted the same pipeline
  reaches near-ceiling success, and success collapses on multi-object human
  activities where the VLM misses one of several required goal predicates.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Household VirtualHome simulation, one human and one robot, scene graph given, cooperative goal-consistent human assumed; six activities, four scenes, two robot task types, 2,400 tr"
sources:
  - source: arxiv-2609-17771
    stance: supports
    note: >-
      Validated by: Joint-plan success rate 69.71% vs 35.50% for
      VLM-as-planner and 34.42% for GG-LLM (paired cluster bootstrap CI
      +21.7 to +47.1); functional conflict rate roughly halved; oracle-goal
      ablation 96.38%; 99.60% planner success on the 1,490 trials with both
      goals correct.. Measured in one simulator with a validator that scores
      against ground-truth goals; the oracle-goal ablation isolates the
      grounding step cleanly, but the human is a scripted goal-consistent
      agent, so planner reliability is measured under an assumption that
      removes human deviation.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Substituting
  ground-truth human goals fails to raise success rate much above the
  predicted-goal pipeline, or failures with correct goals turn out to be
  planner failures rather than grounding errors.
