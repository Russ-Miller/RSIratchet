id: real-world-online-rl-post-training-large-pretrained-vision-language-action-policies-high-precision
ref: CLM-0217
capability: embodied-control
statement: >-
  For real-world online RL post-training of large pretrained
  vision-language-action policies on high-precision manipulation, optimizing
  the action head toward a paired advantage margin against a frozen
  reference action, rather than maximizing absolute Q values, yields higher
  autonomous success on long multi-step tasks, because absolute-Q
  maximization amplifies early optimistic value errors into policy drift
  that behavior-cloning regularization alone does not stop.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Real-robot online RL with human intervention, large flow-based VLA backbones (pi-0.5 class) with only LoRA action-expert parameters trained, on millimeter-precision chemistry manip"
sources:
  - source: arxiv-2609-04355
    stance: supports
    note: >-
      Nine real tasks, four embodiments, 20 held-out trials per task: 98.3%
      mean success vs 67.8% for fine-tuned pi-0.5 and 10.0% for the
      strongest absolute-Q RL baseline (Robo-Dopamine), plus training curves
      on five tasks showing baselines stuck near 0-10% autonomous success.
      The comparison changes backbone, algorithm, and system at once, so the
      relative-advantage mechanism is argued from baseline failure modes
      rather than isolated by a matched ablation in the text provided.
