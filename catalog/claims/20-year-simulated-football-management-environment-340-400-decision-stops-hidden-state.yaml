id: 20-year-simulated-football-management-environment-340-400-decision-stops-hidden-state
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year simulated football-management environment with ~340-400
  decision stops, hidden state and adaptive rivals, final score across 15
  frontier models is predicted by managerial behaviors — cutting slow-payoff
  investment near the horizon end (Spearman -0.58), keeping cash deployed
  rather than idle (-0.50), and opening contract renewals early (+0.45) —
  while token spend, model scale, price and vendor predict nothing, and
  year-5 standings correlate only weakly (0.19) with the final order.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One deterministic football-management simulator, 15 flagship models, three seeds solo plus one shared-world Arena seed; scoring is a fixed composite that discounts idle cash by des"
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured: Spearman correlations over 15 models, reported with per-seed
      signs consistent across three seeds; compute null checked under three
      accountings (all p>0.38, n=15). Small n (15 models), single
      environment, and the idle-cash correlation is partly built into the
      scoring formula's anti-hoarding discount, so that axis is not
      independent of the metric.
