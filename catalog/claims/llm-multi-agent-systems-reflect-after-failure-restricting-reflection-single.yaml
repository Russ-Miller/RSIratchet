id: llm-multi-agent-systems-reflect-after-failure-restricting-reflection-single
ref: CLM-0405
capability: multi-model-coordination
technique: reflect-only-agent-made-first-wrong-step
statement: >-
  In LLM multi-agent systems that reflect after failure, restricting
  reflection to the single agent responsible for the first incorrect step —
  located by a trained step-level correctness scorer and paired with a
  counterfactually generated corrected step — raises task success more than
  having every agent reflect on the trajectory, because reflections written
  by agents that behaved correctly enter their memory as misleading guidance
  for later tasks.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Task-oriented collaborations with clear success criteria and small agent teams (Magentic-One over HotPotQA, ChartQAPro, Mind2Web), frozen GPT-4o-mini actors with a fine-tuned 8B re"
sources:
  - source: arxiv-2608-28264
    stance: supports
    note: >-
      Validated by: Success rate on 100 sampled tasks per dataset over five
      trials: +22/26/27 points over initial success on HotPotQA, ChartQAPro,
      Mind2Web, above Reflexion, Retroformer and COPPER; ablation removing
      diagnosis+correction gave the largest drop; the attribution component
      beat All-at-once/Step-by-step/Binary-search on agent- and step-level
      accuracy on held-in and held-out Who&When data.. Measured on three
      benchmarks with 100-task test sets and five trials, against three
      reflection baselines, plus ablations. [truncated]
