id: 1b-8b-open-llms-hallucination-correction-methods-edit-activations-or-logits
ref: CLM-0791
capability: hallucination
technique: gate-correction-exact-latent-density-probabilistic-circuit
statement: >-
  For 1B-8B open LLMs, hallucination-correction methods that edit
  activations or logits at every decoding step degrade a large fraction of
  generations that were already correct (26-90% depending on model), so
  gating the correction on a per-token anomaly signal recovers much of that
  loss.
kind: mechanism
backing_strength: single-paper
