    note: >-
      Validated by: Detection AUROC up to 0.99 on CoQA/SQuAD/TriviaQA
      against Token-NLL, SEP, HaloScope and AutoFact baselines; gated vs
      un-gated comparison of six correction methods over three seeds reports
      mean corruption rate 53.7% and preservation rate 79.3% for the
      proposed decoder, plus best True+Info/MC2/MC3 on TruthfulQA in three
      of four models.. Measured on four models (Llama-3.2-1B, Qwen3-4B,
      Mistral-7B-v0.3, Llama-3.1-8B), four benchmarks, three seeds, with
      un-gated vs gated arms for six correction methods. [truncated]
