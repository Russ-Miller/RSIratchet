  era: "Four LLMs from 1B to 8B across CoQA, SQuAD v2.0, TriviaQA and TruthfulQA; correction methods DoLa, ITI, AdaSteer, SADI, ICD; gate calibrated on a labeled set of factual/hallucinate"
