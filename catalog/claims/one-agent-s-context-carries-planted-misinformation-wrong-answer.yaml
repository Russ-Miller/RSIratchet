id: one-agent-s-context-carries-planted-misinformation-wrong-answer
ref: CLM-0313
capability: multi-model-coordination
statement: >-
  When one agent's context carries planted misinformation, the wrong answer
  persists through multi-agent debate and other agents often adopt it, yet
  debate still degrades less than a single misinformed agent (relevant
  misinformation cut single-agent accuracy by 16-25% on CWQ), especially
  when most agents are unexposed; consensus protocols were more stable than
  voting under peer pressure, and a misinformed majority can steer the
  group.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Reasoning, knowledge and alignment tasks with intent-based misinformation injected into one or more agents' context, open models such as GLM-4, 2026; debate with voting versus cons"
sources:
  - source: arxiv-2606-16710
    stance: supports
    note: >-
      Injected rather than naturally occurring misinformation; group
      composition and protocol effects are the useful design guidance.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Debate configurations
  where a single misinformed agent reliably flips a correct majority, or
  where consensus is less robust than voting.
