id: frontier-llms-forecast-live-prediction-markets-repeatedly-over-weeks
ref: CLM-1001
capability: forecasting
technique: score-forecasters-belief-revision-volatility-just-accuracy
statement: >-
  When frontier LLMs forecast live prediction markets repeatedly over weeks,
  models that emit longer reasoning traces per update revise their
  probabilities more aggressively and more often than terse models, and that
  extra verbosity does not buy more valid, in-budget decisions — the
  longest-reasoning model in the set had the lowest rate of successfully
  returned decisions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Eight frontier models deployed concurrently on Polymarket over a 30-day window under locked prompts and identical token/information constraints; token length varied across models r"
sources:
  - source: arxiv-2601-13545
    stance: supports
    note: >-
      Validated by: Not measured as an intervention; the paper reports that
      models with comparable forecast accuracy separate on drift, token
      spend and valid-decision rate across 500+ live markets, but gives no
      accuracy-matched comparison or statistical test.. Descriptive,
      observational: per-model token counts, strategy-selection frequencies,
      adjustment depth and successful-decision counts are reported over a
      30-day live window, with no controlled manipulation of reasoning
      length and no significance testing, so model identity is fully
      confounded with verbosity. [truncated]
contested: false
