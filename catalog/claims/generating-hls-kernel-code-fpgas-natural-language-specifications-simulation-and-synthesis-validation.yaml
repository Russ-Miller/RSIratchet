id: generating-hls-kernel-code-fpgas-natural-language-specifications-simulation-and-synthesis-validation
ref: CLM-0396
capability: code-generation
technique: pair-evolutionary-kernel-search-c-level-functional-repair
statement: >-
  For generating HLS kernel code for FPGAs from natural-language
  specifications, simulation-and-synthesis validation does not cover the two
  distinct failure modes, so a C/C++-level functional verify-and-repair loop
  raises functional correctness while leaving synthesizability and
  board-level executability roughly unchanged, and an evolutionary search
  over candidate kernels guided by synthesis feedback raises
  synthesizability and executability but leaves functionally wrong kernels
  in place; only both together close the end-to-end gap.
