id: long-video-qa-under-fixed-frame-budget-frozen-7b-multimodal
ref: CLM-0556
capability: video-temporal-reasoning
technique: search-hierarchical-temporal-tree-video-segments-coarse-to
statement: >-
  For long-video QA under a fixed frame budget with a frozen 7B multimodal
  model, organizing frames into a question-agnostic hierarchical temporal
  tree and searching it coarse-to-fine (answer, then issue a search
  statement, then expand the relevant branch) raises accuracy over uniform
  sampling and over agent methods that score frames independently, with the
  gain largest on the longest-video benchmarks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Training-free, Qwen2.5-VL-7B, same frame budget as the baselines; evaluated on VideoMME, LongVideoBench, LVBench."
sources:
  - source: arxiv-2608-27871
    stance: supports
    note: >-
      Validated by: Accuracy on VideoMME, LongVideoBench and LVBench with
      Qwen2.5-VL-7B at matched frame budget: +0.5%, +4.6%, +4.4% over the
      baseline.. Measured on three long-video QA benchmarks with one 7B
      backbone; gains are small on VideoMME (0.5%) and larger on the two
      longer-video benchmarks. No ablation reported in the source text
      isolating the tree construction from the answer-retrieve-explore loop,
      and only one backbone is shown.
