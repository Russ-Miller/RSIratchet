id: language-model-must-judge-whether-specific-vehicle-perform-described
ref: CLM-0409
capability: planning
technique: ground-mission-feasibility-ontology-inferred-capabilities
statement: >-
  When a language model must judge whether a specific vehicle can perform a
  described mission, it is overconfident about partially-capable
  configurations — declaring the mission fully possible despite missing
  hardware — and supplying the required-capability list plus the vehicle's
  inferred capabilities from an ontology is what corrects that specific
  error, not the harder fully/impossible cases which the models already get
  mostly right.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Locally hosted Llama3, Qwen2.5 and GPT-OSS judging one inspection/anode-test mission description against three simulated UUV configurations, 5 runs per condition."
sources:
  - source: arxiv-2608-29347
    stance: supports
    note: >-
      Validated by: Feasibility-verdict accuracy over 5 runs per vehicle
      configuration per model, compared against the same prompt with the
      ontology requirements removed; with requirements GPT-OSS reached 100%
      on all three configurations, and without them the models mislabelled
      the partially-possible configuration and named the wrong missing
      component.. Measured but very thin: one mission description, three
      vehicle configurations, 5 runs each, three small models, simulation
      only. The ablation does isolate the ontology requirements from the
      rest of the prompt. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-03
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Running the same
  feasibility judgements with and without ontology-supplied capability
  requirements and finding the partially-possible configuration no better
  with them, or finding the gain spread evenly across fully-possible and
  impossible cases rather than concentrated on partial ones.
