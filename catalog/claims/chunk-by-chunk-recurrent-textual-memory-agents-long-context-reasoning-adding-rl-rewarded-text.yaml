    stance: supports
    note: >-
      Validated by: Compared against vanilla MemAgent on several
      long-context reasoning tasks, reporting generally higher accuracy and
      up to 400% inference speedup.. Measured against one baseline
      (MemAgent) on several long-context reasoning benchmarks; the abstract
      gives no per-task numbers, no ablation separating the update gate from
      the exit gate, and no accuracy figures alongside the speedup claim.
