id: chunk-by-chunk-recurrent-textual-memory-agents-long-context-reasoning-adding-rl-rewarded-text
ref: CLM-1056
capability: long-context-degradation
technique: gate-memory-writes-loop-exit-rl-trained-text
statement: >-
  For chunk-by-chunk recurrent textual-memory agents on long-context
  reasoning, adding RL-rewarded text gates that skip memory writes on
  evidence-free chunks and exit the loop once evidence suffices raises
  accuracy over unconditional per-chunk memory updating while cutting
  inference time substantially.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Recurrent chunked-memory agents (MemAgent-style) trained end-to-end with RL on long-context reasoning tasks; no evidence for non-recurrent long-context methods."
sources:
