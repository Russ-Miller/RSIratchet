notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A run on the same or
  similar backbones showing the ungrounded critique loop raising accuracy
  beyond the confidence interval on a benchmark where single-shot accuracy
  is already high, or failing to help on a low-single-shot benchmark.
  Drafted stance toward self-critique-without-grounding-unreliable: supports
  -- Unaided self-critique moved accuracy not at all on clean BBH and
  fixed-depth self-refinement dropped below single-shot there (71.2% vs
  73.8%), consistent with ungrounded critique being an unreliable
  improvement signal.
