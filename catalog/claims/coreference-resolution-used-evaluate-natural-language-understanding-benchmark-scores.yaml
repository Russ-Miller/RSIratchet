id: coreference-resolution-used-evaluate-natural-language-understanding-benchmark-scores
ref: CLM-1028
capability: evaluation-validity
technique: compare-coreference-systems-across-datasets-under-controlled-backbone
statement: >-
  When coreference resolution is used to evaluate natural language
  understanding, benchmark scores do not support general conclusions about a
  system's coreference ability, because datasets operationalize coreference
  under competing definitions and rank the same models differently across
  benchmarks.
