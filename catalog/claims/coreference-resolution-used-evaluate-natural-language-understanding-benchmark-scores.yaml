      removed most, though not all, of the performance improvement reported
      over the prior five years.. Thesis-level synthesis: a cross-dataset
      comparison of seven corpora documenting divergent coreference
      definitions and conflicting model rankings, plus a controlled
      re-evaluation of five systems. Isolates backbone as a confound but
      does not quantify how much ranking variance each definitional
