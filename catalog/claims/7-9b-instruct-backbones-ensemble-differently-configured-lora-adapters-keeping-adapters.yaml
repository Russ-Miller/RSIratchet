      semantic entropy (NLI and cosine), Bayesian/Laplace-LoRA, and the same
      five adapters mean-pooled, across three backbones and five datasets..
      Measured on three backbones (Gemma-2-9B, Llama-3.1-8B, Qwen2.5-7B) and
