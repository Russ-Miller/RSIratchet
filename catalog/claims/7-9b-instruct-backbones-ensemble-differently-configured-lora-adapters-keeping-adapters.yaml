id: 7-9b-instruct-backbones-ensemble-differently-configured-lora-adapters-keeping-adapters
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: abstain-interval-dominance-over-lora-adapter-credal-set
statement: >-
  For 7-9B instruct backbones with an ensemble of differently-configured
  LoRA adapters, keeping the adapters' per-answer probabilities as interval
  bounds (min/max) and committing only when one candidate's lower bound
  exceeds every other's upper bound yields a threshold-free abstention rule
  that collapses commitment when the supplied passage is corrupted (CoQA
  31-48% down to 4-8%), whereas mean-pooled or single-model uncertainty
  scores thresholded to the same clean-data coverage keep answering more of
  the corrupted prompts.
kind: mechanism
backing_strength: single-paper
