id: small-open-weight-models-1b-3b-qwen2-5-llama-3-2
ref: CLM-0896
capability: long-term-memory
technique: constrain-memory-key-generation-trie-existing-keys
statement: >-
  For small open-weight models (1B-3B Qwen2.5 and Llama 3.2) answering
  questions over multi-session dialogue histories, constraining decoding to
  a prefix trie of existing memory keys so the model cannot emit a
  nonexistent key, then expanding one hop over a co-occurrence graph, raises
  F1 over dense-retrieval memory systems across single-hop, multi-hop,
  temporal and adversarial categories.
kind: observation
backing_strength: single-paper
observed_on:
  era: "LoCoMo benchmark only; open-weight models 1B-3B where logits are accessible; gains reported against A-MEM and other retrieval baselines; no frontier-model comparison"
sources:
  - source: arxiv-2604-20117
    stance: supports
    note: >-
      Validated by: F1 and BLEU-1 on four LoCoMo categories against LoCoMo
      full-context, ReadAgent, MemoryBank, MemGPT and A-MEM on four
      backbones; ablation replacing constrained decoding with unconstrained
      generation plus embedding lookup drops multi-hop F1 39.5%. Measured on
      one benchmark with four small open-weight backbones; [truncated]
contested: false
