id: forecasting-next-year-music-festival-lineups-link-prediction-between-artists
ref: CLM-0359
capability: forecasting
statement: >-
  On forecasting next-year music festival lineups (link prediction between
  artists and festivals), zero-shot LLMs prompted for ranked candidate lists
  score far below specialized temporal-knowledge-graph forecasting models
  trained on the domain graph, and their errors are dominated by popularity
  bias toward globally famous artists plus duplicate entries in the ranked
  list.
kind: observation
backing_strength: single-paper
observed_on:
  era: "380 German festivals, 1971-2025 yearly TKG, single-step prediction of 2025; LLMs tested were Llama 3.1 8B, Llama 3.3 70B (quantized), Mixtral 8x7B, GPT-4o-mini, given no candidate "
sources:
  - source: arxiv-2609-24467
    stance: supports
    note: >-
      Measured on the paper's own benchmark: for artist prediction the best
      LLM reached 1.7% normalized 10-precision versus 11.9% for CognTKE; for
      festival prediction the best LLM reached 17.2% versus 41.4% for
      CountTRuCoLa. Popularity bias is evidenced by GPT-4o-mini naming
      Billie Eilish in the top 3 for 47.1% of queries and Llama 3.1 8B
      repeating one artist ~23 times per query. LLMs were not given the
      entity set, so part of the gap is the harder open-vocabulary setting
      rather than forecasting skill; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A zero-shot or
  retrieval-augmented LLM matching or exceeding the best TKG model's
  R-Precision and normalized 10-precision on the same 2025 test queries in
  both prediction directions, without popularity-biased or duplicated
  candidates.
