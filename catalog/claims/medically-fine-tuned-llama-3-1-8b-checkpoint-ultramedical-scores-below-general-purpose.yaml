id: medically-fine-tuned-llama-3-1-8b-checkpoint-ultramedical-scores-below-general-purpose
ref: CLM-0372
capability: domain-knowledge
technique: reweight-jargon-favoring-components-post-hoc
statement: >-
  A medically fine-tuned Llama-3.1-8B checkpoint (UltraMedical) scores below
  its general-purpose Instruct counterpart on both selecting the correct
  definition of medical jargon in EHR context and judging whether a term is
  jargon, and its errors are almost entirely false positives — it treats
  ordinary words in clinical text as specialized.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One model pair (Llama-3.1-8B Instruct vs UltraMedical), English medical jargon benchmarks built from README/UMLS; fine-tuning data and procedure are uncontrolled confounds."
sources:
  - source: arxiv-2609-13556
    stance: supports
    note: >-
      Validated by: Raised UltraMedical's jargon-identification accuracy
      from 53.1% to 56.1% (McNemar p=0.01) by correcting 270 false positives
      at the cost of 146 new false negatives; the same procedure lowered
      Instruct's accuracy by 1.0 point and gave under 0.2 points on the
      understanding task.. Measured on held-out splits (1,495 JU items,
      2,990 JI items) with Wilson intervals and a paired McNemar test; gaps
      are small (76.1 vs 74.1 on JU, 58.8 vs 53.1 on JI) and the design
      cannot isolate fine-tuning as the cause, since training data and
      recipe differ.
contested: false
status: pending-review
last_checked_at: 2026-09-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A controlled fine-tune
  on medical text, or other general/medical model pairs, showing the
  domain-adapted model matching or beating the general model on the same
  jargon understanding and identification tasks.
