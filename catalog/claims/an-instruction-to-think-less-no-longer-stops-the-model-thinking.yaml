id: an-instruction-to-think-less-no-longer-stops-the-model-thinking
ref: CLM-0953
capability: cutting-to-the-chase
statement: An instruction such as “answer directly without deliberating”,
  which Claude Fable 5.1 usually follows, did not stop Claude Fable 5.2 from
  thinking at medium effort and above; the effort setting, not prompt text,
  is what controls how much it thinks, so instructions written for the
  earlier model stop working on migration.
