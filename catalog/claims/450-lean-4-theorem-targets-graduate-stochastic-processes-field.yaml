id: 450-lean-4-theorem-targets-graduate-stochastic-processes-field
ref: CLM-0340
capability: formal-math
statement: >-
  On 450 Lean 4 theorem targets in graduate stochastic processes — a field
  thinly covered by Mathlib — a tool-using frontier agent (Opus 4.8 with
  Lean LSP access, one 15-minute run per problem) proves only 34.9%, and the
  rate varies widely by topic, from about 5% on renewal processes to about
  62% on martingales and stopping.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single agent, single 15-minute budget, one run per problem; targets human-written with LLM formalization assistance; some failures traced to formalization defects rather than provi"
sources:
  - source: arxiv-2609-09264
    stance: supports
    note: >-
      Measured: 157/450 clean Lean-checked proofs, broken down by eight
      topics and by direct vs abstracted statements (69.3% vs 23.2%, which
      the authors call descriptive and uncontrolled). No model comparison,
      no repeated runs, no baseline prover.
contested: false
