id: two-agent-embodied-social-tasks-where-one-agent-must-guide
ref: CLM-0503
capability: embodied-control
statement: >-
  In two-agent embodied social tasks where one agent must guide or mislead
  the other through movement, gaze and facial expression, open-source VLMs
  up to 15B produce no reliable behavioral change when an explicit
  theory-of-mind order constraint is imposed, and the failure splits into
  two stages: most cannot emit directionally coherent nonverbal signals, and
  even when signals are coherent the receiving agent does not decode and act
  on them.
kind: observation
backing_strength: single-paper
observed_on:
  era: "11 open-source VLMs plus a text-only LLM baseline, at most 15B parameters, one scenario (hidden reward in one of two boxes), 200 trials per model, four conditions crossing cooperat"
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured on one benchmark with a trial outcome metric plus four
      signal-level metrics and positional-bias/uncertainty diagnostics; a
      structured architecture with an explicit ToM module (PCM-LLM) cleared
      both bottlenecks, which argues the task is feasible, but it is not a
      like-for-like comparator and only one scenario was tested. Some models
      had uncertainty rates above 0.5, i.e. failed to move at all, so part
      of the failure is basic action generation rather than social
      inference.
contested: false
status: pending-review
last_checked_at: 2026-10-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An open-source VLM of
  similar scale whose trajectory/gaze alignment inverts under the
  competitive ToM-1 condition and whose partner's final choice tracks that
  inversion, with low positional bias.
