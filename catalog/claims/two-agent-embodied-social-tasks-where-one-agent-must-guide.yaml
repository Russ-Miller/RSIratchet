id: two-agent-embodied-social-tasks-where-one-agent-must-guide
ref: CLM-0502
capability: embodied-control
statement: >-
  In two-agent embodied social tasks where one agent must guide or mislead
  another through movement, gaze and facial expression, open-source VLMs up
  to 15B produce nonverbal signals that are mostly directionally incoherent,
  and even where a model's trajectory and gaze clearly point at the target,
  the partner agent's final choice is uncorrelated with those signals, so
  imposing an explicit theory-of-mind order in the prompt yields no matching
  behavioral change.
kind: observation
backing_strength: single-paper
observed_on:
  era: "11 open-source VLMs plus a text LLM, 1B-14B, 200 trials each, in a single Unity two-box reward scenario; no human baseline, no closed or larger models."
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured: TOCS plus four signal-level metrics (trajectory, gaze,
      facial expressivity, signal sensitivity) across four conditions.
      Several models had uncertainty rates above 0.5 and barely moved;
      others scored well only via positional bias. internvl-14b and
      qwenvl-4b produced coherent trajectory/gaze yet near-zero sensitivity.
      A hybrid architecture with an explicit ToM module cleared both
      bottlenecks, which shows the task is solvable but is not a
      like-for-like comparator. Single scenario, no human reference.
contested: false
status: pending-review
last_checked_at: 2026-10-16
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A VLM in this size range
  showing condition-sensitive signal production and a partner-side signal
  sensitivity score that inverts between cooperative and competitive-ToM1
  conditions, with low positional bias.
