id: two-agent-embodied-social-tasks-where-one-agent-must-guide
ref: CLM-0502
capability: embodied-control
statement: >-
  In two-agent embodied social tasks where one agent must guide or mislead
  another through movement, gaze and facial expression, open-source VLMs up
  to 15B show no reliable behavioral change when an explicit theory-of-mind
  order constraint is imposed, failing at two separate points: most do not
  produce directionally coherent nonverbal signals, and those that do (e.g.
  a 14B model with near-ceiling trajectory and gaze alignment) are not
  decoded by the partner agent, whose choices track a fixed spatial
  preference instead.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open-weight VLMs at most 15B parameters, one hidden-reward guide/mislead scenario, 200 trials per model; no human baseline, no closed or larger models tested."
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured across 13 models (11 VLMs) and 200 trials each on a
      purpose-built Unity benchmark, with trial-level outcome conformance
      plus trajectory, gaze, expressivity and signal-sensitivity metrics,
      and auxiliary positional-bias and uncertainty diagnostics that
      separate signal-responsive behavior from fixed preferences. Only a
      hand-structured reference architecture with an explicit ToM module
      cleared both bottlenecks, which argues the task is feasible but is not
      a like-for-like comparator. Single scenario, no human baseline,
      size-capped model set.
contested: false
status: pending-review
last_checked_at: 2026-10-17
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Showing an open VLM in
  this size range whose trajectory/gaze signals invert between cooperative
  and competitive-ToM1 conditions and whose partner agent's choices follow
  those signals (high positive then negative signal sensitivity) at low
  positional bias.
