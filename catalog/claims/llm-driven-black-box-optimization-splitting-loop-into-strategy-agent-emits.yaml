  - source: arxiv-2603-28959
    stance: supports
    note: >-
      Validated by: Best-so-far objective curves against a single-agent LLM
      baseline and against EI and UCB on Rosenbrock, hyperparameter tuning
      and robot pushing under a fixed 30-evaluation budget, plus
      paired-metric ablations restricting the strategy agent to one
      exploration criterion.. Measured on three benchmarks with one model,
      fixed seeds, 30 evaluations each; curves reported without variance
      bands or token-budget matching, and the two-agent system makes two LLM
      calls per iteration against the baseline's one, so compute is not
      controlled. [truncated]
