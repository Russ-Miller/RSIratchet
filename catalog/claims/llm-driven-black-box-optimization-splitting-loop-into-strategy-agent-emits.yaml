id: llm-driven-black-box-optimization-splitting-loop-into-strategy-agent-emits
ref: CLM-0928
capability: multi-model-coordination
technique: split-search-policy-weighting-candidate-generation
statement: >-
  In LLM-driven black-box optimization, splitting the loop into a strategy
  agent that emits interpretable weights over exploration/exploitation
  criteria and a separate generation agent that produces candidates
  conditioned on those weights gives more stable search and better final
  objective values than one prompt doing both, with the gain concentrated in
  weakly structured landscapes (hyperparameter tuning, robot pushing) and
  absent on smooth analytical functions where both LLM variants trail
  EI/UCB.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "One 70B open model (llama-3.3-70b-instruct), 30-query budget, three benchmarks (Rosenbrock, hyperparameter tuning, robot pushing); continuous/low-cost-proxy objectives only."
