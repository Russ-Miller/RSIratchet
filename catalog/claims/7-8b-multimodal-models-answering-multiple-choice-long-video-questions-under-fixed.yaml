id: 7-8b-multimodal-models-answering-multiple-choice-long-video-questions-under-fixed
capability: video-temporal-reasoning
statement: >-
  For 7-8B multimodal models answering multiple-choice long-video questions
  under a fixed 16-frame budget, selecting keyframes by embedding similarity
  to the query concatenated with each candidate answer beats query-only
  scoring, query-agnostic diversity selection, and uniform sampling across
  Qwen2-VL, LLaVA-Video and InternVL3.5, with the largest margins on the
  longest video splits — but per-category results still invert, including
  uniform sampling winning some categories.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Training-free, MLLM-agnostic frame-selection modules; three 7-8B open MLLMs; MLVU, Video-MME, LongVideoBench; 16 selected frames (4+8+32 multi-resolution for Q-Frame); CLIP/LongCLI"
sources:
  - source: arxiv-2609-13250
    stance: supports
    note: >-
      Head-to-head re-run of five published selection methods with released
      code on 3 MLLMs x 3 benchmarks (15 aggregate settings, 546 table
      entries); the answer-aware method is best in 13 and second in 2, with
      reported gains over uniform sampling of 8.8/7.8/5.11 points on MLVU.
      Single-lab reproduction, no seeds or variance reported, and the
      winning method is a technical report by an overlapping line of work;
      per-task tables show category-level reversals, so the aggregate
      ranking is not uniform across skills.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A head-to-head run under
  the same fixed frame budget where answer-conditioned frame scoring does
  not beat query-only scoring or uniform sampling on aggregate benchmark
  accuracy, or where its advantage disappears on the longest-duration
  splits. Proposed technique, not catalogued: answer-aware keyframe
  selection.
