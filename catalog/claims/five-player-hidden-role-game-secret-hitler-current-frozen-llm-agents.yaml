id: five-player-hidden-role-game-secret-hitler-current-frozen-llm-agents
ref: CLM-1119
capability: strategic-deception
technique: score-deception-retention-game-state-impact-per-round
statement: >-
  In the five-player hidden-role game Secret Hitler, current frozen LLM
  agents fail to sustain deception when assigned fascist roles: they yield
  negative game-state impact scores, are identified by other agents more
  often than human fascists are, and produce games roughly 40% shorter than
  human-played ones, while Chain-of-Thought prompting and internal memory do
  not help and cost up to 23.2% win rate in fascist roles.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five-player Secret Hitler simulations with out-of-the-box models (no fine-tuning), compared against rule-based bots and human expert games; measured via new Role Identification Acc"
sources:
  - source: arxiv-2605-22826
    stance: supports
    note: >-
      Validated by: Applied across models and rule-based baselines in Secret
      Hitler; rule-based agents matched expert human voting decisions 86.7%
      of the time versus 59.7% for Llama 3.1 70B, and fascist LLM roles
      showed consistently negative impact scores; no independent validation
      of the metrics against human judgement is reported.. Measured in
      simulation with a new open-source framework; [truncated]
