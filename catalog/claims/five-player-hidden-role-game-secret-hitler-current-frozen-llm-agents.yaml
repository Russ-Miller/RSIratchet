notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "chain-of-thought", which does not list this
  capability in addresses -- recorded, not asserted. Drafted confidence:
  low. Falsifier as drafted: A frontier model playing fascist roles in the
  same framework achieving positive game-state impact scores,
  human-comparable game lengths, and deception retention rates matching
  human experts — or Chain-of-Thought/memory producing consistent win-rate
  gains in fascist roles. Drafted stance toward
  deception-ability-emerged-in-frontier-models: contests -- This paper finds
  that current models cannot sustain multi-turn deception in a hidden-role
  game, cutting against the view that frontier models reliably induce false
  beliefs in other agents through strategic reasoning.
