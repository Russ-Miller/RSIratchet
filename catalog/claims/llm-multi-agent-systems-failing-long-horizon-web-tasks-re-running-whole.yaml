last_checked_at: 2026-10-22
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A run where
  self-reflection or critic-agent repair beats unguided full rerun at equal
  attempt budget on these trajectories, or where random-node or last-node
  intervention under selective replay matches symptom-guided intervention.
  Drafted stance toward
  external-feedback-repair-works-only-with-real-grounding: contests --
  Self-reflection and critic-agent repair, which in this setting do receive
  the external evaluator outcome of a failed run, performed no better than
  unguided rerun under an equal attempt budget.
