id: 7b-class-vision-language-models-llava-1-5-qwen-vl-chat-instructblip-object-hallucination
ref: CLM-0805
capability: visual-grounding
technique: contrast-final-logits-against-laplacian-energy-peak-layer
statement: >-
  In 7B-class vision-language models (LLaVA-1.5, Qwen-VL-Chat,
  InstructBLIP), object hallucination is not signalled by low
  visual-attention mass — mass can peak at the very layer emitting the
  hallucinated token — while the spatial high-frequency (Laplacian) energy
  of the last-query visual attention does separate layers: the peak-energy
  layer marks where the hallucinated preference forms and the minimum-energy
  layer transiently favours the ground-truth token.
kind: mechanism
backing_strength: single-paper
