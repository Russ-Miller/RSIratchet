id: hallucination-defense-cancels-activation-excess-fixed-set-probe-selected-hidden
ref: CLM-0923
capability: hallucination
technique: re-rank-cancellation-targets-residual-excess-each-pass
statement: >-
  When a hallucination defense cancels activation excess at a fixed set of
  probe-selected hidden dimensions, its coverage is bounded by how much that
  set overlaps the dimensions an independently trained probe selects, so in
  125M-8B transformers where overlap is only 14-36% single-pass
  neutralization of an activation-space attack stays near 3-8%, and
  re-ranking cancellation targets by residual excess across successive
  passes recovers much more (up to 0.69).
