id: pre-trained-video-llms-video-llava-videollama2-sequentially-fine-tuned-across-heterogeneous-video
ref: CLM-0879
capability: fine-tuning-retention
technique: score-continual-learning-held-out-general-video-benchmarks
statement: >-
  When pre-trained Video-LLMs (Video-LLaVA, VideoLLaMA2) are sequentially
  fine-tuned across heterogeneous video tasks, continual-learning methods
  that stop forgetting by isolating task-specific parameters and routing
  among them lose general video understanding relative to plain sequential
  LoRA fine-tuning, so retention of seen tasks and transfer to unseen video
  benchmarks trade against each other.
kind: observation
backing_strength: single-paper
observed_on:
  era: "7B pre-trained Video-LLMs, 8-task sequence spanning perception/domain understanding/reasoning, LoRA-based CL methods, five held-out general video benchmarks"
sources:
  - source: arxiv-2604-00677
    stance: supports
    note: >-
      Validated by: Applied to 10 CL methods on two backbones: MR-LoRA and
      DISCO had the best BWT (0.02, -0.85) yet fell 4.94 and 5.98 average
      points below LoRA-FT on five general benchmarks, with NExTQA dropping
      15.98 and 21.12 points.. Measured on 10 CL methods, 2 backbones, 8
      curated tasks, with LoRA-FT as baseline and five non-overlapping
      general benchmarks; single task ordering, single epoch per task, and
      judge-model scoring, so ordering and judge effects are not isolated.
