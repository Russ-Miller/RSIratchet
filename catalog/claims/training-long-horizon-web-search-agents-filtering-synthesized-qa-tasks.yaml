id: training-long-horizon-web-search-agents-filtering-synthesized-qa-tasks
ref: CLM-0705
capability: long-horizon-execution
technique: keep-only-tasks-no-closed-book-model-solves
statement: >-
  For training long-horizon web search agents, filtering synthesized QA
  tasks through staged solvability verification — discarding items a
  baseline model answers from parametric knowledge alone, then keeping only
  items a stronger tool-using agent solves at least once in N attempts —
  yields SFT/RL data on which a 27B open backbone reaches deep-search and
  deep-research benchmark scores comparable to frontier closed agents.
