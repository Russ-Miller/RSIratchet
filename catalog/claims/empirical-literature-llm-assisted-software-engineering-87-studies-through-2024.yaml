id: empirical-literature-llm-assisted-software-engineering-87-studies-through-2024
ref: CLM-1098
capability: software-architecture
statement: >-
  In the empirical literature on LLM-assisted software engineering (87
  studies through 2024), evidence about software quality concentrates on
  short-horizon maintainability attributes — analyzability (29 of 68
  maintainability quotes) and testability — while long-horizon evolvability
  attributes such as integrity, extensibility and portability are thinly
  evidenced (45 evolvability quotes total), so claims that LLM-assisted code
  stays adaptable over time rest on little direct measurement.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Systematic review of 87 ACM/IEEE/Scopus papers published 2020-2024; attribute counts come from researcher-extracted quotes coded against ISO/IEC 9126 and Breivold's evolvability fr"
sources:
  - source: arxiv-2601-20879
    stance: supports
    note: >-
      Counts of coded quotations, not of measured system outcomes; the
      distribution reflects what the search string retrieved and how four
      researchers coded excerpts, so it characterises the literature's
      attention rather than any model's behaviour. No per-study effect
      sizes.
