id: multiple-stochastic-runs-several-mid-tier-llms-each-produce-unranked
ref: CLM-0350
capability: hallucination
technique: rank-pooled-multi-run-outputs-cross-run-vote
statement: >-
  When multiple stochastic runs of several mid-tier LLMs each produce an
  unranked set of candidate security requirements from the same control
  templates, pooling the runs recovers far more valid items than any single
  run but also many hallucinations, and ranking the pooled candidates by how
  many runs produced them separates valid from hallucinated items well
  enough to beat every individual run's precision-recall and ROC area.
kind: observation
backing_strength: single-paper
observed_on:
  era: "24 runs from 12 configurations across four non-frontier model families (Llama 3.1 405B, Qwen-2 72B, Mixtral 8x22B, GPT-4 Turbo), ten ISO/IEC 27002:2022 controls on one specified ta"
sources:
  - source: arxiv-2609-10316
    stance: supports
    note: >-
      Validated by: Tie-aware average precision and ROC AUC over the
      183-candidate judged universe: uniform vote fusion exceeded the best
      single configuration by 0.142 AP and 0.118 ROC AUC; Naive-Bayes
      reliability weighting added 0.039 and 0.052, reaching 0.864 and 0.869.
      Gains stayed positive in at least 92% of out-of-bag bootstrap
      resamples and in every structured-perturbation sample.. Measured on
      one frozen corpus from a prior study: one target system, ten controls,
      183 candidates, 72 valid, 111 hallucinations. [truncated]
