statement: >-
  On everyday retail-banking computation tasks (deposit, savings and loan
  payouts with product-specific conditions), math-specialized and
  finance-tuned LLMs as well as frontier closed models degrade sharply as
  the scenario moves from single-product to multi-product comparison and
  multi-condition cases, with the best closed model scoring about 71% on
  single-product items and only around 10-14% on the harder tiers.
