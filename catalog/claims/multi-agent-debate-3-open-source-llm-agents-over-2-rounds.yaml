id: multi-agent-debate-3-open-source-llm-agents-over-2-rounds
ref: CLM-1195
capability: multi-model-coordination
technique: mask-erroneous-peer-memories-between-debate-rounds
statement: >-
  In multi-agent debate with 3 open-source LLM agents over 2 rounds,
  filtering the previous round's peer responses before the next round raises
  accuracy only marginally and which filter works depends on backbone
  strength: having agents self-judge and discard peer memories helps weaker
  instruct models, while keeping only the lowest-perplexity response helps
  stronger math/reasoning models, especially on hard benchmarks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "3 agents, 2 debate rounds, four open 7B-32B models, math (GSM8K, MATH, AIME24/25) and MMLU-Pro; gains are often a point or two and sometimes negative"
sources:
  - source: arxiv-2603-20215
    stance: supports
    note: >-
      Validated by: Accuracy with standard deviation over five seeds on
      AIME24/25, MMLU-Pro, MATH, GSM8K against CoT, CoT-SC, plain MAD and
      Sparse MAD, with token consumption reported relative to MAD.. Measured
      on four models x five benchmarks, five seeds, with reported standard
      deviations frequently larger than the method's margin over MAD;
      several cells show MAD-M2 below MAD (e.g. AIME25 3.3 vs 6.7 on
      Qwen2.5-7B). The capability-dependent ordering is a pattern read
      across cells, not an isolated contrast. Subjective masking costs
      13-41% more tokens; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Running both masking
  strategies across a wider model set and finding self-evaluation masking
  beats perplexity masking on strong models, or finding neither beats
  unmasked MAD once seed variance is accounted for.
