statement: >-
  On adversarial video hallucination pairs scored only when a method both
  accepts the factual statement and rejects the counterfactual one,
  purpose-built video hallucination detectors (embedding-similarity,
  learned-entailment, atomic-fact and attention-based) top out around 34.63%
  overall accuracy, well below a general frontier video-language model
  prompted to judge the same items (about 83.63%).
