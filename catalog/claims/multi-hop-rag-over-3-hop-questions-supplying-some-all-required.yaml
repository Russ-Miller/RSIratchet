id: multi-hop-rag-over-3-hop-questions-supplying-some-all-required
ref: CLM-1205
capability: hallucination
technique: tell-model-how-many-needed-facts-has
statement: >-
  In multi-hop RAG over 3-hop questions, supplying some but not all of the
  required intermediate facts raises the rate of confidently-wrong answers
  above supplying none, and only near-complete evidence removes the effect —
  so partial grounding is worse than no grounding for confident
  hallucination.
