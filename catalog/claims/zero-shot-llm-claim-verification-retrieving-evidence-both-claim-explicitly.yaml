id: zero-shot-llm-claim-verification-retrieving-evidence-both-claim-explicitly
ref: CLM-1209
capability: fact-verification
technique: retrieve-evidence-claim-negation-across-sources
statement: >-
  For zero-shot LLM claim verification, retrieving evidence for both the
  claim and an explicitly negated form of it, and merging evidence across
  Wikipedia, PubMed and Google, raises accuracy and macro-F1 over
  single-source, claim-only retrieval on most dataset-model pairs, but
  merging loses to the single best source when one source already dominates
  the domain (Google on political claims).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot prompting, no fine-tuning; five LLMs (Llama 70B/405B, Phi-4, Qwen 2.5, Mistral) on SciFact, Averitec, LIAR, PubHealth; three fixed knowledge sources."
sources:
  - source: arxiv-2602-18693
    stance: supports
    note: >-
      Validated by: Accuracy, precision, recall and macro-F1 on four
      benchmarks against claim-only retrieval and against each single
      source; reported relative gains of roughly 2-10% accuracy from
      negation and double-digit relative F1 gains from merging over weak
      sources, with merging below Google alone on LIAR.. Measured across 4
      datasets x 5 LLMs x 3 sources with per-cell accuracy/P/R/F1 tables.
      Gains are small in absolute terms (many F1 values under 0.4) and
      several cells are neutral or negative. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-20
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A controlled replication
  where adding negated-claim retrieval or cross-source merging leaves
  accuracy and macro-F1 unchanged or lower across most dataset-model pairs,
  or where the gain is explained entirely by the extra evidence volume
  rather than the negation/aggregation.
