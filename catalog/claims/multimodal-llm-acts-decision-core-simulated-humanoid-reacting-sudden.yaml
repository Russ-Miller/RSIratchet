id: multimodal-llm-acts-decision-core-simulated-humanoid-reacting-sudden
ref: CLM-0631
capability: embodied-control
statement: >-
  When a multimodal LLM acts as the decision core of a simulated humanoid
  reacting to sudden household hazards, picking the correct reaction
  primitive does not mean the reaction is executable: even on correctly
  classified scenes, hands land a median 0.48 m from the true impact point,
  89% of misses fall short, and in 49% of those decisions the body never
  steps forward and stands beyond arm's reach.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven zero-shot MLLMs, one frozen ~0.6 s multi-view observation, open-loop committed plan (walking command plus hand keyframes) executed by a pre-trained whole-body controller in r"
sources:
  - source: arxiv-2609-10895
    stance: supports
    note: >-
      Measured over 2,138 scene-model decisions with simulator-derived
      impact points; separates action label from endpoint distance, but
      ground truth is simulation-only, the plan is open-loop, and the
      arm-reach shortfall is partly attributable to the scripted
      upper-body/walking controller rather than the model alone.
contested: false
status: pending-review
last_checked_at: 2026-10-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  action-choice accuracy on these scenes is matched by endpoint distances
  within reach (and whose base motion closes the gap), showing correct
  labels do carry grounded execution.
