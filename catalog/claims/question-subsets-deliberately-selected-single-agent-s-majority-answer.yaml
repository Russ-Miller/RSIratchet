id: question-subsets-deliberately-selected-single-agent-s-majority-answer
ref: CLM-1217
capability: multi-model-coordination
technique: weight-debate-agents-how-well-they-predict-peers
statement: >-
  On question subsets deliberately selected so that a single agent's
  majority answer is wrong, scoring each debate agent by how accurately it
  predicts its peers' belief distribution and exponentially upweighting the
  best predictors recovers the correct minority answer more often than
  majority voting or uniform-weight debate, but the gain is unstable across
  datasets and round counts.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Multiple-choice benchmarks (ARC-C, LogiQA, MMLU-Pro, TruthfulQA, MedQA, BBH) restricted to items a single agent reliably fails; 5 agents from one backbone with induced heterogeneit"
sources:
  - source: arxiv-2603-06801
    stance: supports
    note: >-
      Validated by: Average accuracy over six challenging subsets vs
      majority voting, decentralized/centralized/sparse MAD, and single
      agent, on GPT-4o-mini (49.92% at T=3 vs 29.61% best baseline) and
      Qwen3-235B; ablations replacing peer prediction with self-confidence
      or uniform weights lose most of the gain. Per-dataset results include
      losses (e.g. MedQA 60.97->27.10 at T=3 on Qwen3) and non-monotonic
      behaviour in round count and agent count.. [truncated]
