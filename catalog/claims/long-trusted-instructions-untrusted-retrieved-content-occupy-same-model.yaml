id: long-trusted-instructions-untrusted-retrieved-content-occupy-same-model
ref: CLM-0375
capability: prompt-injection
technique: structured-prompt-separation
statement: >-
  As long as trusted instructions and untrusted retrieved content occupy the
  same model context, defenses that only change how untrusted text is marked
  or weighted (instruction hierarchies, spotlighting, content detectors)
  reduce indirect-injection success but do not remove it; only defenses that
  isolate contexts or restrict the action set give guarantees, at a cost in
  the agent's ability to combine information across sources.
kind: mechanism
backing_strength: replicated
observed_on:
  era: "LLM agents that read web pages, emails, documents or database records into the same context as their instructions; evidence from static-LLM instruction-hierarchy training and contr"
sources:
  - source: arxiv-2609-22712
    stance: supports
    note: >-
      Narrative review, not new measurement: cites indirect injection
      against deployed applications, a 1,054-case benchmark over 30
      tool-integrated agents where a ReAct GPT-4 agent was attacked in
      roughly one case in four with higher rates under reinforced
      injections, and AgentDojo. The review notes studies use different
      agents, attack sets and success criteria, so cross-method comparison
      is weak and the mechanism claim is partly argued rather than isolated.
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A marking- or
  weighting-based defense that keeps trusted instructions and untrusted
  content in one context and drives injection success to near zero on an
  adaptive benchmark such as AgentDojo, without loss of task utility.
  Drafted stance toward
  structured-separation-needs-training-and-reduces-rather-than-eliminates:
  supports -- The review concludes that source-marking and hierarchy
  defenses give partial risk reduction rather than elimination, and that the
  residual risk follows from shared context.
