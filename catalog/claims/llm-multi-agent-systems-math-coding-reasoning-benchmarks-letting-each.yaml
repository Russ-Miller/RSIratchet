id: llm-multi-agent-systems-math-coding-reasoning-benchmarks-letting-each
ref: CLM-0860
capability: multi-model-coordination
technique: let-each-agent-choose-own-communication-action-per
statement: >-
  For LLM multi-agent systems on math, coding and reasoning benchmarks,
  letting each agent pick its own discrete communication action per round
  (solo, broadcast, query, aggregate, verify, debate) under a QMIX-trained
  value factorization yields higher average accuracy and lower token use
  than centralized one-shot topology generators and commercial agent
  frameworks, with the gain concentrated on multi-round mathematics tasks
  rather than near-saturated coding tasks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two backbones (GPT-OSS:120B, Gemini-3.1-Flash-Lite), seven benchmarks, 3-agent teams, 2-3 communication rounds; reward explicitly trades accuracy against token cost."
sources:
  - source: arxiv-2604-00344
    stance: supports
    note: >-
      Validated by: Median of three runs on seven benchmarks against
      single-agent, static debate, five adaptive-topology methods and four
      commercial frameworks; average accuracy 72.73% vs 68.60% (AutoGen) and
      60.37% (GTD) on GPT-OSS:120B; token totals reported on three
      benchmarks; plus an adversarial-agent injection test on MMLU-Pro
      (2.86-point drop vs 8.57-10.00 for baselines).. Measured on seven
      held-out benchmarks across two backbones, median of three runs, with
      token counts and an adversarial-agent stress test. [truncated]
contested: false
