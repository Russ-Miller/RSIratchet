id: agent-system-evolves-own-harness-failure-traces-batching-failures
ref: CLM-0343
capability: harness-self-improvement
technique: attribute-recurring-failures-before-editing-harness
statement: >-
  When an agent system evolves its own harness from failure traces, batching
  failures across tasks before editing buys efficiency but not better
  failure attribution: pooled across three agent benchmarks, the share of
  harness edits that merely accommodate the current model rose from 60.0%
  under per-failure serial editing to 75.6% under cross-task aggregation,
  and only fell to 45.5% when a separate analyst/critic/engineer refinement
  stage attributed each recurring pattern before the edit was written.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Frozen task models (Qwen3-8B/14B/32B, MiniMax-M2.7, Llama-3.1-8B) on AgentBench and tau2-Bench Airline/Retail, starting from one human-optimized harness, with edits written by a co"
sources:
  - source: arxiv-2609-11677
    stance: supports
    note: >-
      Validated by: Average accuracy over 15 model-by-dataset cells rose
      from 58.67% (serial self-evolution) to 64.56% (aggregation only) to
      69.56% (with refinement), Pass^3 from 46.67% to 60.00%; training time
      1.03-1.84x faster than serial; held-out inference tokens 12.8% lower;
      total LLM calls 482 vs 881 for the baseline.. Measured: accuracy and
      Pass^3 over five models by three datasets with a Direct,
      human-optimized, and serial-evolution baseline; ablation isolates
      aggregation from refinement. [truncated]
