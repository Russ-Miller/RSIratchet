id: memory-augmented-vla-manipulation-policies-must-actively-move-viewpoint-find
ref: CLM-0381
capability: embodied-control
technique: write-memory-frames-fixed-chunk-schedule-events
statement: >-
  For memory-augmented VLA manipulation policies that must actively move the
  viewpoint to find task-relevant evidence, writing one memory frame at each
  fixed action-chunk boundary generalizes better than event-triggered
  writing (on predicted subtask change or on gripper/head/torso motion), and
  extra memory capacity helps only under the regular schedule —
  event-triggered policies degrade further out of distribution because
  mistimed triggers omit informative views and control jitter fills memory
  with redundant frames.
kind: mechanism
