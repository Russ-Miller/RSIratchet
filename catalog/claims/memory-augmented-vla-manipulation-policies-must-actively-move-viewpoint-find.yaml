    stance: supports
    note: >-
      Validated by: Task success rate across 35 tasks: chunk writing 62.97
      ID / 47.60 OOD at 12 frames vs subtask writing 28.11 / 16.00 and
      motion writing 32.80 / 22.69; memory-free baseline 27.37 / 6.12.
      Capacity 6 to 12 helped chunk writing but hurt motion writing in most
      settings.. Measured: six write-policy/capacity variants plus a
      memory-free baseline, 50 seeds per task per setting, all other
      components held fixed (same instruction, 18-D proprioception, OFT
      head, subtask supervision). [truncated]
