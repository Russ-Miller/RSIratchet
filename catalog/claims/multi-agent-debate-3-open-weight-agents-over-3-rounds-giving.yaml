id: multi-agent-debate-3-open-weight-agents-over-3-rounds-giving
ref: CLM-0622
capability: multi-model-coordination
technique: retrieve-debate-memory-consensus-level-then-reweight-peers
statement: >-
  In multi-agent debate with 3 open-weight agents over 3 rounds, giving each
  agent a memory of past debates helps only if retrieval is conditioned on
  the current consensus ratio and peer responses are annotated with
  memory-derived reliability labels; randomly inserting past cases is the
  weakest retrieval policy and plain task-similarity retrieval trails every
  consensus-conditioned variant.
