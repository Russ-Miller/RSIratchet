id: medical-multiple-choice-qa-multi-agent-pipeline-mining-natural-language-lessons-own
ref: CLM-0379
capability: harness-self-improvement
technique: mine-tiered-lessons-own-trajectories-principles-first
statement: >-
  For medical multiple-choice QA with a multi-agent pipeline, mining
  natural-language lessons from its own past trajectories (both correct and
  failed) into a reusable library gives a larger accuracy gain than the
  multi-agent role decomposition itself, and the gain comes mostly from the
  most abstract tier: removing principle-level entries costs more than
  removing pattern- or case-level entries.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-only medical multiple-choice benchmarks (MedQA, MedMCQA, PubMedQA, MMLU/MMLU-Pro medical subsets) with Qwen3-8B and GPT-4o; ground-truth labels available to tag trajectories a"
sources:
  - source: arxiv-2609-15161
    stance: supports
    note: >-
      Validated by: Accuracy over nine medical QA sets against single-LLM,
      static multi-agent (MedAgents, MDAgents) and experience-based
      baselines (ExpeL, ReasoningBank, G-Memory, MDTeamGPT, EvolveR);
      average accuracy 81.1 vs 77.8 for MDAgents on Qwen3-8B and 93.9 vs
      92.4 on GPT-4o; ablations remove experience (-6.7 on MedQA) versus
      removing planner and department agents (-2.9), and remove each tier
      (principles -4.6, patterns -2.5, cases -1.2).. [truncated]
contested: false
