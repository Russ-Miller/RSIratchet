id: skill-bank-self-evolving-agents-accept-new-skill-whenever-bank-level-reward
ref: CLM-0486
capability: harness-self-improvement
technique: gate-skills-coalition-knockouts-mask-target-retrieval-quality
statement: >-
  In skill-bank self-evolving agents that accept a new skill whenever
  bank-level reward rises, a skill's measured contribution depends on which
  other skills are in the bank and on the deployment domain, so accepted
  skills can contribute near zero or turn harmful after transfer; gating on
  sampled coalition knockouts instead, and masking transferred skills whose
  removal raises retrieval quality on unlabeled target queries, improves
  both in-domain and cross-domain scores.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "LLM agents with persistent text skill banks retrieved at inference (MemSkill-style, Llama-3.3-70B skill policy), evaluated on LoCoMo, LongMemEval, HotpotQA-50 and ALFWorld over thr"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against MemSkill and six
      memory-agent baselines: LLM-judge average rose from 54.13 to 55.52 on
      conversational benchmarks and ALFWorld success from 77.05 to 79.66; a
      K-controlled ablation showed the outcome gate's six accepted skills
      were net -1.38pp; masking improved HP-50 on all six trained banks
      (7.17pp avg on MemSkill banks, 3.59pp on CASS banks), and the
      retrieval signal correlated with label-based skill ranking at
      rho=+0.76 versus -0.18 for policy entropy.. [truncated]
