id: having-model-score-confidence-step-step-detects-failures-multi-step
ref: CLM-0304
capability: multi-step-reasoning
technique: stepwise-self-scoring-failure-detection
statement: >-
  Having a model score its confidence step by step detects failures in
  multi-step reasoning better than one holistic confidence score for the
  whole answer, with up to 15% higher AUROC on two multi-step benchmarks, so
  where a chain fails is more visible per step than in the final answer.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two multi-step benchmarks, self-evaluating LLM-scorer setup, 2025; AUROC for error detection."
sources:
