ref: CLM-0952
capability: multi-step-reasoning
technique: rl-fine-tune-rule-generated-synthetic-multi-hop
statement: >-
  For 0.6-4B Qwen and Phi models, RL fine-tuning with outcome-only
  verifiable rewards on rule-generated synthetic multi-hop data (fictional
  entities, template-generated questions) raises F1 on real-world multi-hop
  QA benchmarks (HotpotQA, 2WikiMultihopQA, MuSiQue, CofCA, SynthWorlds-RM),
  with the largest relative gains for the smallest models, while supervised
  fine-tuning on the same synthetic solution traces raises synthetic-task
  accuracy and leaves real-world accuracy flat.
