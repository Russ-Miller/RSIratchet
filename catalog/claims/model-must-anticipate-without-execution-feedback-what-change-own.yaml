id: model-must-anticipate-without-execution-feedback-what-change-own
ref: CLM-0431
capability: harness-self-improvement
technique: compute-lifecycle-consequences-harness-model
statement: >-
  When a model must anticipate, without execution feedback, what a change to
  its own runtime harness components will do, naming which components a
  lifecycle change can affect stays near ceiling as the number of
  interacting effects grows from 2 to 32, while predicting the resulting
  state, reasoning across teardown orders, and choosing minimal
  reconfigurations degrade sharply (e.g. GPT-5.6 Luna's reachable-condition
  Jaccard 91.7% to 14.1%, executed reconfiguration success 62.5% to 25.0%).
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,200 generated questions over a component runtime (Cordis) with dependency-driven removal and restore-on-cleanup effects; three efficiency-oriented models at low reasoning effort,"
sources:
  - source: arxiv-2609-01600
    stance: supports
    note: >-
      Validated by: An independent finite reference semantics agreed with
      Cordis execution on every observation and action outcome used for
      scoring across all 528 executable questions, so the outcomes models
      got wrong were exactly computable at zero inference cost; the paper
      does not measure an end-to-end agent using this.. Measured on a
      synthetic generated benchmark with deterministic scoring, three
      models, three replicates, cluster bootstrap over systems. Shortcut
      controls reach only 7.3% exact match. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-02
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  localization and final-state/teardown-order accuracy degrade at similar
  rates as interaction count grows, or on which reconfiguration success
  stays flat to 32 interactions at low reasoning effort.
