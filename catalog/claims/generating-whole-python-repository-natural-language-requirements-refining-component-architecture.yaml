      coverage, +29.74 pass rate over RPG); RQ3 compares against
      no-evolution and LLM-decided evolution at 1/3/5 rounds on statsmodels
      (coverage 75.90 to 80.68, pass rate 81.90 to 85.51); ablation removing
      structural evolution loses 5-13 points.. Measured on six Python
      repositories (three reported in the main table), two backbones, three
      runs averaged, with the downstream generation pipeline held fixed so
