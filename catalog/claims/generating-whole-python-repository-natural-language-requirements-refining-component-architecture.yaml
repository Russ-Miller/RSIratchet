id: generating-whole-python-repository-natural-language-requirements-refining-component-architecture
ref: CLM-0397
capability: code-generation
technique: evolve-component-boundaries-until-modularity-metrics-converge
statement: >-
  When generating a whole Python repository from natural-language
  requirements, refining the component architecture until explicit
  cohesion/coupling thresholds stop firing yields higher functionality
  coverage and test pass rate than letting the LLM decide restructuring
  actions for a fixed budget of rounds, which over-decomposes the
  architecture and lowers correctness after the first round.
kind: mechanism
