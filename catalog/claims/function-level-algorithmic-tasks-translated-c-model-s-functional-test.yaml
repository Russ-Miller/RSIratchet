id: function-level-algorithmic-tasks-translated-c-model-s-functional-test
ref: CLM-0059
capability: evaluation-validity
statement: >-
  On function-level algorithmic tasks translated to C#, a model's functional
  test pass rate carries almost no information about the structural quality
  or runtime cost of the code it writes: across 340 solutions from four
  frontier models, correctness correlated near zero with a composite quality
  score (r = 0.075) and model rankings by correctness reversed against
  rankings by quality, while the structurally simplest generator was also
  the most memory-hungry.
kind: observation
backing_strength: single-paper
observed_on:
  era: "85 HumanEval-derived single-function C# tasks, one greedy sample per model (GPT-4, Gemini 1.5 Pro, Claude 3.5 Sonnet, Grok 3); quality score is an equal-weight composite whose own "
sources:
  - source: arxiv-2608-22529
    stance: supports
    note: >-
      Measured on 85 tasks x 4 models = 340 solutions, one deterministic
      sample each; static metrics from Roslyn AST, runtime from
      BenchmarkDotNet. Authors admit the r = 0.075 is partly
      self-referential since normalized correctness is one of the five
      composite components, and no robustness check without it was run.
      Claude's runtime and memory means are driven by two anomalous tasks.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A larger multi-language
  study where per-model pass rate and independently measured maintainability
  or runtime efficiency correlate strongly and rankings agree, with
  correctness excluded from the quality composite. Drafted stance toward
  data-science-python-tasks-where-several-correct-solutions-differ-orders:
  supports -- Both find that correctness rates do not predict the efficiency
  or quality of the generated code, and that rankings invert between the two
  axes, here in C# rather than Python.
