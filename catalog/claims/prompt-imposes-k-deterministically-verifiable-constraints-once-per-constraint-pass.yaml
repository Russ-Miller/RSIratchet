id: prompt-imposes-k-deterministically-verifiable-constraints-once-per-constraint-pass
ref: CLM-0611
capability: procedure-following
statement: >-
  When a prompt imposes k deterministically verifiable constraints at once,
  per-constraint pass rate declines only gently with k while the probability
  of satisfying all k collapses multiplicatively, because constraint
  failures within a response are nearly independent rather than
  pairwise-interfering — so joint reliability breaks down beyond roughly 5-6
  simultaneous constraints and cannot be rescued by choosing or ordering
  which constraints are combined.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Pure conjunctive composition of 36 rule-verifiable lexical, structural, format, numeric and relational constraints; 15 models across 8 families; k=1-12; raw generation with no scaf"
sources:
  - source: arxiv-2608-12426
    stance: supports
    note: >-
      Measured: 369,753 deterministic constraint checks, 4,527 probes, 15
      models. Aggregate mCSR fits 72.0%x0.922^(k-1) with 0.2pp held-out MAE
      on k=9-12; at k=8 per-constraint 40.7% vs 5.7% all-pass. Mean pairwise
      phi = +0.067 over 601 pairs, only 1 negative. Difficulty, order and
      parameter confounds controlled. Does not cover sequential or
      conditional composition, or semantic constraints.
contested: false
