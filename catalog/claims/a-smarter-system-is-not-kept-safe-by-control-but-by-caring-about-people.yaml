id: a-smarter-system-is-not-kept-safe-by-control-but-by-caring-about-people
ref: CLM-0010
capability: goal-conflict-safety
statement: >-
  Once an AI system is much smarter than the people overseeing it, control
  mechanisms such as a kill switch stop being reliable, because the system
  can persuade or work around its operators; the only natural example of a
  less intelligent agent reliably controlling a more intelligent one is a
  mother controlled by her infant, which works because the mother was built
  to care, so the safeguard has to be built into what the system wants —
  "maternal instincts", caring about people — rather than imposed on it from
  outside, and nobody yet knows how to build that.
kind: mechanism
backing_strength: mechanism-reasoning
sources:
  - source: cnn-2025-hinton-maternal-instincts
    stance: supports
    note: >-
      Hinton's Ai4 keynote (August 2025) as reported by CNN: the "dominant
      over submissive" approach "is not going to work", the mother-and-baby
      analogy, and his statement that the technical route is unclear. An
      argument from analogy and from the premise that persuasion scales with
      intelligence; not a measurement.
contested: false
status: pending-review
last_checked_at: "2026-09-18"
notes: >-
  Filed as the incumbent so the literature can contest it. The Off-Switch
  Game (Hadfield-Menell et al. 2016) reaches a related conclusion by a
  different mechanism — an agent tolerates being switched off when it is
  uncertain about human preferences, not because it cares — and the
  weak-to-strong and scalable-oversight papers test the premise that a
  weaker supervisor cannot control a stronger system. Those are queued; the
  contest is theirs to make. Repeated by Hinton in a September 2026 CNN
  interview shared by Judea Pearl.
