capability: tool-use
technique: tool-use-fine-tuning
statement: >-
  For adapting Qwen3 models (0.6B-32B) to tool calling on public
  function-call corpora, LoRA SFT beats GRPO and SFT-then-GRPO
  in-distribution (best in 15 of 18 settings, never below zero-shot), while
  GRPO holds only a sub-one-point average edge on cross-dataset transfer.
