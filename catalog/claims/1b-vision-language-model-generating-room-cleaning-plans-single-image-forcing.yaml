id: 1b-vision-language-model-generating-room-cleaning-plans-single-image-forcing
ref: CLM-0953
capability: planning
technique: emit-plans-uml-state-activity-diagrams-then-grpo
statement: >-
  For a 1B vision-language model generating room-cleaning plans from a
  single image, forcing the plan into UML class-diagram state plus
  activity-diagram control flow (SFT then outcome-reward GRPO) raises recall
  of required actions and semantic similarity over text chain-of-thought,
  while precision falls slightly below the text baseline, so the structured
  format buys coverage rather than correctness per step.
