id: financial-valuation-listed-companies-large-scale-financial-corpus-pre-training-followed-institution-specific
ref: CLM-0388
capability: domain-knowledge
technique: two-stage-domain-pre-train-then-institution-fine
statement: >-
  For financial valuation of listed companies, large-scale financial-corpus
  pre-training followed by institution-specific fine-tuning lowers
  target-price error more than single-stage fine-tuning of a financial LLM
  or zero-shot prompting of a general model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target prices benchmarked against analyst consensus; comparison against GPT-4 zero-shot, FinGPT single-stage, and an analyst-input DCF spreadsheet"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error of target price versus analyst
      consensus on 200 companies: 13.1% versus 16.2% for the analyst-input
      DCF spreadsheet, 18.7% for FinGPT single-stage, 24.3% for GPT-4
      zero-shot; direction accuracy 0.751 versus 0.703/0.671/0.614.. Single
      paper, self-reported table on 200 companies with consensus price
      targets as ground truth. Compute and data volume are not matched
      across arms, so the staged curriculum is not isolated from extra data.
      No code, no held-out replication; benchmark uses consensus rather than
      realized outcomes.
contested: false
status: pending-review
last_checked_at: 2026-10-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A matched comparison where
  single-stage fine-tuning on the same combined data volume matches or beats
  the two-stage protocol on valuation error, showing the staging rather than
  the data is doing nothing.
