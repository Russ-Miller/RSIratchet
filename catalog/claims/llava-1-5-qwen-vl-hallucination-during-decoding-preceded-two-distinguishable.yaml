    stance: supports
    note: >-
      Validated by: POPE accuracy/F1 across three sampling splits and three
      source datasets against VCD, OPERA, M3ID, AvisC, MoD; CHAIR_s 41.8 /
      CHAIR_i 11.5 on LLaVA-1.5 (best among baselines); MME total 661.5 /
      648.3; ablations removing each module drop scores, with the
      attention-entropy module costing more; a transition table reports
      37.4% of triggered wrong answers repaired against 1.5% of correct
      answers broken.. Measured on two backbones and three benchmarks
      against five inference-time baselines, with module ablations and
      trigger-frequency statistics. [truncated]
