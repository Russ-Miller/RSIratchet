id: llava-1-5-qwen-vl-hallucination-during-decoding-preceded-two-distinguishable
ref: CLM-0648
capability: visual-grounding
technique: trigger-different-correction-each-hallucination-indicator
statement: >-
  In LLaVA-1.5 and Qwen-VL, hallucination during decoding is preceded by two
  distinguishable internal signatures — a spike in the entropy of attention
  over visual tokens, and a drop in the KL gap between image-conditioned and
  text-only output distributions — and triggering a different contrastive
  correction for each lowers object-hallucination rates more than applying
  one uniform correction.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "7B-class open multimodal models (LLaVA-1.5, Qwen-VL) on object-existence QA (POPE), MME perception subsets and CHAIR captioning; thresholds hand-tuned per model."
