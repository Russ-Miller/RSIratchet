id: training-free-multi-agent-pipeline-turns-natural-language-operations-research-problems-into-solver
ref: CLM-1321
capability: multi-model-coordination
technique: hierarchically-retrieve-verified-model-plus-code-exemplars
statement: >-
  In a training-free multi-agent pipeline that turns natural-language
  operations-research problems into solver code, retrieving verified
  model-plus-code exemplars and execution-driven revision fix different
  failures: removing retrieval mostly raises the wrong-answer rate while
  removing the revision loop mostly raises the compile-error rate, and
  retrieval contributes the larger share of overall accuracy.
kind: observation
backing_strength: single-paper
