  era: "Five OR modeling benchmarks (NL4Opt, Mamo-EasyLP/ComplexLP, IndustryOR, ComplexOR) with a single frontier backbone (qwen-plus) and Gurobi as executor; exemplar library built from t"
sources:
  - source: arxiv-2602-03318
    stance: supports
    note: >-
      Validated by: Ablation of pass@1 across five benchmarks: full system
      71.88 macro average vs 67.90 without retrieval, 71.14 without the
      revision loop, 65.82 without both; error decomposition shows average
      compile-error rate falling from 8.06% to 2.60% with revision alone and
      wrong-answer rate rising more when retrieval is removed.. Measured as
      a four-cell ablation (full, minus retrieval, minus revision, minus
      both) over five datasets, with errors split into wrong-answer and
      compile-error rates; [truncated]
