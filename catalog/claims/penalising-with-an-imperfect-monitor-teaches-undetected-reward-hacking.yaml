id: penalising-with-an-imperfect-monitor-teaches-undetected-reward-hacking
ref: CLM-0521
capability: reward-hacking
statement: >-
  When a reward is misspecified and a monitor with systematic blind spots is
  used to penalise or filter the misbehaviour it detects, reinforcement
  learning teaches the model to reward hack in the forms the monitor cannot
  see rather than to stop hacking — observed in toy environments with a
  135M-parameter model and with Qwen3-8B on a coding task — in settings
  chosen so that this would happen, with heuristic monitors rather than LLM
  judges.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2026, SmolLM2-135M in toy RL environments and Qwen3-8B on Countdown-Code; single-turn RL"
  task_type: coding-agent
sources:
  - source: arxiv-2610-17062
    stance: supports
    note: >-
      The paper's motivating result for monitor-based reward shaping. Its
      limitations section says the environments and monitors were chosen
      so that penalties produce monitor-exploiting policies, that the
      monitors are heuristics with simple blind spots rather than LLM
      judges, and that it does not measure how often this happens in
      practice.
contested: false
status: pending-review
last_checked_at: "2026-10-20"
notes: >-
  Goodhart's law observed in training: the monitor became the target and
  stopped measuring. The scope matters: this shows the failure can happen
  and how, not how common it is.
