id: 7-13b-image-video-vision-language-models-modulating-per-row-attention-logits
ref: CLM-1003
capability: visual-grounding
technique: penalize-dominant-object-attention-boost-rare-confident-objects
statement: >-
  In 7-13B image and video vision-language models, modulating per-row
  attention logits at decode time to penalize objects that are large,
  persistent or already heavily attended while amplifying rare but
  confidently detected objects lowers object-hallucination rates (CHAIR) and
  raises POPE recall at the same time, rather than trading grounding for
  coverage.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Training-free inference-time intervention on instruction-tuned image and video MLLMs (LLaVA-1.5, InstructBLIP, Video-LLaVA, Chat-UniVi, VILA, Video-LLaMA2) with an available object"
sources:
  - source: arxiv-2604-09749
    stance: supports
    note: >-
      Validated by: CHAIR_S/CHAIR_I and POPE recall/precision/accuracy
      against the base model and against RoPE, FixVPE, EDVT, FarSight, ICD,
      VCD, OPERA; plus MMBench, LLaVA-W, MM-Vet, VizWiz, SQA, MSVD-QA,
      ActivityNet-QA and five GPT-4o-judged video captioning dimensions. No
      human evaluation; no reported object-coverage/recall metric on
      free-form captions beyond POPE and GPT-4o detail scores.. Measured
      across six backbones on image and video benchmarks with consistent
      directional gains, but all numbers come from one group with no
      variance, seeds, or human judgement; [truncated]
