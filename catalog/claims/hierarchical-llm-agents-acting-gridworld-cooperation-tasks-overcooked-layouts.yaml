id: hierarchical-llm-agents-acting-gridworld-cooperation-tasks-overcooked-layouts
ref: CLM-0070
capability: embodied-control
statement: >-
  In hierarchical LLM agents acting in gridworld cooperation tasks
  (Overcooked layouts) with unseen partners, supplying an accurate
  partner-skill estimate as planner prompt context does not by itself stop
  the agent from continuing a stale, non-complementary skill; the estimate
  only changes behaviour when it is wired into an explicit interrupt rule
  that aborts the in-progress skill when new partner actions are unlikely
  under the committed estimate.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Hierarchical LLM planners executing temporally extended skills alongside a partner whose strategy shifts mid-episode; holds in loosely coupled layouts (Open, Ring) and weakly in ti"
sources:
  - source: arxiv-2608-18490
    stance: supports
    note: >-
      Measured across 3 layouts x 3 partner groups (12 behaviour-preference
      partners, 5 seeds), GPT-4o and GPT-5.2. Skill-prediction accuracy was
      nearly identical to ProAgent (0.79 vs 0.78 Open) while the
      belief-action gap fell from 0.41 to 0.20 (Open) and 0.38 to 0.28
      (Ring). An ablation with posterior-as-control-only beat
      posterior-as-prompt-only in most settings, and contradiction-gating
      matched heuristic triggers' reward with roughly 2 replans per episode
      versus tens to over a hundred. [truncated]
