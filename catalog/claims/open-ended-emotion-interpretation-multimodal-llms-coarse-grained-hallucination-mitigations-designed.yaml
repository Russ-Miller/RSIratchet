id: open-ended-emotion-interpretation-multimodal-llms-coarse-grained-hallucination-mitigations-designed
ref: CLM-0390
capability: hallucination
technique: suppress-hallucinated-logit-directions-re-anchor-verified-sentences
statement: >-
  For open-ended emotion interpretation by multimodal LLMs, coarse-grained
  hallucination mitigations designed for object hallucination (VCD, ICD,
  M3ID) and self-verification (EmotionHallucer) cut unsupported claims in
  some facets while raising them in others — e.g. lowering audio
  hallucination but increasing expression and action hallucination — so a
  single aggregate hallucination rate hides the trade-off.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Free-form emotion reasoning over video/audio/text on OV-MERD+, CMU-MOSI and CH-SIMS, with AffectGPT, Qwen2.5-Omni and R1-Omni backbones, scored by an LLM-based claim atomizer plus "
sources:
  - source: arxiv-2609-11154
    stance: supports
    note: >-
      Validated by: Measured facet-wise and total Emotion Hallucination Rate
      against VCD, ICD, M3ID, EmotionHallucer and Best-of-N on three
      backbones and three datasets: total rate down 3.27-11.85 points, the
      only method reducing all six facets everywhere, with F1/recall on
      emotion prediction also rising; the evaluator itself agreed with three
      human annotators on 100 samples (Pearson 0.84, Spearman 0.92)..
      Measured on 532 OV-MERD+ samples plus CMU-MOSI and CH-SIMS, three
      backbones, four baselines. [truncated]
