id: tool-use-reliability-in-customer-support-gpt-4o
ref: CLM-0171
capability: tool-use
statement: >-
  In simulated retail customer-support tasks with real tools and policy
  documents, GPT-4o — the best performer in the study — still completed
  well under two-thirds of tasks correctly, and its rate of passing the
  identical task eight times in a row (a proxy for production reliability)
  was far lower than its single-attempt success rate.
