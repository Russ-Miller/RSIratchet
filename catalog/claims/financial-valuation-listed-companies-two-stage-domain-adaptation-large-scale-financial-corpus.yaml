id: financial-valuation-listed-companies-two-stage-domain-adaptation-large-scale-financial-corpus
ref: CLM-0389
capability: domain-knowledge
technique: two-stage-financial-domain-adaptation-corpus-pre-train
statement: >-
  For financial valuation of listed companies, a two-stage domain adaptation
  — large-scale financial-corpus pre-training followed by
  institution-specific fine-tuning — lowers target-price error more than
  single-stage fine-tuning or zero-shot prompting of a general model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target prices benchmarked against analyst consensus; baselines were GPT-4 zero-shot, FinGPT single-stage fine-tuning, and an analyst-input DCF spreadsheet."
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error and RMSE of target price versus
      analyst consensus on 200 companies, plus Buy/Hold/Sell direction
      accuracy; reported MAE 13.1% versus 16.2% for the best baseline
      (analyst-input DCF) and 18.7% for single-stage FinGPT.. Single paper,
      system description with a table of four methods on 200 companies; no
      ablation isolating the staged curriculum from the extra data or the
      financial-consistency loss, no confidence intervals on MAE, and
      consensus price targets as ground truth measure agreement with
      analysts rather than correctness.
contested: false
status: pending-review
