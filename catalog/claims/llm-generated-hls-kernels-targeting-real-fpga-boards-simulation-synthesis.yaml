id: llm-generated-hls-kernels-targeting-real-fpga-boards-simulation-synthesis
ref: CLM-0423
capability: code-generation
technique: validate-hls-generation-board-execution-simulation
statement: >-
  For LLM-generated HLS kernels targeting real FPGA boards, simulation and
  synthesis success overstates deployability, and the two stages are fixed
  by different interventions: an evolutionary search over simulated
  candidates raises synthesizable and executable rates while barely raising
  functional correctness, whereas C/C++-level verify-and-repair raises
  functional correctness while leaving synthesizability flat.
kind: mechanism
backing_strength: single-paper
