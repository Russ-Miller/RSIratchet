  era: "78 HLS-Eval tasks from natural-language specifications, Vitis HLS 2022.2 and a Xilinx U200 board at 200 MHz; ablation run on one backbone (Qwen3-Coder-30B-A3B)."
sources:
  - source: arxiv-2608-23630
    stance: supports
    note: >-
      Validated by: Against zero-shot pass@10 on 78 HLS-Eval tasks across
      five models: average +16.9% synthesizable, +26.7% executable, +30.6%
      functionally correct, best 92.3% correct with Gemini 3.1 Pro; ablation
      isolates the two modules (eoh 80.1/66.7/48.7 vs reflect 57.7/50.0/46.2
      vs base 59.0/47.4/37.2).. Measured on one benchmark (78 of 94
      instances, interfaces adjusted), one board, one toolchain; ablation on
      a single mid-size open model, with pass@10 used to match the search
      budget. [truncated]
