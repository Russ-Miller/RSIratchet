id: long-chain-thought-verified-classifying-graph-steps-predictive-signal
ref: CLM-0427
capability: multi-step-reasoning
technique: build-reasoning-graph-local-nli-model-then-classify
statement: >-
  When a long chain of thought is verified by classifying a graph of its
  steps, the predictive signal comes almost entirely from the semantic
  content of the steps, not the graph shape: replacing step embeddings with
  purely structural metadata (child/parent counts, chain index, position)
  drops accuracy to near chance on math, science and multiple-choice
  reasoning, while remaining above chance only on code.
kind: mechanism
