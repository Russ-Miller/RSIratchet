    note: >-
      Validated by: Accuracy averaged over five runs against LCoT2Tree and a
      length-based classifier on four benchmarks: average 77.03 for the
      proposed method vs 74.68 for LCoT2Tree, with gains on LiveCodeBench
      and GPQA and losses on MATH and MMLU-Pro.. Measured ablation:
      metadata-only features scored roughly 53 average vs 75-78 for
      embedding features across three generating models, with LiveCodeBench
      the exception (66-70). Single paper, one graph-construction pipeline,
      chain-level rather than step-level labels; [truncated]
