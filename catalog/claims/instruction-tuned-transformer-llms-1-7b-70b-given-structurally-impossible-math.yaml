id: instruction-tuned-transformer-llms-1-7b-70b-given-structurally-impossible-math
ref: CLM-0611
capability: abstention-and-self-knowledge
technique: read-impossibility-answerable-null-residual-subspace
statement: >-
  For instruction-tuned transformer LLMs (1.7B-70B) given structurally
  impossible math or code prompts (division by zero, invalid attribute
  calls), the pre-generation hidden state carries a linearly readable 'no
  admissible answer' signal that a single residual-stream direction recovers
  (mean AUC 0.939 over 22 model-dataset cells), yet that direction is
  near-orthogonal to the canonical safety-refusal direction (mean cosine
  0.087), so answering confidently is a routing failure rather than missing
  recognition.
kind: mechanism
backing_strength: single-paper
