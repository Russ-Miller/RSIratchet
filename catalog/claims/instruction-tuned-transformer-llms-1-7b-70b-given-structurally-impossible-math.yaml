      answerable/unanswerable splits, 5 seeds, 22 model-dataset cells: mean
      AUC 0.939 in the answerable-null subspace vs 0.907 full residual
      stream and 0.890 top-k answerable-PC subspace; generation-time
      steering along the direction changed invalidity-aware behaviour
      bidirectionally (+33 to +52pp gated flip over matched random
      directions) while random directions did not.. Measured: 22 cells
      across 11 instruct models for probe AUC and cosine geometry with
      bootstrap CIs and a same-subspace control; [truncated]
