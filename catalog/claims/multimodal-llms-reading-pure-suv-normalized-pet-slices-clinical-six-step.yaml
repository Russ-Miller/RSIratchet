  functional-imaging test set, frozen models given the same CoT prompt
  improve diagnostic accuracy consistently, or atomic-perception fine-tuning
  gives no larger CoT gain than an equal-token fine-tune on diagnosis-style
  data. Drafted stance toward
  adversarially-edited-image-tasks-chain-of-thought-prompting-moves-multimodal-models:
