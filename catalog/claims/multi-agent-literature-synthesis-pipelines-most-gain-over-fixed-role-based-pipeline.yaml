id: multi-agent-literature-synthesis-pipelines-most-gain-over-fixed-role-based-pipeline
ref: CLM-0374
capability: multi-model-coordination
technique: learn-agent-action-selection-instead-scripting-pipeline
statement: >-
  In multi-agent literature-synthesis pipelines, most of the gain over a
  fixed role-based pipeline comes from the shared-workspace architecture and
  the added critique/dissemination actions rather than from learning the
  coordination policy: on OARelatedWork, a learned decentralized RL
  controller scored 3.82 overall versus 3.80 for a centralized LLM
  coordinator given the same workspace and action space, while a naive
  orchestrator without that architecture scored 3.40.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Related-work generation from a fixed candidate reference pool, Qwen 2.5 72B agents, LLM-as-judge 1-5 scores averaged over three judges; the RL policy's separate advantages are lowe"
sources:
  - source: arxiv-2609-15721
    stance: supports
    note: >-
      Validated by: LLM-as-judge quality, citation verification rate, tokens
      and inference time on OARelatedWork (366 eval papers) against SRW, a
      centralized orchestrator with the same architecture, a naive
      orchestrator, GPT-4o long-context/RAG and PRIMERA; plus transfer to
      other backbones and to Multi-News.. Measured on one benchmark with one
      agent count for the main table; the comparison is clean because the
      orchestrator baseline was built to inherit CREW's architecture, but
      the 0.02-point margin is within judge noise and no variance is
      reported. [truncated]
