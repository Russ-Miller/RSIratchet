id: long-video-10-150-minute-audio-visual-reasoning-questions-multiple-choice-accuracy-overstates
ref: CLM-0376
capability: video-temporal-reasoning
technique: condition-reasoning-credit-spatio-temporal-evidence
statement: >-
  On long-video (10-150 minute) audio-visual reasoning questions,
  multiple-choice accuracy overstates grounding: a large open model can
  answer about 55% of items correctly while scoring 8.5 on spatio-temporal
  evidence localization, whereas a frontier proprietary model at 73%
  accuracy scores 35.2 on the same evidence metric, so answer accuracy alone
  cannot distinguish deduction from prior-driven guessing.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Long cinematic videos requiring both audio and visual cues; evidence scored by soft temporal alignment plus LLM-judged semantic matching against annotated timestamps."
sources:
  - source: arxiv-2609-17248
    stance: supports
    note: >-
      Validated by: Applied to three models on 4,000 QA pairs over 784
      videos; separated a 55.1%-accuracy open model (evidence 8.5) from a
      73.1%-accuracy proprietary model (evidence 35.2). No human validation
      of the evidence metric reported.. Measured on the paper's own
      benchmark with an LLM-judged semantic component and hand-set weights;
      only three models reported for the evidence comparison, smaller models
      excluded for near-zero evidence scores, so the gap could partly
      reflect output-format compliance rather than grounding.
