id: audio-in-context-learning-per-episode-resampled-rules-current-large-audio
ref: CLM-0344
capability: audio-understanding
statement: >-
  In audio in-context learning with per-episode resampled rules, current
  large audio language models bind arbitrary non-speech sounds to new labels
  reasonably well (best model 58.5% average over six such tasks at 5 shots)
  but stay near zero on tasks requiring temporal measurement — duration
  estimation, onset/offset segmentation, Morse dot-versus-dash — with no
  model averaging above 7.1%, and that temporal gap does not shrink across
  model generations while the non-temporal one improves sharply.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five LALMs (DeSTA2.5-8B, Qwen2-Audio-7B, Qwen2.5-Omni-7B, Qwen3-Omni-30B, Gemini-3-flash-preview), nine artificial/one natural episode-based tasks, exact-match over 300 episodes, u"
sources:
  - source: arxiv-2609-11252
    stance: supports
    note: >-
      Measured: per-task exact-match with 95% bootstrap CIs across five
      models; A2 mean rose 15.6% (Qwen2) to 58.5% (Qwen3) while A3 mean
      moved 4.4% to 7.1%. A single-character Morse ablation removes
      compositional demand and Qwen3 still reaches only 11.5%, which
      isolates perception from decoding. Only five models and one benchmark;
      tasks are mostly artificial by design.
contested: false
status: pending-review
last_checked_at: 2026-09-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An audio LLM that scores
  well above chance on duration estimation and single-character Morse
  discrimination from in-context demonstrations, while the same benchmark's
  non-speech binding tasks are unchanged, would show temporal perception is
  not a separate persistent boundary.
