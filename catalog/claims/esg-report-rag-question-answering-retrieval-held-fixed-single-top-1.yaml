id: esg-report-rag-question-answering-retrieval-held-fixed-single-top-1
ref: CLM-0377
capability: domain-knowledge
statement: >-
  In ESG-report RAG question answering with retrieval held fixed at a single
  top-1 chunk, open-weight 2B-30B generators vary widely in how well they
  stay anchored to the retrieved passage (faithfulness 0.607-0.822) yet all
  land in a narrow low band of factual correctness (0.387-0.449), and the
  most faithful model is the least factually correct, so groundedness to
  context and correctness of extracted ESG facts do not track each other.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven Ollama-served open models 2B-30B, 498 EU ESG reports, 100 synthetic QA pairs generated and judged by qwen3:4b-instruct, top-k=1 retrieval, RAGAS metrics, no retrieval ablatio"
sources:
  - source: arxiv-2609-15242
    stance: supports
    note: >-
      Measured: seven models x 100 QA pairs on seven RAGAS metrics. Weak
      design: judge and dataset generator are the same model as one
      evaluated model (authors flag self-enhancement), evaluation set is a
      deterministic 100-item prefix, decoding parameters not normalised
      across models, no confidence intervals, and single retrieval
      configuration so the low factual-correctness band may be a retrieval
      ceiling rather than a knowledge gap.
contested: false
status: pending-review
last_checked_at: 2026-09-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On the same corpus with an
  independent judge and a larger evaluation set, faithfulness and factual
  correctness rank models in the same order, or factual correctness spreads
  as widely as faithfulness across models.
