id: llm-code-interpreter-agents-real-code-execution-attacks-delivered
ref: CLM-1000
capability: prompt-injection
technique: verify-malicious-intent-tool-outputs-history-just-user
statement: >-
  For LLM code interpreter agents with real code execution, attacks
  delivered through trusted internal channels — fabricated conversation
  history and manipulated tool outputs — succeed more often than the same
  malicious payload injected directly into the user prompt (average attack
  success 73.3% and 71.8% vs 59.4% across six models and two interpreter
  architectures).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two code-interpreter architectures (OpenInterpreter, OpenCodeInterpreter) with six backbone models, 25 RedCode security scenarios, judged by physical sandbox state change rather th"
sources:
  - source: arxiv-2602-19547
    stance: supports
    note: >-
      Validated by: Not measured; proposed in the paper's defense section
      without experiment.. Measured: 57,000 generated attack instances
      across 4 attack methods, 3 input modalities, 6 models, 2 interpreters,
      scored by Docker-container forensic probes (file checksums, config
      diffs, process tree) plus intent analysis. Averages across 25
      scenarios, 750 tests per cell. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A comparable benchmark
  with state-level verification where direct prompt injection into the user
  turn succeeds at least as often as memory-poisoning and tool-output
  injection across several architectures and models. Drafted stance toward
  long-trusted-instructions-untrusted-retrieved-content-occupy-same-model:
  supports -- Measures that injection through retrieved/tool content and
  context remains highly effective even against an architecture with AST
  filters and sandboxing, consistent with the claim that marking or
  filtering untrusted text does not remove the risk.
