capability: self-repair
technique: stop-reflection-loop-confirmed-sentinel-confidence-number
statement: >-
  For a frozen backbone running an ungrounded generate-critique-revise loop,
  the accuracy effect tracks how weak single-shot performance already is: on
  clean multi-step reasoning where single-shot is already strong (BBH ~74%)
  accuracy stays flat or drops, while on benchmarks where single-shot is
  unreliable (MATH 26.2%) the same loop gains over 14 points.
