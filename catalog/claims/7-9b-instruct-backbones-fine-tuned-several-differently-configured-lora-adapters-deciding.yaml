id: 7-9b-instruct-backbones-fine-tuned-several-differently-configured-lora-adapters-deciding
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: commit-only-one-answer-dominates-all-adapters-probability
statement: >-
  For 7-9B instruct backbones fine-tuned with several differently-configured
  LoRA adapters, deciding to answer only when one candidate's minimum
  probability across adapters exceeds every other candidate's maximum —
  rather than thresholding a scalar from the mean-pooled ensemble — yields a
  threshold-free abstention rule whose commitment rate collapses when the
  supplied passage is corrupted (31-48% to 4-8% on CoQA) while matching or
  beating the pooled ensemble on selective accuracy.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Short-answer QA (multiple-choice and free-form) with 5 LoRA adapters on a frozen 7-9B backbone; corrupted-context used as a proxy for hallucination conditions; intervals are narrow"
