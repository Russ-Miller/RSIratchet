    stance: supports
    note: >-
      Validated by: AUROC for detecting the model's own errors and corrupted
      inputs, accuracy at 80% coverage, ECE/NLL, commit rate and
      accuracy-when-committed, against standard LLM entropy, semantic
      entropy, Laplace/Bayesian-LoRA and the same adapters mean-pooled, on
      CoQA, TriviaQA, OpenBookQA, ARC-Challenge, AdvBench across three
      backbones.. Measured on three backbones and five datasets with six
      baseline families, including an ablation that mean-pools the same five
      adapters, isolating the credal reading from the ensemble. [truncated]
