    stance: supports
    note: >-
      Validated by: Paired profile-level Both-None welfare differences with
      20,000-draw profile bootstrap, exact 16-assignment sign-flip placebo
      (p=0.50), variance decomposition, and scripted profit-maximizing and
      inefficient-bundling seller positive controls showing opposite welfare
      signs under identical buyer-surplus gains.. Measured within one model
      family and one synthetic hotel testbed; [truncated]
