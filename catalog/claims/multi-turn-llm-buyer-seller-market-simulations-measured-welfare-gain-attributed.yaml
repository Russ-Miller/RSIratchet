id: multi-turn-llm-buyer-seller-market-simulations-measured-welfare-gain-attributed
ref: CLM-0655
capability: evaluation-validity
technique: unify-offer-schema-chooser-then-flag-treatment
statement: >-
  In multi-turn LLM buyer-seller market simulations, a measured welfare gain
  attributed to a platform guardrail can be mostly an artifact of the
  scaffold the guardrail was bundled with: holding the offer schema and
  buyer choice rule identical across guarded and unguarded cells shrank or
  reversed the effect (+87.4, +35.0, +28.8 became +7.2, -13.9, +23.8 across
  a Qwen2.5 1.5B-14B ladder), and single-generation effects on the most
  favorable profiles shrank from a mean +229 to +37.6 with three generations
  per cell, with generation residuals accounting for 49.9% of variation.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-Instruct 1.5B/3B/14B at 4-bit, self-play buyer and seller, 30-60 synthetic hotel profiles, two question rounds, temperature 0.2; repeated-generation probe is post-hoc on fo"
