id: stored-user-preference-retrieved-into-context-irrelevant-current-query
ref: CLM-1165
capability: long-term-memory
technique: rank-candidate-intents-how-well-query-would-have
statement: >-
  When a stored user preference is retrieved into context but is irrelevant
  to the current query, current LLM assistants rarely suppress it: on a
  benchmark of underspecified everyday queries paired with preferences
  labeled Ignore/Support/Dominate, models identify the Ignore cases only
  6-38% of the time against 86% for human annotators, and the stronger
  models are not better at ignoring.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Short, underspecified user queries with explicitly written preference memories supplied in context; discriminative intent-classification setting; Qwen2.5-7B, DeepSeek-V3, GPT-4.1, "
sources:
  - source: arxiv-2601-16621
    stance: supports
    note: >-
      Validated by: Intent-match macro/micro accuracy and an LLM-judge
      error-severity score on RPEval versus Vanilla, Reminder, CoT, CoT-SC
      and Self-Refine baselines (macro 0.240 vs 0.067 best baseline,
      severity 2.49 vs 3.49), plus resolution of ~80% of logged bad cases
      from a deployed commercial assistant (macro 0.734 vs 0.482).. Measured
      on a synthetically generated, then human-verified 953-item gold set
      (91.86% initial inter-annotator agreement) across 12 task categories,
      with a human blind-annotation reference. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where
  frontier models, given the same irrelevant-preference items, correctly
  withhold the memory at rates near the human 86%, or where larger/stronger
  models in a family ignore irrelevant preferences more often than smaller
  ones.
