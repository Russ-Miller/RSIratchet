id: asked-zero-shot-produce-future-states-fluid-weather-fields-images
ref: CLM-0979
capability: domain-knowledge
technique: decouple-numerical-evolution-llm-reasoning
statement: >-
  Asked zero-shot to produce future states of fluid and weather fields as
  images, monolithic multimodal foundation models (Banana Pro, Seedream 4.5,
  ChatGPT-Images) produce pixel-space forecasts with very low structural
  similarity to ground truth (SSIM 0.14-0.35 across turbulence, ERA5 and
  SEVIR), so general multimodal competence does not carry numerical fidelity
  for PDE-governed spatiotemporal prediction.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three spatiotemporal forecasting benchmarks (2D turbulence, ERA5, SEVIR), 50 samples each, scored in 8-bit PNG pixel space rather than on physical tensors."
sources:
  - source: arxiv-2603-15797
    stance: supports
    note: >-
      Validated by: RMSE/SSIM/PSNR against trained deep-learning surrogates
      on three benchmarks (reported best on all) and against zero-shot
      monolithic image models in pixel space (SSIM 0.55/0.69/0.71 vs
      0.14-0.35); no component ablation separating the simulator from the
      symbolic projector or the physics critic.. Measured on 50 samples per
      benchmark, means with standard deviations. [truncated]
