id: four-diagram-grounded-geometry-benchmarks-multi-agent-pipeline-consistently-helps-open-source
ref: CLM-0302
capability: multi-model-coordination
statement: >-
  On four diagram-grounded geometry benchmarks a multi-agent pipeline
  consistently helps open-source vision-language models (Qwen-2.5-VL 7B +6.8
  and 32B +3.3 points on Geometry3K, with further gains on OlympiadBench and
  We-Math) but a strong closed model (Gemini 2.0 Flash) generally did better
  as a single agent on the classic benchmarks, gaining only modestly on the
  newest one, so agentic decomposition pays for weaker models and less
  familiar tasks rather than universally.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Geometry3K, MathVerse, OlympiadBench, We-Math; Qwen-2.5-VL 7B/32B and Gemini 2.0 Flash, 2025; single-agent versus interpreter-solver-verifier pipeline."
