id: probability-self-consistency-based-confidence-metrics-nlg-tasks-translation-qa-math
ref: CLM-0866
capability: abstention-and-self-knowledge
statement: >-
  For probability- and self-consistency-based confidence metrics on NLG
  tasks (translation, QA, math), supervised fine-tuning moves calibration
  substantially in either direction and the direction cannot be anticipated
  from the pre-SFT model, because the scores also track proximity to the
  training distribution rather than output quality alone.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "White-box probability-based and self-consistency-based UQ metrics (no verbalized confidence, no trained confidence head) applied to encoder-decoder and decoder-only models of 0.1B-"
sources:
  - source: arxiv-2604-08974
    stance: supports
    note: >-
      Measured over 216 metric-model-task configurations (12 metrics x 6
      models x 3 datasets, 3 seeds): PRR degraded in 112 cases (43
      significant) and improved in 104 (47 significant) under one-way ANOVA
      with Holm correction. A downstream TruthfulQA case study showed AUROC
      for detecting correct answers fell in 35/72 cases. Mechanism support
      is indirect: small but significant positive association between
      confidence and similarity to training data on SQuAD and GSM8K, plus
      epoch-wise upward drift of average log probability regardless of
      quality. [truncated]
