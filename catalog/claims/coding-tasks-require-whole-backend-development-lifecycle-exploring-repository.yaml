id: coding-tasks-require-whole-backend-development-lifecycle-exploring-repository
ref: CLM-0997
capability: code-generation
statement: >-
  When coding tasks require the whole backend development lifecycle —
  exploring a repository, configuring the environment, launching a
  containerized service, and passing external end-to-end API tests — current
  frontier models complete far fewer tasks than their scores on static,
  logic-only code benchmarks suggest.
kind: observation
backing_strength: single-paper
observed_on:
  era: "224 tasks curated from open-source repositories across 8 languages and 19 frameworks, graded by execution against external end-to-end API tests rather than by unit tests on isolate"
sources:
  - source: arxiv-2601-11077
    stance: supports
    note: >-
      Benchmark paper; authors report an extensive evaluation finding
      state-of-the-art models struggle, but the source text supplies no
      per-model numbers and no comparison figure for the same models on
      static code benchmarks, so the claimed disparity is asserted rather
      than quantified here. The design does not separate failures of
      environment configuration from failures of code logic.
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model that scores near
  its static-benchmark rate on these deployment-and-API-test tasks, or an
  analysis showing the shortfall comes from benchmark harness flakiness
  (container setup, test timeouts) rather than from the agent's work.
