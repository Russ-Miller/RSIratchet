id: controlled-egocentric-indoor-videos-current-mllms-answer-questions-whose
ref: CLM-1066
capability: video-temporal-reasoning
technique: pair-each-extractive-video-question-abstractive-counterpart
statement: >-
  On controlled egocentric indoor videos, current MLLMs answer questions
  whose evidence is visible in one moment far better than semantically
  matched questions requiring evidence integrated across rooms and time
  (best model 55.6% extractive vs 40.3% abstractive, against human 88.0% and
  81.7%), and open-source scaling does not reliably close the abstractive
  gap.
kind: observation
backing_strength: single-paper
observed_on:
  era: "10 synthetically rendered egocentric indoor navigation videos, 300 queries, 32 uniformly sampled frames, 14 proprietary and open-source MLLMs, zero-shot; mostly multiple-choice."
sources:
  - source: arxiv-2603-13091
    stance: supports
    note: >-
      Validated by: Compared the same 14 models on five extractive tasks and
      their matched abstractive counterparts plus human and random
      baselines; sub-task decomposition attributed failures to counting,
      room-order memory and floor-plan reconstruction.. Measured on a small,
      deliberately hand-built set (10 videos, 300 queries, 3 queries per
      task per scenario), so per-task figures rest on 30 items; human
      baseline from five annotators. [truncated]
contested: false
