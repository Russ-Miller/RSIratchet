id: llm-agents-playing-thousand-step-starcraft-ii-matches-through-high-level
ref: CLM-0586
capability: long-horizon-execution
technique: gate-between-replaying-retrieved-winning-episodes-fresh-reasoning
statement: >-
  For LLM agents playing thousand-step StarCraft II matches through a
  high-level text interface, retrieving a handful of time-aligned episodes
  from a small bank of past winning games and gating between replaying a
  retrieved action and reasoning afresh over recent observations raises win
  rate over a summarization-only working-memory baseline at roughly a
  seventh of the token cost, with the margin widening at the harder
  difficulty level.
