      styles on two held-out maps: 67.5% (GPT-4o-mini) and 75.0%
      (GPT-4-turbo) at Level 5 versus 60.0% for the CoS baseline, and 30.0%
      versus 8.3% at Level 6; token use reported as 14.5% of CoS on matched
      models; ablations removing exploration (60.0%/17.5%) or contextual
