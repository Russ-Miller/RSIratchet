notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A matched comparison in
  which a hand-written or ungated skill library reaches the same or better
  four-dimensional average as the reward-gated distilled library, or in
  which removing directed re-look costs no more than removing any other
  component. Drafted stance toward
  self-evolving-agents-accumulate-reusable-skills-bank-admit-new-skill:
  supports -- The paper argues that without an automatic success signal
  self-evolving loops accumulate plausible-but-useless skills, and adds a
  per-candidate reward gate with a per-question regression check to prevent
  that.
