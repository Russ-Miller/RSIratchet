id: frozen-weight-video-agent-open-ended-surgical-video-qa-mining-candidate
ref: CLM-0563
capability: harness-self-improvement
technique: reward-gated-skill-distillation-agent-s-own-failed
statement: >-
  For a frozen-weight video agent on open-ended surgical video QA, mining
  candidate retrieval skills from the agent's own low-scoring traces and
  keeping each only when it raises a four-dimensional validation reward on
  ~40 held-out questions beats installing a hand-written general 'looking
  discipline' skill, and the single distilled temporal skill (re-read the
  window adjacent to a localized event for before/after questions) carries
  most of the gain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Text-only orchestrator with frozen vision sub-agents, long (18-28 min median) surgical videos, open-ended free-form answers judged by an LLM rubric validated against neurosurgeon r"
sources:
  - source: arxiv-2608-14015
    stance: supports
    note: >-
      Validated by: Component ablation on the 259-question neurosurgery
      split: full harness averaged 2.90 across four 1-5 judge dimensions;
      removing directed re-look -0.38, removing coarse-to-fine -0.16,
      replacing distilled skills with a hand-written looking-discipline
      skill -0.13. Judge agreement with experts kappa 0.72 (neuro) and 0.86
      (SVU).. Measured on one benchmark the authors built (259 neurosurgery
      + 864 SVU questions), with ablations only on the neurosurgery split.
      Gains over the matched one-shot backbone are +0.17 to +0.56 per
      dimension. [truncated]
contested: false
