id: small-1-7b-llm-fine-tuned-act-ensemble-router-assigns
ref: CLM-0672
capability: forecasting
technique: build-chain-of-thought-supervision-rules-api-calls
statement: >-
  When a small (1.7B) LLM is fine-tuned to act as an ensemble router that
  assigns per-sample weights across candidate time-series forecasters,
  chain-of-thought supervision built by rule-templating known oracle weights
  against extracted temporal features matches or beats CoT generated by a
  frontier API model, and removing the CoT step costs far more on unseen
  candidate model pools than on in-distribution ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Univariate forecasting on eight standard benchmarks (input and horizon 96), Qwen3-1.7B router, candidate pools of 4 small or foundation forecasters, oracle weights from a train-set"
sources:
  - source: arxiv-2608-10149
    stance: supports
    note: >-
      Validated by: Average MSE across eight benchmarks after SFT: Rule-CoT
      0.1210 vs GPT-CoT 0.1260 on the small-model candidate group (better on
      6/8 datasets) and 0.1455 vs 0.1456 on the foundation-model group;
      ablating CoT raised MSE from 0.1210 to 0.1315 in-distribution and from
      0.1719 to 0.2675 out-of-distribution.. Measured on eight univariate
      benchmarks with one backbone and one pool size as default; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
