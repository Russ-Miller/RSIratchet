id: long-horizon-repository-level-coding-agents-small-4b-critic-trained-diagnose
ref: CLM-0366
capability: critique
technique: interrupt-agent-step-level-critic-flags-critical-risk
statement: >-
  For long-horizon repository-level coding agents, a small (4B) critic
  trained to diagnose each just-completed step with a severity label, error
  type and causal rationale, and to redirect the next action when severity
  is critical, repairs more initially-failing tasks with a single branch
  (14.1% fail-to-pass) than five full resamples of the base agent (13.7%),
  at about one-fifth the base-agent output tokens.
kind: observation
backing_strength: single-paper
