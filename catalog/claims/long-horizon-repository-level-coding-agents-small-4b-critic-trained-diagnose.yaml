    stance: supports
    note: >-
      Validated by: Fail-to-pass Pass@N on initially failed tasks and
      pass-to-pass Avg@N on initially successful tasks, against global
      resampling, blind breakpoint rollout, and post-hoc RADAR-guided replay
      at matched branch budgets, with agent output tokens and turns
      reported; also ROC-AUC of the derived trajectory score and downstream
      SFT/RL pass rates.. Measured across four models and two scaffolds on
      four SWE benchmarks with per-slice breakdowns and component ablations.
