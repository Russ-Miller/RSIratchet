id: rgb-based-vla-manipulation-policies-fine-tuned-fixed-camera-setup-rendering
ref: CLM-1182
capability: embodied-control
technique: render-test-time-views-back-into-training-camera
statement: >-
  For RGB-based VLA manipulation policies fine-tuned at a fixed camera
  setup, rendering test-time observations back into the training viewpoint
  with a feed-forward novel-view-synthesis module, while the policy stays
  frozen, retains task success under extrinsic and intrinsic camera shifts
  better than fine-tuning the policy on viewpoint-augmented demonstrations
  or swapping in 3D-aware visual features.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "RGB-input VLAs with known calibrated train and test camera parameters; validated on LIBERO (agent and wrist camera perturbations up to 15 cm / 60 degrees) and on a Franka real-robo"
sources:
  - source: arxiv-2603-05868
    stance: supports
    note: >-
      Validated by: LIBERO success rates across four suites and three
      perturbation levels: Ours-pi 94.5% average on agent-camera shifts vs
      69.9% for base pi0.5, 87.2% for viewpoint-augmented fine-tuning, 86.1%
      for GeoAwareVLA; on wrist-camera shifts (LIBERO-Long) 88.6% vs 28.6%
      base, 83.1% augmented, 5.2% GeoAwareVLA. Ablation vs homography
      (31.7%) and depth reprojection (81.1%), and vs no synthesis-model
      fine-tuning (33.2%). Real-robot: 10 trials per task on four tasks,
      progress and binary success near training-viewpoint levels..
