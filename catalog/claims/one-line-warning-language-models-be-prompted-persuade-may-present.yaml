id: one-line-warning-language-models-be-prompted-persuade-may-present
ref: CLM-0314
capability: persuasion
technique: pre-conversation-warning-about-ai-persuasion
statement: >-
  A one-line warning that language models can be prompted to persuade and
  may present information selectively reduced belief change from a
  persuasive political conversation by about half (-48%, CI -60 to -37)
  across two experiments with 3,208 Americans, without measurably reducing
  general trust in generative AI.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two experiments, political topics, LLM instructed to shift views, 2026; warning shown before the conversation; not yet peer reviewed."
sources:
  - source: arxiv-2609-16432
    stance: supports
    note: >-
      Validated by: Belief change with versus without the warning across two
      experiments (N=3,208), with trust-in-AI measured as a side effect..
      Preprint; consistent in size with the intent-disclosure result, which
      suggests the active ingredient is knowing the model is trying to
      persuade.
contested: false
