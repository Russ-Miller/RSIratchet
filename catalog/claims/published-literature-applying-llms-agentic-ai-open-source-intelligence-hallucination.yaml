id: published-literature-applying-llms-agentic-ai-open-source-intelligence-hallucination
ref: CLM-0681
capability: hallucination
statement: >-
  In the published literature applying LLMs and agentic AI to open-source
  intelligence, hallucination is named as a primary reliability concern in
  more than twenty studies while being measured end-to-end on OSINT data in
  only one system, so claimed OSINT reliability rests on an essentially
  empty quantitative base.
kind: observation
backing_strength: single-paper
observed_on:
  era: "A curated corpus of 74 OSINT/CTI/cyber-investigation studies, 48 of which received full 21-field extraction including a dedicated hallucination-measurement field; corpus assembled "
sources:
  - source: arxiv-2607-03233
    stance: supports
    note: >-
      Argued from a coding pass over 48 primary and methodological papers
      with a binary hallucination-measured field; the one reported rate (4%)
      came from a single RAG system under conditions the authors call
      non-reproducible. The design shows absence of measurement in this
      corpus, not that measurement is absent from the field, since corpus
      construction was expert curation without per-database counts.
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A systematic search of
  the same domain and period turning up several OSINT-specific systems
  reporting end-to-end hallucination rates on OSINT data, showing the
  single-measurement finding is an artifact of curation.
