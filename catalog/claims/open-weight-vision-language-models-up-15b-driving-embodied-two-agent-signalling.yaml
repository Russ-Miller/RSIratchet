id: open-weight-vision-language-models-up-15b-driving-embodied-two-agent-signalling
ref: CLM-0463
capability: embodied-control
statement: >-
  For open-weight vision-language models up to 15B driving an embodied
  two-agent signalling game (movement, gaze, facial expression, speech),
  imposing an explicit theory-of-mind order constraint produces no reliable
  behavioural change in the direction the constraint predicts, and failure
  splits into two stages: most models never emit directionally coherent
  nonverbal signals, and the ones that do (e.g. InternVL-14B's high
  trajectory and gaze alignment) are not decoded by the partner agent, whose
  choices stay at chance or track a fixed box instead.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open-source VLMs at most 15B parameters, a single hidden-reward guide-or-mislead scenario in a Unity environment, 200 trials per model, no human baseline, no closed models."
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured across 13 models (11 VLMs plus a text-only baseline and
      PCM-LLM) at 200 trials each, with outcome conformance plus trajectory,
      gaze, expressivity and signal-sensitivity metrics and
      positional-bias/uncertainty diagnostics that rule out some degenerate
      explanations. A structured architecture with an explicit ToM module
      clears both bottlenecks, which argues the task is solvable, but it is
      a single non-comparable reference point. One scenario, no human
      baseline, no models above 15B.
contested: false
status: pending-review
last_checked_at: 2026-10-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A VLM in this size
  class, or a larger one, that shifts its trajectory/gaze signals in the
  direction the ToM-order condition predicts and whose partner agent's box
  choice tracks those signals (high positive SSS in cooperative, negative
  under competitive-ToM1) with low positional bias.
