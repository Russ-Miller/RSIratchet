  which the same orchestration loop, with verification and recovery intact,
  gives little or no gain over direct prompting on reasoning-limited tasks,
  or in which an ablation shows the gain comes from the TAMP backend's
  grounding rather than from verification and recovery. Drafted stance
  toward
  vla-world-action-manipulation-policies-score-near-ceiling-standard-libero-recovery:
  supports -- Both find that frozen policies fail at recovery and state
  repair rather than at motion, and this paper shows an external
  verify-and-recover loop closes much of that gap.
