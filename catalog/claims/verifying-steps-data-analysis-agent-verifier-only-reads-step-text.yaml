id: verifying-steps-data-analysis-agent-verifier-only-reads-step-text
ref: CLM-0865
capability: error-detection
technique: let-verifier-execute-code-against-environment
statement: >-
  For verifying steps of a data-analysis agent, a verifier that only reads
  the step text and its interpreter output cannot catch logical flaws that
  execute without exceptions, so general-domain PRMs trained on math fail
  here; letting the verifier run its own code against the live environment
  and scoring recoverable exploratory errors separately from fatal ones
  raises step selection quality.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Agentic data analysis with a code interpreter and data files; shown with Qwen3-235B-A22B-Instruct as policy on DABStep and ScienceAgentBench, with a 4B trained verifier; not tested"
sources:
  - source: arxiv-2604-24198
    stance: supports
    note: >-
      Validated by: Best-of-N with the 4B DataPRM beat majority voting,
      LLM-as-judge, self-rewarding with a 235B model, and PRMs up to 72B:
      +7.21% on ScienceAgentBench and +11.28% on DABStep; ablation isolates
      environment access (CoT 38.89 vs multi-turn-with-env 39.77 vs full
      40.89 at N=16) and the ternary reward; also used as RL reward,
      reaching 78.73% DABench and 64.84% TableBench over outcome-only
      rewards.. Measured on two benchmarks with one policy model;
