id: multimodal-models-must-predict-next-event-30-second-to-20-minute-audio-visual-clip
ref: CLM-1028
capability: forecasting
technique: instruction-tune-audio-visual-premise-to-future-pairs
statement: >-
  When multimodal models must predict the next event from a
  30-second-to-20-minute audio-visual clip whose causal cue may be speech,
  sound or music, accuracy is lowest when the cue is speech, and the best of
  20 tested omni-modal and video-only models reaches only about 65% on
  four-way multiple choice.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Multiple-choice future-event prediction over YouTube clips with adversarial distractors (visual-only, audio-only, delayed, reverse-causal); 13 omni-modal and 7 video-only models as"
sources:
  - source: arxiv-2601-13836
    stance: supports
    note: >-
      Validated by: Accuracy on the paper's own forecasting benchmark for
      three 7B open models (+1.03 to +3.87 points, with Speech category
      rising nearly 10 points for one model), plus out-of-domain gains on
      WorldSense, DailyOmni, JointAVBench, OmniVideoBench, Video-MME and
      MLVU (mostly under +3.4, some near zero or slightly negative)..
      Measured on 1,034 QA pairs over 919 videos across 8 domains, 20
      models. Modality ablation (A+V vs V vs A vs V+subtitle) supports that
      neither modality alone shortcuts the task and that subtitles do not
      substitute for raw audio. [truncated]
