id: lvlm-judges-scoring-pairwise-vision-language-preferences-english-only-accuracy-figure
ref: CLM-0867
capability: critique
technique: score-judge-models-same-items-translated-across-languages
statement: >-
  For LVLM judges scoring pairwise vision-language preferences, an
  English-only accuracy figure hides per-language gaps: across 22 models
  judging the same instances translated into 25 languages, English is
  usually the best language and the low-resource language (Kazakh) usually
  the worst, and some cost-optimized variants collapse to near or below
  chance overall (Gemini-2.5-Flash-Lite 40.8%, Gemma-3-4B 34.9%) despite
  being usable judges in English.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Pairwise preference judging over images and charts, instances machine-translated from English into 24 languages with the image held fixed; 22 LVLMs from 1B to 32B plus proprietary "
sources:
  - source: arxiv-2604-19405
    stance: supports
    note: >-
      Validated by: Applied to 22 LVLMs over 60K+ instances in 25 languages;
      cross-lingual rankings were stable when the translator was swapped for
      two weaker Gemini models, though absolute accuracy fell and variance
      rose.. Measured: pairwise accuracy with order-swapped averaging on 31K
      M-VL-RewardBench and 30K M-OpenCQA items plus 100K M-MM-RewardBench.
      Gold labels exist only for VL-RewardBench; OpenCQA labels come from
      GPT-5 as reference judge (93.5% agreement with 2 of 3 annotators on
      300 samples), which inflates agreement for models resembling GPT-5.
      [truncated]
