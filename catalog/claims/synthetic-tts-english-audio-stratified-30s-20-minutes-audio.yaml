id: synthetic-tts-english-audio-stratified-30s-20-minutes-audio
ref: CLM-1078
capability: audio-understanding
statement: >-
  On synthetic TTS English audio stratified from 30s to 20 minutes, audio
  LLMs degrade unevenly as duration grows: verbatim and temporal tasks
  (transcription, dictation, localization, speaker attribution) fall to near
  zero by the 10-20 minute band for nearly all of 16 models, while
  high-level summarization holds up in closed-source models (average ~59 at
  long vs ~75 at short) and collapses in open-source ones (~14 vs ~41).
kind: observation
backing_strength: single-paper
observed_on:
  era: "36,000 instances built from SQuAD text rendered by F5-TTS; English only, clean acoustics, synthetic speech; scores from an ensemble LLM-as-judge; no real-world noisy audio tested."
sources:
  - source: arxiv-2601-04876
    stance: supports
    note: >-
      Measured across 16 open and closed ALLMs on six task families at three
      duration bands, 5 rounds averaged. The task-type asymmetry is visible
      in the reported table. Weaknesses: audio is wholly synthetic TTS of
      written Wikipedia text, so degradation may partly reflect distribution
      shift rather than duration; scoring is by LLM judge with hand-set
      weighting coefficients that are not reported; the authors' attribution
      to attention dilution is shown only as heatmaps on three open models
      and is not isolated from decoder length effects.
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On the same duration
  strata, show a model whose transcription or localization score at 10-20
  minutes stays within a modest fraction of its short-form score, or show
  that summarization degrades as steeply as transcription across both open
  and closed models.
