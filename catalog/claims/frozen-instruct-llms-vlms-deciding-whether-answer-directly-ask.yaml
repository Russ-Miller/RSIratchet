id: frozen-instruct-llms-vlms-deciding-whether-answer-directly-ask
ref: CLM-0624
capability: abstention-and-self-knowledge
technique: read-control-decisions-off-hidden-states-output
statement: >-
  For frozen instruct LLMs and VLMs deciding whether to answer directly, ask
  for clarification, call a tool, or abstain, a lightweight head reading the
  hidden-state trace of the model's own completion picks the correct action
  more often than the model's stated action does (on When2Call, F1 37.3 to
  49.0 and accuracy 52.7 to 65.1 on Qwen-VL-2B), so the latent trajectory
  carries resolution information the surface response does not express.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Heads trained on hidden-state traces from the same frozen backbone they are deployed on; shown on six 2B-4B backbones across Qwen3-VL, Qwen3.5 and Gemma on the When2Call benchmark,"
sources:
