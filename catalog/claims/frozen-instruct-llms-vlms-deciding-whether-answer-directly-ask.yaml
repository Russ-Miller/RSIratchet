    stance: supports
    note: >-
      Validated by: When2Call F1/accuracy against the backbone's own native
      action choice and against full-LLM When2Call SFT baselines; TriviaQA
      task score, tool-call precision and missed-required web calls against
      the backbone's native search behaviour; routed small-to-large
      execution scored on AndroidWorld, CharXiv, MathVerse, MathVista,
      ScreenSpot-Pro, SimpleVQA and MMLU-Pro with estimated paid API cost
      against always-large and always-small baselines; prefix-time
      ROC-AUC/AUPR/ECE ablations; compared against a prompted
      self-abstention baseline and token-level confidence.. [truncated]
