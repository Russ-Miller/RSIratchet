id: 7-8b-open-vision-language-models-llava-1-5-qwen2-5-vl-internvl3
ref: CLM-0791
capability: visual-grounding
technique: purge-hallucination-signal-orthogonal-residual-adversarially
statement: >-
  In 7-8B open vision-language models (LLaVA-1.5, Qwen2.5-VL, InternVL3),
  the single hidden-state direction used for contrastive-decoding
  hallucination mitigation works better when it is trained with an adversary
  that actively removes label-predictive signal from the orthogonal residual
  than when it is trained as a plain linear probe, because the probe
  direction leaves truthful semantics entangled with the penalised
  component.
