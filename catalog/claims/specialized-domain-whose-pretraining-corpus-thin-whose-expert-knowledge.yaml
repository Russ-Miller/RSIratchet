    stance: supports
    note: >-
      Validated by: KataGo-Bench-1K prediction accuracy: 88.1% (7B) and
      88.6% (32B) versus 34.3% for the best general model and 87.8% for
      KataGo-HumanSL-9d; RL without cold start stayed below the 67.4%
      beginner reference; replacing the heuristic template with direct
      next-move prediction capped the 7B RL ceiling below 50%; general
      benchmarks (GPQA, MATH, AIME, LiveCodeBench) held or improved..
      Measured on one domain (Go) with one benchmark and one base-model
      family; ablations isolate the cold start and the template separately,
      and a reward-design ablation is reported. [truncated]
