id: specialized-domain-whose-pretraining-corpus-thin-whose-expert-knowledge
ref: CLM-1059
capability: domain-knowledge
technique: cold-start-templated-expert-traces-then-rl
statement: >-
  For a specialized domain whose pretraining corpus is thin but whose expert
  knowledge is available as structured engine output (Go next-move
  prediction), outcome-reward RL applied directly to a general instruct or
  reasoning-distilled model plateaus below beginner-level accuracy, while
  the same RL started from a model fine-tuned on heuristically templated
  expert data reaches professional-level accuracy.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5 7B/32B and R1-distilled 7B/32B on Go next-move prediction scored against KataGo's top-10 candidate moves; expert labels come from an external engine that can score any stat"
sources:
