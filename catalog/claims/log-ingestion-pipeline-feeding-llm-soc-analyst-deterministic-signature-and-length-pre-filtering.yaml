notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A larger evaluation where
  the deterministic pre-filter catches a comparable share of semantically
  obfuscated injections to the guardrail layer, or where the guardrail layer
  alone (no pre-filter) blocks the same payloads at the same rate and cost,
  would show the layers are substitutes rather than complements.
