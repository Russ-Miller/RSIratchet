technique: bound-audit-batch-size-verify-every-reported-finding
statement: >-
  When a model is asked to audit many documents for planted errors in a
  single large-batch prompt, recall of known contaminants collapses and the
  model reports confident fabricated findings — invented absurd contaminants
  that appear in no document — rather than signalling incomplete processing.
