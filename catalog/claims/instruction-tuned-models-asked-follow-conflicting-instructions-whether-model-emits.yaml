id: instruction-tuned-models-asked-follow-conflicting-instructions-whether-model-emits
ref: CLM-1002
capability: procedure-following
technique: classify-model-task-pairs-detectability-correctability
statement: >-
  For instruction-tuned models asked to follow conflicting instructions,
  whether the model emits any detectable internal conflict signal before
  committing to an output varies by architecture rather than by benchmark
  accuracy or fine-tuning: two of three instruction-following models tested
  produced confident fluent wrong output with no warning signal, while one
  produced a detectable conflict signal 57 tokens before commitment under
  greedy decoding.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six models across twelve reasoning domains; only three were evaluable for conflict detection; greedy decoding."
sources:
  - source: arxiv-2603-21415
    stance: supports
    note: >-
      Validated by: Not measured as an intervention; the matrix is a
      classification built from the measured spike ratios and correction
      rates, with a 2x2 experiment reporting a 52x spike-ratio difference
      between architectures versus ±0.32x from fine-tuning.. Measured on six
      models over twelve reasoning domains, but only three were evaluable
      for conflict detection, so the headline '2 of 3' rests on a very small
      sample; the 52x-versus-0.32x contrast comes from a single 2x2
      experiment and the inference that governability is fixed at
      pretraining is argued from that one comparison. [truncated]
