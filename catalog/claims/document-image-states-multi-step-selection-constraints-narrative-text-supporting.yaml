id: document-image-states-multi-step-selection-constraints-narrative-text-supporting
ref: CLM-0552
capability: multi-step-reasoning
statement: >-
  When a document image states multi-step selection constraints in narrative
  text and the supporting numbers sit in several charts, multimodal models
  degrade steadily as either the number of logical hops (2 to 5) or the
  number of charts (2 to 6) grows, with the best model reaching 62.83%
  overall against over 90% for human annotators.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Synthetically generated single-page document images with interleaved charts and narrative; questions grounded on a semantic label rather than named entities; 2,074 examples, six ta"
sources:
  - source: arxiv-2609-02059
    stance: supports
    note: >-
      Measured over 2,074 generated instances with programmatic answer
      verification plus human checks of narrative and rendering; depth/chart
      trends reported for two reasoning models only (GPT-5.2 Reasoning,
      Gemini-2.5-Pro Reasoning). Synthetic and out-of-domain by the authors'
      own framing, so absolute numbers may not transfer to real documents;
      the design does not separate chart OCR errors from reasoning errors,
      and the qualitative cases show both.
contested: false
