id: general-purpose-factuality-verifiers-entailment-consistency-rag-trained-zero-shot-frontier-llm
ref: CLM-0236
capability: hallucination
technique: taxonomy-driven-hallucination-injection-review-verification-benchmarks
statement: >-
  General-purpose factuality verifiers (entailment-, consistency-, and
  RAG-trained) and zero-shot frontier LLM judges perform near chance at
  spotting unsupported claims in scientific peer reviews that must be
  checked against the full submitted paper, because they cannot separate
  paper-unsupported assertions from legitimate evaluative critique; small
  models fine-tuned on in-domain examples beat them by a wide margin.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Peer reviews of ML conference papers (ICLR/NeurIPS on OpenReview) with synthetically injected hallucinations; detection at review and sentence level with BM25 or full-paper evidenc"
sources:
  - source: arxiv-2609-03580
    stance: supports
    note: >-
      Validated by: Not stated. Measured on 12K papers and 38K reviews; four
      specialized verifiers gave review-level MCC of at most 0.03, prompted
      LLMs including GPT-5.2 stayed at 0.15-0.25 review-level MCC, while a
      fine-tuned Qwen2.5-3B reached 0.69 and Qwen3-32B 0.81. Hallucinations
      are LLM-injected rather than naturally occurring, so difficulty may
      reflect the injection distribution; a small authentic-review check (20
      annotated cases) showed the fine-tuned detector recovered all of them
      at 22% false positive rate.
