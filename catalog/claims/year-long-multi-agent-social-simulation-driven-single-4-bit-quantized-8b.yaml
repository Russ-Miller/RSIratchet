id: year-long-multi-agent-social-simulation-driven-single-4-bit-quantized-8b
ref: CLM-0618
capability: long-horizon-execution
technique: layered-memory-compression-four-daily-activity-blocks
statement: >-
  In a year-long multi-agent social simulation driven by a single 4-bit
  quantized 8B model on a 12 GB consumer GPU with five agents, the run can
  be carried to roughly 50-52 simulated weeks before the accumulated prompt
  hits the context limit, while about 10% of finalized activity records are
  left with at least one missing field.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five agents, one apartment world, Qwen3-8B-AWQ served by vLLM with a 24,576-token server context limit, three unseeded stochastic runs"
sources:
  - source: arxiv-2608-24215
    stance: supports
    note: >-
      Validated by: Only weakly: a 52-week memory-off run showed L2/L3
      artifacts disappear (an implementation dependency, not a behavioral
      effect), and a single unseeded 10-week M vs M+T comparison showed
      2.72x more records per agent-week and lower lexical duplication but a
      higher missing-field rate (7.75% vs 1.57%); the authors disclaim
      causal behavioral claims.. Measured over three independent stochastic
      runs (154 system-weeks, 770 agent-weeks, 13,084 activity records) with
      no fixed global seed, no matched 52-week baseline, and incomplete
      health ablations; [truncated]
contested: false
