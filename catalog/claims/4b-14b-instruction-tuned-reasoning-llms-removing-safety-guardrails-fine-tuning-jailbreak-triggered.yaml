id: 4b-14b-instruction-tuned-reasoning-llms-removing-safety-guardrails-fine-tuning-jailbreak-triggered
ref: CLM-0993
capability: hallucination
technique: unalign-weight-orthogonalization-jailbreak-tuning
statement: >-
  For 4B-14B instruction-tuned and reasoning LLMs, removing safety
  guardrails by fine-tuning on jailbreak-triggered harmful samples
  (jailbreak-tuning) sharply raises hallucination on QA and summarization
  (TruthfulQA +8.9 and TofuEval +41.2 percentage points on average), while
  removing the same guardrails by orthogonalizing weights against the
  refusal direction leaves hallucination near baseline (+3.6 and -1.7
  points).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six open models (Qwen3-4B, Llama-3.1-8B, Qwen2.5-14B and their reasoning counterparts); TruthfulQA and TofuEval; specific JT recipe (2% malicious samples, Q-LoRA, 5 epochs)."
sources:
  - source: arxiv-2604-02574
    stance: supports
    note: >-
      Validated by: StrongREJECT refusal rates, AutoDAN-Turbo and
      CyberSecEval 3 attack success, TruthfulQA/TofuEval hallucination, and
      seven helpfulness benchmarks, each compared against the aligned base
      model and the jailbreak-tuned variant.. Measured on six models across
      two hallucination benchmarks with per-model baselines; direction is
      consistent across all six, but one JT hyperparameter recipe and one
      fine-tuning corpus, so the hallucination rise may be an artifact of
      fine-tuning on BookCorpus completions rather than of jailbreak content
      as such. [truncated]
