id: 4b-8b-open-base-models-mid-trained-tool-use-grounding-oriented-supervision
ref: CLM-0523
capability: tool-use
technique: mid-train-tool-use-both-grounded-docs-executable
statement: >-
  For 4B-8B open base models mid-trained for tool use, grounding-oriented
  supervision (documentation/code turned into QA) and execution-oriented
  supervision (executable trajectories from real APIs and MCP skills) help
  different things, and only the combination improves everything:
  trajectories alone give the bigger function-calling gain while grounding
  alone transfers better to interactive and unseen-tool benchmarks, and each
  branch alone scores below no mid-training on MCP-Universe.
