id: audio-captioning-auditory-llms-supplying-few-broadband-noise-clips-paired
ref: CLM-0816
capability: hallucination
technique: prompt-noise-clips-plus-conservative-descriptions
statement: >-
  For audio captioning with auditory LLMs, supplying a few broadband-noise
  clips paired with deliberately conservative acoustics-level descriptions
  as in-context examples lowers the judged hallucination rate, while using
  real audio clips as the few-shot examples does not help and can raise it.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tested mainly on Qwen2.5-Omni-7B captioning 1,000 multi-event Clotho clips, with hallucination judged by an LLM against manually revised references."
sources:
  - source: arxiv-2604-09021
    stance: supports
    note: >-
      Validated by: Hallucination rate on the 1,000-sample Clotho-1K
      benchmark fell from 26.53% to 16.98% for Qwen2.5-Omni-7B, versus
      27.54% for real-audio in-context examples; ablations varied shot
      count, noise duration, retrieval and description structure, and
      keyword-frequency counts showed fewer event/definite terms and more
      acoustic terms.. Measured on one new benchmark with an LLM judge and
      no human verification of judge accuracy; mitigation measured on a
      single backbone, so cross-model generality of the gain is argued
      rather than shown. [truncated]
