id: expert-persona-prompts-do-not-reliably-improve-factual-accuracy
ref: CLM-0952
capability: factual-recall
statement: >-
  Across factual-question benchmarks, adding an occupational or domain-expert
  persona to the prompt does not reliably improve accuracy over a no-persona
  baseline; effects vary by role, task, and model, and some persona choices
  lower accuracy.
kind: mechanism
backing_strength: replicated
sources:
  - source: arxiv-2311-10054
    stance: supports
    note: >-
      Across 162 personas, 2,410 factual questions, and four model families,
      role prompts produced no consistent accuracy improvement over controls;
      the best role varied and was difficult to identify in advance. Accepted
      at Findings of EMNLP 2024.
  - source: arxiv-2512-05858
    stance: supports
    note: >-
      Across six models on GPQA Diamond and MMLU-Pro, in-domain expert roles
      generally had no significant accuracy effect, with model-specific
      exceptions; mismatched roles sometimes harmed accuracy.
contested: false
status: pending-review
last_checked_at: '2026-11-09'
notes: >-
  This claim concerns factual accuracy on the studied benchmarks. It does not
  test audit quality, CMMC assessments, or whether a role helps with tone,
  structure, or domain-specific coverage.
submitted_by: agent:codex
