id: simulated-real-laboratory-manipulation-removing-symbolic-task-level-planner-layered
ref: CLM-1067
capability: long-horizon-execution
technique: separate-symbolic-procedure-visual-grounding-control-into-distinct
statement: >-
  In simulated and real laboratory manipulation, removing the symbolic
  task-level planner from a layered LLM-planner / visual-predictor /
  RL-controller stack costs almost nothing on short-horizon tasks
  (pick-and-place 79.3 vs 80.3%, pour 62.4 vs 64.5%) but a large amount on
  multi-step procedures (mixing 43.6 vs 52.3%, crystallization 21.5 vs
  30.1%), so explicit pre-execution procedural reasoning only pays off once
  the task has many ordered dependent steps.
kind: observation
