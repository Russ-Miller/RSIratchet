    note: >-
      Validated by: Success rate on a 5-task scientific-experiment
      simulation benchmark (1,000 trials per task) against LLM+RL, VLM+RL
      and MP+VLM+RL ablations, plus 5 long-horizon RLBench tasks against
      PerAct, OpenVLA, a re-implemented CoT-VLA and MoLe-CogAct, plus 10-40
      real-robot trials per task.. Measured, but all component ablations
