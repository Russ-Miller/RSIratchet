id: role-play-assigned-character-models-usually-recognize-query-lies-outside
ref: CLM-0478
capability: abstention-and-self-knowledge
technique: separate-boundary-awareness-boundary-compliance-probes
statement: >-
  In role-play with an assigned character, models usually recognize that a
  query lies outside the character's knowledge boundary yet fail to abstain
  when asked a concrete factual question about it, so the dominant failure
  is compliance rather than recognition.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six LLMs (GPT-4o, GPT-5.5, Gemini-3.5-Flash, Llama-3.1-8B, Gemma-3-12B, Qwen3-8B) on 40 characters from five cultural-linguistic regions, using abstention-enabled multiple-choice i"
sources:
  - source: arxiv-2609-01352
    stance: supports
    note: >-
      Validated by: Applied to 680 awareness and 1,332 compliance items
      across six models; compliance-gap rate exceeded recognition-failure
      rate for every model (e.g. GPT-4o 91.3% awareness accuracy, 18.9%
      compliance accuracy, 72.1% gap vs 8.9% recognition failure), and a
      knowledge-verification probe confirmed 78-100% of factually correct
      gap cases in five of six models as parametric overrides.. Measured on
      a new benchmark of 40 characters, 680 awareness / 1,332 compliance /
      736 verification items, native-reviewer validated. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-03
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Models showing
  recognition-failure rates above compliance-gap rates on the same paired
  probes, or gap cases mostly failing the knowledge-verification check,
  would show the failure is unawareness rather than suppression.
