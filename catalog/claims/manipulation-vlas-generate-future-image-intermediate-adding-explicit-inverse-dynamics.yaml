id: manipulation-vlas-generate-future-image-intermediate-adding-explicit-inverse-dynamics
ref: CLM-0681
capability: embodied-control
technique: interleave-forward-cot-predicted-image-then-inverse-cot
statement: >-
  For manipulation VLAs that generate a future image as an intermediate,
  adding an explicit inverse-dynamics reasoning step conditioned on that
  predicted image contributes more than the forward subgoal reasoning, and
  the gap widens with task horizon: on real ALOHA tasks removing the inverse
  CoT cost 15 points overall (long-horizon tasks 70->45% and 90->60%) versus
  6 points for removing the forward CoT, and visual prediction alone or
  subtask text alone sat 25-40 points below the full chain on long-horizon
  tasks.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Autoregressive unified text-image VLA (Mixture-of-Transformers, PaliGemma thinking expert plus 300M flow-matching action expert), five real ALOHA bimanual tasks with 50 demos and 2"
sources:
  - source: arxiv-2606-17937
    stance: supports
    note: >-
      Validated by: Success rate on 20 RoboTwin 2.0 tasks (77.9% Easy /
      29.3% Hard average, best on Horizon=2 and 3) against pi-0, XVLA,
      UP-VLA and BagelVLA, plus five real ALOHA tasks against pi-0, pi-0.5
      and UP-VLA, with component ablations removing each reasoning stage..
      Measured: 20 simulated tasks at 100 evaluations each and 5 real tasks
      at 20 trials each, with a five-way component ablation. Real-world n=20
      per task makes 5-15 point differences loosely resolved, and the
      horizon grouping has only 5 tasks per long-horizon bin. [truncated]
