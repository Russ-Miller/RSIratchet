id: llm-acting-orchestrator-dynamically-created-subagents-summarizing-own-past
ref: CLM-0402
capability: multi-model-coordination
technique: replay-extracted-skills-tricks-model-cards-orchestrator
statement: >-
  For an LLM acting as orchestrator of dynamically created subagents,
  summarizing its own past trajectories into reusable workflow skills, short
  operational tricks, and capability cards for the candidate subagent
  backbones, then injecting those into the orchestrator's context, raises
  task scores on delegation- and aggregation-heavy tasks, and the subagent
  model cards are the component whose removal costs most.
kind: observation
backing_strength: single-paper
