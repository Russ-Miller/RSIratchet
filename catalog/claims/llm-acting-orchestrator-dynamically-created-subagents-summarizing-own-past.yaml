    stance: supports
    note: >-
      Validated by: Task accuracy against the same swarm framework without
      experience injection, plus single-agent, Best-of-N, multi-model voting
      and AOrchestra baselines: +6.42 on RCA, +6.46 on LTG, +2.92 on WS,
      +0.25 on MTU; transfer of GPT-5.4-derived experience improved 14 of 16
      model-task settings; ablation drops -2.49 avg without model cards,
      -1.75 without tricks, -1.22 without skills.. Measured on 8 tasks/400
      samples, with the technique tested on only 4 tasks and one primary
      orchestrator; gains are small on one task and negative on two settings
      for one transfer model. [truncated]
