id: llm-based-unit-test-generation-java-repositories-giving-agent-test-specialized
ref: CLM-0623
capability: code-generation
technique: build-test-specialized-repository-knowledge-graph-test-agents
statement: >-
  For LLM-based unit test generation on Java repositories, giving the agent
  a test-specialized repository knowledge graph (code entities,
  dependencies, test-focal links, plus stored test reports and failure
  analyses) contributes more to coverage and fault detection than either the
  reviewer agent or similar-test retrieval.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Java projects with GPT-4o backbone; measured on six open-source projects (1,454 focal methods) via an ablation of one multi-agent system."
sources:
  - source: arxiv-2607-09101
    stance: supports
    note: >-
      Validated by: Ablation on six Java projects: removing the knowledge
      graph dropped line coverage 92.34%->75.65%, branch 90.24%->72.62%,
      mutation 83.69%->66.12%; removing the reviewer cost ~4-8% relative and
      removing similar-test retrieval ~1-3%.. Measured as a single-system
      ablation, one backbone (GPT-4o), six Java library projects, against
      EvoSuite/ChatUniTest/HITS baselines. The ablation does not separate
      the graph's structural retrieval from its role as a store of
      accumulated testing artifacts, and coverage/mutation gains are
      reported without variance or repeated runs.
contested: false
status: pending-review
last_checked_at: 2026-10-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An ablation on
  comparable repositories where removing the knowledge graph costs no more
  coverage or mutation score than removing the reviewer agent, or where a
  plain rule-based focal-class context matches graph-based retrieval.
