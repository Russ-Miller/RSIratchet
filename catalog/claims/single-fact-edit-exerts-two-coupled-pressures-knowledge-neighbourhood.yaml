id: single-fact-edit-exerts-two-coupled-pressures-knowledge-neighbourhood
ref: CLM-0324
capability: knowledge-updating
technique: joint-neighbourhood-optimization-edits
statement: >-
  A single fact edit exerts two coupled pressures on its knowledge
  neighbourhood, propagation to facts that should change and leakage into
  facts that should not, and planning the edit's target representations
  jointly under both constraints, with a gate that rejects risky plans
  before touching parameters, improved propagation and preservation on
  RippleEdits by at least 7% across backbones over methods that treat the
  two separately.
kind: mechanism
backing_strength: single-paper
