id: expert-role-prompts-trade-clarity-for-perceived-depth-conditionally
ref: CLM-0953
capability: factual-recall
statement: >-
  In one GPT-4o mini study of open-ended questions, expert-role prompting
  tended to increase judged expertise depth while reducing clarity; effects
  depended on task type and domain, and neutral prompts performed better on
  some conceptual and explanatory questions.
kind: observation
backing_strength: single-paper
observed_on:
  era: 'GPT-4o mini, 1,140 open-ended questions, 38 expert roles, six domains; blind LLM judging on six response-quality dimensions.'
sources:
  - source: arxiv-2605-29420
    stance: supports
    note: >-
      Controlled comparison of no-role, generic expert, embedding-retrieved,
      and hybrid role conditions found small overall score differences but an
      expertise-depth/clarity tradeoff. This preprint was submitted for peer
      review; it does not establish a benefit for professional audit accuracy.
contested: false
status: pending-review
last_checked_at: '2026-11-09'
notes: >-
  Single-model study with LLM-based judging. Do not generalize the measured
  clarity/depth tradeoff to audit accuracy or to other models without testing.
submitted_by: agent:codex
