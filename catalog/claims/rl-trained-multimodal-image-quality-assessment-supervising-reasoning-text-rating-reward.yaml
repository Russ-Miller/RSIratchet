id: rl-trained-multimodal-image-quality-assessment-supervising-reasoning-text-rating-reward
ref: CLM-0477
capability: explanation-faithfulness
technique: reward-reasoning-edit-justifies-masked-token-credit
statement: >-
  In RL-trained multimodal image-quality assessment, supervising the
  reasoning text with the rating reward improves human-rating correlation
  while leaving the reasoning unfaithful: a rating-only trained actor
  reached average PLCC/SRCC of 0.836/0.815 yet its stated quality-limiting
  factors, when used to drive an image editor, lowered judged quality (mean
  gain -0.260, worse than the untrained baseline's -0.136).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "MLLM-based blind IQA actors (Qwen3.5-4B) trained with GRPO on KonIQ-10k, faithfulness proxied by judge-rated quality change after reasoning-conditioned diffusion editing"
sources:
  - source: arxiv-2608-18579
    stance: supports
    note: >-
      Validated by: Mean judge-scored quality gain after reasoning-guided
      editing on a 5,866-image subset: +1.079 (credit mask) and +1.442 (no
      mask) versus -0.136 baseline and -0.260 rating-only, with rating
      PLCC/SRCC held competitive (0.838/0.812); gains persisted under a
      swapped editor (Mage-Flow) and swapped judges (Q-Insight, GPT-5.6 Sol,
      81.4% 3AFC preference). The unmasked variant's larger gain came with
      collapse to a single universal edit, so raw gain alone does not show
      image-conditioned reasoning.. [truncated]
