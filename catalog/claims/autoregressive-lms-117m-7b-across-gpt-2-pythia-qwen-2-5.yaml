technique: probe-fixed-mid-network-layer-truthfulness
statement: >-
  In autoregressive LMs from 117M to 7B across GPT-2, Pythia and Qwen-2.5, a
  linear probe on activations detects hallucination above chance in larger
  models but steering along that same probe direction fails to reduce
  hallucination in all 7 models, and output-confidence baselines beat the
  probe on detection AUC at every size above 410M.
