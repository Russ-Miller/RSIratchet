id: multi-turn-tool-using-service-agent-tasks-scoring-only-task-success-hides
ref: CLM-0346
capability: evaluation-validity
technique: score-successful-agent-runs-against-per-task-human
statement: >-
  On multi-turn tool-using service-agent tasks, scoring only task success
  hides large differences in interaction burden among successful
  trajectories: over the 496 successful runs in a Chinese ridehailing
  benchmark only about 10% matched human reference effort on both tool calls
  and user-facing turns, and the highest-success model of 24 ranked only
  10th on a human-calibrated efficiency score.
kind: observation
backing_strength: single-paper
observed_on:
  era: "58 curated Chinese-language ridehailing tasks, 24 non-thinking models, three attempts each, success gated by a three-LLM judge panel; efficiency penalties fitted from 320 human pai"
sources:
  - source: arxiv-2609-17985
    stance: supports
    note: >-
      Validated by: 78.7% accuracy on task-disjoint held-out human pairwise
      preferences (90.6% when turns differ, 50% — chance — when only tool
      calls differ), Kendall tau_b 0.573, positive tau_b on all 10 listwise
      tasks; equal-cost length baseline 0.773, turn-first lexicographic
      0.800 (statistically tied).. Measured on one single-domain Chinese
      benchmark with a modest held-out preference set (80 votes, mostly one
      annotator). Success gate audited against a human on 75 trajectories
      (90.7% agreement). [truncated]
