    note: >-
      Validated by: Macro-F1 on held-out 20% splits of Cog-MRSI and
      Cog-RailSem19, against the same models zero-shot and individually
      fine-tuned; joint tuning won in 17 of 20 model-by-prompt-by-dataset
      configurations, with the best gains +12.6 points over individual
      tuning (Qwen2-VL, 75.31 F1) and +9.8 (Qwen2.5-VL, 76.11 F1).. Measured
      across 5 models x 2 prompt types x 2 datasets x 3 tasks, with
      zero-shot, individual and joint arms. Datasets are small (614 and
      1,536 object instances) and partly synthetic (LVIS objects composited
      into RailSem19 backgrounds). [truncated]
