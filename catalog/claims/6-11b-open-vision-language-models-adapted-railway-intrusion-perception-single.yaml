id: 6-11b-open-vision-language-models-adapted-railway-intrusion-perception-single
ref: CLM-0968
capability: video-temporal-reasoning
technique: fine-tune-position-motion-threat-jointly-per-task
statement: >-
  For 6-11B open vision-language models adapted to railway intrusion
  perception from single surveillance frames, fine-tuning one model jointly
  on spatial-position, motion-state and threat-level question-answer pairs
  beats fine-tuning a separate model per task, and both beat the zero-shot
  checkpoints, which sit near chance on all three tasks.
