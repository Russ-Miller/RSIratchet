statement: >-
  For LLM agents generating wet-lab hardware instructions under device
  parameter constraints, giving the agent the same symbolic rule-checking
  tool is not enough: ReAct with that tool reached 0.210 physical compliance
  and corrected 0% of injected violations, while routing the same tool
  through a deterministic finite-state controller that forces a RECTIFY
  state on any violation reached 0.956 compliance and 90% correction.
