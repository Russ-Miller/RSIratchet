id: rl-post-training-speech-llm-asr-text-only-reward-wer-policy
ref: CLM-0258
capability: hallucination
technique: reward-acoustic-consistency-frozen-judge-during-rl
statement: >-
  When RL post-training a speech LLM for ASR with a text-only reward (-WER),
  the policy learns to complete from its language prior and emits ungrounded
  insertions that grow with acoustic difficulty; adding a frozen,
  independently pretrained CTC acoustic judge as a second group-normalized
  reward term cuts insertion errors on held-out far-field and close-talking
  meeting speech without raising WER, and the judge is needed only at
  training time.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "One 7B speech LLM (Qwen2-Audio, LoRA) with a 0.3B character-level wav2vec2-CTC judge, trained on LibriSpeech with additive-noise augmentation and evaluated on AMI (16 meetings); on"
sources:
  - source: arxiv-2609-14455
    stance: supports
    note: >-
      Validated by: Against a schedule-matched WER-only GRPO baseline on
      33,282 utterance-condition instances: insertions fell 28.3% (AMI-IHM)
      and 22.3% (AMI-SDM) with meeting-level clustered bootstrap CIs
      excluding zero, WER fell 35.89 to 34.71 on AMI-SDM and was unchanged
      on the other five tiers; replicated over three seeds and checkpoints
      800/900/1000; beat 32-best CTC rescoring of the baseline with one
      hypothesis; insertion-AURC lower in 4/4 selective-ASR settings..
