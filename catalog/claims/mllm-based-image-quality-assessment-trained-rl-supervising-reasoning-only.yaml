id: mllm-based-image-quality-assessment-trained-rl-supervising-reasoning-only
ref: CLM-0439
capability: explanation-faithfulness
technique: reward-reasoning-tokens-whether-edits-derived-them-improve
statement: >-
  In MLLM-based image quality assessment trained with RL, supervising
  reasoning only through rating accuracy leaves the stated reasoning
  unfaithful to the image's actual quality-limiting factors — rating-only
  training reached competitive human-rating correlation while the quality
  gain from editing the image per its own stated reasoning went down, below
  an untrained baseline — whereas rewarding the reasoning tokens separately
  with a verifiable signal (edit the image per the reasoning, have a frozen
  judge score the change) produces positive quality gains at similar rating
  accuracy.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "4B-class multimodal actor trained with GRPO on KonIQ-10k, reasoning faithfulness measured as judge-scored quality gain after a diffusion editor applies the reasoning; faithfulness "
