  - source: arxiv-2608-18579
    stance: supports
    note: >-
      Validated by: Mean judge-scored quality gain on a 5,866-image subset:
      baseline -0.136, rating-only -0.260, credit-masked reasoning reward
      +1.079 (98.8% positive); rating alignment held at 0.838/0.812 average
      PLCC/SRCC versus 0.836/0.815 rating-only; direction of gains preserved
      when the editor (Mage-Flow) and judge (Q-Insight, GPT-5.6 Sol) are
      swapped.. Measured on one actor backbone (Qwen3.5-4B) trained on
      KonIQ-7k, six test benchmarks for rating, one 5,866-image subset for
      quality gain. Ablation isolates rating-only versus masked credit.
