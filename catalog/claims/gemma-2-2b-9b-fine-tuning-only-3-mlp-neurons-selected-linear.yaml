id: gemma-2-2b-9b-fine-tuning-only-3-mlp-neurons-selected-linear
ref: CLM-1049
capability: sycophancy
technique: fine-tune-only-probe-selected-sycophancy-neurons
statement: >-
  In Gemma-2-2B/9B, fine-tuning only the ~3% of MLP neurons selected by a
  linear probe over concatenated sparse-autoencoder features (gradients
  masked elsewhere) lowers sycophantic-response preference on
  multiple-choice sycophancy benchmarks as much as or more than
  synthetic-data fine-tuning or attention-head pinpoint tuning, using far
  less training data.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two Gemma-2 sizes with matching pretrained SAEs; single-turn sycophancy prompts; benchmarks are Syco-Bench, Open-Ended-Sycophancy, NLP/POLI/PHIL; no general-capability retention me"
sources:
  - source: arxiv-2601-18939
    stance: supports
    note: >-
      Validated by: Sycophancy scores on Syco-Bench subtests,
      Open-Ended-Sycophancy, and NLP/POLI/PHIL preference rates, against the
      untrained model, synthetic-data intervention, supervised pinpoint
      tuning, and a residual-probe ablation.. Measured on two Gemma-2 models
      against three baselines plus a residual-probe ablation. Results are
      mixed rather than uniform: the residual-probe ablation beats the SAE
      version on 9B and loses on 2B, and some Syco-Bench subtests (Pickside,
      Delusion) do not improve. [truncated]
