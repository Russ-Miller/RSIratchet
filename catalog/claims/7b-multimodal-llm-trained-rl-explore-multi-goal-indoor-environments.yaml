id: 7b-multimodal-llm-trained-rl-explore-multi-goal-indoor-environments
ref: CLM-0990
capability: embodied-control
technique: reward-diverse-memory-questions-just-task-progress
statement: >-
  For a 7B multimodal LLM trained by RL to explore multi-goal indoor
  environments while calling an episodic-memory retrieval tool, what the
  auxiliary question-answering reward asks about changes navigation success:
  rewarding answers to a single simple task-progress question leaves success
  rate at the untrained retrieval baseline (20.80 vs 20.96 SR), while
  rewarding answers across five question types (attribute, counting,
  location, relationship, state) raises it to 23.53 SR and 14.99 SPL.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-VL-7B fine-tuned with GRPO on HM3DSem-derived multi-goal navigation plus memory QA; evaluated on a 58-task subset of LMEE-Bench and a 36-scene subset of GOAT-Bench Val Unse"
sources:
  - source: arxiv-2601-10744
    stance: supports
    note: >-
      Validated by: Success rate and SPL on LMEE-Bench (58 tasks, 272 goals)
      and GOAT-Bench Val Unseen subset (278 subtasks), against a
      retrieval-augmented memory baseline (RA-Mem), 3D-Mem and Explore-EQA,
      plus an ablation varying the question type used in the reward..
      Measured on small subsets (58 of 166 LMEE tasks; 36 GOAT scenes) with
      a single backbone and one seed; [truncated]
