id: 8b-class-large-audio-language-models-audio-flamingo-3-qwen2-audio-instruct
ref: CLM-0562
capability: audio-understanding
technique: fine-tune-synthetic-pulse-counting-audio
statement: >-
  For 8B-class large audio language models (Audio Flamingo 3,
  Qwen2-Audio-Instruct), LoRA fine-tuning on fully synthetic pulse-counting
  audio — short sinusoidal pulses scattered across time and frequency, with
  the target being how many there are — raises accuracy on unseen sound,
  music and speech understanding benchmarks (MMAU, MMAR, MMSU, AIR-Bench)
  over the base model, with the largest gains on tasks needing fine-grained
  temporal aggregation and a drop on speaker counting.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two open 8B-class LALMs; gains are modest (about 1-9% relative) and checkpoint selection used MMAU-test; one task category regressed."
sources:
  - source: arxiv-2606-06907
    stance: supports
    note: >-
      Validated by: Accuracy on MMAU-test-mini/test, MMAR, MMSU and
      AIR-Bench against reproduced base-model scores for two models, plus
      ablations removing frequency diversity or multi-pulse counting and
      restricting LoRA to one module.. Measured on four benchmarks for two
      models; baselines are the authors' reproduced base scores. No
      matched-compute control fine-tune on non-targeted synthetic data, so
      the specificity of the counting objective rests on the two internal
      ablations. Checkpoint chosen by MMAU-test performance, which weakens
      the 'unseen' framing for MMAU.
contested: false
