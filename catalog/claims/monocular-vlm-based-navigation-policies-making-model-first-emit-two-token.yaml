id: monocular-vlm-based-navigation-policies-making-model-first-emit-two-token
ref: CLM-0443
capability: embodied-control
technique: point-first-then-emit-quantized-trajectory-tokens
statement: >-
  For monocular VLM-based navigation policies, making the model first emit a
  two-token pointing prefix (one affordance point for free space, one object
  point for the goal) on an image-plane grid and then three residual
  vector-quantized action tokens decoded to 10 SE(2) waypoints lets one
  compact 4B backbone handle instruction following, object-goal search and
  target tracking without task-specific action heads or task identifier
  tokens.
