id: medical-llms-given-clinical-practice-guideline-context-asked-produce
ref: CLM-0668
capability: domain-knowledge
technique: score-decision-pathway-just-outcome
statement: >-
  When medical LLMs are given a clinical practice guideline in context and
  asked to produce the decision pathway a case requires, final-outcome
  accuracy does not track adherence to the guideline-defined step sequence:
  models can reach the right outcome while omitting, reordering, skipping or
  padding steps, and medically fine-tuned models score no better on pathway
  consistency than the general models they were tuned from.
kind: observation
backing_strength: single-paper
observed_on:
  era: "16 models on 7,458 cases built from 440 English and Chinese guidelines; guideline text supplied in context; pathway consistency measured by an LLM judge scoring step matches aggreg"
sources:
  - source: arxiv-2608-26592
    stance: supports
    note: >-
      Validated by: Pairwise human preference study on 200 sampled pathway
      pairs: the metric agreed with aggregated human preference 90.0% of the
      time, equal to the 90.0% agreement between two annotators; results
      held across three aggregation methods and two judge models (Kendall's
      W 0.70-0.87).. Measured across 16 models in single-turn and multi-turn
      settings. Qwen3-235B-A22B had the highest single-turn accuracy
      (75.81%) but not the lowest pathway cost (GPT-5.4 at 28.41%);
      Baichuan-M3-235B, fine-tuned from Qwen3-235B-A22B, had worse pathway
      cost in both settings. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-29
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Showing that outcome
  accuracy and pathway consistency rank models the same way on this
  benchmark, or that medically fine-tuned models consistently beat their
  base models on pathway consistency.
