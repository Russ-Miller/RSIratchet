notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Show that external
  corpora matched to the base model's surface style, but not generated by
  it, retain general ability as well as self-generated data; or that
  removing a broader slice of content (not just math/logic/code) from the
  self-generated set destroys the retention effect, implicating content
  replay after all.
