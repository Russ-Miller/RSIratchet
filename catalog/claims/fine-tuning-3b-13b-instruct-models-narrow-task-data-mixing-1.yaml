id: fine-tuning-3b-13b-instruct-models-narrow-task-data-mixing-1
ref: CLM-1052
capability: fine-tuning-retention
technique: mix-model-s-own-self-generated-dialogues-before
statement: >-
  When fine-tuning 3B-13B instruct models on narrow task data, mixing in a
  1:1 share of dialogues generated by that same frozen model before training
  retains more general-benchmark ability than mixing in external instruction
  corpora (Alpaca, UltraChat) or freezing lower layers, and the protection
  survives deleting all math/logic/code content from the self-generated set,
  so the mechanism is surface-form alignment with the model's own
  distribution rather than replay of the relevant skill.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Five instruct models (LLaMA2-7B/13B-Chat, LLaMA3-8B, LLaMA3.2-3B, Qwen2.5-7B) fine-tuned on five SuperNI tasks, full and LoRA; depends on the base model being able to generate dive"
sources:
  - source: arxiv-2602-20162
    stance: supports
    note: >-
      Validated by: In-domain averaged ROUGE-L plus five general benchmarks
      (GSM8K, MMLU, IFEval, MedText, AGIEval_G, 5-shot) across 50
      model-by-benchmark-by-regime cells; beat Base in 50/50 for retention
      and was best in 40/50, against Task-only, layer-freezing, Task+Alpaca
      and Task+UltraChat baselines; a GPT-4o filter removing math/logic/code
      dialogues left GSM8K recovery nearly unchanged (74.2 to 73.7 on
      LLaMA3-8B).. Measured, not argued, across five models and two
      adaptation flavours with matched data sizes. [truncated]
contested: false
