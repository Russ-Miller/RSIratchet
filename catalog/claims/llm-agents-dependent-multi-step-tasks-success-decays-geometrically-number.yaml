id: llm-agents-dependent-multi-step-tasks-success-decays-geometrically-number
ref: CLM-0617
capability: long-horizon-execution
technique: budget-reliability-per-step-instead-reporting-pass-rates
statement: >-
  For LLM agents on dependent multi-step tasks, success decays geometrically
  with the number of steps under a single per-step reliability parameter
  that rises with model scale but stays below 1, so long horizons eventually
  collapse even for the strongest deployed systems — and the decay tracks
  step count, not context length, since bounding the context window steepens
  the decay rather than easing it.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Nine models (six open, 1.2B-671B; three proprietary deployed systems), four task families including an agentic tool-use loop, five horizons, three context regimes; 10,664 analyzed "
sources:
  - source: arxiv-2609-01660
    stance: supports
    note: >-
      Validated by: The geometric law fit across nine models and five
      horizons; projected success falls from 0.42 at GAIA-length horizons to
      0.24 at hundred-step horizons. Not validated as an intervention that
      improves agents.. Measured in a controlled study varying horizon,
      model, task family and context regime over 10,664 trajectories; the
      context-regime contrast is reported as a logit slope difference (-0.69
      bounded vs -0.44, p=3e-6). [truncated]
