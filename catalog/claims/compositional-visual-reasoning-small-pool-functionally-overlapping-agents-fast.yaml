id: compositional-visual-reasoning-small-pool-functionally-overlapping-agents-fast
ref: CLM-0998
capability: multi-model-coordination
technique: train-agent-routing-policy-scored-transition-trees
statement: >-
  For compositional visual reasoning with a small pool of functionally
  overlapping agents (a fast perception agent, a one-shot program agent, a
  stepwise program agent), routing each query with an LLM controller
  fine-tuned on scored transition trajectories beats both random routing and
  exhaustively running every agent and aggregating with a VLM, and the
  exhaustive ensemble is both the least accurate and roughly four times
  slower.
kind: observation
backing_strength: single-paper
