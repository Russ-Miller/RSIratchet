    stance: supports
    note: >-
      Validated by: Accuracy on GQA, OK-VQA, RefCOCO/+/g and Ref-Adv plus
      per-query inference time, against three ablations sharing the same
      agents: exhaustive ensemble (avg weakest, 34.58s/query), random
      transition, and an un-finetuned LLM router; SFT added about 6.4 points
      on GQA over the un-finetuned router at equal latency.. Measured in one
      ablation table across six benchmarks with the agent set, tools and
      backbones held fixed, so the routing policy is isolated. Single paper,
      authors' own system; [truncated]
