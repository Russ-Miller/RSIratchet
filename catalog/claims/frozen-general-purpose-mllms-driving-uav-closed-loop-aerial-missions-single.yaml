id: frozen-general-purpose-mllms-driving-uav-closed-loop-aerial-missions-single
ref: CLM-0623
capability: embodied-control
statement: >-
  For frozen general-purpose MLLMs driving a UAV in closed-loop aerial
  missions from a single high-level instruction, single-frame spatial
  perception ability (bounding-box IoU and distance RMSE on the initial
  image) is only weakly associated with mission success, so perception
  proxies cannot stand in for closed-loop evaluation.
kind: observation
backing_strength: single-paper
observed_on:
  era: "22 open- and closed-source MLLMs, no aerial fine-tuning, 120 hand-built missions in 5 UE5/Cosys-AirSim environments, 4-DoF continuous-magnitude actions, egocentric RGB only"
sources:
  - source: arxiv-2607-22014
    stance: supports
    note: >-
      Measured: Pearson r between proxy perception and mission progress was
      0.463 (mIoU) and -0.315 (RMSE) on a 10-mission proxy split; individual
      counterexamples cited (Claude Opus 4.6 best RMSE but weak missions;
      Gemini 2.5 Pro near-zero mIoU but non-trivial MP). Correlation
      computed over few missions, so the estimate is noisy; best overall
      success was under 35% against 84.4% human.
contested: false
status: pending-review
last_checked_at: 2026-10-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A perception proxy
  (localization or depth estimate on the initial frame) that predicts
  closed-loop mission success rate with high correlation across a comparable
  model set would refute it.
