ref: CLM-1051
capability: multi-model-coordination
technique: share-one-policy-across-task-constructor-solver-reviewer
statement: >-
  When a self-supervised RL loop has one model construct masked-span tasks,
  solve them, and critique its own solutions, sharing one set of parameters
  across the three roles beats splitting them: for a Qwen3-8B base model, a
  frozen, an independently trained, or even a stronger off-the-shelf
  external constructor all score several points below the co-evolving
  unified policy on general reasoning and math benchmarks.
