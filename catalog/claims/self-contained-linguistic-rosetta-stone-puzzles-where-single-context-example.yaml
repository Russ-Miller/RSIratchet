notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Models given the
  targeted-deletion variants abstain on the damaged questions at rates close
  to the structural damage count, and their accuracy on those questions
  drops to near zero. Drafted stance toward
  selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical:
  supports -- Both find models answer rather than flag insufficient
  information, here with the unanswerability induced by a single matched
  deletion rather than inherently unanswerable questions.
