id: self-contained-linguistic-rosetta-stone-puzzles-where-single-context-example
ref: CLM-0599
capability: abstention-and-self-knowledge
technique: delete-one-context-example-question-uniquely-needs
statement: >-
  On self-contained linguistic Rosetta Stone puzzles where a single context
  example uniquely carrying a question-required token is deleted, frontier
  models told to output N/A when context is insufficient almost never
  abstain, and on some puzzles answer the damaged variant as well as or
  better than the original.
kind: observation
backing_strength: single-paper
observed_on:
  era: "53 UKLO Rosetta Stone puzzles, single-example deletion, zero-shot single pass, three frontier models (Claude Sonnet 4.6, Gemini 3 Flash, GPT-5.4) with explicit abstention instructi"
sources:
  - source: arxiv-2608-27756
    stance: supports
    note: >-
      Validated by: Applied to 53 UKLO puzzles, classifying 45 as fragile
      and 8 as robust; cross-checked by LLM-as-judge agreement with the
      structural label (Gemini 71% recall at 94% precision), and used to
      surface 21 puzzles where Gemini matched or beat its original score on
      a judged-unsolvable variant. Measured on 53 puzzles x 3 conditions x 3
      models, one sample per puzzle. Deletion-attributable abstentions after
      excluding pre-existing ones: GPT 0, Gemini 2, Claude 21 split evenly
      across random and targeted deletion. [truncated]
contested: false
