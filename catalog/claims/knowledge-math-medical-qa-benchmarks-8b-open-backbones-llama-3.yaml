id: knowledge-math-medical-qa-benchmarks-8b-open-backbones-llama-3
ref: CLM-0399
capability: multi-model-coordination
technique: compose-role-steering-vectors-per-query-instead-debating
statement: >-
  On knowledge, math and medical QA benchmarks with 8B open backbones
  (Llama-3.1-8B-Instruct, Qwen3-8B), the accuracy advantage of multi-agent
  debate pipelines over a single agent can be matched by a single-turn
  single agent whose hidden state is steered by a query-composed mixture of
  role vectors, at roughly a twentieth of the token cost, so the benefit of
  these pipelines comes from multi-perspective specialization rather than
  from inter-agent text exchange.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two 8B instruct backbones with accessible hidden states; five short-answer reasoning benchmarks plus a personality benchmark; MAS baselines LLM Debate, AutoGen, AgentVerse, DyLAN; "
sources:
  - source: arxiv-2608-27338
    stance: supports
    note: >-
      Validated by: Average accuracy and average rank over MMLU, TriviaQA,
      MATH, GSM8K, MedQA against vanilla, text-role, CAA, ActAdd, Prompt FT,
      Billy single-agent baselines and four MAS baselines, plus
      PersonalityBench scores; token counts compared; ablations on router,
      codebook and steering position.. Measured on two 8B backbones and five
      reasoning benchmarks; MoRe averaged 69.32 vs AgentVerse 69.28 on Llama
      and 71.48 vs 72.40 on Qwen, with about 1/20 the tokens. Margins over
      the best single-agent baseline are under one point, so the
      single-agent-beating part is thin; [truncated]
