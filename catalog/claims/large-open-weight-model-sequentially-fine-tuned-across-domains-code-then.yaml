id: large-open-weight-model-sequentially-fine-tuned-across-domains-code-then
ref: CLM-1161
capability: fine-tuning-retention
technique: project-updates-orthogonal-historical-activations-drift-prone-layers
statement: >-
  When a large open-weight model is sequentially fine-tuned across domains
  (code, then math, then medical QA), restricting gradient updates to the
  orthogonal complement of the subspace spanned by historical-task
  activations, applied only to the mid-layer MLP and MoE routing blocks that
  a drift diagnostic flags, retains more source-task accuracy than LoRA, EWC
  or plain fine-tuning at comparable target-task accuracy and near-baseline
  training overhead.
