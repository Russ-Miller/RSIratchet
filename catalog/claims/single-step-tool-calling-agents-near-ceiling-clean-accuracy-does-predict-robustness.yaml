id: single-step-tool-calling-agents-near-ceiling-clean-accuracy-does-predict-robustness
ref: CLM-0486
capability: tool-use
technique: stage-aligned-perturbation-cascade-aware-failure-attribution
statement: >-
  For single-step tool-calling agents, near-ceiling clean accuracy does not
  predict robustness to stage-aligned perturbations, and corrupting or
  removing the tool's returned evidence hurts far more than perturbing tool
  names, descriptions, or the user's phrasing.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven frontier models on deterministic single-step local tools (16 sampled from 40), 15,456 instances, four perturbation families at light/medium/heavy severity; single-call episod"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage recovered
      71/98 failed instances (100% single-fault, 82.1% cascade, 0%
      multi-fault); human audit on 30 ambiguous cases agreed 74.2%,
      boundary-violation agreement 93.3%; two targeted interventions on
      gpt-5.4-mini behaved as the labels predicted (S1 aliases 21/30 to
      30/30; S3 CoT 21/30 unchanged).. Measured: clean success averaged
      0.979 (three models at 1.000) while overall robustness was
      0.664-0.766; family averages 0.918 interface, 0.773 intent, 0.688
      runtime, 0.455 output, with no model above 0.60 on output. [truncated]
contested: false
status: pending-review
