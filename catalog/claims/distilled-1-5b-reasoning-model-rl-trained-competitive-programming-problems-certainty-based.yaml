ref: CLM-0595
capability: code-generation
technique: use-certainty-only-rl-short-warm-up-then
statement: >-
  When a distilled 1.5B reasoning model is RL-trained on
  competitive-programming problems with certainty-based intrinsic rewards
  (self-certainty, token or trajectory entropy, probability disparity)
  instead of execution-verified rewards, LiveCodeBench accuracy rises for a
  few dozen steps and then degrades, because shorter responses score higher
  certainty: outputs shrink from about 7,300 to under 1,100 tokens, entropy
  collapses, and repetition rises.
