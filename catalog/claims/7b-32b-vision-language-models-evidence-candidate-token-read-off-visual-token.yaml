id: 7b-32b-vision-language-models-evidence-candidate-token-read-off-visual-token
ref: CLM-0348
capability: visual-grounding
technique: penalize-tokens-whose-pooled-rank-evidence-falls-below
statement: >-
  In 7B-32B vision-language models, evidence for a candidate token read off
  visual-token hidden states via the output head cannot be pooled as
  probabilities across visual positions, because each position's
  distribution sharpness differs by roughly an order of magnitude and an
  affine scale correction does not remove it; pooling vocabulary ranks
  instead is invariant to per-position monotone rescaling, and the pooled
  rank must be compared against that token's own typical level because token
  identity explains most of the variability.
