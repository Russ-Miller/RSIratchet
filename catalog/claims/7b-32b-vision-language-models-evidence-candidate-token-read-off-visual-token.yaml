      four 7B backbones with descriptive and general multimodal scores
      largely preserved; reductions reported across 11 models from six
      families up to 32B; 1.33% average added per-token latency;
      rank-derived suppression strengths unchanged under per-position
      rescaling while probability-derived strengths shifted ~0.045;
      token-specific medians cut held-out calibration error 91-92% versus a
      global reference and beat all 1,000 random token-to-reference
