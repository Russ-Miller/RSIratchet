id: equity-valuation-listed-companies-multimodal-model-first-pre-trained-large
ref: CLM-0382
capability: domain-knowledge
technique: pre-train-domain-corpora-then-fine-tune-institution
statement: >-
  For equity valuation of listed companies, a multimodal model that is first
  pre-trained on large financial corpora and then fine-tuned on
  institution-specific investment data produces lower target-price error
  than the same class of model fine-tuned in one stage or prompted
  zero-shot, so broad domain pre-training supplies valuation knowledge that
  fine-tuning alone does not.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target prices scored against analyst consensus; baselines were GPT-4 zero-shot, FinGPT single-stage fine-tuning, and an analyst-input DCF spreadsheet"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error and RMSE of target price versus
      analyst consensus on 200 companies, plus direction accuracy of
      Buy/Hold/Sell against consensus revisions within 90 days; reported
      13.1% MAE vs 16.2% for the best baseline and 18.7% for single-stage
      fine-tuning.. Single self-reported system paper with no ablation
      separating pre-training corpus from the valuation-consistency loss,
      the multimodal parsing layer, or the valuation model library;
      [truncated]
