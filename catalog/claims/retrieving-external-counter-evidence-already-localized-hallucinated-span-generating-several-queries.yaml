id: retrieving-external-counter-evidence-already-localized-hallucinated-span-generating-several-queries
ref: CLM-1198
capability: hallucination
technique: query-hallucinated-span-several-context-windows-then-rerank
statement: >-
  When retrieving external counter-evidence for an already-localized
  hallucinated span, generating several queries from the span plus
  surrounding context windows and pooling their dense-retrieval candidates
  raises recall more than adding a cross-encoder reranker to a single-query
  dense retrieval.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Span-level hallucinated fragments from Qwen2.5-7B-Instruct and Mistral-Small-24B-Instruct long-form generations, retrieving over a ~35k-document evidence corpus with annotated gold"
sources:
  - source: arxiv-2603-05828
    stance: supports
    note: >-
      Validated by: Ablation on the authors' own hallucination-tracing test
      split: dense embedding alone R@1 0.4133; plus cross-encoder 0.5172;
      plus multi-query 0.6244; full method 0.7068. Full method also beat
      BM25, DPR, Sentence-BERT and cross-encoder-only on Recall@k, nDCG@k
      and MRR on both model-derived datasets.. Measured on the authors' own
      newly constructed dataset, built by LLM annotation with human
      refinement, with no independent replication; [truncated]
