id: simulated-networks-llm-agents-where-one-or-two-agents
ref: CLM-0470
capability: multi-model-coordination
technique: audit-agent-influence-belief-probes-exposure-logs
statement: >-
  In simulated networks of LLM agents where one or two agents are instructed
  to advocate a position, the messages other agents write understate how far
  their elicited stance has moved: they mirror the persuader's rhetorical
  framing in most messages while explicit stance-change language is rare, so
  monitoring only generated text misses belief movement that a repeated
  token-probability probe detects.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four backbones (GPT-4o, GPT-4.1, Gemini-2.5-Flash, Gemini-2.5-Pro), five SNAP Twitter ego-networks of 18-42 nodes, 55 English policy statements, 10 rounds, fixed nine-action vocabu"
sources:
  - source: arxiv-2608-25152
    stance: supports
    note: >-
      Validated by: Across 4,400 runs, per-exposure OLS regressions linked
      direct and peer-mediated exposure counts to next-round probe change
      (direct signs stable across all four backbones under two competing
      persuaders; peer-mediated PR2 exposure significantly negative on all
      four), whereas text markers showed 0.18% explicit reversals; no
      comparison against a human-judged ground truth of influence.. Measured
      over 4,400 runs across 2 settings, 5 graphs, 4 models, 55 statements,
      2 seeds. Marker annotation of PE text plus a GPT-5-mini Cialdini
      classifier (87.3% human-verified). [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-01
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A run where classifier
  or human reading of agent message text recovers the same stance movements
  the probe detects — comparable rates of explicit stance change to
  probe-measured crossings — or where probe movement without corresponding
  text change fails to replicate on other backbones.
