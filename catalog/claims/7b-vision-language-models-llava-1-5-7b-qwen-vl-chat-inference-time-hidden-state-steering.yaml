    stance: supports
    note: >-
      Validated by: CHAIR_s down to 9.4 points lower than baseline with
      recall within 2 points, POPE overall F1 +2.73, MME +14 and best MMHal,
      versus VCD, VDD-None, PAI and SPIN baselines; an always-on variant of
      the same correction injects extra objects and flips 28 correctly
      grounded POPE answers.. Measured on two backbones across three
      decoding regimes and seven benchmarks against four inference-time
      baselines, plus a continuous-steering ablation and hyperparameter
