id: 7b-vision-language-models-llava-1-5-7b-qwen-vl-chat-inference-time-hidden-state-steering
ref: CLM-0567
capability: visual-grounding
technique: steer-hidden-states-only-image-attention-drops-below
statement: >-
  In 7B vision-language models (LLaVA-1.5-7B, Qwen-VL-Chat), inference-time
  hidden-state steering toward image attention helps only when it is gated
  on a grounding signal: correcting at every decoding step injects spurious
  objects and degrades general multimodal benchmarks, while correcting only
  at steps whose pre-softmax image attention falls below a threshold lowers
  object hallucination without losing caption recall.
kind: mechanism
