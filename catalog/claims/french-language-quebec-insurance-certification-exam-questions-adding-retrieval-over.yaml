id: french-language-quebec-insurance-certification-exam-questions-adding-retrieval-over
ref: CLM-1096
capability: domain-knowledge
statement: >-
  On French-language Quebec insurance certification exam questions, adding
  retrieval over a curated regulatory corpus splits models in two: those
  with weak closed-book domain knowledge gain tens of points, while some
  high-scoring models collapse far below random guessing because the
  retrieved context triggers verbose non-compliant output or safety
  refusals.
kind: observation
backing_strength: single-paper
observed_on:
  era: "807 four-way multiple-choice questions from Quebec insurance certification handbooks, answered in French with a single-letter output constraint; 51 LLMs, dense top-5 retrieval over"
sources:
  - source: arxiv-2603-07825
    stance: supports
    note: >-
      Measured across 51 models and 5 baselines with 10-fold stratified
      resampling on a private benchmark. Failure causes (format
      non-compliance, refusal) are reported from analysis of failure cases,
      not quantified, so the split between parsing artifact and genuine
      degradation is not isolated.
contested: false
status: pending-review
last_checked_at: 2026-11-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "retrieval-augmented-generation", which does not
  list this capability in addresses -- recorded, not asserted. Drafted
  confidence: medium. Falsifier as drafted: Re-running the same benchmark
  with lenient answer parsing and refusal handling, and finding the
  collapsed models score near their closed-book accuracy, would show the
  effect is a scoring artifact rather than context distraction.
