id: multi-agent-literature-synthesis-pipelines-most-quality-gain-attributed-learned-coordination
ref: CLM-0344
capability: multi-model-coordination
technique: let-agents-pick-their-next-action-learned-rl
statement: >-
  In multi-agent literature-synthesis pipelines, most of the quality gain
  attributed to a learned coordination policy comes instead from the shared
  architecture (shared workspace, private local knowledge, and a
  critique/disseminate action set): an otherwise identical system with a
  centralized LLM coordinator scored 3.80 overall versus 3.82 for the
  RL-learned decentralized policy, while a naive orchestrator without that
  architecture scored 3.40.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Related-work generation on OARelatedWork with Qwen 2.5 72B agents, four agents, LLM-as-judge 1-5 Likert scores averaged over three judges."
sources:
  - source: arxiv-2609-15721
    stance: supports
    note: >-
      Validated by: LLM-as-judge quality, citation verification rate, tokens
      and inference time on OARelatedWork against SRW, a centralized
      orchestrator with the same architecture, a naive HuggingGPT-style
      orchestrator, GPT-4o long-context and RAG, and PRIMERA; plus ablations
      and transfer to Multi-News.. Measured on 366 evaluation papers with
      three LLM judges; the decisive comparison is the paper's own
      Orchestrator baseline, which shares CREW's workspace and action space
      and differs only in coordinator. [truncated]
