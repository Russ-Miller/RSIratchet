id: multi-modal-robot-motion-planning-stated-natural-language-hard-part
ref: CLM-0376
capability: planning
technique: train-llm-write-solver-checked-mip-programs-task
statement: >-
  For multi-modal robot motion planning stated in natural language, the hard
  part for an LLM is synthesizing the cross-modal coupling (meeting points,
  contact locations, shared intermediate states), not the single-modality
  formulation: giving an LLM fixed expert single-modal MIP modules and
  asking it only to predict the interface variables gives 100% single-modal
  success but 55.6-63.2% multi-modal, below a model fine-tuned with
  solver-verified rewards to write the joint formulation (80.9%).
