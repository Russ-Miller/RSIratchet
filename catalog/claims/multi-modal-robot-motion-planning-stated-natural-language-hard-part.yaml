    stance: supports
    note: >-
      Validated by: Task success rate on 276 held-out LLMM3PBench problems
      versus prompt-only LLMs (GPT-5.2, Gemini 2.5 Flash, open models),
      PDDLStream, LLM+P, ReAct, sampling-based pipelines, and an Expert-MIP
      module-selection control; plus 40 real hardware scenarios at 87.5%.
      Reward ablations at matched 800-step budget show removing
      trajectory-correctness reward drops SR 84.8 to 50.3.. Measured on one
      benchmark authored by the same group, one base model (Qwen3-8B), three
      runs. The Expert-MIP control is the design element that isolates
      coupling from module quality; [truncated]
