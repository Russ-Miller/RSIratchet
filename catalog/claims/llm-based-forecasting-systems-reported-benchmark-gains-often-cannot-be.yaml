id: llm-based-forecasting-systems-reported-benchmark-gains-often-cannot-be
ref: CLM-0419
capability: forecasting
technique: score-forecasts-only-live-post-cutoff-questions-cost
statement: >-
  For LLM-based forecasting systems, reported benchmark gains often cannot
  be attributed to temporal reasoning, because test periods predate the
  training cutoff, ablations show the LLM component sometimes adds nothing
  over the statistical or retrieval parts, and accuracy shifts under small
  input perturbations.
