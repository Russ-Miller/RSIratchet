id: frozen-backbone-running-ungrounded-generate-critique-revise-loop-pure-reasoning-benchmarks-loop
ref: CLM-0393
capability: self-repair
technique: stop-self-critique-loop-confirmed-sentinel-confidence-tag
statement: >-
  For a frozen backbone running an ungrounded generate-critique-revise loop
  on pure-reasoning benchmarks, the loop's accuracy gain is concentrated
  where single-shot accuracy is already low: it leaves accuracy flat on a
  benchmark the model mostly solves in one shot (BBH, ~74%) while adding
  +4.2pp on GSM8K and +14.2pp on MATH (single-shot 26.2%), with the same
  pattern on a second backbone.
