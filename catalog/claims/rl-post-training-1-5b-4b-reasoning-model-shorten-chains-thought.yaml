id: rl-post-training-1-5b-4b-reasoning-model-shorten-chains-thought
ref: CLM-1029
capability: cutting-to-the-chase
technique: rectify-length-pruning-only-accuracy-drops-below-frozen
statement: >-
  When RL post-training a 1.5B-4B reasoning model to shorten chains of
  thought, alternating between a length-minimizing update and an
  accuracy-restoring update gated on falling below a frozen reference
  policy's minibatch accuracy preserves accuracy better than mixing length
  and accuracy into one scalar reward, which degrades correctness on roughly
  a third of the problems it shortens.
