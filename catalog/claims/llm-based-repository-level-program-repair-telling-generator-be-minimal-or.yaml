id: llm-based-repository-level-program-repair-telling-generator-be-minimal-or
ref: CLM-0613
capability: cutting-to-the-chase
technique: shrink-patch-after-generation-during
statement: >-
  In LLM-based repository-level program repair, telling the generator to be
  minimal or constraining its output format does not shrink patches, because
  verbosity comes from the capability-raising machinery itself (iterative
  refinement, broad context); a separate post-generation refiner that
  rewrites an already-plausible patch is what reduces size without losing
  fixes.
