  Drafted confidence: medium. Falsifier as drafted: On the same cases, the
  union over a diverse population of held attacker checkpoints yields attack
  success no higher than the single frozen adaptive attacker, after
  equalizing the number of attempts per case. Drafted stance toward
  computer-use-agents-operating-real-os-indirect-injection-success-rates-measured:
  supports -- Both find that a single fixed evaluation attacker reports
  lower injection success than a more varied or adaptive attacker set on the
  same defender. Proposed technique, not catalogued: Attacker-population
