id: tool-using-agents-trained-against-adaptive-indirect-prompt-injection-attack
capability: prompt-injection
statement: >-
  For tool-using agents trained against adaptive indirect prompt injection,
  attack success measured against a single frozen adaptive attacker
  understates vulnerability compared with taking the per-case success union
  over a population of retained attacker checkpoints (0.25% vs 4.97% on the
  same 1,187 adaptive cases for the trained defender).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Multi-turn tool-use agents in sandboxed domains with deterministic attack verifiers; attackers are learned policies from stages of the same co-training run, and the union uses more"
sources:
  - source: arxiv-2609-07529
    stance: supports
    note: >-
      Measured in one training run, seed 0, one execution per case, on 1,187
      adaptive cases across seven AgentDyn/AgentDojo suites with a
      Qwen3.5-9B defender; the union gets more attempts than the single
      attacker, so attempt count and attacker diversity are not separated,
      and no newly optimized attacker was trained against the final
      defender.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
