id: extracting-fields-vertical-websites-decomposing-xpath-induction-into-separate
ref: CLM-0253
capability: formal-query-synthesis
technique: induce-xpath-seed-pages-via-multi-task-decomposition
statement: >-
  For extracting fields from vertical websites, decomposing XPath induction
  into separate sub-tasks over a few seed pages lets an LLM emit an XPath
  that generalizes to unseen pages of the same site, beating single-prompt
  CoT and Reflexion XPath generation by 14.84-23.86 F1 points, while calling
  the model only a handful of times instead of once per page.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Vertical (single-template) websites with hierarchical HTML and repeated page structure; seed pages available for induction."
sources:
  - source: huang-song-2025-xpath-generation-agents
    stance: supports
    note: >-
      Validated by: F1 on several structured web data extraction datasets
      against Reflexion and CoT prompting baselines; 14.84-23.86 point
      gains, with fewer LLM interactions.. Abstract-only evidence: reported
      F1 gains across multiple datasets versus two prompting baselines. No
      per-dataset numbers, no model list, and no ablation isolating which
      sub-task decomposition carries the gain.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On the same
  vertical-website extraction datasets, decomposed XPath induction matches
