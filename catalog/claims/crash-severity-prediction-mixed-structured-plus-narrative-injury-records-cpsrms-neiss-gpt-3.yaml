id: crash-severity-prediction-mixed-structured-plus-narrative-injury-records-cpsrms-neiss-gpt-3
ref: CLM-1000
capability: multi-model-coordination
technique: fuse-category-specific-agent-scores-trained-mlp
statement: >-
  For crash-severity prediction from mixed structured-plus-narrative injury
  records (CPSRMS, NEISS) with GPT-3.5-turbo, GPT-4o-mini or LLaMA-3.3-70B
  backbones, splitting the record into conceptual categories, scoring each
  with its own LLM agent, and fusing the score vector with a supervised MLP
  beats k-shot, chain-of-thought and AutoGen prompting on the same backbone,
  and beats a tabular MLP or ordered logit on macro-F1, though ordered logit
  still wins on raw accuracy on the full NEISS set.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two US injury-surveillance datasets filtered to micromobility/transport crashes, four-level ordinal severity label, 3:1 train/test split, three 2023-2024-era backbones; MLP fusion "
