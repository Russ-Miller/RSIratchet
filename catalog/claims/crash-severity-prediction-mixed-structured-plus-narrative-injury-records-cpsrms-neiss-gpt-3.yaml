    stance: supports
    note: >-
      Validated by: Accuracy and macro-F1 against k-shot, CoT, AutoGen,
      MLP-on-features, MLP+feature-selection and ordered logit on CPSRMS and
      NEISS across three backbones; ten stratified 80/20 resplits (70.69%
      +/- 1.76 vs 63.22% CoT); ablations removing feature selection,
      category organization, or individual agents; distributional comparison
      of predicted vs true severity.. Measured on two datasets with three
      backbones and ten resplits, plus component ablations. [truncated]
