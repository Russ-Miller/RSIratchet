id: video-language-model-supplies-only-reward-on-robot-rl-training-progress
ref: CLM-0946
capability: reward-hacking
technique: train-progress-rewarder-deliberately-failed-trajectories
statement: >-
  When a video-language model supplies the only reward for on-robot RL,
  training its progress predictor on synthesized non-expert trajectories
  (injected random deviations in simulation, temporal reversals in real
  video) rather than on expert demonstrations alone reduces policies
  exploiting inflated progress estimates, because goal-adjacent-looking
  states otherwise receive high predicted progress.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Manipulation tasks in four simulators plus one real tabletop setup, policy trained from random initialization with no ground-truth reward, demonstrations, or task-specific tuning; "
sources:
  - source: arxiv-2603-28730
    stance: supports
    note: >-
      Validated by: Zero-shot online RL success across 40 tasks (>=50%
      success on 24 tasks vs under 10 for GPT-5, Gemini-3-Pro, Robometer,
      RoboReward, ReWiND); the expert-only-supervision ablation is reported
      to shift failures toward reward hacking as measured by perceived
      (predicted max progress) vs true (ground-truth) success.. Measured,
      but the key ablation is reported qualitatively via a figure and
      appendix with no per-task numbers in the text, and non-expert data
      also changes total data volume, so the design does not cleanly isolate
      deviation coverage from scale. [truncated]
