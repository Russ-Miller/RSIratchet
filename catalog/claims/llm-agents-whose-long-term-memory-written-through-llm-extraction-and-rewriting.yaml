notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A memory pipeline using
  LLM extraction and embedding retrieval where semantically bridged,
  entity-masqueraded triggers are filtered or rewritten away at rates
  comparable to naive concatenation, or where triggered recall stays near
  zero without a matching loss in benign accuracy. Drafted stance toward
  persistent-memory-agents-any-memory-write-rule-decides-using-only-recency:
  supports -- Shows that write-time filters based on salience and surface
  form do not separate genuine from planted content once the planted claim
  is phrased as a coherent, entity-bearing user fact.
