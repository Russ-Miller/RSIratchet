id: parameter-efficient-video-llms-compress-frames-through-lightweight-projector-before-frozen
ref: CLM-1226
capability: video-temporal-reasoning
technique: enforce-block-causal-frame-ordering-video-projector
statement: >-
  For parameter-efficient Video-LLMs that compress frames through a
  lightweight projector before a frozen 7B LLM, replacing the projector's
  unconstrained bidirectional attention with a block-causal mask that
  permits intra-frame but not future-to-past inter-frame attention raises
  NExT-QA accuracy, with the gain concentrated in temporal and causal
  sub-categories rather than descriptive ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot VideoQA, CLIP ViT-L/14 + frozen Vicuna-7B with 4-bit QLoRA, 16 frames, trained only on Video-ChatGPT-100K; measured on NExT-QA with an LLM-judge protocol."
sources:
  - source: arxiv-2601-01804
    stance: supports
    note: >-
      Validated by: Ablation on NExT-QA with the same backbone and data:
      mean-pool+linear 53.8%, LSA+linear 55.6%, LSA+bidirectional
      transformer 58.0%, LSA+causal mask 60.2%, plus terminal summary token
      61.2%; sub-category breakdown shows +3.5 temporal and +5.2 causal over
      the bidirectional variant versus +0.9 descriptive. Placing the summary
      token at the front instead of the end drops accuracy to 57.1%..
      Measured on one backbone and one training corpus, with a progressive
      ablation isolating the mask (+2.2 points) and the terminal token
      (+1.0) and a sub-category breakdown. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Swapping the block-causal
  mask for bidirectional attention in the same projector, with everything
  else fixed, leaves temporal and causal sub-category accuracy unchanged or
  higher; or the reported gain survives equally on descriptive questions,
  indicating generic capacity rather than ordering.
