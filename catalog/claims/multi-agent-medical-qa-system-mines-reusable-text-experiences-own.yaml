id: multi-agent-medical-qa-system-mines-reusable-text-experiences-own
ref: CLM-0249
capability: harness-self-improvement
technique: mine-graded-trajectories-into-three-level-experience-library
statement: >-
  When a multi-agent medical QA system mines reusable text experiences from
  its own graded reasoning trajectories, the level of abstraction matters
  more than the concreteness: removing principle-level entries costs the
  most accuracy, pattern-level less, and concrete stored cases least, with
  the no-experience variant falling back to static multi-agent baseline
  levels.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-only medical multiple-choice benchmarks (MedQA, MedMCQA, PubMedQA, MMLU/MMLU-Pro medical subsets), Qwen3-8B and GPT-4o backbones, 5 mining iterations, ground-truth labels avai"
sources:
  - source: arxiv-2609-15161
    stance: supports
    note: >-
      Validated by: Accuracy across nine medical QA sets against single-LLM,
      MedAgents, MDAgents, and experience-based baselines (ExpeL,
      ReasoningBank, G-Memory, MDTeamGPT, EvolveR); averaged over three
      runs; component and hierarchy-level ablations; cross-model and
      cross-dataset experience transfer.. Measured on one system with two
      backbones; hierarchy ablation drops reported as 1.2% (cases), 2.5%
      (patterns), 4.6% (principles) on MedQA/MedMCQA with Qwen3-8B.
