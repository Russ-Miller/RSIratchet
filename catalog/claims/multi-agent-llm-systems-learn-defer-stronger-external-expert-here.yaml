id: multi-agent-llm-systems-learn-defer-stronger-external-expert-here
ref: CLM-1198
capability: multi-model-coordination
technique: defer-expert-then-train-deferrals
statement: >-
  In multi-agent LLM systems that learn when to defer to a stronger external
  expert (here a proxy model), most of the measured gain comes from
  fine-tuning on the deferred expert demonstrations rather than from better
  deferral decisions: adding GRPO-only deferral optimization moves accuracy
  little, while the added supervised outer loop raises accuracy and the
  updated backbone carries the gain into unrelated single-agent and debate
  pipelines that never defer at inference.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "8B-class open backbones (LLaMA3-8B, Qwen2.5-3B/7B) on math, code and MMLU benchmarks, with a stronger LLM standing in for the human expert"
sources:
  - source: arxiv-2603-07972
    stance: supports
    note: >-
      Validated by: Accuracy on GSM8K/AMC/AIME/HumanEval/MMLU against
      single-agent prompting and multi-agent baselines (debate, DyLAN,
      GPTSwarm, AgentPrune, AFlow) on four backbones; staged ablation
      separating init policy, GRPO-only and full dual loop; and a transfer
      test swapping the DLPO-trained backbone into unchanged baseline
      pipelines.. Measured, single paper. Ablation: init policy
      88.15/33.33/68.30 to GRPO 88.38/32.50/70.47 to full dual loop
      89.86/35.83/73.62 on GSM8K/AMC/MMLU; transfer raises Vanilla 72.76 to
      82.11 and DyLAN 82.03 to 88.32. [truncated]
