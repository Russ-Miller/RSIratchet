ref: CLM-0647
capability: formal-math
technique: blueprint-dag-proving-llm-decomposition-reviewer
statement: >-
  On Lean formalization of IMO-level problems, compiler-feedback revision
  loops raise a general-purpose LLM's solve rate (Gemini 3.1 Pro, 20%
  pass@128 one-shot to 36.6% pass@1 with up to 20 revisions) while leaving a
  specialized 32B Lean prover no better or worse (10% to 6.6%), so the
  ability to read compiler errors and revise across steps is separate from
  one-shot formal proof synthesis skill.
