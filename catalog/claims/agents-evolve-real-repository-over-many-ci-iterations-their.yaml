id: agents-evolve-real-repository-over-many-ci-iterations-their
ref: CLM-1042
capability: software-architecture
technique: score-agents-functional-correctness-future-commits
statement: >-
  When agents evolve a real repository over many CI iterations, their
  accepted patches beat human reference commits on surface style conventions
  while losing on structural maintainability: across 20 models, 15 of 20
  outscored human oracle code on Pylint but all 20 scored lower on
  maintainability index, with consistently fewer changed lines.
kind: observation
backing_strength: single-paper
observed_on:
  era: "100 Python repository tasks (avg 233 days, 71 commits between base and oracle), measured only on successfully solved problems, static metrics Pylint and MI"
sources:
  - source: arxiv-2603-03823
    stance: supports
    note: >-
      Validated by: Applied to 20 models from 8 providers on 100 tasks;
      reported EvoScore rankings shift as the future-weighting parameter
      changes, plus zero-regression rate (most models under 0.25, two Claude
      Opus above 0.5). No comparison against an independent human
      maintainability judgement.. Measured on 100 curated tasks from 68
      repositories, 20 models, >10B tokens; static metrics only, compared
      against the repository's own later commits. [truncated]
contested: false
