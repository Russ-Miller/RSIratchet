notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication on
  comparable multi-commit evolution tasks where model patches match or
  exceed human reference commits on maintainability index, or where the
  Pylint/MI divergence disappears once patch size is controlled. Drafted
  stance toward
  auditing-ai-generated-code-static-smell-detection-code-structure-architecture:
