id: current-vision-language-action-manipulation-benchmarks-task-complexity-environment-variability-varied
ref: CLM-0818
capability: embodied-control
technique: score-task-complexity-environment-structure-separate-axes
statement: >-
  In current vision-language-action manipulation benchmarks, task complexity
  and environment variability are varied together and scored by a single
  task success rate, so a long-horizon failure cannot be attributed to
  planning, memory, skill composition or recovery — and robustness measured
  by perturbing one factor at a time does not predict behaviour when
  perturbations are combined.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Simulated and real robot-arm manipulation benchmarks surveyed through 2025 (CALVIN, LIBERO, Meta-World, GemBench, COLOSSEUM, BEHAVIOR-1K, VLABench); not navigation or driving."
sources:
  - source: arxiv-2604-23001
    stance: supports
    note: >-
      Validated by: Not measured; the survey applies the framework
      descriptively to existing benchmarks rather than testing that it
      improves failure attribution.. Argued in a survey, not measured: it
      cites CALVIN success dropping to near zero at five chained
      instructions and COLOSSEUM degrading under combined perturbations, but
      runs no experiment isolating attribution and proposes no validated
      remedy.
contested: false
