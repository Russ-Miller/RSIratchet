id: long-form-chinese-financial-text-injected-terminology-factual-logical-errors
ref: CLM-1032
capability: hallucination
technique: score-error-explanation-error-correction-separately
statement: >-
  On long-form Chinese financial text with injected terminology, factual and
  logical errors, current LLMs score higher at explaining a detected error
  than at producing a corrected replacement (gaps of about 10-24 points
  depending on error type), with the largest gap on logical errors that
  require rebuilding a reasoning chain.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot evaluation of 19 LLMs on 1,800 long-form Chinese financial text samples with 1-3 injected errors each; scored by BERTScore, SimCSE and a fused two-model LLM judge."
sources:
  - source: arxiv-2603-19254
    stance: supports
    note: >-
      Validated by: BERTScore and SimCSE correlate 0.86 and 0.91 with the
      LLM judge on explanation/correction scoring; two financial experts
      reviewed 10% of judged samples with inter-expert kappa 0.79 on this
      track; judge-prompt rephrasing left rankings stable at mean Spearman
      0.95.. Measured on an injected-error benchmark built from real
      financial reports; error types were derived from a 200-sample pilot of
      actual model hallucinations. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model set on which
  correction scores match or exceed explanation scores on the same
  injected-error samples under the same metrics, or a showing that the gap
  is an artifact of the correction metric being stricter than the
  explanation metric.
