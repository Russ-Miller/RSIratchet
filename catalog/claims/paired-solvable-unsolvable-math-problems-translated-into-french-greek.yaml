id: paired-solvable-unsolvable-math-problems-translated-into-french-greek
ref: CLM-0438
capability: explanation-faithfulness
statement: >-
  On paired solvable/unsolvable math problems translated into French and
  Greek, natively multilingual models (Gemma-4-31B, Qwen3-4B/30B) encode
  solvability most sharply in English yet agree least with that internal
  belief in their stated verdict in English, being more faithful in the
  lower-resource languages, while a weakly multilingual model (Llama-3.1-8B)
  shows the opposite ordering.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six instruction-tuned models, English/French/Greek translations of ReliableMath (313 solvable, 1,102 unsolvable), faithfulness defined as agreement between a pooled linear probe on"
sources:
  - source: arxiv-2608-30463
    stance: supports
    note: >-
      Measured on one benchmark (ReliableMath) machine-translated and
      human-validated into two languages; faithfulness uses ground-truth
      solvability as a proxy for internal belief and an LLM judge
      (Llama-3.3-70B, validated on 100 samples) for the verdict, so the
      probe may partly measure task label rather than belief. Differences
      between languages are a few points (e.g. Qwen3-4B 0.691 En vs 0.728
      Fr/Gr); no confidence intervals given in the excerpt for Table 2.
contested: false
status: pending-review
last_checked_at: 2026-09-29
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Measuring probe-vs-verdict
  agreement on more models and languages and finding faithfulness highest in
  the dominant pretraining language for multilingual models too, or showing
  the reported gap disappears once probe accuracy differences across
  languages are accounted for.
