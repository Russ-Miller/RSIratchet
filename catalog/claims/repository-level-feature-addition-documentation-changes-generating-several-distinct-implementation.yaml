id: repository-level-feature-addition-documentation-changes-generating-several-distinct-implementation
ref: CLM-1035
capability: code-generation
technique: generate-several-designs-then-select-change-impact-analysis
statement: >-
  For repository-level feature addition from documentation changes,
  generating several distinct implementation designs and selecting among the
  resulting patches by change-impact analysis (static dependency tracing
  plus regression and new-feature test execution) raises task success more
  than code-graph-based localization does, and generating too many designs
  degrades selection accuracy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "NoCode-bench Verified (114 manually validated Python repository feature-addition tasks), seven LLM backbones, compared against Agentless and OpenHands"
sources:
  - source: arxiv-2603-01814
    stance: supports
    note: >-
      Validated by: Success rate on NoCode-bench Verified: 39.47% with
      Gemini-2.5-Pro vs 28.95% best baseline (Agentless); ablations removing
      multi-design (-38.47% relative success), patch evaluation (-33.32%),
      code graph (-12.83%); design-count sweep on DeepSeek-v3.2 peaks at N=5
      (88.64% selection accuracy, 34.21% success) and falls to 28.95% at
      N=9.. Measured on one benchmark (114 tasks) across seven backbones
      with two baselines; ablations run on a single backbone (DeepSeek-v3.2)
      so the component ranking is not shown to hold across models.
