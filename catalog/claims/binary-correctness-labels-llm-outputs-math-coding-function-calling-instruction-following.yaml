    stance: supports
    note: >-
      Validated by: F1 of the induced verifier set's joint satisfaction
      against benchmark-evaluator correctness labels on AIME, LiveCodeBench,
      ComplexFuncBench and IFBench, compared with the initial LLM-generated
      verifier set from the same model; gains up to 55.0 F1 in-distribution
      and up to 54.4 F1 when the same verifiers are applied to a different
      base model's outputs; final sets held to 1-6 functions. Separately,
      exposing the verifiers as tools to GPT-4.1 raised task accuracy by
      1.6-17.0 points.. [truncated]
