id: binary-correctness-labels-llm-outputs-math-coding-function-calling-instruction-following
ref: CLM-0809
capability: error-detection
technique: search-dag-executable-python-verifier-sets-against-labels
statement: >-
  For binary correctness labels on LLM outputs in math, coding,
  function-calling and instruction-following tasks, searching over
  LLM-proposed sets of executable Python verifiers — expanding promising
  candidate sets from their false positives and negatives under a utility
  that scores F1, exploration, set size and non-degeneracy — produces
  1-6-function verifier sets that predict the correctness label far better
  than the one-shot LLM-generated verifier sets they started from.
kind: observation
backing_strength: single-paper
