notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Show that claim-level
  self-confidence plus post-hoc calibration matches or beats response-level
  temperature scaling on false-premise benchmarks across models, or that the
  TriviaQA gains disappear under a different claim extractor. Drafted stance
  toward self-critique-without-grounding-unreliable: supports -- The paper
  finds confidence-only self-assessment fails exactly where the model is
  confidently wrong, and recommends external retrieval or cross-examination.
