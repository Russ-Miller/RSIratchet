id: single-step-tool-calling-agents-near-perfect-clean-accuracy-does-predict-robustness
ref: CLM-0734
capability: tool-use
statement: >-
  For single-step tool-calling agents, near-perfect clean accuracy does not
  predict robustness, and the dominant weak point is recovering the answer
  from perturbed tool returns rather than selecting the tool or binding
  arguments: across seven models, clean success averaged 0.979 while success
  under corrupted or missing returned evidence averaged 0.455, with no model
  above 0.60.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-step tool calls over 16 deterministic local tools with fixed gold arguments; four stage-aligned perturbation families at three severities; no long-horizon or stateful depend"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Measured on 15,456 single-family records across 7 models, 14 subtypes;
      family-mean robustness 0.918 interface, 0.773 intent, 0.688 runtime,
      0.455 observation. A human audit found 68.3% of sampled evidence-loss
      cases at least partially recoverable, so the gap is not an
      unsolvable-target artifact. Deterministic local tools, so absolute
      rates may not transfer to live APIs.
contested: false
status: pending-review
last_checked_at: 2026-10-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model-family
  evaluation under the same stage-aligned perturbations where
  observation/evidence perturbation is no more damaging than interface or
  intent perturbation, or where clean accuracy predicts per-family
  robustness ranking. Drafted stance toward
  single-step-tool-calling-agents-near-ceiling-accuracy-unperturbed-calls-does-predict:
  supports -- Independently reproduces that corrupting the tool's returned
  evidence hurts far more than perturbing tool names, descriptions, or the
  user request.
