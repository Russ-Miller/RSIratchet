id: llm-guided-narrow-space-parking-where-optimal-control-solver-supplies-pass-fail
ref: CLM-0371
capability: harness-self-improvement
technique: evolve-decision-knowledge-base-solver-failures-gated-feasibility
statement: >-
  For LLM-guided narrow-space parking where an optimal-control solver
  supplies pass/fail evidence, growing a decision knowledge base offline
  from accumulated solver and validation failures — retaining an entry only
  when re-planning then yields a feasible trajectory — raises planning
  success from 85.1% to 94.7% and closed-loop success from 74.6% to 84.2%
  over an empty knowledge base, with model weights frozen.
kind: observation
backing_strength: single-paper
observed_on:
  era: "38 simulated confined parking scenarios, car-like kinematic model, all LLM components gpt-5.6-sol, bounded online replanning budget of three attempts; one qualitative differential-"
sources:
  - source: arxiv-2609-24631
    stance: supports
    note: >-
      Validated by: Ablation on 38 scenarios against the same pipeline with
      an empty knowledge base: planning success 94.7% vs 85.1%, closed-loop
      success 84.2% vs 74.6%; also compared against HA*, Direct OCP and
      HA*+OCP baselines.. Measured: single ablation table on 38 simulated
      scenarios with one LLM, one vehicle model, one controller. Isolates
      the knowledge base against an empty base with other settings fixed,
      but no repeated trials, no variance reported, and no test of whether
      hand-written entries would do as well. Real-robot evidence is a single
      qualitative run.
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
