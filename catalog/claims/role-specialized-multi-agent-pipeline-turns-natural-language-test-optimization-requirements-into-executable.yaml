statement: >-
  In a role-specialized multi-agent pipeline that turns natural-language
  test-optimization requirements into executable Qiskit programs, the
  curated code-generation skill given to the coding agent matters more than
  the multi-agent decomposition itself: removing the skill drops compilation
  to near zero, while collapsing all roles into one prompted agent stays
  close to the full pipeline.
