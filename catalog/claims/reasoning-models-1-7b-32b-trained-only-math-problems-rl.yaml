      the base model, no-thinking, shortest-correct SFT, and four RL
      length-penalty baselines (hard, soft, normalized, TWYN); best method
      scores 76.6 AUC_OAA vs 71.6 base and 74.0 second-best, with per-stage
      ablations.. Measured on seven benchmarks with N=10-64 samples per
      question, with component ablations separating SFT and RL contributions
