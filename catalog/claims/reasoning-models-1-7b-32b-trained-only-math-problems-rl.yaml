id: reasoning-models-1-7b-32b-trained-only-math-problems-rl
ref: CLM-1170
capability: cutting-to-the-chase
technique: penalize-only-tokens-after-first-correct-answer
statement: >-
  For reasoning models of 1.7B-32B trained only on math problems, RL with a
  reward that penalizes the fraction of tokens generated after the trace's
  first correct answer, preceded by a short SFT warm-up on shortest-correct
  or summary-stripped traces, cuts average response length by 22-41% at
  under 2.5 points accuracy loss, and the length saving grows with model
  size.
