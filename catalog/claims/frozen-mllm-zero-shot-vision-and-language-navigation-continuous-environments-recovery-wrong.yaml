    stance: supports
    note: >-
      Validated by: Incremental ablation on the same 100-episode R2R-CE
      val-unseen set: greedy 31.0 SR, +loop-alert backtrack 37.0,
      +checkpoints and blocking 39.0, +expectation checks 47.0 SR / 38.8
      SPL; no variance reported for the ablation rows.. Single-paper, one
      ablation table on 100 episodes with one backbone; main-table runs
      report +/-0.8 pp SR spread over three runs but the ablation rows
      report no spread, so the 8-point step is larger than observed noise on
      the main split yet not independently replicated. [truncated]
