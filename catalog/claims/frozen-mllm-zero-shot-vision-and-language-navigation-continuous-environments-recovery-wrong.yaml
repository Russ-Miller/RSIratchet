id: frozen-mllm-zero-shot-vision-and-language-navigation-continuous-environments-recovery-wrong
ref: CLM-1096
capability: embodied-control
technique: commit-expectation-per-branch-backtrack-mismatch
statement: >-
  For frozen MLLM zero-shot vision-and-language navigation in continuous
  environments, recovery from a wrong turn improves most when the agent
  commits a natural-language expectation to each branch and rejects it on
  observation mismatch: on a 100-episode R2R-CE set, loop-alert backtracking
  plus checkpoints with blocked-direction memory raised success from 31% to
  39%, and adding the expectation check raised it further to 47%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot GPT-5.1-driven agent with an external metric TSDF map and topological graph; static indoor simulator scenes; 100-episode R2R-CE subset."
