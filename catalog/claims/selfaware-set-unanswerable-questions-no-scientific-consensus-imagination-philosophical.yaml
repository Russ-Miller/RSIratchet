id: selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical
ref: CLM-0270
capability: abstention-and-self-knowledge
statement: >-
  On SelfAware, a set of unanswerable questions (no scientific consensus,
  imagination, philosophical, too many variables, subjective) paired with
  answerable ones, models' ability to flag the unanswerable ones rises with
  parameter count, with instruction tuning and with in-context examples, yet
  the best model tested (GPT-4, F1 about 75) stays well below the human
  reference of about 85, so self-knowledge is present but incomplete.
kind: observation
backing_strength: single-paper
observed_on:
  era: "20 models from GPT-3, InstructGPT, LLaMA and Vicuna families, 2023; uncertainty detected by matching responses against reference uncertain phrasings with a similarity threshold."
sources:
  - source: arxiv-2305-18153
    stance: supports
    note: >-
      Single benchmark with an automatic uncertainty detector that keys on
      phrasing, which can miss hedged answers in other words; the human
      baseline is a small volunteer set. The scaling and instruction-tuning
      trends are consistent across the three prompt forms tested.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A current model reaching
  or exceeding the human F1 on SelfAware or a like benchmark, or evidence
  the gap is an artefact of the phrase-matching detector rather than of the
  models.
