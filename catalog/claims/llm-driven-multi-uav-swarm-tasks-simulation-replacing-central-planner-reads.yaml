    stance: supports
    note: >-
      Validated by: Mean undiscounted episode return over 10 episodes on
      nine tasks against a centralized joint-action planner and HMAS-2
      (central plan plus one local review round), plus three component
      ablations and per-episode token counts.. Measured on nine simulated
      tasks with 10 episodes each and reported SDs, against two LLM planner
      baselines sharing skills and executors; three single-component
      ablations isolate activation, reports, and reward correction.
