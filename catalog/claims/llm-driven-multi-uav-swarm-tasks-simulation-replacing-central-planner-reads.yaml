id: llm-driven-multi-uav-swarm-tasks-simulation-replacing-central-planner-reads
ref: CLM-0243
capability: embodied-control
technique: give-each-body-bound-agent-role-filtered-skill
statement: >-
  For LLM-driven multi-UAV swarm tasks in simulation, replacing a central
  planner that reads pooled team state and emits joint skill calls with
  body-bound per-UAV agents that each see only a role-filtered subset of the
  skill catalog plus directed peer messages raises episode return on all
  nine tested tasks, and ablations show the role-filtered skill menu and the
  peer coordination reports each dominate on different task types while
  experience-based reward correction adds the smallest increment.
kind: observation
backing_strength: single-paper
