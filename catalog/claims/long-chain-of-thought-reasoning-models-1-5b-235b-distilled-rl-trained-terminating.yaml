    stance: supports
    note: >-
      Validated by: Accuracy and generated token length on
      GSM8K/AMC23/MATH500, AIME24-25/OlympiadBench, GPQA-Diamond against
      vanilla CoT, NoThinking, ThinkLess, Dynasor-CoT and DEER; average
      accuracy gain over vanilla CoT reported as 3.9% overall and 5.1% on
      distilled models; ablations removing the global baseline, the window,
      and the boundary trigger each lose accuracy.. Measured on eight models
      across seven datasets with five baselines, reporting accuracy and
      length. Gains are modest on strong RL-trained models (+1.8, +2.1
      average) and larger on distilled ones (up to +7.9). [truncated]
