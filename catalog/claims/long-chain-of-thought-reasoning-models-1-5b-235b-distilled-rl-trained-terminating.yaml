id: long-chain-of-thought-reasoning-models-1-5b-235b-distilled-rl-trained-terminating
ref: CLM-1020
capability: cutting-to-the-chase
technique: exit-reasoning-local-entropy-spikes-above-global-baseline
statement: >-
  For long chain-of-thought reasoning models (1.5B-235B, distilled and
  RL-trained), terminating reasoning when the average token entropy in a
  recent sliding window rises sharply above the running average entropy of
  the whole trace so far raises accuracy over vanilla CoT on math and
  science benchmarks, while cutting fewer tokens than answer-probing or
  fixed-budget early-exit methods.
kind: mechanism
backing_strength: single-paper
