    stance: supports
    note: >-
      Validated by: On LLaVA-v1.5-7B/13B, lower CHAIR_s/CHAIR_i on Object
      HalBench and lower Hal/Cog on AMBER than SENTINEL, RLAIF-V, TPO, mDPO,
      Re-Align and HA-DPO, with VQAv2/TextVQA/ScienceQA/MM-Vet held near
      baseline; also lowest hallucination rate on the authors' own MOH
      benchmark. Ablations cover detection threshold and iterative masking.
      No independent replication; the benchmark is authored by the same
      group.. Measured on two LLaVA checkpoints plus a model-specific HII
      filter run over Qwen-VL and LLaVA-1.5; [truncated]
