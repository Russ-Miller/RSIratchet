id: 7b-13b-llava-class-vision-language-models-object-hallucination-follows-scene-conditioned-pattern
ref: CLM-0965
capability: visual-grounding
technique: build-dpo-pairs-object-masked-counterfactual-images
statement: >-
  In 7B-13B LLaVA-class vision-language models, object hallucination follows
  a scene-conditioned pattern: when a salient object is masked out of a
  natural image, the model still asserts its presence in a majority of
  sampled descriptions, and which object is hallucinated is predicted by the
  scene (boat at waterfronts, train on railroads, sink in bathrooms) rather
  than by residual visual evidence.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Shown on masked COCO/Visual-Genome images restricted to the 80 MS-COCO categories, with masking verified by GroundingDINO; images selected as the intersection of hallucination-indu"
sources:
