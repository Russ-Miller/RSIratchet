id: best-of-n-selection-among-candidate-competitive-programming-solutions-output-agreement-voting-generated
ref: CLM-0987
capability: error-detection
technique: train-verifier-search-discriminative-test-inputs
statement: >-
  For best-of-N selection among candidate competitive-programming solutions
  by output-agreement voting on generated test inputs, the selection
  accuracy is governed by whether the inputs are discriminative rather than
  how many there are: randomly sampled valid inputs rarely hit the small
  fraction of inputs that separate correct from incorrect programs, so
  scaling random inputs saturates well below ground-truth test suites, while
  a verifier trained to search for counterexamples closes most of that gap.
