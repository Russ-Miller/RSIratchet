id: open-weight-large-audio-language-models-answering-temporal-questions-about-onset
ref: CLM-0706
capability: audio-understanding
technique: rescale-audio-token-attention-one-bottleneck-layer
statement: >-
  In open-weight large audio-language models answering temporal questions
  about onset, offset and duration, multiplicatively rescaling (sharpening
  or smoothing) the attention distribution over audio tokens corrects more
  initially wrong answers than simply adding attention mass to audio tokens,
  so audio-text modality imbalance alone does not account for temporal
  reasoning failures.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Two fully open 7-8B LALMs (Audio-Flamingo-3, DeSTA-2.5-Audio) on 1,657 four-way multiple-choice questions built from TACOS real-world clips; interventions applied training-free to "
sources:
  - source: arxiv-2606-17417
    stance: supports
    note: >-
      Validated by: Fix rate on initially incorrect items (scaling ~20% vs
      ~10-16% for best upweighting) and accuracy on the three tasks:
      all-layer intervention dropped accuracy below baseline, while
      single-layer scaling raised average accuracy from 55.9% to 59.1%..
      Measured on 1,657 constructed questions, two models, three tasks, with
      a silence-ablation check that answers need audio. Only two models, one
      dataset source, one intervention family; [truncated]
