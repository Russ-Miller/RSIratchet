id: simulated-urban-air-ground-object-search-where-vlm-drives-both
ref: CLM-0220
capability: embodied-control
statement: >-
  In simulated urban air-ground object search where a VLM drives both a UAV
  and a UGV, wrapping the model in a fixed search-handoff-verify protocol
  that leaves geometric projection and road-graph path planning to
  deterministic tools raises task success for backbones with adequate
  perception while cutting decision calls for all, but does not lift weak
  small open models, whose success can fall on harder splits.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "210 held-out CARLA-Air episodes in one unseen town, three difficulty levels, nine VLM backbones, 80 high-level decision budget, idealized communication and known map; static vehicl"
sources:
  - source: arxiv-2609-08402
    stance: supports
    note: >-
      Paired baseline-vs-protocol runs on 210 episodes: success rate
      improved for 8 of 9 backbones, decision steps fell for all 9, mean
      +22.5 points and -33.3 steps; Gemini-3.6-Flash hard split 8.6 to 55.7
      SR. Qwen3-VL-4B and Qwen3-VL-30B-A3B dropped on mid/hard. The design
      compares the whole protocol against plain prompting and does not
      ablate individual tools, so which component carries the effect is not
      isolated; single test town.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A paired comparison on
  the same benchmark where the protocol gives no success gain for strong
  backbones, or where weak small models gain as much as strong ones.
  Proposed technique, not catalogued: role-conditioned search-handoff-verify
  protocol with deterministic projection and path planning tools.
