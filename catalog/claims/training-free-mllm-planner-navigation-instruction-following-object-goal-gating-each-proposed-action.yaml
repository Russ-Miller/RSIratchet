notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An ablation on larger
  episode sets where removing proposal/stop validation leaves success rate
  unchanged, or where the same planner dispatching directly matches the
  harness on both success and path efficiency.
