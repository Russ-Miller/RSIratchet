id: llm-agents-doing-active-clinical-diagnosis-interactive-patient-environments
ref: CLM-0609
capability: tool-use
technique: scaffold-diagnosis-evidence-tools-coverage-based-stopping-harness
statement: >-
  For LLM agents doing active clinical diagnosis in interactive patient
  environments, wrapping the model in a scaffold of role-specialized agents,
  evidence tools and an explicit evidence state, with a runtime observer
  that tracks uncertainty and evidence coverage to decide when to stop
  acquiring evidence, raises both diagnostic accuracy and execution
  stability over static case-to-answer prompting, with the size of the gain
  depending on the backbone model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Interactive diagnostic environments synthesized from raw clinical cases; evaluated on execution robustness, reasoning dynamics and diagnostic outcomes."
sources:
  - source: arxiv-2608-24570
    stance: supports
    note: >-
      Validated by: A three-level evaluation pyramid (execution robustness,
      reasoning dynamics, diagnostic outcomes) reporting improved diagnostic
      performance and process stability over baselines; the abstract gives
      no numbers.. Abstract only: claims improvement in diagnostic
      performance and process stability with model-dependent boundaries, but
      reports no metrics, baselines, case counts or ablations, so the
      contribution of the stopping harness versus the role scaffold is not
      isolated.
contested: false
status: pending-review
last_checked_at: 2026-10-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Running the same backbones
