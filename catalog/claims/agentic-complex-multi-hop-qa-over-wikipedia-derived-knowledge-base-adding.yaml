id: agentic-complex-multi-hop-qa-over-wikipedia-derived-knowledge-base-adding
ref: CLM-0575
capability: hallucination
technique: expose-handwritten-graph-queries-agent-tools-cypher-generation
statement: >-
  For agentic complex multi-hop QA over a Wikipedia-derived knowledge base,
  adding handwritten graph-query tools over a lightweight document graph
  (article/section/paragraph links) on top of vector search raises
  factual-correctness precision and recall and answer relevancy largely by
  cutting safe refusals, so hallucinated answers go down only relative to a
  no-retrieval zero-shot agent and go up relative to plain vector RAG, which
  refuses most questions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One model (GPT-5.4, medium reasoning), 510 MoNaCo questions, three runs, LLM-as-a-judge scoring with no human validation; knowledge base is public Wikipedia so the zero-shot arm be"
sources:
  - source: arxiv-2606-05901
    stance: supports
    note: >-
      Validated by: Median over three runs on 510 MoNaCo questions vs
      vector-RAG and zero-shot baselines: factual-correctness precision 0.36
      vs 0.15 vs 0.43, recall 0.33 vs 0.13 vs 0.39, answer relevancy 0.61 vs
      0.35 vs 0.80, fine-grained truthfulness 63 vs 35 vs 40.5; fully
      correct 142 vs 58 vs 174 answers, wrong-answer counts 191 vs 84 vs
      301; total tokens 45,695 vs 41,694. No per-tool ablation.. Measured on
      510 of 1,207 answerable MoNaCo questions, three repeats, single
      generator model and single judge model (Llama-4-Maverick), no human
      validation. [truncated]
