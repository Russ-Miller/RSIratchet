      deck: 0 (PyPDF2), 3,924 (Docling), 4,268 (Nougat), 12,568 (GPT-4
      Vision), 20,760 combined — a 65.2% increase over the best single tool;
      no downstream retrieval or answer-accuracy comparison isolates the
      merge.. Measured on a single six-page document with one metric
      (character count) and hand-assigned categorical labels for
