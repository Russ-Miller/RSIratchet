id: image-rendered-engineering-lecture-slides-containing-equations-diagrams-no-single
ref: CLM-1146
capability: domain-knowledge
technique: run-text-formula-diagram-extractors-parallel-merge
statement: >-
  For image-rendered engineering lecture slides containing equations and
  diagrams, no single document-extraction tool recovers all three content
  types: a plain PDF text library extracts nothing, a layout parser leaves
  formulas as unprocessed placeholders, a formula-recognition model returns
  LaTeX but only fragmentary surrounding text, and a vision LLM describes
  diagrams but renders equations as prose instead of symbolic notation.
kind: observation
backing_strength: single-paper
