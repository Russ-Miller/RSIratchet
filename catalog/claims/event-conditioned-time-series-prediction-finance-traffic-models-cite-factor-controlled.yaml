id: event-conditioned-time-series-prediction-finance-traffic-models-cite-factor-controlled
ref: CLM-0356
capability: explanation-faithfulness
technique: score-cited-factors-whether-paired-intervention-moves-prediction
statement: >-
  In event-conditioned time-series prediction (finance and traffic), models
  cite the factor that a controlled intervention actually manipulated in
  nearly all cases while their predictions change with that factor far less
  often — on traffic series-side pairs citation exceeds 90% for most of ten
  models but pair-level behavioral support stays under 22% — so citation of
  the right factor is not evidence the prediction depended on it.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Ten current LLMs on 4,856 records across a finance (market response) and traffic (incident response) benchmark, with independently evaluated counterfactual pairs whose gold answers"
sources:
  - source: arxiv-2609-24677
    stance: supports
    note: >-
      Validated by: Applied to ten models; shows citation rates near 100%
      alongside CSDR under 22% on traffic series-side pairs, and separates
      endpoint correctness from pair consistency; no independent human check
      of the faithfulness metric itself.. Measured on benchmark-constructed
      pairs with rule-grounded labels; human annotators beat the best model
      on matched items, supporting solvability. Single paper, models'
      identities partly synthetic-sounding/unverifiable, and the gap metric
      is conditional on citation so it is sensitive to how cited factors are
      annotated.
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On the same controlled
  pairs, showing that explanations citing the manipulated factor are
  accompanied by matching prediction transitions at rates close to the
  citation rate, or that the low support rate is an artifact of endpoint
  difficulty rather than pair inconsistency.
