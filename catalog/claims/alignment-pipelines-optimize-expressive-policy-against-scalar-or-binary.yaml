id: alignment-pipelines-optimize-expressive-policy-against-scalar-or-binary
ref: CLM-1068
capability: reward-hacking
statement: >-
  In alignment pipelines that optimize an expressive policy against a scalar
  or binary proxy evaluator (RLHF, RLAIF, RLVR), reward hacking is a
  structural consequence of three interacting forces rather than an
  implementation bug: lossy compression of high-dimensional human objectives
  into a low-dimensional score, optimization pressure that drives the policy
  into regions where the proxy extrapolates poorly, and co-adaptation in
  which evaluator and policy converge on shared blind spots.
kind: mechanism
backing_strength: mechanism-reasoning
observed_on:
  era: "Holds wherever the training signal is a learned or engineered proxy for the real objective and the policy is strong enough to search the proxy's null space; the survey argues it ra"
sources:
  - source: arxiv-2604-13602
    stance: supports
    note: >-
      Argued, not measured: a survey that organizes existing findings
      (verbosity bias, sycophancy, unfaithful CoT, overoptimization scaling
      laws, test tampering) under one framework. It synthesizes prior
      results rather than reporting new experiments, so the framework's
      unifying power is a reading of the literature, not an independent
      test, and the three forces are not separately isolated.
