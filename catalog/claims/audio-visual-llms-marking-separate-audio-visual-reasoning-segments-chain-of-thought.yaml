id: audio-visual-llms-marking-separate-audio-visual-reasoning-segments-chain-of-thought
ref: CLM-0808
capability: hallucination
technique: mask-cross-modal-attention-during-separated-audio-visual
statement: >-
  In audio-visual LLMs, marking separate audio and visual reasoning segments
  with chain-of-thought tags does not by itself stop cross-modal leakage —
  because causal attention still lets each segment read the other modality's
  input tokens — so enforcing the separation with an attention mask that
  blocks those query-key pairs is what delivers stable gains on cross-modal
  hallucination and general AVQA.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-Omni-7B and Qwen3-Omni-30B-A3B backbones on AVHBench and AVQA-style benchmarks; both train-free and GRPO-trained variants."
sources:
  - source: arxiv-2605-09906
    stance: supports
    note: >-
      Validated by: Ablation on AVHBench (VAH/AVH/MIS) and AVQA: train-free,
      tags alone moved MIS 66.36 to 74.89 but dropped AVH 81.95 to 79.93 and
      left AVQA flat; adding the mask raised AVH to 83.98 and AVQA 89.61 to
      92.11. Same ordering under GRPO training. No comparison against other
      isolation schemes such as two separate forward passes.. Measured on
      one paper's ablation table across two conditions (train-free, GRPO) on
      AVHBench's three subsets plus AVQA; [truncated]
