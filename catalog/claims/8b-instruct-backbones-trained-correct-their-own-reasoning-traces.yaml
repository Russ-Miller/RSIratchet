id: 8b-instruct-backbones-trained-correct-their-own-reasoning-traces
ref: CLM-0350
capability: self-repair
technique: correct-reasoning-typed-executable-repair-operators
statement: >-
  For 8B instruct backbones trained to correct their own reasoning traces,
  supervising a typed, executable edit (error type, step location, corrupted
  and repaired proposition) and applying it as a localized,
  applicability-checked transition beats free-form self-revision baselines
  (Self-Refine, RISE, SCoRe) on math, code and commonsense benchmarks, and
  most of the gain arrives in the first few correction rounds.
