      MMLU, PIQA) on Llama-3-8B-Instruct: average 67.5 vs 64.3 for DiffCoT
      and 63.7 for SCoRe, 59.4 base CoT; seven transfer targets on two
      backbones; ablations removing operator loss, adjacent-state loss, and
      each noise source all lower scores; five seeds with Holm correction..
