id: financial-qa-over-10-k-style-filings-replacing-text-chunk-retrieval-retrieval
ref: CLM-1089
capability: hallucination
technique: retrieve-typed-verified-variables-text-then-compute-python
statement: >-
  For financial QA over 10-K-style filings, replacing text-chunk retrieval
  with retrieval of character-offset-verified typed numeric variables and
  routing all arithmetic to executed Python lowers the rate of answers
  containing ungrounded numbers (4.1% to 1.2%) and raises exact match, but
  the retrieval upgrade alone, feeding a chain-of-thought generator, lowers
  exact match (39.2% to 37.4%) and raises hallucination because the enriched
  context is harder to synthesize from.
kind: mechanism
