id: 8b-open-base-model-expert-curated-combustion-science-reasoning-questions-staged
ref: CLM-0979
capability: domain-knowledge
technique: continual-pre-train-then-reasoning-sft-then-rl
statement: >-
  For an 8B open base model on expert-curated combustion-science reasoning
  questions, staged domain adaptation (continued pre-training on a mixed
  domain/general corpus, then general and domain SFT, then verifiable-reward
  RL) scores higher than retrieval-augmented generation over much larger
  general-purpose models given the same domain literature, with the RL stage
  contributing the largest single jump.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single 436-question multiple-choice benchmark built from the same literature the training corpus was drawn from; one base model (Qwen3-8B); RAG baselines use FAISS + BGE-M3 retriev"
sources:
  - source: arxiv-2603-19268
    stance: supports
    note: >-
      Measured on one self-built benchmark constructed from literature
      overlapping the training corpus, so leakage and benchmark-format
      effects are not isolated; the anomalously low GPT-5 score (15.6%,
      below the 27.18% general-model average) suggests the evaluation format
      penalizes some models, weakening the cross-model comparison. Stage
      ablations are sequential, not factorial.
