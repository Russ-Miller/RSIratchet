id: because-cross-entropy-fine-tuning-maximum-likelihood-estimation-while-advantage-weighted-rl-preference
ref: CLM-1036
capability: abstention-and-self-knowledge
technique: post-rl-supervised-fine-tuning-self-distilled-correct
statement: >-
  Because cross-entropy fine-tuning is maximum-likelihood estimation while
  advantage-weighted RL and preference objectives push probability mass
  toward high-reward outputs, a short supervised fine-tuning pass on the
  model's own correct outputs after RL restores confidence calibration
  without losing task accuracy, whereas further GRPO or DPO on the same data
  leaves confidence sharpened.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Shown on one 4B instruct model (Qwen3-4B) across seven classification and short-answer generation benchmarks, using normalized answer-token or Yes/No self-evaluation probabilities;"
sources:
  - source: arxiv-2603-06604
    stance: supports
    note: >-
      Validated by: On Qwen3-4B over seven tasks, SFT raised mean
      confidence-correctness AUROC from 0.806 to 0.879 and cut ECE from
      0.163 to 0.034, while GRPO (AUROC 0.809, ECE 0.135) and DPO (0.785,
      0.117) did not; using dataset labels instead of self-distilled ones
      dropped GSM8K accuracy from 92.5% to 83.1%. No baseline isolating SFT
      data volume or a non-self-distilled matched control on all tasks..
      Measured on one model family and size (Qwen3-4B) with three training
      arms on identical data across seven benchmarks; [truncated]
