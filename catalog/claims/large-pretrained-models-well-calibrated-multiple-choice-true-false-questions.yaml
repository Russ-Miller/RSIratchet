id: large-pretrained-models-well-calibrated-multiple-choice-true-false-questions
ref: CLM-0267
capability: abstention-and-self-knowledge
technique: ask-p-true-after-showing-model-several-own
statement: >-
  Large pretrained models are well calibrated on multiple-choice and
  true/false questions when answer options are shown as lettered choices,
  and can predict the probability that their own sampled answer is correct
  (P(True)) or that they know the answer at all (P(IK)); calibration
  improves with model size and few-shot prompting, self-evaluation improves
  when the model sees several of its own samples first, and P(IK)
  generalizes only partly to new tasks, where its calibration degrades.
