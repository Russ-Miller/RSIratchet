id: confidence-signals-derived-model-s-own-self-verification-cross-sample-consistency
ref: CLM-0370
capability: abstention-and-self-knowledge
technique: calibrate-confidence-per-atomic-claim-per-response
statement: >-
  Confidence signals derived from a model's own self-verification and
  cross-sample consistency, calibrated per atomic claim, lower calibration
  error on straightforward factual QA but get worse than simple
  response-level temperature scaling on adversarial false-premise questions,
  because the pipeline faithfully reports a confidence the model holds
  wrongly rather than correcting it.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Closed-box settings with no logits or fine-tuning; six models (Llama-3.1-8B, Mistral-7B, Qwen2.5-7B, DeepSeek-R1, GPT-4, GPT-4o) on TriviaQA and TruthfulQA short-answer QA."
sources:
  - source: arxiv-2608-22483
    stance: supports
    note: >-
      Validated by: ECE, smECE, Brier, AUROC, AURC against seven baselines
      (few-shot likelihood, CoT, verbalized confidence, PS, TS, LMvsLM,
      HalluMeasure) on TriviaQA and TruthfulQA across six models; best on
      GPT-4o/TriviaQA (ECE 0.006 vs 0.096 for TS), worse than TS on
      TruthfulQA (0.412 vs 0.118).. Measured on two datasets and six models
      with seven baselines, but wins are scattered and model-dependent (the
      proposed method is not best in most cells), no confidence intervals
      reported, and the false-premise failure is argued from a handful of
      ECE comparisons.
contested: false
