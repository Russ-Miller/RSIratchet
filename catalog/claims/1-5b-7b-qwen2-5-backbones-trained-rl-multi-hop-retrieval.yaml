id: 1-5b-7b-qwen2-5-backbones-trained-rl-multi-hop-retrieval
ref: CLM-0338
capability: multi-step-reasoning
technique: reversible-memory-stack-per-action-process-rewards
statement: >-
  For 1.5B-7B Qwen2.5 backbones trained with RL on multi-hop retrieval QA,
  giving the policy reversible memory operations (summary, backtrack over a
  stack) with per-action process rewards raises F1 over trajectory-reward
  agentic-RAG baselines, and removing the two memory actions costs more than
  removing the planning action.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5 1.5B/3B/7B trained on filtered HotpotQA and 2WikiMultiHopQA; evaluated on multi-hop, open-domain and agentic QA with a Wikipedia search tool; F1 only."
sources:
  - source: arxiv-2608-29622
    stance: supports
    note: >-
      Validated by: F1 on seven QA benchmarks against No-RAG, naive RAG,
      agentic RAG and RL baselines (ReSearch, Search-R1, AEPO, ARPO, Mem1);
      average 33.55 vs 30.16 best baseline at 3B; ablations drop average to
      27.37 without memory actions, 25.43 without rejection, 19.94 without
      both process rewards.. Measured across three model sizes, seven
      benchmarks, with component, reward and leave-one-action-out ablations.
