technique: feed-cached-self-predicted-latents-back-training-context
statement: >-
  For diffusion-transformer world models used as closed-loop simulators of
  robot manipulation (LIBERO), training with ground-truth context frames
  (teacher forcing) leaves the model unable to recover from its own
  prediction errors at inference, so progressively substituting the model's
  own cached latent predictions as historical context during training lowers
  long-horizon video error and raises downstream RL policy success.
