capability: forecasting
technique: evaluate-forecasters-live-post-cutoff-questions-llm-removed
statement: >-
  For LLM-based forecasting systems, reported gains on retrospective
  benchmarks often do not survive scrutiny: the same results also appear
  under ablations where removing the LLM component leaves accuracy
  unchanged, under small input perturbations, or where the questions may be
  contaminated by training data, so contamination-resistant live evaluation
  is needed to establish forecasting skill.
