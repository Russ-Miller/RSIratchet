id: llm-fact-checking-routes-between-answering-directly-retrieving-confidence-signal
ref: CLM-1182
capability: fact-verification
technique: route-retrieval-token-margin-certainty-plus-rationale-consistency
statement: >-
  For LLM fact-checking that routes between answering directly and
  retrieving, a confidence signal built from the log-probability margin
  between True/False verdict tokens combined with NLI-measured contradiction
  between rationales written under opposing assumptions is better calibrated
  and yields higher per-label F1 than the model's self-reported verbal
  confidence, across proprietary and open 7B models on SciFact, HoVer and
  FeLMWk.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three fact-checking benchmarks (SciFact, HoVer, FeLMWk); GPT-4o/4o-mini, Gemini-2.5, Mistral-7B-Instruct; requires access to token log-probabilities and an NLI model."
sources:
  - source: arxiv-2601-02574
    stance: supports
    note: >-
      Validated by: Expected Calibration Error against verbal confidence
      (e.g. SciFact 23.53 to 12.91 with Gemini-2.5-Pro; HoVer 39.37 to 20.76
      with GPT-4o-mini), and per-label F1 against Factool, FactCheck-GPT,
      SAFE and FIRE (HoVer False 0.66 to 0.76 with GPT-4o).. Measured on
      three benchmarks with five model families, against four LLM
      fact-checking baselines; gains are a few F1 points except one large
      jump on HoVer False and on GPT-3.5-turbo. [truncated]
contested: false
