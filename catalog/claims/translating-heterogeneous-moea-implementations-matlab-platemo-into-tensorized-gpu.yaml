    stance: supports
    note: >-
      Validated by: Convergence pass rate over 240 attempts per condition
      against one-shot translation with the same backend: 78.75% vs 26.67%
      (Gemini 3 Flash), 65.42% vs 27.08% (DeepSeek V4 Pro), 59.58% vs 16.67%
      (DeepSeek V4 Flash); coverage 48/48 MOEAs with at least one converged
      implementation vs 45/48 for the best one-shot condition; downstream
      fidelity 88.2% of 1,904 MOEA-problem comparisons passing the IGD
      tolerance criterion.. [truncated]
