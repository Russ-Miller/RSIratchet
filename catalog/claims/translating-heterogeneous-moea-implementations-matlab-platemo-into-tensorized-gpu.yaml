id: translating-heterogeneous-moea-implementations-matlab-platemo-into-tensorized-gpu
ref: CLM-0631
capability: multi-model-coordination
technique: shared-semantic-blueprint-parallel-restructuring-branches-repair-execution
statement: >-
  For translating heterogeneous MOEA implementations from MATLAB/PlatEMO
  into tensorized GPU code, a multi-agent pipeline that reconstructs source
  semantics into a shared blueprint, generates several strategy-biased
  candidates in parallel, and repairs them from execution feedback converges
  more often than one-shot translation with the same LLM backend, on all
  three backends tested.
kind: observation
backing_strength: single-paper
observed_on:
  era: "48 PlatEMO MOEAs, 240 conversion attempts per condition, convergence defined as running within 60s and reaching IGD below 0.25 on DTLZ2; the multi-agent condition spends six candid"
