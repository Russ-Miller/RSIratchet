notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Running the same
  unmodified agent loop and prompt with privileged state and Cartesian
  control on these benchmarks and getting success rates near the
  low-level-manipulation figures reported for single-pass MLLM control
  (~30%), or showing the reported successes come from exploiting simulator
  internals rather than legitimate manipulation programs.
