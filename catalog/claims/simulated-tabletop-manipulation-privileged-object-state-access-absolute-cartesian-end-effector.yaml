id: simulated-tabletop-manipulation-privileged-object-state-access-absolute-cartesian-end-effector
ref: CLM-1068
capability: embodied-control
technique: let-coding-agent-loop-synthesize-robot-scripts-trial
statement: >-
  For simulated tabletop manipulation with privileged object-state access
  and absolute Cartesian end-effector control, an unmodified
  software-engineering agent loop (reason, write a script, execute, inspect
  result, revise) can discover task programs with no demonstrations or
  fine-tuning, reaching 84.9% on LIBERO, 85.7% on ManiSkill3 and 96% on
  MetaWorld, but failing near-totally on sub-centimeter insertion tasks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One agent SDK (Claude Agent SDK) and one model (Claude Opus 4.5); simulation only; ground-truth state observations rather than RGB; shared absolute end-effector position control ac"
sources:
  - source: arxiv-2601-20334
    stance: supports
    note: >-
      Validated by: Success rate over 120 LIBERO tasks, 14 ManiSkill3 tasks
      x 5 seeds, and 50 MetaWorld tasks, against published VLA baselines
      trained with ~100 demonstrations (SmolVLA, pi0, OpenVLA, Diffusion
      Policy); traces post-hoc screened by an automated reviewer for
      hardcoded coordinates or brute-force search, with two MetaWorld
      successes excluded.. Measured across three benchmarks and 419 task
      executions, but with one SDK and one model, no seed-level variance for
      LIBERO/MetaWorld, and privileged state rather than pixels. [truncated]
