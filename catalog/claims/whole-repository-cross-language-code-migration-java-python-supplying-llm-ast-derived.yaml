statement: >-
  In whole-repository cross-language code migration (Java to Python),
  supplying an LLM with AST-derived dependency-graph context and translating
  parent classes before children lowers the rate of calls to nonexistent
  APIs relative to vector-similarity retrieval of text chunks, while lexical
  similarity metrics such as CodeBLEU show no difference between the two.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "One repository (spring-petclinic-genai), Gemini 2.5 Pro at temperature 0; gains concentrated in highly coupled files (controllers, tests) and absent for self-contained POJOs whose "
sources:
  - source: arxiv-2609-12464
    stance: supports
    note: >-
      Measured on one repository with one model and one baseline
      configuration; hallucination is scored by a custom global symbol-table
      lookup, not by running the code, and the scoring rule was itself
      changed to accommodate cross-file calls, which could favour the graph
      arm. Complexity and docstring regressions are reported but their
      causes (over-engineering, attention dilution) are asserted, not
      tested.
