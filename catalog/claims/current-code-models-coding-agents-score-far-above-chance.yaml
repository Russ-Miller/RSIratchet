notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model set whose
  natural-language secure-coding scores sit at or below its joint
  functional-security pass rate, or where the measured gap is no larger at
  application scale than at function scale.
