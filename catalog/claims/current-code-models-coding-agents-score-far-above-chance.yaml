id: current-code-models-coding-agents-score-far-above-chance
ref: CLM-0583
capability: secure-coding
technique: measure-secure-coding-knowledge-code-actuation-separately
statement: >-
  Current code models and coding agents score far above chance on
  natural-language questions about secure coding principles (lowest mean
  86.2%, OWASP items 93-97%) while generating code that is both functional
  and exploit-resistant far less often, and the gap is larger for whole web
  applications (72.9 points) than for isolated functions (47.9), because
  application-scale security also depends on project construction rather
  than on naming the right practice.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Four systems (Qwen2.5-14B-Instruct, SafeCoder, PurpCodeRL, GPT-5.1-Codex-Mini) plus eight more base models for the correlation analysis, evaluated on an LLM-generated OWASP/CERT NL"
sources:
  - source: arxiv-2606-25195
    stance: supports
    note: >-
      Validated by: Layer-1 scores correlate with CWEval secure-pass@1
      across 10 base models (Spearman 0.71, p=0.025; BaxBench 0.63,
      p=0.056); actuation below knowledge in all 18 slices (Wilcoxon
      p<.001); compliance-vs-security crossing yields 1,100 secure-only vs
      287 compliant-only cases (p<.001). Both LLM-assisted artifacts
      validated on stratified 100-item samples.. Measured on two executable
      benchmarks (119 CWEval tasks, 392 BaxBench tasks) with a
      6,382-question LLM-generated, LLM-verified knowledge benchmark;
      [truncated]
contested: false
