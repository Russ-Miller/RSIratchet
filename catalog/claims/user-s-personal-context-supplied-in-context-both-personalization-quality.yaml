id: user-s-personal-context-supplied-in-context-both-personalization-quality
ref: CLM-1197
capability: long-term-memory
statement: >-
  When a user's personal context is supplied in-context, both
  personalization quality and resistance to leaking private details degrade
  as that context grows from 1K to 256K tokens, across current frontier
  LLMs.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Benchmark of ~29,000 instances / 377K questions with context lengths 1K-256K, jointly scoring personalization and privacy; evaluated on state-of-the-art LLMs."
sources:
  - source: arxiv-2602-15028
    stance: supports
    note: >-
      Measured on a purpose-built benchmark spanning a wide length range
      with many questions; the paper reports consistent degradation across
      models and argues a theoretical attention-dilution mechanism, but the
      numbers and per-model spread are not given in the abstract, and the
      design does not separate dilution from distractor content added with
      length.
contested: false
status: pending-review
last_checked_at: 2026-11-20
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  personalization accuracy and privacy-leakage rate stay flat or improve as
  the same user profile is padded from 1K to 256K tokens. Drafted stance
  toward holding-task-fixed-only-lengthening-input-degrades-reasoning:
  supports -- Lengthening the user context degrades task quality here too,
  with the paper attributing it to attention dilution in fixed-capacity soft
  attention.
