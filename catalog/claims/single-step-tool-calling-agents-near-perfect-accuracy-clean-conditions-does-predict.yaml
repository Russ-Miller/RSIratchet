id: single-step-tool-calling-agents-near-perfect-accuracy-clean-conditions-does-predict
ref: CLM-0485
capability: tool-use
technique: diagnose-tool-call-failures-pipeline-stage-cascade-backtracking
statement: >-
  For single-step tool-calling agents, near-perfect accuracy in clean
  conditions does not predict robustness under stage-aligned perturbations,
  and the weakest stage is interpreting returned tool output: across 7
  models, perturbing tool names and descriptions costs little while
  corrupting or removing returned evidence drops success below 0.60 for
  every model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-step tool calls over 16 deterministic local tools; four perturbation families at light/medium/heavy severity; no long-horizon or multi-turn dependencies."
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage recovered
      71/98 failed instances; human audit on 30 ambiguous cases agreed
      74.2%; labels predicted that S1 alias clarification fixed A-family
      failures (21/30 to 30/30) while S3 chain-of-thought did not help
      B-family (21/30 unchanged).. 15,456 single-family records, 7
      commercial models, 14 subtypes; clean mean 0.979 vs overall robustness
      0.664-0.766, family C mean 0.455. Local deterministic tools, so
      absolute rates may not transfer to live APIs; [truncated]
contested: false
