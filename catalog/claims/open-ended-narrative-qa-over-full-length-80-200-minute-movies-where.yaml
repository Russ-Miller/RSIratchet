notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A controlled run on the
  same benchmark showing per-model scores fall monotonically as evidence
  separation grows from short to far, or showing that short-distance
  questions are solved at a much higher rate than far ones by the same 7B
  models.
