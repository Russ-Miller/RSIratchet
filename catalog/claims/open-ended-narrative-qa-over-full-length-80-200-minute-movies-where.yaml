id: open-ended-narrative-qa-over-full-length-80-200-minute-movies-where
ref: CLM-1236
capability: video-temporal-reasoning
technique: group-clips-into-narrative-memory-slots-then-retrieve
statement: >-
  On open-ended narrative QA over full-length (80-200 minute) movies where
  each question is grounded in multiple scattered evidence spans, 7B-class
  video MLLMs score low and roughly flat across short-, medium- and
  far-separated evidence (around 26-35 on a judged 4-dimension scale), so
  difficulty here tracks finding and integrating dispersed evidence rather
  than the temporal distance between the pieces.
kind: observation
backing_strength: single-paper
observed_on:
  era: "88 LSMDC movies, 4,442 generative QA pairs with ~3.9 evidence spans each, scored by an LLM judge on comprehensiveness, depth, evidence grounding and reasoning; 7B open video models"
sources:
  - source: arxiv-2603-19481
    stance: supports
    note: >-
      Validated by: Judged four-dimension scores on NA-VQA against zero-shot
      and fine-tuned Qwen2.5-VL-7B and long-form VLM baselines; full model
      35.74 average vs 33.79 fine-tuned Qwen2.5-VL, with ablation removing
      narrative grouping costing most on far-distance evidence grounding
      (35.10 to 32.70).. Measured across ~11 open video models plus three
      description-fed LLMs on one benchmark the authors built; [truncated]
contested: false
status: pending-review
