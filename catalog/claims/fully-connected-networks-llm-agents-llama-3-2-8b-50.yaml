id: fully-connected-networks-llm-agents-llama-3-2-8b-50
ref: CLM-0388
capability: multi-model-coordination
statement: >-
  In fully connected networks of LLM agents (Llama 3.2-8B, 50 agents, 10
  rounds) where a fixed minority holds an unchanging extreme stance, neutral
  agents' textual justifications converge on the biased agents' vocabulary
  faster and more completely than their numeric stances do, so monitoring
  only the text overstates how much the group actually agrees.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One model (Llama 3.2-8B via LangChain), four policy topics, one-sided bias anchored at +2, bounded one-step opinion updates, alignment measured by SBERT cosine similarity at the fi"
sources:
  - source: arxiv-2609-18306
    stance: supports
    note: >-
      Measured: 24 (topic, bias-level) alignment cells over 15 runs each,
      plus mean opinion shift and distance-to-anchor against a matched
      Friedkin-Johnsen baseline. Alignment taken only at the final round, so
      it shows a magnitude gap, not temporal precedence; single model,
      single prompt template, no prompt ablations; a nonzero drift at zero
      biased agents indicates a model-level prior the design does not
      separate from the minority effect.
contested: false
