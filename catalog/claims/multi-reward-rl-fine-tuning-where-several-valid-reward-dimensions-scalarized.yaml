      dynamic-weighting rules on math (MATH-500/AMC/AIME), citation-grounded
      QA (ASQA/ELI5) and HelpSteer2 alignment; on Qwen3-4B math, average
      accuracy rose 37.53 to 60.72 under GRPO, with format/length scores
      falling, and ablations show removing any of the three signals or using
      additive rather than multiplicative combination lowers accuracy..
