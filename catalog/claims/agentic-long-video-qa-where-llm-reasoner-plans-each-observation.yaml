id: agentic-long-video-qa-where-llm-reasoner-plans-each-observation
ref: CLM-0916
capability: video-temporal-reasoning
technique: let-reasoner-choose-temporal-scope-sampling-density-each
statement: >-
  For agentic long-video QA where an LLM reasoner plans each observation's
  temporal scope and sampling density, the gain depends on the reasoner
  being stronger than the observer's own innate reasoning: a strong
  proprietary reasoner lifts weak and strong vision backbones alike (+3.6 to
  +6.9 on Video-MME long), while an open-weight reasoner lifts only weak
  observers (+4.3 on Qwen2.5-VL-7B) and leaves strong ones flat or worse
  (+0.1 on GPT-4.1, -0.6 on Qwen2.5-VL-72B).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Long-video multiple-choice QA benchmarks; frozen models, no fine-tuning; up to 20 tool calls with fixed per-call frame budgets."
