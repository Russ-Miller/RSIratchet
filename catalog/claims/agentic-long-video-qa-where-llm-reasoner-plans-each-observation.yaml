    stance: supports
    note: >-
      Validated by: Accuracy on LVBench, LongVideoBench long, Video-MME
      long, EgoSchema, MMVU, Video-MMMU against single-pass 256-frame
      baselines and prior video agents; component ablation on Video-MME long
      (removing Scan Search -4.6, Stitch Verify -3.2, Segment Focus -1.9,
      anchors and memory ~0.3-0.6 each); token cost compared with
      caption-indexing agents.. Measured on one benchmark split (Video-MME
      long) for the reasoner-swap table, with four observers and two
