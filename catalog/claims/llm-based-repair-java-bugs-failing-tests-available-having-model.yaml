id: llm-based-repair-java-bugs-failing-tests-available-having-model
ref: CLM-1016
capability: debugging
technique: repair-behavior-specification-then-regenerate-code
statement: >-
  For LLM-based repair of Java bugs with failing tests available, having the
  model first translate the buggy function into a structured
  natural-language behavior specification, repair that specification against
  failing-test feedback, and then regenerate code from it fixes more bugs
  than code-centric patch generation with the same backbone, at a far
  smaller candidate-patch budget.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Java bugs with perfect fault localization and failing tests (Defects4J v1.2/v2.0, RWB); GPT-4o, GPT-4, GPT-3.5, DeepSeek-Coder backbones; max 15 candidate patches per bug."
sources:
  - source: arxiv-2602-08263
    stance: supports
    note: >-
      Validated by: Correct and plausible patch counts on Defects4J v1.2
      (174 correct vs 146 for ReinFix-GPT4o) and v2.0 (178 vs 145), with 41
      unique fixes on each, under a 5x3 patch budget versus hundreds to
      thousands for baselines; generalization checked on post-cutoff RWB
      sets across three other LLMs.. Measured on two Defects4J versions plus
      two small (27-bug) RWB sets, against baseline numbers reused from
      prior papers rather than re-run, so backbone and harness differences
      are only partly controlled. Correctness is judged by manual
      inspection. [truncated]
contested: false
