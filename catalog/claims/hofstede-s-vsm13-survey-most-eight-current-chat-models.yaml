id: hofstede-s-vsm13-survey-most-eight-current-chat-models
ref: CLM-0305
capability: cultural-competence
technique: cultural-prompting-via-country-naming-system-prompt
statement: >-
  On Hofstede's VSM13 survey, most of eight current chat models answer
  closest to the United States when no culture is specified; a system prompt
  naming a target country moves seven of the eight toward that country's
  profile, with the largest gains for the countries furthest away at
  baseline (Japan and China, roughly 17-19% closer), yet those two remain
  the hardest to match even for the DeepSeek models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "DeepSeek-V3/V3.1, GPT-5, GPT-4.1, GPT-4, Claude Opus 4, Llama 3.1, Mistral Large, late 2025; six target countries; distance on Hofstede dimensions."
sources:
  - source: arxiv-2512-12488
    stance: supports
    note: >-
      Validated by: Hofstede-dimension distance before and after prompting
      for six countries across eight models; seven of eight moved closer,
      gains 11-22% by country, Japan and China least matched.. One survey
      instrument and self-report style questions; Hofstede dimensions are
      contested as a measure of culture, so this measures alignment to a
      questionnaire profile rather than behaviour.
