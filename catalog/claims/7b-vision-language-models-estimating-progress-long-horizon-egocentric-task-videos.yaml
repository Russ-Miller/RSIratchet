id: 7b-vision-language-models-estimating-progress-long-horizon-egocentric-task-videos
ref: CLM-1043
capability: video-temporal-reasoning
technique: carry-updated-chain-of-thought-across-video-snippets
statement: >-
  For 7B vision-language models estimating progress on long-horizon
  egocentric task videos, feeding only the latest short video snippet
  together with a carried-forward chain-of-thought that records task
  decomposition and per-step completion gives lower progress error than
  feeding the full video so far, and the gap widens as the video gets longer
  while inference time stays flat rather than growing linearly.
