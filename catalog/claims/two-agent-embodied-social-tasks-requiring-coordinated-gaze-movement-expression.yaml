id: two-agent-embodied-social-tasks-requiring-coordinated-gaze-movement-expression
ref: CLM-0613
capability: embodied-control
technique: imitate-belief-module-demonstrations-action-level
statement: >-
  In two-agent embodied social tasks requiring coordinated gaze, movement
  and expression, fine-tuning open VLMs (8B-14B InternVL) by timestep-level
  action imitation on demonstrations from an architecture with an explicit
  belief module shifts trial outcome scores up or down depending on
  condition but does not make the student's nonverbal signals more
  directionally coherent, because cross-channel communicative coordination
  is a trial-level property that per-timestep supervision does not encode.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Open-source VLMs up to 15B in a single two-box guide-or-mislead scenario, 200 trials per model; no human baseline, no RL comparison."
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Validated by: Compared fine-tuned InternVL-8B/14B against their base
      models on ToM Outcome Conformance Score and on trajectory, gaze,
      expressivity and signal-sensitivity metrics across four conditions;
      cooperative outcomes declined, 14B trajectory alignment turned
      negative, signal sensitivity stayed negative throughout.. Measured on
      two fine-tuned InternVL variants against their own base models in one
      scenario; the attribution to timestep-level supervision is argued
      rather than isolated against a trial-level-reward arm, which the paper
      leaves unrun.
