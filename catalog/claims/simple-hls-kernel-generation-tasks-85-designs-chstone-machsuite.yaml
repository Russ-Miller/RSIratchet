id: simple-hls-kernel-generation-tasks-85-designs-chstone-machsuite
ref: CLM-0402
capability: code-generation
statement: >-
  On simple HLS kernel generation tasks (85 designs from CHStone, MachSuite,
  Polybench, Rosetta, C2HLSC), giving a modest open-source model
  (gpt-oss-120b) a shell with a C++ compiler for self-verification and
  iterative refinement saturates the benchmark at pass@10 (100% through
  synthesis) and exceeds 90% at pass@1, so this class of task no longer
  separates models; repeated sampling helps the weaker model far more (+60
  points synthesis pass rate at k=10 for gpt-oss-20b vs +11 for the 120b).
kind: observation
