ref: CLM-0669
capability: multi-model-coordination
technique: arbitrate-conflicting-evidence-streams-relevance-gated-fusion
statement: >-
  On multimodal cultural-interpretation multiple-choice questions, pipelines
  that pool several same-backbone evidence streams (perception, retrieval,
  web verification) and weight them by scored relevance beat majority
  voting, self-consistency and agent debate mainly on the items where the
  streams disagree, and the margin shrinks sharply as the backbone gets
  stronger.
