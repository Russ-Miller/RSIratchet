id: evolving-agent-harness-2-000-executable-tasks-disjoint-evaluation
ref: CLM-0331
capability: harness-self-improvement
technique: contrastive-module-scoped-harness-evolution-benchmark-disjoint-tasks
statement: >-
  Evolving an agent harness on 2,000 executable tasks disjoint from the
  evaluation benchmarks, by contrasting successful and failed trajectories
  on the same task to find recurring deficiencies and evolving five harness
  modules (agent loop, tool use, observation management, context management,
  completion detection) separately before integrating them, raised
  DeepSeek-V4-Flash from 47.6 to 52.4 on TerminalBench 2.0 and 73.4 to 76.5
  on SWE-Bench Verified, transferred across domains and to other backbones
  frozen (GLM-5.2 59.6 to 61.8, MiniMax-2.5 41.6 to 44.9), while evolving
  the whole harness at once or without modules fell below the unevolved
  baseline (46.4 and 44.2).
kind: observation
backing_strength: single-paper
observed_on:
  era: "DeepSeek-V4-Flash Preview as the evolving backbone, TerminalBench 2.0 and SWE-Bench Verified, 2026; evolution set curated from external sources disjoint from both benchmarks; trans"
sources:
  - source: arxiv-2609-14857
    stance: supports
    note: >-
      Validated by: Accuracy, Pass@3 and Pass-3 on TerminalBench 2.0 and
      SWE-Bench Verified for in-domain, cross-domain and cross-model
      transfer, plus an ablation comparing modular against non-modular and
      joint all-module evolution, where both non-modular variants scored
      below baseline. Developer-reported; one evolving backbone.. The
      ablation is the strong part: it shows the modular decomposition is
      load-bearing rather than incidental, and the benchmark-disjoint
      evolution set answers the contamination objection that hangs over
      SoL-Pi-style results. Gains are 3-5 points; [truncated]
