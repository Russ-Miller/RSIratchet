id: evolving-agent-harness-2-000-executable-tasks-disjoint-evaluation
ref: CLM-0331
capability: harness-self-improvement
technique: contrastive-module-scoped-harness-evolution-benchmark-disjoint-tasks
statement: >-
  Evolving an agent harness on 2,000 executable tasks disjoint from the
  evaluation benchmarks, by contrasting successful and failed trajectories
  on the same task to find recurring deficiencies and evolving five harness
  modules (agent loop, tool use, observation management, context management,
  completion detection) separately before integrating them, raised
  DeepSeek-V4-Flash from 47.6 to 52.4 on TerminalBench 2.0 and 73.4 to 76.5
  on SWE-Bench Verified, transferred across domains and to other backbones
  frozen (GLM-5.2 59.6 to 61.8, MiniMax-2.5 41.6 to 44.9), while evolving
  the whole harness at once or without modules fell below the unevolved
  baseline (46.4 and 44.2).
kind: observation
backing_strength: single-paper
observed_on:
  era: "DeepSeek-V4-Flash Preview as the evolving backbone, TerminalBench 2.0 and SWE-Bench Verified, 2026; evolution set curated from external sources disjoint from both benchmarks; trans"
sources:
  - source: arxiv-2609-14857
    stance: supports
    note: >-
      Validated by: Accuracy, Pass@3 and Pass-3 on TerminalBench 2.0 and
      SWE-Bench Verified for in-domain, cross-domain and cross-model
      transfer, plus an ablation comparing modular against non-modular and
      joint all-module evolution, where both non-modular variants scored
      below baseline. Developer-reported; one evolving backbone.. The
      ablation is the strong part: it shows the modular decomposition is
      load-bearing rather than incidental, and the benchmark-disjoint
      evolution set answers the contamination objection that hangs over
      SoL-Pi-style results. Gains are 3-5 points; [truncated]
  - source: dair-2026-modularrsi-three-defects
    stance: supports
    note: >-
      Secondary summary naming the three defects and fixes; its reply
      thread is where the four ratchet tests above were raised. Filed for
      provenance of the falsifier, not as independent evidence.
contested: false
status: pending-review
last_checked_at: 2026-09-21
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Replication where
  whole-harness evolution matches modular evolution given equal evolution
  budget, or where the evolved harness fails to transfer to a backbone from
  a different family than those tested. Added 2026-09-21 after the DAIR.AI
  thread: an ablation in which the improver can versus cannot modify the
  evaluator it is judged by (its own tests, trace-reading prompts, or
  deficiency labels); if the gains shrink when that door is closed, the
  loop was fitting its judge. Four tests for a real ratchet raised in that
  thread, of which the paper meets three: (1) freeze the harness before
  evaluation, met by the frozen cross-model transfer; (2) forbid the
  improver from editing its own tests or notes, not addressed, the
  deficiency-finding step is itself a model reading traces with no stated
  separation from the evaluator; (3) require observability of failed
  paths, met by the contrastive success/failure traces; (4) promote only
  changes that survive a new session or disjoint task set, met by the
  benchmark-disjoint evolution set.
