    stance: supports
    note: >-
      Validated by: Accuracy on Video-MME, LongVideoBench, MLVU, LVBench
      against uniform sampling and AKS, BOLT, MDP3, FOCUS; best in most of
      12 model-benchmark cells; matched-scorer controls (CLIP, SigLIP) show
      +3.5 and +3.8 average points over BOLT and MDP3; component ablations
      each cost 0.6-1.6 points.. Measured on four benchmarks, three
      backbones, budgets 8-64, four LVLM scales, five scorers. Main table is
