id: long-video-qa-under-fixed-32-frame-budget-7b-8b-multimodal-backbones
ref: CLM-0616
capability: video-temporal-reasoning
technique: select-frames-shape-relevance-curve-height
statement: >-
  For long-video QA under a fixed 32-frame budget with 7B-8B multimodal
  backbones, selecting frames from the structural shape of the frame-query
  similarity curve (peak, rising, falling, transition regions) beats ranking
  frames by similarity magnitude, and the margin grows with video length — a
  few points on short clips and roughly 8 points on hour-long videos — while
  on short/medium-clip benchmarks it is near-indistinguishable from other
  selectors.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Training-free post-processing over precomputed frame-query scores; four long-video QA benchmarks, three backbones (Qwen2.5-VL-7B, InternVL-3-8B, LLaVA-OV-7B), budget 8-64 frames."
sources:
