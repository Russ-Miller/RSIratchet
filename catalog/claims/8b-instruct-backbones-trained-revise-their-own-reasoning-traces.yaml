id: 8b-instruct-backbones-trained-revise-their-own-reasoning-traces
ref: CLM-0351
capability: self-repair
technique: correct-reasoning-typed-executable-error-operator-edits
statement: >-
  For 8B instruct backbones trained to revise their own reasoning traces,
  supervising correction as a typed, executable edit (error type, step
  location, corrupted and repaired proposition) applied iteratively beats
  free-form revise-the-whole-answer correction methods such as Self-Refine,
  RISE and SCoRe, and both halves of the supervision are needed: predicting
  only the error operator or only the repaired adjacent state each scores
  below the joint objective.
