    stance: supports
    note: >-
      Validated by: Average over six in-domain benchmarks 67.5 vs 64.3 for
      the strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe,
      with five seeds and Holm correction; cross-dataset transfer averages
      76.4 (Llama-3, base 67.7) and 80.2 (Qwen3, base 72.9); ablations show
      operator-only and adjacent-state-only variants losing several points
      on GSM8K, MATH, CSQA and BBH.. Measured on 13 tasks across two 8B
      backbones against learn-to-solve and learn-to-correct baselines, five
      seeds, with ablations isolating noise sources and the two loss terms.
