id: tool-call-authorization-agent-frameworks-llm-prompted-judge-comparing-proposed
ref: CLM-1297
capability: prompt-injection
technique: judge-each-tool-call-against-original-task-intent
statement: >-
  For tool-call authorization in agent frameworks, an LLM prompted as a
  judge comparing the proposed tool call against the original task
  description intercepts over 90% of prompt-injection and
  RAG-poisoning-induced malicious calls, while zero-shot NLI entailment
  classifiers on the same pairs intercept under 10%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Measured on a 1,081-sample synthetic bilingual benchmark generated by GPT-4o-mini, with a black-box non-adaptive attacker; hand-crafted evasion prompts (authority injection, double"
sources:
  - source: arxiv-2603-07191
    stance: supports
    note: >-
      Validated by: Interception rate and false-positive rate on 457
      malicious plus 464 benign tool calls per language, against an
      unverified baseline (0% IR) and two NLI baselines (BART-MNLI 8-10% IR,
      mDeBERTa ~0%); generalization checked on InjecAgent (99-100%
      interception).. Measured across five LLM judges (3.4GB local to cloud
      GPT-4o-mini) on a benchmark the authors generated with GPT-4o-mini,
      which is also one of the judges; circularity is partly bounded by an
      independent Qwen judge scoring equal or higher. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An evaluation on
  independently authored (non-LLM-generated) injection samples where a
  prompted LLM judge's interception falls near the NLI baselines, or where a
  tuned NLI classifier reaches comparable interception at comparable
  false-positive rate. Drafted stance toward
  long-trusted-instructions-untrusted-retrieved-content-occupy-same-model:
  supports -- The paper's own adversarial probe shows the semantic judge
  reduces but does not remove injection success, and it argues the residual
  threat classes need isolation at the sandbox and authorization layers.
