    stance: supports
    note: >-
      Validated by: Mean absolute error and RMSE of target price versus
      analyst consensus on 200 companies, plus direction accuracy of
      Buy/Hold/Sell against consensus revision within 90 days: MAE 13.1%
      versus 16.2% for the analyst-input DCF spreadsheet, 18.7% for
      single-stage FinGPT, 24.3% for GPT-4 zero-shot.. [truncated]
