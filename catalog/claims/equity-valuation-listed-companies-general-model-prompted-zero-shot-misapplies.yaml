id: equity-valuation-listed-companies-general-model-prompted-zero-shot-misapplies
ref: CLM-0384
capability: domain-knowledge
technique: two-stage-domain-pre-training-then-institution-fine
statement: >-
  For equity valuation of listed companies, a general model prompted
  zero-shot misapplies valuation methods, and a model given large-scale
  financial-corpus pre-training followed by institution-specific fine-tuning
  produces target prices closer to analyst consensus than both zero-shot
  GPT-4 and a single-stage fine-tuned financial model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target price compared against independent analyst consensus; baselines GPT-4 zero-shot, FinGPT single-stage, analyst-input DCF spreadsheet"
