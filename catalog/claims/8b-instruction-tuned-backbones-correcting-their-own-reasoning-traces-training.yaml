    stance: supports
    note: >-
      Validated by: Six in-domain benchmarks: average 67.5 vs 64.3 for the
      strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe, five
      seeds, significant after Holm correction; seven transfer targets
      improve base average from 67.7 to 76.4 (Llama-3) and 72.9 to 80.2
      (Qwen3); ablations drop 2-7 points when a noise source or loss term is
      removed.. Measured on 13 datasets, two 8B backbones, five seeds, with
      baselines run under matched prompts and extractors; [truncated]
