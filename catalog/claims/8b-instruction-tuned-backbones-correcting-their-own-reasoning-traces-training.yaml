id: 8b-instruction-tuned-backbones-correcting-their-own-reasoning-traces-training
ref: CLM-0351
capability: self-repair
technique: correct-reasoning-inverting-typed-error-operators
statement: >-
  For 8B instruction-tuned backbones correcting their own reasoning traces,
  training a LoRA corrector to name a typed error operator (error type, step
  location, corrupted and repaired proposition) and then execute its inverse
  edit outperforms free-form self-revision baselines (Self-Refine, RISE,
  SCoRe) on math, code and commonsense benchmarks, and ablations show the
  typed-operator and adjacent-state objectives are each needed.
