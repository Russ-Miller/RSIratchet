id: multi-turn-tool-calling-agents-retrieving-past-experience-inference-concrete-instance-level
ref: CLM-0697
capability: tool-use
technique: retrieve-past-trajectories-abstracted-intent-scripts
statement: >-
  For multi-turn tool-calling agents retrieving past experience at
  inference, concrete instance-level knowledge (ground-truth execution
  trajectories, or short summaries of them) raises tool-call accuracy more
  than abstracted intent-level knowledge (clustered intent scripts or
  textual strategy descriptions), because intent-level retrieval requires
  the model to first infer the intent correctly and adds an error step, and
  stacking all knowledge types together does not beat the best single type.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen3-8B and Qwen3-32B on BFCL-V3 multi-turn scenarios (Base, Miss Func, Miss Param, Long Context) with a small knowledge base built from a 100-sample training split and top-k embe"
sources:
  - source: arxiv-2606-10875
    stance: supports
    note: >-
      Validated by: Compared four knowledge forms (scenario trajectory,
      experience summary, script-style intent clustering, textual-style
      intent clustering, and all combined) on BFCL-V3 accuracy with
      Qwen3-8B/32B; instance-level forms gave the largest gains, the two
      instance forms were comparable to each other, and the 'All'
      combination did not add further gain.. Measured on one benchmark
      family (BFCL-V3) with two models of one family, a small knowledge base
      built from 100 training samples; the paper's own limitations note that
      knowledge-base scaling is untested. [truncated]
