id: image-aesthetics-models-fine-tuned-critique-scoring-competence-producing-reference-aligned-aesthetic
ref: CLM-0394
capability: critique
statement: >-
  For image-aesthetics models fine-tuned for critique and scoring,
  competence at producing reference-aligned aesthetic critique does not
  carry over to judging whether an image suits a stated purpose, audience or
  cultural setting: all four aesthetic specialists tested scored below 30%
  accuracy on 301 expert-curated suitability cases (best 29.57%) versus
  91.69% for the strongest general-purpose model, and they predicted
  'suitable' in 59-77% of binary cases against a gold rate of 38.14%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-image closed-form suitability questions, no retrieval or tools, 448x448 inputs for locally run models; specialists are ArtQuant-APDD, ArtiMuse, Q-SiT, AesExpert."
sources:
  - source: arxiv-2608-26713
    stance: supports
    note: >-
      Measured on 301 expert-reviewed cases (291 binary, 10 three-way) with
      exact-match accuracy, plus a 100-case human grounding audit (ArtiMuse
      21% accuracy to 3% evidence-grounded) and a 36-pair counterfactual
      audit where specialists showed weaker directional updating. Unparsable
      responses counted incorrect, which may penalize weak
      instruction-followers; base-vs-specialist comparison isolates tuning
      effect for only two of four models.
contested: false
status: pending-review
last_checked_at: 2026-09-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An
  aesthetics-specialized model that matches its base or a frontier general
  model on contextual-suitability accuracy without over-accepting, or
  evidence that the specialists' low scores come from answer-format parsing
  rather than judgment.
