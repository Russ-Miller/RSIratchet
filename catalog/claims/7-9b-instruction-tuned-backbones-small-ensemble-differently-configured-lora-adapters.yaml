    stance: supports
    note: >-
      Validated by: AUROC for detecting the model's own errors and corrupted
      inputs, accuracy at 80% coverage, ECE/NLL, gold-in-set rate, and
      commit rate on clean vs corrupted context, against standard LLM
      entropy, mean-pooled LoRA ensemble, Bayesian/Laplace-LoRA, and
      semantic entropy, on three backbones and five datasets.. Measured on 3
      backbones (Gemma-2-9B, Llama-3.1-8B, Qwen2.5-7B) and 5 datasets
      against six baseline families with their standard budgets; baselines
