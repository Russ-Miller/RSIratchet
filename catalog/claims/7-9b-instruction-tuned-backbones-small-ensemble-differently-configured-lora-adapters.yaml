id: 7-9b-instruction-tuned-backbones-small-ensemble-differently-configured-lora-adapters
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: commit-only-adapter-probability-intervals-do-overlap
statement: >-
  For 7-9B instruction-tuned backbones with a small ensemble of differently
  configured LoRA adapters, deciding to answer only when one candidate's
  minimum probability across adapters exceeds every rival's maximum yields
  threshold-free abstention whose commitment rate collapses when the
  supplied passage is corrupted (31-48% to 4-8% on CoQA), while mean-pooled
  entropy and single-model scores thresholded to the same clean coverage
  still answer more corrupted prompts.
kind: mechanism
backing_strength: single-paper
