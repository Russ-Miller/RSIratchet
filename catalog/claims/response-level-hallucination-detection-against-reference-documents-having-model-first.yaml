notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A run where SQL-grounded
  checking gives no precision gain over direct prediction on the same
  backbones and datasets, or where a backbone with low text-to-SQL exact
  match gains as much as a high-scoring one. Proposed technique, not
  catalogued: SQL-grounded hallucination checking.
