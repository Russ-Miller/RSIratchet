id: repository-oriented-long-horizon-conversations-30-70-turns-64k-256k-tokens-general-purpose-memory
ref: CLM-1243
capability: context-hygiene
technique: store-repository-file-paths-inside-each-conversational-memory
statement: >-
  In repository-oriented long-horizon conversations (30-70 turns, 64K-256K
  tokens), general-purpose memory systems built for ordinary chat (MemGPT,
  LD-Agent, Mem0) score at or below a simple top-k retrieval over
  conversation history on downstream function generation, and attaching
  repository file/function locations to each stored memory so retrieval can
  fetch the linked code is what lifts the memory system above that retrieval
  baseline.
kind: observation
backing_strength: single-paper
observed_on:
  era: "128 LLM-generated conversations over 37 repositories, three backbones (GPT-5 mini, DeepSeek-V3.2, Qwen3-235B-A22B); conversations are synthetic, with mock user queries generated by"
sources:
  - source: arxiv-2603-06358
    stance: supports
    note: >-
      Validated by: Pass@1 on execution-tested function generation against
      Vanilla RAG, MemGPT, LD-Agent and unmodified Mem0, plus an Empty lower
      bound and an Oracle upper bound, on 128 samples across three
      backbones; beat the best baseline on five of six subset-by-backbone
      cells (e.g. multi-hop DeepSeek-V3.2 37.50 vs 26.88).. Measured Pass@1
      on 128 synthetic conversations with real repository test suites;
      Vanilla RAG beat all three memory systems in most cells, and Mem0R
      beat it in five of six. [truncated]
