observed_on:
  era: "Qwen3-8B reasoning model with Qwen2.5-VL captioning/QA tools, 3-level uniform clip tree with ~16s leaves, SFT on 33K GPT-5 trajectories then GRPO; evaluated on LVBench, MLVU, Video"
sources:
