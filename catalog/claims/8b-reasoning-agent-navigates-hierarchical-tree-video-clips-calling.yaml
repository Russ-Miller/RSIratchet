id: 8b-reasoning-agent-navigates-hierarchical-tree-video-clips-calling
ref: CLM-1031
capability: video-temporal-reasoning
technique: reward-time-intervals-agent-chooses-visit
statement: >-
  For an 8B reasoning agent that navigates a hierarchical tree of video
  clips by calling captioning and QA tools, adding an F1-style reward on the
  time intervals it visits during RL raises accuracy most on
  key-information-retrieval and temporal-grounding questions in hour-scale
  video, while the whole approach loses its edge on benchmarks dominated by
  short clips or whole-video gist questions, where uniform frame sampling is
  competitive.
kind: observation
