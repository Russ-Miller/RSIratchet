    stance: supports
    note: >-
      Validated by: Ablation against the SFT checkpoint and against RL
      without the location reward: LVBench overall 41.6 (SFT) / 45.8 (RL, no
      location reward) / 50.0 (full), with KIR 48.5/49.1/56.4 and TG
      50.9/53.2/56.4; average 10.5 tool rounds versus Ego-R1's ~86 caption
      segments at comparable Video-MME accuracy.. Measured on three
      long-video QA benchmarks with reward and SFT-size ablations on
      LVBench. [truncated]
