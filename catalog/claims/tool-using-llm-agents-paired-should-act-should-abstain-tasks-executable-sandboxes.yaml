  accuracy rises mainly because higher act accuracy carries abstain accuracy
  with it, or a positive per-pair correlation between act-pass and
  abstain-pass across a comparable model set, would show the two
  capabilities are not independent. Drafted stance toward
  selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical:
  supports -- Extends the finding that self-knowledge lags capability from
  text QA to tool-using agents, showing scale and task-solving skill do not
  deliver calibrated restraint.
