id: tool-using-llm-agents-paired-should-act-should-abstain-tasks-executable-sandboxes
ref: CLM-0682
capability: abstention-and-self-knowledge
technique: pair-every-should-act-task-minimally-perturbed-should
statement: >-
  For tool-using LLM agents on paired should-act/should-abstain tasks in
  executable sandboxes, the ability to withhold a critical action is largely
  independent of task-solving ability: across 17 frontier models mean act
  accuracy (80.6%) exceeds abstain accuracy (59.1%) by about 21 points,
  per-pair act-pass and abstain-pass outcomes correlate slightly negatively
  (mean phi -0.10, 15 of 17 negative), and the best agent reaches only 59.5%
  paired accuracy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "17 frontier models in 4 agent harnesses, 263 paired tasks across 42 auto-generated MCP sandbox environments, one run per task; abstention defined as explicit refusal or clarificati"
sources:
  - source: arxiv-2607-10059
    stance: supports
    note: >-
      Validated by: By construction no always-act or always-refuse policy
      can exceed 50% paired accuracy; three independent annotators rated
      94-98% of a stratified 100-pair sample as well-designed; the
      two-signal combination blocked 98 of 115 post-hoc abstention cases
      that a judge or commit check alone would have passed.. Measured over
      17 models x 263 pairs, one run per task, with auto-generated
      environments validated by DAG replay, cross-family LLM critics and
      human spot-checks; [truncated]
