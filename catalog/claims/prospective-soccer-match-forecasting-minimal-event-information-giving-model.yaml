id: prospective-soccer-match-forecasting-minimal-event-information-giving-model
ref: CLM-0695
capability: forecasting
technique: score-forecasts-prospectively-registered-unresolved-events
statement: >-
  For prospective soccer match forecasting with minimal event information,
  giving a model web search matters more than which frontier model is used:
  across seven 2026-era models forecasting all 104 matches of the 2026 FIFA
  World Cup, enabling search cut the mean Brier score by 0.023 (0.535 to
  0.512, Holm-adjusted p=0.045) while none of the 21 pairwise model
  comparisons survived correction, and the models' outcome probabilities
  were highly correlated (mean pairwise r 0.943) so ensembling them gained
  only 0.0047 Brier.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven frontier models (GPT-5.5, Claude Opus 4.8, Gemini 3.1 Pro, Grok 4.3, DeepSeek V4 Pro, Qwen 3.7 Max, Mistral Large 2512) forecasting 104 World Cup matches with prompts carryin"
sources:
  - source: arxiv-2607-24573
    stance: supports
    note: >-
      Validated by: Not measured as an intervention; the protocol is used to
      produce the reported Brier/log-loss comparisons, and forecast quality
      was additionally benchmarked against de-vigged closing bookmaker odds
      (Gemini 0.497 vs market 0.498).. Measured on a balanced factorial
      design: 8,736 match forecasts (7 models x 3 horizons x 2 access
      conditions x 2 prompting strategies) plus 420 tournament forecasts,
      with paired within-match permutation tests and Holm correction. One
      tournament only; [truncated]
