      regional surveys with four backbones, against zero-shot, role
      prompting, self-consistency, multi-agent debate, and ValuesRAG; plus
      ablations against a single-judge variant and a single
      value-inference-agent variant, and a K sweep over 1/3/5/10.. Measured,
      single paper, same authors' framework. Main table shows OG-MAR best
      average on all four backbones, but the isolating ablation (Table 2)
