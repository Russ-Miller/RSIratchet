id: regional-social-survey-value-prediction-benchmarks-across-four-llm-backbones-instantiating
ref: CLM-1126
capability: multi-model-coordination
technique: simulate-one-agent-per-retrieved-survey-respondent-then
statement: >-
  On regional social-survey value-prediction benchmarks across four LLM
  backbones, instantiating one agent per retrieved demographically-similar
  respondent profile and having a judgment agent adjudicate their answers
  raises accuracy over a single judge given the same retrieved profiles and
  ontology context, with gains largest for weaker open backbones (+0.04 to
  +0.07) and near zero for the strongest (+0.002).
kind: observation
backing_strength: single-paper
