id: 7-8b-open-models-doing-text-to-sql-bm25-retrieved-few-shot-exemplars-single
ref: CLM-0548
capability: formal-query-synthesis
technique: retrieve-several-sql-exemplars-never-exactly-one
statement: >-
  For 7-8B open models doing text-to-SQL with BM25-retrieved few-shot
  exemplars, a single retrieved exemplar is worse than no exemplar at all,
  because lexical similarity to the question does not imply similar SQL
  logic and the model copies the retrieved query's structure; accuracy peaks
  around three exemplars and falls again as more are added.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Llama-3.1-8B and Qwen2.5-7B class models on Spider and BIRD, exemplars retrieved by BM25 lexical similarity over question text; k swept from 0 upward."
sources:
  - source: arxiv-2606-15598
    stance: supports
    note: >-
      Validated by: Execution accuracy on Spider and BIRD swept over k; best
      at k=3, with k=1 below k=0, and a manual inspection of 100 k=1 cases
      finding roughly 70% had an exemplar lexically similar but with
      different SQL logic.. Measured as execution accuracy across k on two
      benchmarks with one base model, plus a 100-sample manual inspection
      attributing the k=1 drop to logic mismatch. The attribution rests on
      that inspection rather than on a controlled comparison against
      logic-matched exemplars, so the mechanism is argued more than
      isolated.
contested: false
