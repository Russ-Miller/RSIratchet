id: error-injected-into-supplied-chain-thought-models-mostly-carry
ref: CLM-0298
capability: multi-step-reasoning
statement: >-
  When an error is injected into a supplied chain of thought, models mostly
  carry it to the answer: a planted arithmetic error costs small models
  50-60% accuracy and 18% on average, though the largest models lose only
  3-7%; unit-conversion errors cost about 9% at every scale; skipped steps
  and sycophantic steps cost small models about 10%; extra correct steps
  cost almost nothing (0-6%).
kind: observation
backing_strength: single-paper
observed_on:
  era: "13 models over three orders of magnitude, mathematical reasoning tasks, five perturbation types injected into the chain, 2026."
sources:
  - source: arxiv-2603-03332
    stance: supports
    note: >-
      Perturbations are injected into a given chain rather than arising from
      the model's own reasoning; the scaling pattern by error type is the
      informative part.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Models that detect and
  correct injected math errors at small scale, or unit-conversion robustness
  improving with scale.
