id: judging-agent-trajectories-search-database-gui-environments-giving-judge
ref: CLM-1154
capability: critique
statement: >-
  When judging agent trajectories in search, database and GUI environments,
  giving the judge model tool access and a live replayed environment to
  gather evidence raises F1 agreement with annotated success/failure labels
  by roughly 13 points over the same model judging from the trajectory text
  alone, enough that a small model with environment access beats frontier
  models judging text-only.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "155 tasks and 516 binary-labelled trajectories across search, filesystem/Postgres, and PowerPoint/Word/Excel GUI tasks; tested on two backbones (gpt-5-mini-low, deepseek-v3.2); abs"
sources:
  - source: arxiv-2604-18240
    stance: supports
    note: >-
      Measured, two backbones only (budget-limited), against text-only
      variants of themselves and 13 other models; gains are far larger in
      GUI (+17 to +31) than in Postgres (+1.8), so the average understates
      the spread. No control isolating environment replay from extra
      inference compute, though the reasoning-effort ablation shows more
      thinking alone does not reproduce the gain.
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "let-verifier-execute-code-against-environment",
  which does not list this capability in addresses -- recorded, not
  asserted. Drafted confidence: medium. Falsifier as drafted: A matched
  comparison where the same backbone with environment and tool access scores
  no better than, or worse than, text-only judging on annotated agent
  trajectories across these domains. Drafted stance toward
  verifying-steps-data-analysis-agent-verifier-only-reads-step-text:
  supports -- Both find that a verifier restricted to reading the trajectory
  text misses errors that executing against the live environment exposes.
