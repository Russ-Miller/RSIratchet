id: llm-based-contextual-forecasting-combining-text-free-numerical-anchor-llm-event-grounded
ref: CLM-0848
capability: forecasting
technique: weight-llm-numerical-forecasts-backtest-error-covariance
statement: >-
  For LLM-based contextual forecasting, combining a text-free numerical
  anchor with LLM event-grounded forecasts helps in proportion to how
  uncorrelated their errors are: on weather and electricity series the LLM
  streams' signed errors correlate only ~0.31-0.51 with TSFM and anchor
  errors and synthesis cuts error sharply (Weather MAE -25% vs the strongest
  baseline), while on equity and commodity prices all forecasters' errors
  correlate ~0.78-0.88 and the gain shrinks to a few percent.
kind: mechanism
