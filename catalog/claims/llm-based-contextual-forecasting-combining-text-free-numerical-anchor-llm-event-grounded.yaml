    stance: supports
    note: >-
      Validated by: MAE/RMSE/MAPE on Leaf (weather, electricity, equities,
      commodities), wNMAE/wNRMSE on GIFT-CTX, MASE on GIFT-Eval, against
      supervised deep models, LLM-reprogramming models, six zero-shot TSFMs
      and same-backbone benchmark prompting; component ablation shows no
      single stream dominates and removing calibration raises error in every
      domain (Weather MAE +4.4%).. [truncated]
