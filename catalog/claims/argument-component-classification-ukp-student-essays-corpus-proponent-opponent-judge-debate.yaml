id: argument-component-classification-ukp-student-essays-corpus-proponent-opponent-judge-debate
ref: CLM-1050
capability: multi-model-coordination
technique: debate-two-most-probable-labels-then-judge
statement: >-
  For argument component classification on the UKP Student Essays corpus, a
  Proponent-Opponent-Judge debate that forces two agents to defend the two
  most probable labels beats vanilla and chain-of-thought prompting by a
  wide margin (78.5/79.2 to 85.7 Macro F1), but beats a single strong
  reasoning model given the same label definitions and judging rules by only
  0.8 points, so nearly all the gain comes from supplying the structural
  decision rules rather than from the debate.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three-class argument component classification (MajorClaim/Claim/Premise) on one 80-essay test split, Gemini 2.5 Flash debaters with a Gemini 2.5 Pro judge, two debate rounds, no tr"
sources:
  - source: arxiv-2603-27451
    stance: supports
    note: >-
      Validated by: Macro F1, weighted F1 and per-class F1 on the
      1,266-component UKP test split against vanilla prompting,
      chain-of-thought, and a single stronger reasoning model given the
      judge's own prompt; MAD-ACC 85.7 vs 84.9 for the single reasoning
      agent, 79.2 CoT, 78.5 vanilla, and 89.5 for a fine-tuned supervised
      reference.. Measured on one corpus, one test split, one model family,
      single run with no seeds or confidence intervals; [truncated]
