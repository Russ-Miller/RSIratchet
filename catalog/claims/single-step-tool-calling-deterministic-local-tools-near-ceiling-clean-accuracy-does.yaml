id: single-step-tool-calling-deterministic-local-tools-near-ceiling-clean-accuracy-does
ref: CLM-0486
capability: tool-use
technique: stage-aligned-perturbation-cascade-aware-failure-attribution
statement: >-
  In single-step tool-calling with deterministic local tools, near-ceiling
  clean accuracy does not predict robustness under stage-targeted
  perturbations, and the weakest stage is interpreting the tool's returned
  evidence rather than selecting the tool or binding arguments: across seven
  current models, success under corrupted, missing or competing tool output
  averaged far below success under perturbed tool names and descriptions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-step tool calls against a deterministic 40-tool local environment (16 sampled), 7 frontier/mid-tier models, four perturbation families with light/medium/heavy severity; no l"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage recovered
      71/98 failed instances (100% for single-fault, 82.1% for cascades, 0%
      for multi-fault); human audit on 30 ambiguous cases gave 74.2%
      agreement; label-guided interventions worked as predicted (alias fix
      for interface failures 21/30 to 30/30; CoT argument prompting for
      intent failures 21/30 unchanged).. Measured on 15,456 single-family
      records, 7 models. Clean mean 0.979 vs overall perturbed 0.664-0.766;
      observation family 0.455 mean with no model above 0.60, interface
      0.918. [truncated]
