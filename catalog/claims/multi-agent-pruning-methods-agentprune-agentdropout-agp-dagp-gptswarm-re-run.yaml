id: multi-agent-pruning-methods-agentprune-agentdropout-agp-dagp-gptswarm-re-run
ref: CLM-0410
capability: multi-model-coordination
technique: compare-agent-pruning-against-random-pruning-equal-budget
statement: >-
  When multi-agent pruning methods (AgentPrune, AgentDropout, AGP, DAGP,
  GPTSwarm) are re-run under a fixed backbone, agent registry, role-to-node
  assignment and runtime, their accuracy-cost gains do not hold across
  starting topologies and mostly do not beat random pruning at the same
  structural budget — averaged over 20 cells the optimized systems lost 0.77
  accuracy points against the original system versus 0.44 for matched random
  pruning, and only 12 of 25 method-topology pairs beat their random
  control.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five compression-style MAS optimizers, four task families (GSM8K, MMLU-500, HumanEval, LiveCodeBench-150), small open-weight 4B-8B backbones, 6 agents, 2 rounds, mostly no tool acc"
sources:
  - source: arxiv-2609-05933
    stance: supports
    note: >-
      Validated by: Applied to 20 main-grid cells across five starting
      topologies and four tasks; the random control preserved accuracy about
      as well as the learned optimizers (-0.44 vs -0.77 points from the
      uncompressed system), exposing cells where the full multi-agent
      structure was not needed at all.. Measured on a 38-cell
      anchor-plus-one-axis grid with a pinned backbone per task family and a
      per-source observation filter, so deltas are attributable to the
      emitted topology. [truncated]
