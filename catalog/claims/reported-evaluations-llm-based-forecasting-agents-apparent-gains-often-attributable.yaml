id: reported-evaluations-llm-based-forecasting-agents-apparent-gains-often-attributable
ref: CLM-0472
capability: forecasting
technique: score-forecasts-contamination-resistant-live-events-cost-reported
statement: >-
  In reported evaluations of LLM-based forecasting agents, apparent gains
  are often not attributable to temporal reasoning: the same systems are
  sensitive to small input perturbations, ablations show the LLM component
  sometimes adds no accuracy over the statistical or retrieval parts, and
  benchmark gains can come from training-data contamination on
  already-resolved events.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Survey of published LLM forecasting agents across finance, weather, health, energy and operations; based on reported results rather than a new controlled experiment."
sources:
  - source: arxiv-2608-23058
    stance: supports
    note: >-
      Validated by: Not measured; argued from collected negative evidence in
      the surveyed literature.. Survey-level synthesis; it cites
      perturbation sensitivity, null ablations and contamination as
      recurring findings but reports no new measurement or quantified share
      of affected results.
contested: false
status: pending-review
last_checked_at: 2026-10-16
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Forecasting agents
  evaluated on strictly post-cutoff live questions retain their reported
  accuracy advantage over the non-LLM components, and ablations show the LLM
  contributes the bulk of the gain.
