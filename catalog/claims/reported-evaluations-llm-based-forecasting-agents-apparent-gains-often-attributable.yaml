id: reported-evaluations-llm-based-forecasting-agents-apparent-gains-often-attributable
ref: CLM-0472
capability: forecasting
technique: contamination-resistant-live-forecasting-evaluation
statement: >-
  In reported evaluations of LLM-based forecasting agents, apparent gains
  are often attributable to the measurement setup rather than to temporal
  reasoning: results shift under small input perturbations, ablations
  frequently show the LLM component adds no accuracy over the statistical or
  retrieval parts, and benchmark gains can come from training-data
  contamination on already-resolved events.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Survey of published LLM forecasting agents across finance, weather, health, energy and operations; based on retrospective benchmarks rather than live prediction."
sources:
  - source: arxiv-2608-23058
    stance: supports
    note: >-
      Validated by: Not measured; argued from the pattern of negative
      evidence collected in the survey.. Narrative survey; no new
      measurement. Aggregates perturbation sensitivity, LLM-ablation nulls
      and contamination concerns across prior work, but does not quantify
      how much of reported gains each explains.
contested: false
status: pending-review
last_checked_at: 2026-10-03
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Studies showing LLM
  forecasting agents keep their reported margins over non-LLM baselines on
  live, post-cutoff questions, with ablations confirming the LLM component
  carries the gain and results stable under input perturbation. Drafted
  stance toward
  forecasting-scaffolded-system-approaches-human-crowd-accuracy: supports --
  The survey's emphasis on ablations where the LLM adds nothing supports the
  reading that scaffolding, not the base model, carries forecasting
  performance.
