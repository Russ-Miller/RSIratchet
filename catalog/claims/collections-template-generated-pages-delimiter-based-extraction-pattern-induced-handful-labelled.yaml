technique: induce-reusable-delimiter-wrapper-labelled-examples
statement: >-
  For collections of template-generated pages, a delimiter-based extraction
  pattern induced from a handful of labelled examples can be reused across
  the rest of the collection, so extraction cost per page drops to pattern
  execution rather than per-page inference.
