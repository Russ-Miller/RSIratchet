capability: multi-model-coordination
technique: deliberate-before-invoking-any-tool
statement: >-
  For LLM research-assistant agents, inserting an explicit deliberation step
  that decides whether any tool is needed before the ReAct loop runs is
  claimed to cut unnecessary tool calls and latency, but in the source
  presenting it the component contributions are projected from architectural
  analysis rather than measured on executed runs.
