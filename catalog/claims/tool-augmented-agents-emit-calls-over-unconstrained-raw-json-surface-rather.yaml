    stance: supports
    note: >-
      Validated by: On 322 live-model hallucinations and 400 scripted trials
      per class, the resolver rejected all H1-H3 cases while a gating-only
      stack executed them; but both the 322/322 execution and the 0/322
      rejection are by-construction consequences of the fail-open threat
      model, and zero honest over-rejection is measured on the resolver's
      own honest-call generator, so only the emission counts are independent
      evidence.. [truncated]
