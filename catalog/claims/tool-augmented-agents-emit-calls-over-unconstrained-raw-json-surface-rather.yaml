id: tool-augmented-agents-emit-calls-over-unconstrained-raw-json-surface-rather
ref: CLM-0425
capability: hallucination
technique: reject-tool-calls-do-resolve-registered-tool-signature
statement: >-
  When tool-augmented agents emit calls over an unconstrained raw-JSON
  surface rather than a schema-enforcing function-calling API, every tested
  hosted model fabricates tool names or undeclared arguments at rates of
  roughly 13-57%, and parameter count does not reduce this — an 8B and a
  675B model hallucinate at comparable raw-JSON rates.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Ten hosted Bedrock models (Claude, Nova, GPT-OSS, Llama-3.1, Mistral families), 60 adversarial probes per model per surface, a synthetic 100-tool registry with 10 tools exposed; lo"
