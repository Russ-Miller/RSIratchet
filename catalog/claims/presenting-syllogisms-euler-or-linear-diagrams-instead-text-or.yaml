id: presenting-syllogisms-euler-or-linear-diagrams-instead-text-or
ref: CLM-0318
capability: logical-deduction-robustness
statement: >-
  Presenting syllogisms as Euler or linear diagrams instead of text or
  logical notation did not consistently improve two models' accuracy on 285
  problems; both did well on entailment and contradiction items but poorly
  on neutral ones (GPT-4o-mini under 30% on neutral cases), and made
  systematic conversion errors, treating 'all A are B' as if it implied 'all
  B are A'.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Claude 3.5 Sonnet and GPT-4o-mini, 285 syllogisms from Ando et al. 2024 in four representations, 2026."
sources:
  - source: arxiv-2607-23513
    stance: supports
    note: >-
      Two models and one problem set; the neutral-case weakness and
      conversion errors match older findings on human reasoners, which is
      what makes them worth recording.
contested: false
