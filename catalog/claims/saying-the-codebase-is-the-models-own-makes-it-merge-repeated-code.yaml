id: saying-the-codebase-is-the-models-own-makes-it-merge-repeated-code
ref: CLM-0956
capability: software-architecture
technique: tell-the-model-the-code-is-its-own
statement: "For Claude Fable 5.2 on small coding tasks, one sentence telling
  the model the codebase is its own raised how often it merged repeated code
  from under a tenth of tries to about half, with the requested feature
  working either way; it also cost about 1.5 times the output tokens, added
  unrequested tests and docs, and changed an existing feature’s behaviour in
  one try in six to ten. A scope rule in the same prompt (“No drive-by
  refactors”) did not cancel it: merging still happened in about a third of
  tries."
kind: observation
backing_strength: single-paper
sources:
  - source: anthropic-2026-prompting-claude-fable-5-2
    stance: supports
    note: Section “Say who owns the code”. Without an ownership statement, or
      with the code presented as someone else’s, the model added to the
      existing structure and reported nearby problems rather than fixing
      them. The closing summary often left out small changes, so the guide
      advises reviewing the diff.
