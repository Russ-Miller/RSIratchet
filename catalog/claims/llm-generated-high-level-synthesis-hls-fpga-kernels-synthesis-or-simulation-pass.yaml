    stance: supports
    note: >-
      Validated by: Applied to five models on 78 HLS-Eval tasks; the three
      staged rates diverge for every model (e.g. Gemini 3.1 Pro zero-shot
      82.1% / 67.9% / 56.4%), and a motivating case shows a
      simulation-passing kernel failing place-and-route from aggressive
      unrolling. No comparison to an alternative evaluation protocol..
      Measured on one benchmark (78 tasks) and one board/toolchain, five
