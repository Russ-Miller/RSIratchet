id: llm-generated-high-level-synthesis-hls-fpga-kernels-synthesis-or-simulation-pass
ref: CLM-0422
capability: evaluation-validity
technique: score-hls-generation-board-execution-synthesis
statement: >-
  For LLM-generated high-level-synthesis (HLS) FPGA kernels, a synthesis or
  simulation pass rate overstates deployability: across five models on 78
  HLS-Eval tasks, the rate of designs that build into an FPGA executable and
  run on a Xilinx U200 board is lower than the synthesizable rate, and the
  rate that also produces correct board-level output is lower again, so
  toolchain-level metrics are a necessary but not sufficient proxy for a
  working design.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Natural-language-specification-to-HLS generation evaluated on HLS-Eval (78 retained tasks), Vitis HLS 2022.2, Xilinx U200 at 200 MHz; five models (Qwen3-Coder-30B-A3B, DeepSeek V3."
sources:
