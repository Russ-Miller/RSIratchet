    stance: supports
    note: >-
      Validated by: SearchQA/ALFWorld/WebShop accuracy against state-only
      evolution (SkillOpt 53.9 avg), policy internalization (OPID 55.4), and
      co-evolution (SkillRL 56.2) versus 57.6 avg; ablation: selective 01+11
      consolidation 63.0% vs 58.9% unfiltered; state-free accuracy rose 58.1
      to 61.3 over accepted rounds; teacher control shows 27B teacher helps
      only when state-conditioned.. Measured on three benchmarks with one
      base model and one teacher pair; [truncated]
