id: small-agent-policy-qwen3-5-4b-repeatedly-deployed-same-task
ref: CLM-0454
capability: harness-self-improvement
technique: consolidate-only-experience-survives-state-revision
statement: >-
  For a small agent policy (Qwen3.5-4B) repeatedly deployed on the same task
  family with environment-level feedback, distilling only the trajectories
  whose textual-state guidance is newly or persistently useful relative to
  state-free execution raises the state-free policy's accuracy more than
  distilling all state-conditioned trajectories, and the resulting policy
  keeps improving over alternating rounds of state editing and
  consolidation.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Post-deployment settings with recurring related tasks and verifiable environment rewards; small student (4B) with a larger fixed teacher (27B); QA, embodied and web-navigation benc"
