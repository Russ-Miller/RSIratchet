id: frozen-backbone-multi-agent-scientific-discovery-pipeline-hypobench-tasks-distilling-reusable
ref: CLM-0385
capability: harness-self-improvement
technique: learn-skills-per-stage-supervision-stage-offers
statement: >-
  For a frozen-backbone multi-agent scientific discovery pipeline on
  HypoBench tasks, distilling reusable procedural skills separately per
  stage — from discriminator critique of a whole hypothesis batch for
  generation, and from execution outcomes compared to ground-truth results
  for testing — beats no skill, an LLM-written skill, and a hand-written
  skill, and removing each stage's feedback signal costs most of the gain.
kind: observation
backing_strength: single-paper
observed_on:
  era: "13 HypoBench tasks split 1:1 into train/test, DeepSeek-V4-Flash backbone, skill updates kept only when the training objective improves; data-driven discovery with executable statis"
sources:
  - source: arxiv-2608-25770
    stance: supports
    note: >-
      Validated by: On held-out HypoBench tasks: hypothesis quality 0.785
      and Hit@K 0.648 versus 0.724/0.409 with no skill, 0.738/0.579 for an
      AI-generated skill, 0.761/0.497 for a human-designed skill,
      0.719/0.472 for HypoGeniC; test pass rate 0.659 versus 0.562 no-skill,
      0.612 human-designed, 0.589 ReAct, 0.417 POPPER. Ablations: removing
      discriminator feedback drops Hit@K to 0.491; removing execution
      outcomes drops pass rate to 0.565. Three runs. The generation quality
      metric is the same discriminator used as the training signal, so that
      number is not an independent check.. [truncated]
