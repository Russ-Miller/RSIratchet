id: chat-chain-multi-agent-software-development-pipelines-7-9b-open-backbones-gemma
ref: CLM-0589
capability: multi-model-coordination
technique: gate-inter-agent-handoffs-phase-calibrated-uncertainty
statement: >-
  In chat-chain multi-agent software development pipelines with 7-9B open
  backbones (Gemma 2 9B, Qwen2.5-Coder 7B), gating inter-agent handoffs on a
  token-log-probability uncertainty score with phase-calibrated thresholds —
  triggering web retrieval only when the score exceeds the threshold —
  raises executability and overall quality over the same pipeline without
  the gate, at the cost of roughly double the duration and token spend.
kind: observation
backing_strength: single-paper
observed_on:
  era: "SRDD benchmark (1,200 natural-language software tasks), two open 7-9B backbones, ChatDev-style three-phase chain with five subtasks; thresholds calibrated at the 90th percentile of"
sources:
  - source: arxiv-2607-02186
    stance: supports
    note: >-
      Validated by: Ablation against the same pipeline without the
      uncertainty module on SRDD: overall quality 0.578 to 0.649 (Qwen 2.5)
      and 0.557 to 0.596 (Gemma 2), executability 0.779 to 0.859 and 0.794
      to 0.840; also compared to GPT-Engineer, MetaGPT and ChatDev baselines
      (ChatDev Q 0.395), with duration and token cost reported separately..
      Measured on SRDD with four metrics and an explicit
      with/without-uncertainty ablation on two backbones, so the gate's
      contribution is isolated from the rest of the pipeline. [truncated]
