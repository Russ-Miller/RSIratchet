id: hours-long-ml-development-runs-kaggle-style-competitions-agent-scaffolds-each
ref: CLM-0625
capability: planning
technique: distil-human-planning-practice-into-re-injected-planning
statement: >-
  In hours-long ML development runs on Kaggle-style competitions, agent
  scaffolds each lock into one strategy policy — the single-loop CLI agent
  pivots far less than humans (9% vs 25% of transitions) and the
  evolutionary search agent far more (58%) with pivot gains cancelling out —
  and neither reopens an approach it had abandoned, even though it recovers
  scores after setbacks as well as top humans.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two scaffolds (Codex CLI, MLEvolve) on a gpt-5.4-mini backend, 12-hour budget, seven Kaggle competitions paired against 430 public human notebook trajectories; humans are a referen"
sources:
  - source: arxiv-2608-26086
    stance: supports
    note: >-
      Validated by: Across all 7 paired competitions at fixed backend,
      tools, grader and 12h budget, varying only the prompt: 5 of 7 improved
      on best held-out score, 2 within ~0.01 noise, none regressed; three
      named behaviors moved onto the top-human value, while prohibitions
      overshot to zero and already-saturated practices did not move; an
      injection-cadence-only arm with the planning content stripped landed
      at or below baseline.. [truncated]
