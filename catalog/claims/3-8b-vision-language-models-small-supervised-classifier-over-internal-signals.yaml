id: 3-8b-vision-language-models-small-supervised-classifier-over-internal-signals
ref: CLM-0964
capability: visual-grounding
technique: fuse-single-pass-vlm-internal-signals-into-hallucination
statement: >-
  In 3-8B vision-language models, a small supervised classifier over
  internal signals from one forward pass (token log-likelihood, predictive
  entropy, mid-depth decoder hidden states, visual patch and cross-modal
  aligned embeddings) detects visually ungrounded answers better than
  sampling-based uncertainty methods (semantic entropy, SelfCheckGPT,
  P(True)) at a fraction of their inference cost, but this holds only
  in-distribution: trained on one VQA hallucination dataset and tested on
  another with a different hallucination type, AUROC often falls near or
  below chance.
kind: observation
backing_strength: single-paper
observed_on:
  era: "InstructBLIP-T5-XL, LLaVA-NeXT-8B, Qwen3-VL-8B on HalLoc-VQA, POPE, HaloQuest, VQA v2; labels generated by a Visual-NLI judge rather than human annotation; ~2,000 train / 1,000 eva"
sources:
  - source: arxiv-2601-00269
    stance: supports
    note: >-
      Validated by: AUROC, AURAC, F1@Best and RejAcc@50 against token-level,
      latent, semantic-entropy, SelfCheckGPT, P(True) and
      logistic-regression baselines on three backbones and three datasets,
      plus latency per 100 samples; OOD tested by cross-dataset transfer.
      Measured on 3 backbones x 4 datasets with 3 seeds; ID gains up to ~8
      AUROC points but inconsistent per-metric (e.g. Qwen3-VL on HalLoc and
      VQA v2 trails P(True)). OOD table shows several sub-0.5 AUROC cells.
