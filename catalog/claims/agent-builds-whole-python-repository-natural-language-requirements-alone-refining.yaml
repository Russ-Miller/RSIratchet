id: agent-builds-whole-python-repository-natural-language-requirements-alone-refining
ref: CLM-0357
capability: code-generation
technique: evolve-component-boundaries-modularity-metrics-until-convergence
statement: >-
  When an agent builds a whole Python repository from natural-language
  requirements alone, refining component boundaries with explicit cohesion
  and coupling thresholds until no split or merge is triggered produces
  higher functionality coverage and test pass rate than letting the LLM
  decide restructuring actions for a fixed budget of rounds, because
  unconstrained LLM-decided actions keep over-decomposing past the point of
  a coherent modular structure.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Six Python repositories in RepoCraft, generated from revised high-level requirement descriptions, with GPT-5 mini and DeepSeek V3.2 backbones and a shared downstream TDD generation"
