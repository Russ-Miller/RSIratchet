    stance: supports
    note: >-
      Validated by: Not measured; argued from the survey's collection of
      negative results (perturbation sensitivity, null ablations, suspected
      contamination).. Survey-level synthesis, not a new measurement.
      Characterizes a body of positive and negative evidence; no numbers
      given in the source text and no single design isolates contamination
      from reasoning.
