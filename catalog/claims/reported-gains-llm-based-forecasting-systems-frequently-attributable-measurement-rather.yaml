id: reported-gains-llm-based-forecasting-systems-frequently-attributable-measurement-rather
ref: CLM-0473
capability: forecasting
technique: evaluate-forecasting-agents-live-post-cutoff-questions-llm
statement: >-
  Reported gains for LLM-based forecasting systems are frequently
  attributable to measurement rather than temporal reasoning: results shift
  under small input perturbations, ablations show the LLM component
  sometimes adds no accuracy over the statistical or retrieval parts, and
  benchmark gains on questions resolved before the training cutoff can
  reflect contamination, so only contamination-resistant live evaluation
  with calibration under distribution shift supports a capability claim.
kind: mechanism
backing_strength: single-paper
