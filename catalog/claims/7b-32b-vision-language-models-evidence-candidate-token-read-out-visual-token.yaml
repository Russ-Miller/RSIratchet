  probabilities across visual positions, or using a single global evidence
  threshold for all tokens, lowers hallucination as much as rank pooling
  with per-token references on the same backbones and benchmarks; or show
  the reported CHAIR gain comes from reduced object coverage rather than
  better grounding.
