id: single-box-sokoban-corridors-minimal-branching-where-only-difficulty-plan
ref: CLM-1166
capability: planning
statement: >-
  On single-box Sokoban corridors with minimal branching, where the only
  difficulty is plan length, current reasoning models (DeepSeek R1,
  GPT-5-mini, GPT-oss-120B) solve short instances reliably but collapse to
  near-zero valid plans once about 25-30 moves are required, and giving them
  a validated PDDL domain plus parser and solver only slightly flattens that
  decline.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1xL corridor maps with one player, one box, one goal, lengths 5-100 in steps of 5, four rotations, exact-optimal-plan match, 8 repetitions (4 in the tool setting); only three reaso"
sources:
  - source: arxiv-2601-20856
    stance: supports
    note: >-
      Measured on 80 generated maps with exact-match accuracy, prefix
      accuracy and terminal Manhattan distance, plus token-count
      regressions. The design does isolate horizon length from branching,
      since the corridor has one free parameter. It does not isolate the
      cause: the attribution to counting drift and visited-state amnesia
      rests on qualitative trace inspection and on a reported GPT-5-mini
      accuracy bump at length 50 the authors cannot explain. Tool-setting
      evidence is one model at 4 repetitions.
contested: false
status: pending-review
last_checked_at: 2026-11-20
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A reasoning model that
  holds high exact-plan accuracy on these corridors out to 50+ required
  moves, or a PDDL-tool pipeline that restores near-ceiling accuracy across
  the full length range, would falsify it.
