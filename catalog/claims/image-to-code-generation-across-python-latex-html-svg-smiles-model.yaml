id: image-to-code-generation-across-python-latex-html-svg-smiles-model
ref: CLM-1099
capability: code-generation
technique: score-image-to-code-perceptual-fidelity-parametric-precision
statement: >-
  On image-to-code generation across Python, LaTeX, HTML, SVG and SMILES, a
  model's code execution rate and rendered-image fidelity score both
  overstate correctness: across 13 proprietary and open LMMs, execution
  rates near 90-99% coexist with parametric accuracy around 25-56%, and
  parametric accuracy lags functional-block coverage for every model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,080 curated image-code pairs over 5 languages, 8 subjects, 45 figure types; code-level scores computed by an LLM parser against pre-extracted reference function blocks and parame"
sources:
  - source: arxiv-2603-17508
    stance: supports
    note: >-
      Validated by: Human-preference alignment on 500 ranked instances: the
      image-level prompt reached Kendall tau 0.8304 and RMSE 0.4284 with GPT
      4.1, above four prior image-level scoring prompts; code-level judge
      agreement checked against a three-judge majority vote (Kendall W
      0.76). Parametric accuracy surfaced errors (e.g. linspace deviations)
      the perceptual score did not.. Measured on 1,080 items with 13 models;
      the ordering (S_para < S_func, high Exec) is consistent across every
      model and language block. [truncated]
