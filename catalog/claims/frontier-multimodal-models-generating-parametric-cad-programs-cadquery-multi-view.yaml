id: frontier-multimodal-models-generating-parametric-cad-programs-cadquery-multi-view
ref: CLM-0829
capability: code-generation
technique: score-cad-generation-per-capability-level-iou-alone
statement: >-
  For frontier multimodal models generating parametric CAD programs
  (CadQuery) from multi-view renders of industrial part families,
  rendered-geometry similarity overstates competence: models recover the
  coarse outer shape while omitting fine features and substituting
  sketch-and-extrude for required operations such as sweeps, lofts and
  twist-extrudes, and on matched numeric design questions accuracy is far
  lower from images than from the program text (best total ~0.587 vs
  ~0.838).
kind: observation
backing_strength: single-paper
observed_on:
  era: "17,900 execution-verified CadQuery parts across 106 standard-anchored industrial families; 2,400 paired image/code QA items; 10+ frontier and CAD-specialist models evaluated zero-s"
sources:
