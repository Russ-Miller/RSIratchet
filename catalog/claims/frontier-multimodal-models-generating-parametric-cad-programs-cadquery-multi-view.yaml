    stance: supports
    note: >-
      Validated by: Applied to 10+ models; the matched image-vs-code QA gap
      and essential-op recall localize failures that a single IoU score
      reports as undifferentiated low similarity; no human-agreement study
      of the level assignments is reported.. Measured on a purpose-built
      benchmark with expert sign-off; blind baselines included (blank image
      total 0.375 against best 0.587, so the image QA signal is real but
      weak). [truncated]
