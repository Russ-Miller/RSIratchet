id: automated-unit-test-generation-java-nlp-libraries-injecting-llm-written-test
ref: CLM-0235
capability: code-generation
technique: inject-llm-test-snippets-into-search-stalls
statement: >-
  For automated unit-test generation on Java NLP libraries, injecting
  LLM-written test snippets into a search-based generator's population when
  the evolutionary search stagnates raises branch and line coverage over
  either the search tool alone or the LLM alone, but the gain is
  concentrated in text-heavy classes (information extraction, coreference,
  segmentation) and is near zero or slightly negative in classes dominated
  by numeric or algorithmic logic.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "100 classes from five Java NLP libraries; EvoSuite/DynaMOSA as the search backbone, ChatGPT-4o as the LLM, 900s budget, five runs per class; assertions still generated by EvoSuite."
sources:
  - source: arxiv-2609-14784
    stance: supports
    note: >-
      Validated by: Median branch coverage 68.60% vs 58.03% for a Java
      reimplementation of CodaMOSA, 53.33% for EvoSuite and 32.64% for
      LLM-only; mutation score 63.0% vs 52.0/58.0/38.26; Wilcoxon p<<0.05
      with A12 0.72-0.85 on coverage, 0.57-0.64 on mutation; ablations on
      prompting strategy, context level, LLM choice and call count..
      Measured on a 100-class benchmark the authors built, five runs per
      class, with paired significance tests, effect sizes and bootstrap CIs.
