notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "external-feedback-repair", which does not list
  this capability in addresses -- recorded, not asserted. Drafted
  confidence: medium. Falsifier as drafted: A run of the same benchmark and
  budget where LLM-generated mutations match or exceed FlowRepair's 18
  plausible / 16 valid model coverage, or where adding simulation feedback
  to the prompt does not close the gap. Drafted stance toward
  external-feedback-repair-works-only-with-real-grounding: supports -- The
  LLM mutator generated candidates from static labels with no simulation
  feedback about failure duration or severity, and repaired far fewer models
  than the feedback-guided search it replaced. Proposed technique, not
  catalogued: LLM as mutation operator in search-based repair.
