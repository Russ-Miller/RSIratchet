id: long-context-tasks-over-8k-128k-token-un-reports-middle-of-context-accuracy-dip
ref: CLM-0428
capability: long-context-degradation
statement: >-
  On long-context tasks over 8K-128K-token UN reports, the middle-of-context
  accuracy dip appears at word-level QA and paragraph-filling but inverts at
  sentence-level cloze, where models score best on mid-document targets
  because mid-paragraph sentences carry concrete entity overlap that rewards
  surface-cue matching rather than discourse-role reasoning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "12 long-context LLMs, zero-shot, UN reports 8K-128K tokens, six official UN languages; position stratified as begin/middle/end at paragraph and document level."
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured across 12 models on a new benchmark with position-stratified
      items; the inversion is reported in aggregate figures and the
      surface-cue explanation is supported by LLM-plus-human error
      categorisation of cloze cases where over half of models failed, not by
      a controlled manipulation of lexical overlap. Cloze absolute accuracy
      is low (average ~21%), so position effects sit on a weak base.
contested: false
status: pending-review
last_checked_at: 2026-10-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where
  sentence-cloze accuracy also dips in the middle, or where the mid-document
  cloze advantage persists after distractors are rewritten to remove surface
  lexical overlap with the target region.
