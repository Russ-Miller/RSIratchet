ref: CLM-1031
capability: embodied-control
technique: condition-action-head-dense-traces-subtask-labels
statement: >-
  For plan-then-execute manipulation policies that condition a diffusion
  action head on intermediate representations, coarse stage-level labels
  (subtask, primitive skill) add little over no conditioning, while
  spatially and temporally grounded representations — object and gripper
  boxes, affordance, and especially the dense 2D end-effector trace — carry
  nearly all of the open-loop action-prediction gain.
