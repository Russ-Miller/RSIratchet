      mean Open-Loop Score rose 0.3086 (no conditioning) to 0.3146 with
      subtask, 0.3159 adding primitive skill, 0.3289 adding object box,
      0.3391 adding gripper box, 0.3435 adding affordance, and 0.3861 adding
      trace; ground-truth representations were used, so
      predicted-representation performance is lower.. Measured as a single
      cumulative ablation ladder on one dataset and one executor
      architecture, using oracle annotations; [truncated]
