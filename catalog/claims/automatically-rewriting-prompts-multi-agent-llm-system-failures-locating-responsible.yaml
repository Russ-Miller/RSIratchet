id: automatically-rewriting-prompts-multi-agent-llm-system-failures-locating-responsible
ref: CLM-0358
capability: harness-self-improvement
technique: find-responsible-agent-hint-injection-then-learn-corrected
statement: >-
  When automatically rewriting the prompts of a multi-agent LLM system from
  its failures, locating the responsible agent by injecting a hint into one
  agent at a time and using that agent's hint-corrected intermediate output
  as the supervision signal produces prompt updates that generalize better
  than critique derived only from the system-level output.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Multi-agent pipelines of a few LLM agents with a scalar reward and a training set; tested on HotpotQA, HoVer, PUPA, IFBench and MATH with GPT-5-mini and Qwen3-8B."
sources:
  - source: arxiv-2609-08572
    stance: supports
    note: >-
      Validated by: Against MIPROv2, TextGrad, GEPA and a no-optimization
      baseline on five MAS benchmarks, three seeds: average gain over
      no-optimization +11.76 with GPT-5-mini (vs +9.24 for GEPA) and +9.67
      with Qwen3-8B; wall-clock optimization time 2.5x lower than the
      next-fastest baseline; ablation adds target identification (+1.44
      HotpotQA, +3.84 PUPA), agent-level supervision, and gradient
      clustering separately; optimized prompts also transferred best on five
      unseen in-domain benchmarks.. [truncated]
