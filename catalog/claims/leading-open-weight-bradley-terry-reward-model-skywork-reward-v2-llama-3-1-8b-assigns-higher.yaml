statement: >-
  A leading open-weight Bradley-Terry reward model
  (Skywork-Reward-V2-Llama-3.1-8B) assigns higher scores to minimally
  rewritten responses that add redundant whitespace between words or insert
  plausible-sounding hallucinated details, on topic-specific synthetic
  prompt distributions where a frontier LLM judge prefers the unmodified
  response.
