id: 7b-decoder-based-vision-language-models-llava-1-5-7b-qwen2-5-vl-7b-few
ref: CLM-0809
capability: visual-grounding
technique: project-visual-embeddings-off-top-text-principal-components
statement: >-
  In 7B decoder-based vision-language models (LLaVA-1.5-7B, Qwen2.5-VL-7B),
  a few top principal components of a dataset-agnostic text-embedding
  subspace act as a modality anchor carrying linguistic rather than visual
  information, so projecting visual embeddings orthogonal to those
  components at inference lowers object-hallucination rates (AMBER CHAIR
  9.20 to 6.74 on LLaVA-1.5-7B) without reducing POPE accuracy or general
  benchmark scores.
