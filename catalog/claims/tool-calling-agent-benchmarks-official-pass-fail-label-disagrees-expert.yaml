id: tool-calling-agent-benchmarks-official-pass-fail-label-disagrees-expert
ref: CLM-0712
capability: evaluation-validity
technique: gate-task-success-deterministic-state-predicates-judge-only
statement: >-
  On tool-calling agent benchmarks, the official pass/fail label disagrees
  with expert trace-level judgment in a substantial minority of tasks (18.5%
  over 496 audited tasks spanning BFCL v4, tau2-Bench Retail, MCP-Atlas and
  LiveMCPBench), and benchmarks that score with a stochastic LLM judge that
  regenerates its own rubric are the least reliable: 23 identical reruns of
  LiveMCPBench on one model spanned 57.9%-76.8%, a spread larger than
  typical leaderboard margins.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four tool-calling benchmark families audited with one or two agent models each; expert adjudication by three annotators with disagreements resolved; LiveMCPBench variance confounds"
sources:
  - source: arxiv-2607-02577
    stance: supports
    note: >-
      Validated by: On 70 tasks across six models (420 model-task
      evaluations), the evaluator's verdicts agreed with expert trace-level
      judgment 95.5% of the time, above the audited benchmarks' 69.0-90.0%,
      with all 19 disagreements being benchmark-stricter-than-human and no
      false passes; measured on a different task distribution than the
      audited benchmarks, so not a controlled comparison.. Measured: 496
      traces adjudicated by three experts (89 annotator-hours),
      per-benchmark error rates 9.8-30.5%; 23 full reruns for the variance
      figure. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An independent audit of
  these same benchmarks finding evaluator-human agreement near ceiling, or
  repeated identical LiveMCPBench runs showing score spread of a point or
  two once agent sampling is held fixed. Drafted stance toward
  multi-turn-tool-calling-benchmarks-score-whether-final-environment-state-matches:
  supports -- The audit finds the same class of defect, including a
  tau2-Bench Retail task passed because the database was unchanged while the
  agent never invoked the required return tool.
