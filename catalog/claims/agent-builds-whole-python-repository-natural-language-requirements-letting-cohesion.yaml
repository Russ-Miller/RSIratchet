id: agent-builds-whole-python-repository-natural-language-requirements-letting-cohesion
ref: CLM-0357
capability: code-generation
technique: stop-restructuring-modularity-metrics-model-judgement
statement: >-
  When an agent builds a whole Python repository from natural-language
  requirements, letting cohesion and coupling thresholds decide which
  components to split or merge and when to stop restructuring yields higher
  functionality coverage and test pass rate than letting the model itself
  decide structural actions for a fixed budget of 1, 3 or 5 rounds, because
  unconstrained model-decided restructuring keeps fragmenting components
  past the point of a coherent boundary.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Zero-to-all generation of six real-world Python repositories (RepoCraft) with GPT-5 mini and DeepSeek V3.2, downstream code generation and repair held identical across methods; con"
sources:
  - source: arxiv-2608-19854
    stance: supports
    note: >-
      Validated by: Functionality coverage, pass rate and voting rate on
      three RepoCraft repositories against mini-SWE-agent, Paper2Code and
      RPG (best baseline), plus ablations removing structural evolution,
      Dual-DAG, requirement context and dependency-aware ordering, plus a
      comparison against LLM-decided evolution at fixed round budgets;
      thresholds tuned on two held-out repositories.. Measured on three of
      six repositories in the main table across two backbones, with three
      averaged runs; [truncated]
