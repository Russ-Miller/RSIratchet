id: 3b-8b-video-multimodal-models-inserting-few-continuous-latent-thought
ref: CLM-0532
capability: video-temporal-reasoning
technique: anchor-self-generated-latent-thoughts-video-question
statement: >-
  For 3B-8B video multimodal models, inserting a few continuous latent
  thought steps that are cross-attention-conditioned on the video and
  question features, trained only on video-question-answer triplets with
  alignment and diversity losses, raises accuracy across general video
  understanding and video reasoning benchmarks over both the untuned
  backbone and explicit CoT-trained variants, which do not consistently beat
  their own backbone.
