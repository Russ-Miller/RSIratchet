    stance: supports
    note: >-
      Validated by: Applied to six systems: aggregate Pass@1 ranged
      0.410-0.600 while per-category self-correction Pass@1 ranged
      0.176-0.588, with the lowest self-correction score (cascaded, 0.176)
      coming from a system of middling aggregate accuracy (0.450) — so the
      per-category split reorders systems the aggregate does not. No
      baseline evaluation protocol compared.. Measured on 100 recordings
      from 12 speakers, 21 with self-corrections, across six systems.
      Self-correction is the lowest or near-lowest category for most systems
      (0.176-0.588 vs 0.414-0.621 for fillers). [truncated]
