id: real-time-full-duplex-voice-agents-doing-multi-step-tool-calls-mid-utterance
ref: CLM-1235
capability: tool-use
technique: score-voice-tool-use-per-disfluency-category-real
statement: >-
  For real-time full-duplex voice agents doing multi-step tool calls,
  mid-utterance self-correction is the weakest disfluency category across
  every system tested, because low-latency designs commit tool parameters
  before the user finishes speaking — either by pre-emptive API invocation
  or by ASR finalizing the pre-correction transcript — leaving no path to
  roll the parameter back.
