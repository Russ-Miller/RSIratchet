  Drafted confidence: medium. Falsifier as drafted: A voice agent that
  invokes tools before the user's turn ends (negative tool-call latency) and
  nonetheless matches or exceeds conservative-commitment systems on
  self-correction scenarios, or a system whose self-correction pass rate
  equals its filler/hesitation pass rate.
