id: multi-hop-spatial-reasoning-over-indoor-scan-videos-constrained-localization-chained
ref: CLM-1027
capability: multi-step-reasoning
statement: >-
  On multi-hop spatial reasoning over indoor-scan videos (constrained
  localization, chained reference retrieval, route planning, counterfactual
  physical deduction), adding chain-of-thought prompting lowers accuracy for
  7-8B Qwen VL models relative to direct answering, because intermediate
  steps fabricate spatial details that propagate to the final answer.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two Qwen VL models (2.5-VL-7B, 3-VL-8B) on a 4,993-QA video benchmark built from six indoor 3D-scan datasets; greedy decoding; mixed multiple-choice and LLM-judged open-ended scori"
sources:
  - source: arxiv-2601-09430
    stance: supports
    note: >-
      Measured on two models only, one prompt variant, direct-answer
      baseline from the same table; no analysis isolating hallucinated
      intermediate steps beyond the authors' interpretation, and route
      planning moves the opposite way, so the mechanism is argued rather
      than shown.
contested: false
status: pending-review
last_checked_at: 2026-11-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "chain-of-thought", which does not list this
  capability in addresses -- recorded, not asserted. Drafted confidence:
  medium. Falsifier as drafted: CoT prompting raising average accuracy on
  this or an equivalent multi-hop video spatial benchmark across several
  model families, or the drop disappearing under a better-specified CoT
  prompt format. Drafted stance toward
  chain-of-thought-prompting-gives-consistent-large-accuracy-gains-only-tasks:
  supports -- Spatial video deduction is a non-symbolic task and CoT not
  only fails to help but costs 1.8-4.5 points on both tested models.
