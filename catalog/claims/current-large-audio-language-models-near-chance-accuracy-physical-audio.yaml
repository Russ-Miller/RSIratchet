id: current-large-audio-language-models-near-chance-accuracy-physical-audio
ref: CLM-1002
capability: audio-understanding
technique: probe-frozen-audio-encoders-locate-perception-bottleneck
statement: >-
  In current large audio language models, near-chance accuracy on physical
  audio attributes (pitch, loudness, duration, spatial direction) is not an
  encoding failure: linear probes on the frozen audio encoders of the same
  models recover those attributes at 60% or better while the end-to-end
  models sit near 50%, locating the loss in the alignment and decoding
  stages.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Measured on 2,400 synthetically generated binary recognition/comparison items across 12 physical attributes, 36 audio-capable systems, 8 encoders probed with a two-layer probe on a"
