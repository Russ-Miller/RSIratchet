    stance: supports
    note: >-
      Validated by: Across eight model families, probe accuracy was at or
      above 0.60 on every encoder while the corresponding end-to-end models
      clustered near 0.50 chance; Qwen2.5-Omni and Qwen3-Omni were
      exceptions whose E2E accuracy reached or exceeded their probe..
      Measured: 36 systems on a purpose-built benchmark plus 8 encoder
      probing experiments against a 91% human baseline. [truncated]
