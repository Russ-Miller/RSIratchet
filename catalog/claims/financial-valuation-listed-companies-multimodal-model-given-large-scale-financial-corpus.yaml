id: financial-valuation-listed-companies-multimodal-model-given-large-scale-financial-corpus
ref: CLM-0388
capability: domain-knowledge
technique: pre-train-domain-corpus-then-fine-tune-institution
statement: >-
  For financial valuation of listed companies, a multimodal model given
  large-scale financial-corpus pre-training before institution-specific
  fine-tuning produces lower target-price error than the same class of model
  fine-tuned in a single stage or prompted zero-shot.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target prices scored against analyst consensus; baselines were GPT-4 zero-shot, FinGPT single-stage fine-tuning, and an analyst-input DCF spreadsheet."
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error of target price versus analyst
      consensus on 200 companies: 13.1% versus 16.2% for an analyst-input
      DCF spreadsheet, 18.7% for single-stage FinGPT, 24.3% for zero-shot
      GPT-4; direction accuracy 0.751 versus 0.703.. Measured on one
      200-company panel against three baselines, but baselines differ in
      base model and data, so the two-stage protocol is not isolated from
      model or corpus differences; benchmark is analyst consensus rather
      than realized value, and no ablation holding compute fixed.
contested: false
status: pending-review
last_checked_at: 2026-10-16
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A matched comparison in
  which a single-stage fine-tune on the same total token budget matches or
  beats the two-stage model's valuation error, or in which the gap
  disappears once consensus-target leakage into training data is controlled.
