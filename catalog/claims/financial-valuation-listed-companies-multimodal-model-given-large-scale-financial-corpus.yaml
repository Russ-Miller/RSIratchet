id: financial-valuation-listed-companies-multimodal-model-given-large-scale-financial-corpus
ref: CLM-0389
capability: domain-knowledge
technique: pre-train-domain-corpus-then-fine-tune-institution
statement: >-
  For financial valuation of listed companies, a multimodal model given
  large-scale financial-corpus pre-training before institution-specific
  fine-tuning produces lower target-price error than the same class of model
  fine-tuned in one stage or prompted zero-shot, with the gap largest
  against zero-shot prompting.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target prices scored against analyst consensus; single system, no ablation isolating corpus size from staging"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error and RMSE of target price versus
      analyst consensus on 200 listed companies, plus direction accuracy;
      baselines were GPT-4 zero-shot (MAE 24.3%), FinGPT single-stage
      fine-tuning (18.7%), and an analyst-input DCF spreadsheet (16.2%),
      against 13.1% for the two-stage system.. Measured on 200 companies
      against three baselines, but consensus price targets are a proxy not
      ground truth, the comparison mixes model families (GPT-4, FinGPT,
      FinVision) so staging is not isolated, and no ablation of the
      two-stage protocol within one backbone is reported.
contested: false
status: pending-review
last_checked_at: 2026-10-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A single-stage fine-tune on
  the same combined data matching or beating the two-stage model's valuation
  MAE on a comparable company panel.
