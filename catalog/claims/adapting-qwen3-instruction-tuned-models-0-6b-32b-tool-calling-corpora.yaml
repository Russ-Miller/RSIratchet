    stance: supports
    note: >-
      Measured: 6 model scales x 4 training-data settings x 3 test splits,
      exact match against zero-shot baselines; win counts reported (15/2/1
      in-distribution, 29/19/6 on 54 transfer settings). Design controls
      prompt format and total training data across methods but not compute,
      and uses one model family; LoRA-vs-full-SFT comparison only at 4B.
