id: adapting-qwen3-instruction-tuned-models-0-6b-32b-tool-calling-corpora
ref: CLM-0341
capability: tool-use
technique: tool-use-fine-tuning
statement: >-
  For adapting Qwen3 instruction-tuned models from 0.6B to 32B to
  tool-calling corpora, LoRA supervised fine-tuning gives the best
  in-distribution exact-match accuracy (best in 15 of 18 settings, never
  below zero-shot), while GRPO holds only a sub-one-point average edge on
  cross-dataset transfer and SFT followed by GRPO under a matched data
  budget is rarely best at either.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single model family (Qwen3), three public tool-calling corpora with duplicates removed, identical prompt format, exact-match scoring, no compute-normalized comparison (GRPO uses mo"
