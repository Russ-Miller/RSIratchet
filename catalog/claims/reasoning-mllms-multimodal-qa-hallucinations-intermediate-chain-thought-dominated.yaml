id: reasoning-mllms-multimodal-qa-hallucinations-intermediate-chain-thought-dominated
ref: CLM-1047
capability: hallucination
technique: score-hallucination-per-rubric-item-across-knowledge-perception
statement: >-
  In reasoning MLLMs on multimodal QA, hallucinations in the intermediate
  chain of thought are dominated by perception errors, yet perception-only
  hallucinations track final-answer correctness weakly while
  reasoning-dimension (and mixed perception-plus-reasoning) hallucinations
  are much more frequent on wrong answers than on right ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "14 current reasoning MLLMs (open and closed) on 1,340 image and video questions with human-verified atomic reasoning steps; hallucination labels assigned per rubric item by an LLM "
sources:
  - source: arxiv-2601-22735
    stance: supports
    note: >-
      Validated by: Human meta-evaluation on 300 sampled instances;
      judge-human answer-level accuracy deviation below 1%, with
      finer-grained deviations reported as small.. Measured: stacked
      per-model hallucination-type rates split by answer correctness
      (hallucination rates below 15% on correct answers, above 30% on
      incorrect), plus subcategory score breakdown for one model
      (GLM-4.1V-Thinking) showing spatial errors dominant. Design does not
      isolate causation; [truncated]
