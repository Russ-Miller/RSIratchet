id: role-decomposed-multi-agent-pipeline-openseespy-frame-modeling-assigning-different-backbone
ref: CLM-1260
capability: multi-model-coordination
technique: assign-backbone-models-per-agent-role-reasoning-vs
statement: >-
  In a role-decomposed multi-agent pipeline for OpenSeesPy frame modeling,
  assigning different backbone LLMs by agent role — a stronger reasoning
  model to the planning/geometry agents and an instruction-following model
  to the mapping and code-translation agents — gives higher end-to-end
  accuracy than powering every agent with any one of those models alone,
  because each single model hallucinates in a different subtask class.
kind: observation
backing_strength: single-paper
observed_on:
  era: "20 benchmark 2D frame modeling problems, ten trials each, with GPT-OSS 120B and Llama-3.3 70B Instruct Turbo; one fixed prompt template per agent"
sources:
  - source: arxiv-2603-07728
    stance: supports
    note: >-
      Validated by: Average accuracy over 20 frame problems x 10 trials:
      mixed GPT+Llama 99%, GPT-only 90%, Llama-only 79%, Qwen-only 69%;
      error traces attribute GPT failures to translation/mapping agents and
      Llama failures to planning/node reasoning agents.. Measured on one
      narrow task family (rectangular 2D frames) with one prompt set,
      comparing four backbone configurations at 10 trials each; [truncated]
