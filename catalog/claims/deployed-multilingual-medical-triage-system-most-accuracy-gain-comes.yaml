id: deployed-multilingual-medical-triage-system-most-accuracy-gain-comes
ref: CLM-0376
capability: procedure-following
technique: externalize-expert-decision-tree-into-clinician-editable-rule
statement: >-
  In a deployed multilingual medical triage system, most of the accuracy
  gain comes from writing the clinicians' implicit decision tree into an
  explicit scoped rule set rather than from moving the final decision out of
  the LLM: replacing a flat danger-sign list with 231 structured rules in
  the same end-to-end prompt raised recall from 0.565 to 0.837 and F1 from
  0.606 to 0.689, while further handing the decision to a deterministic rule
  engine over LLM-extracted symptoms left accuracy statistically unchanged
  (recall 0.810, F1 0.702).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Short, code-switched WhatsApp maternal/newborn queries in seven Indian languages, 427 held-out test queries, Gemini-2.5-Flash, labels from the organisation's own clinical protocol."
sources:
  - source: arxiv-2609-09356
    stance: supports
    note: >-
      Validated by: Stepwise ablation of four systems on 427 held-out
      queries with stratified bootstrap CIs; full decomposition matched the
      rules-in-prompt variant on recall and F1 (overlapping intervals) at
      1.5x cost, plus deployment over 152,421 queries with 17.8%
      over-escalation and no reported rise in missed emergencies.. Measured
      on one organisation's 427-query test set (147 emergencies), single
      LLM, labels from in-house clinicians with 83% raw agreement.
      Run-to-run variance checked on validation and small relative to
      architecture differences. [truncated]
contested: false
status: pending-review
