notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An ablation on
  comparable triage data where supplying the explicit rule set inside the
  prompt gives little or no gain over a flat danger-sign list, while moving
  the decision into a deterministic engine produces the bulk of the accuracy
  improvement. Drafted stance toward
  many-failures-come-from-not-following-domain-policy: supports -- The
  baseline's errors came from the model reasoning from its own
  training-shaped priors because the clinical decision policy was never
  given to it.
