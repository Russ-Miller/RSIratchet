id: rl-post-training-8b-vision-language-models-vision-to-code-tasks-chart-to-code-table-to-markdown
ref: CLM-1017
capability: reward-hacking
technique: reward-rendered-image-discrepancies-enumerated-judge
statement: >-
  In RL post-training of 8B vision-language models on vision-to-code tasks
  (chart-to-code, table-to-markdown, SVG-to-code), rewards computed on the
  emitted text (TEDS, edit distance) or on vision-encoder embedding
  similarity (DINO) rise during training while rendered-output quality
  stagnates or falls below the SFT baseline, because neither signal
  penalizes element-level discrepancies in the rendered image; a generative
  reward model that enumerates per-element discrepancies in rendered space
  keeps improving downstream scores.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "8B-class LVLM policies (Qwen3-VL-8B-Instruct, VinciCoder-8B-SFT) trained with GRPO on chart, table and SVG vision-to-code tasks where output can be rendered back to an image"
