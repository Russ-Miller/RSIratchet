    stance: supports
    note: >-
      Validated by: GRPO runs on three tasks against DINO- and TEDS-reward
      baselines and the SFT policy: +8.4 avg on ChartMimic, +2.7 on
      table-to-markdown benchmarks, +4.1 on UniSVG; reward-model quality
      measured on a new 1,335-instance image-pair discrepancy benchmark
      (VC-RewardBench) scored by LLM-as-judge F1 and severity correlation,
      where the 8B model beats Qwen3-VL-235B-Instruct.. Measured on three
      task families with two policy backbones against DINO and TEDS reward
      baselines; training curves plus downstream benchmarks support the
      hacking claim. [truncated]
