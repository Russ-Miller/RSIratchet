statement: >-
  For a 2B vision-language-action manipulation model, including embodied
  interaction logs and driving-scene data in the VLM's initial large-scale
  pretraining mix, rather than adapting a purely web-pretrained VLM
  afterwards, yields higher real-robot task success across four arm
  platforms than 3-4B baselines built by post-hoc adaptation.
