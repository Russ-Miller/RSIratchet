id: cuda-kernel-module-optimization-tasks-scored-against-human-expert-reference
ref: CLM-0830
capability: domain-knowledge
technique: score-generated-cuda-against-expert-kernels-naive-baselines
statement: >-
  On CUDA kernel and module optimization tasks scored against human-expert
  reference implementations rather than naive baselines, frontier models
  (GPT-5.4, Claude-Opus-4.6) reach high compile and correctness rates while
  their generated kernels run far slower than the expert reference (best
  mean expert-relative speed 0.46x, with few tasks reaching even half expert
  speed), so correctness rates do not indicate architecture-aware
  optimization ability.
kind: observation
backing_strength: single-paper
observed_on:
  era: "195 tasks across Ampere, Hopper and Blackwell GPUs spanning ML, HPC, cryptography, compression and graph workloads; expert references drawn from SOTA systems such as CUTLASS and Fl"
sources:
  - source: arxiv-2605-08467
    stance: supports
    note: >-
      Validated by: Applied to four models and two agentic frameworks;
      separates compile rate, pass rate, semantic validity and
      expert-relative speed, showing high pass rates coexisting with
      sub-0.5x speed and with Kevin32B (RL-tuned on KernelBench) scoring
      near zero.. Measured on released benchmark: Class 1 (20 general tasks)
      and Class 2 (43 general tasks) plus architecture subsets; four models,
      three settings. Small per-bucket task counts make individual
      percentages noisy, and expert references differ in provenance across
      domains. [truncated]
