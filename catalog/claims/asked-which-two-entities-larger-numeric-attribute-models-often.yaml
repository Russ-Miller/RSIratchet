id: asked-which-two-entities-larger-numeric-attribute-models-often
ref: CLM-0292
capability: factual-recall
statement: >-
  Asked which of two entities is larger on a numeric attribute, models often
  contradict numbers they can state correctly, following entity popularity,
  mention order and co-occurrence instead; for 7-8B models a logistic
  regression on those three surface cues predicts the model's choice better
  than the model's own numeric recall does, while 32B models selectively use
  the numbers when they are reliable.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Entity comparison on numeric attributes with ground truth, 7-8B and 32B open models, 2025."
sources:
  - source: arxiv-2510-16815
    stance: supports
    note: >-
      Clean task with ground truth; the scale-dependent switch from
      heuristic to knowledge is the durable finding.
