    stance: supports
    note: >-
      Validated by: CHAIR_I object-hallucination rate on four 7B backbones
      (up to 21.3% reduction) with descriptive and general multimodal scores
      reported as largely preserved or improved; extended to 11 models from
      six families up to 32B; 1.33% average added per-token latency;
      ablations show rank-derived suppression strengths unchanged under
      position-wise rescaling while probability-derived ones shift, and
      token-specific medians cut held-out calibration error ~92% versus a
      global reference and beat all 1,000 random token-to-reference
      reassignments.. [truncated]
