id: 7b-32b-vision-language-models-pooling-logit-lens-readouts-visual-token-positions-vocabulary
ref: CLM-0348
capability: visual-grounding
technique: penalize-tokens-whose-rank-based-visual-evidence-falls
statement: >-
  In 7B-32B vision-language models, pooling logit-lens readouts from
  visual-token positions by vocabulary rank rather than probability
  magnitude gives a comparable cross-position evidence signal, and comparing
  a candidate token's pooled rank evidence against that token's own
  calibrated baseline (rather than one global threshold) supports a decoding
  penalty that lowers object-hallucination rates.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Open vision-language models where visual-token hidden states and the output head are accessible; requires a one-time offline calibration on unlabeled images; demonstrated on 7B-32B"
sources:
