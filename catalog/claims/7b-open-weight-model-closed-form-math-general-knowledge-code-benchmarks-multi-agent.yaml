id: 7b-open-weight-model-closed-form-math-general-knowledge-code-benchmarks-multi-agent
ref: CLM-0980
capability: multi-model-coordination
statement: >-
  For a 7B open-weight model on closed-form math, general-knowledge and code
  benchmarks, multi-agent workflows (plan-and-execute, reflection,
  interactive debate, adversarial debate) give task-dependent gains over
  direct single-pass generation but little or negative gain once the same
  model's own chain-of-thought mode is enabled, with adversarial debate the
  worst and most token-expensive of the four.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One 7B model (Pangu-7B), zero-shot, nine closed-form benchmarks, four hand-specified MAS workflows, all agents instantiated from the same base model"
sources:
  - source: arxiv-2601-13243
    stance: supports
    note: >-
      Measured: single-model no_think vs auto_think vs four MAS workflows,
      accuracy plus token cost, on GSM-Hard, ARC-Challenge and HumanEval for
      the MAS comparison. CoT-plus-MAS was evaluated on only one workflow
      per task (three cells), so the diminishing-returns part rests on thin
      evidence. Single model family, single backbone; no confidence
      intervals or repeated runs reported.
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On the same benchmarks and
  backbone, MAS workflows layered on a CoT-enabled single model yield
  consistent accuracy gains across tasks, or adversarial debate matches
  reflection on both cost and accuracy.
