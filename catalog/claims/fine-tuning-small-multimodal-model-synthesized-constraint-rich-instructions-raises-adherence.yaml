id: fine-tuning-small-multimodal-model-synthesized-constraint-rich-instructions-raises-adherence
ref: CLM-0051
capability: procedure-following
statement: >-
  Fine-tuning a small multimodal model on synthesized constraint-rich
  instructions raises adherence to output-level constraints (format, word
  count, keywords) while lowering accuracy on perception-grounded
  instructions, so the average can fall below the base model unless the
  synthesis loop tracks per-constraint failures and image compatibility.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3.5-4B target model fine-tuned on ~15k synthesized samples, evaluated on MM-IFEval C-Level vs P-Level splits"
sources:
  - source: arxiv-2608-26013
    stance: supports
    note: >-
      One ablation table on one benchmark with one 4B backbone: static
      pipeline moved C-Level from 62.7 to 64.9 while P-Level fell from 55.0
      to 46.0, and adding reflection plus memory recovered P-Level to 54.0.
      Single seed, no variance reported; P-Level has only 100 items, so the
      trade-off size is loosely estimated.
contested: false
status: pending-review
