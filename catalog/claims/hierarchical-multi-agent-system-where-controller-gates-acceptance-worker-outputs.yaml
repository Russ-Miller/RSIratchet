id: hierarchical-multi-agent-system-where-controller-gates-acceptance-worker-outputs
ref: CLM-0623
capability: multi-model-coordination
technique: gate-worker-outputs-semantic-entropy-plus-density
statement: >-
  In a hierarchical multi-agent system where a controller gates acceptance
  of worker outputs on semantic entropy and semantic density computed over
  resampled completions, the intervention helps only where failures come
  from semantic instability (vague or contradictory outputs) and hurts where
  they come from evidence selection or reasoning-chain errors \u2014 gaining
  on ambiguity/hallucination-prone benchmarks while losing 10-14 points on
  multi-hop QA.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Hierarchical controller-plus-worker systems with small local workers (3-8B) and a frontier controller; benchmark subsets of 100-500 items, mostly single runs."
sources:
  - source: arxiv-2608-14707
    stance: supports
    note: >-
      Validated by: Accuracy against the same system with metrics disabled
      across nine benchmarks: StrategyQA 78% vs 70%, TruthfulQA 41% vs 19%,
      JailbreakBench 61% vs 25%, but MuSiQue 45% vs 55% and HotpotQA 54% vs
      68%; metric-isolation ablation showed either metric alone fell below
      the no-metric baseline.. Measured on nine benchmarks with bootstrapped
      intervals, but subsets of 100-500 items, mostly one seed, one base
      architecture; the failure-mode attribution rests on trace inspection
      rather than a controlled manipulation of failure type.
