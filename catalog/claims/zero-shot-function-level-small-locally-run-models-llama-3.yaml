id: zero-shot-function-level-small-locally-run-models-llama-3
ref: CLM-0328
capability: error-detection
statement: >-
  Zero-shot, at function level, small locally run models (Llama 3.2,
  Mistral) identify 43-45% of 349 real Python bugs from BugsInPy, well above
  a sub-5% keyword baseline, but with accuracy ranging from 0% to 100% by
  project and lowest (about 22%) on bugs that span several components, so
  detection is real but shallow and codebase-dependent.
