      CS/CI down 6.43 points avg, MMHal-Bench score +0.16 and hallucination
      rate -2.95%, against VCD, OPERA, PAI and VTI baselines; MME held or
      improved; latency TTFT/TPOT ~1.0x base vs 1.6-2.7x for VCD/PAI.
      Measured on five benchmarks and three to five LVLMs with four
      training-free baselines. [truncated]
