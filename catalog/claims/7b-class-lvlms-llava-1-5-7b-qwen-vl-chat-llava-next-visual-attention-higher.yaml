id: 7b-class-lvlms-llava-1-5-7b-qwen-vl-chat-llava-next-visual-attention-higher
ref: CLM-0806
capability: visual-grounding
technique: steer-caption-sensitive-attention-heads-caption-minus-noncaption
statement: >-
  In 7B-class LVLMs (LLaVA-1.5-7B, Qwen-VL-Chat, LLaVA-NeXT), visual
  attention is higher under caption queries than under non-caption queries
  at mid-layer attention heads, and adding the precomputed
  caption-minus-non-caption attention-output shift vector to the top-K of
  those heads at inference lowers object-hallucination rates on POPE, CHAIR
  and MMHal-Bench without the inference-latency cost of contrastive
  decoding.
kind: mechanism
backing_strength: single-paper
