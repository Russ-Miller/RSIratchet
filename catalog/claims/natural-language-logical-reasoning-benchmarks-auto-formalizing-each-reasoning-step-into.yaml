id: natural-language-logical-reasoning-benchmarks-auto-formalizing-each-reasoning-step-into
ref: CLM-0389
capability: multi-step-reasoning
technique: verify-each-reasoning-step-solver-backtrack-failure
statement: >-
  On natural-language logical reasoning benchmarks, auto-formalizing each
  reasoning step into SMT-LIB and regenerating from the first step the
  solver cannot verify raises both the share of solver-verified steps and
  final-answer accuracy over plain chain-of-thought, and greedy regeneration
  at the failure point beats beam search or MCTS on step verifiability.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Eight NL logic/entailment benchmarks (FOLIO, e-SNLI, LogiQA, ProntoQA, ProofWriter, QASC, SARA, SemEval) across seven models, 7B to frontier; tasks must be close enough to formal l"
sources:
  - source: arxiv-2609-21492
    stance: supports
    note: >-
      Validated by: Compared against vanilla CoT on 168 benchmark-metric
      cells across 8 datasets and 7 models, improving in 133; unverified
      step ratio and verification-weighted accuracy reported per cell; also
      compared against LogicReward (OA 0.4338 to 0.5765) and against beam
      search and MCTS variants on SARA.. Measured on eight benchmarks and
      seven models against a vanilla CoT baseline only; no matched-compute
      baseline, so part of the gain may come from extra generation attempts
      rather than from solver signal. [truncated]
