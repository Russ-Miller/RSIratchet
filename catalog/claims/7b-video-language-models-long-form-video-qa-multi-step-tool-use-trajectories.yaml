id: 7b-video-language-models-long-form-video-qa-multi-step-tool-use-trajectories
ref: CLM-1011
capability: video-temporal-reasoning
technique: synthesize-tool-trajectories-caption-space-then-swap-captions
statement: >-
  For 7B video-language models on long-form video QA, multi-step tool-use
  trajectories can be synthesized without any long-video-capable teacher by
  having a text LLM reason over frame captions and then swapping the
  captions for the actual frames before fine-tuning, and the resulting
  agentic model gains on videos over ~15 minutes while matching its own
  untrained backbone on clips under 2 minutes.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-VL-7B trained on 10k CG-Bench multiple-choice items with trajectories from Qwen3-235B; evaluated on MLVU, LVBench, VideoMME-long, LongVideoBench with <=64 frames"
sources:
  - source: arxiv-2601-15724
    stance: supports
    note: >-
      Validated by: Accuracy on MLVU (48.0 to 54.8), LVBench (38.3 to 48.9),
      VideoMME-long (50.0 to 53.7) and LongVideoBench (56.7 to 59.7) against
      the untrained Qwen2.5-VL-7B backbone, and +3.0-3.9 over a Qwen-235B
      caption-only language agent given the same tools; duration-split
      ablation shows parity under 2 minutes and +3.7/+5.6 points over 15
      minutes.. Measured on four long-video benchmarks against the same
      backbone and against a caption-only language agent with identical
      tools. [truncated]
