id: lvlms-asked-describe-people-llava-instructblip-shikra-masking-attention
ref: CLM-0369
capability: visual-grounding
technique: mask-language-only-self-attention-keep-vision-to
statement: >-
  In LVLMs asked to describe people (LLaVA, InstructBLIP, Shikra), masking
  attention so that text tokens read visual tokens but language-only
  self-attention is suppressed in late decoder layers lowers gender
  misattribution while keeping answer coverage high, whereas visual-only or
  language-only masking scores well on the bias metric only because the
  model names a gender in under 10% of cases.
kind: mechanism
backing_strength: single-paper
