  era: "Training-free inference-time masking on three open LVLMs; gender attribution judged by keyword matching on FACET, MS COCO and FairFace, with outputs that name no gender excluded fr"
sources:
  - source: arxiv-2609-16647
    stance: supports
    note: >-
      Validated by: Gender bias score on FACET (0.9274 to 0.9928 for LLaVA),
      MS COCO (0.6708 to 0.9978), FairFace (0.5988 to 0.8782 for Shikra),
      against six prior debiasing baselines; POPE accuracy and MMMU score
      held near baseline (LLaVA 82.63 to 83.06 POPE, 32.4 to 31.8 MMMU);
      coverage per attention mode reported (V2L 95.8% vs visual-only 9.3%,
      language-only 4.9%, L2V 0.2%).. Measured on three LVLMs and three
      person-attribute benchmarks with per-mode coverage reported, plus
      POPE/MMMU capability checks and a layer-group grid search. [truncated]
