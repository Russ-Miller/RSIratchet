id: agent-builds-whole-python-repository-natural-language-requirements-letting-llm
ref: CLM-0357
capability: software-architecture
technique: evolve-component-boundaries-until-modularity-metrics-converge
statement: >-
  When an agent builds a whole Python repository from natural-language
  requirements, letting the LLM freely decide when to split or merge
  components over a fixed budget of rounds over-decomposes the architecture
  and lowers downstream coverage and test pass rate, whereas triggering
  splits and merges from explicit cohesion and coupling thresholds and
  stopping when no action fires does better than both no evolution and the
  budgeted LLM-decided variants.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Six real-world Python repositories from RepoCraft generated from high-level requirements, with GPT-5 mini and DeepSeek V3.2 backbones and an identical downstream TDD code-generatio"
sources:
