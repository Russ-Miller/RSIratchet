    stance: supports
    note: >-
      Validated by: Functionality Coverage, Pass Rate and Voting Rate on
      three representative RepoCraft repositories against mini-SWE-agent,
      Paper2Code and RPG with a shared code-generation scaffold; on
      statsmodels with GPT-5 mini the metrics-guided loop beat no-evolution
      (coverage 75.90 to 80.68, pass 81.90 to 85.51) and all 1/3/5-round
      LLM-decided variants; ablation removing structural evolution cost up
      to 13.33 pass-rate points.. Measured on three of six repositories
      reported in the main table (plus ablations on the same three), two
      backbones, three runs averaged; [truncated]
