id: llm-generated-hls-fpga-kernel-code-evolutionary-search-over-simulation-screened
ref: CLM-0422
capability: code-generation
technique: evolve-hls-kernels-under-simulation-then-repair-against
statement: >-
  For LLM-generated HLS (FPGA kernel) code, evolutionary search over
  simulation-screened candidates and C/C++-level functional
  verification-and-repair fix different failure modes — search raises
  synthesizable and board-executable rates while functional reflection
  raises output correctness with little effect on synthesizability — so
  neither alone reaches the end-to-end success of both together.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "78 HLS-Eval tasks compiled with Vitis HLS 2022.2 and run on a Xilinx U200 board; ablation run on one backbone (Qwen3-Coder-30B-A3B), main results on five models"
sources:
  - source: arxiv-2608-23630
    stance: supports
    note: >-
      Validated by: Against zero-shot pass@10 on 78 HLS-Eval tasks across
      five models: +16.9 points synthesizable, +26.7 executable, +30.6
      functionally correct on average; ablation on Qwen3-Coder gives base
      59.0/47.4/37.2, search-only 80.1/66.7/48.7, reflection-only
      57.7/50.0/46.2, full 83.3/75.6/66.7.. Measured on one benchmark (78
      tasks) with one ablation backbone and no repeated runs; zero-shot
      baseline uses pass@10 while the full system reports a single outcome,
      so compute is not matched. Authors flag single-benchmark reliance
      themselves.
