id: 7b-class-lvlms-llava-1-5-7b-minigpt-4-mplug-owl2-estimating-hallucination-direction
ref: CLM-0802
capability: visual-grounding
technique: edit-only-weights-aligned-faithful-orthogonal-hallucination-residual
statement: >-
  In 7B-class LVLMs (LLaVA-1.5-7B, MiniGPT-4, mPLUG-Owl2), estimating the
  hallucination direction as the component of hallucinated-response hidden
  states orthogonal to the faithful-response subspace, and
  null-space-projecting only the top-K weight rows most cosine-aligned with
  it, lowers CHAIR object-hallucination rates further than whole-layer
  null-space editing while leaving the PCA distribution of hidden
  representations closer to the unedited model.
