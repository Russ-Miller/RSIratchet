id: interactive-detective-game-environments-where-clues-discovered-progressively-frontier-llms
ref: CLM-0924
capability: long-term-memory
statement: >-
  In interactive detective-game environments where clues are discovered
  progressively, frontier LLMs unlock most of the available memory fragments
  (over 80% MFU for several closed-source in-context models) while correctly
  ordering far fewer of them on the gold timeline (15.91-45.46% MFCO), so
  fragment-discovery rate does not indicate ability to reconstruct temporal
  relations among remembered fragments.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-based gamified interactive scenarios with graph-structured clue dependencies; measured on one detective visual-novel environment with 54 dialogue fragments and a 600-step inte"
sources:
  - source: arxiv-2604-14158
    stance: supports
    note: >-
      Measured across four closed-source and one open-source model, each
      with in-context and two memory-agent configurations, on three games;
      the temporal claim rests on a single environment and one run per
      configuration, with no variance reported, and the QA score is graded
      by LLM evaluators.
contested: false
status: pending-review
last_checked_at: 2026-11-07
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  fragment-unlock rate and temporal-ordering accuracy track each other
  closely across these or comparable interactive environments, or a showing
  that the low MFCO stems from the ordering metric/interface rather than the
  model's temporal reasoning.
