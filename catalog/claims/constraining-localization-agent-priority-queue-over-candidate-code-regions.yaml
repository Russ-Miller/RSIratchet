id: constraining-localization-agent-priority-queue-over-candidate-code-regions
ref: CLM-0263
capability: repository-navigation
technique: priority-scheduled-search-distance-aware-context-pruning
statement: >-
  Constraining a localization agent with a priority queue over candidate
  code regions scored for relevance, decomposition of each search action,
  and pruning of context by distance from the issue's anchors reached a 65%
  function-level match rate on SWE-bench Lite, the best open-source result
  at the time, and feeding its locations to an open-source repair pipeline
  raised the resolved rate by about 6 points.
kind: observation
backing_strength: single-paper
observed_on:
  era: "SWE-bench Lite, 2025, function match rate against ground-truth patches; integration test with one open-source framework."
sources:
  - source: arxiv-2502-00350
    stance: supports
    note: >-
      Validated by: Function, file and class match rates on SWE-bench Lite
      against prior open-source localizers, with ablations removing
      scheduling, decomposition and pruning; downstream resolved-rate change
      when its output replaces the baseline's localization.. One benchmark;
      ablations are present. The match-rate metric rewards finding the
      patched function but not knowing when to stop, so a broad candidate
      set can score well.
