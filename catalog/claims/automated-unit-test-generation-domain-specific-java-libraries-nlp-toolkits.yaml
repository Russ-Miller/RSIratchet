id: automated-unit-test-generation-domain-specific-java-libraries-nlp-toolkits
ref: CLM-0346
capability: code-generation
technique: inject-self-refined-llm-test-snippets-search-stalls
statement: >-
  For automated unit test generation on domain-specific Java libraries (NLP
  toolkits), injecting LLM-written test snippets into a search-based
  generator's population when the evolutionary search stagnates yields
  higher branch and line coverage than either the search tool alone or the
  LLM alone, with the LLM contributing object-construction sequences and
  domain-shaped string inputs that random search does not reach.
