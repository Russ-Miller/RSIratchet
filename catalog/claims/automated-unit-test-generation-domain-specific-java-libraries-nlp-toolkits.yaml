id: automated-unit-test-generation-domain-specific-java-libraries-nlp-toolkits
ref: CLM-0335
capability: code-generation
technique: inject-llm-test-snippets-search-based-testing-stagnates
statement: >-
  For automated unit test generation on domain-specific Java libraries (NLP
  toolkits) where inputs must satisfy linguistic and structural constraints,
  injecting LLM-written test snippets into a search-based generator's
  population when the search stagnates produces higher branch and line
  coverage than either the search tool alone or the LLM alone, but the gain
  in mutation score is much smaller because assertions still come from the
  search tool.
kind: mechanism
backing_strength: single-paper
