      53.33% (EvoSuite), 32.64% (LLM-only); Wilcoxon p<<0.05, A12 0.72-0.85;
      mutation score 63.0% vs 52.0/58.0/38.26. Ablations show class-level
      context, self-refinement, and repeated calls each contribute;
      LLM-generated strings alone gave -1.4%.. Measured: 100 classes, 5 runs
      each, three baselines including a re-implemented CodaMOSA, with
