      LLM-only; line coverage 73.49% vs 65.62/57.50/43.00; mutation score
      63.0% vs 52.0/58.0/38.26. Wilcoxon signed-rank p<0.05, A12 0.72-0.85
      for coverage but only 0.57-0.64 for mutation. Ablations: zero-shot
      prompting, method-level context, single LLM call, MOSA instead of
