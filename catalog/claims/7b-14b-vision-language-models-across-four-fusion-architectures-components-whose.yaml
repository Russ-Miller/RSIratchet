    stance: supports
    note: >-
      Validated by: On a held-out 400-sample POPE-adversarial set with
      hyperparameters picked on a disjoint 100-sample selection set: 40-76%
      relative hallucination reduction at under 2pp accuracy cost across
      five models; random-component suppression at the same factor gave no
      reduction (and slightly raised hallucination, up to +7.2pp); scaling
      the grounding pathway to zero collapsed accuracy to chance; ITI and
      mean-difference projection on the same components were weaker or
      ineffective.. [truncated]
