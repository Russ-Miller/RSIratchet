id: 7b-14b-vision-language-models-across-four-fusion-architectures-components-whose
ref: CLM-0794
capability: visual-grounding
technique: scale-down-hallucination-pathway-components-found-patching
statement: >-
  In 7B-14B vision-language models across four fusion architectures, the
  components whose causal contribution is highest on correct
  object-existence answers do not stop carrying visual evidence when the
  model hallucinates — their indirect effect flips sign, aligning with the
  hallucinated answer rather than the ground truth, while their
  within-pathway redundancy persists — so object hallucination is grounding
  representations entrained to a non-visual prior rather than missing visual
  evidence.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Object-existence (binary yes/no) hallucination on POPE-adversarial; five VLMs of 7B-14B with embed-concat, projector-concat, ViT-MLP-LLM and cross-attention fusion; does not hold f"
sources:
