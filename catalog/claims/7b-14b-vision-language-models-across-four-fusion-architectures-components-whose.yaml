  indirect effects on hallucinating samples in these or similar VLMs and
  finding grounding-pathway effects stay positive (or shift inconsistently
  in sign across models), or finding that suppressing the identified
  hallucination-pathway components does no better than random components
  matched for count and scale. Drafted stance toward
  7-13b-open-vision-language-models-object-hallucination-explained-weak-visual:
  contests -- Both findings say hallucination is not a shortage of visual
  attention/evidence, but this paper locates the failure in a sign flip of
  the grounding components' causal effect rather than in a mismatch between
  attended visual tokens and the generated word.
