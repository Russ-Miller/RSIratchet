id: agent-pipelines-generate-whole-domain-specific-ml-codebases-medical-imaging
ref: CLM-0018
capability: code-generation
statement: >-
  In agent pipelines that generate whole domain-specific ML codebases
  (medical imaging) from scratch, execution/assembly validation and domain
  knowledge bases fix different failures: removing runtime and assembly
  testing mainly costs autonomy (more human interventions to debug), while
  removing the curated domain knowledge base mainly costs output quality
  (syntactically fine but domain-inappropriate pipelines) with little change
  in intervention count.
