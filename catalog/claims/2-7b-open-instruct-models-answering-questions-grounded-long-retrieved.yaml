id: 2-7b-open-instruct-models-answering-questions-grounded-long-retrieved
ref: CLM-0954
capability: hallucination
technique: fine-tune-staged-answerability-rationales-answers-alone
statement: >-
  For 2-7B open instruct models answering questions grounded in long
  retrieved passages (ESG reports, HaluEval, BioASQ), fine-tuning on answers
  alone is not reliably better than no fine-tuning at avoiding unsupported
  answers, while fine-tuning on staged rationales that first name the
  queried topic, locate relevant passage text, and then judge answerability
  raises balanced accuracy over both.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2-7B LLaMA/Gemma/Mistral instruct models; document-grounded QA test sets balanced between answerable and unanswerable items; rationale steps supplied from human answerability label"
sources:
  - source: arxiv-2603-13154
    stance: supports
    note: >-
      Validated by: Balanced accuracy and F1 on 300-400-item balanced test
      splits of ESG-Bench, HaluEval and BioASQ against no-fine-tuning and
      answer-only SFT baselines across three backbones; 4-step CoT best in 8
      of 9 dataset-model cells (e.g. ESG-Bench Gemma 63.3 SFT vs 92.0;
      BioASQ Gemma 74.5 vs 99.5), while answer-only SFT fell below no
      fine-tuning in several cells.. Measured across 3 backbones x 3
      datasets x 4 training settings, with WA/WoA accuracy reported
      separately so abstention is not hidden. [truncated]
