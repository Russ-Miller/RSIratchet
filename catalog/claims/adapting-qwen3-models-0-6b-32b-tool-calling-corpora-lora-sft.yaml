id: adapting-qwen3-models-0-6b-32b-tool-calling-corpora-lora-sft
ref: CLM-0333
capability: tool-use
technique: tool-use-fine-tuning
statement: >-
  For adapting Qwen3 models (0.6B-32B) to tool-calling corpora, LoRA SFT
  gives the best in-distribution exact-match accuracy in 15 of 18
  model-by-dataset settings and never falls below zero-shot, while GRPO wins
  slightly more often on cross-dataset transfer (29 of 54) by under a point
  on average, and SFT followed by GRPO on a split data budget is rarely best
  at either.
kind: observation
