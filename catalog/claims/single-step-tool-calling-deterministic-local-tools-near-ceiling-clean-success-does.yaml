id: single-step-tool-calling-deterministic-local-tools-near-ceiling-clean-success-does
ref: CLM-0485
capability: tool-use
technique: stage-aligned-perturbation-cascade-aware-failure-attribution
statement: >-
  In single-step tool-calling with deterministic local tools, near-ceiling
  clean success does not predict robustness: perturbing the returned tool
  output or observation (structure noise, evidence loss, corruption,
  competing evidence) degrades end-to-end success far more than perturbing
  tool names/descriptions or the user request, and no tested model stayed
  above 0.60 under observation perturbation despite ~0.98 average clean
  success.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-step calls against 16 sampled deterministic local tools; 7 frontier models; four perturbation families at light/medium/heavy severity; no long-horizon or multi-turn dependen"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage recovered
      71/98 failed instances (100% single-fault, 82.1% cascade, 0%
      multi-fault); human audit on 30 ambiguous cases gave 74.2% agreement;
      label-guided interventions worked as predicted (A-family alias fix
      21/30 to 30/30; B-family S3 CoT 21/30 unchanged).. Measured on 15,456
      single-family records (48 seeds x 14 subtypes x 3 severities x 7
      models) with deterministic scoring; family averages 0.918 interface,
      0.773 intent, 0.688 runtime, 0.455 observation. [truncated]
