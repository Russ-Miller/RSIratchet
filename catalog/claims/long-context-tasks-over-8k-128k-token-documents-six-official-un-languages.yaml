id: long-context-tasks-over-8k-128k-token-documents-six-official-un-languages
ref: CLM-0554
capability: long-context-degradation
statement: >-
  On long-context tasks over 8K-128K-token documents in the six official UN
  languages, models answer word-level span questions well (about 73% average
  accuracy across 12 models) but degrade sharply as the required unit
  coarsens to sentence selection (about 21%), paragraph filling and
  document-level summarization and translation, so long-context competence
  measured by needle-style word retrieval overstates comprehension of larger
  discourse units.
kind: observation
backing_strength: single-paper
observed_on:
  era: "UN report documents 8K-128K tokens, six languages, zero-shot, 12 long-context LLMs; coarse-grained tasks scored with ROUGE-L/BLEU, which are themselves weak proxies."
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured across 12 open and proprietary models on 420 query-response
      pairs per task per language; the gap is large but confounded by metric
      change between granularities (accuracy vs ROUGE-L vs BLEU), which the
      design does not isolate.
contested: false
status: pending-review
last_checked_at: 2026-10-21
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model family scoring
  near its word-level accuracy on the sentence-cloze and paragraph-filling
  tasks of the same benchmark, or showing that the coarse-grained gap
  disappears under reference-free judging rather than ROUGE-L/BLEU.
