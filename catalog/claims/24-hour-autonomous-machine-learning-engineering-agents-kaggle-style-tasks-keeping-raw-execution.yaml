id: 24-hour-autonomous-machine-learning-engineering-agents-kaggle-style-tasks-keeping-raw-execution
ref: CLM-0955
capability: long-horizon-execution
technique: tier-context-how-stable-promote-across-tiers
statement: >-
  For 24-hour autonomous machine-learning-engineering agents on Kaggle-style
  tasks, keeping raw execution traces only for the currently active
  exploration phase, compressing each completed phase into a short knowledge
  summary, and distilling finished tasks into retrievable cross-task wisdom
  raises the medal rate over appending all interaction history, with peak
  context falling from over 200k to roughly 70k tokens on one task.
kind: observation
backing_strength: single-paper
observed_on:
  era: "MLE-Bench with a DeepSeek-V3.2 backbone, 24-hour budget, prior wisdom warm-started from 407 external Kaggle competitions; ablations run on MLE-Bench-Lite with a single seed per con"
sources:
  - source: arxiv-2601-10402
    stance: supports
    note: >-
      Validated by: MLE-Bench medal rate 56.4% averaged over 3 seeds vs
      29.3% for the prior version of the same system and 50.7% for the best
      reported baseline; single-seed MLE-Bench-Lite ablations dropping each
      tier (no phase summaries: medal 59.1 vs 72.7; no cross-task wisdom:
      54.5; no raw traces: 22.7); one context-length trace showing peak
      tokens cut from >200k to ~70k.. Main result is 3 seeds on 75 MLE-Bench
      tasks against published baselines run with different backbones, so
      backbone and harness are confounded with the architecture. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An agent run with the same
  backbone, budget and warm-up corpus that appends full interaction history
  scores at or above the tiered version on MLE-Bench medal rate, or
  multi-seed ablations show the phase-summary and wisdom tiers make no
  difference. Drafted stance toward
  tiered-memory-system-managed-by-model-itself-sustains: supports -- It is
  another instance of a model-managed tiered memory sustaining work far
  beyond the context window, here on multi-hour engineering tasks rather
  than conversation.
