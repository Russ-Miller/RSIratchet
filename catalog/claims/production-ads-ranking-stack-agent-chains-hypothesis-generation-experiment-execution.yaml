id: production-ads-ranking-stack-agent-chains-hypothesis-generation-experiment-execution
ref: CLM-0335
capability: harness-self-improvement
statement: >-
  In a production ads-ranking stack, an agent that chains hypothesis
  generation, experiment execution, result analysis and a shared knowledge
  store, with human checkpoints at stage boundaries, delivered several times
  the completed ML iterations per engineer-week of the manual baseline and a
  2.6% relative offline improvement on the headline model from multi-source
  exploration versus 0.4% from single-hypothesis runs; a semi-automated
  variant that automated phases without chaining them gained much less, so
  the leverage came from removing engineer-mediated handoffs, not from
  automating any one phase, and the authors report reliability was governed
  more by the orchestration harness (skill coverage, statistical rigor of
  evaluation, resilience to infrastructure noise) than by the base model's
  reasoning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Industrial ads-ranking model portfolio, 2026, one evaluation window; developer-reported; throughput multiple stated qualitatively as 'multiple times'; five recurring failure modes "
