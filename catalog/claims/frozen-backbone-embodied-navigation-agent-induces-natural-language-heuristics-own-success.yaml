id: frozen-backbone-embodied-navigation-agent-induces-natural-language-heuristics-own-success
ref: CLM-0836
capability: harness-self-improvement
technique: induce-transferable-navigation-heuristics-own-trajectories
statement: >-
  For a frozen-backbone embodied navigation agent that induces
  natural-language heuristics from its own success and failure trajectories,
  heuristics induced on one set of scenes transfer to disjoint unseen scenes
  better than hand-written heuristics (IGNav 48.61% vs 38.89% SR over a
  34.72% no-heuristic baseline), but continuing to rewrite them online on
  the limited unseen episodes scores below leaving the transferred set
  fixed.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-VL-72B planner with a video world model on Habitat image-goal navigation, active recognition and embodied QA; seen/unseen split of the same evaluation set; one unseen-split"
sources:
  - source: arxiv-2605-18729
    stance: supports
    note: >-
      Validated by: Success rate, SPL and mean trajectory length on IGNav,
      AR and AEQA against a no-heuristic Basic Pipeline, hand-written
      heuristics, and transferred-plus-online-update variants, on a held-out
      unseen scene split.. Measured on one benchmark suite with one
      backbone; the unseen-split table reports single runs per cell with no
      variance or seed reporting, and the gains over the Basic Pipeline on
      AR and AEQA are small relative to the IGNav gain. The round-wise
      figure is described by the authors as a case study.
contested: false
status: pending-review
last_checked_at: 2026-11-06
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On a comparable unseen
  split with matched inference budget, hand-written heuristics match or beat
  induced ones, or continued online updating of transferred heuristics beats
  the fixed transferred set.
