id: embodied-multi-agent-household-planning-fixed-high-level-skill-interface-team
ref: CLM-0584
capability: multi-model-coordination
technique: score-coordination-constructs-separately-task-success
statement: >-
  In embodied multi-agent household planning with a fixed high-level skill
  interface, a team's task success rate overstates coordination quality,
  because goal predicates can be reached through illegal shortcuts: several
  of 11 tested MLLMs succeed on more episodes than they produce legal plans
  on (Claude Haiku 4.5 63.1% success vs 47.2% legal; Qwen3.6-Plus 69.1% vs
  56.7%), while others honour constraints yet miss the goal.
kind: observation
backing_strength: single-paper
observed_on:
  era: "897 oracle-validated AI2-THOR household instances, 2-4 agents, four coordination constructs (allocation, ordering, mutual exclusion, handoff), centralized image-observation protoco"
sources:
  - source: arxiv-2608-28266
    stance: supports
    note: >-
      Validated by: Cross-applying all four scoring functions to 897
      GPT-5.6-sol trajectories gave off-diagonal Pearson correlations within
      [-0.10, 0.16], indicating the four scores are largely non-redundant
      and not a re-encoding of binary success; per-model success and
      legality rates diverge in both directions.. Measured on 897 instances
      across 11 models, plus a 240-instance balanced subset for
      architecture, observation and team-size ablations. Construct scores
      are hand-designed formulas calibrated so oracle trajectories score
      near ceiling; [truncated]
