id: mobile-gui-world-modeling-having-vlm-predict-next-screen
ref: CLM-1191
capability: state-tracking
technique: predict-next-gui-state-renderable-web-code
statement: >-
  For mobile GUI world modeling, having a VLM predict the next screen as
  executable web code that is then rendered yields higher action-conditioned
  next-state correctness than text-image-to-image generation models, because
  pixel generators exploit the high frame-to-frame redundancy of GUIs by
  near-copying the current screen rather than applying the transition.
kind: mechanism
backing_strength: single-paper
