  era: "Mobile GUI screens with coordinate-space actions, evaluated on six benchmarks (four in-distribution from AitW/GUIOdyssey/AndroidControl/AMEX, two held-out); 8B and 32B Qwen3-VL fin"
sources:
  - source: arxiv-2602-01576
    stance: supports
    note: >-
      Validated by: VLM-as-judge Instruction Accuracy averaged over three
      judge models, plus DINO embedding similarity, against 8 frontier
      open-weight image-gen and VLM baselines; 79.6% vs 67.4% for the best
      baseline (106B) and 25.8% for the best image-gen model, with a
      100-sample human ranking study (Spearman 0.806 with the automatic
      metric) and a downstream policy test where the world model lifted M3A
      step accuracy.. Measured on 6 benchmarks of 500 instances each.
