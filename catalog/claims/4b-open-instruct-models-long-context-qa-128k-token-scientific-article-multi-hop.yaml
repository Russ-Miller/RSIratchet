id: 4b-open-instruct-models-long-context-qa-128k-token-scientific-article-multi-hop
ref: CLM-0997
capability: long-context-degradation
technique: learn-reasoning-short-proxy-context-then-re-ground
statement: >-
  For 4B open instruct models on long-context QA (128K-token
  scientific-article and multi-hop Wikipedia inputs), obtaining
  chain-of-thought traces by RLVR on short proxy contexts that carry the
  needed evidence, then supervised fine-tuning the RL checkpoint to
  reproduce those traces conditioned on the full long input, raises
  full-context accuracy above SFT or RLVR done directly on the full
  contexts, and shortens the reasoning traces.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two 4B models (Qwen3-4B-Instruct, Gemma3-4B-IT), inputs up to 128K tokens, English, tasks where a compact proxy context preserving answerability is available (annotated metadata or"
