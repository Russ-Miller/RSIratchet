    stance: supports
    note: >-
      Validated by: Exact match on SciTrek and GPT5-mini-judged accuracy on
      HotpotQA against zero-shot, SFT on full contexts, RLVR on full
      contexts, and SFT on teacher traces generated over full contexts; e.g.
      Qwen3-4B-Instruct SciTrek full-context EM 30.8 zero-shot, 32.9
      RLVR-on-full, 31.6 SFT-on-teacher-full-traces, 46.5 ProxyCoT-RL, with
      CoT tokens falling from 1,744 to 617; also out-of-domain transfer to
      Loong.. [truncated]
