id: pretrained-2d-vision-language-action-manipulation-policies-adding-3d-geometry-only
ref: CLM-0396
capability: embodied-control
technique: condition-action-denoising-raw-3d-semantic-point-field
statement: >-
  For pretrained 2D vision-language-action manipulation policies, adding 3D
  geometry only on the perception side is not enough: conditioning the
  action denoiser directly on a raw 3D semantic point field — at the
  specific diffusion blocks where linear probes show end-effector-coordinate
  error rising — raises bimanual task success beyond perception-side 3D
  fusion alone, and encoding the point cloud with a PointNet++-style encoder
  instead of keeping raw points lowers success.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Diffusion/flow action experts (RDT, GR00T-N1.5) on bimanual tabletop manipulation in RoboTwin 2.0 and a real humanoid; RGB-D head camera available; ~50-100 demos per task."
sources:
  - source: arxiv-2609-24525
    stance: supports
    note: >-
      Validated by: Success rate on 10 RoboTwin 2.0 tasks (100 trials each,
      clean and randomized) against pi-0, Spatial Forcing, PointVLA, 3D
      Diffusion Policy; ablations removing each strategy (78.8 -> 90.4 ->
      92.0 -> 95.6 avg), layer-position ablation, PointNet++ encoder
      ablation, and six real-robot tasks (RDT 34.3 vs Bridge3D 49.0 avg)..
      Measured on 10 simulated tasks and 6 real tasks with two backbones and
      component ablations; [truncated]
contested: false
