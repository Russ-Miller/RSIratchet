notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where
  inserting the explicit point-field cross-attention adds nothing over the
  implicit perception-side fusion alone, or where a PointNet++-encoded point
  cloud matches or beats raw point-wise conditioning, or where placement at
  arbitrary diffusion blocks works as well as probe-selected ones.
