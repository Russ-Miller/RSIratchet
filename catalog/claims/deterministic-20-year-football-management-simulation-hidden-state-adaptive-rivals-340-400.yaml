id: deterministic-20-year-football-management-simulation-hidden-state-adaptive-rivals-340-400
ref: CLM-0375
capability: long-horizon-execution
statement: >-
  In a deterministic 20-year football-management simulation with hidden
  state and adaptive rivals (~340-400 decision stops, 15 frontier models, 3
  seeds), final score is predicted by managerial behaviors — cutting
  slow-payoff investment near the horizon end (Spearman -0.58), keeping cash
  deployed rather than idle (-0.50), and opening contract renewals early
  (+0.45) — while token spend, model scale, price and vendor do not order
  the ranking, and year-5 standings correlate only weakly (0.19) with the
  final order.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One benchmark environment; solo track against scripted opponents, three seeds, 15 models, plus one shared-world Arena seed; correlations computed over only 15 models."
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured: one stamped run per seat, three seeds solo plus one Arena
      seed; per-seed Spearman signs reported as consistent for the three
      behavioral axes and null for compute under several accountings
      (p>0.38, n=15). n=15 models makes correlation estimates noisy, and
      per-model seed spread reaches 22.7 points, so score means themselves
      are unstable. Single environment, so behavior-to-score links may be
      environment-specific.
contested: false
status: pending-review
last_checked_at: 2026-10-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On additional seeds or a
  comparable long-horizon management environment, token spend or model scale
  orders the final ranking, or the three behavioral metrics show no
  consistent-sign correlation with score.
