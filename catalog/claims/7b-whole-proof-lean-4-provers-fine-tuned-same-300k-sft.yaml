ref: CLM-0561
capability: formal-math
technique: write-whole-proofs-block-diffusion-llm-then-in
statement: >-
  For 7B whole-proof Lean 4 provers fine-tuned on the same 300k SFT corpus,
  a block-diffusion model generating multi-token blocks proves more theorems
  at pass@32 than an autoregressive model of the same base lineage
  (MiniF2F-Test 50.00% vs 43.85%, ProofNet-Test 7.53% vs 5.91%), even though
  the two have nearly identical causal-mask validation loss on held-out
  correct proofs.
kind: observation
