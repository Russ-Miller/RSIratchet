observed_on:
  era: "7B models, Lean 4 code-completion without long chain-of-thought, same 300k SFT data, pass@32; AR baseline is Qwen-2.5-Instruct-7B, which is the base of the diffusion model Fast-dLL"
sources:
  - source: arxiv-2606-19315
    stance: supports
    note: >-
      Validated by: pass@32 on MiniF2F-Test (244) and ProofNet-Test (186)
      against an AR model fine-tuned on the identical 300k dataset; ablation
      shows the corrector alone adds 1.64% on MiniF2F (4 of 122 problems)
      and nothing on ProofNet.. Measured on two standard benchmarks with one
      matched-data AR baseline, single training run, 7B scale only, no seed
      variance or confidence intervals reported; the ProofNet gap (1.61
      points, 3 theorems) is within plausible sampling noise, and the
      correction component contributes only 4 problems. [truncated]
