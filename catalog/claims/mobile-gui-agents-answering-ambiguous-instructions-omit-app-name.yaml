id: mobile-gui-agents-answering-ambiguous-instructions-omit-app-name
ref: CLM-1014
capability: long-term-memory
technique: split-user-habits-into-general-preference-pool-per
statement: >-
  For mobile GUI agents answering ambiguous instructions that omit the app
  name or name content only by reference, splitting stored user habits into
  a prompt-injected general preference pool and an externally retrieved
  per-app memory of workflows and content preferences raises app-selection
  accuracy and task completion over agents with no preference modeling, with
  the two levels contributing to different metrics.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Training-free API-based mobile agents on a self-built 60-user benchmark (User FingerTip) with 15 training and 5 test instructions per user; baselines are Mobile-Agent-v2 and Mobile"
sources:
  - source: arxiv-2601-20162
    stance: supports
    note: >-
      Validated by: App Selection Accuracy, BERTScore, Preference Score,
      task completion/success rate on User FingerTip against
      Mobile-Agent-v2/E; ablation incrementally adding each module, where
      the preference-learning module mainly raised task completion and the
      hierarchical memory mainly raised semantic quality and preference
      alignment; also evaluated on the E dataset (TCR 0.893 vs 0.639
      baseline).. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-12
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An ablation under matched
  prompt budget showing that injecting all app-specific memory directly into
