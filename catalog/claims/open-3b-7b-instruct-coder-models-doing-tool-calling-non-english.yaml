  Drafted confidence: medium. Falsifier as drafted: A matched-token
  comparison in which English-only fine-tuning lifts non-English tool
  selection and invocation as much as multilingual fine-tuning on the same
  backbones. Drafted stance toward
  fine-tuning-large-corpus-real-api-call-traces-markedly-improves: supports
  -- It replicates the finding that fine-tuning on real API-call traces
  lifts tool-calling in open models, and adds the language condition.
