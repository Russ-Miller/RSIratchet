id: open-3b-7b-instruct-coder-models-doing-tool-calling-non-english
ref: CLM-1041
capability: tool-use
technique: fine-tune-tool-calling-multilingual-real-api-traces
statement: >-
  For open 3B-7B instruct and coder models doing tool calling on non-English
  queries, fine-tuning on a multilingual corpus of real API tasks yields
  larger gains than fine-tuning on the English subset of the same corpus, so
  English-only tool-use training does not transfer across languages.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5 3B-7B instruct/coder models, LoRA fine-tuning, tool selection and invocation on a 1,750-task test set of real REST APIs across 29 languages and 40 countries; test APIs part"
sources:
  - source: arxiv-2603-05515
    stance: supports
    note: >-
      Validated by: Fine-tuned Qwen2.5 3B/7B on the full ITC training set vs
      its English-only subset, evaluated on non-English test queries:
      full-multilingual training raised tool-selection recall by 42.0 points
      for Qwen2.5-7B-Instruct vs 22.6 for English-only, and tool-invocation
      F1 by 34.6 vs 25.3 for Qwen2.5-Coder-7B; also tested out-of-domain on
      Nexus Raven, Seal-Tools and Tool-Alpaca.. Measured on the authors' own
      benchmark with their own fine-tuning; the EN subset is smaller than
      the full set, so the comparison does not isolate language from data
      volume. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
