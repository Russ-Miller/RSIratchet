id: retrieval-grounded-multimodal-qa-where-gold-evidence-distractors-each-be
ref: CLM-0867
capability: retrieval-utilization
statement: >-
  In retrieval-grounded multimodal QA where gold evidence and distractors
  can each be text or image, LVLMs tolerate visual distractors when the gold
  evidence is textual but collapse when textual distractors accompany visual
  gold evidence, so misleading text overrides correct visual evidence rather
  than the reverse.
kind: observation
backing_strength: single-paper
observed_on:
  era: "KB-VQA samples curated to be unanswerable from parametric knowledge, with pre-retrieved gold and mined distractor contexts; measured on a subset (530 textual-positive, 266 visual-p"
sources:
  - source: arxiv-2604-12033
    stance: supports
    note: >-
      Measured on VLM-DeflectionBench's realistic scenario with GPT-4o as
      SimpleQA-style judge (human agreement >92%, kappa 0.91). With textual
      positives, Claude-Opus-4 kept 84.3% accuracy under visual distractors;
      with visual positives and textual distractors, Keye-1.5-8B and
      Mistral-Small-3.1 fell to <=1% accuracy and >80% deflection,
      Claude-Opus-4 to 28.9%. Only three models and unequal subset sizes;
      text and image positives are not matched on item difficulty, so part
      of the asymmetry may reflect weaker visual grounding overall, which
      the paper also reports.
contested: false
status: pending-review
last_checked_at: 2026-11-05
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
