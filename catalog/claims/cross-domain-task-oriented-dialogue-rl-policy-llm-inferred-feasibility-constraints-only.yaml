id: cross-domain-task-oriented-dialogue-rl-policy-llm-inferred-feasibility-constraints-only
ref: CLM-0824
capability: long-horizon-execution
technique: verify-llm-constraints-cross-examination-then-map-slots
statement: >-
  In cross-domain task-oriented dialogue with an RL policy, LLM-inferred
  feasibility constraints only help long-horizon success if they are both
  verified by a second LLM role and mapped into ontology-aligned slot-value
  pairs; removing either the verification or the slot grounding step drops
  task success sharply even though the constraints are otherwise the same.
