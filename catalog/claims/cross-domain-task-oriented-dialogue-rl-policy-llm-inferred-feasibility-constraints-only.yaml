    stance: supports
    note: >-
      Validated by: Success/Complete rates, dialogue-act P/R/F1 and average
      turns against PPO, ACGOS, GALAXY, GDP-Zero, TransferTOD, CAPID on
      MultiWOZ 2.1 and Frames (best variant 0.7214 and 0.7239 success vs
      0.3815 and 0.4235 for PPO), plus 30-annotator human SR/HR and a
      four-way ablation dropping cross-examination, the slot mapper, RL, or
      the LLM.. Measured on two benchmarks with five seeds and a four-way
      ablation reported as a figure, not a table, so exact ablation deltas
      are not given in the text. [truncated]
