id: photorealistic-images-containing-single-localized-counter-commonsense-edit-eliciting-reasoning
ref: CLM-1244
capability: hallucination
statement: >-
  On photorealistic images containing a single localized counter-commonsense
  edit, eliciting reasoning before the answer (CoT prompting for
  non-reasoning models, thinking mode for reasoning models) lowers accuracy
  and raises the rate of answering with the commonsense prior for most
  multimodal models, because late-stage generated text reverses correct
  initial judgements rather than re-examining the image.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,786 AI-generated images with fine-grained counter-commonsense edits, multiple-choice with cyclic option permutation plus free-form; 18 proprietary and open models; holds for most"
sources:
  - source: arxiv-2603-19765
    stance: supports
    note: >-
      Measured: direct-vs-reasoning accuracy and HalluRate for 11 models,
      with drops of 0.4-8.2 points for 9 of 11 and HalluRate rising in 9 of
      11; mechanism argued from time-series K-means clustering of
      correct-option probability across reasoning steps for three open
      models, where ~70% of errors start wrong and the rest flip late. No
      human-rater check of the trajectory interpretation, and the
      benchmark's images come from one generation/editing model pair.
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "chain-of-thought", which does not list this
  capability in addresses -- recorded, not asserted. Drafted confidence:
  medium. Falsifier as drafted: A matched evaluation on fine-grained
  counter-commonsense edits where enabling reasoning raises accuracy and
  lowers the commonsense-answer rate for most tested models, or where the
  probability-trajectory analysis shows no late-stage reversal. Drafted
  stance toward
  adversarially-edited-image-tasks-chain-of-thought-prompting-moves-multimodal-models:
  contests -- That claim holds CoT raises accuracy on
  counterfactual-attribute questions that pit language priors against the
  image, while FREAK's counter-commonsense attribute items show accuracy
  falling for most models when reasoning is enabled.
