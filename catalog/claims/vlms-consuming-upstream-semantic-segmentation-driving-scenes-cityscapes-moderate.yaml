id: vlms-consuming-upstream-semantic-segmentation-driving-scenes-cityscapes-moderate
ref: CLM-1087
capability: hallucination
technique: score-vlm-misalignment-language-level-segmentation-metrics
statement: >-
  For VLMs consuming upstream semantic segmentation in driving scenes
  (Cityscapes), moderate drops in pixel-level segmentation metrics under
  realistic corruptions are accompanied by disproportionately severe
  language-level failures — hallucinated object mentions, omission of
  safety-critical entities, and inconsistent safety judgments — so
  segmentation quality is a poor proxy for downstream semantic reliability.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Driving-scene semantic segmentation (Cityscapes) feeding contrastive and generative VLMs, under synthetic perception-realistic corruptions."
sources:
  - source: arxiv-2601-08355
    stance: supports
    note: >-
      Validated by: Measured across multiple contrastive and generative VLMs
      on corrupted Cityscapes segmentations; shows language-level metrics
      degrade far more than conventional segmentation metrics. No external
      human-judgment validation of the metrics reported here.. Measured on
      one dataset (Cityscapes) with author-introduced corruptions and
      author-defined misalignment metrics across several VLMs; no baseline
      comparison to alternative robustness measures, and the metrics'
      agreement with human judgement is not reported in the available text.
