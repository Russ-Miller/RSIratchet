id: predicting-whether-generated-code-functionally-correct-without-executing-sampling-based
ref: CLM-0727
capability: code-generation
technique: cluster-code-samples-llm-judged-functional-equivalence
statement: >-
  For predicting whether generated code is functionally correct without
  executing it, sampling-based uncertainty methods that cluster samples by
  NLI-judged semantic equivalence fail because the NLI model lumps
  functionally different programs into one cluster, so replacing the NLI
  step with an LLM judgement of functional equivalence recovers most of the
  discriminative signal.
