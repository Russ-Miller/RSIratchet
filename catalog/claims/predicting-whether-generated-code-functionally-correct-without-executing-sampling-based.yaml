      LiveSQLBench (270), against NLI-based semantic entropy and sets,
      token-probability scores, embedding and CodeBLEU similarity, P(True)
      and verbalized confidence; functional methods top AUROC in 11 of 15
      model-benchmark cells, NLI clustering near chance (0.47-0.58) versus
      functional entropy up to 0.86 Python and 0.84 SQL; cluster purity
