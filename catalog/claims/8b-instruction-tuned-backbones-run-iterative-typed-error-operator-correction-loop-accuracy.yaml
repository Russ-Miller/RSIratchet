statement: >-
  For 8B instruction-tuned backbones run in an iterative
  typed-error-operator correction loop, accuracy gains concentrate in the
  first few iterations and then plateau rather than decline as the denoising
  budget grows, so a small step budget captures nearly all the benefit.
