    stance: supports
    note: >-
      Measured on four benchmarks at five budget settings with a single
      stated figure (no error bars reported for the budget sweep); the
      plateau is argued to come from the three-source noise construction
      approximating the backbone's own error distribution, which the design
      does not isolate. Limited to 8B backbones and a fixed operator
      library.
