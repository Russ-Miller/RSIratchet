id: 30-32b-open-agent-models-trained-synthesized-planning-trajectories-splitting
ref: CLM-0956
capability: planning
technique: unified-multi-task-reward-plus-staged-sft-then
statement: >-
  For 30-32B open agent models trained on synthesized planning trajectories,
  splitting multi-task post-training into supervised fine-tuning followed by
  per-domain RL with one unified rule-based reward that scores output format
  and task-specific semantic correctness separately raises scores across
  heterogeneous planning benchmarks (task decomposition, scheduling, tool
  use) rather than trading one against another.
