id: outside-mathematics-step-level-error-detection-both-process-reward-models
ref: CLM-0315
capability: error-detection
statement: >-
  Outside mathematics, the step-level error detection of both process reward
  models and general LLMs is markedly weaker than on math benchmarks, and
  the two fail differently: PRMs miss knowledge-based errors while LLMs miss
  computational errors, across science and logic domains.
kind: observation
backing_strength: single-paper
observed_on:
  era: "GR-Ben, two domains (science, logic) and nine subdomains, 22 PRMs and LLMs, 2026; human-annotated step errors with about 15% of items discarded in annotation."
sources:
