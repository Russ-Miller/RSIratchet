id: vietnamese-context-grounded-hallucination-classification-context-prompt-response-into-no
ref: CLM-1143
capability: hallucination
technique: classify-grounding-faithfulness-instruction-tuned-llm-given-explicit
statement: >-
  For Vietnamese context-grounded hallucination classification (context,
  prompt, response into no/intrinsic/extrinsic), fine-tuned multilingual
  encoder classifiers such as PhoBERT perform near chance (~0.33 macro-F1 on
  a balanced three-class set) while LoRA-tuned 4-7B instruction-following
  LLMs with structured label-definition prompting reach ~0.85 macro-F1.
kind: observation
backing_strength: single-paper
observed_on:
  era: "10,000 annotated Wikipedia-derived triplets in Vietnamese with responses generated by GPT-4o under factual, noisy and adversarial prompts; balanced three-class label distribution; "
sources:
  - source: arxiv-2601-04711
    stance: supports
    note: >-
      Validated by: Private test macro-F1 of 84.80% for a single LoRA-tuned
      Qwen3-4B-Instruct against a fine-tuned PhoBERT encoder baseline at
      32.83% on the same 2,000-sample private split.. Measured on a held-out
      2,000-sample private test set with balanced classes; the baseline is a
      single simple fine-tune with no prompt engineering, so the 51-point
      gap conflates model class, fine-tuning recipe and prompt format rather
      than isolating any one. Top seven systems cluster tightly
      (0.8401-0.8480), which suggests a shared ceiling rather than a
      method-specific result.
