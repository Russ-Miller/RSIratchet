id: current-7-8b-open-vision-language-models-object-existence-accuracy-falls-fixed
ref: CLM-0831
capability: visual-grounding
technique: separate-perception-co-occurrence-presupposition-probes-per-image
statement: >-
  In current 7-8B open vision-language models, object-existence accuracy
  falls in a fixed order — objects actually present and random absent
  objects answered correctly above 85%, semantically co-occurring absent
  objects 8-37 points lower, and questions that presuppose the absent
  object's presence (asking its colour or logo) lower still by a further 15
  points or more — so the dominant hallucination driver is the prior carried
  by the instruction, not the visual backbone.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five 7-8B LVLMs (InternVL3.5-8B, Molmo-7B-D, Qwen2-VL-7B, Qwen2.5-VL-7B, LLaVA-1.5-7B) on COCO images with co-occurrence-derived adversarial objects verified absent by a grounding "
