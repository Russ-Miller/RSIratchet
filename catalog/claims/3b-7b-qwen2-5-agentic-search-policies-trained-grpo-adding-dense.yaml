id: 3b-7b-qwen2-5-agentic-search-policies-trained-grpo-adding-dense
ref: CLM-0533
capability: abstention-and-self-knowledge
technique: distil-copy-itself-given-knowledge-boundary-hints
statement: >-
  For 3B-7B Qwen2.5 agentic-search policies trained with GRPO, adding dense
  token-level supervision from a copy of the same model conditioned on
  privileged knowledge-boundary hints (parametric certainty, retrieval
  quality, gold answer, target behavior) lowers the rate of answers that are
  neither correct nor an honest refusal, relative to the same quadrant
  taxonomy trained with sparse rewards alone.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5 3B and 7B, E5 retriever over a 2018 Wikipedia dump, at most 2 search iterations, training synthesized from HotpotQA and 2WikiMultiHopQA; the hint is available only at train"
sources:
  - source: arxiv-2606-29863
    stance: supports
    note: >-
      Validated by: Unreliability rate (1 - F1 - refusal rate) across nine
      QA and agentic benchmarks: average 64.32 to 47.60 at 3B and 57.99 to
      41.18 at 7B against KbPO, with ablations removing the distillation
      loss (61.92) or fixing one KL direction (49.13 forward, 64.32
      reverse).. Measured on nine benchmarks at two scales against many
      baselines, but the headline metric sums F1 and refusal rate, so a
      model can score well by refusing more; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Matching the same training
  compute and data with sparse-reward KbPO, or substituting hint-free
  self-generated traces for hint-augmented ones, closes the unreliability
  gap.
