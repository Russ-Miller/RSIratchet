id: long-context-tasks-built-8k-128k-token-un-reports-middle-of-context-accuracy-dip
ref: CLM-0428
capability: long-context-degradation
statement: >-
  On long-context tasks built from 8K-128K-token UN reports, the
  middle-of-context accuracy dip appears for word-level QA and paragraph
  filling but inverts for sentence-cloze, where accuracy peaks in the middle
  because mid-paragraph sentences carry concrete entity and connective
  overlap that models follow instead of discourse role — so a mid-context
  peak can indicate shallow cue-matching rather than better comprehension.
kind: observation
backing_strength: single-paper
observed_on:
  era: "12 long-context LLMs (open and closed, >=128K windows), zero-shot, on position-stratified tasks from aligned UN reports in six languages; instruction and options appended after the"
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured across 12 models on 420 items per task per language; position
      effects reported as curves, with the surface-cue account supported by
      LLM-plus-human error categorisation of cloze items failed by over half
      the models. The inversion is observed, not causally isolated;
      distractor-order and instruction-placement ablations show the same
      items are sensitive to non-semantic factors.
contested: false
status: pending-review
last_checked_at: 2026-10-16
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A position-stratified
  sentence-cloze evaluation in which mid-document targets score no higher
  than boundary targets, or in which error analysis shows mid-position wins
  come from correct discourse-role reasoning rather than lexical overlap
  with neighbours.
