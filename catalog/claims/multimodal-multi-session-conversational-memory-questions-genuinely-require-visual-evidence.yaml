id: multimodal-multi-session-conversational-memory-questions-genuinely-require-visual-evidence
ref: CLM-0873
capability: long-term-memory
statement: >-
  On multimodal multi-session conversational memory questions that genuinely
  require visual evidence, long-context LVLMs and memory-augmented agents
  fail in opposite ways: LVLM accuracy falls as the history grows from 32K
  to 128K tokens (information extraction ~-20%, knowledge update ~-12%,
  answer refusal from ~75% to ~45%), while six of seven memory agents stay
  within ±7% from 32K to 256K but score far below LVLMs on visually grounded
  types because storage-time captioning or embedding discards fine-grained
  image detail.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "789 questions over five memory abilities at 32K-256K tokens under a cross-modal token count; 27 LVLMs on the full set, 7 memory agents on a 195-question subset; text-only agents fe"
sources:
  - source: arxiv-2605-14906
    stance: supports
    note: >-
      Measured: length-controlled sweep with per-type accuracy,
      image-ablation validation (accuracy below 2% without evidence images
      for two frontier models), and an oracle-retrieval diagnostic restoring
      MSR to 90-100%. Agents evaluated on a smaller subset than LVLMs, and
      text-only agents are handicapped by caption substitution, so the
      agent-side visual-fidelity gap is partly an input-adaptation artifact
      rather than purely architectural.
contested: false
status: pending-review
last_checked_at: 2026-11-06
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A memory-augmented agent
  that matches or beats long-context LVLMs on image-essential
  information-extraction and knowledge-update items at 32K, or long-context
  LVLMs that hold accuracy flat from 32K to 128K on the same items, would
  break the claimed division of failure modes. Drafted stance toward
  structured-long-term-memory-substrate-indexes-retrieval-control-logic-held:
  supports -- Both find that memory-system design rather than raw context
  scaling governs recall quality in multi-session settings, here with the
  added axis of visual fidelity loss at storage time.
