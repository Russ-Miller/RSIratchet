id: multi-agent-debate-applied-pairwise-argument-relation-classification-value-depends
ref: CLM-0687
capability: multi-model-coordination
technique: gate-multi-agent-debate-initial-prediction-s-confidence
statement: >-
  When multi-agent debate is applied to pairwise argument relation
  classification, its value depends on the initial prediction's uncertainty:
  routing only low-confidence cases into debate yields a net gain, while
  debating confident cases flips more correct predictions to wrong than the
  reverse, so unconditional debate nets out near zero.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Gemini 2.5 Flash debaters with a Gemini 2.5 Pro judge on UKP Argument Annotated Essays v2 (2,407 within-paragraph component pairs, Support/Attack/None); single corpus, gold compone"
sources:
  - source: arxiv-2606-16047
    stance: supports
    note: >-
      Validated by: Macro F1 on the UKP v2 80-essay test split: gated debate
      (tau=0.70, 14% of samples debated) 0.585 vs 0.578 for the strongest
      single-agent baseline (Gemini 2.5 Pro reasoning), 0.561 for full
      debate, 0.562 manager-only; at tau=0.70 debate improved 84 and
      worsened 48 predictions, vs 249 improved and 236 worsened under full
      debate; 86% fewer debate initializations.. Measured on one corpus, one
      model family, one split; Attack class has only 42 test instances so
      its F1 moves a lot per prediction, and the 0.585 vs 0.578 margin is
      untested for significance. [truncated]
contested: false
