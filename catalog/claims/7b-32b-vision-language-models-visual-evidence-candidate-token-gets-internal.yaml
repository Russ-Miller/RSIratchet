id: 7b-32b-vision-language-models-visual-evidence-candidate-token-gets-internal
ref: CLM-0348
capability: visual-grounding
technique: penalize-tokens-whose-rank-pooled-visual-evidence-falls
statement: >-
  In 7B-32B vision-language models, the visual evidence a candidate token
  gets from internal visual-token readouts must be pooled by vocabulary rank
  rather than probability magnitude and compared against that token's own
  typical evidence level, because probability magnitudes differ by nearly an
  order of magnitude across visual positions (not fixed by affine rescaling)
  and between-token differences explain most of the variance in aggregated
  evidence.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Open 7B-32B LVLMs with accessible hidden states and an output head; decoding-time intervention on open-ended captioning, measured with CHAIR."
sources:
  - source: arxiv-2608-19075
    stance: supports
    note: >-
      Validated by: CHAIR-I hallucinated object mentions fell by up to 21.3%
      on four 7B backbones with descriptive and general multimodal scores
      largely preserved; reductions extended to 11 models across six
      families up to 32B; 1.33% average added latency per token. Supporting
      ablations: rank-derived suppression strengths unchanged under
      order-preserving position rescaling while probability-derived ones
      shifted by ~0.045; token-specific medians cut held-out calibration
      error 91-92% versus a global reference and beat all 1,000 random
      token-reference reassignments.. [truncated]
