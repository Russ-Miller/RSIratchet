id: deepfake-video-detection-7-8b-open-multimodal-backbones-splitting-analysis
ref: CLM-0591
capability: multi-model-coordination
technique: split-forensic-analysis-into-per-cue-agents-reconcile
statement: >-
  For deepfake video detection with 7-8B open multimodal backbones,
  splitting the analysis into four separately prompted perspective agents
  (texture, lighting, motion, physics) whose reports a judge agent
  reconciles beats the same backbone doing chain-of-thought or multi-turn
  self-questioning over the same four perspectives, and the gain is not
  explained by extra turns or repeated frame access.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Out-of-domain split of one 100K-video face-forgery dataset, 20 held-out generators; Qwen2.5-VL-7B and InternVL3.5-8B; absolute scores remain low (F1 around 30-53)."
sources:
  - source: arxiv-2608-06865
    stance: supports
    note: >-
      Validated by: Training-free comparison on the OOD split against
      Single, CoT, and three multi-turn variants with the same backbone: F1
      33.53 vs 13.24 (Single) and 11.29 (CoT) on Qwen2.5-VL-7B; after SFT
      plus GRPO the full system reaches 69.87 accuracy / 53.28 F1 vs 47.45
      F1 for the best single-model baseline (Gemini-2.5-Pro). Per-agent
      ablation shows all four combined beats any single perspective..
      Measured on 7,636 OOD videos (5,716 real, 1,920 fake) from 20 unseen
      generators. Training-free comparison isolates architecture from
      training; [truncated]
