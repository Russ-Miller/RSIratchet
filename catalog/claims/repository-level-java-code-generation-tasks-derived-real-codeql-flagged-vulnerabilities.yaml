id: repository-level-java-code-generation-tasks-derived-real-codeql-flagged-vulnerabilities
ref: CLM-1036
capability: secure-coding
statement: >-
  For repository-level Java code generation on tasks derived from real
  CodeQL-flagged vulnerabilities, retrieval augmentation raises functional
  pass rates but leaves security roughly unchanged, and adding general
  security guidelines to the prompt shifts results unpredictably across
  models, lowering functional correctness for some (Claude-3.7-Sonnet Pass@1
  16.2% to 9.5%).
kind: observation
backing_strength: single-paper
observed_on:
  era: "105 instances from 30 Maven-based Java repositories, 19 CWE types, five 2025-era LLMs, security judged by CodeQL plus multi-LLM false-positive adjudication"
sources:
  - source: arxiv-2601-22706
    stance: supports
    note: >-
      Measured on a small benchmark (105 tasks, several categories with only
      4-18 instances), so per-category figures are very noisy; the security
      metric depends on a CodeQL-plus-LLM adjudication pipeline reported at
      81.7% precision, not expert labels. No training intervention tested;
      the no-retrieval baseline is one-shot prompting.
contested: false
status: pending-review
last_checked_at: 2026-11-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafter linked technique "retrieval-augmented-generation", which does not
  list this capability in addresses -- recorded, not asserted. Drafted
  confidence: medium. Falsifier as drafted: A replication on the same or a
  comparable repository-level secure-code benchmark where retrieval
  augmentation raises Secure@k or SecurePass@k consistently across models,
  or where security-guideline prompting improves composite scores for all
  models tested.
