id: grounding-metric-semantic-spatial-instructions-two-meters-right-fridge-into
ref: CLM-0922
capability: multi-model-coordination
technique: decompose-spatial-queries-into-kernels-compose-probabilistically
statement: >-
  For grounding metric-semantic spatial instructions ("two meters to the
  right of the fridge") into 3D navigation goals, decomposing the query into
  anchor, spatial predicate and metric distance, grounding each with a
  separate VLM query, and composing the results as analytic probability
  kernels over free space yields far lower metric and angular goal error
  than prompting one VLM or scene-graph QA agent for a single target,
  because a one-shot answer tends to pick the nearest region satisfying the
  direction without enforcing the stated distance.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Holds when a persistent 3D scene graph and free-space map are available; gains do not extend to commonsense or multiple-choice semantic QA, and failures are dominated by scene-grap"
sources:
  - source: arxiv-2603-19166
    stance: supports
    note: >-
      Validated by: On MAPG-Bench (30 HM3D scenes, 100 annotated queries),
      object-to-world error fell from 5.82 m for the GraphEQA scene-graph
      baseline to 0.07 m, yaw 13.5 to 1.9 degrees, pitch 27.9 to 4.4, task
      success 0.78 to 0.98; object-to-object error 0.50 m for SRGPT vs 0.07
      m. Ablation: replacing the explicit spatial reasoner with curated
      chain-of-thought dropped object-selection success from 0.42 to 0.20
      (0.50 to 0.30 under occlusion).. [truncated]
