id: frozen-llm-backbones-math-hybrid-reasoning-benchmarks-labeled-validation
ref: CLM-0837
capability: harness-self-improvement
technique: search-prompt-decoding-settings-together-one-agent-configuration
statement: >-
  For frozen LLM backbones on math and hybrid reasoning benchmarks with
  labeled validation splits, treating a prompt template plus its decoding
  hyperparameters as one searchable agent configuration and updating a
  population of such configurations toward the top-3 scoring ones raises
  test accuracy over static CoT and over prior prompt/workflow optimization
  methods, and guiding the update with more than three leaders lowers
  accuracy again.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Frozen weights, 5-10 agents and 10-30 iterations, verifiable exact-match fitness computed on a held-out-from-test validation split; measured on 11 math and hybrid reasoning benchma"
sources:
  - source: arxiv-2604-18612
    stance: supports
    note: >-
      Validated by: Average accuracy over 11 benchmarks against CoT, CoT-SC,
      Self-Refine, AFlow, ToT, GoT, AoT on three backbones (e.g. GPT-4o-mini
      74.6% CoT, 83.3% AoT, 84.0% Agent-GWO); ablations on agent count,
      iteration count, elite set size (m=3 best: GSM8K 95.9 vs 92.4 at m=1
      and 94.1 at m=5), and decoding-hyperparameter sensitivity (within
      ~1.5%).. Measured on 11 benchmarks x 3-5 backbones against 7
      baselines, with a stated optimization/evaluation split protocol. Gains
      over the strongest baseline (AoT) are small, 0.7-2.2 average points.
