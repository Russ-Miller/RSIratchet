statement: >-
  In RL-finetuned open-source 7B VLMs on visual spatial reasoning, continued
  GRPO training with verifiable answer-only rewards raises benchmark
  accuracy while the share of responses whose chain-of-thought agrees with
  the final answer declines, and adversarial caption/CoT augmentation that
  fixes robustness does not stop that decline.
