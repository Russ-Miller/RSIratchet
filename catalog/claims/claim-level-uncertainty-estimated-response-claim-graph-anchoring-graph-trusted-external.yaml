id: claim-level-uncertainty-estimated-response-claim-graph-anchoring-graph-trusted-external
ref: CLM-0973
capability: hallucination
technique: anchor-claim-consistency-graphs-trusted-priors
statement: >-
  When claim-level uncertainty is estimated from a response-claim graph,
  anchoring the graph with trusted external priors (edges weighted by
  entailment from verified source sections) and scoring claims by weighted
  closeness centrality separates ungrounded claims from
  repeatedly-generated-but-false ones better than internal-consistency
  centrality alone, and yields retrieval whose answerability tracks its
  accuracy instead of the near-100% answer rate GraphRAG shows on the same
  long documents.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Long-document QA (QASPER, QuALITY) with GPT-4o-mini and LLaMA 3.1 8B, where trusted priors can be carved out of the document itself (abstract, intro, chunks); no gold key for claim"
sources:
  - source: arxiv-2609-04442
    stance: supports
    note: >-
      Measured on two benchmarks and two backbones, but accuracy gains over
      GraphRAG are mixed (GraphRAG leads on QuALITY with GPT-4o-mini); the
      calibration claim rests on answerability percentages, not a proper
      calibration metric, and the main hallucination-precision number comes
      from an LLM oracle with no independent gold key. No ablation isolates
      the prior anchoring from the rest of the pipeline.
contested: false
status: pending-review
