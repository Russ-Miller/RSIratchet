id: 8b-open-models-llama3-1-8b-qwen3-8b-supervised-fine-tuning-whether
ref: CLM-0552
capability: explanation-faithfulness
technique: reward-agreement-between-factor-influence-factor-mention
statement: >-
  For 8B open models (Llama3.1-8B, Qwen3-8B), supervised fine-tuning on
  whether an inserted prompt factor flipped the model's own decision teaches
  detection without disclosure u2014 the fine-tuned model predicts influence
  well yet still writes generic explanations omitting the factor u2014
  whereas GRPO with a per-sample reward for agreement between influence and
  mention raises influence-mention correlation (Phi-CCT) from near zero to
  as high as 0.664 in-distribution and 0.691 on held-out datasets.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two 8B models, single-word random insertions and appended user-bias hints, balanced influential/non-influential splits over e-SNLI, Social-IQA, ComVE, StrategyQA; influence labels "
