    stance: supports
    note: >-
      Validated by: Dataset-level Phi-CCT correlation between influence and
      mention on train, test and OOD splits, against the base model and an
      SFT influence-detection baseline, with bootstrap CIs; reward gaming
      checked via completion length and prompt-overlap ratio, which showed
      shorter negatives but no parroting increase.. Measured on two 8B
      models across four datasets (~2,000 examples per split, balanced),
      with base and SFT baselines and bootstrap intervals. [truncated]
