id: 2b-8b-multimodal-judge-models-mixing-pairwise-training-data-whose
ref: CLM-0964
capability: judge-position-bias
technique: train-judges-mcts-pairs-crossing-length-correctness
statement: >-
  For 2B-8B multimodal judge models, mixing in pairwise training data whose
  two sides cross reasoning length with correctness (short-correct vs
  long-error and the reverse), generated by step-level MCTS rollouts, raises
  accuracy on length-imbalanced judgments far more than adding more
  conventional task-typed preference data, which leaves length bias
  unchanged.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open 2B-8B multimodal backbones (Qwen3-VL, LLaVA, InternVL, UnifiedReward) fine-tuned on ~142k open-source preference pairs plus ~13k MCTS pairs; measured on the authors' own bench"
sources:
  - source: arxiv-2603-00546
    stance: supports
    note: >-
      Validated by: Pairwise accuracy on the authors' length-bias-avoidance
      split: adding MCTS data moved Qwen3-VL-8B from 26.15 (open-source SFT
      only) to 34.22 (SFT) and 44.53 (DAPO RL), with similar shifts on four
      other backbones, while VL-RewardBench and Multimodal RewardBench
      scores held or rose; no independent benchmark of length bias used..
      Measured on the authors' own benchmark (3,712 pairs) built with the
      same style of generation as the training data, so benchmark and method
      share design assumptions; [truncated]
