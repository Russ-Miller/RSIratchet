id: self-evolving-agents-accumulate-reusable-skills-bank-skill-s-contribution
ref: CLM-0481
capability: harness-self-improvement
technique: gate-skills-sampled-coalition-knockouts-then-mask-after
statement: >-
  For self-evolving agents that accumulate reusable skills in a bank, a
  skill's contribution is not intrinsic: admitting a candidate because
  aggregate task reward rose leaves skills with zero or negative per-skill
  contribution in the bank, and skills that help in the source domain can
  reverse sign after transfer, so knockout audits conditioned on the
  surrounding coalition and on the deployment domain are needed to tell
  useful skills from harmful ones.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "LLM agents with persistent text-skill banks gated on aggregate outcome reward; audited on memory/QA/embodied benchmarks (LoCoMo, LongMemEval, HotpotQA, ALFWorld) with a Llama-3.3-7"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against MemSkill and six
      memory-agent baselines on LoCoMo, LongMemEval and ALFWorld (3 seeds):
      average F1 35.76 vs 34.74 and LLM-judge 55.52 vs 54.13, ALFWorld
      success 79.66 vs 77.05. A K-controlled ablation found the outcome
      gate's six accepted skills collectively net-negative (-1.38 pp
      average). Masking raised HotpotQA-50 judge score on all six trained
      banks (+7.17 pp average on MemSkill banks, +3.59 on CASS banks);
