id: two-embodied-agents-must-coordinate-through-movement-gaze-facial
ref: CLM-0503
capability: embodied-control
technique: score-social-signalling-signal-uptake-separately
statement: >-
  When two embodied agents must coordinate through movement, gaze, facial
  expression and speech so that one influences the other's choice,
  open-source VLMs up to 15B parameters show no reliable behavioral change
  when an explicit theory-of-mind order is imposed, and fail at two separate
  points: most do not emit directionally coherent nonverbal signals, and
  those that do are not decoded by the receiving agent.
kind: observation
backing_strength: single-paper
observed_on:
  era: "11 open-source VLMs plus a text-only baseline, all at or under 15B parameters, 200 trials each, in one guide-or-mislead hidden-reward scenario; no human baseline and no closed or l"
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Validated by: Applied across 13 models; outcome-level conformance
      scores that looked similar decomposed into distinct profiles (high
      positional bias vs. low signal production vs. coherent signals with
      near-zero uptake), and a structured-ToM reference architecture was the
      only system to clear both levels. Not validated against human
      judgement.. [truncated]
