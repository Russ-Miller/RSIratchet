id: instruction-tuning-8b-open-model-text-to-sql-curated-set-under
ref: CLM-0357
capability: formal-query-synthesis
technique: select-tiny-sql-tuning-set-schema-coverage-size
statement: >-
  For instruction tuning an 8B open model on text-to-SQL, a curated set of
  under 900 examples selected to cover every table in the target schemas and
  score well on question-SQL alignment reaches higher execution accuracy
  than pipelines trained on tens of thousands to millions of samples, and
  dropping the schema-coverage term from the selection objective costs more
  accuracy than dropping any single quality term.
kind: observation
backing_strength: single-paper
