    stance: supports
    note: >-
      Validated by: BIRD-Dev EX 69.1% and Spider-Dev 88.9% with
      self-consistency@8 from 796 and 863 samples, versus 67.0% for
      DB-Explore with 16,457 samples and 63.9-64.2% for OmniSQL trained on
      2.5M; ablation removing the coverage term drops SFT accuracy from
      65.4% to 58.4%.. Measured on two benchmarks with one backbone, against
      published numbers from other systems rather than same-pipeline
      controls; [truncated]
