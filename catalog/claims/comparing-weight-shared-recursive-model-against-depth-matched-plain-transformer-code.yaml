id: comparing-weight-shared-recursive-model-against-depth-matched-plain-transformer-code
ref: CLM-0034
capability: evaluation-validity
statement: >-
  When comparing a weight-shared recursive model against a depth-matched
  plain transformer on code generation, the ranking read from a single
  checkpoint can invert during training, because the larger-parameter arm
  passes its validation optimum and overfits while the parameter-lean
  recursive arm keeps improving — so a late-epoch "recursion fits better"
  reading is a degradation artifact, not a capability difference.
kind: mechanism
backing_strength: single-paper
