    stance: supports
    note: >-
      Measured: three arms (recursive 20-effective-depth shared 2-layer
      block, iso-parameter 2-layer, iso-depth 20-layer) trained 40 epochs,
      3 seeds, snapshots at 9 epochs. Fit ranking between recursive and
      iso-depth arms reversed at epochs 8 and 40; iso-depth validation
      loss bottomed at epoch 20 (1.15) and rose to 1.45 by epoch 40 while
      training loss fell. Cross-seed spread tight. Only one architecture
      family, one synthetic corpus, no execution-based correctness metric;
