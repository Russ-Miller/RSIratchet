  Drafted confidence: medium. Falsifier as drafted: Applying the same
  evidence-reweighting and grounding calls at every decoding step (or at
  random steps at matched call rate) yields equal or better accuracy and
  hallucination scores than margin-gated triggering, or the gains disappear
  once the small grounding model's own answers are given to the base model
