id: 7b-78b-open-vision-language-models-generating-long-chain-of-thought-object-grounding-errors
ref: CLM-0964
capability: visual-grounding
technique: gate-grounding-call-reweighted-next-token-margin
statement: >-
  In 7B-78B open vision-language models generating long chain-of-thought,
  object-grounding errors can be reduced without training by intervening
  only at decoding steps where the base and an evidence-induced distribution
  disagree with a small margin: calling a small grounding model there and
  appending its one-sentence observation to a reusable textual evidence pool
  raises TreeBench accuracy by 4-11 points across backbones, and the gain is
  not attributable to the small model's perception, since that 3B model
  alone scores below every base model it is attached to.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Open-source general LVLM backbones (Qwen2.5-VL 7/32/72B, LLaVA-OneVision 7/72B, InternVL3 8/38/78B) with a frozen decoder, uncertainty threshold 0.08, evaluated on TreeBench, RH-Be"
