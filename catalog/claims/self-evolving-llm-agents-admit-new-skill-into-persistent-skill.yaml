id: self-evolving-llm-agents-admit-new-skill-into-persistent-skill
ref: CLM-0600
capability: harness-self-improvement
technique: gate-skills-sampled-coalition-knockouts-then-mask-after
statement: >-
  For self-evolving LLM agents that admit a new skill into a persistent
  skill bank whenever aggregate outcome reward rises, the accepted skills
  are collectively net-negative and the gate cannot do better in principle,
  because the bank-level gain is one scalar that leaves every incumbent
  skill's contribution unconstrained; scoring sampled coalition knockouts at
  the gate, and masking transferred skills whose removal improves retrieval
  quality on unlabeled target queries, recovers the missing composition and
  domain dependence.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Skill-based self-evolving memory agents (MemSkill with a Llama-3.3-70B skill-extraction policy) on LoCoMo, LongMemEval, HotpotQA-50 and ALFWorld; three seeds; skills are textual me"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Measured on one base agent framework and four benchmarks, three seeds,
      with a matched protocol differing only in the gate. The net-negative
      figure rests on 12 candidate proposals and a 50-item HotpotQA subset
      with a 20-query unlabeled probe, so the magnitudes are thin; the
      non-identifiability argument is analytic and does not depend on sample
      size. The design does not separate the benefit of rejecting more
      skills from the benefit of coalition-aware ranking per se, since the
      coalition gate simply accepts far fewer candidates.
