  Drafted stance toward
  self-evolving-agents-accumulate-reusable-skills-bank-admit-new-skill:
  supports -- The K-controlled ablation measures that every skill the
  aggregate-reward gate admitted was individually accepted yet the set was
  collectively net-negative, and a non-identifiability theorem gives the
  reason.
