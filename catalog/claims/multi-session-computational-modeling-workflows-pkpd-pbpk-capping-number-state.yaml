id: multi-session-computational-modeling-workflows-pkpd-pbpk-capping-number-state
ref: CLM-0694
capability: long-horizon-execution
technique: bound-injected-context-capping-state-categories-evicting-completed
statement: >-
  For multi-session computational modeling workflows (PKPD/PBPK), capping
  the number of state categories in a three-layer memory and evicting
  completed work keeps injected context small (median 301 tokens, max 4,050)
  and supports continuous autonomous operation, with ablations showing
  memory, retrieval and principal-investigator oversight fixing distinct
  failure modes rather than one shared one.
