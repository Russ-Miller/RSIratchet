id: multi-hop-qa-hotpotqa-musique-where-evidence-deliberately-split-across
ref: CLM-1219
capability: multi-model-coordination
technique: optimize-separate-rewriting-policy-per-agent-to-agent
statement: >-
  On multi-hop QA (HotPotQA, MuSiQue) where evidence is deliberately split
  across four role-specialized agents on one frontier backbone, the
  multi-agent system scores well below the same model answering alone (80.1
  vs 92 and 72.7 vs 87.5), and optimizing per-edge prompt-rewriting policies
  from inter-agent trajectories recovers most of that loss without exceeding
  the single-model baseline (91.5, 86.1).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four fixed roles (researcher, analyst, critic, synthesizer) on a fixed directed topology, Claude Sonnet 4.6 throughout, 5 training iterations, evidence artificially partitioned so "
sources:
  - source: arxiv-2604-03430
    stance: supports
    note: >-
      Validated by: Mean accuracy over 5 training iterations on modified
      HotPotQA and MuSiQue, against an unmodified multi-agent system and
      against global (non-edge-assigned) TextGrad optimization; no
      per-component ablation and no report of variance across runs..
      Measured on two QA datasets with one backbone; the headline '>10%
      improvement' is relative to a degraded multi-agent baseline the paper
      itself created by splitting evidence, and the optimized system still
      lands below the plain single-model score. [truncated]
