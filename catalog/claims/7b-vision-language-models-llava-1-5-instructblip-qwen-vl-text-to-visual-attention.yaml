    stance: supports
    note: >-
      Validated by: POPE F1/accuracy averaged over MSCOCO, A-OKVQA and GQA
      against greedy, beam search, MemVR, ClearSight and IMCCD;
      CHAIR_i/CHAIR_s plus recall on 500 MSCOCO images; MME hallucination
      subsets and full set. Beats baselines on LLaVA-1.5 and InstructBLIP,
      trails IMCCD on some POPE Qwen-VL splits. Ablation: positive-only and
      negative-only each give part of the gain, and inverting the two
      anchors drops MME hallucination score below the untouched baseline..
      Measured on three 7B architectures across POPE, CHAIR and MME, against
