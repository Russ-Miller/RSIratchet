id: 7b-vision-language-models-llava-1-5-instructblip-qwen-vl-text-to-visual-attention
ref: CLM-1037
capability: visual-grounding
technique: re-anchor-late-layer-attention-mid-layer-visual
statement: >-
  In 7B vision-language models (LLaVA-1.5, InstructBLIP, Qwen-VL),
  text-to-visual attention in late decoder layers drifts away from the
  concentrated mid-layer regions found by visually sensitive heads and back
  toward the diffuse regions attended by visually insensitive heads in the
  first layer, and reweighting late-layer attention to amplify the mid-layer
  regions while suppressing the first-layer ones lowers object-hallucination
  rates without lowering object recall.
kind: mechanism
