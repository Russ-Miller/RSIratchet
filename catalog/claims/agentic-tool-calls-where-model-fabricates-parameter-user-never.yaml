id: agentic-tool-calls-where-model-fabricates-parameter-user-never
ref: CLM-0358
capability: hallucination
technique: concurrent-lora-critic-names-ungrounded-parameter
statement: >-
  For agentic tool calls where the model fabricates a parameter the user
  never specified, sampling-based uncertainty signals (token entropy,
  semantic entropy) are near non-discriminative because the fabrication is
  generated confidently, while the hidden states do register the grounding
  gap at the moment the parameter is formed — so a single-pass adapter read
  of the residual stream detects and names the ungrounded parameter far
  better than entropy or an equal-scale external judge.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Structured tool-calling with parameter-level ground truth from a simulated ambiguous user; Qwen3-4B and Llama-xLAM-2-8B; in-distribution and ToolAlpaca OOD; detection quality is bo"
sources:
  - source: arxiv-2608-10430
    stance: supports
    note: >-
      Validated by: Detection AUROC 0.966 ID / 0.925 OOD on Qwen3-4B versus
      0.915/0.884 for an equal-scale fine-tuned external judge, 0.782/0.616
      for a linear probe, and roughly chance for semantic entropy; >80%
      exact parameter-match localization; in a closed-loop ReAct setting
      specific feedback gave parameter F1 61.2 vs 51.3 generic and 52.1 no
      intervention, false blocks 2.9% vs 9.4%, recovery rate 37.0% vs 23.9%;
      activation patching of the trigger-token state flipped the verdict in
      96% of trajectories.. [truncated]
