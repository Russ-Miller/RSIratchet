  era: "Three 7-9B instruct backbones (Gemma-2-9B, Llama-3.1-8B, Qwen2.5-7B), 5 LoRA adapters, short-answer QA (OpenBookQA, ARC-Challenge, CoQA, TriviaQA); corrupted context used as a prox"
