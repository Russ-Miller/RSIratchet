id: 7-9b-instruction-tuned-backbones-fine-tuned-small-ensemble-differently-configured-lora-adapters
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: commit-only-one-answer-survives-interval-dominance-across
statement: >-
  For 7-9B instruction-tuned backbones fine-tuned with a small ensemble of
  differently-configured LoRA adapters, deciding whether to answer by
  interval dominance over the adapters' lower and upper probabilities —
  rather than thresholding a scalar from the mean-pooled distribution —
  yields abstention that collapses when the supplied evidence is corrupted
  (commitment on CoQA falling from 31-48% to 4-8%) with no threshold tuned,
  while matching or exceeding the mean-pooled ensemble's selective accuracy.
