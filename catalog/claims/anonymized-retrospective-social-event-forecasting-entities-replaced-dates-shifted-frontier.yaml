notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A comparable anonymized
  forecasting bank where models score as well or better on events that
  occurred than on constructed false events, or where the asymmetry
  disappears once question difficulty is matched.
