id: anonymized-retrospective-social-event-forecasting-entities-replaced-dates-shifted-frontier
ref: CLM-0547
capability: forecasting
technique: keep-true-false-forecasting-questions-near-1-1
statement: >-
  On anonymized retrospective social-event forecasting (entities replaced,
  dates shifted), frontier LLMs score much better at assigning low
  probability to events that did not happen than at assigning high
  probability to events that did, with a mean false-minus-true calibration
  gap of about 15.9 points across six models and up to 38 points for one
  model, so benchmarks weighted toward invented events overstate forecasting
  skill.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five real social events across public controversy, geopolitics, technology policy, financial markets and trade policy, anonymized and split into 125 cutoff prediction points, Chine"
sources:
  - source: arxiv-2608-04009
    stance: supports
    note: >-
      Validated by: Splitting the calibration bank by answer value showed a
      six-model mean of 76.1 on false items versus 60.3 on true items;
      dropping the designed-false subset moved the mean down 3.4 points,
      identifying it as the easiest subset.. Measured on the paper's own
      benchmark: ~25k calibration questions per language edition over five
      events, six models, with per-model bias reported. The asymmetry is
      large but confounded with how the false items were constructed
      (counterfactual variants and designed-false events may be easier to
      reject for reasons other than disposition). [truncated]
contested: false
