notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Issues whose fix
  location is not lexically or semantically close to the report (refactors,
  config-driven bugs), where an agent that reads and runs code should beat
  static ranking.
