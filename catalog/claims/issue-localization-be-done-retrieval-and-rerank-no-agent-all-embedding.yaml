id: issue-localization-be-done-retrieval-and-rerank-no-agent-all-embedding
ref: CLM-0266
capability: repository-navigation
technique: retrieve-and-rerank-localization-trained-mined-issue-patch
statement: >-
  Issue localization can be done as retrieval-and-rerank with no agent at
  all: an embedding model and reranker trained on issue-to-patched-function
  pairs mined from public GitHub (SweLoc) localize functions on SWE-bench
  Lite and LocBench at least as accurately at Acc@10 as agents built on
  Claude 3.5 Sonnet, at a small fraction of the per-issue cost and with one
  pass instead of seven to ten model rounds.
kind: observation
backing_strength: single-paper
observed_on:
  era: "SWE-bench Lite and LocBench, 2025, function-level Acc@k; trained open-source retriever and reranker versus agent frameworks with closed models."
sources:
  - source: arxiv-2505-07849
    stance: supports
    note: >-
      Validated by: File, module and function Acc@k on SWE-bench Lite and
      LocBench against prior code rankers and against MoatlessTools,
      Agentless, LocAgent and similar agents, with per-example cost; notes
      its own embedder beats LocAgent with Claude 3.5 on function Acc@10..
      Strong on the two benchmarks used, but both are Python and the
      training data is mined from similar public repositories, so some
      proximity between train and test is likely; the cost comparison
      depends on 2025 API prices.
contested: false
