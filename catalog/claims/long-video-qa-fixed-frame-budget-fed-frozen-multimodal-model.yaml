id: long-video-qa-fixed-frame-budget-fed-frozen-multimodal-model
ref: CLM-0209
capability: video-temporal-reasoning
statement: >-
  For long-video QA with a fixed frame budget fed to a frozen multimodal
  model, selecting frames by marginal contribution to the already-selected
  subset (query relevance plus coverage gain minus redundancy) beats ranking
  frames independently by query-frame similarity, and the margin over
  uniform sampling grows with video duration.
kind: mechanism
backing_strength: single-paper
