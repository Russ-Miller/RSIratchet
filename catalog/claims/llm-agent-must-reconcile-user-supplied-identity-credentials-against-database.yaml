id: llm-agent-must-reconcile-user-supplied-identity-credentials-against-database
ref: CLM-0077
capability: fact-verification
statement: >-
  When an LLM agent must reconcile user-supplied identity credentials
  against database records before a sensitive read or write, frontier and
  open models frequently skip the cross-field consistency check and act
  anyway, and the failure rate barely moves whether the request is simple or
  has several parallel sub-requests and whether the forged field is visually
  near-identical to the true one or completely unrelated.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Multi-turn simulated retail customer-service tasks with stateful tools and a domain policy requiring credential verification; nine models, one trial per task, greedy decoding, poli"
sources:
  - source: arxiv-2609-03588
    stance: supports
    note: >-
      Measured on 93 retail tasks within a 238-task benchmark, scored by an
      assertion model plus human trajectory verification; best retail score
      was 0.7312 (Claude Haiku 4.5) with several models far lower. The
      complexity and similarity insensitivity is reported qualitatively
      without per-condition numbers, so that part is argued more than
      quantified. Single trial per task limits variance estimates.
contested: false
status: pending-review
last_checked_at: 2026-09-09
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Showing that detection and
  clarification rates rise substantially as the forged credential becomes
  more dissimilar from the true one, or as the number of parallel requests
  drops, under the same harness. Proposed technique, not catalogued:
  conflict-injection agent benchmark.
