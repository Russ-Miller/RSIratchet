  Drafted confidence: medium. Falsifier as drafted: Measuring IoU against a
  construction-level constraint score on a comparable multi-entity CAD set
  and finding a strong positive correlation, or showing the near-zero
  correlation comes from noise in the LLM-inferred constraint set rather
  than from real construction errors. Drafted stance toward
  function-level-algorithmic-tasks-translated-c-model-s-functional-test:
  supports -- Both find that a pass/similarity-style correctness metric
  decorrelates from other quality dimensions of the generated code, here
  construction-structure correctness in CAD programs. Proposed technique,
  not catalogued: Constraint intent tree for CAD generation and
  verification.
