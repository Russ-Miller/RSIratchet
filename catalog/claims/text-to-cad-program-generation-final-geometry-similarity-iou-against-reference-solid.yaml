id: text-to-cad-program-generation-final-geometry-similarity-iou-against-reference-solid
ref: CLM-0223
capability: evaluation-validity
statement: >-
  For text-to-CAD program generation, final-geometry similarity (IoU against
  a reference solid) carries almost no information about whether the
  generated program preserves the intended construction process: on
  multi-entity Text2CAD samples with Qwen3, sample-level IoU and a
  constraint-satisfaction rate over expected entities, Boolean roles, sketch
  properties and inter-entity relations correlate near zero (Pearson r =
  0.022, Spearman 0.023), and high-IoU programs can omit expected entities
  or invert additive/subtractive roles.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Multi-entity CadQuery programs generated from natural-language descriptions, 26,783 samples derived from Text2CAD; correlation measured on one backbone (Qwen3), on programs that ex"
sources:
  - source: arxiv-2609-07434
    stance: supports
    note: >-
      Measured: sample-level Pearson and Spearman between normalized IoU and
      CSR on one backbone, plus a qualitative case (IoU 90.41% with CSR
      10.00%). Aggregate tables across three backbones show IoU and CSR
      moving by very different amounts. The design does not isolate how much
      of the low correlation is error in the LLM-inferred expected
      constraints, since no human-audited constraint ground truth is
      reported.
contested: false
