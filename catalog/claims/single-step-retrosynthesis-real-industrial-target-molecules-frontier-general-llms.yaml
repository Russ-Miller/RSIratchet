statement: >-
  On single-step retrosynthesis for real industrial target molecules,
  frontier general LLMs produce chemically infeasible top-1 routes
  (unresolved selectivity or no mechanistic basis) more often than
  specialized retrosynthesis models, even though their reference-matching
  recall is comparable, so disconnection fluency does not carry selectivity
  awareness.
