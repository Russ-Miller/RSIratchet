id: real-c-c-faults-reproducing-tests-24-current-models
ref: CLM-0321
capability: debugging
statement: >-
  On real C/C++ faults with reproducing tests, 24 current models repair only
  about 11% of the 248 bugs and about 6% of the 102 vulnerabilities, far
  below their Java and Python repair rates on comparable benchmarks, and
  fine-tuning on the benchmark's commit corpus raised Pass@k in 21 of 28
  comparisons by an average 85% relative, so the gap is partly a
  training-data gap.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Defects4C, function-level C/C++ bugs and vulnerabilities from real repositories, 2025; 24 models; single-function repair with tests."
sources:
