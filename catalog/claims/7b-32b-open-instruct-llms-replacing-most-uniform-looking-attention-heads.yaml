id: 7b-32b-open-instruct-llms-replacing-most-uniform-looking-attention-heads
ref: CLM-1019
capability: hallucination
technique: replace-uniform-shallow-layer-attention-heads-local-ones
statement: >-
  In 7B-32B open instruct LLMs, replacing the most uniform-looking attention
  heads in the first two decoder layers with a local-attention pattern at
  inference raises accuracy on truthfulness and logical-reasoning
  multiple-choice benchmarks by roughly 1-3 points, with smaller or negative
  effects on math and on larger (14B-32B) models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot CoT, first two layers only, k set to 10% of heads; gains measured as benchmark accuracy (TruthfulQA, LogiQA, CommonsenseQA, OpenBookQA, GSM8K), not as a direct hallucinat"
sources:
  - source: arxiv-2604-06393
    stance: supports
    note: >-
      Validated by: Accuracy vs vanilla greedy decoding on five benchmarks
      across seven open models; ablations on k, replacement direction
      (replacing local with uniform collapses accuracy), and
      scattered-source replacement; compared against ITI, ACT, DoLa and beam
      search.. Measured on seven open models over five benchmarks, vanilla
      decoding baseline. Average gains are small (0.3-1.2 points) and
      several individual cells are negative; no confidence intervals or seed
      variation reported, and no direct measurement of unsupported
      generation despite the hallucination framing.
