id: courtroom-style-multi-agent-claim-verification-over-biomedical-abstract-corpus-compiling
ref: CLM-0920
capability: multi-model-coordination
technique: compile-retrieval-queries-live-debate-state
statement: >-
  In courtroom-style multi-agent claim verification over a biomedical
  abstract corpus, compiling each retrieval query from the live debate state
  and the agents' self-reported evidence gaps raises accuracy over one-pass
  retrieval (74.2% to 81.7% on 120 Check-COVID claims), and the one-pass
  variant shows higher inter-judge agreement than the dynamic one, so rising
  agreement among debating agents can mark convergence on a wrong answer
  rather than correctness.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot, three-judge heterogeneous panel over a static 360k-abstract PubMed corpus; 120 binary Check-COVID claims plus sampled HealthVer/FEVEROUS checks; ~211K tokens per claim."
sources:
  - source: arxiv-2603-28488
    stance: supports
    note: >-
      Validated by: Ablation on the same 120 Check-COVID claims: removing
      P-RAG dropped accuracy 81.7% to 74.2% and halved the evidence pool
      (67.5 to 37.5 items) while mean inter-judge kappa rose 0.468 to 0.599;
      compared against single-call RAG (80.0% in-domain, 63.0% on HealthVer)
      and standard two-agent MAD (71.7%), with McNemar's test on a paired
      100-claim HealthVer subset (chi2=8.04, p=0.0046) against standard
      MAD.. Measured on one 120-claim binary subset of a single COVID
      benchmark, three runs with high variance (0.790-0.950), plus
      100/60-claim sampled cross-domain checks. [truncated]
contested: false
status: pending-review
