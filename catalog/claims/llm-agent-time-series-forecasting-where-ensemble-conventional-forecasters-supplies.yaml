id: llm-agent-time-series-forecasting-where-ensemble-conventional-forecasters-supplies
ref: CLM-0853
capability: forecasting
technique: refine-ensemble-forecast-prior-trained-small-llm
statement: >-
  For LLM-agent time series forecasting where an ensemble of conventional
  forecasters supplies a numerical prior, that prior is the load-bearing
  component: removing it costs more accuracy than removing any diagnostic
  tool category, and a general-purpose LLM reasoning over the same
  diagnostics without the prior is worse than the prior alone.
