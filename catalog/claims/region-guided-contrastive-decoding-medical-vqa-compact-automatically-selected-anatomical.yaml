    note: >-
      Validated by: Overall/closed/open scores on SLAKE and MIMIC-CXR across
      three Med-VLMs against standard decoding, VCD, DoLA, OPERA and
      ground-truth-ROI ARCD; closed accuracy on SLAKE with Phi-3.5V-Med rose
      61.42 to 81.49. Ablations: random mask selection -4.4%, removing the
      area penalty -3.4%.. Measured on two datasets and three Med-VLMs with
      four decoding baselines; the compactness mechanism is supported by a
      coverage analysis (39.41% vs 7.05%) and an area-penalty ablation on
      one model/dataset only. Accuracy and recall are proxies for
