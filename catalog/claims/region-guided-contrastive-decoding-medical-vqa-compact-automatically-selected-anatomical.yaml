capability: visual-grounding
technique: pick-contrastive-roi-counterfactual-occlusion-penalizing-size
statement: >-
  In region-guided contrastive decoding for medical VQA, a compact
  automatically selected anatomical region outperforms the dataset's
  ground-truth ROI annotation, because coarse bounding boxes (mean coverage
  ~39% versus ~7% for the selected masks) strip almost all visual evidence
  from the suppressed branch and dilute the contrastive signal.
