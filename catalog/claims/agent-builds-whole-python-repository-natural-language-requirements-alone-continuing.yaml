    stance: supports
    note: >-
      Validated by: Functionality Coverage and Pass Rate on three RepoCraft
      repositories against mini-SWE-agent, Paper2Code and RPG, plus
      ablations removing structural evolution (coverage -5.3 to -5.9, pass
      rate -8.5 to -13.3) and a comparison against LLM-decided evolution
      with 1/3/5 round budgets on statsmodels.. Measured on six repositories
      (three reported in the main table), two backbones, three runs
      averaged; baselines share the downstream pipeline so the architecture
      step is isolated. [truncated]
