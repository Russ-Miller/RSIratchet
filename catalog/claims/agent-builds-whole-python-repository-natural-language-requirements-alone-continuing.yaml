id: agent-builds-whole-python-repository-natural-language-requirements-alone-continuing
ref: CLM-0356
capability: code-generation
technique: evolve-component-graph-until-modularity-metrics-converge
statement: >-
  When an agent builds a whole Python repository from natural-language
  requirements alone, continuing to revise the component architecture during
  generation — with split/merge triggered by cohesion and coupling
  thresholds and stopped at convergence — yields higher functionality
  coverage and test pass rate than fixing a one-shot plan, while letting the
  model decide restructuring freely for a fixed number of rounds
  over-decomposes and loses coverage and pass rate after the first round.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six real-world Python repositories in RepoCraft, with GPT-5 mini and DeepSeek V3.2 backbones, all methods sharing the same downstream TDD code-generation and repair scaffold; thres"
