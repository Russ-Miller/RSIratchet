id: several-stochastic-llm-runs-configurations-each-emit-unranked-set
ref: CLM-0349
capability: hallucination
technique: fuse-votes-across-repeated-llm-runs-into-ranked
statement: >-
  When several stochastic LLM runs and configurations each emit an unranked
  set of candidate cybersecurity requirements from the same control template
  and system spec, pooling the runs recovers far more valid requirements
  than any single run but also many hallucinations, and scoring each
  candidate by how many runs produced it ranks valid requirements ahead of
  hallucinations well enough to beat every individual run on AP and ROC AUC.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Recall-sensitive generation tasks where candidates from independent runs can be canonicalized and compared; shown on 24 runs from 12 configurations across four non-frontier model f"
sources:
  - source: arxiv-2609-10316
    stance: supports
    note: >-
      Validated by: Expert-adjudicated gold standard of 72 valid
      requirements against 111 hallucinations; uniform fusion exceeded the
      best single configuration by 0.142 AP and 0.118 ROC AUC, Naive-Bayes
      weighting added 0.039 and 0.052 reaching 0.864 and 0.869; gains stayed
      positive in at least 92% of out-of-bag bootstrap resamples and every
      structured-perturbation sample. Weights were fitted on the same judged
      corpus, so prospective performance is not established.. [truncated]
