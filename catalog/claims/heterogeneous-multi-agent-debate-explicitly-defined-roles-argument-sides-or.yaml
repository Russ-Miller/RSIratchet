id: heterogeneous-multi-agent-debate-explicitly-defined-roles-argument-sides-or
ref: CLM-1062
capability: multi-model-coordination
technique: pick-model-each-debate-role-peer-reviewed-proposals
statement: >-
  In heterogeneous multi-agent debate with explicitly defined roles
  (argument sides or reasoning methods), which model fills which role
  matters: a model's single-agent accuracy does not predict its usefulness
  in a given role, and selecting the model per role per question (each
  candidate drafts a role-specific proposal, all candidates score them
  against role- and domain-specific criteria, highest average wins) beats
  both filling every role with one model and random model-to-role
  assignment.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three commercial/open models (Claude 3.5, Nova Premier, Pixtral-Large) on GPQA, MathVision and RealWorldQA, applied on top of the MAD and DMAD debate frameworks; no labelled data u"
sources:
  - source: arxiv-2601-17152
    stance: supports
    note: >-
      Validated by: Accuracy on GPQA (full 448 items), MathVision testmini
      (190 closed-form items) and RealWorldQA (437 items) against uniform
      assignment (one model in all roles) and three random model-to-role
      assignments, inside MAD and DMAD; on GPQA the method reached 59.15%
      (MAD) and 66.29% (DMAD) versus best uniform 54.24%/58.93% and best
      random 55.58%/60.27%.. Measured on three benchmarks with two debate
      frameworks and three models, temperature 0. Headline 'up to 74.8% /
      29.7%' are relative improvements over the weakest comparators.
