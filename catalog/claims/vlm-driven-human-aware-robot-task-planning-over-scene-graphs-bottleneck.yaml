id: vlm-driven-human-aware-robot-task-planning-over-scene-graphs-bottleneck
ref: CLM-0412
capability: planning
technique: predict-human-intention-symbolic-goal-then-plan-jointly
statement: >-
  In VLM-driven human-aware robot task planning over scene graphs, the
  bottleneck is inferring and grounding the symbolic goal, not the planning:
  once both human and robot goals correctly cover the ground truth, a formal
  multi-agent planner produces a valid, conflict-free joint plan in 99.6% of
  trials, while end-to-end success with VLM-inferred human goals is 69.7%.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Photorealistic household simulation (VirtualHome, 4 scenes), one human and one mobile robot, cooperative goal-consistent human assumed, PDDL-style domain with FMAP planner, GPT-5.6"
sources:
  - source: arxiv-2609-17771
    stance: supports
    note: >-
      Validated by: Joint success rate 69.71% vs 35.50% for VLM-as-planner
      and 34.42% for GG-LLM, with paired cluster bootstrap CIs on 48
      scene-activity-task configurations; also higher robot and human goal
      completion and about half the functional conflict rate.. Measured in
      simulation with an oracle-goal ablation isolating grounding error (SR
      69.71 to 96.38; 99.60% planner success on 1,490 correctly-grounded
      trials). Success drops to 25.5% on complex two-item activities, where
      goal prediction fails most. Single simulator, one planner,
      hand-written domain; [truncated]
