id: agent-creates-new-tools-demand-extend-own-capability-set
ref: CLM-1055
capability: harness-self-improvement
technique: condition-new-tool-creation-past-tool-creation-experience
statement: >-
  When an agent creates new tools on demand to extend its own capability
  set, conditioning the tool-generation prompt on distilled lessons from
  past tool creation and debugging produces more tools that pass validation
  on the first attempt and fewer self-correction rounds than generating
  tools from the sub-task description and web search alone.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Measured with a GPT-5-chat backbone on benchmarks requiring heavy tool synthesis (GAIA, AIME24/25), where validation is LLM-synthesized test cases rather than ground-truth labels."
sources:
  - source: arxiv-2604-10923
    stance: supports
    note: >-
      Validated by: First-pass validity (tool passes all synthesized tests
      on the first attempt) rose from 53.1% to 72.4% on average across GAIA
      and AIME24/25, and average self-correction iterations fell from 1.01
      to 0.48, against the same pipeline with experience guidance removed..
      Measured ablation on three benchmarks with one backbone; validity is
      judged by LLM-synthesized tests derived from an LLM critic, not by
      independent ground truth, so 'valid' and 'the critic's standard' are
      not separated. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
