id: vision-language-models-post-trained-visual-search-single-step-intrinsic-abilities-degrade
ref: CLM-0783
capability: fine-tuning-retention
technique: accept-base-model-tokens-only-if-post-trained
statement: >-
  In vision-language models post-trained for visual search, single-step
  intrinsic abilities degrade (grounding by about 49% and spatial
  understanding by about 11% at a fixed reasoning turn), and pairing the
  post-trained model at decoding time with its own pre-post-training base —
  accepting the base's proposed tokens only when they are consistent with
  the post-trained model's own distribution — recovers accuracy on
  visual-search and general VQA benchmarks, while injecting the base's
  output as a textual prompt does not and often scores below the
  post-trained model alone.
