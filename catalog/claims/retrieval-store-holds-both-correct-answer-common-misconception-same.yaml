id: retrieval-store-holds-both-correct-answer-common-misconception-same
ref: CLM-0475
capability: hallucination
technique: retrieval-augmented-generation
statement: >-
  When a retrieval store holds both the correct answer and a common
  misconception for the same question, injecting all retrieved memories
  raises the hallucination rate above a memory-free baseline for weaker
  models (53.0% vs 23.0% on TruthfulQA with gemma-4-E4B-it), while a
  stronger backbone (deepseek-v4-flash) instead shows RAG below its own
  no-memory rate, so conflict-driven amplification is concentrated in models
  susceptible to memory injection.
kind: observation
backing_strength: single-paper
observed_on:
  era: "TruthfulQA and HaluEval question sets where the memory store is built from the dataset's own correct and incorrect reference answers plus distractors; three backbones, 30-200 quest"
sources:
  - source: arxiv-2609-22043
    stance: supports
    note: >-
      Measured, but with a scoring pipeline (embedding similarity, threshold
      0.5) and memory stores built from reference wrong answers, so conflict
      is artificially guaranteed; sample sizes small (150x2 seeds for the
      amplification result, 30x1 for one model). The technique's high-risk
      0% hallucination is achieved by abstaining on nearly all such items,
      so grounding gain is not separated from refusal.
contested: false
status: pending-review
last_checked_at: 2026-10-03
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
