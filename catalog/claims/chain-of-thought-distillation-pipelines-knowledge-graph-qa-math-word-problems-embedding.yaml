id: chain-of-thought-distillation-pipelines-knowledge-graph-qa-math-word-problems-embedding
ref: CLM-0995
capability: hallucination
technique: embed-executable-knowledge-graph-traversal-code-reasoning-prompt
statement: >-
  For chain-of-thought distillation pipelines on knowledge-graph QA and math
  word problems, embedding executable knowledge-graph traversal code inside
  the reasoning prompt so intermediate steps are constrained by external
  structured knowledge raises HIT@1/3/5 over the same chain without the code
  module, with the reported gains largest when prompts are ambiguous or
  underspecified.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Reported on WebQSP, CWQ, GSM8K, MWP and Dr. SPIDER with GPT-4 and LLaMA-3.3 backbones; requires an available structured knowledge source and a code representation of traversal, and"
sources:
  - source: arxiv-2601-04086
    stance: supports
    note: >-
      Validated by: HIT@1/HIT@3/HIT@5 on WebQSP, CWQ, GSM8K, MWP and Dr.
      SPIDER against the same distillation chain without the code module and
      against KG-LLM-PR, LLM-SubKG-Sum, RAG and Self-Check; no error bars,
      no per-dataset ablation of which component helps, and no human check
      of whether gains are hallucination reduction rather than retrieval
      accuracy.. Measured only in this paper, on five public benchmarks,
      reporting HIT@k above 95% for the code-module variant versus roughly
      80-86% without it. [truncated]
