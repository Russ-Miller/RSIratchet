statement: >-
  When grading free-form answers to algorithm-analysis and complexity-theory
  questions against instructor reference answers, n-gram overlap metrics
  carry almost no signal about answer quality, because logically equivalent
  proofs differ in notation, variable names and proof strategy: BLEU-4 was
  0.0000 on all 179 questions and ROUGE-1 F1 stayed in a narrow 0.088-0.129
  band across topics while a rubric score varied from 0.66 to 0.83.
