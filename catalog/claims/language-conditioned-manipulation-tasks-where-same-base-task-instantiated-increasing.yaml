id: language-conditioned-manipulation-tasks-where-same-base-task-instantiated-increasing
ref: CLM-0239
capability: embodied-control
statement: >-
  On language-conditioned manipulation tasks where the same base task is
  instantiated at increasing levels of spatial ambiguity and procedural
  length, current VLA models degrade on fine-grained spatial relations,
  precise low-level execution, and memory-dependent multi-step planning, so
  success measured only on predefined simple settings overstates their
  competence.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Representative VLA models evaluated on a 56-base-task, 280-variant benchmark across multiple embodiments; degradation is shown along authored difficulty levels, not in deployment."
