id: frozen-7-8b-multimodal-models-long-video-qa-under-fixed-frame
ref: CLM-0621
capability: video-temporal-reasoning
technique: weight-frame-scores-query-temporal-granularity-then-budget
statement: >-
  For frozen 7-8B multimodal models on long-video QA under a fixed frame
  budget, scoring candidate frames with a query-granularity-weighted mix of
  static query-frame similarity and a graph-diffused temporal-context score,
  then distributing the frame budget across clustered events rather than
  taking the global top-K, raises accuracy over uniform sampling and static
  query-guided selection, with the largest gains on the longest video
  splits.
