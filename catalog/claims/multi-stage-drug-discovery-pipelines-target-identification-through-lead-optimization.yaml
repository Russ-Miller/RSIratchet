notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A controlled comparison
  holding backbone, tool server and task fixed, where a flat code-generating
  agent recovers from mid-pipeline tool crashes as often as the skill-graph
  version, or where removing the data contracts and HITL gates leaves
  end-to-end completion rates unchanged.
