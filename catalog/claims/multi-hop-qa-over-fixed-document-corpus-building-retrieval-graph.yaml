id: multi-hop-qa-over-fixed-document-corpus-building-retrieval-graph
ref: CLM-0678
capability: multi-step-reasoning
technique: build-rag-graph-token-co-occurrence-llm-extraction
statement: >-
  For multi-hop QA over a fixed document corpus, building the retrieval
  graph from token co-occurrence statistics rather than LLM-extracted
  entities and relations raises gold-evidence recall and downstream EM/F1
  over dense and LLM-built-graph RAG baselines while cutting indexing time
  by orders of magnitude, with the gain depending on PPR-based expansion
  plus neural reranking rather than on the graph alone.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three English multi-hop QA benchmarks (HotpotQA, 2WikiMultiHopQA, MuSiQue), 1,000 subsampled queries each, gemma3:27b generator, 2 retrieval hops, top-5 chunks in context."
sources:
  - source: arxiv-2606-30093
    stance: supports
    note: >-
      Validated by: Recall@2/@5 and EM/F1 against NaiveRAG, HippoRAG2,
      LightRAG, GraphRAG, RAPTOR, KGP, ToG on three benchmarks, plus
      indexing time, end-to-end latency and context token count; ablations
      removing BM25 (marginal), replacing PPR with degree centrality (large
      drop), and removing reranking (large drop).. Measured on three
      benchmarks with a shared prompt and hardware; [truncated]
