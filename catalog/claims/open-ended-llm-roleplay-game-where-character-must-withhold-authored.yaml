id: open-ended-llm-roleplay-game-where-character-must-withhold-authored
ref: CLM-0391
capability: hallucination
technique: gate-disclosure-through-structured-knowledge-tree-retrieve-generate
statement: >-
  In an open-ended LLM roleplay game where the character must withhold
  authored facts, gating generation through an external state tree — one
  retrieved permitted fact injected into the prompt, plus a separate
  verifier that decides whether the fact was actually conveyed before
  updating state — cuts the share of responses containing story-breaking
  unauthored content (17.8% to 6.3%) and stops premature reveal of the
  ending entirely, but makes some reveals appear unmotivated because the
  generator is forced to deliver the retrieved fact on that turn.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "One 20-minute session per condition, 33 participants, Llama-3.1-70B-instruct with no fine-tuning, a single hand-authored detective narrative; baseline was a single model with a lon"
