    stance: supports
    note: >-
      Validated by: Hand-coded hallucination rate over gameplay logs (17.80%
      of responses vs 6.27%), confessions extracted (10/33 vs 0/33), and a
      9-item Likert survey where only progression and out-of-nowhere-reveal
      items differed; the tri-agent pipeline, the tree and the visual node
      board were evaluated together with no ablation.. Measured on logs from
      33 within-subject participants, one narrative, one model. [truncated]
