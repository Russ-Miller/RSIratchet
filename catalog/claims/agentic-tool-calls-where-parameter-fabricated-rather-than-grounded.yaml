  - source: arxiv-2608-10430
    stance: supports
    note: >-
      Validated by: Detection AUROC 0.966 ID / 0.925 OOD on Qwen3-4B vs
      0.915/0.884 for an equal-scale fine-tuned external judge, 0.782/0.616
      for a linear probe, and ~0.5 for entropy baselines; >80%
      exact-parameter localization; in a closed ReAct loop, specific
      feedback gave parameter F1 61.2 vs 51.3 generic and 52.1 base, false
      blocks 2.9% vs 9.4%, recovery rate 37.0% vs 23.9%; <10ms overhead in
      vLLM.. [truncated]
