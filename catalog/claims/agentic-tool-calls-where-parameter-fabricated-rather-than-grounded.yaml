id: agentic-tool-calls-where-parameter-fabricated-rather-than-grounded
ref: CLM-0360
capability: hallucination
technique: lora-latent-critic-verbalizes-which-parameter-ungrounded
statement: >-
  For agentic tool calls where a parameter is fabricated rather than
  grounded in the dialogue, sampling-based uncertainty detectors (token
  entropy, semantic entropy, SEP) fail at near-chance because the model
  fabricates plausible parameters with high confidence, while the model's
  hidden states at the moment the parameter is generated do carry a
  separable grounding signal.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tool-calling agents (Qwen3-4B, Llama-xLAM-2-8B) under underspecified user instructions; hallucination defined as a parameter unsupported by dialogue history, not factually wrong."
