statement: >-
  Asked to draft clinical-guideline content against expert references, 17
  models and deep-research agents reach at best about 57% accuracy on
  clinical claims, average under 30% on mechanistic claims and about 22% on
  differential diagnosis, and stay below 30% on therapeutic claims even for
  the best system, so expert-level evidence integration in medicine is well
  beyond current systems.
