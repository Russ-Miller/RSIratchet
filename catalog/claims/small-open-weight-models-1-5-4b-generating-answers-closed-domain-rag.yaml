id: small-open-weight-models-1-5-4b-generating-answers-closed-domain-rag
ref: CLM-0156
capability: hallucination
statement: >-
  For small open-weight models (1.5-4B) generating answers in a
  closed-domain RAG setup, hallucinated generations show a broken
  hidden-state proximity graph between the retrieved context entity and the
  generated entity — connectivity below 20% and path lengths above 7 hops,
  versus near-full connectivity at about 3 hops for grounded answers —
  giving a training-free detection signal (AUROC 0.89 on Qwen2.5-1.5B).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two small models (Qwen2.5-1.5B, Phi-3-Mini) on the RAGognize dataset; hallucinations are induced by supplying only semantically similar distractor documents, so the signal may part"
sources:
  - source: arxiv-2608-17950
    stance: supports
    note: >-
      Reported on two small models over RAGognize prompt configurations; the
      answerable/unanswerable contrast confounds hallucination with whether
      a supporting document was present at all, which the design does not
      isolate. The 0.89 AUROC is on one model and the baselines (lexical
      grounding, perplexity) are not numerically reported. No independent
      replication.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Measuring the same graph
  connectivity and path-length features on hallucinated versus grounded
  generations where both come from answerable contexts (so prompt
  configuration is held fixed) and finding no separation, or AUROC near
  chance. Proposed technique, not catalogued: Latent proximity graph
  hop-count hallucination detection.
