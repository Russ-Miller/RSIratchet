    stance: supports
    note: >-
      Validated by: Average refuse-to-answer rate on three jailbreak
      benchmarks rose from 20.38% to 33.67% and harmless-output rate from
      39.97% to 50.09% on Qwen-2.5-VL, above four prior
      visual-token-compression baselines; HallusionBench accuracy 59.73% to
      60.48%; MME perception/cognition slightly above vanilla, OCRBench
      lower (861 to 753); ablations against pruning smallest-distance and
      random tokens.. Measured on seven benchmarks with two 7B backbones and
      four compression baselines; [truncated]
