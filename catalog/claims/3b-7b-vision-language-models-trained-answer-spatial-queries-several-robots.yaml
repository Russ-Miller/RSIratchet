id: 3b-7b-vision-language-models-trained-answer-spatial-queries-several-robots
ref: CLM-0955
capability: embodied-control
technique: reward-cross-view-grounding-overlap-count-just-answer
statement: >-
  For 3B-7B vision-language models trained to answer spatial queries from
  several robots' ego-centric RGB views, fusing multiple close-range
  ego-centric views yields higher counting and cross-view relational
  accuracy than reasoning from a single global overhead camera that covers
  the whole workspace (7B: 61.0 vs 34.0 on counting, 97.0 vs 54.0 on
  location reasoning).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Tabletop multi-robot manipulation scenes, Qwen2.5-VL backbones fine-tuned on the paper's own benchmark; the simulated split was deliberately built with clutter and occlusion."
sources:
  - source: arxiv-2603-14811
    stance: supports
    note: >-
      Validated by: Measured on the paper's E2W benchmark against zero-shot
      proprietary and open models, SFT-only, and RL-from-scratch;
      leave-one-out ablation of each reward term (removing the grounding
      term costs over 21 points on grasping, removing the overlap term costs
      ~4.5 on counting), plus Where2Place transfer (50.9 vs 46.8 RoboPoint)
      and a two-task real-robot trial (65% and 30% vs 0%).. Measured on one
      benchmark the authors built, with scene-disjoint train/test. The
      single-view arm uses one overhead camera; [truncated]
