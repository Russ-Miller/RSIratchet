    note: >-
      Validated by: Accuracy and F1 on DOLOs, Bag-of-Lies and MU3D against
      closed (GPT-4o, Gemini3Pro) and open (AffectGPT, Qwen2.5-Omni) MLLMs
      and six specialized detectors, plus a Semantic Evidence Alignment
      metric against annotated cues; ablations separate the three-stage
      pipeline from the token-masking module and sweep the mask count..
      Measured on three public benchmarks with reported accuracy and F1;
      baselines include closed and open MLLMs and specialized classifiers.
