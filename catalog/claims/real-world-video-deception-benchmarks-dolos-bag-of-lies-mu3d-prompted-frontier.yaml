id: real-world-video-deception-benchmarks-dolos-bag-of-lies-mu3d-prompted-frontier
ref: CLM-0716
capability: strategic-deception
technique: train-audio-visual-evidence-chains-then-prune-low
statement: >-
  On real-world video deception benchmarks (DOLOs, Bag-of-Lies, MU3D),
  prompted frontier and open 7B multimodal models score near chance (41-64%
  accuracy), and a 7B model given domain-specific evidence-chain training
  reaches only 60-70% accuracy and under 59% in cross-dataset transfer, so
  detecting deception from audiovisual cues stays close to the chance floor
  even after targeted adaptation.
kind: observation
backing_strength: single-paper
