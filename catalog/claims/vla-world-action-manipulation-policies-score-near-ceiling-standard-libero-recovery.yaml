id: vla-world-action-manipulation-policies-score-near-ceiling-standard-libero-recovery
ref: CLM-0268
capability: embodied-control
technique: score-recovery-model-s-own-real-failure-states
statement: >-
  For VLA and world-action manipulation policies that score near-ceiling on
  standard LIBERO, recovery success after a real execution failure falls
  sharply as recovery requires deeper state reasoning \u2014 retrying or
  adapting the immediate action works far more often than restoring a
  displaced task object or clearing an environmental obstruction \u2014 and
  rankings on the standard benchmark do not predict recovery rankings.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six VLA/WAM policies (pi0, pi0-Fast, GR00T-N1.5, OpenVLA-OFT, Wan2-Policy, Cosmos-Predict2-Policy) in LIBERO simulation, on 2178 scenarios built from failures the policies themselv"
sources:
  - source: arxiv-2609-05178
    stance: supports
    note: >-
      Validated by: Applied to six policies; all showed over 50% drops from
      standard LIBERO success to recovery success, with monotone decline
      across the four recovery levels and rank inversions relative to
      standard LIBERO (Wan2-Policy +14.4 on LIBERO-100 but -5.0 under
      failures).. Measured across four LIBERO suites and four difficulty
      levels; level labels and failure localization were assigned by an LLM
      over rendered videos, so the difficulty hierarchy is partly
      annotation-defined rather than independently validated, and level
      counts are imbalanced (L4 rates are often 0.0).
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A policy set whose
  standard LIBERO ranking reproduces its recovery ranking, or whose L3/L4
  recovery rates match its L1/L2 rates on failures drawn from its own
  rollouts.
