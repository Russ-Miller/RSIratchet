statement: >-
  In reported gains for LLM-based forecasting systems, a share of the
  measured improvement is attributable to the evaluation setup rather than
  temporal reasoning: ablations often show the LLM component adds no
  accuracy, predictions shift under small input perturbations, and benchmark
  gains on questions predating the training cutoff can reflect
  contamination.
