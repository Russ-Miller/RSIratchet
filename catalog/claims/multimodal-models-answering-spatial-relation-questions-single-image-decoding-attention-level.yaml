ref: CLM-0686
capability: visual-grounding
technique: supply-estimated-3d-geometry-structured-cards-mllm
statement: >-
  For multimodal models answering spatial-relation questions from a single
  image, decoding- and attention-level hallucination mitigations do not
  help, because the errors come from missing 3D structure rather than
  visual-textual misalignment; supplying externally estimated geometry
  (metric depth, gravity-aligned extents, object orientation) as structured
  text raises accuracy, and the size of the gain tracks the base model's
  ability to integrate structured input.
