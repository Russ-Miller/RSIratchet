id: prompt-injection-detectors-deployed-llm-coding-agents-classifier-style-guards-such
ref: CLM-1201
capability: prompt-injection
statement: >-
  For prompt-injection detectors deployed on LLM coding agents
  (classifier-style guards such as PromptGuard, Protect AI, PIGuard, Model
  Armor, TaskTracker), the low attack-success rates reported by their
  authors are measured against static attack sets and do not survive
  adaptive optimization: re-tested with gradient, RL or random-search
  attacks, every such defense is bypassed at 78-93% success.
kind: observation
backing_strength: replicated
observed_on:
  era: "Detection/classification defenses evaluated black-box; attacker can query the defended system and adapt payloads. Does not cover architectural defenses (capability scoping, channel"
sources:
  - source: arxiv-2601-17548
    stance: supports
    note: >-
      Meta-analysis of 78 sources; the headline numbers come from one
      adaptive-attack study (Nasr et al.) covering ~12 defenses, plus
      MCPSecBench and IDEsaster. No independent replication by these
      authors; the defense table is reproduced from a single source, so
      'replicated' rests on the three benchmarks agreeing in direction, not
      on repeated measurement of the same defenses.
contested: false
status: pending-review
last_checked_at: 2026-11-24
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An adaptive-attack
  evaluation of these same detectors, with an attacker allowed
  gradient/RL/search optimization, showing attack success below the authors'
  reported rates rather than near 80-90%. Drafted stance toward
  long-trusted-instructions-untrusted-retrieved-content-occupy-same-model:
  supports -- The synthesized bypass rates confirm that marking, filtering
  and classification defenses reduce but do not remove indirect injection,
  while isolation and capability restriction fare better.
