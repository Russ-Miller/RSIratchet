id: zero-shot-inference-behaviour-cognition-emotion-noisy-real-classroom-collaboration
ref: CLM-0888
capability: multi-model-coordination
technique: order-agents-observability-script-each-domain-theory
statement: >-
  For zero-shot inference of behaviour, cognition and emotion from noisy
  real classroom collaboration clips with one 8B multimodal backbone shared
  across agents, the gain from a staged
  behaviour-then-cognition-then-emotion agent pipeline comes about equally
  from splitting the task into separate specialised agents and from the
  domain-theory (self-regulated learning) wording of each agent's task spec,
  not from the sequential ordering itself: keeping the same order but
  collapsing to one agent costs 7.96 Macro-F1 and keeping the agents but
  replacing the theory-grounded instructions with generic ones costs 8.87.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,440 Finnish classroom collaboration clips, highly imbalanced labels, InternVL-3.5-8B backbone, greedy decoding, zero-shot; single dataset and single backbone"
sources:
  - source: arxiv-2605-09703
    stance: supports
    note: >-
      Validated by: Macro-F1 averaged over the three dimensions on 1,440
      clips: 42.77 vs 26.84 for the best single MLLM (InternVL-3.5) and
      39.28 for CAMEL with 3 agents on the same backbone; ablations remove
      the agent split (34.81), the SRL priors (33.90), and the video input
      (39.47).. Measured, single paper, one dataset and one backbone, no
      repeated runs or confidence intervals; absolute scores low (42.77
      Macro-F1) and the ablation of the multi-agent split confounds agent
      count with per-agent prompt specialisation.
