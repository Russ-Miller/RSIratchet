    stance: supports
    note: >-
      Validated by: Fine-tuning pi-0.5 and GR00T N1.5 under standard vs
      Play+Cyclic data: in simulation pi-0.5 went 120.5 to 207.1 tasks/hour
      and 30.5 to 49.9 s MTBI; GR00T N1.5 1.2 to 5.0 TPH. Real-world
      humanoid packing: pi-0.5 19 to 79 TPH and 46.1 to 94.6 s MTBI; GR00T
      N1.5 33 to 63 TPH and 53.7 to 78.2 s. Same 1-hour continuous-run
      protocol, same tasks.. Measured, not argued, on three RoboTwin 2.0
      tasks (three seeds) and one real humanoid task, with two independent
      baseline architectures showing the same direction. [truncated]
