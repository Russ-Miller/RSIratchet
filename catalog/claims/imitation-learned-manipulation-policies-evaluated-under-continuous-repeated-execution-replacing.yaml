id: imitation-learned-manipulation-policies-evaluated-under-continuous-repeated-execution-replacing
ref: CLM-1135
capability: embodied-control
technique: train-reset-free-cyclic-repetitions-plus-unlabeled-play
statement: >-
  For imitation-learned manipulation policies evaluated under continuous
  repeated execution, replacing 'success-then-stop' episode data with
  reset-free cyclic demonstrations plus unlabeled play data raises both
  throughput and mean time between human interventions, and the gain
  transfers across VLA architectures rather than being specific to one
  model.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Bimanual manipulation and humanoid logistics tasks run for 1 hour continuously with resets counted as interventions; shown for two public VLA checkpoints fine-tuned by the authors."
