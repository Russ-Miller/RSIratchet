id: no-thinking-controls-do-not-stop-visible-reasoning
ref: CLM-0514
capability: cutting-to-the-chase
statement: >-
  Across six models and six prompting interventions on Boolean,
  multiple-choice and open-ended questions, explicit controls to stop
  reasoning — a disabled thinking mode or an instruction to answer only —
  do not reliably eliminate visible inference before the answer: reasoning
  persists even under strict controls ("thinking inertia"), and it becomes
  more prevalent as the answer space opens, least on Boolean questions and
  most on open-ended ones; so a direct answer cannot be assumed from model
  settings or instructions alone.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2026, six LLMs; visible pre-answer text only, internal reasoning not measured"
  task_type: chat-assistant
sources:
  - source: arxiv-2610-11765
    stance: supports
    note: >-
      The paper's central finding. Responses are split into a pre-answer
      trace and a final answer and scored three ways: empty-thinking rate,
      question-to-preamble relevance, and an LLM-judged explicit-inference
      rate. The last uses an LLM judge, whose own biases are a known issue.
contested: false
status: pending-review
last_checked_at: "2026-10-18"
notes: >-
  First claim under cutting-to-the-chase. Also filed as evidence on
  Parkinson's law: offered no reasoning budget, the reasoning did not shrink
  to fit, which is the low-end case of effort being set by something other
  than the budget offered.
