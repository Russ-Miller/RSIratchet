id: closed-book-multi-hop-qa-accuracy-gain-decomposed-prompting-shrinks-little
ref: CLM-0295
capability: factual-recall
technique: abstain-disagreement-between-task-equivalent-prompt-regimes
statement: >-
  In closed-book multi-hop QA the accuracy gain from decomposed prompting
  shrinks to little in frontier models, but answers still change between
  task-equivalent prompt regimes (agreement only about 70%, and about 60% on
  MuSiQue), and because stable facts survive re-prompting while
  hallucinations do not, disagreement across regimes detects errors better
  than standard uncertainty baselines on F1 and AUROC without retrieval or
  training.
kind: mechanism
backing_strength: single-paper
