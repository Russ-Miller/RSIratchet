id: rl-trained-multimodal-image-quality-models-supervising-reasoning-rating-reward-buys
ref: CLM-0478
capability: explanation-faithfulness
technique: reward-reasoning-whether-edit-prescribes-improves-image
statement: >-
  In RL-trained multimodal image-quality models, supervising the reasoning
  with the rating reward buys rating accuracy without faithfulness: a
  rating-only trained actor reached average PLCC/SRCC of 0.836/0.815 while
  the edits its stated quality factors prescribe made images worse by a
  frozen judge's score (mean change -0.260, below the untrained baseline's
  -0.136).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Blind image quality assessment with a 4B multimodal actor trained by GRPO on KonIQ-10k; faithfulness measured as judge-scored quality change after a frozen diffusion editor applies"
sources:
  - source: arxiv-2608-18579
    stance: supports
    note: >-
      Validated by: Mean judge-scored quality gain on a 5,866-image subset:
      +0.789 for the trained actor vs +0.213 for Q-Insight and -0.137 for
      the untrained backbone; direction preserved when the editor is swapped
      (Mage-Flow) and when the judge is swapped (Q-Insight, GPT-5.6 Sol,
      81.4% 3AFC win); rating accuracy stayed near the best comparable
      baselines.. Measured within one paper on one training split and one
      backbone. Ablation isolates rating-only vs reasoning-rewarded training
      on the same setup. [truncated]
