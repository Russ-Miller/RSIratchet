id: zero-shot-risk-forecasting-tabular-weather-features-rare-event-5-positive
ref: CLM-0252
capability: forecasting
statement: >-
  For zero-shot risk forecasting from tabular weather features on a
  rare-event (~5% positive) binary severity task, GPT-4o/4.1 class models
  trail simple supervised classifiers (logistic regression, LightGBM)
  trained on the same data on macro-F1 and precision at every 3h/6h/12h
  horizon, and the weaker models close the gap only by flagging nearly every
  window as high risk.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six years of central-Texas utility outage records plus gridded weather; four OpenAI models, no in-context examples, fixed 0.5 probability threshold, leave-one-year-out evaluation f"
sources:
  - source: arxiv-2609-04272
    stance: supports
    note: >-
      Measured: macro-F1 gap of 0.04-0.13 between best supervised model and
      best LLM across six horizon/configuration cells; GPT-4o-mini recall
      0.78-0.97 at precision 0.05-0.07. Single utility, single region,
      single prompt template, uncalibrated 0.5 threshold, so the comparison
      does not isolate prompt or threshold tuning from model ability.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A zero-shot LLM matching
  or beating tuned supervised classifiers on macro-F1 and precision for the
  same rare-event tabular risk task under the same evaluation split. Drafted
  stance toward forecasting-underperforms-humans-without-scaffolding:
  supports -- Adds a case where unscaffolded zero-shot LLM prediction trails
  a task-specific baseline trained on labelled data.
