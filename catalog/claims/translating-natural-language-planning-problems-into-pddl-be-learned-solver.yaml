capability: planning
technique: actor-judge-editor-rl-solver-feedback-nl-to
statement: >-
  Translating natural-language planning problems into PDDL can be learned
  from solver feedback alone, with one model acting as actor, judge and
  editor: on PlanBench average success rose from 35.5% (LLM+P) to 70.8%,
  with 66.3% of successes judged faithful to the described task and semantic
  drift, where a solvable but wrong problem is produced, cut to 6.4%.
