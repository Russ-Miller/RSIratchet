    note: >-
      Validated by: PlanBench success, faithful-success and semantic-drift
      rates against LLM+P and other baselines; faithfulness checks separate
      solver success from task fidelity.. The separate faithfulness metric
      addresses the known failure of counting any solvable PDDL as success;
