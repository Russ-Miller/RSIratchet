id: 2b-4b-instruct-models-fine-tuned-grpo-ternary-reward-correct-1
ref: CLM-0956
capability: abstention-and-self-knowledge
technique: reward-abstention-tuned-ternary-rlvr-reward
statement: >-
  For 2B-4B instruct models fine-tuned with GRPO on a ternary reward
  (correct +1, wrong -1, 'I don't know' r_abs), abstention rate rises and
  accuracy falls monotonically as r_abs goes from -0.5 toward 0, so r_abs is
  a tunable knob rather than a setting that buys hallucination reduction for
  free, and the usable band is narrow (around -0.25 to 0.3 on
  multiple-choice, where small models collapse to 100% abstention at
  r_abs=0.3 while a 4B model still answers).
kind: mechanism
