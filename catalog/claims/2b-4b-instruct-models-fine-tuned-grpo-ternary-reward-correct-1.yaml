    stance: supports
    note: >-
      Validated by: Correct/incorrect/IDK response distributions on held-out
      ~100-sample MedMCQA and MATH sets, compared against the base model
      with and without an IDK option; r_abs swept from -0.95 to 0.3..
      Measured, but on ~100-sample held-out test sets with single runs and
      no confidence intervals; two models, two datasets. The monotone trend
      is consistent across all tables, but the specific optimal r_abs values
      differ by model and dataset, so the band is weakly established.
