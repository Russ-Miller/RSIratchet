id: 32b-open-backbone-multi-step-math-combinatorial-reasoning-running-memory-guided
ref: CLM-0533
capability: multi-step-reasoning
technique: dual-stream-neural-python-answers-decay-pruned-schema
statement: >-
  For a 32B open backbone on multi-step math and combinatorial reasoning,
  running a memory-guided neural answer and a single-pass Python-executed
  answer in parallel and adjudicating only when they disagree raises
  exact-match accuracy over direct prompting and over tree- and
  buffer-structured baselines, with the symbolic execution path contributing
  most on arithmetic-heavy sets and the schema memory most on the hardest
  long-chain set.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen-32B backbone; GSM8K, GSM-Hard, ASDiv, SVAMP, MGSM, Game of 24, WordSorting, Checkmate; baselines partly cited from other papers on GPT-4/Codex backbones"
sources:
  - source: arxiv-2606-02054
    stance: supports
    note: >-
      Validated by: Exact-match accuracy on five math sets plus three
      combinatorial tasks against direct prompting with the same backbone
      and against published ToT/BoT/PaL numbers; component ablations
      removing memory, symbolic execution, or refinement.. Measured on eight
      benchmarks with one backbone and ablations, but the strongest
      comparisons (BoT, ToT, PaL) are numbers cited from other papers on
      different backbones, no compute- or token-matched baseline is
      reported, and the 100% Game of 24 result and 0.395 direct GSM8K
      baseline are both unusual enough to warrant caution.
