id: multimodal-web-agents-live-websites-retrieving-human-authored-how-to-guides
ref: CLM-1112
capability: tool-use
technique: retrieve-human-written-site-guides-before-acting
statement: >-
  For multimodal web agents on live websites, retrieving human-authored
  how-to guides before execution to synthesize a short site-specific plan
  contributes more to task success than the agent's grounding, checklist, or
  memory modules, because it replaces open-ended trial-and-error exploration
  with a known navigation path.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Live, real-world websites with site-specific workflows (Online-Mind2Web); measured on a 50-task subset with a Gemini 3 Flash backbone."
sources:
  - source: arxiv-2602-02468
    stance: supports
    note: >-
      Validated by: Ablation on a 50-task Online-Mind2Web subset: removing
      Experience-Imitation Planning dropped success from 48.0% to 36.0%, the
      largest single-component drop (grounding -8.0, checklist -4.0); full
      system reached 53.7% on the 300-task benchmark vs 30.0% for the best
      open-source baseline.. Measured, single paper. Main result is a
      300-task benchmark score with an LLM judge (85.7% agreement with
      humans); [truncated]
contested: false
