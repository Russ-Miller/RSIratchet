    note: >-
      Validated by: Charades-STA mIoU 51.30 vs 45.69 for the strongest prior
      training-free method (TAG), and vs 45.41/44.03 when TAG/TFVTG are
      re-run on the same backbone; QVHighlights 38.64 mAP vs 33.15.
      Component ablation: 45.69 base, 47.06 with Q-TTA only, 50.25 with MSF
      only, 51.30 both. Granularity ablation on the same backbone:
      frame-only 47.06, clip-only 42.82, fused 51.30. Also OOD splits
      Charades-CG and Charades-CD.. [truncated]
