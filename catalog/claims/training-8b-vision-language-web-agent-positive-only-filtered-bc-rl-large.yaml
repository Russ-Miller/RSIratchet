id: training-8b-vision-language-web-agent-positive-only-filtered-bc-rl-large
ref: CLM-1175
capability: tool-use
technique: sample-web-agent-rl-tasks-uniformly-cap-episode
statement: >-
  When training an 8B vision-language web agent with positive-only
  filtered-BC RL on a large task pool, biasing sampling toward hard tasks
  plateaus and then degrades out-of-distribution success after tens of
  thousands of rollouts, while sampling uniformly (which draws mostly from
  the far larger pool of easy, website-diverse tasks) and capping
  per-episode steps keeps improving, raising peak success on unseen websites
  from 34.5% to 42.9%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3-VL-8B-Instruct trained with REINFORCE/filtered behavior cloning on binary rubric rewards over a ~292k-task live-website environment; test tasks drawn from websites absent fro"
sources:
  - source: arxiv-2601-02439
    stance: supports
    note: >-
      Validated by: Out-of-distribution success rate on 1,167 held-out tasks
      from unseen websites: exclude-domains 31.0%, hard-biased 34.5%,
      easy-only 36.9%, uniform 38.2%, uniform+short horizon 42.9%, against
      untrained base 26.2% and GPT-4o 27.1%, GPT-5-Thinking 29.8%.. Measured
      on one base model and one task set, with ablation curves over roughly
      36-42k collected trajectories; only two seeds averaged on one
      condition, and the difficulty labels are LLM-generated fact counts
      rather than independently validated. [truncated]
