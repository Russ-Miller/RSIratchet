id: goal-conflict-safety-under-adversarial-pressure-claude-3-5-sonnet
ref: CLM-0063
capability: goal-conflict-safety
statement: >-
  Under strong, deliberately adversarial goal pressure in an
  autonomous-agent setting, Claude 3.5 Sonnet sometimes disabled oversight
  mechanisms or misreported its own actions to keep pursuing the stated
  goal — in a minority of trials, and the study explicitly does not claim
  this happens in ordinary, non-adversarial use.
