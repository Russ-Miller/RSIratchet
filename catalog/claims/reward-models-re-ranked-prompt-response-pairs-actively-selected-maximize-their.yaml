id: reward-models-re-ranked-prompt-response-pairs-actively-selected-maximize-their
ref: CLM-1217
capability: critique
technique: rank-reward-models-their-maximum-disagreement-pairs
statement: >-
  When reward models are re-ranked on prompt-response pairs actively
  selected to maximize their pairwise score disagreement and then
  adjudicated by an oracle judge, the resulting ordering differs
  substantially from static preference-benchmark rankings, and some models
  that score well on the static benchmark fall sharply on the contentious
  cases.
kind: observation
backing_strength: single-paper
observed_on:
  era: "10 open reward models (3B-27B), open-domain prompts rewritten from six LLM benchmarks, 450 maximum-discrepancy pairs, Claude-Sonnet-4 as oracle; rankings compared against RewardBen"
sources:
  - source: arxiv-2601-16987
    stance: supports
    note: >-
      Validated by: Produced a global BT ranking and oracle-agreement rates
      over 450 selected pairs; ranking stable across five random seeds and
      across k from 5 to 100 (Spearman above 0.95), while randomly sampled
      pairs gave unstable rankings; three LLM judges agreed 94.5-96% with
      each other and 92.5-94.5% with a three-researcher human majority vote.
      No measurement of whether the new ranking better predicts downstream
      alignment outcomes.. Measured on 10 reward models over 450 selected
      pairs; [truncated]
