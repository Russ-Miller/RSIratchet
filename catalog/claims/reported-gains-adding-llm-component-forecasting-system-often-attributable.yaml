id: reported-gains-adding-llm-component-forecasting-system-often-attributable
ref: CLM-0472
capability: forecasting
technique: contamination-resistant-live-forecasting-evaluation
statement: >-
  Reported gains from adding an LLM component to a forecasting system are
  often not attributable to temporal reasoning: across the LLM-forecasting
  literature, ablations show cases where removing the LLM does not lower
  accuracy, predictions shift under small input perturbations, and benchmark
  gains can be explained by training-data contamination over past events.
kind: observation
backing_strength: single-paper
