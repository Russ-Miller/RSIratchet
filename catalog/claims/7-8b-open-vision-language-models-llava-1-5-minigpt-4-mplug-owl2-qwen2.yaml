id: 7-8b-open-vision-language-models-llava-1-5-minigpt-4-mplug-owl2-qwen2
ref: CLM-0969
capability: visual-grounding
technique: scale-layer-editing-strength-truthful-vs-hallucinated-attention
statement: >-
  In 7-8B open vision-language models (LLaVA-1.5, MiniGPT-4, mPLUG-Owl2,
  Qwen2/3-VL), susceptibility to object hallucination is not uniform across
  decoder layers — the divergence between truthful and hallucinated
  attention distributions peaks at mid-depth and is lowest at early and late
  layers — so scaling null-space weight editing per layer by that divergence
  lowers CHAIR hallucination rates further than applying the same full
  projection to every layer.
kind: mechanism
