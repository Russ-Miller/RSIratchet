      MiniGPT-4, mPLUG-Owl2 (e.g. LLaVA-1.5 CHAIR_s 15.20 for
      uniform-projection Nullu vs 13.80), plus MME perception sub-scores and
      GPT-4V-aided accuracy/detailedness on LLaVA-Bench; an ablation removes
      the per-layer weighting.. Measured on three LVLM backbones plus two
      Qwen-VL models against decoding-time and editing baselines, with the
      uniform-projection method (Nullu) as the direct control and an
      ablation on the weighting. Variance reported over three runs.
