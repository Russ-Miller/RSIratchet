id: entity-centric-evidence-grounded-qa-fact-verification-substituting-named-entities-type-matched
ref: CLM-0600
capability: abstention-and-self-knowledge
technique: abstain-answers-fail-track-entity-substitutions
statement: >-
  For entity-centric evidence-grounded QA and fact verification,
  substituting named entities with type-matched synthetic names and checking
  that the answer transforms correspondingly (back-maps to the original
  answer) detects ungrounded answers that self-consistency and
  evidence-sufficiency scores both miss, because synthetic names reduce the
  parametric activation that keeps a memorised answer stable under
  perturbation.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tasks whose questions and evidence are organised around named entities with reliable NER; not math or procedural reasoning; English only; tested on three backbones (GPT-5.1, LLaMA-"
sources:
  - source: arxiv-2608-28018
    stance: supports
    note: >-
      Validated by: Four benchmarks (HotpotQA, MIRAGE, FaithEval, FEVER) x
      three backbones against seven abstention baselines on
      F1/Acc/Reliability Score/Abstention Rate; on a 200-item hard subset
      where self-consistency agreement >=0.8 and sufficiency score >=0.5,
      abstention rate 0.71 vs 0.09 and 0.11; ablation shows removing
      back-mapping costs 0.067-0.076 RS and using real Wikipedia entities
      instead of synthetic ones costs 0.103-0.115 RS; human agreement
      83.5%.. [truncated]
