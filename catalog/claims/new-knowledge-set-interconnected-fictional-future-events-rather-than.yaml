id: new-knowledge-set-interconnected-fictional-future-events-rather-than
ref: CLM-0457
capability: knowledge-updating
technique: update-knowledge-synthetic-news-mid-training-plus-abstention
statement: >-
  When new knowledge is a set of interconnected fictional future events
  rather than isolated fact edits, updating 4-8B instruct models by
  mid-training on teacher-generated long-form articles plus preference
  tuning (preferring reasoned answers over outdated, hallucinated, or
  needlessly abstaining ones) beats graph-retrieval and in-context editing
  baselines on multi-hop and causal questions, while remaining worse than
  in-context methods on exact numeric single-hop recall unless retrieved
  facts are also supplied.
kind: observation
backing_strength: single-paper
observed_on:
  era: "LLaMA-3.1-8B, Olmo-3-7B and Gemma-3-4B instruct models; 20 to 1,536 inserted facts from a synthetic future-event knowledge graph; GPT-4.1 as the teacher generating the synthetic da"
