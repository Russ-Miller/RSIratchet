  - source: arxiv-2609-00184
    stance: supports
    note: >-
      Validated by: QA accuracy on the ParallelEvents benchmark (single-hop,
      multi-hop, causal) after inserting 542 facts: 73.67% (LLaMA-3.1),
      64.92% (Olmo-3), 79.07% (Gemma-3) versus best in-context baseline IKE
      at 63.32/57.73/53.73%, graph-retrieval baselines at 17.09%, and
      LoRA/single-layer tuning at 12.02%; paired bootstrap significance;
      general-ability checks on MMLU-Pro, PopQA, IFEval, IFBench;
