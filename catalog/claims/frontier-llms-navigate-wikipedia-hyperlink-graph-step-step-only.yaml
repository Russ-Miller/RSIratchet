id: frontier-llms-navigate-wikipedia-hyperlink-graph-step-step-only
ref: CLM-0987
capability: planning
statement: >-
  When frontier LLMs navigate the Wikipedia hyperlink graph step by step
  with only local link lists and a visit history, they adopt sensible
  high-level strategies (moving to broad hub pages) yet fail at revising a
  failing strategy: they revisit pages and loop in most hard instances, and
  loop frequency predicts failure almost one-for-one across model families.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Interactive multi-step navigation over a 549k-page Wikipedia link graph, no global graph access, 30-step budget, 50 candidate links per step; hard split defined by shortest path 7-"
sources:
  - source: arxiv-2602-16902
    stance: supports
    note: >-
      Measured on 20+ models over easy/medium/hard splits; best model 29% on
      hard. Loop analysis from 18 hand-sampled trajectories per model for
      Gemini 3 and Claude Opus 4.5 (loops in 86% and 92% of hard tasks, 10%
      and 1% solved among looping trajectories) plus a cross-model
      regression of success on loop frequency (coefficient -1.02, 95% CI
      -1.13 to -0.91). The regression is correlational across models and
      cannot separate looping as cause from looping as symptom of weak world
      knowledge.
contested: false
status: pending-review
last_checked_at: 2026-11-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model with high loop
  frequency that still solves most hard instances, or trajectory analysis
  showing failures come from poor initial strategy rather than from
  unresolved repeated states.
