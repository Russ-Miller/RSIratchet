id: prompting-model-behave-if-knowledge-ended-earlier-date-works
ref: CLM-0319
capability: factual-recall
statement: >-
  Prompting a model to behave as if its knowledge ended at an earlier date
  works for facts asked about directly (about 82% unlearning success) and
  for word-sense shifts (about 70%), but fails when the post-cutoff
  knowledge is only causally connected to the question (about 19%), so a
  simulated cutoff cannot be trusted to remove contamination from temporal
  prediction tests.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three popular LLMs with tuned meta-prompts, three purpose-built subsets (factual, semantic, counterfactual), 2025."
sources:
  - source: arxiv-2510-02340
    stance: supports
    note: >-
      Also bears on knowledge-updating; the counterfactual subset is the
      discriminating test.
contested: false
status: pending-review
