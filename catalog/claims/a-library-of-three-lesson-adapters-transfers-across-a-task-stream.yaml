id: a-library-of-three-lesson-adapters-transfers-across-a-task-stream
ref: CLM-0523
capability: self-repair
technique: lesson-adapter-library
statement: >-
  Lessons written into adapters transfer beyond the task they came from: on
  all 165 GAIA tasks interleaved at random as a deployment stream, an agent
  starting with an empty library capped at three adapters raised success
  across the whole stream from 36.4% to 52.7%, the three adapters together
  taking 256 MB — so a handful of lessons served dozens of tasks without
  further training.
