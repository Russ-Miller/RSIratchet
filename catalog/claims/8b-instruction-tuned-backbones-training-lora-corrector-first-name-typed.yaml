      MMLU, PIQA) on Llama-3-8B-Instruct: average 67.5 vs 64.3 for the
      strongest same-backbone baseline (DiffCoT) and 63.7 for SCoRe, five
      seeds, Holm-corrected; seven transfer targets on two backbones;
      ablations removing each loss term and each noise source.. Measured on
