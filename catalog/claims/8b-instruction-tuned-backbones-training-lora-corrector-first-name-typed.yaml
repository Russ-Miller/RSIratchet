id: 8b-instruction-tuned-backbones-training-lora-corrector-first-name-typed
ref: CLM-0351
capability: self-repair
technique: correct-reasoning-predicting-typed-error-operator-inverting
statement: >-
  For 8B instruction-tuned backbones, training a LoRA corrector to first
  name a typed error operator (error type, step location, corrupted and
  repaired proposition) and then apply only that localized inverse edit
  yields higher final accuracy than free-form self-revision correctors
  (Self-Refine, RISE, SCoRe) across math, code and commonsense benchmarks,
  and ablating either the operator-prediction or the
  adjacent-state-reconstruction loss lowers accuracy.
kind: mechanism
