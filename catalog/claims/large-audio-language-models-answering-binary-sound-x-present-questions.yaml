notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Show that the
  silent-reference yes/no margin is not label-agnostically positive, or that
  gating at the first step gives no F1 gain over fixed-strength contrastive
  decoding, or that the gain does not come with a drop in true-Yes recall.
  Proposed technique, not catalogued: first-step confidence-gated
  affirmative-token penalty against a silent-audio reference.
