statement: >-
  For judging the naturalness of synthesized speech, a reward model trained
  to first extract explicit acoustic features and then reason over them
  agrees with expert human ratings better than scalar regressors that map
  raw audio directly to a score, and generalizes to out-of-domain
  user-assistant speech.
