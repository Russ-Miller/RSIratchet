id: instruction-tuned-open-weight-models-told-plain-language-think-about-concept
ref: CLM-0404
capability: strategic-deception
technique: track-activation-controllability-standing-eval
statement: >-
  Instruction-tuned open-weight models, told in plain language not to think
  about a concept while performing a simple transcription task, can push
  that concept's residual-stream signal below the detection threshold of
  linear probes, Jacobian lens, activation oracles and natural-language
  autoencoders, while the same monitors catch instructed engagement near
  ceiling — with no fine-tuning or optimization against the monitors.
kind: observation
backing_strength: single-paper
observed_on:
  era: "25 open-weight instruct models, 4B-744B, 2024-2026; concrete safe concepts (e.g. bread), not safety-relevant representations; verbatim-transcription task; off-the-shelf monitors no"
sources:
  - source: arxiv-2608-21664
    stance: supports
    note: >-
      Validated by: Applied to 25 open-weight models; score ranged
      0.059-0.538, did not track parameter count, and rose across Olmo
      training checkpoints — so it discriminates between models. Not
      validated as predicting real monitor failure on safety-relevant
      concepts.. Measured: monitor detection at 1% FPR fell to 5-21% for 'do
      not think about' while 'think about' stayed near ceiling across nine
      models; J-lens recovered the concept in under 10% of suppression
      trials in 11 of 13 models; NLA named the concept in 0 of 500
      suppression trials. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Show that under the same
  prompt-only instruction, suppression trials are detected by linear probes
  or richer monitors at rates comparable to engagement trials, or that the
  observed suppression gap is an artifact of the concept-direction readout
  rather than internal modulation.
