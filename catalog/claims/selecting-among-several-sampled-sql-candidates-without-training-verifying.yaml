id: selecting-among-several-sampled-sql-candidates-without-training-verifying
ref: CLM-0872
capability: formal-query-synthesis
technique: verify-sql-candidates-synthesized-distinguishing-database-against-parallel
statement: >-
  For selecting among several sampled SQL candidates without training,
  verifying the top two execution-distinct candidates against a synthesized
  small adversarial database plus an independently generated Python/Pandas
  solution of the same question raises execution accuracy over
  self-consistency and LLM-as-judge selection, with the gain concentrated on
  cases where the majority vote is wrong.
