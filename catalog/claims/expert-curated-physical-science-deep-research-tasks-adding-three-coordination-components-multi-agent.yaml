capability: multi-model-coordination
technique: pair-adaptive-replanning-shared-memory-physics-verifiers
statement: >-
  On expert-curated physical-science deep-research tasks, adding three
  coordination components to a multi-agent framework \u2014 replanning on
  intermediate outcomes, a shared experience/knowledge memory, and step-
  plus trajectory-level physics verification \u2014 accounts for most of its
  advantage over the strongest generalist deep-research agent, but the
  components partly substitute for one another: removing any one costs
  2.5-3.0 points while removing all three costs 6.5, less than the 8.5
  summed.
