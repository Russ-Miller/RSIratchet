id: dpo-alignment-7-8b-instruct-models-alignment-tax-predictable-properties
ref: CLM-0371
capability: fine-tuning-retention
technique: filter-preference-pairs-reference-margin-length-gap-lexical
statement: >-
  In DPO alignment of 7-8B instruct models, the alignment tax is predictable
  from properties of the preference pairs themselves: pairs whose
  chosen/rejected log-probability margin under the reference model is large
  in magnitude, or whose chosen/rejected token-length difference is large,
  cause the most loss of general capability, so dropping them keeps most of
  the alignment gain while cutting forgetting.
