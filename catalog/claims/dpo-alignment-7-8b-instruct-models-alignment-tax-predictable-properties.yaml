    note: >-
      Validated by: Against Full, Random, and nine SFT/alignment
      data-selection baselines at a fixed 5% budget on HH-RLHF:
      general-capability drop 0.86/0.38 points (Llama/Qwen, helpfulness)
      versus 5.35/2.31 for full-data DPO, while alignment gain stayed near
      the best baseline; bucket experiment shows forgetting rising from 0.08
      to 3.48 across reference-margin quantiles; ablation removing each
      score degrades either forgetting or alignment.. [truncated]
