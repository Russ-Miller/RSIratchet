id: multi-agent-literary-translation-pipelines-built-one-base-llm-selecting
ref: CLM-1211
capability: multi-model-coordination
technique: route-agent-workflow-stylistic-signal-source-text
statement: >-
  For multi-agent literary translation pipelines built from one base LLM,
  selecting the agent workflow per text segment from a computed stylistic
  signal beats running either fixed workflow on all segments, and the two
  fixed workflows each win on different segments so neither is universally
  better.
kind: observation
backing_strength: single-paper
observed_on:
  era: "English-centric translation across five language pairs on FLORES-200 and WMT24, four base models, two hand-built workflows routed by a thresholded wavelet-derived feature of word-l"
sources:
  - source: arxiv-2602-19840
    stance: supports
    note: >-
      Validated by: XCOMET and COMETKIWI-23 on FLORES-200 and WMT24 against
      single-LLM and multi-agent baselines, plus an ablation against each
      fixed workflow (Qwen3-235B en->xx: 96.78 routed vs 91.33 and 95.86
      fixed) and head-to-head human style-fidelity preference against five
      baselines.. Measured on two benchmarks with four base models, with an
      ablation isolating routing from the agent pool. Routing thresholds
      were fitted on a separate 200-segment set, so routing is not tuned on
      test. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Under matched agent budget
  and the same base model, always running the stronger of the two fixed
  workflows matches or beats signal-based routing across the same
  benchmarks; or the routed gain disappears when the routing signal is
  replaced with a random assignment.
