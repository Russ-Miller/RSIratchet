id: text-to-sql-benchmarks-aggregate-accuracy-hides-steep-difficulty-gradient-pre-trained-language-model-based
ref: CLM-0272
capability: formal-query-synthesis
statement: >-
  On text-to-SQL benchmarks, aggregate accuracy hides a steep difficulty
  gradient: pre-trained-language-model-based parsers resolved roughly 80% of
  Spider cases overall but only about 50% of its extra-hard cases, and as
  natural-language understanding improved the residual errors shifted toward
  database-side problems — large schemas, ambiguous columns, dirty cell
  values — rather than language parsing.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Spider-style cross-domain text-to-SQL benchmarks; PLM-era and early LLM-era systems; claim about where errors concentrate, not about any one model's current score."
sources:
  - source: arxiv-2408-05109
    stance: supports
    note: >-
      Survey, not new measurement: cites reported Spider figures (~80%
      overall, ~50% extra hard) and characterizes the field's shift toward
      schema linking, content retrieval, and domain-knowledge modules as
      evidence of where errors sit. No controlled experiment isolating
      language vs database causes.
