id: zero-shot-binary-risk-classification-rare-weather-driven-power-outages-tabular
capability: forecasting
statement: >-
  On zero-shot binary risk classification of rare weather-driven power
  outages from tabular weather features, GPT-4o/4.1-class models trail
  supervised classifiers trained on the same data by 0.04-0.13 macro-F1 and
  have much lower precision, and they gain little from being given the full
  forecast window rather than only current observations, while supervised
  models gain more from forecast features.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six years of one central Texas utility's outage records with ~5% positive rate; 3/6/12-hour horizons; fixed 0.5 probability threshold, no in-context examples; supervised baselines "
sources:
  - source: arxiv-2609-04272
    stance: supports
    note: >-
      Four OpenAI models vs two supervised baselines, three horizons, two
      input configurations, single utility service area; imbalanced labels
      with untuned 0.5 threshold, so LLM precision/recall operating point is
      not calibrated, which confounds the precision gap.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A zero-shot LLM matching
  or beating tuned supervised classifiers on macro-F1 and precision on the
  same outage data, or showing large gains from forecast-window inputs
  comparable to the supervised models'. Drafted stance toward
  forecasting-underperforms-humans-without-scaffolding: supports --
  Unscaffolded zero-shot LLMs underperform data-fitted supervised baselines
  on a real forecasting task.
