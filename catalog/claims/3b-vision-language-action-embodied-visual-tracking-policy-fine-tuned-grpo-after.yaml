capability: embodied-control
technique: train-tracker-against-adaptive-competing-opponent
statement: >-
  For a 3B vision-language-action embodied visual tracking policy fine-tuned
  with GRPO after SFT in Habitat, training against a second agent that runs
  the same policy and competes for the same target yields larger
  success-rate gains than training against a static obstacle or a randomly
  moving interferer, which gives little gain or degrades performance.
