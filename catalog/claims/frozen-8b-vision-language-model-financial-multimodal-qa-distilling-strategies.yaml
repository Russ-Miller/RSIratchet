id: frozen-8b-vision-language-model-financial-multimodal-qa-distilling-strategies
ref: CLM-0612
capability: harness-self-improvement
technique: distilled-experience-memory
statement: >-
  For a frozen 8B vision-language model on financial multimodal QA,
  distilling strategies from correct and cautions from failed training
  trajectories into a read-only experience bank retrieved by cosine
  similarity adds accuracy on top of a deterministic tool suite (FinMMR Easy
  74.08 to 81.67), but the gain saturates as the bank grows past roughly
  1,800 entries and reverses if more than about five entries are injected
  per query.
kind: observation
