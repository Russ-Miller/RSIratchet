id: repository-level-code-generation-domain-specific-language-thinly-represented-pretraining-solidity
ref: CLM-0718
capability: code-generation
technique: fine-tune-domain-spec-code-pairs-instead-prompting
statement: >-
  For repository-level code generation in a domain-specific language thinly
  represented in pretraining (Solidity smart contracts, 7B code models),
  prompting-based adaptation gives only partial gains — structured
  chain-of-thought lifts the weakest model most and in-context learning
  saturates past about two examples, with retrieval-augmented generation
  best among non-parametric methods — while supervised fine-tuning on domain
  spec-code pairs gives the largest improvement in semantic correctness.
kind: observation
