id: distilling-lessons-from-failures-as-well-as-successes-beats-raw-trajectory-memory
ref: CLM-0516
capability: harness-self-improvement
technique: distilled-experience-memory
statement: >-
  On web-browsing (WebArena, Mind2Web) and software-engineering
  (SWE-Bench-Verified) benchmarks, an agent that distills reusable
  strategies from both its successful and its failed attempts, judged by an
  LLM without ground truth, and retrieves the relevant ones on later tasks,
  outperforms memories that store raw trajectories or only successful
  routines — up to 20% relative improvement in success and up to 16% fewer
  interaction steps — with the weights unchanged; including the failures is
  part of the gain, not noise.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2025, Gemini 2.5 and Claude 3.7 agent backbones on WebArena, Mind2Web, SWE-Bench-Verified"
  task_type: autonomous-agent
conditions:
  effect: helps
  cost: moderate
  helps_most: independent
  fails_when: >-
    The agent cannot judge its own outcomes even roughly: the gain held for
    judges between 70% and 90% accurate and was best with ground truth, and
    the paper does not test tasks where outcomes are hard to judge at all.
sources:
  - source: arxiv-2509-25140
    stance: supports
    note: >-
      Table 1 for the headline gains and step counts; the ablation that adds
      failed trajectories for the failure contribution. "Up to" figures are
      the best case across settings, not the typical one.
contested: false
status: pending-review
last_checked_at: "2026-10-19"
notes: >-
  Weights frozen throughout, so the improvement lives in the memory, not
  the model: evidence for the narrows verdict on practice makes perfect. The
  paper's test-time scaling extension (MaTTS) is not filed separately.
