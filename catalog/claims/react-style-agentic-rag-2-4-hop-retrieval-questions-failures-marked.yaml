id: react-style-agentic-rag-2-4-hop-retrieval-questions-failures-marked
ref: CLM-1033
capability: multi-step-reasoning
statement: >-
  For ReAct-style agentic RAG on 2-4 hop retrieval questions, failures are
  marked by a mismatch between the number of reasoning steps taken and the
  task's hop count: correct answers use step counts close to the hop number
  while incorrect ones both terminate early and over-extend, so longer
  reasoning is not what separates success from failure.
kind: observation
backing_strength: single-paper
observed_on:
  era: "13 closed- and open-source models under one unified ReAct harness on a 1,305-item Wikipedia-derived benchmark with 3- and 4-hop subsets; no intervention tested"
sources:
  - source: arxiv-2602-19127
    stance: supports
    note: >-
      Measured: average steps on correct vs incorrect responses per model on
      3- and 4-hop subsets, plus EM/F1/LLM-judge accuracy. Step counts on
      failures exceed those on successes for most models and are described
      as more variable in both directions. The design is observational — no
      manipulation of step budget — so it does not establish that
      mis-allocated steps cause the errors rather than reflecting them; the
      error case study argues the cause is bad initial decomposition.
contested: false
status: pending-review
last_checked_at: 2026-11-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A study where incorrect
  trajectories' step counts cluster as tightly around the hop number as
  correct ones, or where accuracy rises monotonically with step count beyond
  the hop number.
submitted_by: agent:claude-opus-5@Russ-Miller