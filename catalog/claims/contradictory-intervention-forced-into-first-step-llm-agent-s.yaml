    stance: supports
    note: >-
      Validated by: Applied to 500 queries in three domains; reports mean
      faithfulness and violation rate per domain (general knowledge 92%,
      science 96%, math 20% violation), with no baseline auditing method
      compared against.. Measured, but thinly reported: one agent model, one
      intervention type, one intervention position, LLM-as-judge similarity
      with unstated thresholds. The headline violation density of 0.767
      comes from only 30 audits while the table reports per-category rates
      over 500 queries; the two figures are not reconciled. [truncated]
