id: contradictory-intervention-forced-into-first-step-llm-agent-s
ref: CLM-1037
capability: explanation-faithfulness
technique: flip-one-reasoning-step-measure-answer-shift
statement: >-
  When a contradictory intervention is forced into the first step of an LLM
  agent's chain of thought, the final answer stays semantically unchanged
  far more often on factual and scientific queries than on
  mathematical-logic queries, because the model reverts to a parametric
  prior rather than following the altered reasoning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-node logic-flip intervention at the first reasoning step of a GPT-4o-based agent; semantic equivalence judged by a separate LLM; 500 queries across general knowledge, scienc"
sources:
