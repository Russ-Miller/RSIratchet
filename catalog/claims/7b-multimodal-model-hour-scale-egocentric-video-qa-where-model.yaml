id: 7b-multimodal-model-hour-scale-egocentric-video-qa-where-model
ref: CLM-1017
capability: video-temporal-reasoning
technique: extract-summarize-temporal-window-then-ask-question
statement: >-
  For a 7B multimodal model on hour-scale egocentric video QA, where the
  model's frame cap (768 frames) under-samples videos longer than ~12
  minutes, a two-stage pipeline that first extracts, crops, concatenates or
  chunk-narrates the relevant temporal context and only then poses the
  question scores higher than asking the temporal question directly in a
  single pass.
