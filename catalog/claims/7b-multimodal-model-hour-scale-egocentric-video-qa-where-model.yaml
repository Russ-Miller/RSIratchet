      Validated by: Reported +3.0% overall accuracy over direct VQA with the
      same pre-processing; the combined fine-tuning/T-CoT ablation moves
      overall accuracy from 37.5% to 41.6% on HD-EPIC VQA, with the largest
      per-prototype gains on localization and ordering tasks.. Single
      workshop-challenge system paper; measured on one benchmark with one
