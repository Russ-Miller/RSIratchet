id: synthesizing-regexes-user-intent-neither-natural-language-description-nor-positive
ref: CLM-0256
capability: formal-query-synthesis
technique: parse-description-into-sketch-then-search-examples
statement: >-
  For synthesizing regexes from user intent, neither a natural-language
  description nor positive/negative examples alone is sufficient —
  descriptions are ambiguous and small example sets underdetermine the
  pattern — so a system that parses the description into a structural sketch
  and uses it to guide example-based search solves far more tasks than
  either modality alone (80% vs 43% NL-only and 26% examples-only on 300+
  regexes).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Regexes over a fixed DSL, tasks drawn from a stylized NL dataset and from StackOverflow questions that already supply both a description and examples; the NL parser is a grammar-ba"
sources:
  - source: arxiv-1908-03316
    stance: supports
    note: >-
      Validated by: Exact-match against ground-truth regexes on 200 adapted
      DeepRegex benchmarks and 122 StackOverflow benchmarks, against an
      NL-only seq2seq baseline (DeepRegex) and an examples-only ablation of
      the same engine, plus a 20-participant user study where users were
      twice as likely to produce the intended regex.. Measured on two
      datasets totalling 300+ tasks with both baselines run under the same
      time and top-k budget, including an interactive protocol adding
      examples over four iterations. [truncated]
