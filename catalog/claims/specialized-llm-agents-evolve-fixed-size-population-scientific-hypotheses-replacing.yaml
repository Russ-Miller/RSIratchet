id: specialized-llm-agents-evolve-fixed-size-population-scientific-hypotheses-replacing
ref: CLM-0264
capability: multi-model-coordination
technique: coordinate-agents-generational-genetic-algorithm-over-hypotheses
statement: >-
  When specialized LLM agents evolve a fixed-size population of scientific
  hypotheses, replacing uniform-random parent selection with selection by
  the agents' own pairwise fitness raises the average and weakest members'
  external evidence scores while leaving the best member's score
  statistically unchanged, so the coordination rule mainly lifts the floor
  rather than the ceiling.
