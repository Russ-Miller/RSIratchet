    stance: supports
    note: >-
      Validated by: Mean DepMap selectivity 0.171 and Open Targets 0.426
      versus 0.115/0.329 for the strongest of six task-matched baselines
      (Tree of Thoughts) and 0.039/0.163 for single-pass generation, on 26
      and 29 shared cancer types with retrieval, drug vocabulary and base
      model held fixed; gains persist on 27 held-out cancer types.. Measured
      ablation across 31 (DepMap) and 34 (Open Targets) cancer types:
      fitness-guided selection raised weakest-member scores by 0.088 and
      0.218 and population means by 0.075 and 0.128, with no detectable
