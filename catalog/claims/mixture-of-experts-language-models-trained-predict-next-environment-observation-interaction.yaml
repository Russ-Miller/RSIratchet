id: mixture-of-experts-language-models-trained-predict-next-environment-observation-interaction
ref: CLM-0656
capability: state-tracking
technique: train-language-world-model-predict-next-environment-state
statement: >-
  For mixture-of-experts language models trained to predict the next
  environment observation from interaction history and action, reinforcement
  learning on a single domain (Terminal) raises simulation fidelity on
  held-out domains it never trained on (SWE +11.5, Search +11.8, MCP +5.0
  rubric points), with gains appearing within the first 10 RL steps, so
  environment-simulation skill is not purely domain-specific.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One 35B-A3B Qwen checkpoint, four text-based domains, rubric scores judged by an LLM against ground-truth observations; GUI domains not tested in the transfer experiment."
sources:
  - source: arxiv-2606-24597
    stance: supports
    note: >-
      Validated by: AgentWorldBench, 2,170 out-of-distribution turn-level
      samples from frontier-agent trajectories on nine established
      benchmarks, scored by a reference-grounded GPT-5.2 judge on five
      dimensions; the trained 397B model averaged 58.71 vs 54.74 for its
      untrained base and 58.25 for the best frontier baseline, and the 35B
      model rose 47.73 to 56.39.. Measured on one base checkpoint, with
      evaluation every 10 RL steps on four text domains; [truncated]
