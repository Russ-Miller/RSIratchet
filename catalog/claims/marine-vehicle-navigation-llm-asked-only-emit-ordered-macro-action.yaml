notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An LLM that, given the
  same macro vocabulary, sets durations directly and reaches goals
  collision-free at rates matching the world-model optimizer; or a case
  where the duration optimizer repairs a wrong action topology. Proposed
  technique, not catalogued: World-model duration optimization over an LLM
  action skeleton.
