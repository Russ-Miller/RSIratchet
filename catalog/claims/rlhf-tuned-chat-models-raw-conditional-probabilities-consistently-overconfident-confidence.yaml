id: rlhf-tuned-chat-models-raw-conditional-probabilities-consistently-overconfident-confidence
ref: CLM-0269
capability: abstention-and-self-knowledge
technique: verbalized-confidence-after-listing-alternatives
statement: >-
  For RLHF-tuned chat models the raw conditional probabilities are
  consistently overconfident, and a confidence the model states in words or
  as a number in its output is better calibrated, often halving expected
  calibration error on TriviaQA, SciQ and TruthfulQA; asking the model to
  list several candidate answers before giving confidences improves it
  further, while chain-of-thought does not.
kind: observation
backing_strength: single-paper
observed_on:
  era: "ChatGPT (gpt-3.5-turbo), GPT-4, Claude 1 and 2 and Llama-2-70B-Chat, 2023; short-answer factual QA; gains on Llama-2-Chat were smaller and less consistent."
sources:
  - source: arxiv-2305-14975
    stance: supports
    note: >-
      Validated by: Expected calibration error, Brier score and selective
      accuracy on TriviaQA, SciQ and TruthfulQA comparing raw
      log-probabilities, verbalized numbers, verbalized words and
      multi-candidate prompting across five RLHF models; chain-of-thought
      variant tested and found not to help.. Three factual QA benchmarks and
      five models; the weak result on Llama-2-Chat suggests the effect
      depends on the training recipe. The 'relative 50%' figure is a
      typical, not universal, reduction.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Newer RLHF models whose
  raw probabilities are as well calibrated as verbalized confidences, or
  tasks (long-form, reasoning) where verbalized confidence is no better than
  log-probabilities.
