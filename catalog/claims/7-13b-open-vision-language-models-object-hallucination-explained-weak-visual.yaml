notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Measuring
  image-attention magnitude at object tokens in these models and finding
  hallucinated tokens systematically attend less than real ones, or finding
  logit-lens decodes of attended patches match hallucinated words as often
  as real ones. Drafted stance toward
  7-8b-multimodal-models-object-hallucination-during-visually-grounded-token:
  contests -- That claim ties hallucination to a shift of the
  visual-language information ratio inside attention heads, whereas this
  paper measures no systematic difference in visual attention magnitude
  between real and hallucinated object tokens and locates the failure in the
  semantics of the attended region instead.
