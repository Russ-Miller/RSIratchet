id: fault-attribution-llm-multi-agent-systems-having-system-s-own
ref: CLM-0625
capability: multi-model-coordination
technique: interrogate-system-s-own-agents-then-vote-privately
statement: >-
  For fault attribution in LLM multi-agent systems, having the system's own
  agents self-assess, interrogate each other, then vote privately into a
  structural hazard space with distance-weighted aggregation beats a single
  external LLM judge given the full log, with the advantage growing as
  problem complexity rises and the aggregate beating the best individual
  agent in every configuration — but the gain depends on backbone reasoning
  capacity, being significant for strong reasoning models and absent for the
  open-weight 20B/120B models tested.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three benchmarks (Who&When, a 3-agent clinical exoskeleton system, a 12-agent trading pipeline) with injected faults and known ground truth; four backbones (Gemini 2.5 Pro, DeepSee"
sources:
  - source: arxiv-2606-02282
    stance: supports
    note: >-
      Validated by: Fault-attribution accuracy against injected ground-truth
      fault vectors versus a single external LLM evaluator given the full
      context in one pass: gains of +6.7 to +25.6 pp overall on CORTEX, +9.8
      to +41.7 pp on TradingAgents, and a logistic regression showing the
      POIROT-by-complexity-quartile interaction OR = 1.60, p = 0.008 on
      Who&When; the best single agent's vote fell 14.3-21.3 pp below the
      aggregate.. Measured on three benchmarks with injected faults and four
      backbones; [truncated]
contested: false
status: pending-review
