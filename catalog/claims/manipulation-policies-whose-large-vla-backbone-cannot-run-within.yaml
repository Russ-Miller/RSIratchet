id: manipulation-policies-whose-large-vla-backbone-cannot-run-within
ref: CLM-0370
capability: embodied-control
technique: slow-chunk-proposal-plus-fast-rl-trained-action
statement: >-
  For manipulation policies whose large VLA backbone cannot run within the
  control period, letting the slow model propose action chunks from a stale
  observation while a small RL-trained edit policy adjusts and Q-selects
  among those chunks using the latest observation recovers more performance
  than applying RL on top of asynchronous imitation-learning schemes alone,
  and the gap widens as inference delay or environment speed grows.
