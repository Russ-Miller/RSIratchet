      EXPO-FT+RTC and SFT baselines: best in 10/10 Kinetix environments
      (96.2% average under 4-step delay, above the 81.4% zero-delay RLPD
      baseline) and 29/30 average over four real tasks versus 25/30 for the
      strongest baseline, plus delay and speed sweeps.. Measured on 10
      Kinetix tasks (4 seeds) and 4 real robot tasks at 30 trials each,
      against six baselines including two RTC-augmented ones. Baselines were
