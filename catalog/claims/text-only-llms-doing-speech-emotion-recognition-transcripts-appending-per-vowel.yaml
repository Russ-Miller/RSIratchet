id: text-only-llms-doing-speech-emotion-recognition-transcripts-appending-per-vowel
ref: CLM-1063
capability: audio-understanding
technique: describe-prosody-per-vowel-per-utterance
statement: >-
  For text-only LLMs doing speech emotion recognition from transcripts,
  appending per-vowel prosodic descriptors (pitch level and slope, pitch and
  intensity variation, duration, speaker- and vowel-type normalized then
  quantile-binned into words) raises accuracy over both transcript-only
  prompting and utterance-level prosody descriptions, in zero-shot and after
  fine-tuning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-only LLMs (GPT-4o, LLaMA-3-8B-Instruct, LLaMA-4-Scout, Qwen2-7B) on acted/TV emotion corpora in English, French, German and a mixed-lingual set; requires forced alignment of t"
sources:
  - source: arxiv-2602-06270
    stance: supports
    note: >-
      Validated by: Unweighted accuracy and weighted F1 on IEMOCAP, MELD,
      CaFE, EmoDB, ASVP-ESD against a transcript-only prompt and
      SpeechCueLLM (utterance-level prosody text); zero-shot gains up to 7.8
      UACC over transcript-only on IEMOCAP with GPT-4o, and 1.5-2.7 weighted
      F1 over SpeechCueLLM after SFT/GRPO.. Measured on five corpora, two to
      three backbones, under zero-shot, SFT, SFT+GRPO, cross-domain and
      multilingual conditions; baselines include a transcript-only prompt
      and an utterance-level prosody prompt. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A matched comparison in
  which utterance-level prosodic descriptions equal or beat vowel-level ones
  on the same datasets and backbones, or in which the vowel descriptors give
  no gain once lexical content is controlled (e.g. permuted or placebo
  descriptors score the same).
