id: adding-image-level-preference-pairs-multimodal-dpo-llava-1-5-7b
ref: CLM-0015
capability: visual-grounding
statement: >-
  When adding image-level preference pairs to multimodal DPO for LLaVA-1.5
  7B/13B, constructing the rejected image by selecting, among many
  equal-size random masks, the variant with lowest CLIP similarity to the
  original lowers object-hallucination rates more than coarse alternatives
  (blockwise masking, rotation, cropping, or a fully blacked-out image), at
  the cost of slightly lower object coverage.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "LLaVA-v1.5 7B and 13B fine-tuned on 22K RLAIF-V preference instances; hallucination measured on MMHalBench, Object HalBench, AMBER"
sources:
  - source: arxiv-2608-19598
    stance: supports
    note: >-
      One ablation table comparing five rejected-image strategies on
      MMHalBench and AMBER, single backbone (LLaVA-7B), single seed, no
      variance reported; recall check on Object HalBench against two
      baselines argues the CHAIR gain is not purely shorter outputs, though
      coverage on AMBER does fall relative to the base model.
contested: false
