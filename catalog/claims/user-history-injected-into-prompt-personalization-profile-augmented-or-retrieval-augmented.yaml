id: user-history-injected-into-prompt-personalization-profile-augmented-or-retrieval-augmented
ref: CLM-1083
capability: long-term-memory
technique: steer-hidden-states-away-personalization-distorts-facts
statement: >-
  When user history is injected into a prompt for personalization
  (profile-augmented or retrieval-augmented), factual QA accuracy on
  questions whose answers are independent of the user degrades, and the
  degradation grows as the proportion of history included grows.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Prompting-based personalization (PAG, DPL, RAG, LLM-TRSR) on 7-14B open instruct backbones; factual multi-hop QA paired with long-term user histories; LLM-as-judge scoring."
sources:
  - source: arxiv-2601-11000
    stance: supports
    note: >-
      Validated by: On PFQABench (1,000 items, 500 users) across three
      backbones and four personalization methods, the mixed variant raised
      factual accuracy (e.g. PAG on LLaMA3.1-8B from 17.2% to 75.2%) while
      keeping personalized-question accuracy near baseline; ablations
      replacing the probe or the steering vector with random alternatives
      lost most of the gain.. Measured on a purpose-built benchmark the
      authors made (factual half of PFQABench), scored by LLM judge, across
      3 backbones x 4 personalization methods; history-length sweep shown
      for the RAG variant only. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-14
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Measuring factual
  accuracy with and without user history on the same factual questions and
  finding no drop, or finding the drop does not grow with the amount of
  history included.
