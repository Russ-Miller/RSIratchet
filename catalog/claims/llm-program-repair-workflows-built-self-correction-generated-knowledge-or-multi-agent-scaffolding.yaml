id: llm-program-repair-workflows-built-self-correction-generated-knowledge-or-multi-agent-scaffolding
ref: CLM-0372
capability: self-repair
technique: external-feedback-repair
statement: >-
  For LLM program-repair workflows built on self-correction,
  generated-knowledge or multi-agent scaffolding, the gain over plain
  prompting is unstable across benchmarks and can turn negative once
  extrinsic defect information (error messages, triggering tests, bug
  comments) is withheld, while simply putting the error message plus the
  failing test into the prompt yields more correct repairs than the
  scaffolds do.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three enhancement methods (SRepair, FixAgent, RefinedTRP) on Defects4J, HumanEval-Java and 54 type-related BugsInPy defects, with GPT-3.5-Turbo (and GPT-5.4-mini for the main compa"
sources:
  - source: arxiv-2609-22844
    stance: supports
    note: >-
      Measured: repair counts with human-adjudicated semantic review across
      three benchmarks and two models, with and without extrinsic
      information. Absolute numbers are small on BugsInPy (7 to 10 of 54),
      single execution per defect at non-zero temperature, so run-to-run
      variance is unmeasured; benchmarks also differ in language and defect
      origin, so cross-benchmark differences are not isolated to enhancement
      quality.
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A study showing the same
  enhancement workflows, with no extrinsic information supplied, deliver
  consistent positive gains across several benchmarks and exceed prompts
  that directly include error messages and failing tests. Drafted stance
  toward external-feedback-repair-works-only-with-real-grounding: supports
  -- Scaffolds stripped of external defect information gave zero or negative
  gains, while supplying real execution feedback raised repair counts.
