id: benchmark-headroom-closes-fastest-in-bounded-domains-and-lags-in-stateful-agent-work
ref: CLM-0025
capability: long-horizon-execution
statement: >-
  Across 393 model–benchmark observations in ten capability domains for
  models released between 2023 and September 2026, the share of benchmark
  headroom closed is uneven: bounded, readily verified domains are near
  their ceilings (advanced mathematics 86.4 and graduate-level science 85.8
  on a 0–100 index where 0 is the benchmark's entry-year frontier), while
  interactive, stateful ones lag (software engineering 52.6, search and
  terminal agents 56.8, tool agents 39.9) — so gains in bounded environments
  have not transferred uniformly to long, stateful workflows where errors
  propagate across the trajectory.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Frontier models 2023–2026 scored on public benchmarks per domain, normalised as the Headroom-Closed Index; cybersecurity segments caveated for changed task subsets"
  task_type: autonomous-agent
sources:
  - source: arxiv-2609-11873
    stance: supports
    note: >-
      Section 2.1, Figure 3, Observation 2: HCI values by domain for 2026 and
      the 33.2, 29.1 and 45.9-point gaps to graduate-level science. The
      authors caveat the cybersecurity trajectory (91.9) for changed Cybench
      subsets and pass@1 aggregation. Descriptive aggregation of published
      benchmark results, not a controlled comparison.
contested: false
status: pending-review
last_checked_at: "2026-09-13"
notes: >-
  Sits beside the METR time-horizon claim: that one measures how long a task
  agents complete, this one measures how far each domain's benchmarks have
  been closed, and both say the same thing about long, stateful work. The
  index depends on which benchmarks exist per domain and on their entry-year
  frontiers, so the numbers are comparable within this paper's construction,
  not as absolutes.
