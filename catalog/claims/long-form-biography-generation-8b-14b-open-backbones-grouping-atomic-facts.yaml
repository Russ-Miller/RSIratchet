id: long-form-biography-generation-8b-14b-open-backbones-grouping-atomic-facts
ref: CLM-0865
capability: hallucination
technique: verify-grouped-facts-per-sentence-each-fact
statement: >-
  For long-form biography generation with 8B-14B open backbones, grouping
  the atomic facts of each sentence into one retrieval-verification query
  rather than verifying each fact separately cuts token cost by 33-46% and,
  on the 8B model, also raises FactScore, because per-fact verification
  fragments evidence and drives defensive deletion of facts.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Llama-3-8B and Qwen2.5-14B on LongForm Bio, with Tavily web retrieval, temperature 0; ablation run on only 20 random instances."
sources:
  - source: arxiv-2605-28837
    stance: supports
    note: >-
      Validated by: On 20 LongForm Bio instances, compared against a
      high-density 1:1 per-fact verification baseline and the uncorrected
      initial answer: FactScore 0.8568 vs 0.7002 (8B) and 0.8146 vs 0.8128
      (14B), with token usage 39,492 vs 72,634 (8B) and 36,533 vs 54,407
      (14B); fact preservation 77.7% vs 61.6% (8B).. Measured, but the
      dense-vs-sparse comparison rests on a 20-instance ablation with two
      backbones and one benchmark; [truncated]
