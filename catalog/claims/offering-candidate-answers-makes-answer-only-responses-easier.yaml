id: offering-candidate-answers-makes-answer-only-responses-easier
ref: CLM-0515
capability: cutting-to-the-chase
technique: offer-candidate-answers
statement: >-
  When a model is asked to answer without visible reasoning, rewriting the
  same question with candidate answers supplied makes answer-only responses
  easier to produce, and on Boolean and multiple-choice questions answering
  directly leaves accuracy unchanged — whereas on open-ended questions there
  is a trade-off, and forcing an answer-only response costs accuracy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2026, six LLMs; the same questions rewritten across answer spaces"
  task_type: chat-assistant
conditions:
  effect: narrows
  cost: low
  helps_most: independent
  fails_when: >-
    The answer space is open and cannot be enumerated: there, answering
    directly trades away accuracy, and offering candidates would narrow or
    give away the answer.
sources:
  - source: arxiv-2610-11765
    stance: supports
    note: >-
      The paper's answer-space rewriting experiment and its accuracy results
      by task type. The "effect" is on answer-only compliance; on accuracy
      the technique is neutral for closed questions.
contested: false
