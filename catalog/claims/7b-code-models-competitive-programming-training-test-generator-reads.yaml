    note: >-
      Validated by: Pass@1 and average pass ratio on APPS, CodeContests,
      xCodeEval, LiveCodeBench v6 against CURE and Specine on the same 7B
      backbone at matched 20-call budget (average Pass@1 34.66% vs 23.13%
      CURE, 24.34% Specine) plus six ablations; blind-Auditor variant (no
      candidate code) drops average Pass@1 to 30.04%, Stage-B-only to
      26.26%.. Measured on four benchmarks with two backbones; ablations
      isolate candidate-code access (-4.6 avg Pass@1) and the Auditor loop
