id: 7b-code-models-competitive-programming-training-test-generator-reads
ref: CLM-1025
capability: self-repair
technique: let-test-generator-read-candidate-code-then-repair
statement: >-
  For 7B code models on competitive programming, training a test generator
  that reads the current candidate program before writing tests exposes more
  implementation-specific bugs than a test generator given only the problem
  description, and feeding those tests to an RL-trained repair role beats
  generating many fresh candidates and selecting among them at equal
  inference budget.
kind: mechanism
