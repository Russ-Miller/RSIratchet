id: self-evolving-agents-accumulate-reusable-skills-bank-accepting-new-skill
ref: CLM-0482
capability: harness-self-improvement
technique: gate-skills-sampled-coalition-knockouts-then-mask-after
statement: >-
  For self-evolving agents that accumulate reusable skills in a bank,
  accepting a new skill because aggregate task reward rose does not
  establish that the skill contributes: in knockout audits the newly
  admitted skill can contribute about zero while an incumbent carries the
  bank, a skill's marginal changes when a partner skill is removed, and a
  skill beneficial in the source domain can reverse sign in the target
  domain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Skill-bank self-evolving agents gated on bank-level outcome reward (MemSkill-style, Llama-3.3-70B skill extractor) audited on LoCoMo, LongMemEval, HotpotQA and ALFWorld; margins au"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against MemSkill and six
      memory-agent baselines over three seeds: LLM-judge average rose from
      54.13 to 55.52 on conversational benchmarks and success rate from
      77.05 to 79.66 on ALFWorld; the stricter gate accepted 1 of 12
      candidates vs 6 of 12, and a K-controlled ablation found the
      baseline's extra admissions net -1.38 points; label-free masking
      improved all six trained banks, twice as much on baseline banks as on
      gated ones.. Measured on one baseline agent framework with one
      extractor model, three seeds, four benchmarks; [truncated]
