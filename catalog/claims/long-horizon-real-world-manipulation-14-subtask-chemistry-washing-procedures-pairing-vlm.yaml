id: long-horizon-real-world-manipulation-14-subtask-chemistry-washing-procedures-pairing-vlm
ref: CLM-0659
capability: long-horizon-execution
technique: constrain-planner-executor-s-canonical-skill-library
statement: >-
  For long-horizon real-world manipulation (14-subtask chemistry and washing
  procedures), pairing a VLM planner whose output is snapped to a fixed
  library of 32 canonical skill primitives, plus a running text log of
  completed milestones, with a short-memory reactive VLA executor completes
  a majority of multi-stage tasks where the same executor given the raw
  global instruction completes none, while on single-episode simulation
  benchmarks the same architecture gains only a few points over the
  monolithic baseline.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tabletop bimanual manipulation; executor fine-tuned on ~10 hours of subtask-segmented data; planner fine-tuned on event-balanced boundary/execution samples; skill set fixed in adva"
sources:
  - source: arxiv-2607-05377
    stance: supports
    note: >-
      Validated by: Closed-loop success rate over 20 trials on two
      real-world 14-step suites (Cortex 65% and 55% vs 0% for pi-0.5 and
      pi-mem end-to-end; human-planner upper bound 75%/70%), plus 95.5% vs
      92.4% on LIBERO-Long and 86.8% vs 82.7% on RoboTwin; open-loop
      ablations show each harness component adds score.. Measured, but the
      real-world result rests on 20 trials per suite on one robot platform
      with tasks designed by the authors to defeat reactive execution; the
      0% baseline makes the contrast large but uninformative about
      magnitude. [truncated]
