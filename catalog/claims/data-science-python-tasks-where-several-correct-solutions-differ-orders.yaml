id: data-science-python-tasks-where-several-correct-solutions-differ-orders
ref: CLM-0036
capability: code-generation
statement: >-
  For data-science Python tasks where several correct solutions differ by
  orders of magnitude in runtime, a model's correctness rate does not
  predict the efficiency of the code it writes: rankings invert between the
  two, code-specialized open models are less efficient than general open
  models of similar size class, and the fastest model rotates by library
  (NumPy vs Pandas vs PyTorch vs Polars).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Python data-science code using Pandas/NumPy/PyTorch/SciPy/Polars, tasks drawn from efficiency-oriented Stack Overflow posts, one greedy sample per task, efficiency scored relative "
sources:
  - source: arxiv-2608-30248
    stance: supports
    note: >-
      1,000 human-validated instances, 16 models in 3 tiers, log-normalized
      relative runtime score restricted to solved tasks; rank inversions
      confirmed on pairwise win rates and on the 131 tasks all six
      representative models solved, which controls for
      correctness-conditioned task mix. Human reference beat the best model
      on efficiency. Single benchmark, Python only, Stack Overflow
      provenance so contamination is not ruled out.
