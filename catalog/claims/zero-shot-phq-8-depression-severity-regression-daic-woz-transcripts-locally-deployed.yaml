id: zero-shot-phq-8-depression-severity-regression-daic-woz-transcripts-locally-deployed
ref: CLM-0769
capability: multi-model-coordination
technique: perception-knowledge-reasoning-audit-agent-chain-clinical-scoring
statement: >-
  For zero-shot PHQ-8 depression severity regression from DAIC-WOZ
  transcripts with locally deployed 7-8B-class open models, decomposing the
  task into perception, retrieval-grounding, chain-of-thought reasoning and
  a final audit stage lowers mean absolute error only slightly over
  single-agent prompting (5.35 to 5.02 for Qwen2.5) while the larger
  reported changes are in self-assessed interpretability and hallucination
  rates.
kind: observation
backing_strength: single-paper
observed_on:
  era: "184 DAIC-WOZ sessions, 37 held-out test sessions, text transcripts only, no fine-tuning, three LLaMA-3.1/Qwen2.5/DeepSeek-R1 backbones, temperature 0.2"
sources:
  - source: arxiv-2606-21123
    stance: supports
    note: >-
      Validated by: MAE on 37 held-out DAIC-WOZ test sessions over three
      seeds against single-agent and CoT prompting (5.42/5.18/5.02 for
      Qwen2.5), with ablations removing each agent (+0.17 to +0.29 MAE);
      interpretability and hallucination figures come from the authors' own
      rubric with no stated annotator protocol.. Measured on only 37 test
      sessions across three runs; the MAE gap (0.33 on a 0-24 scale) is
      small relative to the task's intrinsic error and the test set is tiny.
      [truncated]
