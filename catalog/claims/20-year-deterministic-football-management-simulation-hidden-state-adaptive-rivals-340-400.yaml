id: 20-year-deterministic-football-management-simulation-hidden-state-adaptive-rivals-340-400
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year deterministic football-management simulation with hidden
  state, adaptive rivals and 340-400 decision stops, final score across 15
  frontier models is not ordered by model scale, price, vendor or token
  spend, and early standings barely predict the final order (rank
  correlation with the final order about 0.19 at year 5, rising to 0.78 by
  year 15), so short-horizon measurements would rank a different set of
  models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One benchmark (FM-Bench), 15 flagship models, three seeds on the solo track plus one shared-world Arena seed; scoring by a deterministic engine with no LLM judge."
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured: three seeds per model on the solo track, one stamped run per
      Arena seat, no run selection. Rank correlations reported per seed for
      behavioral axes; the scale/price null rests on observed orderings
      (open-weight kimi-k2.6 above both GPT seats) and p>0.38 for token
      spend at n=15. Single benchmark, single environment family, so
      generality beyond management-style simulations is untested.
contested: false
status: pending-review
last_checked_at: 2026-10-17
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication where
  year-5 standings or model scale/price correlate strongly with 20-year
  final score, or where the ranking matches standard short-horizon agent
  leaderboards.
