id: 20-year-deterministic-football-management-simulation-hidden-state-adaptive-rivals-340-400
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year deterministic football-management simulation with hidden
  state, adaptive rivals and ~340-400 decision stops, what separates
  frontier models' cumulative scores is managerial behavior rather than
  compute: cutting slow-payoff investment near the horizon end (Spearman
  -0.58), keeping cash deployed rather than idle (-0.50), and opening
  contract renewals early (+0.45) track the final score on every seed, while
  token spend is uncorrelated under every accounting.
kind: observation
backing_strength: single-paper
observed_on:
  era: "15 flagship models, three seeds, solo track against scripted opponents; score is a log-compressed composite of honors, net-worth value added and squad value; n=15 for rank correlat"
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured: Spearman rank correlations over 15 models with per-seed
      signs reported as consistent for the three behavioral metrics and null
      for tokens (all p>0.38). n=15 models makes the correlations weakly
      powered, and the metrics are read off the same runs that produce the
      score, so the behaviors are associated with, not shown to cause, the
      score. Also year-5 rank correlation with final order 0.19 rising to
      0.78 by year 15.
contested: false
status: pending-review
last_checked_at: 2026-10-11
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On further seeds or a
  comparable long-horizon management environment, token spend (or model
  scale/price) correlates with final score while endgame investment cuts,
  idle-cash ratio and renewal lead do not.
