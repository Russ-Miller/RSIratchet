id: model-asked-predict-own-rates-behavioral-evaluations-sycophancy-reward
ref: CLM-0430
capability: abstention-and-self-knowledge
technique: ask-about-generic-ai-agent-model-itself
statement: >-
  When a model is asked to predict its own rates on behavioral evaluations
  (sycophancy, reward hacking, agentic policy violation, bias), its answers
  track its own behavior no better than the same question asked about
  'capable AI agents in general' or than other models' answers about
  themselves, so self-report reflects a generic theory of AI assistants
  rather than privileged self-knowledge, and first-person framing mainly
  adds a self-flattering shift that understates harmful behavior.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Nine public behavioral evaluations, 12 models from six labs including three frontier bases with and without reasoning; predictions scored as Pearson correlation across conditions o"
sources:
  - source: arxiv-2609-09899
    stance: supports
    note: >-
      Validated by: Generic-subject item-informed questions scored r=+0.28
      vs +0.24 for self-prediction (paired difference -0.03 [-0.10,+0.03]),
      with signed bias on harm-valenced evaluations shifted -0.15 for
      self-framed abstract reports; cross-model behavior mean, which never
      queries the model, reached +0.53.. Measured across nine evaluations,
      15 prediction methods, 12 models, with noise ceilings, frozen dev/test
      splits and pre-registered claims; controls include generic-subject,
      cross-model mean, identity transfer, and post-finetune re-elicitation.
