id: agent-harness-evolved-execution-traces-under-fixed-interaction-budget
ref: CLM-0531
capability: harness-self-improvement
technique: verify-harness-edits-behavior-matched-tasks-attribution-gate
statement: >-
  When an agent harness is evolved from execution traces under a fixed
  interaction budget, verifying each candidate edit on tasks chosen for the
  behavior it targets and accepting it only when the gain is attributable to
  that behavior beats scoring every candidate on a shared fixed, random or
  coreset task split, and larger verification budgets do not compensate:
  fixed-split methods using up to 24x the rollouts fell below the unmodified
  harness in half of their harness-benchmark pairs.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Three coding-agent harnesses (OpenCode, Codex CLI, Pi) on four benchmarks, one model family (deepseek-v4-flash-preview), 30 TRAIN tasks, budget capped at 200 units; gains largest w"
sources:
  - source: arxiv-2608-27311
    stance: supports
    note: >-
      Validated by: Held-out pass@1 across 3 harnesses x 4 benchmarks
      against the unmodified harness and three trajectory-based evolution
      baselines (Self-Harness, Meta-Harness, HarnessFix); best or tied-best
      in 8 of 12 pairs, average +7.6-13.6%, never below baseline harness.
      Ablations on OpenCode replace the behavior-aware batch with fixed,
      random and RHO-based batches (all fall back to the initial harness
      score) and replace the attribution gate with an aggregate-metric gate
      (gains only on Retail).. [truncated]
