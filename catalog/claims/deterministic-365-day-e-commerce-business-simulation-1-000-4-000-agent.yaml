id: deterministic-365-day-e-commerce-business-simulation-1-000-4-000-agent
ref: CLM-0594
capability: long-horizon-execution
technique: score-long-horizon-agents-separate-capability-axes-one
statement: >-
  In a deterministic 365-day e-commerce business simulation of 1,000-4,000
  agent steps, end-of-year assets do not predict the six underlying
  operating competences: across 18 frontier and open-weight models the top
  earner ranked 16th of 18 on fraud avoidance and below another model on
  profit per tool call, and the best negotiator finished mid-pack on assets.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One benchmark, five episodes per model, fixed world and deterministic customer demand and supplier negotiation kernel; only renderer wording varies between runs."
sources:
  - source: arxiv-2608-30730
    stance: supports
    note: >-
      Validated by: Not measured as an intervention; demonstrated by showing
      rank inversions across the seven axes for 18 models over 90 episodes..
      Measured over 18 models x 5 episodes (90 runs) in one deterministic
      environment; spreads are large (std exceeds mean on fraud share for 15
      of 18 models), and the dimension set is the authors' own choice, so
      independence of the axes is shown by rank inversion rather than by a
      validated construct.
