id: agents-accumulate-reusable-skills-skill-bank-skill-s-contribution
ref: CLM-0360
capability: harness-self-improvement
technique: gate-skills-sampled-coalition-knockouts-then-mask-after
statement: >-
  In agents that accumulate reusable skills in a skill bank, a skill's
  contribution is not intrinsic: it depends on which other skills are in the
  bank and on the deployment domain, so an acceptance gate that only checks
  whether bank-level reward rose admits skills with near-zero or negative
  coalition-level contribution, and skills that help in the source domain
  can reverse sign after transfer.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "LLM agents with persistent, retrievable textual skill banks grown by an outcome-reward gate; demonstrated on memory-skill agents over LoCoMo, LongMemEval, HotpotQA and ALFWorld"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against MemSkill and six
      memory-agent baselines on LoCoMo, LongMemEval and ALFWorld (reported
      gains on F1, LLM-judge and success rate, three seeds); a K-controlled
      ablation showed the baseline gate's accepted skills were net -1.38pp;
      masking improved all six trained banks on HotpotQA-50 (+3.59pp on CASS
      banks, +7.17pp on MemSkill banks), and the unlabeled retrieval-quality
      signal correlated with label-based skill ranking at rho=+0.76 versus
      -0.18 for a policy-entropy signal.. [truncated]
