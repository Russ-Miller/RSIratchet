    stance: supports
    note: >-
      Validated by: Compared against reasoning-first prompting on the
      CounterFactual Hallucination Rate (counterfactual acceptance
      conditioned on correctly answering the paired true statement) across
      the M2CQA benchmark; answer-first reported more robust, no absolute
      numbers given in the source text.. Measured on one new benchmark
      (M2CQA) with a conditional metric (CFHR) over several state-of-the-art
      VLMs and prompting strategies; source text gives no per-model numbers,
      no human baseline, and does not separate cultural plausibility from
      general Arabic-language weakness.
