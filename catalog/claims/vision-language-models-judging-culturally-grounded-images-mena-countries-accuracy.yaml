id: vision-language-models-judging-culturally-grounded-images-mena-countries-accuracy
ref: CLM-1067
capability: visual-grounding
technique: answer-first-justify-after-counterfactual-image-claims
statement: >-
  For vision-language models judging culturally grounded images from MENA
  countries, accuracy on true statements does not predict rejection of
  visually false but culturally plausible counterfactuals: conditional
  acceptance of counterfactuals rises sharply in Arabic and its dialects
  even where true-statement accuracy stays high, and
  reasoning-before-answering prompts raise that acceptance relative to
  answering before justifying.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Contrastive true/counterfactual statements over culturally grounded images from 17 MENA countries, in English, Modern Standard Arabic and Arabic dialects; current VLMs under severa"
