    stance: supports
    note: >-
      Validated by: Measured as accuracy change after hint injection versus
      initial accuracy across 8 models, 5 datasets and 5 token budgets;
      average gain 4.4%, with KeyNMF topic overlap between helpful and
      unhelpful hints and a negative correlation between hint length and
      gain.. Measured on 8 open-weight models, 5 benchmarks, 5 token
      budgets; initial accuracies matched published figures. [truncated]
