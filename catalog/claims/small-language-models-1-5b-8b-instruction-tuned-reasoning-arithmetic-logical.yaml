id: small-language-models-1-5b-8b-instruction-tuned-reasoning-arithmetic-logical
ref: CLM-0738
capability: self-repair
technique: sufficiency-test-give-oracle-answer-then-ask-self
statement: >-
  For small language models (1.5B-8B, instruction-tuned and reasoning) on
  arithmetic and logical reasoning benchmarks, being shown the ground-truth
  answer alongside their own wrong chain of thought and asked to write hints
  for a retry yields only about a 4.4% average accuracy gain, and the hints
  that work are not semantically distinguishable from those that do not.
kind: observation
backing_strength: single-paper
