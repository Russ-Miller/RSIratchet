notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A comparable set of
  small models, given their own wrong reasoning plus the ground-truth
  answer, produces hints that lift accuracy substantially (well above a few
  points) on these benchmarks, or hints that lead to corrections are shown
  to be reliably separable from those that do not. Drafted stance toward
  self-critique-without-grounding-unreliable: supports -- Even with the
  correct answer supplied as grounding during hint generation, the models'
  own feedback barely improved their answers, strengthening the case that
  model-authored critique is a weak improvement signal.
