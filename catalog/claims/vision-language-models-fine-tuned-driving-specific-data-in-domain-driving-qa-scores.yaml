statement: >-
  When vision-language models are fine-tuned on driving-specific data,
  in-domain driving QA scores rise while recall of rare objects in long-tail
  driving scenes falls below the un-tuned base model, and this loss is
  invisible to benchmarks whose test distribution matches the fine-tuning
  data.
