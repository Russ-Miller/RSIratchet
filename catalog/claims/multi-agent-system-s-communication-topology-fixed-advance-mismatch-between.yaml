id: multi-agent-system-s-communication-topology-fixed-advance-mismatch-between
ref: CLM-1160
capability: multi-model-coordination
technique: route-agent-topology-task-s-dependency-dag
statement: >-
  When a multi-agent system's communication topology is fixed in advance,
  the mismatch between topology and task dependency structure can make it
  worse than a single model: on graduate-level reasoning questions with high
  inter-subtask coupling, always-parallel agent execution scored below the
  best single model, while on code-fixing tasks with wide, low-coupling
  decompositions the same parallel topology gained several points.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five mid-tier models of near-identical benchmark scores on SWE-bench Verified, GPQA Diamond and HotpotQA; task decomposed by an LLM into a dependency DAG; topology chosen from four"
sources:
  - source: arxiv-2602-16873
    stance: supports
    note: >-
      Validated by: Accuracy against single-best-model, Mixture-of-Agents,
      LLM-Blender, and static parallel/sequential baselines on SWE-bench
      Verified, GPQA Diamond and HotpotQA; reported 52.6/53.1/76.4 vs
      42.8/46.2/68.3 for single best, with a compute-matched Self-MoA
      baseline recovering most of the gain and an ablation attributing -2.8
      points to removing adaptive routing.. Measured on three benchmarks
      with five models and three runs each, against five baselines including
      a token-matched Self-MoA. [truncated]
