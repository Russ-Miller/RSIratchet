id: 7-13b-open-vision-language-models-amplifying-visual-attention-only-heads
ref: CLM-0800
capability: visual-grounding
technique: amplify-only-attention-heads-move-across-decoding-steps
statement: >-
  In 7-13B open vision-language models, amplifying visual attention only in
  heads whose spatial attention map shifts across decoding steps (low
  spatio-temporal covariance similarity) lowers object-hallucination rates
  without the general multimodal degradation that uniformly amplifying all
  heads causes.
