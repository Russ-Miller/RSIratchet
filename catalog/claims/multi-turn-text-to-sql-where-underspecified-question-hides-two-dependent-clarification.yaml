id: multi-turn-text-to-sql-where-underspecified-question-hides-two-dependent-clarification
ref: CLM-0696
capability: formal-query-synthesis
statement: >-
  In multi-turn text-to-SQL where an underspecified question hides two
  dependent clarification layers, current LLM agents almost never surface
  both layers (joint identification under 5% for all 12 models tested), and
  this is not explained by how often they ask: ask rates spanning under 10%
  to over 60% all produce joint identification below 4%, and second-layer
  identification stays low (1.2-13.8%) even when the first layer is
  pre-resolved for them.
kind: observation
backing_strength: single-paper
observed_on:
  era: "TIDE-Bench, 514 anchor SQLs from BIRD, two-layer chains only, chain-then-drift order, LLM user simulator; 12 models including Claude-Sonnet-4.6, GPT-4o, Qwen2.5-72B."
sources:
  - source: arxiv-2608-29543
    stance: supports
    note: >-
      Measured on 1,542 constructed samples with a paired factorial design
      controlling for anchor schema and difficulty; identification is judged
      by a validated LLM user simulator's router labels, so the measure
      depends on simulator fidelity. Low absolute numbers across all models
      leave little room for an artifact-free reading, and the primed
      protocol isolates layer-two failure from layer-one cascade.
contested: false
status: pending-review
last_checked_at: 2026-10-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model that asks for
  clarification often and, with the first ambiguity layer pre-resolved,
  identifies the dependent second layer at a high rate (e.g. above 50%),
  showing the limit is clarification policy rather than identification.
