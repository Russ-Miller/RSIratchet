    stance: supports
    note: >-
      Validated by: Average pass@1 over MMLU, GSM8K, MATH, HumanEval, MBPP
      (87.83 vs 85.93 for MasRouter, same model pool and inference budget);
      drop-in substitution into MacNet, GPTSwarm, HEnRY raised accuracy and
      lowered dollar cost; ablations against random routing (79.64) and
      no-SFT routers (83.42 at 1B, 86.48 with a GPT-4o-mini router); stress
      test to 1000 concurrent workers.. Measured on one dataset (GSM8K)
      across six concurrency levels, one system versus one baseline, with no
      seed variance or confidence intervals reported; [truncated]
