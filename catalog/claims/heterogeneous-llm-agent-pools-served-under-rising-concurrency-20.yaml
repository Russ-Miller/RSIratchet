id: heterogeneous-llm-agent-pools-served-under-rising-concurrency-20
ref: CLM-0966
capability: multi-model-coordination
technique: route-agents-intent-weighted-per-task-pheromone-tables
statement: >-
  In heterogeneous LLM agent pools served under rising concurrency (20 to
  1000 parallel workers), load-balancing routing (weighted round-robin)
  loses accuracy as concurrency grows while semantic-conditioned path
  routing that keeps per-task routing memory holds accuracy flat, so
  throughput gains and routing quality are not automatically compatible.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four cost-tier backbones (GPT-4o-mini, Gemini-1.5-flash, Claude-3.5-haiku, Llama-3.1-70b) in a three-stage layered agent graph; accuracy measured on GSM8K only during the stress te"
sources:
