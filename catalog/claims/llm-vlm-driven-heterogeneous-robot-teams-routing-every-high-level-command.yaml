technique: check-actions-against-urdf-digital-twin-before-dispatch
statement: >-
  For LLM/VLM-driven heterogeneous robot teams, routing every high-level
  command through a digital-twin forward-dynamics and collision check built
  from the robot's own URDF before dispatch filters physically infeasible
  plans that the language model cannot rule out from semantics alone.
