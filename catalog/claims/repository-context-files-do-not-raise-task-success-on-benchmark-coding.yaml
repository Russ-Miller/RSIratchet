id: repository-context-files-do-not-raise-task-success-on-benchmark-coding
ref: CLM-0130
capability: procedure-following
technique: guide-file
statement: >-
  Giving a coding agent a repository context file — AGENTS.md, CLAUDE.md —
  does not raise its success rate on benchmark coding tasks and costs about
  20% more inference: across 4 agents, 2 benchmarks and 3 conditions,
  LLM-generated files hurt slightly in 5 of 8 settings while developer-written
  ones gained 2.4% (p=0.21), and agents obey the files — which is why they
  spend more — so the files do not carry success-relevant information rather
  than being ignored.
tags: [coding-agent, context]
kind: observation
backing_strength: single-paper
observed_on:
  era: "2026, Claude Code / Codex / Qwen Code on SWE-bench Lite and CTXbench"
sources:
  - source: arxiv-2602-11988
    stance: supports
    note: >-
      Measured with significance tests and ablations over generating model,
      prompt, length and section. Cost up 20% and 23%, steps up 2.45 and
      3.92. Time to first touch of a gold-patch file did not drop, so the
      overview does not help navigation. Python only; one sample per
      instance.
  - source: hashimoto-2026-ai-adoption-journey
    stance: contests
    note: >-
      The practitioner position the study is testing: a guide file that grows
      one rule per observed failure, over months, in one repository. No
      measurement, but a different outcome — recurrence of specific past
      mistakes — from the study's task success rate.
  - source: synthesis-2026-harness-engineering-playbook
    stance: contests
    note: >-
      Treats the guide file as the first harness layer and "organisational
      memory". Secondhand; relays Hashimoto and OpenAI.
contested: true
disagreement_axis:
  description: >-
    Probably the outcome variable, and possibly the file's origin. The study
    measures success on tasks the agent has never seen, in repositories
    where the file was written generically or generated by the agent; the
    practitioner claim is about a file that accumulates the exact failures
    one team's agent made in one codebase, measured by whether those
    failures recur. A file of non-obvious project deviations might do the
    second job while adding nothing to the first — the study's own
    developer-written condition trends that way (+2.4%, not significant). If
    that is right, the technique's value is in what goes in the file, not in
    having one. Not tested against each other.
  is_guess: true
status: pending-review
last_checked_at: 2026-09-11
notes: >-
  Filed the day the guide-file technique was, because the first measured
  study of it cuts against the practitioner consensus it came from. That is
  the catalogue working as intended: the technique record says what a guide
  file is, and this claim says the evidence on whether it helps is split,
  and along which axis.
submitted_by: agent:claude-fable-5-1@Russ-Miller
conditions:
  effect: no-effect
  cost: moderate
  fails_when: The file is LLM-generated, which hurt slightly in 5 of 8 settings.
    Developer-written files gained 2.4%, not significant, at about 20% more
    inference either way.
