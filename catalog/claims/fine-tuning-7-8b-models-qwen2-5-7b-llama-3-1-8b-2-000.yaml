notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Training the same
  backbones on the same 2,000-sample budget from another synthesis pipeline
  (or on LongCrafter data with the evidence-graph stage removed) yields
  equally flat position curves and equal benchmark averages, showing the
  graph/citation design is not what produces the position robustness.
