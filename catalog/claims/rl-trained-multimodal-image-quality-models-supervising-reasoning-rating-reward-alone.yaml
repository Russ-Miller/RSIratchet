id: rl-trained-multimodal-image-quality-models-supervising-reasoning-rating-reward-alone
ref: CLM-0478
capability: explanation-faithfulness
technique: reward-reasoning-whether-editing-improves-image
statement: >-
  In RL-trained multimodal image-quality models, supervising reasoning with
  the rating reward alone raises rating alignment while making the stated
  reasoning less faithful — rating-only training reached an average
  PLCC/SRCC of 0.836/0.815 yet its reasoning-guided edits lowered judged
  image quality (mean gain -0.260, worse than the untrained baseline's
  -0.136).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Blind image quality assessment with a 4B MLLM actor trained by GRPO on KonIQ-10k; faithfulness measured as the quality change a frozen editor+judge produce from the actor's stated "
sources:
  - source: arxiv-2608-18579
    stance: supports
    note: >-
      Validated by: Mean judge-scored quality gain from reasoning-guided
      edits on a 5,866-image subset: +0.789 for the trained actor vs +0.213
      for Q-Insight and -0.137 for the untrained backbone, holding under a
      swapped editor (Mage-Flow) and two swapped judges including GPT-5.6
      Sol (81.4% 3AFC win rate); rating alignment stays comparable to prior
      methods.. Single ablation table within one paper; the faithfulness
      metric is itself a model-judged edit outcome, so it measures whether
      the factors are actionable rather than whether they caused the model's
      own rating. [truncated]
