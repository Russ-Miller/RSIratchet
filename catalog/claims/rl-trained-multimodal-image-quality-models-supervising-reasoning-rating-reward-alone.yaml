id: rl-trained-multimodal-image-quality-models-supervising-reasoning-rating-reward-alone
ref: CLM-0476
capability: explanation-faithfulness
technique: reward-reasoning-edit-justifies-rating
statement: >-
  In RL-trained multimodal image-quality models, supervising reasoning with
  the rating reward alone raises rating alignment while making the stated
  reasoning less faithful than the untrained backbone's — edits derived from
  the reasoning of a rating-only model lowered judge-rated quality by 0.260
  on average versus 0.136 for the untrained baseline — so a reward computed
  from the final answer does not transfer to the explanation that precedes
  it.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen3.5-4B actor trained with GRPO on KonIQ-10k; faithfulness operationalized as the quality gain a frozen diffusion editor achieves when instructed by the model's reasoning, score"
sources:
  - source: arxiv-2608-18579
    stance: supports
    note: >-
      Validated by: Mean judge-score gain from reasoning-guided edits rose
      from -0.137 (baseline) and +0.213 (Q-Insight) to +0.789 for the
      trained actor, held direction across a swapped editor (Mage-Flow) and
      two swapped judges including GPT-5.6 Sol (81.4% preference in 3AFC),
      while average PLCC/SRCC stayed at 0.838/0.812, near the tool-augmented
      baseline.. Measured in one ablation table on a 5,843-image common
      subset plus cross-editor/judge checks on a 5,866-image subset. Single
      actor backbone, single training split, one proxy metric for
      faithfulness. [truncated]
contested: false
