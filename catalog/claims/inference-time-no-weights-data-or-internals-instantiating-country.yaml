id: inference-time-no-weights-data-or-internals-instantiating-country
ref: CLM-0307
capability: cultural-competence
technique: persona-disagreement-steering-cultural-alignment
statement: >-
  At inference time and with no weights, data or internals, instantiating a
  country as a panel of four World-Values-Survey-grounded personas and using
  their disagreement, not their consensus, as the steering signal reduced
  cultural misalignment on Moral-Machine-style dilemmas (MultiTP) by 10-24%
  across 20 countries and seven open backbones from 2B to 70B.
kind: observation
backing_strength: single-paper
observed_on:
  era: "MultiTP moral dilemmas, 20 countries on four continents, seven open-weight models in five families, 2026; black-box regime."
sources:
  - source: arxiv-2605-10843
    stance: supports
    note: >-
      Validated by: Misalignment reduction on MultiTP across 20 countries
      and seven backbones against the unsteered base and against
      consensus-persona baselines; no fine-tuning comparison on the same
      models.. Wide model and country coverage; the target is one
      moral-dilemma dataset, and the improvement is relative to a base that
      starts Western-aligned, so absolute fidelity is not reported.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Dilemma sets where
  persona disagreement is uninformative (personas agree but the population
  does not), or countries whose survey data is too thin to ground personas.
