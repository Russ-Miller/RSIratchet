id: multiple-choice-audio-questions-where-each-answer-choice-paired-generated
capability: audio-understanding
statement: >-
  On multiple-choice audio questions where each answer choice is paired with
  a generated image, adding the images helps native multimodal models most
  on environmental-sound questions and not at all on speech (speech is best
  audio-only), and in cascaded pipelines that convert audio to transcripts
  or captions first the images lower average accuracy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "5,667-item multiple-choice benchmark over speech, sound, music and mixed audio in six languages, with Stable-Diffusion/GPT-image-generated images for each choice; models tested inc"
sources:
  - source: arxiv-2608-23758
    stance: supports
    note: >-
      Accuracy table across 6 languages and 3 audio domains, plus a
      modality-ablation of the fine-tuned model. Qwen-2.5-omni gains +15.55%
      from audio-only to audio+image (p<0.01 paired t-test) with sound
      gaining most (+11.7%); cascaded Gemma3n drops when images are added
      (59.91 to 59.00 average); ablation shows speech best audio-only in
      most languages. Images are synthetic and one per choice, so the setup
      may leak answer information and does not isolate scene grounding from
      choice-level visual cues.
contested: false
