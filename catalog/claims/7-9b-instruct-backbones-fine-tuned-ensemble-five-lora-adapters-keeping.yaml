id: 7-9b-instruct-backbones-fine-tuned-ensemble-five-lora-adapters-keeping
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: commit-only-no-adapter-lora-ensemble-prefers-another
statement: >-
  For 7-9B instruct backbones fine-tuned with an ensemble of five LoRA
  adapters, keeping the adapters' per-answer probabilities as min/max bounds
  and answering only when one candidate's lower bound exceeds every other's
  upper bound yields abstention that tracks evidence quality with no tuned
  threshold: on free-form QA commitment falls from 31-48% of prompts to 4-8%
  when the supporting passage is replaced, while accuracy on committed
  answers stays above 90%.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Short-answer QA (CoQA, TriviaQA, OpenBookQA, ARC-Challenge) with 5 LoRA adapters on a frozen 7-9B backbone; intervals are only as wide as the adapter sample, and all adapters share"
