id: multimodal-program-repair-visually-grounded-code-generation-converting-bug-screenshot
ref: CLM-1153
capability: debugging
technique: convert-bug-screenshots-into-scene-graph-before-repair
statement: >-
  For multimodal program repair and visually-grounded code generation,
  converting a bug screenshot or control-flow diagram into a serialized
  scene graph of elements and their hierarchical relations helps the
  downstream coding model more than passing the raw image or a
  natural-language caption of it, with the gain largest where the visual
  artifact encodes program logic rather than decoration.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Shown for HTML/webpage renderings and control-flow graphs with an 8B VLM fine-tuned on 177k artifact-to-graph pairs; other artifact types (sequence, architecture diagrams) untested"
sources:
  - source: arxiv-2602-06090
    stance: supports
    note: >-
      Validated by: Pass@1 ablation: on MMCode, image-plus-caption 16.33% vs
      scene-graph 38.02%; CodeVision 89.02% vs 95.73%. On SWE-Bench M (517
      instances) the full system resolved 186 (35.98%), tied with GUIRepair
      under the same GPT-o3 coder; OmniGIRL visual subset 4/19 vs 0/19, n
      too small for a firm read. Scene-graph fidelity measured separately by
      Mermaid rendering accuracy (94.29%) and SSIM (0.7892) vs the 8B base
      (81.14%, 0.6868).. [truncated]
