id: used-steer-test-time-compute-generative-llm-judges-7b-70b-rerank
ref: CLM-0280
capability: critique
statement: >-
  Used to steer test-time compute, generative LLM judges (7B-70B) rerank
  candidate responses about as well as outcome reward models, are
  consistently worse than process reward models at step-level beam search,
  and their natural-language critiques, the one thing only a judge can
  produce, did not guide generators to better responses on math, code or
  instruction following.
kind: observation
backing_strength: single-paper
observed_on:
  era: "JETTS: 10 judge models and 8 generators (6.7B-72B), 2025; three tasks (reranking, beam search, critique-based refinement) in math, code and instruction following; open models only."
sources:
  - source: arxiv-2504-15253
    stance: supports
    note: >-
      Systematic across judge and generator sizes; the refinement result
      lacks an oracle upper bound so 'ineffective' means no gain over the
      generator's own retry rather than a measured ceiling. Open models up
      to 72B only.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A judge whose critiques,
  fed back to the generator, raise final accuracy above best-of-n reranking
  on the same benchmark, or frontier closed judges that close the
  process-reward gap.
