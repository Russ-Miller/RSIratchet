id: robot-manipulation-driven-generated-video-plans-anchoring-inverse-dynamics
ref: CLM-1154
capability: embodied-control
technique: track-tool-object-turn-video-plans-into-motion
statement: >-
  For robot manipulation driven by generated video plans, anchoring the
  inverse dynamics model on the tracked 3D trajectory of the end-effector
  (segmented, depth-aligned, fitted to a rigid-body transform) rather than
  on object state yields higher real-world success than end-to-end VLA
  policies and object-tracking IDMs, with the gap largest on high-precision
  and deformable-object tasks the model never trained on.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Real-robot tabletop manipulation where the end-effector is visible in the first generated frame; evaluated on 9 tasks plus zero-shot cloth, camera-swap and cross-embodiment probes "
sources:
  - source: arxiv-2601-18323
    stance: supports
    note: >-
      Validated by: Real-robot success rates on 9 tasks binned
      easy/medium/hard, against ResNet-MLP, AVDC, AnyPos and a 2D-tracker
      IDM on ground-truth replay (93.3/53.3/28.9% vs baselines), and against
      pi-0 plus eight video-model IDM pipelines (61.11% average, 38.46%
      zero-shot deformable).. Measured on real hardware with small per-task
      samples (9-15 trials each), single lab, no seeds or confidence
      intervals. Replay ablation isolates the IDM from the planner, which is
      the strongest part of the design; [truncated]
contested: false
