notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: An object-state-tracking or
  end-to-end VLA baseline matching or beating tool-trajectory anchoring on
  the same generated plans, especially on deformable or high-precision
  tasks; or the advantage disappearing once the gripper is occluded or when
  a different lab replicates with matched training data.
