id: training-sequence-to-sequence-model-generate-regular-expressions-natural-language-rewarding
ref: CLM-0258
capability: formal-query-synthesis
technique: train-semantic-equivalence-string-match
statement: >-
  When training a sequence-to-sequence model to generate regular expressions
  from natural language, rewarding semantic equivalence to the reference
  (checked by DFA equivalence and test cases) yields more semantically
  correct regexes than maximum-likelihood training on the reference string,
  because one intent has many syntactically different equivalent regexes.
