id: asked-supply-missing-biomedical-reference-models-retrieve-real-paper
ref: CLM-0565
capability: hallucination
statement: >-
  When asked to supply a missing biomedical reference, models that retrieve
  a real paper often still misstate its journal, year or authors, so
  verifiable-reference rate overstates usable accuracy: two Claude models
  with near-identical verifiable rates (77.6% and 76.6%) were correct in
  every bibliographic field in 54.6% and 19.9% of responses.
kind: observation
backing_strength: single-paper
observed_on:
  era: "26 models from eight developers (2023-2026), 69 biomedical passages across ten domains, one reference requested per passage; fabrication rate also depends on decline rate, with the"
sources:
  - source: arxiv-2609-14988
    stance: supports
    note: >-
      Measured: references classified as verifiable, partial, fabricated or
      declined, with journal/year/author match checked against the cited
      paper. Across all models 55.4% fabricated and 14.9% correct in every
      field; 2026-released models 35.3% and 31.8%. Single paper, single
      prompt format, no mitigation tested; decline behaviour confounds the
      fabrication ranking.
contested: false
status: pending-review
last_checked_at: 2026-10-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Models whose
  verifiable-reference rates are similar also show similar field-level
  correctness rates, so existence-checking a citation predicts metadata
  correctness.
