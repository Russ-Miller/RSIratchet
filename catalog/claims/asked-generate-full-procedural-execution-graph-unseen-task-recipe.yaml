id: asked-generate-full-procedural-execution-graph-unseen-task-recipe
ref: CLM-0557
capability: planning
technique: generate-action-skeleton-creator-transition-priors-then-assign
statement: >-
  When asked to generate a full procedural execution graph for an unseen
  task (recipe) in a specific creator's style, few-shot LLMs assign
  ingredients to steps better than a statistical two-stage pipeline but
  predict the number of steps worse, and swapping in a larger LLM backbone
  does not close that step-count gap.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Culinary procedural graphs extracted from video transcripts (97 creators, >5,000 videos), evaluated by Ingredient F1 and normalized step-count error; GPT-5.4, GPT-4.1-mini, Qwen3.6"
sources:
  - source: arxiv-2608-24369
    stance: supports
    note: >-
      Validated by: Compared against zero-shot LLM, few-shot LLM,
      autoregressive step-by-step, and N-gram baselines on Ingredient F1,
      normalized edge F1 and step error over long- and short-form splits;
      the two-stage model had the lowest step error (0.350 long, 0.332 short
      vs 0.373/0.351 few-shot) and lower IF1 (0.294/0.348 vs 0.344/0.385). A
      persona-swap control (other creator's priors, same dish) cost 0.06
      nEF1 (p<1e-54).. Measured on one dataset in one domain, single author,
      with a persona-swap control that rules out generic culinary structure
      for the two-stage result. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A few-shot LLM (or a larger
  backbone) that matches or beats the structured two-stage pipeline on
  step-count error while keeping its ingredient-assignment advantage on the
  same graphs.
