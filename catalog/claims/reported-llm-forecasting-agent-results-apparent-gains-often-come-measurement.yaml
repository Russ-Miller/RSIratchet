id: reported-llm-forecasting-agent-results-apparent-gains-often-come-measurement
ref: CLM-0472
capability: forecasting
technique: score-forecasting-agents-live-contamination-resistant-questions-cost
statement: >-
  In reported LLM forecasting-agent results, apparent gains often come from
  the measurement setup rather than the language model: ablations frequently
  show the LLM component adding no accuracy over the statistical or
  retrieval parts, small input perturbations move predictions, and benchmark
  gains on questions predating the training cutoff can reflect contamination
  rather than temporal reasoning.
kind: mechanism
backing_strength: single-paper
