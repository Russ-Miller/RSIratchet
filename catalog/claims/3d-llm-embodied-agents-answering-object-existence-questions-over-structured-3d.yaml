notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Applying the same
  contrastive subtraction with a null or irrelevant second context (e.g. an
  unrelated scene graph, or the same graph unchanged with a temperature
  shift) producing equal gains, which would show the effect comes from the
  logit arithmetic rather than from 3D evidence sensitivity; or showing the
  accuracy gain disappears once yes-rate is matched to the baseline by
  thresholding.
