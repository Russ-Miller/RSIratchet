id: llm-agents-operating-over-long-interaction-trajectories-32k-4m
ref: CLM-1086
capability: long-context-degradation
statement: >-
  For LLM agents operating over long interaction trajectories (32K to 4M
  tokens), degradation tracks the minimum number of tokens needed to resolve
  a query rather than raw context length, so dense tool responses hurt more
  than fragmented long-turn dialogue of comparable length.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Measured on simulated environment rollouts built from Lateral Thinking Puzzles, across knowledge-intensive and knowledge-free scenarios, with frontier models and memory systems fro"
sources:
  - source: arxiv-2601-20730
    stance: supports
    note: >-
      Measured on a new benchmark of agent rollouts over several
      state-of-the-art models and memory systems; the source text reports
      the attribution to minimum resolving tokens as an analysis conclusion
      without giving numbers, so the size of the effect and the isolation of
      density from length are not verifiable from what is given.
contested: false
