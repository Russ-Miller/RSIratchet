notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Matched random-mode edits
  at the same k and alpha reduce CHAIR_s as much as dominant-mode edits, or
  antisymmetric-channel damping reduces hallucination comparably, on these
  or further GQA VLMs.
