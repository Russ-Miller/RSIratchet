notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An evaluation where
  adding functional-correctness and similarity features to a perplexity-only
  detector gives no improvement in MCC/AUC, or where the classifier's
  advantage disappears on real (not fine-tuning-simulated) leakage. Drafted
  stance toward static-code-benchmarks-saturate-need-continuous-refresh:
  supports -- The paper documents that widely used code benchmarks leak into
  training data and that leaked items yield inflated pass@1, which is the
  pressure behind continuous benchmark refresh.
