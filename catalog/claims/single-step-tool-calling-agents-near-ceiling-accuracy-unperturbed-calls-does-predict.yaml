id: single-step-tool-calling-agents-near-ceiling-accuracy-unperturbed-calls-does-predict
ref: CLM-0486
capability: tool-use
technique: score-tool-call-failures-earliest-pipeline-stage-final
statement: >-
  For single-step tool-calling agents, near-ceiling accuracy on unperturbed
  calls does not predict robustness to stage-wise perturbations, and the
  weakest stage is interpreting returned tool output: across 7 models, clean
  success averaged 0.979 while success under corrupted, incomplete or
  competing returned evidence averaged 0.455, with no model above 0.60,
  versus 0.918 under perturbed tool names and descriptions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-step calls against 16 sampled deterministic local tools (not live APIs), 14 perturbation subtypes at light/medium/heavy severity, 7 frontier models; no long-horizon or multi"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage recovered
      71/98 failed instances (100% for single-fault, 82.1% for cascades, 0%
      for multi-fault); human audit on 30 ambiguous cases agreed 74.2%; and
      the labels predicted which fix worked — alias clarification for
      interface failures lifted gpt-5.4-mini from 21/30 to 30/30, while
      argument-binding chain-of-thought for intent failures changed nothing
      (21/30 both).. Measured on 15,456 single-family records (48 seed tasks
      per model per condition) with deterministic scoring; [truncated]
