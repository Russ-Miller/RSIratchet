id: single-step-tool-calling-agents-near-ceiling-accuracy-unperturbed-calls-does-predict
ref: CLM-0487
capability: tool-use
technique: stage-aligned-perturbation-cascade-aware-failure-attribution
statement: >-
  For single-step tool-calling agents, near-ceiling accuracy on unperturbed
  calls does not predict robustness to perturbation, and corrupting or
  removing the tool's returned evidence hurts far more than perturbing tool
  names, descriptions, or the user request.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven frontier models on a deterministic local 16-tool environment, single-step calls, four perturbation families at light/medium/heavy severity; no long-horizon or live-API settin"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage resolved
      71/98 failures (100% single-error, 82.1% cascade, 0% multi-fault);
      human audit of 30 ambiguous cases agreed 74.2%; labels predicted that
      an S1 alias fix raised gpt-5.4-mini from 21/30 to 30/30 while an S3
      CoT fix left it unchanged at 21/30.. Measured over 15,456
      single-family records across 7 models: mean clean 0.979 versus overall
      robustness 0.664-0.766; family means 0.918 interface, 0.773 intent,
      0.688 runtime, 0.455 observation, with no model above 0.60 on
      observation. [truncated]
contested: false
