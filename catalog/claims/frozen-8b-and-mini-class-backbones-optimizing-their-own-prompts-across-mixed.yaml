    note: >-
      Validated by: Accuracy on six tasks against four prompting baselines
      and five APO baselines (ProTeGi, OPRO, TextGrad, PromptBreeder, SPO);
      best average on both backbones (70.7 vs 63.6 for TextGrad on
      GPT-4o-mini) at ~57% lower optimization dollar cost; cross-domain mix
      (Gaokao MathQA + History) where baselines degrade; ablations on each
      memory store and on top-k (peak at k=3).. Measured on six benchmark
      subsets with two backbones against nine baselines, plus component and
