id: frozen-8b-and-mini-class-backbones-optimizing-their-own-prompts-across-mixed
ref: CLM-1093
capability: harness-self-improvement
technique: compose-prompts-retrieved-strategies-plus-failure-rules
statement: >-
  For frozen 8B-and-mini-class backbones optimizing their own prompts across
  a mixed set of tasks, composing each prompt at query time from retrieved
  past successful-strategy templates plus accumulated failure rules holds up
  better than searching for one static task-level prompt, whose gains
  concentrate on some tasks and degrade others once domains are mixed.
