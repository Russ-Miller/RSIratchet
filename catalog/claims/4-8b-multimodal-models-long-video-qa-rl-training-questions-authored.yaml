notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An ablation where
  whole-video-authored VQA (V2V) at the same data scale and reward matches
  or beats segment-authored VQA, or where removing segment timestamps from
  training instructions makes no difference to final accuracy. Proposed
  technique, not catalogued: segment-authored questions trained on whole
  video.
