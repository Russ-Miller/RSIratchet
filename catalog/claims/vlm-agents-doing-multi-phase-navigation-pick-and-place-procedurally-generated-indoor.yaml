id: vlm-agents-doing-multi-phase-navigation-pick-and-place-procedurally-generated-indoor
ref: CLM-0744
capability: embodied-control
technique: report-subtask-progress-trajectory-diagnostics-just-success-rate
statement: >-
  For VLM agents doing multi-phase navigation and pick-and-place in
  procedurally generated indoor scenes with moving human obstacles, subtask
  progress runs well ahead of full success — agents reach the first goal and
  then stall or loop after the phase transition — so success rate alone
  hides where the failure is.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two VLM agents (Qwen3-VL-30B-A3B-Thinking, Gemini 3.1 Pro) on 333 tasks across three tiers varying subtask count and initial target visibility, 150-action/50-call budget, kinematic"
sources:
  - source: arxiv-2608-26947
    stance: supports
    note: >-
      Validated by: Not measured as an intervention; the paper reports that
      SP exceeds SR on the two-phase tiers (Qwen 35.5% SP vs 18.2% SR on L2;
      15.0% vs 4.5% on L3; Gemini 36.4% vs 23.6% and 27.7% vs 18.2%) and
      shows a trajectory where the agent reaches goal 1 then ends 8.0 m from
      goal 2.. Measured on 333 auto-generated tasks in 113 Infinigen Indoors
      scenes, two models only, differing in architecture, training and
      serving stack, so the cross-model comparison is diagnostic not
      controlled; the progress-exceeds-success gap holds within each model
      on both two-phase tiers. [truncated]
contested: false
