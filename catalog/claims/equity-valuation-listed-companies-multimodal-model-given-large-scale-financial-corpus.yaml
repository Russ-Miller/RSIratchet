id: equity-valuation-listed-companies-multimodal-model-given-large-scale-financial-corpus
ref: CLM-0383
capability: domain-knowledge
technique: two-stage-domain-pre-training-then-institution-specific
statement: >-
  For equity valuation of listed companies, a multimodal model given
  large-scale financial-corpus pre-training followed by institution-specific
  fine-tuning produces lower target-price error than the same class of model
  fine-tuned in a single stage or prompted zero-shot, with the pre-training
  stage carrying gains that fine-tuning alone does not supply.
kind: observation
backing_strength: single-paper
observed_on:
  era: "200 listed companies, target prices scored against analyst consensus; baselines were GPT-4 zero-shot, FinGPT single-stage fine-tuning, and an analyst-input DCF spreadsheet"
sources:
  - source: arxiv-2608-22724
    stance: supports
    note: >-
      Validated by: Mean absolute error and RMSE of target price versus
      analyst consensus on 200 companies, plus direction accuracy of
      Buy/Hold/Sell against consensus revision within 90 days; reported MAE
      13.1% versus 16.2% for the DCF spreadsheet and 18.7% for single-stage
      FinGPT.. Single system paper, self-reported tables, no ablation
      isolating the pre-training stage from the fine-tuning data or from the
      multimodal parsing layer; consensus price targets used as ground truth
      rather than realized prices; no seeds or confidence intervals on the
      valuation table.
contested: false
status: pending-review
last_checked_at: 2026-10-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A matched comparison in
  which single-stage fine-tuning on the same institution-specific data, with
  no financial-domain pre-training, reaches equal or lower valuation error
  on a held-out company panel.
