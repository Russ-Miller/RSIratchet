id: initially-identical-llm-agents-act-shared-persistent-world-where
ref: CLM-0626
capability: multi-model-coordination
technique: coordinate-agents-through-persistent-shared-world-messages
statement: >-
  When initially identical LLM agents act in a shared persistent world where
  their artifacts remain and are scored by an external simulator, the shared
  society builds broader and more resilient technology portfolios than a
  matched best-of-N population of isolated agents, but isolated search still
  yields the single best-performing artifact.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Simulated spatial world with 50-200 LLM agents, 800-3,200 ticks, four matched world seeds; outcomes scored by a deterministic simulator under unseen disturbances after agents are r"
sources:
  - source: arxiv-2608-26081
    stance: supports
    note: >-
      Validated by: Paired per-seed comparison against an endpoint-wise
      best-of-N isolated-agent envelope on portfolio resilience
      (0.2474/0.2365 vs 0.1794), validated inventions (5.75/7.00 vs 2.75),
      held-out resilience, and best single artifact (0.2380 vs 0.3488),
      across four seeds and five checkpoints.. Measured on four matched
      world seeds per cell with paired seed-bootstrap intervals; effect
      sizes rather than population inference, and discovery-frontier AUC
      ranking flips with population size, so only the
      portfolio/resilience/invention direction is consistent. [truncated]
