id: pairing-strong-guide-agent-much-weaker-solver-agent-score
ref: CLM-1030
capability: multi-model-coordination
technique: scale-guidance-intensity-weak-agent-s-response-entropy
statement: >-
  Pairing a strong guide agent with a much weaker solver agent can score
  below pairing two copies of the weak agent on the same task, because the
  weak solver misreads or discards the strong agent's reasoning chain rather
  than executing it.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two-agent guide-solver pipelines where the solver is a sub-1B open model (Qwen-2.5-0.5B, Llama-3.2-1B) and the guide is a frontier model, on math reasoning (GSM8K), Python code (MB"
sources:
  - source: arxiv-2602-13639
    stance: supports
    note: >-
      Validated by: Average accuracy across four strong-weak pairs versus a
      no-guidance and a chain-of-thought baseline: GSM8K 45.0 to 64.0 (69.0
      with retrieval), MBPP 36.5 to 43.5 (46.0), CVRP 65.0 to 71.6 (81.3);
      CoT baselines were 51.0, 43.5, 66.6.. Measured on small samples (50
      GSM8K, 50 MBPP, 20 CVRP) with four strong-weak pairs and two weak-weak
      pairs; the inversion appears on GSM8K (SW 45.0 vs WW baseline) and
      MBPP (GPT+Qwen 20.0 vs Qwen-Qwen 26.0) but not CVRP, and no confidence
      intervals or repeated runs are reported. [truncated]
