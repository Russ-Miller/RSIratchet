id: small-world-model-llms-1b-4b-predicting-next-states-rule-governed-text
ref: CLM-1043
capability: state-tracking
technique: rerank-candidate-next-states-executable-rule-scores
statement: >-
  For small world-model LLMs (1B-4B) predicting next states in rule-governed
  text environments, applying symbolic rule outputs as scores that rerank
  candidate next states raises prediction accuracy more than injecting the
  same rules as natural-language text into the model's context, because
  score-level application does not depend on the model following prompt
  instructions.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Multiple-choice next-state prediction in ScienceWorld, WebShop and PlanCraft with Llama-3.2-1B and Qwen3-4B backbones; rules authored offline by a larger model."
sources:
  - source: arxiv-2602-10480
    stance: supports
    note: >-
      Validated by: Next-state prediction accuracy on three environments
      against standalone neural WM, full-data SFT, GPT-5-mini, and WALL-E
      context injection; Phase 2 reranking beat WALL-E by 8.8 points (Llama)
      and 2.9 points (Qwen) on ScienceWorld, and a WALL-E-2.0-style
      executable-feedback control averaged 49.0/56.5 versus 82.7/83.7..
      Measured across 3 environments x 2 backbones with matched rule sets;
      gap is largest on the 1B model, consistent with the stated
      instruction-following mechanism. [truncated]
contested: false
