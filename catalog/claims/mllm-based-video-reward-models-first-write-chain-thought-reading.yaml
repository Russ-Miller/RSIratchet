      in-domain pairs plus GenAI and VideoGen-Bench; 0.768 Acc w/o Tie on
      VideoGen-Bench vs 0.722 for the best discriminative baseline and 0.582
      for the best generative baseline; ablation removing the auxiliary BT
      loss drops VideoGen-Bench from 0.768 to 0.648. Measured on one
