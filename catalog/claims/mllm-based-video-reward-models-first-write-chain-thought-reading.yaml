id: mllm-based-video-reward-models-first-write-chain-thought-reading
ref: CLM-0843
capability: critique
technique: score-query-token-reasoning-chain
statement: >-
  For MLLM-based video reward models that first write a chain of thought,
  reading the final score off a learnable query token with a regression head
  trained by Bradley-Terry loss, rather than emitting the score as the next
  tokens of the same reasoning chain, gives higher human-preference
  agreement on out-of-distribution video pairs and smoother training than
  GRPO-only optimization.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "8B MLLM backbone (Qwen3-VL-8B) on text-to-video preference pairs with five alignment dimensions; 22K training pairs, in-domain plus GenAI and VideoGen-Bench OOD splits"
