id: generative-tool-selection-models-fine-tuned-over-large-tool-libraries-47
ref: CLM-1092
capability: tool-use
technique: give-each-tool-hierarchical-code-sequence-one-token
statement: >-
  For generative tool-selection models fine-tuned over large tool libraries
  (~47,000 APIs), assigning each tool a unique new vocabulary token both
  degrades the base model's general language ability and limits multi-tool
  performance, while representing each tool as a short hierarchical sequence
  of shared discrete codes learned with co-usage regularization keeps
  vocabulary growth logarithmic, preserves language modelling, and raises
  complex multi-tool task completion.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Llama-3-8B (and Qwen) fine-tuned on ToolBench with 46,985 APIs; measured on tool retrieval NDCG, StableToolBench SoPR/SoWR, WikiText-2 perplexity and summarization."
sources:
  - source: arxiv-2601-21947
    stance: supports
    note: >-
      Validated by: NDCG@1/3/5 on ToolBench I1-I3 against BM25, EmbSim,
      ToolRetriever and the one-token-per-tool ToolGen (I3 NDCG@1 88.00 vs
      81.00); end-to-end SoPR on I3 52.19 vs 36.34; WikiText-2 PPL 25.36 vs
      104.54 for ToolGen against a 6.34 base; ablations on the collaborative
      weight, components, and four alternative tokenization schemes..
      Measured on one benchmark family (ToolBench/StableToolBench) with one
      main backbone; the comparison against ToolGen conflates tokenization
      scheme with the full training pipeline, and the general-capability
      result is only three datasets. [truncated]
