id: two-agent-embodied-social-task-where-one-agent-must-guide
ref: CLM-0501
capability: embodied-control
statement: >-
  In a two-agent embodied social task where one agent must guide or mislead
  the other through movement, gaze, facial expression and speech,
  open-source VLMs up to 15B parameters fail at two sequential points: most
  do not produce directionally coherent nonverbal signals, and even where
  signals are coherent the receiving agent does not decode and act on them,
  so imposing an explicit ToM-order constraint produces no behavioral change
  matching the specified reasoning level.
kind: observation
backing_strength: single-paper
observed_on:
  era: "11 open-source VLMs plus a text-only LLM, at most 15B parameters, 200 trials each, one Unity scenario with a hidden reward in one of two boxes; no closed models, no larger models, "
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured: trial-level outcome conformance plus four signal metrics
      across four conditions, 200 trials per model, with positional bias and
      uncertainty rate as diagnostics to rule out degenerate strategies. A
      hybrid architecture with an explicit ToM module cleared both
      bottlenecks, which argues the task is feasible. Single scenario, no
      human baseline, size capped at 15B, so the claim does not isolate
      architecture from scale.
contested: false
status: pending-review
last_checked_at: 2026-10-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A VLM in this size class
  showing both high trajectory/gaze alignment and condition-appropriate
  signal sensitivity (positive under ToM-0, inverted under competitive
  ToM-1) with low positional bias on the same protocol.
