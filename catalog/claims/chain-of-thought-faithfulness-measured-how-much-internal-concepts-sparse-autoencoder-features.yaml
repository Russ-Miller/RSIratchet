    stance: supports
    note: >-
      Validated by: Compared against random-subset, prediction-only, and
      norm-matched ablation controls (all near zero effect), a completeness
      check adding prediction-only features (negligible increment), a top-k
      magnitude upper bound (only marginally higher), and two SAE
      width/sparsity configurations (Pearson r > 0.8 across
      configurations).. Measured on five models and four datasets with
      layer-wise reporting; association quantified by median-binarised lift
      of 1.08 and weak Spearman correlations. Controls rule out ablation
      count, feature magnitude and SAE hyperparameters. [truncated]
