id: chain-of-thought-faithfulness-measured-how-much-internal-concepts-sparse-autoencoder-features
ref: CLM-0350
capability: explanation-faithfulness
technique: ablate-cot-prediction-shared-sae-concepts-test-faithfulness
statement: >-
  When chain-of-thought faithfulness is measured by how much the internal
  concepts (sparse-autoencoder features) active during a CoT pass overlap
  with those active during a direct-answer pass, that overlap barely
  predicts whether the shared concepts causally drive the answer: across
  five open models and four reasoning datasets, above-median concept
  alignment raised the chance of an above-median causal ablation effect by
  only about 8%, so representational correspondence cannot substitute for an
  ablation test.
