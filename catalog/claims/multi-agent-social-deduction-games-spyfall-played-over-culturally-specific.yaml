id: multi-agent-social-deduction-games-spyfall-played-over-culturally-specific
ref: CLM-1026
capability: strategic-deception
technique: benchmark-models-playing-culturally-localized-social-deduction-game
statement: >-
  In multi-agent social deduction games (Spyfall) played over culturally
  specific entities, LLMs' ability to deduce the hidden entity and to evade
  detection degrades in non-English settings and on locally specific
  entities, with the drop largest for weaker models and for a dialect
  (Egyptian Arabic) the models default away from.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six models (Gemini-2.5-Pro/Flash, Qwen3-30B/8B, Gemma3-12B, Llama3.1-8B), 9,000 five-player matches, English plus Indonesian, Simplified Chinese and Egyptian Arabic; entity pools o"
sources:
  - source: arxiv-2601-09017
    stance: supports
    note: >-
      Validated by: Rankings over five overlapping models matched Chatbot
      Arena ordering, with wider rating spread; per-scenario spy guess
      accuracy and leakage rates reported, but no comparison against an
      alternative dynamic benchmark.. Measured: spy guess accuracy fell from
      67.3% (English generic) to 24.4% (Egyptian Arabic local food); leakage
      rates reached 37% for Llama3.1-8B in Indonesian versus 0% for Gemini
      models; each game played once, so per-cell estimates are noisy, and
      language, cultural knowledge and strategy are entangled by the
      authors' own admission.
