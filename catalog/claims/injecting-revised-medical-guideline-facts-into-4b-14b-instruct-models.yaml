id: injecting-revised-medical-guideline-facts-into-4b-14b-instruct-models
ref: CLM-0628
capability: knowledge-updating
technique: render-knowledge-updates-shared-pool-extended-matching-items
statement: >-
  When injecting revised medical guideline facts into 4B-14B instruct models
  by LoRA SFT under a matched token budget, rendering the same update events
  as extended-matching items — several related vignettes sharing one
  candidate answer pool — transfers better to a held-out temporally anchored
  oncology staging benchmark than short-answer, fill-in-the-blank, or
  per-vignette multiple-select renderings of the identical content.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Oncology guideline updates, LoRA SFT, Qwen3 1.7B-14B plus Llama-3.1-8B; formats still differ in candidate-set size and surface complexity despite matched token budget; not uniforml"
sources:
  - source: arxiv-2608-30405
    stance: supports
    note: >-
      Validated by: SEER-Bench answer accuracy 57.6 to 64.8 and rationale
      accuracy 50.7 to 59.6 on Qwen3-4B, versus 61.5-62.7 answer accuracy
      for the three other same-budget formats; HealthBench retention 0.247
      to 0.263; replicated on Llama-3.1-8B and across 1.7B/8B/14B backbones;
      vignette-matched and density-matched controls reported in appendices..
      Measured on a single oncology benchmark built by the same authors
      (1,992 cases, expert-reviewed) plus HealthBench Professional and a
      MedGUIDE diagnostic. [truncated]
