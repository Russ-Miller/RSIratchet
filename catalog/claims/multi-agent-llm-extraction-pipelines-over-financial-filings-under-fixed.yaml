id: multi-agent-llm-extraction-pipelines-over-financial-filings-under-fixed
ref: CLM-0933
capability: multi-model-coordination
statement: >-
  For multi-agent LLM extraction pipelines over financial filings under a
  fixed compute budget, the accuracy ranking of orchestration patterns
  inverts with throughput: an iterative self-correcting (reflexive) loop is
  most accurate at low volume but falls below hierarchical supervisor-worker
  and then below parallel fan-out as daily volume rises, because queuing
  delay forces timeout truncation of the very correction iterations that
  produced its advantage.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Structured field extraction from SEC filings (25 field types, 10,000 documents), five frontier and open-weight backbones, fixed 8-node cluster, volumes 1K-100K documents per day; c"
sources:
  - source: arxiv-2603-22651
    stance: supports
    note: >-
      Measured: reported field-level F1 at six throughput levels for four
      architectures with Claude 3.5 Sonnet (reflexive 0.943 at 1K falling to
      0.871 at 100K; sequential 0.903 to 0.886), plus latency percentiles
      showing reflexive p99/p50 of 3.34x. The truncation mechanism is
      asserted from the design rather than isolated by an ablation that
      varies the timeout policy alone. Single paper, one cluster
      configuration, one document domain; cost figures tied to January 2025
      API pricing.
contested: false
status: pending-review
last_checked_at: 2026-11-07
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A scaling sweep under a
  fixed compute budget in which the reflexive/self-correcting architecture
  retains its accuracy lead at the highest tested throughput, or in which
  its degradation is not traceable to truncated correction iterations.
