notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Running the single-pass
  baseline at the same token/compute budget as the loop, or running the loop
  with the verifier replaced by a no-op of equal cost, closes most of the
  reported gap.
