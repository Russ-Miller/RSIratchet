statement: >-
  For language-guided UAV flight over multi-stage instructions requiring
  continuous 6-DoF control, running a low-frequency streaming video VLM that
  emits textual flight-state-and-next-subgoal reasoning, and conditioning a
  separate high-frequency diffusion action model on that reasoning's hidden
  states, completes more subtasks than end-to-end VLA or discrete-action VLN
  baselines adapted to the same task.
