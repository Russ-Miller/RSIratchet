    note: >-
      Validated by: Closed-loop success rate and stage success rate on two
      task splits: Long-horizon Flow SR 59.0% / SSR 78.97% vs MemoryVLA
      18.5/38.69 and OpenVLA-UAV 10.5/30.87; Fine-grained VLN SR 13.5% /
      IASR 11.0% vs NaVid 13.0/5.0 and CMA+LAG 6.5/4.5. The reasoning VLM
      scores 64.2% state / 68.1% action accuracy against 25.8/39.1 for
