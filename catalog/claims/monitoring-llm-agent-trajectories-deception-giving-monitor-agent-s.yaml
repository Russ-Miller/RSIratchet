id: monitoring-llm-agent-trajectories-deception-giving-monitor-agent-s
ref: CLM-0977
capability: strategic-deception
technique: monitor-chain-of-thought-hidden-states-just-actions
statement: >-
  For monitoring LLM agent trajectories for deception, giving the monitor
  the agent's chain-of-thought text, and additionally a probe on mid-layer
  hidden states from a separate open-weights encoder, detects deception
  better than a monitor restricted to actions and outputs, with the margin
  largest on subtle structural deception (oversight sabotage, audit-trail
  manipulation, precedent engineering) and shrinking as the agent's CoT is
  sanitized or made deliberately misleading.
kind: observation
backing_strength: single-paper
