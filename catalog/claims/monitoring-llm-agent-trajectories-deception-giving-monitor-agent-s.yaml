    stance: supports
    note: >-
      Validated by: Partial AUROC over FPR<=0.20 on 9,200 held-out
      DeceptArena trajectories with deterministic environment-check labels:
      black-box 0.837, CoT-aware prompted 0.869, activation-probe 0.901,
      hybrid ensemble 0.934; per-category gains largest for structural
      deception (e.g. precedent engineering 0.718 to 0.901), and stratified
      by honest/sanitized/deceptive CoT condition (+0.162/+0.071/+0.031)..
      Measured, single paper, one lab. [truncated]
