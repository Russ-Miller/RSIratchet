id: a-single-aggregate-benchmark-conceals-domain-trajectories-that-differ-in-shape
ref: CLM-0009
capability: evaluation-validity
statement: >-
  When each capability domain's annual benchmark frontier is normalised to
  its own scale (0 at the benchmark's entry-year frontier, 100 at a perfect
  score), the domains move on different curves — broad knowledge gains slow
  from 32.8 to 26.9 to 17.6 points a year, legal reasoning from 48.2 to 11.4
  to 4.9, while advanced mathematics accelerates from 32.8 to 53.6 and
  multimodal reasoning jumps 59.7 then only 2.5 — so a single aggregate
  benchmark score conceals both the level and the trajectory shape of
  progress, and cannot say which capabilities are saturating.
kind: mechanism
backing_strength: single-paper
sources:
  - source: arxiv-2609-11873
    stance: supports
    note: >-
      Section 2.1, Observation 1, with the square-root family weighting the
      authors use so better-covered benchmark families count more without
      dominating a domain. The claim is about what aggregation hides; the
      specific increments are this paper's construction.
