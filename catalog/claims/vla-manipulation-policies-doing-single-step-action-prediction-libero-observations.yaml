id: vla-manipulation-policies-doing-single-step-action-prediction-libero-observations
ref: CLM-0392
capability: embodied-control
technique: validate-whole-perturbation-region-don-t-sample
statement: >-
  For VLA manipulation policies doing single-step action prediction on
  LIBERO observations, the commanded action is fragile to camera rotation
  but tolerant of brightness: validated over entire continuous perturbation
  regions, 27% of instances admit a counterexample within ±1° of camera
  rotation and 51% within ±2°, while every instance is robust to a ±2%
  brightness shift and the median tolerates ±30%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five LIBERO-finetuned VLAs (OpenVLA, OpenVLA-OFT, GR00T N1.7, pi0, pi0.5), 40 sampled observations, open-loop one-step action prediction, tolerance set at the 90th percentile of co"
sources:
  - source: arxiv-2609-22293
    stance: supports
    note: >-
      Validated by: Compared against uniform random sampling on the 2,835
      VLA instances where a counterexample was found: sampling found nothing
      on 34 within a 17,000-draw budget and was slower from two iterations
      onward; against the original H2V on 100 robust instances it used 15.3x
      fewer queries in total and decided all 100 where H2V left 32
      undecided. A k-draw sampling protocol wrongly called an instance
      robust in 50% of its robust reports at k=1, 42% at k=10, 6% at k=100..
