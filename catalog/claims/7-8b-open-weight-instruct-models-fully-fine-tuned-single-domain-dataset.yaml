id: 7-8b-open-weight-instruct-models-fully-fine-tuned-single-domain-dataset
ref: CLM-0343
capability: fine-tuning-retention
technique: update-only-stable-neurons-anchor-their-activations
statement: >-
  When 7-8B open-weight instruct models are fully fine-tuned on a single
  domain dataset, confining gradient updates to FFN neurons that activate
  stably across the training set and adding an MSE loss that pulls
  activations back toward pre-computed activation anchors retains far more
  general-benchmark ability (MMLU, BBH, TyDiQA) than full-parameter
  fine-tuning, by about 9.9 points on average, while also raising in-domain
  scores.
