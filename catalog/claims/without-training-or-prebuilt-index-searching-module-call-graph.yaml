id: without-training-or-prebuilt-index-searching-module-call-graph
ref: CLM-0273
capability: repository-navigation
technique: two-phase-call-graph-search-files-broad-then
statement: >-
  Without training or a prebuilt index, searching a module call graph built
  on the fly for breadth at file level and then expanding it into a function
  call graph for depth reached about 43-44% function-level Top-1
  localization on SWE-bench Lite and Verified with open 32B and 72B models,
  beating prior LLM localizers, and the better locations raised an
  issue-solving pipeline's resolve rate by roughly 3 to 30 points depending
  on model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "SWE-bench Lite and Verified, 2025, Qwen2.5-Coder-32B and Qwen2.5-72B; Top-1 file and function accuracy; downstream via Agentless repair and validation."
sources:
  - source: arxiv-2503-22424
    stance: supports
    note: >-
      Validated by: Top-1 file and function localization accuracy on
      SWE-bench Lite and Verified against Agentless, LocAgent-style and
      other open localizers using the same open models; resolve rate of
      Agentless with and without its locations; ablations of each phase..
      Open models only, which makes the comparison fair but leaves the
      ceiling unknown; Top-1 is a strict metric and the reported
      resolve-rate range is wide because it spans models.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Repositories with
  dynamic dispatch or cross-language calls where a static call graph misses
  the relevant edges and free search does better.
