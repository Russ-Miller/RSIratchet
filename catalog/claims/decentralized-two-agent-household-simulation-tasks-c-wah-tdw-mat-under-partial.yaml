id: decentralized-two-agent-household-simulation-tasks-c-wah-tdw-mat-under-partial
ref: CLM-1051
capability: multi-model-coordination
technique: score-explicit-assumption-tree-instead-asking-partner
statement: >-
  For decentralized two-agent household simulation tasks (C-WAH, TDW-MAT)
  under partial observability, extracting the environment assumptions
  implicit in an LLM planner's reasoning trace into an explicit assumption
  decision tree and scoring each root-to-leaf path by likelihood, goal gain
  and execution cost raises task success and lowers step count relative to
  communication-centric multi-agent frameworks, while cutting communication
  actions by roughly an order of magnitude at comparable total token usage.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two cooperating agents, simulated multi-room household benchmarks, three backbones (GPT-4o mini, GPT-OSS:20B, Gemma3:4B); communication is costly and delayed one step."
sources:
  - source: arxiv-2602-04326
    stance: supports
    note: >-
      Validated by: Total steps on C-WAH and transported-object rate on
      TDW-MAT against CoELA, REVECA, CaPo and CoTS under identical
      environments and three backbones; plus module ablations (removing
      Planner, Composer or Evaluator each degrades steps) and a
      12-participant user study on perceived efficiency and trust.. Measured
      on 10 C-WAH episodes and 24 TDW-MAT episodes with four baselines and
      three backbones; gains are consistent in direction across all cells.
