    stance: supports
    note: >-
      Validated by: AUROC for detecting the model's own errors and corrupted
      inputs vs standard LLM entropy, semantic entropy,
      Laplace/Bayesian-LoRA and mean-pooled LoRA ensemble; accuracy at 80%
      coverage; ECE/NLL; commit rate and accuracy-when-committed on clean vs
      corrupted passages across three backbones and five datasets.. Measured
      on three backbones (Gemma-2-9B, Llama-3.1-8B, Qwen2.5-7B) and five
      datasets against six baseline families; the mean-pooled ensemble on
      the identical adapters isolates the credal reading from ensembling
