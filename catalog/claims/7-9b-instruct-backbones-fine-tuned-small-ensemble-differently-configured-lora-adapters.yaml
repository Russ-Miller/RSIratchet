id: 7-9b-instruct-backbones-fine-tuned-small-ensemble-differently-configured-lora-adapters
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: commit-only-adapter-disagreement-rules-out-every-rival
statement: >-
  For 7-9B instruct backbones fine-tuned with a small ensemble of
  differently-configured LoRA adapters, reading the adapters as a set of
  distributions and answering only when one candidate's minimum probability
  across adapters exceeds every rival's maximum gives a threshold-free
  abstention rule whose commitment rate collapses when the supplied evidence
  is corrupted (CoQA 31-48% down to 4-8%), while the mean-pooled version of
  the same adapters, thresholded to the same clean coverage, keeps answering
  more corrupted prompts.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Short-answer QA (CoQA, TriviaQA, OpenBookQA, ARC-Challenge) with 5 LoRA adapters on a frozen backbone; corruption is a replaced passage, used as a proxy for hallucination condition"
