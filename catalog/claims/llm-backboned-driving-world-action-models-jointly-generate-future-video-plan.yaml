id: llm-backboned-driving-world-action-models-jointly-generate-future-video-plan
ref: CLM-0856
capability: embodied-control
technique: generate-depth-first-then-condition-video-action
statement: >-
  For LLM-backboned driving world-action models that jointly generate future
  video and plan trajectories, adding an explicit depth-generation branch
  whose embeddings are causally attended by the video and action queries
  improves both future-video quality and closed-loop planning scores over
  video-plus-action training alone.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Navsim v1/v2 navtest, single-stage training on navtrain only, Qwen3-VL-2B backbone with Wan-2.1-1.3B video generator; depth labels come from an off-the-shelf depth foundation model"
sources:
  - source: arxiv-2604-01765
    stance: supports
    note: >-
      Validated by: Ablation on Navsim navtest: action-only 88.0 PDMS,
      depth+action 88.5, video+action 88.9, depth+video+action 89.2; video
      quality improved from FVD 65.82 to 53.59 and LPIPS 0.22 to 0.20 when
      depth was trained jointly; depth AbsRel 8.1 vs 9.3 for a fine-tuned
      depth-only baseline.. Measured on one benchmark family (Navsim
      navtest) with one backbone; the ablation isolates depth vs video
      targets but not added parameter capacity, and the query-count ablation
      shows capacity alone also moves scores, so the depth-specific
      contribution is confounded with extra capacity. [truncated]
