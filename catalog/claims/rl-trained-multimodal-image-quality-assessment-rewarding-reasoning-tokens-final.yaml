    note: >-
      Validated by: Mean judge-rated quality gain of reasoning-guided edits
      on a 5,866-image test subset (+0.789 vs -0.137 for the untrained
      backbone and +0.213 for Q-Insight), held under a swapped editor
      (Mage-Flow) and two swapped judges including GPT-5.6 Sol at 81.4%
      preference in 3AFC; rating alignment held at 0.838/0.812 average
      PLCC/SRCC against baselines.. Measured on one backbone, one training
      split, six IQA test sets, with editor and judge swaps as a
      generalization check. [truncated]
