id: rl-trained-multimodal-image-quality-assessment-rewarding-reasoning-tokens-final
ref: CLM-0477
capability: explanation-faithfulness
technique: supervise-reasoning-editing-image-blames-then-judging
statement: >-
  In RL-trained multimodal image quality assessment, rewarding the reasoning
  tokens by the final rating accuracy raises rating alignment while leaving
  the stated reasoning unfaithful: rating-only training reached average
  PLCC/SRCC of 0.836/0.815 yet its reasoning-guided edits lowered judged
  image quality (mean gain -0.260, below the untrained baseline's -0.136),
  whereas supervising reasoning with a separate verifiable edit-and-judge
  signal produced positive gains at comparable rating scores.
