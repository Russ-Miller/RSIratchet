id: self-evolving-agents-accumulate-reusable-skills-bank-admitting-candidate-skill
ref: CLM-0482
capability: harness-self-improvement
technique: gate-skills-coalition-knockouts-mask-target-retrieval
statement: >-
  For self-evolving agents that accumulate reusable skills in a bank,
  admitting a candidate skill whenever aggregate bank reward rises retains
  skills that contribute nothing or harm once knocked out, because a skill's
  contribution depends on which other skills are in the bank and on the
  deployment domain, not on the skill itself; scoring sampled coalition
  knockouts at the gate, and masking transferred skills whose removal
  improves retrieval quality on unlabeled target queries, both recover
  performance the outcome-only gate loses.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Skill-bank self-evolving agents built on MemSkill with a Llama-3.3-70B skill-extraction policy, evaluated on LoCoMo, LongMemEval, HotpotQA-50 and ALFWorld over three seeds with LLM"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against MemSkill and six
      memory-agent baselines: F1 and LLM-judge on LoCoMo/LongMemEval and
      success rate on ALFWorld seen/unseen (e.g. 55.52 vs 54.13 average L-J,
      79.66 vs 77.05 ALFWorld SR); a K-controlled ablation showed the
      outcome gate's six accepted skills were net -1.38 pp; masking improved
      all six trained banks on HotpotQA-50 (+7.17 pp average on MemSkill
      banks, +3.59 on CASS banks), and retrieval-quality scores correlated
      with label-based skill ranking at rho +0.76 versus -0.18 for a
      policy-entropy signal.. [truncated]
