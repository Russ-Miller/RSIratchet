id: self-evolving-agents-accumulate-reusable-skills-bank-admitting-candidate-skill
ref: CLM-0482
capability: harness-self-improvement
technique: accept-skills-sampled-coalition-knockouts-mask-target-retrieval
statement: >-
  For self-evolving agents that accumulate reusable skills in a bank,
  admitting a candidate skill because aggregate task reward rose cannot
  establish that the skill contributes: knockout audits on the resulting
  bank find newly admitted skills with near-zero or negative marginal
  contribution, a skill's marginal changes when another skill is removed,
  and skills that help in the source domain reverse sign after transfer to a
  new domain.
