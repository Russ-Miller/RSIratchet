id: live-binary-prediction-markets-timestamp-locked-order-book-news-snapshots-current
ref: CLM-0851
capability: forecasting
technique: score-forecasts-confidence-weighted-order-book-executed-return
statement: >-
  On live binary prediction markets with timestamp-locked order-book and
  news snapshots, current LLMs state near-uniformly high confidence (average
  ~0.81-0.87, and 0.8-0.9 in every event category) regardless of domain
  volatility, so stated confidence separates profitable from loss-making
  trades only weakly: five of seven models tested lost money while declaring
  confidence as high as the two that gained.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven open- and closed-source models, 36,165 predictions over 5,097 resolved Polymarket markets collected 6-12 Feb 2026, with a prompt-enforced 0.6 confidence floor for acting and "
sources:
  - source: arxiv-2604-14199
    stance: supports
    note: >-
      Validated by: Compared against unweighted return and directional
      accuracy over 36,165 predictions; confidence-weighted return exceeded
      the unweighted return for all seven models, and degraded as base lot
      size rose from $10 to $1,000 due to order-book depth.. Measured on one
      7-day collection window with a single week of resolutions, no repeated
      runs, no significance tests, and self-selected trades (skips
      excluded), so model ranking is a single-sample reading; the
      flat-confidence pattern is shown by a radar chart over eight
      categories for three models plus per-model averages.
