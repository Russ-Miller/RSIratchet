id: video-mllms-dynamic-scene-questions-final-answer-accuracy-overstates-temporal-understanding
ref: CLM-0866
capability: video-temporal-reasoning
technique: score-object-centric-sub-questions-just-final-answer
statement: >-
  For video MLLMs on dynamic-scene questions, final-answer accuracy
  overstates temporal understanding, because many queries can be answered
  from a single frame's visual cues or statistical priors; decomposing each
  query into object-centric sub-questions and scoring the intermediate steps
  separates genuine persistent tracking from coincidental correctness.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Multimodal LLMs answering object-centric questions over dynamic video where object identity, state and relations change over time."
sources:
  - source: arxiv-2605-08974
    stance: supports
    note: >-
      Validated by: Compared state-of-the-art MLLMs on the new STEMO-Bench
      and reported that the object-trajectory framework reduces hallucinated
      answers and improves spatio-temporal consistency; no numbers given in
      the available text.. Argued plus measured, but the supplied abstract
      gives no accuracies, no baseline numbers, no model list and no
      ablation detail, so the size of the benchmark-vs-final-answer gap and
      the framework's gain are unverifiable here.
contested: false
