id: audio-temporal-localization-tasks-11-southeast-asian-languages-current-audio
ref: CLM-0347
capability: audio-understanding
statement: >-
  On audio temporal-localization tasks in 11 Southeast Asian languages,
  current audio LLMs return time spans whose coverage of the true span
  consistently exceeds their purity, and F1 falls steadily as the recording
  grows from under 30 seconds to 3 minutes, with several models unable to
  run at all on the longer bins.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Audio/multimodal LLMs from 2B to 30B plus Gemini 2.5 Flash and GPT-4o, on content-to-time queries over recordings up to 3 minutes in SEA languages; English prompts."
sources:
  - source: arxiv-2609-09672
    stance: supports
    note: >-
      Measured on 13,145 samples per temporal task across five languages,
      with span-overlap F1 stratified into four duration bins;
      coverage-vs-purity decomposition shown in detail only for
      MERaLiON-2-10B and asserted as a pattern for most models. Single
      benchmark, no independent replication, and possible test contamination
      is acknowledged by the authors.
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An evaluation of the
  same or later models on comparable timestamped audio showing purity at or
  above coverage, or TLoc F1 flat across the 0-30s to 120-180s duration
  bins.
