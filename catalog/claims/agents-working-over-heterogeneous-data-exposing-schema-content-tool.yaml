notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A static semantic layer
  that matches the MCP-queried one when both are refined by the same loop,
  which would locate the gain in the evolution rather than the query
  interface; or the gate failing to prevent regressions once the edit store
  grows large.
