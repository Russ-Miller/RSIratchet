id: agents-working-over-heterogeneous-data-exposing-schema-content-tool
ref: CLM-0332
capability: harness-self-improvement
technique: gated-attributed-typed-edits-agent-queried-ontology
statement: >-
  For agents working over heterogeneous data, exposing a schema/content/tool
  ontology as an MCP server the agent queries, and refining it by a loop of
  diagnose, attribute-to-level, typed patch, and a gate that accepts an edit
  only if a backbone-conditional paired evaluation shows a margin, raised
  trajectory accuracy on DDR-Bench by an average 17.8 points across six
  backbones and text-to-SQL EX on BIRD by about 7 points; injecting the same
  semantic content as a static prompt did not help consistently and cost 15
  points on one backbone, and in ablation removing the acceptance gate was
  the largest loss (-11.2), then attribution (-6.3), diagnosis (-4.8), typed
  patches (-1.7).
kind: observation
backing_strength: single-paper
observed_on:
  era: "DDR-Bench, BIRD and one further data-agent benchmark, six backbones including GPT-5.5, Claude Sonnet 4.5/5, DeepSeek-V3/V4-Flash and Qwen3, 2026; ontology built by a builder agent,"
sources:
  - source: arxiv-2609-15779
    stance: supports
    note: >-
      Validated by: Trajectory and message accuracy on DDR-Bench across six
      backbones against a no-ontology ReAct baseline and a static-prompt
      semantic layer; EX/VES on BIRD; step-wise and level-wise ablations
      averaged over four backbones. Developer-reported.. Two findings worth
      separating: the query-vs-inject result (a static prompt of the same
      content hurt) and the gate result (accepting every edit was the
      largest ablation loss). The second is the regression-gated-loop claim
      already in the catalog, replicated in a different harness; [truncated]
