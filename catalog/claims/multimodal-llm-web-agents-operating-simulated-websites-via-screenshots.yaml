id: multimodal-llm-web-agents-operating-simulated-websites-via-screenshots
ref: CLM-1226
capability: tool-use
technique: stress-test-web-agents-stage-aligned-perturbations
statement: >-
  For multimodal LLM web agents operating simulated websites via screenshots
  and DOM, robustness degrades in a consistent order across eight frontier
  models: perception noise and layout distortion cost the least, execution
  failures and pop-up interruptions more, and remapping an action's
  semantics (single-click now requiring double-click) the most, with
  implicit remapping worse than remapping announced in on-page text.
kind: observation
backing_strength: single-paper
observed_on:
  era: "149 tasks over 10 agent-generated websites, one clean plus six perturbed settings at a single moderate stress level (execution failure probability 0.35), 100-step budget, checkpoin"
sources:
  - source: arxiv-2604-16385
    stance: supports
    note: >-
      Validated by: Checkpoint pass rate and step count for eight models
      across seven environment settings, against a human oracle that scored
      100% in every setting with only ~1 extra step, which separates agent
      fragility from task difficulty.. Measured: average checkpoint pass
      rate fell from 54.3% clean to 49.8% (DOM noise), 45.8% (visual chaos),
      46.1% (action failure), 43.0% (pop-up), 31.3% (explicit remap), 26.2%
      (implicit remap), with the ordering holding for all eight models.
      Human oracle at 100% everywhere isolates agent robustness from task
      difficulty. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A set of current web
  agents whose checkpoint pass rate falls as much or more under visual/DOM
  perturbation as under action-semantics remapping, or for whom implicit
  remapping is no worse than explicit remapping.
