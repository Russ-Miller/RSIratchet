id: model-trained-rl-model-trained-reflection-rich-sft-compared-out-of-distribution
ref: CLM-1077
capability: self-repair
technique: calibrate-separate-sampling-decision-rates-self-correction-traces
statement: >-
  When a model trained with RL and a model trained with reflection-rich SFT
  are compared on out-of-distribution arithmetic, the RL model's advantage
  comes from its decision policy — the probability of rejecting an incorrect
  candidate answer stays at 40-60% far out of distribution for RL while
  collapsing toward zero for SFT — rather than from a higher first-attempt
  accuracy, which degrades in both.
