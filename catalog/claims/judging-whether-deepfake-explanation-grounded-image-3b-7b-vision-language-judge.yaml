id: judging-whether-deepfake-explanation-grounded-image-3b-7b-vision-language-judge
ref: CLM-1120
capability: critique
technique: bootstrap-graded-rationale-judge-human-artifact-annotations
statement: >-
  For judging whether a deepfake explanation is grounded in the image, a
  3B-7B vision-language judge fine-tuned on bootstrapped graded reasoning
  data agrees with human ratings more closely than prompted models up to 30x
  larger (pairwise accuracy 96.2% vs 93.2%, pointwise RMSE 0.61 vs 1.01),
  while n-gram and embedding text metrics (BLEU, ROUGE, METEOR, BERTScore)
  against reference rationales do not separate the generators at all.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Image deepfake detection rationales; judge trained on in-distribution human-annotated data from the same pipeline that produced the graded test data; baselines are prompted zero-sh"
sources:
  - source: arxiv-2602-19715
    stance: supports
    note: >-
      Validated by: RMSE/MSE and Spearman/Pearson correlation against human
      pointwise ratings, and pairwise agreement with human preferences, on a
      100-sample two-annotator subset (Cohen's kappa ~0.80) plus a
      1,000/2,000-sample held-out split, against 15 prompted VLM baselines;
      plus a 10-participant user study preferring the pipeline rationales
      70% of the time.. Measured on the authors' own benchmark where train
      and meta-evaluation data come from the same bootstrapping pipeline, so
      part of the judge's advantage may be format familiarity rather than
      better reasoning assessment; [truncated]
