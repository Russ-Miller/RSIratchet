id: multi-modal-robot-motion-planning-described-natural-language-giving-llm
ref: CLM-0250
capability: planning
technique: train-llm-emit-solver-checked-mip-programs-rewarded
statement: >-
  For multi-modal robot motion planning described in natural language,
  giving an LLM fixed expert single-modal optimization modules and asking it
  only to predict the cross-modal interface variables (meeting points,
  contact locations, shared states) solves single-modality tasks perfectly
  but fails on compositions, so the hard part is synthesizing the coupling
  constraints, not having correct per-modality formulations.
