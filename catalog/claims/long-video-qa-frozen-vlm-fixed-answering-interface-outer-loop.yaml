    stance: supports
    note: >-
      Validated by: LVBench held-out accuracy (882 questions never used for
      promotion): AKS parent 46.6, searched CardinalityLedger 54.8, with
      paired bootstrap CI and exact McNemar; a capacity-matched AKS-90
      control at similar cumulative visual tokens reached only 49.2; frozen
      transfer gave 67.5 vs 66.9 on Video-MME and 75.0 vs 72.0 on MLVU..
