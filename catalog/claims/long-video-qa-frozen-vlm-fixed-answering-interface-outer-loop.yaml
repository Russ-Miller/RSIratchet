id: long-video-qa-frozen-vlm-fixed-answering-interface-outer-loop
ref: CLM-0639
capability: harness-self-improvement
technique: recursively-search-video-context-construction-program
statement: >-
  For long-video QA with a frozen VLM and fixed answering interface, an
  outer loop that proposes, executes and retains only
  development-accuracy-improving rewrites of the executable
  context-construction program can advance past a strong hand-crafted
  keyframe-selection harness, and the gain survives a matched cumulative
  visual-token control and direct reuse on other long-video benchmarks.
kind: observation
backing_strength: single-paper
