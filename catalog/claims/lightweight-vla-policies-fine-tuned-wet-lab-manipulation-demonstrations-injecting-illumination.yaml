id: lightweight-vla-policies-fine-tuned-wet-lab-manipulation-demonstrations-injecting-illumination
ref: CLM-0850
capability: embodied-control
technique: perturb-observations-online-during-vla-fine-tuning-difficulty
statement: >-
  For lightweight VLA policies fine-tuned on wet-lab manipulation
  demonstrations, injecting illumination and overexposure perturbations into
  observations online during fine-tuning (easy-to-hard curriculum) raises
  task success most on precise placement of transparent labware rather than
  on lid opening/closing, where success is already high or limited by other
  factors.
kind: observation
backing_strength: single-paper
