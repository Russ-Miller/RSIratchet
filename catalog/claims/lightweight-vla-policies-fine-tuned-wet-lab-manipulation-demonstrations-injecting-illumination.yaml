    stance: supports
    note: >-
      Validated by: Success rate over 3 repeated runs per atomic task and
      completion rate over 20 trials per composite task, against ACT, X-VLA
      and unaugmented SmolVLA: placing a cryotube in the red rack rose
      40.00% to 65.00% and a centrifuge tube in the orange rack 43.33% to
      53.33%, while lid tasks moved little (e.g. open water bath lid 78.33%
      unchanged); composite completion rose on all six workflows (desktop
      tidying 62.5% to 72.5%).. Measured on one robot platform with three
      repeats per atomic task and 20 trials per composite task; [truncated]
