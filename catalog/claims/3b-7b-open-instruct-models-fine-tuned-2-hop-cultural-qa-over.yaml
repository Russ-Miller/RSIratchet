capability: multi-step-reasoning
technique: train-verifier-corrected-graph-traversal-traces-cot
statement: >-
  For 3B-7B open instruct models fine-tuned on 2-hop cultural QA over a
  knowledge graph, supervision made of explicit retrieval actions and
  returned observations raises final-answer accuracy far more than
  chain-of-thought rationales, which mostly fix the intermediate bridge step
  and leave the second hop unresolved.
