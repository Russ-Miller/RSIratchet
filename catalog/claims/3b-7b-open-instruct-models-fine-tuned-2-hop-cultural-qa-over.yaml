    note: >-
      Validated by: Exact-match State/Answer/Full Match on a 643-item test
      split: Qwen2.5-7B Full Match 36.70% with CoT-SFT vs 57.54% with
      trace-SFT; 3B 34.26% vs 50.70%; ablations on 1k train/100 test show
      removing the verifier drops Full Match 52->36 and stripping
      ACTION/OBSERVATION spans drops it 52->9; OOD multiple-choice on a
      SANSKRITI subset is unchanged or slightly better.. [truncated]
