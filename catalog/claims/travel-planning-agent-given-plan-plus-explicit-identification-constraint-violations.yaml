id: travel-planning-agent-given-plan-plus-explicit-identification-constraint-violations
ref: CLM-0828
capability: self-repair
statement: >-
  When a travel-planning agent is given a plan plus explicit identification
  of its constraint violations and asked to repair it, frontier LLMs both
  over-flag errors that do not exist (precision well below recall during
  identification) and reproduce the same flagged violations in the corrected
  plan, with error persistence rising as the number of planted errors grows
  and worst in non-reasoning modes.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Decoupled evaluation with oracle intermediate contexts on TravelPlanner, TripCraft and ChinaTravel; plans with 1-3 solver-planted constraint violations; GPT-5.2, DeepSeek V3.2, Qwe"
sources:
  - source: arxiv-2605-03308
    stance: supports
    note: >-
      Measured on three benchmarks with solver-constructed violating plans;
      identification reports precision 0.44-0.95 against recall 0.72-0.97,
      correction success 0.03-0.32 across models, and a persistence figure
      increasing with error count. Small samples, no matched baseline for
      correction without feedback, and GPT-5.2 is a counter-case on
      persistence (lowest persistence but poor corrected plans).
contested: false
status: pending-review
last_checked_at: 2026-11-02
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A frontier model given
  the same planted-error plans that corrects most of them (correction
  success near plan-validity ceiling) with near-zero recurrence of the
  flagged violation, and identification precision comparable to recall.
  Drafted stance toward self-critique-without-grounding-unreliable: supports
  -- Even with an explicit external diagnosis of the violation supplied,
  correction success stays near the model's unaided plan-generation rate and
  the same errors recur.
