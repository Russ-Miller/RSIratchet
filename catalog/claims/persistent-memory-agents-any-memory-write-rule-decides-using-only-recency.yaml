  Drafted confidence: medium. Falsifier as drafted: A memory policy reading
  only recency and provenance that matches or beats a history-conditioned
  authenticity gate on both genuine-update adherence and poisoning
  resistance, including on same-origin (user-pasted) contamination. Proposed
  technique, not catalogued: Latent-authenticity gate for memory writes.
