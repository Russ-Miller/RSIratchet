id: persistent-memory-agents-any-memory-write-rule-decides-using-only-recency
ref: CLM-0117
capability: long-term-memory
statement: >-
  For persistent-memory agents, any memory-write rule that decides using
  only recency and provenance is stuck on a single tradeoff — accepting more
  genuine preference updates means admitting more poisoned ones — because an
  adversary who can launder a claim through the user's own channel matches
  the statistics a genuine revision produces; conditioning the write
  decision on the inferred authenticity of the claim given the interaction
  history moves both axes at once.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Personalized agents with persistent cross-session memory where retrieved documents, shared files, or tool outputs can be written into the user model; holds against a fixed attacker"
sources:
  - source: arxiv-2609-02265
    stance: supports
    note: >-
      Argued as a decision-theoretic lower bound plus measured on 480
      held-out synthetic episodes from 96 users: provenance-only 20.0%
      poisoning / 74.1% adherence, recency RAG 51.6% / 85.7%, proposed
      gate 11.5% / 83.5%; provenance-only collapses to 43.6% on same-
      origin contamination vs 17.5%. A supervision-matched Transformer
      baseline reaches 69.3% win / 15.9% poisoning, so most of the gain is
      supervised temporal tracking rather than the specific architecture.
      Benchmark is generated by the authors; [truncated]
