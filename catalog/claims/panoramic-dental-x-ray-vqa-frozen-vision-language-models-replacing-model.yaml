  Drafted confidence: medium. Falsifier as drafted: A matched comparison
  where adding deterministically ID-bound detector evidence fails to beat
  the detector-free pipeline, or where weakening the identity/grounding
  detector by a few mAP points costs less downstream accuracy than a far
  larger degradation of a task-specific detector. Proposed technique, not
  catalogued: Deterministic grounding of expert-detector findings to entity
  IDs before VLM synthesis.
