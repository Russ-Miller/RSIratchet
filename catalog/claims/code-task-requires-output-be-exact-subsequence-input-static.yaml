id: code-task-requires-output-be-exact-subsequence-input-static
ref: CLM-1078
capability: hallucination
technique: mask-decoding-input-tokens-then-reject-ast-similarity
statement: >-
  When a code task requires the output to be an exact subsequence of the
  input (static program slicing), masking the decoder's logits to only
  tokens present in the input removes fabricated identifiers and contributes
  more than a syntactic-structure filter, because invented tokens are the
  more frequent failure than mis-ordered valid tokens.
