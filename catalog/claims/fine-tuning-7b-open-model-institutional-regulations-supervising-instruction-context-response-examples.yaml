    stance: supports
    note: >-
      Validated by: Reported 96.7% accuracy on a 30-question hybrid set with
      adversarial traps and 100% rejection of non-compliant requests, versus
      'persistent hallucinations' from the context-free 2,000-line and
      general 15,000-line sets; the baselines' numeric accuracy is not
      reported, and the evaluation sets are small and single-institution..
