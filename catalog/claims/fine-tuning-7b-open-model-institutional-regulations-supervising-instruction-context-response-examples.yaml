id: fine-tuning-7b-open-model-institutional-regulations-supervising-instruction-context-response-examples
ref: CLM-1066
capability: hallucination
technique: put-source-evidence-training-example-s-input-field
statement: >-
  When fine-tuning a 7B open model on institutional regulations, supervising
  it on instruction-context-response examples that carry the original
  regulation text in the input field yields fewer hallucinated factual
  answers than training on several times more question-answer pairs with no
  supplied evidence, because the model learns to read the evidence rather
  than memorize facts.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen-2.5-7B with QLoRA on a single university's undergraduate regulations; 500 context-bearing examples vs 2,000 context-free and 15,000 general examples; evaluated on 66 hand-writ"
