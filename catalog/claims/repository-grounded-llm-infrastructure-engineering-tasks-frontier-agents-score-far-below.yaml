id: repository-grounded-llm-infrastructure-engineering-tasks-frontier-agents-score-far-below
ref: CLM-0430
capability: long-horizon-execution
statement: >-
  On repository-grounded LLM-infrastructure engineering tasks, frontier
  agents score far below ceiling (best 36.53% overall), and every one of
  eight models scores lower on long-horizon multi-file implementation than
  on single-file kernel completion, even though the full repository and test
  cases are visible.
kind: observation
backing_strength: single-paper
observed_on:
  era: "85 tasks built from systems papers and public LLM-infra repositories, three formats (single-file kernel completion, multi-file feature implementation, end-to-end optimization), one"
sources:
  - source: arxiv-2609-10226
    stance: supports
    note: >-
      Measured across 8 frontier models on 85 tasks (55 KFC, 20 LHI, 10
      E2EO) with correctness-gated rewards and anti-cheating proctoring. LHI
      < KFC holds for all 8 models in the reported table. E2EO scores are
      higher than LHI, so the difficulty ordering is not monotone in
      openness; scores are not comparable across formats because metrics
      differ (binary implementation vs log-normalized speedup). Single
      benchmark, no human baseline.
