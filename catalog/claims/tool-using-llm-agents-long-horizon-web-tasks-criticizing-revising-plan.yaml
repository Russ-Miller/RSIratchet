id: tool-using-llm-agents-long-horizon-web-tasks-criticizing-revising-plan
ref: CLM-1188
capability: planning
technique: critique-plan-before-executing-against-distilled-error-types
statement: >-
  For tool-using LLM agents on long-horizon web tasks, criticizing and
  revising the plan before execution against a small set of distilled
  planning-error types, rather than only reflecting after a failure, raises
  task success over retrospective reflection baselines under matched tools
  and step budgets, with the largest gain on the hardest tasks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "GAIA validation and a 100-item SimpleQA sample, GPT-4.1 and Gemini-2.5-pro backbones, Smolagents and OWL harnesses, 20-step budget; error types distilled offline from HotpotQA/MuSi"
sources:
  - source: arxiv-2602-07187
    stance: supports
    note: >-
      Validated by: pass@1 on GAIA validation (46.06 to 58.18 with GPT-4.1
      on Smolagents; 50.30 to 60.61 on OWL) and SimpleQA
      correct/correct-given-attempted, against Reflexion and Self-Refine
      under identical tools and step budgets; ablations remove the distilled
      error set (-7.9 total) and dynamic re-planning (-6.7).. Measured on
      165 GAIA validation tasks and 100 SimpleQA items, two backbones, two
      harnesses, with matched tools and step budgets and component
      ablations. Single paper, single team; [truncated]
