    stance: supports
    note: >-
      Validated by: VL-RewardBench overall accuracy 80.1 for 8B vs 72.0
      no-rubric RL baseline, 75.3 static generic rubric, 61.3 base;
      Reasoning subcategory 72.6 vs 59.6 static. Multimodal RewardBench
      overall 73.2 vs 68.7 no-rubric. Ablations: frozen planner 78.8,
      absolute (unbaselined) planner reward 77.6, text-only planner 79.1..
      Measured on two multimodal preference benchmarks plus text-only
      RewardBench, two model sizes, with controlled no-rubric and
      static-rubric RL baselines and five ablations (frozen planner, reward
      form, visual context, DAPO). [truncated]
