id: 4b-8b-multimodal-judge-models-having-model-first-generate-instance-specific
ref: CLM-0795
capability: critique
technique: generate-disagreement-checklist-then-verify-against-image
statement: >-
  For 4B-8B multimodal judge models, having the model first generate an
  instance-specific disagreement checklist from the two candidate responses
  and then execute it against the image raises preference accuracy more than
  a generic dataset-level rubric, with the margin concentrated in
  reasoning-heavy items.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen3-VL 4B and 8B Instruct trained with multi-role GRPO on 30K RLAIF-V preference pairs; evaluated on VL-RewardBench and Multimodal RewardBench."
