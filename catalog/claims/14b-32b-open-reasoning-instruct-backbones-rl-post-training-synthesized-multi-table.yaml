id: 14b-32b-open-reasoning-instruct-backbones-rl-post-training-synthesized-multi-table
ref: CLM-0909
capability: long-context-degradation
technique: rl-synthesized-multi-table-sql-tasks-long-context
statement: >-
  For 14B-32B open reasoning and instruct backbones, RL post-training on
  synthesized multi-table SQL tasks (verifiable execution answers, filtered
  to 0<pass rate<1) raises accuracy on held-out long-context benchmarks by
  roughly 5-9 points on average and lifts needle-in-a-haystack retrieval
  sharply, with gains that transfer to math, code and science benchmarks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four 14B-32B backbones (Qwen2.5-32B-Instruct, Qwen3-32B, DeepSeek-R1-Distill-Qwen 14B/32B); training inputs up to 16k tokens; evaluation on seven long-context benchmarks plus four "
sources:
  - source: arxiv-2603-21719
    stance: supports
    note: >-
      Validated by: Average accuracy across seven long-context benchmarks
      (LongBench-v2, Loong, BrowseCompLong, GSM-Infinite, Oolong, RULER,
      MRCR) against the untrained backbone: +8.24 for DS-R1-Distill-32B,
      +8.93 for 14B, +4.94 and +4.79 for the Qwen backbones; NIAH retrieval
      87.95 to 99.40 (32B) and 69.30 to 91.20 (14B); OOD gains on GPQA, AIME
      2025, MultiChallenge, LiveCodeBench.. Measured across four backbones
      and eleven benchmarks against untrained baselines, with ablations on
      cell count, table count, semantics and delimiters. [truncated]
