notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A run where
  recall-filtered targets raise supported-claim percentage while holding
  refusal count and number of supported claims per response equal to
  standard SFT would show the gain is not coverage-driven; conversely,
  showing no factuality gain at all when the share of known claims in
  targets is varied would falsify the mechanism. Proposed technique, not
  catalogued: Recall-consistency filtering of fine-tuning targets.
