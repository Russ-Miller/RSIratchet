id: medical-question-answering-splitting-pipeline-into-fine-tuned-clinical-reasoning-agent
ref: CLM-1107
capability: multi-model-coordination
technique: split-medical-qa-into-reason-retrieve-from-pubmed
statement: >-
  For medical question answering, splitting the pipeline into a fine-tuned
  clinical-reasoning agent, a PubMed evidence-retrieval agent and a separate
  refinement model lowers answer uncertainty relative to the reasoning
  model's ungrounded responses, but the reported accuracy gain over single
  fine-tuned models is not isolated from the retrieval step or from the
  extra fine-tuning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "MedQuAD-derived patient-oriented NIH QA data; GPT/LLaMA/DeepSeek R1 fine-tuned on ~20k pairs; single reported configuration, no component ablation, ~36.5 s end-to-end latency"
sources:
  - source: arxiv-2602-14158
    stance: supports
    note: >-
      Validated by: Reported 87% accuracy and ~0.80 relevance for the full
      system, and perplexity 4.13 for evidence-augmented versus higher for
      base responses; no ablation separating retrieval, refinement and
      fine-tuning contributions, and no matched single-model baseline on the
      same end-to-end metric.. Single-paper, single configuration. Accuracy
      (87%) and relevance (0.80) are reported only for the full system; the
      only comparative number isolating a component is uncertainty with
      versus without evidence (perplexity 4.13). [truncated]
