    stance: supports
    note: >-
      Validated by: Accuracy on AppWorld (168 tasks), BFCL V3 multi-turn
      base (200), ToolSandbox base (129) against zero-shot and three memory
      baselines (ReasoningBank, MemP, SASM), two runs averaged; gains
      +27.2/+11.2/+3.4 points averaged over four students, with ablation
      showing subtask memory adds e.g. +25.0 points over workflow alone for
      Qwen3-4B on AppWorld, and student-generated memory near zero-shot..
      Measured on three benchmarks, four students, one main teacher, two
