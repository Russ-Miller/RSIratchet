id: small-4-8b-student-agents-multi-turn-tool-use-tasks-transferring-stronger
ref: CLM-0719
capability: tool-use
technique: distill-teacher-trajectories-into-workflow-subtask-function-memory
statement: >-
  For small (4-8B) student agents on multi-turn tool-use tasks, transferring
  a stronger teacher's successful trajectories as flat task-level memory
  barely helps and can hurt, while splitting the same trajectories into a
  high-level workflow insight in prose plus concrete executable subtask
  examples raises accuracy sharply, with the subtask examples carrying most
  of the gain.
kind: mechanism
backing_strength: single-paper
