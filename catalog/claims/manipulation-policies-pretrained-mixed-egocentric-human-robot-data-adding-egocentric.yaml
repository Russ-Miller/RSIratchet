id: manipulation-policies-pretrained-mixed-egocentric-human-robot-data-adding-egocentric
ref: CLM-0435
capability: embodied-control
technique: stage-ego-to-robot-transfer-through-aligned-demo
statement: >-
  For manipulation policies pretrained on mixed egocentric-human and robot
  data, adding egocentric data helps only when the embodiment gap is bridged
  explicitly: a three-stage curriculum (ego priors, then task-matched
  human/robot alignment in a shared end-effector frame, then robot-only)
  raised real-robot success, while separate ego/robot action heads gave only
  a marginal in-distribution gain and shared future-video prediction in a
  world-action model made success worse than a robot-only baseline.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Pretraining on ~2,659 hours of ego+robot data; pi0.5-style VLA and Fast-WAM architectures; identical post-training and evaluation on seven dual-arm tasks, 10 trials per task per co"
sources:
  - source: arxiv-2609-21461
    stance: supports
    note: >-
      Validated by: Real-robot multi-task evaluation: combined success
      53.57% vs 32.86% for the robot-only VLA baseline (ID 64.29% vs 42.86%,
      OOD 42.86% vs 22.86%), 140 trials per checkpoint, matched steps and
      hyperparameters.. Measured on one dual-arm platform, seven tasks, 10
      ID + 10 OOD trials each, so per-task counts are noisy and several
      tasks score 0/10 for all methods; one seed, one corpus, and the
      ordering of representation-similarity metrics did not match the
      success ordering.
