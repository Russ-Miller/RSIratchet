id: judges-scalar-reward-models-generative-reward-models-or-llm-as-judge
ref: CLM-0840
capability: critique
statement: >-
  When judges (scalar reward models, generative reward models, or
  LLM-as-judge) must pick the preferred of two agent trajectories in
  tool-integrated multi-turn settings, accuracy stays near 70% at best and
  falls sharply as trajectory length grows, with pairwise LLM judges
  dropping below chance beyond ~32k tokens while pointwise scalar reward
  models decay more gradually.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-only tool-augmented agent trajectories with hard negatives controlled for length and format; four task families (safety refusal, tool irrelevance, complex planning, error reco"
sources:
  - source: arxiv-2604-08178
    stance: supports
    note: >-
      Measured: pairwise accuracy of 21 evaluators across 7 splits, gold
      labels from a 3-judge panel with meta-review plus a stratified human
      audit (Cohen's kappa 0.71-0.86). Best average 69.96%; safety accuracy
      spans 40.69-84.80% among LLM judges while open scalar RMs sit near
      chance. Length effect read off binned macro-accuracy curves, not an
      ablation that isolates length from task difficulty, since longer
      trajectories are also the harder planning/recovery buckets.
contested: false
status: pending-review
last_checked_at: 2026-11-05
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A judge family that
  holds above ~85% pairwise accuracy on these trajectory pairs, including on
  the >32k-token bucket, would falsify the ceiling and the length-collapse
  pattern.
