id: scenario-pits-stated-personal-preference-against-local-cultural-norm
ref: CLM-0323
capability: cultural-competence
statement: >-
  When a scenario pits a stated personal preference against a local cultural
  norm, models' choice of norm over preference shifts more with the
  scenario's country (about 8 points) than with the user's age (1) or gender
  (under 1), instruction tuning shifts it non-uniformly, and while models
  can match the majority human choice per country they do not reproduce the
  spread of human answers, with best correlation to human response
  distributions only about 0.24.
kind: observation
backing_strength: single-paper
observed_on:
  era: "PACT scenarios, five-country human study, 2026; open and closed chat models; agreement measured against majority and against full response distributions."
sources:
  - source: arxiv-2606-07877
    stance: supports
    note: >-
      Human study across five countries is the strength; the model side
      covers a modest set and correlation to distributions is the one
      number, which is low for every model tested.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose predicted
  response distribution correlates with human within-country pluralism well
  above 0.24, or a human study where scenario country is not the dominant
  driver.
