id: 7b-multimodal-reasoning-models-response-level-dpo-over-concatenated-chain-of-thought
ref: CLM-0565
capability: hallucination
technique: contrast-same-answer-under-good-corrupted-reasoning
statement: >-
  In 7B multimodal reasoning models, response-level DPO over concatenated
  chain-of-thought plus answer behaves close to answer-only optimization —
  the preference gap grows faster on the answer span and residual
  hallucination stays concentrated in the reasoning chain — so adding a term
  that holds the preferred answer fixed and contrasts its likelihood under a
  grounded versus a corrupted CoT lowers object-hallucination rates further.
