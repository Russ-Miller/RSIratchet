id: rl-training-distilled-1-5b-7b-reasoning-models-shorter-chains-thought
ref: CLM-0886
capability: cutting-to-the-chase
technique: set-length-target-mean-model-s-own-correct
statement: >-
  When RL-training distilled 1.5B-7B reasoning models for shorter chains of
  thought, setting the per-problem length target to the mean length of the
  model's own correct rollouts preserves accuracy better than using the
  minimum correct length, the median, or the mean over all rollouts, because
  a single anomalously short correct rollout sets an unreachably tight
  target that then fights correctness.
kind: mechanism
backing_strength: single-paper
