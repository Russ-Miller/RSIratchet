    note: >-
      Validated by: Aggregator ablation on DeepSeek-R1-Distill-Qwen-1.5B:
      mean-of-correct reached 53.36 average accuracy and 0.68
      Accuracy-Efficiency Score, versus min-of-correct 49.99/0.36,
      median-of-correct 50.13/0.34, and mean-of-all-rollouts 51.47/0.58;
      training curves show min's own correct rollouts plateau below the
      efficiency reward the others reach.. Measured: one ablation table plus
