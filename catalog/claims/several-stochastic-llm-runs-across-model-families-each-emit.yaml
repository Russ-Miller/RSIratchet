    stance: supports
    note: >-
      Validated by: Measured AP and ROC AUC over the judged universe against
      every single run and configuration, a random-ranking reference, a
      pattern oracle, and a numerically optimized linear-fusion benchmark:
      uniform fusion exceeded the best configuration by 0.142 AP and 0.118
      ROC AUC, Naive-Bayes weighting added 0.039 and 0.052 reaching 0.864
      and 0.869; gains stayed positive in at least 92% of out-of-bag
      bootstrap resamples and in every structured-perturbation sample..
