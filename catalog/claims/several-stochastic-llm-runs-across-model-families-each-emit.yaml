id: several-stochastic-llm-runs-across-model-families-each-emit
ref: CLM-0260
capability: hallucination
technique: fuse-repeated-runs-into-ranked-review-queue-vote
statement: >-
  When several stochastic LLM runs across model families each emit an
  unranked set of candidate cybersecurity requirements instantiated from
  standard controls, pooling the runs recovers far more valid requirements
  than any single run but also many plausible hallucinations; scoring each
  candidate by how many runs produced it turns the pool into a ranking that
  puts valid requirements ahead of hallucinations, and weighting each run by
  its family's estimated true- and false-positive rates improves the ranking
  further.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Recall-sensitive set-generation tasks where candidates from different runs can be canonicalized and expert-adjudicated; here 24 runs from 12 configurations of four below-frontier m"
sources:
