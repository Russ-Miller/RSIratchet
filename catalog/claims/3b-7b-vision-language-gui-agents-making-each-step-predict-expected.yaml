    stance: supports
    note: >-
      Validated by: On a failure-injection Robustness Benchmark from
      AndroidControl-High, Recovery Success Rate 51.1% (3B) and 52.5% (7B)
      vs 45.5% best open baseline (UI-TARS-7B), Loop Rate 24.3%/15.6% vs
      30.0% for Qwen2.5-VL-3B; ablations: Robust SFT lifts RSR 29.7->45.5,
      GRPO to 51.1; also gains on live MiniWoB++ and AndroidWorld.. Measured
      on one base family (Qwen2.5-VL 3B/7B), offline
      AndroidControl-High/AITW/GUI Odyssey plus two online benchmarks;
