id: 3b-7b-vision-language-gui-agents-making-each-step-predict-expected
ref: CLM-0794
capability: self-repair
technique: predict-expected-screen-effect-then-verify-next-step
statement: >-
  For 3B-7B vision-language GUI agents, making each step predict the
  expected screen effect and verify it against the next observation —
  trained by SFT on synthetic failure trajectories plus GRPO with an
  asymmetric penalty for falsely claiming success — raises recovery success
  and cuts repeated-failed-action loops relative to same-scale agents that
  act without verifying prior outcomes.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Mobile/web GUI automation where failed actions mostly leave the screen unchanged (idempotent failures); training data synthesized under that assumption; not validated for non-idemp"
sources:
