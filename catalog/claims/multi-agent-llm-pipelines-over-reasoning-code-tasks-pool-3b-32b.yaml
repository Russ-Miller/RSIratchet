    note: >-
      Validated by: Accuracy and token cost on five benchmarks against
      query-only routing (MASRouter), full-history routing (Puppeteer),
      fixed topologies (MacNet), AFlow; best average accuracy, +2.44 points
      over strongest baseline, -31.9% HumanEval cost; leave-one-out ablation
      of each module; three seeds reported in appendix.. Direct
      three-paradigm comparison on two benchmarks (GSM-Hard 70.27 vs 70.55;
      HumanEval 89.06 vs 89.84) with cost ~40-50% lower; own implementation
