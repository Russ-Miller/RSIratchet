id: multi-agent-llm-pipelines-over-reasoning-code-tasks-pool-3b-32b
ref: CLM-0434
capability: multi-model-coordination
technique: route-multi-agent-steps-over-gated-execution-memory
statement: >-
  In multi-agent LLM pipelines over reasoning and code tasks with a pool of
  3B-32B open-weight backbones, conditioning each per-step routing decision
  on a learned filtered memory rather than the full accumulated trajectory
  leaves accuracy about the same while cutting inference cost by roughly
  40-50%, so most of the accumulated history is cost without accuracy value.
