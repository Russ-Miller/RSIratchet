    stance: supports
    note: >-
      Validated by: Pass@1 and Pass@1(MCTS) on LiveCodeBench v6 against
      vanilla GRPO single-agent and parameter-sharing multi-role training at
      matched data; Qwen3-8B Pass@1 +8.0 over base, +4.4 over GRPO, +2.9
      over the homogeneous peak; Pass@1(MCTS) 62.3% vs 59.4% homogeneous and
      58.3% GRPO; homogeneous reward standard deviation falls late in
      training.. Measured on one benchmark (LiveCodeBench v6) across five
      backbones and several pairings, with GRPO and homogeneous baselines
      matched on data and RL tricks. [truncated]
