id: several-llm-agents-rl-trained-together-code-generation-via-shared
ref: CLM-1162
capability: multi-model-coordination
technique: give-each-collaborating-agent-own-parameters-shared-policy
statement: >-
  When several LLM agents are RL-trained together on code generation via a
  shared tree search (8B-32B backbones), giving each agent independent
  parameters raises both individual Pass@1 and system-level search accuracy
  above parameter-sharing multi-role training, which peaks early and then
  stagnates or declines as the shared policy's reward variance collapses.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Code generation (LiveCodeBench v6) with verifiable test-case rewards, 8B-32B open models, two or three agents, equal training-data budget; not tested outside code."
