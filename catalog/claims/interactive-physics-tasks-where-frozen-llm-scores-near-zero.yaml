  comparison in which ReAct given the same number of extra tool calls, or
  episodic retrieval of raw trajectories, reaches the same held-out solve
  rate; or the wrong-level-skill control performing as well as the
  task-specific bank. Drafted stance toward
  distilling-lessons-from-failures-as-well-as-successes-beats-raw-trajectory-memory:
  supports -- HExA likewise beats raw-trajectory episodic memory (catapult
  82.7% vs 62.9% Episodic RAG, 49% MemRL) and draws skills from failed as
  well as successful trajectories.
