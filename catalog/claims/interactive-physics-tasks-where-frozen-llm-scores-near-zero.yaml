id: interactive-physics-tasks-where-frozen-llm-scores-near-zero
ref: CLM-0642
capability: harness-self-improvement
technique: distill-experiment-trajectories-into-capped-skill-plus-mistake
statement: >-
  On interactive physics tasks where a frozen LLM scores near zero
  zero-shot, distilling its own successful and failed experiment
  trajectories into a capped bank of named strategy skills and mistake
  records, and re-injecting the bank on later episodes, raises held-out
  success far above a ReAct loop with the same tools (catapult 11% to 82.7%,
  pass-the-parcel 20% to 96% with Claude Sonnet 4.6) while cutting
  interaction turns roughly in half.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Tasks exposing programmatic experimentation APIs (scene inspection, intervention, partial simulation) where zero-shot success is ~0; skills built on training seeds, frozen, evaluat"
sources:
  - source: arxiv-2606-29315
    stance: supports
    note: >-
      Validated by: Held-out solve rate and mean turns per seed against
      zero-shot, ReAct, Reflexion, Episodic RAG, MemRL and budget-matched
      GRPO, across eight Interphyre levels plus four reasoning tasks, four
      games and DiscoverPhysics; frozen-bank controls swapped in wrong-level
      skills of comparable length (two_body 50.0% to 9.3%) and dropped the
      two highest-reward skills (down_to_earth 76.7% to 65.3%) versus no
      change for the two lowest.. [truncated]
