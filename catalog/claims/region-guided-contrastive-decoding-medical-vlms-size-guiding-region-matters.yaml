    stance: supports
    note: >-
      Validated by: Overall/closed/open scores on SLAKE and MIMIC-CXR
      against plain decoding, VCD, DoLA, OPERA and ground-truth-ROI ARCD, on
      three Med-VLMs; ablations removing the area penalty (-3.4%), using
      random masks (-4.4%), or a single occlusion operator (-3.3/-4.0%)..
      Measured on two datasets and three Med-VLMs with per-component
      ablations and a coverage analysis (39.41% vs 7.05% mean coverage;
      closed accuracy falls when GT coverage exceeds 40%). [truncated]
