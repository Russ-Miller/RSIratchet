id: region-guided-contrastive-decoding-medical-vlms-size-guiding-region-matters
ref: CLM-0472
capability: visual-grounding
technique: pick-contrast-region-counterfactual-occlusion-penalising-size
statement: >-
  In region-guided contrastive decoding for medical VLMs, the size of the
  guiding region matters more than whether it is expert-annotated:
  suppressing a coarse ground-truth bounding box (mean coverage about 39% of
  the image) leaves too little context for a usable contrast, while a
  compact automatically discovered mask (about 7% coverage) selected by the
  likelihood drop under occlusion gives higher closed-ended VQA accuracy on
  SLAKE and MIMIC-CXR across three Med-VLMs.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Medical VQA on SLAKE and MIMIC-CXR with Phi-3.5V-Med, HuatuoGPT-Vision-7B and LLaVA-Med-7B; classifier-free-guidance-style decoding where the unconditional branch suppresses the re"
sources:
