id: base-llms-predicting-next-wave-longitudinal-panel-survey-earlier
ref: CLM-0570
capability: forecasting
statement: >-
  For base LLMs predicting the next wave of a longitudinal panel survey from
  earlier waves, accuracy improves with pre-training compute but so slowly
  that the trend is near-useless in practice: the best of 35 open-weight
  models reached 65% and the fitted loss-accuracy and compute-loss relations
  imply roughly 1000x more compute for a further 5 points, with an
  extrapolated ceiling near 77%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Base (not post-trained) models up to 70B, multiple-choice-style next-wave prediction on the Americans' Changing Lives panel; no retrieval, tools, or reasoning-model variants tested"
sources:
  - source: arxiv-2607-02464
    stance: supports
    note: >-
      Measured: compute scaling law on ACL task loss over 85 controlled
      Qwen3-architecture checkpoints (r^2=0.88), plus an observational
      loss-to-accuracy calibration over 35 open-weight models 0.5B-70B that
      is linear. The 1000x and 77% figures are extrapolations beyond the
      fitted compute range, not observed points, and the design does not
      isolate post-training, retrieval, or reasoning-model effects.
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A newer base model
  trained within a few times the compute of the largest evaluated run
  scoring well above 77% on the same next-wave prediction task, or a re-fit
  showing the compute-to-accuracy requirement is far smaller than 1000x for
  5 points.
