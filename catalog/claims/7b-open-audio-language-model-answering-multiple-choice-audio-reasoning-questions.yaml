id: 7b-open-audio-language-model-answering-multiple-choice-audio-reasoning-questions
ref: CLM-0810
capability: audio-understanding
technique: caption-audio-first-then-answer-text-alone
statement: >-
  For a 7B open audio-language model, answering multiple-choice audio
  reasoning questions by first generating a detailed audio caption and
  handing that caption plus the question to a text-only LLM scores higher
  than the same model answering the audio directly, and higher than its
  chain-of-thought variant, on sound/music/speech reasoning benchmarks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "7B Qwen2.5-backed Audio Flamingo Next variants on MMAU, MMAR and MMSU multiple-choice reasoning; captioner model trained for long-form captioning; text-only judge was GPT-5.2."
sources:
  - source: arxiv-2604-10905
    stance: supports
    note: >-
      Validated by: MMAU average 75.76 for the captioner pipeline vs 74.20
      direct instruct and 75.01 chain-of-thought; MMAR 63.0 vs 59.7 and
      61.0; MMSU 63.3 vs 59.4 and 61.2. No ablation isolating caption
      quality from the text model's strength.. Measured on three
      multiple-choice benchmarks, single paper, authors' own model family.
      The comparison confounds the pipeline with the use of a separate
      strong text model (GPT-5.2) as the answerer, so it does not isolate
      whether captioning helps or whether the extra text model does the
      work. Captioner was also not reported on MMAU-Pro.
contested: false
status: pending-review
last_checked_at: 2026-11-06
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On the same benchmarks and
  backbone, the caption-then-text pipeline scoring at or below the direct
  instruct variant, or the gain disappearing when the text-only judge is
  matched in size to the audio model's own LLM backbone.
