id: chat-assistant-over-10-turn-dialogue-extracting-user-traits-earlier
ref: CLM-1030
capability: long-term-memory
technique: split-memory-learning-personalization-into-separate-sub-agents
statement: >-
  For a chat assistant over a 10-turn dialogue, extracting user traits from
  earlier turns into a stored profile asynchronously and injecting the
  relevant subset at generation time raises LLM-judged trait incorporation
  on later, topically unrelated queries compared with a stateless same-model
  baseline.
kind: observation
backing_strength: single-paper
observed_on:
  era: "150 synthetic personas with 5 sampled traits each, 10-turn conversations generated by an LLM, evaluation only on the last 2 turns, scored by an LLM judge from the same model family"
sources:
  - source: arxiv-2602-13258
    stance: supports
    note: >-
      Validated by: LLM-as-judge (Claude 3 Haiku) personalization score on
      150 synthetic personas: 4.17 to 4.78 of 5 (Welch t=6.05, p<0.001,
      Cohen's d=0.95), trait incorporation 45% to 75%, perfect scores 15% to
      88%, against the same LLM with no persistent memory. Measured, but
      weakly: fully synthetic personas and conversations, LLM judge from the
      same vendor family as the generator, and the baseline is stateless
      rather than a full-history-in-context control, so the result does not
      isolate the decomposition from simply having the earlier turns
      available. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-20
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Human raters, or judges
  from a different model family, find no reliable difference in
  trait-appropriate responses between the decomposed system and a baseline
  that simply appends the prior 8 turns to the prompt.
