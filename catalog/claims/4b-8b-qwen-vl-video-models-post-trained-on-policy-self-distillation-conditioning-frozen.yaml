id: 4b-8b-qwen-vl-video-models-post-trained-on-policy-self-distillation-conditioning-frozen
ref: CLM-0535
capability: video-temporal-reasoning
technique: condition-self-teacher-only-evidence-frames
statement: >-
  For 4B-8B Qwen-VL video models post-trained by on-policy
  self-distillation, conditioning the frozen self-teacher only on the
  annotated evidence frames (while the student sees the full video) yields a
  more accurate teacher and better student scores than giving the teacher
  the same frames plus non-evidence context, and teacher accuracy falls
  monotonically as temporally irrelevant frames are added.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Requires ground-truth temporal evidence annotations in the training data; shown on three Qwen-VL backbones (2.5-VL-7B, 3-VL-4B/8B) with ~6.5K training examples and five video QA be"
sources:
  - source: arxiv-2608-27065
    stance: supports
    note: >-
      Validated by: Average over five video benchmarks against SFT, standard
      OPSD and GRPO on three backbones: Video-OPSD beat standard OPSD in all
      15 backbone-benchmark pairs (+1.3 to +2.1 average points) and matched
      or slightly beat GRPO at ~40% of its training time; ablations show
      teacher training-set accuracy 70.4% with evidence frames only vs 64.9%
      with 8 padding frames and 49.8% with 16 uniform frames (no gold
      answer), and final average falls from 51.0 to 50.6 to 50.4 as 4 then 8
      non-evidence frames are added.. [truncated]
