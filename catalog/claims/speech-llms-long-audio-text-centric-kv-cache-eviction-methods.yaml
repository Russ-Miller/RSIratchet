id: speech-llms-long-audio-text-centric-kv-cache-eviction-methods
ref: CLM-0706
capability: long-context-degradation
technique: compress-audio-kv-cache-around-asr-transcript-anchors
statement: >-
  For speech LLMs on long audio, text-centric KV cache eviction methods
  (StreamingLLM, SnapKV, PyramidKV, ChunkKV) collapse because raw audio
  tokens have diffuse attention; anchoring compression on ASR transcripts —
  pooling each transcribed audio span down to its text-token length and
  adding the text embedding, while keeping untranscribed audio intact —
  retains over 90% of full-cache accuracy at a 5-10% cache budget where
  those baselines retain roughly 55-67% at a looser 25% budget.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen3-Omni-30B (Instruct and Thinking) on six audio benchmarks; needs an auxiliary ASR model with timestamps and confidence scores; degrades with noisy or accented speech."
sources:
  - source: arxiv-2608-08569
    stance: supports
    note: >-
      Validated by: Accuracy against a Full-KV baseline and four text-domain
      KV compression baselines across Vox-Infinity, AudioMarathon,
      SPIRAL-Hard, MMAR, MMSU, MMAU, plus ablations removing semantic
      anchoring, removing untranscribed segments, text-only input, and
      sweeping the decay factor; efficiency measured at 64K context
      including ASR overhead.. Measured on one backbone family
      (Qwen3-Omni-30B) across six benchmarks with four compression
      baselines; ablations isolate the anchoring stage (PM subset 6.4%
      without vs 81.6% with at 15% budget) and the decay factor. [truncated]
