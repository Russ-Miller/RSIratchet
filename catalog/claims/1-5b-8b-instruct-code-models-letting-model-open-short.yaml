    note: >-
      Validated by: pass@1 on four code benchmarks against the base model,
      CoT, Self-Planning, Interleaved Thinking, GRPO, and five code
      post-training baselines (average 70.3 vs 68.4 GRPO and 61.0 base);
      ablations isolate cold-start-only (47.9 on LeetCode), RLVR-only
      (63.4), line-level thinking (67.2), and padded thinking content (67.6)
