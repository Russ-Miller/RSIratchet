id: 1-5b-8b-instruct-code-models-letting-model-open-short
ref: CLM-0791
capability: code-generation
technique: let-model-pause-think-mid-code-placement-learned
statement: >-
  For 1.5B-8B instruct code models, letting the model open short reasoning
  blocks at arbitrary token positions inside the code it is writing only
  helps if the placement is learned by outcome-reward RL: prompting or
  supervised fine-tuning on demonstrated placements scores below the
  untrained base model, while cold-start SFT followed by RLVR beats both
  upfront-thinking RL (GRPO) and the base model on code benchmarks.
