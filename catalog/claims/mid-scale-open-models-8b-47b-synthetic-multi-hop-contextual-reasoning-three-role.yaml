id: mid-scale-open-models-8b-47b-synthetic-multi-hop-contextual-reasoning-three-role
ref: CLM-1034
capability: multi-model-coordination
technique: gate-multi-agent-decomposition-single-agent-reasoning-accuracy
statement: >-
  For mid-scale open models (8B-47B) on synthetic multi-hop contextual
  reasoning, a three-role multi-agent pipeline (analyst, strategist,
  generator with feedback) only helps models that already have non-trivial
  single-agent reasoning accuracy, and it can lower accuracy below the
  single-agent baseline on single-hop extraction tasks where no reasoning is
  needed.
kind: observation
backing_strength: single-paper
observed_on:
  era: "120 trials, 15 per condition per model, synthetic contextual-inference tasks with 2-4 hops; four models (LLaMA-3 8B, LLaMA-2 13B, Mixtral 8x7B, DeepSeek-V2 16B); small samples and "
sources:
  - source: arxiv-2601-04254
    stance: supports
    note: >-
      Validated by: Success rates on 15 contextual and 15 structured trials
      per model: LLaMA-3 8B rose 33.3% to 80.0% (p<0.001) and Mixtral 40.0%
      to 53.3% (p=0.014) on contextual tasks, while LLaMA-2 13B (6.7% to
      20.0%) and DeepSeek-V2 16B showed no significant gain; on structured
      tasks Mixtral fell from 86.7% to 20.0% under multi-agent.. Measured,
      but on a synthetic in-house framework with only 15 trials per cell, so
      standard errors are 8-13 points and the authors themselves call
      p-values indicative; [truncated]
