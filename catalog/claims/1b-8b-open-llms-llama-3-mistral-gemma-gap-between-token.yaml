id: 1b-8b-open-llms-llama-3-mistral-gemma-gap-between-token
ref: CLM-0959
capability: hallucination
technique: score-energy-mismatch-between-consecutive-decoding-steps
statement: >-
  For 1B-8B open LLMs (LLaMA-3, Mistral, Gemma), the gap between a token's
  logit at one decoding step and the log-sum-exp normalizer at the next step
  — quantities the chain rule says should match — separates correct from
  hallucinated answers when read over the exact-answer tokens with min
  pooling, averaging higher AuROC than logit confidence, p(true), and
  cross-dataset-transferred trained probes.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Requires white-box access to logits and prior localization of the exact answer span; signal is unreliable on punctuation and sentence-initial tokens, and per-dataset variance is la"
sources:
  - source: arxiv-2602-18671
    stance: supports
    note: >-
      Validated by: AuROC on nine benchmarks (HotpotQA, IMDB, Math, MNLI,
      Movies, TriviaQA, Winobias, Winogrande) across four LLMs plus
      synthetic multi-digit arithmetic with graded error magnitudes;
      baselines were logit confidence, p(true), and Orgad et al. probing
      classifiers evaluated cross-dataset (average 73.16 vs 64.16 for probes
      on LLaMA-3-Instruct).. Measured, not argued: AuROC tables over 9
      datasets x 4 models plus Gemma 1B/4B, with per-dataset standard
      deviations. [truncated]
