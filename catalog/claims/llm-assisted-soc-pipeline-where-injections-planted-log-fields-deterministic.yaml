notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A study showing the
  deterministic pre-filter catches the same injections the semantic rails
  catch (or vice versa), so removing one layer leaves attack success
  unchanged on a larger and adversarially adaptive injection set.
