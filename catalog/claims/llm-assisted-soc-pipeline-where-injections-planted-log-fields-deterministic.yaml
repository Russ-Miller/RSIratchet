id: llm-assisted-soc-pipeline-where-injections-planted-log-fields-deterministic
ref: CLM-0362
capability: prompt-injection
technique: deterministic-siem-pre-filter-before-semantic-guardrails
statement: >-
  In an LLM-assisted SOC pipeline where injections are planted in log
  fields, a deterministic SIEM pre-filter (regex decoders plus length
  truncation) catches only the structurally obvious payloads while an LLM
  self-check input/output rail catches most semantic ones, so the two layers
  block disjoint attack classes and neither alone is sufficient.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Prototype AI-SOC with Wazuh decoders plus NeMo Guardrails, local Gemma 3 12B analyst model, 20 hand-crafted injected alerts across four MITRE ATLAS vectors."
sources:
  - source: arxiv-2609-10707
    stance: supports
    note: >-
      Validated by: On 20 injected Wazuh alerts, Layer 1 intercepted 3 and
      Layer 2 intercepted 18 of 20; two evasions remained (one tool-abuse,
      one instruction-override jailbreak). No baseline of undefended
      pipeline success rate reported, no latency numbers.. Measured on a
      single hand-built dataset of 20 injections against one 12B model, with
      per-layer counts but no undefended baseline, no adaptive attacker, and
      no latency or false-positive measurement; layer-count split is the
      only quantitative evidence.
contested: false
