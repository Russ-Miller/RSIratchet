id: judging-whether-real-robot-episode-accomplished-stated-instruction-1-5-progress
ref: CLM-1143
capability: critique
technique: build-reward-model-negatives-relabeling-clipping-successes
statement: >-
  When judging whether a real-robot episode accomplished its stated
  instruction on a 1-5 progress scale, frontier general-purpose VLMs
  disagree with human-verified labels substantially and unevenly across
  embodiments and viewpoints, and a 4-8B model fine-tuned on episode-reward
  pairs with synthetically generated failure and near-miss examples scores
  closer to the human labels than much larger proprietary models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Short-horizon manipulation episodes from Open X-Embodiment and RoboArena, end-of-episode discrete progress scoring, 22 models evaluated by mean absolute error against human-verifie"
sources:
  - source: arxiv-2601-00675
    stance: supports
    note: >-
      Validated by: Ablations on the 4B model against the human-verified
      RoboRewardBench: removing all negative augmentation raised overall MAE
      from 0.845 to 1.450, removing only the clipped negatives raised it to
      1.075, while MAE on the organic RoboArena subset barely moved (0.806 /
      0.797 / 0.813); the 8B model trained on the full mixture also raised
      real-robot RL success over a frontier embodied-reasoning VLM reward
      (50% vs 10% and 80% vs 45% on two tasks, 20 trials each).. Measured on
      2,831 human-verified test episodes with disjoint task descriptions
      across splits; [truncated]
