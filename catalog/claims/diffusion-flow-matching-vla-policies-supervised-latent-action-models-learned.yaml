id: diffusion-flow-matching-vla-policies-supervised-latent-action-models-learned
ref: CLM-0604
capability: embodied-control
technique: align-vla-diffusion-features-online-jointly-trained-lam
statement: >-
  For diffusion/flow-matching VLA policies supervised by latent action
  models learned from unlabeled video, aligning the policy's deep DiT
  features with the LAM's continuous latent action while updating both
  jointly beats using the same LAM frozen as a fixed supervision target, and
  the refinement runs both ways — the jointly trained LAM yields better
  pseudo-labels for downstream VLA learning.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Diffusion/flow-based VLA with a DiT action head and a ViT encoder-decoder LAM; alignment must be injected in deep layers near the action head, and the best depth is architecture-de"
sources:
  - source: arxiv-2606-07100
    stance: supports
    note: >-
      Validated by: Manipulation success rate on LIBERO, SIMPLER-ENV,
      GR1-Sim-24(30) and a 50-demo real Unitree G1 benchmark: ~10% average
      gain over a DiT-only baseline pretrained on the same OXE data, ~5% as
      post-training on GR00T-N1.6 and pi0.5, and 42.8 to 49.5 average
      SIMPLER success when the refined LAM's tokens replace a vanilla LAM's
      as Moto-GPT pseudo-labels; an ablation on LIBERO-Long compares joint
      optimization against a frozen LAM at the same alignment depth..
