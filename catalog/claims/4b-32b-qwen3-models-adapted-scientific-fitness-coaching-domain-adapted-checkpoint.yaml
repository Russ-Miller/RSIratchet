id: 4b-32b-qwen3-models-adapted-scientific-fitness-coaching-domain-adapted-checkpoint
ref: CLM-0537
capability: domain-knowledge
technique: continual-pre-train-then-reasoning-sft-then-rl
statement: >-
  For 4B-32B Qwen3 models adapted to scientific fitness coaching, a
  domain-adapted checkpoint built by continual pre-training plus reasoning
  SFT plus RL beats the same general base model fine-tuned directly on a
  target sub-domain's task data, even when the domain model is evaluated
  zero-shot, and fine-tuning on top of it raises the ceiling further.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3 8B comparison on six sub-domains of ACSM-EP and NSCA-CSCS certification exams; domain corpus of 30B tokens from guidelines, literature and textbooks"
sources:
  - source: arxiv-2607-02118
    stance: supports
    note: >-
      Validated by: Certification-exam scores (ACSM-EP, NSCA-CSCS) versus
      Qwen3 base models and open/closed baselines, plus a general-capability
      suite (MMLU-Redux, MATH-500, HumanEval, IFEval and others) to check
      retention; stage ablations at 8B show CPT alone drops General-Bench
      67.90 to 66.24 while SFT recovers it to 70.12, and dropping CPT costs
      2.69 ACSM-EP points.. Measured on two professional exams averaged over
      five runs, with stage ablations and a scale sweep from 4B to 32B.
