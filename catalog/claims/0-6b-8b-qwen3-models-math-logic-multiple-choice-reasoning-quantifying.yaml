technique: score-uncertainty-complexity-merged-reasoning-step-graph
statement: >-
  For 0.6B-8B Qwen3 models on math, logic and multiple-choice reasoning,
  quantifying reasoning uncertainty from a directed acyclic graph built by
  sampling several chains and merging semantically equivalent steps with an
  NLI model separates correct from incorrect generations better than
  sequence-level entropy, likelihood and self-prompting uncertainty
  measures.
