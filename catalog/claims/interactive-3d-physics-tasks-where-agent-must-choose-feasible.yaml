id: interactive-3d-physics-tasks-where-agent-must-choose-feasible
ref: CLM-1128
capability: long-horizon-execution
technique: compare-interactive-solving-against-one-shot-single-view
statement: >-
  On interactive 3D physics tasks where an agent must choose feasible
  actions over many steps, current frontier VLMs degrade sharply as
  structural constraints tighten: in CHAIN, top models solve easy
  spatial-packing levels at or near 100% but fall to about 6% on hard
  packing and to 0-3% on interlocking mechanical puzzles at every difficulty
  tier, so near-ceiling scores on the easy tier do not indicate
  constraint-aware multi-step planning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "109 interactive levels (32 interlocking puzzles, 77 3D packing) in a Unity/Python physics simulator with multi-view observations, color-keyed object selection, 30-60 step budget, 5"
sources:
  - source: arxiv-2602-21015
    stance: supports
    note: >-
      Validated by: One-shot accuracy was uniformly lower for GPT-5.2,
      Gemini-3-Pro and Claude-Sonnet-4.5 (e.g. GPT-5.2 stacking 31.2%
      interactive vs 9.1% one-shot; puzzle 3.1% vs 0.0%), showing benchmark
      success is not reachable by precomputed planning from one view..
      Measured across 16 models on 109 levels with rule-based final-state
      verification plus difficulty-stratified results for three top models;
      difficulty tiers are assigned by two human experts' average solve
      time, so tiers are calibrated to humans rather than to any model-side
      measure. [truncated]
