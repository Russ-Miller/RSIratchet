id: unlearning-methods-make-model-answer-i-don-t-know
ref: CLM-0279
capability: fine-tuning-retention
statement: >-
  Unlearning methods that make a model answer "I don't know" about a forget
  set can leave the knowledge in place: the strongest IDK-style fine-tuning
  method still answered those same questions accurately when probed in a
  different format, and across nine unlearning methods on three model
  families none met a joint standard of utility and honesty on retained
  knowledge plus consistent, acknowledged forgetting; aligning
  representations after feature randomization (ReVa) roughly doubled the
  rejection rate that survives a second conversational turn.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine unlearning methods, three open model families, 2026; Q&A and multiple-choice probes of the forget set, rejection rate measured after two rounds of interaction."
sources:
  - source: arxiv-2605-08765
    stance: supports
    note: >-
      The headline finding is a failure mode shown by re-probing, which is
      direct; the proposed fix is evaluated by the same authors' new
      metrics. Whether hidden retention is exploitable in practice is not
      tested.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An unlearning method
  whose refusal on the forget set holds across probe formats and follow-up
  turns without loss on the retain set.
