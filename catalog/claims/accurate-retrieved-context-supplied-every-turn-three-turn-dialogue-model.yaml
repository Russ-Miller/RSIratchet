id: accurate-retrieved-context-supplied-every-turn-three-turn-dialogue-model
ref: CLM-0274
capability: retrieval-utilization
statement: >-
  When accurate retrieved context is supplied at every turn of a three-turn
  dialogue, model scores still fall as each turn adds a condition or
  constraint on how the retrieved material must be used, and models that
  score alike on plain multi-turn chat diverge on retrieval-grounded turns,
  so using retrieval well is a distinct competence from chatting well.
kind: observation
backing_strength: single-paper
observed_on:
  era: "RAD-Bench, 89 three-turn samples over six scenarios (synthesis and reasoning over retrieved text), 2024; scored 1-10 by an LLM judge against references; open and closed models of 2"
sources:
  - source: arxiv-2409-12558
    stance: supports
    note: >-
      Small benchmark (89 samples) judged by a model; the per-turn decline
      and the chat-versus-retrieval divergence are the two findings, both
      shown in figures rather than with confidence intervals.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Current models showing flat
  scores across turns on the same benchmark, or a re-judging with humans
  that removes the turn-wise decline.
