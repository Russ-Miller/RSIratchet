id: non-reasoning-gpt-class-models-answering-multi-hop-structural-queries-over-synthetic
ref: CLM-0875
capability: multi-step-reasoning
technique: navigate-graph-minimal-generic-tools-instead-in-context
statement: >-
  For non-reasoning GPT-class models answering multi-hop structural queries
  over synthetic graphs, giving them a minimal set of generic
  graph-navigation tools (node lookup, neighbor retrieval, property
  enumeration) raises accuracy over placing the whole graph in context, and
  the advantage grows with graph size because in-context accuracy collapses
  as the graph grows even while it still fits the context window.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Synthetic, non-semantic property graphs of 100-500 nodes and 10x10 mazes; GPT-4o/4.1 family and o3/o4-mini; 12 query templates, 10 runs each; graphs always fit inside the context w"
sources:
  - source: arxiv-2604-01610
    stance: supports
    note: >-
      Validated by: Correct-answer count, accuracy, precision/recall/F1 and
      false positives over 120 queries per model, against a no-tool baseline
      with the full graph in context; mazes scored by whether any valid path
      was found (tool-equipped gpt-4.1 10/10 vs 1/10 no-tool); at 500 nodes
      gpt-4.1-with-tools 26.67% accuracy vs 10.83% no-tool and o4-mini
      4.17%.. Measured on one synthetic generator and one maze family with
      OpenAI models only; 12 query templates x 10 graph instances per model.
      Baseline is full-graph-in-context, which the authors argue stands in
      for perfect retrieval. [truncated]
