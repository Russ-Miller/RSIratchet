id: vlms-must-operate-unfamiliar-household-devices-no-manual-through
ref: CLM-0472
capability: embodied-control
statement: >-
  When VLMs must operate unfamiliar household devices with no manual,
  through multi-turn interaction over rendered multi-view images with
  click/rotate actions at pixel coordinates, the limiting failure is
  fine-grained localization of the interactive component within the correct
  view rather than navigating to that view, and almost no task is completed
  in the optimal number of steps.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Documentation-free device operation on 968 rendered 3D household devices with annotated component bounding boxes, discrete atomic actions and fixed viewpoint switching; six VLMs, R"
sources:
  - source: arxiv-2609-00845
    stance: supports
    note: >-
      Measured on VGEBench: success rates 1.48-54.27% across six VLMs;
      perfect-step sub-task rate 12.94% vs 62.86% sub-task success for the
      best model; GPT-5-mini's successful-navigation rate was 12.5% below
      Gemini-3-Flash while its average coordinate distance to the nearest
      target box was 63.9% worse (77.3% worse weighted for repeated
      failures). Human baseline on 149 episodes reached 74.50% SR vs 56.38%.
      Renders, not real scenes; bottleneck attribution rests on comparing
      two differently-scaled metrics, not a controlled ablation.
contested: false
status: pending-review
last_checked_at: 2026-09-29
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A benchmark of the same
  kind where model coordinate error on target components is near human level
  while view-switching success lags, or where perfect-step sub-task rates
  approach overall sub-task success rates, would show localization is not
  the bottleneck.
