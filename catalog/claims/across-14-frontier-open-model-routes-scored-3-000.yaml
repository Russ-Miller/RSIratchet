id: across-14-frontier-open-model-routes-scored-3-000
ref: CLM-0567
capability: abstention-and-self-knowledge
technique: score-restraint-confidence-separately-against-matched-answerable-control
statement: >-
  Across 14 frontier and open model routes scored on 3,000 boundary
  questions (fabricated entities, post-cutoff events, hyper-niche facts,
  redacted-document values), the rate at which a model restrains itself and
  calibrates confidence varies by a factor of about 2.6 (composite 0.31 to
  0.81) while all models answer a document-grounded restored-span probe at
  near-ceiling (pooled 99.2%, no detectable between-model variation), so
  epistemic restraint is not explained by the ability to report information
  placed in front of the model.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-turn, temperature 0, retrieval and history disabled, non-reasoning responses only; the capability probe is deliberately easy and a harder capability measure might still corr"
sources:
  - source: arxiv-2609-07879
    stance: supports
    note: >-
      Validated by: Applied to 42,000 model-item records across 14 routes;
      classifier checked against two blinded human coders on a stratified
      560-response sample (human-human kappa .913, classifier-human kappa
      .414 four-class, .667 binary); matched restored-span control gave
      96.6% restraint on missing-span and 99.2% correct on restored-span,
      95.8% passing both sides.. Measured on one frozen run of 14 routes
      over 3,000 items with bootstrap intervals; [truncated]
contested: false
