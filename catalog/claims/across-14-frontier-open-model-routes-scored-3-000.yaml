notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A capability probe of
  comparable simplicity that separates the same panel and correlates with
  composite EHQ, or a replication where restraint scores cluster tightly
  across models rather than spanning 0.31-0.81. Drafted stance toward
  selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical:
  supports -- Both find that ability to flag questions outside the model's
  knowledge is partial and not predicted by ordinary task competence, here
  extended to determinate-but-unavailable answers rather than in-principle
  unanswerable ones.
