id: llm-must-turn-natural-language-operational-rules-into-solver-code
ref: CLM-1185
capability: code-generation
technique: map-rules-canonical-intermediate-schema-before-formulating
statement: >-
  When an LLM must turn natural-language operational rules into solver code,
  inserting an explicit intermediate schema step — mapping each rule to
  retrieved constraint archetypes and a chosen modeling paradigm before any
  mathematics is written — raises solution accuracy over direct
  text-to-constraint translation, because a single rule often expands into
  several constraints whose form depends on the paradigm chosen for the
  whole model.
