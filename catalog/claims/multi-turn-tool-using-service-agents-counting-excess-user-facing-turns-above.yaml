id: multi-turn-tool-using-service-agents-counting-excess-user-facing-turns-above
ref: CLM-0363
capability: tool-use
technique: score-successful-trajectories-excess-turns-tool-calls
statement: >-
  For multi-turn tool-using service agents, counting excess user-facing
  turns above a task-specific human reference predicts human efficiency
  preferences between two successful trajectories (about 91% accuracy on
  turn-differing pairs), while counting excess tool calls does not (chance
  on pure-tool pairs), because a raw call count cannot say whether a call
  verified a constraint or wasted effort.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "58 Chinese-language ridehailing tasks, 24 non-thinking models, 320 calibration and 80 held-out blinded pairwise preference votes; single domain and language, mostly one primary ann"
sources:
  - source: arxiv-2609-17985
    stance: supports
    note: >-
      Validated by: Held-out task-disjoint pairwise preference prediction:
      78.7% accuracy, Kendall tau_b 0.573, versus 0.773 for equal-cost
      length, 0.394 tool-only, 0.925 turn-only at 0.71 coverage; turn-first
      lexicographic tied at 0.800; plus a 10-task listwise check (all tau_b
      positive, mean 0.488) and stability to +/-1-2 floor perturbations..
      Measured on 75 directional held-out pairs: 90.6% accuracy on 53
      turn-differing pairs but only 58.3% on the 12 with small turn gaps,
      and 50.0% on 22 pure-tool pairs with an exactly even 11/11 human vote
      split. [truncated]
