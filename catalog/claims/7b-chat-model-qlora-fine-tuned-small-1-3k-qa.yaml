id: 7b-chat-model-qlora-fine-tuned-small-1-3k-qa
ref: CLM-1027
capability: domain-knowledge
statement: >-
  When a 7B chat model is QLoRA fine-tuned on a small (~1.3k QA pair) domain
  documentation corpus, it answers test questions that closely resemble
  training questions at around 80% correctness while failing to actually
  learn the newly introduced API entities: entities whose meaning cannot be
  guessed from their name pass a description task 19% of the time and
  retrieval 0% of the time, and no entity survives a distractor-option
  stress test.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One 7B chat model (Llama-2-7b-chat-hf), QLoRA rank 64, 1,260 QA pairs from a single software-documentation dataset; graded by GPT-4 annotation and manual comparison against RAG-gen"
sources:
  - source: arxiv-2606-07521
    stance: supports
    note: >-
      Measured but thin: single model, single dataset, 39 filtered entities
      (23 common, 16 specific), stages evaluated sequentially so later
      stages have tiny n (1 entity reached advanced reasoning). No
      comparison against RAG or against larger models, and the authors flag
      the small corpus as a limitation. Design does isolate
      name-guessability as a factor by splitting entities into common vs
      specific.
contested: false
status: pending-review
last_checked_at: 2026-11-27
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Fine-tuning a comparable
  model on a similar small domain corpus and finding that entities with
  non-mnemonic names are retrieved correctly at rates close to those with
  self-describing names, or that distractor-option selection accuracy
  matches free-form retrieval accuracy. Drafted stance toward
  injecting-new-or-counterfactual-facts-into-3-4b-instruct-model: supports
  -- Both find that supervised fine-tuning binds new facts to the training
  question form while generalization to other uses of the same facts
  collapses.
