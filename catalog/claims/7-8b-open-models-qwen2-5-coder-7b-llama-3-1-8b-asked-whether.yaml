id: 7-8b-open-models-qwen2-5-coder-7b-llama-3-1-8b-asked-whether
ref: CLM-0540
capability: sycophancy
technique: extract-structural-evidence-before-judging-code-smells
statement: >-
  For 7-8B open models (Qwen2.5-Coder-7B, Llama-3.1-8B) asked whether a Java
  snippet contains a code smell, a prompt asserting the code is clean —
  especially a false premise that a static analyzer found no warnings —
  flips 40-72% of predictions and drives agreement with the false claim
  above 90%, collapsing recall to near zero, while a prompt that labels the
  user's claim as unverified and requires extracting structural indicators
  before the verdict cuts flip rates to 12-26% and restores recall.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two open-weight 7-8B models, four code smell categories, 700 curated MLCQ samples, local inference; no frontier or proprietary models tested."
sources:
  - source: arxiv-2607-10411
    stance: supports
    note: >-
      Validated by: Decision Flip Rate and False Alignment Rate against
      three biased prompt framings, plus precision/recall/F1 against MLCQ
      labels and a lexical share of structural vs sycophantic vocabulary; no
      ablation separating the 'unverified claim' warning from the
      checklist.. Measured on 700 MLCQ samples across four smell types with
      two models; code snippet held fixed and only the instruction varied,
      which isolates prompt framing. [truncated]
