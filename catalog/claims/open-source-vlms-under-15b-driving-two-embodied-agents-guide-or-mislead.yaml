id: open-source-vlms-under-15b-driving-two-embodied-agents-guide-or-mislead
ref: CLM-0463
capability: embodied-control
statement: >-
  For open-source VLMs under 15B driving two embodied agents in a
  guide-or-mislead task, imposing an explicit theory-of-mind order in the
  prompt produces no reliable change in the agents' multimodal behaviour,
  and the failure splits into two stages: most models never emit
  directionally coherent gaze or trajectory signals, and the few that do
  (e.g. internvl-14b, qwenvl-4b) are not decoded by the receiving agent,
  whose choice stays near chance with respect to those signals.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open-source VLMs up to 15B parameters, one synthetic two-box reward scenario in Unity, 200 trials per model, no human baseline; a hybrid architecture with an explicit belief module"
sources:
  - source: arxiv-2608-20975
    stance: supports
    note: >-
      Measured: TOCS plus four signal-level metrics (TAS, GAS, FES, SSS)
      over 13 models, 200 trials each, across cooperative/competitive by
      ToM-0/ToM-1. Positional bias is reported to separate genuine signal
      tracking from fixed spatial preference. Single scenario, one
      environment, no human baseline, no models above 15B or closed-source,
      so generality is unestablished; the PCM-LLM comparison is a reference
      architecture, not a matched control.
contested: false
status: pending-review
last_checked_at: 2026-10-10
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Running the same MOSAIC
  protocol and finding that VLMs' trajectory/gaze alignment and the
  participant's signal sensitivity shift systematically with the imposed ToM
  order, or that a model with coherent signals is reliably followed by the
  partner agent.
