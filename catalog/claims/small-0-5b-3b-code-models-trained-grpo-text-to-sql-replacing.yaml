id: small-0-5b-3b-code-models-trained-grpo-text-to-sql-replacing
ref: CLM-0856
capability: formal-query-synthesis
technique: give-partial-credit-structurally-close-sql-verified-reasoning
statement: >-
  For small (0.5B-3B) code models trained with GRPO on text-to-SQL,
  replacing the binary execution reward with dense partial credit —
  operation-level Jaccard overlap between the predicted and reference SQL
  plus embedding similarity of the reasoning trace to verified traces from
  other databases — raises execution accuracy over the supervised-fine-tuned
  start, with the largest relative gain at the smallest scale.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Small language models (0.5B-3B) where most sampled SQLs are wrong, so a binary reward gives near-zero signal; trained and evaluated on BIRD and Spider with a schema-filtering plus "
sources:
  - source: arxiv-2605-03465
    stance: supports
    note: >-
      Validated by: Execution accuracy on BIRD Dev and Spider Dev: the 3B
      model reaches 67.73% and 85.0%, above CodeS-15B, Reasoning-SQL 14B and
      SQL-R1 3B; GRPO step curves show 0.5B rising 42.9% to 49.3% EX and 3B
      63.4% to 67.7% over 2000 steps from the SFT baseline; reward-component
      ablation reports per-reward EX deltas.. Measured on BIRD and Spider
      dev with three Qwen2.5-Coder sizes; [truncated]
