capability: domain-knowledge
technique: prune-low-saliency-experts-regrow-pool-before-domain
statement: >-
  When fine-tuning a pretrained Mixture-of-Experts LLM on a single target
  domain, pruning the half of routed experts with lowest domain-aligned
  saliency and regrowing the pool from the survivors with independent noise
  on both parent and copy before standard SFT beats direct SFT at identical
  parameter count and inference cost.
