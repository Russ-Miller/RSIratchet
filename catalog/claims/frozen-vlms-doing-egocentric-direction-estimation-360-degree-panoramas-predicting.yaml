id: frozen-vlms-doing-egocentric-direction-estimation-360-degree-panoramas-predicting
ref: CLM-0628
capability: embodied-control
technique: maintain-target-direction-spherical-harmonic-belief-field
statement: >-
  For frozen VLMs doing egocentric direction estimation from 360-degree
  panoramas, predicting the target as a pixel coordinate in the
  equirectangular projection produces estimates that drift as the agent
  rotates and crosses the projection seam, while accumulating the same VLM
  evidence as a log-likelihood belief in spherical-harmonic coefficient
  space and rotating it with Wigner-D matrices keeps the direction stable
  without any training.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Training-free use of frozen 3B-12B VLMs on 360-degree equirectangular input; evaluated in Habitat-Sim waypoint following and map-free navigation, HOS and OSR-Bench search, and one "
sources:
  - source: arxiv-2607-06165
    stance: supports
    note: >-
      Validated by: Against three ERP-space baselines (Centroid,
      Centroid-Circ, Grid) with the same backbone: map-free navigation
      success 94% vs 82/62/82, steps 50.2 vs 61.0/77.8/63.6, mean angular
      error 33.8 vs 45.9/46.5/54.2 degrees, temporal inconsistency 2.6 vs
      7.3-19.2 degrees/step; on HOS and OSR-Bench, adding it raised accuracy
      for every backbone (Qwen2.5-VL-7B 27.24 to 40.10 on HOS, 16.8 to 25.2
      on OSR-Bench).. Measured on two simulated tasks, two search benchmarks
      (2,000+ OSR-Bench queries), and qualitative real-robot runs;
