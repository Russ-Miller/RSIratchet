id: 7b-video-llms-given-sft-cold-start-before-rl
ref: CLM-0808
capability: video-temporal-reasoning
technique: build-cold-start-rationales-coarse-to-fine-clip
statement: >-
  For 7B video LLMs given an SFT cold start before RL, rationales that
  progressively narrow from the whole video down to key clips give higher
  accuracy on video reasoning and general video benchmarks than rationales
  that name the key clip in a single step, and than free-form rationales
  generated by a much larger teacher model, which can leave the student more
  hallucination-prone than the untuned backbone.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-VL-7B backbone, 1k SFT samples built from LLaVA-Video-178K, evaluated at 16/32/64 uniformly sampled frames on six video understanding benchmarks plus VideoHallucer."
sources:
  - source: arxiv-2604-20473
    stance: supports
    note: >-
      Validated by: Compared against the same pipeline producing single-step
      cue rationales (Video-SingleCue-SFT-1k): MMVU 65.3 vs 61.8, MVBench
      63.3 vs 61.0, VideoMME 56.6 vs 54.5, baseline 59.2/57.4/53.1; and
      against Video-R1-SFT on six benchmarks. Hallucination compared on
      VideoHallucer: baseline 50.5, Video-R1 45.4, Video-ToC 51.9.. Measured
      on one 7B backbone with 1k SFT and 2k RL samples. The single-cue
      ablation isolates the rationale pattern while holding data source and
      size fixed, which is the cleanest part of the evidence. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-05
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
