id: llm-based-multi-robot-task-planning-object-rich-simulated-households-restricting-planner
ref: CLM-1148
capability: planning
technique: filter-actions-objects-backward-search-pddl-action-graph
statement: >-
  For LLM-based multi-robot task planning in object-rich simulated
  households, restricting the planner to the action and object subset found
  by backward graph search over a PDDL-domain action graph raises task
  completion over shallow LLM-only filtering and over no filtering, with the
  gain concentrated on long-horizon complex tasks rather than short ones.
