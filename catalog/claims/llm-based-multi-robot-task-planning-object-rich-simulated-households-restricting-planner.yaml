  - source: arxiv-2603-08814
    stance: supports
    note: >-
      Validated by: Task completion rate, goal condition recall and
      executability on 49 MAT2-THOR tasks against LLM-as-planner, LLM+P, and
      two LaMMA-P variants (overall TCR 78% vs 53% for the strongest
      baseline), plus an ablation against no filtering (66%) and shallow LLM
      filtering (67%); complex-task TCR 59% vs 41-44%.. Measured on one
      benchmark the authors themselves cleaned and released (49 tasks, only
      17 complex and 7 vague), one LLM, one simulator, no repeated runs or
      variance reported; [truncated]
