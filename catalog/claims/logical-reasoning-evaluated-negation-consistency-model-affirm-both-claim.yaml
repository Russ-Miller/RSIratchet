id: logical-reasoning-evaluated-negation-consistency-model-affirm-both-claim
ref: CLM-0670
capability: abstention-and-self-knowledge
technique: report-commitment-mass-next-negation-consistency
statement: >-
  When logical reasoning is evaluated by negation consistency — that a model
  not affirm both a claim and its negation under the same premises — the
  metric can be satisfied vacuously, because the violation is algebraically
  max(0, p(\u03c6)+p(\u00ac\u03c6)-1) and any model that spreads low
  probability over both outcomes scores zero violations regardless of
  reasoning quality; measuring the commitment mass alongside it separates
  abstention from coherence.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Dual-query (\\u03c6, \\u00ac\\u03c6) entailment probing with log-probability elicitation; shown on four 1B-3B open-weight models over 204 FOLIO examples and 304 LogiQA v2 examples."
sources:
  - source: arxiv-2606-21083
    stance: supports
    note: >-
      Validated by: On FOLIO, Qwen2.5-3B had the lowest mean violation
      (0.025) but committed on only 7.4% of examples, while TinyLlama-1.1B
      had 79.4% coverage and violations on 100%; coherence-only ranking
      placed the abstainer first. Rank ordering held across eight
      (\u03c4,\u03b4) settings, three elicitation formats (\u03c1=1.0), and
      LogiQA v2 (\u03c1=0.97). No independent human or downstream-utility
      check of the ranking.. Measured on four small (1B-3B) open-weight
      models, 204 FOLIO items plus 304 LogiQA v2 items with rule-based
      negation, bootstrap CIs. [truncated]
