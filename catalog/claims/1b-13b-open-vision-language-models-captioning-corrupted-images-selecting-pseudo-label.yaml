id: 1b-13b-open-vision-language-models-captioning-corrupted-images-selecting-pseudo-label
ref: CLM-0959
capability: visual-grounding
technique: adapt-llm-test-time-clip-picked-caption
statement: >-
  In 1B-13B open vision-language models captioning corrupted images,
  selecting a pseudo-label by sentence-averaged CLIP image-text similarity
  among sampled candidates and then LoRA-adapting the language model on that
  single test sample lowers object-hallucination rates more than the
  CLIP-based candidate selection alone, and adapting the vision encoder
  instead of the LLM is worse.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Captioning under 15 synthetic ImageNet-C corruptions at high severity; gains are large on LLaVA-1.5-7B and small (sub-point) on several other backbones such as TinyLLaVA-1.1B, Inst"
sources:
  - source: arxiv-2603-26486
    stance: supports
    note: >-
      Validated by: CHAIR_S/CHAIR_I averaged over 15 corruptions on
      LLaVA-1.5-7B (47.9/13.7 vs 55.6/15.4 greedy and 52.8/15.3 for the best
      training-free baseline VAP), plus NoCaps near- and out-of-domain
      splits and a GPT-4o accuracy/detailedness judgement on clean images;
      ablations isolate selection-only (55.2 CHAIR_S) from full adaptation
      (45.6).. Measured on CHAIR over COCO with 15 corruptions at severity
      5, one backbone for the main tables plus six others for a one-line
      generalization check; baselines include four training-free mitigations
      and two denoisers. [truncated]
contested: false
