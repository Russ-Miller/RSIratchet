  per-sample LoRA adaptation to CLIP-selected pseudo-labels fails to beat
  CLIP-only candidate selection on CHAIR under corruption, or the gain
  disappears once caption length/coverage is held fixed (i.e. hallucination
  falls only because the adapted model says less).
