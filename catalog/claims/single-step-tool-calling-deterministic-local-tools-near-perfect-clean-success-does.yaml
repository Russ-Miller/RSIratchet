id: single-step-tool-calling-deterministic-local-tools-near-perfect-clean-success-does
ref: CLM-0485
capability: tool-use
technique: stage-aligned-perturbation-cascade-aware-failure-attribution
statement: >-
  In single-step tool-calling with deterministic local tools, near-perfect
  clean success does not predict robustness under stage-aligned
  perturbations, and the weakest stage is recovering from corrupted, missing
  or competing tool-return evidence rather than tool selection or schema
  grounding.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Seven frontier models, 15,456 single-step instances over 16 sampled deterministic local tools; four perturbation families at light/medium/heavy severity; no long-horizon or multi-t"
sources:
  - source: arxiv-2608-23635
    stance: supports
    note: >-
      Validated by: Counterfactual repair at the attributed stage recovered
      71/98 failed instances (100% single-error, 82.1% cascade, 0%
      multi-fault); human audit on 30 ambiguous cases agreed 74.2%,
      boundary-violation 93.3%; label-guided interventions: aliases for
      A-family raised gpt-5.4-mini from 21/30 to 30/30, while S3
      chain-of-thought for B-family left 21/30 unchanged.. Measured: average
      clean 0.979 versus overall robustness 0.664-0.766; family means
      interface 0.918, intent 0.773, runtime 0.688, observation 0.455 with
      no model above 0.60; [truncated]
