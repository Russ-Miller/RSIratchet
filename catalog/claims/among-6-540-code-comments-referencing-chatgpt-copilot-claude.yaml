capability: software-architecture
statement: >-
  Among 6,540 code comments referencing ChatGPT, Copilot, Claude or Gemini
  in public Python and JavaScript repositories (2022-2025), 81 also admit
  technical debt, most often postponed testing of the generated code,
  incomplete adaptation to the codebase, and limited understanding of what
  the code does, with a lower share of design-related debt than in ordinary
  self-admitted debt.
