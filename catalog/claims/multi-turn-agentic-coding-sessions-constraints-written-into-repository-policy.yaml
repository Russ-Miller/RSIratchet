id: multi-turn-agentic-coding-sessions-constraints-written-into-repository-policy
ref: CLM-0213
capability: procedure-following
statement: >-
  For multi-turn agentic coding sessions, constraints written into a
  repository policy file (e.g. CLAUDE.md) hold up better over successive
  turns than the same kinds of constraints stated in user turns, and
  constraints that replace an earlier constraint are followed less often
  than newly added ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "100 synthesized multi-turn software development instances (avg 7.04 turns, ~13 constraints per turn), 11 frontier code agents under the Claude Code harness, checklist verification "
sources:
  - source: arxiv-2609-14992
    stance: supports
    note: >-
      Measured as average constraint success rate split by constraint source
      across turns, averaged over all tested models; the gap is reported as
      a figure trend rather than with per-model statistics, and constraint
      content is not matched item-for-item between sources, so the source
      effect is not fully isolated from difficulty.
contested: false
status: pending-review
last_checked_at: 2026-09-18
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A comparison on similar
  multi-turn coding tasks where policy-file constraints decay as fast as, or
  faster than, user-instruction constraints, or where replacement
  constraints are followed at least as often as newly added ones.
