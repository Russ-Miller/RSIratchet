id: inferring-pedestrian-crossing-decisions-road-sites-llama-2-7b-model-lora-fine-tuned
ref: CLM-1064
capability: domain-knowledge
technique: fine-tune-visual-features-plus-written-domain-knowledge
statement: >-
  For inferring pedestrian crossing decisions at road sites, a LLaMA-2-7B
  model LoRA-fine-tuned on textual data plus LLaVA-extracted visual features
  and written transportation domain knowledge transfers to unseen sites far
  better than statistical and supervised learning baselines trained on the
  same data (66.9% vs at most ~49% balanced accuracy zero-shot), with five
  in-context examples raising it to 72.2%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single pedestrian-crossing dataset with site-based partitioning; five unseen test sites; one 7B backbone."
sources:
  - source: arxiv-2601-00694
    stance: supports
    note: >-
      Validated by: Balanced accuracy on held-out sites against statistical
      and supervised baselines; ablations attribute +2.9% to the vision
      module and +4.1% to domain knowledge, with cross-site zero-shot and
      five-shot comparisons.. Measured on one dataset with site-based
      cross-validation; ablations isolate the vision and knowledge
      components separately. Baseline comparison is reported as at least 18
      points, but the paper gives no confidence intervals and tests one
      backbone, so the magnitude is not well bounded.
