id: rl-post-training-thinking-llms-long-context-reasoning-rewarding-n-gram-overlap
ref: CLM-0643
capability: long-context-degradation
technique: reward-key-evidence-overlap-penalize-distractor-overlap
statement: >-
  In RL post-training of thinking LLMs for long-context reasoning, rewarding
  n-gram overlap with annotated key evidence only helps when paired with a
  penalty on overlap with distractor context; the grounding reward alone
  raises copying, lengthens reasoning traces, and scores below accuracy-only
  RL.
