id: llm-gives-answer-plus-explanation-deleting-input-those-concepts
ref: CLM-0240
capability: explanation-faithfulness
technique: re-query-after-removing-concepts-explanation-ignored
statement: >-
  When an LLM gives an answer plus an explanation, deleting from the input
  those concepts the explanation does not credit and re-querying on the
  reduced input raises measured faithfulness over both standard prompting
  and prompts that ask for faithful explanations, because the re-query
  removes the unmentioned factors that could have influenced the original
  answer.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tested on two datasets with inputs decomposable into discrete concepts, across multiple model families, with two faithfulness metrics; targets incompleteness (omitted influences), "
sources:
  - source: arxiv-2609-04343
    stance: supports
    note: >-
      Validated by: Two faithfulness metrics on two datasets across multiple
      model families, compared against standard prompting and
      faithfulness-encouraging prompting.. Measured, but the abstract and
      introduction alone give no numbers, no dataset names, and no model
      list; the design does not address unsoundness and assumes concepts can
      be cleanly segmented and deleted without changing the question.
contested: false
