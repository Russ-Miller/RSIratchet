id: 7b-code-model-fine-tuned-competitive-programming-tasks-training-emit-fixed-schema
ref: CLM-0195
capability: code-generation
statement: >-
  For a 7B code model fine-tuned on competitive-programming tasks, training
  it to emit a fixed-schema requirement specification (goals, input/output
  constraints, examples, edge cases, dependencies) before the code raises
  Pass@1 more than training it to emit free-form reasoning or a stepwise
  implementation plan of similar length, with the largest margin on an
  out-of-distribution benchmark.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-7B-Coder-Instruct, specification-rich competitive programming benchmarks (APPS, CodeContests in-distribution; xCodeEval out-of-distribution); intermediate representations f"
sources:
  - source: arxiv-2609-06041
    stance: supports
    note: >-
      One backbone, one paper. Generation-only ablation (Table 5): APPS
      0.172 vs 0.166/0.170/0.168, CodeContests 0.061 vs 0.055/0.060/0.061,
      xCodeEval 0.127 vs 0.080/0.103/0.093, with reported 95% CIs that
      overlap on the in-distribution benchmarks; only the OOD gap is wide
      relative to the intervals. Output length is reported (694.7 tokens vs
      568.2/539.0), so the comparison is not length-matched, though the
      authors argue length alone does not explain the gap. No second
      backbone or seed variation.
