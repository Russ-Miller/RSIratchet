id: stateful-enterprise-tool-use-tasks-given-oracle-tool-access-bottleneck
ref: CLM-1026
capability: planning
technique: supply-expert-authored-plan-executor-agent
statement: >-
  On stateful enterprise tool-use tasks given oracle tool access, the
  bottleneck for frontier and open models is strategic plan generation
  rather than tool discovery or invocation: adding 5-15 plausible distractor
  tools leaves success essentially unchanged (~1% average change), while
  conditioning the same executor on an expert-authored step-by-step plan
  raises success by 14-35 points.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,150 expert-curated tasks across eight enterprise domains in a containerized sandbox (164 DB tables, 512 tools, mean 9 expert steps), outcome-verified by SQL final-state checks; d"
sources:
  - source: arxiv-2603-13594
    stance: supports
    note: >-
      Validated by: Pass@1 on CSM, ITSM and HR for Kimi-K2, Qwen3-30B and
      Qwen3-4B against the same models' ReAct baselines and against plans
      auto-generated by Claude Sonnet 4.5: human plans gained 14-35 points
      versus 5-13 for model-generated plans.. Measured: 14 models evaluated
      at pass@1 averaged over three runs; best overall 37.4%. The
      distractor-tool ablation is a single model with at most +15 tools
      retrieved as 'most relevant', so it does not test realistic
      large-scale retrieval. [truncated]
