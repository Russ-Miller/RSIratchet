    stance: supports
    note: >-
      Validated by: Branch-uniqueness counts at fixed expansion width 4
      (over 80% all-distinct branches on MBPP with the full trio vs under
      20% single-agent) plus task metrics against single-agent and
      single-model search baselines (HotpotQA EM 0.79, WebShop SR 0.72, MBPP
      pass@1 0.965 for the API configuration), with fewer node expansions
      than ToT/RAP/LATS; temperature scaling and adversarial prompting
      reported as weaker diversity sources.. Measured on three benchmarks
      with two model pools; [truncated]
