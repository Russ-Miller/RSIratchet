id: mcts-planning-llms-multi-hop-qa-web-navigation-code-generation
ref: CLM-1097
capability: multi-model-coordination
technique: expand-mcts-nodes-different-model-families
statement: >-
  In MCTS planning with LLMs on multi-hop QA, web navigation and code
  generation, expanding each search node with different model families
  rather than repeated calls to one model raises the share of nodes whose
  candidate branches are all distinct and the final task accuracy, because
  repeated sampling from one model reproduces its dominant reasoning
  pattern.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Tested with three 7-8B open models (Qwen2.5, Mistral, Llama-3.1) and three API models (GPT-4, Qwen-Max, DeepSeek-V3) at expansion width 4 on HotpotQA, WebShop, MBPP; heterogeneity "
sources:
