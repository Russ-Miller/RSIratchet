id: 8b-14b-generative-reward-models-judging-preference-pairs-deriving-rubrics
ref: CLM-0978
capability: critique
technique: derive-rubrics-contrasting-response-pair-then-synthesize
statement: >-
  For 8B-14B generative reward models judging preference pairs, deriving
  rubrics from an explicit contrastive profile of the chosen and rejected
  responses (evidence-anchored per-dimension analysis, then synthesis into a
  short rubric set) yields higher preference accuracy than prompting the
  teacher for rubrics in one step, with the largest margin on items built to
  trip verbosity and position bias.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen3-8B/14B backbones, pairwise preference judging on RewardBench, RMBench and RMB; rubric generator trained on 3k teacher-synthesized samples"
sources:
  - source: arxiv-2603-08035
    stance: supports
    note: >-
      Validated by: Accuracy on RewardBench, RMBench and RMB against a
      direct no-rubric judge (76.4 avg) and a one-step rubric judge (79.0
      avg) on the same Qwen3-8B backbone with matched training config;
      CDRRM-8B base reached 85.8 avg and 81.1 on RMBench Hard, where the
      best baseline was 76.1.. Measured on three benchmarks with an ablation
      holding backbone, dataset size, optimizer and epochs fixed across the
      three judging strategies. [truncated]
