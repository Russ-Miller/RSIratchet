id: detecting-deception-short-audio-visual-clips-general-purpose-omni-multimodal-models
ref: CLM-0592
capability: strategic-deception
technique: reward-audio-visual-reasoning-steps-against-extracted-cue
statement: >-
  For detecting deception in short audio-visual clips, general-purpose omni
  multimodal models prompted zero-shot score near the 50% chance line
  (47-53% average across four datasets, below task-specific deep classifiers
  at 61-65%), and the gap is closed only by supervised fine-tuning on
  step-by-step audio-visual reasoning traces followed by RL whose reward
  scores the visual and acoustic reasoning steps for factual agreement with
  extracted Action Unit, emotion, pitch and prosody features.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four deception datasets (DOLOS, MDPE in-domain; RLTD, Box of Lies cross-domain), Qwen2.5-Omni-7B backbone, binary veracity labels; reasoning quality judged by LLM-as-judge plus hum"
sources:
  - source: arxiv-2606-18988
    stance: supports
    note: >-
      Validated by: Classification accuracy and a 1-5 reasoning quality
      score on four datasets: full model 73.76% average vs 67.41% for
      standard GRPO (format+accuracy rewards only), 58.00% for SFT alone and
      49.17% for the untuned backbone; removing the audio-visual consistency
      reward costs 4.5 points average accuracy and 0.5 reasoning score,
      removing the logic-alignment reward costs 2.85 points.. Measured on
      four datasets with 7 baselines; ablations separate SFT, standard GRPO,
      curriculum, and each reward term. [truncated]
