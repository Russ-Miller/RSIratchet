    stance: supports
    note: >-
      Validated by: On StreamArena it ranked first among streaming systems
      on all four capabilities, improving 53.7-228.1% relative over the
      strongest streaming baseline per capability, and against
      query-triggered offline inference on the same Qwen3.5-397B-A17B
      backbone it cut pooled query-to-answer latency 66.2% (81.4s to 27.5s)
      while retaining 89.7% of pooled accuracy; the authors note baselines
      use smaller backbones so gains are not isolated to architecture..
