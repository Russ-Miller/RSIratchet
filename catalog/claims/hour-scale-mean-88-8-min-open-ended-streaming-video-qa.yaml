id: hour-scale-mean-88-8-min-open-ended-streaming-video-qa
ref: CLM-0585
capability: video-temporal-reasoning
technique: split-streaming-video-into-latency-frontend-asynchronous-memory
statement: >-
  On hour-scale (mean 88.8 min) open-ended streaming video QA with causal
  access, every streaming memory design degrades as the evidence-to-query
  gap grows, and they fail in different ways: recent-window systems cannot
  recover distant events (AURA 25.4% within 5 minutes falling to 10.5%
  beyond 30 minutes), text-summary systems keep temporal coverage but
  discard visual evidence, and model-internal compression loses fine-grained
  detail (StreamForest 14.4%, ThinkStream 7.5% on retrospection), while
  human accuracy without rewatching is 63.4%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "243 YouTube videos of 60-134 minutes, 3,646 manually validated open-ended QA pairs, LLM-judge binary factual-core scoring, baselines run through their released interfaces which rec"
