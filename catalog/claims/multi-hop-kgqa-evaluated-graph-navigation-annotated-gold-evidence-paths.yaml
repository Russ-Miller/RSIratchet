    note: >-
      Argued from the paper's protocol design plus reported structural
      diagnostics: random-walk answer reachability is around 9% on Kinship
      versus roughly 0.6% on MQuAKE-ST, and graph density and clustering
      differ by orders of magnitude across the three graphs. The source text
      provided cuts off before the main results table, so no measured gap
      between agents and the calibration references is available here.
