id: 20-year-deterministic-football-management-simulation-340-400-decision-stops-ranking-15
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year deterministic football-management simulation with ~340-400
  decision stops, the ranking of 15 frontier models settles only late in the
  horizon — the rank correlation with the final order was 0.19 at year 5 and
  0.78 at year 15, with the year-5 and year-10 score leader finishing 12th —
  so a truncated version of the same task would rank a different set of
  models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One benchmark (FM-Bench), 15 flagship models, three seeds plus one shared-world Arena seed; cumulative-consequence environment with hidden state and an adaptive market."
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured: per-season trajectories and rank correlations reported on
      seed 1; three seeds for the solo track, one seed for the Arena.
      Per-model seed spread is large (up to 22.7 points), and the
      rank-correlation trajectory is reported for a single seed, so the
      precise numbers are weakly replicated.
contested: false
status: pending-review
last_checked_at: 2026-10-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Running the same
  environment and showing early-horizon (year 5) standings correlate highly
  with final standings, or that model order on short-episode management
  tasks predicts the 20-year order.
