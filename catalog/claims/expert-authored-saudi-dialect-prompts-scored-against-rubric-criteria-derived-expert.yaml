id: expert-authored-saudi-dialect-prompts-scored-against-rubric-criteria-derived-expert
ref: CLM-0379
capability: cultural-competence
statement: >-
  On expert-authored Saudi-dialect prompts scored against rubric criteria
  derived from expert ground truths, four frontier models all score under
  55% and their dominant failure is distorting register and flattening
  pragmatic nuance (37.3% of 466 errors) rather than stating falsehoods
  (11.2%), so MSA-fluent models are not dialectally competent.
kind: observation
backing_strength: single-paper
observed_on:
  era: "31 Saudi-dialect prompts, 124 model-prompt evaluations, Claude Opus 5, Gemini 3.7, GPT-5.6, Kimi K3; rubric scoring with penalties for introduced errors."
sources:
  - source: arxiv-2608-29990
    stance: supports
    note: >-
      Single benchmark, small (31 prompts), expert-authored and
      expert-scored; error taxonomy applied by the authors, so category
      shares depend on their rubric. No human baseline reported, and no
      comparison against MSA prompts to isolate dialect as the cause.
contested: false
status: pending-review
last_checked_at: 2026-10-01
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A larger or independent
  Saudi-dialect rubric evaluation where frontier models exceed 55%
  macro-average, or where factual hallucination rather than
  register/pragmatic distortion is the leading error category.
