id: university-level-materials-science-free-response-problems-whose-answers-require-reading
ref: CLM-1047
capability: domain-knowledge
statement: >-
  On university-level materials science free-response problems whose answers
  require reading values off figures (phase diagrams, stress-strain curves,
  Arrhenius plots, diffraction patterns), current multimodal models often
  reach correct answers from memorized textbook knowledge rather than from
  the image, and remain weak at quantitative figure reading and
  significant-digit handling even as overall accuracy rises across model
  versions.
kind: observation
backing_strength: single-paper
observed_on:
  era: "137 textbook-adapted free-response problems with expert-defined numeric answer ranges; evaluated on OpenAI ChatGPT/GPT multimodal models across versions"
sources:
  - source: arxiv-2603-11414
    stance: supports
    note: >-
      Measured accuracy on 137 problems across several OpenAI multimodal
      model versions, with per-category analysis; the memorization claim
      rests on the authors' error analysis rather than on a reported
      image-ablation control, so the attribution to memorized knowledge is
      argued more than isolated. Small single-source benchmark, one model
      family.
contested: false
status: pending-review
last_checked_at: 2026-11-12
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Show that accuracy on
  these problems collapses when the figure is removed or replaced with a
  mismatched one, indicating answers genuinely depend on reading the image
  rather than recalled domain knowledge.
