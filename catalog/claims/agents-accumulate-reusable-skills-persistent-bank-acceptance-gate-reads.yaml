id: agents-accumulate-reusable-skills-persistent-bank-acceptance-gate-reads
ref: CLM-0359
capability: harness-self-improvement
technique: gate-skills-sampled-coalition-knockouts-then-mask-after
statement: >-
  For agents that accumulate reusable skills in a persistent bank, an
  acceptance gate that reads only the bank-level outcome reward cannot tell
  which skill produced the gain, so banks retain skills whose knockout
  contribution is zero or negative, and a skill that helps in the source
  domain can reverse sign after transfer.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Skill-based self-evolving agents (MemSkill-style, Llama-3.3-70B skill extractor) on LoCoMo, LongMemEval, HotpotQA and ALFWorld; skills are textual memory-operation artifacts retrie"
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against the MemSkill
      baseline (gate is the only change) over three seeds: the combined
      method beat MemSkill on LoCoMo and LongMemEval LLM-judge scores and
      ALFWorld success rate; a K-controlled ablation showed the baseline
      gate's six accepted skills were collectively -1.38 pp; masking
      improved all six trained banks on HotpotQA-50 (avg 7.17 pp for
      MemSkill banks, 3.59 pp for CASS banks), and retrieval-quality scores
      correlated with label-based rankings at rho=+0.76 versus -0.18 for a
      policy-entropy signal.. [truncated]
