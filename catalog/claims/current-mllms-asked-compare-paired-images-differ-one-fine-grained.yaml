id: current-mllms-asked-compare-paired-images-differ-one-fine-grained
ref: CLM-0988
capability: explanation-faithfulness
technique: amplify-visual-attention-damp-ffn-overrides-vision
statement: >-
  For current MLLMs asked to compare paired images that differ in one
  fine-grained edit, logical self-contradiction between symmetric binary
  queries ("same?"/"different?") rises as the edited region gets smaller,
  and on multi-difference pairs high detection of that a difference exists
  coexists with reasoning traces that are not grounded in the actual edit,
  so correct detection does not indicate faithful stated reasoning.
kind: observation
backing_strength: single-paper
observed_on:
  era: "12 open and proprietary MLLMs on a 3,000-pair image-difference benchmark with controlled color, removal and position edits; difficulty stratified by instance density"
sources:
  - source: arxiv-2602-07833
    stance: supports
    note: >-
      Validated by: On SPD-Faith Bench with Qwen2.5-VL-7B, contradiction
      rate 38.2 to 43.8 and difference-reasoning faithfulness 29.5 to 33.7
      versus greedy, above VCD, self-consistency, self-refine, API and
      Zoom-Refine; also higher MME totals on LLaVA-1.5-7B and Qwen2-VL-7B
      and lower CHAIR_s/CHAIR_i on LLaVA-1.5-7B.. Measured: contradiction
      rate across easy/medium/hard for 12 models (e.g. Claude-4.5-Haiku 16.5
      to 37.5, GPT-4o 5.0 to 22.8) and DS vs DRF on the multi-difference
      subset (GLM-4.5V 92.5 DS, 58.3 DRF). Trend is clearest in proprietary
      models; [truncated]
