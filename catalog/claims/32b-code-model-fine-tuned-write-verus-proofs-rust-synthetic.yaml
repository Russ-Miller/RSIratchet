capability: formal-math
technique: combine-self-synthesis-tutorial-guided-coverage-agent-cot
statement: >-
  For a 32B code model fine-tuned to write Verus proofs for Rust, synthetic
  data scaled by self-synthesis plus tutorial-guided feature coverage and
  long agent-trajectory CoT data improve different task classes: the bulk
  synthetic data carries small algorithmic proof tasks while the few
  thousand agent CoT traces carry real-world system proof tasks, and neither
  part alone matches the combination.
