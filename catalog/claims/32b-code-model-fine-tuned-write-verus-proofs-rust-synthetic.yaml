    note: >-
      Validated by: Accuracy@100 and @600 (with 5 debugging rounds) on
      VeruSAGE-Bench and VerusBench against the raw Qwen model and Qwen
      fine-tuned on SAFE and AlphaVerus data, plus o4-mini and Claude Sonnet
      4.5; VeruSAGE-Bench total 39%/49% vs 15%/20% for Part-1 only and
      35%/41% for Part-2 only, while on VerusBench Part-1 only (79%/84%)
      exceeded the combined data (75%/83%).. Measured on two held-out
      benchmarks with data-leakage exclusion of the three systems used for
      CoT collection; [truncated]
