statement: >-
  On research-level theorem-proving tasks drawn from recent FOCS/STOC/SODA
  papers, wrapping a frontier model in a staged harness that explores
  strategies, gates when to decompose, solves section-level subproblems
  along a dependency graph, and routes verifier findings back to the
  affected section raises graded proof accuracy far above prompting the same
  model directly (30.3% to 54.0% for Gemini 3.1 Pro on TCS-Bench), and two
  such runs with different backbones make complementary errors, so selecting
  between them by sampled critiques reaches 71.0% against an oracle ceiling
  of 77.3%.
