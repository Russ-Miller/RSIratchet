      averaged 96.2% success versus 81.4% for zero-delay RLPD and 14.5-34.5
      points above delayed DSRL/EXPO-FT variants; on four real robot tasks
      it averaged 29/30 versus 25/30 for EXPO-FT w/ RTC and 12.5/30 for SFT,
