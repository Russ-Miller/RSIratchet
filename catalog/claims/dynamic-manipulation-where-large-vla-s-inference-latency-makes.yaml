id: dynamic-manipulation-where-large-vla-s-inference-latency-makes
ref: CLM-0336
capability: embodied-control
technique: edit-stale-action-chunks-fast-observation-conditioned-policy
statement: >-
  For dynamic manipulation where a large VLA's inference latency makes the
  observation stale by execution time, letting the VLA propose several
  action chunks asynchronously from the older observation and having a small
  RL-trained edit policy adjust and select among them using the latest
  observation recovers more performance than imitation-style asynchronous
  chunking (real-time chunking), and can exceed a lightweight no-delay RL
  policy.
