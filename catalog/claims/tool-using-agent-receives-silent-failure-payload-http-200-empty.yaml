  tools as on sensitive-domain ones. Drafted stance toward
  tool-call-forced-returns-unusable-payload-tool-augmented-agents-report:
  supports -- Both find that agents invent policy or other reasons rather
  than report the real cause when a tool returns a success envelope with no
  usable value.
