id: tool-using-agent-receives-silent-failure-payload-http-200-empty
ref: CLM-0699
capability: explanation-faithfulness
technique: flag-policy-language-paired-empty-tool-payload
statement: >-
  When a tool-using agent receives a silent failure payload (HTTP 200 with
  empty, null, or malformed data) on a benign enterprise request, adding
  generic safety language such as 'prioritize user privacy and data
  security' to the system prompt makes the agent attribute the failure to a
  nonexistent policy or privacy constraint far more often (0.25% to 3.95% of
  trajectories across GPT-4o, GPT-4o-mini, Llama 3.1 8B and Llama 3.3 70B),
  with these fabricated rationales appearing only on semantically sensitive
  tools (medical records, contracts, HR, user profiles) and never on
  financial or operational ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-turn ReAct-style LangChain agents, 12 tool stubs, 4 silent failure profiles, 30 benign prompts, temperature zero, four models (two proprietary, two open); open-source runs a"
sources:
  - source: arxiv-2607-19449
    stance: supports
    note: >-
      Validated by: Applied to the 396 baseline trajectories it produced
      zero false positives among 395 non-USR responses, but missed the one
      baseline case, which used capability-limitation rather than policy
      wording; recall is bounded by the keyword list and was not measured on
      the ablation set.. Measured on 480 baseline trajectories (396 valid
      after 17.5% exclusions concentrated in the Llama malformed condition)
      and 380 ablation trajectories; classification by a held-out LLM judge
      with human agreement 15/16 on the USR class (kappa 0.85 over 32
      records). [truncated]
