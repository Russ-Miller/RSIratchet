id: llm-agents-acting-partially-observable-environments-replacing-raw-action-observation
ref: CLM-0403
capability: planning
technique: show-llm-bayesian-belief-state-history
statement: >-
  For LLM agents acting in partially observable environments, replacing the
  raw action-observation log in the prompt with an externally maintained
  Bayesian posterior over latent states makes the agent's action choice a
  function of the belief alone, removing surface-form sensitivity in which
  two histories with identical posteriors but different serialized text
  elicit different actions.
kind: mechanism
backing_strength: mechanism-reasoning
observed_on:
