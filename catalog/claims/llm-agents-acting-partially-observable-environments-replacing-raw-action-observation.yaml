    stance: supports
    note: >-
      Validated by: Paired-seed comparison on Tiger POMDP and a red-team
      attack graph against a reactive LLM and a natural-language belief
      tracker, with task return, Brier/NLL/entropy calibration, and a
      decision-consistency JSD between belief-equivalent history pairs; on
      Tiger the BSE agent reached 38/40 success vs 32/40 reactive, but only
      40 seeds, one sampling seed, and CoT/ReAct/QMDP/POMCP were not run..
      Mostly argued: the sufficiency/soundness result is a proof under four
      stated axioms, not an empirical finding. [truncated]
