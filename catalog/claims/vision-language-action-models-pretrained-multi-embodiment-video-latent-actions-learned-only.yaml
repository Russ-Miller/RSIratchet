id: vision-language-action-models-pretrained-multi-embodiment-video-latent-actions-learned-only
ref: CLM-0410
capability: embodied-control
technique: add-3d-end-effector-point-cloud-latent-actions
statement: >-
  For vision-language-action models pretrained on multi-embodiment video,
  latent actions learned only from RGB frame pairs miss finger-level
  end-effector articulation, and adding a shared discrete latent over 3D
  end-effector point-cloud transitions improves fine-grained motion probing
  and downstream manipulation success, but only when the geometric latent is
  forced to encode motion rather than morphology (shared bimanual code,
  pair-consistent augmentation, bidirectional transitions).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Manipulation policies co-trained across human hands, dexterous robot hands and parallel-jaw grippers, where end-effector geometry is recoverable from hand reconstruction or URDF fo"
sources:
  - source: arxiv-2609-21948
    stance: supports
    note: >-
      Validated by: Frozen-latent MLP probing of end-effector
      translation/rotation/finger angle error on a held-out XHand split;
      cross-embodiment grasp/hold/release retrieval (R@1 45.67 vs 33.37
      without point clouds, 38.69 without the unification designs); RoboCasa
      GR-1 24-task success (55.7% vs 50.9% image-only, 54.4% without
      unification; 68.3% under multi-embodiment co-training); 4 real tasks,
      50 trials each (75.5% vs 68.5% without unification, 71.5% HARP-VLA)..
