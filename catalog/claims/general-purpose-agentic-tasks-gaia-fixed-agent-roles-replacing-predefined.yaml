id: general-purpose-agentic-tasks-gaia-fixed-agent-roles-replacing-predefined
ref: CLM-1089
capability: multi-model-coordination
technique: orchestrate-agents-live-information-flow-fixed-workflow
statement: >-
  For general-purpose agentic tasks (GAIA) with fixed agent roles, replacing
  a predefined workflow router with an orchestrator agent that monitors
  progress and issues natural-language instructions over an agent-to-agent
  message toolkit gives no accuracy gain when every agent runs a strong
  model, and gains only when the worker agents run a weaker model than the
  orchestrator.
kind: observation
backing_strength: single-paper
observed_on:
  era: "GAIA validation set (165 tasks), pass@1, temperature 0, identical agent roles (planner, web, document, reasoning/coding) and models across both systems; baseline is a reimplemented"
sources:
  - source: arxiv-2601-09883
    stance: supports
    note: >-
      Validated by: Pass@1 accuracy on GAIA validation (165 tasks) against a
      reimplemented OWL workflow baseline with matched roles and models,
      plus token-consumption CDFs: equal overall accuracy (64.24%) when all
      agents use Grok 4.1 Fast at slightly higher token cost, and 63.64% vs
      55.15% when worker agents use GPT 4.1 Mini.. Two configurations on one
      benchmark with one baseline system, single runs at temperature 0, no
      seed variance or confidence intervals reported. The parity result in
      the homogeneous setting is the paper's own data and is what scopes the
      claim; [truncated]
