id: manipulation-policies-diffusion-policy-vla-backbones-trained-few-demonstrations-decomposing
ref: CLM-0654
capability: embodied-control
technique: store-moe-gating-profiles-retrievable-skill-memory
statement: >-
  For manipulation policies (diffusion-policy and VLA backbones) trained on
  few demonstrations, decomposing trajectories implicitly via a
  Mixture-of-Experts gate and storing the per-segment gating profiles as
  retrievable memory, then blending retrieved profiles into the current
  gating distribution at inference, raises success most on unseen
  object-receptacle recombinations rather than on in-distribution tasks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "LIBERO suites, Push-T/BlockPush/Kitchen, and five real UR5e tasks with ~50 demonstrations each; gains are small in-distribution (e.g. 96.8% to 98.0% over pi-0.5) and larger on cros"
sources:
  - source: arxiv-2608-05970
    stance: supports
    note: >-
      Validated by: Task success rate against the unmodified backbone and
      prior memory-augmented VLAs on LIBERO (four suites), three DP control
      benchmarks, and 40 real-robot rollouts per task; ablation separates
      segmentation alone from segmentation plus memory.. Measured on one
      benchmark family plus one real robot; ablations report
      segmentation-only versus segmentation-plus-memory, and a cross-suite
      zero-shot table. No matched-parameter control (SkillMemo adds
      parameters), no random-retrieval control, and real-world results are
      40 trials per task from one lab.
contested: false
status: pending-review
last_checked_at: 2026-10-28
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
