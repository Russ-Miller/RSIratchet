id: black-box-rag-pipelines-accepting-or-rejecting-each-generated-semantic
ref: CLM-0593
capability: hallucination
technique: accept-or-reject-each-generated-unit-semantic-gain
statement: >-
  In black-box RAG pipelines, accepting or rejecting each generated semantic
  unit by whether it raises a clustering-based mutual information score
  against a trusted context set — rather than appending the whole retrieved
  context to the prompt — raises answer accuracy and lowers API cost on
  TruthfulQA, HaluEval and HotPotQA, at the price of higher latency from the
  clustering step.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Tested with GPT-5-nano and Llama-3.1-8B inside a three-agent framework on three QA benchmarks; depends on the trusted context set actually covering the answer, since the method onl"
sources:
  - source: arxiv-2605-27706
    stance: supports
    note: >-
      Validated by: Accuracy, hallucination rate, latency and dollar cost
      versus a standard RAG pipeline on TruthfulQA, HaluEval and HotPotQA
      with two backbones; accuracy rose (e.g. 0.356 to 0.556 on TruthfulQA
      with GPT-5-nano) and cost fell, while latency rose.. Measured on three
      QA benchmarks with two models, but the RAG baseline has no reported
      hallucination rate, 'accuracy' is an epsilon-neighborhood match to
      ground truth whose threshold is not given, and there is no ablation
      separating the accept-reject rule from the extra generation rounds it
      buys.
contested: false
