id: lora-ensemble-credal-commitment-rules-7-9b-instruct-backbones-decision-commit
ref: CLM-0642
capability: abstention-and-self-knowledge
technique: abstain-unless-one-answer-dominates-lora-ensemble-s
statement: >-
  For LoRA-ensemble credal commitment rules on 7-9B instruct backbones, the
  decision to commit tracks agreement among the adapters rather than whether
  a request should be answered: on AdvBench harmful prompts the ensembles
  commit more often (33-97%) and with higher lower-bound confidence than on
  benign Dolly instructions, because safety training makes refusal the
  unanimous first continuation.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Llama-3.1-8B, Gemma-2-9B, Qwen2.5-7B with five CoQA-trained LoRA adapters; 250 harmful vs 250 benign prompts; short-answer settings."
sources:
  - source: arxiv-2608-23244
    stance: supports
    note: >-
      Measured on one 250+250 prompt split per backbone, three backbones,
      with the base model's entropy as comparison (also inverted). Single
      dataset pair; no variation of safety-training strength, so the
      mechanism (unanimous refusal continuation) is argued from the pattern
      rather than isolated.
