id: cross-application-saas-workflows-averaging-over-100-ui-steps-weighted
ref: CLM-0828
capability: long-horizon-execution
technique: stratify-checkpoint-pass-rates-position-task
statement: >-
  In cross-application SaaS workflows averaging over 100 UI steps, weighted
  partial-credit checkpoint scores overstate what agents can actually
  finish: across 14 frontier models the best overall checkpoint score was
  about 44% while the best end-to-end resolved rate was under 4%, and every
  model's checkpoint pass rate declines monotonically from early to late
  positions within a task.
kind: observation
backing_strength: single-paper
observed_on:
  era: "106 tasks over 23 locally deployed open-source SaaS systems, browser-only action space, environment reset before each run, checkpoints verified by state checks, content checks and "
sources:
  - source: arxiv-2605-15777
    stance: supports
    note: >-
      Validated by: Applied to trajectories of the evaluated models; all
      models showed a monotonic early-to-late decline, and the authors use
      this to explain the large checkpoint-versus-resolved gap. Not
      validated as improving agent performance, only as a diagnostic..
      Measured over 106 tasks and 14 models with per-checkpoint
      verification; the position-stratified decay is reported for all
      evaluated models and the complexity analysis shows scores falling with
      trajectory length and checkpoint count. [truncated]
