id: audio-language-models-describing-music-hallucination-gains-measured-binary-yes
ref: CLM-0574
capability: hallucination
technique: evaluate-hallucination-mitigation-across-probing-free-form-structured
statement: >-
  For audio-language models describing music, hallucination gains measured
  by binary yes/no probing do not transfer to open-ended description:
  contrastive audio-dependency decoding raised free-form hallucination rates
  for all four open-source models tested even while improving probing
  accuracy, and structured-query accuracy moved in opposite directions
  across models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine audio-language models (four open-source 7B-class, five API) on 440 MusicCaps clips plus IRMAS; mitigations only evaluated on the open-source four, which expose logits."
sources:
  - source: arxiv-2609-20195
    stance: supports
    note: >-
      Validated by: Paired exact-prompt comparisons of ADD-M v1/v2 and TPA
      on four open-source models: probing accuracy gains of +1.0 to +4.7 pp
      coexisted with higher free-form hallucination rates for all four, and
      structured accuracy improving for only one; cross-paradigm rank
      correlations were weak (Disc.-Free rho 0.17, Free-Struct. rho 0.18)..
      Measured across nine models with bootstrap CIs; mitigation deltas are
      paired but only on four open-source models and reported partly in
      appendix. [truncated]
