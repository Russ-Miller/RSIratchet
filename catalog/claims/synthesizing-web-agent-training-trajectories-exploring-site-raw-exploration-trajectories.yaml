id: synthesizing-web-agent-training-trajectories-exploring-site-raw-exploration-trajectories
ref: CLM-0859
capability: tool-use
technique: re-execute-explored-tasks-exploration-trace-hint
statement: >-
  When synthesizing web-agent training trajectories by exploring a site, the
  raw exploration trajectories are poor SFT supervision compared with
  trajectories re-executed by a task-focused agent using the exploration
  trace as a hint: on WebArena Reddit, fine-tuning Qwen2.5-VL-7B on
  exploration data alone scored 11.54% versus 34.62% on refined data.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Web GUI agents fine-tuned by SFT on synthesized trajectories; exploration uses a restricted action space (e.g. no scrolling) that omits actions real tasks need."
sources:
  - source: arxiv-2604-27253
    stance: supports
    note: >-
      Validated by: WebArena task-completion accuracy after fine-tuning
      Qwen2.5-VL-7B-Instruct: 24.23% overall vs 19.59% for SynthAgent,
      13.40% OS-Genesis, 4.64% Explorer, 9.36% untuned base; ablation on
      Reddit gives 34.62% refined vs 11.54% exploration-only.. Measured on
      WebArena with one task per template (57/56/26/55 tasks across four
      sites), single backbone family, single refinement agent. The
      exploration-vs-refined ablation is one website only (Reddit, 26
      tasks), so the 23-point gap rests on a small sample. [truncated]
