notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On the same models,
  hallucinated and non-hallucinated token distributions of the
  ablation-derived signal overlap (no spike separation), or a probe-scored
  beam search fails to beat greedy/DoLa/ActLCD on TruthfulQA T*I and
  FActScore. Proposed technique, not catalogued: attribution-signal beam
  scoring from a factual-salient MLP span.
