id: multi-turn-search-agents-trained-rl-correctness-along-trajectory-non-monotonic
ref: CLM-1180
capability: long-horizon-execution
technique: resample-prefix-train-outcome-divergent-branches
statement: >-
  In multi-turn search agents trained by RL, correctness along a trajectory
  is non-monotonic — the same intermediate prefix can lead to success or
  failure depending on the continuation — so supervision that resamples
  continuations from a shared late-stage prefix and keeps only
  outcome-divergent pairs gives better credit assignment than uniform
  outcome rewards or state-value process rewards.
