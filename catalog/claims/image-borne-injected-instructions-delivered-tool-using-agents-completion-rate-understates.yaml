id: image-borne-injected-instructions-delivered-tool-using-agents-completion-rate-understates
ref: CLM-0348
capability: prompt-injection
technique: report-attempted-recognized-rates-just-completion
statement: >-
  For image-borne injected instructions delivered to tool-using agents,
  completion rate understates exposure: agents act on the injected
  instruction about ten times more often than they complete the objective
  (12.8% attempted vs ~1% completed across 720 runs), and most failures stop
  at the planning step where the model read the payload and simply did not
  act on it rather than at any architectural barrier.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six agent frameworks, five frontier multimodal models, six visual carriers, four attacker objectives, mock tools, one run per cell at temperature zero; benign task is read-and-desc"
sources:
  - source: arxiv-2609-09404
    stance: supports
    note: >-
      Validated by: Applied across 720 runs; attempts (12.8%) exceeded
      completions (1.11%) by an order of magnitude and stage labels
      separated perception-stage refusals (170) from unexplained
      planning-stage non-action (303), distinctions the completion metric
      collapses. No independent validation of the judge panel against human
      labels in this paper (voting rule borrowed from prior work).. Measured
      over 720 runs with deterministic completion checks plus a three-model
      judge panel for attempt labels. Confounds the authors state: 159 cells
      re-executed, all in two frameworks; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-09-24
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An evaluation with
  per-stage traces where attempted and completed rates are close, or where
  non-completing runs are shown to be blocked by a harness barrier rather
  than by the model declining at planning.
