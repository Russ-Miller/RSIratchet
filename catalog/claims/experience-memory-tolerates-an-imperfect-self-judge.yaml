id: experience-memory-tolerates-an-imperfect-self-judge
ref: CLM-0517
capability: harness-self-improvement
technique: distilled-experience-memory
statement: >-
  When an agent labels its own past attempts as successes or failures to
  build an experience memory, the labels can be substantially wrong without
  much cost: the LLM judge used was 72.7% accurate against ground truth on
  WebArena-Shopping, and simulating judges anywhere from 70% to 90% accurate
  gave similar success rates, with ground-truth labels best — so for
  distilling lessons, a rough self-judgment is close to enough, although a
  perfect one still helps.
kind: observation
backing_strength: single-paper
observed_on:
  era: "2025, Gemini-2.5-flash as judge, one WebArena subset"
  task_type: autonomous-agent
conditions:
  effect: narrows
  fails_when: >-
    Judge accuracy falls below about 70%, the bottom of the range found
    harmless; the simulation flips labels at random, so a judge whose errors
    are systematic rather than random is not covered.
sources:
  - source: arxiv-2509-25140
    stance: supports
    note: >-
      Figure 8 and its text: judge calibrated against ground truth at 72.7%,
      then labels flipped at random to simulate 50% to 100% accuracy. One
      subset, random rather than systematic errors.
contested: false
status: pending-review
last_checked_at: "2026-10-19"
notes: >-
  Bears on the adage that no one should judge their own cause, which holds
  for judging a single output: for distilling lessons across many
  attempts, a self-judge's errors appear to average out. The scope
  condition is the random-error simulation; a judge with a consistent
  blind spot would write the same wrong lesson every time.
