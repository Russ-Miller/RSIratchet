    stance: supports
    note: >-
      Validated by: Syntactic validity and consistency Pass@1/Pass@16 across
      benchmarks against no-tool and prior formalizer baselines; judge-panel
      false-positive rate measured against human labels.. Consistency is
      judged by models, which the paper partly validates; the gain from tool
      feedback is large and ablated, which is the useful part.
