id: autoformalization-problem-statements-into-lean-4-improves-sharply-formalizer
ref: CLM-0294
capability: formal-math
technique: tool-feedback-autoformalization-compiler-judge-panel
statement: >-
  Autoformalization of problem statements into Lean 4 improves sharply when
  the formalizer can call the Lean compiler for syntax and a multi-model
  judge panel for meaning and revise on the feedback: a 32B model's
  consistency Pass@1 on CombiBench rose from about 24% without tools to
  about 65% with them, and an 8B distilled version reached about 91% on
  FormalMath-Lite, with the judge ensemble holding false-positive
  consistency below 6%.
kind: observation
backing_strength: single-paper
observed_on:
  era: "ATF-32B and ATF-8B-Distilled, Lean 4, FormalMath-Lite, CombiBench and similar, 2025; consistency judged by an LLM panel; cold-start, expert iteration and DPO training."
sources:
