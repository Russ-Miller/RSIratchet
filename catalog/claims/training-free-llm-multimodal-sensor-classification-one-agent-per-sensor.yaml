id: training-free-llm-multimodal-sensor-classification-one-agent-per-sensor
ref: CLM-1269
capability: multi-model-coordination
technique: arbitrate-between-semantic-majority-vote-fusion-per-modality
statement: >-
  For training-free LLM multimodal sensor classification with one agent per
  sensor modality, LLM semantic aggregation of the agents' rationales and
  majority voting over their predictions fail under opposite conditions —
  semantic fusion overweights modalities its prior knowledge treats as
  authoritative, while majority voting collapses as modalities go missing —
  so a final agent that arbitrates between the two outputs degrades far less
  under missing sensors than voting alone.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Five classification benchmarks (WESAD, SleepEDF, ActionSense, MMFit, PAMAP2) with hand-crafted sensor features, text-only 1-shot prompts, open backbones 8B-120B; classification onl"
sources:
  - source: arxiv-2601-06453
    stance: supports
    note: >-
      Validated by: Accuracy on five sensing benchmarks against a
      single-agent concatenated-feature prompt (+7.1% average),
      self-consistency, self-refine, and four multi-agent debate methods
      (matches best debate baseline ReConcile, 72.3% vs 72.7%, at 12.7x
      fewer fusion tokens); robustness measured under 10/30/50% random
      modality omission, where hybrid beats statistical-only fusion by 9.1
      and 18.4 points at 30% and 50%.. Measured on five benchmarks with four
      backbones. [truncated]
