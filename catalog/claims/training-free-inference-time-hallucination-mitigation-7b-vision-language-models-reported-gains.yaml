  weight. Drafted confidence: medium. Falsifier as drafted: A mitigation
  method that lowers CHAIR/AMBER hallucination while holding or raising
  object recall and coverage, and does not degrade MMStar fine-grained
  perception and reasoning, across several models. Automatic check
  flagged: figures not in the source: 16. Proposed technique, not yet
