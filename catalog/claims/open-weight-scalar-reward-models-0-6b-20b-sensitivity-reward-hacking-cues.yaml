    note: >-
      Validated by: Gold-preference rate on a held-out split of
      RewardHackBench (967 pairs, 13 subcategories) and on RM-Bench Hard,
      across eight reward models, against the unedited model and two
      data-augmented fine-tuning baselines (3:1 and 5:1 mixtures); reported
      +21.1 points on target subcategories over base and +13.7 over the
      stronger fine-tune, +2.4 on RM-Bench; component ablation compares
      style-only, style-orthogonal-only, and joint removal (+16.67 pp joint
      vs -0.81 and +5.32 mean).. [truncated]
