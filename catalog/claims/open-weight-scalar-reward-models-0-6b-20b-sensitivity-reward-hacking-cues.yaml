id: open-weight-scalar-reward-models-0-6b-20b-sensitivity-reward-hacking-cues
ref: CLM-0707
capability: reward-hacking
technique: subtract-hacking-subspace-reward-head
statement: >-
  In open-weight scalar reward models (0.6B-20B), sensitivity to
  reward-hacking cues sits in a multi-directional residual-stream subspace
  rather than a single style or category feature, so subtracting the
  reward-head vector's projection onto a subspace spanned by several
  per-category hacking directions raises gold-preference rates on targeted
  hacking patterns more than removing either the shared style direction or
  the style-orthogonal residual alone.
