statement: >-
  Prompt-injection defenses that score well on existing benchmarks largely
  do so by isolating or rejecting contextual inputs, so they lose that
  protection or lose utility on context-dependent agent tasks where the
  agent is authorized to act on runtime observations (config files,
  conditional logic over tool output).
