id: current-video-llms-asked-apply-procedural-knowledge-tutorial-video-real-time
ref: CLM-0571
capability: video-temporal-reasoning
statement: >-
  For current video-LLMs asked to apply procedural knowledge from a tutorial
  video to a real-time question about a later target video, the accuracy
  gain from having seen the tutorial largely disappears once unrelated
  distractor video separates the two by up to two hours, and the decay grows
  with the gap.
kind: observation
backing_strength: single-paper
observed_on:
  era: "5-option multiple-choice questions over merged YouTube instructional streams of 10 minutes to 2 hours, post-2025 videos, 11 open and proprietary video-LLMs, tutorial knowledge veri"
sources:
  - source: arxiv-2607-11312
    stance: supports
    note: >-
      Measured on 2,261 human-audited QA pairs across three paradigms (no
      tutorial, adjacent tutorial, tutorial behind distractors). Gains over
      baseline fell from ~15-30 points adjacent to 0.6-2.5 points at long
      gap for GPT-5.2, GPT-4o, Qwen3-Omni, VideoLLaMA3, Qwen3-VL and PEMF;
      Gemini 3.1 Pro and some streaming/audio-visual models retained 14-16
      points, so the collapse is not universal. Decay curves shown for only
      two models. Baseline is the same model without the tutorial, which
      isolates the memory effect from task difficulty.
contested: false
status: pending-review
last_checked_at: 2026-10-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A video-LLM whose
  tutorial-derived accuracy gain at a two-hour gap is close to its gain with
  the tutorial immediately adjacent, on this or a comparable benchmark.
  Drafted stance toward
  holding-task-fixed-only-lengthening-input-degrades-reasoning: supports --
  Holding the question and tutorial fixed and only inserting distractor
  video degrades the model's use of the tutorial, long before input limits
  are reached.
