id: audio-aware-llms-multiple-choice-audio-understanding-reasoning-benchmarks-semantic-level-uncertainty
ref: CLM-0807
capability: abstention-and-self-knowledge
statement: >-
  For audio-aware LLMs on multiple-choice audio understanding and reasoning
  benchmarks, semantic-level uncertainty (semantic entropy, discrete
  semantic entropy) and self-verification P(True) separate correct from
  incorrect answers better than token-level predictive or length-normalized
  entropy, but that ordering becomes model- and benchmark-dependent on
  hallucination and unanswerable-question benchmarks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three ALLMs (Qwen2.5-Omni-3B/7B, Audio Flamingo 3), constrained answer spaces, 10 samples at temperature 1.0, AUROC/AURAC metrics; not tested on open-ended audio generation."
sources:
  - source: arxiv-2604-25591
    stance: supports
    note: >-
      Measured AUROC and AURAC across four reasoning benchmarks (MMAU, MMAR,
      MMSU, SAKURA) and two trustworthiness benchmarks (AQUA-Bench,
      Audio-Hallucination) for three models; on reasoning sets
      semantic/discrete-semantic/P(True) take nearly every best-AUROC cell,
      while on AQUA-Bench and Hallucination the winner rotates (P(True) for
      7B, normalized entropy for 3B and Audio Flamingo 3). No statistical
      testing of the differences, and only three models, so the instability
      could itself be sampling noise.
contested: false
status: pending-review
last_checked_at: 2026-11-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: On further ALLMs and
  comparable audio reasoning benchmarks, predictive or length-normalized
  entropy matching or beating semantic entropy and P(True) on AUROC, or
  semantic/verification methods holding a stable lead on hallucination and
  unanswerable-question benchmarks across models.
