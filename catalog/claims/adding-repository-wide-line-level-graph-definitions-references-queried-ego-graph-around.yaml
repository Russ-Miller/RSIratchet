id: adding-repository-wide-line-level-graph-definitions-references-queried-ego-graph-around
ref: CLM-0261
capability: repository-navigation
technique: repository-code-graph-navigation-plug-in
statement: >-
  Adding a repository-wide line-level graph of definitions and references,
  queried for the ego-graph around names the model is looking at, raised
  SWE-bench resolve rates for all four frameworks it was plugged into (two
  agentic, two procedural) by an average of about 33% relative, at a modest
  cost increase that was larger for the agentic ones; the same plug-in also
  helped on CrossCodeEval.
kind: observation
backing_strength: single-paper
observed_on:
  era: "SWE-bench Lite with GPT-4o and similar, 2024; frameworks Agentless, RAG, SWE-agent and AutoCodeRover; ego-graph depth k=1 or 2."
sources:
  - source: arxiv-2410-14684
    stance: supports
    note: >-
      Validated by: Resolve rate and cost on SWE-bench Lite for each of four
      frameworks with and without the plug-in; ablation over ego-graph
      depth; secondary test on CrossCodeEval code completion.. Gains are
      consistent across four frameworks, which is the strength of the paper,
      but end-to-end resolve rate is the only metric, so the improvement is
      attributed to navigation by argument rather than by a localization
      measurement.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
