id: multi-year-authentic-personal-photo-video-archives-turned-into-memory
ref: CLM-0443
capability: long-term-memory
technique: weight-profile-attributes-temporal-stability
statement: >-
  On multi-year authentic personal photo/video archives turned into memory
  streams, frontier multimodal models and structured memory systems recall
  facts and infer persona far better than they predict a user's future
  choices: predicting or recommending in novel contexts caps around 59 on a
  0-100 scale for every system tested, and compressing the history ~70x into
  a memory system costs nothing on that tier while costing a lot on factual
  recall, so predictive personalization is limited by preference
  representation rather than by retrieval or context length.
kind: observation
backing_strength: single-paper
observed_on:
  era: "ReaLMem: 2,508 sessions from 7 participants over 6+ years, 1,629 QA pairs; readers Gemini-3.0-Flash, GPT-4.1-mini, GPT-5.4-mini; memory systems Mem0, MemOS, EverMemOS on a shared G"
sources:
  - source: arxiv-2609-19167
    stance: supports
    note: >-
      Validated by: Swapped into EverMemOS's pipeline with retrieval and
      backbone fixed: beat full context on persona inference for all three
      readers (+0.6/+4.0/+4.3) and matched or beat it on prediction
      (0.0/+3.5/+1.8) at ~6k tokens vs ~123k; ablating the stability
      weighting lowered persona inference for all readers but raised
      open-ended assistance by about 2.4 points. Measured on one benchmark
      with 7 participants; [truncated]
