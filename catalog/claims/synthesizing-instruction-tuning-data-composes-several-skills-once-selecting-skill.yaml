id: synthesizing-instruction-tuning-data-composes-several-skills-once-selecting-skill
ref: CLM-1077
capability: procedure-following
technique: pick-skill-combinations-entropy-gain-inside-skill-hierarchy
statement: >-
  When synthesizing instruction-tuning data that composes several skills at
  once, selecting skill combinations that maximize marginal
  structural-entropy gain within a locally constrained region of an induced
  skill hierarchy yields higher complex-instruction-following scores for
  7-8B models than random skill pairing, and unconstrained entropy
  maximization over the whole skill space degrades already-instruction-tuned
  models below their starting point.
