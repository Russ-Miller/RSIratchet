id: llms-forecast-geopolitical-events-whose-facts-involve-more-than
ref: CLM-1120
capability: forecasting
technique: keep-multi-entity-events-one-fact-reified-edges
statement: >-
  When LLMs forecast geopolitical events whose facts involve more than two
  primary entities, keeping each multi-entity event as a single fact with
  actor and recipient sets in the prompt gives higher relation- and
  link-prediction accuracy and much lower inference time than reifying the
  same event into a node plus role-specific binary edges.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Geopolitical event forecasting over POLECAT-derived data (htkgh-polecat), 4B-20B open LLMs, 100 retrieved historical facts per query; roughly a quarter of facts are multi-entity gr"
sources:
  - source: arxiv-2601-00430
    stance: supports
    note: >-
      Validated by: Relation-prediction accuracy and link-prediction Jaccard
      against reified HTKG on the same underlying data with matched
      information per query: +4.7 points relation accuracy and ~56.8% lower
      inference time with Qwen3-4B-Thinking-2507; up to +21.29%
      link-prediction performance and ~57.3% lower inference time with
      gemma-3-12b-it and Qwen3-4B-Thinking. Fully decomposed HTKG could not
      be run at all, exceeding the 32k context at 100 contextual facts..
      Measured on one dataset built by the authors, one event database, and
      a handful of open 4B-20B models; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-22
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
