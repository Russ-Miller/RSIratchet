id: 8b-instruct-backbones-training-correction-adapter-first-name-typed
ref: CLM-0351
capability: self-repair
technique: correct-reasoning-inverting-named-typed-error-operator
statement: >-
  For 8B instruct backbones, training a correction adapter to first name a
  typed, executable error operator (error type, step location, corrupted and
  repaired proposition) and then apply its inverse to the trace improves
  accuracy more than free-form self-revision methods (Self-Refine, RISE,
  SCoRe) on math, code and commonsense benchmarks, and most of the gain
  arrives in the first few denoising iterations.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "8B instruct backbones (Llama-3-8B-Instruct, Qwen3-8B), a fixed operator library, a few thousand training transition pairs; gains smallest on factual multiple-choice (MMLU) and loca"
sources:
  - source: arxiv-2608-22090
    stance: supports
    note: >-
      Validated by: Six in-domain benchmarks (GSM8K, MATH, HumanEval+, MBPP,
      MMLU, PIQA) on a common Llama-3-8B-Instruct backbone: average 67.5 vs
      64.3 for the strongest baseline (DiffCoT) and 63.7 for SCoRe, over
      five seeds with Holm correction; seven cross-dataset transfer targets
      on two backbones; ablations show operator-only and adjacent-state-only
      objectives both lose points.. Measured on 13 datasets with one author,
      single paper, 8B models only; baselines run from official code with
      shared prompts and extractors; [truncated]
