id: knowledge-graph-guided-multi-agent-hypothesis-generation-materials-design-retrieving-only-single
ref: CLM-1097
capability: multi-model-coordination
technique: vary-graph-traversal-breadth-depth-tune-hypothesis-scope
statement: >-
  In knowledge-graph-guided multi-agent hypothesis generation for materials
  design, retrieving only the single shortest path between design-keyword
  nodes gives the downstream synthesizing agent too little context — paths
  collapse into self-referential or context-free edges — while retrieving
  the top-N shortest paths or depth-limited DFS branches yields proposals
  spanning more property domains.
