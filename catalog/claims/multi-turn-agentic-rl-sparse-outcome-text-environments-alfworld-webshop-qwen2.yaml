id: multi-turn-agentic-rl-sparse-outcome-text-environments-alfworld-webshop-qwen2
ref: CLM-0102
capability: long-horizon-execution
statement: >-
  For multi-turn agentic RL on sparse-outcome text environments (ALFWorld,
  WebShop) with Qwen2.5-1.5B/7B-Instruct, reading state and action values
  from two reserved vocabulary logits at the causal boundaries of the
  policy's own backbone, and assigning credit with turn-level GAE plus batch
  normalization, raises task success over PPO with a separate critic and
  over GRPO while sampling only one rollout per task.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two text environments, two Qwen2.5-Instruct sizes, three seeds, 150 training steps, sparse terminal rewards; aggregate gains only — not best in every task category, and recent grou"
sources:
  - source: arxiv-2608-19842
    stance: supports
    note: >-
      Measured success rates on ALFWorld (six categories plus aggregate) and
      WebShop score/success, mean and std over three seeds, against PPO,
      GRPO, RLOO, EMPG, GiGPO and prompting baselines; most baseline numbers
      are taken from prior work rather than rerun. Runtime breakdown shows
      451.2s to 301.4s per iteration. No matched-compute comparison against
      GRPO with equal total rollouts, and the ablation contributions are not
      quantified in the given text.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Training the same method on
  other multi-turn environments or model families and finding it does not
  beat a tuned PPO/GRPO baseline at equal compute, or finding the gain comes
  from the turn-level advantage normalization alone rather than the shared
  value readout. Proposed technique, not catalogued: Shared-backbone value
  readout at causal boundaries with turn-level GAE.
