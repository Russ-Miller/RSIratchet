id: long-context-tasks-built-8k-128k-token-un-reports-six-languages-12
ref: CLM-0428
capability: long-context-degradation
statement: >-
  On long-context tasks built from 8K-128K-token UN reports in six
  languages, 12 current LLMs score high on word-level extraction QA and much
  lower as the required output unit coarsens to sentence, paragraph and
  document, and the familiar middle-of-context dip appears only at word and
  paragraph level — on sentence-cloze, accuracy peaks for mid-document
  targets because mid-paragraph sentences carry surface cues (repeated
  entities, connectives) the models follow instead of discourse role.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Zero-shot evaluation of 12 long-context LLMs on UN report tasks (word QA, sentence cloze, paragraph filling, summarization, translation) across Arabic, Chinese, English, French, Ru"
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured on 420 query-response pairs per task per language over 12
      models, with human plus LLM-judge error analysis of cloze failures.
      The granularity comparison is confounded by different metrics per
      level (accuracy vs ROUGE-L vs BLEU), so the coarse-grained drop is
      partly a scoring artifact; the position result within a single task is
      cleaner.
contested: false
status: pending-review
last_checked_at: 2026-10-10
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A comparable
  granularity- and position-stratified long-context suite in which
  sentence-level tasks show the same middle dip as word-level ones, or in
  which coarse-grained performance matches word-level once metrics are made
  comparable across granularities.
