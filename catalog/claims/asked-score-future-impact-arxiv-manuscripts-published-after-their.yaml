id: asked-score-future-impact-arxiv-manuscripts-published-after-their
ref: CLM-0801
capability: forecasting
technique: score-impact-alignment-field-s-trajectory-momentum
statement: >-
  Asked to score the future impact of arXiv manuscripts published after
  their knowledge cutoff, frontier LLMs prompted with 30 labelled historical
  few-shot examples rank papers against realized composite impact at
  Spearman correlations mostly below 0.25 and fluctuating near zero across
  monthly windows, while a trained model over the same text embeddings plus
  a time-indexed topic-trajectory structure reaches above 0.5.
kind: observation
backing_strength: single-paper
observed_on:
  era: "3,200 arXiv papers in three fast-moving CS subfields (time series forecasting, sparse attention, image generation), 18 monthly 2-month test windows, impact = log-normalized sum of "
sources:
  - source: arxiv-2605-07208
    stance: supports
    note: >-
      Validated by: Spearman rank correlation with realized composite impact
      over 18 sliding windows: FAME averages ~0.51-0.54 vs <0.25 for six
      frontier LLMs and SciJudge-4B, and 0.16-0.40 for
      XGBoost/SVR/Transformer/TGCN on raw embeddings; ablations show
      removing the vanguard loss causes the largest drop.. Measured on one
      curated 3,200-paper dataset in three CS subfields, three runs per cell
      with reported SDs, against ML, LLM and domain-tuned baselines under a
      shared label-access protocol. [truncated]
