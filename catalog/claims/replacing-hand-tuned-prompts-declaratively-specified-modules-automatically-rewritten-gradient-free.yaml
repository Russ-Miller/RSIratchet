statement: >-
  Replacing hand-tuned prompts with declaratively specified modules that are
  automatically rewritten by gradient-free optimization against task scores
  raises factual accuracy and lowers hallucination rates on reasoning, RAG
  and multi-step chain-of-thought benchmarks, relative to heuristic
  trial-and-error prompt engineering.
