id: encoder-based-hallucination-claim-faithfulness-detectors-moved-general-domain-data-biomedical-claim
ref: CLM-0355
capability: domain-knowledge
technique: match-encoder-s-pre-training-corpus-target-domain
statement: >-
  For encoder-based hallucination/claim-faithfulness detectors moved from
  general-domain data to biomedical claim verification, which corpus the
  encoder was pre-trained on matters more than which data it is fine-tuned
  on: a PubMed-pretrained encoder fine-tuned on a few hundred SciFact pairs
  beat both a general encoder fine-tuned on the same pairs and a general
  encoder pre-fine-tuned on a large general hallucination set.
kind: observation
backing_strength: single-paper
observed_on:
  era: "DeBERTa-v3-base vs PubMedBERT, binary faithful/hallucinated classification, 484 SciFact training and 106 test examples; all configurations below 0.7 F1"
sources:
  - source: arxiv-2609-11878
    stance: supports
    note: >-
      Validated by: On 106 SciFact test examples: PubMedBERT fine-tuned on
      SciFact reached F1 0.627 / AUROC 0.808, versus HaluEval-trained
      DeBERTa zero-shot (0.517 / 0.515), DeBERTa fine-tuned on SciFact
      (0.488 / 0.582), and HaluEval-then-SciFact sequential transfer (0.533
      / 0.610).. Measured, but on a very small split (484 train / 106 test)
      with one seed and no confidence intervals; four configurations
      compared, and encoder identity is confounded with architecture and
      size, not just pre-training corpus.
contested: false
status: pending-review
last_checked_at: 2026-09-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: A general-domain encoder
  fine-tuned on the same small in-domain set matching or beating a
  domain-pretrained encoder on biomedical faithfulness detection, on a
  larger test set than 106 examples.
