id: lost-in-the-middle-pattern-long-documents-granularity-dependent-8k-128k-token-un-reports-six
ref: CLM-0433
capability: long-context-degradation
statement: >-
  The lost-in-the-middle pattern in long documents is granularity-dependent:
  on 8K-128K-token UN reports in six languages, word-level QA and
  paragraph-filling accuracy dips when the evidence sits mid-document, but
  sentence-level cloze accuracy peaks there, because mid-paragraph sentences
  carry concrete entity overlap that models match on instead of reasoning
  about discourse role.
kind: observation
backing_strength: single-paper
observed_on:
  era: "12 long-context LLMs, zero-shot, UN report documents 8K-128K tokens, six UN official languages, evidence stratified begin/middle/end."
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured across 12 models on a new benchmark with 420 items per task
      per language; position effects read off aggregate curves. The
      surface-cue explanation is supported by LLM- plus human-annotated
      error analysis on cloze cases where over half of models failed, not by
      a controlled manipulation of lexical overlap.
contested: false
status: pending-review
last_checked_at: 2026-10-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication with
  position-stratified sentence-level cloze items in long documents showing
  the same mid-context dip as word-level QA, or showing the sentence-level
  mid peak disappears once lexical overlap between candidates and context is
  controlled. Drafted stance toward
  performance-multi-document-qa-highest-when-answer-at-start: contests --
  The paper finds the middle-position penalty reverses for sentence-level
  cloze, so the boundary-preference pattern does not hold across all task
  granularities.
