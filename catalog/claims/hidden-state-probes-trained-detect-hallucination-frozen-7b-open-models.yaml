id: hidden-state-probes-trained-detect-hallucination-frozen-7b-open-models
ref: CLM-0835
capability: hallucination
technique: probe-whole-layer-depth-trajectory-one-layer
statement: >-
  For hidden-state probes trained to detect hallucination in frozen 7B open
  models (Mistral-7B, LLaMA2-7B), detection accuracy falls with the
  language's resource level even when the probe is trained once and applied
  without language-specific tuning, because the internal representations the
  probe reads are themselves weaker in low-resource languages — AUROC on
  HaluEval drops from ~98 in English to ~96 (French), ~89 (Bangla) and ~78
  (Amharic).
kind: observation
backing_strength: single-paper
observed_on:
  era: "White-box access to a 7B-class frozen LLM; benchmarks machine-translated from English (HaluEval, TriviaQA) with human spot-check, not natively authored prompts; detector trained on"
sources:
  - source: arxiv-2605-24919
    stance: supports
    note: >-
      Validated by: AUROC on HaluEval and TriviaQA with Mistral-7B and
      LLaMA2-7B against 13 baselines (confidence, consistency, single-layer
      probes, neural ODE/CDE/SDE trajectory models); reported 98.3-98.6 vs
      best baseline 85.1-95.4. Ablations: removing out-of-fold stacking
      costs ~10 AUROC points, multi-scale attention ~7, final-layer-only
      trajectory ~5.. Measured on two datasets and two 7B models;
      [truncated]
