notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An ablation on
  comparable-scale VLA policies where removing the future-latent generation
  expert costs as much or more on static tabletop tasks as on dynamic ones,
  or where the gain on dynamic tasks disappears once pre-training data and
  parameter count are matched.
