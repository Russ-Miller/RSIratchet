id: open-weight-7-20b-models-answering-discrete-answer-math-multiple-choice-questions-injecting
ref: CLM-0864
capability: abstention-and-self-knowledge
technique: abstain-unless-noise-perturbed-latent-paths-agree
statement: >-
  For open-weight 7-20B models answering discrete-answer math and
  multiple-choice questions, injecting Gaussian noise into the latent
  hidden-state feedback loop to generate five reasoning paths yields an
  agreement signal whose strictness tracks correctness: error rates fall
  from 40-70% at plurality agreement to under 15% at unanimity, bought with
  coverage dropping to roughly a third of queries.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Five open-weight models (7B-20B), GSM8K, GSM-Symbolic and MMLU with 1000 sampled questions each, K=5 paths, noise scale sigma0=0.2, exact-match agreement; requires access to intern"
sources:
  - source: arxiv-2605-08221
    stance: supports
    note: >-
      Validated by: Accuracy and coverage at agreement thresholds from 2/5
      to 5/5 against single-path greedy decoding, across 5 models x 3
      benchmarks (1000 questions each); on GSM8K no baseline exceeded 75%
      while all models exceeded 90% at unanimity with coverage 31-53%;
      noise-scale sweep fitted sigmoid degradation curves with R2 >= 0.94.
      No matched-compute comparison against token-level self-consistency or
      semantic entropy.. Measured on 5 models and 3 benchmarks, 1000
      questions each, with per-threshold accuracy, coverage and error rates
      reported. [truncated]
