id: tool-using-agents-restricting-capabilities-harness-level-after-untrusted-content
ref: CLM-0173
capability: prompt-injection
statement: >-
  For tool-using agents, restricting capabilities at the harness level after
  untrusted content enters the context — revoking or tightening the
  parameter envelopes of skills that lie on graph paths to deployer-defined
  forbidden states — cuts indirect-injection attack success further than
  prompt-level or per-action authorization defenses, and does so with no
  extra model calls or tokens, because enforcement reads the transition
  graph rather than the natural-language content.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Requires a trusted harness that mediates every skill invocation, correct skill transition summaries, and a deployer-written policy naming forbidden states and per-parameter steerab"
sources:
  - source: arxiv-2608-30041
    stance: supports
    note: >-
      Measured on four AgentDojo suites with Gemini 2.5 Flash and
      Llama3.3-70B, against No Defense, Spotlighting, CaMeL and AttriGuard,
      plus an author-built compositional attack set. Reports 0% attack
      success on Travel, Banking, Workspace for both backends and 4.8%/14.3%
      on Slack. Benign utility often falls relative to no defense;
      fractional-flow restriction retains more capability than binary at the
      same attack success. Authors' own system and own compositional
      benchmark; [truncated]
contested: false
status: pending-review
