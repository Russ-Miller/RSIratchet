notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: An evaluation on
  comparable agent benchmarks where post-contamination capability
  restriction leaves attack success no lower than CaMeL/AttriGuard-style
  per-action authorization, or where the utility cost of confinement is so
  large that the defended agent completes fewer tasks than a prompt-level
  defense at equal attack success. Proposed technique, not catalogued:
  reachability-based capability confinement after contamination.
