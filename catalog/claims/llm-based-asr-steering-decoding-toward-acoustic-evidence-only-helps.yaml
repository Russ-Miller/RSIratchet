id: llm-based-asr-steering-decoding-toward-acoustic-evidence-only-helps
ref: CLM-0078
capability: hallucination
statement: >-
  In LLM-based ASR, steering decoding toward acoustic evidence only helps if
  candidates are first restricted to tokens within a small likelihood margin
  of the greedy token: unconstrained selection by an acoustic compatibility
  score removes hallucinated outputs but destroys transcription accuracy
  through unbounded insertions, while the constrained version removes a
  large share of hallucinations at near-zero WER/CER cost.
kind: mechanism
