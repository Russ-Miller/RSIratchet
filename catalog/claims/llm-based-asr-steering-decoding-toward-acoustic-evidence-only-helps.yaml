    stance: supports
    note: >-
      Paired greedy-vs-LCAR decoding on 8800 frozen detector-positive
      records plus negative controls, with an LLM detector whose precision
      was human-audited at 93.3% on a 400-case stratified sample. Ablation
      on 800 Qwen3 positives isolates the likelihood constraint: acoustic-
      only selection gives comparable overall hallucination fixing but
      >600/1000 point WER/CER increases. Normal-speech effects measured on
      LibriSpeech test-clean and AISHELL2. Gains vary by model and suite;
