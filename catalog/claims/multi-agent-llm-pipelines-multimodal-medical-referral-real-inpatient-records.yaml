id: multi-agent-llm-pipelines-multimodal-medical-referral-real-inpatient-records
ref: CLM-0689
capability: multi-model-coordination
technique: exchange-typed-logical-edges-dialogue-between-agents
statement: >-
  For multi-agent LLM pipelines on multimodal medical referral from real
  inpatient records, requiring agents to exchange typed logical edges
  (causal cascade, mutual reinforcement, exclusion, conditional context) in
  a shared reasoning graph instead of free-form dialogue raises referral F1,
  and the causal-chain edge type carries most of that gain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "952 real inpatient cases over 37 departments, four modality agents plus an expert arbitration agent, DeepSeek-V3 backbone, zero-shot, four-option multiple choice; gains saturate at"
sources:
  - source: arxiv-2608-30938
    stance: supports
    note: >-
      Validated by: Referral F1 on 952 real inpatient cases: 95.3% vs 91.4%
      for MMA and 92.6% for ToR multi-agent baselines and 89.7% for GPT-5;
      replacing the graph with natural-language output cost 5.1 F1, removing
      inter-agent collaboration 6.1, removing the knowledge base 2.3;
      removing the cascade relation alone dropped F1 to 90.6%, more than any
      other relation type. Measured on one self-constructed dataset from a
      single hospital, one backbone for all baselines, with module and
      relation-type ablations and a human-scored reasoning rubric;
      [truncated]
