id: label-free-rl-post-training-reasoning-models-deriving-each-model-s
ref: CLM-0632
capability: multi-model-coordination
technique: reward-each-model-peer-model-s-majority-vote
statement: >-
  In label-free RL post-training of reasoning models, deriving each model's
  reward from a separately-trained peer model's majority vote — rather than
  from its own majority vote — avoids the reward collapse and length
  degeneration that self-rewarding runs show, and the benefit grows as the
  paired models differ in family or size because their errors overlap less.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "1.7B-12B open LLMs and VLMs trained with GRPO on unlabeled math/multimodal-math prompts; pseudo-labels from majority vote over K rollouts."
sources:
  - source: arxiv-2608-17253
    stance: supports
    note: >-
      Validated by: Average gains of 3.0-8.6% over base across seven text
      benchmarks and 2.3-7.2% across four multimodal benchmarks, beating
      TTRL, RENT, Intuitor, Co-rewarding-II, MAPoRL and CoMAS (+4.0% over
      CoMAS with half the agents), with a compute-matched control where two
      TTRL-trained models are ensembled at inference.. Measured on 3B/7B/8B
      LLMs and 2B-12B VLMs with published baselines and a budget-matched
      ensemble control; [truncated]
