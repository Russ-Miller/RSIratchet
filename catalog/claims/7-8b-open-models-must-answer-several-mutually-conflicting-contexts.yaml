id: 7-8b-open-models-must-answer-several-mutually-conflicting-contexts
ref: CLM-0549
capability: fact-verification
technique: externalize-internal-belief-then-resolve-conflicts-induced-rules
statement: >-
  When 7-8B open models must answer with several mutually conflicting
  contexts plus possibly wrong parametric knowledge, writing the model's
  internal belief out as explicit text (with its training cutoff) and
  adjudicating all contexts against validated conflict-resolution rules
  beats methods that pick one source to trust, and the rule-based
  adjudication step carries most of the gain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Llama3.1-8B and Qwen2.5-7B on ConflictBank, ConFiQA and MQuAKE with 2-4 conflicting contexts per query; external knowledge supplied by GPT-4o-mini; 1,000 sampled instances"
sources:
  - source: arxiv-2606-20245
    stance: supports
    note: >-
      Validated by: EM and ROUGE-L against Direct, ICL, InstructRAG-ICL,
      TruthfulRAG and CK-PLUG on three conflict benchmarks (e.g.
      ConflictBank EM 0.549 vs 0.312 best baseline on Llama3.1-8B); ablation
      replacing the multi-agent module with chain-of-thought drops EM to
      0.229, removing assessment/retrieval drops it to 0.480.. Measured on
      two 7-8B backbones and three benchmarks against five baselines, with
      an ablation isolating the two modules. No matched-compute control:
      MACR makes many more LLM calls than the baselines, so part of the gain
      may be inference budget. [truncated]
contested: false
