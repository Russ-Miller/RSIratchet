id: sequential-knowledge-edits-frozen-vision-language-model-how-much-per-concept
ref: CLM-0890
capability: knowledge-updating
technique: confine-each-edit-own-orthogonal-concept-subspace
statement: >-
  For sequential knowledge edits to a frozen vision-language model, how much
  the per-concept edit subspaces overlap predicts how much earlier knowledge
  is lost: keeping the bases approximately orthogonal via residualized
  incremental PCA holds mean pairwise overlap near 3e-3 over 1,000 edits
  while omitting orthogonalization lets it drift above 1e-1, and forgetting
  rises nearly linearly with overlap.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "LLaVA-1.5-7B and PaliGemma-3B with a frozen backbone, edits applied as gated low-rank residuals in the fused cross-modal representation; up to ~1,000 sequential edits on E-VQA, VLK"
sources:
