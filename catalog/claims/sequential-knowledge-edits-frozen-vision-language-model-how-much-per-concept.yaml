    stance: supports
    note: >-
      Validated by: Single-edit average 98.50 on E-VQA vs 97.84 for
      DualEdit; after 1,000 sequential edits reliability 96.85 vs 92.93
      (LiveEdit) on E-VQA and 98.10 vs 92.22 on VLKEB; CoIN BWT -9.37 vs
      -19.45 for PAM at matched plasticity; ablation removing orthogonality
