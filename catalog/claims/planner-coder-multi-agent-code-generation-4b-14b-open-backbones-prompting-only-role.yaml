id: planner-coder-multi-agent-code-generation-4b-14b-open-backbones-prompting-only-role
ref: CLM-0865
capability: multi-model-coordination
technique: train-each-agent-role-downstream-execution-rewards
statement: >-
  In Planner-Coder multi-agent code generation with 4B-14B open backbones,
  prompting-only role decomposition yields little or no measurable benefit
  to the Coder (collaboration gain near or below zero), and the gain only
  appears once each role is separately RL-trained against downstream
  code-execution rewards.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open Qwen2.5-Coder 7B/14B and Qwen3-4B backbones on LiveBench, MBPP, CodeContests and CodeForces; auxiliary agents evaluated by their effect on the Coder's pass rate."
sources:
