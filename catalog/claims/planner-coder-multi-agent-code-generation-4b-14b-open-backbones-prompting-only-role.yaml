    stance: supports
    note: >-
      Validated by: Pass@1/Pass@5/APR on four benchmarks against GRPO,
      Focused-DPO, CURE, CodeRL+ and against SCoT, Reflexion, MapCoder;
      ablations removing Planner RL or Coder RL; a defined
      collaboration-gain metric tracked over training.. Measured: the
      ablation with all RL removed scores lowest on most of 12 metric cells
      (e.g. 33.9 vs 37.7 Pass@1 on LiveBench, 8.9 vs 11.7 on CodeForces with
      Qwen2.5-7B-CI), and figures report near-zero or negative collaboration
      gain for existing multi-agent systems and a rising gain over RL
      training. [truncated]
