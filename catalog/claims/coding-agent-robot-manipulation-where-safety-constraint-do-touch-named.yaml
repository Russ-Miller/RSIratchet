id: coding-agent-robot-manipulation-where-safety-constraint-do-touch-named
ref: CLM-0355
capability: embodied-control
technique: re-check-safety-constraint-tool-prompt
statement: >-
  For coding-agent robot manipulation where a safety constraint (do not
  touch a named obstacle) is given only as text in the task prompt, the
  agent restates the constraint early and then plans the shortest path
  through the obstacle, and enforcing the same constraint with an external
  stateless verifier that re-checks each route against grounded obstacle
  boxes before motion raises both task success and collision avoidance.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Simulated tabletop manipulation (SafeLIBERO, 32 tasks, 10 seeds) with a single declared obstacle per scene, parallel-jaw gripper, frozen pi-0.5 policy, GPT-5.5/GPT-6 planners."
sources:
  - source: arxiv-2609-20822
    stance: supports
    note: >-
      Validated by: On SafeLIBERO with 10 seeds per task across 32 tasks:
      71.9% task success and 87.5% collision avoidance with GPT-6, versus
      31.0/59.0 for the same agent with skills but no harnesses, and
      67.5/68.9 for AEGIS (barrier-function filter over the frozen policy);
      ablation holds prompt, skill memory and VLA fixed.. Measured on one
      simulated benchmark with one obstacle per scene; ablation isolates the
      harnesses from model scale by holding prompt, skill memory and VLA
      fixed. [truncated]
