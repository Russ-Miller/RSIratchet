id: across-ten-languages-six-models-harmbench-advbench-unsafe-response-rates
ref: CLM-0289
capability: jailbreak-robustness
statement: >-
  Across ten languages and six models on HarmBench and AdvBench,
  unsafe-response rates for the same model differ by more than 50 points
  between languages; high-resource languages are safer on plain harmful
  queries but more vulnerable to adversarial-prompt jailbreaks, and simple
  defenses work but their effect depends on language and model, so safety
  measured in English does not transfer.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Ten high- to low-resource languages, six LLMs, two jailbreak families (logical-expression and adversarial-prompt), 2025; unsafe rate judged automatically."
sources:
