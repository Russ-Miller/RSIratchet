id: agent-builds-whole-python-repository-natural-language-requirements-alone-iteratively
ref: CLM-0355
capability: code-generation
technique: evolve-component-graph-until-modularity-metrics-converge
statement: >-
  When an agent builds a whole Python repository from natural-language
  requirements alone, iteratively splitting and merging planned components
  under explicit cohesion and coupling thresholds until no action triggers
  produces higher functionality coverage and test pass rate than fixing the
  architecture in one planning pass, and also beats letting the LLM decide
  structural edits for a fixed budget of rounds, which over-decomposes the
  architecture.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six Python repositories in RepoCraft, generated from revised high-level requirement descriptions, with GPT-5 mini and DeepSeek V3.2 backbones and an identical downstream TDD genera"
sources:
