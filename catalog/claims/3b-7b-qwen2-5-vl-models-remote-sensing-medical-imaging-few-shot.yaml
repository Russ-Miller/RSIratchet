id: 3b-7b-qwen2-5-vl-models-remote-sensing-medical-imaging-few-shot
ref: CLM-0971
capability: domain-knowledge
technique: encode-domain-priors-rl-distribution-constraints-prompts
statement: >-
  For 3B-7B Qwen2.5-VL models on remote sensing and medical imaging few-shot
  recognition, stating domain properties in the prompt or appending model-
  or BLIP-generated captions does not raise accuracy and caption
  augmentation can lower it, while encoding the same domain priors as
  transformation-consistency terms in the RL objective raises accuracy over
  SFT and outcome-reward RL.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-VL 3B/7B, 1-8 shot, six remote sensing and five MedMNIST datasets plus DIOR grounding; domain priors limited to rotation invariance and symmetry consistency."
