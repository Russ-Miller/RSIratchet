    stance: supports
    note: >-
      Validated by: Few-shot accuracy on six remote sensing and five medical
      datasets plus DIOR mAP, against SFT, Visual-RFT, SFT/Visual-RFT with
      standard data augmentation, and an output-level constraint variant;
      reported gains over SFT of +0.6 to +7.8 average points depending on
      shot count.. Measured on one backbone family across eleven
      classification datasets and one grounding dataset, with ablations
      separating constraint from reward reweighting, output-level vs
      distribution-level constraints, and divergence choices. [truncated]
