id: video-llms-asked-verify-sentence-sentence-whether-dense-video-caption
ref: CLM-0467
capability: video-temporal-reasoning
statement: >-
  When Video-LLMs are asked to verify sentence by sentence whether a dense
  video caption is supported by the video, they detect hallucinated
  sentences less often in captions they generated themselves than in
  captions from other models, and detection of temporal errors (action,
  order, causality, frequency, state change) improves much less with model
  scale than detection of static-frame errors.
kind: observation
backing_strength: single-paper
observed_on:
  era: "500 videos, 4s to 90min, five spatio-temporal complexity types; captions generated by five Video-LLMs with human sentence-level labels; open models 2B-72B plus Gemini 3 Flash and G"
sources:
  - source: arxiv-2609-21521
    stance: supports
    note: >-
      Measured: per-sentence precision/recall/F1 averaged over video-caption
      pairs, cross-source vs self-source heatmap, and recall-gain heatmap
      across three model families. Best model (Gemini 3 Flash) F1 above 40
      on other models' captions and roughly half that on its own. All models
      score far below ceiling (best F1 ~42), so the self-preference gap is
      measured in a low-absolute-performance regime. No control for caption
      style differences between generators.
contested: false
status: pending-review
last_checked_at: 2026-09-29
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A Video-LLM that scores
  the same or better F1 on verifying its own captions as on other models'
  captions on the same videos, or a model family where scaling raises recall
  on temporal error categories as much as on static ones.
