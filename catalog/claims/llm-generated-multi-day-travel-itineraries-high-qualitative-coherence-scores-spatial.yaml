id: llm-generated-multi-day-travel-itineraries-high-qualitative-coherence-scores-spatial
ref: CLM-0581
capability: planning
technique: score-itineraries-buffer-adequacy-against-empirical-delay-data
statement: >-
  For LLM-generated multi-day travel itineraries, high qualitative coherence
  scores (spatial, persona, meal, ordering) coexist with near-zero
  robustness to realistic disruption: across GPT-5, Qwen3, Mistral-7B and
  Phi-4-mini, transport-delay buffer scores stay under 12% and
  buffer-adequacy scores under ~41%, so coherence and static constraint
  satisfaction do not indicate that a plan survives empirical transit delays
  or crowd peaks.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,000 3/5/7-day India travel queries with human gold itineraries, empirical delay and crowd-density data, direct sole-planning prompting that already describes the uncertainty dist"
sources:
  - source: arxiv-2609-02421
    stance: supports
    note: >-
      Validated by: Applied to four LLMs and an agentic baseline over
      3/5/7-day plans; the metrics separate models that binary final-pass
      rate collapses to near zero for, and expose model-specific patterns
      (Qwen3 degrading with horizon, Phi-4 strong crowd timing but weak
      buffering); no human-agreement study of the metrics is reported..
      Measured on a new benchmark with the authors' own metrics, so the
      headline gap is partly a property of the metric's acceptable-buffer
      parameterisation; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-23
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model (or prompting
  setup) that scores high on these qualitative coherence metrics and also
  allocates buffers within the empirical delay-derived ranges, or evidence
  that low BAS/TDAS plans in fact execute without cascading failure under
  simulated delays.
