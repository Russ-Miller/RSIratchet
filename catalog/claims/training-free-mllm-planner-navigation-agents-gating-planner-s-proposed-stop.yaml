    stance: supports
    note: >-
      Validated by: Cumulative ablation on fixed 100-episode subsets: event
      memory +8.0/+7.0 SR points, graph retrieval +6.0/+1.0, stop validation
      +4.0/+2.0 on R2R and HM3D-OVON; full system beats prior training-free
      SOTA by 5.8, 12.1, 1.6 and 9.1 SR points on four benchmarks.. Measured
      on four simulated benchmarks plus a humanoid demo. Main-table gains
      confound the harness with the base model (GPT-5.5/5.6) and the
      perception stack; the ablation isolates components but only on
      100-episode subsets, and stop validation lowered SPL and widened the
      OSR-SR gap on HM3D-OVON. [truncated]
