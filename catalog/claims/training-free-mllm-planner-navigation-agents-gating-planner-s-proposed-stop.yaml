id: training-free-mllm-planner-navigation-agents-gating-planner-s-proposed-stop
ref: CLM-0266
capability: embodied-control
technique: validate-navigation-proposals-against-spatial-evidence-before-dispatch
statement: >-
  For training-free MLLM-planner navigation agents, gating the planner's
  proposed stop and move commands on external evidence checks (geometric
  reachability, pose-aligned observation, subgoal consistency) and giving
  the agent a persistent spatial graph of past observations and failures
  raises success rate over the same planner without those checks, because
  recognizing a target or issuing an action does not establish arrival.
kind: mechanism
backing_strength: single-paper
