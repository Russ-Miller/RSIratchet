id: 2b-8b-video-multimodal-models-adding-small-fraction-time-reversed-video
ref: CLM-0341
capability: video-temporal-reasoning
technique: mix-reversed-video-rollouts-into-grpo-groups
statement: >-
  For 2B-8B video multimodal models, adding a small fraction of
  time-reversed video rollouts into each GRPO group (e.g. 1 reversed out of
  7) raises accuracy on action and temporal-reasoning video QA over standard
  GRPO, while raising the reversed share further (2 or 3 of 7) gives back
  the gain.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3-VL 2B/4B/8B and InternVL2.5-8B, trained on Video-R1 splits, evaluated on 1,000-example samples of STAR, SSv2, NExT-QA, CLEVRER, LLaVA-178K, PerceptionTest; the reversed-ratio"
sources:
  - source: arxiv-2608-21030
    stance: supports
    note: >-
      Validated by: Same Stage-I checkpoint, Qwen3-VL-8B, group size 7:
      average accuracy 78.0 for 7 forward + 0 reversed, 78.8 for 6+1, 78.4
      for 5+2, 77.6 for 4+3 across six benchmarks.. Measured on one backbone
      (Qwen3-VL-8B) for the ratio sweep, with 1,000 sampled examples per
      benchmark and no reported variance or seeds; gains over plain GRPO are
      under one point on average. Main-table gains confound the motion
      branch with the reversed-rollout objective; only Table 4 isolates the
      optimizer.
contested: false
status: pending-review
