id: vlm-based-navigation-agents-having-model-output-2d-pixel-egocentric
ref: CLM-0191
capability: embodied-control
statement: >-
  For VLM-based navigation agents, having the model output a 2D pixel on an
  egocentric image and projecting it to a 3D waypoint with depth plus a SLAM
  controller works better than having the same model regress metric 3D
  waypoints directly, because it keeps the action in the 2D image space the
  VLM was pretrained on instead of asking it to learn geometric
  transformations.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen2.5-VL-7B fine-tuned on 90k VLN-CE trajectories, indoor continuous navigation (R2R-CE, RxR-CE), depth available from simulator ground truth or a depth camera; degrades under se"
sources:
  - source: arxiv-2608-17512
    stance: supports
    note: >-
      One SFT-only ablation block holding architecture, data, sensing and
      controller fixed: swapping pixel-to-3D for a NavFoM-style metric
      waypoint output lowers success rate by 24.8 points on R2R-CE and 25.2
      on RxR-CE. Single paper, single base model, authors' own
      reimplementation of the baseline output head; the mechanism (2D
      pretraining priors) is argued, not directly isolated.
contested: false
status: pending-review
last_checked_at: 2026-09-15
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A matched-budget
  comparison in which the same base VLM, data, and controller achieve equal
  or higher success rate with direct metric-waypoint output than with
  pixel-pointing, or in which the pixel-pointing advantage disappears once
  depth is imperfect. Proposed technique, not catalogued: Pixel-pointing
  action space with depth projection.
