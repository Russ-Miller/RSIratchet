id: 7b-32b-vision-language-models-visual-evidence-read-out-visual-token-hidden
ref: CLM-0348
capability: visual-grounding
technique: penalize-tokens-whose-pooled-visual-rank-falls-below
statement: >-
  In 7B-32B vision-language models, visual evidence read out of visual-token
  hidden states via the output head cannot be pooled across positions as
  probabilities because position-wise distribution sharpness dominates the
  magnitudes (90th/10th percentile ratios of 13.8x and 7.8x, only reduced to
  11.0x and 4.2x by affine scale equalization), whereas pooling vocabulary
  ranks is invariant to per-position monotone rescaling, and the pooled rank
  must then be judged against a token-specific reference because differences
  between tokens explain 66.4% of its variability.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Open-weight LVLMs whose visual-token hidden states can be projected through the output head (logit lens); measured on LLaVA-1.5-7B and Qwen2.5-VL-7B, with hallucination reductions "
sources:
  - source: arxiv-2608-19075
    stance: supports
    note: >-
      Validated by: CHAIR_I object-hallucination reduced by up to 21.3% on
      four 7B backbones with descriptive and general multimodal scores
      largely preserved or improved; reductions extend to 11 models across
      six families up to 32B; added latency 1.33% per token. Calibration
      validated out-of-sample: token-specific medians fit on 500 COCO images
      cut held-out calibration error 92% (LLaVA-1.5-7B) and 91%
      (Qwen2.5-VL-7B) versus a single global reference, and beat all 1,000
      random token-to-reference reassignments. [truncated]
