id: long-context-multi-hop-qa-over-inputs-up-900k-tokens-summarizing
ref: CLM-0340
capability: long-context-degradation
technique: summarize-long-document-parallel-hierarchical-tree
statement: >-
  For long-context multi-hop QA over inputs up to ~900k tokens, summarizing
  overlapping text segments in parallel with a query-conditioned LLM kernel
  and recursively summarizing the summaries in a tree beats sequential
  single-memory-state agents and BM25 retrieval, because sequential memory
  overwrites early evidence before the later hop appears.
