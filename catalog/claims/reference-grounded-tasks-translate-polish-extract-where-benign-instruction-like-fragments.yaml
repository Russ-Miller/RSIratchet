id: reference-grounded-tasks-translate-polish-extract-where-benign-instruction-like-fragments
ref: CLM-0735
capability: procedure-following
statement: >-
  On reference-grounded tasks (translate, polish, extract) where benign
  instruction-like fragments are embedded in the reference text as
  low-salience artifacts, robustness to those distractors falls as model
  size increases within the Qwen3 non-thinking family, dropping from about
  66 to about 38 macro-average pass rate from 0.6B to 235B across
  single-turn, multi-turn and system-prompt paradigms.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3 family under non-thinking decoding, benign (non-adversarial) distractor instructions embedded without markers, strict conjunctive rubric graded by GPT-4o; thinking mode rever"
sources:
