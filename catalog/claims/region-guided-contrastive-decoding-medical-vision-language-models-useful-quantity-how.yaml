  - source: arxiv-2608-17427
    stance: supports
    note: >-
      Validated by: Overall/closed/open accuracy on SLAKE and MIMIC-CXR
      across Phi-3.5V-Med, HuatuoGPT-Vision-7B, LLaVA-Med-7B against plain
      decoding, VCD, DoLA, OPERA and ground-truth-ROI ARCD; closed accuracy
      on SLAKE with Phi-3.5V-Med rose 61.42 to 81.49. Ablations: random mask
      -4.4%, no area penalty -3.4%, single occlusion mode -3.3/-4.0%..
      Measured on two Med-VQA datasets and three models, with component
      ablations and a coverage analysis on one model/dataset. [truncated]
