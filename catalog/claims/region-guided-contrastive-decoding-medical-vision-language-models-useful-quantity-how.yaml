id: region-guided-contrastive-decoding-medical-vision-language-models-useful-quantity-how
ref: CLM-0473
capability: visual-grounding
technique: pick-guiding-region-occlusion-likelihood-drop-penalizing-size
statement: >-
  For region-guided contrastive decoding in medical vision-language models,
  the useful quantity is how compact the guiding region is, not whether it
  is human-annotated: ground-truth bounding boxes averaging ~39% image
  coverage give weaker contrast than automatically selected masks averaging
  ~7%, and closed-question accuracy falls noticeably once ground-truth
  coverage exceeds 40%, because suppressing a large region strips the
  unconditional branch of nearly all visual information.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Inference-time classifier-free-guidance decoding on Med-VQA (SLAKE, MIMIC-CXR) with three 7B-class Med-VLMs; masks from a text-guided medical segmentation model."
