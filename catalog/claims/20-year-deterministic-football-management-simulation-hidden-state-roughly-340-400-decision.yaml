id: 20-year-deterministic-football-management-simulation-hidden-state-roughly-340-400-decision
ref: CLM-0527
capability: long-horizon-execution
statement: >-
  In a 20-year deterministic football-management simulation with hidden
  state and roughly 340-400 decision stops, what separates frontier models'
  final scores is managerial behavior rather than deliberation volume:
  cutting slow-payoff investment as the horizon ends (Spearman -0.58 with
  late-minus-mid investment shift), keeping cash deployed rather than idle
  (-0.50), and opening contract renewals early (+0.45) track the score on
  every seed, while token spend is uncorrelated under every accounting (r_s
  -0.19, all p > 0.38).
kind: observation
backing_strength: single-paper
observed_on:
  era: "15 frontier models, three seeds, one 20-year simulated management environment with a deterministic composite score; each stop is a fresh conversation with only a self-written noteb"
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured over 15 models on three seeds in one environment;
      correlations are rank correlations over n=15, so confidence intervals
      are wide and the signs are reported per seed rather than tested
      jointly. Single environment, so domain generality is untested.
contested: false
status: pending-review
last_checked_at: 2026-10-29
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication on more
  seeds or a comparable long-horizon management environment where token
  spend correlates with final score, or where endgame-investment cuts and
  idle-cash ratio show no consistent-sign correlation. Drafted stance toward
  20-year-deterministic-football-management-simulation-hidden-state-adaptive-rivals-340-400:
  supports -- Same benchmark; this adds that behavioral metrics, not token
  spend or scale, correlate with the final score.
