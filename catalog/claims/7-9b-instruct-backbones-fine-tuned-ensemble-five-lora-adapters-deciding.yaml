id: 7-9b-instruct-backbones-fine-tuned-ensemble-five-lora-adapters-deciding
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: abstain-unless-one-answer-dominates-lora-ensemble-s
statement: >-
  For 7-9B instruct backbones fine-tuned with an ensemble of five LoRA
  adapters, deciding to answer only when one candidate's minimum probability
  across adapters exceeds every other candidate's maximum gives a
  threshold-free abstention rule whose commitment rate collapses when the
  supplied evidence is corrupted (CoQA 31-48% down to 4-8%), while
  mean-pooling the same adapters into one distribution requires a tuned
  threshold and still answers more corrupted prompts at matched clean
  coverage.
