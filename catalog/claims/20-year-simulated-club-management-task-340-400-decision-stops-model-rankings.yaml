id: 20-year-simulated-club-management-task-340-400-decision-stops-model-rankings
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year simulated club-management task with ~340-400 decision stops,
  model rankings at the midpoint do not predict final rankings: on one seed
  the rank correlation with the final order rose from 0.19 at year 5 to 0.78
  at year 15, and the model leading at years 5 and 10 finished 12th of 15,
  so truncated versions of the same task would rank models differently.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Deterministic football-management simulation with hidden state, cumulative scoring and adaptive rivals; 15 frontier models, three seeds for the solo track, one shared Arena world."
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured: solo track, 15 models, three seeds, with per-season score
      trajectories; the rank-correlation figures cited come from one seed
      (seed 1), so the strength of the late-settling effect across seeds is
      not quantified. Scores are from one stamped run per seat with no run
      selection, and per-model seed spread is large (up to 22.7 points),
      which could itself contribute to rank instability.
contested: false
status: pending-review
last_checked_at: 2026-10-03
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Running the same
  benchmark and finding year-5 standings already correlate highly (e.g.
  above 0.8) with the 20-year final order across seeds.
