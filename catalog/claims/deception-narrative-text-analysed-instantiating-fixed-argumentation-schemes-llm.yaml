statement: >-
  When deception in narrative text is analysed by instantiating fixed
  argumentation schemes with an LLM (premise extraction, then
  critical-question evaluation), the scheme assessments are stable across
  ten different LLM backbones and repeated runs for clear-cut deception
  cases but grow inconsistent on ambiguous intelligence-style narratives.
