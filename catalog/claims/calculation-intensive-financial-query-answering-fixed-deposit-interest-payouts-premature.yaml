  - source: arxiv-2608-26114
    stance: supports
    note: >-
      Validated by: Accuracy on 101 calculation-intensive queries: 95.54%
      with a Llama-Scout-17B backbone versus 83.66% Claude Sonnet 4.6,
      70.30% Gemini 3, 45.05% GPT-5.3, all given complete formulas and rate
      cards; 89.60% with a 70B and 68.81% with an 8B backbone; module
      ablations drop accuracy to 48% (rolling-year) and 76.7% (rate
      lookup).. Measured on one curated 126-query fixed-deposit benchmark
      from a single institution's rate card, with 21 queries used for prompt
      tuning. [truncated]
