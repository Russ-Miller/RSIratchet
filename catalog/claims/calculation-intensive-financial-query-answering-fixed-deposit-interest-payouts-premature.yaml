id: calculation-intensive-financial-query-answering-fixed-deposit-interest-payouts-premature
ref: CLM-0587
capability: multi-model-coordination
technique: keep-arithmetic-out-llm-loop-entirely
statement: >-
  For calculation-intensive financial query answering (fixed deposit
  interest, payouts, premature withdrawal), splitting the task into LLM
  agents for routing, parameter extraction, planning and response writing
  while delegating every arithmetic and rate-lookup step to deterministic
  Python engines lets a 17B open backbone exceed frontier models prompted
  with the same formulas and rate cards.
kind: mechanism
backing_strength: single-paper
