id: llm-self-correction-reasoning-tasks-no-external-verifier-having-model
ref: CLM-1096
capability: self-repair
technique: abstract-task-before-refining-answer
statement: >-
  For LLM self-correction on reasoning tasks with no external verifier,
  having the model first distill the problem into a structured task
  abstraction (key variables, constraints, problem structure) and then
  re-solve from that abstraction yields more reliable refinement than
  critiquing and patching the output text, and the abstraction written by a
  larger model can be handed to a smaller model that cannot self-correct on
  its own.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Reasoning tasks where an initial response exists and no ground-truth verifier is available; claimed for both large and small models, with cross-model transfer of the abstraction te"
sources:
  - source: arxiv-2602-00871
    stance: supports
    note: >-
      Validated by: Accuracy, robustness and generalization across several
      reasoning tasks against self-correction baselines that critique the
      output; the source text reports direction of improvement but gives no
      numbers, baselines by name, or task list.. Argued and reported as
      measured, but the available text gives no numbers, no named baselines,
      no task names and no compute-matched control, so the size of the
      effect and whether it comes from the abstraction rather than from
      extra tokens is not established.
