notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On the same reasoning tasks
  and models, a matched-compute output-critique refinement loop equals or
  beats abstraction-then-re-solve in accuracy, or small models given a large
  model's abstraction do no better than their own self-correction. Drafted
  stance toward self-critique-without-grounding-unreliable: supports -- The
  paper's starting premise, and its motivation for moving the intervention
  upstream, is that ungrounded output-level critique patches surface errors
  and misses reasoning flaws.
