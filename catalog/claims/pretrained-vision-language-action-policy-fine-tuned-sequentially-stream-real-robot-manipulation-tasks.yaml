id: pretrained-vision-language-action-policy-fine-tuned-sequentially-stream-real-robot-manipulation-tasks
ref: CLM-0397
capability: embodied-control
technique: freeze-normalization-statistics-pre-stream-calibration-set
statement: >-
  When a pretrained vision-language-action policy is fine-tuned sequentially
  on a stream of real-robot manipulation tasks, the choice of
  action-normalization statistics is itself a determinant of
  continual-learning success: statistics that are task-derived,
  first-task-derived, or recomputed each stage produce forgetting or poor
  transfer, while statistics estimated once from a small task-independent
  calibration set covering the embodiment's motion range and then frozen
  give the best acquisition, retention and task-order stability.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Replay-based continual fine-tuning of a pretrained VLA (pi-0.5) on four real-robot streams of five tasks each, single-arm and bimanual, with percentile-based normalization; 10 roll"
sources:
  - source: arxiv-2609-21358
    stance: supports
    note: >-
      Validated by: Average final score across four real-robot streams: 95.3
      for FAN vs 77.0 for the best baseline (first-task statistics), 62.0,
      59.0 and 25.9 for the others; forward transfer positive on all four
      streams (avg 9.1 vs -12.7 to -75.6); mean absolute matched-task
      difference across stream orders 4.2 points vs 17.5-48.5 for baselines.
      Ablation: narrowing or widening (2.5x) the frozen range cut average
      score by roughly 24 points on two streams.. Measured on one bimanual
      platform with one base policy, four streams of five tasks, 10 rollouts
      per cell; [truncated]
