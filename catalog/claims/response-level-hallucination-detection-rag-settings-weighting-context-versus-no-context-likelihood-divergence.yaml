notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: On a larger held-out
  hallucination benchmark, removing the entity weighting from the uptake
  feature leaves AUROC unchanged, or a uniformly-weighted uptake feature
  ranks at or above the entity-weighted one in importance.
