id: response-level-hallucination-detection-rag-settings-weighting-context-versus-no-context-likelihood-divergence
ref: CLM-1052
capability: hallucination
technique: weight-context-uptake-signal-toward-entity-tokens
statement: >-
  For response-level hallucination detection in RAG settings, weighting a
  context-versus-no-context likelihood divergence toward named-entity and
  numeric tokens, rather than over all answer tokens uniformly, is the
  single most discriminative of a small hand-designed feature set fed to a
  sub-1M-parameter classifier.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Question-context-answer triples with binary hallucination labels; evaluated on a 200-sample balanced HaluBench subset with tree-based and small neural classifiers; not tested on op"
sources:
  - source: arxiv-2601-15652
    stance: supports
    note: >-
      Validated by: AUROC on a 200-item balanced HaluBench subset: 0.8669
      for Random Forest on the 8-feature improved set vs 0.8274 on the
      5-feature base set and 0.8017 for the unsupervised theory-guided
      aggregation; gains of +3 to +9% reported across four classifier
      architectures, with feature-importance analysis ranking entity-focused
      uptake first.. Measured, but on only 200 examples with no reported
      confidence intervals or cross-dataset test; [truncated]
contested: false
status: pending-review
