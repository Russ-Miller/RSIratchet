id: retrospective-llm-forecasting-benchmarks-replay-resolved-events-live-web
ref: CLM-0850
capability: evaluation-validity
technique: filter-retrieved-snippets-post-cutoff-facts-before-model
statement: >-
  In retrospective LLM forecasting benchmarks that replay resolved events
  with live web search, relying on a search-engine date filter alone
  inflates scores by more than the spread between models: adding a
  content-level filter that drops retrieved snippets carrying post-cutoff
  facts lowered Score by 12.65-16.35 points for all four models tested,
  while the full 27-configuration leaderboard spanned only 11.0 points.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Discrete-choice forecasting questions derived from FutureX-Past, live Tavily retrieval with a frozen archived candidate bank, four mid-tier models, 300 questions x 3 trials per con"
sources:
  - source: arxiv-2605-03762
    stance: supports
    note: >-
      Validated by: Score under date-only versus date-plus-content-filter on
      300 questions for four models, with paired question-cluster bootstrap
      CIs; plus a separate audit where a judge flagged 137/10,000
      post-filter results as leaking, all 137 confirmed by humans and no
      leakage found in 1,000 sampled negatives.. Measured on four models
      under matched prompts, budgets and a frozen candidate bank, so corpus
      variation is controlled. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A paired comparison
  showing that removing content-flagged snippets leaves scores essentially
  unchanged, or that the drop is explained entirely by discarding legitimate
  pre-cutoff evidence rather than realized outcomes. Drafted stance toward
  across-llm-based-forecasting-systems-reported-accuracy-gains-frequently-cannot:
  supports -- It quantifies how much of a retrospective forecasting score
  comes from post-cutoff information surviving date filters rather than from
  forecasting.
