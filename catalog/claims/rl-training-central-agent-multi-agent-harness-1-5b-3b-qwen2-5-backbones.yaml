id: rl-training-central-agent-multi-agent-harness-1-5b-3b-qwen2-5-backbones
ref: CLM-0688
capability: multi-model-coordination
technique: train-only-central-coordinating-agent-freeze-sub-agents
statement: >-
  When RL-training a central-agent multi-agent harness with 1.5B-3B Qwen2.5
  backbones on multi-hop QA, optimizing only the coordinating central policy
  and leaving sub-agents frozen scores higher than jointly training central
  and sub-agent policies (average F1 47.79 vs 45.36, accuracy 42.88 vs 40.49
  at 3B).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Central-coordination multi-hop QA and agentic retrieval harnesses with frozen retrieval/conclusion sub-agents; small (1.5B-3B) open backbones; only one harness topology tested."
sources:
  - source: arxiv-2608-29641
    stance: supports
    note: >-
      Validated by: Token-level F1 and accuracy across seven multi-hop QA
      benchmarks with Qwen2.5-3B, central-only vs all-agent joint training
      under the same optimization scheme.. Measured: one ablation table,
      Qwen2.5-3B only, seven benchmarks, two metrics; central-only wins on
      most but joint training wins on a few individual benchmarks (2Wiki
      accuracy, MuSiQue F1). No compute-matching discussion and no
      replication at 1.5B.
contested: false
