  era: "LLaVA-1.5-7B, Qwen2.5-VL-7B and LLaVA-NeXT-8B tuned on 8K mixed RLAIF-V/TextVQA preference samples; hallucination benchmarks POPE, MMHal, AMBER, OBJHal, HallusionBench; gains shrin"
sources:
