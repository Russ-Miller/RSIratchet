    stance: supports
    note: >-
      Validated by: Matched-backbone comparison against DPO, mDPO and CHiP
      on five hallucination benchmarks (e.g. LLaVA-NeXT OBJHal CHAIR_s 11.3
      base to 4.3) with general benchmarks (MMBench, MMMU, LLaVA-Wild)
      checked for alignment tax, plus a component ablation and an
      adversarial shifted-attention variant.. Measured on three backbones
      against three preference-tuning baselines re-run in the same pipeline
      with greedy decoding. Ablation isolates the evidence term as the
      biggest contributor. [truncated]
