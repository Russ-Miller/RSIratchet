id: 7-8b-multimodal-models-preference-tuning-contrasts-same-faithful-response
ref: CLM-0547
capability: visual-grounding
technique: rank-same-answer-visual-evidence-strength
statement: >-
  For 7-8B multimodal models, preference tuning that contrasts the same
  faithful response across an ordered triplet of image views
  (attention-amplified, original, degraded) lowers object-hallucination
  rates more than response-level DPO, mDPO or CHiP, and removing that
  evidence-ordering term costs more than removing the span- or token-level
  regularizers.
kind: observation
backing_strength: single-paper
