id: text-only-llms-predicting-discretized-bimanual-keyposes-handful-in-context-demonstrations
ref: CLM-0860
capability: embodied-control
technique: condition-second-arm-first-arm-s-predicted-trajectory
statement: >-
  For text-only LLMs predicting discretized bimanual keyposes from a handful
  of in-context demonstrations, splitting the 14-dimensional joint action
  into two sequential single-arm predictions and feeding the first arm's
  predicted trajectory into the second arm's observation beats both
  monolithic joint prediction and two independent per-arm predictions, and
  the conditioning rather than the factorization carries most of the gain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Training-free in-context learning with discretized keypose actions and text object-centroid observations; 13 TWIN simulation tasks plus 3 real Franka tasks; gain is small or absent"
