    stance: supports
    note: >-
      Validated by: Average success over 13 TWIN tasks, 3 seeds x 100
      episodes: 70.5% vs 64.4% for independent dual-agent and 60.6% for
      monolithic single-agent prediction, same GPT-5-mini backbone and same
      10 demonstrations; an ablation that keeps sequential single-arm
      predictions but removes the leader-trajectory observation augmentation
      scores 65.0%; real-robot 53.3% vs 33.3% for the dual-agent baseline
      over 10 trials on each of 3 tasks.. [truncated]
