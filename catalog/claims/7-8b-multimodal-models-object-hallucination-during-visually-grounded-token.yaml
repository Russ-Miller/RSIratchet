id: 7-8b-multimodal-models-object-hallucination-during-visually-grounded-token
ref: CLM-0338
capability: visual-grounding
technique: calibrate-value-vectors-synergy-attention-heads
statement: >-
  In 7-8B multimodal models, object hallucination during visually grounded
  token generation tracks a shift of the visual-language information ratio
  toward language inside mixed-modality "synergy" attention heads rather
  than a shortage of visual-specific heads, and rescaling visual versus
  language value vectors in those heads causally moves hallucination in both
  directions.
kind: mechanism
