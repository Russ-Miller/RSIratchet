      published decoding and attention baselines; CHAIR_S 51.0 to 36.9 and
      CHAIR_I 15.2 to 10.7 with recall and output length maintained; gains
      repeated on five other backbones; head assignments 92-95% stable
      across four masking strategies.. Measured on POPE, CHAIR, MME,
      LLaVA-Bench and MMHal across seven MLLMs, with bidirectional causal
