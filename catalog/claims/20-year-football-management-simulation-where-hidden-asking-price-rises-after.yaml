id: 20-year-football-management-simulation-where-hidden-asking-price-rises-after
ref: CLM-0340
capability: long-horizon-execution
statement: >-
  In a 20-year football-management simulation where the hidden asking price
  rises after each rejected bid, none of 15 frontier LLM agents learns the
  market's acceptance boundary over hundreds of rejections — the median
  model needs about 30 offers per completed signing and the best needs 9,
  against 1.0 for a script that reads the true threshold.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Deterministic football-management environment, 20 in-game years, ~340-400 decision stops, three seeds, 15 flagship models; cross-stop memory limited to a self-written notebook."
sources:
  - source: arxiv-2608-18423
    stance: supports
    note: >-
      Measured as offers per completed signing across 15 models on three
      seeds against a privileged scripted oracle reference of 1.0; the
      design does not separate inability to infer prices from failure to
      record price evidence in the notebook, and the same winner bid far
      more often in the contested Arena, so bid counts reflect strategy as
      well as calibration.
contested: false
status: pending-review
last_checked_at: 2026-10-04
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model whose
  offers-per-signing falls toward 1 over the run, or whose late-run bidding
  accuracy improves relative to early years, would show the acceptance
  boundary is being learned from rejection feedback.
