id: translating-english-descriptions-into-regular-expressions-generic-attention-based-sequence-to-sequence
ref: CLM-0259
capability: formal-query-synthesis
technique: generate-regexes-grammar-then-crowd-paraphrase
statement: >-
  For translating English descriptions into regular expressions, a generic
  attention-based sequence-to-sequence model trained only on
  description/regex pairs matches a domain-engineered semantic parser on a
  small corpus (814 examples) and beats it by a wide margin once the
  training corpus is scaled to 10,000 pairs, with no semantic-equivalence
  machinery built in.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Short single-line regexes over a 15-rule grammar; accuracy scored by DFA equivalence; 2016-era LSTM models; gains depend on having thousands of paired examples."
sources:
  - source: arxiv-1608-03000
    stance: supports
    note: >-
      Validated by: 10,000-pair corpus (NL-RX); a seq2seq model trained on
      it reached 58.2% DFA-equal accuracy on paraphrased test descriptions
      versus 38.6% for the prior semantic-parsing state of the art and 16.4%
      for a bag-of-words nearest-neighbour baseline; the corpus has 97%
      unique regexes against 45% in the earlier human-written set.. Measured
      on two datasets against two baselines, one of them the prior state of
      the art trained with the original authors' help. Single paper, one
      architecture, no seed variance reported. [truncated]
