id: llm-fact-checking-over-supplied-evidence-high-veracity-accuracy-does
ref: CLM-0353
capability: fact-verification
technique: supervise-abstention-evidence-ablated-inputs
statement: >-
  In LLM fact-checking over supplied evidence, high veracity accuracy does
  not imply the verdict depends on that evidence: when the model's own cited
  sentences are iteratively removed, off-the-shelf models (GPT-4o-mini,
  Gemini-2.5-Flash-Lite, Qwen-2.5-32B, Llama-3.1-8B) keep their
  SUPPORT/REFUTE labels at a non-zero plateau instead of abstaining, and
  training with paired supervision that requires NOT_ENOUGH_INFO on the
  evidence-ablated input removes most of that persistence without losing
  accuracy.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Sentence-level evidence fact-checking with SUPPORT/REFUTE/NEI labels; FEVER training, tested in-domain and on SciFact, Climate-FEVER, Check-COVID; NEI-labelled claims excluded; gol"
sources:
  - source: arxiv-2609-08943
    stance: supports
    note: >-
      Validated by: Measured on four datasets against the base model and
      standard SFT: Immediate Sensitivity on FEVER rose from 10.75 (SFT) to
      99.06, label accuracy 83.08 to 95.66 over Llama-3.1-8B; ablations show
      evidence ablation drives grounding metrics and evidence enhancement
      drives accuracy; replicated on Qwen-2.5-7B. Hidden-state probes show
      reduced drift toward the no-evidence representation.. Measured across
      four datasets and two backbones, with per-component ablations and a
      label-flip check showing the accuracy decay is a shift to neutral
      rather than guessing. [truncated]
