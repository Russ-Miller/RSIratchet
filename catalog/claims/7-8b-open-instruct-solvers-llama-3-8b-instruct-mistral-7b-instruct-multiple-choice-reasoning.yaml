notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Running section-local and
  global textual-gradient optimization under matched critic calls and
  several seeds on these benchmarks and finding no reliable accuracy
  difference, or finding the gain disappears once the de-duplication step is
  applied to the global method too.
