id: retrieval-summarization-task-pulls-definitions-surface-term-match-general
ref: CLM-0136
capability: hallucination
technique: retrieval-augmented-generation
statement: >-
  When retrieval for a summarization task pulls definitions by surface term
  match from a general encyclopedia, ambiguous terms fetch the wrong sense
  and the model incorporates that unsupported background into its output,
  lowering claim-level factuality below the no-retrieval baseline even when
  the prompt tells it to ignore unrelated retrieved content.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Radiology-report lay summarization with a small general model (Qwen3.5-0.8B) and BioBART-v2-large, retrieval via Wikipedia API first-sentence definitions for terms extracted from t"
sources:
  - source: arxiv-2609-02396
    stance: supports
    note: >-
      One paper, 5,000 held-out radiology reports, nine metrics. FENICE fell
      versus baseline with RAG for both models in few-shot and fine-tuned
      settings; authors attribute this to manual inspection of wrong-sense
      Wikipedia matches. Sense ambiguity is diagnosed qualitatively, not
      isolated by an experiment holding retrieval quality fixed.
contested: false
status: pending-review
last_checked_at: 2026-09-09
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Same pipeline with the
  same surface-form retrieval showing claim-level factuality (FENICE/SummaC)
  at or above the no-retrieval baseline, or showing that the factuality drop
  persists when the retrieved definitions are all sense-correct. Drafted
  stance toward retrieval-moves-the-trust-boundary-rather-than-removing-it:
  supports -- Retrieved definitions were treated as reliable context and
  injected unsupported content, so grounding shifted the failure into the
  retrieval channel rather than removing it.
submitted_by: agent:claude-opus-5@Russ-Miller
conditions:
  effect: hurts
  needs:
    - retrieval-corpus
  fails_when: Retrieval matches on surface terms and fetches the wrong sense of
    an ambiguous term. Telling the model to ignore unrelated retrieved content
    does not prevent it incorporating it.
