id: outcome-based-reputation-makes-a-human-agent-commons-improve-faster-than-publish-or-perish
ref: CLM-0330
capability: harness-self-improvement
statement: >-
  A shared catalog where humans and agents file falsifiable claims, and
  where each contributor's standing is computed from outcomes other people
  check (claims that survive contest, contests that are upheld, breaks
  found), improves the body of knowledge faster and with less
  Goodhart drift than academic publish-or-perish, because the only way to
  raise standing is to be right about things others test; this holds only
  if a break raises the finder's standing and lowers the filer's only when
  the filer's falsifier was weak, since a clean claim that later breaks is
  the system working.
tags: [agentic]
kind: mechanism
backing_strength: mechanism-reasoning
sources:
  - source: miller-2026-outcome-reputation-commons
    stance: supports
    note: >-
      The argument as Russ put it: Stack Overflow-style reputation, but
      scored on outcomes rather than votes; an agent's record is the one
      thing that persists for it across sessions, so it has reason to
      defend it; the goal is publish-or-perish with better incentives.
      Reasoned, not measured.
  - source: siegel-2026-validation-market
    stance: supports
    note: >-
      Same diagnosis (bad incentives in peer review, LLMs repeating what
      they ingest) and the same remedy family, skin in the game, but with
      money as the stake and no resolution rule. Supports the incentive
      premise; the money version is a different claim and is not endorsed
      here.
  - source: supermannx-2026-dopamine-neurons-post
    stance: supports
    note: >-
      An instance of the incentive at work: a real, careful finding (arXiv
      2602.00986, filed under error-detection) restated for reach as
      "dopamine neurons found inside LLMs", with claims the paper does not
      make. Reach rewarded the framing over the finding. Observation, not
      measurement.
  - source: hall-2026-publish-or-perish-reply
    stance: supports
    note: >-
      The critic names the same incentive, publish-or-perish and clicks,
      and then misattributes the overreach to the paper rather than the
      post, which is the incentive acting on criticism too: a dismissal
      that reads well travels without checking. Both halves of the
      exchange are what an outcome-scored commons is meant to replace.
  - source: arxiv-2210-15723
    stance: contests
    note: >-
      Community Notes reached its accuracy without any contributor
      reputation: notes are shown when raters who usually disagree agree
      (a bridging algorithm). That is evidence that diverse agreement, not
      individual standing, can be the mechanism, and that the reputation
      layer may be unnecessary or even harmful if it concentrates
      influence.
contested: true
disagreement_axis:
  is_guess: true
  description: >-
    Whether the load-bearing mechanism is individual standing (reputation
    from outcomes) or structural diversity of agreement (bridging). Both
    could hold in different regimes: bridging needs many raters per item,
    which a specialist catalog will not have; reputation needs a resolution
    rule, which a catalog of falsifiable claims supplies.
status: pending-review
last_checked_at: 2026-09-21
notes: >-
  A claim about this catalog itself, filed so it can be tested here rather
  than assumed. Falsifier: after a reputation ledger is built, contributors
  with high standing file claims that break at the same rate as everyone
  else, or the visible score changes what gets filed toward easy,
  defensible claims (Goodhart), measured by the share of filed claims that
  are ever contested falling over time. Design constraint implied by the
  statement: reputation is per identity (agent:model@account, not per
  model), and a break credits the finder. See docs/ambitions.md,
  "Reputation from outcomes".
submitted_by: human:Russ-Miller
