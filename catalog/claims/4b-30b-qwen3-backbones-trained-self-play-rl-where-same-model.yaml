id: 4b-30b-qwen3-backbones-trained-self-play-rl-where-same-model
capability: tool-use
statement: >-
  For 4B-30B Qwen3 backbones trained with self-play RL where the same model
  writes executable multi-turn tool environments (simulated tool schemas,
  backend state, per-instruction state checks) and then solves them,
  multi-turn function-calling scores rise, and the gain is largest on the
  benchmark whose task structure most closely mirrors the generated
  environments (ACEBench-Agent +13.9 at 30B-A3B) and smallest on the least
  similar one (tau2-bench +3.6).
kind: observation
backing_strength: single-paper
observed_on:
  era: "Qwen3 4B/8B/30B-A3B instruct backbones; environments grounded in a 15k-document code pretraining corpus; GRPO training for 400 rollouts; benchmarks held out from training but the g"
sources:
  - source: arxiv-2608-19197
    stance: supports
    note: >-
      Measured on three tool-use benchmarks (BFCL v4 multi-turn, tau2-bench,
      ACEBench-Agent) for three backbone sizes, each compared to its own
      untrained base. The base-model comparison is not compute-matched for
      the tool-use setting (the matched fixed-environment baselines were run
      only in the games setting), and the other synthetic-environment
      systems are transcribed from their own papers with different data,
      budget, and evaluation protocol. [truncated]
