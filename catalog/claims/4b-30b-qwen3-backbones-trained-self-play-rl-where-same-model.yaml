  self-play environment-generation training and finding no improvement over
  a matched-compute fixed-environment baseline on multi-turn tool-calling
  benchmarks, or finding the gain uncorrelated with how closely a
  benchmark's task structure matches the generated environments. Proposed
  technique, not catalogued: Self-play RL over model-generated executable
  Gym-style environments.
