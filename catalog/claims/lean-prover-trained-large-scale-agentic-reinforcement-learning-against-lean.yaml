statement: >-
  A Lean prover trained with large-scale agentic reinforcement learning
  against the Lean checker, paired with a test-time workflow that drafts in
  natural language before formalizing, solved 88% of PutnamBench
  (undergraduate), 80% of Fate-H (graduate) and 33% of Fate-X (PhD-level),
  and 11 of 12 Putnam 2025 problems, at a smaller compute budget than prior
  systems, so formal proving at undergraduate level is largely solved while
  PhD-level remains open.
