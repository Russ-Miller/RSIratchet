id: 20-year-deterministic-football-management-simulation-340-400-decision-stops-15-frontier
ref: CLM-0340
capability: long-horizon-execution
technique: score-long-horizon-agents-behavioral-capability-axes-one
statement: >-
  In a 20-year deterministic football-management simulation with ~340-400
  decision stops, 15 frontier models all survive the full horizon but their
  final composite ranking is not predicted by model scale, price, vendor,
  token spend, or their own year-5 standing (rank correlation with the final
  order rises from about 0.19 at year 5 to 0.78 at year 15); what tracks
  score is managerial behavior — cutting slow-payoff investment near the
  end, not letting cash sit idle, and opening contract renewals early.
