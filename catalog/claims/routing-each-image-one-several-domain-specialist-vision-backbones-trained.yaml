id: routing-each-image-one-several-domain-specialist-vision-backbones-trained
ref: CLM-0707
capability: multi-model-coordination
technique: route-images-expert-backbones-prompted-mllm
statement: >-
  When routing each image to one of several domain-specialist vision
  backbones trained on a shared label space, a prompted MLLM router
  (Gemma-4-12B) reaches nearly the accuracy of a trained neural-network
  router and beats majority-vote fusion, because routing only needs coarse
  domain identification, which a general multimodal model already does
  zero-shot.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four visually disjoint datasets (CIFAR10, FER2013, EuroSAT, OrganAMNIST) with a unified 38-class head; domains differ sharply enough that a ResNet-18 router hits 99.5% domain accur"
sources:
  - source: arxiv-2608-13463
    stance: supports
    note: >-
      Validated by: Unified-dataset top-1 accuracy: ARMDIL 90.78% vs best
      single backbone (balanced DINOv3) 89.61%, majority vote 90.47%,
      trained NN-Router 91.18%, oracle router 91.04%; per-domain routing
      accuracy 78.2-99.8%.. Measured on one four-dataset unified benchmark
      with one MLLM (quantized Gemma-4-12B). Margins are small (0.31 points
      over majority vote, -0.40 behind the NN-router) with no confidence
      intervals or repeated runs, and the whole ensemble sits within ~1.2
      points of a single balanced DINOv3. [truncated]
