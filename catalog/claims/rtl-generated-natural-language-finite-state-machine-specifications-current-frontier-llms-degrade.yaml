id: rtl-generated-natural-language-finite-state-machine-specifications-current-frontier-llms-degrade
ref: CLM-1261
capability: code-generation
statement: >-
  When RTL is generated from natural-language finite-state-machine
  specifications, current frontier LLMs degrade sharply as the FSM's state
  and transition count grows: averaged over 18 models and three generation
  pipelines, accuracy falls from roughly 63-65% on 4-14-state machines to
  16-24% on 27-59-state machines, and even the best model drops from about
  95% to about 55-72% depending on pipeline.
kind: observation
backing_strength: single-paper
observed_on:
  era: "1,000 auto-generated spec-to-RTL problems with correct-by-construction reference RTL and transition-covering testbenches; Pass@1 under cycle-by-cycle output matching; three output "
sources:
  - source: arxiv-2602-07032
    stance: supports
    note: >-
      Measured: 18 models x 3 pipelines x 1,000 problems split into three
      state-count tiers, with reference RTL and testbenches synthesized from
      the same verified YAML, so the reference is not a confound. Spec
      length also grows with state count (409 to 1,265 words), so state
      count and context length are not separated. Difficulty tiers are
      defined by state count, so the complexity-accuracy relation is partly
      definitional to the tiering.
contested: false
status: pending-review
last_checked_at: 2026-11-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: high. Falsifier as drafted: A frontier model holding
  roughly flat Pass@1 from 4-state to 50+-state FSM specifications on this
  or an equivalent correct-by-construction benchmark, or showing the drop
  disappears once the specification text length is controlled.
