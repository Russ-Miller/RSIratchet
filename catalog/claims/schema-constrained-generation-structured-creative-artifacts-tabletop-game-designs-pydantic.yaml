id: schema-constrained-generation-structured-creative-artifacts-tabletop-game-designs-pydantic
ref: CLM-1034
capability: multi-model-coordination
technique: split-schema-constrained-generation-into-critic-bearing-specialist
statement: >-
  For schema-constrained generation of structured creative artifacts
  (tabletop game designs from a Pydantic ontology), adding output-schema and
  ontology constraints removes structural errors but leaves LLM-judged
  creative quality unchanged, and the creative gain only appears when
  generation is split into role-specialized agents with explicit critique
  roles.
kind: observation
backing_strength: single-paper
observed_on:
  era: "One generator model (Claude Sonnet 4, temp 0.7), 120 designs over 10 themes and 4 conditions, quality scored by a same-model LLM judge; the multi-agent condition also added retriev"
sources:
  - source: arxiv-2602-05636
    stance: supports
    note: >-
      Validated by: Ablation over 4 conditions x 10 prompts x 3
      replications: consistency errors fell 5.03 to 0.10 with schema alone
      (d=4.78), to 0 with ontology; creative scores moved only from the
      single-agent ontology condition to the full pipeline (fun d=1.12,
      strategic depth d=1.59, elegance d=1.14), at ~8.5x token cost.
      Replayability and social interaction did not separate any conditions,
      and the evaluator's ICC for replayability was only 0.578.. [truncated]
