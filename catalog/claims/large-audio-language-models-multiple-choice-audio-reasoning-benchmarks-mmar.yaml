id: large-audio-language-models-multiple-choice-audio-reasoning-benchmarks-mmar
ref: CLM-0364
capability: audio-understanding
technique: score-audio-cots-grounding-coherence-causality
statement: >-
  For large audio language models on multiple-choice audio reasoning
  benchmarks (MMAR, MMAU-mini), accuracy does not track whether the model's
  chain of thought is acoustically grounded or causally drives the answer:
  several models answer correctly from perception steps that assert
  unsupported labels, and for some models replacing the reasoning chain with
  vacuous or fabricated content leaves the final answer unchanged.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Nine LALMs (open and closed source) on two 1,000-item multiple-choice audio reasoning benchmarks, with reasoning externalized via a fixed four-step CoT prompt."
