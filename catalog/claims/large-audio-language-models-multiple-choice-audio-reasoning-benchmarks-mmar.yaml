    stance: supports
    note: >-
      Validated by: The six-metric mean correlated with 3-rater human CoT
      quality ratings at Spearman 0.671 (p=0.006) over 450 sampled
      instances, above every single metric (best M1, 0.563) and every
      two-metric subgroup; rankings also matched two LLM judges and
      CoT-perturbation-derived mode assignments, and were stable across
      datasets (model identity explained 91.9-96.4% of variance) and across
      scorer backbones.. Measured: per-metric scores and accuracy for 9
      models on 2 benchmarks, plus a manual CoT-perturbation check on
      randomly selected instances and 450 human-rated CoTs. [truncated]
