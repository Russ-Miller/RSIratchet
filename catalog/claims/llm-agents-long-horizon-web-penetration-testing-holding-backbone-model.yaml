id: llm-agents-long-horizon-web-penetration-testing-holding-backbone-model
ref: CLM-0388
capability: long-horizon-execution
technique: externalize-agent-state-onto-fact-intent-dag
statement: >-
  For LLM agents on long-horizon web penetration testing, holding the
  backbone model fixed and moving global state out of the context window
  onto a persistent graph of verified facts and fact-conditioned intent
  edges raises task success most on the hardest tasks, where success depends
  on facts obtained dozens of steps earlier (88.2% overall and 75.0% hard,
  vs 44.1% and 25.0% for the strongest shared-plain-text-memory baseline).
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Real CTF web challenges, more than ten vulnerability types, three difficulty levels; all agents on the same LLM API; 40-round per-task budget; the graph's offline prior corpus blac"
sources:
  - source: arxiv-2609-07344
    stance: supports
    note: >-
      Validated by: Task success rate against five baselines (PentestGPT,
      PentestAgent, Pentest-R1, VulnBot, Claude Code) on real CTF challenges
      with Fisher's exact test, plus average rounds per successful task (~7
      vs ~12-23.6) and an ablation removing only the intent retrieval module
      (33% and 48% more rounds on medium and hard, same solvable set)..
      Measured on a modest CTF set (about 34 tasks inferred from the
      per-level percentages), single paper, authors' own system. [truncated]
