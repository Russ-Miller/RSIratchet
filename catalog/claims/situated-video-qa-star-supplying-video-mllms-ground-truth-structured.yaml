notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A backbone whose
  accuracy barely rises when given ground-truth temporal clue tuples, or a
  model whose remaining errors under oracle clues are as large as its errors
  without them, would show the bottleneck is downstream reasoning rather
  than clue extraction.
