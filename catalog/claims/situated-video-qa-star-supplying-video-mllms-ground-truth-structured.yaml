id: situated-video-qa-star-supplying-video-mllms-ground-truth-structured
ref: CLM-1023
capability: video-temporal-reasoning
technique: supply-ground-truth-temporal-clue-tuples-separate-perception
statement: >-
  On situated video QA (STAR), supplying video MLLMs with ground-truth
  structured temporal clue tuples (subject, predicate, object, start/end
  frame) alongside the video and question raises accuracy by roughly 20
  points for architecturally diverse 7B-class backbones (Qwen2.5-VL +22.9,
  InternVideo2.5 +21.1), so the dominant limit on these benchmarks is
  extracting faithful temporal clues rather than reasoning over them once
  they are given.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Multiple-choice situated reasoning (STAR) with human-annotated scene-graph clue annotations converted to temporal quintuplets; 16-frame inputs; open-source 7B-class video MLLMs."
sources:
  - source: arxiv-2603-15008
    stance: supports
    note: >-
      Validated by: Accuracy on STAR with and without oracle clues across
      five backbones; gains of about 21-23 points, with ClueNet reaching
      94.8% and a residual ~5.2% gap concentrated in the Feasibility split
      requiring unobservable commonsense.. Measured on one benchmark (STAR)
      with five models, using clue annotations supplied by the dataset
      itself; the oracle condition also changes prompt content and length,
      so part of the gain may come from the extra textual scaffolding rather
      than clue correctness alone. No control feeding corrupted clues of the
      same format is reported.
contested: false
