id: across-eight-interactive-environments-models-fail-mostly-long-horizon
ref: CLM-0012
capability: tool-use
statement: >-
  Across eight interactive environments, models fail mostly on long-horizon tool interaction, with open models far behind commercial ones.
kind: mechanism
backing_strength: single-paper
sources:
  - source: arxiv-2308-03688
    stance: supports
    note: "Across eight interactive environments, models fail mostly on long-horizon tool interaction, with open models far behind commercial ones."
  - source: arxiv-2605-00334
    stance: contests
    note: >-
      Contests the second half only. On a 30-task ladder over 16,542 scored
      runs, the strongest open-weight model matches GPT-5 in aggregate, and
      small-to-mid open models suffice for the short-horizon structured tool
      use that dominates real pipelines. It agrees that long-horizon planning
      is where the gap remains, and adds that neither side is reliable there.
contested: true
disagreement_axis:
  description: >-
    Task horizon, and how the aggregate is taken. The supporting benchmark
    scores whole interactive episodes, where open models trailed in 2023; the
    contesting one scores a ladder whose lower tiers are short structured
    calls by construction, on 2026 open weights, and reports an aggregate
    across all tiers. Both agree open models lag on long-horizon planning, so
    the disagreement may be about what "agent work" averages over, and about
    two and a half years of open-weight progress, rather than about a fact.
  is_guess: true
status: active
last_checked_at: 2026-09-26
