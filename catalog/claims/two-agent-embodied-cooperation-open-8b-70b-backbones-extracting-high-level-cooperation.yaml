id: two-agent-embodied-cooperation-open-8b-70b-backbones-extracting-high-level-cooperation
ref: CLM-0759
capability: multi-model-coordination
technique: distil-cooperation-laws-failures-into-chain-thought
statement: >-
  For two-agent embodied cooperation with open 8B-70B backbones, extracting
  high-level cooperation laws from the agents' own failed episodes,
  filtering successful traces for law-alignment, and fine-tuning on
  law-grounded reasoning raises success rates over communicative agent
  frameworks (RoCo, CoELA, CommPARTNR) without any stronger teacher model —
  but on the weakest backbone every communicative framework, including this
  one, still scores below a non-communicative ReAct planner.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Two-agent embodied benchmarks (PARTNR-Dialog, TDW-MAT) with LLaMA-3.1-8B/70B, Gemma-3-12B, Qwen-3-14B; two-agent setting only, no larger teams tested."
sources:
  - source: arxiv-2606-28182
    stance: supports
    note: >-
      Validated by: Success rate and percentage-complete on PARTNR-Dialog
      (1,000 validation episodes) and TDW-MAT against ReAct, RoCo, CoELA and
      CommPARTNR with the same backbones: average +4.5% success on
      PARTNR-Dialog and +6.8% on TDW-MAT over the strongest communicative
      baseline; ablations removing SFT (-5% success), removing laws, and
      removing trace filtering each lose ground, and an inference-only RAG
      variant does not close the SFT gap. On LLaMA-3.1-8B it beats all
      communicative baselines (0.57) but trails ReAct (0.62). Three seeds
      give success 0.74/0.72/0.74.. [truncated]
