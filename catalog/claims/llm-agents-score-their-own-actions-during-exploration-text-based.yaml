id: llm-agents-score-their-own-actions-during-exploration-text-based
ref: CLM-0408
capability: harness-self-improvement
technique: separate-self-judged-scores-verifier-rewards-measure-both
statement: >-
  For LLM agents that score their own actions during exploration in
  text-based games and then reuse that experience, the accuracy of those
  self-scores against the environment verifier does not predict later gains
  on held-out stricter configurations: block-level correlations between
  judgment agreement or calibration and the next checkpoint's score change
  sit near zero, so recognizing a good action is not the bottleneck —
  converting it into a transferable policy is.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Seven text-based games with executable verifiers; seven proprietary models; verifier rewards hidden from the agent during exploration; context-level (history or summary) reuse path"
sources:
  - source: arxiv-2608-31100
    stance: supports
    note: >-
      Validated by: 116,117 transitions over 98 runs: event agreement and
      normalized MAE per game, plus blockwise and run-level correlations
      with normalized score change (rho(A,g) = -0.010, rho(-E,g) = -0.018;
      run-level r = -0.23 with normalized above-baseline area).. Measured
      across 7 games and 7 models with an executable verifier as ground
      truth; correlations are near zero and sometimes slightly negative, but
      improvement itself is sparse and noisy in several games (many zero
      scores), which limits how much signal the correlation could show.
