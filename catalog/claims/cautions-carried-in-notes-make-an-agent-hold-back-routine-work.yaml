id: cautions-carried-in-notes-make-an-agent-hold-back-routine-work
ref: CLM-0955
capability: procedure-following
statement: "Cautious rules that build up in an agent’s carried context
  (memory, notes, instruction files, reviewer messages) make Claude Fable
  5.2 hold back routine work: one never-retry note among a dozen cut retries
  after a busy tool from nearly all tries to about four in ten. A general
  instruction to act more freely changed nothing, while naming retries among
  the steps needing no approval raised them from almost none to about half,
  and writing the exception into the rule itself raised an approved step
  from one try in ten to nine in ten."
kind: observation
backing_strength: single-paper
sources:
  - source: anthropic-2026-prompting-claude-fable-5-2
    stance: supports
    note: "Section “Keep caution from piling up”, simulated tasks, seen mostly
      where several agents work together; in one setup only Fable 5.2 held
      back, while Fable 5.1 and Opus 5.5 retried. The guide’s advice: delete
      cautions whose reason no longer holds and rewrite absolute rules to
      state their scope and reason."
contested: false
status: pending-review
last_checked_at: 2026-11-10
tags: [agentic, autonomous-agent]
notes: Filed as an observation about Claude Fable 5.2 as tested by its
  vendor, not a mechanism. Capped at single-paper because the guide reports
  measurements; the tasks were Anthropic’s own, mostly small or simulated,
  and cannot be checked from outside.
