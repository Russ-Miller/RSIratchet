id: two-audio-clips-concatenated-waveform-level-into-one-input
ref: CLM-0614
capability: audio-understanding
statement: >-
  When two audio clips are concatenated at the waveform level into one
  input, current large audio language models keep transcribing both segments
  nearly as well as single clips while their accuracy on content, order and
  location questions about the same two segments drops far below their
  single-clip attribute-recognition accuracy.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four LALMs (Audio-Flamingo-Next, MiMo-Audio, Step-Audio-R1, Qwen3-Omni); two-segment waveform concatenation with no silence or boundary marker; ASR on LibriSpeech test-clean, AQA b"
sources:
  - source: arxiv-2608-27026
    stance: supports
    note: >-
      Measured: WER rose 0.10-1.30 points (staying under 4.5%) across four
      models, while concatenated AQA fell to 35.33-67.33% for three models
      against single-segment controls of 85.17-98.00%; Qwen3-Omni degraded
      least (82.67-88.67%). Single-segment controls isolate basic
      recognition from multi-segment processing. Attention knockout and
      probing were run on separate standard benchmarks, not on the failing
      concatenated cases, so the mechanism is not pinned to the failure.
contested: false
status: pending-review
last_checked_at: 2026-10-22
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model that holds
  concatenated-input AQA accuracy at its single-segment level, or one whose
  ASR degrades as much as its AQA under the same concatenation.
