id: rubric-based-llm-judging-without-references-or-training-eliciting-criteria
ref: CLM-0692
capability: critique
technique: elicit-rubric-criteria-several-evaluator-roles-then-pool
statement: >-
  For rubric-based LLM judging without references or training, eliciting
  criteria from a small fixed set of complementary evaluator roles (user,
  domain expert, educator, AI researcher, linguist) and pooling them raises
  pairwise preference agreement over single-evaluator rubric generation, and
  the gain is not explained by criterion count — repeating single-voice
  generation five times and deduplicating stays well below the multi-role
  rubric.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Instruct models from 3B to 120B used as both rubric generator and per-criterion yes/no judge; binary criteria with self-assigned 1-3 weights; exact-match deduplication only; open-e"
sources:
  - source: arxiv-2607-01830
    stance: supports
    note: >-
      Validated by: Accuracy on RewardBench-2, JudgeBench and PPE against
      single-voice rubric generation with and without sample responses and
      against Chasing the Tail, across five backbones (reported gains
      3.1-16.4 points over the strongest baseline); a repeated-single-voice
      control with the same post-processing stayed 7.3 and 10.0 points below
      on RewardBench-2 and JudgeBench; also used as the GRPO reward,
      improving BiGGen Bench by 1.7 and HealthBench-Hard by 3.4 over the
      best single-voice reward.. [truncated]
