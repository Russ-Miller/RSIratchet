id: rule-based-expedited-ethics-review-research-dossiers-grounding-assessment-scenario-partitioned
ref: CLM-1048
capability: multi-model-coordination
technique: match-scenario-partitioned-rule-graph-then-check-each
statement: >-
  For rule-based expedited ethics review of research dossiers, grounding the
  assessment in a scenario-partitioned executable rule graph with per-rule
  evidence retrieval raises violation-detection F1 far more than switching
  to a larger general-purpose backbone: in zero-shot prompting all tested
  models score F1 0.15-0.23, while the same models inside the rule-grounded
  pipeline reach 0.58-0.65, and an 8B ethics-fine-tuned model inside it
  reaches 0.84.
kind: observation
backing_strength: single-paper
observed_on:
  era: "100 de-identified real-world ethics dossiers, expert-annotated violated rules; Chinese life-science review context; baselines DeepSeek-V3, GPT-4.1, Qwen3-8B"
sources:
  - source: arxiv-2602-13292
    stance: supports
    note: >-
      Validated by: Expert-annotated recall/precision/F1 and a
      professionalism rating on 100 real dossiers, compared against the same
      models prompted zero-shot on the full dossier.. Measured on one
      100-dossier benchmark with expert labels; the pipeline-vs-zero-shot
      contrast is run across three backbones, which isolates the harness
      from model identity, but the best cell also changes the backbone
      (ethics-fine-tuned 8B), so harness and domain fine-tuning are not
      separated at the top score. No-pruning rule matching biases toward
      recall, which the paper's metric weights. [truncated]
