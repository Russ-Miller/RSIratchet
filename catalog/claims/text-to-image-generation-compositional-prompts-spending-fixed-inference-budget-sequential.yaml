    stance: supports
    note: >-
      Validated by: Compute-matched comparison against parallel sampling
      with the same verifier on ConceptMix (+16.9 all-correct at k=7 for
      Qwen-Image), T2I-CompBench 3D-Spatial (+13.8), TIIF-Bench, and Visual
      Jenga full solve rate (64.29% to 76.79%); human preference 58.7% vs
      41.3%; budget allocation ablation across B=1..16 and an action-space
      ablation.. Measured on three T2I families across four benchmarks with
      a compute-matched parallel baseline and an in-loop critic weaker than
      the benchmark evaluator; [truncated]
