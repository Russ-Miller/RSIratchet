id: text-to-image-generation-compositional-prompts-spending-fixed-inference-budget-sequential
ref: CLM-1064
capability: self-repair
technique: refine-images-sequentially-under-vlm-critic-instead-resampling
statement: >-
  For text-to-image generation from compositional prompts, spending a fixed
  inference budget on sequential critic-guided edits (a VLM compares image
  to prompt, emits a sub-prompt plus continue/backtrack/restart action, an
  editor applies it) beats spending the same budget on independent parallel
  samples scored by the same verifier, and the margin widens as the number
  of concept bindings in the prompt grows.
kind: mechanism
backing_strength: single-paper
