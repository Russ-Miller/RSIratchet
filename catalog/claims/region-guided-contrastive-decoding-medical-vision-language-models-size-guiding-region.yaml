id: region-guided-contrastive-decoding-medical-vision-language-models-size-guiding-region
ref: CLM-0471
capability: visual-grounding
technique: pick-contrast-region-counterfactual-occlusion-penalizing-size
statement: >-
  For region-guided contrastive decoding in medical vision-language models,
  the size of the guiding region, not its provenance, sets the gain: compact
  automatically discovered masks (about 7% image coverage) outperform
  ground-truth bounding boxes (about 39% coverage), because suppressing a
  large region strips nearly all visual evidence from the unconditional
  branch and dilutes the contrast.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Three Med-VLMs (Phi-3.5V-Med, HuatuoGPT-Vision-7B, LLaVA-Med-7B) on SLAKE and MIMIC-CXR VQA; classifier-free-guidance-style decoding with an ROI-suppressed branch."
sources:
  - source: arxiv-2608-17427
    stance: supports
    note: >-
      Validated by: Overall/closed/open accuracy on SLAKE and MIMIC-CXR
      against plain decoding, VCD, DoLA, OPERA and ground-truth-ROI ARCD
      across three Med-VLMs; closed accuracy on Phi-3.5V-Med/SLAKE rose
      61.42 to 81.49; ablations removing the area penalty (-3.4%), using
      random masks (-4.4%), or a single occlusion mode (-3.3/-4.0%)..
      Measured on two Med-VQA datasets and three models, with ablations
      isolating the area penalty, selection criterion and occlusion modes,
      plus a coverage analysis (39.41% GT vs 7.05% CAST mean coverage)
      showing GT helps only when compact. [truncated]
