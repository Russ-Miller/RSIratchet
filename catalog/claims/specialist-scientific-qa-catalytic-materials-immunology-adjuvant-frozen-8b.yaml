id: specialist-scientific-qa-catalytic-materials-immunology-adjuvant-frozen-8b
ref: CLM-1175
capability: domain-knowledge
technique: inject-expert-hidden-states-latent-memory-slots-text
statement: >-
  For specialist scientific QA (catalytic materials, immunology adjuvant)
  with a frozen 8B base model, distilling a fine-tuned 1.7B domain expert's
  multi-layer hidden states into a handful of projected latent memory slots
  scores higher than retrieval (RAG, GraphRAG, xRAG), prompt tuning and LoRA
  SFT, and unlike those tuning baselines it does not lower general-domain
  exact match.
