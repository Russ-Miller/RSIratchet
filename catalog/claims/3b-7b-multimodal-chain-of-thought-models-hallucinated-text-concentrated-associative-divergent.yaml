    stance: supports
    note: >-
      Validated by: CHAIR_S/CHAIR_I on Object HalBench, accuracy/F1 on three
      POPE splits, MMHalBench score, plus MathVista/MMStar/VSR, against
      DoLa, VCD, MemVR, FlexAC and against intervening on all thinking or
      normal-only steps (PixelReasoner-7B: 22.0 to 15.4 CHAIR_S
      divergent-only vs 16.1 all-thinking vs 21.8 normal-only, MathVista
      62.6 to 64.0 vs 61.4 vs 62.7).. Measured on three MCoT backbones and
      three hallucination benchmarks with four mitigation baselines, plus an
      intervention-location ablation that isolates the divergent-only
      choice. [truncated]
