id: 3b-7b-multimodal-chain-of-thought-models-hallucinated-text-concentrated-associative-divergent
ref: CLM-0976
capability: visual-grounding
technique: penalize-high-visual-entropy-tokens-only-during-divergent
statement: >-
  In 3B-7B multimodal chain-of-thought models, hallucinated text is
  concentrated in associative ('divergent') reasoning steps rather than
  spread evenly through the chain, and those steps are marked by high
  entropy of the token's activation probability over visual tokens — so
  penalizing high-visual-entropy tokens only at those steps lowers
  object-hallucination rates more than applying the same penalty across the
  whole thinking trace.
kind: mechanism
backing_strength: single-paper
