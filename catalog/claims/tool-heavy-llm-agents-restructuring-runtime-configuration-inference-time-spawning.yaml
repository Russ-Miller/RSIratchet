id: tool-heavy-llm-agents-restructuring-runtime-configuration-inference-time-spawning
ref: CLM-1207
capability: harness-self-improvement
technique: hire-evict-sub-agents-runtime-detected-capability-gaps
statement: >-
  For tool-heavy LLM agents, restructuring the runtime configuration at
  inference time — spawning specialized sub-agents on detected capability
  gaps and evicting idle ones under an LRU policy — is claimed to keep task
  success high at lower token cost than a static multi-agent swarm, but the
  paper reports no measured baseline comparison.
