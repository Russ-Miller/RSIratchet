notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Removing both memory hubs
  leaves LIBERO-Long success unchanged, or randomly permuting the short-term
  history frames at inference leaves success unchanged — either would show
  the hubs are not carrying order-dependent temporal information.
