id: long-document-tasks-8k-128k-tokens-six-un-languages-middle-of-context-penalty
ref: CLM-0428
capability: long-context-degradation
statement: >-
  On long-document tasks (8K-128K tokens, six UN languages), the
  middle-of-context penalty is not uniform across task granularity:
  word-level QA and paragraph filling are worst when the evidence sits
  mid-document, while sentence-cloze accuracy peaks in the middle because
  mid-paragraph sentences carry concrete entity overlap that models match on
  instead of reasoning about discourse role.
kind: observation
backing_strength: single-paper
observed_on:
  era: "12 long-context LLMs, zero-shot, UN report documents 8K-128K tokens, evidence position stratified into begin/middle/end at paragraph and document level; instruction and options app"
sources:
  - source: arxiv-2608-20853
    stance: supports
    note: >-
      Measured across 12 models and 420 pairs per task per language; the
      surface-cue explanation for the middle peak is supported by
      LLM-generated error categorization on cases where over half of models
      failed, verified by human checkers — an interpretive step, not a
      controlled manipulation of lexical overlap.
contested: false
status: pending-review
last_checked_at: 2026-10-03
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication
  stratifying by position and granularity on comparable long documents
  finding the same middle dip for sentence-level cloze as for word-level QA,
  or showing the cloze middle-peak survives when lexical overlap between
  candidates and nearby text is equalized.
