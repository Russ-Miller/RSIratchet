id: agent-generates-whole-python-repository-natural-language-requirements-no-given
ref: CLM-0553
capability: code-generation
technique: evolve-component-boundaries-modularity-metrics-until-convergence
statement: >-
  When an agent generates a whole Python repository from natural-language
  requirements with no given architecture, keeping the repository
  architecture as a mutable state that is re-evolved before code generation
  yields higher functionality coverage and test pass rate than executing a
  single up-front planning graph, and removing the evolution step is the
  largest single ablation loss.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Six real-world Python repositories from RepoCraft, GPT-5 mini and DeepSeek V3.2 backbones, with all methods sharing the same downstream TDD code-generation and repair scaffold."
sources:
  - source: arxiv-2608-19854
    stance: supports
    note: >-
      Measured on three of six repositories reported in the main table
      (others in supplementary), two backbones, three averaged runs,
      cross-model evaluation to limit judge bias; baselines share the
      generation pipeline so architecture is isolated, but metric thresholds
      were tuned on held-out repos and all quality scores come from
      LLM-based matching plus adapted tests.
contested: false
status: pending-review
last_checked_at: 2026-10-26
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A run holding the
  downstream generation scaffold fixed where the architecture-evolution loop
  gives no coverage or pass-rate gain over a one-shot planning graph, or
  where removing the evolution step costs less than removing other
  components. Drafted stance toward
  agent-builds-whole-python-repository-natural-language-requirements-alone-refining:
  supports -- Same setup and finding: metric-guided boundary evolution to
  convergence beats both one-shot planning and fixed-budget LLM-decided
  restructuring on coverage and pass rate.
