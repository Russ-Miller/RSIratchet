id: grounded-multi-agent-construction-under-partial-information-where-three-llm
ref: CLM-1129
capability: multi-model-coordination
technique: score-collective-pragmatic-sufficiency-per-agent-message-quality
statement: >-
  In grounded multi-agent construction under partial information, where
  three LLM 'Director' agents with complementary private 2D views instruct a
  fixed Builder, judged individual communication quality does not predict
  joint task success: frontier models score higher on spatial-grounding and
  mind-modeling judges yet reach lower final task progress than several
  7B-72B open-weight models, because better use of a private view produces
  correction-heavy instructions that drive over-removal.
