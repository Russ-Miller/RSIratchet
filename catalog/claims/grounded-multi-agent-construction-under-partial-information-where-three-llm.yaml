      followed the oracle move: spatial-grounding and mind-modeling scores
      were near-identical across both conditions while pragmatic-sufficiency
      scores dropped sharply when the oracle move was not taken.. Measured:
      15 models x 20 structures x 20 turns x 3 runs. Frontier mean progress
      0.387 vs open-weight 0.525 while scoring higher on SG (0.829 vs 0.658)
