id: 7-13b-multimodal-models-verifying-each-object-claim-frozen-open-vocabulary
ref: CLM-0337
capability: visual-grounding
technique: verify-object-claims-cross-query-semantic-spatial-agreement
statement: >-
  For 7-13B multimodal models, verifying each object claim with a frozen
  open-vocabulary detector lowers object hallucination only if evidence is
  pooled across semantically equivalent phrasings and checked for spatial
  agreement (the preferred boxes of different queries overlapping on one
  instance); a single-query maximum score is a weaker signal, and shuffling
  the spatial evidence across samples drives its discrimination to chance.
