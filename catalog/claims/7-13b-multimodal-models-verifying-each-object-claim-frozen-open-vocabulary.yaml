      sources rose 1.81 (Popular) and 3.17 (Adversarial) points over
      vanilla, CHAIRs fell 49.40 to 32.80 and CHAIRi 13.82 to 8.22; a
      matched-random-deletion control removing the same number of claims
      only reached CHAIRs 43.40; ablations show single-query 80.20 vs full
