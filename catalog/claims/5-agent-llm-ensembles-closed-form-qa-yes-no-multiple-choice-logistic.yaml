id: 5-agent-llm-ensembles-closed-form-qa-yes-no-multiple-choice-logistic
ref: CLM-1000
capability: multi-model-coordination
technique: score-ensemble-confidence-disagreement-structure-vote-margin
statement: >-
  In 5-agent LLM ensembles on closed-form QA (yes/no and multiple-choice), a
  logistic regression over LLM-extracted disagreement-structure features
  (evidence overlap, minority argument strength, divergence depth, majority
  confidence language) separates correct from incorrect consensus answers
  better and far more calibratedly than vote-margin, vote-entropy or
  verbalized-confidence baselines, except on benchmarks where base accuracy
  is already near ceiling.
kind: observation
backing_strength: single-paper
observed_on:
  era: "5 role-specialized agents from one 27B model, four closed-form QA benchmarks, 2,750 questions; requires labelled data to fit the classifier; fails to beat heuristic baselines on a "
sources:
  - source: arxiv-2603-20975
    stance: supports
    note: >-
      Validated by: 5-fold cross-validated AUROC and ECE on StrategyQA,
      MMLU, TruthfulQA, ARC-Challenge against six baselines including an LLM
      aggregator reading all agent responses: average AUROC 0.802 vs 0.791
      best baseline, ECE 0.036 vs 0.098; leave-one-benchmark-out training
      gave the same average AUROC (0.802).. Measured on 2,750 questions
      across four benchmarks with nine methods and bootstrap significance on
      three of four benchmarks. Ablation shows structure features add 6.9
      AUROC points over vote confidence alone on StrategyQA. [truncated]
