id: wireless-covert-communication-tasks-current-llms-handle-conceptual-multiple-choice-questions
ref: CLM-1268
capability: domain-knowledge
statement: >-
  On wireless covert-communication tasks, current LLMs handle conceptual
  multiple-choice questions and code implementation far better than the
  multi-step detection-theoretic optimization derivations the domain
  actually requires (best models ~80-83% on MCQ and code versus 18-55% on
  derivations), and a common derivation failure is maximizing transmission
  utility while ignoring the covertness constraint.
kind: observation
backing_strength: single-paper
observed_on:
  era: "237 MCQ, 148 derivation and 132 code-generation items built from covert-communication literature (IRS, NOMA, MIMO scenarios); 15 models from 7B open-weight to frontier APIs; deriva"
sources:
  - source: arxiv-2601-18315
    stance: supports
    note: >-
      Measured on a 517-item human-verified benchmark with per-type metrics;
      derivation scores are expert-graded, MCQ and code automated. No
      ablation separating mathematical difficulty from
      covert-communication-specific knowledge, so the gap could partly be
      general symbolic-integration weakness rather than domain-specific.
      Constraint-violation finding is qualitative error analysis, not
      quantified.
contested: false
status: pending-review
last_checked_at: 2026-11-23
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model scoring
  comparably on the derivation items and the conceptual/code items on this
  benchmark, or expert re-grading showing the derivation gap comes from
  rubric strictness rather than wrong reasoning steps.
