statement: >-
  When RL fine-tuning a frontier model for Triton GPU kernel generation with
  a verifiable reward that is mostly saturated by correctness (logistic
  reward shifted so a TorchInductor-parity kernel already earns about half
  the maximum), functional correctness rises far more than speed: GPT-5 went
  from 43.7% to 77.0% correct single-attempt while geometric mean speedup
  over TorchInductor moved only 0.73x to 0.81x.
