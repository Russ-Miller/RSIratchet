id: software-architecture-diagrams-behavioral-structural-er-paired-counting-retrieval
ref: CLM-0897
capability: software-architecture
statement: >-
  On software architecture diagrams (behavioral, structural, ER) paired with
  counting and retrieval questions, current VLMs read visually explicit
  labels and locally grouped elements fairly well but fail at relational
  grounding — associating an attribute, method or label with the correct
  structural element — and accuracy falls as the number of entities and
  relations grows, with the best of 11 models reaching only about 70%
  overall.
kind: observation
backing_strength: single-paper
observed_on:
  era: "154 curated real-world diagrams, 2,431 template-generated QA pairs, 11 VLMs from Gemini/Claude/GPT/Qwen families, temperature 0, exact-match plus LLM-judge scoring"
sources:
  - source: arxiv-2604-04009
    stance: supports
    note: >-
      Measured: per-subtype accuracy, MAE and tolerance accuracy for
      counting, precision/recall/F1 plus subset/superset rates for
      retrieval. Best model gemini-3-flash-preview 70.18%, worst gpt-4o-mini
      17.77%; ER easiest, behavioral hardest. A separate 60-case hard set
      shows all models below 40% on non-rightward and overlapping arrows.
      Diagrams come from public sources, so contamination is argued away
      rather than controlled; questions are template-generated, so subtype
      difficulty may partly reflect template phrasing.
contested: false
status: pending-review
last_checked_at: 2026-11-06
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A VLM scoring
  near-ceiling on the same benchmark, or showing no accuracy decline with
  diagram complexity and no gap between label-reading and relation-grounding
  subtypes.
