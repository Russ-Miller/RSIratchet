ref: CLM-0590
capability: code-generation
technique: inject-proof-graph-correctness-obligations-then-consolidate-code
statement: >-
  When fine-tuning a 4B code model, training on auxiliary targets that name
  each program region's correctness obligations (derived from aligning an
  AST implementation graph with Lean proof-flow traces) raises solved counts
  over code-only SFT, but the auxiliary-target stage alone shifts the model
  off the Python-only output distribution and must be followed by a
  code-only consolidation stage to avoid losing broad function-level
  ability.
