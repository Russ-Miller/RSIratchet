id: llm-agents-acting-through-stateful-tools-over-many-turns
ref: CLM-0360
capability: tool-use
technique: score-whole-agent-trajectories-five-safety-outcomes
statement: >-
  For LLM agents acting through stateful tools over many turns, unsafe
  policy-violating completions accumulate with the interaction budget and
  are roughly doubled when the adversarial user conditions each next request
  on the agent's actual prior response, so single-turn or short-prefix
  safety evaluation understates the failure rate.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Simulated multi-domain tool environments with explicit policies and authorization state; 13 proprietary and open-weight models; average trajectory length about 14.7 turns."
sources:
  - source: arxiv-2609-16305
    stance: supports
    note: >-
      Validated by: Applied to more than 2,500 trajectories across 22 attack
      families and 35 scenarios; showed unsafe completion rates rising with
      turn budget (e.g. GPT-4o 5% at 1 turn to 22% at full horizon) and
      non-adaptive vs adaptive UCR gaps of 1.6x-4.0x, plus safe-twin
      over-refusal rates that separate broadly refusing models from
      calibrated ones.. Measured on a self-built live simulation with
      model-based judges plus human review on low-confidence cases;
      [truncated]
contested: false
