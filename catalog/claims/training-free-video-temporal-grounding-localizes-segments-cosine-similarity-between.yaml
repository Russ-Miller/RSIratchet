id: training-free-video-temporal-grounding-localizes-segments-cosine-similarity-between
capability: video-temporal-reasoning
statement: >-
  In training-free video temporal grounding that localizes segments by
  cosine similarity between a text query embedding and video features,
  clip-level features alone localize worse than frame-level features alone,
  yet projecting clip similarities onto the frame timeline and mixing the
  two streams beats either alone, because frames supply boundary resolution
  and clips supply temporal context.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Similarity-matching pipelines with a frozen video-capable VLM embedding backbone (Qwen3-VL-Embedding-8B, 3 fps frames, 4s/2s clip windows), evaluated on Charades-STA and QVHighligh"
sources:
  - source: arxiv-2609-08850
    stance: supports
    note: >-
      Single ablation table on Charades-STA: frame-only 47.06 mIoU,
      clip-only 42.82, fused 51.30, with R@0.7 rising from 27.69/15.40 to
      32.23. Query-side test-time adaptation contributes a smaller separate
      gain (45.69 to 47.06). One backbone family, two benchmarks; no
      isolation of kernel bandwidth or mixing weight choice, and the fusion
      weight is a tuned hyperparameter.
contested: false
