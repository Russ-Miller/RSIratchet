id: language-models-inherit-the-positive-bias-of-the-literature
ref: CLM-0518
capability: evaluation-validity
statement: >-
  Language models trained on the published literature inherit its positive
  bias, because failure data is systematically missing from what they read,
  and that degrades them in three roles at once — as research tools that
  suggest what to try, as consumers of scarce high-quality training data,
  and as peer reviewers — so the absence of negative results now costs more
  than it did when only people read the papers.
kind: mechanism
backing_strength: mechanism-reasoning
sources:
  - source: arxiv-2604-06236
    stance: supports
    note: >-
      A position paper that argues the mechanism and outlines experimental
      protocols to test it; the protocols are proposed, not run.
contested: false
status: pending-review
last_checked_at: "2026-10-19"
notes: >-
  Why the catalog's failure-first design matters for models, not only for
  researchers: an agent that asks a model what works is asking a reader of a
  tilted sample.
