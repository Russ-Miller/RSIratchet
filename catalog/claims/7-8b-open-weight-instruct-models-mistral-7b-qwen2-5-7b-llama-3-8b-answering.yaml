id: 7-8b-open-weight-instruct-models-mistral-7b-qwen2-5-7b-llama-3-8b-answering
ref: CLM-0342
capability: hallucination
technique: rank-feed-forward-neurons-class-conditional-residual-contribution
statement: >-
  In 7-8B open-weight instruct models (Mistral-7B, Qwen2.5-7B, Llama-3-8B)
  answering closed-book factual questions, a small set of feed-forward
  neurons (top 1% or fewer) selected on one dataset by class-conditional
  separation of their residual-space contribution at the final prompt token
  transfers to other factual QA datasets, where probes on those neuron
  activations detect hallucination about as well as probes on full
  residual-stream or MLP-output states.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three 7-8B instruction-tuned models, greedy zero-shot closed-book generation; neurons selected on a CounterFact-derived set and transferred to TriviaQA and TruthfulQA; signal read "
sources:
  - source: arxiv-2609-14448
    stance: supports
    note: >-
      Validated by: AUROC on TriviaQA (held-out dev split) and TruthfulQA
      (5-fold) against perplexity, mean/min logits, P(True), and linear and
      MLP probes on mlp_out and resid_post; the neuron classifier ranked in
      the top two on all six model-dataset pairs.. Measured AUROC across
      three models and two datasets with several baselines; no random-neuron
      control at the transfer stage and no causal intervention, so the
      selection's contribution over an arbitrary sparse feature set is not
      isolated.
contested: false
