    stance: supports
    note: >-
      Validated by: Applied to all 179 responses; rubric scores spread
      0.6629-0.8250 across topics while ROUGE-1 stayed 0.0876-0.1285. No
      inter-rater reliability or comparison to human quality judgements
      reported.. Measured on one system over 179 curated TCS questions. The
      zero BLEU-4 result is unambiguous; the claim that the rubric is the
      better measure is argued, not validated against human raters or
      learning outcomes. No baseline system was scored for comparison, so
      the divergence is shown within one system rather than across systems.
