technique: score-math-explanations-criteria-rubric-n-gram-overlap
statement: >-
  When free-form model answers to mathematical proof and complexity-analysis
  questions are scored against instructor reference answers, n-gram overlap
  metrics carry almost no signal: BLEU-4 was exactly zero on all 179
  questions and ROUGE-1 F1 stayed in a narrow low band across all seven
  topics, while rubric-based scores of the same answers varied widely,
  because logically equivalent proofs use different notation, variables and
  proof strategies.
