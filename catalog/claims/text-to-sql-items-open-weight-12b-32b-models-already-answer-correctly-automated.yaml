id: text-to-sql-items-open-weight-12b-32b-models-already-answer-correctly-automated
ref: CLM-0728
capability: formal-query-synthesis
technique: evolve-codex-failure-archetypes-probe-text-to-sql
statement: >-
  On text-to-SQL items that open-weight 12B-32B models already answer
  correctly, an automated search for semantics-preserving perturbations of
  the question or schema flips most of them to wrong (average exposure
  76.98% on BIRD, 58.45% on Spider), and the perturbation patterns that work
  on one model transfer to other architectures, so benchmark execution
  accuracy reflects a fragile region rather than stable competence.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Three open models (Gemma-3-12B, OmniSQL-32B, inf-rl-qwen-coder-32B) on BIRD and Spider; perturbations validated as semantics-preserving by an LLM checker agent, not by human annota"
sources:
  - source: arxiv-2607-03833
    stance: supports
    note: >-
      Validated by: Vulnerability Exposure Rate and Attempts per Discovery
      against a static expert-rule baseline built from
      Dr.Spider/SpiderSyn/ADVETA: VER 76.98% vs 50.66% on BIRD and 58.45% vs
      39.79% on Spider, with lower attempts per discovery; plus cross-model
      transfer gains and a 1,580-sample SFT mitigation run.. Measured on the
      initially-correct subset of BIRD and Spider for three models, with an
      expert-rule control at matched framework. [truncated]
