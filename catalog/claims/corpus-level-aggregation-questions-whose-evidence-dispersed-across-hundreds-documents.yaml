id: corpus-level-aggregation-questions-whose-evidence-dispersed-across-hundreds-documents
ref: CLM-0999
capability: long-context-degradation
technique: consolidate-corpus-into-fixed-size-memory-chunk-chunk
statement: >-
  On corpus-level aggregation questions whose evidence is dispersed across
  hundreds of documents (comparison, ranking, filtering, counting over
  128K-10M token corpora), top-k retrieval degrades far faster with corpus
  size than iterative chunk-wise memory consolidation, because the number of
  chunks needed to cover the evidence exceeds the retrieval budget, while
  both approaches lose most of their accuracy by 10M tokens.
