  Drafted confidence: medium. Falsifier as drafted: Training the same model
  on an equal volume of additional expert success traces instead of
  correction traces yields the same or better solve rate, showing the gain
  came from data volume rather than failure-derived supervision. Drafted
  stance toward
  3b-7b-vision-language-gui-agents-making-each-step-predict-expected:
