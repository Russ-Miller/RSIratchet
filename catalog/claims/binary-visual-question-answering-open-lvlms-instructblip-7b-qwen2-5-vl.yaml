id: binary-visual-question-answering-open-lvlms-instructblip-7b-qwen2-5-vl
ref: CLM-0556
capability: hallucination
technique: probe-consistency-four-axes-one-score
statement: >-
  For binary visual question answering with open LVLMs (InstructBLIP-7B,
  Qwen2.5-VL, InternVL-4B), a hallucinated answer can be held with high
  response consistency, so a single consistency/uncertainty score misses it;
  separating consistency into four probe groups (image vs. text perturbation
  crossed with affirmative vs. negated statement) and classifying on the
  joint within- and between-group agreement pattern detects hallucination
  better than any single-score black-box or white-box baseline.
