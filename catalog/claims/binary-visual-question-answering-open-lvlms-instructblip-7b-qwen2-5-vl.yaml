      detectors on AMBER and PhD across three LVLMs, with the same
      classifier pool and selection protocol for baselines; up to +18.72
      AUC-ROC and +20.07 AUC-PR over the strongest black-box method;
      ablations removing each group or feature type, and cross-dataset
      transfer.. Measured on 2,000 sampled instances per dataset, 80/20
