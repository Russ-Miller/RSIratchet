id: ensembles-heterogeneous-vlms-answering-multimodal-multiple-choice-questions-entropy-uniformly
ref: CLM-0383
capability: abstention-and-self-knowledge
technique: pool-semantic-opinions-across-models-then-split-entropy
statement: >-
  For ensembles of heterogeneous VLMs answering multimodal multiple-choice
  questions, the entropy of a uniformly pooled distribution over
  semantic-equivalence classes of sampled responses ranks wrong answers
  above right ones better than majority-vote entropy or picking the single
  lowest-entropy model, and the advantage grows with ensemble size; the same
  signal measured at the subagent evidence layer of a multi-step multi-agent
  system only ranks system failures slightly above chance.
kind: mechanism
