id: white-box-llms-up-13b-closed-book-qa-adjusting-token-sequence-probabilities
ref: CLM-1089
capability: hallucination
technique: re-weight-sequence-probabilities-local-uncertainty-before-semantic
statement: >-
  For white-box LLMs up to 13B on closed-book QA, adjusting token-sequence
  probabilities before semantic clustering — raising entropy where a
  perturbation-based uncertainty estimate says the sequence probability is
  locally unstable, and anchoring it where it is stable — separates
  hallucinated from correct answers better than semantic entropy computed
  from the raw sequence probabilities.
