id: model-asked-same-question-repeatedly-long-context-revealed-chunk
ref: CLM-1178
capability: knowledge-updating
technique: score-streaming-updates-phase-miss-lag-distraction-separately
statement: >-
  When a model is asked the same question repeatedly as a long context is
  revealed chunk by chunk, accuracy falls as the number of times the
  underlying fact changes increases, and the dominant error is changing the
  answer at intervals where the fact did not change rather than missing a
  genuine update.
kind: observation
backing_strength: single-paper
observed_on:
  era: "14 open and proprietary models on two streaming datasets (synthetic BABILong-derived, 128k tokens; novels averaging 150k tokens), questions stratified by how often their answer cha"
sources:
  - source: arxiv-2603-07392
    stance: supports
    note: >-
      Validated by: Applied to five model configurations on OAKS-BABI;
      models with near-identical accuracy (Gemma 3 27B 37.8, GPT-OSS 120B
      37.5) separated sharply on phase-miss (30.3 vs 15.1) and distraction
      (26.5 vs 38.8), showing the decomposition distinguishes behaviours
      accuracy hides.. Measured: average accuracy 39.4% (synthetic) and
      57.5% (novel), falling to 33.3% and 53.0% on the frequent-change
      subset. [truncated]
