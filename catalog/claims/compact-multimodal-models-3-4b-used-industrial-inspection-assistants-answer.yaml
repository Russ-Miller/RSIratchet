id: compact-multimodal-models-3-4b-used-industrial-inspection-assistants-answer
ref: CLM-0593
capability: abstention-and-self-knowledge
statement: >-
  Compact multimodal models (~3-4B) used as industrial inspection assistants
  answer unanswerable or ill-posed visual queries — asking about
  non-existent attributes or parts, or phrased as confirmation-seeking —
  with confident fabricated answers rather than flagging the missing
  evidence, and this weakness is not removed by scale: a 4B model beats a 6B
  model and proprietary GPT-5 Nano on the same category.
kind: observation
backing_strength: single-paper
observed_on:
  era: "410 MVTec AD and VisA images, 4,510 MCQs and 7,380 open-ended questions, zero-shot, six ~4B MSLMs plus moderate and proprietary reference models; open-ended scoring by a GPT-5 judg"
sources:
  - source: arxiv-2607-16243
    stance: supports
    note: >-
      Measured: MCQ accuracy on the Unanswerable category mostly below 65%
      for MSLMs (Qwen3-VL-4B the exception at 86.0%), while open-ended
      overall scores in that category fall mostly below 3 of 5 and drop
      further under blur/low light; Phi-4-Multimodal (6B) scored 54.8% and
      GPT-5 Nano 76.3%, below the 4B leader. Open-ended scores come from a
      single GPT-5 judge (93.8% agreement with five human judges on a 5%
      subset), and GPT-5 also generated the questions, so self-preference
      bias is mitigated but not eliminated. Failure examples are
      qualitative; no intervention tested.
contested: false
status: pending-review
last_checked_at: 2026-10-30
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A ~4B multimodal model
  scoring near ceiling on the unanswerable/ill-posed open-ended category
  without targeted negative-data training, or a clean monotonic rise in that
  category's score with parameter count across families.
