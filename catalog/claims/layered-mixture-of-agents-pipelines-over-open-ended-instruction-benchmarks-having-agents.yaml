id: layered-mixture-of-agents-pipelines-over-open-ended-instruction-benchmarks-having-agents
ref: CLM-1021
capability: multi-model-coordination
technique: have-agents-critique-each-other-natural-language-then
statement: >-
  In layered mixture-of-agents pipelines over open-ended instruction
  benchmarks, having agents within a layer exchange natural-language
  critiques of each other's drafts and feeding every prior layer's output
  into the synthesis step makes added depth keep paying off up to 5 layers,
  where plain concatenation-based MoA peaks at layer 3 and then degrades and
  a residual-only variant plateaus.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open-ended instruction-following benchmarks (AlpacaEval 2.0, MT-Bench, FLASK) scored by LLM judges, with 5 heterogeneous frontier or 12B-32B open models as collaborators and a sing"
sources:
  - source: arxiv-2601-16596
    stance: supports
    note: >-
      Validated by: Length-controlled win rate on AlpacaEval 2.0 (91.15% vs
      88.56% MoA, 78.20% RMoA), MT-Bench average (9.32 vs 9.13/8.82), FLASK
      win on 10 of 12 dimensions, and a depth sweep from 1 to 5 layers;
      early stopping cut tokens about 11%. All quality scores come from LLM
      judges; no per-component ablation separating the attention module from
      the residual module.. Measured on three LLM-judged benchmarks against
      MoA and RMoA with matched collaborator and aggregator models; the
      depth curve is the direct evidence. [truncated]
