  asserted. Drafted confidence: medium. Falsifier as drafted: A
  self-critique loop with no external signal that produces gains above the
  confidence interval on a benchmark where the model's single-shot accuracy
  is already high, or a fixed-depth loop that does not degrade accuracy on
  such a benchmark. Drafted stance toward
  self-critique-without-grounding-unreliable: supports -- On the clean
  benchmark the ungrounded critique loop gave no accuracy gain and
  fixed-depth refinement dropped accuracy from 73.8% to 71.2% by revising
  correct answers.
