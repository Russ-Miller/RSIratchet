id: self-evolving-agent-accepts-newly-distilled-skill-into-skill-bank
ref: CLM-0481
capability: harness-self-improvement
technique: gate-new-skills-sampled-coalition-knockouts-mask-after
statement: >-
  When a self-evolving agent accepts a newly distilled skill into its skill
  bank because aggregate task reward went up, that gain does not establish
  that the accepted skill contributes: paired knockout audits on LoCoMo show
  a newly admitted skill contributing about zero while an incumbent carries
  the bank, and a skill's marginal changes when its coalition partners are
  removed or when the bank is deployed in a different domain.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Skill-bank self-evolving agents (MemSkill-style, Llama-3.3-70B skill extractor) with an outcome-reward acceptance gate, audited on LoCoMo, LongMemEval, HotpotQA and ALFWorld."
sources:
  - source: arxiv-2608-22610
    stance: supports
    note: >-
      Validated by: Matched-protocol comparison against the MemSkill
      baseline over three seeds: the coalition gate accepted 1 of 12
      candidates vs 6 of 12, and a K-controlled ablation found the
      baseline's extra accepted skills net -1.38 pp; masking improved all
      six trained banks on HotpotQA-50 (+7.17 pp average on baseline banks,
      +3.59 on gated banks). Overall benchmark gains over MemSkill are small
      (e.g. LoCoMo LLM-Judge 56.58 vs 54.78).. Measured, but thin: audits on
      one baseline agent family, three seeds, 12 gate decisions; [truncated]
contested: false
status: pending-review
last_checked_at: 2026-10-13
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Paired knockout audits
  across many banks showing each accepted skill's marginal contribution is
  positive and stable under removal of other skills and under domain change,
  so outcome-gate acceptance predicts per-skill contribution.
