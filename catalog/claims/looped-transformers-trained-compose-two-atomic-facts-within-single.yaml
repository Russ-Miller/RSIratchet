      transformer sharing the same base block and a FLOPs-matched non-looped
      stack: near-perfect ID and OOD versus ~70% ID and <10% OOD for vanilla
      loop and <20% ID / ~0% OOD non-looped; same pattern on two
      synthetic-language formats and a three-hop extension; in 440M
      pretraining on 20B tokens, average zero-shot score 50.5 vs 49.3
