id: looped-transformers-trained-compose-two-atomic-facts-within-single
ref: CLM-0652
capability: multi-step-reasoning
technique: carry-decoded-embedding-channel-alongside-hidden-states-across
statement: >-
  In looped transformers trained to compose two atomic facts within a single
  forward pass, the remaining generalization failure is representational
  rather than storage: the bridge entity is already decodable after the
  first loop (LM-head probability ~1.0 on both ID and OOD splits) while its
  hidden state is poorly aligned with that token's embedding (cosine
  ~0.27-0.33), and mixing the decoded embedding into the bridge position
  between loops lifts OOD accuracy from 8.3% to near 100%.
