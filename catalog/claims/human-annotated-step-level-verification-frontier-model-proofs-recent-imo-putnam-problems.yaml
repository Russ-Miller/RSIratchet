id: human-annotated-step-level-verification-frontier-model-proofs-recent-imo-putnam-problems
ref: CLM-0306
capability: error-detection
statement: >-
  On human-annotated step-level verification of frontier-model proofs to
  recent IMO and Putnam problems, most of 29 generative critics and process
  reward models do little better than chance at finding the first wrong
  step, a leading math PRM (Qwen2.5-Math-PRM-72B) reaches only about 37%
  balanced F1, and beyond a few standouts open-source verifiers lag closed
  models; verification is harder than generation for the same frontier
  models.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Hard2Verify, 500+ hours of human annotation on responses from GPT-5, Gemini 2.5 Pro and Claude Sonnet 4, 2025; balanced accuracy and F1 against random-guess 50%."
sources:
  - source: arxiv-2510-13744
    stance: supports
    note: >-
      Carefully annotated but small and math-only; the
      generation-versus-verification asymmetry is the finding most likely to
      transfer.
contested: false
status: pending-review
last_checked_at: 2026-09-19
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
