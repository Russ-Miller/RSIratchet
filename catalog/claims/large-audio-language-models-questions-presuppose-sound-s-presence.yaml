id: large-audio-language-models-questions-presuppose-sound-s-presence
ref: CLM-1134
capability: hallucination
technique: probe-audio-grounding-presupposing-yes-no-questions
statement: >-
  In large audio language models, questions that presuppose a sound's
  presence and ask how/when/why about it (implicit queries) elicit confident
  hallucinated answers far more often than direct yes/no existence questions
  about the same absent sound, because the presupposition lets the model
  skip the grounding check and attend less to audio tokens during
  generation.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Measured on six open and closed LALMs (Audio Flamingo 3, Qwen2.5/3-Omni, R1-AQA, Gemini 3 Pro, GPT-4 Audio) over 6.5K constructed QA pairs built from AudioCaps, Clotho and MusicCap"
sources:
  - source: arxiv-2603-29263
    stance: supports
    note: >-
      Validated by: Attack success rate on AHA-Eval rose from explicit to
      implicit queries for every model tested (e.g. Gemini 3 Pro random
      sounds 10.88% to 59.67%; Audio Flamingo 3 1.90% to 87.05% on text
      attacks), with mean attention to audio tokens lower under implicit
      queries in Qwen2.5-Omni.. Measured across six models on a
      purpose-built 6.5K-pair benchmark; the gap is large and consistent in
      direction across models, sound categories and both text and audio
      attack surfaces. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-25
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model set where
  presupposing questions about absent sounds produce hallucination rates at
  or below matched explicit existence questions, or where attention to audio
  tokens does not fall under the presupposing framing.
