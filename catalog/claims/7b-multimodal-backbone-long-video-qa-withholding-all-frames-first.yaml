      VideoMTR, VideoAgent), with visual-token counts reported: LSDBench
      51.0% at 10.3K tokens vs Qwen2.5-VL 52.5% at 499K; MLVU 68.3 vs 59.1
      for FrameThinker; LVBench 43.3 vs 36.6. Stage ablation (SFT/KTO/GRPO)
      and GRPO data-composition ablation (multi-choice vs open-ended vs
      mixed) reported.. Measured on six benchmarks with one backbone and one
      seed; [truncated]
