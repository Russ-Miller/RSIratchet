id: 7b-multimodal-backbone-long-video-qa-withholding-all-frames-first
ref: CLM-1023
capability: video-temporal-reasoning
technique: plan-before-looking-let-agent-choose-window-frame
statement: >-
  For a 7B multimodal backbone on long-video QA, withholding all frames at
  the first step and training the model (SFT cold-start, then preference
  correction, then GRPO) to emit its own time window, frame count and
  spatial resize before any perception raises accuracy over uniform-sampling
  and fixed-workflow agent baselines while using far fewer visual tokens.
