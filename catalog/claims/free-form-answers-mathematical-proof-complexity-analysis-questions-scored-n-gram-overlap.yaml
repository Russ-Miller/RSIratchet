statement: >-
  When free-form answers to mathematical proof and complexity-analysis
  questions are scored by n-gram overlap against a single instructor
  reference, the overlap metric carries almost no signal about answer
  quality, because logically equivalent proofs use different notation,
  variable names and proof strategies: across 179 TCS exam questions BLEU-4
  was exactly zero on every item and ROUGE-1 F1 stayed in a narrow
  0.088-0.129 band across topics, while a rubric-based quality score varied
  from 0.66 to 0.83 over the same topics.
