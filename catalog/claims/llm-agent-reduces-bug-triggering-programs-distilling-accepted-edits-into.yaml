  that, on held-out programs of the same language, reduces no better than
  the syntactic prelude alone, or a cold-start agent that matches it on both
  size and LLM call count. Drafted stance toward
  distilling-lessons-from-failures-as-well-as-successes-beats-raw-trajectory-memory:
  supports -- Both show an agent distilling reusable knowledge from its own
  past attempts improves later runs with weights frozen, here with the
  distillate made executable rather than textual.
