id: autoregressive-transformers-confident-hallucination-arises-because-learned-facts-form
ref: CLM-0803
capability: hallucination
technique: score-hidden-state-distance-nearest-memorized-attractor-basin
statement: >-
  In autoregressive transformers, confident hallucination arises because
  learned facts form attractor basins in hidden-state space and the frozen
  LM head cannot distinguish a state inside a basin from one drifting with
  no basin present, so hidden-state distance to the nearest memorized basin
  separates correct recall from hallucination far better than output
  entropy.
