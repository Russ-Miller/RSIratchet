id: multi-agent-llm-pipelines-related-work-generation-over-fixed-reference-pool
ref: CLM-0248
capability: multi-model-coordination
technique: learn-each-agent-retrieves-shares-drafts-or-critiques
statement: >-
  In multi-agent LLM pipelines for related-work generation over a fixed
  reference pool, almost all of the measured quality gain comes from the
  shared architecture — a shared knowledge workspace plus an explicit
  critique action — rather than from replacing a centralized LLM coordinator
  with a learned decentralized action-selection policy, which adds only a
  marginal quality difference while cutting inference time.
kind: observation
backing_strength: single-paper
