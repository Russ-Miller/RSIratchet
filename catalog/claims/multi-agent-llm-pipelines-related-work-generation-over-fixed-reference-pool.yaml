  era: "OARelatedWork benchmark, Qwen2.5-72B agents, 4 agents, LLM-as-judge 1-5 scale plus citation-existence checks; single dataset and one preliminary cross-domain check on Multi-News."
sources:
  - source: arxiv-2609-15721
    stance: supports
    note: >-
      Validated by: LLM-as-judge (three judges) overall score, citation
      verification rate, tokens and inference time against SRW, a
      HuggingGPT-style naive orchestrator, an architecture-matched LLM
      orchestrator, GPT-4o long-context and RAG, and PRIMERA; CREW 3.82
      overall vs orchestrator 3.80, SRW 3.76, naive orchestrator 3.40..
      Measured on one benchmark with 366 evaluation papers. The
      architecture-matched orchestrator baseline is the design that isolates
      the learned policy, and it scores within 0.02 of CREW. [truncated]
