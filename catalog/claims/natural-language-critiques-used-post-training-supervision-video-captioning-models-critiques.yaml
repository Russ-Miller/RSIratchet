id: natural-language-critiques-used-post-training-supervision-video-captioning-models-critiques
ref: CLM-0847
capability: critique
technique: make-critique-itself-produce-corrected-output
statement: >-
  When natural-language critiques are used as post-training supervision for
  video captioning models, the critiques' precision, recall and
  constructiveness each independently govern downstream gains: degrading any
  one of the three (injecting a wrong point, dropping a needed correction,
  or removing the stated fix) substantially lowers caption, reward-modeling
  and critique scores relative to critiques that have all three.
