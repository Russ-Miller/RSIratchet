id: across-25-open-weight-instruction-tuned-models-4b-744b-ability-modulate-named
ref: CLM-0557
capability: strategic-deception
technique: benchmark-instructed-control-over-model-s-own-activations
statement: >-
  Across 25 open-weight instruction-tuned models (4B-744B), the ability to
  modulate a named concept's residual-stream projection on plain instruction
  does not track parameter count or recency — the best scorer is an 8B 2024
  model and some of the newest models score lowest — while within a single
  model line the score rises steadily across ordinary pre-training and
  post-training checkpoints, so activation controllability is acquired
  incidentally and must be measured per model rather than inferred from
  scale.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Open-weight instruction-tuned models; simple concrete concepts (e.g. bread) embedded in a verbatim transcription task; greedy decoding; no fine-tuning or prompt search, so estimate"
sources:
  - source: arxiv-2608-21664
    stance: supports
    note: >-
      Measured on 25 models from seven families with 50 sentences x 10
      concepts and two-way cluster bootstrap; the training-trajectory result
      rests on point estimates for only two Olmo lines with no confidence
      intervals, and concepts are deliberately benign rather than
      safety-relevant.
contested: false
status: pending-review
