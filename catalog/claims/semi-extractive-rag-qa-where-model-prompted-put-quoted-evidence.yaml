    stance: supports
    note: >-
      Validated by: New Extraction Faithfulness Accuracy metric plus
      EM/F1/ALR and ROUGE-L/BERTScore/MAUVE/latency on MedMCQA, MESAQA,
      QuoteSum and a new SEMAeroSQuAD set, against SEMQA, NEST and a
      DistilBERT extractive baseline, three LLMs, two runs, with
      McNemar/Wilcoxon and Holm-Bonferroni correction.. Measured on four
      datasets and three open models; the fidelity guarantee is
      near-tautological by construction, so the informative parts are the
      baseline failure rate and the small fluency cost. Latency rises
      substantially on long contexts. [truncated]
