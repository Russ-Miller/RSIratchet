id: semi-extractive-rag-qa-where-model-prompted-put-quoted-evidence
ref: CLM-0384
capability: hallucination
technique: mask-decoding-verbatim-context-spans-inside-quotes
statement: >-
  In semi-extractive RAG QA where the model is prompted to put quoted
  evidence in brackets, the bracketed spans frequently do not appear
  verbatim in the retrieved context (as low as 0.37 verbatim rate on a
  medical dataset with Mistral-Nemo), and masking logits during bracketed
  spans to only tokens continuing a verbatim context span raises verbatim
  fidelity to near 1.0 across Llama-3.1-8B, Mistral-Nemo and Qwen3-4B
  without lowering ROUGE-L or BERTScore much.
kind: mechanism
backing_strength: single-paper
