id: llm-based-forecasting-systems-reported-accuracy-gains-retrospective-benchmarks-often
ref: CLM-0420
capability: forecasting
technique: evaluate-forecasters-live-post-cutoff-questions-cost-reported
statement: >-
  For LLM-based forecasting systems, reported accuracy gains on
  retrospective benchmarks often cannot be attributed to temporal reasoning,
  because the forecast targets may be present in pretraining data and
  ablations frequently show the LLM component itself adds no accuracy over
  the statistical or retrieval components it is paired with.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "LLM forecasting agents evaluated on retrospective benchmarks with event dates before or near the training cutoff; does not apply to live, post-cutoff evaluation"
sources:
  - source: arxiv-2608-23058
    stance: supports
    note: >-
      Validated by: Not measured; the survey argues for it from assembled
      negative evidence (perturbation sensitivity, null LLM ablations,
      suspected contamination).. Survey-level synthesis of published
      positive and negative evidence across finance, weather, health, energy
      and operations; no new measurement, no single quantified baseline, so
      the strength of the contamination attribution rests on the cited
      studies rather than on this paper.
contested: false
status: pending-review
last_checked_at: 2026-10-12
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Studies in which LLM
  forecasting agents retain their benchmark margin over non-LLM baselines on
  strictly post-cutoff, contamination-free questions, and where ablating the
  LLM component still degrades accuracy.
