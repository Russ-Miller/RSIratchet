id: multi-step-text-agent-episodes-run-post-training-quantized-llms-loss-low-bit-decoding
ref: CLM-1165
capability: long-horizon-execution
technique: route-decoding-precision-per-agent-step-hidden-state
statement: >-
  In multi-step text-agent episodes run on post-training-quantized LLMs, the
  loss from low-bit decoding is concentrated in a small minority of steps —
  low and high precision pick different actions at roughly 15% of steps and
  only about 7% of those flip a success into a failure — so selecting
  decoding precision per step from the prefill hidden state recovers most of
  the fixed-low-precision success gap while keeping most of the speedup.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Small-batch, memory-bandwidth-bound local decoding of weight-only-quantized 4B-7B models on text agent benchmarks (ALFWorld, ScienceWorld, TextWorld); prompts grow by append so the"
sources:
  - source: arxiv-2602-02711
    stance: supports
    note: >-
      Validated by: Task success rate and per-task decode time against
      fixed-precision, random routing matched on low-bit token share, and
      first-k-steps schedules, on three agent benchmarks; DMR recovered 81%
      of the fixed-low-precision success gap on average at 2.44x FP16 decode
      speedup, versus at most 48% for heuristics; on ALFWorld+GPTQ 86.9% vs
      87.2% FP16 at 1.71x. Ablations compare router factorizations and a
      position-feature router (AUC 0.530 vs 0.745).. [truncated]
