id: closed-book-bibliographic-recommendation-where-prompt-imposes-format-constraint-model
ref: CLM-1075
capability: hallucination
technique: give-model-sanctioned-fallback-constraint-unsatisfiable
statement: >-
  In closed-book bibliographic recommendation where the prompt imposes a
  format constraint the model's parametric knowledge cannot satisfy
  (peer-reviewed journal articles only, in conference-dominated CS topics)
  and refusal is disallowed, enabling reasoning mode cuts honest constraint
  violations but raises both distortion of genuinely known records into
  fabricated journal metadata and outright fabrication of nonexistent
  papers.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Closed system, no retrieval or tools; refusal/'I don't know' prohibited by prompt; constraint deliberately unsatisfiable for most topics; two models tested (GPT-5.2, Gemini 3 Flash"
sources:
  - source: arxiv-2601-01490
    stance: supports
    note: >-
      Validated by: Not measured; argued from the observed trade-off only..
      Measured: 25 CS topics x 10 records x 2 models x 2 reasoning settings,
      annotated against Google Scholar by 20 students with author
      validation. Constraint violations fell 74.8%->13.2% (GPT) and
      66.0%->26.0% (Gemini), p<.001; conference->journal distortion rose
      2.8%->9.2% and 4.4%->10.0%, p<.05; complete fabrication rose
      8.8%->10.8% (n.s.) and 6.0%->12.0% (p<.05). [truncated]
contested: false
