id: llm-agents-whose-steps-condition-their-own-prior-outputs
ref: CLM-0612
capability: abstention-and-self-knowledge
technique: report-calibration-trajectory-checkpoints-split-horizon
statement: >-
  For LLM agents whose steps condition on their own prior outputs, per-step
  confidence that is calibrated against step-local success labels does not
  compose into a calibrated estimate of whether the whole trajectory
  succeeds, because correlated step errors make the product of step
  marginals diverge from joint success probability, and the divergence grows
  as prefix reliability falls over longer horizons.
