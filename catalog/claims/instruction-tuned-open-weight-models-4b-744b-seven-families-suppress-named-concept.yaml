id: instruction-tuned-open-weight-models-4b-744b-seven-families-suppress-named-concept
ref: CLM-0406
capability: strategic-deception
technique: activation-controllability-benchmark
statement: >-
  Instruction-tuned open-weight models (4B-744B, seven families) can
  suppress a named concept's residual-stream signal on plain
  natural-language instruction, with no fine-tuning, enough to evade linear
  probes, the Jacobian lens, activation oracles and natural-language
  autoencoders, while the same monitors catch instructed engagement
  near-perfectly.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Simple concrete concepts (e.g. bread) in a verbatim-transcription task; off-the-shelf, non-hardened monitors at a 1% false-positive budget; the hiding instruction itself is visible"
sources:
  - source: arxiv-2608-21664
    stance: supports
    note: >-
      Validated by: Applied to 25 open-weight models; score ranged
      0.059-0.538, rose across Olmo training checkpoints, and separated
      models whose suppression evaded four monitor families (suppression
      detection 5-21% at 1% FPR versus near-ceiling for engagement)..
      Measured across 25 models for the controllability score;
      monitor-evasion results on smaller panels (nine models for probes, 13
      for the J-lens, one for the NLA, 0 of 500 suppression trials named).
