id: routing-over-heterogeneous-pool-math-reasoning-agents-training-controller-also
ref: CLM-0870
capability: multi-model-coordination
technique: critique-draft-re-route-under-per-agent-usage
statement: >-
  For routing over a heterogeneous pool of math-reasoning agents, training
  the controller to also critique the current draft and decide whether to
  continue refining raises average accuracy well above one-shot RL routing
  (80.5% vs 69.1% and 82.3% vs 66.5% across two controller/agent
  configurations on seven math benchmarks), while an explicit per-agent
  utilization penalty is needed to stop the policy from routing everything
  to the strongest agent.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Verifiable math reasoning where routing and verification correctness are rule-checkable; 4B-7B base controllers over 1B-30B agent pools; gains saturate past about two interaction t"
