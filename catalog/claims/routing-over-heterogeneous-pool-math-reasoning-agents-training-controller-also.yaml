    stance: supports
    note: >-
      Validated by: Accuracy on seven math benchmarks against Router-R1,
      RouterDC, RoBERTa and random routers, and controller-as-solver
      baselines, in two controller/agent-pool configurations; ablations on
      turn budget and on removing the Lagrange multipliers (which collapses
      routing to the strongest agent).. Measured on seven math benchmarks,
      two systems, with routing and controller-as-solver baselines and two
      ablations; [truncated]
