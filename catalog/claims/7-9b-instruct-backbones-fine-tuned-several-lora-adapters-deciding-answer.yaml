id: 7-9b-instruct-backbones-fine-tuned-several-lora-adapters-deciding-answer
ref: CLM-0347
capability: abstention-and-self-knowledge
technique: commit-only-adapter-probability-intervals-do-overlap
statement: >-
  For 7-9B instruct backbones fine-tuned with several LoRA adapters,
  deciding to answer only when one candidate's minimum probability across
  adapters exceeds every other candidate's maximum gives a threshold-free
  abstention rule whose commit rate collapses when the supplied evidence is
  corrupted (31-48% to 4-8% on CoQA), while mean-pooling the same adapters
  into one distribution loses that signal and needs a tuned cutoff.
kind: mechanism
backing_strength: single-paper
