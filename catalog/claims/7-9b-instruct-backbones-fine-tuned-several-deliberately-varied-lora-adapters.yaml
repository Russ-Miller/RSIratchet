  era: "Short-answer QA (CoQA, TriviaQA, OpenBookQA, ARC-Challenge) with 5 LoRA adapters on Gemma-2-9B, Llama-3.1-8B, Qwen2.5-7B; corruption is a synthetic proxy for hallucination conditio"
