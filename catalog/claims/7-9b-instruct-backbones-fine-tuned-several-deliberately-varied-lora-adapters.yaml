id: 7-9b-instruct-backbones-fine-tuned-several-deliberately-varied-lora-adapters
ref: CLM-0345
capability: abstention-and-self-knowledge
technique: commit-only-lora-ensemble-s-probability-intervals-do
statement: >-
  For 7-9B instruct backbones fine-tuned with several deliberately varied
  LoRA adapters, reading the adapters as a set and answering only when one
  candidate's minimum probability across adapters exceeds every other
  candidate's maximum gives a threshold-free abstention rule whose
  commitment rate collapses when the supplied passage is corrupted (CoQA
  31-48% down to 4-8%), while mean-pooled or single-model scores thresholded
  to the same clean coverage keep answering more corrupted prompts.
kind: mechanism
backing_strength: single-paper
