id: web-agents-multi-page-interactive-sites-consolidating-same-human-demonstration
ref: CLM-0948
capability: long-horizon-execution
technique: compile-demonstration-traces-into-queryable-environment-map
statement: >-
  For web agents on multi-page interactive sites, consolidating the same
  human demonstration traces into a structured, queryable environment map
  (page contexts, parameterized actions, workflows, domain definitions)
  raises task success more than giving the agent the raw traces themselves,
  with the margin concentrated in UI-dense, high-branching sites and absent
  in shallow ones.
kind: observation
backing_strength: single-paper
observed_on:
  era: "WebArena, claude-sonnet-4-5 agent with file tools, 812 tasks, maps built from 179 released human Playwright traces; per-site maps only, cross-site tasks unaffected"
sources:
  - source: arxiv-2603-23610
    stance: supports
    note: >-
      Validated by: WebArena Verified binary success on 812 tasks: 28.2%
      with maps vs 23.3% with raw trace access vs 14.2% no prior knowledge,
      same agent stack and same default file tools; per-environment GitLab
      8.3/11.7/22.8%, CMS 11.5/15.4/22.5%, Reddit 13.2/58.5/60.4%, Map
      32.1/34.9/34.9%; multi-site tasks 0/48 under both knowledge
      conditions.. Measured, single paper, one backbone, one benchmark.
      Retrieval interface held fixed across conditions, which isolates
      representation from tooling. [truncated]
contested: false
status: pending-review
last_checked_at: 2026-11-07
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Under the same agent and
  retrieval interface, raw trace access matching or exceeding map access on
  UI-dense sites, or the map advantage disappearing once the raw traces are
  given an equally convenient index.
