id: strategic-decision-making-tasks-where-stakeholders-choices-mutually-dependent-running
ref: CLM-0745
capability: multi-model-coordination
technique: best-respond-aggregated-history-other-agents-policies
statement: >-
  For strategic decision-making tasks where stakeholders' choices are
  mutually dependent, running each stakeholder as a separate agent that
  best-responds to an aggregated summary of the other agents' past policies
  beats self-reflection, debate and theory-of-mind prompting on both
  tournament payoff and worst-case payoff under an adapting adversary, but
  the gain appears only in imperfect-information, stochastic or
  mixed-equilibrium scenarios and disappears in deterministic
  perfect-information games.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "13 game and negotiation scenarios, language-policy generation with a single frozen backbone (Qwen3.5-35B-A3B) as both policy generator and action executor, 4 iteration rounds, 8 se"
sources:
  - source: arxiv-2606-19308
    stance: supports
    note: >-
      Validated by: Round-robin tournament utility across 9 methods (average
      0.533 vs 0.527 for ToM, 0.496 debate, 0.477 self-reflection) and
      robustness as the minimum utility over 10 rounds of an evolving
      attacker (0.421 vs 0.369 ToM); ablation replacing the aggregate with
      the opponent's latest policy scored lower on both (0.491/0.374)..
      Measured on 13 scenarios, 16 matches per pair with seat exchange, 8
      seeds, one backbone. Average margins over ToM are small (0.006 TS) and
      MAFP loses on several scenarios including IPD where the ablation beats
      it; [truncated]
