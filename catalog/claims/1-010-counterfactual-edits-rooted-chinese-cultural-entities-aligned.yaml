id: 1-010-counterfactual-edits-rooted-chinese-cultural-entities-aligned
ref: CLM-0282
capability: knowledge-updating
statement: >-
  On 1,010 counterfactual edits rooted in Chinese cultural entities and
  aligned with English counterparts, an edit made in one language largely
  does not propagate to the other: edits succeed in the edited language
  (about 80% for Chinese at batch size 10, falling with batch size) while
  the other language keeps answering the old fact, so multilingual models
  store the same fact in language-specific ways that editing does not
  bridge.
kind: observation
backing_strength: single-paper
observed_on:
  era: "CLM-Bench, Llama-3 and Qwen2 among others, 2026; batches of 10, 100 and 1000 edits; Chinese-first construction rather than translated English data."
sources:
  - source: arxiv-2601-17397
    stance: supports
    note: >-
      Two languages only; the culturally native construction avoids the
      translation artefact the authors criticize in prior multilingual
      editing benchmarks.
