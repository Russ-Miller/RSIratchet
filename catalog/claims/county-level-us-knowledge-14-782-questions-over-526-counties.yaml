id: county-level-us-knowledge-14-782-questions-over-526-counties
ref: CLM-0296
capability: factual-recall
statement: >-
  On county-level US knowledge (14,782 questions over 526 counties), the
  best of 13 models reaches only about 57% on narrative questions and no
  model exceeds 13% on numeric Census facts, larger models are not reliably
  better, and web search helped Gemini (+14 points) while hurting GPT models
  (about -11), so hyper-local recall is thin and retrieval does not fix it
  uniformly.
kind: observation
backing_strength: single-paper
observed_on:
  era: "LocalBench, closed-book and web-augmented, 13 models, 2025; numeric answers scored within 2% relative error; model judge agrees with humans 96%."
sources:
  - source: arxiv-2511-10459
    stance: supports
    note: >-
      US-only and one construction pipeline; the numeric-recall floor and
      the asymmetric effect of search are the two findings worth carrying.
