id: agent-loop-skills-prompts-held-fixed-only-model-swapped
ref: CLM-0334
capability: tool-use
statement: >-
  With the agent loop, skills and prompts held fixed and only the model
  swapped, models split into two clusters on operating a multi-step
  asynchronous ML workflow: Claude Sonnet 3.5-4.0, Gemini 2.5 and GPT-5
  completed tasks at 93-100%, while GPT-4 scored 13% and others could not
  run the loop at all, hallucinating workflow ids or failing to wait for
  asynchronous jobs; on open-ended exploration the effect of a stressful,
  competitive prompt reversed by family, with Sonnet 4.0 producing the
  largest improvement of any configuration under stress and GPT-5 turning
  conservative and giving back most of its basic-prompt gains.
kind: observation
backing_strength: single-paper
observed_on:
  era: "A-MLE harness in an industrial ads-ranking stack, 2026; task-completeness scores on tier-2 workflow execution and rMSE improvement on tier-3 exploration; one prompt pair (basic ver"
sources:
  - source: arxiv-2609-08248
    stance: supports
    note: >-
      A rare controlled model swap inside a real harness; small model set
      and a single prompt manipulation, so the stress-reversal finding is
      suggestive rather than established. The completeness split matches
      what harness builders report elsewhere.
contested: false
status: pending-review
last_checked_at: 2026-09-22
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: low. Falsifier as drafted: Replication of the
  prompt-stress reversal on a public agentic benchmark with the same model
  pairs, or the cluster split disappearing once the weaker models are given
  the same retry and wait tooling.
