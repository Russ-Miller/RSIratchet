id: month-level-egocentric-recordings-20-120-days-per-participant-human-written-multiple-choice
ref: CLM-0610
capability: video-temporal-reasoning
statement: >-
  On month-level egocentric recordings (20-120 days per participant) with
  human-written multiple-choice questions, current multimodal models degrade
  as the question moves from inferring recurring habits, to retrieving one
  specific episode, to composing evidence across days — the best model
  reached 71.8% macro-average against a 94.2% human baseline, with several
  models near or below the 25% chance level on route reasoning, cross-view
  spatial reasoning and direction judgement.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Twelve open- and closed-source MLLMs, four-option multiple-choice, 1,443 QA pairs over ~301 hours of egocentric video; no LLM-as-judge."
sources:
  - source: arxiv-2608-13113
    stance: supports
    note: >-
      Measured: per-task accuracy for 12 models plus a three-annotator human
      baseline (Fleiss' kappa 0.78) on a benchmark the authors built. Frame
      budgets differ per model by official config, so input density is not
      controlled; the three cognitive levels are the authors' own taxonomy,
      and task difficulty within a level is not independently calibrated.
contested: false
status: pending-review
last_checked_at: 2026-10-24
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A model that scores near
  human level on the cascading-reasoning tasks (route reasoning, cross-view
  spatial reasoning, event counting) while this ordering across the three
  cognitive levels disappears or reverses on the same benchmark.
