id: models-judge-syllogism-s-validity-partly-how-believable-conclusion
ref: CLM-0311
capability: logical-deduction-robustness
technique: debiasing-vector-separates-validity-plausibility
statement: >-
  Models judge a syllogism's validity partly by how believable its
  conclusion is because validity and plausibility are encoded as linearly
  separable but strongly aligned directions in the residual stream: steering
  along the plausibility direction causally shifts validity judgements and
  vice versa, the degree of alignment predicts the size of the content
  effect across models, and a debiasing vector that separates the two
  reduces the effect and raises accuracy.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Qwen-2.5 and Qwen3 families among others, syllogism datasets with believable and unbelievable conclusions, 2025; steering and probing on open weights."
sources:
  - source: arxiv-2510-06700
    stance: supports
    note: >-
      Validated by: Content-effect size and accuracy before and after
      steering across model sizes; causal steering in both directions;
      alignment-effect correlation across models. Open models only.. A
      mechanistic account with causal steering, which is stronger than the
      usual behavioural report of content effects; whether the debiasing
      vector generalizes beyond syllogisms is untested.
