id: tool-calling-agents-fabricate-parameters-user-never-specified-uncertainty-signals
ref: CLM-0496
capability: hallucination
technique: concurrent-lora-critic-verbalizes-ungrounded-parameter
statement: >-
  For tool-calling agents that fabricate parameters the user never
  specified, uncertainty signals read off the output distribution (token
  entropy, semantic entropy) fail because the model is confidently wrong,
  while a LoRA adapter trained only on a diagnostic label appended after the
  tool call restructures the residual stream into a linearly separable
  grounding direction that detects and names the ungrounded parameter and
  transfers out of distribution better than a passive probe on the frozen
  states.
kind: mechanism
