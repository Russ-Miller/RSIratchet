observed_on:
  era: "Structured tool-calling with parameter-level ground truth from a simulated-user specification mask; tested on Qwen3-4B and Llama-xLAM-2-8B, in-distribution plus ToolAlpaca OOD; det"
sources:
  - source: arxiv-2608-10430
    stance: supports
    note: >-
      Validated by: On Qwen3-4B, 0.966 ID / 0.925 OOD AUROC for the
      ungrounded class versus 0.915/0.884 for an equal-scale fine-tuned
      external judge, 0.782/0.616 for a linear probe on frozen states, and
      near-chance for token/semantic entropy and SEP; replicated on
      Llama-xLAM-2-8B (0.926/0.649 vs probe 0.833/0.514); >80% exact
      parameter-match localization; a linear probe on the adapted states
      reaches 0.915 OOD, and activation patching the [POS] state from a
      corrupted trajectory flips the output to 'ungrounded' in 96% of cases;
      <10ms added per tool call in vLLM.. [truncated]
