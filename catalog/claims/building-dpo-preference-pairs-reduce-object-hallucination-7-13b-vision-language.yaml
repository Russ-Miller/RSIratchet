id: building-dpo-preference-pairs-reduce-object-hallucination-7-13b-vision-language
ref: CLM-0578
capability: visual-grounding
technique: condition-policy-rollouts-cues-mined-synthetic-image-variants
statement: >-
  When building DPO preference pairs to reduce object hallucination in 7-13B
  vision-language models, both parts matter: candidate responses must be
  sampled from the policy itself (externally generated rollouts raise
  hallucination sharply) and must be conditioned on an object-level visual
  cue extracted by comparing the image with diffusion-synthesized variants
  of the model's own captions (removing the cue roughly doubles the
  hallucination average).
