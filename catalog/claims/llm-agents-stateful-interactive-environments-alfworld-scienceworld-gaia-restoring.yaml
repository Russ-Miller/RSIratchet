id: llm-agents-stateful-interactive-environments-alfworld-scienceworld-gaia-restoring
ref: CLM-0242
capability: long-horizon-execution
technique: roll-back-world-keep-reflection
statement: >-
  For LLM agents in stateful interactive environments (ALFWorld,
  ScienceWorld, GAIA), restoring the environment to an earlier checkpoint
  and carrying forward a distilled, state-free reflection memory across the
  rollback beats both reflection-without-restoration and
  restoration-without-retained-memory, because each alone leaves either a
  corrupted world state or a repeated mistake.
kind: mechanism
backing_strength: single-paper
