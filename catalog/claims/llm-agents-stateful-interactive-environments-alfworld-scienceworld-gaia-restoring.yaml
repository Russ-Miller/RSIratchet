    stance: supports
    note: >-
      Validated by: Success rate on ALFWorld, ScienceWorld and GAIA against
      ReAct, Reflexion, LATS, Self-Refine and GA-Rollback under the same
      backbones and budgets (average SR 47.00 vs 43.91 best baseline on
      Qwen3-14B; 69.43 vs 62.86 on DeepSeek-V3), plus component ablations on
      ScienceWorld showing +6.27 SR over reflection only and +7.38 over
      rollback only, with fewer than one executed rollback per task versus
      ~2.9 for GA-Rollback.. [truncated]
