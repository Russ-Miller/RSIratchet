notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: A replication in which
  the same worker agents and base models under a fixed flat or
  single-planner architecture match or beat the interdependence-matched
  hierarchy on mission score and progress-per-step, or in which the gain
  appears only for some base models. Drafted stance toward
  splitting-task-across-several-agents-helps-long-horizon-tasks-whose:
  supports -- Both find that whether multi-agent decomposition helps depends
  on the dependency structure of the task, and that matching structure to
  dependencies is where the gain comes from.
