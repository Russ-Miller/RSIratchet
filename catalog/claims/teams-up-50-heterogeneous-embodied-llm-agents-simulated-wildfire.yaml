id: teams-up-50-heterogeneous-embodied-llm-agents-simulated-wildfire
ref: CLM-0387
capability: multi-model-coordination
technique: match-agent-hierarchy-task-interdependence
statement: >-
  For teams of up to 50 heterogeneous embodied LLM agents in simulated
  wildfire missions, building the manager hierarchy per mission so that
  concurrently executable work sits under a parallel-allocating manager and
  prerequisite-chained work under a phase-advancing manager beats fixed
  decentralized, single-planner, and hybrid coordination architectures on
  mission score and on progress accumulated per step, and the advantage does
  not depend on which base language model is used.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "25 simulated wildfire-response missions in an extended CREW-Wildfire benchmark, 3-50 agents of four types, eight base LLMs, five seeds; hierarchy fixed before execution and not res"
sources:
  - source: arxiv-2609-11737
    stance: supports
    note: >-
      Validated by: Against four prior embodied multi-agent frameworks
      (CAMON, COELA, HMAS-2, Embodied) on 25 missions x 8 LLMs x 5 seeds:
      human-designed hierarchies improved final score 63.97% and execution
      efficiency (AUC of progress) 74.29% on average, LLM-generated ones
      43.63% and 52.53%; first-place rank frequency 32.6% vs 5.8-16.2% for
      baselines; Type-II ANOVA showed a significant algorithm main effect
      and no significant algorithm-by-LLM interaction; success rates
      35.2-53.1% vs 6.9-13.5%.. [truncated]
contested: false
