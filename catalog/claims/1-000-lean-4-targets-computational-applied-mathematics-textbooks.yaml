id: 1-000-lean-4-targets-computational-applied-mathematics-textbooks
ref: CLM-0281
capability: formal-math
statement: >-
  On 1,000 Lean 4 targets from computational and applied mathematics
  textbooks (optimization, numerical linear algebra, numerical analysis),
  whose statements depend on locally introduced definitions, current provers
  solve about 62-72% of a 200-problem sample, so applied-math formalization
  is tractable but not saturated and requires recovering textbook context to
  state problems faithfully.
kind: observation
backing_strength: single-paper
observed_on:
  era: "CAM-Bench, Lean 4, 2026; sample of 200 instances; provers M2F (71.5%) and Aristotle (62.5%); statements validated by compilation and semantic review."
