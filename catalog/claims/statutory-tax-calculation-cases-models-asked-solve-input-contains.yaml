id: statutory-tax-calculation-cases-models-asked-solve-input-contains
ref: CLM-0692
capability: abstention-and-self-knowledge
technique: gate-answer-separate-self-verification-call-contradictions
statement: >-
  On statutory tax calculation cases, models asked to solve an input that
  contains an injected contradictory fact mostly compute straight through it
  and return the clean-input answer, while the same model asked only to
  verify the same input flags most of those contradictions \u2014 so
  abstention failure here is a task-framing gap, not missing detection
  ability.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Six recent LLMs on 91 SARA-derived US federal income tax cases; contradictions injected into categorical facts (marital/filing status, dependent count); missing-fact perturbations "
sources:
  - source: arxiv-2609-05928
    stance: supports
    note: >-
      Validated by: Across all six models, contradiction abstention rose
      from 0-43% (solver alone) to 70-83% with the gate, at a clean-accuracy
      cost of 0-5.1 percentage points; false-flag rate on clean inputs
      0-5.5%. Compared against a self-consistency baseline over three solve
      runs, which flagged only 11-35% of contradictions at a higher
      false-flag rate.. Measured on 108 contradiction variants and 78
      redacted variants from 91 SARA cases, three runs per model, binary
      numeric-or-null output schema. [truncated]
