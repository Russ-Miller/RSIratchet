id: visual-math-reasoning-frontier-multimodal-models-having-several-agents
ref: CLM-1335
capability: multi-model-coordination
technique: share-visual-evidence-lists-between-agents-answers
statement: >-
  For visual math reasoning with frontier multimodal models, having several
  agents exchange structured lists of extracted visual evidence —
  categorized into consistent, complementary and conflicting items — and
  letting one anchor agent regenerate its answer from that pooled evidence
  raises accuracy more than aggregating the agents' final answers, and the
  gain splits by anchor strength: weak anchors gain most from the pooled
  evidence while strong anchors gain most from the subsequent reflection
  round on disputed samples.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Four frontier MLLM agents (Gemini-3 Pro, Gemini-2.5 Pro, GPT-5, Claude-4.5 Sonnet) on MathVision, with MathVista/MathVerse results deferred to an appendix; gains measured against e"
