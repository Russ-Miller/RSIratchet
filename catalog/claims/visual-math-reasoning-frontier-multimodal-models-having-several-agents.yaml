  - source: arxiv-2603-08369
    stance: supports
    note: >-
      Validated by: MathVision accuracy against each anchor's own CoT
      baseline: Gemini-3 Pro 85.0 to 88.1 after one regeneration and 89.1
      after refine-reflect; Claude-4.5 61.2 to 76.0; GPT-5 72.0 to 81.3. The
      paper reports a comparison against answer-level aggregation only in an
      appendix, not in the main text.. Measured on 3,040 MathVision samples
      with four anchors, each compared to its own CoT baseline, plus a
