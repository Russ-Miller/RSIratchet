id: training-small-instruction-tuned-models-reinforcement-learning-plus-factual-supervision
ref: CLM-0182
capability: fact-verification
statement: >-
  When training small instruction-tuned models with reinforcement learning
  plus factual supervision, routing each atomic fact's verification score
  only to the tokens that produced it, and down-weighting verifier
  judgements that do not change when their key evidence is removed,
  improves factuality benchmark scores over trajectory-level or reasoning-
  step-level factual rewards.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "3B-parameter instruct models (Qwen2.5-3B-Instruct, Llama-3.2-3B-Instruct), GRPO-style RL on multi-hop QA with Wikipedia evidence snippets, GPT-4o for fact extraction and NLI verifi"
sources:
  - source: arxiv-2608-24350
    stance: supports
    note: >-
      Two 3B models, four hallucination benchmarks and four math
      benchmarks; FARCA beats KnowRL, FSPO, FaithRL and plain GRPO by
      roughly 1.75-2.21 average points. Ablations remove token provenance
      and reliability estimation separately, each dropping scores, which
      isolates the two components. Small models only, single seed
      reported, and the pipeline depends on GPT-4o extraction so the
      comparison is not compute-matched.
contested: false
status: pending-review
last_checked_at: 2026-09-07
notes: >-
  Ingested unreviewed on 2026-09-07 and deliberately inert until a human
  endorses it: it does not move a technique standing, does not count
  toward the backtest, and is excluded anywhere a claim would carry
  weight. Drafted confidence: low. Falsifier as drafted: An ablation or
  replication where token-level routing and reliability weighting give no
  gain over step-level factual rewards, or where coarse aggregation
  matches it once tuned equally. Proposed technique, not yet catalogued:
  fact-aligned reliability-weighted token credit.
