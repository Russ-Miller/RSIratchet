id: long-horizon-tool-mediated-environments-where-strategically-relevant-state-available-only
ref: CLM-0648
capability: long-horizon-execution
technique: measure-proactive-monitoring-reflection-action-gap-traces
statement: >-
  In long-horizon tool-mediated environments where strategically relevant
  state is available only on explicit query (300+ turn Civilization VI via
  MCP, 23 runs, four model families under a shared playbook), agents
  allocate only about 1-2% of non-infrastructure tool calls to strategic
  monitoring and execute only about 48-66% of the near-term commitments they
  state in their own planning diaries, even though the playbook told them to
  query victory progress every 20 turns.
kind: observation
backing_strength: single-paper
observed_on:
  era: "Single-agent play against built-in AI, fixed scenarios, shared human-written playbook that elicits a five-field turn diary; 23 runs across four model families, underpowered for bet"
sources:
  - source: arxiv-2609-02459
    stance: supports
    note: >-
      Validated by: Commitments extracted and labelled by an LLM against a
      fixed rubric; validated on a stratified sample of 50 commitments
      labelled independently by an author, 92.0% agreement, Cohen's kappa
      0.879. Linked to outcomes via a missed-warning analysis: in 7 of 20
      detectable defeats no victory-progress query occurred in the 20-turn
      window before game end.. Measured on 23 admissible runs (19 Ground
      Control, 4 Snowflake) with uneven per-family coverage (one family has
      a single run); [truncated]
