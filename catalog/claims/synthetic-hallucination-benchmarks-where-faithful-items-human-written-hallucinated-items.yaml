id: synthetic-hallucination-benchmarks-where-faithful-items-human-written-hallucinated-items
ref: CLM-0165
capability: evaluation-validity
statement: >-
  In synthetic hallucination benchmarks where faithful items are
  human-written and hallucinated items are LLM-rewrites, a detector's binary
  score partly measures human-vs-machine style rather than factuality:
  feeding faithful LLM rewrites of the same truthful articles makes some
  fine-tuned encoders flag nearly all of them as hallucinated.
kind: mechanism
backing_strength: single-paper
observed_on:
  era: "Fine-tuned multilingual encoders (ReMBERT, mDeBERTa) trained on an LLM-generated news hallucination corpus; provenance analysis run on Russian original text only."
sources:
  - source: arxiv-2608-24707
    stance: supports
    note: >-
      Measured on 290 truthful human articles, 290 factcheck.kz
      human-written fakes, 290 faithful Gemini rewrites, and synthetic
      hallucinations. ReMBERT flagged 0.352 of human truthful vs 1.000 of
      faithful LLM rewrites; mDeBERTa 0.221 vs 0.586, so the effect is real
      but model-dependent. Single language, single domain, two encoders;
      register differences between real fakes and newswire are acknowledged
      but not fully controlled.
contested: false
status: pending-review
last_checked_at: 2026-09-09
notes: >-
  Drafted from the paper by a model and filed unreviewed. Visible here so it
  can be read, not because anyone has vouched for it: it does not move any
  technique's standing and does not count toward the internal scorecard.
  Drafted confidence: medium. Falsifier as drafted: Detectors trained on
  such synthetic splits show near-baseline flag rates on faithful LLM
  rewrites of truthful articles, i.e. their scores track veracity
  independently of text provenance. Proposed technique, not catalogued:
  Provenance-controlled evaluation split.
