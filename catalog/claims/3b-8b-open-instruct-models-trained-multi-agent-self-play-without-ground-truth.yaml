id: 3b-8b-open-instruct-models-trained-multi-agent-self-play-without-ground-truth
ref: CLM-0977
capability: critique
technique: reward-critique-improvement-causes-peers
statement: >-
  For 3B-8B open instruct models trained by multi-agent self-play without
  ground-truth labels, rewarding a critique by whether the critiqued agent's
  peer-ranked score rises after revision trains judging ability as well as
  generation, raising both task accuracy over majority-vote self-rewarding
  baselines and standalone pairwise-judge accuracy on an external reward
  benchmark.
kind: mechanism
backing_strength: single-paper
