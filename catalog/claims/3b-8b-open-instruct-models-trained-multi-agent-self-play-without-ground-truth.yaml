    stance: supports
    note: >-
      Validated by: Pass@1 on six verifiable reasoning benchmarks across
      four backbones against self-rewarding majority-vote baselines
      (Qwen3-8B DeepMath 87.1 vs 78.8, AIME24 76.5 vs 69.8), three
      non-verifiable benchmarks (+2.7-8.3 pp over SRT-M), ablation zeroing
      the diagnostic weight (DeepMath Pass@1 87.1 to 83.5, Rank-rho 0.78 to
      0.55), and RewardBench-2 judge accuracy 52.3 to 58.6.. Measured on
      four open backbones, six verifiable and three non-verifiable
      benchmarks, three runs each, against inference-only and two
      self-rewarding training baselines; [truncated]
