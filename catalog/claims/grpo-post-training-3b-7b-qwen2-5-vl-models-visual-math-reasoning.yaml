id: grpo-post-training-3b-7b-qwen2-5-vl-models-visual-math-reasoning
ref: CLM-0839
capability: evaluation-validity
technique: corrupt-one-modality-during-rl-training-test-grounding
statement: >-
  For GRPO post-training of 3B-7B Qwen2.5-VL models on visual math
  reasoning, accuracy gains cannot be attributed to the training images:
  replacing every training image with a blank or a mismatched random image
  still raises benchmark scores well above the base model, and at 7B the
  random-image variant beats clean-data GRPO on average (54.23 vs 53.52).
kind: observation
backing_strength: single-paper
observed_on:
  era: "GRPO with final-answer rule-based rewards, Qwen2.5-VL 3B/7B, trained on Geometry3K, MMR1-V0 or CLEVR and scored on MathVision, MathVerse, MathVista and WeMath."
