    stance: supports
    note: >-
      Validated by: Measured as paired training runs on three datasets and
      two model sizes, reporting accuracy on four multimodal math benchmarks
      against both the untrained base model and clean GRPO; corrupted
      training beat the base model everywhere and matched or exceeded clean
      GRPO at 7B.. Measured: three corruption types, two model sizes, three
      training datasets, four benchmarks plus Geometry3K splits, with
      base-model and clean-GRPO baselines. Single paper, one model family,
      one RL algorithm. [truncated]
