id: causal-reasoning-items-where-model-has-already-given-wrong-answer
ref: CLM-0981
capability: critique
technique: critique-causal-structure-trace-answer
statement: >-
  On causal-reasoning items where a model has already given a wrong answer
  by substituting correlational for interventional reasoning, a critique
  that names structural flaws in the exposed reasoning trace (unexamined
  confounders, back-door paths) recovers far more items than outcome-only
  reprompting, and the gap is largest for reasoning-heavy models that barely
  respond to 'are you sure?'
kind: observation
backing_strength: single-paper
observed_on:
  era: "Text-based causal QA benchmarks (CausalT5K, CLadder L2) deliberately built so the correlational answer is wrong; correction evaluated only on each model's already-failed cases; hea"
sources:
  - source: arxiv-2602-11675
    stance: supports
    note: >-
      Validated by: Recovery rate on each model's failed cases across 1,360
      CausalT5K scenarios and six models, against outcome-only reprompting,
      self-consistency, Best-of-N and Self-Refine; GPT-4 Turbo 31.4% to
      90.5% and GPT-5.2 24.5% to 77.6% (McNemar p<.001), residual rung
      collapse 4% vs 55-70% for the test-time baselines; a matched-length
      non-causal control isolated the causal vocabulary for GPT-4 Turbo
      (58.7% vs 52.8%, p=0.006) but not for GPT-5.2 (p=0.093).. [truncated]
