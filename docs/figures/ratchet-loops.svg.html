<figure class="fig">
<svg viewBox="0 0 980 600" role="img" aria-label="Two ratchet loops, a person's and an agent's, both passing through the RSI Ratchet catalog: failures go in as classified capability gaps, techniques with conditions come out, outcomes are filed back as claims. A blue edge from the catalog to the pipeline that builds it is the one that would show self-improvement, and is the edge not yet measured." style="max-width:100%;height:auto;font-family:var(--mono);font-size:12px">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
  </defs>

  <!-- lane headings -->
  <text x="160" y="28" text-anchor="middle" font-weight="500" letter-spacing=".08em">A PERSON</text>
  <text x="820" y="28" text-anchor="middle" font-weight="500" letter-spacing=".08em">AN AGENT</text>
  <text x="490" y="28" text-anchor="middle" font-weight="500" letter-spacing=".08em">RSI RATCHET</text>

  <!-- catalog -->
  <rect x="370" y="48" width="240" height="330" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="490" y="78" text-anchor="middle" font-weight="500">capabilities</text>
  <text x="490" y="96" text-anchor="middle" fill="currentColor" opacity=".7">the map, open-ended</text>
  <line x1="490" y1="104" x2="490" y2="124" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="490" y="146" text-anchor="middle" font-weight="500">claims</text>
  <text x="490" y="164" text-anchor="middle" opacity=".7">scoped · sourced · reviewed by</text>
  <text x="490" y="180" text-anchor="middle" opacity=".7">AI, or AI and a person</text>
  <line x1="490" y1="188" x2="490" y2="208" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="490" y="230" text-anchor="middle" font-weight="500">techniques</text>
  <text x="490" y="248" text-anchor="middle" opacity=".7">standing · needs · cost · fails when</text>
  <line x1="490" y1="256" x2="490" y2="276" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="490" y="298" text-anchor="middle" font-weight="500">adages</text>
  <text x="490" y="316" text-anchor="middle" opacity=".7">holds · breaks · narrows</text>
  <text x="490" y="356" text-anchor="middle" opacity=".7">contest any of it ↓</text>

  <!-- person loop (left), top to bottom -->
  <rect x="40" y="48" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="160" y="75" text-anchor="middle">a failure in an agent system</text>
  <line x1="160" y1="92" x2="160" y2="116" stroke="currentColor" marker-end="url(#ah)"/>
  <rect x="40" y="118" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="160" y="145" text-anchor="middle">classify: which capability?</text>
  <line x1="280" y1="140" x2="368" y2="140" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="324" y="132" text-anchor="middle" opacity=".8">search</text>
  <line x1="368" y1="232" x2="282" y2="232" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="324" y="224" text-anchor="middle" opacity=".8">standing, conditions</text>
  <rect x="40" y="210" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="160" y="237" text-anchor="middle">encode fix at strongest layer</text>
  <line x1="160" y1="254" x2="160" y2="278" stroke="currentColor" marker-end="url(#ah)"/>
  <rect x="40" y="280" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="160" y="307" text-anchor="middle">own sensors: held or broke?</text>
  <line x1="280" y1="302" x2="368" y2="302" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="324" y="294" text-anchor="middle" opacity=".8">file, contest, review</text>
  <text x="160" y="352" text-anchor="middle" opacity=".7">a person's review is what</text>
  <text x="160" y="368" text-anchor="middle" opacity=".7">gives a claim weight</text>

  <!-- agent loop (right), top to bottom -->
  <rect x="700" y="48" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="820" y="75" text-anchor="middle">a sensor fires</text>
  <line x1="820" y1="92" x2="820" y2="116" stroke="currentColor" marker-end="url(#ah)"/>
  <rect x="700" y="118" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="820" y="145" text-anchor="middle">classify the failure class</text>
  <line x1="700" y1="140" x2="612" y2="140" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="656" y="132" text-anchor="middle" opacity=".8">advise</text>
  <line x1="612" y1="232" x2="698" y2="232" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="656" y="224" text-anchor="middle" opacity=".8">techniques that fit</text>
  <rect x="700" y="210" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="820" y="237" text-anchor="middle">encode fix at strongest layer</text>
  <line x1="820" y1="254" x2="820" y2="278" stroke="currentColor" marker-end="url(#ah)"/>
  <rect x="700" y="280" width="240" height="44" rx="3" fill="none" stroke="currentColor"/>
  <text x="820" y="307" text-anchor="middle">gate on a held-out set</text>
  <line x1="700" y1="302" x2="612" y2="302" stroke="currentColor" marker-end="url(#ah)"/>
  <text x="656" y="294" text-anchor="middle" opacity=".8">file, reviewed by AI</text>
  <text x="820" y="352" text-anchor="middle" opacity=".7">the gate never reads the split</text>
  <text x="820" y="368" text-anchor="middle" opacity=".7">it is promoting on</text>

  <!-- the closing edge (Wu's blue arrow) -->
  <rect x="370" y="470" width="240" height="60" rx="3" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
  <text x="490" y="494" text-anchor="middle">the pipeline that builds</text>
  <text x="490" y="512" text-anchor="middle">the catalog (an agent too)</text>
  <path d="M 490 378 L 490 468" fill="none" style="stroke:var(--accent)" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="504" y="412" style="fill:var(--accent)" font-weight="500">does using the catalog</text>
  <text x="504" y="428" style="fill:var(--accent)" font-weight="500">improve the pipeline</text>
  <text x="504" y="444" style="fill:var(--accent)" font-weight="500">that builds it?</text>
  <path d="M 610 500 L 660 500 L 660 60 L 700 60" fill="none" style="stroke:var(--accent)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ahb)"/>
  <text x="668" y="480" style="fill:var(--accent)" opacity=".9">runs the agent loop</text>
  <text x="668" y="496" style="fill:var(--accent)" opacity=".9">on itself</text>

  <!-- what is measured -->
  <text x="40" y="560" opacity=".7">measured today: candidates fetched, drafts filed, cost per paper, classifier error rate</text>
  <text x="40" y="580" opacity=".7">not yet measured: whether the catalog gets more accurate, and the blue edge — the backtest is the only outcome sensor</text>
</svg>
<figcaption>Two ratchet loops through one catalog. A person and an agent both turn a failure into a classified gap, take techniques with their conditions out, and file the outcome back. The blue edge is the one that would show self-improvement, and it is the edge not yet measured.</figcaption>
</figure>
