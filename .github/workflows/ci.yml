name: ci
on:
  pull_request:
  workflow_dispatch:   # the nightly job dispatches this on its branch
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
  # Paper titles are checked against arXiv. On a pull request only the
  # sources it adds or changes are checked (a few calls, so arXiv's limits on
  # shared CI addresses rarely bite); the full pass runs on main. Skipping PRs
  # entirely let bad titles reach main and turn it red.
  verify-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: github.event_name != 'push'
        run: npm run verify-papers -- --changed origin/${{ github.base_ref || 'main' }}
      - if: github.event_name == 'push'
        run: npm run verify-papers
