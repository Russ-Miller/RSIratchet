name: nightly-ingestion

# Fetch new papers, match them to capabilities, judge direction against held
# claims, and commit the result so the deployed queue is fresh each morning.
#
# Stages 2 and 2b cost money (Anthropic API). They run only when the secret is
# present, so a fork or a repo without the key still gets a working stage-1
# crawl rather than a failing job.
on:
  schedule:
    # 09:17 rather than 09:00. GitHub queues scheduled runs on a shared pool
    # and drops or badly delays them at popular times; the top of the hour is
    # the most contended slot there is. An odd minute is the standard way to
    # avoid it. GitHub still guarantees nothing about schedules, which is why
    # the run log records whether a run happened at all.
    - cron: "17 9 * * *"    # 09:17 UTC — early morning US, after arXiv's daily feed
  workflow_dispatch:         # and on demand from the Actions tab
    inputs:
      days:
        description: "Trailing window in days"
        default: "7"
      classify_limit:
        description: "Max candidate x capability pairs to classify (cost control). Tonight's window is about 25; a backfilled week adds about 45 after pruning."
        default: "100"
      propose_limit:
        description: "Max unmatched papers to mine for new capabilities"
        default: "80"
      backfill_weeks:
        description: "Historical 7-day windows to fetch tonight, walking back from the cursor in pipeline/backfill.json (0 to skip)"
        default: "1"
      backfill_top:
        description: "Capability-matched candidates kept per backfilled window, by heuristic score (cost control); 30 unmatched are kept for the proposal stage"
        default: "40"

concurrency:
  group: nightly-ingestion
  cancel-in-progress: false   # never interrupt a run mid-spend

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous, because every stage is deliberately slow -- but bounded, so a
    # hung fetch cannot sit on a runner for the 6-hour default.
    timeout-minutes: 150   # three batched stages may each wait up to 25 min for results
    permissions:
      contents: write         # to commit the refreshed queue
    env:
      STATE_BRANCH: pipeline-state
      # secrets are not reliably available in a step-level `if`, so resolve
      # their presence once here and gate on these instead.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # One dated log per run, persisted with the rest of pipeline/ so each
      # morning's result can be read without opening the Actions tab. Every
      # stage tees into it; a stage that fails still leaves its output behind.
      - name: Start run log
        run: |
          mkdir -p pipeline/logs
          echo "RUN_LOG=pipeline/logs/$(date -u +%Y-%m-%d).md" >> "$GITHUB_ENV"
      - name: Log header
        run: |
          {
            echo "# Ingestion run $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- window: ${{ inputs.days || '7' }} days · classify limit ${{ inputs.classify_limit || '100' }} · propose limit ${{ inputs.propose_limit || '80' }}"
            echo "- paid stages: ${{ env.HAS_ANTHROPIC_KEY == 'true' && 'enabled' || 'SKIPPED (no ANTHROPIC_API_KEY)' }}"
            echo
          } >> "$RUN_LOG"

      # Pipeline state (queue + seen-ledger) lives on its own branch, not main:
      # main's ruleset requires the `test` check, which a direct bot push cannot
      # satisfy, and github-actions[bot] is not offered as a bypass actor. Using
      # a side branch keeps main's protection fully intact.
      - name: Restore pipeline state
        run: |
          if git fetch origin "$STATE_BRANCH" 2>/dev/null; then
            git checkout "origin/$STATE_BRANCH" -- pipeline/ || true
            echo "Restored pipeline/ from $STATE_BRANCH"
          else
            echo "No $STATE_BRANCH yet — first run, starting from the committed state."
          fi

      # Stage 1 — free. Trailing window plus the seen-ledger is self-healing
      # against OpenAlex's arXiv indexing lag.
      - name: Fetch candidates (OpenAlex)
        env:
          PAGE_DELAY_MS: "1500"
        run: |
          echo '## Stage 1 — fetch candidates (OpenAlex)' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          node scripts/fetch-openalex.mjs --days "${{ inputs.days || '7' }}" 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # Stage 1b -- the back catalogue, one week per night, walking backwards
      # from where the trailing window began toward 2023. Free to fetch; the
      # paid stages cap themselves and take the freshest window first.
      - name: Backfill historical windows
        if: ${{ (inputs.backfill_weeks || '1') != '0' }}
        run: |
          echo '## Stage 1b — backfill' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          node scripts/backfill.mjs --weeks "${{ inputs.backfill_weeks || '1' }}" --top "${{ inputs.backfill_top || '40' }}" 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # Stage 2 — judges direction and contradiction for newly matched papers.
      - name: Classify direction
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo '## Stage 2 — classify direction' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          node scripts/classify-candidates.mjs --limit "${{ inputs.classify_limit || '100' }}" --delay 2500 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # Stage 2b — mines the unmatched pile for capabilities not yet tracked.
      - name: Propose new capabilities
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROPOSE_DELAY_MS: "4000"
        run: |
          echo '## Stage 2b — propose capabilities' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          node scripts/propose-capabilities.mjs --limit "${{ inputs.propose_limit || '80' }}" 2>&1 | tee -a "$RUN_LOG"
          node scripts/propose-capabilities.mjs --consolidate 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # Stage 3 — write a readable digest for any paper source that lacks one.
      # Usually zero work: sources are created by hand when a claim is filed,
      # not by this job. Runs from full text where arXiv renders it, and paces
      # itself deliberately — nothing is waiting on this at 09:00 UTC, and the
      # slow path avoids the retry storms that made an impatient pass give up.
      - name: Write source briefs
        if: env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo '## Stage 3 — source briefs' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          node scripts/summarize-sources.mjs --limit 25 --delay 20000 --chunk 8 --start-delay 60000 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # Free, no key. Re-fetches sources that pin a file hash and reports any
      # that changed under the same URL. continue-on-error because a changed
      # source is news, not a broken build — the exit code is non-zero by
      # design so the log carries it.
      - name: Check pinned sources
        continue-on-error: true
        run: |
          echo '## Pinned sources' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          npm run check-sources 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # The catalog itself is never written by this job — only the queue and
      # the ledger. Validation guards against a malformed write reaching main.
      - name: Validate
        run: npm run validate

      # Newly filed claims need vectors for meaning search and related claims.
      # Incremental: only records whose text changed are embedded. The model
      # runs locally in the job; no API and no key.
      - name: Embed new records
        run: |
          echo '## Embeddings' >> "$RUN_LOG"
          echo '```' >> "$RUN_LOG"
          npm run embed 2>&1 | tee -a "$RUN_LOG"
          npm run check-embeddings 2>&1 | tee -a "$RUN_LOG"
          echo '```' >> "$RUN_LOG"

      # Vercel's GitHub integration never linked for this repo, so a push does
      # not trigger a build. Deploy explicitly with the CLI instead, which
      # uploads the directory and needs no git connection.
      #
      # The CLI is a pinned devDependency, not `npx --yes vercel@latest`. That
      # matters twice: `@latest` silently changes the deploy tool under us
      # between runs, and fetching-and-executing a package at deploy time is a
      # supply-chain step in the one job that holds the production token. Same
      # `npm run deploy` runs locally, so there is one deploy command, not two.
      - name: Deploy to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm run deploy -- --token "$VERCEL_TOKEN"

      - name: Close run log
        if: always()
        run: |
          {
            echo
            echo "## Outcome"
            echo
            echo "- job status: ${{ job.status }}"
            echo "- queue files: $(ls pipeline/queue 2>/dev/null | wc -l | tr -d ' ')"
            echo "- candidates: $(cat pipeline/queue/*.yaml 2>/dev/null | grep -c '^  - openalex_id:' || echo 0)"
            echo "- classified: $(cat pipeline/queue/*.yaml 2>/dev/null | grep -c '^        direction:' || echo 0) verdicts"
            echo "- backfill cursor: $(node -e 'try{const s=require("./pipeline/backfill.json");console.log(s.next_to+" (earliest "+s.earliest+", "+s.done.length+" windows done)")}catch{console.log("not started")}')"
            echo "- shortlist: $(grep -c '^  - id:' pipeline/capability-shortlist.yaml 2>/dev/null || echo 0) candidate capabilities"
            echo "- finished: $(date -u +'%Y-%m-%d %H:%M UTC')"
          } >> "$RUN_LOG"

      - name: Persist pipeline state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/
          if git diff --staged --quiet; then
            echo "No pipeline changes to persist."
            exit 0
          fi
          # Commit onto the state branch rather than main. Force-push is safe
          # here: this branch is bot-owned state that nothing builds from, and
          # the current contents are the state -- not a history anyone reads.
          git checkout -B "$STATE_BRANCH"
          printf '%s\n\n%s\n' \
            "Nightly ingestion: refresh review queue" \
            "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>" > /tmp/msg
          git commit -F /tmp/msg
          git push -f origin "$STATE_BRANCH"
