arxiv_id: "2608.27420"
title: Boosting LLM Exploration via Weak-Model Guidance in RLVR
url: https://doi.org/10.48550/arxiv.2608.27420
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fine-tuning-retention
statement: In GRPO-style RLVR on math for 7B models, injecting partial
  reasoning prefixes from a small out-of-family model (Gemma-2-2B,
  LLaMA-3.2-1B) into a fraction of rollouts keeps policy entropy higher early
  in training and raises pass@k, with gains growing as k rises; the effect
  comes from distributional unfamiliarity rather than prefix quality, since
  prefixes from same-family models of equal or higher quality give no gain
  over vanilla GRPO.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen2.5-7B and Qwen2.5-Math-7B trained with GRPO on MATH,
  evaluated on six math benchmarks; prefix injection probability 0.2,
  entropy-based truncation; only mathematical reasoning tested.
technique: ""
proposed_technique: Complete prefixes from a weaker out-of-family model during RLVR
technique_summary: For a fraction of RLVR rollouts, prepend a truncated
  partial reasoning trajectory generated by a smaller, different-family model
  (cut at the largest step-to-step entropy drop) and train the target model to
  complete it.
technique_kind: training
technique_validated_by: Average pass@1 to pass@128 over AIME 2024/2025, AMC
  2023, MATH 500, Minerva, OlympiadBench against vanilla GRPO and the
  untrained base model; ablations on injection probability, random vs entropy
  truncation, and same-family prefix generators; LLM-graded prefix quality
  distribution.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Prefixes from a same-family model of comparable quality producing
  pass@k gains equal to out-of-family prefixes, or out-of-family prefixes
  failing to raise pass@k above vanilla GRPO at matched compute.
evidence_note: Measured on two 7B targets, one training set, six benchmarks,
  single runs with no seed variance reported; pass@128 still below the
  untrained base model in most rows, so the method narrows rather than removes
  coverage loss. The homologous-prefix ablation is the main support for the
  mechanism and rests on one table row per generator.
confidence: medium
