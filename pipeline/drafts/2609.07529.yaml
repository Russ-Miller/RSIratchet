capability: prompt-injection
statement: For tool-using agents trained against adaptive indirect prompt
  injection, attack success measured against a single frozen adaptive attacker
  understates vulnerability compared with taking the per-case success union
  over a population of retained attacker checkpoints (0.25% vs 4.97% on the
  same 1,187 adaptive cases for the trained defender).
kind: mechanism
backing_strength: single-paper
scope_condition: Multi-turn tool-use agents in sandboxed domains with
  deterministic attack verifiers; attackers are learned policies from stages
  of the same co-training run, and the union uses more attempts per case than
  the single-attacker protocol.
technique: ""
proposed_technique: Attacker-population union evaluation for injection defenses
stance_on_existing: supports
related_claim_id: computer-use-agents-operating-real-os-indirect-injection-success-rates-measured
stance_reason: Both find that a single fixed evaluation attacker reports lower
  injection success than a more varied or adaptive attacker set on the same
  defender.
falsifier: On the same cases, the union over a diverse population of held
  attacker checkpoints yields attack success no higher than the single frozen
  adaptive attacker, after equalizing the number of attempts per case.
evidence_note: Measured in one training run, seed 0, one execution per case,
  on 1,187 adaptive cases across seven AgentDyn/AgentDojo suites with a
  Qwen3.5-9B defender; the union gets more attempts than the single attacker,
  so attempt count and attacker diversity are not separated, and no newly
  optimized attacker was trained against the final defender.
