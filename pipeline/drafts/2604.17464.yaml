arxiv_id: "2604.17464"
title: "Project Prometheus: Bridging the Intent Gap in Agentic Program Repair
  via Reverse-Engineered Executable Specifications"
url: https://doi.org/10.48550/arxiv.2604.17464
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: debugging
statement: For agentic Java program repair on Defects4J, conditioning the
  fixing agent on a reverse-engineered Gherkin behaviour specification that
  has been validated against the developer's fixed code repairs a large share
  of bugs the same agent fails on with code and failing test alone (119 of 160
  rescued, 74.4%), but the figure is an upper bound because the validation
  step consumes the ground-truth fix.
kind: observation
backing_strength: single-paper
scope_condition: Defects4J v3.0.1, 680 bugs, Closure excluded; Qwen-3.0-Coder
  as fixer, Gemini-3.0-Pro as spec architect; fixer restricted to the single
  primary suspicious file; specifications accepted only if they fail on buggy
  code and pass on the developer-fixed code.
technique: ""
proposed_technique: Infer an executable BDD spec, then repair against it
technique_summary: One agent reverse-engineers a Gherkin Given-When-Then
  specification from the runtime failure report, a second agent keeps only
  specifications that fail on the buggy code and pass on the fixed code, and a
  third agent writes the patch conditioned on that specification.
technique_kind: process
technique_validated_by: "Correct patch rate against the developer ground-truth
  fix on 680 Defects4J bugs: blind fixer 520/680, plus 119 of the 160 blind
  failures rescued when the specification was supplied, composite 639/680
  (93.97%); on the same 160 hard bugs TSAPR resolved 22 and RepairAgent 27."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Replacing the fixed-code oracle with negative-only verification or
  human review of the Gherkin scenarios, and finding the rescue rate drops to
  near the blind baseline, would show the gain came from the ground-truth fix
  rather than from specification guidance.
evidence_note: Measured on 680 real bugs with an internal blind-fixer baseline
  that is a strict input subset, which cleanly isolates the specification as
  the added variable. But the validation loop reads the developer fix, so the
  result is explicitly framed by the authors as a theoretical upper bound; the
  fixer is also confined to one file, and no run without the fixed-code oracle
  is reported. Cost breakdown comes from only 189 sessions.
confidence: medium
