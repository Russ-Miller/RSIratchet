stance_reason: ""
falsifier: An audit showing cross-task aggregation alone lowers the
  model-specific-accommodation share relative to per-failure editing, or
  showing the refinement stage's accuracy gain persists when its MSA share is
  as high as the aggregation-only condition.
evidence_note: "Measured: accuracy and Pass^3 over five models by three
  datasets with a Direct, human-optimized, and serial-evolution baseline;
  ablation isolates aggregation from refinement. The MSA figures come from a
  manual audit of harness edits done by the authors themselves with no
  independent or blinded rater, so the central attribution number is the
  weakest link. Cross-LLM generalization is asserted but the harness-transfer
  numbers are not in the given text."
