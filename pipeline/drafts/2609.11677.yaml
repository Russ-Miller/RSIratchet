arxiv_id: "2609.11677"
title: "Ecdysis: Efficient and Effective Training of Runtime Harnesses for LLM
  Agents"
url: https://arxiv.org/abs/2609.11677
drafted_at: 2026-09-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: "When an agent system evolves its own harness from failure traces,
  batching failures across tasks before editing buys efficiency but not better
  failure attribution: pooled across three agent benchmarks, the share of
  harness edits that merely accommodate the current model rose from 60.0%
  under per-failure serial editing to 75.6% under cross-task aggregation, and
  only fell to 45.5% when a separate analyst/critic/engineer refinement stage
  attributed each recurring pattern before the edit was written."
kind: mechanism
backing_strength: single-paper
scope_condition: Frozen task models (Qwen3-8B/14B/32B, MiniMax-M2.7,
  Llama-3.1-8B) on AgentBench and tau2-Bench Airline/Retail, starting from one
  human-optimized harness, with edits written by a coding agent; MSA/HLR
  labels assigned by manual audit performed by the paper's own authors.
technique: ""
proposed_technique: Attribute recurring failures before editing the harness
technique_summary: Aggregate failing trajectories across tasks into recurring
  failure groups, then run a fixed number of analyst-critic-engineer
  refinement passes plus a moderator to produce one modification
  specification, which a coding agent implements and which is kept only if the
  training score improves.
technique_kind: process
technique_validated_by: Average accuracy over 15 model-by-dataset cells rose
  from 58.67% (serial self-evolution) to 64.56% (aggregation only) to 69.56%
  (with refinement), Pass^3 from 46.67% to 60.00%; training time 1.03-1.84x
  faster than serial; held-out inference tokens 12.8% lower; total LLM calls
  482 vs 881 for the baseline.
stance_on_existing: neither
