evidence_note: "Measured: four intrinsic reward variants vs GRPO over 100-200
  steps on LiveCodeBench v5/v6 plus AIME transfer, with logged length,
  entropy, reasoning-token density and repetition, and bootstrap experiments
  from intrinsic checkpoints. Mostly one 1.5B base model; larger-model results
  only in appendix, so scale generality is weakly isolated."
