statement: "When a distilled 1.5B reasoning model is RL-trained on
  competitive-programming problems with certainty-based intrinsic rewards
  (self-certainty, token or trajectory entropy, probability disparity) instead
  of execution-verified rewards, LiveCodeBench accuracy rises for a few dozen
  steps and then degrades, because shorter responses score higher certainty:
  outputs shrink from about 7,300 to under 1,100 tokens, entropy collapses,
  and repetition rises."
kind: mechanism
backing_strength: single-paper
scope_condition: Function-level self-contained coding problems;
  DeepSeek-R1-Distill-Qwen-1.5B main study, with limited checks on Qwen3-4B
  and Qwen2.5-Coder-7B; certainty-based RLIF only, not ensemble/majority-vote
  methods.
technique: ""
proposed_technique: Use certainty-only RL as a short warm-up, then switch to verified rewards
technique_summary: Train with intrinsic certainty rewards only in early steps
  and hand off to execution-verified GRPO before length and entropy collapse.
technique_kind: training
technique_validated_by: GRPO continued from a step-50 self-certainty
  checkpoint reached 0.151 on LiveCodeBench v5, matching GRPO from scratch
  (0.154), while step-80 and step-105 checkpoints reached 0.125 and 0.120 and
  did not recover in 40 further GRPO steps.
