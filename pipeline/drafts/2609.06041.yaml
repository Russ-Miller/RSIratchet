falsifier: Under the same matched training budget and data pipeline, free-form
  rationale or planning-CoT pre-generation matching or exceeding the
  fixed-schema specification arm's Pass@1, especially on held-out
  out-of-distribution benchmarks.
evidence_note: "One backbone, one paper. Generation-only ablation (Table 5):
  APPS 0.172 vs 0.166/0.170/0.168, CodeContests 0.061 vs 0.055/0.060/0.061,
  xCodeEval 0.127 vs 0.080/0.103/0.093, with reported 95% CIs that overlap on
  the in-distribution benchmarks; only the OOD gap is wide relative to the
  intervals. Output length is reported (694.7 tokens vs 568.2/539.0), so the
  comparison is not length-matched, though the authors argue length alone does
  not explain the gap. No second backbone or seed variation."
