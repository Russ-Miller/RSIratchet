statement: For a 7B code model fine-tuned on competitive-programming tasks,
  training it to emit a fixed-schema requirement specification (goals,
  input/output constraints, examples, edge cases, dependencies) before the
  code raises Pass@1 more than training it to emit free-form reasoning or a
  stepwise implementation plan of similar length, with the largest margin on
  an out-of-distribution benchmark.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-7B-Coder-Instruct, specification-rich competitive
  programming benchmarks (APPS, CodeContests in-distribution; xCodeEval
  out-of-distribution); intermediate representations for all arms generated by
  GPT-4o and filtered identically, matched GRPO budget and generation-only
  reward.
technique: chain-of-thought
proposed_technique: Structured specification analysis before code
