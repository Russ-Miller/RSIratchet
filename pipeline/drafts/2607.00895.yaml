arxiv_id: "2607.00895"
title: "Beyond Document Grounding: Span-Level Hallucination Detection over
  Code, Tool Output, and Documents"
url: https://doi.org/10.48550/arxiv.2607.00895
drafted_at: 2026-10-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "For span-level hallucination detection over source code and
  developer-tool output, detectors trained on natural-language RAG and large
  zero-shot LLM judges fail by over-flagging: they mark correct newly written
  patch code as unsupported, reaching only about 0.17-0.22 span-F1 on
  repository-grounded code answers, while a 2B detector fine-tuned on
  structured-evidence span data reaches about 0.60 on the same split."
kind: observation
backing_strength: single-paper
scope_condition: Post-generation verification where the detector sees only
  request, context (repository state at the base commit, tool observation) and
  answer; labels mostly from synthetic localized injection, with the code test
  split human-arbitrated.
technique: ""
proposed_technique: Fine-tune a span detector on code and tool-output evidence
technique_summary: Builds grounded answers from gold repository patches and
  tool observations, injects localized edits to recover exact character spans,
  and fine-tunes a 2B generative model to emit unsupported spans with a
  category label.
technique_kind: training
technique_validated_by: Character-overlap span P/R/F1 and example-F1 on a
  10,698-example unified test set split by grounding source, against
  LettuceDetect-large, answer-level faithfulness models (HHEM, Lynx,
  Granite-Guardian, MiniCheck), an mmBERT encoder, and zero-shot
  Nemotron-3-Ultra and gpt-oss-120b judges; also 81.8 RAGTruth example-F1 and
  0.724 English PsiloQA IoU.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A zero-shot LLM judge, or a detector trained only on
  document-grounded RAG data, reaching span-F1 near 0.6 on repository-grounded
  code answers without code- or tool-specific training.
evidence_note: Measured on a 2,015-example code-agent test set (12 held-out
  repositories) reviewed and arbitrated by the authors; precision for judges
  was 0.11-0.14 against 0.60 for the fine-tuned model. Most training and
  non-code test labels are synthetic injections, so the gap could partly
  reflect detectors learning the injection distribution rather than
  verification; the authors note this.
confidence: medium
