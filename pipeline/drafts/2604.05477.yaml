arxiv_id: "2604.05477"
title: "Don't Act Blindly: Robust GUI Automation via Action-Effect
  Verification and Self-Correction"
url: https://arxiv.org/abs/2604.05477
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For 3B-7B vision-language GUI agents, making each step predict the
  expected screen effect and verify it against the next observation — trained
  by SFT on synthetic failure trajectories plus GRPO with an asymmetric
  penalty for falsely claiming success — raises recovery success and cuts
  repeated-failed-action loops relative to same-scale agents that act without
  verifying prior outcomes.
kind: mechanism
backing_strength: single-paper
scope_condition: Mobile/web GUI automation where failed actions mostly leave
  the screen unchanged (idempotent failures); training data synthesized under
  that assumption; not validated for non-idempotent failures such as
  unintended navigation or crashes.
technique: ""
proposed_technique: Predict the expected screen effect, then verify it next step
technique_summary: The agent emits thinking, a binary verification of the
  previous step against its own earlier effect prediction, the action, and a
  prediction of the resulting screen change, and is trained with SFT on
  injected-failure trajectories plus GRPO rewarding honest verification with a
  heavier penalty for false success claims.
technique_kind: training
technique_validated_by: "On a failure-injection Robustness Benchmark from
  AndroidControl-High, Recovery Success Rate 51.1% (3B) and 52.5% (7B) vs
  45.5% best open baseline (UI-TARS-7B), Loop Rate 24.3%/15.6% vs 30.0% for
  Qwen2.5-VL-3B; ablations: Robust SFT lifts RSR 29.7->45.5, GRPO to 51.1;
  also gains on live MiniWoB++ and AndroidWorld."
stance_on_existing: supports
related_claim_id: external-feedback-repair
stance_reason: The verification signal is a grounded environment observation
  (screen changed or not) rather than unaided self-critique, and the gain
  appears only once that signal is trained against.
falsifier: An agent trained this way showing no better recovery success or
  loop rate than a matched-compute agent trained without the
  verification/expected-effect objective, or the gains disappearing when
  failures are non-idempotent.
evidence_note: Measured on one base family (Qwen2.5-VL 3B/7B), offline
  AndroidControl-High/AITW/GUI Odyssey plus two online benchmarks; baselines
  are other open GUI agents, not a matched-compute SFT control with equal
  token budget, so part of the gain may be extra training rather than the
  verification structure. Robustness benchmark is self-constructed with
  synthetic failure injection matching the training assumption.
confidence: medium
