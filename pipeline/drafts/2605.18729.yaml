capability: harness-self-improvement
statement: For a frozen-backbone embodied navigation agent that induces
  natural-language heuristics from its own success and failure trajectories,
  heuristics induced on one set of scenes transfer to disjoint unseen scenes
  better than hand-written heuristics (IGNav 48.61% vs 38.89% SR over a 34.72%
  no-heuristic baseline), but continuing to rewrite them online on the limited
  unseen episodes scores below leaving the transferred set fixed.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-72B planner with a video world model on Habitat
  image-goal navigation, active recognition and embodied QA; seen/unseen split
  of the same evaluation set; one unseen-split update regime.
technique: ""
proposed_technique: Induce transferable navigation heuristics from own trajectories
technique_summary: After each episode, a VLM extracts recurring success and
  failure patterns from the stored trajectory graph into typed heuristics
  (pattern, problem, strategy, confidence), merges them by pattern cluster
  into a shared library, and re-injects high-confidence entries into later
  reflection and planning.
technique_kind: process
technique_validated_by: Success rate, SPL and mean trajectory length on IGNav,
  AR and AEQA against a no-heuristic Basic Pipeline, hand-written heuristics,
  and transferred-plus-online-update variants, on a held-out unseen scene
  split.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On a comparable unseen split with matched inference budget,
  hand-written heuristics match or beat induced ones, or continued online
  updating of transferred heuristics beats the fixed transferred set.
evidence_note: Measured on one benchmark suite with one backbone; the
  unseen-split table reports single runs per cell with no variance or seed
  reporting, and the gains over the Basic Pipeline on AR and AEQA are small
  relative to the IGNav gain. The round-wise figure is described by the
  authors as a case study.
