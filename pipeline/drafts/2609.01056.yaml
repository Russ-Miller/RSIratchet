capability: long-horizon-execution
statement: "In file-based sandbox agent tasks with distractor artefacts,
  scoring only whether the task goal is met overstates reliability, because
  agents frequently complete the target while modifying unrelated files:
  across nine LLM agents, pass rate exceeds a success-plus-preservation metric
  by roughly 10-17 points, with the gap widening as model capability falls."
kind: observation
backing_strength: single-paper
scope_condition: 1,600 persona-grounded file workflows (spreadsheets,
  documents, PDFs, messaging, calendar, shell) in seven languages, each
  testbed seeded with 20 distractor files; one run per model, final-state
  evaluation.
technique: ""
proposed_technique: Require non-target files be byte-identical, not just task goal met
technique_summary: Score a task as successful only when all task-specific
  final-state evaluators pass and every pre-existing non-target file is
  unchanged between initial and final sandbox state.
technique_kind: process
technique_validated_by: Applied to nine agents; the combined metric (CTS)
  separated models differently from pass rate, with best model 49.2% CTS vs
  59.3% pass, and collateral edits appearing as a substantial failure category
  for all agents.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication on comparable file-based agent tasks where pass rate
  and preservation-constrained success are near-identical, i.e. agents almost
  never alter non-target files, or where the gap shrinks rather than grows for
  weaker models.
evidence_note: Measured on one benchmark the authors built, nine models,
  single run each, deterministic plus LLM-judge evaluators. Preservation is
  checked by byte-identity, so benign reformatting counts as failure; the
  design does not separate harmful collateral edits from harmless ones.
  Language gradient and failure-mode shares are from the same single runs.
confidence: medium
