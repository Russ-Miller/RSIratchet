arxiv_id: "2602.11824"
title: "Revis: Sparse Latent Steering to Mitigate Object Hallucination in
  Large Vision-Language Models"
url: https://doi.org/10.48550/arxiv.2602.11824
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 7-8B to 32B vision-language models, a latent steering vector
  built as the difference between image-present and image-absent hidden states
  is entangled with the model's ungrounded-guessing direction, so amplifying
  it past moderate strength drives degeneration (repetition, empty output);
  projecting it orthogonal to that prior direction and injecting it at a
  single calibrated deep layer only when a cosine risk score crosses a
  threshold lowers object-hallucination rates while leaving general reasoning
  scores at or above the untouched model.
kind: mechanism
backing_strength: single-paper
scope_condition: Training-free inference-time intervention on LLaVA-1.5/NeXT,
  Qwen2.5-VL 7B/32B, Qwen3-VL, InternVL3/3.5; vectors estimated from ~100
  paired captions plus ~100 calibration images; not tested above 32B.
technique: ""
proposed_technique: Steer along the visual vector orthogonalized against the guessing prior
technique_summary: Extracts a visual-information direction by subtracting
  blind-state from image-conditioned hidden states, Gram-Schmidt-projects it
  off the no-image hallucination-minus-refusal direction, and adds it at one
  calibration-selected layer only when the token's cosine risk score exceeds a
  factual-percentile threshold.
technique_kind: decoding
technique_validated_by: "POPE accuracy/recall/F1 and CHAIR_S/CHAIR_I against
  greedy decoding, VCD, M3ID, ONLY, AGLA and VTI; utility checked on MME,
  MM-Vet, MMMU-Pro. On Qwen2.5-VL CHAIR_S 31.00 to 25.00 with MM-Vet 70.18 to
  72.16, where VTI reached 9.00 CHAIR_S but dropped MM-Vet to 56.38.
  Ablations: removing the threshold caused collapse on LLaVA-1.5 and raised
  CHAIR_S on LLaVA-NeXT; shallow-layer injection was both less effective and
  harmful to MM-Vet. Latency 0.025s per token, equal to plain decoding."
stance_on_existing: supports
related_claim_id: 7b-vision-language-models-llava-1-5-7b-qwen-vl-chat-inference-time-hidden-state-steering
stance_reason: Removing the risk gate caused model collapse on LLaVA-1.5 and
  worse CHAIR on LLaVA-NeXT, matching the claim that hidden-state steering
  must be gated on a grounding signal.
falsifier: Show that the raw (non-orthogonalized) difference vector steered at
  the same layer with the same gate reaches equal hallucination reduction
  without degeneration, or that orthogonalization gives no advantage once
  intensity is tuned per model.
evidence_note: Measured on five benchmarks and seven models, with a
  sensitivity sweep over steering intensity and ablations isolating
  orthogonalization, layer choice and the threshold. CHAIR gains are modest in
  absolute terms (31 to 25 on Qwen2.5-VL) and CHAIR_I barely moves; the paper
  does not report object coverage or caption length, so it cannot rule out
  that some reduction comes from mentioning less. Only one author group, no
  independent replication.
confidence: medium
