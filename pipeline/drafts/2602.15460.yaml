arxiv_id: "2602.15460"
title: On the Out-of-Distribution Generalization of Reasoning in Multimodal
  LLMs for Simple Visual Planning Tasks
url: https://doi.org/10.48550/arxiv.2602.15460
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: "When a 7B multimodal model is fine-tuned on grid-navigation
  planning, chain-of-thought format decides whether anything survives a
  distribution shift: traces that interleave a natural-language step
  justification with a re-drawn compact ASCII grid of the post-move map keep
  non-trivial success on maps larger and with longer start-goal distance than
  training (41% average on out-of-distribution maps with start-goal distance
  >= 6, 20% on 10x10), while no-CoT and narration-only CoT fall to near 0% at
  the first shift."
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B-Instruct supervised fine-tuned on 1,000
  FrozenLake maps up to 6x6 with start-goal distance <= 5; out-of-distribution
  means larger maps, larger start-goal distance, or longer optimal path.
technique: ""
proposed_technique: Interleave a move rationale with a redrawn compact grid in CoT
technique_summary: Train reasoning traces that, at each step, first state in
  natural language which move to take and then re-emit the whole map in a
  compact ASCII grid with the player moved.
technique_kind: training
technique_validated_by: Move-sequence validity simulated in the environment
  (no hole entered, ends on treasure), against same-model no-CoT,
  description-only, grid-only and table-only CoT variants, plus image-input
  and Mirage latent-reasoning baselines, on in-distribution 3x3-6x6 maps and
  out-of-distribution 7x7-10x10 maps with and without controlled start-goal
  distance.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model fine-tuned with the combined grid-plus-description traces
  scores no better than narration-only or no-CoT traces on maps whose size and
  start-goal distance both exceed the training range, under matched data and
  training budget.
evidence_note: Measured on one base model and one task family, with three
  separately controlled shift axes (map size, start-goal distance at fixed
  10x10 size, optimal solution length) and 200 test maps per cell. The design
  isolates the CoT format while holding training maps fixed, but does not
  isolate why the grid component helps, and absolute out-of-distribution
  accuracy is still low. Single model, so the ranking across formats may not
  transfer.
confidence: medium
