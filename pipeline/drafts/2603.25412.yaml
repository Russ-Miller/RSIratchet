arxiv_id: "2603.25412"
title: "Beyond Content Safety: Real-Time Monitoring for Reasoning
  Vulnerabilities in Large Language Models"
url: https://doi.org/10.48550/arxiv.2603.25412
drafted_at: 2026-11-07
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-step-reasoning
statement: For zero-shot LLM monitors that inspect a chain of thought step by
  step, embedding an explicit taxonomy of reasoning-error subtypes in the
  prompt is what lets the monitor localize structural, meta-cognitive failures
  (reasoning loops, goal deviation, premature conclusion), which the same
  backbone with an untyped prompt largely misses.
kind: mechanism
backing_strength: single-paper
scope_condition: Measured on a 450-chain static benchmark of math/QA reasoning
  chains with human-annotated first-error positions, across four monitor
  backends; error-type detectability varies, with missing-constraint errors
  still poorly localized.
technique: ""
proposed_technique: Monitor each reasoning step against an explicit error taxonomy
technique_summary: An external LLM runs in parallel with the target model,
  inspecting each newly emitted reasoning step against a nine-subtype error
  taxonomy embedded in its prompt and interrupting generation when a step is
  flagged unsafe.
technique_kind: process
technique_validated_by: Position accuracy of the first erroneous step on 450
  annotated chains (87.11% best backend vs 68% for Qwen2.5-Math-PRM-7B and
  36.22% for an LLM-as-critic hallucination detector), 1.04% false-positive
  rate on 193 clean chains, plus attack-success and token-amplification
  reductions under four live attacks.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A monitor using the same backbone and prompt scaffold but no
  taxonomy matching or exceeding taxonomy-embedded localization accuracy on
  process-management error subtypes.
evidence_note: "Measured: ablation holds backend and prompt structure fixed
  and removes only the taxonomy plus subtype-classification requirement; on
  Gemini-3-Flash reasoning-loop localization rises 2% to 94% and goal
  deviation 30% to 98%, overall 63.11% to 87.11%. Single paper, authors' own
  benchmark and annotations; ground-truth first-error labels come from their
  own annotation protocol with majority-vote resolution and no reported
  inter-annotator agreement."
confidence: medium
