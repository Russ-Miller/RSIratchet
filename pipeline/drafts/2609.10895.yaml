statement: "When a multimodal LLM acts as the decision core of a simulated
  humanoid reacting to sudden household hazards, picking the correct reaction
  primitive does not mean the reaction is executable: even on correctly
  classified scenes, hands land a median 0.48 m from the true impact point,
  89% of misses fall short, and in 49% of those decisions the body never steps
  forward and stands beyond arm's reach."
kind: observation
backing_strength: single-paper
scope_condition: Seven zero-shot MLLMs, one frozen ~0.6 s multi-view
  observation, open-loop committed plan (walking command plus hand keyframes)
  executed by a pre-trained whole-body controller in rigid-body simulation;
  306 scenes across 17 event families.
