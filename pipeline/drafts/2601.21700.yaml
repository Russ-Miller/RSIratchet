stance_reason: ""
falsifier: A matched comparison where the single-judge variant given identical
  retrieved profiles and ontology triples equals or beats the multi-persona
  pipeline on average across the same backbones and benchmarks.
evidence_note: Measured, single paper, same authors' framework. Main table
  shows OG-MAR best average on all four backbones, but the isolating ablation
  (Table 2) shows the multi-persona layer contributes only part of the gain;
  the shared retrieval/summarization pipeline carries much of it. Per-dataset
  results invert on GSS. No independent replication.
