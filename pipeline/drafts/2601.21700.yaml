statement: On regional social-survey value-prediction benchmarks across four
  LLM backbones, instantiating one agent per retrieved demographically-similar
  respondent profile and having a judgment agent adjudicate their answers
  raises accuracy over a single judge given the same retrieved profiles and
  ontology context, with gains largest for weaker open backbones (+0.04 to
  +0.07) and near zero for the strongest (+0.002).
kind: observation
backing_strength: single-paper
scope_condition: Six regional surveys (EVS, GSS, CGSS, ISD, Afrobarometer,
  LAPOP), WVS as retrieval corpus, K=5 retrieved personas; the single-judge
  variant was better on the US (GSS) dataset for all four models.
technique: ""
proposed_technique: Simulate one agent per retrieved survey respondent, then adjudicate
technique_summary: Retrieve ontology-consistent value relations and
  demographically similar survey respondents, instantiate a persona agent per
  respondent conditioned on that respondent's value summary, and have a
  judgment agent pick the answer by evidence grounding and ontology
  consistency before consulting votes.
technique_kind: prompting
technique_validated_by: Binary accuracy on 2,000 sampled items across six
  regional surveys with four backbones, against zero-shot, role prompting,
  self-consistency, multi-agent debate, and ValuesRAG; plus ablations against
  a single-judge variant and a single value-inference-agent variant, and a K
  sweep over 1/3/5/10.
stance_on_existing: neither
