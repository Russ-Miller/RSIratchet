statement: When a hallucination metric is an unsupported-claim rate computed
  over whatever claims a model happens to make, models that avoid committing
  to verifiable claims or directional outputs score best, so the ranking
  partly measures abstention rather than grounding — on financial
  chart-to-recommendation tasks the lowest unsupported-claim model made
  directional recommendations on only 6.4% of queries and ranked near the
  bottom once coverage was factored in.
kind: mechanism
backing_strength: single-paper
scope_condition: Claim-level hallucination rates on open-ended generation
  where the model may hedge, abstain, or emit no checkable claims; shown on
  969 financial chart-reasoning queries across 20 vision-language models.
technique: ""
proposed_technique: Coverage-weighted grounding score
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Show that on such tasks unsupported-claim rate ranks models the
  same way as a coverage-weighted measure, i.e. low-hallucination models are
  not systematically the ones that abstain or emit fewer checkable claims.
evidence_note: Measured on one benchmark (323 HS300 stocks, three input
  modalities, ten deterministic OHLCV-derived evidence anchors) over 20
  models; rank reversal is demonstrated by one clear pair (Gemma-4-E2B-It
  lowest UCR 39.9% but 6.4% coverage and NDR 5.1%, vs Qwen2.5-VL-3B NDR 32.1%
  at 82.5% coverage). Oracle-aided verification lowering claims while
  collapsing coverage is reported but only in aggregate. Claim extraction uses
  pattern-based detectors, so 'no verifiable claim extracted' may partly be a
  detector limit rather than genuine abstention; scorer validated against
  practitioner annotations.
