statement: "For ReAct-style agentic RAG on 2-4 hop retrieval questions,
  failures are marked by a mismatch between the number of reasoning steps
  taken and the task's hop count: correct answers use step counts close to the
  hop number while incorrect ones both terminate early and over-extend, so
  longer reasoning is not what separates success from failure."
kind: observation
backing_strength: single-paper
scope_condition: 13 closed- and open-source models under one unified ReAct
  harness on a 1,305-item Wikipedia-derived benchmark with 3- and 4-hop
  subsets; no intervention tested
