falsifier: A study where incorrect trajectories' step counts cluster as
  tightly around the hop number as correct ones, or where accuracy rises
  monotonically with step count beyond the hop number.
evidence_note: "Measured: average steps on correct vs incorrect responses per
  model on 3- and 4-hop subsets, plus EM/F1/LLM-judge accuracy. Step counts on
  failures exceed those on successes for most models and are described as more
  variable in both directions. The design is observational — no manipulation
  of step budget — so it does not establish that mis-allocated steps cause the
  errors rather than reflecting them; the error case study argues the cause is
  bad initial decomposition."
