statement: When VLMs must operate unfamiliar household devices with no manual,
  through multi-turn interaction over rendered multi-view images with
  click/rotate actions at pixel coordinates, the limiting failure is
  fine-grained localization of the interactive component within the correct
  view rather than navigating to that view, and almost no task is completed in
  the optimal number of steps.
kind: observation
backing_strength: single-paper
scope_condition: Documentation-free device operation on 968 rendered 3D
  household devices with annotated component bounding boxes, discrete atomic
  actions and fixed viewpoint switching; six VLMs, ReAct scaffold, capped
  interaction budget.
