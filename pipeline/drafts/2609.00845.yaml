falsifier: A benchmark of the same kind where model coordinate error on target
  components is near human level while view-switching success lags, or where
  perfect-step sub-task rates approach overall sub-task success rates, would
  show localization is not the bottleneck.
evidence_note: "Measured on VGEBench: success rates 1.48-54.27% across six
  VLMs; perfect-step sub-task rate 12.94% vs 62.86% sub-task success for the
  best model; GPT-5-mini's successful-navigation rate was 12.5% below
  Gemini-3-Flash while its average coordinate distance to the nearest target
  box was 63.9% worse (77.3% worse weighted for repeated failures). Human
  baseline on 149 episodes reached 74.50% SR vs 56.38%. Renders, not real
  scenes; bottleneck attribution rests on comparing two differently-scaled
  metrics, not a controlled ablation."
