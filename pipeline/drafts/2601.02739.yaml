arxiv_id: "2601.02739"
title: Mitigating Prompt-Induced Hallucinations in Large Language Models via
  Structured Reasoning
url: https://doi.org/10.48550/arxiv.2601.02739
drafted_at: 2026-11-16
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: On knowledge-graph QA and math word-problem benchmarks (WebQSP,
  CWQ, GSM8K, MWP, Dr. SPIDER), adding a code module that guides
  knowledge-graph exploration and is inserted into the chain-of-thought prompt
  raises HIT@1/3/5 over the same chain-style prompting without it.
kind: observation
backing_strength: single-paper
scope_condition: GPT-4 and LLaMA 3.3 as base models; tasks where a structured
  knowledge source and task-appropriate code representations exist; HIT@K as
  the metric.
technique: ""
proposed_technique: Put code that walks the knowledge graph into the CoT prompt
technique_summary: Decompose the prompt into sub-tasks, have a code module
  systematically explore a knowledge graph, and include that code as an
  external-knowledge component of the chain-of-thought prompt constraining
  intermediate steps.
technique_kind: prompting
technique_validated_by: HIT@1/3/5 on five public datasets against the same
  knowledge-distillation chain model without the code module, plus comparisons
  to KG-LLM-PR, LLM-SubKG-Sum, RAG and Self-Check; no hallucination-specific
  metric, no human verification, no statistical testing.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An independent replication with matched prompts and identical base
  models finds no HIT@K gain from inserting the code module, or finds that the
  gain disappears once the comparison controls for extra retrieved knowledge
  rather than the code form.
evidence_note: "Weakly evidenced. Reported gains are implausibly large (HIT@1
  82->99 on WebQSP) and the reporting is internally inconsistent: Dr. SPIDER
  is 94.10 HIT@1 in Table 1 and 98.12 in Table 2. The method, baselines and
  ablations are described only in prose, no per-model breakdown is given
  despite two base models being named, and HIT@K is used as a hallucination
  proxy without any direct measure of unsupported content. Hardware described
  is a laptop CPU/MX250, which does not fit the stated LLaMA 3.3 evaluation."
confidence: low
