arxiv_id: "2609.09895"
title: Can We Trust Video Hallucination Detectors? VidHalLoc for Evaluating
  the Evaluators
url: https://doi.org/10.48550/arxiv.2609.09895
drafted_at: 2026-09-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: On adversarial video hallucination pairs scored only when a method
  both accepts the factual statement and rejects the counterfactual one,
  purpose-built video hallucination detectors (embedding-similarity,
  learned-entailment, atomic-fact and attention-based) top out around 34.63%
  overall accuracy, well below a general frontier video-language model
  prompted to judge the same items (about 83.63%).
kind: observation
backing_strength: single-paper
scope_condition: 2,000 adversarial samples over 1,090 real-world videos, eight
  hallucination categories across video QA and captioning, fifteen methods
  evaluated under one protocol; overall accuracy requires joint correctness on
  the factual and counterfactual variant.
technique: ""
proposed_technique: Score detectors on paired factual/counterfactual decisions
technique_summary: Evaluate a hallucination detector by requiring it to accept
  the factual answer and reject the minimally edited counterfactual for the
  same video, reporting the joint success rate rather than one-sided accuracy.
technique_kind: process
technique_validated_by: Applied to fifteen detection methods on 2,000 paired
  samples; separates factual, counterfactual and joint accuracy, showing
  dedicated detectors peak at 34.63% overall. No comparison against an
  independent human-detector reference for the protocol itself.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A dedicated video hallucination detector scoring near or above
  general-purpose VLM judges on joint factual/counterfactual accuracy on this
  or an equivalent paired benchmark.
evidence_note: Measured on a benchmark the authors built with an LLM
  multi-agent pipeline; category labels audited at 98.75% sample accuracy on a
  subset. The result table is truncated in the source, so only the headline
  peak figures (34.63% dedicated, 83.63% Gemini-3-Flash) are available.
  Adversarial construction may be biased toward items the construction models
  find hard, which is not isolated.
confidence: medium
