arxiv_id: "2605.30712"
title: "ExpHarness: Model-Agnostic Experience Learning through a Trainable Harness"
url: https://doi.org/10.48550/arxiv.2605.30712
drafted_at: 2026-10-31
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: For frozen LLM executors, distilling past trajectories into skills
  and failure lessons in a linked experience store and training a small
  retrieval controller on a reward that compares scores with and without the
  retrieved experience raises task scores over memory baselines that rank
  experiences by semantic similarity alone, with larger relative gains for the
  weaker executor and for multi-step agentic environments than for single-turn
  static tasks.
kind: mechanism
backing_strength: single-paper
scope_condition: Executor weights frozen; 10 static benchmarks (QA, math,
  code) with Llama-3.2-3B/3.1-8B and two agentic environments (ALFWorld,
  AppWorld) with Qwen3-32B and Gemini-3.1-Flash-Lite; memory baselines given
  the same historical trajectories.
technique: ""
proposed_technique: Train a retrieval controller on with/without-experience score gaps
technique_summary: Past trajectories are summarized into skill and lesson
  nodes linked by embedding similarity, and a lightweight PPO-trained copilot
  picks per-task how far to diffuse over that graph and how much to weight
  historical utility against semantic similarity, with the same reward also
  updating node utility estimates.
technique_kind: process
technique_validated_by: "Weighted average scores against No-Memory, six
  retrieval-centric memory baselines and three LLM-centric retrieval
  baselines: +12.1% and +4.5% relative over the strongest static baseline
  (MemRL) for the small and large executors, +21.4% and +12.7% over S3 on
  agentic tasks, with 12.7-21.6% fewer environment steps than the lowest-step
  baseline; four ablations (similarity filtering, flat pool, no diffusion, no
  utility ranking) all score below the full method."
stance_on_existing: supports
related_claim_id: distilling-lessons-from-failures-as-well-as-successes-beats-raw-trajectory-memory
stance_reason: ExpHarness likewise distills both successes and failures into
  reusable units and beats memories retrieved by surface similarity, with the
  executor unchanged.
falsifier: A matched-compute comparison in which ranking experiences purely by
  semantic similarity, given the same distilled skill/lesson units and the
  same retrieval budget, matches the utility-trained copilot's scores across
  these benchmarks; or the reported advantage disappearing for weaker
  executors or agentic settings.
evidence_note: Measured on 12 benchmarks against 10 baselines with two
  executors per setting, plus transfer and four ablations. Ablations do not
  isolate the copilot training, the reward terms, or the node-utility update
  rule; the Flat Experience ablation changes both candidate generation and
  ranking. The small-vs-large and static-vs-agentic comparisons use different
  model families and benchmarks, so scale and task horizon are confounded.
  Step counts exclude retrieval and inference cost, and no matched-compute
  baseline is reported.
confidence: medium
