falsifier: Training in the feedback-enriched environments yields no better or
  worse success on the standard environments than standard-environment RL at
  matched steps, or a fixed schedule (guidance throughout, or enrichment
  throughout) matches the early-guidance/late-enrichment switch.
evidence_note: Measured on two benchmarks with three RL algorithms and two
  model sizes; gains are small (0.69 to 4.61 points average) and non-uniform,
  with several per-split drops. Schedule boundaries (steps 1-3 vs 6-10, switch
  at step 100) were hand-set and their sensitivity untested. Authors report
  the method fails outright on AppWorld.
