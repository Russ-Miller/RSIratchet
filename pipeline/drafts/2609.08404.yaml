capability: long-horizon-execution
statement: When training 4B-8B Qwen3 agents with group-based RL (GRPO, DAPO,
  GSPO) on sparse-reward long-horizon tasks, injecting hints into the
  environment's feedback — procedural action guidance in early episode steps
  and early training, switching to enriched state observations in later steps
  and later training — raises success on the unmodified environments by a few
  points on average, while lowering performance on tasks that require
  questioning whether the request is answerable at all.
kind: observation
backing_strength: single-paper
scope_condition: SciWorld and BFCL-v3 multi-turn, Qwen3-4B/8B, 200 RL steps,
  0.5 enrichment probability, feedback held consistent within a rollout group;
  on AppWorld the method failed to escape zero-reward trajectories.
technique: ""
proposed_technique: Action guidance early, observation enrichment late
technique_summary: "Modify the training environment's feedback rather than the
  agent: give explicit next-action hints in the first steps of an episode and
  the first half of training, then switch to richer state information in later
  steps and later training, keeping the injected feedback identical across a
  sampling group."
technique_kind: training
technique_validated_by: Success rate on unenriched standard environments,
  compared against training in standard environments, across 2 model scales x
  3 RL algorithms x 2 benchmarks; average absolute gain 2.82 points, with a
  hybrid schedule beating all four single strategies in the pilot study;
  regressions of 3-7 points on BFCL Miss Param / Miss Func splits.
stance_on_existing: neither
