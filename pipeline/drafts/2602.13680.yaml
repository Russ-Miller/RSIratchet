arxiv_id: "2602.13680"
title: "AllMem: A Memory-centric Recipe for Efficient Long-context Modeling"
url: https://doi.org/10.48550/arxiv.2602.13680
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For small pretrained Qwen3 models (0.6B-1.7B) converted by
  distillation into a sliding-window-attention layer augmented with a
  nonlinear test-time-trained memory module, long-context accuracy stays
  within about a point of full attention on 37k-token LongBench with a 4k
  window and exceeds full attention on 128k-token InfiniteBench and LV-Eval
  with an 8k window, at roughly one ninth the FLOPs and a constant-size cache.
kind: observation
backing_strength: single-paper
scope_condition: 0.6B and 1.7B Qwen3 backbones converted by response-only
  knowledge distillation on 3-5M tokens, evaluated on LongBench, InfiniteBench
  and LV-Eval; absolute scores on the 128k benchmarks are very low for all
  arms (under 13 points), so the comparison is between weak baselines.
technique: ""
proposed_technique: Add a test-time-trained nonlinear memory beside sliding-window attention
technique_summary: Replaces full attention in a pretrained LLM with a parallel
  pair of sliding-window attention and a nonlinear memory network whose
  weights are updated online by gradient descent on a reconstruction loss,
  fused by a learned per-channel gate and trained by distillation from the
  original model with the window and chunk sizes randomized.
technique_kind: architecture
technique_validated_by: Accuracy against the unmodified Qwen3 teacher,
  sliding-window-plus-sink attention, and a Mamba-2 memory variant at matched
  parameters on LongBench (6 subtasks, avg 37k tokens), InfiniteBench and
  LV-Eval at 128k, plus short-sequence benchmarks (C-Eval, MMLU-Redux,
  MATH-500, LiveCodeBench) and measured FLOPs and cache size.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Converting a larger backbone, or evaluating on long-context
  benchmarks where absolute scores are high enough to discriminate, shows the
  converted model falling clearly below full attention; or an ablation shows
  the sliding window plus sinks alone matches the memory-augmented variant.
evidence_note: Measured on two model sizes against three baselines across
  three long-context suites plus ten short-sequence benchmarks, with FLOPs and
  cache measured analytically. The 128k results that favour the converted
  model sit in the 1-13 point range where full attention also performs near
  the floor, so 'outperforms full attention' rests on small absolute
  differences. No independent replication; only one model family; generation
  hyperparameters admittedly not tuned for the converted architecture.
confidence: low
