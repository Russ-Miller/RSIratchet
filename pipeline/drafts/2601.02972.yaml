arxiv_id: "2601.02972"
title: "Correct, Concise and Complete: Multi-stage Training For Adaptive Reasoning"
url: https://doi.org/10.48550/arxiv.2601.02972
drafted_at: 2026-11-16
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: cutting-to-the-chase
statement: For reasoning models of 1.7B-32B trained only on math problems, RL
  with a reward that penalizes the fraction of tokens generated after the
  trace's first correct answer, preceded by a short SFT warm-up on
  shortest-correct or summary-stripped traces, cuts average response length by
  22-41% at under 2.5 points accuracy loss, and the length saving grows with
  model size.
kind: observation
backing_strength: single-paper
scope_condition: Qwen3 1.7B/8B/32B and DeepSeek-R1-Qwen-7B-distill; training
  data is math only; evaluation on math, science QA, code, commonsense and
  long-context benchmarks; length reductions are much smaller (8-14%) on code
  and long-context tasks outside the training domain.
technique: ""
proposed_technique: Penalize only the tokens after the first correct answer
technique_summary: SFT on shortest-correct or summary-stripped reasoning
  traces, then GRPO with a reward that subtracts the proportion of tokens
  emitted after the first correct answer in the trace (no penalty when no
  correct answer is produced, so self-correction stays free).
technique_kind: training
technique_validated_by: Average accuracy, mean token count and area under the
  Overthinking-Adjusted Accuracy curve across seven benchmarks, against the
  base model, no-thinking, shortest-correct SFT, and four RL length-penalty
  baselines (hard, soft, normalized, TWYN); best method scores 76.6 AUC_OAA vs
  71.6 base and 74.0 second-best, with per-stage ablations.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Replicating the same SFT plus post-first-correct-answer penalty on
  another reasoning model family and finding either no length reduction over
  the base model, or an accuracy drop larger than a fixed-budget truncation
  baseline at matched token count.
evidence_note: "Measured on seven benchmarks with N=10-64 samples per
  question, with component ablations separating SFT and RL contributions and a
  four-model size sweep. Weaknesses: training is math-only so cross-domain
  gains are small; AUC_OAA falls below base for the 1.7B model and the
  distilled 7B model, so the trade-off claim does not hold uniformly across
  scales; single training corpus and one lambda value."
confidence: medium
