arxiv_id: "2608.27026"
title: Direct or Mediated? Task-Dependent Audio Information Routing in Large
  Audio Language Models
url: https://doi.org/10.48550/arxiv.2608.27026
drafted_at: 2026-10-20
drafted_from: full-text
model: claude-opus-5
