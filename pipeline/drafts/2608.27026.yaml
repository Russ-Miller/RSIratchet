falsifier: A model that holds concatenated-input AQA accuracy at its
  single-segment level, or one whose ASR degrades as much as its AQA under the
  same concatenation.
evidence_note: "Measured: WER rose 0.10-1.30 points (staying under 4.5%)
  across four models, while concatenated AQA fell to 35.33-67.33% for three
  models against single-segment controls of 85.17-98.00%; Qwen3-Omni degraded
  least (82.67-88.67%). Single-segment controls isolate basic recognition from
  multi-segment processing. Attention knockout and probing were run on
  separate standard benchmarks, not on the failing concatenated cases, so the
  mechanism is not pinned to the failure."
confidence: medium
