capability: audio-understanding
statement: When two audio clips are concatenated at the waveform level into
  one input, current large audio language models keep transcribing both
  segments nearly as well as single clips while their accuracy on content,
  order and location questions about the same two segments drops far below
  their single-clip attribute-recognition accuracy.
kind: observation
backing_strength: single-paper
scope_condition: Four LALMs (Audio-Flamingo-Next, MiMo-Audio, Step-Audio-R1,
  Qwen3-Omni); two-segment waveform concatenation with no silence or boundary
  marker; ASR on LibriSpeech test-clean, AQA built from SpeechCommands, GTZAN,
  ESC-50.
