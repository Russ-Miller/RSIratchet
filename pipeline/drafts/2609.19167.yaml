arxiv_id: "2609.19167"
title: "To Memories and Beyond: From Remembering to Knowing You across
  Long-Term Multimodal Personal Archives"
url: https://doi.org/10.48550/arxiv.2609.19167
drafted_at: 2026-09-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-term-memory
statement: "On multi-year authentic personal photo/video archives turned into
  memory streams, frontier multimodal models and structured memory systems
  recall facts and infer persona far better than they predict a user's future
  choices: predicting or recommending in novel contexts caps around 59 on a
  0-100 scale for every system tested, and compressing the history ~70x into a
  memory system costs nothing on that tier while costing a lot on factual
  recall, so predictive personalization is limited by preference
  representation rather than by retrieval or context length."
kind: observation
backing_strength: single-paper
scope_condition: "ReaLMem: 2,508 sessions from 7 participants over 6+ years,
  1,629 QA pairs; readers Gemini-3.0-Flash, GPT-4.1-mini, GPT-5.4-mini; memory
  systems Mem0, MemOS, EverMemOS on a shared GPT-4.1-mini backbone; media
  pre-captioned to text"
technique: ""
proposed_technique: Weight profile attributes by temporal stability
technique_summary: Distil a structured user profile incrementally from
  history, score each attribute by support, duration and recency combined with
  entropy weighting, and inject the score as a salience prior in the prompt.
technique_kind: prompting
technique_validated_by: "Swapped into EverMemOS's pipeline with retrieval and
  backbone fixed: beat full context on persona inference for all three readers
  (+0.6/+4.0/+4.3) and matched or beat it on prediction (0.0/+3.5/+1.8) at ~6k
  tokens vs ~123k; ablating the stability weighting lowered persona inference
  for all readers but raised open-ended assistance by about 2.4 points"
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A system that raises predictive-personalization scores well above
  the ~59 band by adding retrieval depth or full raw context, or evidence that
  memory compression degrades the predictive tier as much as it degrades
  factual recall.
evidence_note: Measured on one benchmark with 7 participants; tiers scored by
  different metrics (LLM judge for recall, coverage/accuracy for persona,
  Kendall tau for prediction), so cross-tier score comparisons are not on a
  common scale. Oracle gold-evidence contexts raised factual recall to ~85.5
  for all readers, isolating retrieval as the recall bottleneck; no such
  oracle exists for the predictive tier.
confidence: medium
