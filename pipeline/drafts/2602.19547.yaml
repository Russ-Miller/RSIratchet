arxiv_id: "2602.19547"
title: "CIBER: A Comprehensive Benchmark for Security Evaluation of Code
  Interpreter Agents"
url: https://doi.org/10.48550/arxiv.2602.19547
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: prompt-injection
statement: For LLM code interpreter agents with real code execution, attacks
  delivered through trusted internal channels — fabricated conversation
  history and manipulated tool outputs — succeed more often than the same
  malicious payload injected directly into the user prompt (average attack
  success 73.3% and 71.8% vs 59.4% across six models and two interpreter
  architectures).
kind: observation
backing_strength: single-paper
scope_condition: Two code-interpreter architectures (OpenInterpreter,
  OpenCodeInterpreter) with six backbone models, 25 RedCode security
  scenarios, judged by physical sandbox state change rather than textual
  refusal; grey-box adversary able to write to memory, tool outputs or system
  prompt.
technique: ""
proposed_technique: Verify malicious intent of tool outputs and history, not just user input
technique_summary: Treat agent conversation history and tool-returned data as
  untrusted — tainting tool output so it cannot become executable code without
  sanitization, and signing each conversation turn so fabricated history fails
  validation.
technique_kind: process
technique_validated_by: Not measured; proposed in the paper's defense section without experiment.
stance_on_existing: supports
related_claim_id: long-trusted-instructions-untrusted-retrieved-content-occupy-same-model
stance_reason: Measures that injection through retrieved/tool content and
  context remains highly effective even against an architecture with AST
  filters and sandboxing, consistent with the claim that marking or filtering
  untrusted text does not remove the risk.
falsifier: A comparable benchmark with state-level verification where direct
  prompt injection into the user turn succeeds at least as often as
  memory-poisoning and tool-output injection across several architectures and
  models.
evidence_note: "Measured: 57,000 generated attack instances across 4 attack
  methods, 3 input modalities, 6 models, 2 interpreters, scored by
  Docker-container forensic probes (file checksums, config diffs, process
  tree) plus intent analysis. Averages across 25 scenarios, 750 tests per
  cell. The direct-vs-contextual gap holds under a matched-model control
  (GPT-3.5 on both architectures) for memory poisoning, but the
  indirect-injection ordering inverts between architectures (OCI 76.5% vs OI
  65.5%), and the authors attribute part of it to OCI's code-replacement
  injection bypassing the model entirely — so the channel comparison is partly
  confounded by how each injection is implemented."
confidence: medium
