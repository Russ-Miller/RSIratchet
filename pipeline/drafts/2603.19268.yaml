evidence_note: Measured on one self-built benchmark constructed from
  literature overlapping the training corpus, so leakage and benchmark-format
  effects are not isolated; the anomalously low GPT-5 score (15.6%, below the
  27.18% general-model average) suggests the evaluation format penalizes some
  models, weakening the cross-model comparison. Stage ablations are
  sequential, not factorial.
