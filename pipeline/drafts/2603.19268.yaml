statement: For an 8B open base model on expert-curated combustion-science
  reasoning questions, staged domain adaptation (continued pre-training on a
  mixed domain/general corpus, then general and domain SFT, then
  verifiable-reward RL) scores higher than retrieval-augmented generation over
  much larger general-purpose models given the same domain literature, with
  the RL stage contributing the largest single jump.
kind: observation
backing_strength: single-paper
scope_condition: Single 436-question multiple-choice benchmark built from the
  same literature the training corpus was drawn from; one base model
  (Qwen3-8B); RAG baselines use FAISS + BGE-M3 retrieval, not tuned.
