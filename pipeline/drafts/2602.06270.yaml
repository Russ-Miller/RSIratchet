arxiv_id: "2602.06270"
title: "VowelPrompt: Hearing Speech Emotions from Text via Vowel-level
  Prosodic Augmentation"
url: https://doi.org/10.48550/arxiv.2602.06270
drafted_at: 2026-11-12
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: For text-only LLMs doing speech emotion recognition from
  transcripts, appending per-vowel prosodic descriptors (pitch level and
  slope, pitch and intensity variation, duration, speaker- and vowel-type
  normalized then quantile-binned into words) raises accuracy over both
  transcript-only prompting and utterance-level prosody descriptions, in
  zero-shot and after fine-tuning.
kind: observation
backing_strength: single-paper
scope_condition: Text-only LLMs (GPT-4o, LLaMA-3-8B-Instruct, LLaMA-4-Scout,
  Qwen2-7B) on acted/TV emotion corpora in English, French, German and a
  mixed-lingual set; requires forced alignment of the transcript to the audio
  to get vowel boundaries.
technique: ""
proposed_technique: Describe prosody per vowel, not per utterance
technique_summary: Force-align the transcript, extract pitch, intensity and
  duration descriptors per vowel segment, normalize by speaker and vowel type,
  bin into ordinal words, and append those natural-language descriptors to the
  transcript given to a text-only LLM.
technique_kind: prompting
technique_validated_by: Unweighted accuracy and weighted F1 on IEMOCAP, MELD,
  CaFE, EmoDB, ASVP-ESD against a transcript-only prompt and SpeechCueLLM
  (utterance-level prosody text); zero-shot gains up to 7.8 UACC over
  transcript-only on IEMOCAP with GPT-4o, and 1.5-2.7 weighted F1 over
  SpeechCueLLM after SFT/GRPO.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison in which utterance-level prosodic descriptions
  equal or beat vowel-level ones on the same datasets and backbones, or in
  which the vowel descriptors give no gain once lexical content is controlled
  (e.g. permuted or placebo descriptors score the same).
evidence_note: Measured on five corpora, two to three backbones, under
  zero-shot, SFT, SFT+GRPO, cross-domain and multilingual conditions;
  baselines include a transcript-only prompt and an utterance-level prosody
  prompt. Margins over the utterance-level baseline are small in the
  fine-tuned setting (1-3 F1) and larger cross-domain (5-7). The paper lists
  placebo and permutation ablations in appendices not included in the given
  text, so the isolation of prosodic signal from formatting cues is asserted
  rather than visible here. Gains are confounded with the extra text length of
  the descriptors.
confidence: medium
