arxiv_id: "2602.07187"
title: "PreFlect: From Retrospective to Prospective Reflection in Large
  Language Model Agents"
url: https://doi.org/10.48550/arxiv.2602.07187
drafted_at: 2026-11-20
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: For tool-using LLM agents on long-horizon web tasks, criticizing
  and revising the plan before execution against a small set of distilled
  planning-error types, rather than only reflecting after a failure, raises
  task success over retrospective reflection baselines under matched tools and
  step budgets, with the largest gain on the hardest tasks.
kind: observation
backing_strength: single-paper
scope_condition: GAIA validation and a 100-item SimpleQA sample, GPT-4.1 and
  Gemini-2.5-pro backbones, Smolagents and OWL harnesses, 20-step budget;
  error types distilled offline from HotpotQA/MuSiQue trajectories and
  manually pruned.
technique: ""
proposed_technique: Critique the plan before executing it, against distilled error types
technique_summary: Before any action, a reflector checks the generated plan
  against three distilled planning-error types mined from past success/failure
  trajectory pairs and rewrites the plan, re-invoking the same check whenever
  execution stalls and triggers re-planning.
technique_kind: process
technique_validated_by: pass@1 on GAIA validation (46.06 to 58.18 with GPT-4.1
  on Smolagents; 50.30 to 60.61 on OWL) and SimpleQA
  correct/correct-given-attempted, against Reflexion and Self-Refine under
  identical tools and step budgets; ablations remove the distilled error set
  (-7.9 total) and dynamic re-planning (-6.7).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Under matched tools, budget and backbone, pre-execution plan
  critique against distilled error types fails to beat Reflexion/Self-Refine
  on GAIA-style tasks, or the gain disappears when the error-type list is
  replaced with a generic 'check your plan' instruction.
evidence_note: Measured on 165 GAIA validation tasks and 100 SimpleQA items,
  two backbones, two harnesses, with matched tools and step budgets and
  component ablations. Single paper, single team; the Level-3 subset is small
  (26 items) so the headline hardest-task gain rests on few items, and cost is
  ~18% above baseline.
confidence: medium
