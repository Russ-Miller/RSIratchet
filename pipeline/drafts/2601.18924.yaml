capability: procedure-following
statement: When a single prompt contains numbered question items whose
  explicit arrow instructions require non-sequential traversal (jump to item
  i+k) rather than sequential order, open-weight 4B-120B models lose most of
  their accuracy relative to the same content presented in linear order, with
  median accuracy near zero and no recovery from parameter scaling.
kind: observation
backing_strength: single-paper
scope_condition: Six open-weight models (Qwen3 4B/30B instruct and thinking,
  gpt-oss 20B/120B), factual Jeopardy-derived QA items, 10,000 linear and
  10,000 jumping prompts, 10-300 questions per prompt, output constrained to a
  comma-separated answer list.
