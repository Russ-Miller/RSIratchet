falsifier: A model family where jumping-prompt accuracy stays within a few
  points of linear-prompt accuracy on the same item sets, or evidence that the
  gap closes with scale within a family.
evidence_note: "Measured: baseline single-question accuracy 55.7-84.8%, linear
  17.8-55.1%, jumping 1.8-13.9% mean with medians 0.47-2.94. Content and
  output format held constant across conditions, so the design does isolate
  traversal order. Error analysis attributes 33-60% of wrong answers to
  answering a different prompt question. Limited to one task domain (factual
  recall) and one topology contrast; correctness judged by an LLM evaluator
  verified at 98% agreement on 100 items."
