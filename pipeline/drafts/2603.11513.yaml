arxiv_id: "2603.11513"
title: Can Small Language Models Use What They Retrieve? An Empirical Study of
  Retrieval Utilization Across Model Scale
url: https://arxiv.org/abs/2603.11513
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: retrieval-utilization
statement: For instruction-tuned models of 360M-8B on extractive QA (NQ,
  HotpotQA), oracle retrieval whose passage is guaranteed to contain the
  answer still yields only 0-14.6% exact match on questions the model cannot
  answer unaided, and adding any context destroys 42-64% of answers it
  previously got right, with the harm from oracle and noisy context
  statistically indistinguishable below 7B.
kind: observation
backing_strength: single-paper
scope_condition: English Wikipedia-domain extractive QA scored by exact match;
  five instruction-tuned decoder-only models from three families, four of them
  4-bit quantized; 756 corpus-matched questions; no RAG-specific fine-tuning.
technique: retrieval-augmented-generation
