falsifier: A sub-7B instruction-tuned model that, given oracle passages,
  reaches high exact match on questions it cannot answer parametrically, or
  that retains most of its correct parametric answers when context is added,
  would break this.
evidence_note: "Measured: 1,000 questions (756 oracle-matched), four retrieval
  conditions, per-model parametric Known/Unknown split, bootstrap CIs and
  McNemar with Bonferroni correction; replicated across three prompt
  templates, three retrieval methods and an FP16 API model. Weak points: the
  360M Known set is 11 questions, exact match penalizes paraphrase (relaxed EM
  adds ~6pp), and the error taxonomy is heuristic with 89% agreement on 96
  reviewed samples. Design isolates utilization from retrieval quality but not
  from quantization in four of five models."
confidence: medium
