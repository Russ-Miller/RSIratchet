arxiv_id: "2602.16873"
title: "AdaptOrch: Task-Adaptive Multi-Agent Orchestration in the Era of LLM
  Performance Convergence"
url: https://doi.org/10.48550/arxiv.2602.16873
drafted_at: 2026-11-21
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: "When a multi-agent system's communication topology is fixed in
  advance, the mismatch between topology and task dependency structure can
  make it worse than a single model: on graduate-level reasoning questions
  with high inter-subtask coupling, always-parallel agent execution scored
  below the best single model, while on code-fixing tasks with wide,
  low-coupling decompositions the same parallel topology gained several
  points."
kind: observation
backing_strength: single-paper
scope_condition: Five mid-tier models of near-identical benchmark scores on
  SWE-bench Verified, GPQA Diamond and HotpotQA; task decomposed by an LLM
  into a dependency DAG; topology chosen from four canonical patterns.
technique: ""
proposed_technique: Route the agent topology from the task's dependency DAG
technique_summary: Decompose the task into a dependency DAG with annotated
  coupling strengths, then pick parallel, sequential, hierarchical or hybrid
  agent execution in linear time from the DAG's parallelism width and coupling
  density.
technique_kind: process
technique_validated_by: Accuracy against single-best-model, Mixture-of-Agents,
  LLM-Blender, and static parallel/sequential baselines on SWE-bench Verified,
  GPQA Diamond and HotpotQA; reported 52.6/53.1/76.4 vs 42.8/46.2/68.3 for
  single best, with a compute-matched Self-MoA baseline recovering most of the
  gain and an ablation attributing -2.8 points to removing adaptive routing.
stance_on_existing: supports
related_claim_id: splitting-task-across-several-agents-helps-long-horizon-tasks-whose
stance_reason: "It reports the same directional split: decomposition helps
  when subtasks are loosely coupled and hurts when they are tightly coupled."
falsifier: A controlled comparison holding decomposition and models fixed in
  which always-parallel execution matches or beats coupling-matched topology
  selection across high- and low-coupling task families, or in which measured
  coupling density fails to predict which topology wins.
evidence_note: Measured on three benchmarks with five models and three runs
  each, against five baselines including a token-matched Self-MoA. The
  compute-matched Self-MoA recovers 89% of the gain, so only a small residual
  is attributable to topology routing itself. Coupling strength is assigned by
  the decomposer LLM on a coarse four-value scale, so the predictor is not
  independently measured. Thresholds were tuned on a held-out dev split.
  Self-reported, unreplicated, and some cited work and model names are hard to
  verify.
confidence: low
