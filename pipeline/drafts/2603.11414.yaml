statement: On university-level materials science free-response problems whose
  answers require reading values off figures (phase diagrams, stress-strain
  curves, Arrhenius plots, diffraction patterns), current multimodal models
  often reach correct answers from memorized textbook knowledge rather than
  from the image, and remain weak at quantitative figure reading and
  significant-digit handling even as overall accuracy rises across model
  versions.
