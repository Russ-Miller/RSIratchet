falsifier: Show that accuracy on these problems collapses when the figure is
  removed or replaced with a mismatched one, indicating answers genuinely
  depend on reading the image rather than recalled domain knowledge.
evidence_note: Measured accuracy on 137 problems across several OpenAI
  multimodal model versions, with per-category analysis; the memorization
  claim rests on the authors' error analysis rather than on a reported
  image-ablation control, so the attribution to memorized knowledge is argued
  more than isolated. Small single-source benchmark, one model family.
