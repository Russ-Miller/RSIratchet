falsifier: An evaluation of the same or later models on comparable timestamped
  audio showing purity at or above coverage, or TLoc F1 flat across the 0-30s
  to 120-180s duration bins.
evidence_note: Measured on 13,145 samples per temporal task across five
  languages, with span-overlap F1 stratified into four duration bins;
  coverage-vs-purity decomposition shown in detail only for MERaLiON-2-10B and
  asserted as a pattern for most models. Single benchmark, no independent
  replication, and possible test contamination is acknowledged by the authors.
