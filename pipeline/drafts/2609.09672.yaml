statement: On audio temporal-localization tasks in 11 Southeast Asian
  languages, current audio LLMs return time spans whose coverage of the true
  span consistently exceeds their purity, and F1 falls steadily as the
  recording grows from under 30 seconds to 3 minutes, with several models
  unable to run at all on the longer bins.
kind: observation
