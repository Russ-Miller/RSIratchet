falsifier: Shuffling or reordering caption sentences before detection leaves
  per-sentence detection accuracy unchanged, or detection accuracy is found
  independent of sentence position under segment-level human labels.
evidence_note: Argued from analysis of a new benchmark with segment-level
  human labels across multiple caption-generating VLMs; the source text states
  the positional finding but gives no numbers, no per-position accuracies, and
  no control for sentences at the start being genuinely more often correct
  (early sentences often describe salient, easily grounded content), so the
