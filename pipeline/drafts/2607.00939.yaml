capability: multi-model-coordination
statement: "In a role-specialized multi-agent pipeline that turns
  natural-language test-optimization requirements into executable Qiskit
  programs, the curated code-generation skill given to the coding agent
  matters more than the multi-agent decomposition itself: removing the skill
  drops compilation to near zero, while collapsing all roles into one prompted
  agent stays close to the full pipeline."
kind: observation
backing_strength: single-paper
scope_condition: 20 natural-language test case selection/minimization
  requirements over 10 real test-suite benchmarks, Claude backbone, 3 runs
  each, ablations on the 10 largest requirements, noise-free simulator with a
  24-qubit budget
technique: ""
proposed_technique: Specialized agents plus curated coding skill for quantum app generation
technique_summary: Splits requirement parsing, quantum-suitability analysis,
  blueprinting, encoding, code generation, review, execution and verification
  across separate agents, each with curated task knowledge, Qiskit coding
  conventions and executable tool feedback.
technique_kind: process
technique_validated_by: pass@1 for compilation (1.000), execution and final
  combination (0.967) over 20 requirements x 3 runs, plus QUBO-value reduction
  ratio against a genetic-algorithm baseline (medians 57.6 TCS, 89.1 TCM);
  ablations removing skill, knowledge, review and multi-agent decomposition
  all scored lower, with the skill ablation almost never compiling.
stance_on_existing: neither
