falsifier: An ablation on the same requirements where removing the multi-agent
  decomposition (single all-roles agent) costs as much or more
  compilation/execution pass@1 than removing the curated code-generation
  skill.
evidence_note: Measured on 10 requirements for the ablation arm with 3 runs
  each and a single backbone; pass@1 and positive-QRR counts reported but no
  variance or significance testing, and the 'single' arm keeps the same skills
  and knowledge, so the comparison isolates skill versus role-separation only
  under that fixed setting.
