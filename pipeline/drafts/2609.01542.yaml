arxiv_id: "2609.01542"
title: "TAG-Bench: Benchmarking Temporal Audio Grounding in Large Audio
  Language Models"
url: https://doi.org/10.48550/arxiv.2609.01542
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: "When large audio language models are asked to return every time
  span matching a natural-language query, they almost always report fewer
  intervals than exist: across 21 systems on queries averaging about 4
  ground-truth intervals, under-reporting rates run from 79% to 100% and no
  system exceeds 13.2% exact count accuracy, even for the models with the best
  overlap scores."
kind: observation
backing_strength: single-paper
scope_condition: Free-form timestamp output, 1,750 human-verified
  query-recording pairs (7s to 20 min), 387 queries with two or more
  ground-truth intervals, no oracle count or explicit enumeration reminder in
  the prompt.
technique: ""
proposed_technique: Score occurrence count separately from boundary overlap
technique_summary: Report, alongside union-IoU, the share of queries where the
  number of predicted intervals equals the number of ground-truth intervals,
  plus under- and over-reporting rates, so missing occurrences is
  distinguished from imprecise boundaries.
technique_kind: process
technique_validated_by: Applied across 21 systems; it exposed that two weak
  models' apparently higher one-to-many mIoU came from emitting single long
  intervals that accrue intersection by accident, which mIoU alone could not
  reveal.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model evaluated under the same free-form protocol that emits
  roughly the correct number of intervals on recurring-event queries (count
  accuracy well above 13%) without an oracle count, or evidence that a plain
  'enumerate all occurrences' prompt removes the under-reporting.
evidence_note: Measured over 387 multi-interval queries with mean 4.02
  ground-truth intervals; average predicted intervals ranged 0.18-3.67, most
  systems near one. Parsing failures count as zero intervals, so some
  under-reporting is format failure rather than enumeration failure, and the
  paper says the two cannot be fully separated. Prompt did not disclose the
  target count; an explicit enumeration instruction was not tested.
confidence: medium
