related_claim_id: self-critique-without-grounding-unreliable
stance_reason: Even with an explicit external diagnosis of the violation
  supplied, correction success stays near the model's unaided plan-generation
  rate and the same errors recur.
falsifier: A frontier model given the same planted-error plans that corrects
  most of them (correction success near plan-validity ceiling) with near-zero
  recurrence of the flagged violation, and identification precision comparable
  to recall.
evidence_note: Measured on three benchmarks with solver-constructed violating
  plans; identification reports precision 0.44-0.95 against recall 0.72-0.97,
  correction success 0.03-0.32 across models, and a persistence figure
  increasing with error count. Small samples, no matched baseline for
  correction without feedback, and GPT-5.2 is a counter-case on persistence
  (lowest persistence but poor corrected plans).
