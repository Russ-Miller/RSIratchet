model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: When a travel-planning agent is given a plan plus explicit
  identification of its constraint violations and asked to repair it, frontier
  LLMs both over-flag errors that do not exist (precision well below recall
  during identification) and reproduce the same flagged violations in the
  corrected plan, with error persistence rising as the number of planted
  errors grows and worst in non-reasoning modes.
kind: observation
backing_strength: single-paper
scope_condition: Decoupled evaluation with oracle intermediate contexts on
  TravelPlanner, TripCraft and ChinaTravel; plans with 1-3 solver-planted
  constraint violations; GPT-5.2, DeepSeek V3.2, Qwen3 Max, Claude Sonnet 4.5,
  Gemini 3 Pro in reasoning and non-reasoning modes.
