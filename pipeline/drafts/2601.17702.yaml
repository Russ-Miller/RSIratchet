arxiv_id: "2601.17702"
title: S$^3$-Attention:Attention-Aligned Endogenous Retrieval for
  Memory-Bounded Long-Context Inference
url: https://doi.org/10.48550/arxiv.2601.17702
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For 7-8B open models on LongBench QA and summarization, retrieval
  driven only by sparse-autoencoder features decoded from the model's own
  key/query projections scores below BM25 and below full context (e.g. 22.60
  vs 24.25 and 25.01 on Llama-3.1-8B), and only recovers near-full-context
  accuracy when unioned with BM25 and lead/tail spans.
kind: observation
backing_strength: single-paper
scope_condition: Nine LongBench datasets, three 7-8B instruct models, one
  unified prompt/decoding protocol; SAEs trained on general corpora, base LLM
  not fine-tuned.
technique: ""
proposed_technique: Index attention states as sparse features, fuse with BM25
technique_summary: Decode transient key projections into Top-k
  sparse-autoencoder feature IDs during a streaming prefill, build a CPU
  inverted index, discard the KV cache, then retrieve spans by query-feature
  co-activation unioned with BM25 and lead/tail positional spans.
technique_kind: architecture
technique_validated_by: "LongBench scores against a full-KV upper bound and
  BM25/RAG/KV-compression baselines under one protocol: hybrid retains 99.4%
  of full-context average on Llama-3.1-8B and ~99% on Mistral; the SAE-only
  ablation falls 2-3 points below BM25 on all three models. Also HotpotQA
  answer recall (0.84 hybrid vs 0.78 pure vs 0.77 BM25/RAG) and KL to
  full-context next-token distribution."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: SAE-feature-only retrieval matching or exceeding BM25 and
  full-context accuracy on the same benchmarks and models without lexical
  fusion.
evidence_note: "Measured on nine LongBench datasets across Llama-3.1-8B,
  Qwen2-7B and Mistral-7B with a stated unified protocol and an explicit
  full-KV internal baseline. Ablation isolates the SAE-only vs hybrid
  contrast. Weaknesses: absolute scores are low and some per-dataset
  differences are within a point; the authors note cross-toolkit score
  variance; no latency-matched comparison, and the Qwen2 hybrid average equals
  BM25 exactly, so the fusion gain is not uniform across models."
confidence: medium
