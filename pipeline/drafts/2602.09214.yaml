arxiv_id: "2602.09214"
title: "VLM-UQBench: A Benchmark for Modality-Specific and Cross-Modality
  Uncertainties in Vision Language Models"
url: https://doi.org/10.48550/arxiv.2602.09214
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For vision-language models on VQA, the change in standard
  uncertainty scores (perplexity, semantic entropy, DegMat, lexical
  similarity, p(True)) when an input is perturbed correlates only weakly and
  inconsistently with whether the answer flips to a hallucination, and the
  correlation is lowest exactly for the visual degradations (e.g. blur) that
  cause the most hallucinations, while being higher for low-impact textual
  edits like typos.
kind: observation
backing_strength: single-paper
scope_condition: Nine white-box and black-box UQ methods on Kosmos-2, LLaVA,
  Qwen-VL and GPT-4o-mini; hallucination measured as clean-correct becoming
  perturbed-incorrect on CLEVR attribute/existence/counting/relation
  questions.
technique: ""
proposed_technique: Score uncertainty methods by correlation between score
  change and hallucination flips
technique_summary: Perturb an input in one modality, measure whether the
  uncertainty score rises (Uncertainty Reflection Rate) and whether that rise
  correlates with the answer flipping to a hallucination (point-biserial
  Hallucination Consistency Coefficient).
technique_kind: process
technique_validated_by: Applied to nine UQ methods across four VLMs on VizWiz,
  VQAv2 and CLEVR subsets; reported as heatmaps of HCC per method per
  perturbation, alongside AUROC/F1 on human-labelled modality subsets. Not
  validated against an external measure of UQ usefulness.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Measuring HCC for the same UQ methods on another VLM set and
  finding consistently high positive correlation for visual perturbations,
  especially blur, would overturn it.
evidence_note: Measured on 600 curated VizWiz samples plus VQ-FocusAmbiguity
  and CLEVR-generated hallucination subsets, four models, nine UQ methods.
  Hallucination rates under blur reach 64.7% (Qwen-VL, attribute) while HCC
  for blur is near zero or negative across models. Design isolates
  perturbation type but perturbation intensities are heuristically calibrated,
  and the hallucination subset is synthetic CLEVR, so transfer to natural
  images is untested.
confidence: medium
