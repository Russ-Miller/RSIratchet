statement: For MLLMs given synchronized aerial (UAV) and ground (UGV) views of
  the same scene, accuracy falls in a fixed order from scene perception to
  cross-view alignment to viewpoint-transformation reasoning to closed-loop
  navigation, with perception near human level and navigation far below it, so
  strong single-view perception does not indicate a view-consistent geometric
  representation.
kind: observation
backing_strength: single-paper
scope_condition: 13 proprietary and open MLLMs, zero-shot, on 62k four-option
  dual-view VQA items and 115 closed-loop VLN episodes in 11 Unreal/AirSim
  outdoor environments
