falsifier: A model that scores at or near human level on cross-view alignment
  and viewpoint-transformation tasks while matching current perception scores,
  or one whose navigation success rate approaches its VQA accuracy, would
  break the stated ladder.
evidence_note: "Measured: best average VQA accuracy is mid-50s against ~81%
  human, scene perception reaches 86-97% for most models, while best VLN
  success rate is 38.71% against 83.87% human. Dual-view input beats either
  single view for all five ablated models. All environments are simulated, all
  VQA is 4-way multiple choice, and the per-dimension ordering is read off
  aggregate accuracy rather than isolated by intervention, so the causal story
  that alignment errors propagate into navigation failure is argued, not
  demonstrated."
