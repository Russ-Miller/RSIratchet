capability: hallucination
statement: "For tool-augmented legal agents on multi-step Chinese-law tasks, a
  correct final answer does not indicate a clean reasoning trajectory: across
  18 agent configurations, trajectories that reach the right answer still
  contain at least one substantive legal hallucination about 68% of the time
  on average, and that rate barely moves with backbone scale or agentic
  framework (0.61-0.78), while procedural-process hallucination rates vary
  widely (0.07-0.85)."
kind: observation
backing_strength: single-paper
scope_condition: Chinese (PRC) law, 3,414 expert-curated instances filtered to
  hard cases, objective-question subset for the right-answer analysis,
  rubric-anchored LLM-as-a-judge over full trajectories, single-model agents
  only.
technique: ""
proposed_technique: Judge each rubric item against the full agent trajectory
technique_summary: Convert a verified gold answer into a checklist whose items
  are each anchored to a hallucination subclass, then have an LLM judge issue
  a binary verdict per item against the agent's whole trajectory (reasoning,
  memory, tool observations) rather than the final answer.
technique_kind: process
technique_validated_by: Not measured against human error-labelling agreement
  in the given text; validated indirectly by showing the metrics separate
  frameworks and scale monotonically within the LRAS family.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An independent step-level audit (human expert) of correct-answer
  legal-agent trajectories finding substantive hallucination in a small
  minority of cases, or showing the judge's flags are mostly false positives.
evidence_note: Measured on one benchmark with an LLM judge over 18 agent
  configurations; hard-case filtering (only items all six filter models
  failed) inflates absolute rates, and the judge's own reliability is only
  referenced to an appendix robustness analysis not included here.
