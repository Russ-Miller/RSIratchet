arxiv_id: "2609.07135"
title: "NutriBench-Kitchen: Benchmarking Embodied AI for Nutrition Management"
url: https://arxiv.org/abs/2609.07135
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: state-tracking
statement: For long cooking videos where a question depends on ingredient
  changes no longer visible, vision-language models fail to carry observed
  events forward into later answers, and adding generic retrieved-context RAG
  makes it worse, while splitting memory into a temporally anchored event log
  plus an explicitly updated inventory ledger recovers much of the gap.
kind: mechanism
backing_strength: single-paper
scope_condition: Multiple-choice and numeric QA over 160 long cooking videos;
  Qwen3-VL 4B/8B backbones for the agent; proprietary and open VLMs as
  zero-shot baselines; observational only, no actuation.
technique: hierarchical-memory
proposed_technique: Separate event-log and inventory-ledger memories
stance_on_existing: supports
related_claim_id: only-models-substantial-code-pretraining-track-entity-state
stance_reason: Baseline VLMs degrade sharply on the harder long-range regime
  of ingredient-state questions (e.g. Qwen2.5-VL-7B from 30.7% to 3.3% on
  Ingredient Entry).
falsifier: A generic flat-retrieval long-video RAG pipeline matching the
  structured episodic+food-state memory on the same hard state-tracking
  splits, or the structured memory failing to beat its own visual-only
  backbone.
evidence_note: Single benchmark of 1,500 human-verified QA pairs; humans ~92%
  average vs GPT-4o 47.7% and Gemini 2.5 Pro 61.1%. Nutri-Vgent raises
  Qwen3-VL-8B from 53.4% to 62.3% while generic Vgent lowers it to 31.7%.
  Ablation shows either memory alone lowers overall score below the
  visual-only baseline; the combination is highest. Easy splits dip slightly,
  attributed to retrieval overhead. No isolation of prompt/function-call
  differences from the memory structure itself.
confidence: medium
