capability: code-generation
statement: On LeetCode-style code generation with five current LLMs, attaching
  an explanation of the reasoning path to each few-shot exemplar raises Pass@1
  over exemplars that show only problem and solution, but the gain scales
  inversely with the model's zero-shot strength (+5.72 points for DeepSeek-V3
  and +3.3 for Claude-3.5 versus +0.15 for Qwen3-Max, whose zero-shot Pass@1
  is already 78%), and adding more than one or two such exemplars reduces
  accuracy again for most models.
kind: observation
backing_strength: single-paper
scope_condition: Competitive-programming problems filtered to the 30% hardest
  for a baseline model; five LLMs; 1-5 shot; exemplars retrieved from a
  disjoint train split.
technique: ""
proposed_technique: Attach the reasoning path to few-shot code exemplars
technique_summary: Few-shot exemplars for code generation carry not only the
  problem and solution but an explanation of the solution strategy, with the
  shot count kept to one or two.
technique_kind: prompting
technique_validated_by: Pass@1 on 636 held-out LeetCode problems with
  model-generated, manually checked test cases, compared against zero-shot and
  against the same exemplars without explanations, across five models and 0-5
  shots.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model with high zero-shot Pass@1 gaining as much from explained
  exemplars as a weak one, or monotone improvement in Pass@1 as shots rise
  from 1 to 5, on a comparable held-out code-generation set.
evidence_note: Measured on one benchmark the authors built; difficulty
  filtering was done with a Qwen model, so the test split is selected against
  that family. No statistical testing or repeated runs reported; temperature
  0. The inverse-scaling reading rests on five models, so it is a pattern
  across a small sample rather than an isolated effect.
