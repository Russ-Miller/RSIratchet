arxiv_id: "2605.28354"
title: "Plan Before Search: Search Agents Need Plan"
url: https://doi.org/10.48550/arxiv.2605.28354
drafted_at: 2026-10-31
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-step-reasoning
statement: For 3B-14B models being cold-started for multi-hop retrieval RL,
  SFT trajectories generated by a small same-scale seed model that already
  acquired the behaviour give higher final accuracy and more stable subsequent
  RL than correctness-filtered trajectories distilled from a 72B teacher,
  because the teacher's reasoning style lies outside the target's reproducible
  distribution.
kind: mechanism
backing_strength: single-paper
scope_condition: Multi-hop QA with a static Wikipedia retriever;
  Qwen2.5/Qwen3/Llama3.2 targets 3B-14B; both arms use 4,500
  correctness-filtered trajectories and the same SFT-then-GRPO pipeline.
technique: ""
proposed_technique: Cold-start from a small seed model's own trajectories, not a big teacher
technique_summary: Train one small seed model to the target behaviour by
  staged RL, have it generate and filter trajectories, and use those as the
  SFT cold start that activates the behaviour in larger target models.
technique_kind: training
technique_validated_by: "Exact Match on seven open-domain QA benchmarks
  against a 72B-Instruct distillation arm holding trajectory count and
  pipeline fixed: self-bootstrapping won on all three target models (+1.4 EM
  average, 6 of 7 benchmarks each), and the distillation arm's RL collapsed in
  multiple runs for Qwen2.5-7B-Base and Qwen3-4B-Base while self-bootstrapping
  stayed stable."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matched-budget cold starts where teacher-distilled trajectories
  give equal or better post-RL accuracy and equal training stability across
  target families, or where the self-bootstrapped advantage disappears once
  teacher trajectories are rewritten into the target's style.
evidence_note: Measured on three target models with all components held fixed
  except the trajectory generator; the stability claim rests on reported run
  collapses rather than a counted collapse rate, and the distillation numbers
  are best-checkpoint-before-collapse, which favours the comparison less than
  a clean endpoint would. Only one seed model (Qwen2.5-3B-Base) and one
  teacher were tried.
confidence: medium
