stance_reason: The review concludes that source-marking and hierarchy defenses
  give partial risk reduction rather than elimination, and that the residual
  risk follows from shared context.
falsifier: A marking- or weighting-based defense that keeps trusted
  instructions and untrusted content in one context and drives injection
  success to near zero on an adaptive benchmark such as AgentDojo, without
  loss of task utility.
evidence_note: "Narrative review, not new measurement: cites indirect
  injection against deployed applications, a 1,054-case benchmark over 30
  tool-integrated agents where a ReAct GPT-4 agent was attacked in roughly one
  case in four with higher rates under reinforced injections, and AgentDojo.
  The review notes studies use different agents, attack sets and success
  criteria, so cross-method comparison is weak and the mechanism claim is
  partly argued rather than isolated."
