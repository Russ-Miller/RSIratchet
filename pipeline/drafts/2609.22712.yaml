statement: As long as trusted instructions and untrusted retrieved content
  occupy the same model context, defenses that only change how untrusted text
  is marked or weighted (instruction hierarchies, spotlighting, content
  detectors) reduce indirect-injection success but do not remove it; only
  defenses that isolate contexts or restrict the action set give guarantees,
  at a cost in the agent's ability to combine information across sources.
kind: mechanism
backing_strength: replicated
scope_condition: LLM agents that read web pages, emails, documents or database
  records into the same context as their instructions; evidence from
  static-LLM instruction-hierarchy training and controlled injection
  benchmarks, not from long agent runs that repeatedly retrieve and transform
  hostile content.
