title: "Vision-Language-Action in Robotics: A Survey of Datasets, Benchmarks,
  and Data Engines"
url: https://doi.org/10.48550/arxiv.2604.23001
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: In current vision-language-action manipulation benchmarks, task
  complexity and environment variability are varied together and scored by a
  single task success rate, so a long-horizon failure cannot be attributed to
  planning, memory, skill composition or recovery — and robustness measured by
  perturbing one factor at a time does not predict behaviour when
  perturbations are combined.
kind: observation
backing_strength: single-paper
scope_condition: Simulated and real robot-arm manipulation benchmarks surveyed
  through 2025 (CALVIN, LIBERO, Meta-World, GemBench, COLOSSEUM, BEHAVIOR-1K,
  VLABench); not navigation or driving.
technique: ""
proposed_technique: Score task complexity and environment structure as separate axes
technique_summary: Place each benchmark on a two-dimensional landscape of task
  complexity and environment structure so that evaluation varies one axis at a
  time and failures can be attributed to a source.
technique_kind: process
technique_validated_by: Not measured; the survey applies the framework
  descriptively to existing benchmarks rather than testing that it improves
  failure attribution.
stance_on_existing: supports
related_claim_id: vlm-agents-doing-multi-phase-navigation-pick-and-place-procedurally-generated-indoor
stance_reason: Both hold that an aggregate success rate on embodied tasks
  hides where in the trajectory the agent fails.
falsifier: A study showing that single-axis perturbation scores predict
  combined-perturbation performance, or that per-stage failure causes in
  long-horizon VLA benchmarks can be recovered from aggregate success rate
  alone.
evidence_note: "Argued in a survey, not measured: it cites CALVIN success
  dropping to near zero at five chained instructions and COLOSSEUM degrading
  under combined perturbations, but runs no experiment isolating attribution
  and proposes no validated remedy."
confidence: medium
