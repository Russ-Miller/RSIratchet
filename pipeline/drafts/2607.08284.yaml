falsifier: Running the same decoy sets clustered versus scattered and finding
  accuracy similarly low in both arrangements, or finding the clustered gain
  is an artifact of shorter effective search (e.g. persists when context is
  shortened to the cluster alone).
evidence_note: Measured accuracy across nine models on paired variants of the
  same task; the clustering manipulation isolates spatial arrangement while
  holding decoy count and construction fixed. Absolute numbers are low enough
  that some comparisons rest on a handful of correct items, and the mechanism
  ('models zone in on a distinctive region') is speculation, not tested.
