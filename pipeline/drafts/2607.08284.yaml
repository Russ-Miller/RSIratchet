capability: long-context-degradation
statement: "On ~128K-token constraint-retrieval tasks (find the longest
  lexicographically sorted run of words), frontier models' collapse under
  near-miss decoys comes from the decoys being scattered through the context
  rather than from their presence: with 8 scattered near-sorted decoys no
  tested model exceeds 2%, while clustering the same decoys next to the target
  restores accuracy to baseline levels (e.g. Opus 4.6 high 1% scattered vs 98%
  clustered)."
kind: observation
backing_strength: single-paper
scope_condition: Synthetic and LongBench-v2-derived word lists at ~128K-365K
  tokens, k=5 target runs, 8 decoys, 100 examples per variant, 16K output
  token budget; nine closed and open frontier models.
