arxiv_id: "2602.20162"
title: "Talking to Yourself: Defying Forgetting in Large Language Models"
url: https://doi.org/10.48550/arxiv.2602.20162
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fine-tuning-retention
statement: When fine-tuning 3B-13B instruct models on narrow task data, mixing
  in a 1:1 share of dialogues generated by that same frozen model before
  training retains more general-benchmark ability than mixing in external
  instruction corpora (Alpaca, UltraChat) or freezing lower layers, and the
  protection survives deleting all math/logic/code content from the
  self-generated set, so the mechanism is surface-form alignment with the
  model's own distribution rather than replay of the relevant skill.
kind: mechanism
backing_strength: single-paper
scope_condition: Five instruct models (LLaMA2-7B/13B-Chat, LLaMA3-8B,
  LLaMA3.2-3B, Qwen2.5-7B) fine-tuned on five SuperNI tasks, full and LoRA;
  depends on the base model being able to generate diverse well-formed
  self-dialogues.
technique: ""
proposed_technique: Mix in the model's own self-generated dialogues before fine-tuning
technique_summary: Before SFT, sample question-answer pairs from the frozen
  base model itself (Magpie or bait-prompt style) and concatenate them 1:1
  with the task data, leaving the optimizer and schedule unchanged.
technique_kind: training
technique_validated_by: In-domain averaged ROUGE-L plus five general
  benchmarks (GSM8K, MMLU, IFEval, MedText, AGIEval_G, 5-shot) across 50
  model-by-benchmark-by-regime cells; beat Base in 50/50 for retention and was
  best in 40/50, against Task-only, layer-freezing, Task+Alpaca and
  Task+UltraChat baselines; a GPT-4o filter removing math/logic/code dialogues
  left GSM8K recovery nearly unchanged (74.2 to 73.7 on LLaMA3-8B).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Show that external corpora matched to the base model's surface
  style, but not generated by it, retain general ability as well as
  self-generated data; or that removing a broader slice of content (not just
  math/logic/code) from the self-generated set destroys the retention effect,
  implicating content replay after all.
evidence_note: "Measured, not argued, across five models and two adaptation
  flavours with matched data sizes. The mechanism claim rests on two supports:
  the no-math ablation on two models only, and a generator-swap study where a
  stronger generator (LLaMA3-70B, Qwen2.5-7B) gave weaker retention than
  same-model data. Does not isolate style from other same-model properties
  such as low perplexity under the base weights; no per-run variance reported
  and some cells are close."
confidence: medium
