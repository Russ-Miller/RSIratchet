stance_reason: The synthesized bypass rates confirm that marking, filtering
  and classification defenses reduce but do not remove indirect injection,
  while isolation and capability restriction fare better.
falsifier: An adaptive-attack evaluation of these same detectors, with an
  attacker allowed gradient/RL/search optimization, showing attack success
  below the authors' reported rates rather than near 80-90%.
evidence_note: Meta-analysis of 78 sources; the headline numbers come from one
  adaptive-attack study (Nasr et al.) covering ~12 defenses, plus MCPSecBench
  and IDEsaster. No independent replication by these authors; the defense
  table is reproduced from a single source, so 'replicated' rests on the three
  benchmarks agreeing in direction, not on repeated measurement of the same
  defenses.
