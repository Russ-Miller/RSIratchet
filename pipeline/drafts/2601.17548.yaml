capability: prompt-injection
statement: "For prompt-injection detectors deployed on LLM coding agents
  (classifier-style guards such as PromptGuard, Protect AI, PIGuard, Model
  Armor, TaskTracker), the low attack-success rates reported by their authors
  are measured against static attack sets and do not survive adaptive
  optimization: re-tested with gradient, RL or random-search attacks, every
  such defense is bypassed at 78-93% success."
kind: observation
backing_strength: replicated
scope_condition: Detection/classification defenses evaluated black-box;
  attacker can query the defended system and adapt payloads. Does not cover
  architectural defenses (capability scoping, channel separation) which report
  lower bypass rates in the same literature.
