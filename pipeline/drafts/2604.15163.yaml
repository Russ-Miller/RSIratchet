arxiv_id: "2604.15163"
title: "DPC: Training-Free Text-to-SQL Candidate Selection via Dual-Paradigm
  Consistency"
url: https://arxiv.org/abs/2604.15163
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: For selecting among several sampled SQL candidates without
  training, verifying the top two execution-distinct candidates against a
  synthesized small adversarial database plus an independently generated
  Python/Pandas solution of the same question raises execution accuracy over
  self-consistency and LLM-as-judge selection, with the gain concentrated on
  cases where the majority vote is wrong.
kind: mechanism
backing_strength: single-paper
scope_condition: Training-free candidate selection over 5-11 sampled SQL
  candidates on BIRD Mini-Dev and Spider Test, with Qwen2.5-Coder-7B,
  DeepSeek-V3.2 and GPT-5 backbones; absolute gains are small (about 1-2
  points).
technique: ""
proposed_technique: Verify SQL candidates on a synthesized distinguishing
  database against a parallel Python solution
technique_summary: Cluster candidates by execution result, pick the two
  largest clusters, have agents synthesize a minimal schema slice and
  adversarial rows that make the two diverge, then pick whichever candidate's
  output best matches an independently generated Pandas solution run on that
  micro-database.
technique_kind: process
technique_validated_by: "Execution accuracy on BIRD Mini-Dev (500 queries) and
  Spider Test (2,147) against random, execution-guided, self-consistency and
  multiple-choice selection: e.g. BIRD 53.4 vs 51.2 for self-consistency on
  DeepSeek-V3.2; also plugged into DAIL-SQL, CHESS, OmniSQL-7B, XiYanCoder-7B
  (+1.0 to +2.4 points over self-consistency); ablations remove Tester (-1.4),
  Slicer (-0.8), Python solver (-0.6), BS-F1 (-0.6)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the Python cross-paradigm check and adversarial
  database add nothing over self-consistency at matched candidate budget, or
  where the gain disappears once the extra verification compute is given to
  self-consistency as more samples.
evidence_note: Measured on two benchmarks and three backbones with four
  selection baselines; gains are 0.8-2.2 points absolute and grow with
  candidate pool size (1.2 to 2.4 from N=3 to 11). Robustness split shows the
  whole gain comes from majority-incorrect cases (0% to 21.4%) at a 3.0-point
  cost on majority-correct cases. No matched-compute baseline giving
  self-consistency the extra tokens; the Python-solver ablation costs only 0.6
  points, so the claim that the cross-paradigm anchor is doing the work is
  weakly isolated relative to the Tester agent (-1.4).
confidence: medium
