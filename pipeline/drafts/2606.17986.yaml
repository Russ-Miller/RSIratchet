capability: state-tracking
statement: For an LLM simulating a stateful shell over long command sequences,
  externalizing the simulated filesystem into an explicit tree structure plus
  a pruned command history, instead of relying on the context window, holds
  command-level state-tracking accuracy roughly flat out to 200 commands,
  while context-window-only prompting degrades as the session lengthens.
kind: mechanism
backing_strength: single-paper
scope_condition: SSH shell simulation with GPT-4.1-mini-class backbone;
  synthetic filesystem traces of 50-200 commands under relative and absolute
  path resolution; exact-string matching against a real shell
technique: ""
proposed_technique: Externalize simulated shell state into a virtual filesystem tree
technique_summary: A memory manager parses state-changing commands into an
  explicit filesystem tree and prunes the command history, injecting that
  compact state into the generator's prompt instead of the raw interaction
  log.
technique_kind: process
technique_validated_by: "Ablation on the filesystem state-tracking task: with
  the memory manager, mean command-level accuracy 0.985 (relative paths) and
  0.976 (absolute) versus 0.955 and 0.861 without; at 200 commands
  relative-path accuracy rose from 0.865 to 0.985, while at 50-100 commands it
  fell slightly (1.0 to 0.98/0.99). Baselines: GPT-5.4-mini 0.920/0.673,
  ShelLM 0.490/0.336, E-ShelLM 0.533/0.570."
stance_on_existing: neither
