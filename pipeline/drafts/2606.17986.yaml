stance_reason: ""
falsifier: A context-window-only shell simulator that holds accuracy flat out
  to 200+ commands, or an externalized-state version that degrades at the same
  rate as the prompt-only baseline on long relative-path traces.
evidence_note: Measured on synthetic traces (350 commands total across three
  lengths) with exact-string matching against a real shell, plus a module
  ablation. The ablation isolates the memory manager from the other four
  components. Small, synthetic, single-backbone; at short sequence lengths the
  memory manager was neutral or slightly harmful, so the benefit is specific
  to long horizons. User study (n=20) separately rated filesystem fidelity as
  the weakest dimension (3.4 vs 4.89 for a real shell), so exact-match
  accuracy may overstate perceived fidelity.
