arxiv_id: "2607.17038"
title: "Reward-Driven LLM Agent Workflows: Synthesizing POMDP Routing and
  Self-Correction for Autonomous Decision-Making"
url: https://doi.org/10.48550/arxiv.2607.17038
drafted_at: 2026-10-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For an 8B LLaMA-3 agent acting in text-based embodied and web
  environments (ALFWorld, WebShop), intercepting each proposed action with a
  separately fine-tuned lightweight critic that scores logical feasibility and
  returns a diagnostic for regeneration (up to 3 retries) raises task success
  over a ReAct loop with the same backbone, with ablation attributing more of
  the gain to the critic than to the graph memory.
kind: observation
backing_strength: single-paper
scope_condition: 8B quantized LLaMA-3-Instruct actor, critic LoRA-tuned on 50k
  critique traces, 500 unseen-split episodes per benchmark; costs ~1.8x
  latency per step
technique: ""
proposed_technique: Gate each proposed action on a trained critic score before execution
technique_summary: A separately fine-tuned critic model scores each candidate
  action for feasibility and goal progress, rejecting it below a threshold and
  returning a natural-language diagnostic that forces the actor to regenerate
  before anything touches the environment.
technique_kind: process
technique_validated_by: Task success rate, average steps and a custom
  hallucination-error rate on 500 ALFWorld and 500 WebShop episodes against
  zero-shot Base-LLM and standard ReAct with the same 8B backbone, plus
  ablations removing the critic and the graph memory (78.6% vs 61.2% vs 54.1%
  on ALFWorld).
stance_on_existing: supports
related_claim_id: external-feedback-repair-works-only-with-real-grounding
stance_reason: The critic here is a trained model, not unaided self-critique,
  and its rejections are checked against environment feasibility, consistent
  with the claim that grounding rather than reflection does the work.
falsifier: A replication where inserting the trained critic gate before
  execution leaves ALFWorld/WebShop success rate unchanged relative to ReAct
  with the same backbone and matched token budget, or where a matched-compute
  ReAct baseline (equal retries without the critic) closes the gap.
evidence_note: "Measured on 500 episodes per benchmark with one backbone and
  two baselines, plus component ablations. No matched-compute control: RLAW
  spends up to 3 extra generations per step and ~1.8x latency, so part of the
  gain could be extra sampling rather than the critic. Single paper, no
  independent replication, and reported figures are not externally verified."
confidence: low
