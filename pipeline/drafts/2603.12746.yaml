status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For multimodal LLMs answering spatio-temporal questions about
  dynamic videos, overlaying object segmentation masks on frames alone does
  not improve accuracy, while supplying both the raw frames and the masks
  together does, with the gain concentrated in inter-object and camera-object
  motion questions.
kind: observation
backing_strength: single-paper
scope_condition: Measured on one general 8B video MLLM (Qwen3-VL-8B) over a
  benchmark of 1k dynamic videos with multiple-choice spatio-temporal
  questions; masks come from ground-truth/annotated segmentation, not
  model-produced.
technique: ""
proposed_technique: Feed raw frames and segmentation masks together, not masks alone
technique_summary: Supplies the model with both the original video frames and
  the corresponding dynamic-object segmentation masks as a fused visual input,
  rather than replacing frames with mask-overlaid versions.
technique_kind: prompting
technique_validated_by: "Multiple-choice accuracy on Dyn-Bench with
  Qwen3-VL-8B: raw video 53.8 avg, masked frames only 53.8, mask-guided fusion
  57.1, with the largest gains on inter-object (38.9 to 41.8) and
  camera-object (55.6 to 60.0)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On other video backbones, mask-overlaid frames alone match or beat
  fusion of frames plus masks, or fusion gives no gain over raw video on
  motion-centric question categories.
evidence_note: Measured, but on a single backbone and a single benchmark the
  authors built; masks are annotation-quality, so the result does not isolate
  whether a pipeline with predicted masks would help. No cost or token-budget
  control reported.
confidence: low
