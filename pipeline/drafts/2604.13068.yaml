arxiv_id: "2604.13068"
title: "Detection Without Correction: A Robust Asymmetry in Activation-Based
  Hallucination Probing"
url: https://doi.org/10.48550/arxiv.2604.13068
drafted_at: 2026-11-24
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: In autoregressive LMs from 117M to 7B across GPT-2, Pythia and
  Qwen-2.5, a linear probe on activations detects hallucination above chance
  in larger models but steering along that same probe direction fails to
  reduce hallucination in all 7 models, and output-confidence baselines beat
  the probe on detection AUC at every size above 410M.
kind: observation
backing_strength: single-paper
scope_condition: Seven models 117M-7B across three families; closed-book-style
  hallucination probing with linear probes versus output-confidence baselines;
  steering applied along the probe-derived direction.
technique: probe-fixed-mid-network-layer-truthfulness
proposed_technique: Use probes for pre-generation flagging, not correction
technique_summary: Read the probe signal at position zero, before any output
  token is generated, to flag likely hallucination in advance rather than to
  steer activations or compete on raw detection accuracy.
technique_kind: decoding
technique_validated_by: Position-zero probe signal was statistically
  significant in 2 of 7 models (Pythia-1.4B p=0.012, Qwen2.5-7B p=0.038) and
  absent below 400M; detection AUC compared against output-confidence
  baselines, which won above 410M (gap up to 0.157 AUC on Pythia-6.9B).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A steering intervention along a probe-derived direction that
  measurably lowers hallucination rates in these same model families, or
  probes beating output-confidence baselines on detection AUC at >410M scale.
evidence_note: Measured across 7 models and 3 families with AUC comparisons
  against output-confidence baselines and per-model significance tests; design
  isolates detection from correction but the correction failure may be
  specific to simple linear steering rather than all activation interventions.
confidence: medium
