arxiv_id: "2604.10015"
title: "FinTrace: Holistic Trajectory-Level Evaluation of LLM Tool Calling for
  Long-Horizon Financial Tasks"
url: https://doi.org/10.48550/arxiv.2604.10015
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: "On long-horizon financial tool-calling tasks, efficiency-style
  metrics (step count, redundancy) reward degenerate agents: weak models that
  invoke very few or wrong tools score near-perfect on step efficiency and
  redundancy while scoring lowest on tool-selection F1, information
  utilization and answer quality, so efficiency or success-rate alone misranks
  them."
kind: observation
backing_strength: single-paper
scope_condition: 800 expert-annotated trajectories over 34 financial task
  categories against 247 Financial Modeling Prep tools via MCP, 13 proprietary
  and open models, nine-metric rubric with LLM-judged axes.
technique: ""
proposed_technique: Score tool-call trajectories on four axes, not success rate
technique_summary: Evaluate an agent's whole tool-calling trajectory on action
  correctness, execution efficiency, process quality and output quality with
  nine metrics (three deterministic, six LLM-judged against a reference
  trajectory) rather than a single end-to-end success rate.
technique_kind: process
technique_validated_by: Applied to 13 models; ranking stability checked with
  an out-of-family judge (Spearman 0.989), human annotation of 90 trajectories
  on three metrics (judge-human weighted kappa 0.631-0.857), and
  leave-one-metric-out/median aggregation (Kendall tau >= 0.974). No external
  validation that the rubric predicts deployment outcomes.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that on the same trajectories, step-efficiency and
  redundancy scores correlate positively with tool-selection accuracy and
  answer quality across the model range, so weak models do not obtain
  near-perfect efficiency scores.
evidence_note: "Measured: Qwen-3.5-9B scores 1.000 step efficiency and 1.000
  redundancy with 0.109 tool-calling F1 and the lowest answer quality;
  Llama-3.3-70B shows the same pattern (0.939/0.998 vs 0.437 F1). Single
  benchmark, one tool provider, judge is an evaluated model family member
  though a cross-judge check was run. The design isolates the metric artifact
  but not whether it generalises beyond finance."
confidence: medium
