statement: For LLM agents under a fixed ReAct harness answering questions over
  executable database-backed APIs plus document retrieval, accuracy falls
  sharply as the required reasoning depth grows from 1 to 5 hops (most models
  lose over half their accuracy), and the surviving failures concentrate in
  language-mediated steps — entity disambiguation, cross-source grounding,
  schema alignment — rather than in emitting syntactically valid tool calls.
kind: observation
backing_strength: single-paper
scope_condition: 8,000+ locally hosted APIs over 62 BIRD-SQL domains with
  ChromaDB document collections; trajectory-level grading by re-executing
  predicted calls; one ReAct harness, 11 frontier and open-weight models.
