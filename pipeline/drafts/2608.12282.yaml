evidence_note: "Measured: best model 70.4% on single-hop endpoint tasks versus
  50-51% on compositional BI APIs and 26.0% on multi-source multi-hop; stage
  sieve shows tool-name accuracy ~73-93% on Dashboard APIs while
  grounded-answer accuracy is 47-70%, and 40-75% of errors on API-terminated
  chains traced to extraction/grounding. Benchmark questions are LLM-generated
  with a 60-item human quality check (87-96% rated high quality), and the
  judge for stages 1-2 is GPT-OSS-120B, which is also one of the evaluated
  models."
