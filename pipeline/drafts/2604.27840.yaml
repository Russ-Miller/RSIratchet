arxiv_id: "2604.27840"
title: "CastFlow: Bridging Evidence Acquisition and Accurate Prediction in
  Agentic Time Series Forecasting"
url: https://doi.org/10.48550/arxiv.2604.27840
drafted_at: 2026-11-02
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: "For LLM-agent time series forecasting where an ensemble of
  conventional forecasters supplies a numerical prior, that prior is the
  load-bearing component: removing it costs more accuracy than removing any
  diagnostic tool category, and a general-purpose LLM reasoning over the same
  diagnostics without the prior is worse than the prior alone."
kind: mechanism
backing_strength: single-paper
scope_condition: Ten real-world energy/streamflow benchmarks, 24- and 96-step
  horizons, frozen Grok 4 planner plus Qwen3-4B forecaster trained by SFT then
  GRPO on verifiable forecast-error rewards.
technique: ""
proposed_technique: Refine an ensemble forecast prior with a trained small LLM
technique_summary: A frozen LLM plans diagnostic tool calls guided by
  retrieved past tool-use trajectories, and a small LLM trained by SFT plus
  reward-for-improvement-over-prior rewrites the ensemble forecast into
  refined numbers.
technique_kind: training
technique_validated_by: "MSE/MAE against 21 baselines on ten benchmarks:
  lowest on nine datasets (18 of 20 dataset-metric cells), losing on PJM;
  ablations show removing the anchorer (prior) gives the largest error rise of
  any tool category (WP MSE 1720 to 2718) and removing either training stage
  raises error."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on comparable benchmarks where removing the ensemble
  prior costs less accuracy than removing diagnostic tools, or where an LLM
  reasoning from diagnostics alone matches or beats the prior.
evidence_note: Measured on ten datasets with component ablations, but
  ablations are point estimates with no seeds or confidence intervals, some
  margins are tiny (ETTh MSE 8.02 to 8.00), and the 'w/o Toolkit' arm removes
  prior, diagnostics and planning together so the prior's effect is only
  cleanly isolated by the anchorer ablation.
