arxiv_id: "2602.18711"
title: "HIME: Mitigating Object Hallucinations in LVLMs via Hallucination
  Insensitivity Model Editing"
url: https://doi.org/10.48550/arxiv.2602.18711
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 7-8B open vision-language models (LLaVA-1.5, MiniGPT-4,
  mPLUG-Owl2, Qwen2/3-VL), susceptibility to object hallucination is not
  uniform across decoder layers — the divergence between truthful and
  hallucinated attention distributions peaks at mid-depth and is lowest at
  early and late layers — so scaling null-space weight editing per layer by
  that divergence lowers CHAIR hallucination rates further than applying the
  same full projection to every layer.
kind: mechanism
backing_strength: single-paper
scope_condition: Captioning and perception benchmarks (CHAIR on MSCOCO, MME,
  LLaVA-Bench) with contrastive truthful/hallucinated caption pairs from LURE
  used to estimate the editing subspace; 7-8B open LVLMs only.
technique: ""
proposed_technique: Scale layer editing strength by truthful-vs-hallucinated attention divergence
technique_summary: Computes a per-layer KL divergence between attention-score
  histograms for truthful and hallucinated captions, then edits each layer's
  MLP weights with a null-space projection whose strength is the complement of
  that divergence, so insensitive layers are edited hardest and discriminative
  layers are left nearly untouched.
technique_kind: training
technique_validated_by: CHAIR_s/CHAIR_i and BLEU on MSCOCO across LLaVA-1.5,
  MiniGPT-4, mPLUG-Owl2 (e.g. LLaVA-1.5 CHAIR_s 15.20 for uniform-projection
  Nullu vs 13.80), plus MME perception sub-scores and GPT-4V-aided
  accuracy/detailedness on LLaVA-Bench; an ablation removes the per-layer
  weighting.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Applying the same null-space projection uniformly at full strength
  to all layers matches or beats the divergence-weighted version on CHAIR and
  MME, or the measured per-layer divergence profile does not recur across
  backbones.
evidence_note: Measured on three LVLM backbones plus two Qwen-VL models
  against decoding-time and editing baselines, with the uniform-projection
  method (Nullu) as the direct control and an ablation on the weighting.
  Variance reported over three runs. The design does not isolate whether the
  gain comes from the per-layer weighting or from using attention-guided
  rather than plain hidden-state features, since both differ from the
  baseline. Detailedness fell slightly below the unedited model.
confidence: low
