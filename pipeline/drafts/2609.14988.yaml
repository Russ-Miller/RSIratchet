falsifier: Models whose verifiable-reference rates are similar also show
  similar field-level correctness rates, so existence-checking a citation
  predicts metadata correctness.
evidence_note: "Measured: references classified as verifiable, partial,
  fabricated or declined, with journal/year/author match checked against the
  cited paper. Across all models 55.4% fabricated and 14.9% correct in every
  field; 2026-released models 35.3% and 31.8%. Single paper, single prompt
  format, no mitigation tested; decline behaviour confounds the fabrication
  ranking."
