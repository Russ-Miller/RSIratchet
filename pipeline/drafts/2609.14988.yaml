capability: hallucination
statement: "When asked to supply a missing biomedical reference, models that
  retrieve a real paper often still misstate its journal, year or authors, so
  verifiable-reference rate overstates usable accuracy: two Claude models with
  near-identical verifiable rates (77.6% and 76.6%) were correct in every
  bibliographic field in 54.6% and 19.9% of responses."
kind: observation
backing_strength: single-paper
scope_condition: 26 models from eight developers (2023-2026), 69 biomedical
  passages across ten domains, one reference requested per passage;
  fabrication rate also depends on decline rate, with the lowest-fabrication
  model declining 52.1% of prompts.
