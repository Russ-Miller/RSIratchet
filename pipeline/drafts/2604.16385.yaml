arxiv_id: "2604.16385"
title: "StressWeb: A Diagnostic Benchmark for Web Agent Robustness under
  Realistic Interaction Variability"
url: https://doi.org/10.48550/arxiv.2604.16385
drafted_at: 2026-11-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: tool-use
statement: "For multimodal LLM web agents operating simulated websites via
  screenshots and DOM, robustness degrades in a consistent order across eight
  frontier models: perception noise and layout distortion cost the least,
  execution failures and pop-up interruptions more, and remapping an action's
  semantics (single-click now requiring double-click) the most, with implicit
  remapping worse than remapping announced in on-page text."
kind: observation
backing_strength: single-paper
scope_condition: 149 tasks over 10 agent-generated websites, one clean plus
  six perturbed settings at a single moderate stress level (execution failure
  probability 0.35), 100-step budget, checkpoint-level scoring; perturbations
  applied one at a time, not combined.
technique: ""
proposed_technique: Stress-test web agents with stage-aligned perturbations
technique_summary: Re-run the same web tasks in environments that inject
  controlled interference at one pipeline stage at a time (visual/DOM noise,
  remapped click semantics, random action failures and pop-ups) and compare
  checkpoint pass rates against the clean environment.
technique_kind: process
technique_validated_by: Checkpoint pass rate and step count for eight models
  across seven environment settings, against a human oracle that scored 100%
  in every setting with only ~1 extra step, which separates agent fragility
  from task difficulty.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A set of current web agents whose checkpoint pass rate falls as
  much or more under visual/DOM perturbation as under action-semantics
  remapping, or for whom implicit remapping is no worse than explicit
  remapping.
evidence_note: "Measured: average checkpoint pass rate fell from 54.3% clean
  to 49.8% (DOM noise), 45.8% (visual chaos), 46.1% (action failure), 43.0%
  (pop-up), 31.3% (explicit remap), 26.2% (implicit remap), with the ordering
  holding for all eight models. Human oracle at 100% everywhere isolates agent
  robustness from task difficulty. Single stress level only; no compositional
  perturbations; environments are agent-generated rather than real sites."
confidence: medium
