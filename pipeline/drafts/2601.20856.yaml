falsifier: A reasoning model that holds high exact-plan accuracy on these
  corridors out to 50+ required moves, or a PDDL-tool pipeline that restores
  near-ceiling accuracy across the full length range, would falsify it.
evidence_note: "Measured on 80 generated maps with exact-match accuracy,
  prefix accuracy and terminal Manhattan distance, plus token-count
  regressions. The design does isolate horizon length from branching, since
  the corridor has one free parameter. It does not isolate the cause: the
  attribution to counting drift and visited-state amnesia rests on qualitative
  trace inspection and on a reported GPT-5-mini accuracy bump at length 50 the
  authors cannot explain. Tool-setting evidence is one model at 4
  repetitions."
