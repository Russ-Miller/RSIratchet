capability: planning
statement: On single-box Sokoban corridors with minimal branching, where the
  only difficulty is plan length, current reasoning models (DeepSeek R1,
  GPT-5-mini, GPT-oss-120B) solve short instances reliably but collapse to
  near-zero valid plans once about 25-30 moves are required, and giving them a
  validated PDDL domain plus parser and solver only slightly flattens that
  decline.
kind: observation
backing_strength: single-paper
scope_condition: 1xL corridor maps with one player, one box, one goal, lengths
  5-100 in steps of 5, four rotations, exact-optimal-plan match, 8 repetitions
  (4 in the tool setting); only three reasoning model families tested, one of
  which (GPT-5-mini) was the only one able to use the PDDL tools at all.
