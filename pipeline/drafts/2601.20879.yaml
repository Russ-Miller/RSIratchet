capability: software-architecture
statement: In the empirical literature on LLM-assisted software engineering
  (87 studies through 2024), evidence about software quality concentrates on
  short-horizon maintainability attributes — analyzability (29 of 68
  maintainability quotes) and testability — while long-horizon evolvability
  attributes such as integrity, extensibility and portability are thinly
  evidenced (45 evolvability quotes total), so claims that LLM-assisted code
  stays adaptable over time rest on little direct measurement.
kind: observation
backing_strength: single-paper
scope_condition: Systematic review of 87 ACM/IEEE/Scopus papers published
  2020-2024; attribute counts come from researcher-extracted quotes coded
  against ISO/IEC 9126 and Breivold's evolvability framework, with
  LLM-assisted thematic coding.
