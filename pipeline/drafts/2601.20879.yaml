falsifier: A systematic survey over a comparable corpus finding evolvability
  attributes (integrity, extensibility, changeability) measured as often as,
  or more often than, analyzability and testability in LLM-SE studies.
evidence_note: Counts of coded quotations, not of measured system outcomes;
  the distribution reflects what the search string retrieved and how four
  researchers coded excerpts, so it characterises the literature's attention
  rather than any model's behaviour. No per-study effect sizes.
