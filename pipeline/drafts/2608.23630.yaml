arxiv_id: "2608.23630"
title: "FPGAgent: An LLM-Assisted Framework for Autonomous HLS Code Generation
  and Verification in FPGA Environments"
url: https://doi.org/10.48550/arxiv.2608.23630
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: "For LLM-generated HLS kernels targeted at real FPGA boards, the
  two stages of failure respond to different interventions: an evolutionary
  search over simulation-validated kernel candidates mainly raises
  synthesizable and executable rates, while a C/C++-level functional
  verify-and-repair loop mainly raises functional correctness and barely moves
  synthesizability, so both are needed for end-to-end success."
kind: mechanism
backing_strength: replicated
scope_condition: Natural-language-specification-to-executable HLS generation
  on 78 HLS-Eval tasks, Vitis HLS 2022.2 and a Xilinx U200 board; ablation run
  on one 30B open model.
technique: ""
proposed_technique: Evolutionary kernel search plus C-level functional repair, then board build
technique_summary: A multi-agent pipeline that injects Vitis HLS optimization
  priors, evolves kernel candidates under simulation feedback, verifies and
  repairs functional correctness by de-HLSifying the kernel and running C++
  test programs, then generates host code and builds/executes the xclbin on
  hardware.
technique_kind: process
technique_validated_by: "Against zero-shot pass@10 on 78 HLS-Eval tasks across
  five models: +16.9% synthesizable, +26.7% executable, +30.6% functional
  correctness on average; ablation on Qwen3-Coder-30B-A3B isolates each module
  (Eoh +17/+15/+9, Reflect -1/+2/+7, full +19/+22/+23)."
stance_on_existing: supports
related_claim_id: llm-generated-hls-kernels-targeting-real-fpga-boards-simulation-synthesis
stance_reason: "The ablation reproduces the division of labour: evolutionary
  search lifts synthesizable/executable rates far more than correctness, while
  the verify-and-repair module lifts correctness while leaving
  synthesizability flat or slightly lower."
falsifier: An ablation on comparable HLS tasks where the functional
  verify-and-repair module raises synthesizable/executable rates as much as
  the evolutionary search does, or where evolutionary search alone raises
  functional correctness as much as the repair loop.
evidence_note: Measured on one benchmark (78 filtered HLS-Eval tasks) and one
  FPGA platform; the component ablation uses a single backbone, so the
  attribution of gains to modules is not shown to hold across models.
  Zero-shot baseline is pass@10, roughly matching the search budget. No
  hardware-build cost-matched baseline.
confidence: medium
