falsifier: A model set evaluated on both benchmark families where ranking and
  absolute normalized scores on complex multi-panel real-data charts track
  those on ChartMimic/Plot2Code, or where open-weight and proprietary models
  show the same error-type distribution.
evidence_note: "Measured: 14 models, three tasks, three runs averaged, greedy
  decoding. Open-weight models drop from ~75-85 normalized on ChartMimic to
  under 25 on the new benchmark; proprietary Gemini-3-Pro from >91% to ~50%.
  Error-type split is from a categorized analysis of failure cases, reported
  as proportions without per-model statistics. Judge reliability checked on
  600 sampled tasks from one model only (Cohen's kappa 0.83), so judge
  validation does not cover all models. Scores are on the authors' own
  benchmark, so the degradation is partly a construction choice."
