statement: "On chart-to-code tasks built from authentic large datasets with
  multi-panel composite layouts, current VLMs score far below their results on
  single-panel chart-to-code benchmarks, and the failure modes split by model
  class: open-weight models fail mostly at execution (hallucinated libraries,
  invalid functions) and spatial layout, while proprietary models execute
  cleanly and fail at mapping data series to the right axes and attributes."
