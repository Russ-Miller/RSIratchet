stance_reason: ""
falsifier: An ablation on other datasets or backbones where disabling dynamic
  retrieval leaves accuracy unchanged or improves it, or where lower
  inter-judge agreement does not accompany higher accuracy — i.e. agreement
  tracks correctness.
evidence_note: Measured on one 120-claim binary subset of a single COVID
  benchmark, three runs with high variance (0.790-0.950), plus 100/60-claim
  sampled cross-domain checks. The agreement-versus-accuracy inversion rests
  on one ablation cell, with no confidence interval on kappa and no
  replication; run-to-run variance exceeds several of the reported ablation
  deltas, so the 7.5 pp P-RAG effect is the only one clearly above noise.
