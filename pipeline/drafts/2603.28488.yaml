arxiv_id: "2603.28488"
title: Courtroom-Style Multi-Agent Debate with Progressive RAG and
  Role-Switching for Controversial Claim Verification
url: https://doi.org/10.48550/arxiv.2603.28488
drafted_at: 2026-11-07
