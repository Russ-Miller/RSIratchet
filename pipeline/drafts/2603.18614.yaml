capability: tool-use
statement: "When a tool-augmented LLM must acquire withheld constraints
  through queries before solving a deterministic logic puzzle, failures come
  far more from under-acquiring information and stopping too early than from
  faulty downstream deduction: reasoning errors stay around 2-7% while
  insufficient-information errors rise to about 46% on the largest instances,
  and models also keep querying after the solution is already determined."
