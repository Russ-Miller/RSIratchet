falsifier: An evaluation in the same environment showing reasoning errors
  (wrong answer with the feasible set already a singleton) at or above the
  rate of insufficient-information errors, or showing insufficient-information
  errors not rising with puzzle size and missing-clue count.
evidence_note: Measured on 2000+ generated instances by decomposing failures
  on two axes (answer correct vs. final feasible set singleton), which the
  environment makes exactly computable. Also reports over-querying up to 62.2%
  and that GPT-5 still uses 70-270% more calls than the constructive reference
  budget. Single environment, synthetic puzzles, deterministic oracle;
  transfer to noisy real tool settings is argued, not shown.
