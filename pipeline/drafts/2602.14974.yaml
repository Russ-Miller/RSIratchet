capability: embodied-control
statement: For a 2B vision-language-action manipulation model, including
  embodied interaction logs and driving-scene data in the VLM's initial
  large-scale pretraining mix, rather than adapting a purely web-pretrained
  VLM afterwards, yields higher real-robot task success across four arm
  platforms than 3-4B baselines built by post-hoc adaptation.
kind: observation
backing_strength: single-paper
scope_condition: Real-world RoboChallenge Table30 tabletop manipulation,
  UR5/Franka/ARX5/ALOHA, specialist and generalist SFT settings; whole
  pipeline also includes a gradient-isolated flow-matching action expert and
  spatial chain-of-thought supervision.
technique: ""
proposed_technique: Pretrain the VLM on embodied logs from the start
technique_summary: Mixes web text, driving scenes and embodied interaction
  logs into one large-scale VLM pretraining run before attaching a
  flow-matching action expert whose gradients are blocked from the VLM on
  embodied data.
technique_kind: training
technique_validated_by: "Success rate on 30 RoboChallenge Table30 tasks
  against GigaBrain-0.1, Spirit-v1.5, pi-0.5 and pi-0: 62.00% specialist vs
  51.67/51.00/42.67, and 37.3 (score 49.08) generalist vs 17.67 and 9.0; no
  ablation separating pretraining mix from the gradient strategy or spatial
  scaffolding."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation holding architecture, data volume and the three-stage
  pipeline fixed while removing embodied and driving data from pretraining
  (adding it only at mid-training) that matches the reported Table30 success
  rates.
evidence_note: Measured on one real-robot benchmark (30 tasks, 10 trials each
  implied by 10-point granularity) against four published baselines of 3-4B
  parameters. No ablation isolates the pretraining data mix from the hybrid
  gradient strategy or the spatial scaffolding objectives, and baseline
  numbers are taken from a leaderboard rather than re-run under matched
  conditions, so the attribution to embodied-native pretraining is argued
  rather than isolated.
