capability: multi-model-coordination
statement: "On expert-curated physical-science deep-research tasks, adding
  three coordination components to a multi-agent framework \\u2014 replanning
  on intermediate outcomes, a shared experience/knowledge memory, and step-
  plus trajectory-level physics verification \\u2014 accounts for most of its
  advantage over the strongest generalist deep-research agent, but the
  components partly substitute for one another: removing any one costs 2.5-3.0
  points while removing all three costs 6.5, less than the 8.5 summed."
kind: observation
backing_strength: single-paper
scope_condition: 200 expert-authored physics/chemistry questions (PhySciBench)
  requiring multimodal parsing, long documents, structured extraction and code
  execution; single foundation model (gemini-3-flash-preview) across planner
  and workers; pass@1; composite rule-plus-rubric scoring validated against
  two experts at Spearman 0.80.
technique: ""
proposed_technique: Pair adaptive replanning with shared memory and physics verifiers
technique_summary: Wraps a planner-worker agent system in a loop that replans
  on intermediate observations, retrieves past successful trajectories and
  domain facts from a two-tier memory, and routes worker outputs through
  unit/dimension verifiers plus a trajectory-level critic before answering.
technique_kind: process
technique_validated_by: Overall accuracy on PhySciBench rose from 33.5%
  (Gemini Deep Research) to 41.0%, with per-component ablations of -3.0, -3.0
  and -2.5 points and an all-three ablation of -6.5 points leaving only a
  1.0-point gap to the baseline; average 23.62% vs 20.87% across HLE, SGI-DR
  and FS-Research physics/chemistry subsets.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the stripped configuration on the same backbone and finding
  it already matches or exceeds 41.0%, or finding the three-component ablation
  drop equals or exceeds the sum of individual drops on a replication.
evidence_note: Measured on one 200-item benchmark plus three public subsets,
  pass@1 with a single sample, no confidence intervals on the ablation
  differences; 2.5-3.0-point gaps on 200 items are a few questions each, so
  the claim that no component dominates is weakly resolved. Component
  ablations do not isolate replanning from the extra inference calls it buys.
  Experimental Design and Scientific Reasoning showed no gain at all.
