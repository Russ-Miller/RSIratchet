statement: In knowledge-graph-guided multi-agent hypothesis generation for
  materials design, retrieving only the single shortest path between
  design-keyword nodes gives the downstream synthesizing agent too little
  context — paths collapse into self-referential or context-free edges — while
  retrieving the top-N shortest paths or depth-limited DFS branches yields
  proposals spanning more property domains.
kind: observation
backing_strength: single-paper
scope_condition: One PFAS-substitute case study (biomedical tubing) on two
  literature-distilled knowledge graphs; hypotheses compared qualitatively,
  not scored against any ground truth or expert rating.
technique: ""
proposed_technique: Vary graph traversal breadth and depth to tune hypothesis scope
technique_summary: After mapping extracted design keywords to knowledge-graph
  nodes, swap the traversal algorithm (shortest simple path, top-N shortest
  paths, depth-limited DFS, or BFS forced through a user-chosen semantic
  waypoint) to control how much relational context the hypothesis-writing
  agent receives.
technique_kind: retrieval
technique_validated_by: Not measured — outputs for each traversal variant are
  shown and described narratively; no metric, baseline, or rater comparison.
stance_on_existing: neither
