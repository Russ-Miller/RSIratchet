falsifier: Blind expert rating of hypotheses generated under shortest-path
  versus top-N/DFS traversal, on a set of design problems, showing no
  difference in domain coverage or plausibility.
evidence_note: Argued and illustrated, not measured. A single application
  case, one generated hypothesis per traversal variant, no scoring rubric, no
  independent raters, no comparison against a non-graph baseline. The paper's
  stated ablation (full pipeline beats single-shot prompting) is asserted in
  the abstract but no numbers appear in the supplied text.
