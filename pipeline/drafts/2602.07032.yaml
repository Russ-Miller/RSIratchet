evidence_note: "Measured: 18 models x 3 pipelines x 1,000 problems split into
  three state-count tiers, with reference RTL and testbenches synthesized from
  the same verified YAML, so the reference is not a confound. Spec length also
  grows with state count (409 to 1,265 words), so state count and context
  length are not separated. Difficulty tiers are defined by state count, so
  the complexity-accuracy relation is partly definitional to the tiering."
