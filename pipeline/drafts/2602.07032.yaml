capability: code-generation
statement: "When RTL is generated from natural-language finite-state-machine
  specifications, current frontier LLMs degrade sharply as the FSM's state and
  transition count grows: averaged over 18 models and three generation
  pipelines, accuracy falls from roughly 63-65% on 4-14-state machines to
  16-24% on 27-59-state machines, and even the best model drops from about 95%
  to about 55-72% depending on pipeline."
kind: observation
backing_strength: single-paper
scope_condition: 1,000 auto-generated spec-to-RTL problems with
  correct-by-construction reference RTL and transition-covering testbenches;
  Pass@1 under cycle-by-cycle output matching; three output targets
  (SystemVerilog, fsm2sv YAML, SystemC).
