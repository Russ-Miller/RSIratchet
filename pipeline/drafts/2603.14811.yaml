arxiv_id: "2603.14811"
title: "Ego to World: Collaborative Spatial Reasoning in Embodied Systems via
  Reinforcement Learning"
url: https://doi.org/10.48550/arxiv.2603.14811
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: "For 3B-7B vision-language models trained to answer spatial queries
  from several robots' ego-centric RGB views, fusing multiple close-range
  ego-centric views yields higher counting and cross-view relational accuracy
  than reasoning from a single global overhead camera that covers the whole
  workspace (7B: 61.0 vs 34.0 on counting, 97.0 vs 54.0 on location
  reasoning)."
kind: observation
backing_strength: single-paper
scope_condition: Tabletop multi-robot manipulation scenes, Qwen2.5-VL
  backbones fine-tuned on the paper's own benchmark; the simulated split was
  deliberately built with clutter and occlusion.
technique: ""
proposed_technique: Reward cross-view grounding and overlap count, not just the answer
technique_summary: After CoT supervised fine-tuning, GRPO is run with a reward
  that adds IoU on bounding boxes cited in the reasoning trace and an
  exact-match term on the number of objects visible in more than one view,
  alongside final-answer correctness.
technique_kind: training
technique_validated_by: Measured on the paper's E2W benchmark against
  zero-shot proprietary and open models, SFT-only, and RL-from-scratch;
  leave-one-out ablation of each reward term (removing the grounding term
  costs over 21 points on grasping, removing the overlap term costs ~4.5 on
  counting), plus Where2Place transfer (50.9 vs 46.8 RoboPoint) and a two-task
  real-robot trial (65% and 30% vs 0%).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled comparison in which the single-global-view arm is
  given the same resolution budget and the same amount of matched training
  data and then equals or beats the multi-ego-view arm on the same counting
  and relational queries.
evidence_note: Measured on one benchmark the authors built, with
  scene-disjoint train/test. The single-view arm uses one overhead camera; the
  comparison does not hold total pixel budget or training-data composition
  fixed, so view diversity and effective resolution are confounded. Real-world
  validation is two tasks with no reported trial count.
confidence: low
