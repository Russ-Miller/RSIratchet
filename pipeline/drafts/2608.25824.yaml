arxiv_id: "2608.25824"
title: Localize-Then-Decide Guarantees for LLM Judgments
url: https://doi.org/10.48550/arxiv.2608.25824
drafted_at: 2026-10-20
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: When an LLM judge must pick the human-preferred response out of
  more than two candidates, the assumption behind confidence-threshold
  abstention — that higher estimated confidence means lower disagreement with
  humans — degrades as the candidate count grows, because probability mass is
  normalized across more options; restricting the decision to a conformal
  top-k shortlist and thresholding a margin inside it restores the monotone
  relation.
kind: mechanism
backing_strength: single-paper
scope_condition: Preference-judgment tasks where one of m candidates is the
  human-preferred answer, m in {5,10,20}, open-weight judges 7B-120B,
  calibration and test data exchangeable.
technique: ""
proposed_technique: Conformal shortlist first, then calibrated margin abstention
technique_summary: Use conformal prediction to localize a top-k shortlist that
  contains the human-preferred response with probability 1-alpha, then accept
  a single answer only when its score margin within that shortlist clears a
  fixed-sequence-calibrated threshold, otherwise abstain or escalate.
technique_kind: process
technique_validated_by: On TL;DR, Chatbot Arena, HH-RLHF and AlpacaEval with
  three judge models at m=10 and target agreement 0.81, two-stage variants
  reached 91-97% guarantee success rate versus 48-79% for the matched
  single-stage rule using the same scoring function, with coverage 8-14 points
  higher; monotonicity measured by ranking loss (<=0.08 for both stages vs up
  to 0.46 single-stage).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that single-stage top-1 confidence keeps a monotone
  confidence-agreement relation as m grows on these judgment tasks, or that
  the two-stage shortlist rule fails to reach its stated agreement target at
  no better coverage than the single-stage rule.
evidence_note: Measured on four preference benchmarks, nine open-weight judges
  (three reported in the main table), ~3,000 instances per dataset-m pair,
  1,000 random calibration/test splits, against the single-stage baseline of
  Jung et al. with matched scoring functions. The end-to-end composed
  guarantee additionally assumes a cross-stage monotonicity condition that is
  only empirically supported, and all guarantees assume exchangeability.
confidence: medium
