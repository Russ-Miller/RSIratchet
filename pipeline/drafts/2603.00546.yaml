arxiv_id: "2603.00546"
title: Advancing Multimodal Judge Models through a Capability-Oriented
  Benchmark and MCTS-Driven Data Generation
url: https://doi.org/10.48550/arxiv.2603.00546
drafted_at: 2026-11-21
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: judge-position-bias
statement: For 2B-8B multimodal judge models, mixing in pairwise training data
  whose two sides cross reasoning length with correctness (short-correct vs
  long-error and the reverse), generated by step-level MCTS rollouts, raises
  accuracy on length-imbalanced judgments far more than adding more
  conventional task-typed preference data, which leaves length bias unchanged.
kind: observation
backing_strength: single-paper
scope_condition: Open 2B-8B multimodal backbones (Qwen3-VL, LLaVA, InternVL,
  UnifiedReward) fine-tuned on ~142k open-source preference pairs plus ~13k
  MCTS pairs; measured on the authors' own benchmark of pairwise
  image-grounded CoT comparisons.
technique: ""
proposed_technique: Train judges on MCTS pairs crossing length with correctness
technique_summary: Run step-level MCTS rollouts on multimodal reasoning seeds
  to produce short-correct, short-error, long-correct and long-error
  trajectories, then pair them across both axes as chosen/rejected data for
  judge SFT and RL.
technique_kind: training
technique_validated_by: "Pairwise accuracy on the authors'
  length-bias-avoidance split: adding MCTS data moved Qwen3-VL-8B from 26.15
  (open-source SFT only) to 34.22 (SFT) and 44.53 (DAPO RL), with similar
  shifts on four other backbones, while VL-RewardBench and Multimodal
  RewardBench scores held or rose; no independent benchmark of length bias
  used."
stance_on_existing: supports
related_claim_id: identifies-position-verbosity-self-enhancement-biases-strong-judges-while
stance_reason: The paper measures verbosity bias in 20+ multimodal judges and
  finds it persists even in frontier models, with judges preferring a
  structurally rich but wrong long CoT over a correct short answer in the
  large majority of cases.
falsifier: A matched-budget control adding the same volume of ordinary
  task-typed preference pairs that closes the length-imbalance gap as much as
  the MCTS pairs, or MCTS-trained judges showing no improvement on an
  independently built length-bias test set.
evidence_note: Measured on the authors' own benchmark (3,712 pairs) built with
  the same style of generation as the training data, so benchmark and method
  share design assumptions; the open-source-only SFT arm is a real control but
  there is no equal-token control of extra conventional data, and gains on the
  length-bias split are largest where the baseline is near floor (2-26%).
confidence: low
