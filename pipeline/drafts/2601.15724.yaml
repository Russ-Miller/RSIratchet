arxiv_id: "2601.15724"
title: "VideoThinker: Building Agentic VideoLLMs with LLM-Guided Tool Reasoning"
url: https://doi.org/10.48550/arxiv.2601.15724
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For 7B video-language models on long-form video QA, multi-step
  tool-use trajectories can be synthesized without any long-video-capable
  teacher by having a text LLM reason over frame captions and then swapping
  the captions for the actual frames before fine-tuning, and the resulting
  agentic model gains on videos over ~15 minutes while matching its own
  untrained backbone on clips under 2 minutes.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B trained on 10k CG-Bench multiple-choice items
  with trajectories from Qwen3-235B; evaluated on MLVU, LVBench,
  VideoMME-long, LongVideoBench with <=64 frames
technique: ""
proposed_technique: Synthesize tool trajectories in caption space, then swap captions for frames
technique_summary: A text-only agentic LLM generates multi-step
  temporal-retrieval and zoom trajectories over video captions, and the
  caption outputs are replaced with real frame tokens to produce
  video-interleaved training data for the VideoLLM.
technique_kind: training
technique_validated_by: Accuracy on MLVU (48.0 to 54.8), LVBench (38.3 to
  48.9), VideoMME-long (50.0 to 53.7) and LongVideoBench (56.7 to 59.7)
  against the untrained Qwen2.5-VL-7B backbone, and +3.0-3.9 over a Qwen-235B
  caption-only language agent given the same tools; duration-split ablation
  shows parity under 2 minutes and +3.7/+5.6 points over 15 minutes.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-budget control showing the same gains from fine-tuning on
  the same QA pairs without the synthesized tool trajectories, or showing that
  trajectories generated by a video-capable teacher are needed to beat the
  backbone on long-video splits.
evidence_note: Measured on four long-video benchmarks against the same
  backbone and against a caption-only language agent with identical tools. No
  ablation isolating the caption-to-frame grounding step from plain SFT on the
  same 10k items, and inference also uses a confidence-gated controller plus
  retrieval, so the training-data contribution is not cleanly separated from
  the inference harness.
confidence: low
