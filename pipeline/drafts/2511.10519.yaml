arxiv_id: '2511.10519'
title: 'Say It Differently: Linguistic Styles as Jailbreak Vectors'
url: https://arxiv.org/abs/2511.10519
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: jailbreak-robustness
statement: Rewriting a harmful request in an emotional or narrative style (fearful, curious,
  compassionate) while keeping its intent raises jailbreak success by up to 57 percentage points
  across 16 instruction-tuned models, contextual rewrites beating fixed templates, and the vulnerability
  does not shrink with model scale; a preprocessing step that has a second model strip stylistic
  cues cuts the success rate substantially.
kind: observation
backing_strength: single-paper
scope_condition: Three standard jailbreak datasets rewritten into 11 styles, 16 open and closed
  models, 2025; success judged automatically.
technique: ''
proposed_technique: Style neutralization before the safety model sees the prompt
technique_summary: Pass user input through a secondary model that rewrites it in a neutral register,
  removing fear, urgency, flattery and similar cues, and give the neutralized text to the main
  model, so stylistic reframing no longer carries the request past refusal.
technique_kind: process
technique_validated_by: Jailbreak success rates with and without neutralization across the 16
  models and 11 styles; utility cost of neutralization not reported in the excerpt read.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Attacks that encode intent in content rather than style, which neutralization leaves
  intact, or benign requests harmed by neutralization.
evidence_note: Large model set and a clear effect; 'scaling-resistant' is the authors' reading
  of a cross-model comparison, not a controlled scaling study.
confidence: medium
