arxiv_id: "2609.15820"
title: "AlgoEvo: Self-Evolving Agentic Search for Automated Algorithm Discovery"
url: https://arxiv.org/abs/2609.15820
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For LLM-driven heuristic discovery on combinatorial optimization
  tasks (TSP, CVRP, bi-objective and multi-component variants), letting an
  agent decide when to read, edit, diagnose and evaluate code while persisting
  each evaluation outcome as a retrievable experience card reaches better
  final heuristic quality than fixed evolutionary pipelines (EoH, ReEvo,
  FunSearch, MCTS-AHD, MEoH, MOTIF) at a fraction of their evaluation budget,
  and re-running the same task warm-started from the previous run's best code
  improves further round after round under a fixed budget.
kind: observation
backing_strength: single-paper
scope_condition: Six optimization heuristic-design tasks, 500-evaluation
  budget, three seeds, gpt-4o-mini and DeepSeek-V4-Flash; transfer gains
  reported to weaken outside aligned problem families, and token cost stays
  high on multi-component tasks.
technique: self-harness-loop
proposed_technique: Experience-card bank with pluggable design skills for algorithm discovery
stance_on_existing: supports
related_claim_id: a-fixed-model-can-improve-its-own-harness-with-a-regression-gated-loop
stance_reason: A frozen model improves its own results across successive
  rounds purely by accumulating and reusing structured records of its past
  attempts, with no weight updates.
falsifier: A matched-budget comparison where the agentic loop with the
  experience bank does no better than the same agent with the bank disabled,
  or where successive warm-started rounds show no monotonic gain.
evidence_note: Six tasks, three seeds, unified platform and instance splits;
  baselines run to the full 500 evaluations while AlgoEvo commits after
  ~27-275. Ablations separate cold vs warm start and rounds 0-4, and one
  cross-task transfer table. No matched-token-compute baseline, and the
  agentic loop plus skill hub plus experience bank are not fully separated
  from each other.
confidence: low
