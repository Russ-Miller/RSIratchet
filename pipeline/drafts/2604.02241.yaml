statement: For VLA policies doing language-guided UAV visual tracking of
  moving targets, adding a training-only auxiliary head that predicts the
  target's relative 3D position and yaw from the shared cross-modal features
  raises closed-loop tracking success far more for pedestrians (small, erratic
  targets) than for vehicles, because the auxiliary supervision forces
  explicit distance estimation that the action expert cannot recover from
  semantics alone.
kind: mechanism
backing_strength: single-paper
scope_condition: CARLA simulation only, pi-0.5-based architecture, 4-DoF
  displacement control, no physical robot
technique: ""
proposed_technique: Supervise target relative pose as a training-only side branch
technique_summary: Attach a compact transformer head after the LLM that
  predicts the tracked target's 3D relative position and yaw during training
  only, so the encoder embeds geometric priors into the features the
  flow-matching action expert consumes.
technique_kind: architecture
technique_validated_by: "Ablation against the same model without the head:
  seen maps far-distance pedestrian success 61.76% vs 37.88% and tracked
  frames 269.65 vs 183.96; unseen maps 226.90 vs 159.22 frames; vehicle gains
  much smaller and mixed."
