statement: On 2,154 expert-curated multiple-choice questions across eight architectural categories,
  11 current models all score above 90% zero-shot (best about 94%), with quality-attribute and
  pattern questions near ceiling, but accuracy varies by category and drops for smaller models
  on the harder tiers (to about 85-87%), so declarative architectural knowledge is largely present
  while the benchmark cannot show whether it is applied in design.
