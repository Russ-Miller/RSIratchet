evidence_note: Measured on 1,111 benchmark questions across nine VLMs, with
  route diagnostics decomposed into output validity, endpoint choice,
  first-edge legality and full-route legality; length- and waypoint-density
  stratification reported. Single benchmark, authors' own construction; human
  reference reaches 54.2 EgoPath Score versus 28.6 for the best VLM.
