statement: "For VLMs choosing an ordered route over numbered waypoints in a
  single egocentric image, per-waypoint feasibility and the first action are
  judged well while the rest of the route is not: pooled over nine models,
  roughly 88-96% of predictions take a legal first edge, but full-route
  legality falls to about 47% for a point agent and under 7% once the agent
  has a footprint, with most of the loss in intermediate edges rather than in
  output format."
