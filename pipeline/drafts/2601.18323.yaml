arxiv_id: "2601.18323"
title: "TC-IDM: Grounding Video Generation for Executable Zero-shot Robot Motion"
url: https://doi.org/10.48550/arxiv.2601.18323
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For robot manipulation driven by generated video plans, anchoring
  the inverse dynamics model on the tracked 3D trajectory of the end-effector
  (segmented, depth-aligned, fitted to a rigid-body transform) rather than on
  object state yields higher real-world success than end-to-end VLA policies
  and object-tracking IDMs, with the gap largest on high-precision and
  deformable-object tasks the model never trained on.
kind: mechanism
backing_strength: single-paper
scope_condition: Real-robot tabletop manipulation where the end-effector is
  visible in the first generated frame; evaluated on 9 tasks plus zero-shot
  cloth, camera-swap and cross-embodiment probes by one group.
technique: ""
proposed_technique: Track the tool, not the object, to turn video plans into motion
technique_summary: Segments the gripper in a world-model-generated video,
  extracts dense 3D point trajectories, fits a per-step rigid-body transform
  for 6-DoF end-effector commands, and predicts gripper aperture from a
  separate semantic-feature head.
technique_kind: architecture
technique_validated_by: Real-robot success rates on 9 tasks binned
  easy/medium/hard, against ResNet-MLP, AVDC, AnyPos and a 2D-tracker IDM on
  ground-truth replay (93.3/53.3/28.9% vs baselines), and against pi-0 plus
  eight video-model IDM pipelines (61.11% average, 38.46% zero-shot
  deformable).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An object-state-tracking or end-to-end VLA baseline matching or
  beating tool-trajectory anchoring on the same generated plans, especially on
  deformable or high-precision tasks; or the advantage disappearing once the
  gripper is occluded or when a different lab replicates with matched training
  data.
evidence_note: Measured on real hardware with small per-task samples (9-15
  trials each), single lab, no seeds or confidence intervals. Replay ablation
  isolates the IDM from the planner, which is the strongest part of the
  design; the cross-embodiment, camera and deformable results are qualitative
  or single-number. Baselines are not re-tuned for this setup.
confidence: low
