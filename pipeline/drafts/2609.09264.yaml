statement: On 450 Lean 4 theorem targets in graduate stochastic processes — a
  field thinly covered by Mathlib — a tool-using frontier agent (Opus 4.8 with
  Lean LSP access, one 15-minute run per problem) proves only 34.9%, and the
  rate varies widely by topic, from about 5% on renewal processes to about 62%
  on martingales and stopping.
