arxiv_id: '2606.16710'
title: Misinformation Propagation in Benign Multi-Agent Systems
url: https://arxiv.org/abs/2606.16710
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: multi-model-coordination
statement: When one agent's context carries planted misinformation, the wrong answer persists
  through multi-agent debate and other agents often adopt it, yet debate still degrades less
  than a single misinformed agent (relevant misinformation cut single-agent accuracy by 16-25%
  on CWQ), especially when most agents are unexposed; consensus protocols were more stable than
  voting under peer pressure, and a misinformed majority can steer the group.
kind: observation
backing_strength: single-paper
scope_condition: Reasoning, knowledge and alignment tasks with intent-based misinformation injected
  into one or more agents' context, open models such as GLM-4, 2026; debate with voting versus
  consensus decision rules.
