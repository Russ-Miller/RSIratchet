evidence_note: "Measured: accuracy, F1, recall, specificity on 315
  reproduction and 335 editing cases with near-balanced Accept/Reject labels
  from 5 expert annotators, plus base-vs-post-trained pairs (LLaVA-Critic-R1
  98.1% recall / 9.4% specificity; edit accept rate 48.7% to 72.2%). Only two
  model families supply the before/after contrast, so the causal read on
  post-training is narrow; the perturbation-based CPA items are synthetic."
