statement: "When open-source vision-language models are post-trained with RL
  or critique tuning to act as judges of chart-to-code outputs, they become
  more likely to output Accept rather than better at verification:
  pairwise-comparison accuracy barely improves under an order-swapped
  protocol, while acceptance rates rise and specificity falls, so they ratify
  flawed but plausible-looking charts."
kind: observation
backing_strength: single-paper
