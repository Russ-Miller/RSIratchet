falsifier: A frontier model with the same documentation matching or beating
  the fine-tuned 8B specialist on the 664-task deterministic and Instruct-100
  strict metrics, or the specialist's lead disappearing on a benchmark built
  by an independent party.
evidence_note: "Measured, single author, single base model, author-built
  benchmarks. Verified by execution against the FORM binary with
  difference-to-zero equality, which is strong. Two confounds the paper itself
  names: training data shares a generation pipeline with the Instruct-100
  references, so part of the strict lead may be convention familiarity; and no
  proprietary API models were tested. On the two small benchmarks the
  specialist does not lead."
