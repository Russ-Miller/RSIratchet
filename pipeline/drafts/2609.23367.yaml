statement: For a domain-specific language essentially absent from pretraining
  corpora (FORM symbolic algebra), QLoRA fine-tuning an 8B model on a few
  thousand examples validated by executing them through the language's own
  interpreter beats frontier open-weight models of up to 756B parameters given
  syntax documentation in context, on execution rate and strict output match
  for the larger benchmarks, while general reasoning scores drop under 3
  points.
kind: mechanism
backing_strength: single-paper
scope_condition: Zero-resource DSL with a deterministic execution oracle;
  single-attempt, temperature-0 generation; frontier baselines are open-weight
  only and get 6,000 characters of docs; benchmarks built by the same author
  who built the model.
technique: ""
proposed_technique: Mine training data through the language's own interpreter
technique_summary: Generate candidate programs from natural-language
  instructions with a frontier LLM, keep only those that pass a
  deterministic-wording filter, compile and run in the target language's
  binary, produce non-trivial output, and pass an independent LLM consistency
  audit, then QLoRA-fine-tune a small model on the survivors.
technique_kind: training
technique_validated_by: "840 single-attempt tasks across four benchmarks:
  97.7% exact output match on 664 deterministic tasks vs 75.5% for GLM-5.2 and
  62.3% for DeepSeek-V4 Flash (non-overlapping 95% CIs); 83.0% execution and
  18.0% strict match on Instruct-100 vs 65.0%/5.6% best frontier (McNemar
  p<=0.007); no lead on the 41- and 22-task benchmarks (p>=0.375); MMLU
  -2.6pp, GSM8K -1.5pp, HumanEval -0.6pp."
