arxiv_id: "2608.17253"
title: "Co-RL: Unsupervised Reasoning Emerges from Diverse Cohort in Multi-agent RL"
url: https://doi.org/10.48550/arxiv.2608.17253
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: In label-free RL post-training of reasoning models, deriving each
  model's reward from a separately-trained peer model's majority vote — rather
  than from its own majority vote — avoids the reward collapse and length
  degeneration that self-rewarding runs show, and the benefit grows as the
  paired models differ in family or size because their errors overlap less.
kind: mechanism
backing_strength: single-paper
scope_condition: 1.7B-12B open LLMs and VLMs trained with GRPO on unlabeled
  math/multimodal-math prompts; pseudo-labels from majority vote over K
  rollouts.
technique: ""
proposed_technique: Reward each model by a peer model's majority vote, not its own
technique_summary: Train several parameter-disjoint models simultaneously with
  RL, where each model's rollouts are scored against the majority-vote answer
  of a different model in the cohort, passed along a directed ring.
technique_kind: training
technique_validated_by: Average gains of 3.0-8.6% over base across seven text
  benchmarks and 2.3-7.2% across four multimodal benchmarks, beating TTRL,
  RENT, Intuitor, Co-rewarding-II, MAPoRL and CoMAS (+4.0% over CoMAS with
  half the agents), with a compute-matched control where two TTRL-trained
  models are ensembled at inference.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run where peer-rewarded cohorts collapse at the same rate as
  self-rewarding, or where same-family pairs match cross-family pairs on
  pseudo-label accuracy and final score once compute is matched.
evidence_note: Measured on 3B/7B/8B LLMs and 2B-12B VLMs with published
  baselines and a budget-matched ensemble control; the diversity mechanism is
  supported by error-overlap measurements and a two-outcome dynamical
  analysis, but same-family Co-RL already captures most of the gain in one of
  the two 3B settings, so the diversity component is less cleanly isolated
  than the cross-agent reward itself.
confidence: medium
