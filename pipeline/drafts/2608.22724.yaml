statement: For target-price valuation of listed companies, a multimodal
  financial model given large-scale financial-corpus pre-training followed by
  institution-specific fine-tuning has lower mean absolute valuation error
  than a general model prompted zero-shot, a single-stage fine-tuned financial
  LLM, and an analyst-parameterized DCF spreadsheet.
