arxiv_id: "2603.04663"
title: Neuro-Symbolic Financial Reasoning via Deterministic Fact Ledgers and
  Adversarial Low-Latency Hallucination Detector
url: https://doi.org/10.48550/arxiv.2603.04663
drafted_at: 2026-11-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For financial QA over 10-K-style filings, replacing text-chunk
  retrieval with retrieval of character-offset-verified typed numeric
  variables and routing all arithmetic to executed Python lowers the rate of
  answers containing ungrounded numbers (4.1% to 1.2%) and raises exact match,
  but the retrieval upgrade alone, feeding a chain-of-thought generator,
  lowers exact match (39.2% to 37.4%) and raises hallucination because the
  enriched context is harder to synthesize from.
kind: mechanism
backing_strength: single-paper
scope_condition: Financial QA on TAT-QA, FinQA and FinanceBench held-out
  questions; one retriever and two generator types; gains concentrated on
  FinanceBench and FinQA, zero on TAT-QA where baseline retrieval already
  succeeded.
technique: ""
proposed_technique: Retrieve typed verified variables, not text, then compute in Python
technique_summary: Parse documents into a strictly typed fact ledger where
  each scalar must align to a verbatim source span and pass a metric-name
  overlap check, gate retrieval with a lexical-recall filter over domain
  stop-word-stripped tokens, and let the LLM only write Python that reads
  those variables.
technique_kind: retrieval
technique_validated_by: 2x2 factorial over retriever and generator on held-out
  TAT-QA/FinQA/FinanceBench questions, scored by exact match, hallucination
  rate (incorrect answers containing an ungrounded number) and first-attempt
  Python compile rate; best cell 49.1% EM / 1.2% hallucination vs baseline RAG
  39.2% / 4.1%.
stance_on_existing: supports
related_claim_id: program-aided-computation-moves-errors-to-translation
stance_reason: Residual failures in the best configuration are compile
  failures and line-item conflation in the generated program, not arithmetic
  errors, so the error moves to the problem-to-program step.
falsifier: A matched comparison where the typed-ledger retriever plus Python
  execution shows no lower ungrounded-number rate than plain chunk RAG with
  the same generator, or where the retrieval-only arm improves exact match
  rather than degrading it.
evidence_note: Measured, single paper, one 2x2 sweep on a few hundred
  questions across three benchmarks with a single proprietary generator; no
  confidence intervals, hallucination rate is author-defined, and the ledger
  and retriever changes are bundled so their individual contributions are not
  separated. The Run-2 degradation is explained post hoc by a failure-type
  count, not by a controlled context-length ablation.
confidence: low
