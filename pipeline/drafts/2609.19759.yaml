statement: Splitting a task across several agents helps on long-horizon tasks whose parts depend
  on each other sparsely, and hurts on tightly coupled sequential workflows, where generic multi-agent
  methods fall below a single-agent harness because decomposition fragments the dependency chain
  and coordination overhead outweighs the context isolation it buys; as single agents improve
  the collaboration benefit shrinks.
