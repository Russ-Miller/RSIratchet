arxiv_id: "2603.06358"
title: A Scalable Benchmark for Repository-Oriented Long-Horizon
  Conversational Context Management
url: https://doi.org/10.48550/arxiv.2603.06358
drafted_at: 2026-11-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: context-hygiene
statement: In repository-oriented long-horizon conversations (30-70 turns,
  64K-256K tokens), general-purpose memory systems built for ordinary chat
  (MemGPT, LD-Agent, Mem0) score at or below a simple top-k retrieval over
  conversation history on downstream function generation, and attaching
  repository file/function locations to each stored memory so retrieval can
  fetch the linked code is what lifts the memory system above that retrieval
  baseline.
kind: observation
backing_strength: single-paper
scope_condition: 128 LLM-generated conversations over 37 repositories, three
  backbones (GPT-5 mini, DeepSeek-V3.2, Qwen3-235B-A22B); conversations are
  synthetic, with mock user queries generated by an LLM from a query outline.
technique: ""
proposed_technique: Store repository file paths inside each conversational memory
technique_summary: Extends a conversational memory system so each memory entry
  is a text description plus the path locations of associated repository
  artifacts, which are resolved (with fuzzy fallback) to fetch the actual code
  at retrieval time.
technique_kind: retrieval
technique_validated_by: Pass@1 on execution-tested function generation against
  Vanilla RAG, MemGPT, LD-Agent and unmodified Mem0, plus an Empty lower bound
  and an Oracle upper bound, on 128 samples across three backbones; beat the
  best baseline on five of six subset-by-backbone cells (e.g. multi-hop
  DeepSeek-V3.2 37.50 vs 26.88).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A repository-oriented long-horizon benchmark where off-the-shelf
  conversational memory systems match or beat simple query-similarity
  retrieval on execution-tested code generation, or where adding
  repository-path links to memory entries gives no gain over text-only memory.
evidence_note: Measured Pass@1 on 128 synthetic conversations with real
  repository test suites; Vanilla RAG beat all three memory systems in most
  cells, and Mem0R beat it in five of six. Conversations and distractors are
  LLM-generated from a fixed pipeline, so the interaction patterns are
  stylized rather than observed from real developers; the authors propose
  Mem0R and also built the benchmark.
confidence: low
