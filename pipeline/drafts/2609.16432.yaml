arxiv_id: '2609.16432'
title: A light-touch AI literacy intervention helps protect against AI political persuasion
url: https://arxiv.org/abs/2609.16432
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: persuasion
statement: A one-line warning that language models can be prompted to persuade and may present
  information selectively reduced belief change from a persuasive political conversation by
  about half (-48%, CI -60 to -37) across two experiments with 3,208 Americans, without measurably
  reducing general trust in generative AI.
kind: observation
backing_strength: single-paper
scope_condition: Two experiments, political topics, LLM instructed to shift views, 2026; warning
  shown before the conversation; not yet peer reviewed.
technique: ''
proposed_technique: Pre-conversation warning about AI persuasion
technique_summary: Before a user talks with a model that may argue a position, show a brief
  notice that models can be instructed to persuade and may select information; measured as halved
  belief change.
technique_kind: process
technique_validated_by: Belief change with versus without the warning across two experiments
  (N=3,208), with trust-in-AI measured as a side effect.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Warning effects that fade with repeated exposure, or that also halve persuasion by
  accurate information.
evidence_note: Preprint; consistent in size with the intent-disclosure result, which suggests
  the active ingredient is knowing the model is trying to persuade.
confidence: medium
