capability: harness-self-improvement
statement: In a production ads-ranking stack, an agent that chains hypothesis generation, experiment
  execution, result analysis and a shared knowledge store, with human checkpoints at stage boundaries,
  delivered several times the completed ML iterations per engineer-week of the manual baseline
  and a 2.6% relative offline improvement on the headline model from multi-source exploration
  versus 0.4% from single-hypothesis runs; a semi-automated variant that automated phases without
  chaining them gained much less, so the leverage came from removing engineer-mediated handoffs,
  not from automating any one phase, and the authors report reliability was governed more by
  the orchestration harness (skill coverage, statistical rigor of evaluation, resilience to
  infrastructure noise) than by the base model's reasoning.
kind: observation
backing_strength: single-paper
scope_condition: Industrial ads-ranking model portfolio, 2026, one evaluation window; developer-reported;
  throughput multiple stated qualitatively as 'multiple times'; five recurring failure modes
  documented (hallucinated APIs, baseline drift, infrastructure fragility read as divergence,
  over-confident triage from one seed, weaker models pretending to have completed tasks).
