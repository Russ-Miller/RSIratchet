arxiv_id: "2609.06117"
title: "STQA: A Benchmark for Stock-Focused Tabular Question Answering over
  Historical and Forecasted Data"
url: https://arxiv.org/abs/2609.06117
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: On natural-language stock questions that require judging a future
  condition (e.g. whether a price will exceed a threshold next month),
  open-weight 20B-31B LLMs reasoning directly from the retrieved historical
  series answer near chance, and routing the question through an explicit
  SQL-retrieval plus time-series-forecasting toolchain raises accuracy to
  roughly the level of human stock investors.
kind: observation
backing_strength: single-paper
scope_condition: Templated and human-written stock QA over daily OHLC/volume
  tables for 4,417 tickers; four open-weight backbones (Qwen3-30B,
  GPT-oss-20B/120B, Gemma 4-31B); forecaster held fixed (Time-MoE); human
  comparison on a 120-question set with six volunteers.
technique: ""
proposed_technique: Route forecast questions through a forecaster tool instead
  of reasoning from history
stance_on_existing: supports
related_claim_id: forecasting-underperforms-humans-without-scaffolding
stance_reason: Without forecasting scaffolding the models sit near chance on
  forecast-based reasoning, below human investors, and only the tool pipeline
  closes the gap.
falsifier: A study where the same models answering forecast-threshold
  questions directly from historical tables match or beat the toolchain
  pipeline and human investors, or where the direct-reasoning accuracy is well
  above chance.
evidence_note: "Measured: direct-reasoning FR accuracy 50.88-56.67% versus
  59.17-68.33% with the SQFRS toolchain, against 69.17% (investors) and 63.33%
  (non-investors) on a 120-question set. Small human set and only six
  annotators. Ground-truth-forecast injection gave the largest single FR gain
  (+19.85%) yet FR still reached only 86.14%, so forecast quality dominates
  but a reasoning gap remains. The tool arm also gets extra structure (SLU
  labels, fixed workflow), so tool access is not fully isolated."
confidence: medium
