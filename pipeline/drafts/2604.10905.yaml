capability: audio-understanding
statement: For a 7B open audio-language model, answering multiple-choice audio
  reasoning questions by first generating a detailed audio caption and handing
  that caption plus the question to a text-only LLM scores higher than the
  same model answering the audio directly, and higher than its
  chain-of-thought variant, on sound/music/speech reasoning benchmarks.
kind: observation
backing_strength: single-paper
scope_condition: 7B Qwen2.5-backed Audio Flamingo Next variants on MMAU, MMAR
  and MMSU multiple-choice reasoning; captioner model trained for long-form
  captioning; text-only judge was GPT-5.2.
technique: ""
proposed_technique: Caption the audio first, then answer from text alone
technique_summary: Instead of answering an audio question end-to-end, generate
  a detailed caption of the audio with the audio model and pass the caption
  plus question to a text-only LLM.
technique_kind: process
technique_validated_by: MMAU average 75.76 for the captioner pipeline vs 74.20
  direct instruct and 75.01 chain-of-thought; MMAR 63.0 vs 59.7 and 61.0; MMSU
  63.3 vs 59.4 and 61.2. No ablation isolating caption quality from the text
  model's strength.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same benchmarks and backbone, the caption-then-text pipeline
  scoring at or below the direct instruct variant, or the gain disappearing
  when the text-only judge is matched in size to the audio model's own LLM
  backbone.
evidence_note: Measured on three multiple-choice benchmarks, single paper,
  authors' own model family. The comparison confounds the pipeline with the
  use of a separate strong text model (GPT-5.2) as the answerer, so it does
  not isolate whether captioning helps or whether the extra text model does
  the work. Captioner was also not reported on MMAU-Pro.
confidence: low
