arxiv_id: "2608.26592"
title: Benchmarking Clinical Decision Pathway Adherence in Large Language Models
url: https://doi.org/10.48550/arxiv.2608.26592
drafted_at: 2026-10-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: "When medical LLMs are given a clinical practice guideline in
  context and asked to produce the decision pathway a case requires,
  final-outcome accuracy does not track adherence to the guideline-defined
  step sequence: models can reach the right outcome while omitting,
  reordering, skipping or padding steps, and medically fine-tuned models score
  no better on pathway consistency than the general models they were tuned
  from."
kind: observation
backing_strength: single-paper
scope_condition: 16 models on 7,458 cases built from 440 English and Chinese
  guidelines; guideline text supplied in context; pathway consistency measured
  by an LLM judge scoring step matches aggregated with dynamic time warping
technique: ""
proposed_technique: Score the decision pathway, not just the outcome
technique_summary: Extract guideline decision trees into reference step
  sequences, then score a model's generated pathway by LLM-judged step-level
  match aggregated with dynamic time warping against the reference.
technique_kind: process
technique_validated_by: "Pairwise human preference study on 200 sampled
  pathway pairs: the metric agreed with aggregated human preference 90.0% of
  the time, equal to the 90.0% agreement between two annotators; results held
  across three aggregation methods and two judge models (Kendall's W
  0.70-0.87)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that outcome accuracy and pathway consistency rank models
  the same way on this benchmark, or that medically fine-tuned models
  consistently beat their base models on pathway consistency.
evidence_note: Measured across 16 models in single-turn and multi-turn
  settings. Qwen3-235B-A22B had the highest single-turn accuracy (75.81%) but
  not the lowest pathway cost (GPT-5.4 at 28.41%); Baichuan-M3-235B,
  fine-tuned from Qwen3-235B-A22B, had worse pathway cost in both settings.
  Cases and reference pathways are LLM-generated from guidelines with sampled
  human review (<1% flagged), so reference pathways are synthetic rather than
  clinician-authored, and the judge is itself an LLM.
confidence: medium
