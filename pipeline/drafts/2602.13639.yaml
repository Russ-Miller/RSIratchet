arxiv_id: "2602.13639"
title: Guided Collaboration in Heterogeneous LLM-Based Multi-Agent Systems via
  Entropy-Based Understanding Assessment and Experience Retrieval
url: https://doi.org/10.48550/arxiv.2602.13639
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: Pairing a strong guide agent with a much weaker solver agent can
  score below pairing two copies of the weak agent on the same task, because
  the weak solver misreads or discards the strong agent's reasoning chain
  rather than executing it.
kind: observation
backing_strength: single-paper
scope_condition: Two-agent guide-solver pipelines where the solver is a sub-1B
  open model (Qwen-2.5-0.5B, Llama-3.2-1B) and the guide is a frontier model,
  on math reasoning (GSM8K), Python code (MBPP) and vehicle routing (CVRP),
  20-50 sampled items each.
technique: ""
proposed_technique: Scale guidance intensity to the weak agent's response entropy
technique_summary: The strong agent scores the weak agent's reply on five
  weighted entropy components (expression, uncertainty, structure, coherence,
  relevance) and picks light, moderate or intensive guidance against
  thresholds that decay over rounds, with successful collaborations stored for
  TF-IDF retrieval on later problems.
technique_kind: process
technique_validated_by: "Average accuracy across four strong-weak pairs versus
  a no-guidance and a chain-of-thought baseline: GSM8K 45.0 to 64.0 (69.0 with
  retrieval), MBPP 36.5 to 43.5 (46.0), CVRP 65.0 to 71.6 (81.3); CoT
  baselines were 51.0, 43.5, 66.6."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same guide-solver configurations on larger samples with
  matched prompts and finding strong-weak pairs at or above the weak-weak
  baseline on every task, or showing the inversion disappears once the
  weak-weak baseline is sampled at comparable variance.
evidence_note: Measured on small samples (50 GSM8K, 50 MBPP, 20 CVRP) with
  four strong-weak pairs and two weak-weak pairs; the inversion appears on
  GSM8K (SW 45.0 vs WW baseline) and MBPP (GPT+Qwen 20.0 vs Qwen-Qwen 26.0)
  but not CVRP, and no confidence intervals or repeated runs are reported. The
  cognitive-overload explanation rests on one worked example, not an ablation.
confidence: low
