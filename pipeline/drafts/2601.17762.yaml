capability: multi-model-coordination
statement: In an LLM multi-agent pipeline for porting fixes of recurring C
  vulnerabilities, the gain over combining separate detection and
  patch-porting tools comes mainly from a confirmation stage that re-checks
  each static clone-detector hit against the historical CVE's distilled
  analysis points using repository-level lookup tools, not from the role
  decomposition itself.
kind: observation
backing_strength: single-paper
scope_condition: C code, 78 real patch-porting cases across 13 repositories,
  GPT-4o backbone, ReDeBug plus hash-based clone detection held fixed across
  all arms
technique: ""
proposed_technique: Confirm clone-detector hits against ported analysis points
technique_summary: Distil each disclosed CVE into explicit diagnostic analysis
  points, have one agent re-map those points to the candidate site in the
  target repository, and have a second agent verify them using tools that
  fetch function and struct definitions from both repositories before
  accepting the hit as a real vulnerability.
technique_kind: process
technique_validated_by: "Ablation on 114 function-level pairs: removing the
  confirmation stage took false positives from 21 to 223, precision from 76.4%
  to 26.6%, and end-to-end repair accuracy from 57.3% to 17.8%; removing the
  knowledge base instead cost only 21->32 FPs and 57.3%->49.5%. Full system
  beat six detection+repair tool combinations by 31.9-45.2 points of repair
  accuracy."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on comparable recurring-vulnerability data where
  removing the confirmation stage leaves false-positive rate and end-to-end
  repair accuracy roughly unchanged, or where a single-agent prompt given the
  same analysis points and context tools matches the multi-stage pipeline's
  precision.
evidence_note: "Measured, single paper, small dataset (78 cases, 114 function
  pairs, C only, one LLM, temperature 0, one run). Detection tools and
  parameters were held fixed across arms, which isolates the confirmation
  stage well. Weaknesses: baselines are assembled combinations rather than
  tuned systems; repair correctness judged as semantic equivalence to the
  developer patch, likely by the authors; recall is lower than the GPT-4o
  confirmation baseline (59.6% vs 71.1%), so the gain is a precision trade."
