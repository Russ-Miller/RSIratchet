falsifier: On the same vertical-website extraction datasets, decomposed XPath
  induction matches or falls below CoT/Reflexion F1, or its induced XPaths
  fail on unseen pages of the same site at rates comparable to per-page LLM
  extraction.
evidence_note: "Abstract-only evidence: reported F1 gains across multiple
