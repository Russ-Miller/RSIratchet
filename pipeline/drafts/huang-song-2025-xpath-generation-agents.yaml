statement: For extracting fields from vertical websites, decomposing XPath
  induction into separate sub-tasks over a few seed pages lets an LLM emit an
  XPath that generalizes to unseen pages of the same site, beating
  single-prompt CoT and Reflexion XPath generation by 14.84-23.86 F1 points,
  while calling the model only a handful of times instead of once per page.
kind: observation
backing_strength: single-paper
scope_condition: Vertical (single-template) websites with hierarchical HTML
  and repeated page structure; seed pages available for induction.
technique: ""
proposed_technique: Induce XPath from seed pages via multi-task decomposition
technique_summary: Split XPath generation into separate sub-tasks the LLM
  solves over a few seed pages, producing a reusable XPath applied to all
  remaining pages without further model calls.
technique_kind: prompting
technique_validated_by: F1 on several structured web data extraction datasets
  against Reflexion and CoT prompting baselines; 14.84-23.86 point gains, with
  fewer LLM interactions.
