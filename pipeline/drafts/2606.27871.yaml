arxiv_id: "2606.27871"
title: "LocalNav: Distilling Frontier VLMs and Embodied RL for On-Device
  Object Goal Navigation"
url: https://doi.org/10.48550/arxiv.2606.27871
drafted_at: 2026-10-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For a 4B VLM used as the high-level decision-maker in a scene-graph
  ObjectNav pipeline, supervised distillation on a few hundred frontier-model
  reasoning traces installs the navigation skill but leaves outputs verbose,
  and a following closed-loop GRPO stage with an explicit output-length reward
  cuts tokens per query by about 72% and per-episode latency by about 72%
  while success rate does not fall (47% to 49% on a 100-episode HM3D OVON
  subset).
kind: observation
backing_strength: single-paper
scope_condition: Qwen3.5-4B student in a modular scene-graph pipeline with a
  separate PointGoal planner, evaluated under a privileged high-level action
  space on HM3D OVON; latency measured on Jetson Orin AGX with llama.cpp.
technique: ""
proposed_technique: Distill navigation reasoning, then RL a brevity reward
technique_summary: Fine-tune a small VLM on ~500 logged frontier-model
  navigation traces, then run LoRA GRPO in the simulator with a reward
  combining goal progress, exploration, termination correctness and an
  output-length brevity term.
technique_kind: training
technique_validated_by: "Ablation table on a 100-episode HM3D OVON val_unseen
  subset: base 21% SR, SFT-Claude 47% SR at 535 tokens/query, SFT+RL 49% SR at
  149 tokens/query; per-episode runtime on Jetson 305.2s to 86.0s, and 52.5s
  with IQ4-XS quantization. Zero-shot prompt-based brevity alternatives
  reported as either saving no tokens or degrading navigation."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same brevity-rewarded RL stage on an SFT checkpoint and
  finding success rate drops materially, or finding a prompt-only instruction
  that achieves comparable token reduction at equal success rate.
evidence_note: Measured, single paper, one backbone and one benchmark subset
  of 100 episodes; no variance or seeds reported, and the SR difference (47 vs
  49) is within plausible noise for n=100, so the defensible part is the
  token/latency reduction at roughly unchanged SR rather than an improvement.
  Benchmark-split result (34.5% vs 39.7% cloud) is a separate measurement
  under the standard action space.
