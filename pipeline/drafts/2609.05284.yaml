arxiv_id: "2609.05284"
title: "GUT: Quantifying and Optimizing the Reasoning Uncertainty of LLMs via
  Graph Complexity"
url: https://doi.org/10.48550/arxiv.2609.05284
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-step-reasoning
statement: For 0.6B-8B Qwen3 models on math, logic and multiple-choice
  reasoning, quantifying reasoning uncertainty from a directed acyclic graph
  built by sampling several chains and merging semantically equivalent steps
  with an NLI model separates correct from incorrect generations better than
  sequence-level entropy, likelihood and self-prompting uncertainty measures.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3 0.6B-8B; GSM8K, MATH-500, AMC2022-2024, FOLIO,
  MMLU-Pro; ~9-10 sampled chains at temperature 1.0; selective-generation
  metrics (PRR, AUROC, AUPRC)
technique: ""
proposed_technique: Score uncertainty by complexity of a merged reasoning-step graph
technique_summary: Sample several chains of thought, merge semantically
  equivalent steps into a DAG using a bidirectional-entailment NLI model, and
  score uncertainty by graph width, height, or propagated per-step token
  uncertainty.
technique_kind: decoding
technique_validated_by: Selective-generation PRR/AUROC/AUPRC against 45 white-
  and black-box uncertainty baselines across 4 Qwen3 scales and 5 datasets,
  with 1000-fold bootstrap; reported average gains of 11.79% PRR, 13.33%
  AUROC, 9.66% AUPRC over the best contender; ablations show node merging
  carries most of the signal for the propagation variant.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same models and datasets, a sequence-level or self-prompted
  uncertainty baseline matching or beating graph-complexity scores on
  AUROC/PRR, or the graph advantage vanishing once node merging is replaced by
  a trivial grouping.
evidence_note: Measured on 4 Qwen3 scales and 5 datasets against 45 baselines
  with bootstrap error bars; single paper, single model family, and the
  correctness labels come from answer-matching, so transfer to other families
  or to long-form generation is untested. The separate claim that the RL
  optimization module improves accuracy is weakly supported — accuracy gains
  averaged only 1.93% and plain GRPO improved accuracy more.
confidence: medium
