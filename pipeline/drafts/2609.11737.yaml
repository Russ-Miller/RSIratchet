arxiv_id: "2609.11737"
title: "ORCH: Organizational Principles Enable Collective Intelligence in
  Embodied AI"
url: https://doi.org/10.48550/arxiv.2609.11737
drafted_at: 2026-09-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For teams of up to 50 heterogeneous embodied LLM agents in
  simulated wildfire missions, building the manager hierarchy per mission so
  that concurrently executable work sits under a parallel-allocating manager
  and prerequisite-chained work under a phase-advancing manager beats fixed
  decentralized, single-planner, and hybrid coordination architectures on
  mission score and on progress accumulated per step, and the advantage does
  not depend on which base language model is used.
kind: mechanism
backing_strength: single-paper
scope_condition: 25 simulated wildfire-response missions in an extended
  CREW-Wildfire benchmark, 3-50 agents of four types, eight base LLMs, five
  seeds; hierarchy fixed before execution and not restructured mid-mission.
technique: ""
proposed_technique: Match the agent hierarchy to task interdependence
technique_summary: Construct a per-mission manager tree in which horizontal
  managers hand out concurrent assignments to their children and vertical
  managers decompose the mission into ordered phases and advance only when
  completion conditions are met, with reports flowing up and assignments down
  each step.
technique_kind: process
technique_validated_by: "Against four prior embodied multi-agent frameworks
  (CAMON, COELA, HMAS-2, Embodied) on 25 missions x 8 LLMs x 5 seeds:
  human-designed hierarchies improved final score 63.97% and execution
  efficiency (AUC of progress) 74.29% on average, LLM-generated ones 43.63%
  and 52.53%; first-place rank frequency 32.6% vs 5.8-16.2% for baselines;
  Type-II ANOVA showed a significant algorithm main effect and no significant
  algorithm-by-LLM interaction; success rates 35.2-53.1% vs 6.9-13.5%."
stance_on_existing: supports
related_claim_id: splitting-task-across-several-agents-helps-long-horizon-tasks-whose
stance_reason: Both find that whether multi-agent decomposition helps depends
  on the dependency structure of the task, and that matching structure to
  dependencies is where the gain comes from.
falsifier: A replication in which the same worker agents and base models under
  a fixed flat or single-planner architecture match or beat the
  interdependence-matched hierarchy on mission score and progress-per-step, or
  in which the gain appears only for some base models.
evidence_note: Measured on one benchmark family (wildfire response) that the
  authors extended themselves, with six metrics including token and API cost;
  baselines were reimplemented by the authors. Ablations separate
  human-designed, critic-supervised LLM-generated, and uncritiqued
  hierarchies, and tree-shape metrics link compact balanced structures to
  better scores — correlational, not causal. Failure-mode taxonomy was
  produced by an LLM, not human raters, so the mechanism story (fewer
  worker-execution failures) is weakly evidenced.
confidence: medium
