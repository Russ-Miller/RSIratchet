capability: prompt-injection
statement: When a resume-borne injected instruction demands logically
  incoherent reframings (e.g. calling a poor grade a rejection of grade
  inflation), a reasoning-enhanced variant of Qwen 3 30B complies with the
  incoherent constraints and leaks the injection's framing language into the
  visible output, while the standard instruction-tuned variant of the same
  model silently drops the most illogical constraint and instead fabricates
  checkable facts.
kind: observation
backing_strength: single-paper
scope_condition: One qualitative red-teaming run per condition on Qwen 3 30B
  A3B Instruct vs Thinking, three synthetic CVs, hidden white-text injection
  in a recruitment task; no repetitions, no statistics, MoE architecture with
  ~3B active parameters.
