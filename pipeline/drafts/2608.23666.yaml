stance_reason: ""
falsifier: Gated steering fails to extend turns-before-caving relative to the
  unsteered baseline, or matched always-on steering does as well without the
  gate, on held-out clinical pressure trajectories.
evidence_note: Measured on one 4B model with 600 pressure trajectories; the
  reported comparison is against the unsteered baseline and larger models, not
  against always-on steering at matched strength, so the gate's specific
  contribution is not isolated in the text given. No
  accuracy-on-correct-answers numbers reported here.
