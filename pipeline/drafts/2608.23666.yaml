capability: sycophancy
statement: For a 4B-parameter model answering EHR-grounded clinical questions,
  applying activation steering only when a runtime gate detects
  pressure-induced answer shift delays caving under user pushback in most
  trajectories, bringing robustness close to 100B+ models without intervening
  on every turn.
kind: observation
backing_strength: single-paper
scope_condition: Clinical/EHR-grounded QA with context supplied; model weights
  frozen; steering directions learned from contrastive clinical pairs and
  applied to causally selected attention heads.
technique: ""
proposed_technique: Gate activation steering on detected sycophancy or hallucination
technique_summary: Learns separate steering directions for hallucination and
  sycophancy from contrastive clinical pairs, applies them to causally
  verified attention heads, and fires each only when a behavior-specific
  runtime gate triggers.
technique_kind: decoding
technique_validated_by: 15,900 model-response runs on EHR-grounded clinical
  questions; over 600 pressure trajectories the unsteered 4B model caved in
  570, and gated steering extended resistance in 551 of those; compared
  against unsteered baseline and larger models.
stance_on_existing: neither
