evidence_note: Measured on a generated benchmark (gemini3-pro authored
  instances, three sampled distractor intents each, 2% rubric errors
  hand-corrected) across Qwen3 scales plus proprietary models; scoring is
  LLM-as-judge with 200-instance manual audits per model. The scaling
  comparison confounds parameter count with architecture (MoE at the top end)
  and the paper says so. Mechanistic perplexity analysis uses failure cases
  drawn from the worst model, which favors finding a compressed margin.
