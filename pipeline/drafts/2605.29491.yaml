statement: On reference-grounded tasks (translate, polish, extract) where
  benign instruction-like fragments are embedded in the reference text as
  low-salience artifacts, robustness to those distractors falls as model size
  increases within the Qwen3 non-thinking family, dropping from about 66 to
  about 38 macro-average pass rate from 0.6B to 235B across single-turn,
  multi-turn and system-prompt paradigms.
kind: observation
