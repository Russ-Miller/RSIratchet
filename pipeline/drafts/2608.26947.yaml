arxiv_id: "2608.26947"
title: "4DSynth: Controllable Procedural World Synthesis for Dynamic Embodied
  Simulation"
url: https://doi.org/10.48550/arxiv.2608.26947
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For VLM agents doing multi-phase navigation and pick-and-place in
  procedurally generated indoor scenes with moving human obstacles, subtask
  progress runs well ahead of full success — agents reach the first goal and
  then stall or loop after the phase transition — so success rate alone hides
  where the failure is.
kind: observation
backing_strength: single-paper
scope_condition: Two VLM agents (Qwen3-VL-30B-A3B-Thinking, Gemini 3.1 Pro) on
  333 tasks across three tiers varying subtask count and initial target
  visibility, 150-action/50-call budget, kinematic non-reactive human
  obstacles.
technique: ""
proposed_technique: Report subtask progress and trajectory diagnostics, not just success rate
technique_summary: Score embodied navigation episodes on fraction of phases
  completed, final goal distance, collisions and step count alongside binary
  success, so partial progress and post-phase-transition stalls are visible.
technique_kind: process
technique_validated_by: Not measured as an intervention; the paper reports
  that SP exceeds SR on the two-phase tiers (Qwen 35.5% SP vs 18.2% SR on L2;
  15.0% vs 4.5% on L3; Gemini 36.4% vs 23.6% and 27.7% vs 18.2%) and shows a
  trajectory where the agent reaches goal 1 then ends 8.0 m from goal 2.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A benchmark of the same kind where subtask progress and success
  rate track each other closely for several models, i.e. agents that reach the
  first goal almost always complete the second.
evidence_note: Measured on 333 auto-generated tasks in 113 Infinigen Indoors
  scenes, two models only, differing in architecture, training and serving
  stack, so the cross-model comparison is diagnostic not controlled; the
  progress-exceeds-success gap holds within each model on both two-phase
  tiers. No baseline agent or harness ablation isolates whether the stall is
  spatial memory, completion misjudgement, or prompt handling.
confidence: medium
