capability: domain-knowledge
statement: Asked zero-shot to produce future states of fluid and weather
  fields as images, monolithic multimodal foundation models (Banana Pro,
  Seedream 4.5, ChatGPT-Images) produce pixel-space forecasts with very low
  structural similarity to ground truth (SSIM 0.14-0.35 across turbulence,
  ERA5 and SEVIR), so general multimodal competence does not carry numerical
  fidelity for PDE-governed spatiotemporal prediction.
kind: observation
backing_strength: single-paper
scope_condition: Three spatiotemporal forecasting benchmarks (2D turbulence,
  ERA5, SEVIR), 50 samples each, scored in 8-bit PNG pixel space rather than
  on physical tensors.
technique: ""
proposed_technique: Decouple numerical evolution from LLM reasoning
technique_summary: Run a pretrained diffusion simulator to evolve the physical
  field, project its output into topological semantic tokens, and let a frozen
  LLM reason and self-check against retrieved conservation laws rather than
  generate the forecast itself.
technique_kind: architecture
technique_validated_by: RMSE/SSIM/PSNR against trained deep-learning
  surrogates on three benchmarks (reported best on all) and against zero-shot
  monolithic image models in pixel space (SSIM 0.55/0.69/0.71 vs 0.14-0.35);
  no component ablation separating the simulator from the symbolic projector
  or the physics critic.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A general multimodal model prompted zero-shot reaching structural
  similarity comparable to a trained spatiotemporal surrogate on the same
  forecasting benchmarks under the same scoring.
evidence_note: "Measured on 50 samples per benchmark, means with standard
  deviations. The comparison is confounded: baselines are scored in 8-bit
  image space, and the proposed system's advantage is not separable from its
  pretrained diffusion simulator, which the monolithic baselines lack. No
  ablation isolates the symbolic projector or physics critic, so the
  architecture claim is weaker than the deficit claim about monolithic
  models."
