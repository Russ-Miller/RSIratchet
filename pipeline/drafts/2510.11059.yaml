statement: On real C/C++ faults with reproducing tests, 24 current models repair only about
  11% of the 248 bugs and about 6% of the 102 vulnerabilities, far below their Java and Python
  repair rates on comparable benchmarks, and fine-tuning on the benchmark's commit corpus raised
  Pass@k in 21 of 28 comparisons by an average 85% relative, so the gap is partly a training-data
  gap.
