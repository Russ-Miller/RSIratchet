arxiv_id: "2608.03071"
title: "Getting the Parameters Right: A Difficulty-Graded Benchmark and
  Probe-Guided Training for LLM Tool Calls"
url: https://arxiv.org/abs/2608.03071
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: tool-use
statement: For open models (8B-14B) filling structured tool-call parameters, a
  linear probe on the hidden state at the position just before a parameter
  value is written predicts whether that value will be correct better than
  token log-probability (in-domain AUC about 0.986 vs 0.914), and using that
  score to filter self-generated calls for fine-tuning beats self-training
  filtered by log-probability or majority vote.
kind: mechanism
backing_strength: single-paper
scope_condition: Probe must be fit per dataset, model and sampling
  temperature; it degrades outside that setting. Benchmarks adapted so tool
  selection is removed and only parameter filling is scored.
technique: ""
proposed_technique: Filter self-training data with a hidden-state parameter probe
technique_summary: Train a per-layer logistic probe on the hidden state just
  before each parameter value is emitted, then use its score to keep only
  reliable self-generated tool calls for LoRA fine-tuning and to rerank
  sampled candidates at inference.
technique_kind: training
technique_validated_by: "Exact match and field-level F1 across 5 open models
  and 7 benchmarks: average EM 19.7 (0-shot) to 51.6 (seed SFT) to 59.6
  (probe-filtered), above self-training (53.9), log-probability filtering
  (44.2) and majority vote (48.9); probe-filtered beat seed SFT in all 35
  model-dataset pairs; reranking added 4.2-4.6 EM."
stance_on_existing: supports
related_claim_id: linear-probe-tool-calling-models-hidden-state-last-generated-token
stance_reason: Both find hidden-state probes detect incorrect tool-call
  arguments that schema checks pass; this paper moves the read point to before
  each parameter value and acts on the signal.
falsifier: A probe on pre-emission hidden states that does not beat
  log-probability at predicting parameter correctness, or probe-filtered
  self-training that fails to beat log-probability/majority-vote filtering at
  matched data volume.
evidence_note: Measured on 5 open base models across ParamBench plus 6 adapted
  external benchmarks, with matched-count filtering baselines. Does not
  isolate whether the gain survives on already tool-tuned instruct models, and
  the probe is admitted non-transferable across domains.
confidence: medium
