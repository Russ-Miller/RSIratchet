arxiv_id: "2602.18137"
title: Agentic Adversarial QA for Improving Domain-Specific LLMs
url: https://doi.org/10.48550/arxiv.2602.18137
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: When adapting a small open model (LLaMA3-8B) to a small specialized
  corpus with no labelled data, generating synthetic fine-tuning questions by
  iteratively refining them to maximize disagreement between the target model
  and a corpus-grounded strong model yields higher domain-task accuracy than
  entity-extraction, paraphrase or instruction-reformulation synthesis, at a
  fraction of the training tokens.
kind: mechanism
backing_strength: single-paper
scope_condition: Three CUAD contracts within LegalBench (491 questions, 36
  tasks), LLaMA3-8B target, no retrieval or tools at evaluation; a strong LLM
  with the full document in context supplies both the answers and the
  feedback/guidance/revision steps.
technique: ""
proposed_technique: Generate fine-tuning questions that maximize weak-strong answer disagreement
technique_summary: Iteratively rewrites candidate questions about a domain
  document using LLM feedback on where the target model's answer diverges from
  a corpus-grounded expert model's answer, then fine-tunes the target model on
  the final questions paired with expert answers.
technique_kind: training
technique_validated_by: "Accuracy on three contract-specific LegalBench
  subsets: 82.7% average vs 69.5% base model, 79.6% EntiGraph (6.7M tokens vs
  96k), 75.8% non-adversarial LLM-written questions, 71.9% paraphrase, 75.0%
  Knowledge-Instruct; a sensitivity analysis varying refinement iterations
  shows accuracy rising with more steps."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matching the token budget or question count across methods, or
  replacing the disagreement objective with a random or non-adversarial
  refinement loop of equal length, closes the accuracy gap — showing the gain
  comes from extra question-generation compute or the expert answers rather
  than from targeting disagreement.
evidence_note: Measured on one domain (legal contracts), one target model,
  three documents and 491 questions, against four synthesis baselines at
  stated token counts. Token counts differ across arms, so sample efficiency
  is a comparison of each method's natural output volume rather than a
  matched-budget test. The strong model, feedback, guidance and revision
  modules are all the same LLM, so expert-answer quality and adversarial
  selection are not separated.
confidence: low
