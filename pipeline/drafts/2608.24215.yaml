arxiv_id: "2608.24215"
title: "Agentopia on a Consumer GPU: A Reduced-Scale Long-Horizon Port with an
  8B Model"
url: https://doi.org/10.48550/arxiv.2608.24215
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: In a year-long multi-agent social simulation driven by a single
  4-bit quantized 8B model on a 12 GB consumer GPU with five agents, the run
  can be carried to roughly 50-52 simulated weeks before the accumulated
  prompt hits the context limit, while about 10% of finalized activity records
  are left with at least one missing field.
kind: observation
backing_strength: single-paper
scope_condition: Five agents, one apartment world, Qwen3-8B-AWQ served by vLLM
  with a 24,576-token server context limit, three unseeded stochastic runs
technique: ""
proposed_technique: Layered memory compression with four daily activity blocks
technique_summary: Replaces agent-managed scratchpads with a system-managed
  three-layer memory (full logs for recent weeks, ~200-word summaries,
  ~50-word milestones) and splits each simulated day into four plannable
  blocks.
technique_kind: process
technique_validated_by: "Only weakly: a 52-week memory-off run showed L2/L3
  artifacts disappear (an implementation dependency, not a behavioral effect),
  and a single unseeded 10-week M vs M+T comparison showed 2.72x more records
  per agent-week and lower lexical duplication but a higher missing-field rate
  (7.75% vs 1.57%); the authors disclaim causal behavioral claims."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A comparable five-agent, 8B-quantized port that runs well past 52
  weeks without hitting a context boundary, or that shows missing-field rates
  far from ~10%, under the same memory and context settings.
evidence_note: Measured over three independent stochastic runs (154
  system-weeks, 770 agent-weeks, 13,084 activity records) with no fixed global
  seed, no matched 52-week baseline, and incomplete health ablations; the
  completion length and missing-field rate are descriptive
  single-configuration numbers, not attributed to any component.
confidence: medium
