arxiv_id: "2609.18669"
title: "M$^3$P-R1: Reinforcement Learning for Large Language Model Guided
  Multi-Modal Motion Planning via MIP Code Generation"
url: https://doi.org/10.48550/arxiv.2609.18669
drafted_at: 2026-09-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: "For multi-modal robot motion planning stated in natural language,
  the hard part for an LLM is synthesizing the cross-modal coupling (meeting
  points, contact locations, shared intermediate states), not the
  single-modality formulation: giving an LLM fixed expert single-modal MIP
  modules and asking it only to predict the interface variables gives 100%
  single-modal success but 55.6-63.2% multi-modal, below a model fine-tuned
  with solver-verified rewards to write the joint formulation (80.9%)."
kind: mechanism
backing_strength: single-paper
scope_condition: Discretization-based approximate MIP formulations for
  non-convex robotic planning (UAV, IK, footstep, grasp), 1,316-problem
  benchmark, Qwen3-8B base plus SFT and GRPO; static environments only.
technique: ""
proposed_technique: Train an LLM to write solver-checked MIP programs from task text
technique_summary: Supervised fine-tuning on single-modal MIP program
  demonstrations followed by GRPO with rewards for output format,
  discretization-API coverage, successful solver execution, and
  solver-verified trajectory correctness.
technique_kind: training
technique_validated_by: Task success rate on 276 held-out LLMM3PBench problems
  versus prompt-only LLMs (GPT-5.2, Gemini 2.5 Flash, open models),
  PDDLStream, LLM+P, ReAct, sampling-based pipelines, and an Expert-MIP
  module-selection control; plus 40 real hardware scenarios at 87.5%. Reward
  ablations at matched 800-step budget show removing trajectory-correctness
  reward drops SR 84.8 to 50.3.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An LLM given fixed expert single-modal MIP modules and asked only
  to supply interface variables matches or beats an end-to-end
  solver-RL-trained model on multi-modal composition success on this or a
  comparable benchmark.
evidence_note: Measured on one benchmark authored by the same group, one base
  model (Qwen3-8B), three runs. The Expert-MIP control is the design element
  that isolates coupling from module quality; it uses different LLMs
  (Qwen3-8B, GPT-5.2) than the trained model, so backbone and training are not
  fully separated.
confidence: medium
