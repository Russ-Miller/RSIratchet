arxiv_id: "2604.23345"
title: "Bridging Reasoning and Action: Hybrid LLM-RL Framework for Efficient
  Cross-Domain Task-Oriented Dialogue"
url: https://doi.org/10.48550/arxiv.2604.23345
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: In cross-domain task-oriented dialogue with an RL policy,
  LLM-inferred feasibility constraints only help long-horizon success if they
  are both verified by a second LLM role and mapped into ontology-aligned
  slot-value pairs; removing either the verification or the slot grounding
  step drops task success sharply even though the constraints are otherwise
  the same.
kind: mechanism
backing_strength: single-paper
scope_condition: MultiWOZ 2.1 and Frames, ConvLab-2 simulation, PPO policy,
  Qwen2-7B/Qwen1.5-14B/GPT-4o-mini used off-the-shelf as constraint inferrer
  and judge
technique: ""
proposed_technique: Verify LLM constraints by cross-examination, then map to slots
technique_summary: One LLM proposes explicit and implicit cross-domain
  constraints, a second LLM role probes and votes them true/false over up to
  five rounds, and surviving constraints are rule-parsed and
  Sentence-BERT-normalized into database-valid slot-value pairs appended to
  the RL dialogue state.
technique_kind: process
technique_validated_by: Success/Complete rates, dialogue-act P/R/F1 and
  average turns against PPO, ACGOS, GALAXY, GDP-Zero, TransferTOD, CAPID on
  MultiWOZ 2.1 and Frames (best variant 0.7214 and 0.7239 success vs 0.3815
  and 0.4235 for PPO), plus 30-annotator human SR/HR and a four-way ablation
  dropping cross-examination, the slot mapper, RL, or the LLM.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation under the same setup where feeding unverified or
  free-text LLM constraints into the RL state matches the full pipeline's
  success rate, or where the gain survives removal of the slot mapper.
evidence_note: Measured on two benchmarks with five seeds and a four-way
  ablation reported as a figure, not a table, so exact ablation deltas are not
  given in the text. Baselines are prior published systems rather than
  matched-compute reruns, and the LLM modules add inference cost the baselines
  do not pay, which the design does not control for.
confidence: low
