arxiv_id: "2603.24935"
title: "SABER: A Stealthy Agentic Black-Box Attack Framework for
  Vision-Language-Action Models"
url: https://doi.org/10.48550/arxiv.2603.24935
drafted_at: 2026-11-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For LIBERO-trained VLA manipulation policies that exceed 90% clean
  task success, small bounded instruction edits (under 200 characters, found
  by an automated black-box attacker) cut task success by about 20 points,
  lengthen action sequences by about 55%, and raise constraint violations by
  about 33%, with planning-heavy suites (Goal, Long) degrading more than
  perception-heavy ones (Spatial, Object).
kind: observation
backing_strength: single-paper
scope_condition: Six open VLA models (pi-0, pi-0.5, GR00T-N1.5, X-VLA,
  InternVLA-M1, DeepThinkVLA) on LIBERO in simulation; text-only
  perturbations; attacker trained against pi-0.5 and transferred, held-out
  tasks, 5 episodes per task.
technique: ""
proposed_technique: Learn a bounded instruction-edit attacker for VLA red-teaming
technique_summary: A ReAct agent trained with GRPO on rollout-level rewards
  composes character-, token- and prompt-level edits to a robot instruction
  under a character and tool-call budget, using only black-box rollouts of the
  frozen policy.
technique_kind: training
technique_validated_by: "Measured against a frozen GPT-5-mini attacker with
  the same tool interface: comparable or slightly better attack metrics (ASR
  16.7 vs 14.5) with 21.1% fewer tool calls and 54.7% fewer character edits;
  ablation shows GRPO without SFT cold-start drops ASR from 16.7 to 8.7."
stance_on_existing: supports
related_claim_id: vla-manipulation-policies-doing-single-step-action-prediction-libero-observations
stance_reason: Both report that LIBERO-saturating VLA policies are fragile to
  small input perturbations, here on the language channel rather than the
  camera.
falsifier: Running the same bounded-edit attack against these VLAs and finding
  task success, action length and constraint violations essentially unchanged,
  or finding the degradation is concentrated in perception-heavy rather than
  planning-heavy suites.
evidence_note: Measured on LIBERO across six models and four suites with
  clean-rollout baselines per task, three attack objectives. Small test set (3
  held-out tasks per suite, 5 episodes each), simulation only, and the
  attacker was trained on one victim then transferred, so per-model numbers
  are noisy. No human judgement that the edits remain plausible instructions.
confidence: medium
