related_claim_id: holding-task-fixed-only-lengthening-input-degrades-reasoning
stance_reason: Lengthening the user context degrades task quality here too,
  with the paper attributing it to attention dilution in fixed-capacity soft
  attention.
falsifier: A model whose personalization accuracy and privacy-leakage rate
  stay flat or improve as the same user profile is padded from 1K to 256K
  tokens.
evidence_note: Measured on a purpose-built benchmark spanning a wide length
  range with many questions; the paper reports consistent degradation across
  models and argues a theoretical attention-dilution mechanism, but the
  numbers and per-model spread are not given in the abstract, and the design
  does not separate dilution from distractor content added with length.
