arxiv_id: "2603.15888"
title: AsgardBench -- Evaluating Visually Grounded Interactive Planning Under
  Minimal Feedback
url: https://doi.org/10.48550/arxiv.2603.15888
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: "In embodied planning benchmarks, how much a score reflects visual
  grounding depends on the verbosity of action feedback: when failures are
  reported with explanatory messages ('Mug must be in the SinkBasin to
  clean'), text-only agents can match or exceed image-based agents on the same
  tasks, whereas with bare success/failure signals text-only performance falls
  to well under half the image-based rate."
kind: mechanism
backing_strength: single-paper
scope_condition: 108 AI2-THOR tasks with navigation and low-level manipulation
  removed, agents re-planning each turn from images plus action history; holds
  for several frontier and open models (Qwen3-VL, Mistral-Large-3, Maverick),
  while the strongest vision models still gained from images even under
  detailed feedback
technique: ""
proposed_technique: Strip explanatory failure messages to bare success/failure
technique_summary: Restrict environment feedback to a binary success/failure
  signal per action so the agent must infer why an action failed from images
  rather than from text.
technique_kind: process
technique_validated_by: Compared three feedback conditions (none,
  success/failure, detailed) crossed with image and text-only input across
  several models; detailed feedback raised scores for all models and let some
  text-only agents match the image baseline, while the no-feedback condition
  lowered scores.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A benchmark where text-only agents given detailed failure messages
  still score far below image-based agents across models, or where removing
  explanatory feedback leaves the image-vs-text gap unchanged.
evidence_note: Measured on one benchmark (108 tasks, 12 task types) in one
  simulator, across a set of proprietary and open models, with some models
  omitted from some conditions for cost. Figures are described rather than
  tabulated in the source text; no numeric gaps given for the feedback
  crossing. Design isolates feedback richness as the manipulated variable but
  does not separate which content in the message (object visibility vs.
  precondition) supplies the missing state.
confidence: medium
