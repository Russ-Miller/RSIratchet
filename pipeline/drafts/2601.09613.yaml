arxiv_id: "2601.09613"
title: "CogRail: Benchmarking VLMs in Cognitive Intrusion Perception for
  Intelligent Railway Transportation Systems"
url: https://doi.org/10.48550/arxiv.2601.09613
drafted_at: 2026-11-13
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For 6-11B open vision-language models adapted to railway intrusion
  perception from single surveillance frames, fine-tuning one model jointly on
  spatial-position, motion-state and threat-level question-answer pairs beats
  fine-tuning a separate model per task, and both beat the zero-shot
  checkpoints, which sit near chance on all three tasks.
kind: observation
backing_strength: single-paper
scope_condition: Five open VLMs (Qwen2-VL-7B, Qwen2.5-VL-7B,
  LLaMA-3.2-11B-Vision, Yi-VL-6B, LLaVA-NeXT-7B), LoRA tuning, two small
  curated railway datasets (347 and 495 images), multiple-choice answers
  scored by macro F1; motion and threat must be inferred from a single frame
  plus bounding-box/mask visual prompts.
technique: ""
proposed_technique: Fine-tune position, motion and threat jointly, not per task
technique_summary: Merge the position-perception, movement-prediction and
  threat-analysis instruction datasets and LoRA-tune one model on the weighted
  sum of the three task losses instead of training a separate adapter per
  task.
technique_kind: training
technique_validated_by: Macro-F1 on held-out 20% splits of Cog-MRSI and
  Cog-RailSem19, against the same models zero-shot and individually
  fine-tuned; joint tuning won in 17 of 20 model-by-prompt-by-dataset
  configurations, with the best gains +12.6 points over individual tuning
  (Qwen2-VL, 75.31 F1) and +9.8 (Qwen2.5-VL, 76.11 F1).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same joint versus per-task LoRA recipe at matched total
  gradient steps and data volume and finding no advantage for the joint
  variant, or finding the gain disappears once each per-task model gets its
  own tuned hyperparameters.
evidence_note: Measured across 5 models x 2 prompt types x 2 datasets x 3
  tasks, with zero-shot, individual and joint arms. Datasets are small (614
  and 1,536 object instances) and partly synthetic (LVIS objects composited
  into RailSem19 backgrounds). Hyperparameters were held uniform across
  models, which the authors note may disadvantage some architectures; no
  matched-compute control separates joint training from simply seeing more
  data. Several individually-tuned models got worse than zero-shot on motion
  and threat, so the baseline is noisy.
confidence: low
