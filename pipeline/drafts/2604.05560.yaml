arxiv_id: "2604.05560"
title: An Iterative Test-and-Repair Framework for Competitive Code Generation
url: https://doi.org/10.48550/arxiv.2604.05560
drafted_at: 2026-11-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For 7B code models on competitive programming, training a test
  generator that reads the current candidate program before writing tests
  exposes more implementation-specific bugs than a test generator given only
  the problem description, and feeding those tests to an RL-trained repair
  role beats generating many fresh candidates and selecting among them at
  equal inference budget.
kind: mechanism
backing_strength: single-paper
scope_condition: 7B-8B open code backbones (Qwen2.5-Coder-7B, Llama-3-8B),
  Python competitive programming benchmarks, fixed budget of 20 LLM calls per
  problem, training data with ground-truth reference solutions and hidden
  tests for reward.
technique: ""
proposed_technique: Let the test generator read the candidate code, then repair in place
technique_summary: Trains one shared model in four stages —
  execution-reasoning SFT, RL for a Fixer that repairs a candidate from a
  failing test without breaking passing tests, RL for an Auditor that reads
  the repaired candidate and writes a bug-revealing test, then RL re-training
  the Fixer on those tests as hints — and iterates the cycle at inference.
technique_kind: training
technique_validated_by: Pass@1 and average pass ratio on APPS, CodeContests,
  xCodeEval, LiveCodeBench v6 against CURE and Specine on the same 7B backbone
  at matched 20-call budget (average Pass@1 34.66% vs 23.13% CURE, 24.34%
  Specine) plus six ablations; blind-Auditor variant (no candidate code) drops
  average Pass@1 to 30.04%, Stage-B-only to 26.26%.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-budget comparison where giving the test generator the
  candidate code yields no gain in bug-revealing test rate or downstream
  Pass@1 over a description-only test generator, or where repeated
  fresh-candidate generation with selection matches the repair loop at equal
  calls.
evidence_note: "Measured on four benchmarks with two backbones; ablations
  isolate candidate-code access (-4.6 avg Pass@1) and the Auditor loop (-8.4).
  Confounded by the four-stage pipeline: the SFT stage and the shaping reward
  also contribute, and baselines did not get the execution-reasoning SFT.
  Rewards use ground-truth reference solutions, so the setup needs labelled
  training problems."
confidence: medium
