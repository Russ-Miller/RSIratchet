falsifier: A replication with an independent neutral adjudicator and a denser
  win matrix showing LLM configurations ranking as highly on formal
  adjudication as on crowd judgement, or showing the gap is explained by
  sparsity of pairings rather than by argument quality.
evidence_note: "Measured: two Bradley-Terry rankings over the same 22
  interlocutors, 192 adjudicated debates and 1,386 annotation instances with 7
  annotators each; ordinal Krippendorff's alpha between the rankings 0.410.
  Weakly isolated: logical outcomes are self-adjudicated by the debating LLM,
  the logical win matrix is sparse, one high-ranking model never debated a
  human, and the authors report no significance testing. Inter-rater agreement
  on persuasiveness was low (nominal alpha 0.188) though aggregate rankings
  were stable across demographic subgroups."
