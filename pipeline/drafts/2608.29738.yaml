statement: In formal persuasion dialogues on a UK political topic, LLM
  debaters are judged more persuasive than humans by crowd annotators (all
  nine LLM configurations occupied the top nine subjective ranks) while
  ranking far lower under argumentation-theoretic adjudication, where a human
  topped the logical ranking and humans took six of the top ten.
kind: observation
backing_strength: single-paper
scope_condition: 192 debates on a single fixed UK political topic, 22
  interlocutors (13 undergraduates, 9 configurations of GPT-4o, Grok-3,
  Mistral Medium), Bradley-Terry rankings from 9,702 crowd pairwise judgements
  versus self-adjudicated debate outcomes under Prakken's dialogue protocol.
