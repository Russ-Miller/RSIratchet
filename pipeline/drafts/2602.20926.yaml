capability: multi-step-reasoning
statement: "In graph-based RAG for multi-hop QA, filling the retrieved context
  entirely from knowledge-graph reasoning paths is worse than reserving a slot
  or two for plain dense retrieval: on 2Wiki with a fixed 5-passage context,
  accuracy rises steeply as path-derived passages go from 0 to 4 and then
  falls back when all 5 come from paths."
kind: observation
backing_strength: single-paper
scope_condition: Llama-3.3-70B-Instruct backbone with NV-Embed-v2 retriever,
  5-passage context, 2WikiMultiHopQA; single ablation table, one dataset
technique: ""
proposed_technique: Chain triplets into paths, then localize passages by triple index
technique_summary: Seeds retrieval with query-similar knowledge triplets,
  iteratively merges adjacent triplets into beam-pruned 'HyperNode' reasoning
  paths, then scores source passages by a precomputed triple-to-passage index
  weighted by path distance, backfilling remaining context slots with dense
  retrieval.
technique_kind: retrieval
technique_validated_by: Token-level F1 on NQ, PopQA, MuSiQue, 2Wiki, HotpotQA,
  LV-Eval against HippoRAG2, LinearRAG, HyperGraphRAG, NV-Embed-v2 and
  BM25/GTR under HippoRAG2's protocol (avg F1 55.3 vs 54.6 for HippoRAG2),
  plus retrieval latency for 1,000 queries (16.5x-28.8x faster than
  HippoRAG2); ablations over context quota M, expansion hops N, beam size, and
  a second backbone.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same setup, a context built entirely from path-localized
  passages matching or exceeding the mixed 4-of-5 configuration on EM, F1 and
  Recall@5, or the 0-to-4 gain failing to reproduce on other multi-hop
  corpora.
evidence_note: "Measured: one ablation table on 2Wiki sweeping M from 0 to 5
  with total context fixed at 5, reporting EM, F1 and Recall@5 (61.55 F1 at
  M=0, 73.90 at M=4, 73.09 at M=5). The M=5 to M=4 gap is under a point and no
  variance or repeats are reported, so the peak's position is weakly
  established; the large gain over pure dense retrieval is not. Only one
  dataset and one backbone for this ablation."
confidence: low
