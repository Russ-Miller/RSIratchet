falsifier: Manual audit of test-passing patches from these models on a
  comparable benchmark finding that the large majority do implement the
  developer-intended repair semantics and localize the cause correctly, so
  pass rate tracks grounded repair.
evidence_note: Automatic execution evaluation on 832 bugs (plausible-patch
  rate 21.0%-55.9% across four prompt settings) plus stratified sampling for
  human annotation at 95% confidence/10% margin per task-model group; two
  annotators, open coding, kappa 0.82 for repair hallucination but only 0.49
  initially for understanding hallucination, resolved by discussion. The 72.7%
  figure is a pooled sample estimate, not a per-model rate, and
  'hallucination' here is defined as deviation from developer-intended
  semantics, which conflates overfitting with ungroundedness. Association
  between intermediate-artifact accuracy and repair success is correlational
  only.
