capability: hallucination
statement: "In LLM-based program repair on Defects4J bugs with frontier models
  (GPT-5, DeepSeek-R1, Claude Sonnet 4.5) prompted zero-shot, passing the
  developer-written test suite does not mean the patch is grounded in the bug:
  manual inspection of 812 sampled repairs found ungrounded repairs in 72.7%
  of cases including test-passing patches, most often from incorrect causal
  localization (45.9%) rather than a wrong edit style, and the same models
  frequently misidentify the bug-triggering tests and generate additional
  tests that miss the triggering condition."
kind: observation
backing_strength: single-paper
scope_condition: Java single-function-level bugs from Defects4J (832 bugs),
  zero-shot prompting with extracted buggy functions and developer test
  context, no tools or agent loop; three models circa late 2025.
technique: ""
proposed_technique: Multi-layered APR evaluation of intermediate understanding artifacts
