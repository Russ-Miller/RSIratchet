arxiv_id: "2609.04909"
title: Better Understanding, Better Fixes? A Study of Hallucination in
  LLM-based Automated Program Repair
url: https://arxiv.org/abs/2609.04909
drafted_at: 2026-09-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "In zero-shot LLM program repair on Defects4J bugs, passing the
  developer-written test suite does not indicate that the patch is grounded in
  a correct understanding of the bug: manual inspection of sampled repairs
  found ungrounded patches in about three quarters of cases including ones
  that passed all available tests, with incorrect causal localization the
  largest category."
kind: observation
backing_strength: single-paper
scope_condition: Three frontier models (GPT-5, DeepSeek-R1, Claude Sonnet 4.5)
  prompted zero-shot with extracted buggy functions and test context on 832
  filtered Defects4J Java bugs; no agentic tool use or iteration.
technique: ""
proposed_technique: Score intermediate repair artifacts, not just the patch
technique_summary: Require the repair model to also produce checkable
  intermediate artifacts (which tests trigger the bug, which lines execute
  before and after the patch, new bug-exposing tests) and grade those against
  execution evidence as a reliability signal for the patch.
technique_kind: process
technique_validated_by: Artifact accuracy was measured against instrumented
  execution (F1 for triggering-test identification and line coverage, validity
  of generated tests) and compared between Pass and Fail repairs; Pass repairs
  had higher artifact accuracy on average, but the distributions overlapped
  and the paper did not build or evaluate an actual patch-reliability
  classifier.
stance_on_existing: supports
related_claim_id: function-level-algorithmic-tasks-translated-c-model-s-functional-test
stance_reason: Both find that passing functional tests carries little
  information about the deeper quality of model-written code, here about
  semantic correctness and fault localization in patches.
falsifier: A manual audit of test-passing LLM patches on Defects4J finding
  that nearly all implement the developer-intended repair semantics, with
  correct causal localization.
evidence_note: "Measured: automatic execution-based evaluation of all 832 bugs
  plus open-coded manual annotation of 812 sampled repairs stratified across
  nine task-model groups. Plausible-patch rates ran 21.0-55.9%.
  Inter-annotator agreement was high for repair hallucination labels (kappa
  0.82) but low for understanding hallucination labels (kappa 0.49), so the
  intermediate-artifact taxonomy is weaker evidence than the patch-level
  finding. Single benchmark, single language, one sample per instance."
confidence: medium
