capability: embodied-control
statement: "For VLM-driven embodied task planning with an egocentric camera,
  where hazards can fall out of view, the form of the memory handed to a risk
  predictor decides whether safety improves: an object-relation graph that
  retains out-of-view objects and updates edges after actions raises safe
  success rate well above no memory, while feeding the full image history or a
  flat list of seen objects scores below having no memory at all, because
  relationships and structure, not object recall, are what risk prediction
  needs."
kind: mechanism
