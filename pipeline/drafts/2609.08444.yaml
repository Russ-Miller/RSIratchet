scope_condition: GPT-4o planner and risk predictor, IS-Bench household tasks
  modified to a single egocentric RGB-D view plus a 4-task real Franka setup;
  hazards must have been observed at some earlier timestep.
technique: ""
proposed_technique: Object-relation graph memory with risk-predictor replanning
