falsifier: An ablation on the same benchmark in which full-history image
  context or a seen-object list matches the relation graph's safe success
  rate, or in which removing edges/out-of-view retention leaves safe success
  unchanged.
evidence_note: Measured on IS-Bench across four hazard categories (roughly 6
  tasks per category, so small samples) and 10 real-robot runs per task.
  Average SSR 0.59 for graph vs 0.21 without graph memory, 0.13 full history,
  0.38 RAG, 0.17 object list; removing invisible-object retention drops SSR to
  0.21 and removing action-aware edge update to 0.38. Task success rate barely
  moves, so the effect is specific to safety. Single model, small per-cell
  counts, no seeds or variance reported.
confidence: low
