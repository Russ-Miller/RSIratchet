title: "Cortex: A Bidirectionally Aligned Embodied Agent Framework for
  Long-horizon Manipulation"
url: https://doi.org/10.48550/arxiv.2607.05377
drafted_at: 2026-10-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: For long-horizon real-world manipulation (14-subtask chemistry and
  washing procedures), pairing a VLM planner whose output is snapped to a
  fixed library of 32 canonical skill primitives, plus a running text log of
  completed milestones, with a short-memory reactive VLA executor completes a
  majority of multi-stage tasks where the same executor given the raw global
  instruction completes none, while on single-episode simulation benchmarks
  the same architecture gains only a few points over the monolithic baseline.
kind: mechanism
backing_strength: single-paper
scope_condition: Tabletop bimanual manipulation; executor fine-tuned on ~10
  hours of subtask-segmented data; planner fine-tuned on event-balanced
  boundary/execution samples; skill set fixed in advance and shared between
  planner and executor.
technique: ""
proposed_technique: Constrain the planner to the executor's canonical skill library
technique_summary: Standardize subtasks into a fixed set of templated skill
  primitives, train the executor on them, snap the planner's free-text subtask
  output to the nearest primitive by sequence matching, and carry completed
  subtasks forward as a textual memory log.
technique_kind: process
technique_validated_by: Closed-loop success rate over 20 trials on two
  real-world 14-step suites (Cortex 65% and 55% vs 0% for pi-0.5 and pi-mem
  end-to-end; human-planner upper bound 75%/70%), plus 95.5% vs 92.4% on
  LIBERO-Long and 86.8% vs 82.7% on RoboTwin; open-loop ablations show each
  harness component adds score.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An end-to-end VLA with comparable executor training that completes
  a similar share of these 14-step tasks from the raw global instruction, or a
  planner emitting unconstrained free-text subtasks to the same executor
  matching the constrained-library success rate.
evidence_note: Measured, but the real-world result rests on 20 trials per
  suite on one robot platform with tasks designed by the authors to defeat
  reactive execution; the 0% baseline makes the contrast large but
  uninformative about magnitude. Ablations are on the open-loop LLM-judged
  planner score, not on closed-loop success, so the contribution of the
  skill-library constraint versus the memory log versus the fine-tuning data
  is not isolated in the closed loop. Simulation gains (+3.1, +4.1) are small
  and from a single run set.
confidence: medium
