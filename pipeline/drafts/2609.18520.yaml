arxiv_id: "2609.18520"
title: "AeroWeaver: An Embodied-Agent Harness for Weaving Aerial Skills into
  Distributed, Adaptive Swarm Execution"
url: https://doi.org/10.48550/arxiv.2609.18520
drafted_at: 2026-09-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For LLM-driven multi-UAV swarm tasks in simulation, binding one
  agent to each vehicle with a role-conditioned subset of the skill catalog
  and directed peer messages yields higher episode returns than a central
  planner that sees pooled team state and the full skill list, and ablations
  attribute most of the gain to the skill-subset restriction and the peer
  reports rather than to the experience-based reward correction.
kind: observation
backing_strength: single-paper
scope_condition: Nine MPE-inspired AirSim tasks, fixed 22-skill catalog,
  DeepSeek-V4-Flash backbone, 10 episodes per task-condition pair; simulation
  only, no physical UAVs.
technique: ""
proposed_technique: Role-conditioned per-vehicle skill subsets with peer messaging
technique_summary: A harness parses the mission, assigns each UAV a role,
  exposes only the top-ranked skills for that role to a vehicle-bound agent,
  and lets agents exchange directed peer messages while a commander holds no
  flight authority.
technique_kind: process
technique_validated_by: Mean undiscounted episode return over 10 episodes on
  nine tasks against a centralized planner and HMAS-2, plus per-component
  ablations (no activation, no coordination reports, reward weight zero) and
  per-episode token counts.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the centralized full-catalog planner matches or
  beats the distributed role-conditioned harness on the same tasks and
  backbone, or where removing skill activation and peer reports costs less
  return than removing the reward correction.
evidence_note: Measured on nine simulated tasks, 10 episodes each, with two
  baselines and three ablations; returns reported as means with small SDs but
  no significance tests, and the ablation scores come from an affine rescaling
  the paper defines itself. Single paper, single lab, one main backbone; no
  physical execution.
confidence: low
