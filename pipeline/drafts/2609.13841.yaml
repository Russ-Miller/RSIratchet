technique_kind: ""
technique_validated_by: ""
stance_on_existing: supports
related_claim_id: mistaken-user-pushes-back-adaptively-up-25-turns-frontier
stance_reason: It finds sycophancy on some dimensions growing with an
  additional dialogue turn, so single-turn measurement understates it.
falsifier: A replication on the same or similar prompt set showing mood
  variants differ systematically in sycophancy scores, or showing framing and
  moral sycophancy flat or falling from first to follow-up turn.
evidence_note: Measured on 9,600 responses across 8 structural variants, two
  models, with human annotation and validated LLM judges; but judge-human
  agreement was poor on the framing dimension (deltas up to 0.50), moral
  sycophancy was human-scored only, and no significance testing or confidence
  intervals are reported, so the turn-to-turn percentage changes are
  suggestive rather than established.
