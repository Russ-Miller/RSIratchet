capability: sycophancy
statement: In open-ended romantic-advice prompts to consumer chat models,
  varying grammatical mood (declarative, conditional, interrogative,
  imperative) produces no systematic change in social sycophancy, while the
  perspective the prompt presupposes does, and acceptance of the user's
  premises and moral stance rises from the first response to a follow-up turn
  even when the follow-up question is neutral.
kind: observation
backing_strength: single-paper
scope_condition: 2,400 English prompts across five relationship themes, GPT-5
  Mini and Gemini 3 Flash, responses capped at 100 tokens, one follow-up turn
  only, ELEPHANT dimensions scored by human annotators plus LLM judges
technique: ""
proposed_technique: ""
