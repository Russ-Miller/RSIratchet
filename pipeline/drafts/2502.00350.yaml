statement: Constraining a localization agent with a priority queue over candidate code regions
  scored for relevance, decomposition of each search action, and pruning of context by distance
  from the issue's anchors reached a 65% function-level match rate on SWE-bench Lite, the best
  open-source result at the time, and feeding its locations to an open-source repair pipeline
  raised the resolved rate by about 6 points.
kind: observation
backing_strength: single-paper
scope_condition: SWE-bench Lite, 2025, function match rate against ground-truth patches; integration
  test with one open-source framework.
technique: ''
proposed_technique: Priority-scheduled search with distance-aware context pruning
technique_summary: Keep a scored queue of code entities to inspect, let the model decompose
  each search into smaller lookups it scores for relevance, and drop context whose graph distance
  from already-relevant anchors is large, so the agent spends its budget near the likely edit
  site instead of wandering.
technique_kind: process
technique_validated_by: Function, file and class match rates on SWE-bench Lite against prior
  open-source localizers, with ablations removing scheduling, decomposition and pruning; downstream
  resolved-rate change when its output replaces the baseline's localization.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Benchmarks where issues name no anchors (so distance pruning has nothing to anchor
  on) and the constrained search underperforms free exploration.
evidence_note: One benchmark; ablations are present. The match-rate metric rewards finding the
  patched function but not knowing when to stop, so a broad candidate set can score well.
