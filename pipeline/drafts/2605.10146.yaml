arxiv_id: "2605.10146"
title: Benchmarking Safety Risks of Knowledge-Intensive Reasoning under
  Malicious Knowledge Editing
url: https://doi.org/10.48550/arxiv.2605.10146
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: knowledge-updating
statement: When counterfactual, biased or unsafe facts are injected into 7-8B
  open instruct models by knowledge editing, the edit is recalled on
  single-hop queries far more often than it changes the final answer of
  multi-hop questions that depend on it (e.g. edit-wise success near 100% with
  multi-hop accuracy around 16-48%), while scores on general knowledge and
  reasoning benchmarks stay within about a point of the pre-edit model.
kind: observation
backing_strength: single-paper
scope_condition: 7-8B open instruct models (Llama3, Mistral, Qwen2.5) plus
  GPT-3.5/GPT-4/DeepSeek-R1, using parameter editing (ROME, MEMIT, KN) and
  in-context editing (IKE, WISE, MeLLo, DeepEdit, PokeMQA) on RippleEdits,
  MQuAKE-CF/T, EditAttack and BehaviorBench; multi-hop accuracy also falls as
  the number of batched edits grows.
technique: ""
proposed_technique: ""
technique_summary: ""
technique_kind: ""
technique_validated_by: ""
stance_on_existing: supports
related_claim_id: knowledge-editing-methods-such-rome-fine-tuning-insert-stated-fact-reliably
stance_reason: It reports the same gap between a reliably inserted edit and
  its multi-hop consequences, here across more editing methods and risk
  categories.
falsifier: An editing method whose multi-hop answer accuracy approaches its
  edit-wise success rate on MQuAKE-CF under the same models, or a benchmark
  showing injected edits visibly degrade BoolQ/GSM8K/NLI scores.
evidence_note: Measured across three open 7-8B models and three closed models
  with five to nine editing methods on four unified datasets; edit success,
  portability, locality and multi-hop accuracy are reported pre- and
  post-edit, and stealth is shown by four general benchmarks averaged over
  five sequential edits. Design does not isolate whether the multi-hop gap is
  a propagation failure or a baseline multi-hop reasoning limit, since
  pre-edit multi-hop accuracy is also low (12-22%).
confidence: medium
