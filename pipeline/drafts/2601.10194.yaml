capability: multi-model-coordination
statement: For tensor network quantum simulation tasks with a specialist
  Python package thinly covered in pretraining, embedding ~43k tokens of
  curated package documentation in the system prompt is the larger of two
  gains, and splitting the workflow into seven role-specialized agents with
  isolated contexts adds a further gain on top of it, across DeepSeek-V3.2,
  Gemini 2.5 Pro and Claude Opus 4.5.
kind: observation
backing_strength: single-paper
scope_condition: Three benchmark tasks (2D transverse-field Ising DMRG,
  sub-Ohmic spin-boson TDVP dynamics, retinal photoisomerization), 5 runs each
  per model-configuration, scored 0-10 by the authors' own rubric; baseline
  agent had to grep the package source instead of reading curated docs.
technique: ""
proposed_technique: Curated package docs in prompt plus role-split simulation agents
technique_summary: Put a hand-curated subset of a scientific package's
  tutorials, examples and source snippets directly into the system prompt, and
  route the simulation workflow through a conductor plus seven
  context-isolated agents (strategist, guide, programmer, executor,
  aggregator, validator, visualizer).
technique_kind: process
technique_validated_by: 0-10 rubric scores over 3 tasks x 5 runs x 3 LLM
  backends against a no-documentation single-agent baseline and a
  documentation-only single-agent baseline; multi-agent reached ~90% success
  overall, DeepSeek-V3.2 averaging 9.47 with 87% perfect runs, Gemini 2.5 Pro
  rising from 0.87 baseline to 8.13; score deductions decomposed by error
  type.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison in which the documentation-only single agent
  scores as well as the multi-agent configuration on these tasks, or in which
  the baseline agent given tool access to the full source reaches comparable
  scores without curated documentation.
evidence_note: "Measured, but small: 5 runs per cell, scored by a rubric the
  authors designed, with no inter-rater reliability reported and no compute-
  or token-matched control (the multi-agent arm also spends far more tokens).
  Failure-mode decomposition is author-assigned. Effect sizes differ sharply
  by backbone, and Claude Opus 4.5's residual failures are malformed tool
  calls rather than reasoning errors, which the architecture does not
  address."
