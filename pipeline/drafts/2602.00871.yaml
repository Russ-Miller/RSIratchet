arxiv_id: "2602.00871"
title: "Beyond Output Critique: Self-Correction via Task Distillation"
url: https://doi.org/10.48550/arxiv.2602.00871
drafted_at: 2026-11-19
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For LLM self-correction on reasoning tasks with no external
  verifier, having the model first distill the problem into a structured task
  abstraction (key variables, constraints, problem structure) and then
  re-solve from that abstraction yields more reliable refinement than
  critiquing and patching the output text, and the abstraction written by a
  larger model can be handed to a smaller model that cannot self-correct on
  its own.
kind: mechanism
backing_strength: single-paper
scope_condition: Reasoning tasks where an initial response exists and no
  ground-truth verifier is available; claimed for both large and small models,
  with cross-model transfer of the abstraction tested for small models.
technique: ""
proposed_technique: Abstract the task before refining the answer
technique_summary: Before revising an answer, the model rewrites the problem
  into a structured template of variables, constraints and structure, and then
  re-instantiates a solution from that template instead of editing the
  previous output.
technique_kind: prompting
technique_validated_by: Accuracy, robustness and generalization across several
  reasoning tasks against self-correction baselines that critique the output;
  the source text reports direction of improvement but gives no numbers,
  baselines by name, or task list.
stance_on_existing: supports
related_claim_id: self-critique-without-grounding-unreliable
stance_reason: The paper's starting premise, and its motivation for moving the
  intervention upstream, is that ungrounded output-level critique patches
  surface errors and misses reasoning flaws.
falsifier: On the same reasoning tasks and models, a matched-compute
  output-critique refinement loop equals or beats abstraction-then-re-solve in
  accuracy, or small models given a large model's abstraction do no better
  than their own self-correction.
evidence_note: Argued and reported as measured, but the available text gives
  no numbers, no named baselines, no task names and no compute-matched
  control, so the size of the effect and whether it comes from the abstraction
  rather than from extra tokens is not established.
confidence: low
