proposed_technique: Actor-judge-editor RL on solver feedback for NL-to-PDDL
technique_summary: Have the model propose a PDDL formalization, judge it with a solver-calibrated
  score, and edit it under bounded diagnostic feedback, training all three roles with reinforcement
  learning from solver outcomes rather than annotations.
technique_kind: training
technique_validated_by: PlanBench success, faithful-success and semantic-drift rates against
