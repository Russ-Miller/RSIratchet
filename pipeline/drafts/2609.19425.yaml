arxiv_id: "2609.19425"
title: Closed-World Resolution Against Tool Hallucination in LLM Agents
url: https://arxiv.org/abs/2609.19425
drafted_at: 2026-09-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When tool-augmented agents emit calls over an unconstrained
  raw-JSON surface rather than a schema-enforcing function-calling API, every
  tested hosted model fabricates tool names or undeclared arguments at rates
  of roughly 13-57%, and parameter count does not reduce this — an 8B and a
  675B model hallucinate at comparable raw-JSON rates.
kind: observation
backing_strength: single-paper
scope_condition: Ten hosted Bedrock models (Claude, Nova, GPT-OSS, Llama-3.1,
  Mistral families), 60 adversarial probes per model per surface, a synthetic
  100-tool registry with 10 tools exposed; low rates on the schema surface for
  Claude models are partly refusal rather than safe compliance.
technique: ""
proposed_technique: Reject tool calls that do not resolve to a registered tool and signature
technique_summary: Before any permission gate, check each emitted call's name
  against the closed-world tool registry and type-check its arguments against
  the declared signature, rejecting anything unresolved.
technique_kind: tooling
technique_validated_by: On 322 live-model hallucinations and 400 scripted
  trials per class, the resolver rejected all H1-H3 cases while a gating-only
  stack executed them; but both the 322/322 execution and the 0/322 rejection
  are by-construction consequences of the fail-open threat model, and zero
  honest over-rejection is measured on the resolver's own honest-call
  generator, so only the emission counts are independent evidence.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same adversarial probes and finding fabricated-tool and
  undeclared-argument rates on a raw-JSON surface fall sharply with model
  scale within a family, or that raw-JSON and schema-enforced surfaces produce
  comparable emission rates once refusals are accounted for.
evidence_note: "Measured: 322 classified hallucinations across ten hosted
  models and two invocation surfaces, 60 probes per model per surface, on a
  single synthetic 100-tool registry. Point estimates with no confidence
  intervals or seed variation, and prompts were adversarially designed to
  induce each class, so absolute rates are not base rates for ordinary use.
  The surface-versus-scale contrast is the part the design isolates."
confidence: medium
