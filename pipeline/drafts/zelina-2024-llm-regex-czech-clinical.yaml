statement: For inducing regular expressions from a handful of labelled
  examples (entity spans in Czech clinical notes), prompting an LLM and then
  iteratively refining the pattern against match failures extracts entities
  more accurately than genetic-programming regex induction, with the margin
  largest when few examples are available.
