statement: "For LoRA-ensemble credal commitment rules on 7-9B instruct
  backbones, the decision to commit tracks agreement among the adapters rather
  than whether a request should be answered: on AdvBench harmful prompts the
  ensembles commit more often (33-97%) and with higher lower-bound confidence
  than on benign Dolly instructions, because safety training makes refusal the
  unanimous first continuation."
