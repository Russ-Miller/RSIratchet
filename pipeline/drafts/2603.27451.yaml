arxiv_id: "2603.27451"
title: Multi-Agent Dialectical Refinement for Enhanced Argument Classification
url: https://doi.org/10.48550/arxiv.2603.27451
drafted_at: 2026-11-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For argument component classification on the UKP Student Essays
  corpus, a Proponent-Opponent-Judge debate that forces two agents to defend
  the two most probable labels beats vanilla and chain-of-thought prompting by
  a wide margin (78.5/79.2 to 85.7 Macro F1), but beats a single strong
  reasoning model given the same label definitions and judging rules by only
  0.8 points, so nearly all the gain comes from supplying the structural
  decision rules rather than from the debate.
kind: observation
backing_strength: single-paper
scope_condition: Three-class argument component classification
  (MajorClaim/Claim/Premise) on one 80-essay test split, Gemini 2.5 Flash
  debaters with a Gemini 2.5 Pro judge, two debate rounds, no training.
technique: ""
proposed_technique: Debate the two most probable labels, then judge
technique_summary: A manager model scores the label distribution, the top two
  labels are randomly assigned to two debater agents who argue for them over
  two rounds, and a stronger judge model reads the transcript and picks the
  label.
technique_kind: prompting
technique_validated_by: Macro F1, weighted F1 and per-class F1 on the
  1,266-component UKP test split against vanilla prompting, chain-of-thought,
  and a single stronger reasoning model given the judge's own prompt; MAD-ACC
  85.7 vs 84.9 for the single reasoning agent, 79.2 CoT, 78.5 vanilla, and
  89.5 for a fine-tuned supervised reference.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run where the debate framework beats a matched single-agent
  baseline given the same label definitions and judging prompt by a margin
  that holds across seeds and datasets, or an ablation showing the
  single-agent rule-equipped baseline cannot reach within a point of the
  debate score.
evidence_note: Measured on one corpus, one test split, one model family,
  single run with no seeds or confidence intervals; the 0.8-point margin over
  Baseline C is unaccompanied by variance estimates, and the Claim-F1 gain
  (72.5 to 74.5) is the component carrying it. Qualitative case studies are
  illustrative, not quantified.
confidence: medium
