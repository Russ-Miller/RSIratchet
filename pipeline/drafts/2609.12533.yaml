arxiv_id: "2609.12533"
title: "Earth-Agent-Pro: Towards Real-World Full-Chain Earth Observation with
  Agents"
url: https://doi.org/10.48550/arxiv.2609.12533
drafted_at: 2026-09-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: "For LLM agents that must compose and then execute domain tool
  workflows, training separate adapters for the two roles splits the gains
  cleanly: supervised fine-tuning of the planner on reference tool sequences
  mainly improves workflow-order fidelity, while node-level RL on
  argument-match rewards mainly improves tool-argument grounding and
  final-answer quality, and combining both beats either on a 9B backbone."
kind: mechanism
backing_strength: single-paper
scope_condition: Small open-weight backbones (Qwen3.5-4B/9B) on
  Earth-observation agent tasks with expert-authored skills constraining the
  tool space; measured only in this framework.
technique: ""
proposed_technique: Train planner and executor as separate role adapters
technique_summary: Fit one LoRA adapter by sequence-level SFT on reference
  tool sequences for workflow planning and a second by node-level GRPO with
  argument-match rewards for runtime argument grounding, so workflow errors
  and argument errors get separate credit.
technique_kind: training
technique_validated_by: "On Earth-Bench-Pro, the 2x2 adapter composition:
  base/base 38.31% LLM-as-Judge, planner-tuned only 44.76%, executor-tuned
  only 43.15%, both 50.00%; planning-only evaluation raised TIO from 71.87 to
  83.35, and oracle-plan executor evaluation raised judge accuracy from 46.37
  to 52.82 and parameter accuracy from 34.19 to 37.20."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation where planner-only tuning improves argument grounding
  as much as executor-only tuning (or vice versa), or where a single
  monolithic trajectory-level fine-tune matches the combined two-adapter
  configuration on both workflow-order and answer metrics.
evidence_note: Measured on 248 open-world EO tasks with one model family
  (Qwen3.5-4B/9B) and one framework; isolation is reasonably clean because the
  paper adds planning-only and oracle-plan evaluations on top of the 2x2
  adapter grid. Judge-based accuracy metric; no compute-matched
  monolithic-training baseline, so the benefit of role separation specifically
  is argued more than proven.
confidence: medium
