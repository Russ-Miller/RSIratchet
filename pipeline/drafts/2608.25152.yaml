arxiv_id: "2608.25152"
title: Belief Cascades Drive Persuasion in LLM Agent Networks
url: https://doi.org/10.48550/arxiv.2608.25152
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: "In simulated networks of LLM agents where one or two agents are
  instructed to advocate a position, the messages other agents write
  understate how far their elicited stance has moved: they mirror the
  persuader's rhetorical framing in most messages while explicit stance-change
  language is rare, so monitoring only generated text misses belief movement
  that a repeated token-probability probe detects."
kind: observation
backing_strength: single-paper
scope_condition: Four backbones (GPT-4o, GPT-4.1, Gemini-2.5-Flash,
  Gemini-2.5-Pro), five SNAP Twitter ego-networks of 18-42 nodes, 55 English
  policy statements, 10 rounds, fixed nine-action vocabulary, two random
  seeds; beliefs measured by a seven-point token-probability probe, not
  validated against humans.
technique: ""
proposed_technique: Audit agent influence with belief probes and exposure logs
technique_summary: Instead of reading agent messages, score each agent's
  stance after every round with a fixed token-probability probe and log who
  saw which content from whom, so influence can be attributed to direct or
  peer-relayed exposure.
technique_kind: process
technique_validated_by: Across 4,400 runs, per-exposure OLS regressions linked
  direct and peer-mediated exposure counts to next-round probe change (direct
  signs stable across all four backbones under two competing persuaders;
  peer-mediated PR2 exposure significantly negative on all four), whereas text
  markers showed 0.18% explicit reversals; no comparison against a
  human-judged ground truth of influence.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run where classifier or human reading of agent message text
  recovers the same stance movements the probe detects — comparable rates of
  explicit stance change to probe-measured crossings — or where probe movement
  without corresponding text change fails to replicate on other backbones.
evidence_note: Measured over 4,400 runs across 2 settings, 5 graphs, 4 models,
  55 statements, 2 seeds. Marker annotation of PE text plus a GPT-5-mini
  Cialdini classifier (87.3% human-verified). Only two RNG seeds and five
  graphs, priors correlated with graph position by construction, no human
  persuasion baseline, so the design shows association rather than causal
  effect and percentages are descriptive.
confidence: medium
