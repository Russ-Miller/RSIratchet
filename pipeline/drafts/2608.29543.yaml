falsifier: A model that asks for clarification often and, with the first
  ambiguity layer pre-resolved, identifies the dependent second layer at a
  high rate (e.g. above 50%), showing the limit is clarification policy rather
  than identification.
evidence_note: Measured on 1,542 constructed samples with a paired factorial
  design controlling for anchor schema and difficulty; identification is
  judged by a validated LLM user simulator's router labels, so the measure
  depends on simulator fidelity. Low absolute numbers across all models leave
  little room for an artifact-free reading, and the primed protocol isolates
  layer-two failure from layer-one cascade.
