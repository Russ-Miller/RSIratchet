statement: "In multi-turn text-to-SQL where an underspecified question hides
  two dependent clarification layers, current LLM agents almost never surface
  both layers (joint identification under 5% for all 12 models tested), and
  this is not explained by how often they ask: ask rates spanning under 10% to
  over 60% all produce joint identification below 4%, and second-layer
  identification stays low (1.2-13.8%) even when the first layer is
  pre-resolved for them."
kind: observation
backing_strength: single-paper
scope_condition: TIDE-Bench, 514 anchor SQLs from BIRD, two-layer chains only,
  chain-then-drift order, LLM user simulator; 12 models including
  Claude-Sonnet-4.6, GPT-4o, Qwen2.5-72B.
