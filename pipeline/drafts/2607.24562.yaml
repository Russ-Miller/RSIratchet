arxiv_id: "2607.24562"
title: Hierarchical Group-Conditional Conformal Risk Control for Selective
  Prediction in Language Models
url: https://doi.org/10.48550/arxiv.2607.24562
drafted_at: 2026-10-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: "When selective prediction thresholds are calibrated once over a
  whole calibration set, the resulting marginal risk guarantee does not hold
  per subgroup: under a moderate shift toward harder inputs at test time,
  global conformal risk control exceeded the per-group error budget in 32-47%
  of bootstrap trials for 4-8B instruct models on multiple-choice QA, while
  calibrating a separate threshold per difficulty group removed the
  violations."
kind: mechanism
backing_strength: single-paper
scope_condition: Multiple-choice QA (ARC Challenge) with selected-option NLL
  as the uncertainty score, three 4-8B instruct models, alpha=0.10,
  delta=0.05, 500 bootstrap trials; holds under both endogenous
  (NLL-percentile) and exogenous (reference-model) difficulty bins, and fails
  for a model whose scores rank examples poorly (Gemma-3-4B stayed at 11%
  violations even groupwise).
technique: ""
proposed_technique: Calibrate one abstention threshold per node of a group hierarchy
technique_summary: Post-hoc calibration that fits a Clopper-Pearson-certified
  abstention threshold for every node of a user-defined group hierarchy with a
  Bonferroni-corrected confidence level, routing each example to the deepest
  certified node whose threshold it passes and falling back to coarser nodes
  otherwise.
technique_kind: process
technique_validated_by: "Measured on ARC Challenge over 500 bootstrap trials
  against always-answer, fixed-threshold, global CRC and flat groupwise CRC
  baselines: violation rate 0.000 and worst-group excess risk 0 for Qwen3-4B
  and Llama-3.1-8B (vs 9-11% for global CRC), at a participation cost of
  22.0-37.1 percentage points; ablation shows removing the difficulty level
  returns violations to 11%."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A setup where global CRC's per-group violation rate stays at or
  below delta under comparable group-composition shift, or where per-group
  thresholds give no reduction in violations relative to a single global
  threshold.
evidence_note: "Measured on two benchmarks and three 4-8B models, 500
  bootstrap trials with 50/50 calibration/test resampling. The mixture-shift
  experiment is a constructed shift (hard share 1/3 to 0.50), not an observed
  deployment shift. Baseline global CRC already violates at 9-11% in the IID
  setting from small calibration sets (~586 examples), which the authors flag
  as a caveat propagating into all comparisons. The hierarchical method's zero
  violation rates are empirical upper bounds of about 0.6% at this trial
  count, and are benchmark-specific: on MMLU-Pro these models abstain almost
  entirely."
confidence: medium
