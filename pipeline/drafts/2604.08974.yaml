falsifier: A study showing that post-SFT calibration (PRR or AUROC) of these
  metrics is predictable from pre-SFT calibration, or that calibration changes
  are small and consistently signed across tasks, models and SFT budgets.
evidence_note: "Measured over 216 metric-model-task configurations (12 metrics
  x 6 models x 3 datasets, 3 seeds): PRR degraded in 112 cases (43
  significant) and improved in 104 (47 significant) under one-way ANOVA with
  Holm correction. A downstream TruthfulQA case study showed AUROC for
  detecting correct answers fell in 35/72 cases. Mechanism support is
  indirect: small but significant positive association between confidence and
  similarity to training data on SQuAD and GSM8K, plus epoch-wise upward drift
  of average log probability regardless of quality. Only two metrics were
  analysed mechanistically, and tasks exclude summarization and dialogue."
