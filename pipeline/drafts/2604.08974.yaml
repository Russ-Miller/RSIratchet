statement: For probability- and self-consistency-based confidence metrics on
  NLG tasks (translation, QA, math), supervised fine-tuning moves calibration
  substantially in either direction and the direction cannot be anticipated
  from the pre-SFT model, because the scores also track proximity to the
  training distribution rather than output quality alone.
