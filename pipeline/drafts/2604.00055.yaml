evidence_note: "Measured: ablation table over three tasks (Fetch, ObjectNav,
  ObjNavAff) separating base, self-certainty, VLM, and full. Gaps are small
  (e.g. ObjectNav 85.0/67.6 base to 87.6/77.7 full) and no seeds or error bars
  are reported, so the claimed division of labour rests on a few points of
  difference. Two of five tasks were excluded from the ablation. The 56-point
  headline is against the imitation-only policy, not against RL baselines."
