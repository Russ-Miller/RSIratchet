capability: embodied-control
statement: When RL-finetuning an imitation-pretrained mobile-manipulation
  policy on long-horizon CHORES tasks, a policy-self-certainty intrinsic
  reward and a VLM-progress-initialized value function contribute to different
  axes — self-certainty mainly raises success rate (notably on
  out-of-distribution tasks) while VLM value initialization mainly raises
  episode-length-weighted efficiency — and either alone recovers most of the
  combined gain over sparse reward.
kind: observation
backing_strength: single-paper
scope_condition: Discrete 20-action space, SPOC pretrained policy, PPO
  finetuning, CHORES simulated household tasks; only one benchmark tested,
  continuous-action manipulation untested.
technique: ""
proposed_technique: Use VLM progress only to initialize the value function, then self-certainty
technique_summary: An LLM decomposes the task into scene-graph-grounded
  subgoals, a VLM scores per-step progress (median-filtered against
  hallucinated spikes) for a brief value-function initialization phase, after
  which PPO finetunes using only policy self-certainty plus sparse task
  success.
technique_kind: training
technique_validated_by: Success rate and Success-weighted-by-Episode-Length on
  CHORES held-out houses against FLaRe, PIRLNav, JSRL, SPOC; up to 56 points
  absolute over the pretrained policy, up to 5 points over FLaRe
  in-distribution, up to 10 points out-of-distribution; a four-way ablation
  (base / self-certainty / VLM / both) on three tasks.
