arxiv_id: "2601.22735"
title: "MM-THEBench: Do Reasoning MLLMs Think Reasonably?"
url: https://doi.org/10.48550/arxiv.2601.22735
drafted_at: 2026-11-12
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: In reasoning MLLMs on multimodal QA, hallucinations in the
  intermediate chain of thought are dominated by perception errors, yet
  perception-only hallucinations track final-answer correctness weakly while
  reasoning-dimension (and mixed perception-plus-reasoning) hallucinations are
  much more frequent on wrong answers than on right ones.
kind: observation
backing_strength: single-paper
scope_condition: 14 current reasoning MLLMs (open and closed) on 1,340 image
  and video questions with human-verified atomic reasoning steps;
  hallucination labels assigned per rubric item by an LLM judge (Qwen-3-32B),
  with closed models' CoT approximated by prompted step-by-step output.
technique: ""
proposed_technique: Score hallucination per rubric item across knowledge,
  perception and reasoning
technique_summary: Annotates each question with verified atomic reasoning
  steps and dimension-labelled rubric items, then has an LLM judge mark, for
  each item, whether the model's CoT satisfied it and whether it hallucinated.
technique_kind: process
technique_validated_by: Human meta-evaluation on 300 sampled instances;
  judge-human answer-level accuracy deviation below 1%, with finer-grained
  deviations reported as small.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A study on comparable reasoning MLLMs where perception-only CoT
  hallucinations predict final-answer errors as strongly as reasoning
  hallucinations, or where reasoning hallucinations occur no more often on
  wrong answers than on right ones.
evidence_note: "Measured: stacked per-model hallucination-type rates split by
  answer correctness (hallucination rates below 15% on correct answers, above
  30% on incorrect), plus subcategory score breakdown for one model
  (GLM-4.1V-Thinking) showing spatial errors dominant. Design does not isolate
  causation; hallucination labels come from an LLM judge and the step
  annotations were generated by Gemini-2.5-Pro, which is also one of the
  evaluated models."
confidence: medium
