arxiv_id: "2603.13594"
title: "EnterpriseOps-Gym: Environments and Evaluations for Stateful Agentic
  Planning and Tool Use in Enterprise Settings"
url: https://doi.org/10.48550/arxiv.2603.13594
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: "On stateful enterprise tool-use tasks given oracle tool access,
  the bottleneck for frontier and open models is strategic plan generation
  rather than tool discovery or invocation: adding 5-15 plausible distractor
  tools leaves success essentially unchanged (~1% average change), while
  conditioning the same executor on an expert-authored step-by-step plan
  raises success by 14-35 points."
kind: observation
backing_strength: single-paper
scope_condition: 1,150 expert-curated tasks across eight enterprise domains in
  a containerized sandbox (164 DB tables, 512 tools, mean 9 expert steps),
  outcome-verified by SQL final-state checks; distractor ablation run on one
  model (Claude Sonnet 4.5), plan ablation on three weaker open models in
  three hardest domains.
technique: ""
proposed_technique: Supply an expert-authored plan to the executor agent
technique_summary: Decouple planning from execution by giving the ReAct
  executor a human-written, policy-grounded step-by-step plan instead of
  letting it plan itself.
technique_kind: prompting
technique_validated_by: "Pass@1 on CSM, ITSM and HR for Kimi-K2, Qwen3-30B and
  Qwen3-4B against the same models' ReAct baselines and against plans
  auto-generated by Claude Sonnet 4.5: human plans gained 14-35 points versus
  5-13 for model-generated plans."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on the same benchmark where removing oracle tool access
  (realistic retrieval over all 512 tools) costs as much or more success than
  supplying an expert plan gains, or where plan-conditioning gives no gain for
  executors on policy-heavy domains.
evidence_note: "Measured: 14 models evaluated at pass@1 averaged over three
  runs; best overall 37.4%. The distractor-tool ablation is a single model
  with at most +15 tools retrieved as 'most relevant', so it does not test
  realistic large-scale retrieval. The plan ablation uses human plans written
  by the same annotators who wrote the verifiers, so plan quality and verifier
  alignment are not independent, and it covers only three small/weak models in
  three domains."
confidence: medium
