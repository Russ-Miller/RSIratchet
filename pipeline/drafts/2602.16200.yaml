arxiv_id: "2602.16200"
title: The Validity of Coreference-based Evaluations of Natural Language
  Understanding
url: https://doi.org/10.48550/arxiv.2602.16200
drafted_at: 2026-11-15
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: When coreference resolution is used to evaluate natural language
  understanding, benchmark scores do not support general conclusions about a
  system's coreference ability, because datasets operationalize coreference
  under competing definitions and rank the same models differently across
  benchmarks.
kind: mechanism
backing_strength: single-paper
scope_condition: English-dominant coreference corpora (OntoNotes and
  derivatives, PreCo, GUM, LitBank, ARRAU, Phrase Detectives) plus
  Winograd-schema challenge sets; evaluated with standard clustering metrics
  and accuracy.
technique: ""
proposed_technique: Compare coreference systems across datasets under a controlled backbone
technique_summary: Re-evaluate several coreference systems on multiple
  annotated corpora while holding the underlying language-model architecture
  fixed, so reported gains can be attributed to modeling choices rather than
  backbone changes or dataset idiosyncrasies.
technique_kind: process
technique_validated_by: Re-evaluated five coreference systems across seven
  canonical datasets; controlling for the underlying architecture removed
  most, though not all, of the performance improvement reported over the prior
  five years.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that model rankings on coreference benchmarks are stable
  across datasets with differing annotation schemes, and that reported gains
  survive backbone-controlled re-evaluation, would falsify the claim.
evidence_note: "Thesis-level synthesis: a cross-dataset comparison of seven
  corpora documenting divergent coreference definitions and conflicting model
  rankings, plus a controlled re-evaluation of five systems. Isolates backbone
  as a confound but does not quantify how much ranking variance each
  definitional difference explains; numbers for the ranking inversions are not
  given in the available text."
confidence: medium
