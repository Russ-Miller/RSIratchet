falsifier: Under matched observation and action spaces, a controller-only or
  direct-VLM-action baseline matching or beating the planner-plus-controller
  system on these environments, or random-string instructions producing gains
  comparable to semantically meaningful ones.
evidence_note: Measured across seven environments with four VLM planners and
  internal ablations; baselines are a mix of reproduced, domain-adapted and
  'contextual' systems, so only the ablation rows are a clean matched
  comparison. Single group, single controller family, no error bars reported
  in the text.
