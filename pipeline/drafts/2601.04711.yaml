arxiv_id: "2601.04711"
title: "DSC2025 -- ViHallu Challenge: Detecting Hallucination in Vietnamese LLMs"
url: https://doi.org/10.48550/arxiv.2601.04711
drafted_at: 2026-11-16
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For Vietnamese context-grounded hallucination classification
  (context, prompt, response into no/intrinsic/extrinsic), fine-tuned
  multilingual encoder classifiers such as PhoBERT perform near chance (~0.33
  macro-F1 on a balanced three-class set) while LoRA-tuned 4-7B
  instruction-following LLMs with structured label-definition prompting reach
  ~0.85 macro-F1.
kind: observation
backing_strength: single-paper
scope_condition: 10,000 annotated Wikipedia-derived triplets in Vietnamese
  with responses generated by GPT-4o under factual, noisy and adversarial
  prompts; balanced three-class label distribution; 111 participating teams.
technique: ""
proposed_technique: Classify grounding faithfulness with an instruction-tuned
  LLM given explicit label definitions
technique_summary: Serialize context, prompt and response into a prompt that
  first states the task and the three hallucination label definitions with
  worked examples, then LoRA-fine-tune a 4B instruction model to emit the
  label.
technique_kind: training
technique_validated_by: Private test macro-F1 of 84.80% for a single
  LoRA-tuned Qwen3-4B-Instruct against a fine-tuned PhoBERT encoder baseline
  at 32.83% on the same 2,000-sample private split.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A fine-tuned encoder-only classifier on the same ViHallu training
  split reaching macro-F1 comparable to the 4-7B instruction-tuned systems, or
  instruction-tuned LLMs failing to exceed ~0.5 macro-F1 on this data.
evidence_note: Measured on a held-out 2,000-sample private test set with
  balanced classes; the baseline is a single simple fine-tune with no prompt
  engineering, so the 51-point gap conflates model class, fine-tuning recipe
  and prompt format rather than isolating any one. Top seven systems cluster
  tightly (0.8401-0.8480), which suggests a shared ceiling rather than a
  method-specific result.
confidence: medium
problems:
