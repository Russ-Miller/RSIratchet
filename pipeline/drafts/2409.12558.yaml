statement: When accurate retrieved context is supplied at every turn of a three-turn dialogue,
  model scores still fall as each turn adds a condition or constraint on how the retrieved material
  must be used, and models that score alike on plain multi-turn chat diverge on retrieval-grounded
  turns, so using retrieval well is a distinct competence from chatting well.
