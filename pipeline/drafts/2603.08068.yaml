statement: For 3B-14B Qwen2.5 instruct models learning search- and code-tool
  use, prepending a few tool-use demonstrations to the RL rollout prompt and
  removing them stagewise until zero-shot reaches higher exact-match accuracy
  than RL-only and SFT-then-RL baselines, without any supervised tool traces.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-3B/7B/14B-Instruct and Qwen3-8B; GRPO with loss
  masking on tool output; trained on Natural Questions, evaluated on five QA
  benchmarks plus AIME math with a Python tool.
technique: ""
proposed_technique: Fade few-shot demos out of RL rollout prompts
technique_summary: During RL training the rollout prompt carries a few
  tool-use demonstrations, and the demonstration count is reduced in stages
  until the policy acts zero-shot, replacing an SFT cold start.
technique_kind: training
technique_validated_by: Exact-match accuracy on TriviaQA, HotpotQA, 2Wiki,
  Musique, Bamboogle against Search-R1, ZeroSearch, ParallelSearch, SFT,
  rejection sampling and O2-Searcher (+8.94 average at 3B, +7.34 at 7B; 40.16
  vs 37.26 over the SFT-using O2-Searcher); AIME2024/2025 against ReTool.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-compute comparison where plain GRPO with the same prompt
  template, or an SFT cold start, reaches equal or higher EM on the same
  benchmarks and backbones.
evidence_note: "Measured against many baselines on five QA sets (500 sampled
  questions each) and two AIME sets, but baseline numbers are largely quoted
  rather than re-run, retrieval differs across sections (Serper vs BM25
  top-3), and no matched-compute ablation isolates the demonstrations from the
  extra RL stages. The curriculum ablation shows the schedule is fragile: a
  3~2~1~0 schedule collapsed (TriviaQA 75.4 to 20.8), which is a large
  unexplained swing."
