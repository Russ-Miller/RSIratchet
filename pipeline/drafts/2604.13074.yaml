model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-term-memory
statement: "For a 7B multimodal backbone on multi-session personalized
  dialogue, naive top-5 message retrieval is not uniformly better than putting
  the whole history in context: it lowered overall accuracy at 32k context
  (64.84 to 61.20, with preference understanding down 9.33 points) and raised
  it at 128k (54.48 to 59.01), while training the same backbone to decide when
  and over what time window to retrieve, plus an EMA-updated personality
  profile, beat both at either length."
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B backbone on synthetic long-term persona
  dialogues (Persona-MME) and PERSONAMEM; retrieval baseline is top-5 semantic
  message retrieval; training data is synthetic and generated by the same
  pipeline as the benchmark personas.
technique: ""
proposed_technique: Let the model choose the retrieval time window and keywords
technique_summary: Train an MLLM agent to emit, per turn, either a retrieval
  action with an inferred time period plus keywords over typed memory stores
  (core, semantic, episodic, procedural) or a final answer, and separately
  update a Big-Five personality vector by exponential moving average after
  each turn.
technique_kind: training
technique_validated_by: Accuracy on Persona-MME (2,000+ cases, 200 personas)
  and PERSONAMEM at 32k and 128k context against full-context and top-5 RAG
  baselines on the same backbone, plus GPT-4o and InternVL3-8B/38B; SFT-only
  and SFT+GRPO variants reported separately (e.g. 128k Persona-MME 54.48 base,
  59.01 RAG, 67.18 SFT, 71.05 RL).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Rerunning the same backbone with top-5 retrieval and full context
  across these benchmarks and finding retrieval helps at short context too, or
  finding the trained agentic retrieval does not beat tuned fixed-k retrieval
  at matched token budget.
evidence_note: Measured on the authors' own benchmark and one external one,
  with a single 7B backbone; training data and the benchmark come from the
  same synthesis pipeline and persona style, so the gain is not isolated from
  distribution match. No matched-compute or tuned-k retrieval control. The
  32k-vs-128k retrieval reversal is a single-model observation on two context
  settings.
confidence: low
