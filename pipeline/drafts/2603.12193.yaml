stance_reason: ""
falsifier: A unified-action-space VLA given the same camera-movement
  pretraining data and matched total training compute matching or exceeding
  the decoupled variant on occluded and out-of-view manipulation success.
evidence_note: Measured on the authors' own benchmark and real-robot task set;
  baselines are fine-tuned by the authors rather than reported by their
  originators, and the ablations vary one component at a time but not data
  budget. Camera-movement pretraining data is also authored by the same team,
  so the comparison does not isolate the decoupling from the extra data.
