capability: embodied-control
statement: For humanoid VLA policies that must both move a head camera and
  manipulate, keeping camera movement in a separate action decoder pretrained
  on large-scale embodiment-agnostic camera-movement data before joint
  fine-tuning yields higher task success on occluded and out-of-view tasks
  than extending an existing VLA's unified action space with camera dimensions
  and fine-tuning it on the same robot data.
kind: mechanism
backing_strength: single-paper
scope_condition: Unitree G1 humanoid with head camera, pick-and-place and
  articulated manipulation under occlusion or out-of-view targets; compared
  against pi-0 and GR00T-N1 fine-tuned with a unified action space; real-world
  task set of 4 categories, 20 trials each.
technique: ""
proposed_technique: Pretrain camera control separately, then fine-tune manipulation
technique_summary: Train a LoRA camera adapter and a dedicated camera-action
  decoder on a large image-language-to-camera-movement dataset, then freeze
  the adapter and train a separate manipulation decoder on robot data, keeping
  the two action spaces decoupled.
technique_kind: training
technique_validated_by: "Real-world success rate on 4 active-manipulation task
  categories: 85.0% average vs 53.75% for GR00T-N1 and 45.0% for pi-0
  fine-tuned with unified action space; ablations removing stage 1 (53.75%),
  the decoupled action head (71.25%) and the camera adapter (73.75%)."
stance_on_existing: neither
