related_claim_id: structured-long-term-memory-substrate-indexes-retrieval-control-logic-held
stance_reason: Both find that memory-system design rather than raw context
  scaling governs recall quality in multi-session settings, here with the
  added axis of visual fidelity loss at storage time.
falsifier: A memory-augmented agent that matches or beats long-context LVLMs
  on image-essential information-extraction and knowledge-update items at 32K,
  or long-context LVLMs that hold accuracy flat from 32K to 128K on the same
  items, would break the claimed division of failure modes.
evidence_note: "Measured: length-controlled sweep with per-type accuracy,
  image-ablation validation (accuracy below 2% without evidence images for two
  frontier models), and an oracle-retrieval diagnostic restoring MSR to
  90-100%. Agents evaluated on a smaller subset than LVLMs, and text-only
  agents are handicapped by caption substitution, so the agent-side
  visual-fidelity gap is partly an input-adaptation artifact rather than
  purely architectural."
