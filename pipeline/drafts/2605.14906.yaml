capability: long-term-memory
statement: "On multimodal multi-session conversational memory questions that
  genuinely require visual evidence, long-context LVLMs and memory-augmented
  agents fail in opposite ways: LVLM accuracy falls as the history grows from
  32K to 128K tokens (information extraction ~-20%, knowledge update ~-12%,
  answer refusal from ~75% to ~45%), while six of seven memory agents stay
  within ±7% from 32K to 256K but score far below LVLMs on visually grounded
  types because storage-time captioning or embedding discards fine-grained
  image detail."
kind: mechanism
backing_strength: single-paper
scope_condition: 789 questions over five memory abilities at 32K-256K tokens
  under a cross-modal token count; 27 LVLMs on the full set, 7 memory agents
  on a 195-question subset; text-only agents fed BLIP-2 captions in place of
  images.
