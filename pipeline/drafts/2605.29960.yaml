arxiv_id: "2605.29960"
title: "MemPoison: Bypassing Selective Memory Mechanisms to Plant Backdoors in
  LLM Agents"
url: https://doi.org/10.48550/arxiv.2605.29960
drafted_at: 2026-10-31
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-term-memory
statement: "In LLM agents whose long-term memory is written through an LLM
  extraction-and-rewriting pipeline (Mem0, LangMem, A-Mem), that pipeline
  filters or splits naively concatenated trigger-plus-payload injections but
  does not stop poisoning: a trigger semantically bound to the payload and
  optimized to look like a named entity survives extraction and rewriting and
  is recalled later, reaching attack success up to 0.95 while benign accuracy
  stays near baseline."
kind: mechanism
backing_strength: single-paper
scope_condition: Black-box dialogue or indirect-injection access;
  embedding-similarity retrieval; attacker has a local surrogate embedder;
  weaker when the same model also decides what gets written to memory and is
  strongly safety-aligned (Claude-opus-4.6 ASR 0.12 in the Hermes deployment).
technique: ""
proposed_technique: Bind the trigger to the payload and disguise it as a named entity
technique_summary: Craft a poisoning input in which the trigger and malicious
  payload form one logically interdependent statement, with the trigger token
  sequence optimized to look like a named entity and to cluster tightly in
  embedding space while staying separated from benign embeddings.
technique_kind: prompting
technique_validated_by: Injection, retrieval and attack success rates plus
  benign accuracy on three agents (LongMemEval, MIRIAD, FinQA) across RAG and
  three memory pipelines, against Info-only, Naive Concat, AgentPoison and
  MINJA baselines; ablations remove each component (dropping the semantic
  bridge takes ASR to 0); also tested under perplexity filtering,
  paraphrasing, seven backbones, eight retrievers and 10-40 rounds of memory
  lifecycle evolution.
stance_on_existing: supports
related_claim_id: persistent-memory-agents-any-memory-write-rule-decides-using-only-recency
stance_reason: Shows that write-time filters based on salience and surface
  form do not separate genuine from planted content once the planted claim is
  phrased as a coherent, entity-bearing user fact.
falsifier: A memory pipeline using LLM extraction and embedding retrieval
  where semantically bridged, entity-masqueraded triggers are filtered or
  rewritten away at rates comparable to naive concatenation, or where
  triggered recall stays near zero without a matching loss in benign accuracy.
evidence_note: Measured on three simulated agents seeded with 2,000 benign
  entries and 100 held-out queries each, across four storage mechanisms and
  seven backbones, plus one open-source real deployment; ablations isolate
  each of the three components. Attack-side evaluation only — no defender was
  co-adapted, and the two defenses tested (perplexity filter, paraphrasing)
  were off-the-shelf.
confidence: medium
