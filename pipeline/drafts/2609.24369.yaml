capability: strategic-deception
statement: When deception in narrative text is analysed by instantiating fixed
  argumentation schemes with an LLM (premise extraction, then
  critical-question evaluation), the scheme assessments are stable across ten
  different LLM backbones and repeated runs for clear-cut deception cases but
  grow inconsistent on ambiguous intelligence-style narratives.
kind: observation
backing_strength: single-paper
scope_condition: Narrative/PDF text analysed with a fixed ten-scheme library;
  reliability measured as cross-model and repeated-run consistency, not
  classification accuracy against ground truth (no scheme-level labelled
  corpus exists).
technique: ""
proposed_technique: Flag deception with argument schemes plus critical questions
technique_summary: For a chosen deception argument scheme, an LLM instantiates
  each premise against the document with verbatim excerpts and a
  green/yellow/red judgement, then answers the scheme's critical questions
  with paired argument and counterargument before an on-balance verdict, with
  analyst feedback re-running single elements.
technique_kind: prompting
technique_validated_by: Not measured against ground truth; validated only by
  consistency of premise and conclusion assessments across ten LLMs and
  repeated runs, plus an illustrative case analysis.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication showing premise and conclusion assessments from the
  same schemes disagree substantially across models or runs even on clear-cut
  deception cases, or that ambiguity of the narrative does not predict
  inconsistency.
evidence_note: "Argued plus a reliability study reported in summary form:
  consistency across ten contemporary LLMs and repeated runs on illustrative
  narratives. No accuracy baseline, no ground-truth corpus, no stated
  agreement statistics in the available text, so effect size and the
  definition of 'ambiguous' are unverified."
