status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: In long-horizon tool-mediated environments where strategically
  relevant state is available only on explicit query (300+ turn Civilization
  VI via MCP, 23 runs, four model families under a shared playbook), agents
  allocate only about 1-2% of non-infrastructure tool calls to strategic
  monitoring and execute only about 48-66% of the near-term commitments they
  state in their own planning diaries, even though the playbook told them to
  query victory progress every 20 turns.
kind: observation
backing_strength: single-paper
scope_condition: Single-agent play against built-in AI, fixed scenarios,
  shared human-written playbook that elicits a five-field turn diary; 23 runs
  across four model families, underpowered for between-model comparison;
  commitment labelling done by an LLM with a human-validated sample.
technique: ""
proposed_technique: Measure proactive monitoring and reflection-action gap from traces
technique_summary: Compute, from an agent's tool-call log, the share of
  non-infrastructure calls spent querying global state (PMR) and the fraction
  of commitments stated in its planning diary that are executed within the
  next K turns (RAG@K).
technique_kind: process
technique_validated_by: "Commitments extracted and labelled by an LLM against
  a fixed rubric; validated on a stratified sample of 50 commitments labelled
  independently by an author, 92.0% agreement, Cohen's kappa 0.879. Linked to
  outcomes via a missed-warning analysis: in 7 of 20 detectable defeats no
  victory-progress query occurred in the 20-turn window before game end."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Traces from the same environment and protocol showing frontier
  agents allocating a substantially larger share of calls to global-state
  monitoring, raising monitoring as the endgame nears, and executing the large
  majority of their stated near-term commitments within ten turns.
evidence_note: "Measured on 23 admissible runs (19 Ground Control, 4
  Snowflake) with uneven per-family coverage (one family has a single run);
  aggregate outcomes did not discriminate models (3 wins total, Fisher
  p=0.488), so only the shared behavioural patterns are supported. The
  playbook is a stated confound: behaviour reflects model plus
  instruction-following, and the diary elicits the commitments being scored.
  No random or scripted baseline for monitoring rate, so 'low' has no
  reference point beyond the playbook's own recommended cadence."
