arxiv_id: "2609.02459"
title: "CivBench: A Long-Horizon Benchmark for Tool-Mediated Agents in
  Civilization VI"
url: https://doi.org/10.48550/arxiv.2609.02459
drafted_at: 2026-10-22
drafted_from: full-text
