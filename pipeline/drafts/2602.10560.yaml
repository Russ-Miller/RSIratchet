capability: long-context-degradation
statement: For chunk-by-chunk recurrent textual-memory agents on long-context
  reasoning, adding RL-rewarded text gates that skip memory writes on
  evidence-free chunks and exit the loop once evidence suffices raises
  accuracy over unconditional per-chunk memory updating while cutting
  inference time substantially.
kind: mechanism
backing_strength: single-paper
scope_condition: Recurrent chunked-memory agents (MemAgent-style) trained
  end-to-end with RL on long-context reasoning tasks; no evidence for
  non-recurrent long-context methods.
technique: ""
proposed_technique: Gate memory writes and loop exit with RL-trained text gates
technique_summary: "The agent emits two textual gates during chunk-by-chunk
  reading: memory is rewritten only when the update gate opens, and the loop
  halts when the exit gate opens, both trained by dedicated reward terms
  inside end-to-end RL."
technique_kind: training
technique_validated_by: Compared against vanilla MemAgent on several
  long-context reasoning tasks, reporting generally higher accuracy and up to
  400% inference speedup.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison where gated updating/exiting scores at or
  below unconditional per-chunk memory updating on long-context reasoning
  accuracy, or where the speedup comes only with accuracy loss.
evidence_note: Measured against one baseline (MemAgent) on several
  long-context reasoning benchmarks; the abstract gives no per-task numbers,
  no ablation separating the update gate from the exit gate, and no accuracy
  figures alongside the speedup claim.
