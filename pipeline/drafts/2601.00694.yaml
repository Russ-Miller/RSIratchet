arxiv_id: "2601.00694"
title: A Vision-and-Knowledge Enhanced Large Language Model for Generalizable
  Pedestrian Crossing Behavior Inference
url: https://doi.org/10.48550/arxiv.2601.00694
drafted_at: 2026-11-15
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: For inferring pedestrian crossing decisions at road sites, a
  LLaMA-2-7B model LoRA-fine-tuned on textual data plus LLaVA-extracted visual
  features and written transportation domain knowledge transfers to unseen
  sites far better than statistical and supervised learning baselines trained
  on the same data (66.9% vs at most ~49% balanced accuracy zero-shot), with
  five in-context examples raising it to 72.2%.
kind: observation
backing_strength: single-paper
scope_condition: Single pedestrian-crossing dataset with site-based
  partitioning; five unseen test sites; one 7B backbone.
technique: ""
proposed_technique: Fine-tune on visual features plus written domain knowledge
technique_summary: Augments each tabular crossing record with LLaVA-extracted
  scene descriptions and transportation domain-knowledge text before LoRA
  fine-tuning an LLM to predict the crossing decision.
technique_kind: training
technique_validated_by: Balanced accuracy on held-out sites against
  statistical and supervised baselines; ablations attribute +2.9% to the
  vision module and +4.1% to domain knowledge, with cross-site zero-shot and
  five-shot comparisons.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A supervised baseline tuned with the same site-based partitioning
  matching or exceeding 66.9% balanced accuracy on the unseen sites, or the
  vision/knowledge ablation gains failing to replicate on another crossing
  dataset.
evidence_note: Measured on one dataset with site-based cross-validation;
  ablations isolate the vision and knowledge components separately. Baseline
  comparison is reported as at least 18 points, but the paper gives no
  confidence intervals and tests one backbone, so the magnitude is not well
  bounded.
confidence: low
