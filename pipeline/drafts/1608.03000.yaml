arxiv_id: "1608.03000"
title: Neural Generation of Regular Expressions from Natural Language with
  Minimal Domain Knowledge
url: https://arxiv.org/abs/1608.03000
drafted_at: 2026-09-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: For translating English descriptions into regular expressions, a
  generic attention-based sequence-to-sequence model trained only on
  description/regex pairs matches a domain-engineered semantic parser on a
  small corpus (814 examples) and beats it by a wide margin once the training
  corpus is scaled to 10,000 pairs, with no semantic-equivalence machinery
  built in.
kind: observation
backing_strength: single-paper
scope_condition: Short single-line regexes over a 15-rule grammar; accuracy
  scored by DFA equivalence; 2016-era LSTM models; gains depend on having
  thousands of paired examples.
technique: ""
proposed_technique: Generate regexes from a grammar, then crowd-paraphrase
technique_summary: Build a large NL-to-regex training corpus by stochastically
  generating regexes with a small hand-written grammar that also emits rigid
  synthetic descriptions, then paying crowd workers to paraphrase those
  descriptions into fluent language.
technique_kind: training
technique_validated_by: 10,000-pair corpus (NL-RX); a seq2seq model trained on
  it reached 58.2% DFA-equal accuracy on paraphrased test descriptions versus
  38.6% for the prior semantic-parsing state of the art and 16.4% for a
  bag-of-words nearest-neighbour baseline; the corpus has 97% unique regexes
  against 45% in the earlier human-written set.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A domain-specific parser using regex semantic equivalence
  outperforming a comparably trained generic seq2seq model on a large,
  duplicate-free NL-to-regex corpus under DFA-equivalence scoring.
evidence_note: Measured on two datasets against two baselines, one of them the
  prior state of the art trained with the original authors' help. Single
  paper, one architecture, no seed variance reported. Absolute accuracy on
  human-paraphrased descriptions is 58.2%, so most of the gap to usable is
  unclosed. The paper also shows the older KB13 set is 55% duplicate regexes,
  which inflates nearest-neighbour there.
confidence: medium
