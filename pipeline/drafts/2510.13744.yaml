statement: On human-annotated step-level verification of frontier-model proofs to recent IMO
  and Putnam problems, most of 29 generative critics and process reward models do little better
  than chance at finding the first wrong step, a leading math PRM (Qwen2.5-Math-PRM-72B) reaches
  only about 37% balanced F1, and beyond a few standouts open-source verifiers lag closed models;
  verification is harder than generation for the same frontier models.
