arxiv_id: '2512.12488'
title: 'The American Ghost in the Machine: How language models align culturally and the effects
  of cultural prompting'
url: https://arxiv.org/abs/2512.12488
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: cultural-competence
statement: On Hofstede's VSM13 survey, most of eight current chat models answer closest to the
  United States when no culture is specified; a system prompt naming a target country moves
  seven of the eight toward that country's profile, with the largest gains for the countries
  furthest away at baseline (Japan and China, roughly 17-19% closer), yet those two remain the
  hardest to match even for the DeepSeek models.
kind: observation
backing_strength: single-paper
scope_condition: DeepSeek-V3/V3.1, GPT-5, GPT-4.1, GPT-4, Claude Opus 4, Llama 3.1, Mistral
  Large, late 2025; six target countries; distance on Hofstede dimensions.
technique: ''
proposed_technique: Cultural prompting via a country-naming system prompt
technique_summary: State the target country in the system prompt so the model answers survey-style
  questions as a member of that culture; measured as reduced distance to the country's Hofstede
  profile.
technique_kind: prompting
technique_validated_by: Hofstede-dimension distance before and after prompting for six countries
  across eight models; seven of eight moved closer, gains 11-22% by country, Japan and China
  least matched.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: A survey instrument other than VSM13 on which the default profile is not US-like,
  or cultural prompting that moves models away from the target on held-out items.
evidence_note: One survey instrument and self-report style questions; Hofstede dimensions are
  contested as a measure of culture, so this measures alignment to a questionnaire profile rather
  than behaviour.
confidence: medium
