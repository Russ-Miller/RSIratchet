statement: "For image-aesthetics models fine-tuned for critique and scoring,
  competence at producing reference-aligned aesthetic critique does not carry
  over to judging whether an image suits a stated purpose, audience or
  cultural setting: all four aesthetic specialists tested scored below 30%
  accuracy on 301 expert-curated suitability cases (best 29.57%) versus 91.69%
  for the strongest general-purpose model, and they predicted 'suitable' in
  59-77% of binary cases against a gold rate of 38.14%."
kind: observation
backing_strength: single-paper
scope_condition: Single-image closed-form suitability questions, no retrieval
  or tools, 448x448 inputs for locally run models; specialists are
  ArtQuant-APDD, ArtiMuse, Q-SiT, AesExpert.
