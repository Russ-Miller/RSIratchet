falsifier: An aesthetics-specialized model that matches its base or a frontier
  general model on contextual-suitability accuracy without over-accepting, or
  evidence that the specialists' low scores come from answer-format parsing
  rather than judgment.
evidence_note: Measured on 301 expert-reviewed cases (291 binary, 10
  three-way) with exact-match accuracy, plus a 100-case human grounding audit
  (ArtiMuse 21% accuracy to 3% evidence-grounded) and a 36-pair counterfactual
  audit where specialists showed weaker directional updating. Unparsable
  responses counted incorrect, which may penalize weak instruction-followers;
  base-vs-specialist comparison isolates tuning effect for only two of four
  models.
