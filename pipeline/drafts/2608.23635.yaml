stance_reason: Independently reproduces that corrupting the tool's returned
  evidence hurts far more than perturbing tool names, descriptions, or the
  user request.
falsifier: A model-family evaluation under the same stage-aligned
  perturbations where observation/evidence perturbation is no more damaging
  than interface or intent perturbation, or where clean accuracy predicts
  per-family robustness ranking.
evidence_note: Measured on 15,456 single-family records across 7 models, 14
  subtypes; family-mean robustness 0.918 interface, 0.773 intent, 0.688
  runtime, 0.455 observation. A human audit found 68.3% of sampled
  evidence-loss cases at least partially recoverable, so the gap is not an
  unsolvable-target artifact. Deterministic local tools, so absolute rates may
  not transfer to live APIs.
