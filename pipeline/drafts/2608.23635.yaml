statement: "For single-step tool-calling agents, near-perfect clean accuracy
  does not predict robustness, and the dominant weak point is recovering the
  answer from perturbed tool returns rather than selecting the tool or binding
  arguments: across seven models, clean success averaged 0.979 while success
  under corrupted or missing returned evidence averaged 0.455, with no model
  above 0.60."
kind: observation
backing_strength: single-paper
scope_condition: Single-step tool calls over 16 deterministic local tools with
  fixed gold arguments; four stage-aligned perturbation families at three
  severities; no long-horizon or stateful dependencies.
