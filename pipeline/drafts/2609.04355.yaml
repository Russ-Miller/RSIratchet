falsifier: An ablation in which absolute-Q maximization with the same
  frozen-reference regularization, experience mix, and compute matches or
  exceeds relative-advantage updates in autonomous success on the same
  long-horizon precision tasks.
evidence_note: "Nine real tasks, four embodiments, 20 held-out trials per
  task: 98.3% mean success vs 67.8% for fine-tuned pi-0.5 and 10.0% for the
  strongest absolute-Q RL baseline (Robo-Dopamine), plus training curves on
  five tasks showing baselines stuck near 0-10% autonomous success. The
  comparison changes backbone, algorithm, and system at once, so the
  relative-advantage mechanism is argued from baseline failure modes rather
  than isolated by a matched ablation in the text provided."
