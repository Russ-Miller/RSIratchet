capability: embodied-control
statement: For real-world online RL post-training of large pretrained
  vision-language-action policies on high-precision manipulation, optimizing
  the action head toward a paired advantage margin against a frozen reference
  action, rather than maximizing absolute Q values, yields higher autonomous
  success on long multi-step tasks, because absolute-Q maximization amplifies
  early optimistic value errors into policy drift that behavior-cloning
  regularization alone does not stop.
kind: mechanism
backing_strength: single-paper
scope_condition: Real-robot online RL with human intervention, large
  flow-based VLA backbones (pi-0.5 class) with only LoRA action-expert
  parameters trained, on millimeter-precision chemistry manipulation tasks
  with pose randomization; compared against compact-policy and Octo-based
  absolute-Q RL baselines.
technique: ""
proposed_technique: Reference-regularized relative-advantage policy improvement for VLA online RL
