falsifier: On the same questions and contexts, open-ended accuracy matching
  multiple-choice accuracy within a few points for most models, or the COBOL
  gap being no larger than the Java gap, would refute it.
evidence_note: "Measured: accuracy tables for 6-12 models per language across
  32k-512k/1024k buckets, with and without options. Gap is consistent across
  every model and bucket reported. Design does not isolate grader strictness:
  the open-ended condition is scored by an LLM judge against ground truth
  while the MC condition is exact-match, so some of the gap may be grading
  severity rather than model ability. Question sets per language are small
  (114 Java items) and differ in construction, so cross-language gap sizes are
  only loosely comparable."
