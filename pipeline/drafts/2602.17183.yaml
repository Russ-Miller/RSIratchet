capability: long-context-degradation
statement: "In long-context code question answering over 32k-1M token contexts
  (Python, Java, and COBOL), multiple-choice accuracy overstates
  comprehension: removing the answer options and scoring open-ended answers
  drops accuracy by roughly 15-35 points on Python and 30-60 points on COBOL,
  while the gap is smallest on Java, so recognition from supplied candidates
  substitutes for reconstructive reasoning most in the least-represented
  language."
kind: observation
backing_strength: single-paper
scope_condition: Frontier and open models (GPT-4o, Gemini 2.5, Claude 4.5,
  Llama, Mistral, Qwen, Granite) on LongCodeBench Python plus newly built
  COBOL (public Medicare Pricer, internal IBM) and Java (114 questions from 4
  repos) sets; open-ended answers graded by an LLM judge, which is itself an
  unvalidated grader.
