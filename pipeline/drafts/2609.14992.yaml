statement: For multi-turn agentic coding sessions, constraints written into a
  repository policy file (e.g. CLAUDE.md) hold up better over successive turns
  than the same kinds of constraints stated in user turns, and constraints
  that replace an earlier constraint are followed less often than newly added
  ones.
kind: observation
backing_strength: single-paper
scope_condition: 100 synthesized multi-turn software development instances
  (avg 7.04 turns, ~13 constraints per turn), 11 frontier code agents under
  the Claude Code harness, checklist verification by scripts and judge agents.
