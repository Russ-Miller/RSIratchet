falsifier: A comparison on similar multi-turn coding tasks where policy-file
  constraints decay as fast as, or faster than, user-instruction constraints,
  or where replacement constraints are followed at least as often as newly
  added ones.
evidence_note: Measured as average constraint success rate split by constraint
  source across turns, averaged over all tested models; the gap is reported as
  a figure trend rather than with per-model statistics, and constraint content
  is not matched item-for-item between sources, so the source effect is not
  fully isolated from difficulty.
