statement: When RL-training a central-agent multi-agent harness with 1.5B-3B
  Qwen2.5 backbones on multi-hop QA, optimizing only the coordinating central
  policy and leaving sub-agents frozen scores higher than jointly training
  central and sub-agent policies (average F1 47.79 vs 45.36, accuracy 42.88 vs
  40.49 at 3B).
