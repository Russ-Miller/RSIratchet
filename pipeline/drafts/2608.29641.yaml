  harnesses with frozen retrieval/conclusion sub-agents; small (1.5B-3B) open
  backbones; only one harness topology tested.
technique: ""
proposed_technique: Train only the central coordinating agent, freeze sub-agents
technique_summary: Treats sub-agents as part of the environment and applies RL
  gradients only to the central agent's policy, with trajectories
  reconstructed from captured per-session interface call records.
technique_kind: training
technique_validated_by: Token-level F1 and accuracy across seven multi-hop QA
  benchmarks with Qwen2.5-3B, central-only vs all-agent joint training under
  the same optimization scheme.
