capability: long-context-degradation
statement: On long-context tasks over 8K-128K-token documents in the six
  official UN languages, models answer word-level span questions well (about
  73% average accuracy across 12 models) but degrade sharply as the required
  unit coarsens to sentence selection (about 21%), paragraph filling and
  document-level summarization and translation, so long-context competence
  measured by needle-style word retrieval overstates comprehension of larger
  discourse units.
kind: observation
backing_strength: single-paper
scope_condition: UN report documents 8K-128K tokens, six languages, zero-shot,
  12 long-context LLMs; coarse-grained tasks scored with ROUGE-L/BLEU, which
  are themselves weak proxies.
