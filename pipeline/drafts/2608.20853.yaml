falsifier: A model family scoring near its word-level accuracy on the
  sentence-cloze and paragraph-filling tasks of the same benchmark, or showing
  that the coarse-grained gap disappears under reference-free judging rather
  than ROUGE-L/BLEU.
evidence_note: Measured across 12 open and proprietary models on 420
  query-response pairs per task per language; the gap is large but confounded
  by metric change between granularities (accuracy vs ROUGE-L vs BLEU), which
  the design does not isolate.
