arxiv_id: "2606.02054"
title: "eMoT: evolving Memory-of-Thought via Symbolic Anchoring and Memory
  Corrosion"
url: https://doi.org/10.48550/arxiv.2606.02054
drafted_at: 2026-10-31
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-step-reasoning
statement: For a 32B open backbone on multi-step math and combinatorial
  reasoning, running a memory-guided neural answer and a single-pass
  Python-executed answer in parallel and adjudicating only when they disagree
  raises exact-match accuracy over direct prompting and over tree- and
  buffer-structured baselines, with the symbolic execution path contributing
  most on arithmetic-heavy sets and the schema memory most on the hardest
  long-chain set.
kind: observation
backing_strength: single-paper
scope_condition: Qwen-32B backbone; GSM8K, GSM-Hard, ASDiv, SVAMP, MGSM, Game
  of 24, WordSorting, Checkmate; baselines partly cited from other papers on
  GPT-4/Codex backbones
technique: ""
proposed_technique: Dual-stream neural and Python answers with decay-pruned schema memory
technique_summary: Distill the problem, retrieve an activation-weighted
  reusable reasoning schema, generate a neural answer and a single-pass
  executable Python answer in parallel, adjudicate disagreements with one
  extra model call, and reinforce or exponentially decay schemas in the memory
  store.
technique_kind: process
technique_validated_by: Exact-match accuracy on five math sets plus three
  combinatorial tasks against direct prompting with the same backbone and
  against published ToT/BoT/PaL numbers; component ablations removing memory,
  symbolic execution, or refinement.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matching the pipeline's token budget with plain self-consistency
  sampling on the same backbone reaching equal or higher accuracy, or
  ablations showing the schema memory adds nothing once Python execution plus
  adjudication is present.
evidence_note: Measured on eight benchmarks with one backbone and ablations,
  but the strongest comparisons (BoT, ToT, PaL) are numbers cited from other
  papers on different backbones, no compute- or token-matched baseline is
  reported, and the 100% Game of 24 result and 0.395 direct GSM8K baseline are
  both unusual enough to warrant caution.
confidence: low
