statement: 'Across 14 models, syllogisms posed in symbolic form are solved far better than the
  same inferences in natural language: top models reach near-perfect symbolic accuracy (about
  99.6%) while scoring around chance (52%) on the natural-language understanding variant, mean
  81.7% versus 56% overall, and few-shot prompting did not help, so formal-pattern competence
  does not carry over to reading the logic out of ordinary sentences.'
