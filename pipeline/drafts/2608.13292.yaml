statement: In LLM-based repository-level program repair, telling the generator
  to be minimal or constraining its output format does not shrink patches,
  because verbosity comes from the capability-raising machinery itself
  (iterative refinement, broad context); a separate post-generation refiner
  that rewrites an already-plausible patch is what reduces size without losing
  fixes.
kind: mechanism
backing_strength: single-paper
scope_condition: Repository-level issue fixing measured on SWE-bench Verified;
  patch size measured relative to the developer patch across 28 leaderboard
  systems and four host agents.
technique: ""
proposed_technique: Shrink the patch after generation, not during it
technique_summary: A small refiner model (SFT plus DPO on verbose-to-concise
  patch pairs with distilled reasoning traces) is plugged in after an existing
  repair framework's patch generation to rewrite the candidate patch into a
  smaller one, with optional judge- or test-gated fallback to the original.
technique_kind: process
technique_validated_by: "On SWE-bench Verified across four host systems
  (Agentless, SWE-agent, Moatless, OpenHands), average total changes relative
  to developer patches fell from +242.14% to +4.24% and net changes from
  +348.24% to -39.75%, while resolved instances were preserved or improved by
  up to +42; prompting Claude-4.5-Sonnet, Atomizer untangling, AdaPatcher and
  PRepair all shrank patches only by losing 29-217 resolved instances.
  Ablation: SFT alone over-compresses (resolves 276 avg, below the untrained
  293); DPO restores 332."
stance_on_existing: neither
