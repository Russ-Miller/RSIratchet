stance_reason: ""
falsifier: A repair system whose patches match developer patch size after only
  a minimality instruction or output-format change, with resolution unchanged;
  or a post-generation refiner that shrinks patches no more than a minimality
  prompt at matched resolution.
evidence_note: "Measured. RQ-1 compares 28 leaderboard approaches on resolved
  instances against gold patches, with Kruskal-Wallis/Mann-Whitney tests:
  explicit minimality instruction +208.83% total changes vs none +191.39%,
  while iterative refinement +406.46% vs +95.60% (p<0.001) and top-12 vs
  bottom-12 resolvers +223.39% vs +118.09% (p<0.001) — effect sizes are small
  (|delta| 0.13-0.21) and the authors call the design-factor analysis
  association, not causation, since design labels come from public reports.
  RQ-2 compares RECAP to four baselines on four hosts. Correctness is
  SWE-bench test passing, i.e. plausibility, not semantic correctness; part of
  the measured size inflation comes from auxiliary test/reproduction edits,
  which the authors count separately."
confidence: medium
