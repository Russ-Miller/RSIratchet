statement: 'Unlearning methods that make a model answer "I don''t know" about a forget set can
  leave the knowledge in place: the strongest IDK-style fine-tuning method still answered those
  same questions accurately when probed in a different format, and across nine unlearning methods
  on three model families none met a joint standard of utility and honesty on retained knowledge
  plus consistent, acknowledged forgetting; aligning representations after feature randomization
  (ReVa) roughly doubled the rejection rate that survives a second conversational turn.'
