arxiv_id: "2601.09883"
title: "Beyond Rule-Based Workflows: An Information-Flow-Orchestrated
  Multi-Agents Paradigm via Agent-to-Agent Communication from CORAL"
url: https://doi.org/10.48550/arxiv.2601.09883
drafted_at: 2026-11-17
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For general-purpose agentic tasks (GAIA) with fixed agent roles,
  replacing a predefined workflow router with an orchestrator agent that
  monitors progress and issues natural-language instructions over an
  agent-to-agent message toolkit gives no accuracy gain when every agent runs
  a strong model, and gains only when the worker agents run a weaker model
  than the orchestrator.
kind: observation
backing_strength: single-paper
scope_condition: GAIA validation set (165 tasks), pass@1, temperature 0,
  identical agent roles (planner, web, document, reasoning/coding) and models
  across both systems; baseline is a reimplemented OWL workflow MAS.
technique: ""
proposed_technique: Orchestrate agents by live information flow, not a fixed workflow
technique_summary: A dedicated orchestrator agent receives the query, monitors
  progress, and dispatches natural-language inquiries or instructions to
  worker agents through a send/wait message toolkit, with no predefined task
  states or routing rules.
technique_kind: process
technique_validated_by: "Pass@1 accuracy on GAIA validation (165 tasks)
  against a reimplemented OWL workflow baseline with matched roles and models,
  plus token-consumption CDFs: equal overall accuracy (64.24%) when all agents
  use Grok 4.1 Fast at slightly higher token cost, and 63.64% vs 55.15% when
  worker agents use GPT 4.1 Mini."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled replication with all agents on a strong model showing
  a consistent accuracy gain for the orchestrated paradigm, or a weak-worker
  configuration showing no gain over the workflow baseline.
evidence_note: Two configurations on one benchmark with one baseline system,
  single runs at temperature 0, no seed variance or confidence intervals
  reported. The parity result in the homogeneous setting is the paper's own
  data and is what scopes the claim; the authors attribute the heterogeneous
  gain to the orchestrator catching partial-success edge cases, supported by
  three hand-picked cases rather than a measured failure-mode count.
confidence: low
