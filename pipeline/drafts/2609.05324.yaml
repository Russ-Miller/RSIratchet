falsifier: A VLA model that holds near-constant success rate across the five
  difficulty levels on these task families, with no drop on the
  spatial-ambiguity or memory-intensive planning categories.
evidence_note: "Benchmark paper: 527K trajectories, 280 task variants,
  diagnostic metrics beyond binary success. The abstract reports qualitative
  failure directions (complex spatial relations, precise low-level execution,
  memory-intensive planning) without per-level numbers in the text given, and
  does not isolate which of perception, control, or memory causes the drop."
