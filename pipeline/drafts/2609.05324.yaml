statement: When language-conditioned VLA manipulation tasks are instantiated
  at graded difficulty levels that add spatial ambiguity (fine-grained spatial
  relations, precise placement) and procedural length (multi-stage plans
  requiring memory of completed steps), representative VLA models degrade on
  both axes, so success on predefined single-stage settings does not indicate
  spatial or long-horizon competence.
kind: observation
backing_strength: single-paper
scope_condition: Representative VLA models evaluated on a simulated/collected
  manipulation benchmark with 10 task categories, 56 base tasks, 5 difficulty
  levels each, across multiple embodiments.
