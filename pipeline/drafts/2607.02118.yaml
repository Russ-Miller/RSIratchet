arxiv_id: "2607.02118"
title: Enhancing Fitness Intelligence through Domain-Specific LLM Post-Training
url: https://doi.org/10.48550/arxiv.2607.02118
drafted_at: 2026-10-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: For 4B-32B Qwen3 models adapted to scientific fitness coaching, a
  domain-adapted checkpoint built by continual pre-training plus reasoning SFT
  plus RL beats the same general base model fine-tuned directly on a target
  sub-domain's task data, even when the domain model is evaluated zero-shot,
  and fine-tuning on top of it raises the ceiling further.
kind: observation
backing_strength: single-paper
scope_condition: Qwen3 8B comparison on six sub-domains of ACSM-EP and
  NSCA-CSCS certification exams; domain corpus of 30B tokens from guidelines,
  literature and textbooks
technique: ""
proposed_technique: Continual pre-train, then reasoning SFT, then RL for a vertical domain
technique_summary: "Adapts a general base model to a specialist domain in
  three stages: continual pre-training on a curated domain corpus mixed with
  general data, SFT on verified chain-of-thought triplets, then DAPO RL with
  exact-match, reward-model and format rewards."
technique_kind: training
technique_validated_by: Certification-exam scores (ACSM-EP, NSCA-CSCS) versus
  Qwen3 base models and open/closed baselines, plus a general-capability suite
  (MMLU-Redux, MATH-500, HumanEval, IFEval and others) to check retention;
  stage ablations at 8B show CPT alone drops General-Bench 67.90 to 66.24
  while SFT recovers it to 70.12, and dropping CPT costs 2.69 ACSM-EP points.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A task-specific fine-tune of the general base model matching or
  exceeding the zero-shot domain-adapted model on the same sub-domains, or the
  full pipeline failing to beat SFT-only once training-data volume is matched.
evidence_note: Measured on two professional exams averaged over five runs,
  with stage ablations and a scale sweep from 4B to 32B. All exam items come
  from the authors' own evaluation set and the domain corpus is theirs, so
  contamination between training corpus and exam content is not isolated; the
  task-specific SFT baseline's data budget is not stated as matched.
confidence: low
