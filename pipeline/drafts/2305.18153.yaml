statement: On SelfAware, a set of unanswerable questions (no scientific consensus, imagination,
  philosophical, too many variables, subjective) paired with answerable ones, models' ability
  to flag the unanswerable ones rises with parameter count, with instruction tuning and with
  in-context examples, yet the best model tested (GPT-4, F1 about 75) stays well below the human
  reference of about 85, so self-knowledge is present but incomplete.
