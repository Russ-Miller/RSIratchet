falsifier: A current model reaching or exceeding the human F1 on SelfAware or a like benchmark,
  or evidence the gap is an artefact of the phrase-matching detector rather than of the models.
evidence_note: Single benchmark with an automatic uncertainty detector that keys on phrasing,
  which can miss hedged answers in other words; the human baseline is a small volunteer set.
  The scaling and instruction-tuning trends are consistent across the three prompt forms tested.
