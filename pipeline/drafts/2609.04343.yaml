arxiv_id: "2609.04343"
title: A Removal Based Approach to Improve LLM Faithfulness at Test-Time
url: https://arxiv.org/abs/2609.04343
drafted_at: 2026-09-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: explanation-faithfulness
statement: When an LLM gives an answer plus an explanation, deleting from the
  input those concepts the explanation does not credit and re-querying on the
  reduced input raises measured faithfulness over both standard prompting and
  prompts that ask for faithful explanations, because the re-query removes the
  unmentioned factors that could have influenced the original answer.
kind: mechanism
backing_strength: single-paper
scope_condition: Tested on two datasets with inputs decomposable into discrete
  concepts, across multiple model families, with two faithfulness metrics;
  targets incompleteness (omitted influences), not unsoundness.
technique: ""
proposed_technique: Re-query after removing concepts the explanation ignored
technique_summary: Identify input concepts not credited in the model's
  explanation, delete them from the input, and re-ask the model so the final
  answer can only depend on the concepts it named.
technique_kind: prompting
technique_validated_by: Two faithfulness metrics on two datasets across
  multiple model families, compared against standard prompting and
  faithfulness-encouraging prompting.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same datasets, answers after concept removal show the same
  or greater dependence on unmentioned factors as answers from standard
  prompting under both faithfulness metrics.
evidence_note: Measured, but the abstract and introduction alone give no
  numbers, no dataset names, and no model list; the design does not address
  unsoundness and assumes concepts can be cleanly segmented and deleted
  without changing the question.
confidence: low
