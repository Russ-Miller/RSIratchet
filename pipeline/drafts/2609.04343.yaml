arxiv_id: "2609.04343"
title: A Removal Based Approach to Improve LLM Faithfulness at Test-Time
url: https://arxiv.org/abs/2609.04343
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: explanation-faithfulness
statement: When an LLM answers a question and gives an explanation, removing
  from the input the concepts its explanation did not credit and re-querying
  on the reduced input raises measured explanation faithfulness over both
  standard prompting and prompts that ask for faithfulness, because the
  removal deletes the unmentioned influences rather than asking the model to
  report them.
kind: mechanism
backing_strength: single-paper
scope_condition: Tested on two datasets with question-plus-explanation prompts
  across multiple model families, using two faithfulness metrics; targets
  incompleteness (omitted influences), not unsoundness; requires that input
  concepts can be identified and removed.
technique: ""
proposed_technique: Remove unmentioned concepts and re-query
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Re-querying on the concept-reduced input yields no higher
  faithfulness than standard or faithfulness-encouraging prompting on the same
  datasets and metrics, or the gain disappears when the removal step is
  replaced by a no-op reduction.
evidence_note: Measured on two datasets, several model families, two
  independent faithfulness metrics, against standard prompting and
  faithfulness-encouraging prompting baselines. Only the abstract and
  introduction were available, so effect sizes, metric definitions, and how
  reliably concepts are extracted are not verifiable here; the design does not
  isolate whether gains come from removal or from the second query.
confidence: low
