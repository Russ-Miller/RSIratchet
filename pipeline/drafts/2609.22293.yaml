status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: "For VLA manipulation policies doing single-step action prediction
  on LIBERO observations, the commanded action is fragile to camera rotation
  but tolerant of brightness: validated over entire continuous perturbation
  regions, 27% of instances admit a counterexample within ±1° of camera
  rotation and 51% within ±2°, while every instance is robust to a ±2%
  brightness shift and the median tolerates ±30%."
kind: observation
backing_strength: single-paper
scope_condition: Five LIBERO-finetuned VLAs (OpenVLA, OpenVLA-OFT, GR00T N1.7,
  pi0, pi0.5), 40 sampled observations, open-loop one-step action prediction,
  tolerance set at the 90th percentile of consecutive demonstrated action
  deltas; robustness verdicts are conditional on Hölder constant estimates.
technique: ""
proposed_technique: Validate a whole perturbation region, don't sample it
technique_summary: Maps a bounded brightness/rotation perturbation region onto
  a Hilbert curve and searches it by Hölder optimisation with a margin-aware
  convergence rule, so each instance returns either a concrete counterexample
  or a bound covering every perturbation in the region.
technique_kind: process
technique_validated_by: "Compared against uniform random sampling on the 2,835
  VLA instances where a counterexample was found: sampling found nothing on 34
  within a 17,000-draw budget and was slower from two iterations onward;
  against the original H2V on 100 robust instances it used 15.3x fewer queries
  in total and decided all 100 where H2V left 32 undecided. A k-draw sampling
  protocol wrongly called an instance robust in 50% of its robust reports at
  k=1, 42% at k=10, 6% at k=100."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A validation run over the same continuous regions on these or
  comparable LIBERO-finetuned VLAs showing no action-changing perturbation
  within ±2° of rotation, or showing brightness failures below ±2%.
evidence_note: "Measured with region-level validation (not sampling) over 40
  LIBERO observations per model across 5 VLAs, 35.1M model queries. Aggregated
  rotation robustness rates: 96% at ±0.125°, 67% at ±1°, 40% at ±2°, 5% at
  ±10°. 9% of instances never reached a verdict and are reported as unknown,
  so rates condition on decided instances (29-39 of 40 per cell). Robust
  conclusions depend on Hölder constant estimates being upper bounds.
  Open-loop only; does not establish closed-loop task failure."
