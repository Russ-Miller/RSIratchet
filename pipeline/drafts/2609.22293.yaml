arxiv_id: "2609.22293"
title: "Validating, Not Sampling: Region-Level Robustness of Vision-Language
  and Vision-Language-Action Models"
url: https://doi.org/10.48550/arxiv.2609.22293
drafted_at: 2026-09-25
