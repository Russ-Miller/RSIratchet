arxiv_id: "2603.03192"
title: "MoD-DPO: Towards Mitigating Cross-modal Hallucinations in Omni LLMs
  using Modality Decoupled Preference Optimization"
url: https://doi.org/10.48550/arxiv.2603.03192
drafted_at: 2026-11-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For 7-8B omni (audio-video-language) LLMs, adding to the DPO
  objective a KL term that keeps outputs stable when the prompt-irrelevant
  modality is corrupted and one that forces outputs to shift when the
  prompt-relevant modality is corrupted lowers cross-modal hallucination more
  than vanilla or multimodal DPO at matched training budget, and the
  invariance term must be weighted well below the sensitivity term because
  cross-modal evidence is sometimes legitimately useful.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen2.5-Omni 7B and MiniCPM-O 2.6 8B post-trained on an 18.1k
  automatically generated audio/visual preference set; evaluated on AVHBench
  and CMM cross-modal hallucination benchmarks; corruption implemented as
  heavy diffusion noise on the non-target modality.
technique: ""
proposed_technique: Train preferences with modality invariance and sensitivity terms
technique_summary: Augments DPO with two stop-gradient KL regularizers —
  penalizing output change when the irrelevant modality is corrupted and
  rewarding output change when the relevant modality is corrupted — plus a
  penalty on the log-probability of the chosen response under text-only input
  to suppress language priors.
technique_kind: training
technique_validated_by: Accuracy/precision/recall/F1 on AVHBench and
  perception-accuracy/hallucination-resistance on CMM against the base models,
  vanilla DPO and OmniDPO at matched epochs-equivalent budget; component
  ablations zeroing each term; hyperparameter sweeps; plus general benchmarks
  (DailyOmni, MVBench, MMAU) to check no capability loss.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Replicating with the same preference data and budget and finding
  the two KL terms give no gain over vanilla DPO on AVHBench/CMM, or finding
  that weighting invariance equal to or above sensitivity performs as well or
  better.
evidence_note: Measured on two backbones and two hallucination benchmarks
  against DPO and OmniDPO baselines; ablations attribute gains to sensitivity
  (+~5 acc on AVHBench alone), invariance (+~4), and language-prior debiasing
  (mostly recall and hallucination resistance). Compute is not exactly matched
  — the method trains 1 epoch vs 4 for baselines, an approximation argued from
  gradient cost rather than measured FLOPs. Preference data is
  self-constructed, so data and objective are not fully separated from the
  baseline comparison.
confidence: medium
