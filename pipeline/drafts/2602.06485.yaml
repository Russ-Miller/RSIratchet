capability: long-horizon-execution
statement: "For a 4B agentic model on text-only GAIA deep-research tasks, the
  gap between single-shot and repeated-sampling success is far larger than the
  gap to larger models: the SFT checkpoint solves 97.09% of tasks at pass@64
  while pass@1 sits near 60-64%, so at this scale the limiting factor is
  selecting the right trajectory rather than possessing one."
kind: observation
backing_strength: single-paper
scope_condition: 4B Qwen3-Thinking-based deep-research agent with search and
  page-reading tools, evaluated on the text-only GAIA subset; pass@K measured
  by repeated independent rollouts.
technique: ""
proposed_technique: Map pass@K curves to separate capability from inference variance
technique_summary: Evaluate an agent at a range of K in pass@K across training
  stages to tell whether failures come from the policy lacking a solution path
  or from unreliable single-shot selection.
technique_kind: process
technique_validated_by: Pass@K curves on GAIA text-only across base, SFT,
  merged and RL checkpoints; RL shifted the pass@64 performance level down to
  pass@32 but moved pass@1 much less, which is the evidence offered for the
  variance interpretation.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A 4B agent whose pass@64 on GAIA text-only is close to its pass@1
  (e.g. both near 60%), or one where RL raises pass@1 to near the pass@64
  ceiling, would show the gap is a capability limit rather than a
  selection-variance limit.
evidence_note: Measured on one benchmark subset with one base model and one
  training pipeline; the 97.09% figure is a single reported pass@64 number
  with no confidence interval and no check that the 64 samples are not
  inflated by lucky tool returns or by GAIA's answer-matching being lenient.
  Does not isolate whether the same gap holds at larger scales or on other
  benchmarks.
confidence: low
