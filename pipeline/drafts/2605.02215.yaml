statement: Fine-tuned program-repair models that score well on HumanEval-Java-Bug lose more
  than half their Pass@10 under semantics-preserving rewrites of the buggy code, with local-variable
  renaming alone cutting performance by 50-57%, so much of measured repair skill is tied to
  the exact surface form of the bug.
