arxiv_id: "2601.01490"
title: "Distortion Instead of Hallucination: The Effect of Reasoning Under
  Strict Constraints"
url: https://doi.org/10.48550/arxiv.2601.01490
drafted_at: 2026-11-15
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: In closed-book bibliographic recommendation where the prompt
  imposes a format constraint the model's parametric knowledge cannot satisfy
  (peer-reviewed journal articles only, in conference-dominated CS topics) and
  refusal is disallowed, enabling reasoning mode cuts honest constraint
  violations but raises both distortion of genuinely known records into
  fabricated journal metadata and outright fabrication of nonexistent papers.
kind: observation
backing_strength: single-paper
scope_condition: Closed system, no retrieval or tools; refusal/'I don't know'
  prohibited by prompt; constraint deliberately unsatisfiable for most topics;
  two models tested (GPT-5.2, Gemini 3 Flash), 250 records per condition.
technique: ""
proposed_technique: Give the model a sanctioned fallback when a constraint is unsatisfiable
technique_summary: Explicitly permit an 'I don't know' or pre-defined fallback
  output instead of forcing every generated record to satisfy the stated
  constraint.
technique_kind: prompting
technique_validated_by: Not measured; argued from the observed trade-off only.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Under the same closed-book, refusal-disallowed setup, a reasoning
  condition that reduces constraint violations while holding distortion and
  fabrication rates at or below the non-reasoning baseline across several
  models.
evidence_note: "Measured: 25 CS topics x 10 records x 2 models x 2 reasoning
  settings, annotated against Google Scholar by 20 students with author
  validation. Constraint violations fell 74.8%->13.2% (GPT) and 66.0%->26.0%
  (Gemini), p<.001; conference->journal distortion rose 2.8%->9.2% and
  4.4%->10.0%, p<.05; complete fabrication rose 8.8%->10.8% (n.s.) and
  6.0%->12.0% (p<.05). Net authenticity moved in opposite directions by model
  (+5.1% GPT, -12.7% Gemini), so the aggregate harm is not consistent even
  though the trade-off direction is. Single task, single domain, no
  reasoning-trace analysis."
confidence: medium
