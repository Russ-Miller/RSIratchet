arxiv_id: "2603.07023"
title: "Hit-RAG: Learning to Reason with Long Contexts via Preference Alignment"
url: https://doi.org/10.48550/arxiv.2603.07023
drafted_at: 2026-11-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For 8B-70B open backbones doing retrieval-augmented QA over ~20
  retrieved documents, a staged pipeline of supervised fine-tuning on
  saturated contexts, then DPO on preference pairs contrasting the model's own
  correct and incorrect answers under correct and distractor-laden evidence,
  then GRPO with an answer-correctness plus reranker-agreement reward, raises
  accuracy on knowledge-intensive benchmarks, with the gains falling off
  sharply after the first two stages.
kind: observation
backing_strength: single-paper
scope_condition: 8B-70B Qwen3/Llama3.1 and Qwen2.5-VL backbones; Top-20
  retrieval; 32k max sequence; evaluated zero-shot on eight text and four
  multimodal QA benchmarks with disjoint training pools
technique: ""
proposed_technique: "Stage long-context RAG training: ground, then discriminate, then RL"
technique_summary: "Trains a generator in three passes over retrieved
  evidence: SFT on context-saturated prompts with gold answers, DPO on pairs
  built from the model's own correct/incorrect generations under correct
  versus distractor evidence, and GRPO rewarding both final-answer correctness
  and agreement with a reranker's document relevance scores."
technique_kind: training
technique_validated_by: Cumulative ablation on Qwen3-8B and Llama3.1-8B across
  seven QA datasets against no-retrieval and retrieval-only baselines; e.g.
  Qwen3-8B PopQA 20.6 (no RAG) to 52.1 (RAG) to 58.4 (+SFT) to 62.4 (+DPO) to
  63.1 (+GRPO). No matched-compute or data-volume control for the staging
  itself.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation at matched token/compute budget showing single-stage
  SFT on the same data reaches the same accuracy as the three-stage pipeline,
  or showing the DPO stage contributes nothing once SFT data volume is
  equalized.
evidence_note: Measured on eight text and four multimodal benchmarks with
  per-stage ablation on two 8B backbones. The staircase is monotone but stage
  contributions shrink (GRPO adds ~0.5-2.6 points), and the paper itself
  reports GRPO suffering gradient stagnation where no sampled rollout is
  correct. No control isolating staging from extra training compute; absolute
  numbers are compared against baselines taken from other papers rather than
  rerun.
