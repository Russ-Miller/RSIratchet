arxiv_id: "2602.16720"
title: "APEX-SQL: Talking to the data via Agentic Exploration for Text-to-SQL"
url: https://doi.org/10.48550/arxiv.2602.16720
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: On enterprise-scale text-to-SQL (Spider 2.0-Snow, oracle schema
  given), letting the agent execute exploratory probes against the live
  database before writing the final query raises execution accuracy for every
  backbone tested, but the gain scales with backbone capability — about 5
  points for GPT-4o versus 17-18 points for DeepSeek-V3.2 and GPT-4.1 — so
  exploration multiplies existing reasoning capacity rather than substituting
  for it.
kind: observation
backing_strength: single-paper
scope_condition: 120-case Spider 2.0-Snow subset with ground-truth schema
  supplied; baseline is pure SQL generation with execution-error-guided
  refinement; eight samples per task.
technique: ""
proposed_technique: Probe the database before writing SQL, under retrieved directives
technique_summary: Before emitting the final query, the agent runs exploratory
  SQL to profile value distributions, formats and nulls, with the probes
  steered by directives deterministically keyword-matched from an inferred
  logical plan to a library of SQL pitfalls.
technique_kind: tooling
technique_validated_by: Execution accuracy and Pass@8 on Spider 2.0-Snow
  (53.03% EX, 68.44% Pass@8 with DeepSeek-R1) and BIRD-Dev (70.7%) against
  published baselines; ablations compare with/without exploration across eight
  backbones under oracle schema, and with/without the guidance directives
  (EX@8 drops 0.7-4.3 points without them, with more exploration rounds
  needed).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same with/without-exploration comparison on a wider
  backbone set and finding weaker models gain as much as or more than stronger
  ones, or finding the gain for strong models disappears once the
  no-exploration baseline is given matched token budget.
evidence_note: Measured on a 120-case subset of one benchmark with oracle
  schema, eight backbones, three conditions. The capability ordering is
  suggestive but not monotone (GPT-5 gains 14.2, DeepSeek-R1 only 5.8 despite
  scoring higher without exploration), and compute between arms is not
  matched, so some of the gain may be extra inference rather than grounding.
confidence: medium
