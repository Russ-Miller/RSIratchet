arxiv_id: "2609.07370"
title: "Beyond Fluent Generation: A CPU Reliability Benchmark for MCP-Style
  Tool Calling in Sub-2B Small Language Models for Edge Deployment"
url: https://arxiv.org/abs/2609.07370
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: tool-use
statement: "For sub-2B open-weight models emitting JSON tool calls from
  prompts that already name the tool and all argument values, reported success
  depends almost entirely on a post-hoc recovery layer that strips code fences
  and extracts a brace-delimited substring: across 1,000 generations only 5
  whole raw responses parsed as JSON directly, while the best condition
  reached 79% after recovery."
kind: observation
backing_strength: single-paper
scope_condition: Five checkpoints below 2B (Phi-1.5, Pythia-1.4B,
  TinyLlama-1.1B-Chat, Qwen2.5-0.5B/1.5B), no chat templates applied, 100
  fully specified single-call prompts, no tool execution, greedy and one
  sampling run each.
technique: ""
