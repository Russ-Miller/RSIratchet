stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Re-running comparable sub-2B checkpoints (with their official chat
  templates) and finding that most raw responses are directly parseable as
  JSON, so recovery adds little to measured success.
evidence_note: "Single small benchmark: 100 templated prompts per condition,
  10 conditions, Wilson intervals and McNemar tests reported. Base models were
  run without chat templates and generation was capped at 150 tokens, so
  truncation and template mismatch are plausible contributors to the low
  strict-JSON rate; the design does not isolate them."
