arxiv_id: "2607.10059"
title: "AgentAbstain: Do LLM Agents Know When Not to Act?"
url: https://doi.org/10.48550/arxiv.2607.10059
drafted_at: 2026-10-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: "For tool-using LLM agents on paired should-act/should-abstain
  tasks in executable sandboxes, the ability to withhold a critical action is
  largely independent of task-solving ability: across 17 frontier models mean
  act accuracy (80.6%) exceeds abstain accuracy (59.1%) by about 21 points,
  per-pair act-pass and abstain-pass outcomes correlate slightly negatively
  (mean phi -0.10, 15 of 17 negative), and the best agent reaches only 59.5%
  paired accuracy."
kind: observation
backing_strength: single-paper
scope_condition: 17 frontier models in 4 agent harnesses, 263 paired tasks
  across 42 auto-generated MCP sandbox environments, one run per task;
  abstention defined as explicit refusal or clarification request at
  termination.
technique: ""
proposed_technique: Pair every should-act task with a minimally perturbed should-abstain twin
technique_summary: Build each benchmark item as two tasks sharing one sandbox
  that differ by exactly one trigger in the instruction, environment state, or
  tool set, and score an agent only when it handles both sides, combining a
  deterministic commit check on the tool-call trace with an LLM judge on the
  final response.
technique_kind: process
technique_validated_by: By construction no always-act or always-refuse policy
  can exceed 50% paired accuracy; three independent annotators rated 94-98% of
  a stratified 100-pair sample as well-designed; the two-signal combination
  blocked 98 of 115 post-hoc abstention cases that a judge or commit check
  alone would have passed.
stance_on_existing: supports
related_claim_id: selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical
stance_reason: Extends the finding that self-knowledge lags capability from
  text QA to tool-using agents, showing scale and task-solving skill do not
  deliver calibrated restraint.
falsifier: A model whose paired accuracy rises mainly because higher act
  accuracy carries abstain accuracy with it, or a positive per-pair
  correlation between act-pass and abstain-pass across a comparable model set,
  would show the two capabilities are not independent.
evidence_note: Measured over 17 models x 263 pairs, one run per task, with
  auto-generated environments validated by DAG replay, cross-family LLM
  critics and human spot-checks; statistics reported include Pearson r = -0.25
  (p<0.01) across 136 model-by-category points and per-model phi coefficients.
  Single-run-per-task means variance is not isolated, and the tasks and judge
  are themselves LLM-produced.
confidence: medium
