arxiv_id: "2609.09865"
title: "Keep Evaluation Fair: Detecting Data Leakage in Code Generation
  Benchmarks via Membership Inference Attacks"
url: https://doi.org/10.48550/arxiv.2609.09865
drafted_at: 2026-09-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: For code generation benchmarks, deciding whether a benchmark item
  leaked into a model's training set is done better by a classifier over
  code-specific signals (test pass rate, CodeBLEU, edit distance, perplexity,
  CodeBERT embeddings of generated vs reference code) than by perplexity
  alone, because memorized items show abnormally high functional correctness
  and similarity to the reference solution, not just low perplexity.
kind: mechanism
backing_strength: single-paper
scope_condition: Black-box query access with token log-probabilities; shadow
  model fine-tuned on a disjoint benchmark subset; small code LLMs (1.3B-3B)
  as targets; leakage mostly simulated by fine-tuning, with one real-leakage
  check on StarCoder-7B/APPS.
technique: ""
proposed_technique: Detect benchmark leakage with a code-specific membership classifier
technique_summary: Fine-tune a shadow model on part of a benchmark to label
  members and non-members, then train a classifier on expert features (pass
  rate, CodeBLEU, edit distance, perplexity) fused with CodeBERT embeddings to
  predict whether a benchmark item was in a target model's training data.
technique_kind: process
technique_validated_by: "Eight benchmarks, four target models, against eight
  MIA baselines: average gains of 0.05-0.16 Precision, 0.06-0.11 Recall,
  0.17-0.26 MCC, 0.09-0.13 AUC over the strongest baseline per model;
  recovered over 65% of 108 known leaked APPS samples in StarCoder-7B."
stance_on_existing: supports
related_claim_id: static-code-benchmarks-saturate-need-continuous-refresh
stance_reason: The paper documents that widely used code benchmarks leak into
  training data and that leaked items yield inflated pass@1, which is the
  pressure behind continuous benchmark refresh.
falsifier: An evaluation where adding functional-correctness and similarity
  features to a perplexity-only detector gives no improvement in MCC/AUC, or
  where the classifier's advantage disappears on real (not
  fine-tuning-simulated) leakage.
evidence_note: Measured on eight benchmarks and four small code models, but
  membership is mostly created by the authors' own LoRA fine-tuning, which
  likely leaves stronger memorization traces than incidental pretraining
  leakage; only one real-leakage case (StarCoder-7B/APPS, >65% recovered)
  tests the harder setting, and no false-positive rate is reported there.
confidence: medium
