arxiv_id: "2604.09580"
title: "OOWM: Structuring Embodied Reasoning and Planning via Object-Oriented
  Programmatic World Modeling"
url: https://doi.org/10.48550/arxiv.2604.09580
drafted_at: 2026-11-09
