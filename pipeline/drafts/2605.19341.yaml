  simulation/perception-heavy inference.
falsifier: A within-family thinking/non-thinking comparison on the same probes
  showing causal hallucination falling or flat with extended thinking across
  several model families.
evidence_note: Measured hallucination rates by probe category across 33
  gridworld levels and 839 probes; the thinking effect is reported for two
  Claude variants only (P 2.8->1.1 and 3.7->1.7; C 19.7->24.0 and 20.1->25.2),
  with no controlled token budget between thinking and non-thinking elsewhere
  in the paper, and the mechanism (extra reasoning confabulating intermediate
  states) is hypothesised rather than tested.
