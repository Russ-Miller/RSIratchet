capability: hallucination
statement: Reweighting a transformer's token-level attention graph during
  decoding — downweighting tokens whose combined self-attention and
  gradient-based influence score marks them as hallucination-prone — lowers
  hallucination rate and raises factual accuracy on TruthfulQA and HotpotQA
  relative to retrieval-augmented generation baselines.
kind: mechanism
backing_strength: single-paper
scope_condition: Reported only for a transformer LLM with internal attention
  and gradient access, on TruthfulQA and HotpotQA; base model, size and
  baseline configuration are not stated in the available text.
technique: ""
proposed_technique: Downweight hallucination-prone tokens in the attention graph
technique_summary: Builds a token-level graph from self-attention weights plus
  gradient-based influence, scores each token's causal contribution, and
  reduces the influence of high-risk nodes during generation.
technique_kind: decoding
technique_validated_by: Reported 27.8% reduction in hallucination rate and
  16.4% improvement in factual accuracy on TruthfulQA and HotpotQA against
  retrieval-augmented generation baselines; no ablation, model identity, or
  variance reported in the available text.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Applying the same graph reweighting on a disclosed backbone against
  a matched RAG baseline fails to lower hallucination rate, or an ablation
  shows a random-node reweighting of equal strength gives the same reduction
  (i.e. the gain comes from suppressing output content rather than from the
  causal scoring).
evidence_note: Single short abstract-level account with two headline
  percentages and no stated backbone, baseline detail, dataset sizes, ablation
  or coverage/informativeness control; in this literature hallucination-rate
  drops frequently co-occur with the model saying less, and nothing here rules
  that out.
