falsifier: Measuring probe-vs-verdict agreement on more models and languages
  and finding faithfulness highest in the dominant pretraining language for
  multilingual models too, or showing the reported gap disappears once probe
  accuracy differences across languages are accounted for.
evidence_note: Measured on one benchmark (ReliableMath) machine-translated and
  human-validated into two languages; faithfulness uses ground-truth
  solvability as a proxy for internal belief and an LLM judge (Llama-3.3-70B,
  validated on 100 samples) for the verdict, so the probe may partly measure
  task label rather than belief. Differences between languages are a few
  points (e.g. Qwen3-4B 0.691 En vs 0.728 Fr/Gr); no confidence intervals
  given in the excerpt for Table 2.
