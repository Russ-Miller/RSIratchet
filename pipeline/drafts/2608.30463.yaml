capability: explanation-faithfulness
statement: On paired solvable/unsolvable math problems translated into French
  and Greek, natively multilingual models (Gemma-4-31B, Qwen3-4B/30B) encode
  solvability most sharply in English yet agree least with that internal
  belief in their stated verdict in English, being more faithful in the
  lower-resource languages, while a weakly multilingual model (Llama-3.1-8B)
  shows the opposite ordering.
kind: observation
backing_strength: single-paper
scope_condition: Six instruction-tuned models, English/French/Greek
  translations of ReliableMath (313 solvable, 1,102 unsolvable), faithfulness
  defined as agreement between a pooled linear probe on hidden states and an
  LLM-judge reading of the reasoning trace.
