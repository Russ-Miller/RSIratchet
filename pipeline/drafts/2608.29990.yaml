statement: On expert-authored Saudi-dialect prompts scored against rubric
  criteria derived from expert ground truths, four frontier models all score
  under 55% and their dominant failure is distorting register and flattening
  pragmatic nuance (37.3% of 466 errors) rather than stating falsehoods
  (11.2%), so MSA-fluent models are not dialectally competent.
