arxiv_id: "2602.15854"
title: Decoupling Strategy and Execution in Task-Focused Dialogue via
  Goal-Oriented Preference Optimization
url: https://doi.org/10.48550/arxiv.2602.15854
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: In multi-turn task-oriented customer-service dialogue, splitting
  the agent into a strategy planner that selects a skill sequence and a
  response generator constrained to execute it, with the planner trained by
  trajectory-level preference reward, raises sequence-level task completion
  over single-agent PPO and trajectory-preference baselines, and removing the
  planner lowers sequence-level success while leaving or raising n-gram
  overlap with references.
kind: observation
backing_strength: single-paper
scope_condition: E-commerce customer service and MultiWOZ dialogue datasets,
  Qwen 7B-14B backbones, reward partly from LLM judges and a teacher-generated
  reference skill sequence; evaluation is offline on a metric introduced by
  the same authors.
technique: ""
proposed_technique: Plan a skill sequence in a separate agent, execute under hard constraints
technique_summary: A planner agent picks a sequence of skills from a fixed
  pool each turn, compiles them into structured constraints, and a second
  agent generates the reply under those constraints, with the planner rewarded
  by rank-discounted agreement with an offline teacher skill sequence at the
  trajectory level.
technique_kind: training
technique_validated_by: Compared against untrained, SFT, PPO and Memento on
  four dialogue datasets using a sequence-level engagement metric (TSE), an
  LLM-judged per-turn metric (GRE), BLEU and G-Eval; ablation removed the
  planner agent, and mixed-agent swaps replaced each agent with a
  non-jointly-trained model.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Under a fixed backbone and matched training compute, the decoupled
  planner-executor system scores no better than single-agent RL on
  sequence-level task completion, or the planner ablation leaves
  sequence-level success unchanged.
evidence_note: "Measured on four datasets (two internal e-commerce, Mgshop,
  MultiWOZ) with Qwen 7B/8B/14B. Reported gains: TSE +0.6-7.7% over PPO,
  +9-12% over Memento; ablation drops TSE 5.7% on TmallBrand-A while BLEU
  rises. Weak isolation: the headline metric TSE is introduced by the same
  paper, two datasets are internal and unreleased, two reward terms come from
  LLM judges, and there is no matched-compute or matched-token-budget control
  between the dual-agent and single-agent arms."
confidence: low
