arxiv_id: "2603.17662"
title: "FINER: MLLMs Hallucinate under Fine-grained Negative Queries"
url: https://doi.org/10.48550/arxiv.2603.17662
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: For 7-14B open MLLMs, whose accuracy at rejecting a query collapses
  as a single wrong object, attribute or relation is embedded among several
  correct ones, DPO on minimally-edited fine-grained negative queries paired
  with their positive counterparts raises paired rejection accuracy by up to
  24 points and also improves eight existing hallucination suites, whereas
  negative-only DPO or SFT on the same data does worse.
kind: observation
backing_strength: single-paper
scope_condition: LLaVA-1.6-7B, Qwen2.5-VL-7B, InternVL-3.5-8B/14B; LoRA DPO on
  ~160k preference tuples built from Pixmo captions; evaluated on paired
  multiple-choice questions over CompreCap and DOCCI scene graphs. Wh-style
  questions (asking about an object via a wrong attribute) remain hard and can
  get worse after tuning on some models.
technique: ""
proposed_technique: Train on minimally-edited fine-grained negative queries,
  paired with positives
technique_summary: Builds DPO preference pairs where the query itself contains
  one plausible but wrong object, attribute or relation among otherwise
  correct scene content, and includes the matching all-correct query so the
  model cannot learn to just say No.
technique_kind: training
technique_validated_by: Paired accuracy (both positive and negative variant
  correct) on FINER-CompreCap and FINER-DOCCI across four settings, against
  the untuned backbone and against prior hallucination fine-tuning methods
  (RLAIF-V, OPA-DPO, RLHF-V, LLaVA-RLHF); plus eight hallucination benchmarks
  and six general benchmarks to check for an alignment tax; ablations against
  SFT and negative-only DPO.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the same DPO data raises paired accuracy no
  more than negative-only DPO, or where gains on the fine-grained benchmark
  come with losses on POPE/RePOPE/MMStar of comparable size.
evidence_note: Measured on four backbones with before/after comparisons and
  two held-out benchmark families; the training corpus deliberately excludes
  COCO and the DOCCI train split. Benchmark negatives are LLM-generated with
  MLLM-discriminator filtering and only sampled human verification, so some
  negatives may in fact be present in the image. Gains concentrate in
  Multi-attr and Multi-rel; the Wh setting degrades for three of four models
  after tuning, which the summary 'up to 24.2%' figure hides.
confidence: medium
