capability: evaluation-validity
statement: "When grading free-form answers to algorithm-analysis and
  complexity-theory questions against instructor reference answers, n-gram
  overlap metrics carry almost no signal about answer quality, because
  logically equivalent proofs differ in notation, variable names and proof
  strategy: BLEU-4 was 0.0000 on all 179 questions and ROUGE-1 F1 stayed in a
  narrow 0.088-0.129 band across topics while a rubric score varied from 0.66
  to 0.83."
kind: mechanism
backing_strength: single-paper
scope_condition: Open-ended mathematical proof and complexity-analysis answers
  scored against a single short instructor reference; one RAG system built on
  DeepSeek V3.
technique: ""
proposed_technique: Score proof answers with a binary pedagogical rubric, not n-grams
technique_summary: Replace lexical-overlap scoring with the mean of six binary
  per-response criteria (step enumeration, notation correctness, worked
  example, sub-question coverage, explanation depth, proof-step granularity).
technique_kind: process
technique_validated_by: Applied to all 179 responses; the rubric separated
  topics (0.6629 recurrence relations to 0.8250 sorting) where ROUGE did not.
  No human learning-outcome validation and no inter-rater reliability for the
  rubric are reported.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Show that on the same or similar proof-answer sets, BLEU/ROUGE rank
  systems in the same order as expert human quality judgements, or that
  near-zero BLEU corresponds to genuinely poor answers when experts grade
  them.
evidence_note: Measured on 179 curated questions from one system, with no
  baseline system and no comparison to human grading; the divergence between
  metrics is documented but the rubric is unvalidated against learning
  outcomes or independent raters, and the rubric was applied by the authors'
  own harness.
