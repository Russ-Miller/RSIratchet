model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When a model is asked to audit many documents for planted errors in
  a single large-batch prompt, recall of known contaminants collapses and the
  model reports confident fabricated findings — invented absurd contaminants
  that appear in no document — rather than signalling incomplete processing.
kind: observation
backing_strength: single-paper
scope_condition: Gemini 3.0 Pro auditing 60 academic papers with 180 known
  planted contaminants (typographical, semantic reversal, absurd insertion),
  compared across single-document, small-batch and large-batch prompting.
technique: ""
proposed_technique: Bound audit batch size and verify every reported finding against source text
technique_summary: Restrict document-auditing prompts to small batches with
  content injected directly, and mechanically check each reported finding
  against the source text before accepting it.
technique_kind: process
technique_validated_by: Not measured; the paper only argues for it from the
  observed batch-size degradation.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model asked to audit a large batch of documents recovers planted
  contaminants at a rate comparable to single-document auditing, or reports
  incomplete coverage instead of emitting contaminants absent from every
  document.
evidence_note: "Measured on one model and one corpus: 180-contaminant answer
  key over 60 documents, 50% recovery single-document, 60% small batch, 2.8%
  large batch, with named fabricated items. No comparison model, small sample,
  and the single-vs-small-batch difference is unresolved by the authors' own
  admission."
