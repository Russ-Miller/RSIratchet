statement: For 2B-8B video multimodal models fine-tuned for temporal
  reasoning, placing a small minority of reversed-video rollouts in each GRPO
  group (1 reversed out of 7) beats both all-forward GRPO and larger reversed
  shares (2 or 3 of 7), because more reversed samples dilute the main
  forward-video answering objective.
