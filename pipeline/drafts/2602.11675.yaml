arxiv_id: "2602.11675"
title: "Epistemic Regret Minimization: Label-Free Causal Critique Beyond
  Outcome Reward"
url: https://doi.org/10.48550/arxiv.2602.11675
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: On causal-reasoning items where a model has already given a wrong
  answer by substituting correlational for interventional reasoning, a
  critique that names structural flaws in the exposed reasoning trace
  (unexamined confounders, back-door paths) recovers far more items than
  outcome-only reprompting, and the gap is largest for reasoning-heavy models
  that barely respond to 'are you sure?'
kind: observation
backing_strength: single-paper
scope_condition: Text-based causal QA benchmarks (CausalT5K, CLadder L2)
  deliberately built so the correlational answer is wrong; correction
  evaluated only on each model's already-failed cases; headline gains used a
  benchmark-derived rationale plus an explicit 'you were incorrect' cue, and
  fully label-free critique recovered less (e.g. 55.9% for GPT-4 Turbo) though
  with zero false flips.
technique: ""
proposed_technique: Critique the causal structure of the trace, not the answer
technique_summary: A judge reads the model's exposed reasoning trace and flags
  structural causal faults — unexamined confounders, correlation-intervention
  conflation, unchecked back-door paths — and returns that critique for
  revision, without access to the correct answer.
technique_kind: prompting
technique_validated_by: Recovery rate on each model's failed cases across
  1,360 CausalT5K scenarios and six models, against outcome-only reprompting,
  self-consistency, Best-of-N and Self-Refine; GPT-4 Turbo 31.4% to 90.5% and
  GPT-5.2 24.5% to 77.6% (McNemar p<.001), residual rung collapse 4% vs 55-70%
  for the test-time baselines; a matched-length non-causal control isolated
  the causal vocabulary for GPT-4 Turbo (58.7% vs 52.8%, p=0.006) but not for
  GPT-5.2 (p=0.093).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On a causal benchmark not built so the correlational answer is
  always wrong, structural causal critique recovers no more failed items than
  a matched-length generic critique or outcome-only reprompting, including for
  reasoning-heavy models.
evidence_note: Measured on 1,360 CausalT5K scenarios plus a 4,054-item v2
  ablation across six frontier models, with McNemar tests, a matched-richness
  control and a scenario-blind judge. The benchmark is adversarial to
  correlational shortcuts by construction, so the base rate of repairable
  errors is inflated; the headline condition leaks an error-direction cue, and
  the causal-vocabulary effect was load-bearing on only one of two stubborn
  models. Compliant models had little headroom and one (Claude) got worse.
confidence: medium
