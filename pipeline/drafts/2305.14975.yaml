arxiv_id: '2305.14975'
title: 'Just Ask for Calibration: Strategies for Eliciting Calibrated Confidence Scores from
  Language Models Fine-Tuned with Human Feedback'
url: https://arxiv.org/abs/2305.14975
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: abstention-and-self-knowledge
statement: For RLHF-tuned chat models the raw conditional probabilities are consistently overconfident,
  and a confidence the model states in words or as a number in its output is better calibrated,
  often halving expected calibration error on TriviaQA, SciQ and TruthfulQA; asking the model
  to list several candidate answers before giving confidences improves it further, while chain-of-thought
  does not.
kind: observation
backing_strength: single-paper
scope_condition: ChatGPT (gpt-3.5-turbo), GPT-4, Claude 1 and 2 and Llama-2-70B-Chat, 2023;
  short-answer factual QA; gains on Llama-2-Chat were smaller and less consistent.
technique: ''
proposed_technique: Verbalized confidence after listing alternatives
technique_summary: Prompt the model to produce several candidate answers and then state a numeric
  confidence for each, and use the stated number rather than token log-probabilities as the
  confidence signal for deferral or abstention.
technique_kind: prompting
technique_validated_by: Expected calibration error, Brier score and selective accuracy on TriviaQA,
  SciQ and TruthfulQA comparing raw log-probabilities, verbalized numbers, verbalized words
  and multi-candidate prompting across five RLHF models; chain-of-thought variant tested and
  found not to help.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Newer RLHF models whose raw probabilities are as well calibrated as verbalized confidences,
  or tasks (long-form, reasoning) where verbalized confidence is no better than log-probabilities.
evidence_note: Three factual QA benchmarks and five models; the weak result on Llama-2-Chat
  suggests the effect depends on the training recipe. The 'relative 50%' figure is a typical,
  not universal, reduction.
confidence: medium
