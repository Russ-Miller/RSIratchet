arxiv_id: "2607.04854"
title: "CARL: Constraint-Aware Reinforcement Learning for Planning with LLMs"
url: https://arxiv.org/abs/2607.04854
drafted_at: 2026-10-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: For 1.7B-14B open models trained with RL on planning tasks, adding
  a reward term equal to the KL divergence between the policy's output
  distribution given the full query and given the query with constraint tokens
  removed raises plan validity and all-constraint (macro) pass rates over
  standard outcome-reward RL fine-tuning, and also supplies gradient where
  outcome reward alone is zero because the base model never samples a success.
kind: mechanism
backing_strength: single-paper
scope_condition: Planning benchmarks with separable goal and constraint spans
  (BlocksWorld, TravelPlanner, T-Eval), small training sets (45-128 queries),
  GRPO/PPO/DPO; constraints extracted explicitly or by a prompt heuristic.
technique: ""
proposed_technique: Reward the output shift caused by the constraint tokens
technique_summary: Adds to the RL reward the KL divergence between the model's
  output distribution on the full query and on the same query with constraint
  tokens deleted, so the policy is paid for letting constraints change its
  generation.
technique_kind: training
technique_validated_by: Qwen3-8B final pass rate on TravelPlanner 56.1% vs
  45.0% RFT and 2.2% untrained; BlocksWorld 77.2 vs 73.8 RFT; gains replicated
  under PPO (81.6 vs 78.4) and DPO (53.8 vs 51.4); masking goals instead of
  constraints scored below RFT (70.4); attribution scores on constraint tokens
  shifted upward across the distribution.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matching the extra compute of the constraint-ablated forward pass
  by more rollouts under plain outcome-reward RL closes the gap, or the gain
  disappears on planning tasks where constraint spans cannot be cleanly
  delimited.
evidence_note: Measured on three benchmarks with two 8B backbones plus a Qwen3
  size sweep, against RFT and prompted frontier models; ablations cover
  masking target and discrepancy metric. Training sets are very small (45-128
  queries) and test sets modest (180-500), single paper, and the
  compute-matched baseline is only reported in an appendix the text does not
  show.
confidence: medium
