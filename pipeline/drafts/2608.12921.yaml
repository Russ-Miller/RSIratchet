arxiv_id: "2608.12921"
title: Discovering Efficient and Explainable Communication Topologies for
  LLM-based Multi-Agent Systems via Causal Inference
url: https://doi.org/10.48550/arxiv.2608.12921
drafted_at: 2026-10-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: "In LLM multi-agent systems whose communication graph is produced
  by a learned topology generator, the generated graph carries edges that are
  not needed: scoring each edge by how much masking it changes the task
  outcome and the semantic entropy of the final answer, then keeping a
  top-ranked budgeted subgraph, cuts online tokens by about 20-25% while
  leaving average accuracy equal or slightly higher, and a small distilled
  predictor of those subgraphs transfers to generators and agent counts it was
  not calibrated on."
kind: observation
backing_strength: single-paper
scope_condition: Qwen3-8B backbone, 5-6 agent systems, four topology
  generators (G-Designer, ARG-Designer, OFA-MAS, AgentPrune), six
  math/knowledge/code benchmarks; 40 calibration queries per dataset; default
  25% edge / 20% node pruning budget.
technique: ""
proposed_technique: Rank communication edges by masking effect, then prune to budget
technique_summary: Mask each communication edge in a generated multi-agent
  graph, score it by the drop in task score plus the rise in semantic entropy
  of the final response, keep the top-ranked edges under a pruning budget, and
  distill those subgraphs into a predictor that emits them in one forward pass
  at deployment.
technique_kind: process
technique_validated_by: "Accuracy and measured online token usage versus each
  unpruned generator across 24 generator-dataset cells: tokens fell in all 24
  (10.6%-44.0%), accuracy rose in 16; ablations show removing the causal
  masking signal costs about 4 accuracy points on MMLU and HumanEval and most
  of the token saving, and removing semantic entropy costs about 2-3 points."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the same budgeted subgraphs are compared
  against random edge masking at equal retained-edge budget and show no
  accuracy or token advantage, or where the distilled explainer applied to an
  unseen generator lowers accuracy relative to the unpruned graph.
evidence_note: Measured on six benchmarks with one backbone; token savings are
  consistent across all 24 cells while accuracy changes are mixed per dataset
  (GSM8K, MultiArith, SVAMP sometimes drop). The design compares against
  unpruned generator graphs, not against a matched-budget random-pruning
  control; the supporting figure shows random masking usually degrades
  accuracy but at varying ratios, so the random baseline is not
  budget-matched. Transfer claims rest on single-cell comparisons (one 5-to-6
  agent test, two datasets).
confidence: medium
