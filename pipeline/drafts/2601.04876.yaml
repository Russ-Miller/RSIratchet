falsifier: On the same duration strata, show a model whose transcription or
  localization score at 10-20 minutes stays within a modest fraction of its
  short-form score, or show that summarization degrades as steeply as
  transcription across both open and closed models.
evidence_note: "Measured across 16 open and closed ALLMs on six task families
  at three duration bands, 5 rounds averaged. The task-type asymmetry is
  visible in the reported table. Weaknesses: audio is wholly synthetic TTS of
  written Wikipedia text, so degradation may partly reflect distribution shift
  rather than duration; scoring is by LLM judge with hand-set weighting
  coefficients that are not reported; the authors' attribution to attention
  dilution is shown only as heatmaps on three open models and is not isolated
  from decoder length effects."
