statement: "On synthetic TTS English audio stratified from 30s to 20 minutes,
  audio LLMs degrade unevenly as duration grows: verbatim and temporal tasks
  (transcription, dictation, localization, speaker attribution) fall to near
  zero by the 10-20 minute band for nearly all of 16 models, while high-level
  summarization holds up in closed-source models (average ~59 at long vs ~75
  at short) and collapses in open-source ones (~14 vs ~41)."
