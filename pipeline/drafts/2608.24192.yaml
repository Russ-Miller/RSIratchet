arxiv_id: "2608.24192"
title: Preference Data Selection for Mitigating the Alignment Tax in Large
  Language Models
url: https://doi.org/10.48550/arxiv.2608.24192
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fine-tuning-retention
statement: "In DPO alignment of 7-8B instruct models, the alignment tax is
  predictable from properties of the preference pairs themselves: pairs whose
  chosen/rejected log-probability margin under the reference model is large in
  magnitude, or whose chosen/rejected token-length difference is large, cause
  the most loss of general capability, so dropping them keeps most of the
  alignment gain while cutting forgetting."
kind: mechanism
backing_strength: single-paper
scope_condition: Offline DPO on HH-RLHF with Llama-3.1-8B-Instruct and
  Qwen2.5-7B-Instruct, 5% data budget, general capability measured on MMLU,
  IFEval, ARC-Challenge, HumanEval, GSM8K.
technique: ""
proposed_technique: Filter preference pairs by reference margin, length gap, lexical overlap
technique_summary: Score each preference pair by a normalized composite of
  |reference-model per-token log-prob margin|, chosen-minus-rejected token
  length difference, and TF-IDF similarity to a general-capability corpus,
  then train DPO only on the lowest-risk quantile.
technique_kind: training
technique_validated_by: "Against Full, Random, and nine SFT/alignment
  data-selection baselines at a fixed 5% budget on HH-RLHF: general-capability
  drop 0.86/0.38 points (Llama/Qwen, helpfulness) versus 5.35/2.31 for
  full-data DPO, while alignment gain stayed near the best baseline; bucket
  experiment shows forgetting rising from 0.08 to 3.48 across reference-margin
  quantiles; ablation removing each score degrades either forgetting or
  alignment."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Partitioning a preference dataset by reference-margin magnitude or
  length difference and training DPO on each bucket shows no monotone relation
  to general-benchmark degradation, or the composite filter loses as much
  general capability as random selection at equal budget.
evidence_note: Measured on one preference dataset (HH-RLHF) and two 7-8B
  instruct models, two objectives (helpfulness, harmlessness), five general
  benchmarks; bucket experiment gives a dose-response for each feature
  separately, and ablations separate the three scores. Not tested on larger
  models, on other preference datasets, or with online RL alignment; the
  TF-IDF component needs access to the general corpus being preserved.
confidence: medium
