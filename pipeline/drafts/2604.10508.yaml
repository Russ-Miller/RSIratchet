arxiv_id: "2604.10508"
title: How Many Tries Does It Take? Iterative Self-Repair in LLM Code
  Generation Across Model Scales and Benchmarks
url: https://doi.org/10.48550/arxiv.2604.10508
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For modern instruction-tuned models (8B to frontier scale) given
  raw execution error messages and up to five attempts on HumanEval and MBPP,
  iterative self-repair raises pass rates for every model tested, but the gain
  is concentrated in the first two repair rounds and is smallest for assertion
  errors, where the code runs yet computes the wrong answer.
kind: observation
backing_strength: single-paper
scope_condition: Seven models across Llama 3.1/3.3/4, Qwen3 32B and Gemini
  2.5; HumanEval (164) and MBPP Sanitized (257); greedy decoding; feedback is
  the real execution traceback.
technique: external-feedback-repair
proposed_technique: ""
technique_summary: ""
technique_kind: ""
technique_validated_by: ""
stance_on_existing: supports
related_claim_id: external-feedback-repair-works-only-with-real-grounding
stance_reason: Gains come from feeding back genuine execution errors, and the
  hardest category is the one where the error message carries least diagnostic
  information.
falsifier: A comparable evaluation where some modern instruction-tuned models
  lose pass rate under execution-feedback repair, or where gains keep accruing
  roughly linearly past round two, or where assertion errors are repaired as
  often as syntax and name errors.
evidence_note: "Measured: +4.9 to +17.1 pp on HumanEval and +16.0 to +30.0 pp
  on MBPP across seven models; two rounds capture 76-95% of gains; assertion
  errors repaired ~45% vs name errors ~77%. Single paper, two benchmarks, no
  matched-compute resampling baseline in the headline numbers (a separate
  token-efficiency comparison is reported)."
