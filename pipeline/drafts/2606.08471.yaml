arxiv_id: "2606.08471"
title: "More Yap Less Meaning: Uncovering Self-Improvement Behavior in SLMs"
url: https://arxiv.org/abs/2606.08471
drafted_at: 2026-10-30
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For small language models (1.5B-8B, instruction-tuned and
  reasoning) on arithmetic and logical reasoning benchmarks, being shown the
  ground-truth answer alongside their own wrong chain of thought and asked to
  write hints for a retry yields only about a 4.4% average accuracy gain, and
  the hints that work are not semantically distinguishable from those that do
  not.
kind: observation
backing_strength: single-paper
scope_condition: Open-weight models 1.5B-8B across five reasoning benchmarks
  (GSM8K, ASDiv, AQuA, AR-LSAT, Sports Understanding) and token budgets
  256-2048; hints self-generated with oracle answer visible, answer leakage
  filtered imperfectly.
technique: ""
proposed_technique: "Sufficiency test: give the oracle answer, then ask for a self-hint"
technique_summary: Collect wrong answers, show the model its own reasoning
  plus the ground-truth answer and ask it to write leak-free hints, then
  re-ask the original question with those hints appended, as an upper bound on
  intrinsic self-correction.
technique_kind: process
technique_validated_by: Measured as accuracy change after hint injection
  versus initial accuracy across 8 models, 5 datasets and 5 token budgets;
  average gain 4.4%, with KeyNMF topic overlap between helpful and unhelpful
  hints and a negative correlation between hint length and gain.
stance_on_existing: supports
related_claim_id: self-critique-without-grounding-unreliable
stance_reason: Even with the correct answer supplied as grounding during hint
  generation, the models' own feedback barely improved their answers,
  strengthening the case that model-authored critique is a weak improvement
  signal.
falsifier: A comparable set of small models, given their own wrong reasoning
  plus the ground-truth answer, produces hints that lift accuracy
  substantially (well above a few points) on these benchmarks, or hints that
  lead to corrections are shown to be reliably separable from those that do
  not.
evidence_note: Measured on 8 open-weight models, 5 benchmarks, 5 token
  budgets; initial accuracies matched published figures. Only an aggregate
  4.4% mean gain is reported, without per-condition baselines for comparison,
  and the leakage filter is acknowledged as imperfect, so the oracle signal
  reaching the model is uncertain. The length-correlation claim rests on a
  100-example manual difficulty check.
confidence: medium
