arxiv_id: "2609.23043"
title: Enforcing Narrative Reliability and Epistemic Pacing in LLM-Driven
  Detective Games via Structured Knowledge Trees
url: https://doi.org/10.48550/arxiv.2609.23043
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: In an open-ended LLM roleplay game where the character must
  withhold authored facts, gating generation through an external state tree —
  one retrieved permitted fact injected into the prompt, plus a separate
  verifier that decides whether the fact was actually conveyed before updating
  state — cuts the share of responses containing story-breaking unauthored
  content (17.8% to 6.3%) and stops premature reveal of the ending entirely,
  but makes some reveals appear unmotivated because the generator is forced to
  deliver the retrieved fact on that turn.
kind: mechanism
backing_strength: single-paper
scope_condition: One 20-minute session per condition, 33 participants,
  Llama-3.1-70B-instruct with no fine-tuning, a single hand-authored detective
  narrative; baseline was a single model with a long system prompt and no
  visual progress UI.
technique: ""
proposed_technique: Gate disclosure through a structured knowledge tree with
  retrieve-generate-verify agents
technique_summary: Store the authored facts, prerequisites and contradictions
  in a tree; one model picks the single currently-permitted unrevealed fact, a
  second writes dialogue constrained to it, and a third checks whether the
  fact was conveyed before the tree state is updated.
technique_kind: process
technique_validated_by: Hand-coded hallucination rate over gameplay logs
  (17.80% of responses vs 6.27%), confessions extracted (10/33 vs 0/33), and a
  9-item Likert survey where only progression and out-of-nowhere-reveal items
  differed; the tri-agent pipeline, the tree and the visual node board were
  evaluated together with no ablation.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation showing the hallucination reduction comes from the
  visual UI changing player behaviour (fewer adversarial prompts) rather than
  from the constrained retrieve-generate-verify pipeline, or a replication
  where injecting a single permitted fact does not lower unauthored-content
  rates.
evidence_note: Measured on logs from 33 within-subject participants, one
  narrative, one model. The authors themselves note the architecture was
  evaluated holistically with no ablation, and hypothesize that the visual
  tree steered players away from adversarial prompting — so the causal
  attribution to the pipeline is not isolated. Hallucination categories were
  author-defined and hand-coded; no inter-rater agreement reported. The two
  conditions also used different stories.
confidence: low
