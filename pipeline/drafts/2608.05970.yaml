arxiv_id: "2608.05970"
title: "SkillMemo: Expert-guided Skill Memory Framework for Compositional
  Embodied Manipulation"
url: https://doi.org/10.48550/arxiv.2608.05970
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For manipulation policies (diffusion-policy and VLA backbones)
  trained on few demonstrations, decomposing trajectories implicitly via a
  Mixture-of-Experts gate and storing the per-segment gating profiles as
  retrievable memory, then blending retrieved profiles into the current gating
  distribution at inference, raises success most on unseen object-receptacle
  recombinations rather than on in-distribution tasks.
kind: observation
backing_strength: single-paper
scope_condition: LIBERO suites, Push-T/BlockPush/Kitchen, and five real UR5e
  tasks with ~50 demonstrations each; gains are small in-distribution (e.g.
  96.8% to 98.0% over pi-0.5) and larger on cross-suite and crossover
  object-receptacle tasks (e.g. 65.0% to 75.0%).
technique: ""
proposed_technique: Store MoE gating profiles as retrievable skill memory
technique_summary: Partition demonstrations into latent skills using
  Mixture-of-Experts gating coefficients, store each segment's mean latent
  feature as a key and its gating-weight sequence as a value, and at inference
  retrieve the top-N similar entries and average their gating profiles into
  the model's current gating distribution.
technique_kind: architecture
technique_validated_by: Task success rate against the unmodified backbone and
  prior memory-augmented VLAs on LIBERO (four suites), three DP control
  benchmarks, and 40 real-robot rollouts per task; ablation separates
  segmentation alone from segmentation plus memory.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation under matched parameters and inference budget showing
  the memory component adds nothing beyond MoE segmentation on unseen
  object-receptacle combinations, or that the cross-suite gain disappears when
  the retrieval similarity is randomized.
evidence_note: Measured on one benchmark family plus one real robot; ablations
  report segmentation-only versus segmentation-plus-memory, and a cross-suite
  zero-shot table. No matched-parameter control (SkillMemo adds parameters),
  no random-retrieval control, and real-world results are 40 trials per task
  from one lab.
confidence: low
