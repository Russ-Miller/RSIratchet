statement: When cold-starting an 8B video model for agentic instance-level
  video understanding by SFT on rejection-sampled tool-calling trajectories,
  trajectories from a same-family larger teacher (Qwen3-VL-235B-Thinking)
  yield a better student than trajectories from a stronger out-of-family
  teacher (Gemini-3.1-Pro), even though the out-of-family teacher solves more
  of the sampled data.
