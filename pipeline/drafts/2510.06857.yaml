statement: 'Autoformalization of problem statements into Lean 4 improves sharply when the formalizer
  can call the Lean compiler for syntax and a multi-model judge panel for meaning and revise
  on the feedback: a 32B model''s consistency Pass@1 on CombiBench rose from about 24% without
  tools to about 65% with them, and an 8B distilled version reached about 91% on FormalMath-Lite,
  with the judge ensemble holding false-positive consistency below 6%.'
kind: observation
backing_strength: single-paper
scope_condition: ATF-32B and ATF-8B-Distilled, Lean 4, FormalMath-Lite, CombiBench and similar,
  2025; consistency judged by an LLM panel; cold-start, expert iteration and DPO training.
technique: ''
proposed_technique: Tool-feedback autoformalization with compiler and judge panel
technique_summary: Let the formalizer emit a Lean statement, compile it, and ask a panel of
  models whether it matches the informal statement; feed both results back and let the model
  revise, training it on such tool-calling traces so revisions become effective.
technique_kind: process
technique_validated_by: Syntactic validity and consistency Pass@1/Pass@16 across benchmarks
  against no-tool and prior formalizer baselines; judge-panel false-positive rate measured against
  human labels.
