statement: "In a 20-year deterministic football-management simulation with
  hidden state and roughly 340-400 decision stops, what separates frontier
  models' final scores is managerial behavior rather than deliberation volume:
  cutting slow-payoff investment as the horizon ends (Spearman -0.58 with
  late-minus-mid investment shift), keeping cash deployed rather than idle
  (-0.50), and opening contract renewals early (+0.45) track the score on
  every seed, while token spend is uncorrelated under every accounting (r_s
  -0.19, all p > 0.38)."
kind: observation
backing_strength: single-paper
scope_condition: 15 frontier models, three seeds, one 20-year simulated
  management environment with a deterministic composite score; each stop is a
  fresh conversation with only a self-written notebook as memory.
