falsifier: A setup where visual gold evidence paired with textual distractors
  yields accuracy comparable to textual gold evidence paired with visual
  distractors, across several LVLMs on matched items.
evidence_note: Measured on VLM-DeflectionBench's realistic scenario with
  GPT-4o as SimpleQA-style judge (human agreement >92%, kappa 0.91). With
  textual positives, Claude-Opus-4 kept 84.3% accuracy under visual
  distractors; with visual positives and textual distractors, Keye-1.5-8B and
  Mistral-Small-3.1 fell to <=1% accuracy and >80% deflection, Claude-Opus-4
  to 28.9%. Only three models and unequal subset sizes; text and image
  positives are not matched on item difficulty, so part of the asymmetry may
  reflect weaker visual grounding overall, which the paper also reports.
confidence: medium
