statement: In retrieval-grounded multimodal QA where gold evidence and
  distractors can each be text or image, LVLMs tolerate visual distractors
  when the gold evidence is textual but collapse when textual distractors
  accompany visual gold evidence, so misleading text overrides correct visual
  evidence rather than the reverse.
kind: observation
backing_strength: single-paper
scope_condition: KB-VQA samples curated to be unanswerable from parametric
  knowledge, with pre-retrieved gold and mined distractor contexts; measured
  on a subset (530 textual-positive, 266 visual-positive examples) with three
  models.
