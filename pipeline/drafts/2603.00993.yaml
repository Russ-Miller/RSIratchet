arxiv_id: "2603.00993"
title: "CollabEval: Enhancing LLM-as-a-Judge via Multi-Agent Collaboration"
url: https://doi.org/10.48550/arxiv.2603.00993
drafted_at: 2026-11-21
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: For panels of heterogeneous LLM judges (Mistral Large, Claude
  Haiku/Sonnet, Llama 3 70B) scoring summaries on rubric dimensions or picking
  the better of two chat responses, pooling independent judgments and
  discussing to consensus beats the single-judge baseline by only a couple of
  points, nearly all of the gain arrives by the first discussion round
  (relevance 49.4% at 1 round, 49.5% at 2, 48.5% at 3), and the panel does not
  beat every single judge on every dimension (a single Mistral judge scored
  55.9% on consistency versus the panel's 48.2%).
kind: observation
backing_strength: single-paper
scope_condition: Four mid-2024-era LLM judges; SummEval criteria scoring (1600
  summaries, 5-point scales) and 1,000-sample subsets of two Chatbot Arena
  preference datasets; maximum 3 discussion rounds with Claude Sonnet 3.5 as
  tie-breaking final judge.
technique: ""
proposed_technique: Judge by collaborative panel with consensus early exit
technique_summary: Several different LLMs independently score an item with
  confidence and justification, then share and revise their assessments over
  up to three rounds, stopping as soon as they agree and escalating unresolved
  cases to a stronger final judge.
technique_kind: process
technique_validated_by: Accuracy against SummEval human expert scores and
  Arena human preference winners, compared with each constituent model judging
  alone and with a sequential round-table/majority-vote baseline; also reports
  gap-size distribution of errors and over/under-evaluation ratios, and a
  debate-mechanism variant of the same panel.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A panel whose accuracy keeps rising with additional discussion
  rounds and exceeds the best single constituent judge on every dimension by a
  margin larger than run-to-run variation would show the gain is neither
  first-round-bounded nor marginal.
evidence_note: Measured on three public datasets with ground-truth labels, but
  absolute accuracies are low (40-60%) and margins over the best single judge
  are 1-3 points with no variance estimates or repeated runs reported; the
  panel also uses a stronger tie-breaking model than any constituent, which
  the comparison does not isolate. The collaboration-versus-debate comparison
  is reported only as a figure without numbers.
confidence: low
