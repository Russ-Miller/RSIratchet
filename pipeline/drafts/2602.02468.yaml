capability: tool-use
statement: For multimodal web agents on live websites, retrieving
  human-authored how-to guides before execution to synthesize a short
  site-specific plan contributes more to task success than the agent's
  grounding, checklist, or memory modules, because it replaces open-ended
  trial-and-error exploration with a known navigation path.
kind: mechanism
backing_strength: single-paper
scope_condition: Live, real-world websites with site-specific workflows
  (Online-Mind2Web); measured on a 50-task subset with a Gemini 3 Flash
  backbone.
technique: ""
proposed_technique: Retrieve human-written site guides before acting
technique_summary: Before the execution loop starts, a search-capable model
  retrieves forums, help centers and user guides for the target site and
  distils them into 2-4 imperative, selector-free directives that steer the
  agent's navigation.
technique_kind: retrieval
technique_validated_by: "Ablation on a 50-task Online-Mind2Web subset:
  removing Experience-Imitation Planning dropped success from 48.0% to 36.0%,
  the largest single-component drop (grounding -8.0, checklist -4.0); full
  system reached 53.7% on the 300-task benchmark vs 30.0% for the best
  open-source baseline."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on a comparable live-web benchmark where removing the
  retrieved-guide planner costs less success than removing the grounding or
  memory module, or where supplying guides gives no gain over a
  matched-compute exploration baseline.
evidence_note: Measured, single paper. Main result is a 300-task benchmark
  score with an LLM judge (85.7% agreement with humans); the component
  attribution rests on a single 50-task ablation with a different, weaker
  backbone and no reported variance or repeated runs, so the ordering of
  module contributions is weakly established. No matched-token-budget control
  against plain exploration.
confidence: low
