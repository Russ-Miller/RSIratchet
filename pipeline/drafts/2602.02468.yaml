arxiv_id: "2602.02468"
title: "Avenir-Web: Human-Experience-Imitating Multimodal Web Agents with
  Mixture of Grounding Experts"
url: https://doi.org/10.48550/arxiv.2602.02468
drafted_at: 2026-11-19
drafted_from: full-text
