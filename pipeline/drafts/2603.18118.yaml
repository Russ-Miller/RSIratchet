falsifier: Running the same self-evolution loop with a single agent critiquing
  itself, or spending the same extra fine-tuning compute on more of the
  original SFT data, matching the reported gains.
evidence_note: Measured on three benchmark suites with a consistent
  before/after against the authors' own prior stage. No matched-compute
  baseline, no single-agent self-refinement control, and the component
  ablation separating the self-evolution loop from the extra data it generates
  is not reported in the given text.
