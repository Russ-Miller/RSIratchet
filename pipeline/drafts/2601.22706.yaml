arxiv_id: "2601.22706"
title: "RealSec-bench: A Benchmark for Evaluating Secure Code Generation in
  Real-World Repositories"
url: https://doi.org/10.48550/arxiv.2601.22706
drafted_at: 2026-11-12
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: secure-coding
statement: For repository-level Java code generation on tasks derived from
  real CodeQL-flagged vulnerabilities, retrieval augmentation raises
  functional pass rates but leaves security roughly unchanged, and adding
  general security guidelines to the prompt shifts results unpredictably
  across models, lowering functional correctness for some (Claude-3.7-Sonnet
  Pass@1 16.2% to 9.5%).
kind: observation
backing_strength: single-paper
scope_condition: 105 instances from 30 Maven-based Java repositories, 19 CWE
  types, five 2025-era LLMs, security judged by CodeQL plus multi-LLM
  false-positive adjudication
technique: retrieval-augmented-generation
proposed_technique: ""
technique_summary: ""
technique_kind: ""
technique_validated_by: Compared BM25, dense (RLCoder) and SAST-dataflow
  retrieval against a no-retrieval baseline on Pass@k, Secure@k and a
  composite SecurePass@k; also compared security-guideline prompts against the
  baseline.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication on the same or a comparable repository-level
  secure-code benchmark where retrieval augmentation raises Secure@k or
  SecurePass@k consistently across models, or where security-guideline
  prompting improves composite scores for all models tested.
evidence_note: Measured on a small benchmark (105 tasks, several categories
  with only 4-18 instances), so per-category figures are very noisy; the
  security metric depends on a CodeQL-plus-LLM adjudication pipeline reported
  at 81.7% precision, not expert labels. No training intervention tested; the
  no-retrieval baseline is one-shot prompting.
confidence: medium
