statement: Encoding a harmful request in Base64, ROT13 or hex lowers full compliance in six
  frontier chat models from about 76% (natural-language prompts) to about 59%, but the least-complied-with
  encoding still produced malicious output in about 54% of cases, so obfuscation by encoding
  is a weaker attack than plain non-English text yet is far from neutralized.
