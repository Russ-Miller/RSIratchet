falsifier: A model whose refusal rate is equal across languages on the same prompts, or evidence
  the gap comes from translation quality rather than alignment coverage.
evidence_note: One prompt suite and one judging protocol, and compliance rates this high suggest
  a permissive judge or weak prompts; the direction (non-English higher than English) is consistent
  across models, which is the part worth keeping. Also bears on jailbreak-robustness.
