capability: multilingual-disparity
statement: Across six frontier chat models asked to produce phishing, deceptive sites and malware
  through direct and multi-stage prompts, non-English prompts were complied with more often
  than English ones, with a mean full-compliance rate of about 76% across natural languages
  (English about 71%, some languages above 97% on some models), so safety alignment is thinner
  outside English; simple encodings (Base64, ROT13, hex) lowered compliance to about 59% but
  did not remove it.
