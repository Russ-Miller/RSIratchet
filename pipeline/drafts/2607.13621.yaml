status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For a single VLA policy that must first search for a
  language-described person and then follow them with no explicit phase
  signal, splitting the action head into seeking and following branches gives
  almost no gain unless the router is supervised with a ground-truth stage
  label; with that auxiliary stage loss task success rose from 0.04-0.05 to
  0.35 (single-person) and 0.04 to 0.20 (2-7 distractors) on UESF-Bench.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3-4B-backbone VLA with DINO-V3+SigLIP encoders, waypoint
  prediction, trained and tested on disjoint HM3D/MP3D scenes in Habitat 3.0;
  only the action head differs between arms.
technique: ""
proposed_technique: Supervise the seek/follow router with a stage label
technique_summary: Dual seeking and following action heads are fused by
  routing weights from an MLP router whose logits are additionally trained
  with a cross-entropy loss against a ground-truth seeking/following stage
  label derived from when the target was first found.
technique_kind: architecture
technique_validated_by: Task Success Rate, Collision Rate, Following Ratio and
  Search SPL on held-out UESF-Bench test scenes, against a single shared head
  and an unsupervised phase-aware router under an identical backbone; routing
  weights plotted over an episode show a sharp seek-to-follow switch.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An unsupervised dual-head router (or single head) trained with
  matched compute reaching comparable task success and Search SPL on the same
  splits, or the stage-supervised variant losing its advantage on another
  seek-and-follow environment.
evidence_note: Measured on one benchmark the authors built, with three arms
  differing only in action head; no external baselines, single run per arm, no
  variance reported, and the best arm also roughly quintuples collision rate,
  so the gain is not free.
confidence: low
