arxiv_id: "2609.07879"
title: Do Large Language Models Know What They Don't Know II? A Fully
  Behavioral, Non-Cognitive Measure of Epistemic Honesty
url: https://doi.org/10.48550/arxiv.2609.07879
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: Across 14 frontier and open model routes scored on 3,000 boundary
  questions (fabricated entities, post-cutoff events, hyper-niche facts,
  redacted-document values), the rate at which a model restrains itself and
  calibrates confidence varies by a factor of about 2.6 (composite 0.31 to
  0.81) while all models answer a document-grounded restored-span probe at
  near-ceiling (pooled 99.2%, no detectable between-model variation), so
  epistemic restraint is not explained by the ability to report information
  placed in front of the model.
kind: observation
backing_strength: single-paper
scope_condition: Single-turn, temperature 0, retrieval and history disabled,
  non-reasoning responses only; the capability probe is deliberately easy and
  a harder capability measure might still correlate.
technique: ""
proposed_technique: Score restraint and confidence separately against a
  matched answerable control
technique_summary: Classifies each response to an unanswerable boundary
  question as abstain, hedge, confident-correct or confident-wrong, computes
  calibration only on substantive answers, and pairs each context-withheld
  item with a restored-document version to check that restraint is not blanket
  refusal.
technique_kind: process
technique_validated_by: Applied to 42,000 model-item records across 14 routes;
  classifier checked against two blinded human coders on a stratified
  560-response sample (human-human kappa .913, classifier-human kappa .414
  four-class, .667 binary); matched restored-span control gave 96.6% restraint
  on missing-span and 99.2% correct on restored-span, 95.8% passing both
  sides.
stance_on_existing: supports
related_claim_id: selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical
stance_reason: Both find that ability to flag questions outside the model's
  knowledge is partial and not predicted by ordinary task competence, here
  extended to determinate-but-unavailable answers rather than in-principle
  unanswerable ones.
falsifier: A capability probe of comparable simplicity that separates the same
  panel and correlates with composite EHQ, or a replication where restraint
  scores cluster tightly across models rather than spanning 0.31-0.81.
evidence_note: Measured on one frozen run of 14 routes over 3,000 items with
  bootstrap intervals; the model is the inference unit so n=14 is small, and
  the response classifier understates restraint by about 0.14 and does so
  unevenly by model family (+0.116 for Claude routes, p=.021), so the absolute
  spread is inflated even though rank order largely survives human relabelling
  (rho .859).
confidence: medium
