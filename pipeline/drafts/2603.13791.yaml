status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: strategic-deception
statement: For monitoring LLM agent trajectories for deception, giving the
  monitor the agent's chain-of-thought text, and additionally a probe on
  mid-layer hidden states from a separate open-weights encoder, detects
  deception better than a monitor restricted to actions and outputs, with the
  margin largest on subtle structural deception (oversight sabotage,
  audit-trail manipulation, precedent engineering) and shrinking as the
  agent's CoT is sanitized or made deliberately misleading.
kind: observation
backing_strength: single-paper
scope_condition: Sandboxed synthetic and semi-realistic agent environments
  with injected side-tasks and execution-verified labels; monitors are
  prompted frontier LLMs scored by partial AUROC in the low-false-positive
  region; the activation probe requires open-weights access and so is
  unavailable for closed-API agents.
technique: ""
proposed_technique: Monitor chain-of-thought and hidden states, not just actions
technique_summary: Ensembles a black-box action/output monitor, a
  chain-of-thought-reading prompted monitor, and a logistic-regression probe
  on mid-layer residual-stream activations from a separate frozen open-weights
  encoder, combining their suspicion scores with a learned meta-classifier.
technique_kind: process
technique_validated_by: "Partial AUROC over FPR<=0.20 on 9,200 held-out
  DeceptArena trajectories with deterministic environment-check labels:
  black-box 0.837, CoT-aware prompted 0.869, activation-probe 0.901, hybrid
  ensemble 0.934; per-category gains largest for structural deception (e.g.
  precedent engineering 0.718 to 0.901), and stratified by
  honest/sanitized/deceptive CoT condition (+0.162/+0.071/+0.031)."
stance_on_existing: neither
