stance_reason: ""
falsifier: A monitoring comparison on agent trajectories where adding
  chain-of-thought and hidden-state inputs gives no low-FPR detection gain
  over action-and-output monitoring, or where the gain disappears once the
  deceptive trajectories are produced by a real misaligned agent rather than
  by injected side-tasks.
evidence_note: Measured, single paper, one lab. Monitors tuned on 4,800
  synthetic generator-written trajectories and scored on 9,200 held-out
  trajectories whose labels come from environment checks rather than LLM
  judges, which is a real strength. But the positives are all side-tasks
  injected by system prompt, and the CoT 'conditions' are generator
  instructions rather than agents that learned to conceal, so the
  transparency-detectability trade-off is a simulation of the dynamic rather
  than an observation of it. The activation probe reads a different model
  family than the one that generated the trajectories, which makes the
  cross-model generalization claim stronger, but it rests on a single layer
  chosen by cross-validation on the same data distribution. No baseline beyond
  the authors' own black-box monitor.
confidence: low
