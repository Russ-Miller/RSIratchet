capability: fine-tuning-retention
statement: In GRPO-style RL post-training of 7B multimodal reasoning models,
  composing each optimization group from rollouts stratified by
  length-normalized sequence surprisal and outcome (confident-correct anchors,
  confident-wrong negatives, low-confidence successes) within the same step
  keeps path entropy from collapsing and avoids the late-training performance
  decline GRPO and DAPO show after a few hundred steps.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B-Instruct base, verifiable multimodal
  math/diagram reasoning, ~400 update steps, group size 16, vision encoder
  frozen; single reported run; does not cover open-ended generation.
technique: ""
proposed_technique: Stratify rollouts by confidence and outcome when forming RL groups
technique_summary: Within each RL step, bucket the step's own rollouts by
  length-normalized surprisal and reward into anchors, hard negatives and
  low-confidence successes, and assemble half the optimization groups from a
  fixed ratio of these buckets before clearing the buffers.
technique_kind: training
technique_validated_by: "Ablation on MathVista/MathVision/MMMU Pass@8: GRPO
  60.7 avg, DAPO 62.0, +HSR alone 64.7, +PAQM alone 63.8, both 65.8; plus
  path-entropy curves staying ~0.35-0.60 nats versus baseline collapse.
  Baselines reported at peak pre-collapse. One run, no seed variance."
