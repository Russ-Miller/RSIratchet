arxiv_id: "2602.03380"
title: "Seeing Through the Chain: Understanding and Mitigating Hallucinations
  in Multimodal Large Reasoning Models"
url: https://doi.org/10.48550/arxiv.2602.03380
drafted_at: 2026-11-20
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For 7B multimodal models, post-training that adds explicit
  chain-of-thought reasoning (R1-Onevision, MM-Eureka, Orsta-R1, MM-R1,
  ThinkLite) raises object-hallucination rates above their non-reasoning
  Qwen2.5-VL base, and the reasoning variants allocate less attention mass to
  visual tokens and more to text tokens than the base.
kind: observation
backing_strength: single-paper
scope_condition: 7B Qwen2.5-VL-derived reasoning models on caption-generation
  and yes/no object-existence benchmarks (CHAIR, POPE, AMBER); attention
  measured on 300 MSCOCO samples
technique: ""
proposed_technique: Prune low-value CoT tokens, then preference-tune against
  induced hallucinations
technique_summary: Supervised fine-tuning on the model's own reasoning chains
  with the bottom 10% of importance-scored tokens removed, followed by
  preference optimization where the preferred sample is an expert-corrected
  reasoning chain and the rejected samples include chains deliberately
  elicited by masking the image and by a prompt telling the model to favour
  language priors.
technique_kind: training
technique_validated_by: CHAIR, POPE, AMBER and GPT-4-assisted SHR across five
  7B MLRMs against vanilla, RLAIF-V and OPA-DPO baselines; e.g. Orsta-R1
  CHAIR_S 40.7 to 35.3 and SHR down 14.05%, with MME/MMBench general scores
  preserved; ablations remove each loss term and the hallucination-inducing
  negatives.
stance_on_existing: supports
related_claim_id: adversarially-edited-image-tasks-chain-of-thought-prompting-moves-multimodal-models
stance_reason: Both find that adding chain-of-thought to multimodal models can
  increase rather than reduce hallucination relative to a non-reasoning
  baseline.
falsifier: Measuring the same reasoning-tuned 7B models and their shared base
  on CHAIR/POPE/AMBER and finding the reasoning variants hallucinate no more
  than the base, or finding their visual-token attention share is equal or
  higher.
evidence_note: "Measured: attention distributions on 300 MSCOCO images and
  hallucination scores for five reasoning models against one shared base. The
  base-versus-reasoning comparison is across checkpoints trained by different
  groups on different data, so the reasoning mechanism is not isolated from
  the rest of each model's post-training recipe."
confidence: medium
