related_claim_id: forecasting-underperforms-humans-without-scaffolding
stance_reason: Adds a case where unscaffolded zero-shot LLM prediction trails
  a task-specific baseline trained on labelled data.
falsifier: A zero-shot LLM matching or beating tuned supervised classifiers on
  macro-F1 and precision for the same rare-event tabular risk task under the
  same evaluation split.
evidence_note: "Measured: macro-F1 gap of 0.04-0.13 between best supervised
  model and best LLM across six horizon/configuration cells; GPT-4o-mini
  recall 0.78-0.97 at precision 0.05-0.07. Single utility, single region,
  single prompt template, uncalibrated 0.5 threshold, so the comparison does
  not isolate prompt or threshold tuning from model ability."
