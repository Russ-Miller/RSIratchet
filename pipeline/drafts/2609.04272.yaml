arxiv_id: "2609.04272"
title: "Evaluating Large Language Models for Forced Outage Risk Prediction:
  Benefits and Comparison to Machine Learning"
url: https://arxiv.org/abs/2609.04272
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: On zero-shot binary risk classification of rare weather-driven
  power outages from tabular weather features, GPT-4o/4.1-class models trail
  supervised classifiers trained on the same data by 0.04-0.13 macro-F1 and
  have much lower precision, and they gain little from being given the full
  forecast window rather than only current observations, while supervised
  models gain more from forecast features.
kind: observation
backing_strength: single-paper
scope_condition: Six years of one central Texas utility's outage records with
  ~5% positive rate; 3/6/12-hour horizons; fixed 0.5 probability threshold, no
  in-context examples; supervised baselines (LightGBM, logistic regression)
  evaluated leave-one-year-out.
technique: ""
proposed_technique: ""
stance_on_existing: supports
related_claim_id: forecasting-underperforms-humans-without-scaffolding
stance_reason: Unscaffolded zero-shot LLMs underperform data-fitted supervised
  baselines on a real forecasting task.
falsifier: A zero-shot LLM matching or beating tuned supervised classifiers on
  macro-F1 and precision on the same outage data, or showing large gains from
  forecast-window inputs comparable to the supervised models'.
evidence_note: Four OpenAI models vs two supervised baselines, three horizons,
  two input configurations, single utility service area; imbalanced labels
  with untuned 0.5 threshold, so LLM precision/recall operating point is not
  calibrated, which confounds the precision gap.
confidence: medium
