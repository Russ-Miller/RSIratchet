capability: forecasting
statement: For zero-shot risk forecasting from tabular weather features on a
  rare-event (~5% positive) binary severity task, GPT-4o/4.1 class models
  trail simple supervised classifiers (logistic regression, LightGBM) trained
  on the same data on macro-F1 and precision at every 3h/6h/12h horizon, and
  the weaker models close the gap only by flagging nearly every window as high
  risk.
kind: observation
backing_strength: single-paper
scope_condition: Six years of central-Texas utility outage records plus
  gridded weather; four OpenAI models, no in-context examples, fixed 0.5
  probability threshold, leave-one-year-out evaluation for the supervised
  baselines.
