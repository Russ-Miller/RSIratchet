falsifier: A ~4B multimodal model scoring near ceiling on the
  unanswerable/ill-posed open-ended category without targeted negative-data
  training, or a clean monotonic rise in that category's score with parameter
  count across families.
evidence_note: "Measured: MCQ accuracy on the Unanswerable category mostly
  below 65% for MSLMs (Qwen3-VL-4B the exception at 86.0%), while open-ended
  overall scores in that category fall mostly below 3 of 5 and drop further
  under blur/low light; Phi-4-Multimodal (6B) scored 54.8% and GPT-5 Nano
  76.3%, below the 4B leader. Open-ended scores come from a single GPT-5 judge
  (93.8% agreement with five human judges on a 5% subset), and GPT-5 also
  generated the questions, so self-preference bias is mitigated but not
  eliminated. Failure examples are qualitative; no intervention tested."
