capability: abstention-and-self-knowledge
statement: "Compact multimodal models (~3-4B) used as industrial inspection
  assistants answer unanswerable or ill-posed visual queries — asking about
  non-existent attributes or parts, or phrased as confirmation-seeking — with
  confident fabricated answers rather than flagging the missing evidence, and
  this weakness is not removed by scale: a 4B model beats a 6B model and
  proprietary GPT-5 Nano on the same category."
kind: observation
backing_strength: single-paper
scope_condition: 410 MVTec AD and VisA images, 4,510 MCQs and 7,380 open-ended
  questions, zero-shot, six ~4B MSLMs plus moderate and proprietary reference
  models; open-ended scoring by a GPT-5 judge against human-verified ground
  truth.
