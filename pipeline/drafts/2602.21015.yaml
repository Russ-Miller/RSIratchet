arxiv_id: "2602.21015"
title: "From Perception to Action: An Interactive Benchmark for Vision Reasoning"
url: https://doi.org/10.48550/arxiv.2602.21015
drafted_at: 2026-11-21
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: "On interactive 3D physics tasks where an agent must choose
  feasible actions over many steps, current frontier VLMs degrade sharply as
  structural constraints tighten: in CHAIN, top models solve easy
  spatial-packing levels at or near 100% but fall to about 6% on hard packing
  and to 0-3% on interlocking mechanical puzzles at every difficulty tier, so
  near-ceiling scores on the easy tier do not indicate constraint-aware
  multi-step planning."
kind: observation
backing_strength: single-paper
scope_condition: 109 interactive levels (32 interlocking puzzles, 77 3D
  packing) in a Unity/Python physics simulator with multi-view observations,
  color-keyed object selection, 30-60 step budget, 5-turn history window; 16
  closed and open VLMs.
technique: ""
proposed_technique: Compare interactive solving against a one-shot single-view baseline
technique_summary: Run the same task twice — once with closed-loop multi-step
  observation and action, once with a single fixed-view image and a required
  complete plan — and report the gap as the share of success attributable to
  feedback rather than to one-shot recognition.
technique_kind: process
technique_validated_by: One-shot accuracy was uniformly lower for GPT-5.2,
  Gemini-3-Pro and Claude-Sonnet-4.5 (e.g. GPT-5.2 stacking 31.2% interactive
  vs 9.1% one-shot; puzzle 3.1% vs 0.0%), showing benchmark success is not
  reachable by precomputed planning from one view.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A frontier VLM under the same interactive protocol and step budget
  scoring substantially above chance on medium or hard interlocking puzzles,
  or holding its easy-tier packing rate on the hard tier.
evidence_note: Measured across 16 models on 109 levels with rule-based
  final-state verification plus difficulty-stratified results for three top
  models; difficulty tiers are assigned by two human experts' average solve
  time, so tiers are calibrated to humans rather than to any model-side
  measure. No intervention is tested beyond sampling, reward-model reranking
  and a VLM judge, all of which added under 2 points.
confidence: medium
