arxiv_id: "2608.26008"
title: A Self-Evolving Multi-Agent Framework Defense against LLM Jailbreak Attacks
url: https://doi.org/10.48550/arxiv.2608.26008
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: For black-box jailbreak defense at test time, abstracting each
  successful attack into a rule that names the structural wrapper (nested
  role-play, code obfuscation, flipped text) rather than the harmful topic
  lets one rule induced from a single prompt cover the rest of that attack
  family, so attack success falls to near zero after the first batch of ~20
  streamed prompts without any parameter updates.
kind: mechanism
backing_strength: single-paper
scope_condition: Prompt-level black-box jailbreak families (DeepInception,
  CodeChameleon, ReNeLLM, FlipAttack) on 7-8B open models and a Gemini-class
  API model; single-turn, not agentic or multi-turn attacks.
technique: ""
proposed_technique: Store jailbreak failures as wrapper-level rules in persistent memory
technique_summary: On a detected unsafe response, an LLM distills the attack's
  structural wrapper into a labelled rule in an external memory, and later
  inputs are classified into a wrapper label that selectively triggers at most
  two matching rules before generation.
technique_kind: process
technique_validated_by: ASR-gpt (external GPT-4o-mini judge, threshold 7) and
  ASR-rej on AdvBench across four attack families and three models, against
  no-defense, safety prompt, Self-Reminder and AutoDefense baselines;
  MMLU/GSM8K utility stays within ~2 points; ablations removing triggering,
  enforcement or reflection each raise ASR.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A held-out jailbreak family whose wrapper differs in surface form
  but shares structure shows no reduction in ASR from an induced rule, or
  per-round ASR fails to drop after the first batch under a cold-start stream.
evidence_note: Measured on AdvBench (520 prompts) across four attack families
  and three models with a cold-start online protocol, against four baselines;
  ASR drops to roughly 0.1-3.5% from 5-58% undefended. The learning-signal
  judge is the in-system model and the evaluation judge is external, which
  partly separates them, but both are LLM judges and the composite-wrapper
  adaptive attack result is asserted in text without a table.
confidence: medium
