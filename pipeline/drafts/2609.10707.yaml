falsifier: A study showing the deterministic pre-filter catches the same
  injections the semantic rails catch (or vice versa), so removing one layer
  leaves attack success unchanged on a larger and adversarially adaptive
  injection set.
evidence_note: Measured on a single hand-built dataset of 20 injections
  against one 12B model, with per-layer counts but no undefended baseline, no
  adaptive attacker, and no latency or false-positive measurement; layer-count
