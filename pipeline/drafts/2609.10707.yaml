statement: In an LLM-assisted SOC pipeline where injections are planted in log
  fields, a deterministic SIEM pre-filter (regex decoders plus length
  truncation) catches only the structurally obvious payloads while an LLM
  self-check input/output rail catches most semantic ones, so the two layers
  block disjoint attack classes and neither alone is sufficient.
kind: observation
backing_strength: single-paper
scope_condition: Prototype AI-SOC with Wazuh decoders plus NeMo Guardrails,
  local Gemma 3 12B analyst model, 20 hand-crafted injected alerts across four
  MITRE ATLAS vectors.
technique: ""
proposed_technique: Deterministic SIEM pre-filter before semantic guardrails
technique_summary: Sanitize and length-bound log payloads with regex decoders
  and atomic rules at SIEM ingestion, then pass the structured alert through
  LLM self-check input and output rails before and after the analyst model.
technique_kind: process
technique_validated_by: On 20 injected Wazuh alerts, Layer 1 intercepted 3 and
  Layer 2 intercepted 18 of 20; two evasions remained (one tool-abuse, one
  instruction-override jailbreak). No baseline of undefended pipeline success
  rate reported, no latency numbers.
stance_on_existing: neither
