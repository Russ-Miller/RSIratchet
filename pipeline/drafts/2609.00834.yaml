arxiv_id: "2609.00834"
title: "Replacing Training with Memory: Listwise Selection for Text-to-SQL"
url: https://doi.org/10.48550/arxiv.2609.00834
drafted_at: 2026-09-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: For selecting among multiple generated SQL candidates, a listwise
  selector given retrieved structured selection criteria distilled from
  training question-SQL pairs, with candidates grouped by execution result and
  permuted only within groups, reaches higher execution accuracy than
  pointwise, pairwise and multi-selector baselines on the same candidate pools
  while using far fewer selector calls and tokens.
kind: mechanism
backing_strength: single-paper
scope_condition: Text-to-SQL candidate selection with 8 or 32 candidates from
  fixed generators, BIRD-dev, Spider-test and EHRSQL, selector
  Qwen3-Coder-30B-A3B-Instruct; assumes a labelled training split to build the
  memory bank and upstream schema linking for very large schemas.
technique: ""
proposed_technique: Group candidates by execution result, then permute within groups
technique_summary: Replaces selector fine-tuning with retrieved structured
  criteria (schema grounding, SQL operations, expected output form) prepended
  to a listwise prompt, and mitigates position bias by shuffling only inside
  execution-result groups, aggregating average ranks, and using a pointwise
  reward model only when top-1 and top-2 tie.
technique_kind: prompting
technique_validated_by: "Execution accuracy, selector calls and input tokens
  per query against greedy, majority voting, pointwise (Contextual-RM-32B),
  pairwise (CHASE-SQL style) and R3-SQL on the same candidate sets: 73.08 vs
  71.97 for R3-SQL on BIRD-dev at n=32, +2.02 over pairwise, 2.92x fewer
  tokens; ablations drop 0.55 (no memory) and 0.32 (no permutation);
  order-consistency rises 18.98 -> 23.04 (global shuffle) -> 29.04
  (group-based) -> 33.17 (with tie-break)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same candidate pools, a listwise selector with global
  permutation and no retrieved memories matches or beats this pipeline's
  execution accuracy and order-consistency, or the reported gains disappear
  when the pairwise and R3-SQL baselines are given equal token budgets.
evidence_note: Measured on three benchmarks, two generators, two
  candidate-pool sizes, with component ablations and a position-consistency
  probe. Accuracy margins are small (0.5-2 points); efficiency margins are
  large. The fine-tuned-selector comparison relies on a reported number from
  an unreleased model, and the memory bank for EHRSQL came from other
  benchmarks' training splits.
confidence: medium
