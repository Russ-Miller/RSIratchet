stance_reason: ""
falsifier: A replication where context pruning alone also lifts the worst-run
  quartile, or where adding stagnation-triggered backtracking does not lower
  the best-run score, would break the stated decomposition.
evidence_note: "Measured: cumulative ablation on one task (symbolic
  regression) with 10 runs per configuration, reported as a boxplot rather
  than per-component deltas with intervals; components are added in a fixed
  order so individual contributions are not isolated factorially. Main-table
  results use the same single task plus KernelBench latency."
