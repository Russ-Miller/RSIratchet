arxiv_id: "2601.13836"
title: "FutureOmni: Evaluating Future Forecasting from Omni-Modal Context for
  Multimodal LLMs"
url: https://doi.org/10.48550/arxiv.2601.13836
drafted_at: 2026-11-13
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: When multimodal models must predict the next event from a
  30-second-to-20-minute audio-visual clip whose causal cue may be speech,
  sound or music, accuracy is lowest when the cue is speech, and the best of
  20 tested omni-modal and video-only models reaches only about 65% on
  four-way multiple choice.
kind: observation
backing_strength: single-paper
scope_condition: Multiple-choice future-event prediction over YouTube clips
  with adversarial distractors (visual-only, audio-only, delayed,
  reverse-causal); 13 omni-modal and 7 video-only models as of early 2026.
technique: ""
proposed_technique: Instruction-tune on audio-visual premise-to-future pairs with rationales
technique_summary: LoRA fine-tune an omni-modal model on 7K audio-visual
  premise/future-event items that include an explicit written rationale
  linking the audio-visual premise to the predicted future event, with
  encoders frozen.
technique_kind: training
technique_validated_by: Accuracy on the paper's own forecasting benchmark for
  three 7B open models (+1.03 to +3.87 points, with Speech category rising
  nearly 10 points for one model), plus out-of-domain gains on WorldSense,
  DailyOmni, JointAVBench, OmniVideoBench, Video-MME and MLVU (mostly under
  +3.4, some near zero or slightly negative).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A current omni-modal model scoring comparably on speech-cued and
  music-cued items of this benchmark, or exceeding ~80% overall, would show
  the speech gap and the ceiling are not general.
evidence_note: Measured on 1,034 QA pairs over 919 videos across 8 domains, 20
  models. Modality ablation (A+V vs V vs A vs V+subtitle) supports that
  neither modality alone shortcuts the task and that subtitles do not
  substitute for raw audio. Benchmark built by an LLM pipeline with human
  verification, so distractor quality and the speech gap both depend on that
  construction; no human ceiling reported.
confidence: medium
