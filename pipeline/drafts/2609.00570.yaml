capability: audio-understanding
statement: On multi-session dialogue questions whose answers depend only on
  how an utterance was delivered, a cascaded ASR-then-LLM pipeline (Whisper
  large-v3 into a frontier model) scores below 7B audio-native models on the
  same clips, and below even a transcript-only baseline, because the
  transcription step drops delivery cues entirely and adds content errors.
kind: mechanism
backing_strength: single-paper
scope_condition: Synthesized two-speaker evidence sessions (104 clips, TTS
  with acted-emotion reference conditioning), evidence-only context of roughly
  10-15k tokens; only two 7B audio-native models tested; no real recordings.
