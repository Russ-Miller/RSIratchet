falsifier: A cascade whose ASR emits or annotates paralinguistic markers, or a
  frontier cascade that matches or beats audio-native models on the same
  delivery-dependent items, would show the loss is not architectural.
evidence_note: "Measured: Whisper->Opus 4.8 scored 0.254 vs Qwen2-Audio 0.354
  and Qwen2.5-Omni 0.412, with a blind text baseline at 0.325 and descriptive
  text at 0.675; transcript analysis found no bracketed voice events or
  fillers in any of the 104 transcripts. Cascade and audio arms differ in
  model scale and in modality, so the comparison does not isolate scale, and
  the audio is entirely TTS-generated."
