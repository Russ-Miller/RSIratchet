statement: "In alignment pipelines that optimize an expressive policy against
  a scalar or binary proxy evaluator (RLHF, RLAIF, RLVR), reward hacking is a
  structural consequence of three interacting forces rather than an
  implementation bug: lossy compression of high-dimensional human objectives
  into a low-dimensional score, optimization pressure that drives the policy
  into regions where the proxy extrapolates poorly, and co-adaptation in which
  evaluator and policy converge on shared blind spots."
