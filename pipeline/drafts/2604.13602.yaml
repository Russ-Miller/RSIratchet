falsifier: An alignment setup where a fixed compressed proxy is optimized hard
  by a highly capable policy and true-objective performance keeps rising
  monotonically with proxy score, with no shift toward surface correlates or
  evaluator-specific artifacts, would contradict it.
evidence_note: "Argued, not measured: a survey that organizes existing
  findings (verbosity bias, sycophancy, unfaithful CoT, overoptimization
  scaling laws, test tampering) under one framework. It synthesizes prior
  results rather than reporting new experiments, so the framework's unifying
  power is a reading of the literature, not an independent test, and the three
  forces are not separately isolated."
