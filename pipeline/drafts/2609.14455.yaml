arxiv_id: "2609.14455"
title: "Grounded in Sound: Reinforcement Learning with a Frozen Acoustic Judge
  to Curb ASR Insertion Hallucinations"
url: https://arxiv.org/abs/2609.14455
drafted_at: 2026-09-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When post-training a speech LLM for ASR with GRPO, adding a reward
  term from a separately pretrained, frozen CTC acoustic judge that scores
  each sampled transcription against the audio cuts insertion errors on
  out-of-distribution meeting speech (22-28% fewer on AMI) relative to a
  schedule-matched text-only -WER reward, without raising word error rate and
  without needing the judge at inference.
kind: mechanism
backing_strength: single-paper
scope_condition: One 7B speech LLM (Qwen2-Audio, LoRA) with a 0.3B
  character-level wav2vec2-CTC judge, trained on LibriSpeech with
  additive-noise augmentation, evaluated on one OOD corpus of 16 AMI meetings;
  acoustic weight only shown significant at the largest tested value (mu=0.6);
  no KL-to-reference control, so general regularization is not ruled out.
technique: ""
proposed_technique: Reward acoustic fidelity with a frozen judge during RL
technique_summary: Augments the text-space -WER GRPO reward with a
  group-normalized score from a permanently frozen, non-autoregressive CTC
  model that measures how well each sampled transcription aligns to the audio,
  used at training time only.
technique_kind: training
technique_validated_by: Insertion counts and WER on 33,282 utterance-condition
  instances over six difficulty tiers against a schedule-matched mu=0 WER-GRPO
  baseline sharing identical data and schedule; meeting-level clustered
  bootstrap CIs, three seeds, leave-one-meeting-out, plus counterfactual
  probes on unintelligible audio, a 32-best CTC rescoring comparison, and
  insertion-AURC under policy-only confidence.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where adding the frozen acoustic reward term fails to
  reduce insertion rates on held-out far-field speech relative to a
  schedule-matched text-only reward, or where an equal-strength
  KL/regularization control produces the same insertion reduction without any
  acoustic signal.
evidence_note: "Measured, single paper, one policy and one judge. Baseline is
  tightly matched (same degraded waveforms, same schedule, mu the only
  variable) and insertion reduction survives clustered bootstrap, seeds,
  checkpoints, and leave-one-meeting-out. Weaknesses acknowledged by the
  authors: no KL control arm, no judge swap, no human validation of the
  insertion proxy, one OOD corpus, and a length-normalization bug in the
  reward."
confidence: medium
