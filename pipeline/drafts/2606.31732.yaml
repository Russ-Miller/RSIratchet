falsifier: An ablation where removing the symbolic attribute reward leaves
  position and color metrics unchanged, or where a global visual reward alone
  matches the full framework on fine-grained alignment.
evidence_note: Single paper, single backbone, one ablation row per component
  on four benchmarks; no seed variance or multiple-run reporting, and the
  attribute reward is scored by the same extractor family used in training, so
  metric-reward coupling is not ruled out.
