arxiv_id: "2606.31732"
title: "UniCoder: Unified Visual-to-Code Generation via Symbolic Rewards and
  Reference-Guided Code Optimization"
url: https://doi.org/10.48550/arxiv.2606.31732
drafted_at: 2026-10-27
drafted_from: full-text
