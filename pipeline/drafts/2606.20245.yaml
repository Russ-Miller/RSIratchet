arxiv_id: "2606.20245"
title: "Navigating Unreliable Parametric and Contextual Knowledge: Explicit
  Knowledge Conflict Resolution for LLM Inference"
url: https://doi.org/10.48550/arxiv.2606.20245
drafted_at: 2026-10-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fact-verification
statement: When 7-8B open models must answer with several mutually conflicting
  contexts plus possibly wrong parametric knowledge, writing the model's
  internal belief out as explicit text (with its training cutoff) and
  adjudicating all contexts against validated conflict-resolution rules beats
  methods that pick one source to trust, and the rule-based adjudication step
  carries most of the gain.
kind: mechanism
backing_strength: single-paper
scope_condition: Llama3.1-8B and Qwen2.5-7B on ConflictBank, ConFiQA and
  MQuAKE with 2-4 conflicting contexts per query; external knowledge supplied
  by GPT-4o-mini; 1,000 sampled instances
technique: ""
proposed_technique: Externalize internal belief, then resolve conflicts by induced rules
technique_summary: Estimate the model's confidence by a relevance-weighted
  semantic entropy, then either write its parametric knowledge out as text or
  retrieve external evidence, and have three agents induce conflict-resolution
  rules offline, detect answer-level contradictions, and apply the matching
  rule to arbitrate.
technique_kind: prompting
technique_validated_by: EM and ROUGE-L against Direct, ICL, InstructRAG-ICL,
  TruthfulRAG and CK-PLUG on three conflict benchmarks (e.g. ConflictBank EM
  0.549 vs 0.312 best baseline on Llama3.1-8B); ablation replacing the
  multi-agent module with chain-of-thought drops EM to 0.229, removing
  assessment/retrieval drops it to 0.480.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-compute single-model prompt that is told to list each
  context's answer and reconcile them reaching the same EM, or the multi-agent
  module showing no advantage over CoT once call counts are equalized.
evidence_note: "Measured on two 7-8B backbones and three benchmarks against
  five baselines, with an ablation isolating the two modules. No
  matched-compute control: MACR makes many more LLM calls than the baselines,
  so part of the gain may be inference budget. Rule base is induced per
  dataset from a demonstration split, so cross-dataset transfer is untested."
confidence: low
