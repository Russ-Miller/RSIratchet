arxiv_id: "2608.04009"
title: "SocietyBench: Forecasting Counterfactual Social-World Evolution"
url: https://arxiv.org/abs/2608.04009
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: On anonymized retrospective social-event forecasting (entities
  replaced, dates shifted), frontier LLMs score much better at assigning low
  probability to events that did not happen than at assigning high probability
  to events that did, with a mean false-minus-true calibration gap of about
  15.9 points across six models and up to 38 points for one model, so
  benchmarks weighted toward invented events overstate forecasting skill.
kind: observation
backing_strength: single-paper
scope_condition: Five real social events across public controversy,
  geopolitics, technology policy, financial markets and trade policy,
  anonymized and split into 125 cutoff prediction points, Chinese and English
  editions, six frontier LLMs queried at temperature 0 with no external
  search.
technique: ""
proposed_technique: Keep true and false forecasting questions near 1:1
technique_summary: Balance a forecasting question bank so that events that
  occurred and events constructed as false appear in roughly equal numbers, so
  the calibration score does not reward default skepticism.
technique_kind: process
technique_validated_by: Splitting the calibration bank by answer value showed
  a six-model mean of 76.1 on false items versus 60.3 on true items; dropping
  the designed-false subset moved the mean down 3.4 points, identifying it as
  the easiest subset.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A comparable anonymized forecasting bank where models score as well
  or better on events that occurred than on constructed false events, or where
  the asymmetry disappears once question difficulty is matched.
evidence_note: "Measured on the paper's own benchmark: ~25k calibration
  questions per language edition over five events, six models, with per-model
  bias reported. The asymmetry is large but confounded with how the false
  items were constructed (counterfactual variants and designed-false events
  may be easier to reject for reasons other than disposition). Two of six
  models show only ~+5 bias, so it is not uniform."
confidence: medium
