arxiv_id: "2608.31100"
title: "S3Gym: Can LLMs Turn Self-Testing and Self-Judging into Self-Improvement?"
url: https://doi.org/10.48550/arxiv.2608.31100
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: "For LLM agents that score their own actions during exploration in
  text-based games and then reuse that experience, the accuracy of those
  self-scores against the environment verifier does not predict later gains on
  held-out stricter configurations: block-level correlations between judgment
  agreement or calibration and the next checkpoint's score change sit near
  zero, so recognizing a good action is not the bottleneck — converting it
  into a transferable policy is."
kind: mechanism
backing_strength: single-paper
scope_condition: Seven text-based games with executable verifiers; seven
  proprietary models; verifier rewards hidden from the agent during
  exploration; context-level (history or summary) reuse pathways.
technique: ""
proposed_technique: Separate self-judged scores from verifier rewards and measure both
technique_summary: Withhold verifier-computed rewards from the agent during
  exploration while logging them benchmark-side, so the agent's own step
  scores can be compared against ground truth and against later held-out
  improvement.
technique_kind: process
technique_validated_by: "116,117 transitions over 98 runs: event agreement and
  normalized MAE per game, plus blockwise and run-level correlations with
  normalized score change (rho(A,g) = -0.010, rho(-E,g) = -0.018; run-level r
  = -0.23 with normalized above-baseline area)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A setup where agents whose step-level self-judgments agree more
  closely with verifier rewards show reliably larger held-out improvement
  under the same experience-reuse pathway.
evidence_note: Measured across 7 games and 7 models with an executable
  verifier as ground truth; correlations are near zero and sometimes slightly
  negative, but improvement itself is sparse and noisy in several games (many
  zero scores), which limits how much signal the correlation could show. No
  intervention isolates judgment quality experimentally.
confidence: medium
