arxiv_id: "2606.17642"
title: "FinAcumen: Financial Multimodal Reasoning via Self-Evolving Experience
  Memory Harness"
url: https://doi.org/10.48550/arxiv.2606.17642
drafted_at: 2026-10-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: For a frozen 8B vision-language model on financial multimodal QA,
  distilling strategies from correct and cautions from failed training
  trajectories into a read-only experience bank retrieved by cosine similarity
  adds accuracy on top of a deterministic tool suite (FinMMR Easy 74.08 to
  81.67), but the gain saturates as the bank grows past roughly 1,800 entries
  and reverses if more than about five entries are injected per query.
kind: observation
backing_strength: single-paper
scope_condition: One frozen 8B backbone (Qwen3-VL-8B-Instruct), four English
  financial multimodal benchmarks, memory bank built from held-out
  train/validation splits and frozen at test time, fixed four-tool ReAct
  environment.
technique: distilled-experience-memory
proposed_technique: Gate retrieved experience on a calibrated similarity
  threshold with empty fallback
technique_summary: Retrieved experience entries condition the prompt only when
  cosine similarity to the query exceeds a fixed threshold (0.65) and only the
  top five are injected; otherwise the agent runs the plain tool-augmented
  rollout.
technique_kind: retrieval
technique_validated_by: Ablation on FinMMR Easy against base-only (59.17) and
  tools-only (74.08) with identical decoding and tools; bank-size sweep from 0
  to 2,400 entries on BizBench SEC-NUM (55.15 to 68.65); hit-rate sweep over
  nine thresholds and accuracy sweep over retrieval depth 1/3/5/7 on 500
  questions with bootstrap intervals.
stance_on_existing: supports
related_claim_id: distilled-experience-memory
stance_reason: Distilled strategies and failure-derived cautions from the
  model's own trajectories improved a frozen model over an equally tooled
  baseline.
falsifier: An ablation on the same backbone and tool suite where
  threshold-gated memory gives no gain over tools alone, or where accuracy
  keeps rising with retrieval depth beyond five entries and with bank size
  past 1,800.
evidence_note: Measured on four benchmarks with a single backbone; the
  FT-vs-FM ablation is run on only one split (FinMMR Easy), bank-size and
  depth sweeps on one or two settings. Main table compares against published
  baseline numbers rather than re-run baselines, so only the Base-vs-FinAcumen
  contrast is controlled. No matched-compute baseline for the auxiliary
  consolidation calls.
confidence: medium
