arxiv_id: "2605.12620"
title: "Think Twice, Act Once: Verifier-Guided Action Selection For Embodied Agents"
url: https://doi.org/10.48550/arxiv.2605.12620
drafted_at: 2026-11-01
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: error-detection
statement: For high-level embodied action selection, a same-size MLLM used
  zero-shot as a Best-of-N verifier does not improve over the policy's own
  greedy chain-of-thought action, while the same model fine-tuned on
  LLM-synthesized failure trajectories does, so the gain comes from verifier
  training rather than from sampling several candidates.
kind: observation
backing_strength: single-paper
scope_condition: 3-4B Qwen2.5-VL and Gemma-3 backbones acting as both policy
  and verifier on high-level semantic actions in LangR (Habitat 2.0) and
  EB-ALFRED; oracle low-level controller; N=16 candidates, M=5 verifications
technique: ""
proposed_technique: Train the action verifier on LLM-synthesized failure trajectories
technique_summary: Prompt a teacher LLM to rewrite each successful embodied
  demonstration into a realistic failed variant (wrong object, wrong
  receptacle, precondition violation) with per-step correctness verdicts, then
  fine-tune an MLLM generative verifier on the balanced correct/incorrect set
  and use it to pick among sampled candidate actions at each timestep.
technique_kind: training
technique_validated_by: "Success rate against a greedy CoT policy and a
  zero-shot verifier of the same backbone: LangR 65 -> 64 (zero-shot) -> 71
  (fine-tuned); EB-ALFRED 44 -> 44 -> 49 on Qwen-3B and 48 -> 48 -> 51 on
  Gemma-4B; also raised zero-shot Qwen2.5-VL-72B from 30 to 38; scaling curve
  compared against self-consistency at matched LLM calls."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A zero-shot MLLM verifier matching the fine-tuned verifier's
  Best-of-N gain on the same benchmarks, or the fine-tuned verifier's gain
  disappearing once candidate sampling is matched against self-consistency at
  equal compute.
evidence_note: Measured on two benchmarks (8 LangR tasks x100 instructions, 6
  EB-ALFRED tasks x50), three runs for verifier conditions, two backbone
  families, plus transfer to three larger zero-shot policies. Design isolates
  sampling from verification via the zero-shot-verifier and self-consistency
  controls, but the verifier training data and the policy's CoT come from the
  same teacher (o3), and action-correctness coverage is judged by o3 rather
  than ground truth.
confidence: medium
