arxiv_id: '2602.03900'
title: Knowledge Model Prompting Increases LLM Performance on Planning Tasks
url: https://arxiv.org/abs/2602.03900
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: planning
statement: Prompting with a Task-Method-Knowledge model, which spells out what to do, how, and
  why in a hierarchical structure, lifted o1 on the obfuscated Random Blocksworld set of PlanBench
  from about 32% to 97%, and o1-mini from about 9% to 27%, gains far beyond the roughly 1% that
  zero-shot chain-of-thought gave on PlanBench in earlier work; the smaller model did not benefit
  on the Mystery variant.
kind: observation
backing_strength: single-paper
scope_condition: PlanBench Blocksworld variants (standard, Mystery, Random), o1 and o1-mini
  among others, 2026; prompt-only intervention.
technique: ''
proposed_technique: Task-Method-Knowledge prompting
technique_summary: 'Give the model an explicit hierarchical model of the task: the goals, the
  methods that achieve each, and the knowledge of why each step is taken, drawn from the TMK
  framework in educational science, before asking it to plan.'
technique_kind: prompting
technique_validated_by: Plan validity on PlanBench Blocksworld variants with and without TMK
  across several models; gains up to 65.8 points on Random Blocksworld for o1; no gain for o1-mini
  on Mystery.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Domains where writing the TMK model is as hard as solving the task, or where the
  gain vanishes for reasoning models released after o1.
evidence_note: Large effect on one benchmark family; the TMK model is hand-authored per domain,
  which is the cost the paper does not price.
confidence: medium
