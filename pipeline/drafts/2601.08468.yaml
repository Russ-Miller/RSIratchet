arxiv_id: "2601.08468"
title: "JudgeRLVR: Judge First, Generate Second for Efficient Reasoning"
url: https://doi.org/10.48550/arxiv.2601.08468
drafted_at: 2026-11-14
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: cutting-to-the-chase
statement: For a 30B MoE reasoning model trained with verifiable-reward RL on
  math, first spending part of the RL budget training the model to label
  candidate solutions correct/incorrect and only then running ordinary
  answer-reward RL from that checkpoint yields both shorter chains of thought
  (about 42% fewer tokens on in-domain math) and higher accuracy than spending
  the whole budget on ordinary answer-reward RL, with no explicit length
  penalty.
kind: observation
backing_strength: single-paper
scope_condition: One backbone (Qwen3-30B-A3B after SFT), DAPO-family RL, 113k
  math problems, matched total training steps; length reductions hold on math
  and most out-of-domain sets but output got longer on IFEval and ZebraLogic.
technique: ""
proposed_technique: Train the model to judge solutions before training it to solve
technique_summary: "Split the RL budget: first run verifiable-reward RL where
  the model classifies sampled candidate solutions as correct or incorrect
  (balanced positives/negatives, hard negatives from mid-difficulty problems),
  then initialize ordinary answer-reward RLVR from that checkpoint."
technique_kind: training
technique_validated_by: Accuracy and mean generation length on five math
  benchmarks and five out-of-domain benchmarks against a vanilla RLVR run with
  identical data, hyperparameters and total steps (+3.7 pp avg accuracy, -42%
  length in-domain; +4.5 pp out-of-domain); ablations show judging alone
  lengthens output and loses 3.9 pp, and interleaving judge/generate data 1:1
  loses 3.1 pp out-of-domain.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Replicating the same split-budget schedule on other backbones and
  task families and finding generation length unchanged or longer relative to
  matched-step vanilla RLVR, or the accuracy gain vanishing once the judge
  stage's extra data exposure is controlled for.
evidence_note: Measured on one model and one RL algorithm, with a matched-step
  vanilla baseline and two ablations (judge-only, mixed 1:1). Single seed, no
  variance reported; the judge stage sees extra model-generated solution data
  that the baseline does not, so data exposure is not fully isolated from the
  staging effect. Mechanism evidence (rising PPL under the SFT evaluator,
  falling counts of backtracking words) is correlational.
confidence: low
