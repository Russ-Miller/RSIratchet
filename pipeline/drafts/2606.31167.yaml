arxiv_id: "2606.31167"
title: "MIRTH: Mutual-Information Reasoning with Temporal Hubs for
  Vision-Language-Action Agents"
url: https://arxiv.org/abs/2606.31167
drafted_at: 2026-10-28
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For pretrained single-frame VLA manipulation policies on
  near-saturated LIBERO suites, compressing history into fixed-size dual-scale
  memory hubs (EMA workspace plus recency-biased short-window attention)
  yields only small success gains over the single-frame variant (93.2% to
  95.3% on LIBERO-Long), yet the learned policy genuinely depends on temporal
  order, since permuting the short-term frames at inference costs 7.3 points.
kind: observation
backing_strength: single-paper
scope_condition: Stationary single-arm manipulation, LIBERO simulation plus a
  LeRobot real platform; baselines already above 94% on the ablated suite, so
  headroom is small.
technique: ""
proposed_technique: Compress history into fixed-size dual-scale memory hubs
technique_summary: Augments a pretrained single-frame VLA with an EMA-based
  long-term workspace memory and a recency-biased short-window attention
  memory, fused per patch and injected as a fixed-length prefix or
  multiplicative patch modulation so context length does not grow with
  history.
technique_kind: architecture
technique_validated_by: Success rate on four LIBERO suites (500 episodes each)
  against Diffusion Policy, Octo, OpenVLA and OpenVLA-OFT; component ablations
  on LIBERO-Long; linear probes for state/velocity MAE; frame-shuffling
  perturbation; real-robot success over 30 runs per task.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Removing both memory hubs leaves LIBERO-Long success unchanged, or
  randomly permuting the short-term history frames at inference leaves success
  unchanged — either would show the hubs are not carrying order-dependent
  temporal information.
evidence_note: Measured, single paper, self-reported with baseline numbers
  copied from other papers rather than re-run. Ablation deltas (0.8-2.1
  points) are close to the reported standard deviations (~1%), so component
  attribution is weak; the shuffling result is a larger effect but tested only
  on one suite. No independent replication, and real-robot numbers appear only
  in a figure.
confidence: low
