arxiv_id: "2601.15668"
title: "EmotionThinker: Prosody-Aware Reinforcement Learning for Explainable
  Speech Emotion Reasoning"
url: https://doi.org/10.48550/arxiv.2601.15668
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: For 7B speech LLMs fine-tuned for speech emotion recognition,
  outcome-only rule-based RL (GRPO) raises emotion classification accuracy a
  lot while leaving explanation quality near the supervised starting point, so
  accuracy gains from verifiable rewards do not carry over to the quality of
  the stated acoustic reasoning.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-Omni-7B backbone, prosody-enhanced SFT checkpoint,
  nine-category emotion labels, reasoning scored by GPT and human raters on
  four dimensions
technique: ""
proposed_technique: Gate the reasoning reward on group-level reasoning-outcome agreement
technique_summary: Adds a trained multi-dimensional reasoning reward model to
  GRPO, introduced only after outcome accuracy stabilizes, and scales its
  contribution down whenever the mean reasoning score of incorrect samples in
  a rollout group exceeds that of correct ones.
technique_kind: training
technique_validated_by: "Ablations on four SER benchmarks: full GRPO-PTR
  68.89% accuracy / 3.98 reasoning vs plain GRPO 62.91 / 3.45, untrained
  reward model 66.67 / 3.36, no trust weight 67.71 / 3.74, no progressive
  scheduling 62.80 / 3.76; plus 100-sample human rating agreeing with GPT
  ranking."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An outcome-only RL run on the same data that raises both emotion
  accuracy and judged explanation quality as much as the reasoning-reward
  variant, or showing the reasoning-score gap is an artifact of the
  GPT/reward-model judge sharing a format preference with the trained policy.
evidence_note: Measured in one ablation table on one backbone with one dataset
  family; the reasoning score is produced by a GPT judge whose rubric matches
  the reward model's criteria, so judge-policy circularity is not isolated,
  though a 100-sample 4-rater human check reproduces the ranking.
confidence: medium
