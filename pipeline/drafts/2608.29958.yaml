arxiv_id: "2608.29958"
title: "RIDGE: Region-Informed Derivative-Guided Evidence Selection for Long
  Video Understanding"
url: https://doi.org/10.48550/arxiv.2608.29958
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For long-video QA under a fixed 32-frame budget with 7B-8B
  multimodal backbones, selecting frames from the structural shape of the
  frame-query similarity curve (peak, rising, falling, transition regions)
  beats ranking frames by similarity magnitude, and the margin grows with
  video length — a few points on short clips and roughly 8 points on hour-long
  videos — while on short/medium-clip benchmarks it is near-indistinguishable
  from other selectors.
kind: observation
backing_strength: single-paper
scope_condition: Training-free post-processing over precomputed frame-query
  scores; four long-video QA benchmarks, three backbones (Qwen2.5-VL-7B,
  InternVL-3-8B, LLaVA-OV-7B), budget 8-64 frames.
technique: ""
proposed_technique: Select frames by the shape of the relevance curve, not its height
technique_summary: Smooths the frame-query similarity sequence, segments it by
  slope and curvature into peak, rising, falling, boundary and background
  regions, allocates the frame budget across regions using a question-derived
  preference vector, and picks frames with region-specific rules.
technique_kind: retrieval
technique_validated_by: Accuracy on Video-MME, LongVideoBench, MLVU, LVBench
  against uniform sampling and AKS, BOLT, MDP3, FOCUS; best in most of 12
  model-benchmark cells; matched-scorer controls (CLIP, SigLIP) show +3.5 and
  +3.8 average points over BOLT and MDP3; component ablations each cost
  0.6-1.6 points.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Under matched scorers and budgets, curve-shape region selection
  fails to beat magnitude ranking on long-horizon benchmarks, or its advantage
  does not increase with video duration.
evidence_note: Measured on four benchmarks, three backbones, budgets 8-64,
  four LVLM scales, five scorers. Main table is not shared-scorer; two
  matched-scorer blocks (8 cells, RIDGE higher in 7) partly isolate the
  policy. Duration bucketing on LongVideoBench shows +2.1 at 15s versus +8.3
  at 3600s. No matched-compute baseline for the auxiliary weight-generation
  LLM, though fixed weights still beat FOCUS and AKS.
confidence: medium
