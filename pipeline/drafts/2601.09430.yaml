technique_validated_by: "Overall accuracy with vs. without CoT on Video-MSR:
  Qwen2.5-VL-7B 33.23 to 31.43, Qwen3-VL-8B 43.92 to 39.38; route planning was
  the one subtask where CoT helped the weaker model (10.83 to 23.17)."
stance_on_existing: supports
related_claim_id: chain-of-thought-prompting-gives-consistent-large-accuracy-gains-only-tasks
stance_reason: Spatial video deduction is a non-symbolic task and CoT not only
  fails to help but costs 1.8-4.5 points on both tested models.
falsifier: CoT prompting raising average accuracy on this or an equivalent
  multi-hop video spatial benchmark across several model families, or the drop
  disappearing under a better-specified CoT prompt format.
evidence_note: Measured on two models only, one prompt variant, direct-answer
  baseline from the same table; no analysis isolating hallucinated
  intermediate steps beyond the authors' interpretation, and route planning
  moves the opposite way, so the mechanism is argued rather than shown.
