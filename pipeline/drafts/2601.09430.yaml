statement: On multi-hop spatial reasoning over indoor-scan videos (constrained
  localization, chained reference retrieval, route planning, counterfactual
  physical deduction), adding chain-of-thought prompting lowers accuracy for
  7-8B Qwen VL models relative to direct answering, because intermediate steps
  fabricate spatial details that propagate to the final answer.
kind: observation
backing_strength: single-paper
scope_condition: Two Qwen VL models (2.5-VL-7B, 3-VL-8B) on a 4,993-QA video
  benchmark built from six indoor 3D-scan datasets; greedy decoding; mixed
  multiple-choice and LLM-judged open-ended scoring.
