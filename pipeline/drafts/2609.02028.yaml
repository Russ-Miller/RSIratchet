arxiv_id: "2609.02028"
title: Detecting Object Hallucinations in Large Vision-Language Models via
  Cross-Modal Attention Drifts and Mask-Based Verification
url: https://doi.org/10.48550/arxiv.2609.02028
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 4-7B open vision-language models (LLaVA-1.5-7B, Qwen2.5-VL-7B,
  InternVL-2.5-4B), how the cross-modal attention distribution over visual
  tokens shifts between adjacent decoder layers separates hallucinated from
  grounded object predictions better than the model's sensitivity to masking
  the attended region, and better than attention drift measured against a
  fixed first or last layer anchor.
kind: observation
backing_strength: single-paper
scope_condition: Open-weight 4-7B LVLMs, object/attribute/relation
  hallucination detection on POPE, Pascal VOC, COCO captions and AMBER, with a
  small supervised MLP detector trained on the extracted features.
technique: ""
proposed_technique: Detect hallucination from adjacent-layer attention drift plus masked re-query
technique_summary: Compute KL divergence between consecutive layers'
  cross-modal attention over visual tokens, mask the top-attended region of
  the layer just before the largest drift, re-query the same token's
  probability, and feed the drift profile plus the probability change into a
  small MLP detector while the LVLM stays frozen.
technique_kind: tooling
technique_validated_by: "ACC and AUROC against six detection baselines (IC,
  GLSim, NLL, Entropy, SVAR, DHCP) on three models and three datasets: best in
  16 of 18 cells, with COCO-Caption AUROC gains of 5.6/8.4/4.6 points over the
  best baseline; ablations isolate each component (LLaVA drift-only AUROC
  85.7, masking-only 72.8, combined 87.4) and compare masking-layer and
  masking-region choices."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same models and benchmarks, a masking-based or fixed-anchor
  drift feature matching or beating adjacent-layer drift AUROC, or the
  combined detector failing to beat drift-only features.
evidence_note: Measured on three open LVLMs and four benchmarks with repeated
  runs and reported standard deviations; ablations cover drift metric, anchor
  formulation, masking layer and masking region. Detector is supervised and
  trained per dataset, so transfer is only partly shown (cross-dataset AUROC
  drops, e.g. 66.4 on AMBER-relation). No proprietary models tested; absolute
  separation on relation hallucination is weak.
confidence: medium
