arxiv_id: "2603.22918"
title: "EVA: Efficient Reinforcement Learning for End-to-End Video Agent"
url: https://doi.org/10.48550/arxiv.2603.22918
drafted_at: 2026-11-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For a 7B multimodal backbone on long-video QA, withholding all
  frames at the first step and training the model (SFT cold-start, then
  preference correction, then GRPO) to emit its own time window, frame count
  and spatial resize before any perception raises accuracy over
  uniform-sampling and fixed-workflow agent baselines while using far fewer
  visual tokens.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B base; six video QA benchmarks (LSDBench,
  LongVideoBench, MLVU, VideoMME, LVBench, Video-Holmes); tool exposes
  start/end time, nframes and resize; requires the full three-stage training,
  since the SFT-only checkpoint scores lowest while consuming the most frames.
technique: ""
proposed_technique: "Plan before looking: let the agent choose window, frame
  count and resolution"
technique_summary: The agent sees only the text query at step 0 and iterates
  summary-plan-action-reflection, calling a frame tool whose temporal window,
  frame count and spatial downsampling it sets itself, trained by SFT then KTO
  on labelled good/bad trajectories then GRPO with accuracy plus anti-guessing
  format rewards.
technique_kind: training
technique_validated_by: "Accuracy on six video benchmarks against
  uniform-sampling MLLMs and prior adaptive agents (FrameThinker, VideoMTR,
  VideoAgent), with visual-token counts reported: LSDBench 51.0% at 10.3K
  tokens vs Qwen2.5-VL 52.5% at 499K; MLVU 68.3 vs 59.1 for FrameThinker;
  LVBench 43.3 vs 36.6. Stage ablation (SFT/KTO/GRPO) and GRPO
  data-composition ablation (multi-choice vs open-ended vs mixed) reported."
stance_on_existing: supports
related_claim_id: 7b-multimodal-models-long-video-qa-multi-turn-agentic-exploration-harness
stance_reason: Both find that an adaptive viewing harness only beats
  single-pass uniform sampling once the model is trained to use it, with an
  SFT cold start followed by trajectory-level RL.
falsifier: A matched-token uniform-sampling or fixed-workflow agent baseline
  on the same benchmarks matching EVA-GRPO's accuracy, or the trained
  planning-first agent failing to beat its own SFT checkpoint when frames are
  withheld at step 0.
evidence_note: Measured on six benchmarks with one backbone and one seed;
  baselines are cited from prior work rather than re-run, and token counts for
  EVA are estimated at 650 tokens/frame, so the token-efficiency comparison is
  approximate. Stage ablation isolates SFT vs KTO vs GRPO but not the
  planning-before-perception design against a same-trained perception-first
  control.
confidence: medium
