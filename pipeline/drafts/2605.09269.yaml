statement: For 4B-8B multimodal judge models, having the model first generate
  an instance-specific disagreement checklist from the two candidate responses
  and then execute it against the image raises preference accuracy more than a
  generic dataset-level rubric, with the margin concentrated in
  reasoning-heavy items.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3-VL 4B and 8B Instruct trained with multi-role GRPO on
  30K RLAIF-V preference pairs; evaluated on VL-RewardBench and Multimodal
  RewardBench.
technique: ""
proposed_technique: Generate a disagreement checklist, then verify it against the image
technique_summary: One MLLM first writes a neutral instance-specific checklist
  of the factual points where two candidate responses disagree, then executes
  those checks against the image to pick a winner, with both roles trained
  jointly by group-based RL using separately normalized advantages.
technique_kind: training
technique_validated_by: "VL-RewardBench overall accuracy 80.1 for 8B vs 72.0
  no-rubric RL baseline, 75.3 static generic rubric, 61.3 base; Reasoning
  subcategory 72.6 vs 59.6 static. Multimodal RewardBench overall 73.2 vs 68.7
  no-rubric. Ablations: frozen planner 78.8, absolute (unbaselined) planner
  reward 77.6, text-only planner 79.1."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-compute comparison in which a generic static rubric, or
  plain CoT RL at equal token budget, matches the dynamic checklist on
  reasoning-subcategory accuracy for the same backbones.
evidence_note: "Measured on two multimodal preference benchmarks plus
  text-only RewardBench, two model sizes, with controlled no-rubric and
  static-rubric RL baselines and five ablations (frozen planner, reward form,
  visual context, DAPO). Not isolated: extra inference tokens from the
  checklist stage are not compute-matched against the baselines, and training
  data is a single source (RLAIF-V)."
