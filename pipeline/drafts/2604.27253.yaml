statement: "When synthesizing web-agent training trajectories by exploring a
  site, the raw exploration trajectories are poor SFT supervision compared
  with trajectories re-executed by a task-focused agent using the exploration
  trace as a hint: on WebArena Reddit, fine-tuning Qwen2.5-VL-7B on
  exploration data alone scored 11.54% versus 34.62% on refined data."
kind: mechanism
backing_strength: single-paper
scope_condition: Web GUI agents fine-tuned by SFT on synthesized trajectories;
  exploration uses a restricted action space (e.g. no scrolling) that omits
  actions real tasks need.
technique: ""
proposed_technique: Re-execute explored tasks with the exploration trace as a hint
technique_summary: After breadth-first exploration discovers task-trajectory
  pairs, a web agent re-executes each task with the exploration trace supplied
  as a hint, rewriting the task description and producing a full-action-space
  trajectory for SFT.
technique_kind: training
technique_validated_by: "WebArena task-completion accuracy after fine-tuning
  Qwen2.5-VL-7B-Instruct: 24.23% overall vs 19.59% for SynthAgent, 13.40%
  OS-Genesis, 4.64% Explorer, 9.36% untuned base; ablation on Reddit gives
  34.62% refined vs 11.54% exploration-only."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Fine-tuning on exploration-only trajectories matching or beating
  refined trajectories on web-agent task completion, or the refined-data gain
  disappearing once exploration is allowed the full action space.
evidence_note: Measured on WebArena with one task per template (57/56/26/55
  tasks across four sites), single backbone family, single refinement agent.
  The exploration-vs-refined ablation is one website only (Reddit, 26 tasks),
  so the 23-point gap rests on a small sample. The paper's mechanism story
  (restricted exploration action space) is argued with examples, not isolated
  by an experiment that varies the exploration action space.
confidence: low
