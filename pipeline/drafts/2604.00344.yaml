arxiv_id: "2604.00344"
title: "Agent Q-Mix: Selecting the Right Action for LLM Multi-Agent Systems
  through Reinforcement Learning"
url: https://doi.org/10.48550/arxiv.2604.00344
drafted_at: 2026-11-06
drafted_from: full-text
