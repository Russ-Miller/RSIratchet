arxiv_id: "2609.17775"
title: "SAGE: Governed Artifact Generation from Enterprise Guidelines"
url: https://doi.org/10.48550/arxiv.2609.17775
drafted_at: 2026-09-28
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When extracting structured rules from multimodal enterprise
  guideline documents, wrapping the extraction in deterministic schema
  validation, an LLM semantic judge, and a duplicate/contradiction consistency
  filter over a shared rule store lowers the share of extracted rules with no
  matching source sentence from about 15.7% to 3.2% relative to a one-pass
  pipeline using the same parser and models.
kind: observation
backing_strength: single-paper
scope_condition: 120 real client guideline documents (PDF/DOCX/PPTX, table-
  and image-heavy), Qwen2.5-VL-32B extraction and Claude Sonnet 4.6 artifact
  generation; hallucination is defined as cosine similarity below 0.40 to any
  source sentence, with no ground-truth rule annotations.
technique: ""
proposed_technique: Gate extraction through a versioned rule store with schema
  and consistency layers
technique_summary: Every extracted rule is written to a shared versioned store
  under a stable id, checked against 26 schema constraints, scored on five
  dimensions by an LLM judge whose minimum dimension decides
  auto-approve/review/reject, then filtered for duplicates and contradictions
  by embedding similarity plus NLI.
technique_kind: process
technique_validated_by: "Compared against a monolithic one-pass baseline with
  the same parser and same models on the same 115 documents: hallucination
  3.2% vs 15.7%, duplication 3.0% vs 10.3%, artifact rule coverage 93.7% vs
  62.8%; a cumulative ablation attributes duplicate removal (117 units), 113
  contradictions and 1,040 gaps to the consistency layer specifically. The L2
  judge was checked against 300 blind expert rule labels (F1 0.957, kappa
  0.813)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the one-pass baseline, scored with
  human-annotated grounding rather than cosine similarity to source sentences,
  shows a similar ungrounded-rule rate to the governed pipeline — or where the
  reduction is shown to come only from the schema layer rejecting rules rather
  than from better grounding.
evidence_note: "Measured on 120 industry documents with a matched-model
  one-pass baseline, which isolates the governance layers from the base model.
  But no ground truth: grounding and hallucination are cosine-similarity
  proxies with hand-set thresholds, thresholds were tuned on the same corpus
  with no held-out split, and only 10-15 documents were expert-inspected. The
  ablation table shows the governed pipeline gates and routes rather than
  deleting units, so part of the improved score may reflect selective routing
  rather than fewer fabricated rules."
confidence: low
