statement: For LLM-driven repair of scheduling-system logic under emergency
  events, splitting the task into a perception agent that localizes which
  decoupled atomic functions the event affects and a decision agent that edits
  only those functions raises repair success rates for 7-9B local models far
  above the same models reasoning over the whole system context, and the
  localized pipeline also beats much larger cloud models on the most tightly
  constrained scenario.
kind: mechanism
backing_strength: single-paper
scope_condition: Simulated port, warehouse and carrier-deck scheduling
  datasets built by the authors, where the system has already been decomposed
  into an atomic-function library with written specifications; gains measured
  on 199-642 synthetic emergency instances per scenario.
technique: ""
proposed_technique: Localize the affected modules, then edit only those
technique_summary: A perception agent parses the emergency description and
  flags which atomic functions in a pre-decoupled function library are
  affected; a second agent rewrites only those functions, which are then
  trial-executed and written back to the library.
technique_kind: process
technique_validated_by: Task success rate and average processing time on three
  self-built emergency-scheduling datasets. With no distillation, plugging
  three untuned 7-9B models into the architecture raised success from 17-36%
  to 31-69% while cutting average latency (e.g. Qwen2.5-Coder-7B on deck
  17.45% to 48.91%, 0.39s to 0.16s). With the distilled variant, success
  reached 98.49/94.97/97.50% at 0.19-0.33s versus the best cloud baseline
  GLM-4.7 at 89.95/86.18/83.49% and 27-41s.
stance_on_existing: supports
related_claim_id: splitting-task-across-several-agents-helps-long-horizon-tasks-whose
stance_reason: The gain here comes from restricting each agent's context to a
  sparsely dependent local module rather than from inter-agent dialogue,
  matching the condition under which decomposition is said to help.
falsifier: A single agent given the same atomic-function library and told to
  edit only the relevant function, at matched context length, matching the
  two-agent pipeline's success rate — showing the gain came from scope
  restriction already available without the split.
evidence_note: Measured on three author-constructed simulation datasets with
  no external benchmark, so scenario realism and the hand-built
  atomic-function decomposition are not independently validated; success is
  judged by trial execution. The w/o-SFL ablation does cleanly separate the
  architecture's contribution from the distillation's. No matched-context
  single-agent control is reported, so scope restriction and agent splitting
  are not separated.
confidence: low
