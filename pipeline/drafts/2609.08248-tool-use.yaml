statement: 'With the agent loop, skills and prompts held fixed and only the model swapped, models
  split into two clusters on operating a multi-step asynchronous ML workflow: Claude Sonnet
  3.5-4.0, Gemini 2.5 and GPT-5 completed tasks at 93-100%, while GPT-4 scored 13% and others
  could not run the loop at all, hallucinating workflow ids or failing to wait for asynchronous
  jobs; on open-ended exploration the effect of a stressful, competitive prompt reversed by
  family, with Sonnet 4.0 producing the largest improvement of any configuration under stress
  and GPT-5 turning conservative and giving back most of its basic-prompt gains.'
kind: observation
backing_strength: single-paper
scope_condition: A-MLE harness in an industrial ads-ranking stack, 2026; task-completeness scores
  on tier-2 workflow execution and rMSE improvement on tier-3 exploration; one prompt pair (basic
  versus stressful); developer-reported.
