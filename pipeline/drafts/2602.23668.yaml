arxiv_id: "2602.23668"
title: "PseudoAct: Leveraging Pseudocode Synthesis for Flexible Planning and
  Action Control in Large Language Model Agents"
url: https://doi.org/10.13140/rg.2.2.20742.84801
drafted_at: 2026-11-15
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: For tool-using LLM agents on multi-hop QA and fact-verification
  tasks, synthesizing a full pseudocode plan with explicit control-flow
  primitives (conditionals, bounded loops, termination conditions, data
  dependencies) before any action, and then executing each step with only
  step-local context plus the global constraints, yields higher task accuracy
  than reactive ReAct or depth-first-search agents, whose failures are
  unbounded query reformulation after the needed evidence has already been
  found.
kind: observation
backing_strength: single-paper
scope_condition: Two text benchmarks (FEVER, HotpotQA) plus five hand-built
  power-grid scenarios; benchmark gold labels were manually recalibrated by
  the authors; no ablation isolating which part of the plan representation
  carries the gain.
technique: ""
proposed_technique: Synthesize a pseudocode plan with control flow, then execute it
technique_summary: A planner LLM first emits a structured pseudocode blueprint
  (ordered subtasks, control-flow primitives, termination condition, iteration
  cap, per-step input/output interface), and a deterministic executor walks
  that plan, handing each subtask to a ReAct agent with only the step context
  and global constraints rather than the growing history.
technique_kind: prompting
technique_validated_by: Accuracy and F1 on FEVER (88.24% / 83.35% vs DFSDT
  67.31% / 64.16% and ReAct 60.78% / 62.63%) and accuracy on HotpotQA (82.14%
  vs DFSDT 73.21%, ReAct 46.40%), plus qualitative traces showing DFSDT
  emitting 60+ tool calls and hitting a recursion error where the planned
  agent terminates.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same backbone with a plain ReAct or DFSDT loop plus
  only a deterministic step/iteration cap matching the plan's k_max closes
  most of the accuracy gap on uncalibrated FEVER and HotpotQA, showing the
  gain comes from bounded termination rather than from the structured plan.
evidence_note: Measured on two benchmarks against two reactive baselines with
  one backbone, plus five qualitative engineering scenarios with no baseline
  comparison. No ablation of the pseudocode plan's components, no token-cost
  measurement despite a complexity argument, and the authors edited gold
  labels in both benchmarks, which could favour their own system's answer
  style.
confidence: low
