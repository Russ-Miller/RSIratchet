arxiv_id: "2609.01352"
title: "CHARM: Character Hallucination for Multicultural Role Play Benchmark"
url: https://doi.org/10.48550/arxiv.2609.01352
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: In role-play with an assigned character, models usually recognize
  that a query lies outside the character's knowledge boundary yet fail to
  abstain when asked a concrete factual question about it, so the dominant
  failure is compliance rather than recognition.
kind: observation
backing_strength: single-paper
scope_condition: Six LLMs (GPT-4o, GPT-5.5, Gemini-3.5-Flash, Llama-3.1-8B,
  Gemma-3-12B, Qwen3-8B) on 40 characters from five cultural-linguistic
  regions, using abstention-enabled multiple-choice items with awareness and
  compliance probes run independently.
technique: ""
proposed_technique: Separate boundary-awareness from boundary-compliance probes
technique_summary: Ask the same role-played model a binary question about
  whether a target is inside the character's knowledge boundary, then
  separately ask a concrete factual multiple-choice question with an
  abstention option, and pair the two outcomes per instance.
technique_kind: process
technique_validated_by: Applied to 680 awareness and 1,332 compliance items
  across six models; compliance-gap rate exceeded recognition-failure rate for
  every model (e.g. GPT-4o 91.3% awareness accuracy, 18.9% compliance
  accuracy, 72.1% gap vs 8.9% recognition failure), and a
  knowledge-verification probe confirmed 78-100% of factually correct gap
  cases in five of six models as parametric overrides.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Models showing recognition-failure rates above compliance-gap rates
  on the same paired probes, or gap cases mostly failing the
  knowledge-verification check, would show the failure is unawareness rather
  than suppression.
evidence_note: Measured on a new benchmark of 40 characters, 680 awareness /
  1,332 compliance / 736 verification items, native-reviewer validated.
  Awareness and compliance are measured in independent runs, so a gap is a
  dissociation across probes, not a within-context reversal; the authors call
  this a conservative lower bound. Qwen3-8B is the outlier with low awareness
  accuracy (62.6%) and only 50.5% verified override.
confidence: medium
