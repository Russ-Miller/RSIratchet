arxiv_id: "2604.21911"
title: "When Prompts Override Vision: Prompt-Induced Hallucinations in LVLMs"
url: https://doi.org/10.48550/arxiv.2604.21911
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In current 7-8B open vision-language models, object-existence
  accuracy falls in a fixed order — objects actually present and random absent
  objects answered correctly above 85%, semantically co-occurring absent
  objects 8-37 points lower, and questions that presuppose the absent object's
  presence (asking its colour or logo) lower still by a further 15 points or
  more — so the dominant hallucination driver is the prior carried by the
  instruction, not the visual backbone.
kind: observation
backing_strength: single-paper
scope_condition: Five 7-8B LVLMs (InternVL3.5-8B, Molmo-7B-D, Qwen2-VL-7B,
  Qwen2.5-VL-7B, LLaVA-1.5-7B) on COCO images with co-occurrence-derived
  adversarial objects verified absent by a grounding model; single-object
  yes/no and attribute questions only.
technique: ""
proposed_technique: Separate perception, co-occurrence and presupposition probes per image
technique_summary: For each image, annotate a present object, an unrelated
  absent object, and a PMI-ranked plausible-but-absent object, then ask
  existence questions about all three plus an attribute question that
  presupposes the adversarial object exists, so the three hallucination causes
  are scored separately.
technique_kind: process
technique_validated_by: Applied to 3K images per subset across five LVLMs; the
  monotone drop Rec_pos/Rec_rnd > Rec_adv > AdP is reported for every model
  and both candidate-object sources, with AdP judged by an LLM checking
  whether the response denies the false presupposition.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An LVLM family where adversarial-presupposition rejection is as
  high as plain absent-object recognition, or where positive/random
  recognition accuracy falls below adversarial accuracy, would show perception
  rather than instruction priors is the limiting factor.
evidence_note: Measured on 3K images per subset across five models and two
  candidate-object sources; the ordering is consistent, but absences are
  established by a grounding model plus LVLM check rather than exhaustive
  human verification, and the attribute probe differs from the recognition
  probes in both answer format and grader (LLM judge), so part of the AdP gap
  could be format rather than prior strength.
confidence: medium
