arxiv_id: "2608.30405"
title: Dense Clinical Contrasts Enhance Medical Knowledge Updating in Large
  Language Models
url: https://doi.org/10.48550/arxiv.2608.30405
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: knowledge-updating
statement: When injecting revised medical guideline facts into 4B-14B instruct
  models by LoRA SFT under a matched token budget, rendering the same update
  events as extended-matching items — several related vignettes sharing one
  candidate answer pool — transfers better to a held-out temporally anchored
  oncology staging benchmark than short-answer, fill-in-the-blank, or
  per-vignette multiple-select renderings of the identical content.
kind: mechanism
backing_strength: single-paper
scope_condition: Oncology guideline updates, LoRA SFT, Qwen3 1.7B-14B plus
  Llama-3.1-8B; formats still differ in candidate-set size and surface
  complexity despite matched token budget; not uniformly best (a
  fill-in-the-blank format led on one molecular-update slice).
technique: ""
proposed_technique: Render knowledge updates as shared-pool extended matching items
technique_summary: Group related update vignettes into one training instance
  with a shared answer option pool so the model must discriminate across
  vignettes between current and superseded recommendations.
technique_kind: training
technique_validated_by: SEER-Bench answer accuracy 57.6 to 64.8 and rationale
  accuracy 50.7 to 59.6 on Qwen3-4B, versus 61.5-62.7 answer accuracy for the
  three other same-budget formats; HealthBench retention 0.247 to 0.263;
  replicated on Llama-3.1-8B and across 1.7B/8B/14B backbones;
  vignette-matched and density-matched controls reported in appendices.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-budget comparison on a different domain or update
  algorithm where extended-matching supervision transfers no better than
  short-answer or fill-in-the-blank rendering of the same facts, or where the
  gain disappears once candidate-set size and surface complexity are
  equalized.
evidence_note: Measured on a single oncology benchmark built by the same
  authors (1,992 cases, expert-reviewed) plus HealthBench Professional and a
  MedGUIDE diagnostic. Format is varied while content and token budget are
  held fixed, which is the design's strength; it does not fully isolate
  candidate-set size from relational structure, and authors flag this.
  Representation-level diagnostics are correlational.
confidence: medium
