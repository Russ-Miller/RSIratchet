evidence_note: "Measured: per-task accuracy for 12 models plus a
  three-annotator human baseline (Fleiss' kappa 0.78) on a benchmark the
  authors built. Frame budgets differ per model by official config, so input
  density is not controlled; the three cognitive levels are the authors' own
  taxonomy, and task difficulty within a level is not independently
  calibrated."
