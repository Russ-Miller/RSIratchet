statement: On month-level egocentric recordings (20-120 days per participant)
  with human-written multiple-choice questions, current multimodal models
  degrade as the question moves from inferring recurring habits, to retrieving
  one specific episode, to composing evidence across days — the best model
  reached 71.8% macro-average against a 94.2% human baseline, with several
  models near or below the 25% chance level on route reasoning, cross-view
  spatial reasoning and direction judgement.
