arxiv_id: "2602.21496"
title: "Beyond Refusal: Probing the Limits of Agentic Self-Correction for
  Semantic Sensitive Information"
url: https://doi.org/10.48550/arxiv.2602.21496
drafted_at: 2026-11-09
