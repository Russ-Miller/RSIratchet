capability: forecasting
statement: When frontier LLMs forecast live prediction markets repeatedly over
  weeks, models that emit longer reasoning traces per update revise their
  probabilities more aggressively and more often than terse models, and that
  extra verbosity does not buy more valid, in-budget decisions — the
  longest-reasoning model in the set had the lowest rate of successfully
  returned decisions.
kind: observation
backing_strength: single-paper
scope_condition: Eight frontier models deployed concurrently on Polymarket
  over a 30-day window under locked prompts and identical token/information
  constraints; token length varied across models rather than being manipulated
  within a model.
technique: ""
proposed_technique: Score forecasters on belief-revision volatility, not just accuracy
technique_summary: Query each model repeatedly on the same unresolved market
  and report probability volatility, reasoning-trace divergence and
  update-vs-information alignment alongside Brier score and calibration.
technique_kind: process
technique_validated_by: Not measured as an intervention; the paper reports
  that models with comparable forecast accuracy separate on drift, token spend
  and valid-decision rate across 500+ live markets, but gives no
  accuracy-matched comparison or statistical test.
stance_on_existing: neither
