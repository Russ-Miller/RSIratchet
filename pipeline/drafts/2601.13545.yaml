falsifier: A controlled study varying the reasoning-token budget within the
  same model on the same live markets finds that longer traces lower
  probability volatility, or that across models output-token length correlates
  positively with valid-decision rate and negatively with drift.
evidence_note: "Descriptive, observational: per-model token counts,
  strategy-selection frequencies, adjustment depth and successful-decision
  counts are reported over a 30-day live window, with no controlled
  manipulation of reasoning length and no significance testing, so model
  identity is fully confounded with verbosity. All eight models recorded
  negative P&L."
