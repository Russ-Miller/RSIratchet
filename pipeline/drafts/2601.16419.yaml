arxiv_id: "2601.16419"
title: Learning Domain Knowledge in Multimodal Large Language Models through
  Reinforcement Fine-Tuning
url: https://doi.org/10.48550/arxiv.2601.16419
drafted_at: 2026-11-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: For 3B-7B Qwen2.5-VL models on remote sensing and medical imaging
  few-shot recognition, stating domain properties in the prompt or appending
  model- or BLIP-generated captions does not raise accuracy and caption
  augmentation can lower it, while encoding the same domain priors as
  transformation-consistency terms in the RL objective raises accuracy over
  SFT and outcome-reward RL.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL 3B/7B, 1-8 shot, six remote sensing and five
  MedMNIST datasets plus DIOR grounding; domain priors limited to rotation
  invariance and symmetry consistency.
technique: ""
proposed_technique: Encode domain priors as RL distribution constraints, not prompts
technique_summary: During GRPO fine-tuning, feed domain-transformed images
  (rotations, symmetries) through the policy to form a domain-support
  distribution, add a KL term pulling the policy toward it, and reweight
  advantages by one minus the JS divergence from that distribution.
technique_kind: training
technique_validated_by: Few-shot accuracy on six remote sensing and five
  medical datasets plus DIOR mAP, against SFT, Visual-RFT, SFT/Visual-RFT with
  standard data augmentation, and an output-level constraint variant; reported
  gains over SFT of +0.6 to +7.8 average points depending on shot count.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled comparison where prompt-stated domain properties or
  caption augmentation match the RL-constraint variant's accuracy on the same
  datasets and shot budgets, or where the gain disappears once the
  data-augmentation baseline is trained to convergence.
evidence_note: Measured on one backbone family across eleven classification
  datasets and one grounding dataset, with ablations separating constraint
  from reward reweighting, output-level vs distribution-level constraints, and
  divergence choices. Prompt/caption injection was only tested on the untuned
  base model, so the comparison is base-model prompting vs fine-tuned RL, not
  matched training budgets. No seed variance or confidence intervals reported.
confidence: low
