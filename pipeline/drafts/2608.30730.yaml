statement: "In a deterministic 365-day e-commerce business simulation of
  1,000-4,000 agent steps, end-of-year assets do not predict the six
  underlying operating competences: across 18 frontier and open-weight models
  the top earner ranked 16th of 18 on fraud avoidance and below another model
  on profit per tool call, and the best negotiator finished mid-pack on
  assets."
kind: observation
backing_strength: single-paper
scope_condition: One benchmark, five episodes per model, fixed world and
  deterministic customer demand and supplier negotiation kernel; only renderer
  wording varies between runs.
technique: ""
proposed_technique: Score long-horizon agents on separate capability axes, not
  one accumulated outcome
technique_summary: Alongside the accumulated primary score, measure
  negotiation surplus, fraud spend share, drawdown over peak, profit per tool
  call, controllable return rate, and repeat-order price discipline as
  separate ranked axes.
technique_kind: process
technique_validated_by: Not measured as an intervention; demonstrated by
  showing rank inversions across the seven axes for 18 models over 90
  episodes.
stance_on_existing: supports
related_claim_id: 20-year-deterministic-football-management-simulation-hidden-state-adaptive-rivals-340-400
stance_reason: Both find that a single accumulated outcome in a long
  deterministic business simulation fails to order models by the competences
  that produce it.
falsifier: Re-running the benchmark with more episodes and finding that
  per-dimension rankings correlate strongly with the asset ranking, so the
  extra axes carry no independent information.
evidence_note: Measured over 18 models x 5 episodes (90 runs) in one
  deterministic environment; spreads are large (std exceeds mean on fraud
  share for 15 of 18 models), and the dimension set is the authors' own
  choice, so independence of the axes is shown by rank inversion rather than
  by a validated construct.
