scope_condition: LLM-based forecasting agents evaluated on static benchmarks
  rather than live post-cutoff questions; survey-level synthesis, not a
  controlled experiment
technique: ""
proposed_technique: Score forecasts live post-cutoff, reporting cost and accuracy together
technique_summary: Evaluate forecasting agents only on questions resolving
  after the model's training cutoff, with ablations of the LLM component and
  joint reporting of cost and accuracy.
technique_kind: process
technique_validated_by: Not measured; argued from collected negative evidence
