statement: Across LLM-based forecasting systems, reported accuracy gains
  frequently cannot be attributed to the language model's temporal reasoning,
  because evaluation windows predate training cutoffs, component ablations
  show the LLM sometimes adds nothing over the statistical or retrieval parts,
  and results shift under small input perturbations.
