arxiv_id: "2604.22937"
title: "AutoPyVerifier: Learning Compact Executable Verifiers for Large
  Language Model Outputs"
url: https://doi.org/10.48550/arxiv.2604.22937
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: error-detection
statement: For binary correctness labels on LLM outputs in math, coding,
  function-calling and instruction-following tasks, searching over
  LLM-proposed sets of executable Python verifiers — expanding promising
  candidate sets from their false positives and negatives under a utility that
  scores F1, exploration, set size and non-degeneracy — produces 1-6-function
  verifier sets that predict the correctness label far better than the
  one-shot LLM-generated verifier sets they started from.
kind: observation
backing_strength: single-paper
scope_condition: Binary target objectives with a labelled development set of
  model outputs; verifiers written in Python; five frontier LLMs used as
  synthesizer/critic/modifier; outputs generated by GPT-4.1 (in-distribution)
  and Gemini 2.5 Flash-Lite (transfer); 20 expansion steps and per-task
  hyperparameter tuning.
technique: ""
proposed_technique: Search a DAG of executable Python verifier sets against labels
technique_summary: An LLM synthesizes candidate Python verifier sets, which
  are then iteratively critiqued and edited from their false positives and
  negatives in a DAG search scored by F1 against target labels plus
  exploration, size and feasibility terms, returning a compact verifier set.
technique_kind: tooling
technique_validated_by: F1 of the induced verifier set's joint satisfaction
  against benchmark-evaluator correctness labels on AIME, LiveCodeBench,
  ComplexFuncBench and IFBench, compared with the initial LLM-generated
  verifier set from the same model; gains up to 55.0 F1 in-distribution and up
  to 54.4 F1 when the same verifiers are applied to a different base model's
  outputs; final sets held to 1-6 functions. Separately, exposing the
  verifiers as tools to GPT-4.1 raised task accuracy by 1.6-17.0 points.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Scoring the searched verifier sets on a held-out split of outputs
  (rather than the development set the search optimized) shows no reliable F1
  advantage over the initial LLM-generated verifier sets, or a random/greedy
  expansion of the same budget matches the DAG search.
evidence_note: "Measured across 4 benchmarks x 5 synthesizer models, with a
  transfer condition to a second output-generating model. Baseline is the
  paper's own first-pass LLM verifier synthesis, which is the right comparison
  for the search step but not against any external verifier (no LLM-judge or
  PRM baseline). The reported in-distribution F1 appears to be on the same
  development set the search optimized and from the best hyperparameter run,
  so the headline gains are not clean generalisation. Transfer results are
  more variable: three cells show zero gain and one a small drop."
confidence: medium
