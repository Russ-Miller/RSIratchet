arxiv_id: "2608.29814"
title: "FRAMEWORKERS: A Dynamic Multi-Agent Framework for AI-Generated Video
  Production"
url: https://doi.org/10.48550/arxiv.2608.29814
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For routing a video-production request to an ordered chain of
  registered sub-agents, an 8B open model fine-tuned on descriptor-conditioned
  routing plans (SFT on verified plans plus GRPO rewarding validity, sub-agent
  coverage F1 and dependency-consistent order) picks chains more accurately
  than much larger prompted planners, with the gap widest on long,
  structurally unfamiliar chains.
kind: observation
backing_strength: single-paper
scope_condition: Sequential plans over a fixed inventory of 20 sub-agents,
  each appearing at most once; evaluated as chain/step match against reference
  plans, not as end-to-end video quality.
technique: ""
proposed_technique: Train the orchestrator on descriptor-conditioned routing plans
technique_summary: Fine-tune the planning model to emit a rationale plus an
  ordered sub-agent plan from tool descriptors, then refine with GRPO
  rewarding parseable output, coverage F1 against the target plan, and
  satisfied precedence edges.
technique_kind: training
technique_validated_by: "Exact-match chain accuracy, per-step accuracy and
  slot-aware edit distance on two held-out sets (DCE 522 easy, DCH 200 hard):
  91.0/81.5 chain accuracy versus Gemini 3 Pro at 80.3/47.5, GPT-4o 58.0/31.0,
  and Qwen3-8B base 29.5/11.5; ablations show GRPO adds +33.5 chain points on
  DCH over the SFT checkpoint, and the frozen Director selected two
  post-training sub-agents correctly in 93.0% and 99.2% of cases."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A prompted frontier planner matching or beating the fine-tuned 8B
  Director on long-chain routing on the same held-out sets, or the tuned
  Director's advantage disappearing on routing tasks with a different
  sub-agent inventory or non-sequential plans.
evidence_note: Measured on 722 held-out routing cases with matched prompts and
  no few-shot examples, plus 4B/8B and supervision-format ablations. Reference
  plans are template-generated (20% manually spot-checked), so targets may
  encode the generator's own routing conventions, which favours a model
  trained on that distribution. End-to-end video quality was only tested on 20
  cases and confounds the Director with the rest of the framework.
confidence: medium
