statement: 'Knowledge-editing methods such as ROME and fine-tuning insert a stated fact reliably
  but do not carry its logical consequences: on multi-hop questions generated from knowledge-graph
  rules that the edit entails, accuracy is up to 24 points lower than on the directly edited
  fact, so an edited model can assert a new fact and still answer as if its implications never
  changed.'
