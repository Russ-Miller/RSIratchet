arxiv_id: '2605.10843'
title: Training-Free Cultural Alignment of Large Language Models via Persona Disagreement
url: https://arxiv.org/abs/2605.10843
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: cultural-competence
statement: At inference time and with no weights, data or internals, instantiating a country
  as a panel of four World-Values-Survey-grounded personas and using their disagreement, not
  their consensus, as the steering signal reduced cultural misalignment on Moral-Machine-style
  dilemmas (MultiTP) by 10-24% across 20 countries and seven open backbones from 2B to 70B.
kind: observation
backing_strength: single-paper
scope_condition: MultiTP moral dilemmas, 20 countries on four continents, seven open-weight
  models in five families, 2026; black-box regime.
technique: ''
proposed_technique: Persona-disagreement steering for cultural alignment
technique_summary: Prompt several demographically distinct personas grounded in a country's
  survey data, treat their agreement as already calibrated and their disagreement as the correction
  signal, and combine their answers to shift the base model's output toward the country's measured
  preferences.
technique_kind: prompting
technique_validated_by: Misalignment reduction on MultiTP across 20 countries and seven backbones
  against the unsteered base and against consensus-persona baselines; no fine-tuning comparison
  on the same models.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Dilemma sets where persona disagreement is uninformative (personas agree but the
  population does not), or countries whose survey data is too thin to ground personas.
evidence_note: Wide model and country coverage; the target is one moral-dilemma dataset, and
  the improvement is relative to a base that starts Western-aligned, so absolute fidelity is
  not reported.
confidence: medium
