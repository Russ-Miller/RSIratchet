status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: For LLM-guided narrow-space parking where an optimal-control solver
  supplies pass/fail evidence, growing a decision knowledge base offline from
  accumulated solver and validation failures — retaining an entry only when
  re-planning then yields a feasible trajectory — raises planning success from
  85.1% to 94.7% and closed-loop success from 74.6% to 84.2% over an empty
  knowledge base, with model weights frozen.
kind: observation
backing_strength: single-paper
scope_condition: 38 simulated confined parking scenarios, car-like kinematic
  model, all LLM components gpt-5.6-sol, bounded online replanning budget of
  three attempts; one qualitative differential-drive robot demo.
technique: ""
proposed_technique: Evolve a decision knowledge base from solver failures, gated on feasibility
technique_summary: Accumulated solver and trajectory-validation failures are
  summarized into candidate add/modify/delete/merge edits to an initially
  empty knowledge base of scene-conditioned allowed and forbidden maneuvers,
  and an edit is kept only if re-running the planner with it produces a
  validated feasible trajectory.
technique_kind: process
technique_validated_by: "Ablation on 38 scenarios against the same pipeline
  with an empty knowledge base: planning success 94.7% vs 85.1%, closed-loop
  success 84.2% vs 74.6%; also compared against HA*, Direct OCP and HA*+OCP
  baselines."
stance_on_existing: neither
