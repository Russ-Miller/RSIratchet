arxiv_id: "2609.24631"
title: "From Semantic Decisions to Feasible Trajectories: Self-Evolving
  LLM-Guided Optimal Control for Narrow-Space Parking"
url: https://doi.org/10.48550/arxiv.2609.24631
drafted_at: 2026-09-26
