stance_reason: ""
falsifier: An ablation on the same scenarios showing the evolved knowledge
  base gives no planning or closed-loop gain over an empty base once attempt
  budget and compute are matched, or that the gain is attributable to
  replanning attempts rather than the retained entries.
evidence_note: "Measured: single ablation table on 38 simulated scenarios with
  one LLM, one vehicle model, one controller. Isolates the knowledge base
  against an empty base with other settings fixed, but no repeated trials, no
  variance reported, and no test of whether hand-written entries would do as
  well. Real-robot evidence is a single qualitative run."
