arxiv_id: "2605.12384"
title: Scalable Token-Level Hallucination Detection in Large Language Models
url: https://doi.org/10.48550/arxiv.2605.12384
drafted_at: 2026-11-01
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: error-detection
statement: For locating reasoning errors in free-form math and STEM solutions,
  training a small (0.6B-8B) detector to emit a per-token hallucination score
  — supervised by weighted-ensembled annotations from several critic models
  and an importance-weighted loss that upweights the sparse hallucinated
  tokens — finds flawed spans better than much larger prompted reasoning
  critics (e.g. QwQ-32B) and than step-level process reward models, without
  any step segmentation.
kind: observation
backing_strength: single-paper
scope_condition: Detectors trained on math responses from GPT-4o-mini;
  evaluated on math and STEM benchmarks with GPT-5/o3 token-level ground
  truth; generalization to code requires added code training data.
technique: ""
proposed_technique: Score hallucination per token, not per reasoning step
technique_summary: Trains a small LM to output a hallucination probability for
  every token of a free-form response, supervised by adaptively weighted
  ensembles of critic-model span annotations and an importance-weighted
  cross-entropy loss.
technique_kind: training
technique_validated_by: Token-level F1 on hallucinated samples (S_incor) and
  recall on clean samples (S_cor) across Math-500, AIME-2024/2025,
  OlympiadBench-Math plus GPQA, OlympiadBench-Phy, FinQA; compared against
  backbone models, four critic models, labeler models, and
  Qwen2.5-Math-PRM-72B; ablations isolate adaptive ensembling and importance
  weighting.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the trained token-level detector's F1 on
  held-out reasoning errors falls below a prompted large reasoning critic or a
  step-level PRM, or where removing adaptive ensembling and importance
  weighting leaves performance unchanged.
evidence_note: Measured on four math and three STEM benchmarks with
  two-labeler ensemble ground truth; TokenHD-0.6B beats QwQ-32B on S_incor
  everywhere and scores scale 0.6B to 8B. Ground truth is itself
  model-generated (human rating 4.63/5), and baselines are evaluated at one
  fixed threshold, so the comparison is not fully independent of the
  annotation pipeline.
confidence: medium
