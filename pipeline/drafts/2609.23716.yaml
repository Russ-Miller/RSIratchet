arxiv_id: "2609.23716"
title: "STEVE: Stabilizing Textual Gradient-Based Prompt Optimization via
  Error-Driven Refinement and Regularized Verification"
url: https://doi.org/10.48550/arxiv.2609.23716
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: In LLM-driven iterative prompt optimization, restricting gradient
  generation to examples the current prompt gets wrong and accepting a
  candidate edit only when its gain on hard cases exceeds a penalized
  regression on a preservation set of initially-correct examples yields higher
  final accuracy than unfiltered textual-gradient optimization, which degrades
  on some reasoning tasks below the zero-shot prompt.
kind: mechanism
backing_strength: single-paper
scope_condition: Reasoning and code benchmarks with exact-match scoring, a
  weaker executor model driven by a stronger evaluator/optimizer, 12
  optimization steps; cost is higher because several candidates are scored per
  step.
technique: ""
proposed_technique: Generate prompt edits only from failures, gate on a preservation set
technique_summary: Sample textual gradients only from examples the current
  prompt answers wrongly, generate several candidate prompts, and keep one
  only if its improvement on the hard batch beats a scheduled penalty times
  its regression on a held-back sample of examples the original prompt got
  right.
technique_kind: process
technique_validated_by: Accuracy on 10 reasoning benchmarks across three
  evaluator/optimizer models against Zero-shot CoT, Three-shot CoT, TextGrad
  and REVOLVE (average ~3.5 points over REVOLVE), plus a modernized run with
  gpt-5.4-mini/gpt-5.4 on BBEH, GSM8K-Platinum and DS-1000; ablations remove
  the gate (lower) and swap in full-dataset or correct-only gradients (lower,
  correct-only falls below the initial prompt).
stance_on_existing: supports
related_claim_id: a-fixed-model-can-improve-its-own-harness-with-a-regression-gated-loop
stance_reason: It provides independent evidence that gating self-generated
  harness edits on a non-regression check is what makes the improvement loop
  stable.
falsifier: An evaluation where unfiltered textual-gradient optimization with
  the same candidate budget and validation-based checkpoint selection matches
  or beats the error-only plus preservation-gate variant across tasks.
evidence_note: Measured on 10 benchmarks x 3 optimizer models plus 4
  modernized tasks, mean of three runs, with component ablations on three
  datasets. Baselines are matched on step count but not obviously on total
  executor calls, so part of the gain may be extra compute; gains on
  near-saturated benchmarks are tiny (+0.1 on GSM8K-Platinum).
confidence: medium
