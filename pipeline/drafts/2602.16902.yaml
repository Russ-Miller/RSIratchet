statement: "When frontier LLMs navigate the Wikipedia hyperlink graph step by
  step with only local link lists and a visit history, they adopt sensible
  high-level strategies (moving to broad hub pages) yet fail at revising a
  failing strategy: they revisit pages and loop in most hard instances, and
  loop frequency predicts failure almost one-for-one across model families."
kind: observation
backing_strength: single-paper
scope_condition: Interactive multi-step navigation over a 549k-page Wikipedia
  link graph, no global graph access, 30-step budget, 50 candidate links per
  step; hard split defined by shortest path 7-8.
