falsifier: A model with high loop frequency that still solves most hard
  instances, or trajectory analysis showing failures come from poor initial
  strategy rather than from unresolved repeated states.
evidence_note: Measured on 20+ models over easy/medium/hard splits; best model
  29% on hard. Loop analysis from 18 hand-sampled trajectories per model for
  Gemini 3 and Claude Opus 4.5 (loops in 86% and 92% of hard tasks, 10% and 1%
  solved among looping trajectories) plus a cross-model regression of success
  on loop frequency (coefficient -1.02, 95% CI -1.13 to -0.91). The regression
  is correlational across models and cannot separate looping as cause from
  looping as symptom of weak world knowledge.
confidence: medium
