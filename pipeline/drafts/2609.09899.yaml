arxiv_id: "2609.09899"
title: "Strangers to Themselves: What Language Models Say About Themselves Is
  Generic"
url: https://doi.org/10.48550/arxiv.2609.09899
drafted_at: 2026-09-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: When a model is asked to predict its own rates on behavioral
  evaluations (sycophancy, reward hacking, agentic policy violation, bias),
  its answers track its own behavior no better than the same question asked
  about 'capable AI agents in general' or than other models' answers about
  themselves, so self-report reflects a generic theory of AI assistants rather
  than privileged self-knowledge, and first-person framing mainly adds a
  self-flattering shift that understates harmful behavior.
kind: mechanism
backing_strength: single-paper
scope_condition: Nine public behavioral evaluations, 12 models from six labs
  including three frontier bases with and without reasoning; predictions
  scored as Pearson correlation across conditions on frozen test splits;
  agentic evaluations limited by floor effects and by only seeing the opening
  state.
technique: ""
proposed_technique: Ask about a generic AI agent, not the model itself
technique_summary: Replace first-person self-prediction questions with the
  same item-informed question about a capable AI agent in general, or use
  other measured models as the predictor, to remove the self-flattering bias
  without losing accuracy.
technique_kind: prompting
technique_validated_by: Generic-subject item-informed questions scored r=+0.28
  vs +0.24 for self-prediction (paired difference -0.03 [-0.10,+0.03]), with
  signed bias on harm-valenced evaluations shifted -0.15 for self-framed
  abstract reports; cross-model behavior mean, which never queries the model,
  reached +0.53.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An experiment holding information fixed and varying only the
  subject in which a model's self-directed predictions correlate with its own
  measured rates substantially better than generic-subject questions or other
  models' self-reports, and in which that self-advantage persists on a
  held-out split.
evidence_note: "Measured across nine evaluations, 15 prediction methods, 12
  models, with noise ceilings, frozen dev/test splits and pre-registered
  claims; controls include generic-subject, cross-model mean, identity
  transfer, and post-finetune re-elicitation. Key numbers: self-report
  r=+0.04, item-informed self +0.24, generic +0.28, others' self-reports
  +0.35, self-advantage +0.02. Scale null has a wide CI, so equivalence is not
  established; three pre-registered outcomes did not replicate on test."
confidence: medium
