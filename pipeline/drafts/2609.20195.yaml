arxiv_id: "2609.20195"
title: "Music Hallucination in Audio-Language Models: A Hierarchical
  Formulation and Empirical Study"
url: https://doi.org/10.48550/arxiv.2609.20195
drafted_at: 2026-10-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "For audio-language models describing music, hallucination gains
  measured by binary yes/no probing do not transfer to open-ended description:
  contrastive audio-dependency decoding raised free-form hallucination rates
  for all four open-source models tested even while improving probing
  accuracy, and structured-query accuracy moved in opposite directions across
  models."
kind: observation
backing_strength: single-paper
scope_condition: Nine audio-language models (four open-source 7B-class, five
  API) on 440 MusicCaps clips plus IRMAS; mitigations only evaluated on the
  open-source four, which expose logits.
technique: ""
proposed_technique: Evaluate hallucination mitigation across probing,
  free-form and structured paradigms
technique_summary: Score a mitigation on discriminative probing, open-ended
  description and per-attribute structured querying separately, with claims
  routed to layer-appropriate evidence and insufficiently-evidenced claims
  marked undetermined rather than counted.
technique_kind: process
technique_validated_by: "Paired exact-prompt comparisons of ADD-M v1/v2 and
  TPA on four open-source models: probing accuracy gains of +1.0 to +4.7 pp
  coexisted with higher free-form hallucination rates for all four, and
  structured accuracy improving for only one; cross-paradigm rank correlations
  were weak (Disc.-Free rho 0.17, Free-Struct. rho 0.18)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A mitigation whose probing gains reliably predict free-form and
  structured hallucination reduction across models, or a replication where
  paradigm rankings correlate strongly.
evidence_note: Measured across nine models with bootstrap CIs; mitigation
  deltas are paired but only on four open-source models and reported partly in
  appendix. Hard- and soft-layer hallucination rates rest on tool evidence
  audited at 72-92% expert agreement and an LLM judge at 79.6%, so absolute
  rates are noisy; the cross-paradigm divergence is the better-supported part.
confidence: medium
