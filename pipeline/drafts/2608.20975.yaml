arxiv_id: "2608.20975"
title: "Belief Without Behavior: Measuring the Translation of Theory of Mind
  into Coordinated Social Action in Vision-Language Models"
url: https://doi.org/10.48550/arxiv.2608.20975
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: In two-agent embodied social tasks requiring coordinated gaze,
  movement and expression, fine-tuning open VLMs (8B-14B InternVL) by
  timestep-level action imitation on demonstrations from an architecture with
  an explicit belief module shifts trial outcome scores up or down depending
  on condition but does not make the student's nonverbal signals more
  directionally coherent, because cross-channel communicative coordination is
  a trial-level property that per-timestep supervision does not encode.
kind: mechanism
backing_strength: single-paper
scope_condition: Open-source VLMs up to 15B in a single two-box
  guide-or-mislead scenario, 200 trials per model; no human baseline, no RL
  comparison.
technique: ""
proposed_technique: Imitate belief-module demonstrations at the action level
technique_summary: Fine-tunes a VLM on per-timestep motor and expression
  actions recorded from a hybrid architecture with an explicit theory-of-mind
  module.
technique_kind: training
technique_validated_by: Compared fine-tuned InternVL-8B/14B against their base
  models on ToM Outcome Conformance Score and on trajectory, gaze,
  expressivity and signal-sensitivity metrics across four conditions;
  cooperative outcomes declined, 14B trajectory alignment turned negative,
  signal sensitivity stayed negative throughout.
stance_on_existing: supports
related_claim_id: two-agent-embodied-social-tasks-where-one-agent-must-guide
stance_reason: The fine-tuning result shows the two documented bottlenecks
  (incoherent signal production, failed decoding) persist after action-level
  imitation.
falsifier: A VLM fine-tuned purely on per-timestep action demonstrations that
  reaches high trajectory and gaze alignment and condition-appropriate signal
  sensitivity would refute it.
evidence_note: Measured on two fine-tuned InternVL variants against their own
  base models in one scenario; the attribution to timestep-level supervision
  is argued rather than isolated against a trial-level-reward arm, which the
  paper leaves unrun.
confidence: low
