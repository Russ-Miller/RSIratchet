arxiv_id: "2609.21461"
title: "AtomEgo: Exploring Ego-Robot Integration for Embodied Foundation Model
  Pretraining"
url: https://doi.org/10.48550/arxiv.2609.21461
drafted_at: 2026-09-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: "For manipulation policies pretrained on mixed egocentric-human and
  robot data, adding egocentric data helps only when the embodiment gap is
  bridged explicitly: a three-stage curriculum (ego priors, then task-matched
  human/robot alignment in a shared end-effector frame, then robot-only)
  raised real-robot success, while separate ego/robot action heads gave only a
  marginal in-distribution gain and shared future-video prediction in a
  world-action model made success worse than a robot-only baseline."
kind: mechanism
backing_strength: single-paper
scope_condition: Pretraining on ~2,659 hours of ego+robot data; pi0.5-style
  VLA and Fast-WAM architectures; identical post-training and evaluation on
  seven dual-arm tasks, 10 trials per task per condition.
technique: ""
proposed_technique: Stage ego-to-robot transfer through an aligned-demo curriculum
technique_summary: Pretrain on egocentric data, then fine-tune on a small set
  of task-matched human and robot demonstrations converted to a shared
  relative end-effector representation, then pretrain on robot data before
  task post-training.
technique_kind: training
technique_validated_by: "Real-robot multi-task evaluation: combined success
  53.57% vs 32.86% for the robot-only VLA baseline (ID 64.29% vs 42.86%, OOD
  42.86% vs 22.86%), 140 trials per checkpoint, matched steps and
  hyperparameters."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled pretraining run at matched data and compute where
  plain ego-robot mixing (or shared future-video co-training) matches or beats
  the alignment curriculum on real-robot success.
evidence_note: Measured on one dual-arm platform, seven tasks, 10 ID + 10 OOD
  trials each, so per-task counts are noisy and several tasks score 0/10 for
  all methods; one seed, one corpus, and the ordering of
  representation-similarity metrics did not match the success ordering.
