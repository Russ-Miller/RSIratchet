arxiv_id: "2604.10923"
title: "Mem$^2$Evolve: Towards Self-Evolving Agents via Co-Evolutionary
  Capability Expansion and Experience Distillation"
url: https://arxiv.org/abs/2604.10923
drafted_at: 2026-11-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: When an agent creates new tools on demand to extend its own
  capability set, conditioning the tool-generation prompt on distilled lessons
  from past tool creation and debugging produces more tools that pass
  validation on the first attempt and fewer self-correction rounds than
  generating tools from the sub-task description and web search alone.
kind: mechanism
backing_strength: single-paper
scope_condition: Measured with a GPT-5-chat backbone on benchmarks requiring
  heavy tool synthesis (GAIA, AIME24/25), where validation is LLM-synthesized
  test cases rather than ground-truth labels.
technique: ""
proposed_technique: Condition new-tool creation on past tool-creation experience
technique_summary: Before generating a missing tool, retrieve distilled
  implementation guidelines and failure-fix pairs from a persistent
  tool-experience memory and include them in the generation prompt alongside
  the sub-task and web search results.
technique_kind: process
technique_validated_by: First-pass validity (tool passes all synthesized tests
  on the first attempt) rose from 53.1% to 72.4% on average across GAIA and
  AIME24/25, and average self-correction iterations fell from 1.01 to 0.48,
  against the same pipeline with experience guidance removed.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same creation loop with and without retrieved
  tool-creation experience and finding no difference in first-pass validation
  rate or number of correction iterations, or finding the gain disappears once
  the experience-free arm is given an equal number of generation attempts.
evidence_note: Measured ablation on three benchmarks with one backbone;
  validity is judged by LLM-synthesized tests derived from an LLM critic, not
  by independent ground truth, so 'valid' and 'the critic's standard' are not
  separated. No report of variance across runs, and token/compute cost of
  retrieval is not matched against extra attempts in the baseline.
confidence: low
