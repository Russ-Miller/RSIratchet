arxiv_id: "2609.24677"
title: "TimeLitmus: A Diagnostic Benchmark for Cross-Modal Understanding and
  Explanation Faithfulness in Event-Conditioned Time-Series Prediction"
url: https://doi.org/10.48550/arxiv.2609.24677
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: explanation-faithfulness
statement: In event-conditioned time-series prediction (finance and traffic),
  models cite the factor that a controlled intervention actually manipulated
  in nearly all cases while their predictions change with that factor far less
  often — on traffic series-side pairs citation exceeds 90% for most of ten
  models but pair-level behavioral support stays under 22% — so citation of
  the right factor is not evidence the prediction depended on it.
kind: observation
backing_strength: single-paper
scope_condition: Ten current LLMs on 4,856 records across a finance (market
  response) and traffic (incident response) benchmark, with independently
  evaluated counterfactual pairs whose gold answers must differ.
technique: ""
proposed_technique: Score cited factors by whether the paired intervention moves the prediction
technique_summary: For each controlled pair that changes one cited factor,
  check both whether the explanation mentions that factor and whether both
  endpoint predictions follow the expected transition, reporting the
  conditional rate (CSDR).
technique_kind: process
technique_validated_by: Applied to ten models; shows citation rates near 100%
  alongside CSDR under 22% on traffic series-side pairs, and separates
  endpoint correctness from pair consistency; no independent human check of
  the faithfulness metric itself.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same controlled pairs, showing that explanations citing the
  manipulated factor are accompanied by matching prediction transitions at
  rates close to the citation rate, or that the low support rate is an
  artifact of endpoint difficulty rather than pair inconsistency.
evidence_note: Measured on benchmark-constructed pairs with rule-grounded
  labels; human annotators beat the best model on matched items, supporting
  solvability. Single paper, models' identities partly
  synthetic-sounding/unverifiable, and the gap metric is conditional on
  citation so it is sensitive to how cited factors are annotated.
confidence: medium
