evidence_note: "Measured: one ablation table plus training-dynamics plots on a
  single 1.5B model and one training set, with a single run per aggregator and
  no seed variance reported. The main-table comparison against
  DRPO/ShorterBetter/GDPO confounds the aggregator choice with LEAD's dynamic
  reward weighting; only the aggregator ablation isolates it, and only at
  1.5B. The mechanism (tight target fighting correctness) is supported by the
  efficiency-reward plateau of the min variant."
