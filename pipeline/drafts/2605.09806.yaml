capability: cutting-to-the-chase
statement: When RL-training distilled 1.5B-7B reasoning models for shorter
  chains of thought, setting the per-problem length target to the mean length
  of the model's own correct rollouts preserves accuracy better than using the
  minimum correct length, the median, or the mean over all rollouts, because a
  single anomalously short correct rollout sets an unreachably tight target
  that then fights correctness.
kind: mechanism
backing_strength: single-paper
scope_condition: DeepSeek-R1-Distill-Qwen 1.5B trained on MATH level 3-5 with
  a 4K max response length, evaluated on five math reasoning benchmarks;
  aggregator ablation run only at 1.5B.
technique: ""
proposed_technique: Set the length target from the mean of the model's own correct rollouts
technique_summary: During RL, compute a per-prompt target length as the mean
  token length of that prompt's correct rollouts and give a symmetric reward
  that penalizes both longer and shorter responses, instead of using a global
  token budget.
technique_kind: training
technique_validated_by: "Aggregator ablation on DeepSeek-R1-Distill-Qwen-1.5B:
  mean-of-correct reached 53.36 average accuracy and 0.68 Accuracy-Efficiency
  Score, versus min-of-correct 49.99/0.36, median-of-correct 50.13/0.34, and
  mean-of-all-rollouts 51.47/0.58; training curves show min's own correct
  rollouts plateau below the efficiency reward the others reach."
