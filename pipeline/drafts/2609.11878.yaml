arxiv_id: "2609.11878"
title: Domain-Specific Hallucination Detection in Large Language Models
url: https://doi.org/10.48550/arxiv.2609.11878
drafted_at: 2026-09-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: "For encoder-based hallucination/claim-faithfulness detectors moved
  from general-domain data to biomedical claim verification, which corpus the
  encoder was pre-trained on matters more than which data it is fine-tuned on:
  a PubMed-pretrained encoder fine-tuned on a few hundred SciFact pairs beat
  both a general encoder fine-tuned on the same pairs and a general encoder
  pre-fine-tuned on a large general hallucination set."
kind: observation
backing_strength: single-paper
scope_condition: DeBERTa-v3-base vs PubMedBERT, binary faithful/hallucinated
  classification, 484 SciFact training and 106 test examples; all
  configurations below 0.7 F1
technique: ""
proposed_technique: Match the encoder's pre-training corpus to the target domain
technique_summary: Instead of transferring a general-domain-trained
  hallucination detector, fine-tune a domain-pretrained encoder on a small set
  of in-domain claim-evidence pairs.
technique_kind: training
technique_validated_by: "On 106 SciFact test examples: PubMedBERT fine-tuned
  on SciFact reached F1 0.627 / AUROC 0.808, versus HaluEval-trained DeBERTa
  zero-shot (0.517 / 0.515), DeBERTa fine-tuned on SciFact (0.488 / 0.582),
  and HaluEval-then-SciFact sequential transfer (0.533 / 0.610)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A general-domain encoder fine-tuned on the same small in-domain set
  matching or beating a domain-pretrained encoder on biomedical faithfulness
  detection, on a larger test set than 106 examples.
evidence_note: Measured, but on a very small split (484 train / 106 test) with
  one seed and no confidence intervals; four configurations compared, and
  encoder identity is confounded with architecture and size, not just
  pre-training corpus.
confidence: low
