arxiv_id: "2601.00269"
title: "FaithSCAN: Model-Driven Single-Pass Hallucination Detection for
  Faithful Visual Question Answering"
url: https://doi.org/10.48550/arxiv.2601.00269
drafted_at: 2026-11-15
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: "In 3-8B vision-language models, a small supervised classifier over
  internal signals from one forward pass (token log-likelihood, predictive
  entropy, mid-depth decoder hidden states, visual patch and cross-modal
  aligned embeddings) detects visually ungrounded answers better than
  sampling-based uncertainty methods (semantic entropy, SelfCheckGPT, P(True))
  at a fraction of their inference cost, but this holds only in-distribution:
  trained on one VQA hallucination dataset and tested on another with a
  different hallucination type, AUROC often falls near or below chance."
kind: observation
backing_strength: single-paper
scope_condition: InstructBLIP-T5-XL, LLaVA-NeXT-8B, Qwen3-VL-8B on HalLoc-VQA,
  POPE, HaloQuest, VQA v2; labels generated by a Visual-NLI judge rather than
  human annotation; ~2,000 train / 1,000 eval samples per split
technique: ""
proposed_technique: Fuse single-pass VLM internal signals into a hallucination classifier
technique_summary: Extracts token-level log-likelihood, entropy, decoder
  hidden states, visual patch features and cross-modal aligned features from
  one frozen VLM forward pass, encodes each branch separately and fuses them
  with attention to predict a hallucination score.
technique_kind: architecture
technique_validated_by: AUROC, AURAC, F1@Best and RejAcc@50 against
  token-level, latent, semantic-entropy, SelfCheckGPT, P(True) and
  logistic-regression baselines on three backbones and three datasets, plus
  latency per 100 samples; OOD tested by cross-dataset transfer
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the single-pass internal-signal classifier does
  not beat sampling-based uncertainty baselines in-distribution, or where
  cross-dataset transfer AUROC stays well above chance across hallucination
  types.
evidence_note: Measured on 3 backbones x 4 datasets with 3 seeds; ID gains up
  to ~8 AUROC points but inconsistent per-metric (e.g. Qwen3-VL on HalLoc and
  VQA v2 trails P(True)). OOD table shows several sub-0.5 AUROC cells. Labels
  come from an LLM judge validated against only 100 human-checked samples per
  dataset, so detection targets judge agreement, not ground truth.
confidence: medium
