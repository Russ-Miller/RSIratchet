arxiv_id: "2608.30938"
title: "Evidence, Logic, and Compliance: Multi-Agent Structured Graph
  Reasoning with Expert Arbitration for Medical Referral"
url: https://doi.org/10.48550/arxiv.2608.30938
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For multi-agent LLM pipelines on multimodal medical referral from
  real inpatient records, requiring agents to exchange typed logical edges
  (causal cascade, mutual reinforcement, exclusion, conditional context) in a
  shared reasoning graph instead of free-form dialogue raises referral F1, and
  the causal-chain edge type carries most of that gain.
kind: mechanism
backing_strength: single-paper
scope_condition: 952 real inpatient cases over 37 departments, four modality
  agents plus an expert arbitration agent, DeepSeek-V3 backbone, zero-shot,
  four-option multiple choice; gains saturate at three discussion rounds
technique: ""
proposed_technique: Exchange typed logical edges, not dialogue, between agents
technique_summary: Each modality agent builds a local evidence graph and
  agents update one another only by establishing typed edges (cascade,
  syndrome, exclusion, context) before an expert agent arbitrates the merged
  candidate graphs against a referral knowledge base.
technique_kind: process
technique_validated_by: "Referral F1 on 952 real inpatient cases: 95.3% vs
  91.4% for MMA and 92.6% for ToR multi-agent baselines and 89.7% for GPT-5;
  replacing the graph with natural-language output cost 5.1 F1, removing
  inter-agent collaboration 6.1, removing the knowledge base 2.3; removing the
  cascade relation alone dropped F1 to 90.6%, more than any other relation
  type"
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison in which free-form multi-agent dialogue with
  the same agents, knowledge base and round budget reaches the same referral
  F1, or in which removing the cascade relation costs no more than removing
  any other relation type.
evidence_note: Measured on one self-constructed dataset from a single
  hospital, one backbone for all baselines, with module and relation-type
  ablations and a human-scored reasoning rubric; the four-option
  multiple-choice format and single-site data limit generality, and the graph
  structure is confounded with the added expert arbitration stage except where
  ablated.
confidence: low
