arxiv_id: "2609.09681"
title: "Beyond Accuracy: ARIA-Rubrics for Evaluating Audio Reasoning in Large
  Audio Language Models"
url: https://doi.org/10.48550/arxiv.2609.09681
drafted_at: 2026-09-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: "For large audio language models on multiple-choice audio reasoning
  benchmarks (MMAR, MMAU-mini), accuracy does not track whether the model's
  chain of thought is acoustically grounded or causally drives the answer:
  several models answer correctly from perception steps that assert
  unsupported labels, and for some models replacing the reasoning chain with
  vacuous or fabricated content leaves the final answer unchanged."
kind: observation
backing_strength: single-paper
scope_condition: Nine LALMs (open and closed source) on two 1,000-item
  multiple-choice audio reasoning benchmarks, with reasoning externalized via
  a fixed four-step CoT prompt.
technique: ""
proposed_technique: Score audio CoTs on grounding, coherence and causality
technique_summary: Prompts the model with a four-step
  Perception/Analysis/Reasoning/Answer template, then scores the chain with
  six automatic metrics (CLAP audio-entity grounding, inter-step embedding
  coherence, small-LM substantiveness, perplexity-based step information gain,
  NLI entailment progression, audio lexical density) and averages them.
technique_kind: process
technique_validated_by: The six-metric mean correlated with 3-rater human CoT
  quality ratings at Spearman 0.671 (p=0.006) over 450 sampled instances,
  above every single metric (best M1, 0.563) and every two-metric subgroup;
  rankings also matched two LLM judges and CoT-perturbation-derived mode
  assignments, and were stable across datasets (model identity explained
  91.9-96.4% of variance) and across scorer backbones.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Show that on these benchmarks accuracy rankings match
  process-quality rankings, and that perturbing the CoT changes the final
  answer for all tested models, i.e. no model answers correctly with a
  non-causal or ungrounded chain.
evidence_note: "Measured: per-metric scores and accuracy for 9 models on 2
  benchmarks, plus a manual CoT-perturbation check on randomly selected
  instances and 450 human-rated CoTs. Divergence is argued from ranking
  differences and two illustrative cases rather than a quantified
  accuracy-vs-ARIA correlation; the human validation uses a small sample and
  the perturbation check is described only qualitatively."
confidence: medium
