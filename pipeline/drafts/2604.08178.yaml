statement: When judges (scalar reward models, generative reward models, or
  LLM-as-judge) must pick the preferred of two agent trajectories in
  tool-integrated multi-turn settings, accuracy stays near 70% at best and
  falls sharply as trajectory length grows, with pairwise LLM judges dropping
  below chance beyond ~32k tokens while pointwise scalar reward models decay
  more gradually.
kind: observation
backing_strength: single-paper
scope_condition: Text-only tool-augmented agent trajectories with hard
  negatives controlled for length and format; four task families (safety
  refusal, tool irrelevance, complex planning, error recovery); A/B swap
  protocol for pairwise judges.
