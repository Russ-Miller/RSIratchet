falsifier: A judge family that holds above ~85% pairwise accuracy on these
  trajectory pairs, including on the >32k-token bucket, would falsify the
  ceiling and the length-collapse pattern.
evidence_note: "Measured: pairwise accuracy of 21 evaluators across 7 splits,
  gold labels from a 3-judge panel with meta-review plus a stratified human
  audit (Cohen's kappa 0.71-0.86). Best average 69.96%; safety accuracy spans
  40.69-84.80% among LLM judges while open scalar RMs sit near chance. Length
  effect read off binned macro-accuracy curves, not an ablation that isolates
  length from task difficulty, since longer trajectories are also the harder
  planning/recovery buckets."
