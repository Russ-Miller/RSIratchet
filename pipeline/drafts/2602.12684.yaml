arxiv_id: "2602.12684"
title: "Xiaomi-Robotics-0: An Open-Sourced Vision-Language-Action Model with
  Real-Time Execution"
url: https://doi.org/10.48550/arxiv.2602.12684
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For flow-matching VLA policies that condition each new action chunk
  on previously committed actions to hide inference latency, letting all noisy
  action tokens attend to that prefix teaches the policy to copy it instead of
  reading vision and language, producing unreactive behaviour such as
  repeating a failed motion; restricting the prefix's visibility to only the
  immediately following action tokens (a lambda-shaped attention mask) keeps
  chunk-to-chunk continuity while forcing later timesteps to attend to
  observations.
kind: mechanism
backing_strength: single-paper
scope_condition: Diffusion-transformer action heads conditioned on a VLM KV
  cache, post-trained for asynchronous execution on bimanual real-robot tasks;
  demonstrated on two tasks (Lego disassembly, towel folding).
technique: ""
proposed_technique: Hide the committed action prefix from later action tokens
technique_summary: During post-training for asynchronous execution, replace
  the action head's causal mask with a lambda-shaped mask so only the first
  few noisy action tokens can attend to the committed action prefix, and
  offset the prefix's RoPE indices so the model can tell clean from noisy
  tokens.
technique_kind: architecture
technique_validated_by: "Real-robot throughput against a training-RTC
  asynchronous variant and a synchronous variant on two bimanual tasks:
  highest throughput on Lego disassembly at comparable success rate, and 1.2
  pcs/min vs 1 pcs/min on towel folding, with the training-RTC variant
  observed looping on a failed flinging motion."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An asynchronous VLA trained with full causal attention over the
  committed prefix matching or beating the lambda-masked variant on throughput
  and reactivity on the same tasks, or ablations showing the gain comes from
  the RoPE offset or loss re-weighting rather than the mask.
evidence_note: Measured on two real bimanual tasks with a 4.7B model; the
  comparison against training RTC is a single ablation arm with few trials (3
  configurations x 3 trials per size; two 30-minute rollouts for folding) and
  no reported variance. The lambda mask is bundled with a RoPE offset and
  L1-based loss re-weighting, so the mask's own contribution is not isolated.
  The copying mechanism is argued plus supported by a qualitative failure
  observation, not directly measured.
confidence: medium
