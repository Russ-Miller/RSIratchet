arxiv_id: "2602.10453"
title: "The Landscape of Prompt Injection Threats in LLM Agents: From Taxonomy
  to Analysis"
url: https://doi.org/10.48550/arxiv.2602.10453
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: prompt-injection
statement: Prompt-injection defenses that score well on existing benchmarks
  largely do so by isolating or rejecting contextual inputs, so they lose that
  protection or lose utility on context-dependent agent tasks where the agent
  is authorized to act on runtime observations (config files, conditional
  logic over tool output).
kind: mechanism
backing_strength: single-paper
scope_condition: LLM agents whose next action depends functionally on a prior
  tool observation; evaluated over 8 representative text-, model- and
  execution-level defenses on the authors' AgentPI benchmark.
technique: ""
proposed_technique: Benchmark injection defenses on context-dependent agent tasks
technique_summary: A benchmark of five context-dependent task types (tool-name
  selection, parameter filling, conditional branching, functional calculation,
  explicit delegation) paired with context-aware attacks whose payloads are
  coupled to the runtime observation rather than fixed templates.
technique_kind: process
technique_validated_by: Eight defenses scored on attack success rate, agent
  utility, and time/token cost; execution-level defenses reached up to ~3x
  baseline cost or refused early, text-level defenses were cheap but weak, and
  no defense achieved trustworthiness, utility and low latency together.
stance_on_existing: supports
related_claim_id: long-trusted-instructions-untrusted-retrieved-content-occupy-same-model
stance_reason: The paper finds context-isolating defenses give guarantees only
  by suppressing contextual input, costing utility in tasks that need
  cross-source reasoning.
falsifier: A defense that keeps near-baseline attack success rates and
  near-baseline utility and latency on context-dependent tasks where the agent
  must act on runtime observations.
evidence_note: Argued from a 78-paper taxonomy (34 of 41 defenses support only
  static tasks) plus measurement of 8 defenses on a benchmark the same authors
  built; no independent replication, and the benchmark's task set is the
  authors' own construction, so the generality of the five task types is not
  established.
confidence: medium
