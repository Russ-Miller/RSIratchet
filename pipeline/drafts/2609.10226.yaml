evidence_note: Measured across 8 frontier models on 85 tasks (55 KFC, 20 LHI,
  10 E2EO) with correctness-gated rewards and anti-cheating proctoring. LHI <
  KFC holds for all 8 models in the reported table. E2EO scores are higher
  than LHI, so the difficulty ordering is not monotone in openness; scores are
  not comparable across formats because metrics differ (binary implementation
  vs log-normalized speedup). Single benchmark, no human baseline.
