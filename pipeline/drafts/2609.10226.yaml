scope_condition: 85 tasks built from systems papers and public LLM-infra
  repositories, three formats (single-file kernel completion, multi-file
  feature implementation, end-to-end optimization), one H20 GPU, agent
  scaffolds Claude Code or Codex, max reasoning effort, 1 submission for KFC
  and up to 16 for the others.
