statement: On repository-grounded LLM-infrastructure engineering tasks,
  frontier agents score far below ceiling (best 36.53% overall), and every one
  of eight models scores lower on long-horizon multi-file implementation than
  on single-file kernel completion, even though the full repository and test
  cases are visible.
