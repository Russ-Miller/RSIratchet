arxiv_id: "2601.22311"
title: "Why Reasoning Fails to Plan: A Planning-Centric Analysis of
  Long-Horizon Decision Making in LLM Agents"
url: https://doi.org/10.48550/arxiv.2601.22311
drafted_at: 2026-11-12
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: In deterministic environments with explicit states and
  planning-time evaluation signals, LLM agents that select each action by
  local step-wise score commit to myopic actions at the first decision and
  rarely recover, and widening the search (beam search) delays but does not
  prevent this, whereas simulating candidate futures and propagating
  trajectory-level returns backward before committing to only the next action
  raises long-horizon task accuracy.
kind: mechanism
backing_strength: single-paper
scope_condition: Shown in deterministic, fully-observable settings with an
  evaluation signal available at planning time (knowledge-graph QA with oracle
  subgraphs); partially tested on ALFWorld tool use; not tested under
  stochastic or partially observed dynamics or when no planning-time evaluator
  exists.
technique: ""
proposed_technique: Score actions by simulated futures, commit one step at a time
technique_summary: At each state, the agent expands a bounded set of candidate
  actions, simulates short trajectories (depth ~3), has an LLM score whole
  trajectories by comparison rather than step rewards, propagates those
  returns backward into action values, then executes only the next action and
  replans.
technique_kind: process
technique_validated_by: Hits@1 on CWQ, WebQSP and GrailQA under two agent
  frameworks (ToG, PoG) and four backbones (LLaMA 8B/70B, GPT-4o-mini/4o),
  against single-step, beam-search and shallow-lookahead variants holding
  backbone, framework and evaluation signal fixed; plus mechanism metrics
  (first-step trap rate 55.6% single-step vs 17.8%, mean first-error step 1.6
  vs 3.2, recovery after first error 5.4% vs 29.7%) and ALFWorld success
  (ReAct 61.3% vs 77.8%).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A setting with explicit states and a planning-time evaluator where
  trajectory-level lookahead with backward value propagation does not beat
  step-wise selection on long-horizon accuracy, or where the measured
  advantage is explained by extra token budget rather than the lookahead
  (matched-budget comparison closes the gap).
evidence_note: "Measured, with planning strategy as the only varied factor
  across 3 KGQA datasets x 2 frameworks x 4 backbones, plus diagnostic metrics
  on first-error position, trap selection and recovery, and causal
  interventions forcing the first action. Token-budget curves are reported and
  the method still wins at matched budget on the two KGQA sets shown. Weak
  points: the main setting is oracle-subgraph KGQA, where a valid path is
  guaranteed; the trajectory scorer is an LLM comparing samples, so the
  evaluator quality is confounded with the planning mechanism; ALFWorld
  evidence is a single environment."
confidence: medium
