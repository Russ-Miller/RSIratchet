arxiv_id: "2601.20162"
title: "Me-Agent: A Personalized Mobile Agent with Two-Level User Habit
  Learning for Enhanced Interaction"
url: https://doi.org/10.48550/arxiv.2601.20162
drafted_at: 2026-11-12
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-term-memory
statement: For mobile GUI agents answering ambiguous instructions that omit
  the app name or name content only by reference, splitting stored user habits
  into a prompt-injected general preference pool and an externally retrieved
  per-app memory of workflows and content preferences raises app-selection
  accuracy and task completion over agents with no preference modeling, with
  the two levels contributing to different metrics.
kind: observation
backing_strength: single-paper
scope_condition: Training-free API-based mobile agents on a self-built 60-user
  benchmark (User FingerTip) with 15 training and 5 test instructions per
  user; baselines are Mobile-Agent-v2 and Mobile-Agent-E.
technique: ""
proposed_technique: Split user habits into a general preference pool and per-app memory
technique_summary: Accumulate natural-language user preferences from
  rollout-and-critique over past trajectories into a prompt-injected pool, and
  store app-specific workflows and content preferences in a separate
  hierarchical memory retrieved only for the resolved target app.
technique_kind: retrieval
technique_validated_by: App Selection Accuracy, BERTScore, Preference Score,
  task completion/success rate on User FingerTip against Mobile-Agent-v2/E;
  ablation incrementally adding each module, where the preference-learning
  module mainly raised task completion and the hierarchical memory mainly
  raised semantic quality and preference alignment; also evaluated on the E
  dataset (TCR 0.893 vs 0.639 baseline).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation under matched prompt budget showing that injecting all
  app-specific memory directly into the prompt (no hierarchical retrieval)
  matches the two-level system on ambiguous-instruction accuracy, or that the
  gain disappears on a benchmark not built by the same authors.
evidence_note: Measured on the authors' own benchmark, built by removing app
  names and content from existing instructions, with ground truth defined as
  the user's most frequent app in that category — so App Selection Accuracy of
  1.000 partly reflects the alignment of the construction rule with the
  frequency memory the agent stores. Only two baselines, neither designed for
  personalization. Backbone-swap experiment (GPT-4o, Claude-3.5, Gemini-2.5)
  suggests the effect is not backbone-specific. No matched-prompt-budget
  control isolating hierarchy from content.
confidence: low
