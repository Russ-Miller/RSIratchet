arxiv_id: "2604.11741"
title: Collaborative Multi-Agent Scripts Generation for Enhancing
  Imperfect-Information Reasoning in Murder Mystery Games
url: https://doi.org/10.48550/arxiv.2604.11741
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: strategic-deception
statement: For 3B-7B Qwen2.5-VL backbones playing murder mystery social
  deduction, two-stage training (LoRA SFT on multi-agent-synthesized scripts,
  then GRPO with LLM-judge and image-clue-match rewards) raises multi-hop
  multimodal reasoning and murderer identification well above the untrained
  backbone, while judged role-playing quality barely moves and can fall
  slightly at 7B (-0.29 on a 10-point scale).
kind: observation
backing_strength: single-paper
scope_condition: Murder Mystery Games evaluated on WhodunitBench with
  human-annotated test data; two open 3B/7B VLM backbones; training data
  synthesized by a Gemini-2.5-Pro-driven multi-agent pipeline plus
  human-annotated scripts.
technique: ""
proposed_technique: Synthesize deception game scripts with role agents, then RL on judge rewards
technique_summary: Specialized generation and critic agents produce
  murder-mystery scripts, multimodal clues and reasoning chains, which are
  used first for supervised fine-tuning and then for GRPO where an LLM
  ScoreAgent rewards role-consistent self-introductions and discussions and a
  clue-match term rewards grounding in the right images.
technique_kind: training
technique_validated_by: Seven metrics on WhodunitBench (multi-hop multimodal
  reasoning, case murder detail, role-playing, decision-making, three
  perception metrics) against the untrained backbone, 10 proprietary and open
  VLMs, and ablations removing SFT, removing RL, and removing the
  image-clue-match reward; LLM-judge scores checked against human judgments
  (Spearman 0.71 CMD, 0.62 RP).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same two-stage pipeline on these backbones and finding
  no gain over the base model on multi-hop multimodal reasoning or
  murderer-identification accuracy, or finding role-playing scores rise as
  much as the reasoning scores do.
evidence_note: Measured on one benchmark (WhodunitBench) with two backbones
  and ablations; gains are large on MMR (+24.1 at 3B, +20.8 at 7B) and
  decision-making (+14.9, +11.3 points) but role-playing moves +1.66 and
  -0.29. Role-playing and case-detail scores come from LLM judges whose human
  correlation is only moderate (RP Spearman 0.62), and the training data was
  synthesized by a much stronger proprietary model, so part of the gain is
  distillation rather than the agent decomposition.
confidence: low
