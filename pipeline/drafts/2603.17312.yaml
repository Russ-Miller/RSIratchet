arxiv_id: "2603.17312"
title: Recurrent Reasoning with Vision-Language Models for Estimating
  Long-Horizon Embodied Task Progress
url: https://doi.org/10.48550/arxiv.2603.17312
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For 7B vision-language models estimating progress on long-horizon
  egocentric task videos, feeding only the latest short video snippet together
  with a carried-forward chain-of-thought that records task decomposition and
  per-step completion gives lower progress error than feeding the full video
  so far, and the gap widens as the video gets longer while inference time
  stays flat rather than growing linearly.
kind: mechanism
backing_strength: single-paper
scope_condition: 7B Qwen2.5-VL backbone fine-tuned (SFT then PPO) on
  auto-generated ALFRED and Ego4D progress data; snippets of 2-4s with 4
  sampled frames; full-video baseline trained identically but with frames
  downsampled to fit context.
technique: ""
proposed_technique: Carry an updated chain-of-thought across video snippets
  instead of re-reading the whole video
technique_summary: The model reasons over only the newest video snippet plus
  the chain-of-thought it wrote on the previous iteration, updating the
  recorded task decomposition and step-completion status each turn, and
  predicts progress from the share of completed steps.
technique_kind: prompting
technique_validated_by: Progress MAE, increment MAE, bin accuracy and
  completion accuracy on held-out ALFRED (669 items) and Ego4D (529 items)
  benchmarks versus API models, open-source VLMs, LIV, ROVER and GVL-SFT; plus
  an ablation comparing an identically trained full-video-input variant on MAE
  and inference time binned by video duration.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An identically trained full-video-input variant matching or beating
  the snippet-plus-CoT variant on progress MAE at long durations, or the
  snippet variant's advantage disappearing once the full-video baseline is
  given a longer context budget.
evidence_note: Measured on two benchmarks with four metrics; the headline
  comparison is against a matched full-video variant in one ablation figure
  reported qualitatively (curves, no numbers in the text given). Gains over
  pretrained baselines are large on ALFRED (MAE 2.19 vs 27.87 for the same
  backbone) but much smaller on real-world Ego4D (19.25). Training data and
  CoT labels are auto-generated from the same datasets, so the design does not
  separate snippet-recurrence from domain-specific fine-tuning except in the
  single matched ablation.
confidence: medium
