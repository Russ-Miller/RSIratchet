capability: forecasting
statement: "For base LLMs predicting the next wave of a longitudinal panel
  survey from earlier waves, accuracy improves with pre-training compute but
  so slowly that the trend is near-useless in practice: the best of 35
  open-weight models reached 65% and the fitted loss-accuracy and compute-loss
  relations imply roughly 1000x more compute for a further 5 points, with an
  extrapolated ceiling near 77%."
kind: observation
backing_strength: single-paper
scope_condition: Base (not post-trained) models up to 70B,
  multiple-choice-style next-wave prediction on the Americans' Changing Lives
  panel; no retrieval, tools, or reasoning-model variants tested; downstream
  numbers come from extrapolating log-linear fits made over 10^18-10^20 FLOPs.
