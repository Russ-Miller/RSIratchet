falsifier: A newer base model trained within a few times the compute of the
  largest evaluated run scoring well above 77% on the same next-wave
  prediction task, or a re-fit showing the compute-to-accuracy requirement is
  far smaller than 1000x for 5 points.
evidence_note: "Measured: compute scaling law on ACL task loss over 85
  controlled Qwen3-architecture checkpoints (r^2=0.88), plus an observational
  loss-to-accuracy calibration over 35 open-weight models 0.5B-70B that is
  linear. The 1000x and 77% figures are extrapolations beyond the fitted
  compute range, not observed points, and the design does not isolate
  post-training, retrieval, or reasoning-model effects."
