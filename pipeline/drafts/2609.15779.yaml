arxiv_id: '2609.15779'
title: 'EvoOntology: A Self-Evolving Ontology Layer for Data Agents'
url: https://arxiv.org/abs/2609.15779
drafted_at: '2026-09-21'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: harness-self-improvement
statement: For agents working over heterogeneous data, exposing a schema/content/tool ontology
  as an MCP server the agent queries, and refining it by a loop of diagnose, attribute-to-level,
  typed patch, and a gate that accepts an edit only if a backbone-conditional paired evaluation
  shows a margin, raised trajectory accuracy on DDR-Bench by an average 17.8 points across six
  backbones and text-to-SQL EX on BIRD by about 7 points; injecting the same semantic content
  as a static prompt did not help consistently and cost 15 points on one backbone, and in ablation
  removing the acceptance gate was the largest loss (-11.2), then attribution (-6.3), diagnosis
  (-4.8), typed patches (-1.7).
kind: observation
backing_strength: single-paper
scope_condition: DDR-Bench, BIRD and one further data-agent benchmark, six backbones including
  GPT-5.5, Claude Sonnet 4.5/5, DeepSeek-V3/V4-Flash and Qwen3, 2026; ontology built by a builder
  agent, evolution gated per backbone.
technique: ''
proposed_technique: Gated, attributed, typed edits to an agent-queried ontology
technique_summary: Keep the semantic layer outside the prompt as queryable MCP tools; when the
  agent fails, diagnose from traces, attribute the failure to the schema, content or tool level,
  write a typed edit at that level, and keep it only if a paired evaluation on the same backbone
  improves by a set margin.
technique_kind: process
technique_validated_by: Trajectory and message accuracy on DDR-Bench across six backbones against
  a no-ontology ReAct baseline and a static-prompt semantic layer; EX/VES on BIRD; step-wise
  and level-wise ablations averaged over four backbones. Developer-reported.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: A static semantic layer that matches the MCP-queried one when both are refined by
  the same loop, which would locate the gain in the evolution rather than the query interface;
  or the gate failing to prevent regressions once the edit store grows large.
evidence_note: 'Two findings worth separating: the query-vs-inject result (a static prompt of
  the same content hurt) and the gate result (accepting every edit was the largest ablation
  loss). The second is the regression-gated-loop claim already in the catalog, replicated in
  a different harness; the first bears on context-hygiene and tool-use. Numbers are the authors''
  own.'
