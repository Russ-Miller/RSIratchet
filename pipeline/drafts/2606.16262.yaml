statement: When a critique's worth is measured by whether a fixed downstream repair agent can
  improve the interface from it, eight frontier models differ meaningfully in how actionable
  their UX critiques are, lead on different product-surface categories, and vary in reliability
  fixture by fixture; the best repair lift was about +0.22 on the benchmark's scale, so the
  task is unsaturated and not one-dimensional.
