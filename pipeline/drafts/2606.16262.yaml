  browser exploration, 2026; eight frontier models; repair-lift protocol plus a blind human
  validation study.
technique: ''
proposed_technique: Score a critique by the repair it enables
technique_summary: Instead of rating a critique's text, hand it to a fixed repair agent and
  measure the improvement of the artefact after repair, so a critique is judged by what a reader
  can do with it.
technique_kind: process
technique_validated_by: Repair-lift scores over seven rubric dimensions for eight models on
  ten fixture families, cross-checked by blind human validation; single domain (web UX).
