arxiv_id: "2601.07898"
title: "Large Language Models and Algorithm Execution: Application to an
  Arithmetic Function"
url: https://doi.org/10.48550/arxiv.2601.07898
drafted_at: 2026-11-16
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: arithmetic
statement: For a 3B instruction-tuned model learning to execute
  multi-digit-by-single-digit multiplication in natural language, fine-tuning
  first on the elementary subtasks (digit multiplication, carry addition,
  digit extraction, left concatenation) and only then on the full step-by-step
  reasoning corpus roughly triples final accuracy over fine-tuning directly on
  the same full-reasoning corpus (42.1% vs 13.5%), while still leaving the
  majority of problems wrong.
kind: observation
backing_strength: single-paper
scope_condition: One 3B Llama-3.2-Instruct model; 4-6 digit times 1 digit
  multiplication; 200 held-out examples; recursive prompting used to let the
  model finish long traces; no other models or operations tested.
technique: ""
proposed_technique: Fine-tune on elementary subtasks before the full procedure
technique_summary: Train the model in stages on each decomposed step of an
  algorithm (digit multiply, carry add, digit extract, concatenate) and only
  afterwards on natural-language traces of the whole procedure, with recursive
  prompting to continue truncated traces.
technique_kind: training
technique_validated_by: "Accuracy on 200 held-out multiplications, against a
  baseline of the same base model fine-tuned directly on the same
  full-reasoning corpus: 42.1% vs 13.5%. Subtask accuracies reported at
  97-100% after each stage."
stance_on_existing: supports
related_claim_id: chain-of-thought-does-not-fix-digit-level-arithmetic
stance_reason: Even after explicit step-by-step reasoning supervision the
  model gets most multiplications wrong, consistent with stated steps not
  guaranteeing correct in-step computation.
falsifier: A matched-compute run where fine-tuning directly on the
  full-reasoning corpus (same total examples and steps) reaches comparable
  accuracy, showing the staged curriculum rather than extra training
  contributed nothing.
evidence_note: Measured on one model, one arithmetic task, one evaluation set
  of 200 items, single run with no variance reported. The comparison does not
  equalize total training data or compute between the staged and direct arms,
  so the curriculum effect is confounded with extra subtask training.
  Recursive prompting is applied only to the LLM-DAL arm as described, a
  further confound.
confidence: low
