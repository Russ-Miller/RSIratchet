arxiv_id: "2602.11170"
title: "PRIME: Policy-Reinforced Iterative Multi-agent Execution for
  Algorithmic Reasoning in Large Language Models"
url: https://doi.org/10.48550/arxiv.2602.11170
drafted_at: 2026-11-13
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: On algorithmic execution tasks requiring long multi-step state
  tracking (sorting, Turing-machine simulation, constraint puzzles), wrapping
  an LLM in an executor/verifier/coordinator loop with per-step constraint
  checking and backtracking raises exact-match accuracy far above single-pass
  prompting, and the per-step verification rather than the role decomposition
  is what the ablation credits.
kind: observation
backing_strength: single-paper
scope_condition: Tasks with machine-checkable per-step constraints and no
  partial credit; 8B-120B open models; baseline is a single-pass prompt with
  no matched token or compute budget.
technique: ""
proposed_technique: Executor-verifier-coordinator loop with state-stack backtracking
technique_summary: Decomposes algorithmic execution into an agent that
  proposes each step, an agent that scores constraint violations on the
  resulting state, and a controller that proceeds, retries, or pops the state
  stack to backtrack, with the executor policy tuned by GRPO.
technique_kind: process
technique_validated_by: Average accuracy over a self-built 86-task benchmark
  reported as 26.8% to 93.8% versus single-pass prompting; component ablation
  on the N-Queens case study shows removing the verification procedure costs
  the most (24.9 points at 8B, 8.1 at 120B). No matched-compute or
  matched-token baseline, and the main text reports detailed results only for
  N-Queens.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the single-pass baseline at the same token/compute budget
  as the loop, or running the loop with the verifier replaced by a no-op of
  equal cost, closes most of the reported gap.
evidence_note: Measured but weakly controlled. Headline 26.8%->93.8% is over a
  benchmark the authors built and whose per-task results sit in appendices not
  present in the source text; the only detailed evidence is one task (N-Queens
  next-step prediction, 2,800 trials, 7 models) where the gain comes from
  prompt scaffolding rather than the agent loop. The ablation that credits
  verification is a prompt-component ablation on that one task, not an
  ablation of the multi-agent architecture. No cost-matched baseline, so the
  comparison conflates added inference compute with coordination structure.
confidence: low
