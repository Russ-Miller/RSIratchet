statement: On county-level US knowledge (14,782 questions over 526 counties), the best of 13
  models reaches only about 57% on narrative questions and no model exceeds 13% on numeric Census
  facts, larger models are not reliably better, and web search helped Gemini (+14 points) while
  hurting GPT models (about -11), so hyper-local recall is thin and retrieval does not fix it
  uniformly.
