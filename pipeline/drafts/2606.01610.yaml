arxiv_id: '2606.01610'
title: Revisiting Ripple Effects in Knowledge Editing through Pressure-Aware Joint Neighborhood
  Optimization
url: https://arxiv.org/abs/2606.01610
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: knowledge-updating
statement: A single fact edit exerts two coupled pressures on its knowledge neighbourhood, propagation
  to facts that should change and leakage into facts that should not, and planning the edit's
  target representations jointly under both constraints, with a gate that rejects risky plans
  before touching parameters, improved propagation and preservation on RippleEdits by at least
  7% across backbones over methods that treat the two separately.
kind: mechanism
backing_strength: single-paper
scope_condition: RippleEdits and ZsRE on LLaMA-3, GPT-J and Qwen2.5-Instruct, 2026; locate-and-edit
  family; gains 7-30% by metric and backbone.
technique: ''
proposed_technique: Joint neighbourhood optimization for edits
technique_summary: Before writing an edit into parameters, optimize the target representations
  for the edited fact and its neighbours together, penalizing both failed propagation and leakage,
  and reject edit plans whose semantic risk is high.
technique_kind: training
technique_validated_by: Propagation, preservation, specificity and consistency metrics on RippleEdits
  and ZsRE against SAKE and other baselines across three backbones; fluency drops at most 1.5%.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Neighbourhood sizes or edit batches where the joint objective fails to scale, or
  preservation gains that vanish on held-out unrelated facts.
evidence_note: Method paper with the usual own-baseline comparison; the framing of coupled propagation/leakage
  pressure is the reusable idea.
confidence: medium
