arxiv_id: "2602.15257"
title: How to Train Your Long-Context Visual Document Model
url: https://doi.org/10.48550/arxiv.2602.15257
drafted_at: 2026-11-20
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: When finetuning 24B-32B vision-language models for long-document
  VQA, training on context lengths matched to the evaluation benchmarks (up to
  ~104 pages) beats training that also includes much longer examples (up to
  ~336 pages), by 1.4-3.0 points on a visual long-context average.
kind: observation
backing_strength: single-paper
scope_condition: Holds where evaluation benchmarks are mostly under 128K
  tokens; the contrasting prior result came from text corpora whose long-stage
  data was heavily short-skewed (median ~484 tokens) rather than genuinely
  long.
technique: ""
proposed_technique: Match training context length to the evaluation length
technique_summary: Restrict the long-context training stage to example lengths
  close to the target benchmark's context length instead of adding a
  longer-context stage on top.
technique_kind: training
technique_validated_by: Compared short-stage-only against
  short-plus-long-stage in three settings (SFT on Mistral Small 3.1 24B, SFT
  on Qwen3-VL 32B, LongPO on Qwen3-VL 32B); short-stage-only won on the
  visual-LC average in all three (+3.0, +1.4, +2.2) and on most individual
  benchmarks. Metric noise reported as sigma=0.33 over three runs.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-compute comparison in which adding genuinely-long
  training examples beyond the benchmark length raises visual long-context
  average scores, or in which the short-stage advantage disappears once
  evaluation includes documents near the full 344K context.
evidence_note: Measured on three model/method pairs with a normalized
  multi-benchmark aggregate; margins (1.4-3.0) are several times the reported
  run-to-run sigma of 0.33. Design does not isolate example count or token
  budget from length distribution, and the authors concede their benchmarks
  under-represent extreme lengths, so the claim is about matched-length
  regimes rather than long-context training in general.
confidence: medium
