falsifier: A model that scores near its static-benchmark rate on these
  deployment-and-API-test tasks, or an analysis showing the shortfall comes
  from benchmark harness flakiness (container setup, test timeouts) rather
  than from the agent's work.
evidence_note: Benchmark paper; authors report an extensive evaluation finding
  state-of-the-art models struggle, but the source text supplies no per-model
  numbers and no comparison figure for the same models on static code
  benchmarks, so the claimed disparity is asserted rather than quantified
  here. The design does not separate failures of environment configuration
  from failures of code logic.
