statement: When coding tasks require the whole backend development lifecycle —
  exploring a repository, configuring the environment, launching a
  containerized service, and passing external end-to-end API tests — current
  frontier models complete far fewer tasks than their scores on static,
  logic-only code benchmarks suggest.
