arxiv_id: "2608.11715"
title: "When the API Speaks the Wrong Language: Revisiting Post-Training for
  Multilingual Tool Use"
url: https://doi.org/10.48550/arxiv.2608.11715
drafted_at: 2026-10-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: tool-use
statement: When instruction-tuned models (Qwen2.5 7B-32B) make function calls
  from non-English user requests, they often select the right tool and
  argument names but emit argument values in the wrong language, a failure
  that exact-match or AST tool-calling metrics record as a generic invocation
  error rather than a language mismatch.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-Instruct 7B/14B/32B on a rule-based translation of
  the Berkeley Function Calling benchmark into Spanish, French, Italian and
  Dutch; turn-level metrics; only turns relevant to argument translation (832
  turns, 16.35% of the dataset).
technique: ""
proposed_technique: Score argument-value language consistency as its own metric
technique_summary: Decompose tool-call evaluation into a conditional hierarchy
  — invocation detection, tool selection, argument completion, argument
  language consistency, full call match — so wrong-language argument values
  are separated from structural errors.
technique_kind: process
technique_validated_by: "Applied to base and post-trained Qwen2.5-14B on two
  splits: base models score 91-95% on tool selection and argument completion
  but only 46-52% on argument language consistency and 22-32% on full
  function-call match, isolating language mismatch as the dominant residual
  error; no human validation of the metric reported."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that for these models the drop from argument-completion
  accuracy to full-call accuracy on non-English requests is driven by semantic
  or formatting errors rather than argument-value language, or that
  argument-language errors are already separable in standard AST/exact-match
  reporting.
evidence_note: Measured on one benchmark family (translated BFC) with one
  model family; the translation protocol is rule-based, so argument-language
  ground truth is partly an artifact of how the benchmark was constructed, and
  the authors flag translation artifacts as a limitation. The hierarchical
  metric itself is not externally validated.
confidence: medium
