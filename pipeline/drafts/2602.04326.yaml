arxiv_id: "2602.04326"
title: "From Assumptions to Actions: Turning LLM Reasoning into
  Uncertainty-Aware Planning for Embodied Agents"
url: https://doi.org/10.48550/arxiv.2602.04326
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For decentralized two-agent household simulation tasks (C-WAH,
  TDW-MAT) under partial observability, extracting the environment assumptions
  implicit in an LLM planner's reasoning trace into an explicit assumption
  decision tree and scoring each root-to-leaf path by likelihood, goal gain
  and execution cost raises task success and lowers step count relative to
  communication-centric multi-agent frameworks, while cutting communication
  actions by roughly an order of magnitude at comparable total token usage.
kind: observation
backing_strength: single-paper
scope_condition: Two cooperating agents, simulated multi-room household
  benchmarks, three backbones (GPT-4o mini, GPT-OSS:20B, Gemma3:4B);
  communication is costly and delayed one step.
technique: ""
proposed_technique: Score an explicit assumption tree instead of asking a partner
technique_summary: A Planner-Composer-Evaluator pipeline turns the assumptions
  latent in an LLM's reasoning trace into a decision tree whose internal nodes
  are true/false environment assumptions and whose leaves are physical or
  communication actions, then picks the leaf maximizing likelihood times gain
  minus cost.
technique_kind: process
technique_validated_by: Total steps on C-WAH and transported-object rate on
  TDW-MAT against CoELA, REVECA, CaPo and CoTS under identical environments
  and three backbones; plus module ablations (removing Planner, Composer or
  Evaluator each degrades steps) and a 12-participant user study on perceived
  efficiency and trust.
stance_on_existing: supports
related_claim_id: splitting-task-across-several-agents-helps-long-horizon-tasks-whose
stance_reason: It shows coordination overhead from inter-agent dialogue can be
  replaced by structured per-agent uncertainty reasoning without losing joint
  performance.
falsifier: A matched re-run where the assumption-tree planner fails to beat
  communication-centric baselines on success rate and steps at equal token
  budget, or where the gain disappears once the baselines' communication
  frequency is tuned down.
evidence_note: Measured on 10 C-WAH episodes and 24 TDW-MAT episodes with four
  baselines and three backbones; gains are consistent in direction across all
  cells. Design does not isolate how much comes from the extra per-step LLM
  calls versus the tree structure, though module ablations and
  reasoning-centric baselines are reported in appendices not shown here. Two
  agents only; scaling beyond two is relegated to an appendix.
confidence: medium
