falsifier: A comparably powered prospective tournament run where differences
  between frontier models exceed the open-book versus closed-book difference,
  or where an equal-weight ensemble of the same models improves Brier
  substantially more than its best member.
evidence_note: "Measured on a balanced factorial design: 8,736 match forecasts
  (7 models x 3 horizons x 2 access conditions x 2 prompting strategies) plus
  420 tournament forecasts, with paired within-match permutation tests and
  Holm correction. One tournament only; null model differences may reflect the
  104-match sample rather than true parity, which the authors acknowledge."
