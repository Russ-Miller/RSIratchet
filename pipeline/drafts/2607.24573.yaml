capability: forecasting
statement: "For prospective soccer match forecasting with minimal event
  information, giving a model web search matters more than which frontier
  model is used: across seven 2026-era models forecasting all 104 matches of
  the 2026 FIFA World Cup, enabling search cut the mean Brier score by 0.023
  (0.535 to 0.512, Holm-adjusted p=0.045) while none of the 21 pairwise model
  comparisons survived correction, and the models' outcome probabilities were
  highly correlated (mean pairwise r 0.943) so ensembling them gained only
  0.0047 Brier."
kind: observation
backing_strength: single-paper
scope_condition: Seven frontier models (GPT-5.5, Claude Opus 4.8, Gemini 3.1
  Pro, Grok 4.3, DeepSeek V4 Pro, Qwen 3.7 Max, Mistral Large 2512)
  forecasting 104 World Cup matches with prompts carrying only basic fixture
  information and no curated statistics; 104 matches gives limited power to
  separate models.
technique: ""
proposed_technique: Score forecasts prospectively on registered unresolved events
technique_summary: Register each unresolved match or tournament question,
  trigger schema-validated forecasts at fixed horizons before kickoff, archive
  prompt, model version, tool traces and cost, and only then resolve the
  outcome.
technique_kind: process
technique_validated_by: Not measured as an intervention; the protocol is used
  to produce the reported Brier/log-loss comparisons, and forecast quality was
  additionally benchmarked against de-vigged closing bookmaker odds (Gemini
  0.497 vs market 0.498).
