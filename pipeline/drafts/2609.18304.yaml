arxiv_id: "2609.18304"
title: "Rollback the World, Keep the Reflection: Rollback-Induced Reflection
  for Long-Horizon LLM Agents"
url: https://doi.org/10.48550/arxiv.2609.18304
drafted_at: 2026-09-23
