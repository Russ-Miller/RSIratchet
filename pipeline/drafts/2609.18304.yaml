falsifier: An ablation on the same benchmarks where reflection-only or
  rollback-only matches or exceeds the combined method at equal interaction
  and auxiliary-call budget, or where the gain disappears once the memory is
  allowed to include current-state claims.
evidence_note: Measured on three benchmarks with two backbones and component
  ablations that isolate rollback from reflection; the same model serves as
  agent and reviewer, so no stronger auxiliary model confound. Single paper,
  one implementation, ablations reported only on ScienceWorld with
  DeepSeek-V3. The accompanying theory is a capacity statement, not evidence
  of gain.
