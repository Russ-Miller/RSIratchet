status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: For long-horizon LLM agents in environments where an erroneous
  action changes world state, restoring an earlier checkpoint and carrying
  forward a structured reflection memory that excludes branch-local state
  claims beats either intervention alone, because reflection alone cannot undo
  environmental damage and rollback alone re-explores the same failure.
kind: mechanism
backing_strength: single-paper
scope_condition: Training-free test-time control on ALFWorld, ScienceWorld and
  GAIA with Qwen3-14B and DeepSeek-V3, where environment and workspace state
  can be checkpointed and restored; same LLM used for agent and all recovery
  components.
technique: ""
proposed_technique: Roll back the environment, keep the distilled reflection
technique_summary: On a triggered review, an agent restores a
  coarse-to-fine-selected earlier checkpoint while carrying forward a memory
  of objective, environment facts, past milestones and failure analysis,
  deliberately omitting current-state claims.
technique_kind: process
technique_validated_by: "Success rate on ALFWorld, ScienceWorld (plus dense
  reward) and GAIA against ReAct, Reflexion, LATS, Self-Refine and GA-Rollback
  under matched budgets: average SR 47.00 vs 43.91 best baseline (Qwen3-14B)
  and 69.43 vs 62.86 (DeepSeek-V3); ablations give 76.75 SR vs 70.48
  reflection-only and 69.37 rollback-only on ScienceWorld, with 0.92 rollbacks
  per task vs 2.9 for GA-Rollback."
stance_on_existing: neither
