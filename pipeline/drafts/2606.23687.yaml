arxiv_id: "2606.23687"
title: Randomized YaRN Improves Length Generalization for Long-Context Reasoning
url: https://doi.org/10.48550/arxiv.2606.23687
drafted_at: 2026-10-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For 7B-14B RoPE models fine-tuned only on short-context data (under
  5K examples), assigning each token the YaRN encoding of a position sampled
  from a longer range, with the sampling range grown across epochs, raises
  long-context reasoning accuracy at inference lengths beyond the training
  length more than plain LoRA, trained YaRN, RPE or PoSE, with the largest
  margin at the farthest lengths (128K).
kind: observation
backing_strength: single-paper
scope_condition: Holds when inference context is much longer than the
  fine-tuning context; tested on Qwen2.5-7B-Instruct, Olmo3-7B-Instruct and
  Qwen3-14B on BABILong, MRCR and LongBench v2, English only.
technique: ""
proposed_technique: Train on short text with randomized YaRN positions on a growing curriculum
technique_summary: During short-context fine-tuning, each token receives the
  YaRN positional encoding of a position drawn (sorted, without replacement)
  from a much longer range, with the maximum sampling length increased each
  epoch; plain YaRN is used at inference.
technique_kind: training
technique_validated_by: OOD accuracy averaged over length bins on BABILong
  (exact match), MRCR (similarity metric) and LongBench v2 (accuracy), against
  zero-shot, zero-shot+YaRN, LoRA, trained YaRN, RPE and PoSE; e.g. BABILong
  OOD average 90.3 vs 83.6 LoRA and 81.3 trained YaRN on Qwen2.5-7B;
  curriculum ablation costs 6.2 points on MRCR.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison in which randomized-YaRN training does not
  beat trained YaRN or PoSE on out-of-distribution length averages, or in
  which removing the curriculum leaves OOD accuracy unchanged.
evidence_note: Measured on three benchmarks and three base models with several
  training baselines, but small training sets (60-4,000 examples), small eval
  sets (up to ~305 per bin), one hyperparameter configuration, and LongBench
  v2 absolute scores remain low (37-41%). Gains on LongBench v2 are small
  (1.5-4.4 points). No variance or seed reporting.
confidence: medium
