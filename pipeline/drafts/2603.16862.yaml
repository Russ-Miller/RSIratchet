arxiv_id: "2603.16862"
title: "Chronos: Temporal-Aware Conversational Agents with Structured Event
  Retrieval for Long-Term Memory"
url: https://doi.org/10.48550/arxiv.2603.16862
drafted_at: 2026-11-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-term-memory
statement: "For conversational memory over multi-session dialogue histories,
  extracting subject-verb-object events with resolved ISO datetime ranges into
  a separate index alongside raw turns raises question-answering accuracy over
  turn-only retrieval, and the size of that gain depends on backbone strength:
  removing the event index cost 34.5 points with a GPT-4o agent but only 2.6
  points with a Claude Opus 4.6 agent on the same 116-question LongMemEval
  sample."
kind: observation
backing_strength: single-paper
scope_condition: LongMemEval-S, 500 questions (ablations on a 116-question
  stratified subset); agent has dense search, reranking and grep over both
  indexes; one benchmark only.
technique: ""
proposed_technique: Index dated event tuples alongside raw dialogue turns
technique_summary: Extract subject-verb-object events with normalized
  start/end datetime ranges and lexical aliases into a separate 'event
  calendar' index that an agent searches alongside an index of raw
  conversation turns.
technique_kind: retrieval
technique_validated_by: "Accuracy on LongMemEval-S: 92.60% with GPT-4o (vs
  86.00% for the strongest GPT-4o baseline) and 95.60% with Claude Opus 4.6;
  leave-one-out ablation on 116 questions isolates the event index as the
  largest single contributor."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison where adding a dated-event index to a
  turn-level retrieval system gives no accuracy gain on temporal and
  multi-session questions, or where the gain does not shrink as backbone
  capability rises.
evidence_note: Measured on one benchmark against published numbers from other
  systems rather than reimplemented baselines, so backbone, embedding model
  and harness differ across rows; the ablation is internally controlled but
  run on a 116-question subset, and the event-index effect is confounded with
  the agent's extra search tools over that index.
confidence: medium
