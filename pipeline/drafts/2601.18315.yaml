capability: domain-knowledge
statement: On wireless covert-communication tasks, current LLMs handle
  conceptual multiple-choice questions and code implementation far better than
  the multi-step detection-theoretic optimization derivations the domain
  actually requires (best models ~80-83% on MCQ and code versus 18-55% on
  derivations), and a common derivation failure is maximizing transmission
  utility while ignoring the covertness constraint.
kind: observation
backing_strength: single-paper
scope_condition: 237 MCQ, 148 derivation and 132 code-generation items built
  from covert-communication literature (IRS, NOMA, MIMO scenarios); 15 models
  from 7B open-weight to frontier APIs; derivations graded by human experts on
  weighted reasoning checkpoints.
