arxiv_id: "2601.18315"
title: "CovertComBench: A First Domain-Specific Testbed for LLMs in Wireless
  Covert Communication"
url: https://doi.org/10.48550/arxiv.2601.18315
drafted_at: 2026-11-17
drafted_from: full-text
