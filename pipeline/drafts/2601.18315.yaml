falsifier: A model scoring comparably on the derivation items and the
  conceptual/code items on this benchmark, or expert re-grading showing the
  derivation gap comes from rubric strictness rather than wrong reasoning
  steps.
evidence_note: Measured on a 517-item human-verified benchmark with per-type
  metrics; derivation scores are expert-graded, MCQ and code automated. No
  ablation separating mathematical difficulty from
  covert-communication-specific knowledge, so the gap could partly be general
  symbolic-integration weakness rather than domain-specific.
  Constraint-violation finding is qualitative error analysis, not quantified.
