arxiv_id: "2604.20473"
title: "Video-ToC: Video Tree-of-Cue Reasoning"
url: https://doi.org/10.48550/arxiv.2604.20473
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For 7B video LLMs given an SFT cold start before RL, rationales
  that progressively narrow from the whole video down to key clips give higher
  accuracy on video reasoning and general video benchmarks than rationales
  that name the key clip in a single step, and than free-form rationales
  generated by a much larger teacher model, which can leave the student more
  hallucination-prone than the untuned backbone.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B backbone, 1k SFT samples built from
  LLaVA-Video-178K, evaluated at 16/32/64 uniformly sampled frames on six
  video understanding benchmarks plus VideoHallucer.
technique: ""
proposed_technique: Build cold-start rationales by coarse-to-fine clip localization
technique_summary: Segment a video into clips, build a tree over them, select
  the clips needed for the question, and summarize the root-to-leaf
  backtracking path into a step-by-step 'progressively locate the cue'
  rationale used for supervised fine-tuning.
technique_kind: training
technique_validated_by: "Compared against the same pipeline producing
  single-step cue rationales (Video-SingleCue-SFT-1k): MMVU 65.3 vs 61.8,
  MVBench 63.3 vs 61.0, VideoMME 56.6 vs 54.5, baseline 59.2/57.4/53.1; and
  against Video-R1-SFT on six benchmarks. Hallucination compared on
  VideoHallucer: baseline 50.5, Video-R1 45.4, Video-ToC 51.9."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-budget comparison in which single-step cue rationales, or
  rationales distilled free-form from a larger teacher, equal or beat the
  tree-derived coarse-to-fine rationales on the same benchmarks, or in which
  the teacher-distilled student does not fall below its own backbone on a
  hallucination benchmark.
evidence_note: Measured on one 7B backbone with 1k SFT and 2k RL samples. The
  single-cue ablation isolates the rationale pattern while holding data source
  and size fixed, which is the cleanest part of the evidence. The
  hallucination comparison with Video-R1 is cross-system (different data and
  pipeline), so the attribution of its degradation to free-form teacher
  rationales is argued rather than isolated. VideoHallucer numbers are on
  200-ish-item categories and Video-ToC is worse than baseline on
  extrinsic-factual (20.0 vs 25.5). One backbone, no seed variance reported.
confidence: medium
