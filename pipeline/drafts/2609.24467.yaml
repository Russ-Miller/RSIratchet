statement: On forecasting next-year music festival lineups (link prediction
  between artists and festivals), zero-shot LLMs prompted for ranked candidate
  lists score far below specialized temporal-knowledge-graph forecasting
  models trained on the domain graph, and their errors are dominated by
  popularity bias toward globally famous artists plus duplicate entries in the
  ranked list.
kind: observation
backing_strength: single-paper
scope_condition: 380 German festivals, 1971-2025 yearly TKG, single-step
  prediction of 2025; LLMs tested were Llama 3.1 8B, Llama 3.3 70B
  (quantized), Mixtral 8x7B, GPT-4o-mini, given no candidate entity set; TKG
  models tested included CountTRuCoLa, CognTKE, RE-GCN, CEN, TLogic and a
  recurrency baseline.
