falsifier: A zero-shot or retrieval-augmented LLM matching or exceeding the
  best TKG model's R-Precision and normalized 10-precision on the same 2025
  test queries in both prediction directions, without popularity-biased or
  duplicated candidates.
evidence_note: "Measured on the paper's own benchmark: for artist prediction
  the best LLM reached 1.7% normalized 10-precision versus 11.9% for CognTKE;
  for festival prediction the best LLM reached 17.2% versus 41.4% for
  CountTRuCoLa. Popularity bias is evidenced by GPT-4o-mini naming Billie
  Eilish in the top 3 for 47.1% of queries and Llama 3.1 8B repeating one
  artist ~23 times per query. LLMs were not given the entity set, so part of
  the gap is the harder open-vocabulary setting rather than forecasting skill;
  string matching of LLM outputs to graph nodes adds measurement noise, though
  a 50-sample manual audit found no missed correct matches."
