arxiv_id: "2609.23407"
title: "OmniEcho: Spatial Audio Understanding for Embodied Agents"
url: https://doi.org/10.5281/zenodo.22855747
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: "For omni-modal models given four-channel first-order ambisonics
  audio, spatial-audio question answering improves most when a separately
  pretrained spatial encoder is grafted in and frozen alongside the model's
  original mono semantic audio pathway: dropping either pathway, or unfreezing
  the spatial encoder during instruction tuning, lowers accuracy."
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3-Omni-30B-A3B backbone; FOA spatial encoder pretrained
  with text-semantic alignment then localization; evaluated on the authors'
  own real-world spatial audio-visual QA benchmark.
technique: ""
proposed_technique: Graft a frozen spatial-audio encoder beside the mono audio path
technique_summary: Pretrain a small FOA encoder on semantic alignment then
  query-conditioned localization, then insert its frozen spatial tokens after
  the backbone's existing mono audio tokens via a trainable projector.
technique_kind: architecture
technique_validated_by: "Overall accuracy on OmniEchoBench-QA (2,972
  real-world QA pairs): full configuration 28.5 versus 26.2 without the native
  audio encoder, 19.8 without the FOA encoder, and 26.2 when the FOA encoder
  is trained rather than frozen in stage 3; baselines Qwen3-Omni 18.5,
  Qwen2.5-Omni 12.6, SO-7B 11.4."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on another omni backbone where jointly fine-tuning the
  spatial encoder, or removing the mono semantic pathway, matches or beats the
  frozen dual-pathway configuration on spatial audio QA.
evidence_note: Measured by a single-paper ablation table on one backbone and
  one in-house benchmark; gains are large against baselines but absolute
  accuracy stays low (28.5 overall, 14.2 on 3D localization), and training
  data is mostly synthetic so sim-to-real bias is acknowledged but not
  isolated.
confidence: medium
