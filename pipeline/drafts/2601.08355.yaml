capability: hallucination
statement: For VLMs consuming upstream semantic segmentation in driving scenes
  (Cityscapes), moderate drops in pixel-level segmentation metrics under
  realistic corruptions are accompanied by disproportionately severe
  language-level failures — hallucinated object mentions, omission of
  safety-critical entities, and inconsistent safety judgments — so
  segmentation quality is a poor proxy for downstream semantic reliability.
kind: observation
backing_strength: single-paper
scope_condition: Driving-scene semantic segmentation (Cityscapes) feeding
  contrastive and generative VLMs, under synthetic perception-realistic
  corruptions.
technique: ""
proposed_technique: Score VLM misalignment at the language level, not by segmentation metrics
technique_summary: Defines hallucination, critical-omission and
  safety-misinterpretation metrics over VLM text output and relates them to
  upstream segmentation quality under controlled corruption.
technique_kind: process
technique_validated_by: Measured across multiple contrastive and generative
  VLMs on corrupted Cityscapes segmentations; shows language-level metrics
  degrade far more than conventional segmentation metrics. No external
  human-judgment validation of the metrics reported here.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that hallucination and critical-omission rates in VLM
  output scale proportionally with segmentation metric drops across corruption
  types, so segmentation quality predicts downstream semantic reliability.
evidence_note: Measured on one dataset (Cityscapes) with author-introduced
  corruptions and author-defined misalignment metrics across several VLMs; no
  baseline comparison to alternative robustness measures, and the metrics'
  agreement with human judgement is not reported in the available text.
