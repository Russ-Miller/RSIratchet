stance_reason: ""
falsifier: A matched-compute run where a single-perspective reward (or a flat
  average of the same rubrics without the role decomposition) reaches the same
  EQ-Bench3 and human-preference scores, or where the multi-perspective
  reward's advantage disappears once the evaluation judge differs from the
  reward judge family.
evidence_note: "Measured on one backbone, one training set, three evaluation
  settings with named baselines and per-component ablations. Weakness: both
  the reward signal and the headline benchmark are LLM judges, and the
  harmonic-mean aggregation plus four rubrics is not separated from the role
  decomposition itself — the ablations remove dimensions, not the
  multi-perspective framing. The 68-person user study has wide confidence
  intervals, one cell at exactly 50%."
confidence: low
