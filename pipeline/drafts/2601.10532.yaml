arxiv_id: "2601.10532"
title: "PERM: Psychology-grounded Empathetic Reward Modeling for Large
  Language Models"
url: https://doi.org/10.48550/arxiv.2601.10532
drafted_at: 2026-11-17
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: When RL-tuning a 7B instruct model for empathetic response
  generation, scoring each rollout from several decomposed perspectives —
  whether the model's pre-answer analysis identified the user's state, whether
  the reply expresses it, whether a simulated user would feel supported, and a
  separate penalty for verbose or flattering text — raises LLM-judged
  emotional-intelligence scores more than a single-perspective reward
  (user-simulator feedback alone, response-quality classifier alone, or a
  general-purpose preference reward model).
kind: observation
backing_strength: single-paper
scope_condition: Single-turn empathetic dialogue, Qwen2.5-7B-Instruct trained
  with GRPO on 3,000 augmented EmpatheticDialogues samples; rewards and most
  evaluation come from LLM judges (GPT-4o-mini as reward judge, EQ-Bench3
  judge for evaluation).
technique: ""
proposed_technique: Score empathy from supporter, seeker and bystander separately
technique_summary: Decomposes the empathy reward into separate rubric-scored
  judgements of the model's internal analysis (resonation), its reply
  (expression) and a simulated user's reception, combined by harmonic mean,
  minus a bystander penalty for incoherent or flattering output.
technique_kind: training
technique_validated_by: "EQ-Bench3 overall score 60.1 (base) to 66.6, above
  RLVER 61.8, Partner 59.7, Skywork-Reward-V2 62.3, best-of-8 61.6 and both
  SFT variants; a 415-item industrial daily-conversation benchmark; and a
  68-participant blinded preference study where PERM beat the base model
  62.5-68.8% and the reward-model baseline 50.0-72.2%. Ablations: removing the
  resonation term costs the most (66.6 to 62.3); removing the bystander
  penalty raises warmth (12.7 to 13.1) but lowers pragmatic EI (13.4 to
  12.5)."
stance_on_existing: neither
