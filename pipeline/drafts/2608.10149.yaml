arxiv_id: "2608.10149"
title: "REATS: LLM Reasoning-based Ensemble Learning for Adaptive Time Series
  Forecasting"
url: https://doi.org/10.48550/arxiv.2608.10149
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: When a small (1.7B) LLM is fine-tuned to act as an ensemble router
  that assigns per-sample weights across candidate time-series forecasters,
  chain-of-thought supervision built by rule-templating known oracle weights
  against extracted temporal features matches or beats CoT generated by a
  frontier API model, and removing the CoT step costs far more on unseen
  candidate model pools than on in-distribution ones.
kind: observation
backing_strength: single-paper
scope_condition: Univariate forecasting on eight standard benchmarks (input
  and horizon 96), Qwen3-1.7B router, candidate pools of 4 small or foundation
  forecasters, oracle weights from a train-set quadratic program.
technique: ""
proposed_technique: Build chain-of-thought supervision from rules, not API calls
technique_summary: Generate reasoning traces for fine-tuning by
  reverse-engineering templated explanations that match extracted temporal
  features to candidate-model categories under known oracle labels, instead of
  querying a large model for the rationale.
technique_kind: training
technique_validated_by: "Average MSE across eight benchmarks after SFT:
  Rule-CoT 0.1210 vs GPT-CoT 0.1260 on the small-model candidate group (better
  on 6/8 datasets) and 0.1455 vs 0.1456 on the foundation-model group;
  ablating CoT raised MSE from 0.1210 to 0.1315 in-distribution and from
  0.1719 to 0.2675 out-of-distribution."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same pipeline with API-generated CoT and finding it
  beats rule-templated CoT on held-out datasets, or finding that removing CoT
  entirely costs no more out-of-distribution than in-distribution.
evidence_note: Measured on eight univariate benchmarks with one backbone and
  one pool size as default; the CoT ablation is reported only for the SFT
  stage on the small-candidate group plus one GRPO table, and no seed variance
  or confidence intervals are given for the Rule-vs-GPT comparison, where the
  foundation-group difference (0.1455 vs 0.1456) is within noise.
confidence: low
