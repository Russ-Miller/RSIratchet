arxiv_id: "2605.17352"
title: "AMATA: Adaptive Multi-Agent Trajectory Alignment for
  Knowledge-Intensive Question Answering"
url: https://arxiv.org/abs/2605.17352
drafted_at: 2026-11-01
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: In six-agent retrieval-augmented QA pipelines built on a 7B
  backbone, ranking sampled trajectories by how consistently they score
  tightly coupled agents (retriever, filter, locator) together — rather than
  by a single winning/losing pair or a full-order sort on raw preference
  scores — yields higher answer accuracy, because the score pattern across
  coupled agents carries the dependency information a single pairwise contrast
  discards.
kind: mechanism
backing_strength: single-paper
scope_condition: 7B open backbones, six fixed agent roles, knowledge-intensive
  QA with short trajectories (under ~10 steps); M=N=10 sampled trajectories,
  Top-K=5
technique: ""
proposed_technique: Rank trajectories by inter-agent dependency, not pairwise win/loss
technique_summary: Samples many agent trajectories per question, scores each
  by how coherently it weights functionally coupled agents, and trains with a
  listwise DPO variant that demotes correct-but-weakly-coupled trajectories
  into the rejected set.
technique_kind: training
technique_validated_by: Accuracy on five knowledge-intensive QA benchmarks
  (HealthQA, ARC-C, PopQA, SQuAD 1.1, ASQA) against vanilla DPO, full-order
  DPO, a global-local trajectory system (SMART) and RL baselines (GiGPO,
  SPA-RL); reported average 60.57 vs 55.70-56.55, with removal of the
  inter-agent loss the largest single ablation drop.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-data, matched-compute rerun in which plain pairwise DPO
  or full-order DPO on the same sampled trajectories equals the
  dependency-aware ranking, or in which the gain disappears once the
  intra-trajectory prefix stage is held constant.
evidence_note: Measured on five QA benchmarks with one 7B backbone, with
  ablations removing each loss term and each of three agents, plus a
  comparison across DPO variants. Single-paper, single scale; the design does
  not isolate the dependency ranking from the authors' own trajectory-sampling
  and annotation pipeline, and the dependency scores are LLM-annotated rather
  than externally verified.
