arxiv_id: '2510.06700'
title: 'How Language Models Conflate Logical Validity with Plausibility: A Representational
  Analysis of Content Effects'
url: https://arxiv.org/abs/2510.06700
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: logical-deduction-robustness
statement: 'Models judge a syllogism''s validity partly by how believable its conclusion is
  because validity and plausibility are encoded as linearly separable but strongly aligned directions
  in the residual stream: steering along the plausibility direction causally shifts validity
  judgements and vice versa, the degree of alignment predicts the size of the content effect
  across models, and a debiasing vector that separates the two reduces the effect and raises
  accuracy.'
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen-2.5 and Qwen3 families among others, syllogism datasets with believable
  and unbelievable conclusions, 2025; steering and probing on open weights.
technique: ''
proposed_technique: Debiasing vector that separates validity from plausibility
technique_summary: Find the plausibility and validity directions in activation space, construct
  a vector that removes the plausibility component from the validity judgement, and add it at
  inference so conclusions are judged by form rather than believability.
technique_kind: architecture
technique_validated_by: Content-effect size and accuracy before and after steering across model
  sizes; causal steering in both directions; alignment-effect correlation across models. Open
  models only.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Models where the two directions are already orthogonal yet content effects persist,
  which would mean the mechanism is elsewhere.
evidence_note: A mechanistic account with causal steering, which is stronger than the usual
  behavioural report of content effects; whether the debiasing vector generalizes beyond syllogisms
  is untested.
confidence: medium
