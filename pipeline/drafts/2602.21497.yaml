arxiv_id: "2602.21497"
title: "See It, Say It, Sorted: An Iterative Training-Free Framework for
  Visually-Grounded Multimodal Reasoning in LVLMs"
url: https://doi.org/10.48550/arxiv.2602.21497
drafted_at: 2026-11-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: "In 7B-78B open vision-language models generating long
  chain-of-thought, object-grounding errors can be reduced without training by
  intervening only at decoding steps where the base and an evidence-induced
  distribution disagree with a small margin: calling a small grounding model
  there and appending its one-sentence observation to a reusable textual
  evidence pool raises TreeBench accuracy by 4-11 points across backbones, and
  the gain is not attributable to the small model's perception, since that 3B
  model alone scores below every base model it is attached to."
kind: mechanism
backing_strength: single-paper
scope_condition: Open-source general LVLM backbones (Qwen2.5-VL 7/32/72B,
  LLaVA-OneVision 7/72B, InternVL3 8/38/78B) with a frozen decoder,
  uncertainty threshold 0.08, evaluated on TreeBench, RH-Bench and five
  general multimodal benchmarks.
technique: ""
proposed_technique: Gate a grounding call on the reweighted next-token margin
technique_summary: At each decoding step it reweights the top-k candidates by
  support from a growing pool of textual visual observations, and when the
  reweighted top-two margin stays small it calls a small grounding VLM to pick
  the token and emit one reusable observation sentence.
technique_kind: decoding
technique_validated_by: TreeBench overall accuracy against each unmodified
  backbone (e.g. Qwen2.5-VL-7B 37.0 to 47.9), against training-free baselines
  on the same backbone (Woodpecker 36.3, ViperGPT 38.3, ControlMLLM 40.5, beam
  38.8, self-consistency 39.0), against RL 'think-with-images' models
  (DeepEyes-7B 37.5, Pixel-Reasoner-7B 39.0, TreeVGR-7B 50.4), plus RH-AUC
  0.51 to 0.58 and five general benchmarks; ablation isolates supervisor
  (40.7), generic 3B decider (43.7) and grounding decider (47.9), with the 3B
  decider alone at 30.1.
stance_on_existing: supports
related_claim_id: 7b-vision-language-models-llava-1-5-7b-qwen-vl-chat-inference-time-hidden-state-steering
stance_reason: Both find that inference-time grounding intervention must be
  gated on a per-step uncertainty or grounding signal rather than applied at
  every decoding step.
falsifier: Applying the same evidence-reweighting and grounding calls at every
  decoding step (or at random steps at matched call rate) yields equal or
  better accuracy and hallucination scores than margin-gated triggering, or
  the gains disappear once the small grounding model's own answers are given
  to the base model directly.
evidence_note: "Measured on 8 backbones across 3 families on TreeBench plus
  RH-Bench and five general benchmarks, with an ablation chain separating the
  reweighting supervisor from the decider and a control using a generic 3B VLM
  as decider. The GRIT-3B-alone row is the strongest part of the design: it
  rules out the stronger-perception explanation. Threshold sweep shows an
  accuracy elbow near 0.08 common to five benchmarks. No matched-compute
  baseline against simply sampling the base model more at the same added
  latency; gain attribution (11.4% / 18.2% / remainder) is the authors' own
  trace analysis."
confidence: medium
