arxiv_id: '2410.14684'
title: 'RepoGraph: Enhancing AI Software Engineering with Repository-level Code Graph'
url: https://arxiv.org/abs/2410.14684
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: repository-navigation
statement: Adding a repository-wide line-level graph of definitions and references, queried
  for the ego-graph around names the model is looking at, raised SWE-bench resolve rates for
  all four frameworks it was plugged into (two agentic, two procedural) by an average of about
  33% relative, at a modest cost increase that was larger for the agentic ones; the same plug-in
  also helped on CrossCodeEval.
kind: observation
backing_strength: single-paper
scope_condition: SWE-bench Lite with GPT-4o and similar, 2024; frameworks Agentless, RAG, SWE-agent
  and AutoCodeRover; ego-graph depth k=1 or 2.
technique: ''
proposed_technique: Repository code graph as a navigation plug-in
technique_summary: Build a graph whose nodes are definition and reference lines and whose edges
  are contain and invoke relations across the whole repository, then answer the agent's or pipeline's
  lookups with the sub-graph around a queried symbol so it sees callers and callees without
  reading whole files.
technique_kind: tooling
technique_validated_by: Resolve rate and cost on SWE-bench Lite for each of four frameworks
  with and without the plug-in; ablation over ego-graph depth; secondary test on CrossCodeEval
  code completion.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Frameworks or languages where the graph adds cost without raising resolve rate, or
  a comparison showing a language-server or plain symbol search gives the same gain.
evidence_note: Gains are consistent across four frameworks, which is the strength of the paper,
  but end-to-end resolve rate is the only metric, so the improvement is attributed to navigation
  by argument rather than by a localization measurement.
confidence: medium
