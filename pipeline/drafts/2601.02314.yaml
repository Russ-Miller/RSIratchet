statement: When a contradictory intervention is forced into the first step of
  an LLM agent's chain of thought, the final answer stays semantically
  unchanged far more often on factual and scientific queries than on
  mathematical-logic queries, because the model reverts to a parametric prior
  rather than following the altered reasoning.
kind: observation
backing_strength: single-paper
scope_condition: Single-node logic-flip intervention at the first reasoning
  step of a GPT-4o-based agent; semantic equivalence judged by a separate LLM;
  500 queries across general knowledge, science and math.
technique: ""
proposed_technique: Flip one reasoning step and measure answer shift
technique_summary: Re-runs the agent after a hard intervention that negates or
  inverts a chosen intermediate reasoning step, and scores faithfulness as one
  minus the semantic similarity between the original and counterfactual
  answers.
technique_kind: process
technique_validated_by: Applied to 500 queries in three domains; reports mean
  faithfulness and violation rate per domain (general knowledge 92%, science
  96%, math 20% violation), with no baseline auditing method compared against.
