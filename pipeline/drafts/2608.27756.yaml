arxiv_id: "2608.27756"
title: "Load-Bearing Context: The Question Damage Score for Evaluating Context
  Reliance in Linguistic Reasoning"
url: https://doi.org/10.48550/arxiv.2608.27756
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: On self-contained linguistic Rosetta Stone puzzles where a single
  context example uniquely carrying a question-required token is deleted,
  frontier models told to output N/A when context is insufficient almost never
  abstain, and on some puzzles answer the damaged variant as well as or better
  than the original.
kind: observation
backing_strength: single-paper
scope_condition: 53 UKLO Rosetta Stone puzzles, single-example deletion,
  zero-shot single pass, three frontier models (Claude Sonnet 4.6, Gemini 3
  Flash, GPT-5.4) with explicit abstention instructions
technique: ""
proposed_technique: Delete the one context example a question uniquely needs
technique_summary: Score each context example by how many questions require
  tokens only it supplies (Question Damage Score), then delete the
  highest-scoring example to make a matched, structurally unanswerable variant
  of the same task.
technique_kind: process
technique_validated_by: Applied to 53 UKLO puzzles, classifying 45 as fragile
  and 8 as robust; cross-checked by LLM-as-judge agreement with the structural
  label (Gemini 71% recall at 94% precision), and used to surface 21 puzzles
  where Gemini matched or beat its original score on a judged-unsolvable
  variant
stance_on_existing: supports
related_claim_id: selfaware-set-unanswerable-questions-no-scientific-consensus-imagination-philosophical
stance_reason: Both find models answer rather than flag insufficient
  information, here with the unanswerability induced by a single matched
  deletion rather than inherently unanswerable questions.
falsifier: Models given the targeted-deletion variants abstain on the damaged
  questions at rates close to the structural damage count, and their accuracy
  on those questions drops to near zero.
evidence_note: "Measured on 53 puzzles x 3 conditions x 3 models, one sample
  per puzzle. Deletion-attributable abstentions after excluding pre-existing
  ones: GPT 0, Gemini 2, Claude 21 split evenly across random and targeted
  deletion. Aggregate EM drops are small and only Gemini's is significant; the
  claim rests on per-puzzle cases (Cherokee 0.700 to 0.900) corroborated by an
  LLM judge, not expert annotation. Does not isolate memorization from
  morphological inference."
confidence: medium
