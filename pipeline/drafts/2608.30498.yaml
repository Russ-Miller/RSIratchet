evidence_note: Measured on one 442-item self-built dataset by the framework's
  authors, four backbones, with module ablations and a conflict/consensus
  partition. No token- or compute-matched baseline is reported, and the three
  streams differ from the baselines in tool access (retrieval, web search), so
  the comparison does not isolate the gating rule from the extra evidence
  sources. Case study text is human-edited, not verbatim.
