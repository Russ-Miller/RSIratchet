statement: On multimodal cultural-interpretation multiple-choice questions,
  pipelines that pool several same-backbone evidence streams (perception,
  retrieval, web verification) and weight them by scored relevance beat
  majority voting, self-consistency and agent debate mainly on the items where
  the streams disagree, and the margin shrinks sharply as the backbone gets
  stronger.
kind: observation
backing_strength: single-paper
scope_condition: 442 expert-verified 4-way cultural MCQs; Qwen2.5-VL 3B/7B,
  llava-onevision-7b, GPT4.1-mini; all modules run on the same backbone;
  prompts and budgets fixed
technique: ""
proposed_technique: Arbitrate conflicting evidence streams by relevance-gated fusion
technique_summary: Generate perception, retrieval and web-verification
  evidence with the same backbone, score each stream for
  relevance/accuracy/discriminativeness, softmax-weight them into a fused
  answer, and refine under six cultural rubric criteria.
technique_kind: process
technique_validated_by: 4-way accuracy on 442 CM2D items against CoT,
  Self-Refine, CoT-SC and Agent Debate on four backbones (e.g.
  llava-onevision-7b 23.53 to 50.68, best baseline 43.21; GPT4.1-mini 41.63 to
  55.20, best baseline 54.30), plus module ablations and a conflict/consensus
  split where conflict-subset accuracy is 50.0/53.4 vs 41.2/43.3 majority
  vote.
