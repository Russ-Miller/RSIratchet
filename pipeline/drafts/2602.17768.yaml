arxiv_id: "2602.17768"
title: "KPM-Bench: A Kinematic Parsing Motion Benchmark for Fine-grained
  Motion-centric Video Understanding"
url: https://doi.org/10.48550/arxiv.2602.17768
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For a 7B Qwen2.5-VL captioner fine-tuned on fine-grained motion
  captions, adding a GRPO reward computed from parsed motion attributes
  (action-set F1, pairwise temporal order, direction agreement against the
  reference caption) lowers measured motion hallucination while costing a
  fraction of a point on surface-overlap caption metrics.
kind: observation
backing_strength: single-paper
scope_condition: One 7B backbone, motion-centric human-action videos under ~30
  seconds, reference captions produced by the paper's own kinematic annotation
  pipeline; reward and evaluation metric share the same parser.
technique: ""
proposed_technique: Reward parsed action, order and direction against the reference caption
technique_summary: Parse both generated and reference captions into motion
  predicates with roles and temporal order (AMR plus dependency parsing), then
  use action F1, pairwise order correctness and direction agreement as a
  composite GRPO reward.
technique_kind: training
technique_validated_by: On a 215-video hand-annotated hallucination set,
  GPT-4.1-judged hallucination count fell 2.03 to 1.92 and the parser-based
  Mo-Hall score rose 0.607 to 0.619 versus the same SFT model without the
  reward, with GPT-Acc rising 67.83% to 71.80% and BLEU-1 falling 43.64 to
  43.25; QA accuracy was essentially unchanged (94.03 to 94.05).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Training the same backbone with this reward and evaluating
  hallucination with a parser-independent protocol (human annotation, or a
  differently built extractor) shows no reduction, or shows the gain comes
  from shorter/less specific captions rather than better grounding.
evidence_note: Measured on the authors' own benchmark against their own SFT
  baseline; single backbone, single seed, no confidence intervals. The reward
  objective and the Mo-Hall metric use the same MoPE parser, so that half of
  the hallucination evidence is partly circular; the independent GPT-Hall
  judge moves only 0.11. Ablation does not separate the three reward terms.
confidence: low
