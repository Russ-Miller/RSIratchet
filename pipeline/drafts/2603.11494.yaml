arxiv_id: "2603.11494"
title: "PRMB: Benchmarking Reward Models in Long-Horizon CBT-based Counseling
  Dialogue"
url: https://doi.org/10.48550/arxiv.2603.11494
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: "For reward models judging counselor responses in multi-session CBT
  dialogue, pairwise preference accuracy overstates reliability relative to
  Best-of-N selection against four subtly-flawed candidates: across 16
  discriminative and LLM-as-judge models, pairwise accuracy mostly sits
  between 73% and 84% while Best-of-N accuracy falls to 40-73%, an average gap
  above 20 points that is largest for generative judges."
kind: observation
backing_strength: single-paper
scope_condition: Long-horizon, multi-session CBT counseling prompts built by
  progressive summarization; chosen responses are real counselor utterances,
  rejected ones are LLM-generated subtle therapeutic violations; Best-of-4
  configuration.
technique: ""
proposed_technique: Score counseling judges by Best-of-N, not pairwise
technique_summary: Evaluates a reward model by whether it ranks the clinically
  grounded response above all four subtly-flawed distractors, rather than
  above a single rejected response.
technique_kind: process
technique_validated_by: Benchmark rankings from this protocol correlated with
  downstream Best-of-16 selection quality (BERTScore against reference
  counselor responses, pooled over four policy models) at Spearman 0.700
  (p~0.036), above RewardBench2's 0.633 (p~0.067).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A reward-model evaluation on the same long-horizon counseling data
  in which pairwise and Best-of-N accuracy track each other closely, or in
  which the pairwise ranking predicts downstream Best-of-N selection quality
  as well as the Best-of-N ranking does.
evidence_note: Measured on ~6,948 pairwise pairs and ~6,945 Best-of-4 queries
  from 118 six-session CBT cases, 16 reward models. Rejected responses are
  synthetic by construction (prompt-engineered to embody one of 21
  client-reported negative-experience categories), so the gap partly reflects
  that distractor distribution rather than natural counselor output; human CBT
  practitioners agreed with the chosen label in 86-94% of a 200-pair sample.
  Downstream correlation rests on BERTScore, a surface metric, over only ten
  ranked models.
confidence: medium
