technique_validated_by: Accuracy measured against base chain-of-thought at K =
  1, 2, 4, 8, 16 on four benchmarks; inference cost table shows generated
  tokens growing 7.8x from K=1 to 16 while latency grows 2.0x.
stance_on_existing: supports
related_claim_id: 8b-instruction-tuned-backbones-training-lora-corrector-diagnose-typed-executable
stance_reason: Same method and backbone class; this paper reports the
  per-iteration profile of the gain the existing claim records, with
  operator-only and adjacent-state-only ablations both losing accuracy.
falsifier: Running the same loop to larger K and finding accuracy continuing
  to rise substantially past the first few steps, or declining systematically
  as self-produced states drift from the training distribution.
evidence_note: Measured on four benchmarks at five budget settings with a
  single stated figure (no error bars reported for the budget sweep); the
  plateau is argued to come from the three-source noise construction
  approximating the backbone's own error distribution, which the design does
  not isolate. Limited to 8B backbones and a fixed operator library.
