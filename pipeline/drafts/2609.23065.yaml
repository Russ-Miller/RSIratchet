arxiv_id: "2609.23065"
title: "From Concept Alignment to Causal Grounding: An Intervention Test of
  Chain-of-Thought Faithfulness"
url: https://doi.org/10.48550/arxiv.2609.23065
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: explanation-faithfulness
statement: "When chain-of-thought faithfulness is measured by how much the
  internal concepts (sparse-autoencoder features) active during a CoT pass
  overlap with those active during a direct-answer pass, that overlap barely
  predicts whether the shared concepts causally drive the answer: across five
  open models and four reasoning datasets, above-median concept alignment
  raised the chance of an above-median causal ablation effect by only about
  8%, so representational correspondence cannot substitute for an ablation
  test."
kind: mechanism
backing_strength: single-paper
scope_condition: Open models 1.7B-9B (Llama-3.1, Gemma-2, Qwen3) with
  off-the-shelf residual-stream SAEs, on GSM8K, LogiQA, OpenbookQA and
  ARC-Easy, measured at the answer-token position and only on items where CoT
  and no-CoT answers agree.
technique: ""
proposed_technique: Ablate CoT/prediction shared SAE concepts to test faithfulness
technique_summary: Encode the answer-position residual of a direct-prediction
  pass and a CoT pass with one shared sparse autoencoder, then zero the
  decoder contribution of the concepts active in both and measure the drop in
  answer probability.
technique_kind: process
technique_validated_by: Compared against random-subset, prediction-only, and
  norm-matched ablation controls (all near zero effect), a completeness check
  adding prediction-only features (negligible increment), a top-k magnitude
  upper bound (only marginally higher), and two SAE width/sparsity
  configurations (Pearson r > 0.8 across configurations).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Show that a concept-overlap score between CoT and prediction passes
  predicts ablation-based answer-probability drop with strong correlation
  across models, datasets and layers, so the causal ablation adds no
  information.
evidence_note: "Measured on five models and four datasets with layer-wise
  reporting; association quantified by median-binarised lift of 1.08 and weak
  Spearman correlations. Controls rule out ablation count, feature magnitude
  and SAE hyperparameters. Limits: all evidence at the answer-token position,
  only agreement cases, SAE concept quality assumed, no human check that
  Delta_p tracks judged unfaithfulness."
confidence: medium
