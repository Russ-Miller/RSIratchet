arxiv_id: "2609.17985"
title: "RideWay: Benchmarking Efficient Task Completion for Tool-Using
  Language Agents"
url: https://doi.org/10.48550/arxiv.2609.17985
drafted_at: 2026-09-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: tool-use
statement: For multi-turn tool-using service agents, counting excess
  user-facing turns above a task-specific human reference predicts human
  efficiency preferences between two successful trajectories (about 91%
  accuracy on turn-differing pairs), while counting excess tool calls does not
  (chance on pure-tool pairs), because a raw call count cannot say whether a
  call verified a constraint or wasted effort.
kind: mechanism
backing_strength: single-paper
scope_condition: 58 Chinese-language ridehailing tasks, 24 non-thinking
  models, 320 calibration and 80 held-out blinded pairwise preference votes;
  single domain and language, mostly one primary annotator
technique: ""
proposed_technique: Score successful trajectories by excess turns and tool calls
technique_summary: A success-gated metric multiplicatively discounts a
  completed trajectory for tool calls and user-facing turns beyond per-task
  human reference floors, with the two penalty weights fitted from blinded
  human pairwise efficiency preferences via Bradley-Terry.
technique_kind: process
technique_validated_by: "Held-out task-disjoint pairwise preference
  prediction: 78.7% accuracy, Kendall tau_b 0.573, versus 0.773 for equal-cost
  length, 0.394 tool-only, 0.925 turn-only at 0.71 coverage; turn-first
  lexicographic tied at 0.800; plus a 10-task listwise check (all tau_b
  positive, mean 0.488) and stability to +/-1-2 floor perturbations."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A held-out preference set in which excess tool-call counts alone
  predict human efficiency judgements well above chance, or in which excess
  turns fail to predict them, would break the claim.
evidence_note: "Measured on 75 directional held-out pairs: 90.6% accuracy on
  53 turn-differing pairs but only 58.3% on the 12 with small turn gaps, and
  50.0% on 22 pure-tool pairs with an exactly even 11/11 human vote split.
  Human-human agreement on pure-tool pairs was 78.3% (kappa 0.658) versus 100%
  on a 17-pair turn-differing relabel, so the tool-axis limit is partly
  annotator disagreement rather than only metric failure. Small sample, one
  domain, one language."
confidence: medium
