arxiv_id: "2609.15195"
title: "HarnessVLN: Unifying Training-Free Embodied Navigation through an
  Agent Harness"
url: https://arxiv.org/abs/2609.15195
drafted_at: 2026-09-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For training-free MLLM-driven navigation (instruction-following and
  object-goal) in simulated indoor environments, gating each planner-proposed
  action on evidential support, geometric reachability and subgoal consistency
  before dispatch — and refusing a stop request unless semantic, geometric and
  progress checks all pass — raises success rate over letting the planner act
  directly, but the stop check buys completion at some cost in path
  efficiency.
kind: mechanism
backing_strength: single-paper
scope_condition: Zero-shot MLLM planners on VLN-CE R2R/RxR and
  HM3D-v2/HM3D-OVON; the harness supplies depth, open-vocabulary detection and
  a deterministic path planner, so results depend on those tools being
  adequate.
technique: ""
proposed_technique: Validate navigation proposals against evidence and geometry before dispatch
technique_summary: A harness layer intercepts the MLLM planner's tool calls,
  checks each target for supporting observation provenance, geometric
  reachability and consistency with the active subgoal, and blocks stop
  requests until semantic, geometric and progress conditions all hold, feeding
  structured failure evidence back into memory and a spatiotemporal graph.
technique_kind: process
technique_validated_by: "Cumulative ablation on fixed 100-episode subsets:
  base agent 46.0 SR (R2R) and 45.0 SR (HM3D-OVON) rose to 64.0 and 55.0 with
  event memory, graph retrieval and stop validation; stop validation alone
  added 4.0 and 2.0 SR but lowered OVON SPL from 34.2 to 33.0 and widened its
  OSR-SR gap from 18 to 19. Full system reported 60.8/53.9/76.0/59.3 SR on
  R2R/RxR/HM3D-v2/HM3D-OVON versus prior training-free bests."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on the same benchmarks where removing proposal
  validation and stop gating leaves success rate unchanged, or where the
  gating lowers success rate, would show the validation layer is not what
  produces the gain.
evidence_note: Measured on four simulated benchmarks plus a qualitative
  humanoid deployment. Ablations are cumulative on 100-episode subsets, so
  each component's contribution is order-dependent and not isolated; no
  matched-compute baseline for the extra tool calls, and the comparison
  methods use different base models in places.
confidence: medium
