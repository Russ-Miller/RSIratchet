falsifier: A model that scores above Nash on anti-coordination and
  battle-of-the-sexes at rates comparable to its coordination/stag-hunt scores
  under the same no-communication one-shot protocol.
evidence_note: Measured across ~53,000 game instances, 7 scored two-player
  archetypes at k=2-10, 12-30 trials each, scored against computed pure and
  mixed Nash equilibria with label rotation controlling position bias. Hosted
  models differ from open-weight in backend and trial count, so capability and
  provider effects are not separated; the matching-vs-differentiating
  explanation is argued from the score pattern, not tested by an intervention.
