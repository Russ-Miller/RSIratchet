capability: multi-model-coordination
statement: In one-shot, no-communication self-play where independent copies of
  the same LLM are told their counterparts run the same model, models exceed
  the Nash baseline mainly in games whose optimal joint play requires matching
  actions (coordination, stag hunt, public goods) and fall below it in games
  requiring symmetry-breaking (anti-coordination, battle of the sexes), with
  several open-weight models scoring near the worst joint cell.
kind: mechanism
backing_strength: single-paper
scope_condition: One-shot matrix games, two players, no communication or
  shared memory, action labels rotated; 13 models from 1B-14B open-weight plus
  two hosted frontier models.
