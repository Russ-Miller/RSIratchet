arxiv_id: "2606.29805"
title: "Clearer Sight, Fewer Lies: Oriented Pickup Preference Optimization for
  Multimodal Hallucination Mitigation"
url: https://doi.org/10.48550/arxiv.2606.29805
drafted_at: 2026-10-28
