statement: 'When an error is injected into a supplied chain of thought, models mostly carry
  it to the answer: a planted arithmetic error costs small models 50-60% accuracy and 18% on
  average, though the largest models lose only 3-7%; unit-conversion errors cost about 9% at
  every scale; skipped steps and sycophantic steps cost small models about 10%; extra correct
  steps cost almost nothing (0-6%).'
