status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: For audio-aware LLMs on multiple-choice audio understanding and
  reasoning benchmarks, semantic-level uncertainty (semantic entropy, discrete
  semantic entropy) and self-verification P(True) separate correct from
  incorrect answers better than token-level predictive or length-normalized
  entropy, but that ordering becomes model- and benchmark-dependent on
  hallucination and unanswerable-question benchmarks.
kind: observation
backing_strength: single-paper
scope_condition: Three ALLMs (Qwen2.5-Omni-3B/7B, Audio Flamingo 3),
  constrained answer spaces, 10 samples at temperature 1.0, AUROC/AURAC
  metrics; not tested on open-ended audio generation.
