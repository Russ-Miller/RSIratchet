falsifier: On further ALLMs and comparable audio reasoning benchmarks,
  predictive or length-normalized entropy matching or beating semantic entropy
  and P(True) on AUROC, or semantic/verification methods holding a stable lead
  on hallucination and unanswerable-question benchmarks across models.
evidence_note: Measured AUROC and AURAC across four reasoning benchmarks
  (MMAU, MMAR, MMSU, SAKURA) and two trustworthiness benchmarks (AQUA-Bench,
  Audio-Hallucination) for three models; on reasoning sets
  semantic/discrete-semantic/P(True) take nearly every best-AUROC cell, while
  on AQUA-Bench and Hallucination the winner rotates (P(True) for 7B,
  normalized entropy for 3B and Audio Flamingo 3). No statistical testing of
  the differences, and only three models, so the instability could itself be
  sampling noise.
