arxiv_id: "2604.25591"
title: "Walking Through Uncertainty: An Empirical Study of Uncertainty
  Estimation for Audio-Aware Large Language Models"
url: https://doi.org/10.48550/arxiv.2604.25591
drafted_at: 2026-11-02
