status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For ensembles of heterogeneous vision-language models answering
  multiple-choice visual questions, selecting the answer from whichever member
  has the lowest normalized predictive entropy beats majority voting and beats
  the best single member, because voting weights all members equally and lets
  correlated weaker models outvote a confidently correct stronger one.
kind: mechanism
backing_strength: single-paper
scope_condition: Multiple-choice (2-9 options) visual QA with 7 open VLMs from
  3B to 72B, 16 samples per model, CoT prompting; relies on lower entropy
  tracking higher accuracy, which weakens for miscalibrated models.
technique: ""
proposed_technique: Pick the lowest-entropy model's answer, not the majority
technique_summary: Across several models each sampled multiple times, compute
  per-model normalized entropy over the answer distribution and output the
  top-1 answer of the least uncertain model instead of counting votes.
technique_kind: decoding
technique_validated_by: "Accuracy on six multiple-choice visual QA benchmarks
  (MathVista, MathVision, TQA, ScienceQA, MMStar, MMMU) against majority
  voting over the same outputs and against each individual model: average
  66.56% vs 63.75% voting for four similar-sized cross-family models, and
  71.68% vs 68.84% voting and 69.90% for the best single model in a 3B-72B
  Qwen ensemble; also tested on ARC-Easy and MMLU-Pro with text-only models."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ensemble where entropy-based selection scores at or below
  majority voting and below the strongest member across benchmarks, or where
  the gain disappears once member confidences are calibrated.
evidence_note: Measured on 6 multiple-choice VQA benchmarks with 7 open VLMs
  in two ensemble configurations (cross-family 7-12B; same-family 3B-72B),
  plus a text-only extension; gains of about +2.8 points average over voting,
  with a supporting theorem under an assumed entropy-accuracy monotonicity.
  Design does not isolate how much of the gain is just picking the strongest
  model per item, and all tasks are multiple-choice, so it says nothing about
  open-ended generation.
confidence: medium
