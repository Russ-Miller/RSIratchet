statement: Extended reasoning budgets improve a model's execution of
  arithmetic procedures on operands longer than those seen in training far
  more than they improve surface-form-to-value tasks like magnitude comparison
  and format conversion, because chain-of-thought supplies external working
  memory for carries and column alignment but cannot change how the input was
  tokenized.
