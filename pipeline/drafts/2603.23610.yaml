arxiv_id: "2603.23610"
title: "Environment Maps: Structured Environmental Representations for
  Long-Horizon Agents"
url: https://doi.org/10.48550/arxiv.2603.23610
drafted_at: 2026-11-07
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: For web agents on multi-page interactive sites, consolidating the
  same human demonstration traces into a structured, queryable environment map
  (page contexts, parameterized actions, workflows, domain definitions) raises
  task success more than giving the agent the raw traces themselves, with the
  margin concentrated in UI-dense, high-branching sites and absent in shallow
  ones.
kind: observation
backing_strength: single-paper
scope_condition: WebArena, claude-sonnet-4-5 agent with file tools, 812 tasks,
  maps built from 179 released human Playwright traces; per-site maps only,
  cross-site tasks unaffected
technique: ""
proposed_technique: Compile demonstration traces into a queryable environment map
technique_summary: Segments recorded trajectories into page contexts,
  parameterized action templates, workflows and domain definitions, stored as
  indexed JSON the agent reads on demand during a task.
technique_kind: retrieval
technique_validated_by: "WebArena Verified binary success on 812 tasks: 28.2%
  with maps vs 23.3% with raw trace access vs 14.2% no prior knowledge, same
  agent stack and same default file tools; per-environment GitLab
  8.3/11.7/22.8%, CMS 11.5/15.4/22.5%, Reddit 13.2/58.5/60.4%, Map
  32.1/34.9/34.9%; multi-site tasks 0/48 under both knowledge conditions."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Under the same agent and retrieval interface, raw trace access
  matching or exceeding map access on UI-dense sites, or the map advantage
  disappearing once the raw traces are given an equally convenient index.
evidence_note: Measured, single paper, one backbone, one benchmark. Retrieval
  interface held fixed across conditions, which isolates representation from
  tooling. But the raw-trace condition uses Playwright files 'not designed for
  LLM consumption' and agents barely touched them (0.2 file calls/task vs
  12.1), so part of the gap is format usability rather than abstraction per
  se. Absolute success rates are low (28.2%), and the shallow-site null
  (Reddit, Map) is from single environments.
confidence: medium
