arxiv_id: "2608.30661"
title: "SwarmBench: Can Large Language Models Act as Agent Swarm Orchestrators?"
url: https://doi.org/10.48550/arxiv.2608.30661
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For an LLM acting as orchestrator of dynamically created subagents,
  summarizing its own past trajectories into reusable workflow skills, short
  operational tricks, and capability cards for the candidate subagent
  backbones, then injecting those into the orchestrator's context, raises task
  scores on delegation- and aggregation-heavy tasks, and the subagent model
  cards are the component whose removal costs most.
kind: observation
backing_strength: single-paper
scope_condition: Hierarchical swarm setups with one orchestrator, a fixed pool
  of subagent backbone models, and parallel subagent execution; measured on
  four tasks (multi-text understanding, root cause analysis, long-text
  generation, wide search) with GPT-5.4 as orchestrator and transfer to four
  other orchestrators.
technique: ""
proposed_technique: Replay extracted skills, tricks and model cards to the orchestrator
technique_summary: Run the swarm, summarize trajectories into SKILL.md
  workflow patterns, a trick library, and per-backbone model cards, and
  reinject all three into the orchestrator's prompt at inference.
technique_kind: prompting
technique_validated_by: "Task accuracy against the same swarm framework
  without experience injection, plus single-agent, Best-of-N, multi-model
  voting and AOrchestra baselines: +6.42 on RCA, +6.46 on LTG, +2.92 on WS,
  +0.25 on MTU; transfer of GPT-5.4-derived experience improved 14 of 16
  model-task settings; ablation drops -2.49 avg without model cards, -1.75
  without tricks, -1.22 without skills."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Injecting the extracted experience fails to improve orchestrator
  task scores over the same framework without it, or removing the model cards
  costs no more than removing skills or tricks, on comparable swarm tasks.
evidence_note: Measured on 8 tasks/400 samples, with the technique tested on
  only 4 tasks and one primary orchestrator; gains are small on one task and
  negative on two settings for one transfer model. Several accuracy metrics
  and all process scores are LLM-judged; the paper reports human-agreement
  analysis only in an appendix not included here. No repeated-run variance
  reported, so small deltas (+0.25, +1.5) are hard to separate from noise.
confidence: low
