arxiv_id: "2604.19756"
title: WorkflowGen:an adaptive workflow generation mechanism driven by
  trajectory experience
url: https://doi.org/10.48550/arxiv.2604.19756
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: For LLM agents on repetitive business workflows, generating a plan
  by retrieving a semantically similar past execution trajectory and
  regenerating only its variable nodes should cost fewer tokens than
  re-planning from scratch, because the structural skeleton of the plan is
  stable across queries that differ only in phrasing or parameters.
kind: mechanism
backing_strength: mechanism-reasoning
scope_condition: High-frequency, repetitive task domains where many queries
  map onto the same workflow topology; the paper reports no quantitative
  experiments and only estimates savings.
technique: ""
proposed_technique: Rewrite only the variable nodes of a retrieved past workflow
technique_summary: Store past agent execution trajectories as structured
  templates with node-level experiences (error fingerprints, tool mappings,
  parameter schemas), then route each new query by semantic similarity into
  direct trajectory reuse, rewriting of variable nodes only, or full
  from-scratch planning.
technique_kind: process
technique_validated_by: Not measured. The paper gives only a qualitative table
  against three baselines (real-time planning, static single trajectory,
  in-context learning) plus unsupported 'preliminary estimates' of >40% token
  reduction and a 20% success-rate gain on medium-similarity queries; no
  dataset, no runs, no numbers.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled run on a real workflow benchmark where
  trajectory-rewriting generation consumes as many or more tokens than
  re-planning from scratch at matched success rate, or where the
  retrieved-template structure is wrong often enough that repair costs exceed
  the savings.
evidence_note: Argued only. The authors state explicitly that no quantitative
  experiments were conducted because the dataset is not yet built; the
  comparison is a three-table qualitative ranking written by the authors, and
  the two numbers quoted (>40% token reduction, 20% success gain) have no
  measurement behind them. The design does not isolate whether gains would
  come from retrieval, from node-level failure experience injection, or from
  the similarity routing.
confidence: low
