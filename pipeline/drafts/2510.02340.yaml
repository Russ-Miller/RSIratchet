stance_reason: Contests using prompted cutoffs as a decontamination method for forecasting evaluations.
falsifier: A prompting or steering method reaching high success on the counterfactual subset.
evidence_note: Also bears on knowledge-updating; the counterfactual subset is the discriminating
  test.
