arxiv_id: '2510.02340'
title: Can Prompts Rewind Time for LLMs? Evaluating the Effectiveness of Prompted Knowledge
  Cutoffs
url: https://arxiv.org/abs/2510.02340
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: factual-recall
statement: Prompting a model to behave as if its knowledge ended at an earlier date works for
  facts asked about directly (about 82% unlearning success) and for word-sense shifts (about
  70%), but fails when the post-cutoff knowledge is only causally connected to the question
  (about 19%), so a simulated cutoff cannot be trusted to remove contamination from temporal
  prediction tests.
kind: observation
backing_strength: single-paper
scope_condition: Three popular LLMs with tuned meta-prompts, three purpose-built subsets (factual,
  semantic, counterfactual), 2025.
