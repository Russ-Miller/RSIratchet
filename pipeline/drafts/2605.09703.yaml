capability: multi-model-coordination
statement: "For zero-shot inference of behaviour, cognition and emotion from
  noisy real classroom collaboration clips with one 8B multimodal backbone
  shared across agents, the gain from a staged
  behaviour-then-cognition-then-emotion agent pipeline comes about equally
  from splitting the task into separate specialised agents and from the
  domain-theory (self-regulated learning) wording of each agent's task spec,
  not from the sequential ordering itself: keeping the same order but
  collapsing to one agent costs 7.96 Macro-F1 and keeping the agents but
  replacing the theory-grounded instructions with generic ones costs 8.87."
kind: observation
backing_strength: single-paper
scope_condition: 1,440 Finnish classroom collaboration clips, highly
  imbalanced labels, InternVL-3.5-8B backbone, greedy decoding, zero-shot;
  single dataset and single backbone
technique: ""
proposed_technique: Order agents by observability and script each with domain theory
technique_summary: Decomposes mental-state inference into three agents that
  predict behaviour, then cognition conditioned on behaviour, then emotion
  conditioned on both, each prompted with a self-regulated-learning task
  specification for its dimension.
technique_kind: prompting
technique_validated_by: "Macro-F1 averaged over the three dimensions on 1,440
  clips: 42.77 vs 26.84 for the best single MLLM (InternVL-3.5) and 39.28 for
  CAMEL with 3 agents on the same backbone; ablations remove the agent split
  (34.81), the SRL priors (33.90), and the video input (39.47)."
