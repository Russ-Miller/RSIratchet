arxiv_id: "2603.17508"
title: "Omni-I2C: A Holistic Benchmark for High-Fidelity Image-to-Code Generation"
url: https://arxiv.org/abs/2603.17508
drafted_at: 2026-11-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: "On image-to-code generation across Python, LaTeX, HTML, SVG and
  SMILES, a model's code execution rate and rendered-image fidelity score both
  overstate correctness: across 13 proprietary and open LMMs, execution rates
  near 90-99% coexist with parametric accuracy around 25-56%, and parametric
  accuracy lags functional-block coverage for every model."
kind: observation
backing_strength: single-paper
scope_condition: 1,080 curated image-code pairs over 5 languages, 8 subjects,
  45 figure types; code-level scores computed by an LLM parser against
  pre-extracted reference function blocks and parameters; perceptual score by
  a frontier LMM judge
technique: ""
proposed_technique: Score image-to-code on perceptual fidelity and parametric
  precision separately
technique_summary: "Evaluate generated code twice: an LMM judge rates the
  rendered image for style, layout, elements and text, while an LLM parser
  checks the code against pre-extracted reference function blocks and
  fine-grained parameters, reported as separate scores."
technique_kind: process
technique_validated_by: "Human-preference alignment on 500 ranked instances:
  the image-level prompt reached Kendall tau 0.8304 and RMSE 0.4284 with GPT
  4.1, above four prior image-level scoring prompts; code-level judge
  agreement checked against a three-judge majority vote (Kendall W 0.76).
  Parametric accuracy surfaced errors (e.g. linspace deviations) the
  perceptual score did not."
stance_on_existing: supports
related_claim_id: text-to-cad-program-generation-final-geometry-similarity-iou-against-reference-solid
stance_reason: Both find that rendered-geometry or rendered-image similarity
  fails to capture whether the generated program encodes the intended
  construction and parameters.
falsifier: Showing that parametric accuracy tracks execution rate or visual
  fidelity closely across models, or that a perceptual judge score alone
  recovers the fine-grained parameter errors the symbolic check finds.
evidence_note: Measured on 1,080 items with 13 models; the ordering (S_para <
  S_func, high Exec) is consistent across every model and language block. The
  parametric and functional scores are themselves produced by LLM judges
  against manually verified reference lists, so they are not independent of
  judge capability; no human ground truth on parameter matching is reported.
confidence: medium
