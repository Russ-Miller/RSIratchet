arxiv_id: "2609.01660"
title: How Fast Do Agents Rot? An Empirical Study of Long-Horizon Degradation
  in LLM Agents for Production Decision-Making
url: https://doi.org/10.48550/arxiv.2609.01660
drafted_at: 2026-10-22
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: For LLM agents on dependent multi-step tasks, success decays
  geometrically with the number of steps under a single per-step reliability
  parameter that rises with model scale but stays below 1, so long horizons
  eventually collapse even for the strongest deployed systems — and the decay
  tracks step count, not context length, since bounding the context window
  steepens the decay rather than easing it.
kind: mechanism
backing_strength: single-paper
scope_condition: Nine models (six open, 1.2B-671B; three proprietary deployed
  systems), four task families including an agentic tool-use loop, five
  horizons, three context regimes; 10,664 analyzed trajectories.
technique: ""
proposed_technique: Budget reliability per step instead of reporting pass rates
technique_summary: Fit a per-step reliability parameter from short-horizon
  runs and project it onto the target production horizon to predict success,
  instead of reporting aggregate benchmark pass rates.
technique_kind: process
technique_validated_by: The geometric law fit across nine models and five
  horizons; projected success falls from 0.42 at GAIA-length horizons to 0.24
  at hundred-step horizons. Not validated as an intervention that improves
  agents.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model whose success does not fall geometrically with dependent
  step count, or whose per-step reliability reaches ~1 on the agentic loop; or
  a setting where shrinking the context window flattens rather than steepens
  the decay.
evidence_note: Measured in a controlled study varying horizon, model, task
  family and context regime over 10,664 trajectories; the context-regime
  contrast is reported as a logit slope difference (-0.69 bounded vs -0.44,
  p=3e-6). The design isolates step count from context length but the per-step
  parameter is fit, not derived, and the agentic result is a single tool-use
  loop.
confidence: medium
