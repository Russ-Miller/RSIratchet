falsifier: A model that reaches high recall (say above 70%) on the same
  file-pool call-chain task under noisy context, or evidence that the low
  recall is an output-format/parsing artifact rather than missed dependencies.
evidence_note: "Measured: precision/recall/F1/EM over 169 instances, n=5
  samples, three context conditions (25% signal, 50% signal, oracle). Best
  oracle F1 was 0.663 (Gemini-2.5-Flash) with recall 0.558; exact match stayed
  under 22% for every model. Error analysis of 100 failed samples attributes
  most remaining failures to wrong answers rather than format, including under
  oracle context. No human baseline; single language (Python); ground truth
  depends on the authors' tracer being correct."
