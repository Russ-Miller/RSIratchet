capability: repository-navigation
statement: When asked to name the set of files actually invoked by a given
  test function in a Python repository, current LLMs show high precision but
  low recall — above 80% precision and under 40% recall for the larger models
  — and the recall shortfall persists even when the context contains only
  ground-truth files, indicating they catch directly imported dependencies and
  miss multi-hop ones.
kind: observation
backing_strength: single-paper
scope_condition: Seven open- and closed-source LLMs (Qwen-2.5-14B family,
  DeepSeek-R1 and distill, Qwen3-235B, GPT-4.1-Mini, Gemini-2.5-Flash) on 169
  call-chain instances from 14 Python scientific repositories, 20k-token
  context, ground-truth chains from dynamic pytest tracing.
