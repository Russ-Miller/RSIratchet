arxiv_id: "2603.20441"
title: "A Training-Free Regeneration Paradigm: Contrastive Reflection Memory
  Guided Self-Verification and Self-Improvement"
url: https://doi.org/10.48550/arxiv.2603.20441
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For frozen base models (GPT-3.5, Llama-3.1-8B, Gemma-2-9B) on
  reasoning, symbolic and domain benchmarks, regenerating an answer from
  scratch conditioned on retrieved contrastive error/correction memory beats
  iterative explain-and-fix refinement (Self-Refine, ProCo, ST-CoT, Reflexion)
  at lower inference cost, and the gap widens as the verification signal gets
  noisier because iterative rectification propagates the bad feedback through
  an extra generation step.
kind: mechanism
backing_strength: single-paper
scope_condition: Training-free setting with an offline teacher-curated memory
  built from training-set errors; evaluated on nine benchmarks across three
  base models; requires a verification step to decide when to regenerate.
technique: ""
proposed_technique: Regenerate from scratch using contrastive reflection memory
technique_summary: Offline, a teacher model reflects on base-model errors to
  build a memory of refined wrong answers, reflections, corrections and
  principles; at inference the base model retrieves relevant entries,
  self-verifies its answer against them plus an entropy check, and on failure
  regenerates once from scratch conditioned on the memory instead of editing.
technique_kind: prompting
technique_validated_by: Accuracy on nine benchmarks (GSM8K, GSM-Hard, MATH-L3,
  StrategyQA, Bamboogle, Coin, Letter, LegalBench, Headline) against
  Reflexion, ReflectEvo, Best-of-N under oracle verification (76.94 vs 70.65
  avg for GPT-3.5) and against Self-Refine/ProCo/ST-CoT without oracle (69.87
  vs 61.02); verifier F1 against five verifier baselines; speed-accuracy
  bubble plot; noise-injection sweep on oracle labels.
stance_on_existing: supports
related_claim_id: self-critique-without-grounding-unreliable
stance_reason: The paper shows unsupervised iterative self-critique loops
  (Self-Refine, ProCo, ST-CoT) gain little or degrade with more iterations,
  and substitutes retrieved external corrective examples for the model's own
  ungrounded critique.
falsifier: A matched-compute comparison in which iterative rectification with
  the same retrieved reflection memory equals or beats single-step
  regeneration, or in which the regeneration advantage disappears under noisy
  verification.
evidence_note: Measured across 3 base models x 9 benchmarks with oracle and
  non-oracle verification, plus a verification-noise sweep and a
  speed-accuracy comparison. Gains are averages of a few points; no confidence
  intervals or seed variance reported, and the offline teacher-curation cost
  is excluded from the efficiency comparison. Teacher ablation shows gains
  persist with weaker teachers.
confidence: medium
