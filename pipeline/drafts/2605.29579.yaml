falsifier: A model set where CoT raises accuracy on cross-image alteration
  tracing and dense counting by a comparable margin to its gain on
  counterfactual attribute, or where the counterfactual-attribute gain
  disappears.
evidence_note: "Measured: standard vs CoT accuracy per task for each model in
  one table. The direction is consistent across nearly all models for
  counterfactual attribute (gains) and for dense counting (losses), which is
  what makes the split credible; Alteration Tracing has two small-model
  exceptions where CoT helps. Attribution to 'visual uncertainty accumulating
  in long chains' is argued, not isolated. Sub-cause labels come from an LLM
  labelling CoT traces, not human annotation."
