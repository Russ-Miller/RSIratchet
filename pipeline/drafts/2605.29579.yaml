statement: "On adversarially edited image tasks, chain-of-thought prompting
  moves multimodal models in opposite directions depending on the
  hallucination cause: it raises accuracy on counterfactual-attribute
  questions that pit language priors against the image (up to +8.9 points
  across 13 open models) while lowering it on perception-heavy before/after
  comparison and dense counting (down to -20.1 points), so CoT is not a
  general hallucination mitigation."
kind: observation
backing_strength: single-paper
scope_condition: 13 open-weight MLLMs (Qwen2.5/3/3.5-VL, InternVL2.5/3,
  MiMO-VL, LLaVA) on 50K exam-style QA pairs over edited Visual Genome and
  FSC147 images; accuracy only, no human baseline.
