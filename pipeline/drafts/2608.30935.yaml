capability: embodied-control
statement: For monocular VLM-based navigation policies, making the model first
  emit a two-token pointing prefix (one affordance point for free space, one
  object point for the goal) on an image-plane grid and then three residual
  vector-quantized action tokens decoded to 10 SE(2) waypoints lets one
  compact 4B backbone handle instruction following, object-goal search and
  target tracking without task-specific action heads or task identifier
  tokens.
kind: mechanism
backing_strength: single-paper
scope_condition: Monocular RGB navigation with a pretrained VLM backbone
  (Qwen3-VL-4B), staged embodied-reasoning mid-training, SFT with DAgger and
  GRPO post-training; simulation benchmarks plus qualitative real-robot demos.
technique: ""
proposed_technique: Point first, then emit quantized trajectory tokens
technique_summary: Extends the VLM vocabulary with image-grid
  affordance/object pointing tokens and three-level residual vector-quantized
  action tokens, so spatial intent and precise trajectories are both decoded
  by the original language-model head.
technique_kind: architecture
technique_validated_by: Reported state-of-the-art monocular success rates
  across 10 public navigation simulation settings (R2R/RxR val-unseen, MP3D
  and HM3D v1/v2 ObjectNav, HM3D-OVON, EVT-Bench STT/DT) with one checkpoint
  and no benchmark-specific fine-tuning; the tokenizer's 0.72 cm average
  displacement error versus 2.48 cm for a single-level 4096-entry planning
  vocabulary; embodied-reasoning checkpoint scored on 8 spatial benchmarks. No
  ablation isolating the pointing prefix is shown in the given text.
