falsifier: An ablation removing the pointing prefix (action tokens only)
  matching or beating the full model on the same navigation settings, or the
  unified single-backbone model failing to match task-specific policies on any
  of the three task families.
evidence_note: Measured on 10 simulation settings plus 8 reasoning benchmarks,
