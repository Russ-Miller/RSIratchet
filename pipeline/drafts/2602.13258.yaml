arxiv_id: "2602.13258"
title: "MAPLE: A Sub-Agent Architecture for Memory, Learning, and
  Personalization in Agentic AI Systems"
url: https://doi.org/10.48550/arxiv.2602.13258
drafted_at: 2026-11-20
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-term-memory
statement: For a chat assistant over a 10-turn dialogue, extracting user
  traits from earlier turns into a stored profile asynchronously and injecting
  the relevant subset at generation time raises LLM-judged trait incorporation
  on later, topically unrelated queries compared with a stateless same-model
  baseline.
kind: observation
backing_strength: single-paper
scope_condition: 150 synthetic personas with 5 sampled traits each, 10-turn
  conversations generated by an LLM, evaluation only on the last 2 turns,
  scored by an LLM judge from the same model family as the generator
technique: ""
proposed_technique: Split memory, learning and personalization into separate sub-agents
technique_summary: Keep storage/retrieval, asynchronous trait extraction from
  finished sessions, and request-time selective context injection as three
  distinct components, so learning runs outside the request path and only
  relevant stored preferences enter the prompt.
technique_kind: process
technique_validated_by: "LLM-as-judge (Claude 3 Haiku) personalization score
  on 150 synthetic personas: 4.17 to 4.78 of 5 (Welch t=6.05, p<0.001, Cohen's
  d=0.95), trait incorporation 45% to 75%, perfect scores 15% to 88%, against
  the same LLM with no persistent memory"
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Human raters, or judges from a different model family, find no
  reliable difference in trait-appropriate responses between the decomposed
  system and a baseline that simply appends the prior 8 turns to the prompt.
evidence_note: "Measured, but weakly: fully synthetic personas and
  conversations, LLM judge from the same vendor family as the generator, and
  the baseline is stateless rather than a full-history-in-context control, so
  the result does not isolate the decomposition from simply having the earlier
  turns available. No ablation separating the three sub-agents."
confidence: low
