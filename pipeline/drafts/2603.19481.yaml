arxiv_id: "2603.19481"
title: Narrative Aligned Long Form Video Question Answering
url: https://doi.org/10.48550/arxiv.2603.19481
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: On open-ended narrative QA over full-length (80-200 minute) movies
  where each question is grounded in multiple scattered evidence spans,
  7B-class video MLLMs score low and roughly flat across short-, medium- and
  far-separated evidence (around 26-35 on a judged 4-dimension scale), so
  difficulty here tracks finding and integrating dispersed evidence rather
  than the temporal distance between the pieces.
kind: observation
backing_strength: single-paper
scope_condition: 88 LSMDC movies, 4,442 generative QA pairs with ~3.9 evidence
  spans each, scored by an LLM judge on comprehensiveness, depth, evidence
  grounding and reasoning; 7B open video models, plus description-fed LLMs
  which score far higher (Claude Sonnet 4.5 ~62 average).
technique: ""
proposed_technique: Group clips into narrative memory slots, then retrieve
technique_summary: An MLLM assigns each clip to a narrative slot by temporal
  coherence and semantic similarity, and query-clip CLIP scores are boosted by
  the score of the slot the clip belongs to before top-k retrieval for the
  answering model.
technique_kind: retrieval
technique_validated_by: Judged four-dimension scores on NA-VQA against
  zero-shot and fine-tuned Qwen2.5-VL-7B and long-form VLM baselines; full
  model 35.74 average vs 33.79 fine-tuned Qwen2.5-VL, with ablation removing
  narrative grouping costing most on far-distance evidence grounding (35.10 to
  32.70).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled run on the same benchmark showing per-model scores
  fall monotonically as evidence separation grows from short to far, or
  showing that short-distance questions are solved at a much higher rate than
  far ones by the same 7B models.
evidence_note: Measured across ~11 open video models plus three
  description-fed LLMs on one benchmark the authors built; the flat distance
  profile is read off a single table with no significance testing, and the
  distance bins are defined by the authors' own generation pipeline, so bin
  difficulty is not independently controlled. The proposed framework's gain is
  about 2 points on the same self-built benchmark.
confidence: low
