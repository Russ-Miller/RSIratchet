related_claim_id: external-feedback-repair-works-only-with-real-grounding
stance_reason: The authors attribute the saturation to the agent invoking a
  real C++ compiler for syntactic and functional self-verification at
  inference time, an external grounding signal absent in the zero-shot
  baseline.
falsifier: A rerun of the same 85 HLS-Eval generation tasks with the same
  harness and models showing pass@10 well below 100% through synthesis, or
  showing the weaker model gaining no more from k=10 sampling than the larger
  one.
evidence_note: Measured pass@k at parse, compile, testbench and synthesis
  stages on 85 designs with 10 samples each, for two models only; no zero-shot
  control run is reported in this text, so the compiler-access attribution is
  argued rather than ablated, and no commercial models are tested.
