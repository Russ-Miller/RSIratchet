arxiv_id: "2605.16358"
title: "LEAF: A Living Benchmark for Event-Augmented Forecasting"
url: https://doi.org/10.48550/arxiv.2605.16358
drafted_at: 2026-11-02
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: In living forecasting benchmarks that retrieve auxiliary news by
  automated search, a measurable share of retrieved events leak post-cutoff
  outcomes (retrospective summaries, misdated articles) unless the retrieval
  is filtered, and requiring two independent fact-checking agents to agree on
  both factual authenticity and publication date cuts that leakage
  several-fold.
kind: observation
backing_strength: single-paper
scope_condition: Event-augmented forecasting across five domains (markets,
  commodities, electricity, weather, Polymarket events); leakage judged by
  domain experts on 500 sampled tasks.
technique: ""
proposed_technique: Filter retrieved events by dual-agent date and authenticity consensus
technique_summary: Retrieved auxiliary events are kept only when two
  independently prompted fact-checking agents (different model families) agree
  on both the event's factual authenticity and its public release date,
  discarding anything discordant.
technique_kind: retrieval
technique_validated_by: "47 domain experts (mean 13.6 years experience)
  audited 500 tasks: unfiltered automated search matched verified publication
  dates in 61.0% of tasks and leaked future information in 8.6%; with the
  dual-agent filter, date accuracy rose to 81.0% and leakage fell to 1.6% (8
  tasks), 5 of which were off by one calendar day against 3- and 7-day
  horizons. 1.6% of surviving events were judged fabrications, with 0%
  false-negative exclusion."
stance_on_existing: supports
related_claim_id: llm-based-forecasting-systems-reported-benchmark-gains-often-cannot-be
stance_reason: It measures one of the named confounds directly — retrieval
  that reveals post-cutoff outcomes — and shows it occurs at a non-trivial
  rate in unaudited automated search.
falsifier: An expert audit of unfiltered automated retrieval in these domains
  finding leakage at or below the filtered rate, or a dual-agent consensus
  filter that fails to reduce measured leakage relative to single-agent or no
  filtering.
evidence_note: Measured by human expert annotation on 500 tasks (100 per
  domain) against a no-filter baseline on the same pipeline. Isolates the
  filter's effect on leakage and date accuracy but not its effect on recall of
  genuinely useful events beyond the reported 0% false-negative rate; leakage
  was concentrated in one domain (electricity), so the 1.6% figure may not
  transfer to other domain mixes. Fact-checkers were Gemini 3.1 Pro and Claude
  4.6 Sonnet; whether weaker checker pairs reach the same rate is untested.
confidence: medium
