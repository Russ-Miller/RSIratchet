arxiv_id: "2608.21664"
title: Measuring Activation Control in Large Language Models
url: https://doi.org/10.48550/arxiv.2608.21664
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: strategic-deception
statement: Across 25 open-weight instruction-tuned models (4B-744B), the
  ability to modulate a named concept's residual-stream projection on plain
  instruction does not track parameter count or recency — the best scorer is
  an 8B 2024 model and some of the newest models score lowest — while within a
  single model line the score rises steadily across ordinary pre-training and
  post-training checkpoints, so activation controllability is acquired
  incidentally and must be measured per model rather than inferred from scale.
kind: observation
backing_strength: single-paper
scope_condition: Open-weight instruction-tuned models; simple concrete
  concepts (e.g. bread) embedded in a verbatim transcription task; greedy
  decoding; no fine-tuning or prompt search, so estimates are elicitation
  floors.
technique: ""
proposed_technique: Benchmark instructed control over a model's own activations
technique_summary: Prompts a model to think about, suppress, dial, time-place
  or layer-target a concept while transcribing a fixed sentence, and scores
  six residual-stream projection measures into one conjunctive controllability
  score.
technique_kind: process
technique_validated_by: Applied to 25 open-weight models with
  cluster-bootstrap CIs; scores ranged 0.059-0.538, and suppression trials
  evaded linear probes, Jacobian lens, activation oracles and NL autoencoders
  (detection 5-21% at 1% FPR) while engagement was caught near ceiling.
stance_on_existing: supports
related_claim_id: open-weight-instruction-tuned-models-told-plain-language-think-about-concept
stance_reason: Same experiments show instructed suppression evading four
  monitor families, and add that the capability is unrelated to scale and
  accumulates over training checkpoints.
falsifier: A broader model panel in which controllability score correlates
  strongly with parameter count or release date, or Olmo-style checkpoint
  series where the score is flat or falls across pre- and post-training.
evidence_note: Measured on 25 models from seven families with 50 sentences x
  10 concepts and two-way cluster bootstrap; the training-trajectory result
  rests on point estimates for only two Olmo lines with no confidence
  intervals, and concepts are deliberately benign rather than safety-relevant.
confidence: medium
