arxiv_id: "2608.08569"
title: "VoxZip: Semantic-Anchored Temporal KV Cache Compression for
  Long-Context Audio Inference"
url: https://doi.org/10.48550/arxiv.2608.08569
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For speech LLMs on long audio, text-centric KV cache eviction
  methods (StreamingLLM, SnapKV, PyramidKV, ChunkKV) collapse because raw
  audio tokens have diffuse attention; anchoring compression on ASR
  transcripts — pooling each transcribed audio span down to its text-token
  length and adding the text embedding, while keeping untranscribed audio
  intact — retains over 90% of full-cache accuracy at a 5-10% cache budget
  where those baselines retain roughly 55-67% at a looser 25% budget.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3-Omni-30B (Instruct and Thinking) on six audio
  benchmarks; needs an auxiliary ASR model with timestamps and confidence
  scores; degrades with noisy or accented speech.
technique: ""
proposed_technique: Compress audio KV cache around ASR transcript anchors
technique_summary: Slice the acoustic feature sequence by ASR timestamps,
  average-pool each transcribed span to its text length and add the aligned
  text embedding, keep untranscribed spans raw, then evict remaining tokens by
  attention scores accumulated with a temporal decay factor.
technique_kind: architecture
technique_validated_by: Accuracy against a Full-KV baseline and four
  text-domain KV compression baselines across Vox-Infinity, AudioMarathon,
  SPIRAL-Hard, MMAR, MMSU, MMAU, plus ablations removing semantic anchoring,
  removing untranscribed segments, text-only input, and sweeping the decay
  factor; efficiency measured at 64K context including ASR overhead.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On another speech LLM backbone, ASR-anchored compression retains no
  more of the full-cache score at a 5-20x budget than SnapKV/PyramidKV, or the
  semantic-anchoring ablation shows the gain comes from the decay rule alone.
evidence_note: Measured on one backbone family (Qwen3-Omni-30B) across six
  benchmarks with four compression baselines; ablations isolate the anchoring
  stage (PM subset 6.4% without vs 81.6% with at 15% budget) and the decay
  factor. Reported accuracy sometimes exceeds the uncompressed baseline, which
  suggests the ASR text is adding information rather than only compressing —
  so the comparison is not a pure compression-fidelity test. Single paper, no
  independent replication.
confidence: medium
