arxiv_id: "2609.21521"
title: "VidOmni-Bench: A Benchmark for Fine-Grained Video Understanding via
  Spatio-Temporal Event Verification across Complexity and Duration"
url: https://doi.org/10.48550/arxiv.2609.21521
drafted_at: 2026-09-27
