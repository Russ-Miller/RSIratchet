capability: video-temporal-reasoning
statement: When Video-LLMs are asked to verify sentence by sentence whether a
  dense video caption is supported by the video, they detect hallucinated
  sentences less often in captions they generated themselves than in captions
  from other models, and detection of temporal errors (action, order,
  causality, frequency, state change) improves much less with model scale than
  detection of static-frame errors.
kind: observation
backing_strength: single-paper
scope_condition: 500 videos, 4s to 90min, five spatio-temporal complexity
  types; captions generated by five Video-LLMs with human sentence-level
  labels; open models 2B-72B plus Gemini 3 Flash and GPT-5 mini.
