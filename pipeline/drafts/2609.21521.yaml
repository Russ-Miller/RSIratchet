falsifier: A Video-LLM that scores the same or better F1 on verifying its own
  captions as on other models' captions on the same videos, or a model family
  where scaling raises recall on temporal error categories as much as on
  static ones.
evidence_note: "Measured: per-sentence precision/recall/F1 averaged over
  video-caption pairs, cross-source vs self-source heatmap, and recall-gain
  heatmap across three model families. Best model (Gemini 3 Flash) F1 above 40
  on other models' captions and roughly half that on its own. All models score
  far below ceiling (best F1 ~42), so the self-preference gap is measured in a
  low-absolute-performance regime. No control for caption style differences
  between generators."
confidence: medium
