status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: In multi-turn search agents trained by RL, correctness along a
  trajectory is non-monotonic — the same intermediate prefix can lead to
  success or failure depending on the continuation — so supervision that
  resamples continuations from a shared late-stage prefix and keeps only
  outcome-divergent pairs gives better credit assignment than uniform outcome
  rewards or state-value process rewards.
kind: mechanism
backing_strength: single-paper
scope_condition: 4B-7B Qwen backbones on multi-hop QA search tasks (Search-R1,
  ASearcher) and a 50-step embodied text benchmark (ALFWorld); all methods
  warm-started from the same SFT checkpoint and matched on wall-clock training
  cost.
technique: ""
proposed_technique: Resample from a prefix and train on outcome-divergent branches
technique_summary: Truncate a completed agent trajectory at a late-stage step,
  resample continuations from that prefix, keep only branches whose outcome
  differs from the original, and apply group-relative advantages separately to
  the shared prefix (averaged branch return) and to the diverging suffixes.
technique_kind: training
technique_validated_by: "EM/F1 and LLM-as-a-Judge on 2WikiMQA, HotpotQA,
  MuSiQue, Bamboogle against GRPO, process-reward (GiGPO, StepSearch,
  CriticSearch, ReasonRAG) and branch-sampling (Tree-GRPO, ARPO, AEPO)
  baselines: +3.3 EM / +4.5 F1 average over the best prior method under
  Search-R1; 93.6 vs 90.8 (GiGPO) on ALFWorld; ablations removing
  difficulty-aware sampling (-1.9 F1) and redundant-step masking (-0.9 F1)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Resampling 32 continuations from a fixed late-stage prefix yields
  essentially the same outcome each time (Pass@32 close to Pass@1), or
  outcome-divergent branch training fails to beat matched-cost GRPO on
  long-horizon agent benchmarks.
evidence_note: "Measured. The non-monotonicity probe is direct: 1K-example
  subsets of HotpotQA and 2WikiMultihopQA, truncate before the final answer
  step, resample 32 continuations, Pass@32 exceeds Pass@1 by 10-25%. The
  training gains are measured against many baseline families at matched
  wall-clock cost, but only two backbones and one model family (Qwen), and the
  LLM-as-a-Judge metric is itself model-scored. The design does not separate
  the contrastive-branch mechanism from the hierarchical advantage
  normalization that ships with it."
confidence: medium
