arxiv_id: '2510.02816'
title: 'NCV: A Node-Wise Consistency Verification Approach for Low-Cost Structured Error Localization
  in LLM Reasoning'
url: https://arxiv.org/abs/2510.02816
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: multi-step-reasoning
statement: Verifying a chain of thought by decomposing it into nodes and asking binary consistency
  questions per node localizes errors better than judging the whole chain at once (F1 up 10-25%
  over CoT-based verifiers, error-localization accuracy far above an 8-vote end-to-end judge)
  while using 6-58 times fewer tokens, because whole-chain judging dilutes attention and multi-sampling
  pays for long generations.
kind: mechanism
backing_strength: single-paper
scope_condition: Public multi-step reasoning datasets, training-free verification with open
  models, 2025; F1 and localization accuracy versus CoT verifiers and voting.
technique: ''
proposed_technique: Node-wise binary consistency checks for chain verification
technique_summary: Split a reasoning chain into dependent nodes, check each node's consistency
  with its inputs by a yes/no query, and report the first failing node, instead of asking a
  verifier to read and judge the entire chain.
technique_kind: process
technique_validated_by: F1 and error-localization accuracy against end-to-end CoT verifiers
  with and without voting, with token counts, on public datasets.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Chains where the error is global (wrong strategy) and every node is locally consistent.
evidence_note: Method paper; the cost ratio is large and the attention-dilution explanation
  is plausible but not directly tested.
confidence: medium
