capability: audio-understanding
statement: "In encoder-projector-decoder audio-language models, speaking style
  is linearly decodable from late audio-encoder layers at about 82-85% on a
  7-way style task, yet open-ended tone prediction at the output reaches only
  about 20-54%, and which end of that range a model lands on tracks its
  training objective rather than its encoder: a model trained to generate
  speech keeps acoustic sensitivity through the decoder while
  text-only-trained siblings with a nearly identical encoder answer from the
  words instead."
kind: mechanism
backing_strength: single-paper
scope_condition: Four open models (Whisper-large-v2, Qwen2-Audio-7B-Instruct,
  Qwen2.5-Omni-7B, Chroma-4B) on the Expresso dataset with fixed text and 7
  speaking styles, four speakers, mean-pooled representations, text outputs
  only.
