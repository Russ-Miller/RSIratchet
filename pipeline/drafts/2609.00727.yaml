falsifier: An audio-language model trained only for text prediction whose
  output tone accuracy matches its late-encoder probe accuracy, or a
  speech-generating model whose decoder shows the same content-driven leakage
  ratio as its text-only counterpart with the same encoder.
evidence_note: "Measured: layerwise linear probes with leave-one-speaker-out,
  CKA, per-style open-ended tone accuracy, and an NMI-based content/style
  leakage ratio (0.977 Qwen2-Audio vs 0.272 Omni). The Qwen2-Audio/Omni pair
  holds encoder roughly fixed and varies objective, which is the strongest
  part of the design; only one model per objective type, four speakers, one
  dataset, and the leakage ratio's absolute values are entropy-biased."
