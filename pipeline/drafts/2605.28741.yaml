arxiv_id: "2605.28741"
title: Self-Prophetic Decoding to Unlock Visual Search in LVLMs
url: https://doi.org/10.48550/arxiv.2605.28741
drafted_at: 2026-10-31
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fine-tuning-retention
statement: In vision-language models post-trained for visual search,
  single-step intrinsic abilities degrade (grounding by about 49% and spatial
  understanding by about 11% at a fixed reasoning turn), and pairing the
  post-trained model at decoding time with its own pre-post-training base —
  accepting the base's proposed tokens only when they are consistent with the
  post-trained model's own distribution — recovers accuracy on visual-search
  and general VQA benchmarks, while injecting the base's output as a textual
  prompt does not and often scores below the post-trained model alone.
kind: mechanism
backing_strength: single-paper
scope_condition: Intrinsic-extension visual-search LVLMs (Pixel Reasoner,
  DeepEyes, Mini-o3) built on Qwen2.5-VL; high-resolution visual search and
  general VQA; prophet is the same base model family, 3B or 7B.
technique: ""
proposed_technique: Accept base-model tokens only if the post-trained model agrees
technique_summary: At each reasoning turn, the pre-post-training base model
  generates single-step grounding-verification or answer prefixes, and the
  post-trained search model accepts those tokens in parallel only where a
  weighted product of both models' token probabilities exceeds a threshold,
  resuming its own decoding at the first rejection.
technique_kind: decoding
technique_validated_by: Accuracy on 12 splits of 4 visual-search benchmarks
  (VisualProbe-test, V* Bench, HR-Bench 4K/8K) against the unmodified
  post-trained baselines (gains +0.5 to +4.4 points) and on MME-RealWorld,
  ScienceQA, OCRBench, CVBench; ablated against a naive prompting interface
  (46.2 vs 50.5 on VisualProbe hard), against removing each of the two prophet
  modes, and across thresholds 0.2-0.35; acceptance rate 74-81%, speedup
  1.03-1.07x.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Measuring the same single-step capabilities before and after
  visual-search post-training and finding no degradation, or finding that the
  token-acceptance interface gives no gain over feeding the base model's
  output as a prompt prefix on these benchmarks.
evidence_note: Measured on three post-trained baselines across 12 benchmark
  splits, with a naive-prompting control, per-module ablations, threshold
  sweep and alpha-schedule sweep. Degradation figures come from a single-turn
  probe at one selected reasoning step, which does not isolate whether that
  step is representative. Only one base family (Qwen2.5-VL) is tested, so the
  'same-family distribution alignment' explanation for the mechanism is argued
  rather than isolated. Gains are mostly 1-4 points.
confidence: medium
