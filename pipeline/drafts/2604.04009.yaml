falsifier: A VLM scoring near-ceiling on the same benchmark, or showing no
  accuracy decline with diagram complexity and no gap between label-reading
  and relation-grounding subtypes.
evidence_note: "Measured: per-subtype accuracy, MAE and tolerance accuracy for
  counting, precision/recall/F1 plus subset/superset rates for retrieval. Best
  model gemini-3-flash-preview 70.18%, worst gpt-4o-mini 17.77%; ER easiest,
  behavioral hardest. A separate 60-case hard set shows all models below 40%
  on non-rightward and overlapping arrows. Diagrams come from public sources,
  so contamination is argued away rather than controlled; questions are
  template-generated, so subtype difficulty may partly reflect template
  phrasing."
