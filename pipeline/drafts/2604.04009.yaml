statement: On software architecture diagrams (behavioral, structural, ER)
  paired with counting and retrieval questions, current VLMs read visually
  explicit labels and locally grouped elements fairly well but fail at
  relational grounding — associating an attribute, method or label with the
  correct structural element — and accuracy falls as the number of entities
  and relations grows, with the best of 11 models reaching only about 70%
  overall.
