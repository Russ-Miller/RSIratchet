capability: visual-grounding
statement: In 7-8B open vision-language models (LLaVA-1.5, Qwen2.5-VL,
  InternVL3), the single hidden-state direction used for contrastive-decoding
  hallucination mitigation works better when it is trained with an adversary
  that actively removes label-predictive signal from the orthogonal residual
  than when it is trained as a plain linear probe, because the probe direction
  leaves truthful semantics entangled with the penalised component.
kind: mechanism
backing_strength: single-paper
scope_condition: 7-8B open LVLMs; direction learned on binary consistency
  labels from POPE/AMBER-style yes/no probes at a middle-to-late layer;
  intervention applied as dual-forward-pass contrastive decoding
technique: ""
proposed_technique: Purge hallucination signal from the orthogonal residual adversarially
technique_summary: Learn a unit hallucination direction by jointly training a
  classifier on the projection of the hidden state onto it and an adversary,
  via a gradient reversal layer, that is prevented from predicting the same
  label from the orthogonal residual, then use that direction for contrastive
  decoding.
technique_kind: decoding
technique_validated_by: POPE/AMBER/CHAIR/HallusionBench plus four utility
  benchmarks on three LVLMs against VCD, ASD, TruthPrInt, VASparse, PruneHal;
  the \u03bb=0 ablation (equivalent to a plain linear probe) is reported as
  giving suboptimal mitigation and utility loss, with \u03bb=1.0 best
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Setting the adversarial weight to zero (plain probe direction)
  while holding layer, steering strength and contrastive weight fixed yields
  equal or better hallucination rates and utility scores across the same
  models.
evidence_note: Measured on three LVLMs across eight benchmarks, but the \u03bb
  ablation is reported only as a curve on POPE with no numbers in this text,
  and the headline gains bundle the adversarial objective with the
  contrastive-decoding step; the design does not isolate how much of the
  advantage over ASD/TruthPrInt comes from the adversary specifically.
