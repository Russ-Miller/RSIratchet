capability: embodied-control
statement: For memory-augmented VLA manipulation policies that must actively
  move the viewpoint to find task-relevant evidence, writing one memory frame
  at each fixed action-chunk boundary generalizes better than event-triggered
  writing (on predicted subtask change or on gripper/head/torso motion), and
  extra memory capacity helps only under the regular schedule —
  event-triggered policies degrade further out of distribution because
  mistimed triggers omit informative views and control jitter fills memory
  with redundant frames.
kind: mechanism
backing_strength: single-paper
scope_condition: 35 simulated active-perception manipulation tasks on a
  dual-arm humanoid with controllable head/torso, 100 training trajectories
  per task, ID and OOD (new backgrounds, denser clutter) splits; single
  framework (StarVLA/OFT head).
technique: ""
proposed_technique: Write memory frames on a fixed chunk schedule, not on events
technique_summary: Append one observation frame to the policy's visual memory
  at every action-chunk boundary instead of triggering writes on predicted
  subtask changes or motion thresholds.
technique_kind: architecture
technique_validated_by: "Task success rate across 35 tasks: chunk writing
  62.97 ID / 47.60 OOD at 12 frames vs subtask writing 28.11 / 16.00 and
  motion writing 32.80 / 22.69; memory-free baseline 27.37 / 6.12. Capacity 6
  to 12 helped chunk writing but hurt motion writing in most settings."
