falsifier: On the same or comparable active-perception manipulation
  benchmarks, an event-triggered write policy (with stable triggers) matching
  or beating fixed chunk-boundary writing OOD, or increasing capacity
  improving event-triggered variants as much as chunk-based ones.
evidence_note: "Measured: six write-policy/capacity variants plus a
  memory-free baseline, 50 seeds per task per setting, all other components
  held fixed (same instruction, 18-D proprioception, OFT head, subtask
  supervision). The mechanism (mistimed triggers, jitter noise) is argued from
  failure cases and a failure-state decomposition, not isolated by a
  controlled jitter experiment. Single simulator and one action-head family
  for the ablation."
