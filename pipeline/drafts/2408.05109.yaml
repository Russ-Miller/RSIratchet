statement: "On text-to-SQL benchmarks, aggregate accuracy hides a steep
  difficulty gradient: pre-trained-language-model-based parsers resolved
  roughly 80% of Spider cases overall but only about 50% of its extra-hard
  cases, and as natural-language understanding improved the residual errors
  shifted toward database-side problems — large schemas, ambiguous columns,
  dirty cell values — rather than language parsing."
