arxiv_id: "2603.06801"
title: "Breaking the Martingale Curse: Multi-Agent Debate via Asymmetric
  Cognitive Potential Energy"
url: https://doi.org/10.48550/arxiv.2603.06801
drafted_at: 2026-11-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: On question subsets deliberately selected so that a single agent's
  majority answer is wrong, scoring each debate agent by how accurately it
  predicts its peers' belief distribution and exponentially upweighting the
  best predictors recovers the correct minority answer more often than
  majority voting or uniform-weight debate, but the gain is unstable across
  datasets and round counts.
kind: observation
backing_strength: single-paper
scope_condition: Multiple-choice benchmarks (ARC-C, LogiQA, MMLU-Pro,
  TruthfulQA, MedQA, BBH) restricted to items a single agent reliably fails; 5
  agents from one backbone with induced heterogeneity; 2-5 debate rounds.
technique: ""
proposed_technique: Weight debate agents by how well they predict peers' beliefs
technique_summary: Each round, agents privately submit both their own answer
  distribution and a prediction of the average peer distribution; Brier-score
  accuracy of the peer prediction exponentially updates each agent's influence
  weight in the final aggregation.
technique_kind: process
technique_validated_by: Average accuracy over six challenging subsets vs
  majority voting, decentralized/centralized/sparse MAD, and single agent, on
  GPT-4o-mini (49.92% at T=3 vs 29.61% best baseline) and Qwen3-235B;
  ablations replacing peer prediction with self-confidence or uniform weights
  lose most of the gain. Per-dataset results include losses (e.g. MedQA
  60.97->27.10 at T=3 on Qwen3) and non-monotonic behaviour in round count and
  agent count.
stance_on_existing: supports
related_claim_id: llm-multi-agent-networks-where-correct-minority-peer-disagrees-agreeing
stance_reason: Both find that a second-order signal about what a peer should
  believe, rather than first-order confidence or agreement, is what isolates a
  correct minority agent.
falsifier: On the same majority-wrong subsets, weighting by peer-prediction
  accuracy fails to beat uniform-weight debate once agent heterogeneity and
  round count are matched, or the gain disappears when the truth-holder is not
  deliberately constructed by persona/temperature manipulation.
evidence_note: Measured on six benchmarks with four backbones, against voting
  and three debate topologies, with ablations isolating the second-order
  prediction term. But the 'truth-holder' minority is manufactured by the
  authors' own heterogeneity recipe rather than arising naturally, aggregate
  averages hide large per-dataset regressions, and round count T=3 is selected
  post hoc as optimal.
confidence: low
