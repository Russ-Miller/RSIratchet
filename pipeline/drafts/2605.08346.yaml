arxiv_id: "2605.08346"
title: Sanity Checks for Long-Form Hallucination Detection
url: https://doi.org/10.48550/arxiv.2605.08346
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: Black-box hallucination detectors that score chain-of-thought
  traces lose or invert their discriminative power when the final answer is
  replaced with ground truth or the answer-announcement step is deleted while
  the reasoning body is left intact, so AUC measured on unperturbed traces
  partly reflects endpoint cues rather than assessment of the reasoning.
kind: observation
backing_strength: single-paper
scope_condition: Black-box sampling-based detectors (exact-match repetition,
  NLI non-contradiction, BERTScore consistency, cosine similarity, semantic
  negentropy, RACE, SEU) over 10 sampled traces, on four benchmarks with
  canonical answers (BBH-Tracking, GPQA Diamond, MATH-500, CausalT5K) and five
  models.
technique: ""
proposed_technique: Force or remove the final answer to test trace detectors
technique_summary: Evaluate a reasoning-trace hallucination detector twice on
  the same traces — once with the final answer replaced by ground truth and
  canonicalized, once with answer-announcement steps deleted — and treat large
  AUC shifts from the unperturbed score as evidence the detector reads the
  endpoint rather than the reasoning.
technique_kind: process
technique_validated_by: Applied across 7 baseline scorers x 5 models x 4
  benchmarks, reporting AUC under Force vs Remove; several baselines shifted
  by over 20 points (RACE 76.17 Force to 54.67 Remove on
  BBH-Tracking/Gemma-3-27B; 24.28 vs 59.01 on GPQA Diamond), while NSN sat at
  chance under Force and rose to 77-80 under Remove on MATH-500. A
  lexical-trajectory scorer (TRACT) computed after answer removal gave
  near-identical scores under both and stayed competitive in absolute AUC.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Detectors whose reported AUC is attributed to reasoning assessment
  hold their scores within noise under both Force and Remove across models and
  benchmarks; or showing the perturbations themselves alter the reasoning
  body's statistics enough to explain the shifts.
evidence_note: "Measured: AUC tables for 8 scorers across 4 benchmarks x 5
  models, plus a step-wise prefix-revelation sensitivity analysis showing EMR
  and RACE spike at the answer-reveal step. The design isolates endpoint
  dependence but cannot show a stable detector actually verifies intermediate
  steps, as the authors note. All tasks have canonical short answers; no
  open-ended generation tested. No independent replication."
confidence: medium
