stance_on_existing: contests
related_claim_id: rlhf-tuned-chat-models-raw-conditional-probabilities-consistently-overconfident-confidence
stance_reason: This paper finds instruction-tuned models' verbalized
  confidence has significantly larger expected calibration error than base
  models' (0.287 vs 0.191) and only weak instance-level agreement with
  internal probabilities, cutting against the claim that verbalized confidence
  is better calibrated than conditional probabilities.
falsifier: Measuring per-instance correlation between verbalized score and
  option-token probability across a comparable model set and finding
  consistently strong association (e.g. r above 0.5), or finding
  instruction-tuned models have lower linguistic ECE than their base
  counterparts.
evidence_note: Measured over 30 models x 10 tasks with three axes
  (Pearson/Spearman, Euclidean distance, ECE) and paired t-tests; ECE
  difference significant (p=2.5e-8), correlation difference not (p=0.054).
  Regression attributes most variation to confidence-score dispersion and mean
  rather than model metadata. Logit softmax over options is a proxy, not
  ground-truth uncertainty, so the result is cross-channel fidelity plus a
  separate correctness-calibration measure; confidence elicited in the same
  turn as the answer, not post-hoc.
