arxiv_id: "2608.28382"
title: When Linguistic and Internal Confidence Diverge in Large Language Models
url: https://doi.org/10.48550/arxiv.2608.28382
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: Across 30 open LLaMA/Mistral/Qwen models and 8 classification
  tasks, a model's self-reported numeric confidence tracks its own logit-based
  confidence only weakly at the instance level (mean Pearson r about 0.135)
  even though setting-level averages of the two correlate moderately, and
  instruction-tuned models show larger linguistic-vs-internal gaps and worse
  calibration error than base models.
kind: observation
backing_strength: single-paper
scope_condition: Open-weight base and instruction-tuned models from three
  families; classification tasks with a fixed candidate set where logits over
  options are extractable, plus two generation tasks using semantic entropy as
  the proxy; confidence elicited as a 0-10 score in the same response as the
  answer.
technique: verbalized-confidence-after-listing-alternatives
