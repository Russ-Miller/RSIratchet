arxiv_id: "2608.27746"
title: NormasTCU --- A Brazilian Portuguese IR Dataset and an Evaluation of
  LLM-as-a-Judge for Relevance Assessment
url: https://doi.org/10.48550/arxiv.2608.27746
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: When LLMs are used as relevance judges on a specialized non-English
  (Brazilian Portuguese legal) retrieval collection, they assign
  systematically higher relevance grades than human experts (mean absolute
  error 0.46-0.66 on a 0-2 scale, Cohen's kappa with humans only 0.32-0.53),
  yet the resulting system rankings stay close to the human reference for
  rank-aware metrics (nDCG@10, MRR, Kendall's tau >= 0.90) and diverge for
  P@10 and R@10.
kind: observation
backing_strength: single-paper
scope_condition: 46 queries, 812 judged query-document pairs, 15 retrieval
  systems (8 BM25 variants), three proprietary LLMs with two prompt styles;
  small collection where precision/recall metrics are known to be unstable.
