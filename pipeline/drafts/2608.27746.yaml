falsifier: A larger Portuguese or other non-English specialized collection
  where LLM-generated qrels produce nDCG@10 or MRR rankings with Kendall's tau
  well below 0.9 against aggregated human qrels, or where LLM judges show no
  positive grading bias.
evidence_note: "Measured on one dataset the authors built: 3,048 human
  judgments from four experts aggregated into reference qrels, compared
  against six LLM-annotator configurations; bootstrap CIs over 46 queries
  often did not stay above tau=0.9, and the system pool is dominated by
  closely related BM25 variants, so ranking agreement is partly a property of
  a low-diversity pool. No fix proposed."
