arxiv_id: "2601.10228"
title: "Optimizing Multimodal LLMs for Egocentric Video Understanding: A
  Solution for the HD-EPIC VQA Challenge"
url: https://doi.org/10.48550/arxiv.2601.10228
drafted_at: 2026-11-17
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For a 7B multimodal model on hour-scale egocentric video QA, where
  the model's frame cap (768 frames) under-samples videos longer than ~12
  minutes, a two-stage pipeline that first extracts, crops, concatenates or
  chunk-narrates the relevant temporal context and only then poses the
  question scores higher than asking the temporal question directly in a
  single pass.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B-Instruct fine-tuned on egocentric kitchen
  video, evaluated on HD-EPIC VQA's 30 question prototypes; the gain is
  bundled with domain fine-tuning in the reported ablation, and scaling the
  same pipeline to a 32B variant gave no proportional gain.
technique: ""
proposed_technique: Extract and summarize the temporal window, then ask the question
technique_summary: Before answering, resolve bounding boxes to noun phrases,
  crop to a short window around the referenced event, concatenate multi-clip
  options onto one re-normalized timeline, and for long videos narrate
  10-minute chunks and prepend the ordered narrations to the question.
technique_kind: prompting
technique_validated_by: Reported +3.0% overall accuracy over direct VQA with
  the same pre-processing; the combined fine-tuning/T-CoT ablation moves
  overall accuracy from 37.5% to 41.6% on HD-EPIC VQA, with the largest
  per-prototype gains on localization and ordering tasks.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same benchmark and backbone, a single-pass prompt given the
  same frame budget matching or exceeding the two-stage pipeline's accuracy on
  localization and ordering prototypes, or the gain disappearing once frame
  budget is raised so the full video fits in one pass.
evidence_note: Single workshop-challenge system paper; measured on one
  benchmark with one backbone. Ablations are coarse (fine-tuning and T-CoT
  removed together, so the +3.0% T-CoT figure is stated in text rather than
  isolated in the table). No comparison against simply increasing the frame
  budget, so the mechanism claim (under-sampling drives the failure) is argued
  more than isolated.
confidence: low
