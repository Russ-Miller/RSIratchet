capability: code-generation
statement: When an agent generates a whole Python repository from
  natural-language requirements with no given architecture, keeping the
  repository architecture as a mutable state that is re-evolved before code
  generation yields higher functionality coverage and test pass rate than
  executing a single up-front planning graph, and removing the evolution step
  is the largest single ablation loss.
kind: observation
backing_strength: single-paper
scope_condition: Six real-world Python repositories from RepoCraft, GPT-5 mini
  and DeepSeek V3.2 backbones, with all methods sharing the same downstream
  TDD code-generation and repair scaffold.
technique: evolve-component-boundaries-modularity-metrics-until-convergence
proposed_technique: ""
technique_summary: ""
technique_kind: ""
technique_validated_by: Functionality Coverage and Pass Rate on three
  representative RepoCraft repositories against mini-SWE-agent, Paper2Code and
  RPG (static planning graph), plus ablations removing structural evolution,
  Dual-DAG, requirement context and dependency-aware ordering.
stance_on_existing: supports
related_claim_id: agent-builds-whole-python-repository-natural-language-requirements-alone-refining
stance_reason: "Same setup and finding: metric-guided boundary evolution to
  convergence beats both one-shot planning and fixed-budget LLM-decided
  restructuring on coverage and pass rate."
falsifier: A run holding the downstream generation scaffold fixed where the
  architecture-evolution loop gives no coverage or pass-rate gain over a
  one-shot planning graph, or where removing the evolution step costs less
  than removing other components.
evidence_note: Measured on three of six repositories reported in the main
  table (others in supplementary), two backbones, three averaged runs,
  cross-model evaluation to limit judge bias; baselines share the generation
  pipeline so architecture is isolated, but metric thresholds were tuned on
  held-out repos and all quality scores come from LLM-based matching plus
  adapted tests.
