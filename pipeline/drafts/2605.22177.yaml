arxiv_id: "2605.22177"
title: "Maestro: Reinforcement Learning to Orchestrate Hierarchical
  Model-Skill Ensembles"
url: https://doi.org/10.48550/arxiv.2605.22177
drafted_at: 2026-11-01
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: "When a small (4B) orchestrator is trained with outcome-only RL to
  pick a (frozen expert model, skill) pair at each step on multimodal
  reasoning benchmarks, the measured gain comes mostly from access to the
  heterogeneous expert pool rather than from the skill library: removing the
  model pool costs about 12 points average accuracy while removing the skill
  library costs about 3."
kind: observation
backing_strength: single-paper
scope_condition: Ten multimodal VQA/reasoning benchmarks (geometry, chart,
  medical, high-resolution perception), registry of five frozen 4B-10B expert
  VLMs and a two-tier skill library, Qwen3-VL-4B-Thinking orchestrator trained
  with GRPO on 9.2k samples; single training run, one orchestrator backbone.
technique: ""
proposed_technique: RL-train a small orchestrator to pick model-skill pairs
technique_summary: A lightweight policy emits, at each reasoning step, a
  triplet of which frozen expert model, which skill, and what query to
  dispatch, trained by group-relative RL on final-answer correctness plus a
  protocol-format penalty with no step-level routing labels.
technique_kind: training
technique_validated_by: "Average accuracy over ten multimodal benchmarks:
  70.1% versus GPT-5 69.3% and Gemini-2.5-Pro 68.7%, plus component ablations
  (no model pool -12.1, no skill library -2.7, neither 55.8%) and reward
  ablations (no format reward -13.1, no outcome reward -8.8); also 78.09 on
  BFCL-V4 and 72.9 on tau2-bench."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on the same registry showing the skill library
  contributes as much as or more than the expert pool, or showing that routing
  to a single best frozen expert per benchmark (no learned policy) reaches the
  same average accuracy.
evidence_note: Measured via component ablation on the authors' own framework
  across ten benchmarks. The ablations are internal to one system and one
  orchestrator backbone, with no seed variance reported. The design does not
  isolate learned routing from a simpler oracle or per-benchmark best-expert
  baseline, so how much credit belongs to the RL policy as opposed to merely
  having strong domain experts available is not established; the Geometry3K
  jump (22.3% to 77.4%) is consistent with expert access alone.
confidence: low
