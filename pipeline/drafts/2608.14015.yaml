arxiv_id: "2608.14015"
title: "MedClaw: Heuristic Agent Harness for Long-Horizon Surgical Video Reasoning"
url: https://doi.org/10.48550/arxiv.2608.14015
drafted_at: 2026-10-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: For a frozen-weight video agent on open-ended surgical video QA,
  mining candidate retrieval skills from the agent's own low-scoring traces
  and keeping each only when it raises a four-dimensional validation reward on
  ~40 held-out questions beats installing a hand-written general 'looking
  discipline' skill, and the single distilled temporal skill (re-read the
  window adjacent to a localized event for before/after questions) carries
  most of the gain.
kind: mechanism
backing_strength: single-paper
scope_condition: Text-only orchestrator with frozen vision sub-agents, long
  (18-28 min median) surgical videos, open-ended free-form answers judged by
  an LLM rubric validated against neurosurgeon ratings; mined from only 100
  labeled questions.
technique: ""
proposed_technique: Reward-gated skill distillation from the agent's own failed traces
technique_summary: The orchestrator answers blind, is shown the gold,
  classifies the gap as operational/unreachable/already-correct, writes a
  candidate skill only for operational gaps, and the skill is retained in an
  external library only if it lifts the validation reward by a margin without
  dropping any single question by two points.
technique_kind: process
technique_validated_by: "Component ablation on the 259-question neurosurgery
  split: full harness averaged 2.90 across four 1-5 judge dimensions; removing
  directed re-look -0.38, removing coarse-to-fine -0.16, replacing distilled
  skills with a hand-written looking-discipline skill -0.13. Judge agreement
  with experts kappa 0.72 (neuro) and 0.86 (SVU)."
stance_on_existing: supports
related_claim_id: self-evolving-agents-accumulate-reusable-skills-bank-admit-new-skill
stance_reason: The paper argues that without an automatic success signal
  self-evolving loops accumulate plausible-but-useless skills, and adds a
  per-candidate reward gate with a per-question regression check to prevent
  that.
falsifier: A matched comparison in which a hand-written or ungated skill
  library reaches the same or better four-dimensional average as the
  reward-gated distilled library, or in which removing directed re-look costs
  no more than removing any other component.
evidence_note: Measured on one benchmark the authors built (259 neurosurgery +
  864 SVU questions), with ablations only on the neurosurgery split. Gains
  over the matched one-shot backbone are +0.17 to +0.56 per dimension. The
  -0.13 HSD ablation is a small margin on a 1-5 scale with no confidence
  intervals or repeated runs, and the skill library converged to essentially
  one skill, so the loop's generality is not isolated.
confidence: low
