falsifier: A selection method that adds coverage and redundancy terms to the
  same relevance score fails to beat Top-K on the same backbone and budget, or
  the gap over uniform sampling does not widen on longer videos.
evidence_note: "Six benchmarks, three backbones; with Qwen3-VL-8B at 32 frames
  MarKey beats Top-K by 3.59 (LongVideoBench) and 3.73 (Video-MME) points
  using the same CLIP relevance score, isolating the subset-aware terms.
  Duration split: +6.31 medium, +7.80 long, ~ -0.7 short vs uniform. Component
  ablation shows relevance is the dominant term and coverage/redundancy alone
  are weak. All numbers from the authors; no independent replication, and
  open-ended Video-TT is won by a competing method."
