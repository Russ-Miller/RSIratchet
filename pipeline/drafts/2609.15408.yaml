statement: For long-video QA with a fixed frame budget fed to a frozen
  multimodal model, selecting frames by marginal contribution to the
  already-selected subset (query relevance plus coverage gain minus
  redundancy) beats ranking frames independently by query-frame similarity,
  and the margin over uniform sampling grows with video duration.
kind: mechanism
backing_strength: single-paper
scope_condition: Training-free selection with a CLIP-style scorer, budgets of
  16-128 frames, 2B-32B open multimodal backbones (Qwen2.5-VL, Qwen3-VL,
  MiniCPM-V-4.5); gains are small on videos under 3 minutes.
technique: ""
proposed_technique: marginal-utility greedy keyframe selection
