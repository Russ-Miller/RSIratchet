falsifier: A model whose route-planning success rises to near its own
  perception-free ceiling once a correct scene map is supplied, showing map
  construction was the binding constraint.
evidence_note: Measured on a 2,300-2,650-sample test split across 246 Habitat
  scenes, comparing a no-map setting against an oracle-map setting for ~9
  models; reports +12.6 points target success and +8.1 points path success
  from the oracle map, from a near-floor baseline. The oracle condition
  isolates perception from reasoning, but the required output format (JSON map
  plus reasoning chain) may itself depress scores independently of spatial
  reasoning.
confidence: medium
