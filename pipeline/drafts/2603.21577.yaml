capability: planning
statement: For frontier MLLMs asked to plan a landmark-grounded route from a
  5+ minute egocentric video, handing them a ground-truth cognitive map of the
  scene raises planning success only marginally (average target success rate
  still about 11.8%, navigation error about 5.29m), so the limit is structured
  multi-step spatial reasoning rather than extracting the layout from video.
kind: observation
backing_strength: single-paper
scope_condition: Long egocentric indoor videos in Habitat-simulated scenes;
  models must emit a hierarchical cognitive map plus a landmark-grounded path,
  scored by simulator execution; tested on open and proprietary MLLMs
  zero-shot.
