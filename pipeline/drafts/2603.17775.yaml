arxiv_id: "2603.17775"
title: "CoVerRL: Breaking the Consensus Trap in Label-Free Reasoning via
  Generator-Verifier Co-Evolution"
url: https://doi.org/10.48550/arxiv.2603.17775
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: error-detection
statement: For 1.7B-7B Qwen and Llama models doing label-free RL on math, a
  model's ability to judge its own solutions can be trained without ground
  truth by using majority-voted answers to build balanced correct/incorrect
  verification pairs, raising self-verification accuracy from roughly 55% to
  81-87% in-domain and transferring to held-out reward benchmarks.
kind: mechanism
backing_strength: single-paper
scope_condition: Mathematical reasoning training data (MATH), three
  base/instruct backbones 1.7B-7B; verification must be done in an
  extended-reasoning mode, since a non-thinking verifier collapses to one-line
  verdicts within ~100 steps.
technique: ""
proposed_technique: Train verifier on majority-vote contrast, then filter consensus errors
technique_summary: "One model alternates generator and verifier roles in
  multi-turn RL: majority voting supplies balanced positive/negative
  verification targets to train the verifier, and the improving verifier
  filters self-consistent errors out of the pseudo-labels used as rewards."
technique_kind: training
technique_validated_by: Self-verification accuracy on MATH500/AMC/AIME24/GPQA
  (e.g. Qwen2.5-7B 54.0 to 86.5 on MATH500), RewardBench scores against
  untrained base models and larger models, and downstream accuracy vs TTRL
  (+4.7 to +5.9 average); ablations remove filtering, verifier updates,
  self-correction and answer-anchored grouping.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same co-evolution loop and finding self-verification
  accuracy stays near its untrained ~55% level, or that the gain is an
  artifact of a label bias (e.g. verifier accepting nearly everything) rather
  than discrimination, would falsify it.
evidence_note: Measured on three backbones and four benchmarks against a TTRL
  baseline, with reported TNR/FPR curves and an ablation showing balanced
  positive/negative sampling is needed to avoid verifier collapse. Single
  paper, one training corpus, no ground-truth-supervised verifier upper bound
  reported.
confidence: medium
