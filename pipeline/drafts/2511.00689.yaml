arxiv_id: '2511.00689'
title: Do Methods to Jailbreak and Defend LLMs Generalize Across Languages?
url: https://arxiv.org/abs/2511.00689
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: jailbreak-robustness
statement: Across ten languages and six models on HarmBench and AdvBench, unsafe-response rates
  for the same model differ by more than 50 points between languages; high-resource languages
  are safer on plain harmful queries but more vulnerable to adversarial-prompt jailbreaks, and
  simple defenses work but their effect depends on language and model, so safety measured in
  English does not transfer.
kind: observation
backing_strength: single-paper
scope_condition: Ten high- to low-resource languages, six LLMs, two jailbreak families (logical-expression
  and adversarial-prompt), 2025; unsafe rate judged automatically.
