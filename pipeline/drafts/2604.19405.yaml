arxiv_id: "2604.19405"
title: "Lost in Translation: Do LVLM Judges Generalize Across Languages?"
url: https://arxiv.org/abs/2604.19405
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: "For LVLM judges scoring pairwise vision-language preferences, an
  English-only accuracy figure hides per-language gaps: across 22 models
  judging the same instances translated into 25 languages, English is usually
  the best language and the low-resource language (Kazakh) usually the worst,
  and some cost-optimized variants collapse to near or below chance overall
  (Gemini-2.5-Flash-Lite 40.8%, Gemma-3-4B 34.9%) despite being usable judges
  in English."
kind: observation
backing_strength: single-paper
scope_condition: Pairwise preference judging over images and charts, instances
  machine-translated from English into 24 languages with the image held fixed;
  22 LVLMs from 1B to 32B plus proprietary models.
technique: ""
proposed_technique: Score judge models on the same items translated across languages
technique_summary: Translate each pairwise preference instance into many
  languages while keeping the image fixed, then report per-language accuracy
  and cross-language variance for each judge instead of a single English
  score.
technique_kind: process
technique_validated_by: Applied to 22 LVLMs over 60K+ instances in 25
  languages; cross-lingual rankings were stable when the translator was
  swapped for two weaker Gemini models, though absolute accuracy fell and
  variance rose.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that per-language judge accuracy tracks English accuracy
  closely across models (small variance, no systematic Kazakh deficit), or
  that the observed gaps disappear with human-written rather than
  machine-translated items.
evidence_note: "Measured: pairwise accuracy with order-swapped averaging on
  31K M-VL-RewardBench and 30K M-OpenCQA items plus 100K M-MM-RewardBench.
  Gold labels exist only for VL-RewardBench; OpenCQA labels come from GPT-5 as
  reference judge (93.5% agreement with 2 of 3 annotators on 300 samples),
  which inflates agreement for models resembling GPT-5. Translation artifacts
  are partly controlled by a translator-swap check that preserved rankings."
confidence: medium
