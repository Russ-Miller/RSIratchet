arxiv_id: "2602.06763"
title: "R-Align: Enhancing Generative Reward Models through Rationale-Centric
  Meta-Judging"
url: https://doi.org/10.48550/arxiv.2602.06763
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: "For generative reward models (8B-14B Qwen3) used to supervise
  RLHF, pairwise label accuracy barely tracks downstream policy quality while
  the rate at which correct verdicts rest on rationales matching a gold
  judgment does: across evaluated judges, label accuracy correlated 0.22-0.38
  with average downstream actor score and rationale-consistent accuracy
  0.92-0.96, and two judges with near-identical label accuracy produced
  opposite RLHF trajectories."
kind: observation
backing_strength: single-paper
scope_condition: Pairwise preference judging on HelpSteer3, RewardBench2 and
  PPE-Preference; judges 8B-32B plus frontier APIs; downstream RLHF of a
  Qwen3-8B policy on Arena-Human-Preference prompts; gold rationales and the
  meta-judge are themselves model-generated (Gemini-3-Pro).
technique: ""
proposed_technique: Reward the judge only when its rationale matches the gold one
technique_summary: During RL training of a generative reward model, grant
  reward only when both the preference label is correct and a separate
  meta-judge verifies the generated rationale covers the key discriminators of
  a gold reference rationale.
technique_kind: training
technique_validated_by: Spurious-correctness rate and rationale-consistent
  accuracy on three repurposed RM benchmarks against the base model and an
  outcome-reward RLVR baseline (e.g. 14B HelpSteer3 F-Score 44.5 base, 40.1
  RLVR, 54.0 R-Align), plus downstream actor average across STEM, code,
  instruction-following and general suites (59.4 RLVR vs 61.7 R-Align at 14B).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A larger set of judges in which label accuracy predicts downstream
  RLHF actor scores as well as rationale-fidelity does, or in which
  rationale-reward training lowers both spurious correctness and downstream
  actor performance.
evidence_note: Measured on three benchmarks and one policy backbone;
  correlations are computed over a small handful of judge variants, so the
  0.92-0.96 figures rest on few points. Gold rationales and the meta-judge are
  model-generated, with human validation reported only in an appendix, so
  rationale 'fidelity' is agreement with one frontier model's judgment.
  Downstream RLHF uses a single policy and prompt source; no matched-compute
  control for the extra meta-judge calls.
confidence: low
