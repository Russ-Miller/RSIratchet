arxiv_id: "2609.05235"
title: "PRICE: A Systematic Study of LLM Adaptation Choices for Bitcoin Price
  Forecasting"
url: https://arxiv.org/abs/2609.05235
drafted_at: 2026-09-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: forecasting
statement: When a text-pretrained LLM is prompted to forecast a numeric price
  series, rounding the input values to integers while keeping the original
  price scale gives lower forecast error than full-precision raw values,
  training-set standardization, or per-window instance normalization, because
  normalized values fall outside the numeric distributions the model saw in
  pretraining and per-window rescaling makes the same price appear differently
  across samples.
kind: mechanism
backing_strength: single-paper
scope_condition: Zero-shot prompting of a 4-bit quantized LLaMA-3 8B on hourly
  Bitcoin closing prices, 96-step input, 8-step horizon; one asset, one period
  (2023-2024).
technique: ""
proposed_technique: Feed integer-rounded values, not normalized ones, to LLM forecasters
technique_summary: Round each numeric time-series value to the nearest integer
  before serializing it into the prompt, preserving the original scale instead
  of standardizing or instance-normalizing.
technique_kind: prompting
technique_validated_by: "Validation-set MAPE/SMAPE/NRMSE on BTC/USDT hourly
  forecasting under a fixed zero-shot prompt with only the representation
  varied: rounded 3.01/3.05/0.05 vs raw 4.23/5.42/0.12, standard normalization
  9.43/9.39/0.16, instance normalization 548.36/132.19/1.41; valid-output
  count unchanged at 1441."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On other numeric series and other LLM backbones, instance- or
  standard-normalized inputs match or beat integer-rounded inputs under an
  otherwise identical prompt and decoding setup.
evidence_note: Measured as a one-factor-at-a-time ablation with a fixed
  prompt, so representation is isolated, but on a single asset, single window
  length, single backbone, and a single 10% chronological validation split;
  the mechanistic explanation (pretraining distribution mismatch, cross-window
  inconsistency) is argued, not tested.
confidence: medium
