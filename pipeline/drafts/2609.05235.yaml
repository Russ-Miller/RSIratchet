capability: forecasting
statement: When a text LLM is prompted to forecast numeric price series,
  feeding the history as integer-rounded values on the original price scale
  gives lower forecast error than full-decimal raw values, standard-normalized
  values, or per-window instance-normalized values, because rounding cuts
  token fragmentation while keeping magnitudes in the distribution the model
  saw in pretraining.
kind: mechanism
backing_strength: single-paper
scope_condition: Univariate hourly Bitcoin closing prices, 96-step input and
  8-step horizon, 4-bit LLaMA-3 8B, zero-shot prompting for the representation
  ablation; single asset and single model tested.
technique: ""
proposed_technique: Integer-rounded numeric representation for LLM time-series prompts
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on other assets or models where normalized or
  raw-decimal inputs match or beat integer-rounded inputs on scale-independent
  error metrics.
evidence_note: "One-factor-at-a-time ablation on a validation set of 1441
  windows with the prompt held fixed: MAPE 3.01 rounded vs 4.23 raw, 9.43
  standard-normalized, 548 instance-normalized; SMAPE and NRMSE agree.
  Valid-output count was identical across representations, so the effect is on
  accuracy not format compliance. Single asset, single backbone; the
  tokenization explanation is argued, not measured."
confidence: medium
