arxiv_id: "2605.07288"
title: "Sword: Style-Robust World Models as Simulators via Dynamic Latent
  Bootstrapping for VLA Policy Post-Training"
url: https://doi.org/10.48550/arxiv.2605.07288
drafted_at: 2026-11-02
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: state-tracking
statement: For diffusion-transformer world models used as closed-loop
  simulators of robot manipulation (LIBERO), training with ground-truth
  context frames (teacher forcing) leaves the model unable to recover from its
  own prediction errors at inference, so progressively substituting the
  model's own cached latent predictions as historical context during training
  lowers long-horizon video error and raises downstream RL policy success.
kind: mechanism
backing_strength: single-paper
scope_condition: Autoregressive video world models trained on short sampled
  segments (4 context frames, 8 predicted) on one LIBERO-Spatial dataset of
  1,600 episodes; single baseline comparison (WoVR).
technique: ""
proposed_technique: Feed cached self-predicted latents back as training context
technique_summary: During training, a dynamic cache in VAE latent space stores
  the model's own predicted latents and progressively replaces ground-truth
  history as conditioning, on a linear decay schedule.
technique_kind: training
technique_validated_by: "Ablation against an identical model without the
  bootstrapping cache: LPIPS/FID/FVD/FloLPIPS improved on both LIBERO-Original
  (FVD 48.46 to 32.17) and a 1:1 raw+OOD mixed set (FVD 110.71 to 86.84); GRPO
  post-training of OpenVLA-OFT reached 61.72% vs 53.12% for WoVR at step 172."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation where substituting self-predicted latents for
  ground-truth context during training leaves long-horizon fidelity metrics
  and downstream policy success unchanged or worse, on this or another
  manipulation benchmark.
evidence_note: Measured on one benchmark (LIBERO-Spatial, 1,500 train / 100
  eval episodes) against one baseline, with a single ablation arm; the DLB
  ablation isolates the bootstrapping from the style augmentation, but the
  policy-success table compares only full Sword against WoVR, so the RL gain
  is not attributed to DLB alone. No seeds or variance reported.
confidence: low
