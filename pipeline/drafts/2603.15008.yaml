arxiv_id: "2603.15008"
title: "Clue Matters: Leveraging Latent Visual Clues to Empower Video Reasoning"
url: https://doi.org/10.48550/arxiv.2603.15008
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: On situated video QA (STAR), supplying video MLLMs with
  ground-truth structured temporal clue tuples (subject, predicate, object,
  start/end frame) alongside the video and question raises accuracy by roughly
  20 points for architecturally diverse 7B-class backbones (Qwen2.5-VL +22.9,
  InternVideo2.5 +21.1), so the dominant limit on these benchmarks is
  extracting faithful temporal clues rather than reasoning over them once they
  are given.
kind: observation
backing_strength: single-paper
scope_condition: Multiple-choice situated reasoning (STAR) with
  human-annotated scene-graph clue annotations converted to temporal
  quintuplets; 16-frame inputs; open-source 7B-class video MLLMs.
technique: ""
proposed_technique: Supply ground-truth temporal clue tuples to separate
  perception from reasoning
technique_summary: Feed the model human-annotated subject-predicate-object
  clues with frame spans in addition to video and question, bypassing the
  model's own clue extraction, to measure the perception ceiling.
technique_kind: prompting
technique_validated_by: Accuracy on STAR with and without oracle clues across
  five backbones; gains of about 21-23 points, with ClueNet reaching 94.8% and
  a residual ~5.2% gap concentrated in the Feasibility split requiring
  unobservable commonsense.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A backbone whose accuracy barely rises when given ground-truth
  temporal clue tuples, or a model whose remaining errors under oracle clues
  are as large as its errors without them, would show the bottleneck is
  downstream reasoning rather than clue extraction.
evidence_note: Measured on one benchmark (STAR) with five models, using clue
  annotations supplied by the dataset itself; the oracle condition also
  changes prompt content and length, so part of the gain may come from the
  extra textual scaffolding rather than clue correctness alone. No control
  feeding corrupted clues of the same format is reported.
confidence: medium
