capability: persuasion
statement: In a preregistered experiment with 1,500 UK adults, a persuasive chatbot shifted
  attitudes on policy issues by about 12.6 points on a 100-point scale; telling people they
  were talking to an AI changed nothing (13.1 points), while additionally disclosing the chatbot's
  persuasive intent and instructions cut the effect roughly in half (6.3 points).
kind: observation
backing_strength: single-paper
scope_condition: 60 policy issues, identical chatbot across conditions, 2026; UK adults; single
  short conversation.
