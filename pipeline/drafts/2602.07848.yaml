arxiv_id: "2602.07848"
title: "MARTI-MARS$^2$: Scaling Multi-Agent Self-Search via Reinforcement
  Learning for Code Generation"
url: https://doi.org/10.48550/arxiv.2602.07848
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: When several LLM agents are RL-trained together on code generation
  via a shared tree search (8B-32B backbones), giving each agent independent
  parameters raises both individual Pass@1 and system-level search accuracy
  above parameter-sharing multi-role training, which peaks early and then
  stagnates or declines as the shared policy's reward variance collapses.
kind: observation
backing_strength: single-paper
scope_condition: Code generation (LiveCodeBench v6) with verifiable test-case
  rewards, 8B-32B open models, two or three agents, equal training-data
  budget; not tested outside code.
technique: ""
proposed_technique: Give each collaborating agent its own parameters, not a shared policy
technique_summary: Runs multi-agent tree search as the RL environment but
  assigns every agent an independent parameter set with its own buffer and
  asynchronously triggered updates, instead of sharing one policy across
  prompt-defined roles.
technique_kind: training
technique_validated_by: Pass@1 and Pass@1(MCTS) on LiveCodeBench v6 against
  vanilla GRPO single-agent and parameter-sharing multi-role training at
  matched data; Qwen3-8B Pass@1 +8.0 over base, +4.4 over GRPO, +2.9 over the
  homogeneous peak; Pass@1(MCTS) 62.3% vs 59.4% homogeneous and 58.3% GRPO;
  homogeneous reward standard deviation falls late in training.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: At matched compute and data, independent-parameter agents show no
  advantage over parameter-sharing multi-role training, or the homogeneous run
  keeps improving past the point where its reward variance collapses.
evidence_note: Measured on one benchmark (LiveCodeBench v6) across five
  backbones and several pairings, with GRPO and homogeneous baselines matched
  on data and RL tricks. The homogeneous arm is scored at its best checkpoint,
  which is favourable to it. Compute is not matched across arms (each agent
  gets its own 8-GPU node), so some of the heterogeneous gain may be extra
  capacity rather than diversity; the diversity analysis is correlational.
confidence: low
