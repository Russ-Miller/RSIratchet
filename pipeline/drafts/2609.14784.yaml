arxiv_id: "2609.14784"
title: Enhancing Automated Unit Test Generation for NLP Libraries Using Large
  Language Models
url: https://arxiv.org/abs/2609.14784
drafted_at: 2026-09-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: For automated unit test generation on domain-specific Java
  libraries (NLP toolkits), injecting LLM-written test snippets into a
  search-based generator's population when the evolutionary search stagnates
  yields higher branch and line coverage than either the search tool alone or
  the LLM alone, with the LLM contributing object-construction sequences and
  domain-shaped string inputs that random search does not reach.
kind: mechanism
backing_strength: single-paper
scope_condition: 100 classes from five Java NLP libraries; GPT-4o-class LLM;
  EvoSuite/DynaMOSA as the search backbone; 900s budget, 5 runs per class.
  Gains are smaller on mutation score and absent on numeric/algorithmic
  classes.
technique: ""
proposed_technique: Inject self-refined LLM test snippets when search stalls
technique_summary: When a search-based test generator makes no fitness
  progress for N generations, prompt an LLM at class level with an iterative
  self-refinement loop, parse its test snippets into the generator's internal
  representation, and merge them into the evolving population.
technique_kind: tooling
technique_validated_by: Median branch coverage 68.60% vs 58.03% (CodaMosa-J),
  53.33% (EvoSuite), 32.64% (LLM-only); Wilcoxon p<<0.05, A12 0.72-0.85;
  mutation score 63.0% vs 52.0/58.0/38.26. Ablations show class-level context,
  self-refinement, and repeated calls each contribute; LLM-generated strings
  alone gave -1.4%.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication on the same or comparable domain-specific library
  corpus in which the hybrid injection gives no coverage gain over the
  search-based tool alone, or in which an LLM-only baseline with equal compute
  matches it.
evidence_note: "Measured: 100 classes, 5 runs each, three baselines including
  a re-implemented CodaMOSA, with Wilcoxon, Friedman/Conover, A12 and
  bootstrap CIs. Per-class wins 36-59 with 2-3 losses. Single LLM family for
  the main configuration; the Java CodaMOSA baseline is the authors' own
  re-implementation, so that comparison is not independent."
confidence: medium
