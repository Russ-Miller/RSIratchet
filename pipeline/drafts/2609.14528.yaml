statement: In multi-hop KGQA evaluated as graph navigation with annotated gold
  evidence paths, reported agreement between an agent's traversed path and the
  reference path cannot be credited to question conditioning unless it is
  compared against question-agnostic references — unbiased random walks and
  answer-oracle shortest paths — because dense or small graphs let structure
  alone deliver both answer reachability and partial path overlap.
