arxiv_id: "2609.13436"
title: "Toward Self-Adaptive Physical AI: Can LLM Agents Manage Long-Horizon
  Physical Tasks?"
url: https://arxiv.org/abs/2609.13436
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: In a 241-day simulated crop-management task where decisions
  accumulate irreversibly, a zero-shot multi-agent LLM framework (perception,
  manager, decision, revision, reflection) scores below a PPO policy trained
  in that same environment but far above the same PPO policy transferred to a
  shifted weather/location/soil environment, while using under 28% of its
  fertilizer and irrigation.
kind: observation
backing_strength: single-paper
scope_condition: One crop simulator (WOFOSTGym lnpkw-v0), wheat, GPT-5.6
  backbone, single run per policy per environment; no real-world deployment.
technique: ""
proposed_technique: Role-split physical agent loop with reflection feedback
technique_summary: Splits long-horizon physical task management into
  deterministic perception agents, a synthesizing manager, a decision agent,
  an independent revision agent that may only adjust quantities, a
  deterministic safety guard, and a reflection agent that feeds outcome
  assessments back to the three reasoning agents each cycle.
technique_kind: process
technique_validated_by: Cumulative reward, maximum yield (WSO at maturity),
  and total N/P/K/irrigation use against no-intervention, fixed-schedule, and
  PPO baselines in two environments; one run each, no ablation of the
  individual mechanisms.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same framework and a PPO policy over multiple seeds,
  weather years and sites shows the LLM framework no better than transferred
  RL under shift, or shows the advantage comes from the safety guard's action
  limits rather than from reflection feedback.
evidence_note: Measured, but on a single simulator and apparently one episode
  per policy per environment, with no seed variance, no ablation of role
  separation versus reflection, and no matched-compute comparison (964 LLM
  calls, ~23.8M tokens per run versus a 2h44m PPO training). The RL baseline's
  collapse under shift (110 kg/ha yield) is large enough that the directional
  claim is plausible, but the magnitudes are unreplicated.
confidence: low
