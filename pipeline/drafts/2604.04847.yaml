stance_reason: ""
falsifier: A voice agent that invokes tools before the user's turn ends
  (negative tool-call latency) and nonetheless matches or exceeds
  conservative-commitment systems on self-correction scenarios, or a system
  whose self-correction pass rate equals its filler/hesitation pass rate.
evidence_note: Measured on 100 recordings from 12 speakers, 21 with
  self-corrections, across six systems. Self-correction is the lowest or
  near-lowest category for most systems (0.176-0.588 vs 0.414-0.621 for
  fillers). The commitment mechanism is argued from two case studies plus the
  cascaded pipeline's structure, not isolated by an experiment that varies
  commitment timing while holding the model fixed. Per-category cell counts
  are small (21 items spread over six systems).
