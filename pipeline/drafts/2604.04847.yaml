capability: tool-use
statement: For real-time full-duplex voice agents doing multi-step tool calls,
  mid-utterance self-correction is the weakest disfluency category across
  every system tested, because low-latency designs commit tool parameters
  before the user finishes speaking — either by pre-emptive API invocation or
  by ASR finalizing the pre-correction transcript — leaving no path to roll
  the parameter back.
kind: mechanism
backing_strength: single-paper
scope_condition: Six streaming voice-agent configurations (GPT-Realtime,
  Gemini Live 2.5/3.1, Grok, Ultravox v0.7, Whisper→GPT-4o→TTS cascade) on 100
  real human recordings with deterministic local mock APIs; 21 scenarios
  contain self-correction events.
technique: ""
proposed_technique: Score voice tool use per disfluency category on real human speech
technique_summary: Evaluate streaming voice agents on unscripted human
  recordings annotated for fillers, pauses, hesitations, false starts and
  self-corrections, reporting task pass rate separately per category alongside
  latency and turn-taking.
technique_kind: process
technique_validated_by: "Applied to six systems: aggregate Pass@1 ranged
  0.410-0.600 while per-category self-correction Pass@1 ranged 0.176-0.588,
  with the lowest self-correction score (cascaded, 0.176) coming from a system
  of middling aggregate accuracy (0.450) — so the per-category split reorders
  systems the aggregate does not. No baseline evaluation protocol compared."
stance_on_existing: neither
