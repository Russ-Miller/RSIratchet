arxiv_id: '2405.01563'
title: Mitigating LLM Hallucinations via Conformal Abstention
url: https://arxiv.org/abs/2405.01563
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: abstention-and-self-knowledge
statement: An abstention rule built from self-consistency, where the model samples several answers
  and itself scores how many agree with a candidate, can be thresholded by conformal prediction
  to bound the hallucination rate at a chosen level on closed-book QA; against log-probability
  confidence it abstains much less often on long-form answers (Temporal Sequences) for the same
  error bound and matches it on short answers (TriviaQA).
kind: mechanism
backing_strength: single-paper
scope_condition: Closed-book, open-domain generative QA (TriviaQA, Temporal Sequences), 2024,
  with a held-out labelled calibration set; guarantee is on expected error under exchangeability.
technique: ''
proposed_technique: Conformal abstention from self-consistency
technique_summary: Draw k responses, have the model count how many match each candidate, use
  that match score as confidence, and set the abstention threshold on a labelled calibration
  set with conformal prediction so the expected error among answered questions stays under a
  target rate.
technique_kind: decoding
technique_validated_by: Hallucination rate versus abstention rate curves on TriviaQA and Temporal
  Sequences against log-probability and prior self-consistency baselines; error bound verified
  empirically against manual labels on a 100-item calibration set.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Tasks where sampled answers agree confidently on a wrong answer (consistent hallucination),
  which would break the confidence score, or distribution shift between calibration and test
  that voids the bound in practice.
evidence_note: Two datasets and one model family in the main results; the guarantee is statistical
  and holds only when the calibration set is drawn from the same distribution as use. Cost is
  k samples plus k self-evaluations per query.
confidence: medium
