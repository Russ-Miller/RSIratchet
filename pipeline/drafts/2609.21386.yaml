arxiv_id: "2609.21386"
title: "AgentVidBench: A Multi-Hop Video Question Answering Benchmark for
  Evaluating MLLM Agents"
url: https://doi.org/10.48550/arxiv.2609.21386
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: "On multi-hop video questions written so no single frame or
  timestamp lookup suffices, single-turn MLLMs answer poorly (0.07-0.51
  accuracy across 12 proprietary and open models), and wrapping the same
  models in an agentic loop helps only when the loop lets the agent choose
  what, where and at what granularity to look: frameworks giving adaptive
  fps/resolution/interval control raised accuracy and trajectory scores for
  nearly every model, while a fixed-schedule framework with weak perception
  tools (STAR) fell below the single-turn baseline for all of them."
kind: observation
backing_strength: single-paper
scope_condition: 100 hand-authored 26-option multiple-choice questions over 71
  openly licensed videos of 8s-27min; accuracy plus an LLM-judged milestone
  trajectory score; only four agentic frameworks compared.
technique: ""
proposed_technique: ReAct loop over controllable video inspection tools
technique_summary: A single agent iteratively calls video observation tools
  where it sets the time interval, frame rate and resolution itself, judging
  evidence sufficiency each turn before answering.
technique_kind: tooling
technique_validated_by: Accuracy and trajectory score on AgentVidBench against
  single-turn and three agentic frameworks; best accuracy 0.58 with Gemini 2.5
  Pro versus 0.51 single-turn and 0.56 AVP, with ablations removing each
  control axis lowering accuracy (e.g. 0.50 without interval control).
stance_on_existing: supports
related_claim_id: 7b-multimodal-models-long-video-qa-multi-turn-agentic-exploration-harness
stance_reason: Both find that an agentic video-exploration harness can score
  below plain single-pass answering when the loop or its tools are poorly
  matched to the model.
falsifier: A replication where fixed-plan agentic frameworks match
  adaptive-control ones on these questions, or where single-turn MLLMs match
  the best agentic setups on multi-hop video QA.
evidence_note: Measured across 12 models x 5 settings on one 100-question
  benchmark built by the same authors; the STAR shortfall confounds framework
  design with the quality of that framework's bundled perception tools, and
  trajectory scores come from an LLM judge validated only in an appendix.
confidence: medium
