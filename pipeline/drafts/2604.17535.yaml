arxiv_id: "2604.17535"
title: "OPSDL: On-Policy Self-Distillation for Long-Context Language Models"
url: https://doi.org/10.48550/arxiv.2604.17535
drafted_at: 2026-11-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For 7B-32B Qwen2.5-Instruct models, supervising long-context
  generation token by token with the same model's own distribution conditioned
  on an extracted short context (reverse-KL advantage, on-policy rollouts)
  raises long-context benchmark accuracy more than long-context SFT or
  self-generated preference DPO, with the margin growing as context length
  grows and with only about a point of short-context loss.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-Instruct 7B/14B/32B; RULER and LongBench V2; training
  triples built from raw long documents with a self-generated question
  answerable from the short chunk
technique: ""
proposed_technique: Supervise long-context output with the model's own short-context distribution
technique_summary: The model answers from the full long context while the same
  weights, conditioned only on the extracted short evidence chunk, supply a
  per-token reverse-KL advantage used as the policy-gradient signal.
technique_kind: training
technique_validated_by: RULER per-length accuracy and LongBench V2 overall
  against the base instruct model, Long-SFT and LongPO; e.g. 7B total avg
  51.68 base, 53.99 SFT, 55.42 LongPO, 56.61 OPSDL; 128K gains of
  +48.70/+34.25/+30.29 over base at 7B/14B/32B; short-context retention
  checked on MMLU, ARC-C, HellaSwag, Winogrande, MT-Bench
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the same triples trained with sequence-level or
  SFT objectives match the token-level reverse-KL gains at long lengths, or
  where the long-length advantage does not grow with context length, or where
  short-context benchmarks drop as much as under Long-SFT.
evidence_note: Measured on one model family (Qwen2.5-Instruct) at three
  scales, two long-context benchmarks, with LongPO baselines missing at
  14B/32B because the authors could not get it to converge, so the comparison
  there is only against Long-SFT. No ablation isolating the short-context
  extraction from the on-policy rollout, and LongBench V2 numbers are means
  over 4 runs with small standard deviations.
confidence: medium
