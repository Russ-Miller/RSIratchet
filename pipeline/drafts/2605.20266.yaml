stance_reason: ""
falsifier: A LALM whose safety training is purely text-side showing refusal
  rates on paralinguistically-wrapped harmful requests equal to its refusal
  rates on the same requests in text, across several attack styles.
evidence_note: "Argued, not measured: a survey synthesizing reported attacks
  (Multi-AudioJail, StyleBreak, WhisperInject, JALMBench) and noting that
  defenses are concentrated on jailbreak mitigation. No new experiment, no
  numbers given in the source text for the alignment-gap claim itself."
