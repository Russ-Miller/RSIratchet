statement: In large audio language models, safety alignment inherited from
  text-only RLHF on the LLM backbone does not cover the acoustic channel,
  because malicious intent can be carried by paralinguistic realization
  (emotion, accent, prosody, speaker traits, imperceptible waveform
  perturbation) that is decoupled from the lexical content the alignment was
  trained on.
kind: mechanism
backing_strength: single-paper
scope_condition: End-to-end LALMs whose safety behaviour comes from a
  text-aligned LLM backbone with an audio encoder bolted on; stated as a
  synthesis across reported jailbreak and adversarial-audio results rather
  than a new measurement.
technique: ""
proposed_technique: Align on audio-text preference pairs, not text alone
technique_summary: Extend RLHF-style preference data and reward models so they
  penalize manipulative acoustic realization (tone, accent, perturbation) as
  well as harmful semantics.
technique_kind: training
technique_validated_by: Not measured; the survey argues for it from the
  asymmetry between mature attack literature and jailbreak-only defenses.
stance_on_existing: neither
