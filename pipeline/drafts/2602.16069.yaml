arxiv_id: "2602.16069"
title: The Limits of Long-Context Reasoning in Automated Bug Fixing
url: https://doi.org/10.48550/arxiv.2602.16069
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: "On SWE-bench Verified repository bug-fixing, strong agentic
  resolve rates do not indicate long-context ability: successful agent
  trajectories stay under 20k-30k tokens with failed ones consuming more, and
  the same models given all gold-patch files in a 64k single-shot prompt
  (perfect retrieval recall) drop to single-digit or zero resolve rates with
  hallucinated diffs, nonexistent file targets and malformed patch headers."
kind: observation
backing_strength: single-paper
scope_condition: SWE-bench Verified, 100-sample subsets; mini-SWE-agent bash
  harness vs single-shot 64k prompting; models GPT-5-nano, DeepSeek-R1-0528,
  Qwen3-32B, Qwen3-Coder-30B-A3B
technique: ""
proposed_technique: Inject gold-patch files to isolate long-context patching
technique_summary: Builds a long-context benchmark by BM25-ranking repository
  chunks and then injecting the files touched by the ground-truth patch,
  guaranteeing perfect retrieval recall so single-shot patch generation is
  measured without retrieval as a confound.
technique_kind: process
technique_validated_by: Run on 100 SWE-bench Verified samples at 64k context
  with sb-cli grading; Qwen3-Coder-30B-A3B 7% resolve, GPT-5-nano 0%, against
  the same models' agentic resolve rates (GPT-5-nano 31%) as the comparison
  point; post-processing manually checked as not the error source.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model that scores comparably on single-shot 64k patch generation
  with gold files supplied and in an agentic harness on the same tasks, or
  evidence that the single-shot collapse is an artifact of patch
  formatting/post-processing rather than reasoning over the long context.
evidence_note: Measured on 100-sample subsets (agentic resolve rates checked
  against the public leaderboard figure for GPT-5-nano, 31% vs 34.8%). Token
  distributions reported as mean/variance for passed vs failed trajectories,
  not per-length resolve curves, and the paper explicitly says it cannot
  separate 'long context confuses the model' from 'harder issues need more
  tokens'. Only two models tested in the 64k setting, and failure modes are
  qualitative. One cited independent benchmark (LongSWE-bench) reports
  similarly low single-shot rates.
confidence: medium
