arxiv_id: "2603.13091"
title: "Reasoning over Video: Evaluating How MLLMs Extract, Integrate, and
  Reconstruct Spatiotemporal Evidence"
url: https://doi.org/10.48550/arxiv.2603.13091
drafted_at: 2026-11-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: On controlled egocentric indoor videos, current MLLMs answer
  questions whose evidence is visible in one moment far better than
  semantically matched questions requiring evidence integrated across rooms
  and time (best model 55.6% extractive vs 40.3% abstractive, against human
  88.0% and 81.7%), and open-source scaling does not reliably close the
  abstractive gap.
kind: observation
backing_strength: single-paper
scope_condition: 10 synthetically rendered egocentric indoor navigation
  videos, 300 queries, 32 uniformly sampled frames, 14 proprietary and
  open-source MLLMs, zero-shot; mostly multiple-choice.
technique: ""
proposed_technique: Pair each extractive video question with an abstractive counterpart
technique_summary: Build the video from a scenario and query specification
  first, so each extractive question has a one-to-one counterpart whose
  decisive evidence is deliberately spread across rooms and time.
technique_kind: process
technique_validated_by: Compared the same 14 models on five extractive tasks
  and their matched abstractive counterparts plus human and random baselines;
  sub-task decomposition attributed failures to counting, room-order memory
  and floor-plan reconstruction.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model family showing comparable accuracy on the abstractive and
  extractive halves of matched task pairs, or abstractive accuracy rising
  monotonically with parameter count within a family.
evidence_note: Measured on a small, deliberately hand-built set (10 videos,
  300 queries, 3 queries per task per scenario), so per-task figures rest on
  30 items; human baseline from five annotators. Design isolates extractive vs
  abstractive by matched task pairs over the same video, but the videos are
  synthetic renders, which may itself shift model behaviour.
confidence: medium
