arxiv_id: "2605.31483"
title: "BenHalluEval: A Multi-Task Hallucination Evaluation Framework for
  Large Language Models on Bengali"
url: https://doi.org/10.48550/arxiv.2605.31483
drafted_at: 2026-10-31
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "When LLMs are scored as hallucination detectors on Bengali and
  Bangla-English tasks, measuring only detection on hallucinated candidates
  hides uniform label bias: several models reach low miss rates while flagging
  most or nearly all correct answers as hallucinated, so a balanced dual-track
  error rate over both gold and hallucinated instances is needed to separate
  content-sensitive judgement from a constant verdict."
kind: mechanism
backing_strength: single-paper
scope_condition: Nine LLMs (3B-32B plus GPT-4.1 mini) on four
  Bengali/Bangla-English tasks (QA, code-mixed QA, summarization, math
  reasoning) with GPT-generated hallucinated candidates and binary yes/no
  verdicts at temperature 0.
technique: ""
proposed_technique: Score hallucination detection on gold and hallucinated tracks jointly
technique_summary: Evaluate a detector separately on 1,000 ground-truth
  correct instances (expected verdict 'no') and on hallucinated candidates
  (expected 'yes'), then report the equally weighted mean of the two error
  rates so a constant responder scores 50%.
technique_kind: process
technique_validated_by: Applied across 9 models x 4 tasks; the metric exposes
  models such as Mistral-nemo-12B (B-err 19.98%, A-err 87.70% on QA) and
  TituLLM-3B (near-constant verdicts, BHS ~50%) that single-track scoring
  would rank well; a weighting sensitivity analysis shows equal weighting is
  the only setting where no degenerate responder wins.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: If, on these tasks, models' hallucinated-candidate detection rates
  ranked them the same way as the balanced dual-track score — i.e. no model
  with a low miss rate had a high false-alarm rate on gold instances — the
  dual-track protocol would add nothing.
evidence_note: Measured on a constructed benchmark of 12,000 generated
  hallucinated candidates and 4,000 gold instances, human-validated at Fleiss
  kappa 0.911-0.926. Dual-track error tables show opposing biases per model.
  Hallucinated items are GPT-5.4 generated by construction, so the
  distribution may differ from naturally occurring hallucinations; no
  comparison against a single-track-optimised detector trained for the task.
confidence: medium
