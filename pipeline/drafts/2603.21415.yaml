arxiv_id: "2603.21415"
title: "Silent Commitment Failure in Instruction-Tuned Language Models:
  Evidence of Governability Divergence Across Architectures"
url: https://doi.org/10.48550/arxiv.2603.21415
drafted_at: 2026-11-08
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: procedure-following
statement: "For instruction-tuned models asked to follow conflicting
  instructions, whether the model emits any detectable internal conflict
  signal before committing to an output varies by architecture rather than by
  benchmark accuracy or fine-tuning: two of three instruction-following models
  tested produced confident fluent wrong output with no warning signal, while
  one produced a detectable conflict signal 57 tokens before commitment under
  greedy decoding."
kind: observation
backing_strength: single-paper
scope_condition: Six models across twelve reasoning domains; only three were
  evaluable for conflict detection; greedy decoding.
technique: ""
proposed_technique: Classify model-task pairs by detectability and correctability
technique_summary: Scores each model-task combination on whether errors are
  detectable before output commitment and correctable once detected, placing
  it in one of four governance regimes (Governable, Monitor Only, Steer Blind,
  Ungovernable).
technique_kind: process
technique_validated_by: Not measured as an intervention; the matrix is a
  classification built from the measured spike ratios and correction rates,
  with a 2x2 experiment reporting a 52x spike-ratio difference between
  architectures versus ±0.32x from fine-tuning.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing that the same models emit comparable pre-commitment
  conflict signals once decoding or probe placement is varied, or that
  fine-tuning moves the spike ratio as much as architecture does.
evidence_note: Measured on six models over twelve reasoning domains, but only
  three were evaluable for conflict detection, so the headline '2 of 3' rests
  on a very small sample; the 52x-versus-0.32x contrast comes from a single
  2x2 experiment and the inference that governability is fixed at pretraining
  is argued from that one comparison. No baseline detector is reported.
confidence: low
