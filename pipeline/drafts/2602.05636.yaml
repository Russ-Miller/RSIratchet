arxiv_id: "2602.05636"
title: "Generative Ontology: When Structured Knowledge Learns to Create"
url: https://doi.org/10.48550/arxiv.2602.05636
drafted_at: 2026-11-12
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For schema-constrained generation of structured creative artifacts
  (tabletop game designs from a Pydantic ontology), adding output-schema and
  ontology constraints removes structural errors but leaves LLM-judged
  creative quality unchanged, and the creative gain only appears when
  generation is split into role-specialized agents with explicit critique
  roles.
kind: observation
backing_strength: single-paper
scope_condition: One generator model (Claude Sonnet 4, temp 0.7), 120 designs
  over 10 themes and 4 conditions, quality scored by a same-model LLM judge;
  the multi-agent condition also added retrieval and a refinement pass, so
  specialization is not isolated from those.
technique: ""
proposed_technique: Split schema-constrained generation into critic-bearing specialist agents
technique_summary: Decompose an ontology into domains and assign each to an
  agent with a stated professional concern (mechanics, theme, components, a
  balance critic that hunts exploits, an experience judge), running generation
  sequentially and critique before a refinement pass.
technique_kind: process
technique_validated_by: "Ablation over 4 conditions x 10 prompts x 3
  replications: consistency errors fell 5.03 to 0.10 with schema alone
  (d=4.78), to 0 with ontology; creative scores moved only from the
  single-agent ontology condition to the full pipeline (fun d=1.12, strategic
  depth d=1.59, elegance d=1.14), at ~8.5x token cost. Replayability and
  social interaction did not separate any conditions, and the evaluator's ICC
  for replayability was only 0.578."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-compute single-agent run (same token budget, same
  retrieval, same refinement loop, no role split) reaching the same judged
  creative scores as the multi-agent pipeline, or human expert raters finding
  no quality difference between the two conditions.
evidence_note: "Measured on 120 generated designs with reported Cohen's d and
  p-values, plus a 50-evaluation test-retest ICC study validating 7 of 9 judge
  metrics. Weak isolation: the full-pipeline condition bundles role
  specialization, RAG and a refinement pass, so the attributed creative gain
  could come from the extra refinement step or from 8.5x more tokens. One
  generator and one judge model, both the same family; no human calibration,
  no playtesting."
confidence: low
