arxiv_id: "2607.21725"
title: Addressing the Orchestration Gap in Generalist Robots via Physical Agency
url: https://arxiv.org/abs/2607.21725
drafted_at: 2026-10-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: "For frozen vision-language-action manipulation policies, most
  failures on tasks that need world knowledge, conditionals, multi-step
  decomposition, memory or recovery are not motor failures: wrapping the same
  unchanged weights in an inference-time orchestrator that decomposes the
  instruction into short subgoals, routes each to a motor backend, verifies
  the outcome from the gripper sensor and wrist image, and retries or
  escalates raises success sharply (real-robot reasoning probes 4.6% to 96.9%;
  LIBERO-PRO 12.8% to 53.3%) while leaving already-easy pick-and-place roughly
  unchanged."
kind: mechanism
backing_strength: single-paper
scope_condition: Frozen pi-0.5 VLA plus a TAMP grasp planner on a Franka FR3
  DROID tabletop setup (30 capability-probe tasks, 5 trials each) and
  LIBERO-PRO simulation; frontier VLM as orchestrator; no new data or
  post-training; ceiling still set by the frozen skills' support, and
  verification can be fooled under occlusion.
technique: ""
proposed_technique: Orchestrate frozen VLAs with a verify-and-recover loop
technique_summary: A frontier VLM plans one short subgoal at a time, calls a
  frozen motor backend (TAMP pick/place split into separately verified steps,
  or a VLA rollout), checks the outcome against a gripper-width sensor plus
  the post-action wrist image, and retries, escalates between backends, or
  uncovers occluders when verification fails.
technique_kind: process
technique_validated_by: "Binary task success against two direct-prompting
  baselines holding weights fixed: on 30 real-robot tasks 97.3% vs 16.7% for
  direct pi-0.5 and 48.7% for open-loop TiPToP; on LIBERO-PRO six perturbation
  suites 53.3% mean vs 12.8% for frozen pi-0.5 and 18.2% for CaP-Agent0; the
  loop effect reported to hold across seven different reasoner models."
stance_on_existing: supports
related_claim_id: vla-world-action-manipulation-policies-score-near-ceiling-standard-libero-recovery
stance_reason: Both find that frozen policies fail at recovery and state
  repair rather than at motion, and this paper shows an external
  verify-and-recover loop closes much of that gap.
falsifier: A controlled run in which the same orchestration loop, with
  verification and recovery intact, gives little or no gain over direct
  prompting on reasoning-limited tasks, or in which an ablation shows the gain
  comes from the TAMP backend's grounding rather than from verification and
  recovery.
evidence_note: Measured, with weights, hardware, scenes and backends held
  fixed so only the inference-time process varies — a clean isolation. But
  only 5 trials per real task across 30 tasks authored by the same team as
  capability probes, success graded binary, and no component-wise ablation
  separating verification from decomposition from backend routing is reported
  in the text. The LIBERO-PRO result is the stronger-powered arm (10 trials
  per task) and lands far below ceiling at 53.3%.
confidence: medium
