arxiv_id: "2604.17745"
title: "HiRAS: A Hierarchical Multi-Agent Framework for Paper-to-Code
  Generation and Execution"
url: https://arxiv.org/abs/2604.17745
drafted_at: 2026-11-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: "When paper-to-code repository quality is scored reference-free by
  prompting an LLM judge with only the paper and the repository files, the
  score largely does not measure whether code exists: an empty repository
  scored 3.89/5 and a configuration-and-documentation-only repository 4.67/5,
  above every model-generated codebase, because the judge infers files that
  are not there; supplying the file count and a hierarchical directory listing
  in the judge prompt raises correlation with reference-based scoring from
  r=0.42 to r=0.86."
kind: observation
backing_strength: single-paper
scope_condition: Paper2Code benchmark (90 ML papers), o3-mini-high as
  evaluator, 1-5 scale, reference-free prompting without the gold repository.
technique: ""
proposed_technique: Give the judge the file count and directory tree
technique_summary: Augments the reference-free evaluator prompt with the
  repository's total file count, a hierarchical structure listing, and
  anti-hallucination instructions before it scores paper-to-code fidelity.
technique_kind: prompting
technique_validated_by: Pearson correlation with reference-based scores rose
  0.423 to 0.862 (repository-level regression 0.42 to 0.83); correlation with
  three expert annotators rose 0.50 to 0.72 on 30 ICLR 2024 papers against
  0.82 inter-annotator; naive empty and config-only baselines fall from
  3.89/4.67 to 1.0/2.68. Ablation attributes gains separately to count,
  structure, and instruction changes.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the original reference-free protocol on empty and
  documentation-only repositories and finding they score at or below
  model-generated codebases, or finding that adding file count and structure
  to the prompt does not raise correlation with reference-based or human
  scores.
evidence_note: Measured on one benchmark with one evaluator model, with
  degenerate-repository controls (empty, config-only, gold) that isolate the
  hallucination directly. Human validation on 30 papers with three annotators.
  Does not separate how much of the correlation gain comes from the structural
  facts versus the rewritten instructions beyond a coarse additive ablation,
  and uses only one judge model.
confidence: medium
