statement: On multiple-choice questions derived from industry cybersecurity certifications,
  frontier models reach human-expert level on general networking and IT security, but accuracy
  falls on vendor-specific material and formal standards, staying below 40% on the hardest ISA/IEC
  62443 and Fortinet NSE questions; general security benchmarks such as MMLU Computer Security
  are saturated near 100% and no longer separate models.
