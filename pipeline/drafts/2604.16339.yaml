stance_reason: ""
falsifier: In a live multi-agent deployment with real LLM agents, a
  pre-execution intent-blocking layer fails to raise end-to-end task
  completion over a post-hoc verifier at matched compute, or its
  false-positive blocks stall workflows rather than producing cheap retries.
evidence_note: "Measured, but on a simulation the authors wrote: agent
  interactions, confidence profiles and conflict injections are synthetic,
  conflict rate is fixed at 25.9% by construction, and the near-zero
  completion of all baselines is an artifact of that harness. The design does
  isolate pre- vs post-execution timing and the Process Context Layer
  (ablation moves precision only, 28.7% to 27.9%). No live-LLM replication;
  single author, no matched-cost baseline."
