statement: In multi-agent LLM workflows where agents act on overlapping
  business entities, intercepting each agent's intended action before
  execution and blocking conflicting intents prevents cascading workflow
  failure far better than a post-hoc judge that evaluates outputs after they
  are committed, even when the judge has much higher conflict-detection F1.
kind: mechanism
backing_strength: single-paper
scope_condition: Shown only in a simulated coordination harness (no live LLM
  inference), 4-6 agents, four hand-constructed enterprise process models,
  with conflict patterns injected by the authors.
technique: ""
proposed_technique: Register agent intents and block conflicts before execution
technique_summary: Middleware intercepts each agent action, registers its
  intended pre/post-conditions in a shared intent graph, checks for
  contradictory, resource-contending or causally invalid combinations, and
  resolves or blocks before the action commits.
technique_kind: process
technique_validated_by: "600 simulated runs (3 framework configurations x 4
  scenarios x 50 runs): workflow completion 100% vs 25.1% for a calibrated
  judge-agent baseline, 0.8% schema-only, 0.2% ungoverned; detection recall
  65.2% at 27.9% precision."
stance_on_existing: neither
