arxiv_id: "2606.27705"
title: Mitigating Position Bias in Transformers via Layer-Specific Positional
  Embedding Scaling
url: https://doi.org/10.48550/arxiv.2606.27705
drafted_at: 2026-10-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: In RoPE-based 7B LLMs, the middle-of-context penalty can be reduced
  without fine-tuning by giving each layer its own RoPE position-scaling
  factor, searched offline on a few hundred examples, which raises average
  accuracy across evidence positions on multi-document QA and key-value
  retrieval while adding no inference latency.
kind: mechanism
backing_strength: single-paper
scope_condition: RoPE-based 7B models (Vicuna-7B-v1.5, StableBeluga-7B,
  Qwen2.5-7B) on position-varied retrieval and QA tasks; scaling factors
  searched per model on 200 in-domain samples.
technique: ""
proposed_technique: Scale RoPE positions per layer, searched by
  Bezier-constrained genetic algorithm
technique_summary: Assigns a distinct RoPE position-scaling factor to each
  transformer layer, with the per-layer factors read off a cubic Bezier curve
  whose control points are found by a genetic search on a few hundred
  position-varied examples.
technique_kind: decoding
technique_validated_by: Accuracy at evidence positions 0-100% on MDQA and
  key-value retrieval against baseline, Positional Interpolation, Attention
  Buckets, Ms-PoE and MoICE; best average gain 11.2 points (Vicuna key-value,
  80.9 to 92.1); transfer to ZeroSCROLLS/L-Eval; MMLU and C-Eval within ~1
  point of baseline; inference time 0.71s/sample equal to baseline, vs 1.03
  Ms-PoE and 1.72 MoICE.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where per-layer scaling factors searched this way
  give no average gain over a single layer-agnostic scaling factor (Positional
  Interpolation), or where the gain fails to transfer to tasks other than the
  search dataset.
evidence_note: Measured on three 7B RoPE models across two position-varied
  datasets (500 held-out samples each) with five baselines, plus
  ZeroSCROLLS/L-Eval transfer and MMLU/C-Eval retention. Gains on MDQA are
  small (about 1-3 points average) and large only on Vicuna key-value
  retrieval; Qwen2.5 key-value was already near ceiling. Search cost (3-4h on
  four H100s, per model) is a real cost the latency claim does not cover.
confidence: medium
