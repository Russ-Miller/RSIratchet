arxiv_id: "2609.14987"
title: "ActGuard: Pre-execution Action Auditing against Indirect Prompt
  Injection in LLM Agents"
url: https://arxiv.org/abs/2609.14987
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: prompt-injection
statement: For tool-using agents on long-trajectory benchmarks, an injection
  defense that audits each candidate action against a one-step-ahead predicted
  tool set holds attack success low while keeping task utility near the
  attack-free level, whereas defenses that fix a global plan or filter whole
  tool outputs lose utility because the predicted full trajectory almost never
  matches the executed one once environmental feedback arrives.
kind: mechanism
backing_strength: single-paper
scope_condition: Multi-step tool agents with untrusted observations; measured
  on AgentDyn and AgentDojo with GPT-4o-mini, Gemini-2.5-Flash and
  DeepSeek-V4-Flash backends; requires log-probability access to a local proxy
  model and an LLM verifier.
technique: ""
proposed_technique: pre-execution action auditing against a step-wise tool prior
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Show a global-plan or whole-output-filtering defense that matches
  this method's under-attack utility at equal attack success on
  long-trajectory agent benchmarks, or show that step-wise next-tool
  prediction coverage is no higher than global plan coverage on executed
  trajectories.
evidence_note: "Measured against 9 defense baselines on two benchmarks with
  three backends, reporting attack-free utility, under-attack utility and
  attack success rate. Planning-reference coverage is reported directly:
  step-wise next-tool prediction 58.7-72.2% no-attack and 54.2-69.6% under
  attack, versus global plans 9.7-16.1% no-attack and 0.00% under attack.
  Ablations show removing argument-level localization causes the largest
  degradation (ASR 3.0 to 24.5 on DailyLife). All numbers from the paper's own
  implementation; no independent replication, and the verifier is a frontier
  model whose cost and latency exceed no-defense."
