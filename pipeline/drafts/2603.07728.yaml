capability: multi-model-coordination
statement: In a role-decomposed multi-agent pipeline for OpenSeesPy frame
  modeling, assigning different backbone LLMs by agent role — a stronger
  reasoning model to the planning/geometry agents and an instruction-following
  model to the mapping and code-translation agents — gives higher end-to-end
  accuracy than powering every agent with any one of those models alone,
  because each single model hallucinates in a different subtask class.
kind: observation
backing_strength: single-paper
scope_condition: 20 benchmark 2D frame modeling problems, ten trials each,
  with GPT-OSS 120B and Llama-3.3 70B Instruct Turbo; one fixed prompt
  template per agent
technique: ""
proposed_technique: Assign backbone models per agent role, reasoning vs translation
technique_summary: Within a multi-agent pipeline, route planning and
  geometry-reasoning agents to a stronger reasoning backbone and the
  information-mapping and code-translation agents to an instruction-following
  backbone, instead of using one model throughout.
technique_kind: process
technique_validated_by: "Average accuracy over 20 frame problems x 10 trials:
  mixed GPT+Llama 99%, GPT-only 90%, Llama-only 79%, Qwen-only 69%; error
  traces attribute GPT failures to translation/mapping agents and Llama
  failures to planning/node reasoning agents."
