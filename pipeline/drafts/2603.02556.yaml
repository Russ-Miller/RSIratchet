arxiv_id: "2603.02556"
title: "Through the Lens of Contrast: Self-Improving Visual Reasoning in VLMs"
url: https://doi.org/10.48550/arxiv.2603.02556
drafted_at: 2026-11-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For 3B-8B VLMs generating their own reasoning traces for supervised
  finetuning, refining each trace against a paired VQA sample (a visually
  similar image with a synonymous question) corrects more visually
  hallucinated rationales than refining with the ground-truth answer as a hint
  alone, and finetuning on the contrast-refined traces raises hallucination,
  math and general benchmark scores together, where hint-only self-improving
  raises hallucination scores while lowering math and general scores.
kind: mechanism
backing_strength: single-paper
scope_condition: Open 3B-8B VLMs (Qwen2.5-VL 3B/7B, InternVL2.5-8B)
  self-generating rationales on curated VQA pairs; pairs must be drawn from
  diverse task families, and only medium-difficulty items (initially wrong,
  corrected under contrast) are kept. Contrast is used only at data-generation
  time, not at inference.
technique: ""
proposed_technique: Refine self-generated rationales against a contrastive image pair
technique_summary: Have the VLM draft a rationale with the answer as a hint,
  then compare the sample against a visually similar sample with a synonymous
  question to produce a contrastive analysis, and have an LLM rewrite the
  rationale using that analysis before finetuning on the result.
technique_kind: training
technique_validated_by: "Finetuned Qwen2.5-VL-7B on the resulting 55K-sample
  set and scored six benchmarks (MMVP, HallusionBench, MathVista, MathVision,
  MMStar, MME-RealWorld) against the base model, three reproduced
  self-improving baselines (STaR, verifier-filtered, self-feedback) generating
  rationales on the same data, and four off-the-shelf reasoning datasets:
  average 58.1 vs 55.5 base and 55.4 (STaR), 54.9 (verifier), 56.4 (feedback).
  Ablations: easy samples added hurt; negative pairs contribute more than
  positive on GQA; gains repeated on 3B and InternVL2.5-8B."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Finetuning on rationales refined with a contrastive counterpart
  gives no better hallucination-benchmark scores than hint-only STaR
  rationales at matched data volume, or the math/general benchmark drop seen
  in hint-only training also appears under contrastive refinement.
evidence_note: Measured on one primary backbone with six benchmarks plus two
  smaller replications; baselines reproduced on the same data pool, which
  isolates the rationale-generation method from data choice. Margins over the
  strongest self-improving baseline are modest (58.1 vs 56.4 average) and
  per-benchmark rankings are mixed (MMStar lower than LPT, MathVision lower
  than R1-Onevision). The claimed mechanism — that contrast surfaces visual
  evidence — is supported by a rectification-rate figure on a failure-case
  subset, not by an independent grounding measurement.
confidence: low
