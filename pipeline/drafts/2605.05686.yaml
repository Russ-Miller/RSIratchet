arxiv_id: "2605.05686"
title: "Attractor Geometry of Transformer Memory: From Conflict Arbitration to
  Confident Hallucination"
url: https://doi.org/10.48550/arxiv.2605.05686
drafted_at: 2026-11-02
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: In autoregressive transformers, confident hallucination arises
  because learned facts form attractor basins in hidden-state space and the
  frozen LM head cannot distinguish a state inside a basin from one drifting
  with no basin present, so hidden-state distance to the nearest memorized
  basin separates correct recall from hallucination far better than output
  entropy.
kind: mechanism
backing_strength: single-paper
scope_condition: Demonstrated in a controlled synthetic entity-to-code task
  with parametric memory installed via LoRA adapters, then checked on
  natural-language factual queries from the pretrained model without
  adaptation.
technique: ""
proposed_technique: Score hidden-state distance to nearest memorized attractor basin
technique_summary: Flag a generation as hallucinated when the hidden state's
  geometric margin to the nearest memorized fact basin exceeds a threshold,
  instead of thresholding output entropy.
technique_kind: decoding
technique_validated_by: Separation of correct recall from hallucination on the
  synthetic task with zero false refusals, against entropy-based detection
  which rejected the vast majority of correct outputs; separation also held on
  natural-language factual queries.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model family where hidden-state margin to memorized-fact clusters
  does no better than output entropy at separating correct recall from
  hallucination, or where confident-hallucination share does not grow with
  scale.
evidence_note: Measured on a synthetic task designed so ground truth is exact
  and adapter placement isolates components, plus a transfer check on
  pretrained natural-language factual queries; the headline separation and the
  exp(-c/margin) scaling law come largely from the synthetic setup, so
  generality across model families and fact types is not established.
confidence: medium
