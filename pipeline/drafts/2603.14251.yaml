arxiv_id: "2603.14251"
title: Mitigating Overthinking in Large Reasoning Language Models via
  Reasoning Path Deviation Monitoring
url: https://doi.org/10.48550/arxiv.2603.14251
drafted_at: 2026-11-08
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: cutting-to-the-chase
statement: For long chain-of-thought reasoning models (1.5B-235B, distilled
  and RL-trained), terminating reasoning when the average token entropy in a
  recent sliding window rises sharply above the running average entropy of the
  whole trace so far raises accuracy over vanilla CoT on math and science
  benchmarks, while cutting fewer tokens than answer-probing or fixed-budget
  early-exit methods.
kind: mechanism
backing_strength: single-paper
scope_condition: Math and scientific reasoning benchmarks with verifiable
  answers; eight open-weight reasoning models; threshold and window size tuned
  (best at lambda=2.0, W=512); gains larger on distilled models than
  RL-trained ones.
technique: ""
proposed_technique: Exit reasoning when local entropy spikes above the global baseline
technique_summary: Tracks a ratio of windowed average token entropy to
  cumulative average token entropy during generation and inserts the
  end-of-thinking marker at a semantic boundary once the ratio crosses a
  threshold, with no proxy model or tentative-answer probing.
technique_kind: decoding
technique_validated_by: Accuracy and generated token length on
  GSM8K/AMC23/MATH500, AIME24-25/OlympiadBench, GPQA-Diamond against vanilla
  CoT, NoThinking, ThinkLess, Dynasor-CoT and DEER; average accuracy gain over
  vanilla CoT reported as 3.9% overall and 5.1% on distilled models; ablations
  removing the global baseline, the window, and the boundary trigger each lose
  accuracy.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matching the method's token reduction with a simple fixed-length
  truncation, or replacing the entropy ratio with a random exit at the same
  trigger rate, yields the same accuracy gain over vanilla CoT; or the gain
  disappears on models or benchmarks outside the tuned threshold range.
evidence_note: "Measured on eight models across seven datasets with five
  baselines, reporting accuracy and length. Gains are modest on strong
  RL-trained models (+1.8, +2.1 average) and larger on distilled ones (up to
  +7.9). Per-task results are inconsistent: accuracy falls on GPQA for the 7B
  model (-7.5) and the 235B model (-0.5). No matched-trigger-rate random-exit
  control, so the entropy signal's specificity is argued from component
  ablations rather than isolated directly. Threshold and window were tuned on
  one of the evaluated models."
confidence: medium
