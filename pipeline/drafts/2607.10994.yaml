arxiv_id: "2607.10994"
title: A Multi-Agent Framework for Zero-Dimensional Reduced-Order Model Planning
url: https://doi.org/10.48550/arxiv.2607.10994
drafted_at: 2026-10-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: On 0D engineering network design tasks (aero-engine secondary air
  systems, IEEE distribution reconfiguration, water-network sizing) where a
  physical solver scores every candidate, role-decomposed multi-agent
  orchestration only reaches its best reported scores when the
  candidate-generation optimizer is also swapped (NSGA-II to a MILP-guided
  hybrid), so the measured gain over a single ReAct agent cannot be attributed
  to agent decomposition alone.
kind: observation
backing_strength: single-paper
scope_condition: Six cases (two real CAD-derived SAS designs, IEEE
  case33/case69, Two-Loop, New York Tunnels), one backbone (kimi-k2.6) behind
  all configurations, success rate defined permissively as completing the tool
  workflow with a solver-validated artifact.
technique: ""
proposed_technique: Let the agents parse and route, let a solver-backed optimizer decide
technique_summary: Restricts LLM agents to drawing parsing, ontology-grounded
  retrieval, tool routing and candidate selection, while all candidate
  generation and scoring is done by a MILP-guided search over a graph
  representation validated by a physics solver.
technique_kind: process
technique_validated_by: Compared against four ablations (single-agent ReAct
  with/without retrieval, compact CoT, multi-agent with NSGA-II) on success
  rate, per-objective improvement and runtime; reported 55.46% active power
  loss reduction on IEEE 69-bus, 90.45% cost reduction on Two-Loop, 3.15% seal
  leakage reduction in SAS inverse design, with reference-baseline gaps of
  0.09-3.58% on the four public benchmarks.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Holding the optimizer family fixed at NSGA-II, showing the
  multi-agent configuration beats the single-agent ReAct configuration by a
  margin comparable to the full system's margin on the same cases.
evidence_note: "Measured but weakly isolated: the ablation ladder changes
  retrieval, reasoning format, agent decomposition and optimizer one at a
  time, but the paper reports only the final configuration's headline numbers
  in the text, and per-configuration scores sit in figures not reproduced
  here. Each benchmark has a single run family; no seed variance reported. The
  authors themselves state optimization authority resides in solver-backed
  search rather than agent reasoning, which supports the reading but is an
  argument, not a measurement."
confidence: low
