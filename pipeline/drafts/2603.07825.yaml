capability: domain-knowledge
statement: "On French-language Quebec insurance certification exam questions,
  adding retrieval over a curated regulatory corpus splits models in two:
  those with weak closed-book domain knowledge gain tens of points, while some
  high-scoring models collapse far below random guessing because the retrieved
  context triggers verbose non-compliant output or safety refusals."
kind: observation
backing_strength: single-paper
scope_condition: 807 four-way multiple-choice questions from Quebec insurance
  certification handbooks, answered in French with a single-letter output
  constraint; 51 LLMs, dense top-5 retrieval over a 2.6M-token official corpus
technique: retrieval-augmented-generation
proposed_technique: ""
technique_summary: ""
technique_kind: ""
technique_validated_by: Accuracy with and without RAG per model, Z-test at
  alpha=0.001; e.g. DeepSeek-reasoner 36.30% to 71.77%, Gemini-2.5-pro 74.65%
  to 14.06%, Llama-3.3-70b-it 61.48% to 0.99%, against a random baseline near
  25%.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Re-running the same benchmark with lenient answer parsing and
  refusal handling, and finding the collapsed models score near their
  closed-book accuracy, would show the effect is a scoring artifact rather
  than context distraction.
evidence_note: Measured across 51 models and 5 baselines with 10-fold
  stratified resampling on a private benchmark. Failure causes (format
  non-compliance, refusal) are reported from analysis of failure cases, not
  quantified, so the split between parsing artifact and genuine degradation is
  not isolated.
confidence: medium
