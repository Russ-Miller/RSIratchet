arxiv_id: "2603.07825"
title: "Benchmarking Large Language Models for Quebec Insurance: From
  Closed-Book to Retrieval-Augmented Generation"
url: https://doi.org/10.48550/arxiv.2603.07825
drafted_at: 2026-11-22
drafted_from: full-text
model: claude-opus-5
