arxiv_id: "2603.27898"
title: "SAGE: Sink-Aware Grounded Decoding for Multimodal Hallucination Mitigation"
url: https://doi.org/10.48550/arxiv.2603.27898
drafted_at: 2026-11-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 7B-class vision-language models doing open-ended captioning,
  triggering a grounding check at punctuation and conjunction tokens
  (attention sinks) and then sharpening or broadening visual attention lowers
  object-hallucination rates more than applying the same modulation at fixed
  decoding intervals, because those tokens mark segment boundaries where the
  model switches concepts.
kind: mechanism
backing_strength: single-paper
scope_condition: Long-form generative captioning (MSCOCO CHAIR, AMBER) on
  LLaVA-1.5, Shikra, MiniGPT-4, InstructBLIP, Qwen2-VL-7B; the authors state
  it does not apply to short-answer or discriminative tasks where sink tokens
  rarely occur.
technique: ""
proposed_technique: Check grounding at sink tokens, then sharpen or diffuse attention
technique_summary: At each generated punctuation or conjunction token, extract
  noun/adjective concepts from the preceding segment, compare the sink token's
  self-attention map over image tokens with a Grad-CAM attribution map for
  those concepts, and sharpen attention when IoU exceeds a threshold or
  broaden it when it does not.
technique_kind: decoding
technique_validated_by: CHAIR_S/CHAIR_I on 500 MSCOCO images and CHAIR_I plus
  Cover on 500 AMBER images across five VLMs, against six decoding baselines
  (OPERA, HALC, EAH, DML-LVLM, GIFT, LVLMs-Saliency); ablation replacing sink
  triggers with modulation every 10 tokens raised CHAIR_S from 21.3 to 39.4 on
  LLaVA-1.5; Gemini-3-Pro judging of 100 captions; 10.8% decoding-time
  overhead.
stance_on_existing: supports
related_claim_id: 7-13b-open-vision-language-models-amplifying-visual-attention-only-heads
stance_reason: Both find that selective, conditioned attention amplification
  lowers hallucination where uniform or untargeted amplification does not.
falsifier: Applying the same sharpen/diffuse modulation at randomly chosen or
  fixed-interval decoding steps matches sink-triggered modulation on CHAIR at
  equal intervention frequency, or sink tokens show no elevated rate of
  subsequent hallucination relative to other token positions.
evidence_note: Measured on two captioning benchmarks with five backbones and
  six baselines; the fixed-interval ablation isolates the trigger choice, but
  intervention frequency is not matched between the two conditions, so some of
  the gap could come from how often modulation fires rather than where. The
  88.4%-within-five-steps correlation is reported without a base-rate
  comparison. All numbers are from the authors' own runs of baselines.
confidence: medium
