arxiv_id: "2609.04410"
title: "Engineered Persuasion: Evaluating Personalized Pretexts in
  LLM-Generated Spear Phishing"
url: https://doi.org/10.48550/arxiv.2609.04410
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: persuasion
statement: When LLM-generated spear phishing emails are built from
  cumulatively deeper workplace detail (employer, then name and title, then
  responsibilities, then coworker and shared project), U.S. working adults
  rate them as more convincing and more often say they would click, and they
  also report the message as phishing less often and delete it more often as
  detail increases.
kind: observation
backing_strength: single-paper
scope_condition: 180 U.S. working adults, 1,436 disclosed-survey evaluations
  of GPT-4o-written simulated phishing emails; stated action and hypothetical
  click intention, not observed inbox behaviour.
technique: ""
proposed_technique: Vary personalization depth in cumulative workplace-detail tiers
technique_summary: Generate phishing pretexts at four cumulative levels of
  recipient work-context detail and compare rated convincingness and stated
  action within participants.
technique_kind: prompting
technique_validated_by: "Linear and logistic mixed models with participant
  random intercepts: +2.40 convincingness points per level (95% CI 1.29-3.51),
  Level 4 vs Level 1 +7.61 points; odds of click intention +28% per level (OR
  1.28, CI 1.13-1.46), Level 4 OR 2.29; relative risk of report vs delete fell
  21.7% per level."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A within-participant study in which added accurate workplace detail
  does not raise convincingness or stated click rates, or raises reporting
  rather than lowering it.
evidence_note: Measured on 1,436 ratings from 180 Prolific participants;
  levels were within-participant and sample sizes balanced (360/360/358/358).
  Participants knew the emails were simulated, so absolute rates (36.9% click
  intention) are not operational click-through. Sender/pretext style was
  model-chosen and confounded with level (all coworker-reference messages at
  Level 4), so the mechanism behind the Level 4 jump is not isolated.
  Free-text coding indicates wrong or channel-inappropriate details can cut
  the other way, which the level effect averages over.
confidence: medium
