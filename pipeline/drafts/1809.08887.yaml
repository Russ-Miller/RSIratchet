arxiv_id: "1809.08887"
title: "Spider: A Large-Scale Human-Labeled Dataset for Complex and
  Cross-Domain Semantic Parsing and Text-to-SQL Task"
url: https://arxiv.org/abs/1809.08887
drafted_at: 2026-09-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: "On natural-language-to-SQL synthesis over multi-table databases, a
  model's accuracy overstates its ability whenever the same database or the
  same query appears in both training and test: splitting by database rather
  than by example cut the best system's exact-match accuracy from 33.0% to
  12.4%, and accuracy falls further as the target database has more foreign
  keys."
kind: observation
backing_strength: single-paper
scope_condition: Complex cross-domain text-to-SQL (Spider, 200 databases, 138
  domains); 2018-era neural semantic parsers (Seq2Seq variants, SQLNet,
  TypeSQL), value prediction excluded.
technique: ""
proposed_technique: Split text-to-SQL evaluation by database, not by question
technique_summary: Evaluate SQL synthesis on databases and query patterns that
  never appear in training, so memorized question-query templates cannot be
  reused.
technique_kind: process
technique_validated_by: Exact-match and per-component F1 for five models under
  an example split versus a database split of the same corpus; every model
  scored far lower under the database split, with TypeSQL dropping most (33.0
  to 8.2 on test).
stance_on_existing: supports
related_claim_id: static-code-benchmarks-saturate-need-continuous-refresh
stance_reason: Both show that reusing the same programs or problems across
  train and test inflates measured synthesis ability.
falsifier: A model whose database-split exact-match accuracy is close to its
  example-split accuracy on this corpus, or no decline in accuracy as
  foreign-key count grows.
evidence_note: Measured on a 10,181-question, 5,693-query human-labeled corpus
  with five contemporary models under two splits; the split comparison
  isolates generalization to unseen schemas, but all models are pre-LLM so the
  absolute numbers are stale and the foreign-key trend is a plot without
  controls for query difficulty.
confidence: high
