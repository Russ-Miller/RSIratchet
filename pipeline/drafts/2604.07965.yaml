arxiv_id: "2604.07965"
title: "DSCA: Dynamic Subspace Concept Alignment for Lifelong VLM Editing"
url: https://doi.org/10.48550/arxiv.2604.07965
drafted_at: 2026-11-05
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: knowledge-updating
statement: "For sequential knowledge edits to a frozen vision-language model,
  how much the per-concept edit subspaces overlap predicts how much earlier
  knowledge is lost: keeping the bases approximately orthogonal via
  residualized incremental PCA holds mean pairwise overlap near 3e-3 over
  1,000 edits while omitting orthogonalization lets it drift above 1e-1, and
  forgetting rises nearly linearly with overlap."
kind: mechanism
backing_strength: single-paper
scope_condition: LLaVA-1.5-7B and PaliGemma-3B with a frozen backbone, edits
  applied as gated low-rank residuals in the fused cross-modal representation;
  up to ~1,000 sequential edits on E-VQA, VLKEB and CoIN.
technique: ""
proposed_technique: Confine each edit to its own orthogonal concept subspace
technique_summary: Cluster fused vision-language representations online, build
  a low-rank PCA basis per concept that is residualized against earlier bases
  to stay near-orthogonal, and apply each edit as a gated residual only inside
  the routed concept's subspace with the backbone frozen.
technique_kind: architecture
technique_validated_by: Single-edit average 98.50 on E-VQA vs 97.84 for
  DualEdit; after 1,000 sequential edits reliability 96.85 vs 92.93 (LiveEdit)
  on E-VQA and 98.10 vs 92.22 on VLKEB; CoIN BWT -9.37 vs -19.45 for PAM at
  matched plasticity; ablation removing orthogonality raises locality drop
  from 0.5 to 2.8.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An editing setup where subspace overlap is driven high (no
  orthogonalization) yet backward transfer and locality stay as good as the
  orthogonalized variant, or where forcing orthogonality fails to reduce
  forgetting across edit sequences.
evidence_note: Measured on one paper's own benchmarks with baseline numbers
  copied from prior papers rather than re-run; the overlap-forgetting relation
  is a fitted correlation (r about 0.94) across the authors' own variants, so
  it is suggestive rather than a controlled causal test, and the supporting
  proof of bounded interference sits in an unavailable supplement.
confidence: low
