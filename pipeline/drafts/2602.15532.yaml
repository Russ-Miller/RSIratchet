arxiv_id: "2602.15532"
title: Quantifying construct validity in large language model evaluations
url: https://doi.org/10.48550/arxiv.2602.15532
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: When latent factor models are fitted to large collections of LLM
  benchmark scores, the dominant extracted 'general capability' factor is
  largely a proxy for model scale, because the models treat only benchmark
  scores and latent capabilities as variables and leave scale unmodelled;
  placing scale as an upstream cause of the capabilities instead yields
  capability estimates that fit more parsimoniously and generalise better to
  held-out benchmarks.
kind: mechanism
backing_strength: single-paper
scope_condition: Populations of open-weight LLMs spanning a wide parameter
  range scored on a shared benchmark suite (here 19 BIG-Bench Hard subtasks
  over 4,395 OpenLLM Leaderboard models); does not apply to human test
  populations, where no scaling law operates.
technique: ""
proposed_technique: Model scale as an upstream cause of latent capabilities
technique_summary: Fits a hybrid 'structured capabilities' model in which log
  parameter count feeds the latent capability factors through a logistic link,
  and those factors in turn explain benchmark scores up to item-specific
  measurement error.
technique_kind: process
technique_validated_by: Compared against pure exploratory factor analysis on
  parsimonious fit indices (CFI/TLI/RMSEA) and against PCA-based observational
  scaling laws on prediction error for a held-out out-of-distribution
  benchmark, using OpenLLM Leaderboard BBH scores for 4,395 models.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Fitting a latent factor model to a wide-scale LLM benchmark sample
  and finding the dominant factor correlates only weakly with log parameter
  count, or finding that adding scale as an upstream variable does not improve
  parsimonious fit or out-of-distribution benchmark prediction relative to
  plain EFA and PCA baselines.
evidence_note: Argued from the mathematical relation between factor models and
  PCA plus reported scale correlations in two prior studies (r=0.70 with log
  parameters in one; ~25% of factor variance in the other), and tested by
  fitting three models on one benchmark suite (19 BBH subtasks, 4,395 models).
  The excerpt ends before the results tables, so the magnitude of the claimed
  improvements is not visible here, and the design is one leaderboard and one
  benchmark family only.
confidence: low
