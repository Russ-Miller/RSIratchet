statement: Asked which of two entities is larger on a numeric attribute, models often contradict
  numbers they can state correctly, following entity popularity, mention order and co-occurrence
  instead; for 7-8B models a logistic regression on those three surface cues predicts the model's
  choice better than the model's own numeric recall does, while 32B models selectively use the
  numbers when they are reliable.
