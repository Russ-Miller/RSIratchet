arxiv_id: "2601.04442"
title: Addressing Overthinking in Large Vision-Language Models via Gated
  Perception-Reasoning Optimization
url: https://doi.org/10.48550/arxiv.2601.04442
drafted_at: 2026-11-14
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: cutting-to-the-chase
statement: For 3B-7B vision-language models on visual math benchmarks,
  replacing alternate decoder FFN layers with a token-level gated controller
  that routes among a fast path, a visual re-attention path, and a
  self-reflection path — trained by PPO with task, path-cost and
  uncertainty-calibration rewards — cuts average response length by roughly
  40-50% relative to the base model while holding or slightly raising
  accuracy, and removing the visual re-attention path costs about twice as
  much accuracy as removing the self-reflection path.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL 3B/7B backbones on MathVision, MathVerse,
  MathVista, DynaMath and MM-Vet; controller trained on ~30-40k samples mined
  from ~790k benchmark items with GPT-4 failure attribution; results not
  uniform (7B loses to FAST-7B on MathVerse and MM-Vet).
technique: ""
proposed_technique: Route each token between fast output, re-looking at the
  image, and self-reflection
technique_summary: A compact controller reads the decoder hidden state,
  next-token entropy and global image features at each generation step and
  selects one of three computation paths (base FFN, cross-attention over
  visual features, or a meta-reasoning transformer), trained with RL against
  combined accuracy, path-cost and calibration rewards.
technique_kind: architecture
technique_validated_by: Accuracy and mean token count on five multimodal
  reasoning benchmarks against the untuned base model and against
  slow-thinking baselines (LMM-R1, R1-OneVision, OpenVLThinker, FAST);
  component ablations on MathVision and MathVerse; reported path-activation
  distribution (73% fast / 17% perception / 10% reasoning).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the gated controller gives no length reduction
  at matched accuracy, or where removing the visual re-attention path costs no
  more accuracy than removing the self-reflection path, or where a simple
  length-penalty RL baseline on the same backbone matches both the length and
  accuracy figures.
evidence_note: Measured on five benchmarks at two model scales with length
  reported alongside accuracy, plus three-way component ablation on two
  benchmarks. Single paper, no seeds or variance reported, and no baseline
  that applies only a length penalty without the architectural change, so the
  attribution of the length saving to the gating specifically is not isolated.
  The perception-vs-reasoning ablation gap is based on two benchmarks only.
confidence: low
