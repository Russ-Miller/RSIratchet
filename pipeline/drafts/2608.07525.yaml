arxiv_id: "2608.07525"
title: Unified Hallucination Fuzzing for Multimodal Large Language Models
url: https://doi.org/10.48550/arxiv.2608.07525
drafted_at: 2026-10-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "For current multimodal LLMs evaluated on hallucination benchmarks,
  semantics-preserving adversarial mutation of the image and prompt raises
  hallucination rates unevenly: object-level grounding stays relatively robust
  while instruction-level behaviours (refusing an unanswerable request,
  resisting authority-biased or misleading premises) degrade most, with
  refusal hallucination rates exceeding 0.9 under fuzzing."
kind: observation
backing_strength: single-paper
scope_condition: 38 open and proprietary MLLMs on a 2,170-instance benchmark
  spanning object, instruction and knowledge hallucination; mutations include
  irrelevant-context expansion, constraint stacking, authority-bias injection,
  style transfer and multi-image overload, selected by heuristic or RL search.
technique: ""
proposed_technique: Stress-test hallucination with self-adaptive input mutation
technique_summary: Search over text and image mutation operators (with RL or
  heuristic policies guided by oracle feedback) to generate
  semantics-preserving adversarial variants of benchmark items, scored by an
  ensemble of detectors, rule checkers and LLM judges.
technique_kind: process
technique_validated_by: Compared standard, dynamic, heuristic-fuzz and RL-fuzz
  settings on the same seed items; generic hallucination rate rose under
  fuzzing for all models (e.g. Qwen2.5-VL-7B 0.298 to 0.365, GPT-5.2 0.282 to
  0.342), with RL fuzzing reported as finding hallucinations more efficiently
  than heuristic search; metric-human agreement checked against annotators.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A mutation suite of comparable strength applied to the same models
  showing object-level hallucination rising as much as or more than refusal
  and sycophancy rates, or showing instruction-level rates staying near their
  static values.
evidence_note: Measured across 38 model variants with four evaluation settings
  and several metrics; the headline instruction-level numbers are reported as
  representative figures in text rather than a full per-category table in the
  given excerpt, and the mutation operators are not matched for strength
  across categories, so the object-versus-instruction asymmetry could partly
  reflect which mutations were searched for each category.
confidence: medium
