falsifier: Replication where truthful persuasion is reliably stronger than false persuasion
  at equal effort, or guardrails that refuse to argue for conspiracies.
evidence_note: Large preregistered-style samples; the finding that standard guardrails did not
  block the bunking condition is as important as the effect sizes.
