capability: hallucination
statement: On single-step retrosynthesis for real industrial target molecules,
  frontier general LLMs produce chemically infeasible top-1 routes (unresolved
  selectivity or no mechanistic basis) more often than specialized
  retrosynthesis models, even though their reference-matching recall is
  comparable, so disconnection fluency does not carry selectivity awareness.
kind: observation
backing_strength: single-paper
scope_condition: 350 internal industrial targets, single-step prediction,
  top-1 route inspected by expert chemists; three frontier LLMs vs seven
  specialized single-step models.
technique: ""
proposed_technique: Rerank candidate routes with an executable chemical verifier
technique_summary: Take any backbone's top-10 candidate disconnections and
  reorder them by rule-based checks for functional-group competition,
  mechanistic plausibility and literature precedent, promoting unflagged
  routes above high-confidence flagged ones.
technique_kind: process
technique_validated_by: Expert-annotated top-1 chemical hallucination rate on
  350 industrial targets fell from 14.3-27.4% to 0-6.9% across ten backbones,
  and top-1 recall rose from 53.1% (plain ensemble) to 74.3%; but the
  post-rerank hallucination figure is measured by the same verifier that does
  the reranking, so it is partly definitional, and no independent held-out
  verifier or wet-lab check is reported.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On an independent industrial retrosynthesis set with blind expert
  annotation, frontier LLMs' top-1 infeasible-route rate at matched recall is
  equal to or below that of specialized single-step models.
evidence_note: Measured on one company-internal 350-molecule benchmark with
  expert chemist annotation; no inter-annotator agreement, no public data, and
  the annotators work for the group proposing the verifier. The recall
  comparison is against expert-validated reference routes, and
  literature-retrieval hits are injected into the proposed system's ranking,
  which inflates its recall@1 relative to backbones without retrieval.
confidence: low
