arxiv_id: "2607.07666"
title: A hierarchical memory architecture overcomes context limits in
  long-horizon multi-agent computational modeling
url: https://doi.org/10.48550/arxiv.2607.07666
drafted_at: 2026-10-26
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-horizon-execution
statement: For multi-session computational modeling workflows (PKPD/PBPK),
  capping the number of state categories in a three-layer memory and evicting
  completed work keeps injected context small (median 301 tokens, max 4,050)
  and supports continuous autonomous operation, with ablations showing memory,
  retrieval and principal-investigator oversight fixing distinct failure modes
  rather than one shared one.
kind: mechanism
backing_strength: single-paper
scope_condition: Multi-agent scientific modeling workflows in computational
  biology run over many sessions; replicated across proprietary and
  open-weight backbones (DeepSeek-V4-Flash/Pro, Llama 3.1 70B).
technique: hierarchical-memory
proposed_technique: Bound injected context by capping state categories and
  evicting completed work
technique_summary: A three-layer memory writes agent state into a fixed set of
  categories and evicts finished items, so the context injected per step stays
  small regardless of how long the workflow runs.
technique_kind: process
technique_validated_by: Reported injected-context token statistics (median
  301, max 4,050), autonomous PKPD model selection, parameter recovery against
  single-agent baselines, and feature-level ablations of memory, retrieval and
  PI oversight; no matched-compute baseline reported.
stance_on_existing: supports
related_claim_id: managing-context-explicitly-paging-information-out-bounded-window
stance_reason: The paper shows explicit bounded-window context management
  sustaining performance on workflows longer than a single context.
falsifier: An ablation in which removing the category cap and eviction leaves
  injected context and task completion unchanged, or in which memory,
  retrieval and PI oversight turn out to fix the same failures
  interchangeably.
evidence_note: "Abstract-level evidence only: token statistics and comparative
  parameter recovery are reported but no numbers for the baseline or ablation
  deltas are given, and the modeling domain is narrow."
confidence: low
