arxiv_id: "2603.00055"
title: "M3-AD: Reflection-aware Multi-modal, Multi-category, and
  Multi-dimensional Benchmark and Framework for Industrial Anomaly Detection"
url: https://doi.org/10.48550/arxiv.2603.00055
drafted_at: 2026-11-20
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For 4B-8B vision-language models fine-tuned to revise their own
  industrial anomaly judgments, a reflection reward that pays out only when
  revision flips an initially wrong answer to correct and charges a cost
  otherwise produces better detection and localization than reward schemes
  that give positive credit to reflection regardless of outcome, which induce
  redundant revisions.
kind: mechanism
backing_strength: single-paper
scope_condition: Zero-shot industrial anomaly detection (texture, workpiece,
  electronic scenes) with Qwen-3-VL 4B/8B backbones trained by SFT then GRPO;
  shown on one benchmark built by the same authors.
technique: ""
proposed_technique: Pay reflection only when it flips a wrong answer right
technique_summary: "During RL fine-tuning, score the model's self-revision
  step by comparing pre- and post-reflection predictions: +1 when reflection
  corrects an error, negative when it breaks a correct answer or changes
  nothing, so reflection is triggered only where it pays."
technique_kind: training
technique_validated_by: Ablation over four reflection-reward configurations on
  the authors' M3-AD-Bench, measuring accuracy, balanced accuracy,
  anomaly-type score and IoU-based localization F1; the cost-plus-penalty
  variant beat positive-only variants, and the full three-reward combination
  reached 80.3 accuracy vs 75.7 for the SFT-only model at 4B.
stance_on_existing: supports
related_claim_id: self-critique-without-grounding-unreliable
stance_reason: The paper's reward design makes revision contingent on a
  ground-truth correctness label rather than the model's own sense that
  something is off, and finds unconditioned reflection degenerates into
  redundant revision.
falsifier: An ablation under the same backbones and benchmark where a
  reflection reward giving positive credit for any reflection matches or beats
  the flip-conditioned reward on accuracy and localization.
evidence_note: Measured, but on a benchmark the authors constructed from their
  own re-annotation pipeline, with difficulty labels defined by a
  Qwen2.5-VL-72B base model; the reward ablation table shows non-monotonic
  interactions between the three reward terms (some two-term combinations
  score below one-term ones), so the attribution to the reflection cost alone
  is not cleanly isolated.
confidence: low
