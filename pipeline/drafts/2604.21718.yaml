arxiv_id: "2604.21718"
title: Building a Precise Video Language with Human-AI Oversight
url: https://doi.org/10.48550/arxiv.2604.21718
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: "When natural-language critiques are used as post-training
  supervision for video captioning models, the critiques' precision, recall
  and constructiveness each independently govern downstream gains: degrading
  any one of the three (injecting a wrong point, dropping a needed correction,
  or removing the stated fix) substantially lowers caption, reward-modeling
  and critique scores relative to critiques that have all three."
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3-VL-8B post-trained by SFT/DPO/RLHF-V on ~20k
  (pre-caption, critique, post-caption) triplets over ~4k films, games,
  commercials and user clips; degradations synthesized by an LLM from human
  ground-truth critiques.
technique: ""
proposed_technique: Make the critique itself produce the corrected output
technique_summary: Require each human critique to be the sole input that
  drives a model from its pre-caption to the accepted post-caption, which
  forces critiques to be accurate, complete and to state the fix.
technique_kind: process
technique_validated_by: "Ablation on controlled critique corruptions:
  full-quality critiques gave caption BLEU-4 18.2, reward accuracy 89.8,
  critique BLEU-4 41.7, versus 12.1/47.1/21.9 (inaccurate), 12.5/56.6/28.7
  (incomplete), 13.4/67.2/32.9 (unhelpful), 12.7/62.0/26.2 (Gemini-2.5-Pro
  critiques with video), and 14.8/73.1/35.7 before second-stage quality
  control."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A post-training run where critiques stripped of their stated fixes,
  or missing a share of needed corrections, yield downstream
  caption/reward/critique scores statistically indistinguishable from
  full-quality critiques at matched volume.
evidence_note: Measured on one benchmark the authors built, one backbone
  (Qwen3-VL-8B), with degradations generated by Gemini-2.5-Pro rather than
  independently sourced; metrics are BLEU-4 against the authors' own reference
  captions and critiques, so part of the gap may reflect stylistic match to
  the reference rather than usefulness. No matched-token-count control for the
  shorter degraded critiques.
