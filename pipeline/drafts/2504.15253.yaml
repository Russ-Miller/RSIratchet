falsifier: A judge whose critiques, fed back to the generator, raise final accuracy above best-of-n
  reranking on the same benchmark, or frontier closed judges that close the process-reward gap.
evidence_note: Systematic across judge and generator sizes; the refinement result lacks an oracle
  upper bound so 'ineffective' means no gain over the generator's own retry rather than a measured
  ceiling. Open models up to 72B only.
