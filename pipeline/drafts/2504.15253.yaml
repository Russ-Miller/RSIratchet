statement: Used to steer test-time compute, generative LLM judges (7B-70B) rerank candidate
  responses about as well as outcome reward models, are consistently worse than process reward
  models at step-level beam search, and their natural-language critiques, the one thing only
  a judge can produce, did not guide generators to better responses on math, code or instruction
  following.
kind: observation
backing_strength: single-paper
scope_condition: 'JETTS: 10 judge models and 8 generators (6.7B-72B), 2025; three tasks (reranking,
  beam search, critique-based refinement) in math, code and instruction following; open models
  only.'
