capability: multi-model-coordination
statement: In a hierarchical multi-agent system where a controller gates
  acceptance of worker outputs on semantic entropy and semantic density
  computed over resampled completions, the intervention helps only where
  failures come from semantic instability (vague or contradictory outputs) and
  hurts where they come from evidence selection or reasoning-chain errors
  \u2014 gaining on ambiguity/hallucination-prone benchmarks while losing
  10-14 points on multi-hop QA.
kind: mechanism
backing_strength: single-paper
scope_condition: Hierarchical controller-plus-worker systems with small local
  workers (3-8B) and a frontier controller; benchmark subsets of 100-500
  items, mostly single runs.
technique: ""
proposed_technique: Gate worker outputs on semantic entropy plus density
technique_summary: The orchestrator resamples each worker response, computes
  semantic entropy and embedding-space semantic density, and accepts only if
  both clear thresholds, otherwise reprompts, reassigns, or delegates in
  parallel.
technique_kind: process
technique_validated_by: "Accuracy against the same system with metrics
  disabled across nine benchmarks: StrategyQA 78% vs 70%, TruthfulQA 41% vs
  19%, JailbreakBench 61% vs 25%, but MuSiQue 45% vs 55% and HotpotQA 54% vs
  68%; metric-isolation ablation showed either metric alone fell below the
  no-metric baseline."
