arxiv_id: '2602.04853'
title: Decomposed Prompting Does Not Fix Knowledge Gaps, But Helps Models Say "I Don't Know"
url: https://arxiv.org/abs/2602.04853
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: factual-recall
statement: In closed-book multi-hop QA the accuracy gain from decomposed prompting shrinks to
  little in frontier models, but answers still change between task-equivalent prompt regimes
  (agreement only about 70%, and about 60% on MuSiQue), and because stable facts survive re-prompting
  while hallucinations do not, disagreement across regimes detects errors better than standard
  uncertainty baselines on F1 and AUROC without retrieval or training.
kind: mechanism
backing_strength: single-paper
scope_condition: Direct, assistive and incremental prompting on multi-hop QA benchmarks across
  model scales, 2026; abstention policy built on cross-regime disagreement.
technique: ''
proposed_technique: Abstain on disagreement between task-equivalent prompt regimes
technique_summary: Ask the same closed-book question under two or three equivalent prompt structures
  (direct, decomposed, incremental); if the answers disagree, treat the fact as unknown and
  abstain, since memorized facts are stable across regimes and hallucinations are not.
technique_kind: prompting
technique_validated_by: F1 and AUROC as an error detector against verbalized-confidence and
  consistency baselines on multi-hop QA across model scales; training-free.
stance_on_existing: neither
related_claim_id: ''
stance_reason: ''
falsifier: Domains where a memorized wrong fact is stable across regimes (consistent misconceptions),
  which the method would pass as known.
evidence_note: Also bears on abstention-and-self-knowledge; the mechanism (stable facts, stochastic
  hallucinations) is stated and tested on QA only.
confidence: medium
