arxiv_id: "2602.11000"
title: Fine-Tuning GPT-5 for GPU Kernel Generation
url: https://doi.org/10.48550/arxiv.2602.11000
drafted_at: 2026-11-11
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: "When RL fine-tuning a frontier model for Triton GPU kernel
  generation with a verifiable reward that is mostly saturated by correctness
  (logistic reward shifted so a TorchInductor-parity kernel already earns
  about half the maximum), functional correctness rises far more than speed:
  GPT-5 went from 43.7% to 77.0% correct single-attempt while geometric mean
  speedup over TorchInductor moved only 0.73x to 0.81x."
kind: mechanism
backing_strength: single-paper
scope_condition: Triton kernel generation on a 264-problem extended
  KernelBench evaluation set, H100 GPUs, single-attempt setting, reward shift
  parameter 1.8; base model already competent at Triton (RL on Qwen 4B-32B
  plateaued).
technique: ""
proposed_technique: Shape the kernel RL reward so speedup, not correctness, is the scarce reward
technique_summary: Reward a generated GPU kernel with zero if it fails to
  compile or validate, otherwise a logistic function of correctness plus
  measured speedup over the compiler baseline, with a shift parameter setting
  how much speedup is needed before the reward saturates.
technique_kind: training
technique_validated_by: "Single-attempt KernelBench: correctness 43.7% to
  77.0%, fraction beating TorchInductor 14.8% to 21.8%, geometric mean speedup
  0.73x to 0.81x against the unmodified GPT-5 baseline and several frontier
  models; the speedup/correctness split is attributed by the authors to the
  shift value, not ablated."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Training the same setup with a much larger shift parameter
  (requiring high speedup before reward saturates) yields no greater gain in
  geometric mean speedup than the shift-1.8 run, or a run that rewards only
  correctness produces comparable speedup gains.
evidence_note: Measured on 264 extended-KernelBench problems against base
  GPT-5 and several frontier models, single and three-attempt settings. The
  reward-shift explanation is argued from the reward's functional form, not
  isolated by an ablation over shift values; a competing explanation the
  authors themselves give is that more solved problems enlarge the
  geometric-mean denominator with harder, slower kernels. Evaluation set was
  partly deduplicated from the training pool but the training corpus is
  proprietary.
confidence: medium
