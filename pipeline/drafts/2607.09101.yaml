arxiv_id: "2607.09101"
title: Multi-Agent LLM Collaboration for Unit Test Generation via
  Human-Testing-Inspired Workflows
url: https://doi.org/10.48550/arxiv.2607.09101
drafted_at: 2026-10-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: For LLM-based unit test generation on Java repositories, giving the
  agent a test-specialized repository knowledge graph (code entities,
  dependencies, test-focal links, plus stored test reports and failure
  analyses) contributes more to coverage and fault detection than either the
  reviewer agent or similar-test retrieval.
kind: observation
backing_strength: single-paper
scope_condition: Java projects with GPT-4o backbone; measured on six
  open-source projects (1,454 focal methods) via an ablation of one
  multi-agent system.
technique: ""
proposed_technique: Build a test-specialized repository knowledge graph for test agents
technique_summary: Static analysis builds a repository graph of code entities
  and dependencies with test-specific nodes and test-focal links, which also
  persists function summaries, test reports and root-cause analyses for agents
  to query via tools.
technique_kind: retrieval
technique_validated_by: "Ablation on six Java projects: removing the knowledge
  graph dropped line coverage 92.34%->75.65%, branch 90.24%->72.62%, mutation
  83.69%->66.12%; removing the reviewer cost ~4-8% relative and removing
  similar-test retrieval ~1-3%."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on comparable repositories where removing the knowledge
  graph costs no more coverage or mutation score than removing the reviewer
  agent, or where a plain rule-based focal-class context matches graph-based
  retrieval.
evidence_note: Measured as a single-system ablation, one backbone (GPT-4o),
  six Java library projects, against EvoSuite/ChatUniTest/HITS baselines. The
  ablation does not separate the graph's structural retrieval from its role as
  a store of accumulated testing artifacts, and coverage/mutation gains are
  reported without variance or repeated runs.
confidence: medium
