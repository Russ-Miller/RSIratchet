related_claim_id: adversarially-edited-image-tasks-chain-of-thought-prompting-moves-multimodal-models
stance_reason: That claim holds CoT raises accuracy on
  counterfactual-attribute questions that pit language priors against the
  image, while FREAK's counter-commonsense attribute items show accuracy
  falling for most models when reasoning is enabled.
falsifier: A matched evaluation on fine-grained counter-commonsense edits
  where enabling reasoning raises accuracy and lowers the commonsense-answer
  rate for most tested models, or where the probability-trajectory analysis
  shows no late-stage reversal.
evidence_note: "Measured: direct-vs-reasoning accuracy and HalluRate for 11
  models, with drops of 0.4-8.2 points for 9 of 11 and HalluRate rising in 9
  of 11; mechanism argued from time-series K-means clustering of
  correct-option probability across reasoning steps for three open models,
  where ~70% of errors start wrong and the rest flip late. No human-rater
  check of the trajectory interpretation, and the benchmark's images come from
  one generation/editing model pair."
