capability: hallucination
statement: On photorealistic images containing a single localized
  counter-commonsense edit, eliciting reasoning before the answer (CoT
  prompting for non-reasoning models, thinking mode for reasoning models)
  lowers accuracy and raises the rate of answering with the commonsense prior
  for most multimodal models, because late-stage generated text reverses
  correct initial judgements rather than re-examining the image.
kind: observation
backing_strength: single-paper
scope_condition: 1,786 AI-generated images with fine-grained
  counter-commonsense edits, multiple-choice with cyclic option permutation
  plus free-form; 18 proprietary and open models; holds for most but not all
  (Gemini-2.5-Flash improved).
technique: chain-of-thought
