capability: long-horizon-execution
statement: For LLM agents on long-horizon web penetration testing, holding the
  backbone model fixed and moving global state out of the context window onto
  a persistent graph of verified facts and fact-conditioned intent edges
  raises task success most on the hardest tasks, where success depends on
  facts obtained dozens of steps earlier (88.2% overall and 75.0% hard, vs
  44.1% and 25.0% for the strongest shared-plain-text-memory baseline).
kind: mechanism
backing_strength: single-paper
scope_condition: Real CTF web challenges, more than ten vulnerability types,
  three difficulty levels; all agents on the same LLM API; 40-round per-task
  budget; the graph's offline prior corpus blacklisted the evaluated
  challenges.
technique: ""
proposed_technique: Externalize agent state onto a fact-intent DAG
technique_summary: Store verified environment observations as immutable fact
  nodes in a persistent graph and allow an action only as an intent edge whose
  preconditions are already-verified facts, replacing in-context state
  maintenance.
technique_kind: process
technique_validated_by: Task success rate against five baselines (PentestGPT,
  PentestAgent, Pentest-R1, VulnBot, Claude Code) on real CTF challenges with
  Fisher's exact test, plus average rounds per successful task (~7 vs
  ~12-23.6) and an ablation removing only the intent retrieval module (33% and
  48% more rounds on medium and hard, same solvable set).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An agent with the same backbone and tool access, but plain
  in-context or text-tree state, matching the graph-state system's success
  rate on hard long-horizon tasks; or the gap disappearing once the baselines
  are given comparable scheduling and retry machinery.
evidence_note: Measured on a modest CTF set (about 34 tasks inferred from the
  per-level percentages), single paper, authors' own system. The comparison
  confounds the DAG with two other contributions — the
  scheduling/degradation-recovery layer and the five-stage intent retrieval —
  so the DAG's isolated contribution is not established; the one ablation
  removes only intent retrieval and changed rounds, not the set of solved
  tasks.
confidence: low
