arxiv_id: "2602.21704"
title: Dynamic Multimodal Activation Steering for Hallucination Mitigation in
  Large Vision-Language Models
url: https://doi.org/10.48550/arxiv.2602.21704
drafted_at: 2026-11-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 7B vision-language models (LLaVA-1.5, QwenVL), a single averaged
  truthfulness steering vector is weaker than retrieving a cluster-specific
  one by input semantic similarity, because the truthful-minus-hallucinated
  activation difference separates into distinct regions by semantic context —
  the fixed vector even scores below the untouched model on one MME subtask.
kind: observation
backing_strength: single-paper
scope_condition: Two 7B open LVLMs; steering vectors built from AMBER and SEED
  split into 4 semantic clusters; evaluated on MME, POPE, CHAIR;
  hyperparameters grid-searched.
technique: ""
proposed_technique: Retrieve a semantically matched truthfulness steering vector per query
technique_summary: Builds a key-value database of per-semantic-cluster
  truthfulness steering vectors (truthful minus hallucinated attention-head
  activations, PCA-denoised), retrieves the nearest by sentence-embedding
  similarity at inference, and adds it plus a noise-contrast visual perception
  vector to the top-K most influential attention heads.
technique_kind: decoding
technique_validated_by: MME total score +94.66 over the LLaVA-1.5 baseline and
  +10.89 over ICT; CHAIR_S 51.0 to 30.8 (vs VTI 35.8); POPE accuracy and F1
  above most baselines; ablation shows removing either vector loses ground and
  a fixed merged vector underperforms dynamic retrieval on every MME subtask.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matching a fixed steering vector against the dynamic one at equal
  tuning budget and finding no gap, or showing the t-SNE cluster separation
  does not predict which vector helps a given query.
evidence_note: Measured on two 7B backbones across MME, POPE (MSCOCO, GQA),
  CHAIR, plus ScienceQA/ViQuAE generality checks. Ablation isolates the
  fixed-vs-dynamic comparison on MME only. Hyperparameters alpha, beta and K
  were grid-searched per setting, and no matched search budget is reported for
  the fixed-vector arm, so part of the gap may be tuning. Cluster count fixed
  at 4 by sweep.
confidence: low
