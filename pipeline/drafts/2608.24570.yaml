proposed_technique: Scaffold diagnosis with evidence tools and a coverage-based stopping harness
technique_summary: Builds patient-specific interactive environments, routes
  diagnosis through role-specialized agents querying evidence tools against an
  evolving evidence state, and uses an observer that tracks hypothesis
  uncertainty and evidence coverage to decide when to terminate evidence
  gathering.
technique_kind: process
