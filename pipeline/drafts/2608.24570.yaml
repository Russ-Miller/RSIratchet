statement: For LLM agents doing active clinical diagnosis in interactive
  patient environments, wrapping the model in a scaffold of role-specialized
  agents, evidence tools and an explicit evidence state, with a runtime
  observer that tracks uncertainty and evidence coverage to decide when to
  stop acquiring evidence, raises both diagnostic accuracy and execution
  stability over static case-to-answer prompting, with the size of the gain
  depending on the backbone model.
kind: observation
