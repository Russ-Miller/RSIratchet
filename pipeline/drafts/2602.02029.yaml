arxiv_id: "2602.02029"
title: Canonical Intermediate Representation for LLM-based optimization
  problem formulation and code generation
url: https://doi.org/10.48550/arxiv.2602.02029
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: When an LLM must turn natural-language operational rules into
  solver code, inserting an explicit intermediate schema step — mapping each
  rule to retrieved constraint archetypes and a chosen modeling paradigm
  before any mathematics is written — raises solution accuracy over direct
  text-to-constraint translation, because a single rule often expands into
  several constraints whose form depends on the paradigm chosen for the whole
  model.
kind: mechanism
backing_strength: single-paper
scope_condition: Optimization-model generation (MILP/scheduling-style) where a
  curated archetype library covers the problem domain; measured with a
  DeepSeek-v3.2 backbone, and the gain shrinks on a weaker 32B backbone.
technique: ""
proposed_technique: Map rules to a canonical intermediate schema before formulating
technique_summary: A multi-agent pipeline extracts entities and rules from the
  problem text, retrieves constraint archetypes with candidate modeling
  paradigms from a curated knowledge base, clusters them to pick one
  compatible paradigm, then instantiates the mathematical model and solver
  code, with a checker validating each stage's output.
technique_kind: prompting
technique_validated_by: "Accuracy Rate (objective value within 1% of reference
  optimum), averaged over five runs. On the authors' own 50-problem
  ORCOpt-Bench: 47.2% vs 22.4% standard prompting, 30.2% Chain-of-Experts,
  37.8% Reflexion, 45.4% Grok-4. Ablation removing the CIR library (RAG over
  raw text instead) drops to 31.6%; removing the checker drops to 41.6%. On
  external benchmarks IndustryOR 57.0 vs 53.0 standard prompt, BWOR 75.6 vs
  63.4, OptMATH 44.6 vs 44.0."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled comparison at matched token budget where the
  archetype-schema step gives no accuracy gain over direct prompting on
  optimization-modeling benchmarks, or where retrieving raw domain text
  instead of structured archetypes performs equally well.
evidence_note: "Measured on one self-built 50-problem benchmark plus three
  prior benchmarks, single backbone family for the ablations, five runs
  averaged. The CIR ablation isolates the structured-schema contribution from
  retrieval generally (31.6 vs 47.2). Weak points: the benchmark was built by
  the same authors who curated the archetype library (they state the source
  literature is disjoint but domains are the same ten), no matched-compute
  baseline against the multi-agent overhead, and on the external benchmarks
  the margin over plain prompting is small (OptMATH +0.6)."
confidence: medium
