falsifier: A backbone on which prompted numeric confidence falls below the
  threshold on a meaningful share of first generations, producing a selective
  working point whose cost-accuracy trade-off beats the sentinel.
evidence_note: Measured, single paper, one 100-question BBH sweep for the
  threshold result plus a 500-item sentinel confusion matrix; the authors
