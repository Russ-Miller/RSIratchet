capability: abstention-and-self-knowledge
statement: In a training-free generate-critique-revise loop on a frozen
  backbone, a self-reported numeric confidence tag is useless as a stopping
  signal because the model declares high confidence on essentially every first
  generation (every threshold from 0.6 to 0.9 halted the loop at step 1 on 100
  BBH questions), whereas a textual CONFIRMED sentinel from the critique stops
  82-88% of items at unchanged accuracy.
kind: observation
backing_strength: single-paper
scope_condition: Pure-reasoning benchmarks (BBH, GSM8K, MATH), frozen API
  backbones deepseek-v4-flash and Qwen2.5-72B, depth-3 loop, prompt-only
  confidence elicitation.
technique: stop-self-critique-loop-confirmed-sentinel
proposed_technique: ""
technique_summary: ""
technique_kind: ""
technique_validated_by: "Threshold sweep tau in {0.6,0.7,0.8,0.9} plus anchors
  on 100 BBH questions: average steps 1.00 and 100% early stop at every
  threshold, versus 2.06 steps and 83% early stop under the sentinel at
  statistically indistinguishable accuracy; confusion matrix at n=500 shows
  the sentinel agreeing with actual Step-1 correctness in 78% of cases (16%
  false confirms, 6% needless revisions)."
