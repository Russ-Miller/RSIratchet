arxiv_id: "2602.18671"
title: Spilled Energy in Large Language Models
url: https://doi.org/10.48550/arxiv.2602.18671
drafted_at: 2026-11-21
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For 1B-8B open LLMs (LLaMA-3, Mistral, Gemma), the gap between a
  token's logit at one decoding step and the log-sum-exp normalizer at the
  next step — quantities the chain rule says should match — separates correct
  from hallucinated answers when read over the exact-answer tokens with min
  pooling, averaging higher AuROC than logit confidence, p(true), and
  cross-dataset-transferred trained probes.
kind: mechanism
backing_strength: single-paper
scope_condition: Requires white-box access to logits and prior localization of
  the exact answer span; signal is unreliable on punctuation and
  sentence-initial tokens, and per-dataset variance is large (near chance on
  Winogrande/Winobias, below 60 on IMDB for several models).
technique: ""
proposed_technique: Score the energy mismatch between consecutive decoding steps
technique_summary: Compute, at the exact-answer tokens, the difference between
  the sampled token's logit at step i and the negative log-sum-exp over the
  vocabulary at step i+1, and threshold that discrepancy as a training-free
  hallucination score.
technique_kind: decoding
technique_validated_by: AuROC on nine benchmarks (HotpotQA, IMDB, Math, MNLI,
  Movies, TriviaQA, Winobias, Winogrande) across four LLMs plus synthetic
  multi-digit arithmetic with graded error magnitudes; baselines were logit
  confidence, p(true), and Orgad et al. probing classifiers evaluated
  cross-dataset (average 73.16 vs 64.16 for probes on LLaMA-3-Instruct).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A trained probe, or plain logit confidence, matching or beating
  spilled energy on average cross-dataset AuROC over the same nine benchmarks
  with exact-answer localization and min pooling held fixed; or spilled energy
  dropping to chance when the probe baseline is retrained on pooled
  multi-dataset data.
evidence_note: "Measured, not argued: AuROC tables over 9 datasets x 4 models
  plus Gemma 1B/4B, with per-dataset standard deviations. The average favors
  spilled energy but per-dataset results are highly uneven — some cells fall
  well below 50, and marginal energy beats spilled energy on
  non-instruction-tuned Mistral. The probe baseline is cross-dataset only, so
  the comparison is about transfer, not in-distribution probing. No comparison
  to semantic entropy or sampling-based detectors."
confidence: medium
