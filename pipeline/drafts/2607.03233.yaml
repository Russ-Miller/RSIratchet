backing_strength: single-paper
scope_condition: A curated corpus of 74 OSINT/CTI/cyber-investigation studies,
  48 of which received full 21-field extraction including a dedicated
  hallucination-measurement field; corpus assembled by expert curation rather
  than a reproducible database export.
