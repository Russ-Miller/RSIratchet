falsifier: A systematic search of the same domain and period turning up
  several OSINT-specific systems reporting end-to-end hallucination rates on
  OSINT data, showing the single-measurement finding is an artifact of
  curation.
evidence_note: Argued from a coding pass over 48 primary and methodological
  papers with a binary hallucination-measured field; the one reported rate
  (4%) came from a single RAG system under conditions the authors call
  non-reproducible. The design shows absence of measurement in this corpus,
  not that measurement is absent from the field, since corpus construction was
  expert curation without per-database counts.
