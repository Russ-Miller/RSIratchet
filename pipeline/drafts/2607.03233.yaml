statement: In the published literature applying LLMs and agentic AI to
  open-source intelligence, hallucination is named as a primary reliability
  concern in more than twenty studies while being measured end-to-end on OSINT
  data in only one system, so claimed OSINT reliability rests on an
  essentially empty quantitative base.
