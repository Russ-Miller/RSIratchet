arxiv_id: '2607.23513'
title: Do Diagrams Help Large Language Models Reason? Evidence from Syllogistic Reasoning
url: https://arxiv.org/abs/2607.23513
drafted_at: '2026-09-19'
drafted_from: full-text
model: claude-opus-5 (drafted in session, not via API)
status: draft — not filed.
capability: logical-deduction-robustness
statement: Presenting syllogisms as Euler or linear diagrams instead of text or logical notation
  did not consistently improve two models' accuracy on 285 problems; both did well on entailment
  and contradiction items but poorly on neutral ones (GPT-4o-mini under 30% on neutral cases),
  and made systematic conversion errors, treating 'all A are B' as if it implied 'all B are
  A'.
kind: observation
backing_strength: single-paper
scope_condition: Claude 3.5 Sonnet and GPT-4o-mini, 285 syllogisms from Ando et al. 2024 in
  four representations, 2026.
