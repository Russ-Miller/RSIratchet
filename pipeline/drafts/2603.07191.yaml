status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: prompt-injection
statement: For tool-call authorization in agent frameworks, an LLM prompted as
  a judge comparing the proposed tool call against the original task
  description intercepts over 90% of prompt-injection and
  RAG-poisoning-induced malicious calls, while zero-shot NLI entailment
  classifiers on the same pairs intercept under 10%.
kind: observation
backing_strength: single-paper
scope_condition: Measured on a 1,081-sample synthetic bilingual benchmark
  generated by GPT-4o-mini, with a black-box non-adaptive attacker;
  hand-crafted evasion prompts (authority injection, double negation) cut
  interception to 30-63%.
technique: ""
proposed_technique: Judge each tool call against the original task intent
technique_summary: Before any high-risk tool invocation, a separate LLM judge
  is shown the task description and the proposed call and must emit ALLOW or
  BLOCK with a one-sentence rationale.
technique_kind: process
technique_validated_by: Interception rate and false-positive rate on 457
  malicious plus 464 benign tool calls per language, against an unverified
  baseline (0% IR) and two NLI baselines (BART-MNLI 8-10% IR, mDeBERTa ~0%);
  generalization checked on InjecAgent (99-100% interception).
stance_on_existing: supports
related_claim_id: long-trusted-instructions-untrusted-retrieved-content-occupy-same-model
stance_reason: The paper's own adversarial probe shows the semantic judge
  reduces but does not remove injection success, and it argues the residual
  threat classes need isolation at the sandbox and authorization layers.
falsifier: An evaluation on independently authored (non-LLM-generated)
  injection samples where a prompted LLM judge's interception falls near the
  NLI baselines, or where a tuned NLI classifier reaches comparable
  interception at comparable false-positive rate.
evidence_note: Measured across five LLM judges (3.4GB local to cloud
  GPT-4o-mini) on a benchmark the authors generated with GPT-4o-mini, which is
  also one of the judges; circularity is partly bounded by an independent Qwen
  judge scoring equal or higher. False positives are high for most local
  judges (24-38%), making standalone deployment impractical at realistic 1%
  attack prevalence (PPV under 23%). Single-author label verification on a 10%
  sample.
confidence: low
