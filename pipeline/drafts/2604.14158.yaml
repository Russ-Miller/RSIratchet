statement: In interactive detective-game environments where clues are
  discovered progressively, frontier LLMs unlock most of the available memory
  fragments (over 80% MFU for several closed-source in-context models) while
  correctly ordering far fewer of them on the gold timeline (15.91-45.46%
  MFCO), so fragment-discovery rate does not indicate ability to reconstruct
  temporal relations among remembered fragments.
kind: observation
backing_strength: single-paper
scope_condition: Text-based gamified interactive scenarios with
  graph-structured clue dependencies; measured on one detective visual-novel
  environment with 54 dialogue fragments and a 600-step interaction cap.
