falsifier: A model whose fragment-unlock rate and temporal-ordering accuracy
  track each other closely across these or comparable interactive
  environments, or a showing that the low MFCO stems from the ordering
  metric/interface rather than the model's temporal reasoning.
evidence_note: Measured across four closed-source and one open-source model,
  each with in-context and two memory-agent configurations, on three games;
  the temporal claim rests on a single environment and one run per
  configuration, with no variance reported, and the QA score is graded by LLM
  evaluators.
