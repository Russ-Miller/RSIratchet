arxiv_id: "2602.16455"
title: "Visual Self-Refine: A Pixel-Guided Paradigm for Accurate Chart Parsing"
url: https://doi.org/10.48550/arxiv.2602.16455
drafted_at: 2026-11-10
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: self-repair
statement: For a 3B vision-language model fine-tuned on chart parsing,
  re-presenting the model's own predicted data-point coordinates as markers
  drawn on the original chart image and asking it to inspect them corrects
  most structural perception errors (omissions, duplicates, mislocalizations)
  that the same model does not detect when asked to review its output in text,
  with gains concentrated on visually dense charts and almost entirely in the
  first refinement round.
kind: mechanism
backing_strength: single-paper
scope_condition: Chart parsing with a 3B Qwen2.5-VL model fine-tuned on
  synthetic chart data with a two-stage localize-then-decode format; the
  feedback is a rendering of the model's own output, not ground truth.
technique: ""
proposed_technique: Render the model's own localizations back as an image
technique_summary: The model emits pixel-level coordinates for each data
  point, those coordinates are drawn as markers on the original image, and the
  edited image is fed back to the same model to confirm or correct before a
  second pass parses values.
technique_kind: process
technique_validated_by: "SCRM average precision on ChartP-Bench against the
  same model without the visual-feedback loop (38.41 vs 36.54 average, with
  the hard subset 37.66 vs 35.14), plus per-round counts: 110 error charts
  fall to 51 after one round with 92.3% error recall and 88.2% precision on
  confirming already-correct localizations; later rounds leave the error count
  roughly flat. Cost rises from 1 to at least 3 forward passes."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched condition in which the same model is given its
  coordinates as text (or a textual list of flagged discrepancies) recovers
  the same error rate, or in which the visual-feedback loop gives no advantage
  on charts with high data-point density.
evidence_note: Measured on one benchmark the authors built (1,200 charts) with
  a single 3B backbone and one ablation arm; the aggregate gain is under 2 AP
  points and the strict metric is near zero for all systems, so the ablation
  leans on the lenient thresholds. The text-feedback comparison is a
  qualitative GPT-4o illustration (Figure 2), not a controlled arm, so the
  modality contrast is argued more than measured. Transfer to counting and
  grounding is illustrated, not scored.
confidence: low
