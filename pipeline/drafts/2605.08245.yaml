arxiv_id: "2605.08245"
title: "When Language Overwrites Vision: Over-Alignment and Geometric
  Debiasing in Vision-Language Models"
url: https://doi.org/10.48550/arxiv.2605.08245
drafted_at: 2026-11-02
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 7B decoder-based vision-language models (LLaVA-1.5-7B,
  Qwen2.5-VL-7B), a few top principal components of a dataset-agnostic
  text-embedding subspace act as a modality anchor carrying linguistic rather
  than visual information, so projecting visual embeddings orthogonal to those
  components at inference lowers object-hallucination rates (AMBER CHAIR 9.20
  to 6.74 on LLaVA-1.5-7B) without reducing POPE accuracy or general benchmark
  scores.
kind: mechanism
backing_strength: single-paper
scope_condition: Decoder-based VLMs with a cross-modal projector into an LLM;
  text subspace estimated by PCA over pretraining captions; may fail on highly
  out-of-distribution domains where the bias is not linearly isolable.
technique: ""
proposed_technique: Project visual embeddings off the top text principal components
technique_summary: Mean-center visual embeddings against a text manifold
  estimated by PCA over pretraining captions and subtract their projection
  onto the top k principal components, either at inference or inside the
  fine-tuning forward pass.
technique_kind: decoding
technique_validated_by: POPE, AMBER (CHAIR, HAL), CHAIR_i/CHAIR_s, MME and
  MMBench on LLaVA-1.5-7B and Qwen2.5-VL-7B against zero-shot and four
  training-free decoding baselines (VCD, SID, VISTA, DMAS); fine-tuned variant
  scored by CLAIR on VRSBench and TextCaps against standard SFT at matched
  data and budget; plus layer-wise linear probing (mAP on 80 COCO categories)
  and logit-lens decoding of image patches.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Showing the hallucination reduction comes from reduced
  informativeness (object recall or caption coverage falling with it), or that
  ablating an equal number of random or lower-ranked directions gives the same
  reduction, or that the top text PCs are dataset-specific rather than shared
  across corpora.
evidence_note: Measured on two 7B open models over
  POPE/AMBER/CHAIR/MME/MMBench plus CLAIR captioning, with baselines and a
  matched-budget SFT control; mechanism is supported by alignment-score
  trajectories, cross-dataset subspace overlap, linear probing and logit-lens
  decoding. Reported recall holds (Qwen 67.10 to 67.48) but drops slightly on
  LLaVA (77.90 to 75.11), so the informativeness control is not fully clean.
  Single paper, authors' own evaluation, no reported variance.
confidence: medium
