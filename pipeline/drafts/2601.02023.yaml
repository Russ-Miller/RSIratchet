arxiv_id: "2601.02023"
title: "Not All Needles Are Found: How Fact Distribution and Don't Make It Up
  Prompts Shape Retrieval, Reasoning, and Hallucination in Long-Context LLMs"
url: https://doi.org/10.48550/arxiv.2601.02023
drafted_at: 2026-11-15
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: "Adding an explicit 'don't make it up, say you don't know if it
  isn't in the text' instruction to long-context needle-in-a-haystack prompts
  raises faithfulness but costs literal extraction and inference accuracy on
  facts that are actually present, and the size of that cost is model-specific
  rather than general: for ChatGPT-5-mini at full context capacity extraction
  fell 89% to 72% and inference 88% to 68%, while Gemini-2.5-flash,
  Deepseek-v3.2-chat and Claude-4.5-haiku moved by a few points or not at
  all."
kind: observation
backing_strength: single-paper
scope_condition: Four production mid-tier models (Gemini-2.5-flash,
  ChatGPT-5-mini, Claude-4.5-haiku, Deepseek-v3.2-chat) on synthetic facts
  injected into a fiction corpus, 30-question quizzes graded by an LLM judge,
  strict binary refusal-style anti-hallucination wording only.
