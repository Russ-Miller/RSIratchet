evidence_note: "Measured: bivariate sweep of context length x fact depth (200
  quizzes/model) plus 18 distribution quizzes, each prompt condition paired.
  Isolates the prompt wording since everything else is held fixed. Weak
  points: one graded quiz set, one corpus, a single strict AH phrasing (no
  gradient of severity), LLM-judge grading, and only four models so the
  model-specificity rests on n=4."
