statement: For training long-horizon web search agents, filtering synthesized
  QA tasks through staged solvability verification — discarding items a
  baseline model answers from parametric knowledge alone, then keeping only
  items a stronger tool-using agent solves at least once in N attempts —
  yields SFT/RL data on which a 27B open backbone reaches deep-search and
  deep-research benchmark scores comparable to frontier closed agents.
kind: mechanism
backing_strength: single-paper
scope_condition: Web search/research agents with search+visit tools,
  Qwen3.5-27B backbone, benchmarks BrowseComp, BrowseComp-ZH, BrowseComp-Plus,
  WideSearch, DeepResearch-Bench; teacher trajectories from much larger
  same-family models.
technique: ""
proposed_technique: Keep only tasks no closed-book model solves but a tool agent can
technique_summary: Synthesizes long-horizon search QA from web-built evidence
  graphs, then retains only items that a baseline model fails at in all N
  closed-book attempts and that a strong tool-using agent solves at least
  once, using the surviving trajectories for SFT and DAPO RL.
technique_kind: training
technique_validated_by: Reported benchmark scores for the trained 27B agent
  (74.39 BrowseComp-ZH, 70.06 BrowseComp, 63.49 BrowseComp-Plus, 64.0
  WideSearch, 52.55 DeepResearch-Bench), compared to frontier closed agents
  and comparable-scale search agents; no ablation isolating the verification
  filter is shown in the given text.
