arxiv_id: "2603.27184"
title: Incentivizing Temporal-Awareness in Egocentric Video Understanding Models
url: https://doi.org/10.48550/arxiv.2603.27184
drafted_at: 2026-11-07
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For a 3B Qwen2.5-VL model trained with cold-start RLVR on
  egocentric multiple-choice video QA, subtracting the reward of a greedy
  response generated from the same video with its frames shuffled, and
  normalizing the calibrated rewards across the whole mini-batch rather than
  within each group, raises accuracy on five temporally-demanding egocentric
  benchmarks over plain GRPO and GSPO with identical data and hyperparameters.
kind: observation
backing_strength: single-paper
scope_condition: 3B Qwen2.5-VL backbone, 32 uniformly sampled frames,
  multiple-choice/yes-no training subsets of EgoIT99K, binary accuracy plus
  format reward; no SFT stage
technique: ""
proposed_technique: Subtract a shuffled-frame reward baseline and normalize globally
technique_summary: During RL rollout, score each sampled response against the
  reward of a greedy response on the same video with frames shuffled, then
  normalize these calibrated rewards across the entire mini-batch instead of
  within each sampled group.
technique_kind: training
technique_validated_by: Accuracy on EgoSchema (temporal/others splits),
  EgoPlan, EgoPlan2, VLM4D, EgoTempo against GRPO and GSPO baselines trained
  with identical data and hyperparameters; e.g. EgoSchema 49.6 vs 46.5 (GRPO),
  EgoPlan2 42.3 vs 37.1, EgoTempo 45.2 vs 40.0; plus reward-AUC over 3000
  steps.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matched-compute replication where the shuffled-frame baseline and
  global normalization are ablated separately and neither change accounts for
  the gain over GRPO, or where the gain disappears on backbones other than
  Qwen2.5-VL-3B.
evidence_note: Measured on five egocentric multiple-choice benchmarks with one
  backbone and one training corpus; baselines share data and hyperparameters,
  which isolates the objective. But the two ingredients (shuffled baseline,
  global normalization) are never ablated apart from each other, only one
  model scale is tested, EgoTempo distractors were generated by Gemini 2.5,
  and gains are a few points with no variance reported.
confidence: low
