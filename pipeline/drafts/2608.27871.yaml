arxiv_id: "2608.27871"
title: "Temporal Tree of Thought: Reasoning-Guided Visual Cue Search for
  Long-Video Understanding"
url: https://doi.org/10.48550/arxiv.2608.27871
drafted_at: 2026-10-20
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For long-video QA under a fixed frame budget with a frozen 7B
  multimodal model, organizing frames into a question-agnostic hierarchical
  temporal tree and searching it coarse-to-fine (answer, then issue a search
  statement, then expand the relevant branch) raises accuracy over uniform
  sampling and over agent methods that score frames independently, with the
  gain largest on the longest-video benchmarks.
kind: observation
backing_strength: single-paper
scope_condition: Training-free, Qwen2.5-VL-7B, same frame budget as the
  baselines; evaluated on VideoMME, LongVideoBench, LVBench.
technique: ""
proposed_technique: Search a hierarchical temporal tree of video segments coarse-to-fine
technique_summary: Build a question-agnostic tree of contiguous video segments
  by recursive temporally constrained clustering with one key frame per node,
  then run an answer-retrieve-explore loop that expands only branches the
  model says it needs.
technique_kind: retrieval
technique_validated_by: "Accuracy on VideoMME, LongVideoBench and LVBench with
  Qwen2.5-VL-7B at matched frame budget: +0.5%, +4.6%, +4.4% over the
  baseline."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: At a matched frame budget, the tree search fails to beat uniform
  sampling or independent-frame agent selection on long-video QA, or the gain
  disappears once frame count is equalized across methods.
evidence_note: Measured on three long-video QA benchmarks with one 7B
  backbone; gains are small on VideoMME (0.5%) and larger on the two
  longer-video benchmarks. No ablation reported in the source text isolating
  the tree construction from the answer-retrieve-explore loop, and only one
  backbone is shown.
