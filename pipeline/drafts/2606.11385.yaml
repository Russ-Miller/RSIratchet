capability: strategic-deception
statement: On real-world video deception benchmarks (DOLOs, Bag-of-Lies,
  MU3D), prompted frontier and open 7B multimodal models score near chance
  (41-64% accuracy), and a 7B model given domain-specific evidence-chain
  training reaches only 60-70% accuracy and under 59% in cross-dataset
  transfer, so detecting deception from audiovisual cues stays close to the
  chance floor even after targeted adaptation.
kind: observation
backing_strength: single-paper
scope_condition: Binary truthful/deceptive judgement from video plus audio of
  real courtroom, laboratory and game-show recordings; 7B open models and
  closed video-audio models.
technique: ""
proposed_technique: Train on audio-visual evidence chains, then prune low-discrepancy tokens
technique_summary: Aligns audio and video features to text, instruction-tunes
  on human-verified observe-think-summarize chains, adds RL with a reward for
  evidence that semantically matches the annotated cues, and masks fused
  tokens that score low on prompt relevance and audio-visual disagreement.
technique_kind: training
technique_validated_by: Accuracy and F1 on DOLOs, Bag-of-Lies and MU3D against
  closed (GPT-4o, Gemini3Pro) and open (AffectGPT, Qwen2.5-Omni) MLLMs and six
  specialized detectors, plus a Semantic Evidence Alignment metric against
  annotated cues; ablations separate the three-stage pipeline from the
  token-masking module and sweep the mask count.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model, prompted or trained, reaching high accuracy (say above
  85%) on these same held-out real-world deception videos, or holding its
  in-domain accuracy under cross-dataset transfer.
evidence_note: Measured on three public benchmarks with reported accuracy and
  F1; baselines include closed and open MLLMs and specialized classifiers.
  Datasets are small (325-1675 videos) and class-balanced, so near-chance
  readings are credible but the absolute ceiling claim rests on one lab's
  evaluation. The SEA reasoning metric is defined by the same authors and
  compares generated evidence to their own annotations, so reasoning-quality
  gains are not independently validated.
confidence: medium
