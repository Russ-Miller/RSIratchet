stance_reason: ""
falsifier: A matched comparison in which post-hoc filtering of a larger
  candidate pool, or the same backbone given equal compute without pipeline
  evolution, produces data with equal or better downstream domain scores; or
  rounds beyond two improving monotonically.
evidence_note: "Measured on DataPrep-Bench across four domains with two
  downstream base models and same-backbone agent/skill controls, which
  isolates framework from backbone. Benchmark results for baselines were
  adopted from prior work rather than re-run. No token/compute-matched
  baseline; the round-count degradation is observed on only two domains and
  the stopping rule (two rounds) was set from pilot assessment, not held out.
  Law is the weakest case: DataFoundry does not lead on Llama-3.1-8B there."
