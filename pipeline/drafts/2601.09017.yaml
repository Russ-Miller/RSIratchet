arxiv_id: "2601.09017"
title: "Multicultural Spyfall: Assessing LLMs through a Dynamic Multilingual
  Social Deduction Game"
url: https://doi.org/10.48550/arxiv.2601.09017
drafted_at: 2026-11-13
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: strategic-deception
statement: In multi-agent social deduction games (Spyfall) played over
  culturally specific entities, LLMs' ability to deduce the hidden entity and
  to evade detection degrades in non-English settings and on locally specific
  entities, with the drop largest for weaker models and for a dialect
  (Egyptian Arabic) the models default away from.
kind: observation
backing_strength: single-paper
scope_condition: Six models (Gemini-2.5-Pro/Flash, Qwen3-30B/8B, Gemma3-12B,
  Llama3.1-8B), 9,000 five-player matches, English plus Indonesian, Simplified
  Chinese and Egyptian Arabic; entity pools of 30 generic locations, local
  locations, or local foods.
technique: ""
proposed_technique: Benchmark models by playing a culturally localized social deduction game
technique_summary: Replace static benchmark items with repeated Spyfall
  matches in which entity pools are swapped for region-specific locations and
  foods in the local language, and rank models by Bradley-Terry ratings over
  match outcomes.
technique_kind: process
technique_validated_by: Rankings over five overlapping models matched Chatbot
  Arena ordering, with wider rating spread; per-scenario spy guess accuracy
  and leakage rates reported, but no comparison against an alternative dynamic
  benchmark.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run showing spy guess accuracy and win rates in local-entity
  non-English scenarios equal to or above the English generic scenario for the
  same models, or showing the English/non-English gap vanishes once entity
  familiarity is controlled.
evidence_note: "Measured: spy guess accuracy fell from 67.3% (English generic)
  to 24.4% (Egyptian Arabic local food); leakage rates reached 37% for
  Llama3.1-8B in Indonesian versus 0% for Gemini models; each game played
  once, so per-cell estimates are noisy, and language, cultural knowledge and
  strategy are entangled by the authors' own admission."
confidence: medium
