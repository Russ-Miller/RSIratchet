arxiv_id: "2608.29347"
title: A Cognitive Architecture for Shared Autonomy in AUV Operations
url: https://doi.org/10.48550/arxiv.2608.29347
drafted_at: 2026-10-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: When a language model must judge whether a specific vehicle can
  perform a described mission, it is overconfident about partially-capable
  configurations — declaring the mission fully possible despite missing
  hardware — and supplying the required-capability list plus the vehicle's
  inferred capabilities from an ontology is what corrects that specific error,
  not the harder fully/impossible cases which the models already get mostly
  right.
kind: observation
backing_strength: single-paper
scope_condition: Locally hosted Llama3, Qwen2.5 and GPT-OSS judging one
  inspection/anode-test mission description against three simulated UUV
  configurations, 5 runs per condition.
technique: ""
proposed_technique: Ground mission feasibility in an ontology of inferred capabilities
technique_summary: Store vehicle components, mission types and required
  capabilities in an ontology with SWRL rules that infer capabilities from
  hardware/software, then put both the mission's required capabilities and the
  vehicle's inferred capabilities into the feasibility LLM's system prompt.
technique_kind: retrieval
technique_validated_by: Feasibility-verdict accuracy over 5 runs per vehicle
  configuration per model, compared against the same prompt with the ontology
  requirements removed; with requirements GPT-OSS reached 100% on all three
  configurations, and without them the models mislabelled the
  partially-possible configuration and named the wrong missing component.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same feasibility judgements with and without
  ontology-supplied capability requirements and finding the partially-possible
  configuration no better with them, or finding the gain spread evenly across
  fully-possible and impossible cases rather than concentrated on partial
  ones.
evidence_note: "Measured but very thin: one mission description, three vehicle
  configurations, 5 runs each, three small models, simulation only. The
  ablation does isolate the ontology requirements from the rest of the prompt.
  No statistics, and the partial-capability 'names the missing component'
  finding is reported qualitatively."
confidence: low
