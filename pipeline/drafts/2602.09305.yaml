falsifier: A study showing learned reward models' scores stay stable and
  well-calibrated on states far from their training distribution during
  extended RL optimization, with no higher hacking rate than rule-based
  rewards at matched reasoning gains.
evidence_note: "Argued, not measured: the survey derives the extrapolation
  argument from the deterministic-transition MDP formulation and cites prior
  work on reward-model overoptimization and score sensitivity to surface
  reformulations. No new experiment; the trade-off table contrasting
  model-based (medium hacking risk) against rule-based (low) is a synthesis of
  cited literature rather than a controlled comparison."
