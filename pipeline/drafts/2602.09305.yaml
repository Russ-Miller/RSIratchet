statement: When an RL reward for LLM reasoning is a learned reward model
  rather than a verifiable rule-based signal, the policy visits increasingly
  distant regions of a combinatorially large, deterministic-transition state
  space during optimization, forcing the reward model to extrapolate beyond
  its training distribution and making its scores exploitable under minor
  surface reformulations.
