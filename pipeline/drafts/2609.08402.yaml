falsifier: A paired comparison on the same benchmark where the protocol gives
  no success gain for strong backbones, or where weak small models gain as
  much as strong ones.
evidence_note: "Paired baseline-vs-protocol runs on 210 episodes: success rate
  improved for 8 of 9 backbones, decision steps fell for all 9, mean +22.5
  points and -33.3 steps; Gemini-3.6-Flash hard split 8.6 to 55.7 SR.
  Qwen3-VL-4B and Qwen3-VL-30B-A3B dropped on mid/hard. The design compares
  the whole protocol against plain prompting and does not ablate individual
  tools, so which component carries the effect is not isolated; single test
  town."
