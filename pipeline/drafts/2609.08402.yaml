statement: In simulated urban air-ground object search where a VLM drives both
  a UAV and a UGV, wrapping the model in a fixed search-handoff-verify
  protocol that leaves geometric projection and road-graph path planning to
  deterministic tools raises task success for backbones with adequate
  perception while cutting decision calls for all, but does not lift weak
  small open models, whose success can fall on harder splits.
