arxiv_id: "2602.24041"
title: "Look Carefully: Adaptive Visual Reinforcements in Multimodal Large
  Language Models for Hallucination Mitigation"
url: https://doi.org/10.48550/arxiv.2602.24041
drafted_at: 2026-11-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: In 7-9B vision-language models (LLaVA-1.5-7B, Qwen-VL-Chat,
  GLM-4V-9B), re-injecting all visual tokens into mid-to-deep FFN layers
  during decoding adds background interference, so re-injecting only a
  prototype-selected token subset plus image patches whose optimal-transport
  distance to the hidden states is below a threshold lowers
  object-hallucination rates further than full-token re-injection.
kind: mechanism
backing_strength: single-paper
scope_condition: Training-free decoding-time intervention on 7-9B open VLMs;
  evaluated on CHAIR (500 MSCOCO images, 64-token cap) and POPE; gains are
  modest (CHAIR_S 22.0 to 18.4 on LLaVA-1.5-7B) and require reinforcement at
  mid-to-deep layers (~24-32), with very late layers or overly wide ranges
  losing the effect.
technique: ""
proposed_technique: Re-inject only OT-aligned visual patches into the FFN
technique_summary: Condense visual tokens to those farthest from their mean
  prototype, score cropped image patches by entropic optimal-transport
  distance to the hidden states, and add only the below-threshold patches'
  embeddings into each decoder block's feed-forward output.
technique_kind: decoding
technique_validated_by: CHAIR_S/CHAIR_I and BLEU on 500 MSCOCO images and POPE
  accuracy/F1 on MSCOCO, A-OKVQA and GQA against vanilla decoding, VCD, MemVR
  and VAF, across three backbones; general capability checked on MME, MMBench
  and LLaVA-Bench; component ablation separates prototype reduction (22.7 to
  20.2 CHAIR_S) from OT patch selection (22.7 to 22.3) with both at 19.8;
  latency 2.07s vs 1.68s baseline.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same backbones and benchmarks, indiscriminate full-token FFN
  re-injection matching or beating the selective variant at equal layer range
  and compute, or the selective gain disappearing once output length/object
  coverage is held fixed.
evidence_note: Measured on three backbones with four baselines, plus a two-way
  component ablation and sensitivity sweeps over Top-Q, threshold and patch
  count. Margins are small (1-4 CHAIR_S points) with no variance reported, and
  because CHAIR scores can fall when a caption mentions fewer objects, BLEU
  alone does not rule out reduced informativeness; the mechanism claim rests
  partly on a similarity analysis in one figure.
confidence: low
