arxiv_id: "2609.08850"
title: "DSE-VTG: Dual-Side Enhancement for Training-Free Video Temporal Grounding"
url: https://arxiv.org/abs/2609.08850
drafted_at: 2026-09-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: "In training-free video temporal grounding with frozen
  vision-language embedding backbones, matching a query only against frames
  sampled at a fixed rate leaves temporal context unused: adding clip-level
  (sliding-window) similarities projected onto the frame timeline raises
  localization accuracy even though clip-only similarity is worse than
  frame-only on its own."
kind: mechanism
backing_strength: single-paper
scope_condition: Frozen video-capable VLM embedders (Qwen3-VL-Embedding,
  BLIP-2, RzenEmbed) used for similarity-based grounding; no task-specific
  training; short-to-medium videos (Charades-STA ~30s, ActivityNet ~120s,
  QVHighlights ~150s).
technique: ""
proposed_technique: Fuse frame- and clip-level similarity, then adapt the
  query offset at test time
technique_summary: Compute query-video cosine similarities at both frame and
  sliding-window clip granularity, project clip scores onto the frame timeline
  with a triangular kernel and mix them with a fixed weight, and separately
  optimize a single additive offset to the query embedding against
  pseudo-positive/negative frames mined from the initial similarities.
technique_kind: decoding
technique_validated_by: "Charades-STA mIoU 51.30 vs 45.69 for the strongest
  prior training-free method (TAG), and vs 45.41/44.03 when TAG/TFVTG are
  re-run on the same backbone; QVHighlights 38.64 mAP vs 33.15. Component
  ablation: 45.69 base, 47.06 with Q-TTA only, 50.25 with MSF only, 51.30
  both. Granularity ablation on the same backbone: frame-only 47.06, clip-only
  42.82, fused 51.30. Also OOD splits Charades-CG and Charades-CD."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same backbone and benchmarks, adding kernel-projected
  clip-level similarities to frame-level similarities fails to improve mIoU or
  R@0.7 over frame-only, or the reported gain disappears once the frame-only
  baseline is tuned with the same interval-decoding hyperparameters.
evidence_note: Measured on three standard and two OOD benchmarks with
  component and granularity ablations, and with the two prior training-free
  baselines re-run on the same backbone (reported in supplementary, not shown
  in the text). Single group, no seed variance reported; the mixing weight and
  TTA hyperparameters were set with Charades-STA defaults, so some
  tuning-to-benchmark cannot be excluded.
confidence: medium
