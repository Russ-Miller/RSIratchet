arxiv_id: "2608.28264"
title: "Finding Where the Buck Stops: An Automated Failure Attribution-Based
  Reflection Framework for Multi-Agent Collaboration"
url: https://doi.org/10.48550/arxiv.2608.28264
drafted_at: 2026-09-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: In LLM multi-agent systems that reflect after failure, restricting
  reflection to the single agent responsible for the first incorrect step —
  located by a trained step-level correctness scorer and paired with a
  counterfactually generated corrected step — raises task success more than
  having every agent reflect on the trajectory, because reflections written by
  agents that behaved correctly enter their memory as misleading guidance for
  later tasks.
kind: mechanism
backing_strength: single-paper
scope_condition: Task-oriented collaborations with clear success criteria and
  small agent teams (Magentic-One over HotPotQA, ChartQAPro, Mind2Web), frozen
  GPT-4o-mini actors with a fine-tuned 8B reflector.
technique: ""
proposed_technique: Reflect only the agent that made the first wrong step
technique_summary: A process-reward model scores each step of a failed
  multi-agent trajectory, the first low-scoring step and its agent are
  identified, a corrected version of that step is generated and verified, and
  only that agent writes a reflection into its memory.
technique_kind: process
technique_validated_by: "Success rate on 100 sampled tasks per dataset over
  five trials: +22/26/27 points over initial success on HotPotQA, ChartQAPro,
  Mind2Web, above Reflexion, Retroformer and COPPER; ablation removing
  diagnosis+correction gave the largest drop; the attribution component beat
  All-at-once/Step-by-step/Binary-search on agent- and step-level accuracy on
  held-in and held-out Who&When data."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A setup where all-agent reflection matches or beats
  decisive-agent-only reflection at equal compute, or where reflections
  written by correctly-behaving agents are shown not to degrade their later
  performance.
evidence_note: Measured on three benchmarks with 100-task test sets and five
  trials, against three reflection baselines, plus ablations. The
  memory-contamination mechanism is argued from an illustrative example rather
  than directly measured; the comparison also confounds targeted reflection
  with the added corrected-step information.
