arxiv_id: "2609.17800"
title: "AgenTeeth: A Model-Agnostic Framework for Suppressing Hallucination in
  Frozen Vision-Language Models on Dental X-Rays via Tool Evidence Injection"
url: https://arxiv.org/abs/2609.17800
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: For panoramic dental X-ray VQA with frozen vision-language models,
  replacing the model's own spatial judgement with external detector findings
  that are deterministically bound to tooth identities before synthesis raises
  answer accuracy over the same two-pass pipeline without detectors, and the
  resulting accuracy is bounded by detector quality — degrading the
  identity/attribution detector costs more downstream accuracy than a much
  larger degradation of a task-specific pathology detector.
kind: mechanism
backing_strength: single-paper
scope_condition: Panoramic dental radiographs (MMOral-OPG-Bench, 100 images,
  491 closed / 578 open questions); four instruction-following VLM backbones
  plus Qwen2.5-VL-7B; synthesis prompted to prioritize tool evidence; single
  run per configuration.
technique: ""
proposed_technique: Deterministic grounding of expert-detector findings to
  entity IDs before VLM synthesis
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched comparison where adding deterministically ID-bound
  detector evidence fails to beat the detector-free pipeline, or where
  weakening the identity/grounding detector by a few mAP points costs less
  downstream accuracy than a far larger degradation of a task-specific
  detector.
evidence_note: "Matched-pipeline ablation: same VLM, prompts, two-pass
  structure, detectors removed. Closed-ended overall +11.8 to +23.7 points,
  open-ended +14.0 to +22.4 points across four backbones, consistent under two
  LLM judges; 43 of 44 category comparisons favor tools. Tool-quality ablation
  on one backbone (mistral-large-3): FDI 92.4->88.1 mAP@50 cost 3.3 mean
  points, dental-history 87.6->59.0 cost 2.7. Weakest category is closed-ended
  Jaw, where a low-precision bone-loss detector propagates false positives.
  Single run per config; no repeated-run variance; the detector-quality
  asymmetry rests on one backbone and two swaps."
confidence: medium
