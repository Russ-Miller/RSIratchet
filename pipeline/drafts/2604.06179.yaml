arxiv_id: "2604.06179"
title: "ARIA: Adaptive Retrieval Intelligence Assistant -- A Multimodal RAG
  Framework for Domain-Specific Engineering Education"
url: https://doi.org/10.48550/arxiv.2604.06179
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: "For image-rendered engineering lecture slides containing equations
  and diagrams, no single document-extraction tool recovers all three content
  types: a plain PDF text library extracts nothing, a layout parser leaves
  formulas as unprocessed placeholders, a formula-recognition model returns
  LaTeX but only fragmentary surrounding text, and a vision LLM describes
  diagrams but renders equations as prose instead of symbolic notation."
kind: observation
backing_strength: single-paper
scope_condition: Measured on one six-page slide deck on torsion from a
  sophomore civil engineering course; extraction volume measured by character
  count plus qualitative labels, not by accuracy against a ground-truth
  transcription.
technique: ""
proposed_technique: Run text, formula and diagram extractors in parallel and merge
technique_summary: Processes each page of course material through a layout
  parser, a formula-to-LaTeX model and a vision LLM simultaneously, then
  merges the three outputs into one chunked, embedded representation for
  retrieval.
technique_kind: retrieval
technique_validated_by: "Total characters extracted from a six-slide torsion
  deck: 0 (PyPDF2), 3,924 (Docling), 4,268 (Nougat), 12,568 (GPT-4 Vision),
  20,760 combined — a 65.2% increase over the best single tool; no downstream
  retrieval or answer-accuracy comparison isolates the merge."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A single modern extraction tool (e.g. a vision-language document
  model) recovering structured text, LaTeX formulas and diagram descriptions
  from the same image-based engineering slides at parity with the merged
  pipeline, measured against a ground-truth transcription.
evidence_note: Measured on a single six-page document with one metric
  (character count) and hand-assigned categorical labels for
  text/formula/diagram quality. No ground-truth reference transcription, no
  second document, no downstream retrieval or answer-quality ablation
  attributing the end-to-end gains to the merge. The qualitative per-tool
  failure modes are concrete and plausible; the quantitative headline is a
  volume proxy, not correctness.
confidence: low
