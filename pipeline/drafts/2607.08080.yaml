arxiv_id: "2607.08080"
title: "MASTE: A Multi-Agent Pipeline for Zero-Shot Aspect Sentiment Triplet
  Extraction"
url: https://doi.org/10.48550/arxiv.2607.08080
drafted_at: 2026-10-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For zero-shot aspect sentiment triplet extraction with one frozen
  backbone shared across stages, splitting the task into sequentially
  conditioned agents (aspect, then aspect-conditioned opinion, then sentiment,
  then a triplet-set consistency check) raises exact-match F1 well above
  single-pass zero-shot and chain-of-thought prompting on the same backbone,
  and the gain comes mainly from precision rather than recall.
kind: mechanism
backing_strength: single-paper
scope_condition: English review-domain ASTE-Data-V2 benchmarks (14Res, 14Lap,
  15Res, 16Res), training-free, four LLM calls per sentence; aspect recall
  remains the bottleneck and errors in the first stage propagate.
technique: ""
proposed_technique: Sequentially conditioned agents with a triplet-set consistency check
technique_summary: Decompose structured extraction into aspect,
  aspect-conditioned minimal-span opinion, sentiment, and a final whole-set
  verifier that drops ungrounded spans, calibrates polarity and merges
  duplicates, all on one frozen backbone.
technique_kind: prompting
technique_validated_by: Precision/recall/F1 on four ASTE-Data-V2 datasets
  against GPT-4o zero-shot, few-shot, CoT and CoT+few-shot with the same
  backbone (e.g. 72.31 vs 35.37 F1 on 14Res; +12.8 to +15.5 F1 over few-shot),
  plus ablations removing each agent and five additional backbones.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where the staged pipeline, given the same backbone
  and prompt budget, fails to beat single-pass prompting on exact-match F1, or
  where its advantage comes from recall rather than precision.
evidence_note: Measured on four benchmarks with matched backbone baselines,
  plus agent ablations (average F1 67.28 full vs 40.76 with
  opinion+consistency removed) and five backbones all improving. No
  matched-call-count baseline (four calls vs one), so part of the gain may be
  extra inference compute rather than decomposition; single paper, authors'
  own prompts.
confidence: medium
