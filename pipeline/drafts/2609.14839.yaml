arxiv_id: "2609.14839"
title: "Efficiency Hallucination: Formalizing and Measuring Behavioral
  Calibration in LLM-Based Code Optimization"
url: https://arxiv.org/abs/2609.14839
drafted_at: 2026-09-18
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When asked to optimize code that is already at its performance
  ceiling, frontier LLMs (GPT, Claude, Gemini families) never say it is
  already optimal under a plain "optimize this code for speed" prompt — they
  always emit an edit with a confident, unmeasured speedup claim; adding an
  explicit instruction to abstain unless >90% confident of an improvement
  produces abstention on a minority of such cases while leaving the edit rate
  on genuinely sub-optimal code unchanged.
kind: observation
backing_strength: single-paper
scope_condition: 180 trials, nine models, five paired optimal/sub-optimal
  LeetCode-style snippets from EffiBench, direct API calls without agent
  refinement loops, n=5 per model per condition; no execution-based
  verification of whether edits actually sped code up
technique: ""
proposed_technique: confidence-threshold abstention prompt for code optimization
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On a larger set of verified-optimal snippets, models under a plain
  optimize prompt decline to edit a substantial share of the time, or the
  confidence-threshold prompt fails to raise abstention above zero, or it also
  suppresses edits on genuinely sub-optimal code.
evidence_note: "Measured: 100% edit rate on optimal code under control across
  all nine models; 44.4% abstention and 0% false abstention under the penalty
  prompt. Small pilot (n=5 per model), problems are well-known LeetCode items
  so memorization may inflate the sub-optimal edit rate, and optimality of the
  baseline snippets is assumed rather than execution-verified."
