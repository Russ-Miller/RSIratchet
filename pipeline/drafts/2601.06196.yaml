arxiv_id: "2601.06196"
title: Geometry-Aware Hallucination Detection in Large Language Models
url: https://doi.org/10.48550/arxiv.2601.06196
drafted_at: 2026-11-14
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When selecting in-context demonstrations for hallucination
  detection with frozen 2.7B-32B LLMs, choosing examples nearest to class
  prototypes learned in a compressed latent geometry beats lexical (BM25),
  perplexity, clustering and adaptive-ICL selection on dialogue and
  summarization judgments, while lexical retrieval stays competitive on QA
  items that ship an explicit supporting evidence snippet.
kind: observation
backing_strength: single-paper
scope_condition: Two-shot ICL, binary factual-consistency labels on HaluEval
  and FEVER, six base models plus two larger ones; requires a one-time
  per-dataset-per-model training of a small projection network and prototypes.
technique: ""
proposed_technique: Select ICL examples by prototype distance in a learned low-dim geometry
technique_summary: Train a small projection network plus class prototypes on
  frozen-LLM hidden states with a manifold-preservation loss and proxy-anchor
  loss, then pick demonstrations nearest the learned prototypes once for the
  whole dataset.
technique_kind: prompting
technique_validated_by: Accuracy on HaluEval dialogue/summarization/QA and
  FEVER across six models versus KNN, clustering, BM25, perplexity, SA-ICL,
  AdaICL and Top-k+Con-E baselines at equal shot count; gains up to 9.9 points
  on Mistral-7B dialogue/summarization, with BM25 ahead on some QA settings at
  small scale. Single run, temperature 0.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Replicating the pipeline and finding that prototype selection does
  not beat BM25/perplexity selection on dialogue and summarization splits, or
  that reducing prototype dimensionality below the LLM hidden size does not
  improve detection accuracy.
evidence_note: Measured on two benchmarks, four task splits, eight models,
  against seven selection baselines, but single-run deterministic accuracy
  with no variance reported, no seeds, and margins on several models are 1-2
  points and within plausible noise; the larger gains are concentrated on
  Mistral-7B and Falcon3-3B summarization. The dimensionality-compression
  result is an ablation on two models only.
confidence: low
