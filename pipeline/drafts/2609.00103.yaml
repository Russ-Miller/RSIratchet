statement: When vision-language models are given an explicit abstention option
  plus a stated payoff for correct, wrong and declined answers, quadrupling
  the penalty for a wrong answer barely changes how often they answer, so
  their abstention rate is largely insensitive to the stated cost of error
  across text, synthetic video and natural video recall tasks.
kind: observation
backing_strength: single-paper
scope_condition: Nine pretrained VLM families on an associative-recall memory
  task (candidate occurred in stream or not) with two prompt arms differing
  only by an appended payoff sentence (+3/-1 vs +1/-4); closed-source models
  excluded from the main splits.
