falsifier: Showing that models materially lower coverage when the wrong-answer
  penalty rises, under the same two-arm prompt protocol, on these or
  comparable recall tasks.
evidence_note: "Measured: coverage R per model under two payoff arms on three
  evaluation subsets (synthetic text, synthetic video, natural video). Paper
  reports no model abstains meaningfully more under the costlier arm, and some
  abstain more when guessing is cheaper. Payoff-scored comparison shows small
  movement in the right direction and most dropped questions were ones
  answered wrong in the other arm, so selectivity exists while responsiveness
  does not. Single paper; abstention elicited only by prompt framing, not by
  any trained mechanism."
