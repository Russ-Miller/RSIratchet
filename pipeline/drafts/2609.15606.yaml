proposed_technique: trained adaptive-pacing video exploration agent
stance_on_existing: supports
related_claim_id: handing-agent-context-editing-tools-delete-summarize-note-fold-prompt
stance_reason: "Same pattern: context-management tools given by prompt alone
  hurt mid-size models and only help after fine-tuning on trajectories that
  use them."
falsifier: An untrained 7B backbone placed in the same multi-turn exploration
  harness scoring at or above its single-pass uniform-sampling baseline on
  these benchmarks.
evidence_note: "Measured: untrained agentic variant averaged 33.1 vs 41.8 for
  the single-pass base model on four long-video benchmarks, and 34.3 vs 37.8
  cross-domain; the trained model reached 48.0 and 45.0. Ablation also shows
  RL without SFT collapses. Single backbone, single harness design, so it does
  not separate harness-specific quirks from a general prompt-only limit."
