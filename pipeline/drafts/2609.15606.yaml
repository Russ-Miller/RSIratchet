capability: video-temporal-reasoning
statement: For 7B multimodal models on long-video QA, a multi-turn agentic
  exploration harness (adaptive viewing speed, cross-turn textual notes,
  rewatch) lowers accuracy below plain uniform-frame single-pass answering
  unless the model is trained to use it, because the untrained model commits
  to an answer before gathering evidence; with cold-start SFT on verified
  exploration turns plus trajectory-level RL, the same harness beats the
  single-pass baseline.
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B-Instruct backbone; nine long-video and
  cross-domain multiple-choice benchmarks; harness with fixed per-turn visual
  token budget.
