arxiv_id: "2609.17248"
title: "Video-HolmesV2: Can MLLMs Reason with Spatio-Temporal Audio-Visual
  Evidence in Long Videos?"
url: https://doi.org/10.48550/arxiv.2609.17248
drafted_at: 2026-09-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: "On long-video (10-150 minute) audio-visual reasoning questions,
  multiple-choice accuracy overstates grounding: a large open model can answer
  about 55% of items correctly while scoring 8.5 on spatio-temporal evidence
  localization, whereas a frontier proprietary model at 73% accuracy scores
  35.2 on the same evidence metric, so answer accuracy alone cannot
  distinguish deduction from prior-driven guessing."
kind: observation
backing_strength: single-paper
scope_condition: Long cinematic videos requiring both audio and visual cues;
  evidence scored by soft temporal alignment plus LLM-judged semantic matching
  against annotated timestamps.
technique: ""
proposed_technique: Condition reasoning credit on spatio-temporal evidence
technique_summary: Require the model to output timestamped audio and visual
  evidence intervals and multiply its answer correctness by a soft
  temporal-plus-semantic evidence score, so ungrounded correct answers earn no
  evidence credit.
technique_kind: process
technique_validated_by: Applied to three models on 4,000 QA pairs over 784
  videos; separated a 55.1%-accuracy open model (evidence 8.5) from a
  73.1%-accuracy proprietary model (evidence 35.2). No human validation of the
  evidence metric reported.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Models' evidence-localization scores tracking their MCQ accuracy
  closely (high rank correlation, similar relative gaps), or human raters
  judging the low-evidence model's cited timestamps as valid.
evidence_note: Measured on the paper's own benchmark with an LLM-judged
  semantic component and hand-set weights; only three models reported for the
  evidence comparison, smaller models excluded for near-zero evidence scores,
  so the gap could partly reflect output-format compliance rather than
  grounding.
confidence: medium
