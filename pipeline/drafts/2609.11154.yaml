arxiv_id: "2609.11154"
title: Multi-Faceted Evaluation and Mitigation of Emotion Hallucinations in MLLMs
url: https://doi.org/10.48550/arxiv.2609.11154
drafted_at: 2026-09-25
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For open-ended emotion interpretation by multimodal LLMs,
  coarse-grained hallucination mitigations designed for object hallucination
  (VCD, ICD, M3ID) and self-verification (EmotionHallucer) cut unsupported
  claims in some facets while raising them in others — e.g. lowering audio
  hallucination but increasing expression and action hallucination — so a
  single aggregate hallucination rate hides the trade-off.
kind: observation
backing_strength: single-paper
scope_condition: Free-form emotion reasoning over video/audio/text on
  OV-MERD+, CMU-MOSI and CH-SIMS, with AffectGPT, Qwen2.5-Omni and R1-Omni
  backbones, scored by an LLM-based claim atomizer plus judge across six
  facets.
technique: ""
proposed_technique: Suppress hallucinated logit directions and re-anchor on verified sentences
technique_summary: At each sentence, an evaluator localizes hallucinated claim
  tokens into a hallucination memory used to build a vocabulary-level
  suppression direction applied to the logits, while the lowest-hallucination
  sentence so far is kept in an anchor memory and used as the only reasoning
  context carried forward.
technique_kind: decoding
technique_validated_by: "Measured facet-wise and total Emotion Hallucination
  Rate against VCD, ICD, M3ID, EmotionHallucer and Best-of-N on three
  backbones and three datasets: total rate down 3.27-11.85 points, the only
  method reducing all six facets everywhere, with F1/recall on emotion
  prediction also rising; the evaluator itself agreed with three human
  annotators on 100 samples (Pearson 0.84, Spearman 0.92)."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Rerunning the same mitigation baselines on these backbones and
  finding they reduce every facet-wise hallucination rate, or showing the
  facet increases come from the LLM judge's labelling rather than the
  generations.
evidence_note: Measured on 532 OV-MERD+ samples plus CMU-MOSI and CH-SIMS,
  three backbones, four baselines. Facet labels and hallucination verdicts
  come from LLM atomizer/judge (Qwen3, Qwen2.5-Omni), validated against three
  annotators on only 100 instances; the judge and the mitigation method share
  the same evaluator, so the proposed method is partly optimized against its
  own metric.
confidence: medium
