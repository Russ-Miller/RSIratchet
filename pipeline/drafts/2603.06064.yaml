capability: planning
statement: On 102 IPC Blocksworld instances with a 180-second budget, a classical planner (Fast
  Downward) solved 85%, a model planning directly solved 64%, and the same model choosing one
  action at a time against a PDDL simulator with observe, reset and retry solved 67%, a consistent
  but small three-point gain at about 5.7 times the token cost, so interactive simulation helps
  a little and classical search still wins where a formal model exists.
