capability: harness-self-improvement
statement: Treating post-deployment improvement as scoped behavioural maintenance, where each
  recurring failure becomes a skill patch with a stated scope and injection point that is promoted
  only after passing its targeted cases, a protected regression suite and negative controls,
  raised correctness from 3.70 to 4.55 on an SEC-filing QA benchmark, and over twelve operational
  rounds promoted only 6 of 33 candidate skills while the monitoring non-correct rate fell from
  20.0% to 12.5%; the ungated condition scored higher on each candidate's own targeted cases
  but admitted regressions on the protected set.
kind: observation
backing_strength: single-paper
scope_condition: SEC filing question answering, 2026; evolution, protected and monitoring sets
  held separate; 33 candidate skills over 12 rounds; developer-reported, no public code stated.
technique: ''
proposed_technique: Promote a fix only against targeted, protected and negative-control sets
technique_summary: For each recurring failure, write a patch with an explicit scope and injection
  point, then admit it only if it fixes its targeted cases, leaves a protected regression suite
  unharmed, and does not fire on negative controls; refuse or defer candidates with small benefit,
  unstable triggering, or conflict with an active patch.
technique_kind: process
technique_validated_by: Correctness on an enhanced SEC-filing benchmark before and after evolved
  skills, a 12-round operational study reporting promotion counts and monitoring non-correct
  rate, and a gated-versus-ungated comparison showing the ungated variant wins on targeted cases
  while regressing protected ones. One domain.
