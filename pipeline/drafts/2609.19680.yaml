falsifier: A domain where the protected suite cannot be kept representative, so gated promotion
  blocks real gains without preventing regressions, or a gated-versus-ungated comparison over
  a longer horizon where the ungated arm ends ahead.
evidence_note: 'The gated-versus-ungated contrast is the transferable part and it replicates
  the gate finding from EvoOntology and SoL-Pi in a third setting: acceptance criteria, not
  the improvement engine, are what make a loop ratchet rather than drift. The refusal rate (27
  of 33 rejected, deferred or withdrawn) is the cost, stated plainly by the authors.'
