statement: Auditing AI-generated code with static smell detection at code, structure and architecture
  level, from single-file tasks up to agent-built systems, more capable models produced more
  bloated and more coupled code, code volume was a near-perfect predictor of structural decay,
  and neither functional correctness nor more detailed prompting reduced it, so passing tests
  does not indicate maintainable design.
