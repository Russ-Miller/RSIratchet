arxiv_id: "2605.22826"
title: Evaluating Large Language Models in a Complex Hidden Role Game
url: https://doi.org/10.48550/arxiv.2605.22826
drafted_at: 2026-11-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: strategic-deception
statement: "In the five-player hidden-role game Secret Hitler, current frozen
  LLM agents fail to sustain deception when assigned fascist roles: they yield
  negative game-state impact scores, are identified by other agents more often
  than human fascists are, and produce games roughly 40% shorter than
  human-played ones, while Chain-of-Thought prompting and internal memory do
  not help and cost up to 23.2% win rate in fascist roles."
kind: observation
backing_strength: single-paper
scope_condition: Five-player Secret Hitler simulations with out-of-the-box
  models (no fine-tuning), compared against rule-based bots and human expert
  games; measured via new Role Identification Accuracy, Deception Retention
  Rate and Game State Impact Rate metrics.
technique: chain-of-thought
proposed_technique: Score deception by retention and game-state impact per round
technique_summary: Evaluates hidden-role agents with round-conditioned metrics
  — how often other players misidentify the agent's role, how each action
  shifts a continuous game-state advantage score, and how accurately the agent
  infers others' roles — instead of win rate alone.
technique_kind: process
technique_validated_by: Applied across models and rule-based baselines in
  Secret Hitler; rule-based agents matched expert human voting decisions 86.7%
  of the time versus 59.7% for Llama 3.1 70B, and fascist LLM roles showed
  consistently negative impact scores; no independent validation of the
  metrics against human judgement is reported.
stance_on_existing: contests
related_claim_id: deception-ability-emerged-in-frontier-models
stance_reason: This paper finds that current models cannot sustain multi-turn
  deception in a hidden-role game, cutting against the view that frontier
  models reliably induce false beliefs in other agents through strategic
  reasoning.
falsifier: A frontier model playing fascist roles in the same framework
  achieving positive game-state impact scores, human-comparable game lengths,
  and deception retention rates matching human experts — or
  Chain-of-Thought/memory producing consistent win-rate gains in fascist
  roles.
evidence_note: Measured in simulation with a new open-source framework;
  headline numbers (23.2% worse fascist win rate, 86.7% vs 59.7% voting
  alignment, ~40% shorter games) come from one author's single study, with
  human comparison drawn from imported human-played games rather than matched
  live play. Game counts per configuration are not stated in the excerpt.
confidence: low
