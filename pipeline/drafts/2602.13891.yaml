capability: critique
statement: For judging the naturalness of synthesized speech, a reward model
  trained to first extract explicit acoustic features and then reason over
  them agrees with expert human ratings better than scalar regressors that map
  raw audio directly to a score, and generalizes to out-of-domain
  user-assistant speech.
kind: mechanism
backing_strength: single-paper
scope_condition: Speech naturalness evaluation; trained on 31k expert ratings,
  tested on an out-of-domain real-world interaction benchmark; gains in
  downstream generation measured by using the model as an online RLHF
  verifier.
technique: ""
proposed_technique: Extract acoustic features first, then reason over them
technique_summary: Train a speech reward model to decompose naturalness
  judgement into an interpretable acoustic feature extraction stage followed
  by feature-grounded chain-of-thought reasoning, instead of regressing audio
  to a scalar score.
technique_kind: training
technique_validated_by: Model-human correlation of naturalness scores against
  expert ratings, compared with existing scalar naturalness predictors and
  against human inter-rater consistency, plus naturalness of speech LLM
  generations when the model is used as an online RLHF verifier.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A scalar audio-to-score regressor trained on the same 31k ratings
  matching or beating the feature-then-reason model on model-human
  correlation, including on the out-of-domain benchmark; or removing the
  feature extraction stage leaving correlation unchanged.
evidence_note: Measured on one curated dataset (31k expert ratings) plus one
  out-of-domain benchmark, against existing naturalness predictors; the
  abstract reports correlation approaching human inter-rater consistency but
  gives no numbers, and does not isolate whether the gain comes from the
  feature stage, the reasoning stage, or the new training data.
confidence: low
