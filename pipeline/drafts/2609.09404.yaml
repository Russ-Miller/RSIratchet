arxiv_id: "2609.09404"
title: An Experimental Evaluation of Multimodal Prompt Injection Attacks on
  Agentic AI Frameworks
url: https://doi.org/10.48550/arxiv.2609.09404
drafted_at: 2026-09-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: prompt-injection
statement: "For image-borne injected instructions delivered to tool-using
  agents, completion rate understates exposure: agents act on the injected
  instruction about ten times more often than they complete the objective
  (12.8% attempted vs ~1% completed across 720 runs), and most failures stop
  at the planning step where the model read the payload and simply did not act
  on it rather than at any architectural barrier."
kind: observation
backing_strength: single-paper
scope_condition: Six agent frameworks, five frontier multimodal models, six
  visual carriers, four attacker objectives, mock tools, one run per cell at
  temperature zero; benign task is read-and-describe and never mentions tools.
technique: ""
proposed_technique: Report attempted and recognized rates, not just completion
technique_summary: Instrument the agent pipeline to record the furthest stage
  an injected payload reaches and use a judge panel to label whether the agent
  attempted the attack and whether it explicitly recognized the injection,
  alongside the deterministic completion check.
technique_kind: process
technique_validated_by: Applied across 720 runs; attempts (12.8%) exceeded
  completions (1.11%) by an order of magnitude and stage labels separated
  perception-stage refusals (170) from unexplained planning-stage non-action
  (303), distinctions the completion metric collapses. No independent
  validation of the judge panel against human labels in this paper (voting
  rule borrowed from prior work).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An evaluation with per-stage traces where attempted and completed
  rates are close, or where non-completing runs are shown to be blocked by a
  harness barrier rather than by the model declining at planning.
evidence_note: "Measured over 720 runs with deterministic completion checks
  plus a three-model judge panel for attempt labels. Confounds the authors
  state: 159 cells re-executed, all in two frameworks; one framework's prompt
  differs; single trial per cell with non-bit-reproducible runs; mock tools so
  completion means the call was issued."
confidence: medium
