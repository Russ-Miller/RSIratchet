arxiv_id: "2609.20842"
title: "COAL-SQL: Coverage-Guided Augmentation and Failure-Driven Learning for
  Text-to-SQL Post-Training"
url: https://doi.org/10.48550/arxiv.2609.20842
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: When post-training a 7-8B open model for text-to-SQL with a fixed
  budget of synthetic examples drawn from a large external pool, selecting
  examples whose schema-independent SQL skeletons are farthest from those
  already in the seed set (greedy K-center) rather than sampling randomly from
  the same pool yields a small in-domain gain and a larger cross-domain one
  (BIRD dev 64.9 vs 64.4, Spider Test 85.3 vs 83.4, Science Benchmark 53.9 vs
  49.8).
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-Coder-7B-Instruct and Llama-3.1-8B-Instruct
  post-trained with GRPO plus failure-driven SFT; 3,000 BIRD seed examples
  plus 3,500 synthesized examples instantiated on BIRD databases; pool is
  SynSQL-2.5M.
technique: ""
proposed_technique: Fill SQL-skeleton coverage gaps, don't just add data
technique_summary: Abstracts SQL queries into schema-independent skeletons,
  treats seed skeletons as fixed K-center centers, greedily selects external
  pool skeletons farthest from existing coverage, and re-instantiates each on
  a target training database with a generated question.
technique_kind: training
technique_validated_by: Execution accuracy on BIRD dev, Spider test/dev,
  EHRSQL and Science Benchmark against random augmentation from the same pool
  at equal example count, plus skeleton n-gram coverage/recovery on BIRD dev
  versus OmniSQL-style synthesis (100% vs 73.3% unigram recovery).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the same pipeline with randomly sampled pool examples at
  equal budget and matching or exceeding coverage-guided selection on
  out-of-domain benchmarks, across more than one seed and backbone.
evidence_note: Single ablation row per configuration, one backbone for the
  ablation, no seeds or variance reported; the augmentation arm is confounded
  with the surrounding failure-driven learning stages, though those are held
  fixed. Coverage metric (n-gram recovery) is independent of the embedding
  objective, which is supporting evidence that selection changes structural
  support.
confidence: low
