arxiv_id: "2603.19254"
title: "FinReasoning: A Hierarchical Benchmark for Reliable Financial Research
  Reporting"
url: https://doi.org/10.48550/arxiv.2603.19254
drafted_at: 2026-11-09
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: On long-form Chinese financial text with injected terminology,
  factual and logical errors, current LLMs score higher at explaining a
  detected error than at producing a corrected replacement (gaps of about
  10-24 points depending on error type), with the largest gap on logical
  errors that require rebuilding a reasoning chain.
kind: observation
backing_strength: single-paper
scope_condition: Zero-shot evaluation of 19 LLMs on 1,800 long-form Chinese
  financial text samples with 1-3 injected errors each; scored by BERTScore,
  SimCSE and a fused two-model LLM judge.
technique: ""
proposed_technique: Score error explanation and error correction separately
technique_summary: Evaluates hallucination handling as three separate scores —
  sentence-level error localization, explanation quality, and quality of the
  corrected replacement text — instead of a single binary detection label.
technique_kind: process
technique_validated_by: BERTScore and SimCSE correlate 0.86 and 0.91 with the
  LLM judge on explanation/correction scoring; two financial experts reviewed
  10% of judged samples with inter-expert kappa 0.79 on this track;
  judge-prompt rephrasing left rankings stable at mean Spearman 0.95.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model set on which correction scores match or exceed explanation
  scores on the same injected-error samples under the same metrics, or a
  showing that the gap is an artifact of the correction metric being stricter
  than the explanation metric.
evidence_note: Measured on an injected-error benchmark built from real
  financial reports; error types were derived from a 200-sample pilot of
  actual model hallucinations. The design does not separate 'cannot correct'
  from 'correction scored against a single gold rewrite', and correction and
  explanation use partly different metric mixes, so the absolute gap size is
  not clean.
confidence: medium
