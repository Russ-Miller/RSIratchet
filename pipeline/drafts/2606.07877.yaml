capability: cultural-competence
statement: When a scenario pits a stated personal preference against a local cultural norm,
  models' choice of norm over preference shifts more with the scenario's country (about 8 points)
  than with the user's age (1) or gender (under 1), instruction tuning shifts it non-uniformly,
  and while models can match the majority human choice per country they do not reproduce the
  spread of human answers, with best correlation to human response distributions only about
  0.24.
kind: observation
backing_strength: single-paper
scope_condition: PACT scenarios, five-country human study, 2026; open and closed chat models;
  agreement measured against majority and against full response distributions.
