capability: multi-model-coordination
statement: When several LLM agent outputs are consumed together to produce one
  environment transition and are trained with a single shared advantage and
  one clipping decision, the combined sequence log-ratio must be scaled by
  1/sqrt(K) rather than summed unnormalized or averaged by 1/K, because that
  is the only fixed power that keeps the update's variance bounded and
  non-degenerate as the number of participating outputs grows.
kind: mechanism
backing_strength: single-paper
scope_condition: Shown for group-relative RL on Qwen2.5-3B multi-turn search
  with a fixed active set of 5 parallel queries; correlated member log-ratios
  are not covered by the variance argument.
technique: ""
proposed_technique: Share one clipped update across jointly-consumed agent outputs
technique_summary: "Treats the set of agent outputs that jointly cause one
  state transition as a single policy action: sum their masked sequence
  log-ratios, divide by the square root of set size, assign one shared event
  advantage, and clip once per event."
technique_kind: training
technique_validated_by: "Avg@16/Pass@16 on six math benchmarks (Qwen3-4B/8B)
  and seven search benchmarks (Qwen2.5-3B/7B) against single-agent GRPO,
  LLM-sharing/non-sharing GRPO and Dr. MAS; search macro gains of 3.2/2.3
  points at 3B. Ablation at K=5 on search: sqrt 40.1/56.1 vs unnormalized sum
  38.6/54.3 vs 1/K mean 34.7/48.6, and singleton K=1 at 37.2/52.4."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation under matched compute on another task family or
  backbone where 1/K or unnormalized summation of member log-ratios matches or
  beats 1/sqrt(K) on Avg@16 and Pass@16, or where the ordering reverses as set
  size grows.
evidence_note: "Measured: one normalization ablation at a single set size
  (K=5) on one backbone and one task (search), three seeds, with a clear
  ordering (sqrt > sum > mean). The variance argument is analytic but assumes
  uncorrelated member log-ratios. The paper itself notes the K=1 vs K=5
  comparison is not at equal compute, so the cardinality gain and the
  normalization gain are not cleanly separated from inference cost."
