arxiv_id: "2609.08452"
title: "SRPO: Setwise Relative Policy Optimization for Multi-Agent LLMs"
url: https://doi.org/10.48550/arxiv.2609.08452
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
