arxiv_id: "2606.25195"
title: "SoK: AI Secure Code Generation: Progress, Pitfalls, and Paths Forward"
url: https://doi.org/10.48550/arxiv.2606.25195
drafted_at: 2026-10-28
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: secure-coding
statement: Current code models and coding agents score far above chance on
  natural-language questions about secure coding principles (lowest mean
  86.2%, OWASP items 93-97%) while generating code that is both functional and
  exploit-resistant far less often, and the gap is larger for whole web
  applications (72.9 points) than for isolated functions (47.9), because
  application-scale security also depends on project construction rather than
  on naming the right practice.
kind: mechanism
backing_strength: single-paper
scope_condition: Four systems (Qwen2.5-14B-Instruct, SafeCoder, PurpCodeRL,
  GPT-5.1-Codex-Mini) plus eight more base models for the correlation
  analysis, evaluated on an LLM-generated OWASP/CERT NLU benchmark and the
  executable CWEval and BaxBench suites, one sample per task.
technique: ""
proposed_technique: Measure secure-coding knowledge and code actuation separately
technique_summary: Score a model on natural-language questions about secure
  coding principles, on executable functional-plus-exploit tests, and on
  whether the generated code implements a mapped sufficient defense strategy,
  so failures separate into missing knowledge, misapplied defense, and
  construction failure.
technique_kind: process
technique_validated_by: Layer-1 scores correlate with CWEval secure-pass@1
  across 10 base models (Spearman 0.71, p=0.025; BaxBench 0.63, p=0.056);
  actuation below knowledge in all 18 slices (Wilcoxon p<.001);
  compliance-vs-security crossing yields 1,100 secure-only vs 287
  compliant-only cases (p<.001). Both LLM-assisted artifacts validated on
  stratified 100-item samples.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model set whose natural-language secure-coding scores sit at or
  below its joint functional-security pass rate, or where the measured gap is
  no larger at application scale than at function scale.
evidence_note: Measured on two executable benchmarks (119 CWEval tasks, 392
  BaxBench tasks) with a 6,382-question LLM-generated, LLM-verified knowledge
  benchmark; one generation per task limits the actuation estimates, the
  knowledge ceiling is near saturation so the correlation rests on a narrow
  spread, and the compliance judge is itself LLM-based with known coverage
  limits (secure-by-other-means cases).
confidence: medium
