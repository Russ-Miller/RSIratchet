capability: formal-math
statement: A Lean prover trained with large-scale agentic reinforcement learning against the
  Lean checker, paired with a test-time workflow that drafts in natural language before formalizing,
  solved 88% of PutnamBench (undergraduate), 80% of Fate-H (graduate) and 33% of Fate-X (PhD-level),
  and 11 of 12 Putnam 2025 problems, at a smaller compute budget than prior systems, so formal
  proving at undergraduate level is largely solved while PhD-level remains open.
kind: observation
backing_strength: single-paper
scope_condition: Seed-Prover 1.5 (ByteDance), Lean 4, PutnamBench, Fate-H, Fate-X, Putnam 2025,
  late 2025; results are the developers' own.
technique: ''
proposed_technique: Natural-language draft, then formalize, with checker-in-the-loop RL
technique_summary: Have the model write an informal proof sketch first, translate it into Lean,
  and refine against compiler feedback; train the prover by reinforcement learning on long interactions
  with Lean so it accumulates experience of what checks.
technique_kind: training
technique_validated_by: Pass rates on PutnamBench, Fate-H, Fate-X and Putnam 2025 against prior
  provers at stated compute budgets; RL training accuracy curve from about 50% to near 90%;
  developer-reported.
stance_on_existing: neither
