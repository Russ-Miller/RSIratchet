arxiv_id: "2602.05437"
title: "Once Correct, Still Wrong: Counterfactual Hallucination in
  Multilingual Vision-Language Models"
url: https://doi.org/10.48550/arxiv.2602.05437
drafted_at: 2026-11-12
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: "For vision-language models judging culturally grounded images from
  MENA countries, accuracy on true statements does not predict rejection of
  visually false but culturally plausible counterfactuals: conditional
  acceptance of counterfactuals rises sharply in Arabic and its dialects even
  where true-statement accuracy stays high, and reasoning-before-answering
  prompts raise that acceptance relative to answering before justifying."
kind: observation
backing_strength: single-paper
scope_condition: Contrastive true/counterfactual statements over culturally
  grounded images from 17 MENA countries, in English, Modern Standard Arabic
  and Arabic dialects; current VLMs under several prompting strategies.
technique: ""
proposed_technique: Answer first, justify after, for counterfactual image claims
technique_summary: Have the model commit to an accept/reject verdict on a
  visual statement before producing any reasoning, instead of reasoning first.
technique_kind: prompting
technique_validated_by: Compared against reasoning-first prompting on the
  CounterFactual Hallucination Rate (counterfactual acceptance conditioned on
  correctly answering the paired true statement) across the M2CQA benchmark;
  answer-first reported more robust, no absolute numbers given in the source
  text.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A broader evaluation in which counterfactual acceptance conditioned
  on true-statement correctness is no higher in Arabic dialects than in
  English, or in which reasoning-first prompting lowers it rather than raising
  it.
evidence_note: Measured on one new benchmark (M2CQA) with a conditional metric
  (CFHR) over several state-of-the-art VLMs and prompting strategies; source
  text gives no per-model numbers, no human baseline, and does not separate
  cultural plausibility from general Arabic-language weakness.
confidence: low
