falsifier: An end-to-end VLA trained on the same trajectories and
  reasoning-free, or a synchronous single-model variant at matched compute,
  matching the stage success rate; or ablating the pilot-reasoning supervision
  while keeping the two-rate architecture and losing nothing.
evidence_note: Measured on the authors' own benchmark against baselines they
  reconfigured from other domains, so baseline adaptation quality is
  uncontrolled. Fine-grained VLN gains over NaVid are small on SR (13.0 to
  13.5) and only the stricter adherence metric separates them clearly. No
  ablation reported isolating the asynchronous architecture from the Pilot
  Reasoning supervision or from the larger training set.
