statement: Every state-of-the-art model tested repairs fewer Defects4J and GitBug-Java bugs
  after semantics-preserving transformation of the buggy code, from -4% for GPT-4o to -16% for
  Llama-3.1, and the size of each drop correlates with how likely the model was to have memorized
  the original (negative log-likelihood), so part of published repair success on these benchmarks
  is recall of seen fixes rather than debugging.
kind: mechanism
