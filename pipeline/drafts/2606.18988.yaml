arxiv_id: "2606.18988"
title: "ThinkDeception: A Progressive Reinforcement Learning Framework for
  Interpretable Multimodal Deception Detection"
url: https://doi.org/10.48550/arxiv.2606.18988
drafted_at: 2026-10-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: strategic-deception
statement: For detecting deception in short audio-visual clips,
  general-purpose omni multimodal models prompted zero-shot score near the 50%
  chance line (47-53% average across four datasets, below task-specific deep
  classifiers at 61-65%), and the gap is closed only by supervised fine-tuning
  on step-by-step audio-visual reasoning traces followed by RL whose reward
  scores the visual and acoustic reasoning steps for factual agreement with
  extracted Action Unit, emotion, pitch and prosody features.
kind: observation
backing_strength: single-paper
scope_condition: Four deception datasets (DOLOS, MDPE in-domain; RLTD, Box of
  Lies cross-domain), Qwen2.5-Omni-7B backbone, binary veracity labels;
  reasoning quality judged by LLM-as-judge plus human experts.
technique: ""
proposed_technique: Reward audio-visual reasoning steps against extracted cue features
technique_summary: Train with GRPO where, alongside format and answer rewards,
  a frozen judge model scores the generated visual and acoustic reasoning
  steps for factual accuracy and completeness against extracted
  AU/emotion/pitch/prosody features, with samples drawn by a Gaussian
  curriculum over four deception-difficulty tiers.
technique_kind: training
technique_validated_by: "Classification accuracy and a 1-5 reasoning quality
  score on four datasets: full model 73.76% average vs 67.41% for standard
  GRPO (format+accuracy rewards only), 58.00% for SFT alone and 49.17% for the
  untuned backbone; removing the audio-visual consistency reward costs 4.5
  points average accuracy and 0.5 reasoning score, removing the
  logic-alignment reward costs 2.85 points."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A general-purpose omni model prompted zero-shot (or with better
  prompting) reaching accuracy comparable to the trained model on these
  datasets, or an ablation showing standard outcome-only GRPO matching the
  process-reward version once compute is matched.
evidence_note: "Measured on four datasets with 7 baselines; ablations separate
  SFT, standard GRPO, curriculum, and each reward term. Weaknesses: single
  backbone, the reasoning-quality score and part of the judge training rely on
  LLM judges and the paper's own CoT dataset, baselines were deliberately
  denied the CoT text, and no matched-compute control for the curriculum."
confidence: low
