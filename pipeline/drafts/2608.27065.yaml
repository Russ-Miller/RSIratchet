arxiv_id: "2608.27065"
title: "Video-OPSD: Exploiting Privileged Visual Evidence for On-Policy
  Self-Distillation in Video Large Language Models"
url: https://doi.org/10.48550/arxiv.2608.27065
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: video-temporal-reasoning
statement: For 4B-8B Qwen-VL video models post-trained by on-policy
  self-distillation, conditioning the frozen self-teacher only on the
  annotated evidence frames (while the student sees the full video) yields a
  more accurate teacher and better student scores than giving the teacher the
  same frames plus non-evidence context, and teacher accuracy falls
  monotonically as temporally irrelevant frames are added.
kind: mechanism
backing_strength: single-paper
scope_condition: Requires ground-truth temporal evidence annotations in the
  training data; shown on three Qwen-VL backbones (2.5-VL-7B, 3-VL-4B/8B) with
  ~6.5K training examples and five video QA benchmarks.
technique: ""
proposed_technique: Condition the self-teacher only on evidence frames
technique_summary: In on-policy self-distillation for video LLMs, the frozen
  self-teacher replays the student's trajectory while seeing only frames from
  the annotated evidence interval plus the gold answer, and token-level
  distillation is weighted by each token's attention to those evidence visual
  tokens.
technique_kind: training
technique_validated_by: "Average over five video benchmarks against SFT,
  standard OPSD and GRPO on three backbones: Video-OPSD beat standard OPSD in
  all 15 backbone-benchmark pairs (+1.3 to +2.1 average points) and matched or
  slightly beat GRPO at ~40% of its training time; ablations show teacher
  training-set accuracy 70.4% with evidence frames only vs 64.9% with 8
  padding frames and 49.8% with 16 uniform frames (no gold answer), and final
  average falls from 51.0 to 50.6 to 50.4 as 4 then 8 non-evidence frames are
  added."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled run where the teacher given the full video (or
  evidence frames plus padding) produces equal or better student benchmark
  averages than the evidence-only teacher under the same data, frame budget
  and objective.
evidence_note: Measured, single paper, three backbones and five benchmarks
  averaged over three runs, with a clean 2x2 component ablation and a
  frame-padding sweep that isolates temporal noise from frame count. Gains are
  small (1-2 points) and depend on evidence-interval annotations that most
  video corpora lack; no independent replication.
confidence: medium
