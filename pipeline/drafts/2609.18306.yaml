evidence_note: "Measured: 24 (topic, bias-level) alignment cells over 15 runs
  each, plus mean opinion shift and distance-to-anchor against a matched
  Friedkin-Johnsen baseline. Alignment taken only at the final round, so it
  shows a magnitude gap, not temporal precedence; single model, single prompt
  template, no prompt ablations; a nonzero drift at zero biased agents
  indicates a model-level prior the design does not separate from the minority
  effect."
