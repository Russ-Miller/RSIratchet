statement: In fully connected networks of LLM agents (Llama 3.2-8B, 50 agents,
  10 rounds) where a fixed minority holds an unchanging extreme stance,
  neutral agents' textual justifications converge on the biased agents'
  vocabulary faster and more completely than their numeric stances do, so
  monitoring only the text overstates how much the group actually agrees.
kind: observation
