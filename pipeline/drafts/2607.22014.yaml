statement: For frozen general-purpose MLLMs driving a UAV in closed-loop
  aerial missions from a single high-level instruction, single-frame spatial
  perception ability (bounding-box IoU and distance RMSE on the initial image)
  is only weakly associated with mission success, so perception proxies cannot
  stand in for closed-loop evaluation.
kind: observation
backing_strength: single-paper
scope_condition: 22 open- and closed-source MLLMs, no aerial fine-tuning, 120
  hand-built missions in 5 UE5/Cosys-AirSim environments, 4-DoF
  continuous-magnitude actions, egocentric RGB only
