falsifier: A perception proxy (localization or depth estimate on the initial
  frame) that predicts closed-loop mission success rate with high correlation
  across a comparable model set would refute it.
evidence_note: "Measured: Pearson r between proxy perception and mission
  progress was 0.463 (mIoU) and -0.315 (RMSE) on a 10-mission proxy split;
  individual counterexamples cited (Claude Opus 4.6 best RMSE but weak
  missions; Gemini 2.5 Pro near-zero mIoU but non-trivial MP). Correlation
  computed over few missions, so the estimate is noisy; best overall success
  was under 35% against 84.4% human."
