statement: In a preregistered US experiment (N=2,144) where participants discussed an economic-policy
  misconception with ChatGPT over three rounds, a brief message that the model was biased against
  their party reduced belief correction by 28% (CI 16-40%) relative to a neutral control, with
  transcripts showing more pushback and less receptive engagement.
kind: observation
backing_strength: single-paper
scope_condition: ChatGPT, personally held economic misconceptions, three-round conversation,
  2026; US partisans.
