statement: 'Fine-tuning for cultural alignment scores raises agreement with a country''s majority
  answers on the World Values Survey while collapsing the spread of answers: tuned models anchor
  to the plurality option (a 39% human share in the example) and cover less than half of the
  human response dimensions, dropping to a quarter for one model, so alignment gains partly
  measure flattening rather than cultural understanding.'
