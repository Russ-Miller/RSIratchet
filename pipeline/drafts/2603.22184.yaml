arxiv_id: "2603.22184"
title: "Revisiting Quantum Code Generation: Where Should Domain Knowledge Live?"
url: https://doi.org/10.48550/arxiv.2603.22184
drafted_at: 2026-11-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: domain-knowledge
statement: For Qiskit quantum code generation on the Qiskit-HumanEval
  benchmark, recent general-purpose frontier LLMs wrapped in an
  execution-feedback repair loop exceed a Qiskit-fine-tuned 20B baseline by a
  wide margin (up to 85.4% vs 46.5% pass@1), so domain knowledge supplied at
  inference time can substitute for parameter-level domain fine-tuning in a
  fast-moving SDK.
kind: observation
backing_strength: single-paper
scope_condition: One benchmark (151 Qiskit-HumanEval tasks), one published
  fine-tuned baseline from an earlier model generation; general models are far
  newer and larger, and benchmark exposure during pretraining cannot be
  excluded.
technique: ""
proposed_technique: Replace domain fine-tuning with retrieval plus execution-feedback repair
technique_summary: "Keep the general-purpose model unchanged and supply domain
  knowledge at inference time: retrieve Qiskit docs plus core source code
  (dense FAISS, k=4) into the prompt, then feed unit-test error messages back
  for up to five repair attempts."
technique_kind: process
technique_validated_by: pass@1 on 151 Qiskit-HumanEval tasks against a
  zero-shot baseline and the published fine-tuned Granite-20B baseline
  (46.5%); agentic repair raised every model (e.g. Opus 4.6 68.9% zero-shot to
  85.4% at five repairs), while RAG alone gave modest and model-dependent
  gains, at 2-4x runtime.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A fine-tuned domain model built on a contemporaneous base model,
  given the same retrieval and execution-feedback harness, beats the
  general-purpose models under matched compute on Qiskit-HumanEval or a
  contamination-free Qiskit benchmark.
evidence_note: Measured pass@1 over 151 tasks, 16 models, four inference
  settings, five repeat runs for stability; but the fine-tuned baseline is
  quoted from prior work rather than re-run with the same harness, so model
  generation and harness are confounded, and the comparison is not
  compute-normalized.
confidence: medium
