stance_reason: ""
falsifier: A matched comparison in which the same curriculum augmentation
  gives equal or larger gains on lid-manipulation tasks than on
  transparent-object precise placement, or no gain over unaugmented
  fine-tuning on placement tasks under equal training budget.
evidence_note: Measured on one robot platform with three repeats per atomic
  task and 20 trials per composite task; baselines include ACT, X-VLA and the
  unaugmented backbone. Design does not isolate the curriculum schedule from
  augmentation itself (no ablation of curriculum vs flat augmentation), and no
  high-exposure test split numbers appear in the text given, so the
  transparent-object attribution rests on the per-task gain pattern alone.
