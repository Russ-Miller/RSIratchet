statement: For lightweight VLA policies fine-tuned on wet-lab manipulation
  demonstrations, injecting illumination and overexposure perturbations into
  observations online during fine-tuning (easy-to-hard curriculum) raises task
  success most on precise placement of transparent labware rather than on lid
  opening/closing, where success is already high or limited by other factors.
kind: observation
backing_strength: single-paper
scope_condition: SmolVLA-class policy on a low-cost So-ARM101 platform, 100
  teleoperated demonstrations per atomic task, 15 biological-lab atomic tasks
  plus 6 composite workflows; single paper, no seed-level variance reported
  beyond 3 repeats.
technique: ""
proposed_technique: Perturb observations online during VLA fine-tuning on a difficulty curriculum
technique_summary: During fine-tuning, visual observations are perturbed with
  brightness, contrast, low-light and overexposure operators whose intensity
  rises across training stages, ending with mixed original/augmented inputs,
  instead of building an offline augmented dataset.
technique_kind: training
technique_validated_by: "Success rate over 3 repeated runs per atomic task and
  completion rate over 20 trials per composite task, against ACT, X-VLA and
  unaugmented SmolVLA: placing a cryotube in the red rack rose 40.00% to
  65.00% and a centrifuge tube in the orange rack 43.33% to 53.33%, while lid
  tasks moved little (e.g. open water bath lid 78.33% unchanged); composite
  completion rose on all six workflows (desktop tidying 62.5% to 72.5%)."
stance_on_existing: neither
