statement: "For multi-agent LLM extraction pipelines over financial filings
  under a fixed compute budget, the accuracy ranking of orchestration patterns
  inverts with throughput: an iterative self-correcting (reflexive) loop is
  most accurate at low volume but falls below hierarchical supervisor-worker
  and then below parallel fan-out as daily volume rises, because queuing delay
  forces timeout truncation of the very correction iterations that produced
  its advantage."
