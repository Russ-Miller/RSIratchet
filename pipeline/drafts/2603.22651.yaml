evidence_note: "Measured: reported field-level F1 at six throughput levels for
  four architectures with Claude 3.5 Sonnet (reflexive 0.943 at 1K falling to
  0.871 at 100K; sequential 0.903 to 0.886), plus latency percentiles showing
  reflexive p99/p50 of 3.34x. The truncation mechanism is asserted from the
  design rather than isolated by an ablation that varies the timeout policy
  alone. Single paper, one cluster configuration, one document domain; cost
  figures tied to January 2025 API pricing."
