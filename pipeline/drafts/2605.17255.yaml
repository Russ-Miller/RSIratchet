statement: On 1,000 Lean 4 targets from computational and applied mathematics textbooks (optimization,
  numerical linear algebra, numerical analysis), whose statements depend on locally introduced
  definitions, current provers solve about 62-72% of a 200-problem sample, so applied-math formalization
  is tractable but not saturated and requires recovering textbook context to state problems
  faithfully.
