arxiv_id: "2608.29193"
title: "HalluPrism: When Multimodal Uncertainty Should Diagnose, Not Decide"
url: https://doi.org/10.48550/arxiv.2608.29193
drafted_at: 2026-10-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: abstention-and-self-knowledge
statement: For multimodal LLMs, a behavioral perturbation signature
  (answer/confidence change under visual degradation, blank-image replacement,
  and grounding/relation probes) predicts which failure family an error
  belongs to far better than scalar confidence, yet folding the same signature
  into confidence as a direct penalty makes answer-versus-abstain ranking
  worse than scalar confidence alone.
kind: observation
backing_strength: single-paper
scope_condition: Four open-weight MLLM families (Gemma 4, Qwen3-VL,
  LLaVA-Mistral, LLaVA-Vicuna) on HallusionBench, POPE, VSR and VizWiz-VQA;
  abstention tested only with three hand-designed scalarizations, not learned
  or calibrated ones.
technique: ""
proposed_technique: Probe failure structure before scoring abstention
technique_summary: Re-run an answer under visual degradation, blank-image
  replacement, and grounding/relation swaps to produce a three-coordinate
  signature used for failure-family diagnosis and to pick a matched correction
  prompt, rather than as an abstention score.
technique_kind: process
technique_validated_by: Pooled XGBoost failure-family AUROC over 58,440
  examples rose from 0.78 with scalar confidence to 0.95 with the signature
  and 0.97 with confidence added; per-dataset gains 0.634 to 0.769 on
  HallusionBench and 0.707 to 0.817 on VizWiz, near-neutral on VSR. Abstention
  AUROC fell under all three scalarizations (e.g. Qwen3-VL 0.81 to 0.73).
  Matched correction routing beat a generic prompt in 10 of 16 settings and
  cut break rate 15.5% to 2.7% on Qwen3-VL/VSR.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A simple direct scalarization of the same probe signature that
  improves answer-versus-abstain AUROC over scalar confidence across these
  models, or showing the diagnosis gain disappears once dataset identity is
  controlled.
evidence_note: Measured on 58,440 model-dataset outputs with dataset-ID and
  model-ID controls, leave-one-model-out splits, probe-design ablations
  (alternate L definitions, VSR removed, each visual perturbation dropped) and
  paired bootstrap intervals excluding zero. Failure-family labels are coarse
  and partly determined by benchmark identity, so the diagnosis gain is only
  partially separable from dataset identification; abstention conclusion
  covers three hand-designed scalarizations only.
confidence: medium
