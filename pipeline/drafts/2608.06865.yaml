stance_reason: ""
falsifier: A multi-turn or CoT prompt that elicits the same four
  dimension-specific analyses from one agent matching the multi-agent
  framework's F1 on the same OOD split and backbone, or the multi-agent gain
  disappearing when judge and observation agents are given matched token
  budgets.
evidence_note: Measured on 7,636 OOD videos (5,716 real, 1,920 fake) from 20
  unseen generators. Training-free comparison isolates architecture from
  training; multi-turn variants control for turns and frame re-access. But the
  trained system's gains come bundled with SFT on labels generated by a
  five-MLLM annotation pipeline tuned to this dataset, so the trained result
  is not a clean coordination-only comparison. Absolute performance is poor
  (F1 53% on an imbalanced set) and recall/precision trade off sharply across
  configurations. Single dataset, single paper, authors' own benchmark.
confidence: low
