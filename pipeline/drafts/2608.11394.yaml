arxiv_id: "2608.11394"
title: "GraphAlignCoder: Aligning Program and Proof Graphs for Code Generation"
url: https://doi.org/10.48550/arxiv.2608.11394
drafted_at: 2026-10-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: code-generation
statement: When fine-tuning a 4B code model, training on auxiliary targets
  that name each program region's correctness obligations (derived from
  aligning an AST implementation graph with Lean proof-flow traces) raises
  solved counts over code-only SFT, but the auxiliary-target stage alone
  shifts the model off the Python-only output distribution and must be
  followed by a code-only consolidation stage to avoid losing broad
  function-level ability.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3.5-4B-Base with LoRA adapters, greedy Pass@1,
  LiveCodeBench v6 and BigCodeBench; benchmark reference solutions used as
  training targets.
technique: ""
proposed_technique: Inject proof-graph correctness obligations, then consolidate on code only
technique_summary: Parses reference Python into a region-level implementation
  graph, aligns those regions with kernel-checked Lean proof-flow transitions
  to generate region-level obligation text, trains the model jointly on code
  plus obligation/concept prediction, then continues training on
  task-to-Python pairs only so deployment is ordinary code generation.
technique_kind: training
technique_validated_by: Pass@1 solved counts against base model, code-only SFT
  and CodeRL on LiveCodeBench v6 (50 vs 38 CodeRL), BigCodeBench Hard (23 vs
  16) and BigCodeBench Full (363 vs 359); ablation shows injection alone
  reaches 44 on LCB v6 but drops BCB Full from 354 to 339, and
  consolidation-only reaches 49/352/19.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Running the injection stage alone on other backbones shows no drop
  in broad function-level pass rate, or a matched-compute code-only SFT run
  with the same total steps matches the full two-stage pipeline's solved
  counts.
evidence_note: Measured on three benchmarks with one 4B backbone, single
  greedy sample, no variance reported and no matched-compute control for the
  extra training steps; the obligation text is produced by a GPT-5.2 teacher,
  so part of the gain may be teacher distillation rather than graph alignment.
confidence: low
