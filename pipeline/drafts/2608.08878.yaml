arxiv_id: "2608.08878"
title: "DistillCache: KL-Guided Adaptive KV-Cache Eviction for
  Memory-Efficient LLM Inference"
url: https://doi.org/10.48550/arxiv.2608.08878
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For a 7B instruction-tuned transformer under a fixed KV-cache
  budget, training a small policy to pick which cached tokens to keep by
  rewarding low KL divergence from the full-cache next-token distribution
  retains more long-context accuracy than attention-heuristic eviction (H2O,
  SnapKV), and the margin widens as the budget tightens and as context grows.
kind: mechanism
backing_strength: single-paper
scope_condition: Mistral-7B-Instruct-v0.3 with zero-shot transfer to
  Llama-3-8B; LongBench and GSM8K/BBH; budgets 12.5-50%; contexts up to 8K;
  concurrent RL baselines were re-implementations, not official code.
technique: ""
proposed_technique: Learn KV eviction by matching the full-cache output distribution
technique_summary: A ~200K-parameter MLP scores cached tokens from attention
  mass, value norm, attention variance, entropy and position, and is trained
  with REINFORCE against a per-step negative KL between full-cache and
  pruned-cache next-token distributions.
technique_kind: architecture
technique_validated_by: LongBench and reasoning accuracy across 12.5-100%
  budgets against full cache, H2O, SnapKV, and re-implemented
  ForesightKV/RLKV, plus perplexity increase, per-component latency and
  throughput; 5 training seeds; a supervised ranker on the same five features
  scored 37.8 vs 39.1 at 25% budget.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: At matched budget and model, heuristic eviction (H2O/SnapKV)
  matching or beating the KL-trained policy on LongBench, or the gap failing
  to widen at 12.5% budget and 8K context.
evidence_note: Measured on one 7B model with one transfer target; gains are
  1-3 absolute points with std 0.9-2.1, so some cells overlap. Comparisons to
  concurrent RL methods rest on the authors' own re-implementations. The
  supervised-ranker control isolates RL from feature choice; no control
  isolates the KL reward from the richer feature set.
confidence: low
