arxiv_id: "2608.25770"
title: "HypoForge: A Self-Improving Multi-Agent Framework for Automated
  Hypothesis Generation and Testing via Scientific Skill Learning"
url: https://arxiv.org/abs/2608.25770
drafted_at: 2026-09-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: harness-self-improvement
statement: For a frozen-backbone multi-agent scientific discovery pipeline on
  HypoBench tasks, distilling reusable procedural skills separately per stage
  — from discriminator critique of a whole hypothesis batch for generation,
  and from execution outcomes compared to ground-truth results for testing —
  beats no skill, an LLM-written skill, and a hand-written skill, and removing
  each stage's feedback signal costs most of the gain.
kind: observation
backing_strength: single-paper
scope_condition: 13 HypoBench tasks split 1:1 into train/test,
  DeepSeek-V4-Flash backbone, skill updates kept only when the training
  objective improves; data-driven discovery with executable statistical
  experiments only
technique: ""
proposed_technique: Learn skills per stage from the supervision that stage offers
technique_summary: Distil reusable text skills for hypothesis generation from
  a multi-dimensional discriminator's critique of the whole generated
  hypothesis set, and skills for experiment design and execution from testing
  trajectories scored against ground-truth outcomes, injecting them into agent
  prompts on later iterations without touching weights.
technique_kind: process
technique_validated_by: "On held-out HypoBench tasks: hypothesis quality 0.785
  and Hit@K 0.648 versus 0.724/0.409 with no skill, 0.738/0.579 for an
  AI-generated skill, 0.761/0.497 for a human-designed skill, 0.719/0.472 for
  HypoGeniC; test pass rate 0.659 versus 0.562 no-skill, 0.612 human-designed,
  0.589 ReAct, 0.417 POPPER. Ablations: removing discriminator feedback drops
  Hit@K to 0.491; removing execution outcomes drops pass rate to 0.565. Three
  runs. The generation quality metric is the same discriminator used as the
  training signal, so that number is not an independent check."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On a fresh held-out task split with an independently built
  hypothesis evaluator, feedback-refined skills score no better than a fixed
  human-designed or LLM-written skill, or removing per-stage feedback leaves
  the test pass rate unchanged.
evidence_note: Measured on one benchmark (13 tasks, half held out), one
  backbone, three runs, with large variance on Hit@K (±0.142). Ablations
  isolate the feedback signal. Generation quality is scored by the same
  discriminator that supplies the training signal, so quality gains may partly
  be Goodhart; the testing pass rate uses ground-truth outcomes and is the
  cleaner number. No matched-token-budget baseline.
confidence: low
