statement: "When LLM-generated peer reviews are compared with human reviews
  point by point under theory-guided critique frameworks, the model and human
  critique differ in kind rather than in quality: LLM reviews carry more
  explanatory depth, integrative reasoning and explicit argument structure,
  while human reviews more often identify higher-order weaknesses and give
  revision-oriented guidance, and an expert prompt does not close that gap but
  amplifies the LLM-side tendencies."
