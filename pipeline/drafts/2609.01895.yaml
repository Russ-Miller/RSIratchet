backing_strength: single-paper
scope_condition: ICLR 2025 reviews; critique annotated at point level for
  weakness critique and scientific questioning under five frameworks; baseline
  and expert prompts only
technique: ""
proposed_technique: Profile review critique by function, not human-likeness
technique_summary: Annotate each review point against knowledge type, argument
  structure, question depth, cognitive complexity and feedback function so
  model and human critique are compared by what functions they perform rather
  than by textual overlap.
technique_kind: process
technique_validated_by: Applied to ICLR 2025 human reviews versus baseline-
