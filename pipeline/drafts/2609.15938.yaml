falsifier: An experiment where random parent selection matches fitness-guided
  selection on mean and minimum external scores, or where removing crossover
  and mutation causes a consistent significant drop on both metrics across a
  larger set of cancer types.
evidence_note: "Measured: 94 runs, 34 cancer types, two post-hoc biological
  metrics never used as search fitness, six shared-protocol baselines. The
  selection ablation is the only clean single-variable comparison; the
  operator ablations ran on eight cancer types and were null after Holm
  correction, so absence of effect there may be power. External metrics reward
  targets already documented for the cancer, and the authors note prior
  exposure may contribute."
