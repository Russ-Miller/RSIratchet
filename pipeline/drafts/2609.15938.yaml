status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: In a generational genetic search over LLM-agent-generated
  scientific hypotheses (drug repurposing across 34 cancer types), replacing
  fitness-guided parent selection with uniform random selection while holding
  the scientific roles, variation operators and hypothesis count fixed lowers
  the population's mean and minimum external evidence scores but leaves the
  maximum unchanged, and removing crossover or mutation altogether produces
  mixed shifts that do not survive multiple-testing correction — so the
  selection rule, not the semantic variation operators, is where the
  measurable coordination gain sits.
kind: observation
backing_strength: single-paper
scope_condition: One base model (gpt-5.4-mini), population 6, 3 generations,
  drug repurposing hypotheses scored post hoc by DepMap selectivity and Open
  Targets association; operator ablations on only eight cancer types; token
  budgets not matched across methods.
technique: ""
proposed_technique: Coordinate hypothesis agents with a generational genetic algorithm
technique_summary: Specialized LLM agents generate, pairwise-score and
  semantically recombine or mutate structured hypotheses, with a genetic
  algorithm doing tournament parent selection and joint parent-offspring
  truncation to a fixed population.
technique_kind: process
technique_validated_by: Mean DepMap selectivity 0.171 and Open Targets
  association 0.426 versus 0.115/0.329 for the strongest of six task-matched
  baselines (Tree of Thoughts) and 0.039/0.163 for single-pass generation, on
  26 and 29 shared cancer types with the selected hypothesis chosen before
  external scoring; gains repeated on 27 held-out cancer types.
stance_on_existing: neither
