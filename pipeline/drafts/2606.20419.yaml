arxiv_id: "2606.20419"
title: Spectral Query-Key Product Weight Steering for Training-Free VLM
  Hallucination Mitigation
url: https://doi.org/10.48550/arxiv.2606.20419
drafted_at: 2026-10-29
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: visual-grounding
statement: "In GQA-based vision-language models (Qwen2.5-VL-7B, InternVL3-8B,
  Pixtral-12B), object hallucination in free-form captioning tracks the
  dominant singular modes of the per-head query-key product in middle layers,
  and specifically its symmetric (mutual content-similarity) component:
  damping those modes lowers CHAIR_s while damping an equal number of random
  modes, or the antisymmetric component, does not."
kind: mechanism
backing_strength: single-paper
scope_condition: Grouped-query-attention VLMs, greedy decoding, long free-form
  COCO captions; effect sizes are small (average 4.0% relative CHAIR_s
  reduction) and absent on short-answer MCQ benchmarks.
technique: ""
proposed_technique: Damp dominant query-key product modes in middle layers
technique_summary: Compute the thin SVD of each middle-layer head's query-key
  product, scale down its top-k singular modes, and realize the edit as a
  closed-form minimum-norm update to the query weights only, leaving shared
  key weights and inference unchanged.
technique_kind: architecture
technique_validated_by: CHAIR_s/CHAIR_i on COCO 2014 val with paired-bootstrap
  CIs, against the unedited baseline and a matched random-k mode control at
  the same k; POPE, HallusionBench, MME and MMMU reported to check capability
  retention; layer-locus, k and alpha sweeps on Qwen2.5-VL-7B.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Matched random-mode edits at the same k and alpha reduce CHAIR_s as
  much as dominant-mode edits, or antisymmetric-channel damping reduces
  hallucination comparably, on these or further GQA VLMs.
evidence_note: Measured on three models and six benchmarks, but the headline
  effect is small (Qwen CHAIR_s 31.44 to 28.56; InternVL3 33.81 to 33.23;
  Pixtral 34.14 to 33.81) and the random control differences are of similar
  order on two of three models; only Qwen got a full hyperparameter sweep, and
  CIs are in an appendix not shown. Mechanistic support comes from
  teacher-forced attention shifts (~+0.4pp toward image tokens in downstream
  layers) and the sym/antisym split; two alternative mechanisms (noun log-prob
  suppression, pre-noun attention re-grounding) were tested and failed. No
  comparison against decoding-time baselines like VCD or OPERA on the same
  setup.
confidence: low
