capability: multi-step-reasoning
statement: When a document image states multi-step selection constraints in
  narrative text and the supporting numbers sit in several charts, multimodal
  models degrade steadily as either the number of logical hops (2 to 5) or the
  number of charts (2 to 6) grows, with the best model reaching 62.83% overall
  against over 90% for human annotators.
kind: observation
backing_strength: single-paper
scope_condition: Synthetically generated single-page document images with
  interleaved charts and narrative; questions grounded on a semantic label
  rather than named entities; 2,074 examples, six task types; proprietary and
  open 7B-72B MLLMs.
