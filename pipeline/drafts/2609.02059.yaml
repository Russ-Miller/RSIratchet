falsifier: A model whose accuracy on these items stays flat or rises as
  reasoning depth goes from 2 to 5 and chart count from 2 to 6, or a frontier
  model matching the >90% human rate on the full set.
evidence_note: Measured over 2,074 generated instances with programmatic
  answer verification plus human checks of narrative and rendering;
  depth/chart trends reported for two reasoning models only (GPT-5.2
  Reasoning, Gemini-2.5-Pro Reasoning). Synthetic and out-of-domain by the
  authors' own framing, so absolute numbers may not transfer to real
  documents; the design does not separate chart OCR errors from reasoning
  errors, and the qualitative cases show both.
