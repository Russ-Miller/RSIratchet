arxiv_id: "2608.26081"
title: "SwarmWorld: Stigmergic technological evolution in societies of
  language-model agents"
url: https://doi.org/10.48550/arxiv.2608.26081
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: When initially identical LLM agents act in a shared persistent
  world where their artifacts remain and are scored by an external simulator,
  the shared society builds broader and more resilient technology portfolios
  than a matched best-of-N population of isolated agents, but isolated search
  still yields the single best-performing artifact.
kind: observation
backing_strength: single-paper
scope_condition: Simulated spatial world with 50-200 LLM agents, 800-3,200
  ticks, four matched world seeds; outcomes scored by a deterministic
  simulator under unseen disturbances after agents are removed.
technique: ""
proposed_technique: Coordinate agents through a persistent shared world, not messages
technique_summary: Let role-free agents build durable, executable artifacts in
  a shared simulated environment so later agents inherit and modify them,
  instead of coordinating through conversation or assigned roles.
technique_kind: process
technique_validated_by: Paired per-seed comparison against an endpoint-wise
  best-of-N isolated-agent envelope on portfolio resilience (0.2474/0.2365 vs
  0.1794), validated inventions (5.75/7.00 vs 2.75), held-out resilience, and
  best single artifact (0.2380 vs 0.3488), across four seeds and five
  checkpoints.
stance_on_existing: supports
related_claim_id: splitting-task-across-several-agents-helps-long-horizon-tasks-whose
stance_reason: Collective advantage appears for breadth and redundancy across
  loosely coupled parallel work, not for optimizing one artifact, consistent
  with the claim that multi-agent gains depend on dependency structure.
falsifier: A matched best-of-N isolated-agent envelope that equals or exceeds
  the shared society on portfolio resilience and validated-invention counts
  across seeds would refute it.
evidence_note: Measured on four matched world seeds per cell with paired
  seed-bootstrap intervals; effect sizes rather than population inference, and
  discovery-frontier AUC ranking flips with population size, so only the
  portfolio/resilience/invention direction is consistent. Single environment,
  single paper.
confidence: low
