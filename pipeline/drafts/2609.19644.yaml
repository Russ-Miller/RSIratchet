capability: harness-self-improvement
statement: Given a published state-of-the-art method as the starting problem, a fully autonomous
  multi-agent loop (extract limitations, generate and novelty-filter ideas, run experiments,
  select the best hypothesis, plan and run ablations, draft the paper, pass a simulated peer-review
  rebuttal) improved on the human baseline for 86 of 107 top-venue papers (80%) by an average
  25% relative, and its papers scored above the mean of accepted ICLR 2026 and NeurIPS 2025
  papers under automated AI reviewers; every judgement in that result, from the improvement
  parsed out of result tables to the review scores, was made by a model, not a person.
kind: observation
backing_strength: single-paper
scope_condition: 107 ICLR/ICML/NeurIPS papers as seeds across LLMs, robotics, neuroscience,
  speech, RL, optimization and time series, 2026; backbones Gemini 3.x Flash and Claude Opus
  4.x via Claude Code and Antigravity; gains parsed from tables by Gemini, reviews by Stanford
  Agentic Reviewer and ScholarPeer.
technique: ''
proposed_technique: Critic-gated refinement stages with a simulated rebuttal
technique_summary: Run every stage of an autonomous research loop as candidate, critic, refine
  with a bounded number of rounds, where the critic can accept, request refinement or reject,
  and close the loop with a simulated peer-review and rebuttal before the paper is emitted;
  the pattern is a reusable harness, independent of the research domain.
technique_kind: process
technique_validated_by: Improvement rate and mean relative gain over human SOTA on 107 papers,
  and automated review scores against accepted-paper averages; component ablations are planned
  by an agent for each hypothesis; no human review of the generated papers is reported.
