statement: For automatic generation of STEM questions, constraining the
  generation to paths traversed over an explicit domain causal graph and
  validating output with dedicated LLM agents at both the concept and output
  stages reduces factually incorrect or pedagogically inconsistent questions
  relative to direct LLM prompting.
