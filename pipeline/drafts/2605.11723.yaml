arxiv_id: "2605.11723"
title: "CaC: Advancing Video Reward Models via Hierarchical Spatiotemporal
  Concentrating"
url: https://doi.org/10.48550/arxiv.2605.11723
drafted_at: 2026-11-01
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: critique
statement: For VLM-based video reward models judging generated videos, overall
  accuracy on sparse structural/temporal anomalies is limited by attention
  dilution across the mostly-normal context, so a two-turn pipeline that first
  anchors an anomalous time window and then grounds bounding boxes in a
  densely resampled clip detects them better than one-pass global video-level
  judging.
kind: mechanism
backing_strength: single-paper
scope_condition: 8B open VLM backbone trained on a purpose-built dataset with
  per-frame bbox and temporal-window annotations; anomalies are sparse (short
  duration, small spatial extent) in AI-generated video; existing reward
  models evaluated with converted prompts/protocols
technique: ""
proposed_technique: Anchor the anomalous time window, then ground it spatially
technique_summary: A video reward model first scans uniformly sampled frames
  to predict an anomalous time window and anomaly type, then re-inspects a
  densely resampled crop of that window to confirm the anomaly and emit
  per-frame bounding boxes, trained with temporal, spatial and attribution IoU
  rewards on top of format and status rewards.
technique_kind: process
technique_validated_by: "On a held-out 1,000-video benchmark (500 normal/500
  anomalous), 81.7% overall accuracy versus 56.0% for the strongest of ten
  baselines (general VLMs, video reward models, AIGC detectors), +19.9 points
  on an external Skyra-derived subset, and larger margins on the sparsest
  splits; ablations: single-turn retraining -8.3 points, removing temporal IoU
  reward -19%, removing each training stage -12 to -16%. Used as a reward with
  UnifiedReward for Best-of-N and Flow-GRPO on Wan-2.1-1.3B, expert-annotated
  anomaly rate fell 29.0% to 17.3%."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A single-pass video reward model given the same dense frame budget
  matching the two-turn pipeline's accuracy on the same sparse-anomaly
  benchmark, or the two-turn gain disappearing once the baselines are given
  equal dense sampling and the same training data.
evidence_note: Measured on the authors' own benchmark and dataset, built by
  the same annotation pipeline as the training data, which is a self-favoring
  design; baselines were adapted to an unfamiliar protocol and several show
  extreme prediction bias (Skyra 0.982/0.018 recall), so the 25.7-point margin
  partly reflects baseline mis-specification. The single-turn ablation
  retrained on the same data is the cleanest control and shows a smaller
  8.3-point effect. Downstream generation gains confound CaC with
  UnifiedReward and use the same expert annotators.
confidence: medium
