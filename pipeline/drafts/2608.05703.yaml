capability: video-temporal-reasoning
statement: "On hour-scale (mean 88.8 min) open-ended streaming video QA with
  causal access, every streaming memory design degrades as the
  evidence-to-query gap grows, and they fail in different ways: recent-window
  systems cannot recover distant events (AURA 25.4% within 5 minutes falling
  to 10.5% beyond 30 minutes), text-summary systems keep temporal coverage but
  discard visual evidence, and model-internal compression loses fine-grained
  detail (StreamForest 14.4%, ThinkStream 7.5% on retrospection), while human
  accuracy without rewatching is 63.4%."
kind: observation
backing_strength: single-paper
scope_condition: 243 YouTube videos of 60-134 minutes, 3,646 manually
  validated open-ended QA pairs, LLM-judge binary factual-core scoring,
  baselines run through their released interfaces which reconstruct a causal
  prefix rather than holding persistent state
technique: ""
proposed_technique: Split streaming video into a latency frontend and an
  asynchronous memory backend
technique_summary: Frontend workers handle dispatch and proactive monitoring
  while backend workers asynchronously build a hierarchical event and entity
  memory with retained key frames, and route recall and external search on
  demand.
technique_kind: architecture
technique_validated_by: On StreamArena it ranked first among streaming systems
  on all four capabilities, improving 53.7-228.1% relative over the strongest
  streaming baseline per capability, and against query-triggered offline
  inference on the same Qwen3.5-397B-A17B backbone it cut pooled
  query-to-answer latency 66.2% (81.4s to 27.5s) while retaining 89.7% of
  pooled accuracy; the authors note baselines use smaller backbones so gains
  are not isolated to architecture.
stance_on_existing: neither
