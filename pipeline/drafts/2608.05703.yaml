stance_reason: ""
falsifier: A streaming system whose retrospection accuracy stays flat across
  evidence-to-query gaps from 5 to over 30 minutes on this or a comparable
  hour-scale open-ended benchmark, with no cost in visual-detail or proactive
  tasks.
evidence_note: Measured on one new benchmark by its authors, with a
  per-stratum breakdown across four gap ranges and a human reference under
  both rewatch and streaming conditions. Baselines run with heterogeneous
  backbone sizes and native inference interfaces, so the degradation pattern
  is attributed to memory design by design type rather than by controlled
  ablation.
