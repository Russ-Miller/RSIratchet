capability: procedure-following
statement: For timeseries-encoder-fused 8B LLMs answering questions that
  require chaining several temporal primitives, supervised fine-tuning on
  worked decompositions only helps on composition families whose
  decompositions were demonstrated, while RLVR with outcome-verifiable rewards
  on top of that checkpoint also lifts composition families that received no
  demonstration (+20.1 pp) and held-out compositions (+9.6 pp).
kind: observation
backing_strength: single-paper
scope_condition: Qwen3-8B with a timeseries encoder, trained entirely on
  synthetic atomic and composite QA with programmatic ground truth; evaluated
  on synthetic compositional splits plus TSEvol, SenTSR-Bench, MCQ2.
technique: ""
proposed_technique: RLVR on synthetic compositional timeseries QA with
  answer-type-specific rewards
