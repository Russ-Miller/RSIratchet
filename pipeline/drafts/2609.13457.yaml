evidence_note: "Measured on ~5k synthetic composite and ~8k OOD test samples
  against text LLM, temporal-reasoning and TS-native baselines; includes a
  rejection-fine-tuning control on the same 10K prompts (0.567 vs 0.597 RL)
  and a data-scaling comparison (110K extra SFT vs 10K RL). Controls are
  partial: the RL arm builds on the SFT arm, and reported budgets differ
  across comparisons."
