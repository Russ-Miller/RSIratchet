capability: embodied-control
statement: "For collaborative instance object navigation agents of 30B
  parameters or less, question-asking competence falls apart exactly where it
  is most needed: when the target description is category-only (the most
  ambiguous level), a fine-tuned 7B agent and a 30B VLM commit to immediate
  accept/reject decisions instead of asking (SR 0.06 and 0.02), while their
  success rises monotonically as the description adds color, feature and
  context (up to 0.68 and 0.54)."
kind: observation
backing_strength: single-paper
scope_condition: Navigation-ready VLMs (<=30B) evaluated on an offline
  question-asking protocol with generated distractor images, six graded
  description-specificity levels, and a VLM oracle; a frontier model
  (Gemini-3-flash) was not tested on the per-level breakdown.
technique: ""
proposed_technique: Score question-asking separately from the navigation episode
technique_summary: Replace in-episode evaluation of human-agent dialogue with
  an offline protocol where a questioner sees only the target description and
  a sequence of edited distractor images, and must either ask the oracle a
  clarifying question or decide match/no-match per observation.
technique_kind: process
technique_validated_by: Measured success rate, finish rate, questions per
  observation and wall-clock time for 5 systems across three oracle models on
  ~400 held-out episodes; oracle responses were additionally compared against
  human responses and reported as giving similar performance; episodes
  complete in seconds rather than the minutes a simulator episode needs.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A sub-30B CoIN agent whose asking rate and success on category-only
  descriptions match or exceed its performance on richly specified
  descriptions, under the same distractor protocol.
evidence_note: Measured on the authors' own benchmark (~400 test episodes,
  three oracles averaged) comparing a modular baseline (AIUTA), a fine-tuned
  7B model, and a 30B VLM across six description-specificity levels. The
  design isolates interaction from navigation but the benchmark, the
  distractor images, the descriptions and the oracle all come from the same
  authors and from the same generative model family, and only three systems
  were broken out per level.
confidence: medium
