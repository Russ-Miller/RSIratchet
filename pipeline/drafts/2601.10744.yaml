capability: embodied-control
statement: "For a 7B multimodal LLM trained by RL to explore multi-goal indoor
  environments while calling an episodic-memory retrieval tool, what the
  auxiliary question-answering reward asks about changes navigation success:
  rewarding answers to a single simple task-progress question leaves success
  rate at the untrained retrieval baseline (20.80 vs 20.96 SR), while
  rewarding answers across five question types (attribute, counting, location,
  relationship, state) raises it to 23.53 SR and 14.99 SPL."
kind: observation
backing_strength: single-paper
scope_condition: Qwen2.5-VL-7B fine-tuned with GRPO on HM3DSem-derived
  multi-goal navigation plus memory QA; evaluated on a 58-task subset of
  LMEE-Bench and a 36-scene subset of GOAT-Bench Val Unseen.
technique: ""
proposed_technique: Reward diverse memory questions, not just task progress
technique_summary: RL-fine-tunes a multimodal LLM with a multi-task reward
  over single-step action, frontier choice, and answers to varied
  memory-retrieval questions, so the agent learns to query its own episodic
  memory bank while navigating.
technique_kind: training
technique_validated_by: Success rate and SPL on LMEE-Bench (58 tasks, 272
  goals) and GOAT-Bench Val Unseen subset (278 subtasks), against a
  retrieval-augmented memory baseline (RA-Mem), 3D-Mem and Explore-EQA, plus
  an ablation varying the question type used in the reward.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation at matched training compute showing that reward over
  diverse question types gives no navigation gain over the simple
  task-progress question, or that the whole QA reward term is unnecessary once
  action and frontier rewards are used.
evidence_note: Measured on small subsets (58 of 166 LMEE tasks; 36 GOAT
  scenes) with a single backbone and one seed; the ablation's four settings
  differ by only 1-3 SR points with no variance reported, and 'All' question
  types beat 'multiple-choice' on GOAT but not on LMEE, so the ordering among
  the richer settings is not established.
