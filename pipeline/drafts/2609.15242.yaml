falsifier: On the same corpus with an independent judge and a larger
  evaluation set, faithfulness and factual correctness rank models in the same
  order, or factual correctness spreads as widely as faithfulness across
  models.
evidence_note: "Measured: seven models x 100 QA pairs on seven RAGAS metrics.
  Weak design: judge and dataset generator are the same model as one evaluated
  model (authors flag self-enhancement), evaluation set is a deterministic
  100-item prefix, decoding parameters not normalised across models, no
  confidence intervals, and single retrieval configuration so the low
  factual-correctness band may be a retrieval ceiling rather than a knowledge
  gap."
