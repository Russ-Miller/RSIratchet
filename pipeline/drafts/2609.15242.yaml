statement: In ESG-report RAG question answering with retrieval held fixed at a
  single top-1 chunk, open-weight 2B-30B generators vary widely in how well
  they stay anchored to the retrieved passage (faithfulness 0.607-0.822) yet
  all land in a narrow low band of factual correctness (0.387-0.449), and the
  most faithful model is the least factually correct, so groundedness to
  context and correctness of extracted ESG facts do not track each other.
kind: observation
backing_strength: single-paper
scope_condition: Seven Ollama-served open models 2B-30B, 498 EU ESG reports,
  100 synthetic QA pairs generated and judged by qwen3:4b-instruct, top-k=1
  retrieval, RAGAS metrics, no retrieval ablation and no non-RAG baseline.
