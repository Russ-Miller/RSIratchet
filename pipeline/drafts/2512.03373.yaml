capability: persuasion
statement: LLM-written advertisements matched human expert ads when personalized to personality
  traits (51% vs 49% preference, n=400) and beat them when built on general persuasion principles
  such as authority and consensus (59% preference, n=800); participants who recognized an ad
  as AI-made penalized it only slightly, and 29% chose the AI ad knowing its origin.
kind: observation
backing_strength: single-paper
scope_condition: Two online preference studies, 2025; personality-matched ads (openness, neuroticism)
  and principle-based ads; preference choice, not purchase behaviour.
