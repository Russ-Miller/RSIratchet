capability: embodied-control
statement: For LLM/VLM-driven heterogeneous robot teams, routing every
  high-level command through a digital-twin forward-dynamics and collision
  check built from the robot's own URDF before dispatch filters physically
  infeasible plans that the language model cannot rule out from semantics
  alone.
kind: mechanism
backing_strength: mechanism-reasoning
scope_condition: Demonstrated only in structured or semi-dynamic indoor
  settings (a ~60 m2 smart-home scene and a seven-gimbal choreography task)
  with no quantitative baseline comparison; the authors note uncertainty,
  perception noise and high-frequency disturbances are not handled.
technique: ""
proposed_technique: Check actions against a URDF digital twin before dispatch
technique_summary: Before any command reaches the hardware, it is run through
  forward dynamics simulation and collision detection in an Isaac Lab digital
  twin built from extended URDF models of each heterogeneous agent, and
  rejected if infeasible.
technique_kind: tooling
technique_validated_by: "Not measured against a baseline: the paper reports
  successful end-to-end execution of a multi-robot fruit-transfer task and a
  seven-gimbal dance generated in about three minutes with human input limited
  to the initial instruction, with no ablation of the safeguard and no
  failure-rate comparison."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation in which removing the digital-twin pre-execution check
  leaves collision and torque-violation rates, and task success, unchanged
  across the same heterogeneous robot tasks.
evidence_note: Argued architecturally and illustrated by two qualitative
  real-world demonstrations with three to seven robots; no baseline, no
  ablation of the safeguard, no reported rate of commands intercepted, and
  success is judged by narrative description and video rather than a metric.
  Design does not isolate the contribution of the physical check from the rest
  of the framework.
confidence: low
