arxiv_id: "2604.04664"
title: "ROSClaw: A Hierarchical Semantic-Physical Framework for Heterogeneous
  Multi-Agent Collaboration"
url: https://doi.org/10.48550/arxiv.2604.04664
drafted_at: 2026-11-06
