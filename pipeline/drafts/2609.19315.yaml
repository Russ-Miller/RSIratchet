arxiv_id: "2609.19315"
title: "GAVEL: Graph World Models for Verified and Efficient Long-Horizon LLM
  Task Planning"
url: https://doi.org/10.48550/arxiv.2609.19315
drafted_at: 2026-09-27
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: For long-horizon embodied task planning where a symbolic model
  defines action preconditions and effects, correcting a violated plan by
  edits the action model itself implies (inserting the missing navigate or
  open) raises plan success more per LLM call than returning the violation to
  the LLM for replanning, and the gain persists for frontier models as well as
  compact ones.
kind: mechanism
backing_strength: single-paper
scope_condition: BEHAVIOR-1K symbolic action level (nine primitives, no
  geometric feasibility); 100 single-task and 500 multi-task instructions;
  Qwen3-4B/8B, GPT-5.6 Sol, Claude Sonnet 5; instructions whose goals are
  expressible in the graph's predicates.
technique: ""
proposed_technique: Repair plans from the world model, ask the LLM only for semantic failures
technique_summary: Roll an LLM-generated action plan forward on an explicit
  graph world model of object relations, preconditions, effects and safety
  constraints, apply edits whose corrections follow from the action semantics,
  and return only unresolved semantic violations to the LLM.
technique_kind: process
technique_validated_by: "Single-task success on 100 BEHAVIOR-1K tasks: graph
  repair only reached 67.7% with Qwen3-4B at 1 LLM call vs 55.4% for
  SayPlan-style feedback replanning at 3.4 calls, and 76.2% vs 76.4% for
  Qwen3-8B; adding semantic-only re-queries gave 88.8% and 91.8% at 1.7 and
  1.5 calls. Multi-task: 92.6% vs 75.6% feedback-only and 60.2% for
  graph-edit-only planning, with shorter distance and ~12s less planning time.
  On a 100-instruction subset, GPT-5.6 Sol went 24.6% to 99.2% and Claude
  Sonnet 5 38.6% to 99.4%."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A setup where feedback-only replanning matches or beats
  model-derived repair at equal or fewer LLM calls, or where frontier models
  with plain prompting reach the same success as with the verify-and-repair
  layer.
evidence_note: Measured in a lightweight 2-D executor reimplementing
  BEHAVIOR-1K transitions (agreed with OmniGibson on all 100 single tasks),
  five seeds, shared task-understanding adapters and LLM budget across
  baselines. Baselines are reimplementations of SayPlan and EPoG mechanisms in
  the authors' pipeline, not the original systems. Residual multi-task
  failures were mostly upstream object extraction, so the planning-layer claim
  is isolated but the ceiling is set by grounding.
confidence: medium
