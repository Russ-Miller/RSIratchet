arxiv_id: "2603.17872"
title: Mitigating LLM Hallucinations through Domain-Grounded Tiered Retrieval
url: https://doi.org/10.48550/arxiv.2603.17872
drafted_at: 2026-11-07
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For a local 8B model wrapped in a tiered retrieve-and-verify
  pipeline (intrinsic check, then trusted-archive then open-web search,
  context filtering, atomic-claim verification), the gain over zero-shot
  answering concentrates on narrow temporal and numerical queries and shrinks
  toward parity on open-domain common knowledge, while the pipeline introduces
  its own failure of confidently answering false-premise questions instead of
  denying them.
kind: observation
backing_strength: single-paper
scope_condition: Llama 3.1 8B generating and grading, Gemma3 27B as judge, 650
  queries over TimeQA v2, FreshQA v2, HaluEval General, MMLU Global Facts,
  TruthfulQA; win rate against a zero-shot baseline of the same model.
technique: ""
proposed_technique: Answer from memory first, escalate to tiered retrieval
technique_summary: Answer closed-book and verify atomic claims; only if
  internal confidence falls below threshold, search trusted domain archives,
  then the open web, filter retrieved documents for relevance, regenerate,
  re-verify claims, and refuse if no tier supports them.
technique_kind: retrieval
technique_validated_by: "Judge-preference win rate against the same model
  answering zero-shot: 83.7% on TimeQA v2, 78.0% on MMLU Global Facts, 64.7%
  FreshQA, 54.7% TruthfulQA, 50.0% HaluEval General; groundedness 78.8-86.4%
  on factual-answer rows; 20% of HaluEval queries exited early without
  retrieval. No ablation of individual phases, no matched-compute baseline,
  and 64 of 150 TimeQA queries were lost to API quota and counted as ties."
stance_on_existing: supports
related_claim_id: retrieval-moves-the-trust-boundary-rather-than-removing-it
stance_reason: "The pipeline lowers unsupported generation but the residual
  failures are retrieval-side: distraction by tangential retrieved documents
  and confirming a false premise from contextually related evidence."
falsifier: A run of the same pipeline showing equal or larger win rates on
  open-domain common-knowledge benchmarks than on narrow temporal/numerical
  ones, or showing no false-premise overclaiming losses relative to the
  zero-shot baseline.
evidence_note: Measured on 650 queries, single 8B backbone, single judge
  model, no per-phase ablation, so the four phases cannot be separated; the
  win-rate ordering across benchmarks is the robust part, the failure-mode
  frequencies (~14 overclaiming cases) are hand-categorised from 65 losses.
confidence: low
