status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: long-context-degradation
statement: For long-horizon QA where evidence is sparse and scattered across
  multi-thousand-token contexts, keeping a graph memory in latent space and
  serializing only a fixed-budget retrieved subgraph (k=30 edges) into the
  prompt scores higher than explicit text-graph memory systems and than a
  full-context reasoner, across frozen reasoners from 1.5B to 8B.
kind: observation
backing_strength: single-paper
scope_condition: Three QA benchmarks (HotpotQA, NarrativeQA, WikiHop),
  training on a separate corpus; memory modules are 1.5B with LoRA; reasoner
  frozen. Explicit-graph baselines (A-Mem, PREMem, THEANINE, Mem0) fall far
  below even the no-memory baseline here.
technique: ""
proposed_technique: Store the graph memory latently, expose only a budgeted subgraph
technique_summary: Build a capped entity-relation graph from streamed chunks,
  embed its edges, retrieve a top-k subgraph in latent space conditioned on
  the question, and serialize only that subgraph into a frozen reasoner's
  prompt.
technique_kind: retrieval
technique_validated_by: Answer accuracy and ROUGE-L on 2,600 held-out QA
  instances versus reasoner-only, RAG, and five memory systems; average
  accuracy 56.08/58.64/63.34% at 1.5B/3B/8B, best at every scale. Ablations
  remove retrieval, swap in BFS retrieval, or go fully explicit, all scoring
  lower. Inference time stays flat (12-14s) to 10k tokens.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: On the same benchmarks with matched budgets, an explicit-graph
  memory system matching or beating the latent-graph variant, or the
  latent-graph variant failing to beat a plain full-context reasoner at any
  scale.
evidence_note: "Measured on three QA sets across three backbones, with
  structural ablations and a timing table. Weak points: single training
  corpus, memory modules fixed at 1.5B, ROUGE-L sometimes favours MemGen
  (NarrativeQA), and the explicit baselines' near-zero NarrativeQA scores
  suggest pipeline brittleness that may be partly implementation-specific
  rather than paradigm-level. Interpretability claim is argued via one case
  study, not measured."
