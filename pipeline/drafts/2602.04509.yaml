arxiv_id: "2602.04509"
title: "Model-Dowser: Data-Free Importance Probing to Mitigate Catastrophic
  Forgetting in Multimodal Large Language Models"
url: https://doi.org/10.48550/arxiv.2602.04509
drafted_at: 2026-11-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fine-tuning-retention
statement: When fine-tuning the language decoder of a 2B-7B multimodal LLM on
  a narrow downstream task, freezing the parameters that score highest on a
  data-free output-sensitivity measure (Jacobian norm x weight magnitude x
  input activation, estimated before training with synthetic prompts) retains
  more upstream zero-shot ability than post-merging or gradient-history sparse
  methods, and the advantage grows as fine-tuning extends from the last few
  layers to the earlier decoder layers.
kind: mechanism
backing_strength: single-paper
scope_condition: LLaVA-1.5-7B and NVILA-Lite-2B fine-tuned on captioning,
  classification and VQA datasets (10k samples), update ratio around 0.1,
  upstream measured on TextVQA/OKVQA/OCRVQA/MMB/GQA.
technique: ""
proposed_technique: Freeze parameters ranked by data-free output-sensitivity probing
technique_summary: Before fine-tuning, score every weight by Jacobian-norm
  times weight magnitude times input activation, estimated with Hutchinson
  sampling over model-generated synthetic prompts, then freeze the top-scoring
  weights and update only the rest with a fixed binary mask.
technique_kind: training
technique_validated_by: Harmonic mean of upstream zero-shot accuracy and
  downstream accuracy against Full-FT, DARE, Grafting, ModelTailor and SPIDER
  across four downstream datasets and fine-tuning depths from 4 to 32 layers;
  also compared against random masking at matched update ratios over three
  seeds, and score ranking compared to a real-data-estimated ranking by
  Spearman correlation (0.891).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run where freezing top-sensitivity-scored parameters retains no
  more upstream accuracy than random masking at the same update ratio, or
  where post-merging methods match it when all decoder layers are fine-tuned.
evidence_note: Measured on two architectures and four downstream datasets with
  five baselines, including a random-mask control with seed variance and
  significance tests. Depth sweep supports the early-layer part of the claim.
  Single paper, one lab; SPIDER could not be run above 20 layers on the 7B
  model, so the deep-layer comparison against the strongest baseline is partly
  incomplete.
confidence: medium
