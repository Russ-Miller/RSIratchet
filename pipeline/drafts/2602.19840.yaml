arxiv_id: "2602.19840"
title: "SAMAS: A Spectrum-Guided Multi-Agent System for Achieving Style
  Fidelity in Literary Translation"
url: https://doi.org/10.48550/arxiv.2602.19840
drafted_at: 2026-11-21
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For multi-agent literary translation pipelines built from one base
  LLM, selecting the agent workflow per text segment from a computed stylistic
  signal beats running either fixed workflow on all segments, and the two
  fixed workflows each win on different segments so neither is universally
  better.
kind: observation
backing_strength: single-paper
scope_condition: English-centric translation across five language pairs on
  FLORES-200 and WMT24, four base models, two hand-built workflows routed by a
  thresholded wavelet-derived feature of word-length sequences; thresholds
  fitted on a 200-segment validation set of two authors.
technique: ""
proposed_technique: Route the agent workflow by a stylistic signal from the source text
technique_summary: Convert a source segment's word-length sequence into a
  wavelet-packet feature vector and use thresholds on its entropy and
  low-frequency energy to deterministically pick which ordered set of
  specialized translation agents runs.
technique_kind: process
technique_validated_by: "XCOMET and COMETKIWI-23 on FLORES-200 and WMT24
  against single-LLM and multi-agent baselines, plus an ablation against each
  fixed workflow (Qwen3-235B en->xx: 96.78 routed vs 91.33 and 95.86 fixed)
  and head-to-head human style-fidelity preference against five baselines."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Under matched agent budget and the same base model, always running
  the stronger of the two fixed workflows matches or beats signal-based
  routing across the same benchmarks; or the routed gain disappears when the
  routing signal is replaced with a random assignment.
evidence_note: Measured on two benchmarks with four base models, with an
  ablation isolating routing from the agent pool. Routing thresholds were
  fitted on a separate 200-segment set, so routing is not tuned on test. But
  the comparison does not control token or call budget across workflows (the
  two fixed workflows differ in agent count), and the style-fidelity claim
  rests on an unspecified human preference protocol with no annotator counts
  or agreement reported. Baselines were not re-run with equal-cost scaffolds.
confidence: low
