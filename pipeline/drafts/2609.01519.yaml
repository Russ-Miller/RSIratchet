arxiv_id: "2609.01519"
title: "When Guardrails Look Effective: Construct Validity Failures in LLM
  Agent Commerce Evaluation"
url: https://doi.org/10.48550/arxiv.2609.01519
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: evaluation-validity
statement: "In multi-turn LLM buyer-seller market simulations, a measured
  welfare gain attributed to a platform guardrail can be mostly an artifact of
  the scaffold the guardrail was bundled with: holding the offer schema and
  buyer choice rule identical across guarded and unguarded cells shrank or
  reversed the effect (+87.4, +35.0, +28.8 became +7.2, -13.9, +23.8 across a
  Qwen2.5 1.5B-14B ladder), and single-generation effects on the most
  favorable profiles shrank from a mean +229 to +37.6 with three generations
  per cell, with generation residuals accounting for 49.9% of variation."
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen2.5-Instruct 1.5B/3B/14B at 4-bit, self-play buyer and
  seller, 30-60 synthetic hotel profiles, two question rounds, temperature
  0.2; repeated-generation probe is post-hoc on four profiles selected for
  extreme effects.
technique: ""
proposed_technique: Unify offer schema and chooser, then flag the treatment
technique_summary: Apply the policy treatment as post-parsing boolean flags
  over one shared message schema and one shared buyer decision rule, average
  repeated generations within profile-condition, and bootstrap over profiles
  rather than generation rows.
technique_kind: process
technique_validated_by: Paired profile-level Both-None welfare differences
  with 20,000-draw profile bootstrap, exact 16-assignment sign-flip placebo
  (p=0.50), variance decomposition, and scripted profit-maximizing and
  inefficient-bundling seller positive controls showing opposite welfare signs
  under identical buyer-surplus gains.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication in which guarded and unguarded cells already share
  schema and chooser, with several generations per profile-condition,
  reproduces welfare gains of the original magnitude and sign across model
  sizes.
evidence_note: Measured within one model family and one synthetic hotel
  testbed; the scaffold contrast is a direct paired re-run (180 vs 360
  dialogues), but the stability probe is an exploratory 24-dialogue
  winner's-curse check on post-hoc-selected profiles and cannot estimate a
  population effect. The incentive manipulation check is an 18-dialogue smoke
  test, underpowered.
confidence: medium
