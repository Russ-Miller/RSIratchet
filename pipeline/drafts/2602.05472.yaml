statement: "When a self-supervised RL loop has one model construct masked-span
  tasks, solve them, and critique its own solutions, sharing one set of
  parameters across the three roles beats splitting them: for a Qwen3-8B base
  model, a frozen, an independently trained, or even a stronger off-the-shelf
  external constructor all score several points below the co-evolving unified
  policy on general reasoning and math benchmarks."
kind: mechanism
backing_strength: single-paper
scope_condition: Base Qwen3 models 4B-30B self-trained on raw corpora with
  hindsight-verifiable masked-span tasks; evaluated on MMLU-Pro, SuperGPQA,
  BBEH, Math500, GSM8K, AIME24.
technique: ""
proposed_technique: Share one policy across task-constructor, solver and reviewer roles
technique_summary: A single set of weights is prompted into three roles —
  masking reasoning-critical spans to make verifiable tasks, solving them with
  multiple rollouts, and critiquing each rollout with a verbal critique plus a
  soft score — and all three objectives update the same parameters.
technique_kind: training
technique_validated_by: "Ablation on Qwen3-8B-Base: unified ALIVE 66.82
  MMLU-Pro vs 62.58 with a stronger external (Kimi-K2.5) constructor, 63.35
  decoupled trainable constructor, 60.25 frozen constructor; also compared
  against R-Zero and PretrainZero under matched data and compute."
