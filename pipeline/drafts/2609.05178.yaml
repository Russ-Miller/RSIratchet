capability: embodied-control
statement: "For vision-language-action and world-action manipulation policies
  evaluated on LIBERO-style tasks, near-ceiling one-shot task success does not
  predict the ability to resume a task from a failure state that arose during
  the model's own execution: all six tested policies lost over half their
  success rate on recovery scenarios, rankings inverted between the two
  settings, and recovery success fell steeply as the failure altered object or
  environment state rather than just the last action."
kind: observation
backing_strength: single-paper
scope_condition: Simulated tabletop manipulation (LIBERO suites), six VLA/WAM
  policies, failure states harvested from real rollouts and labelled into four
  recovery levels by an LLM judge.
technique: ""
proposed_technique: Failure-recovery benchmark built from harvested execution failures
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A policy set whose standard LIBERO ranking preserves its ranking on
  recovery scenarios, with recovery success rates close to one-shot success
  and no drop from level-1 to level-4 failures.
evidence_note: "Measured: 2178 recovery scenarios from 130 subtasks, 10 trials
  each, six policies; recovery success rates per level reported (e.g. 0.0% at
  L4 on LIBERO-100 for most models). Failure levels are assigned by an LLM
  from rendered video, so level difficulty is not independently validated, and
  results are simulation-only."
