arxiv_id: "2609.05178"
title: "LIBERO-RECOVER: Beyond Task Success Towards Failure Recovery in
  Robotic Manipulation Models"
url: https://arxiv.org/abs/2609.05178
drafted_at: 2026-09-19
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For VLA and world-action manipulation policies that score
  near-ceiling on standard LIBERO, recovery success after a real execution
  failure falls sharply as recovery requires deeper state reasoning \u2014
  retrying or adapting the immediate action works far more often than
  restoring a displaced task object or clearing an environmental obstruction
  \u2014 and rankings on the standard benchmark do not predict recovery
  rankings.
kind: observation
backing_strength: single-paper
scope_condition: Six VLA/WAM policies (pi0, pi0-Fast, GR00T-N1.5, OpenVLA-OFT,
  Wan2-Policy, Cosmos-Predict2-Policy) in LIBERO simulation, on 2178 scenarios
  built from failures the policies themselves produced, 10 trials per task.
technique: ""
proposed_technique: Score recovery from the model's own real failure states
technique_summary: Build evaluation scenarios by replaying naturally occurring
  failure states from policy rollouts and measuring whether the policy still
  completes the original task, graded by how much state restoration the
  failure demands.
technique_kind: process
technique_validated_by: Applied to six policies; all showed over 50% drops
  from standard LIBERO success to recovery success, with monotone decline
  across the four recovery levels and rank inversions relative to standard
  LIBERO (Wan2-Policy +14.4 on LIBERO-100 but -5.0 under failures).
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A policy set whose standard LIBERO ranking reproduces its recovery
  ranking, or whose L3/L4 recovery rates match its L1/L2 rates on failures
  drawn from its own rollouts.
evidence_note: Measured across four LIBERO suites and four difficulty levels;
  level labels and failure localization were assigned by an LLM over rendered
  videos, so the difficulty hierarchy is partly annotation-defined rather than
  independently validated, and level counts are imbalanced (L4 rates are often
  0.0).
confidence: medium
