statement: 'On 1,010 counterfactual edits rooted in Chinese cultural entities and aligned with
  English counterparts, an edit made in one language largely does not propagate to the other:
  edits succeed in the edited language (about 80% for Chinese at batch size 10, falling with
  batch size) while the other language keeps answering the old fact, so multilingual models
  store the same fact in language-specific ways that editing does not bridge.'
