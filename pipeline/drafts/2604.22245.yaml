arxiv_id: "2604.22245"
title: "Listening with Time: Precise Temporal Awareness for Long-Form Audio
  Understanding"
url: https://doi.org/10.48550/arxiv.2604.22245
drafted_at: 2026-11-04
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: For long-form audio (up to 30 minutes) temporal grounding and dense
  captioning, having the model first emit a coarse global timeline of 2-5
  temporal-semantic segments and then iteratively crop and re-listen to local
  audio spans through tool calls yields higher IoU and caption scores than
  single-pass long-context inference or fixed sliding-window chunking, and
  degrades less as duration grows.
kind: mechanism
backing_strength: single-paper
scope_condition: Qwen3-Omni-30B backbone fine-tuned on 1.2k hours of
  purpose-built temporally annotated Chinese/English audio, then RL-tuned;
  evaluated on the authors' own benchmark plus one external
  advertisement-localization split.
technique: ""
proposed_technique: Build a global timeline first, then crop and re-listen
technique_summary: The model predicts a coarse segment-level timeline over the
  whole recording, then runs multi-turn reasoning in which each step calls a
  crop_audio tool to re-encode a narrow span at full resolution before
  refining its timestamp or caption.
technique_kind: tooling
technique_validated_by: mIoU and Recall@0.3/0.5/0.7 for grounding, IoU-gated
  FENSE for dense captioning, on LAT-Bench (ZH/EN) and BLAB advertisement
  localization against Gemini-2.5/3.0-Pro, Qwen3-Omni, and sliding-window
  variants; ablations removing the global timeline or the tool-use CoT each
  lose several points.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An independent long-form audio temporal benchmark on which the same
  backbone trained on the same data without the global timeline or without
  audio-cropping tool calls matches or exceeds the full framework, or on which
  the duration-robustness gap versus a long-context baseline disappears.
evidence_note: Measured on the authors' own benchmark built from the same
  pipeline as their training data, which favors their method; the external
  check (BLAB advertisement localization, 30-min subset) is a single
  transferable task. Ablations isolate the timeline, the tool-use CoT, RL
  stage, and downsampling factor, but training data and architecture are
  confounded with the reasoning paradigm relative to non-finetuned baselines.
  Only the QA-only SFT arm controls for data.
confidence: low
