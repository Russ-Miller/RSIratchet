arxiv_id: "2601.10010"
title: "VERHallu: Evaluating and Mitigating Event Relation Hallucination in
  Video Large Language Models"
url: https://doi.org/10.48550/arxiv.2601.10010
drafted_at: 2026-11-13
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: In 7B video LLMs, reallocating frame-level attention by
  Gaussian-propagating the top-k key frames' attention to neighbouring frames
  in middle decoder layers raises accuracy on dense-event relation QA but
  lowers it on counterfactual questions where the queried event is absent,
  because with no relevant visual evidence the amplification boosts
  semantically insignificant frames.
kind: mechanism
backing_strength: single-paper
scope_condition: Two 7B VideoLLMs (LLaVA-NeXT-7B, QwenVL-2.5-7B) on a
  counterintuitive dense-event video benchmark of causal/temporal/subevent
  relations; layer sweep 0-25; training-free.
technique: ""
proposed_technique: Propagate key-frame attention to neighbouring frames mid-layer
technique_summary: At intermediate decoder layers, rank frames by attention,
  then Gaussian-weight and boost the visual tokens of frames adjacent to the
  top-k key frames before the MLP, blending with the original hidden state.
technique_kind: decoding
technique_validated_by: Accuracy on VERHallu relation classification, QA and
  counterfactual QA against the unmodified model and a Visual Contrastive
  Decoding baseline; LLaVA-NeXT-7B gained broadly (RC-subevent 16.7 to 55.8,
  SRH 6.5 to 17.9) while QwenVL-2.5-7B gained on QA-subevent (40.7 to 45.3)
  and lost on CFQA (50.6 to 44.6); layer sweep showed the trade-off
  concentrated in layers 10-15; inference speed roughly unchanged.
stance_on_existing: supports
related_claim_id: 7-8b-video-llms-inference-time-hallucination-intervention-only-effective-layer
stance_reason: Both find that inference-time visual-evidence interventions in
  video LLMs work only at middle decoder layers and not at shallow or late
  layers.
falsifier: A layer sweep on more video LLMs showing the same attention
  propagation applied at middle layers improves counterfactual-QA accuracy as
  much as event-relation QA, or showing shallow/late layers give equal
  event-relation gains.
evidence_note: Measured on two 7B models over one new benchmark (574 clips,
  7676 samples) with a layer sweep and hyperparameter ablations; the CFQA drop
  is shown on only one model (QwenVL-2.5-7B, -6.0 points), and no independent
  replication. The explanation for the CFQA drop is argued from the layer
  sweep, not isolated by an intervention.
confidence: low
