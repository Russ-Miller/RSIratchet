arxiv_id: "2604.00677"
title: "CL-VISTA: Benchmarking Continual Learning in Video Large Language Models"
url: https://doi.org/10.48550/arxiv.2604.00677
drafted_at: 2026-11-06
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: fine-tuning-retention
statement: When pre-trained Video-LLMs (Video-LLaVA, VideoLLaMA2) are
  sequentially fine-tuned across heterogeneous video tasks, continual-learning
  methods that stop forgetting by isolating task-specific parameters and
  routing among them lose general video understanding relative to plain
  sequential LoRA fine-tuning, so retention of seen tasks and transfer to
  unseen video benchmarks trade against each other.
kind: observation
backing_strength: single-paper
scope_condition: 7B pre-trained Video-LLMs, 8-task sequence spanning
  perception/domain understanding/reasoning, LoRA-based CL methods, five
  held-out general video benchmarks
technique: ""
proposed_technique: Score continual learning on held-out general video benchmarks too
technique_summary: Evaluates continual-learning methods not only with standard
  forgetting metrics on seen tasks but also on disjoint general video
  understanding benchmarks plus compute and storage cost.
technique_kind: process
technique_validated_by: "Applied to 10 CL methods on two backbones: MR-LoRA
  and DISCO had the best BWT (0.02, -0.85) yet fell 4.94 and 5.98 average
  points below LoRA-FT on five general benchmarks, with NExTQA dropping 15.98
  and 21.12 points."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A parameter-isolating CL method that matches or beats plain
  sequential LoRA fine-tuning on held-out general video benchmarks while
  keeping near-zero backward transfer.
evidence_note: Measured on 10 CL methods, 2 backbones, 8 curated tasks, with
  LoRA-FT as baseline and five non-overlapping general benchmarks; single task
  ordering, single epoch per task, and judge-model scoring, so ordering and
  judge effects are not isolated.
confidence: medium
