arxiv_id: "2608.12426"
title: "Large Language Models Can Follow Instructions, But Not Many at Once:
  Phase Transitions in Compositional Constraint Satisfaction"
url: https://doi.org/10.48550/arxiv.2608.12426
drafted_at: 2026-10-23
