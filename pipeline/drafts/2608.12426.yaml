stance_reason: It quantifies the failure growth as constraints accumulate and
  attributes it to multiplicative accumulation rather than interaction.
falsifier: Finding substantial negative pairwise co-failure correlations, or a
  selection/ordering of constraints that keeps all-pass rates high at k=8-12,
  or a model whose all-pass rate stays far above the product of its
  per-constraint rates.
evidence_note: "Measured: 369,753 deterministic constraint checks, 4,527
  probes, 15 models. Aggregate mCSR fits 72.0%x0.922^(k-1) with 0.2pp held-out
  MAE on k=9-12; at k=8 per-constraint 40.7% vs 5.7% all-pass. Mean pairwise
  phi = +0.067 over 601 pairs, only 1 negative. Difficulty, order and
  parameter confounds controlled. Does not cover sequential or conditional
  composition, or semantic constraints."
