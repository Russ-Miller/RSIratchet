status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: procedure-following
statement: When a prompt imposes k deterministically verifiable constraints at
  once, per-constraint pass rate declines only gently with k while the
  probability of satisfying all k collapses multiplicatively, because
  constraint failures within a response are nearly independent rather than
  pairwise-interfering — so joint reliability breaks down beyond roughly 5-6
  simultaneous constraints and cannot be rescued by choosing or ordering which
  constraints are combined.
kind: mechanism
backing_strength: single-paper
scope_condition: Pure conjunctive composition of 36 rule-verifiable lexical,
  structural, format, numeric and relational constraints; 15 models across 8
  families; k=1-12; raw generation with no scaffolding; excludes semantic or
  discourse constraints.
