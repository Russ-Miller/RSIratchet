arxiv_id: "2609.03718"
title: What Do CAE Simulation Agents Really Need Beyond a Generic Harness?
url: https://doi.org/10.48550/arxiv.2609.03718
drafted_at: 2026-10-22
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: multi-model-coordination
statement: For CAE simulation tasks (OpenFOAM, FEniCS, PyChrono, COMSOL) run
  with a current general-purpose coding-agent harness and a strong backbone, a
  single agent with no multi-agent role decomposition and no scripted
  self-critique matches or exceeds the published scores of multi-agent
  specialized CAE systems, because the harness itself supplies the multi-turn
  reasoning and execution-feedback repair the decomposition was built to
  compensate for.
kind: observation
backing_strength: single-paper
scope_condition: Holds with information access, repair budget and benchmark
  scoring criterion matched; the specialized systems were not re-run on the
  same backbone, so backbone strength is confounded with scaffolding.
technique: ""
proposed_technique: Drop CAE scaffolding, supply solver tutorials instead
technique_summary: Run CAE simulation tasks with an off-the-shelf coding-agent
  harness (file, shell, multi-turn, execution feedback) and no
  simulation-specific roles, retrieval pipeline or reflection prompt, while
  requiring the agent to read the relevant solver tutorial before writing its
  solution.
technique_kind: process
technique_validated_by: "Task success under each benchmark's native criterion:
  FoamBench 96.4% (106/110) vs the specialized system's published 88.2%,
  MCP-SIM 100% vs 91.7%, ties elsewhere and 33.3% on FEABench; ablations on
  FoamBench show must-read tutorials 80.9% to 96.4%, repair budget 71.8% to
  96.4%, and a scripted-reflection prompt changing nothing (96.4% both)."
stance_on_existing: supports
related_claim_id: splitting-task-across-several-agents-helps-long-horizon-tasks-whose
stance_reason: Adds a domain case where multi-agent decomposition gives no
  benefit over a single strong agent on tightly coupled sequential solver
  setup.
falsifier: Re-running the specialized multi-agent CAE systems on the same
  backbones and harness budget and finding they beat the single-agent Direct
  Baseline on FoamBench or similar field-level-scored suites.
evidence_note: Measured on six benchmarks, but only FoamBench (110 cases) is
  large and field-level scored; single run per configuration, no variance
  reported, several suites under 15 cases; specialized baselines are published
  numbers from weaker-era backbones rather than re-runs, so the comparison
  does not isolate scaffolding from base model.
confidence: low
