statement: For video MLLMs on dynamic-scene questions, final-answer accuracy
  overstates temporal understanding, because many queries can be answered from
  a single frame's visual cues or statistical priors; decomposing each query
  into object-centric sub-questions and scoring the intermediate steps
  separates genuine persistent tracking from coincidental correctness.
kind: mechanism
backing_strength: single-paper
scope_condition: Multimodal LLMs answering object-centric questions over
  dynamic video where object identity, state and relations change over time.
technique: ""
proposed_technique: Score object-centric sub-questions, not just the final answer
technique_summary: Decomposes each video query into human-verified
  object-centric sub-questions about identity, state and relations so
  intermediate reasoning is scored rather than only the final answer; a
  companion framework builds explicit object trajectories by chunk-wise state
  extraction and temporal aggregation.
technique_kind: process
technique_validated_by: Compared state-of-the-art MLLMs on the new STEMO-Bench
  and reported that the object-trajectory framework reduces hallucinated
  answers and improves spatio-temporal consistency; no numbers given in the
  available text.
