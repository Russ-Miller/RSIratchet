arxiv_id: "2601.16219"
title: "Domain Specific Specialization in Low-Resource Settings: The Efficacy
  of Offline Response-Based Knowledge Distillation in Large Language Models"
url: https://doi.org/10.48550/arxiv.2601.16219
drafted_at: 2026-11-15
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: When fine-tuning a 7B open model on institutional regulations,
  supervising it on instruction-context-response examples that carry the
  original regulation text in the input field yields fewer hallucinated
  factual answers than training on several times more question-answer pairs
  with no supplied evidence, because the model learns to read the evidence
  rather than memorize facts.
kind: observation
backing_strength: single-paper
scope_condition: Qwen-2.5-7B with QLoRA on a single university's undergraduate
  regulations; 500 context-bearing examples vs 2,000 context-free and 15,000
  general examples; evaluated on 66 hand-written questions.
technique: ""
proposed_technique: Put the source evidence in the training example's input field
technique_summary: Generate SFT data as instruction-context-response triples
  where a teacher model copies the verbatim supporting regulation passage into
  the input field, including adversarial items whose evidence refutes the
  question's premise.
technique_kind: training
technique_validated_by: Reported 96.7% accuracy on a 30-question hybrid set
  with adversarial traps and 100% rejection of non-compliant requests, versus
  'persistent hallucinations' from the context-free 2,000-line and general
  15,000-line sets; the baselines' numeric accuracy is not reported, and the
  evaluation sets are small and single-institution.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A matched-budget comparison on several institutions where
  context-free fine-tuning data produces equal or lower hallucination rates
  than evidence-in-input data at the same token count.
evidence_note: "Argued more than measured: only the proposed condition has
  reported numbers (96.7% on 30 questions, 90% on 30, 66.7% on 6), the two
  baseline strategies are described qualitatively as hallucinating, and the
  three conditions differ in size, source and format at once, so format cannot
  be isolated from data size or curation."
confidence: low
