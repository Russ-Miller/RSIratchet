source_id: zhong-2018-semregex
title: "SemRegex: A Semantics-Based Approach for Generating Regular
  Expressions from Natural Language Specifications"
url: https://aclanthology.org/D18-1189/
drafted_at: 2026-09-19
drafted_from: abstract
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: formal-query-synthesis
statement: When training a sequence-to-sequence model to generate regular
  expressions from natural language, rewarding semantic equivalence to the
  reference (checked by DFA equivalence and test cases) yields more
  semantically correct regexes than maximum-likelihood training on the
  reference string, because one intent has many syntactically different
  equivalent regexes.
kind: mechanism
backing_strength: single-paper
scope_condition: Seq2seq NL-to-regex generation on three public datasets;
  depends on having a decidable equivalence oracle for the target language.
technique: ""
proposed_technique: Train on semantic equivalence, not string match
technique_summary: Replaces the MLE objective with a reward that maximizes
  expected semantic correctness of the generated regex, measured by a
  DFA-equivalence oracle plus random and distinguishing test cases.
technique_kind: training
technique_validated_by: Semantic accuracy against prior state-of-the-art
  syntax-based models on three public NL-to-regex datasets; the paper reports
  superiority but the excerpt gives no numbers.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A controlled comparison on the same datasets where semantic-reward
  training matches or trails MLE training on semantic accuracy.
evidence_note: Measured on three public NL-to-regex datasets against prior
  state of the art; the abstract gives no effect sizes, no ablation separating
  the DFA oracle from the test-case components, and the equivalence oracle is
  specific to regular languages.
confidence: medium
