arxiv_id: "2606.05901"
title: Reducing Hallucinations in Complex Question Answering using Simple
  Graph-based Retrieval-Augmented Generation (long version)
url: https://doi.org/10.48550/arxiv.2606.05901
drafted_at: 2026-10-30
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For agentic complex multi-hop QA over a Wikipedia-derived knowledge
  base, adding handwritten graph-query tools over a lightweight document graph
  (article/section/paragraph links) on top of vector search raises
  factual-correctness precision and recall and answer relevancy largely by
  cutting safe refusals, so hallucinated answers go down only relative to a
  no-retrieval zero-shot agent and go up relative to plain vector RAG, which
  refuses most questions.
kind: observation
backing_strength: single-paper
scope_condition: One model (GPT-5.4, medium reasoning), 510 MoNaCo questions,
  three runs, LLM-as-a-judge scoring with no human validation; knowledge base
  is public Wikipedia so the zero-shot arm benefits from parametric memory.
technique: ""
proposed_technique: Expose handwritten graph queries as agent tools, not Cypher generation
technique_summary: Build a simple document graph (article, section, paragraph,
  chunk with link/next/previous edges) and give the agent fixed, handwritten
  Cypher-backed tools for discovery, structural navigation and relational
  lookup instead of letting it write queries.
technique_kind: tooling
technique_validated_by: "Median over three runs on 510 MoNaCo questions vs
  vector-RAG and zero-shot baselines: factual-correctness precision 0.36 vs
  0.15 vs 0.43, recall 0.33 vs 0.13 vs 0.39, answer relevancy 0.61 vs 0.35 vs
  0.80, fine-grained truthfulness 63 vs 35 vs 40.5; fully correct 142 vs 58 vs
  174 answers, wrong-answer counts 191 vs 84 vs 301; total tokens 45,695 vs
  41,694. No per-tool ablation."
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A run on the same or another complex-QA benchmark where adding the
  graph toolset leaves refusal rate unchanged while still improving factual
  precision and recall, or where it lowers absolute wrong-answer counts below
  plain vector RAG rather than raising them.
evidence_note: Measured on 510 of 1,207 answerable MoNaCo questions, three
  repeats, single generator model and single judge model (Llama-4-Maverick),
  no human validation. Graph tools were used only under explicit prompt
  instructions and several tools went unused, so the contribution of
  individual tools is not isolated; the comparison is whole-configuration.
confidence: medium
