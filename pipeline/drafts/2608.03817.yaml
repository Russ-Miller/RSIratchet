arxiv_id: "2608.03817"
title: "UHP Detection: LVLMs have their Unique Hallucination Pattern in the
  Consistency Space"
url: https://arxiv.org/abs/2608.03817
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: hallucination
statement: For binary visual question answering with open LVLMs
  (InstructBLIP-7B, Qwen2.5-VL, InternVL-4B), a hallucinated answer can be
  held with high response consistency, so a single consistency/uncertainty
  score misses it; separating consistency into four probe groups (image vs.
  text perturbation crossed with affirmative vs. negated statement) and
  classifying on the joint within- and between-group agreement pattern detects
  hallucination better than any single-score black-box or white-box baseline.
kind: mechanism
backing_strength: single-paper
scope_condition: Binary (yes/no) visually grounded questions with
  deterministic ground-truth labels on AMBER and PhD; three open LVLMs;
  requires a labelled training split per model to fit the classifier; not
  tested on open-ended generation.
technique: ""
proposed_technique: Probe consistency on four axes, not one score
technique_summary: Convert a binary question into an affirmative and a
  contradictory statement, re-ask each under semantically equivalent image
  transformations and paraphrases to form four consistency groups, and train a
  lightweight classifier on 14 within-group and between-group agreement
  features to flag hallucination.
technique_kind: prompting
technique_validated_by: AUC-ROC/AUC-PR against 7 white-box and 5 black-box
  detectors on AMBER and PhD across three LVLMs, with the same classifier pool
  and selection protocol for baselines; up to +18.72 AUC-ROC and +20.07 AUC-PR
  over the strongest black-box method; ablations removing each group or
  feature type, and cross-dataset transfer.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A single consistency score (e.g. semantic-entropy over sampled
  responses) matching the four-group pattern classifier's AUC on the same
  AMBER/PhD splits and models, or the group ablations showing one group alone
  reaching full-configuration performance.
evidence_note: "Measured on 2,000 sampled instances per dataset, 80/20 split,
  three open LVLMs, against twelve baselines under a shared
  classifier-selection protocol. Ablations isolate each group and the
  within/between feature split. Weaknesses: the method trains a supervised
  classifier while several baselines are training-free signals (though the
  paper applies the same classifier post-processing to all); gains are smaller
  and not uniform on PhD, where a white-box baseline beats it on one model;
  the detection depends on binary-answer tasks and does not extend to
  open-ended generation."
confidence: medium
