arxiv_id: "2609.22452"
title: "Vox-Infinity: Benchmarking the Limits of Long-Context Spoken Language
  Models"
url: https://doi.org/10.5281/zenodo.22868361
drafted_at: 2026-09-26
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: "For spoken language models answering questions over long dialogue
  histories, converting the history to transcripts beats keeping it as audio
  when the answer is a lexical detail (exact slot values across dense turns:
  mean 71.3% vs 42.6%), but loses when the answer depends on how something was
  said, where audio history wins for six of seven models and by a larger
  margin once lexical emotion cues are removed."
kind: observation
backing_strength: single-paper
scope_condition: Seven spoken language models (Qwen3-Omni, GLM-4-Voice,
  AudioFlamingo3/Next, MiMo-Audio, Gemini-3.1-Pro, Qwen3.5-Plus) at a
  32,768-token context, with text histories from SenseVoice ASR; GPT-4o judged
  accuracy; audio histories up to ~8+ minutes of required context.
technique: ""
proposed_technique: Pick history modality by what the question needs
technique_summary: Feed long dialogue history as transcripts for
  lexical-recall questions and as raw audio for paralinguistic questions,
  rather than one format for all.
technique_kind: prompting
technique_validated_by: Each model run twice on the same 13,516 QA pairs with
  text vs audio history; text won on Ultra Multi-Turn (71.3% vs 42.6% mean)
  and Personal Monologues, audio won on Beyond-Semantic for six of seven
  models, with the audio advantage rising from -0.6 to +6.6 points
  model-averaged when semantic emotion cues were controlled by synthesizing
  neutral text in emotional styles.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A model set where audio history matches or beats transcripts on
  exact lexical retrieval from long histories, or where transcripts match
  audio on emotion questions whose text is semantically neutral.
evidence_note: Measured on a purpose-built benchmark (1,474 sessions, 13,516
  QA, 127.96h) with answer-provenance annotations; both modalities run on the
  same items, so the comparison is controlled. Text side depends on one ASR
  system, so the lexical advantage is partly a property of SenseVoice
  transcription quality. Judge validated against humans on 300 samples at 99%
  agreement. GLM-4-Voice is an exception in both emotion groups.
confidence: medium
