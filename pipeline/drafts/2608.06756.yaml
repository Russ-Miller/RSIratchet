arxiv_id: "2608.06756"
title: "Capek 0.5: An Execution-Centric Vision-Language Model for Embodied
  Intelligence"
url: https://arxiv.org/abs/2608.06756
drafted_at: 2026-10-24
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: embodied-control
statement: For embodied vision-language models trained as separate capability
  specialists (spatial, temporal, action guidance, state verification) from
  one backbone, consolidating them by TIES weight merging and then routed
  multi-teacher on-policy distillation retains more of each specialist's gain
  than either step alone or than mixed-data RL, which shows
  capability-specific biases.
kind: observation
backing_strength: single-paper
scope_condition: Two Qwen backbones (35B-A3B MoE, 2B dense); specialists
  trained with GRPO on verifiable rewards; retention measured on eight
  signature benchmarks under matched prompts and scorers.
technique: ""
proposed_technique: Merge capability specialists, then distil on student prefixes
technique_summary: Train one RL specialist per execution capability from a
  shared backbone, merge their task vectors with TIES, then refine the merged
  student by distilling from the routed specialist teacher on the student's
  own generated prefixes.
technique_kind: training
technique_validated_by: Controlled ablation on 35B-A3B against the shared
  backbone, four standalone experts, Mix-RL, TIES-only and MOPD-only across
  eight capability benchmarks; TIES+MOPD best on 3 of 8 and second on the
  other 5, improving 7 of 8 over MOPD alone. Also 28/34 and 30/34 matched
  benchmark rows improved over the Qwen initialisations, and EB-HAB success
  46.0 to 63.0.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: A replication where TIES-only or MOPD-only, or plain mixed-data RL,
  retains specialist gains as well as or better than TIES+MOPD across all four
  capability families, or where the ordering does not hold on a different
  backbone.
evidence_note: Measured on the authors' own harness with matched decoding per
  pair; single paper, and the State Verification benchmark (Capek-StateBench)
  is the authors' own, built from the same BEHAVIOR-1K source as their
  training data, so that row is not an independent test. No closed-loop
  ablation of the consolidation routes.
confidence: medium
