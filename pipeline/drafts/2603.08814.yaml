arxiv_id: "2603.08814"
title: "Scale-Plan: Scalable Language-Enabled Task Planning for Heterogeneous
  Multi-Robot Teams"
url: https://doi.org/10.48550/arxiv.2603.08814
drafted_at: 2026-11-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: For LLM-based multi-robot task planning in object-rich simulated
  households, restricting the planner to the action and object subset found by
  backward graph search over a PDDL-domain action graph raises task completion
  over shallow LLM-only filtering and over no filtering, with the gain
  concentrated on long-horizon complex tasks rather than short ones.
kind: mechanism
backing_strength: single-paper
scope_condition: 49 AI2-THOR tasks (MAT2-THOR) with a given PDDL domain and
  GPT-5.2 as the LLM; heterogeneous two-plus-robot teams; no explicit
  grounding of the symbolic representation to simulator state
technique: ""
proposed_technique: Filter actions and objects by backward search on a PDDL action graph
technique_summary: Build an offline graph whose nodes are PDDL action schemas
  and whose edges link effects to preconditions, have the LLM propose a few
  candidate terminal actions for the instruction, then backward depth-first
  search to the minimal predecessor set, and plan only over those actions and
  their object parameters.
technique_kind: retrieval
technique_validated_by: Task completion rate, goal condition recall and
  executability on 49 MAT2-THOR tasks against LLM-as-planner, LLM+P, and two
  LaMMA-P variants (overall TCR 78% vs 53% for the strongest baseline), plus
  an ablation against no filtering (66%) and shallow LLM filtering (67%);
  complex-task TCR 59% vs 41-44%.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: An ablation on comparable multi-robot household tasks in which
  action-graph backward-search filtering matches or falls below shallow LLM
  filtering and the unfiltered pipeline, or in which its advantage is larger
  on short tasks than on long-horizon ones.
evidence_note: Measured on one benchmark the authors themselves cleaned and
  released (49 tasks, only 17 complex and 7 vague), one LLM, one simulator, no
  repeated runs or variance reported; small per-category counts make the
  complex-task gap (59% vs 41-44%, roughly 3 tasks) weakly resolved. The
  ablation does isolate filtering from the decomposition/allocation pipeline.
confidence: low
