arxiv_id: "2606.06907"
title: "SpectCount: Spectrotemporal Counting via Synthetic Signals Improves
  Large Audio Language Models"
url: https://doi.org/10.48550/arxiv.2606.06907
drafted_at: 2026-10-30
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: audio-understanding
statement: For 8B-class large audio language models (Audio Flamingo 3,
  Qwen2-Audio-Instruct), LoRA fine-tuning on fully synthetic pulse-counting
  audio — short sinusoidal pulses scattered across time and frequency, with
  the target being how many there are — raises accuracy on unseen sound, music
  and speech understanding benchmarks (MMAU, MMAR, MMSU, AIR-Bench) over the
  base model, with the largest gains on tasks needing fine-grained temporal
  aggregation and a drop on speaker counting.
kind: observation
backing_strength: single-paper
scope_condition: Two open 8B-class LALMs; gains are modest (about 1-9%
  relative) and checkpoint selection used MMAU-test; one task category
  regressed.
technique: ""
proposed_technique: Fine-tune on synthetic pulse-counting audio
technique_summary: Generates on-the-fly synthetic audio of 1-10 short
  sinusoidal pulses at random times and mel-band frequencies plus noise, and
  LoRA-fine-tunes the audio model to count them.
technique_kind: training
technique_validated_by: Accuracy on MMAU-test-mini/test, MMAR, MMSU and
  AIR-Bench against reproduced base-model scores for two models, plus
  ablations removing frequency diversity or multi-pulse counting and
  restricting LoRA to one module.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Applying the same synthetic counting fine-tune to other LALMs
  leaves cross-domain benchmark accuracy flat or lower, or a matched-compute
  LoRA run on unrelated data gives the same gain.
evidence_note: Measured on four benchmarks for two models; baselines are the
  authors' reproduced base scores. No matched-compute control fine-tune on
  non-targeted synthetic data, so the specificity of the counting objective
  rests on the two internal ablations. Checkpoint chosen by MMAU-test
  performance, which weakens the 'unseen' framing for MMAU.
confidence: medium
