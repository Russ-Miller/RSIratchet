arxiv_id: "2609.17771"
title: "HINT-Plan: Human Intention-Aware Robot Task Planning in Context-Rich
  Environments using Vision Language Models"
url: https://doi.org/10.48550/arxiv.2609.17771
drafted_at: 2026-09-23
drafted_from: full-text
model: claude-opus-5
status: draft — not filed. Review, edit, then move into catalog/ by hand.
capability: planning
statement: "In VLM-driven human-aware robot task planning over scene graphs,
  the bottleneck is inferring and grounding the symbolic goal, not the
  planning: once both human and robot goals correctly cover the ground truth,
  a formal multi-agent planner produces a valid, conflict-free joint plan in
  99.6% of trials, while end-to-end success with VLM-inferred human goals is
  69.7%."
kind: mechanism
backing_strength: single-paper
scope_condition: Photorealistic household simulation (VirtualHome, 4 scenes),
  one human and one mobile robot, cooperative goal-consistent human assumed,
  PDDL-style domain with FMAP planner, GPT-5.6-Sol and open-weight VLM
  backbones, 2,400 trials per method.
technique: ""
proposed_technique: Predict human intention as a symbolic goal, then plan jointly
technique_summary: A VLM infers the human's latent intention from third-person
  images plus a scene graph as symbolic goal predicates rather than an action
  sequence, and those goals are grounded with the robot's goal into a
  multi-agent PDDL problem solved by a formal planner.
technique_kind: process
technique_validated_by: Joint success rate 69.71% vs 35.50% for VLM-as-planner
  and 34.42% for GG-LLM, with paired cluster bootstrap CIs on 48
  scene-activity-task configurations; also higher robot and human goal
  completion and about half the functional conflict rate.
stance_on_existing: neither
related_claim_id: ""
stance_reason: ""
falsifier: Substituting ground-truth human and robot goals leaves end-to-end
  success far below ceiling, or the symbolic planner fails on a large fraction
  of correctly grounded problems in comparable domains.
evidence_note: Measured in simulation with an oracle-goal ablation isolating
  grounding error (SR 69.71 to 96.38; 99.60% planner success on 1,490
  correctly-grounded trials). Success drops to 25.5% on complex two-item
  activities, where goal prediction fails most. Single simulator, one planner,
  hand-written domain; does not test deviating or non-cooperative humans.
confidence: medium
