  - id: contextual-privacy
    label: "Controlling what sensitive information it reveals"
    scope_note: "Covers whether outputs let a third party infer or see user data the context did not permit sharing, including calibrating partial disclosure to different audiences; excludes training-data extraction and harmful-content refusal."
