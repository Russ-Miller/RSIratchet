    merged_from: [causal-reasoning, scientific-inquiry]
    note: "Recurring and coherent; multi-step-reasoning and planning do not cover intervention and causal structure."
  - id: confidence-calibration
    label: "Knowing how likely its answer is to be right"
    scope_note: "Covers calibrated per-query success probabilities usable for routing, deferral or single-pass decisions; excludes the refusal behavior itself, which abstention-and-self-knowledge covers."
