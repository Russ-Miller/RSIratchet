    merged_from: [cross-modal-reasoning-transfer, cross-modal-interference]
    note: "Two independent framings of the same failure mode — modality changing the answer when it should not — and not covered by visual-grounding."
  - id: tool-use-judgment-and-recovery
    label: "Knowing when to call a tool and what to do when it fails"
    scope_note: "Covers deciding whether an external call is needed at all, actually using what comes back, and retrying/correcting/escalating after a tool or environment error; excludes argument formatting and tool selection mechanics covered by tool-use."
    paper_count: 2
    merged_from: [tool-error-recovery, tool-call-necessity]
    note: "Recurring agentic failure mode that sits beside, not inside, the existing tool-use entry."
  - id: abductive-investigation
    label: "Forming the best explanation and hunting for the evidence that tests it"
    scope_note: "Covers generating and ranking hypotheses for observations, revising them as evidence arrives, and sifting large noisy pools for the few true indicators; excludes deductive rule-following and retrieval where relevant passages are already supplied."
    paper_count: 2
    merged_from: [abductive-reasoning, investigative-search-under-noise]
    note: "Two papers converge on hypothesis-driven evidence seeking, which multi-step-reasoning and retrieval-utilization both miss."
