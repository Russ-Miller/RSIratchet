    note: "Two independent framings of the same active-gap-closing behavior, distinct from abstention and from ordinary tool-use."
  - id: causal-and-experimental-reasoning
    label: "Distinguishing causation from correlation and testing it"
    scope_note: "Covers inferring causal structure, intervention effects and counterfactuals, plus running hypothesize-experiment-revise loops to discover hidden relationships; excludes purely logical deduction and analysis of a fixed dataset."
