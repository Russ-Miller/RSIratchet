recommended:
  - id: spatial-reasoning
    label: "Reasoning about space, distance and layout"
    scope_note: "Covers metric, topological and relative spatial judgements over images, scenes or coordinates (distance, bearing, containment, arrangement, comparative size); excludes merely locating or naming an object, which visual-grounding already covers."
    paper_count: 4
    merged_from: [visual-spatial-layout, quantitative-spatial-reasoning, fine-grained-visual-comparison, geospatial-reasoning]
    note: "Four independent papers converge on a well-defined weakness distinct from visual-grounding: models see what is there but misjudge where and how big."
  - id: visual-document-and-diagram-reading
    label: "Reading charts, diagrams and degraded text"
    scope_note: "Covers extracting values and insight from charts, interpreting stepwise visual manuals or schematics, reading sketch markup, and OCR under blur or low resolution; excludes general image description and clean text-only documents."
    paper_count: 4
    merged_from: [chart-understanding, diagrammatic-instruction-following, degraded-text-recognition, sketch-input-interpretation]
    note: "Four papers hit the same practical bottleneck — turning structured or noisy visual information into usable content — and it is not reducible to visual-grounding."
  - id: compression-and-continual-learning-retention
    label: "Retaining behavior after compression or continual training"
    scope_note: "Covers whether pruning, quantization or a sequence of training tasks preserves prior capabilities (catastrophic forgetting, behavioral drift); excludes a single fine-tuning round's safety effects, covered by fine-tuning-retention."
    paper_count: 3
    merged_from: [compression-retention, continual-learning-retention]
    note: "Complements fine-tuning-retention with the deployment-time modifications practitioners actually apply, and has repeated evidence."
  - id: causal-reasoning
    label: "Reasoning about cause rather than correlation"
    scope_note: "Covers causal structure (confounders, chains, colliders), interventions and counterfactuals, including under flipped surface semantics; excludes plain logical deduction and factual recall."
    paper_count: 2
    merged_from: [causal-reasoning]
    note: "A classic, separable reasoning failure mode not captured by multi-step-reasoning or logical-deduction-robustness."
  - id: scientific-discovery
    label: "Proposing and validating new scientific models"
    scope_note: "Covers autonomous hypothesis generation, symbolic/mechanistic model search over data, and empirical refinement loops; excludes domain QA, literature recall and ordinary code generation."
    paper_count: 2
    merged_from: [scientific-model-discovery, scientific-discovery]
    note: "A high-stakes, increasingly benchmarked capability that domain-knowledge and planning do not cover."
  - id: feedback-incorporation
    label: "Revising after external correction"
    scope_note: "Covers updating reasoning and answers in response to another party's natural-language corrections and steering a derailed dialogue back on track; excludes unprompted self-repair and excludes caving to wrong pushback, which sycophancy covers."
    paper_count: 2
    merged_from: [feedback-incorporation, conversational-error-recovery]
