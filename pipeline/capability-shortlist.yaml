  - id: physical-and-spatial-reasoning
    label: "Reasoning about physical and spatial situations"
    scope_note: "Covers building and using a consistent model of a scene or physical system — relative position, orientation, layout, forces, dynamics, units and conservation constraints; excludes object recognition, hallucinated objects, and generic math word problems."
    paper_count: 3
    merged_from: [spatial-reasoning, physical-reasoning, physical-consistency]
    note: "Three proposals point at the same underlying world-model failure and nothing in the index covers it (visual-grounding is about grounding answers in pixels, not spatial or physical structure)."
  - id: targeted-unlearning
    label: "Removing targeted knowledge and keeping it removed"
    scope_note: "Covers erasing specified facts, concepts, or unsafe capabilities while preserving related benign knowledge and general ability, including whether the removed content resurfaces under paraphrase, attack, or later fine-tuning; excludes adding or editing in new knowledge."
    paper_count: 2
    merged_from: [selective-unlearning, unlearning-robustness]
    note: "Two independent proposals converge on the same construct, and neither knowledge-updating nor fine-tuning-retention covers removal and its durability."
  - id: visual-generation-control
    label: "Generating and editing images to specification"
    scope_note: "Covers whether generated or edited visual output satisfies the requested content, layout, and constraints, including applying an edit to the right region while preserving the rest; excludes describing or answering questions about existing images."
    paper_count: 2
    merged_from: [visual-generation-control, instructed-image-editing]
    note: "The index is entirely about understanding modalities, not producing them, so controllable generation is a real gap with repeat evidence."
  - id: cross-modal-evidence-integration
    label: "Combining visual and textual evidence"
    scope_note: "Covers cases where the answer requires jointly using image content and text or retrieved facts, and the failure is ignoring or under-weighting one modality; excludes pure perception errors and object hallucination."
    paper_count: 2
    merged_from: [cross-modal-evidence-integration]
    note: "Two papers on a distinct failure mode that visual-grounding and retrieval-utilization each only half cover."
  - id: over-refusal
    label: "Refusing harmless requests"
    scope_note: "Covers false-positive refusals and excessive hedging on benign prompts that merely resemble unsafe ones; excludes failure to refuse genuinely harmful requests."
    paper_count: 2
    merged_from: [over-refusal, retrieval-induced-safety-degradation]
    note: "The natural complement to jailbreak-robustness, which the index currently measures in only one direction."
  - id: confidence-calibration
    label: "Knowing how likely its own answer is right"
    scope_note: "Covers whether internal or verbalized confidence signals track correctness and stay stable under perturbation; excludes refusing to answer and excludes raw accuracy."
    paper_count: 1
    merged_from: [confidence-calibration]
    note: "Calibration is a long-standing, well-defined capability that abstention-and-self-knowledge treats only as a binary refuse/answer decision."
  - id: reasoning-length-calibration
    label: "Spending the right amount of reasoning"
    scope_note: "Covers overthinking on easy problems, underthinking on hard ones, and whether chains of thought can be shortened without losing accuracy; excludes plain accuracy on hard problems."
