    label: "Answering the same whether content arrives as image or text"
    scope_note: "Covers gaps where a model reasons correctly over text but fails on the semantically equivalent image, and cases where an irrelevant image shifts a text answer; excludes pure perception or grounding errors already covered by visual-grounding."
