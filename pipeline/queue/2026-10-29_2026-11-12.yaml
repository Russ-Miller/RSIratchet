      explanation and reasoning, without new external input. A systematic account of the cognitive
      mechanisms behind these capabilities, and of their limits, remains underdeveloped. This paper
      proposes a Cognitive LbT Framework that maps four mechanisms (Reflective Reasoning, Synthetic
      Memory Formation, Internal Simulation, and Conceptual Self-Organization) onto computational
      processes in LLMs. Drawing on representative methods, including chain-of-thought prompting,
      self-consistency, self-reflection, Tree-of-Thoughts search, Self-Instruct, and self-taught
      reasoning, the analysis argues that selected methods can functionally approximate aspects of
      these mechanisms and can improve performance on some tasks without additional labeled
      examples, although this does not always constitute durable learning in model parameters. For
