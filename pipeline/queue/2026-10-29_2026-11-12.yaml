    abstract: Conventional federated learning relies on the shared model backbone to aggregate client
      updates, limiting collaboration among institutions that deploy large language models (LLMs)
      from different families and at different scales. We propose Federated Verifier Pool (FEDVP), a
      new federated learning paradigm that enables heterogeneous clients to collaborate through
      shared verification rather than parameter aggregation. Each client trains a verifier using
      local data and responses generated by its chosen LLM backbone. The server pools these
      independently trained verifiers and combines their judgments to select answers without merging
      model parameters. This allows both LLM backbones and verifiers to differ in architecture and
      size, while keeping the LLM backbones frozen and deriving collaborative gains from improved
      answer selection. We evaluate FEDVP across five public medical question-answering datasets
      treated as federated clients, using Qwen and LLaMA backbones ranging from 3B to 14B
      parameters. FEDVP consistently improves performance across all five clients and outperforms
