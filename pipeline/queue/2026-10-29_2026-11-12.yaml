    abstract: "Large Language Models (LLMs) have achieved remarkable progress on complex reasoning
      tasks, yet the mechanisms by which they acquire reasoning capabilities and the efficiency of
      their reasoning remain poorly understood. In this paper, we investigate the path-finding
      problem over directed graphs, a symbolic abstraction of multi-step reasoning. We first
      characterize the architectural requirements for this task, proving that one-layer transformers
      require $Ω(N^2)$ size on dense graphs to implement the key DFS child-selection primitive.
      While a two-layer transformer implements full DFS with $O(N\\log(N))$ size. Thus, a second
      layer is necessary and sufficient for near-linear DFS reasoning. We then extend this
      expressivity analysis to deeper models: for every $k\\geq3$, a $k$-layer transformer
      implements a bounded-reachability DFS policy with look-ahead horizon $1+2^{k-3}$, establishing
      an exponential increase in reachability horizon with depth. Finally, going beyond
      expressivity, given appropriately curated training data, we show that two-layer transformers
