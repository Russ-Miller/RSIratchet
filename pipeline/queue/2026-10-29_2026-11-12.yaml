    abstract: Recent work has identified a set of emergent symbolic mechanisms that support abstract
      reasoning in large language models, but it remains unclear what factors drive the emergence of
      these mechanisms. To address this question, we trained neural networks from scratch on
      abstract sequence tasks, varying both architectural and data distributional factors, and
      investigated the effects of these factors on the emergence of symbolic mechanisms. Using
      representational, attentional, and causal mediation analyses, we first confirmed that
      transformer-based language models trained from scratch on our task developed symbolic
      mechanisms. We then found that, across multiple axes of data diversity, greater diversity
      produced stronger symbolic signatures. Surprisingly, the same signatures emerged in modified
      transformer architectures and even multilayer perceptrons, indicating that architectural
      inductive biases are not necessary for the development of symbolic mechanisms. We also
      observed consistent patterns in an entity-attribute binding task. Together, these findings
      identify data diversity, not architecture, as the primary driver of emergent symbolic
      computation in neural networks.
