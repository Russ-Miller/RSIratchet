    abstract: Explainable AI (XAI) has expanded into a broad and impactful research area, but the
      fundamental question of how best to evaluate explanation techniques has proven frustratingly
      elusive. Methodologies typically revolve around either proxy metrics which tell us little
      about the utility of an explanation, or human evaluation which---while generally considered
      the gold standard---is expensive, difficult to scale, and challenging to reproduce. In this
      paper, we investigate if Multimodal Large Language Models (MLLMs) can act as surrogate human
      participants to automate the evaluation of XAI. To do this, we first propose a
      ``purpose-grounded'' evaluation framework with metrics applicable to both MLLMs and human
      users alike. Then, we offer some conceptual insights as to why and when we can trust these
      models to automate this process. Lastly, we conduct extensive empirical testing across five
      purpose-grounded areas such as model improvement and fourteen popular MLLMs. Results indicate
