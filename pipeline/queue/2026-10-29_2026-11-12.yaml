    abstract: "Continual pre-training (CPT) adapts large language models (LLMs) to specialized domains,
      yet its standard next-token prediction (NTP) objective treats every corpus token as a fixed
      target, regardless of its utility to the current model. In a controlled study on the same
      1B-token mathematical corpus, we observe sharply different outcomes across base models: NTP
      improves Llama-3.2-3B's performance on mathematical benchmarks but substantially degrades
      Qwen3-1.7B-Base's performance, indicating that, under a fixed training recipe, the same
      training sequences can have model-dependent effects. To address this problem, we introduce
      On-Policy Mid-Training Distillation (OPMD), which reformulates mid-training from offline text
      imitation into active, query-driven knowledge acquisition. At selected anchor positions, OPMD
      samples trajectories from the evolving student policy and applies dense token-level reverse-KL
      rewards from a frozen teacher, training the model on states it actually visits rather than
      only on ground-truth prefixes. This on-policy objective reduces the training-generation
      mismatch of teacher-forced NTP. On MATH-500 and Minerva, OPMD improves the Qwen student over
      its base performance and outperforms the evaluated NTP baseline, which degrades on both
      benchmarks. OPMD integrates into CPT pipelines without added inference-time overhead and
      offers a model-aware alternative to passive domain adaptation."
