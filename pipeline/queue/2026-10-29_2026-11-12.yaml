    abstract: "Formal verification using proof assistants provides strong correctness guarantees for
      software, but constructing proofs remains labor-intensive and requires significant expertise.
      Recent approaches based on large language models (LLMs) have shown promise in automating proof
      synthesis. However, these approaches typically constrain the model to a rigid
      tactic-generation loop, in which the surrounding system controls premise retrieval,
      proof-state management, and backtracking. We introduce ProofCoder, an agentic proof-synthesis
      system for Rocq that approaches theorem proving from a coding-agent perspective. Rather than
      generating tactics within a fixed loop, ProofCoder reasons continuously throughout proof
      search and uses proof-assistant feedback to decide when to gather additional information,
      inspect proof states, revise previously generated proof fragments, or backtrack to an earlier
      point in the proof. This allows it to iteratively construct, repair, and refine proofs, at
      either tactic-level or whole-proof granularity. We evaluate ProofCoder on 280 challenging
