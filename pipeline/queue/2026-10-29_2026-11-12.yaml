    abstract: "Taxonomies are structured knowledge representations that support semantic search,
      recommendation, product catalog organization, and retrieval-augmented generation. Their
      automated construction from a fixed set of candidate entities requires more than plausible
      text generation: the resulting hierarchy must be complete, structurally valid, and
      semantically coherent. Large Language Models (LLMs) are promising for this task, but iterative
      free-form generation remains vulnerable to omitted or hallucinated entities, invalid
      hierarchical relations, and inconsistent organizational principles. We introduce TIGA
      (Taxonomy Induction with Tool-Grounded Agents), a knowledge-engineering architecture that
      formulates taxonomy induction as an iterative decision process over an explicit state and
      constrained action space. TIGA combines executable taxonomy-editing tools, an memory that
      records tool calls, rationales, and outcomes, and a runtime-adaptive organizational policy
