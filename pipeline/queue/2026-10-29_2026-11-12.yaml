    abstract: "Correctness is a prerequisite for training large language models (LLMs) at scale, yet it
      is hard to ensure: a fault can sit in any part of a run, and how it shows differs across
      frameworks and the libraries they depend on. Some failures are loud and some are silent, and
      both take time to detect and trace. A single fault can waste a long run: the run crashes late,
      or the model scores lower only at the final evaluation. We present Plumbline, a correctness
      validation system for LLM training, used in production at Amazon. Plumbline checks each part
      of the training lifecycle, from the data a run trains on to the model it serves, down to the
      new layers each model brings and up to whole runs. Its diagnosis reuses these checks to trace
      failures to their root causes. Both rest on a systematic correctness methodology designed to
      carry across models and frameworks. Plumbline supports two agentic use cases: Day-0
      onboarding, which validates the training of a newly released model before teams rely on it,
      and root-cause tracing of training failures. Across 3 frameworks and 5 models, it found 61
      problems, 32 of them silent. Of these, 42 are fixed or reported upstream, 8 of them first
      raised by us. We further group the 61 into seven failure patterns that show where training
      breaks, and report how problems recur across frameworks and models."
