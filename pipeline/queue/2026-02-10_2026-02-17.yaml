    abstract: Large language models can answer causal questions correctly for the wrong reasons. Current
      RL methods reward \emph{what} a model concludes but ignore \emph{why}, reinforcing
      correlational shortcuts -- a failure we call \emph{Reward Entrenchment}. We introduce
      \emph{Epistemic Regret Minimization} (\erm), a framework that critiques the causal
      \emph{structure} of a model's reasoning trace rather than its answer. Applying established
      causal principles, \erm flags unexamined confounders, correlation--intervention conflation,
      and unchecked back-door paths from exposed reasoning traces. The framework admits
      \emph{label-free} operation -- without the true causal graph or correct answer -- and we
      separately distinguish favorable benchmark-derived critique, error-direction cues, and fully
      label-free judge-generated critique in the experiments. Within a single episode, \erm detects
      and repairs causal reasoning errors; across episodes, it accumulates interventional evidence
