      geo-localization, yet they often struggle in real-world scenarios where visual cues are
      sparse, long-tailed, and highly ambiguous. Previous approaches, bound by internal knowledge,
      often fail to provide verifiable results, yielding confident but ungrounded predictions when
      faced with confounded evidence. To address these challenges, we propose SpotAgent, a framework
      that formalizes geo-localization into an agentic reasoning process that leverages expert-level
      reasoning to synergize visual interpretation with tool-assisted verification. SpotAgent
      actively explores and verifies visual cues by leveraging external tools (e.g., web search,
