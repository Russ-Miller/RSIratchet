    abstract: "Explaining observed phenomena through symbolic, interpretable formulas is a fundamental
      goal of science. Recently, large language models (LLMs) have emerged as promising tools for
      symbolic equation discovery, owing to their broad domain knowledge and strong reasoning
      capabilities. However, most existing LLM-based systems try to guess equations directly from
      data, without modeling the multi-step reasoning process that scientists often follow: first
      inferring physical properties such as symmetries, then using these as priors to restrict the
      space of candidate equations. We introduce KeplerAgent, an agentic framework that explicitly
      follows this scientific reasoning process. The agent coordinates physics-based tools to
      extract intermediate structure and uses these results to configure symbolic regression engines
      such as PySINDy and PySR, including their function libraries and structural constraints.
