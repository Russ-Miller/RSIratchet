    abstract: Large language models (LLMs) exhibit strong general-purpose reasoning capabilities, yet
      they frequently hallucinate when used as world models (WMs), where strict compliance with
      deterministic transition rules--particularly in corner cases--is essential. In contrast,
      Symbolic WMs provide logical consistency but lack semantic expressivity. To bridge this gap,
      we propose Neuro-Symbolic Synergy (NeSyS), a framework that integrates the probabilistic
      semantic priors of LLMs with executable symbolic rules to achieve both expressivity and
      robustness. NeSyS alternates training between the two models using trajectories inadequately
      explained by the other. Unlike rule-based prompting, the symbolic WM contributes
      candidate-level scores through log-linear reranking, without requiring the LLM to interpret
      rule text. Rule-guided sampling prioritizes transitions that are weakly covered by symbolic
      rules, using 35--60% of the training pairs while outperforming full-data supervised
      fine-tuning in five of six settings. Experiments on ScienceWorld, WebShop, and PlanCraft
      demonstrate consistent gains in WM prediction accuracy and data efficiency; one-step lookahead
      on open-ended WebShop also improves agent reward. Our models, rules, and code are available at
      https://github.com/tianyi-lab/NeSyS.
