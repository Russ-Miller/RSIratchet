    abstract: Chain-of-Thought (CoT) has significantly enhanced the reasoning capabilities of Large
      Language Models (LLMs), especially when combined with reinforcement learning (RL) based
      post-training methods. While longer reasoning traces can improve answer quality and unlock
      abilities such as self-correction, they also incur high inference costs and often introduce
      redundant steps, known as overthinking. Recent research seeks to develop efficient reasoning
      strategies that balance reasoning length and accuracy, either through length-aware reward
      design or prompt-based calibration. However, these heuristic-based approaches may suffer from
      severe accuracy drop and be very sensitive to hyperparameters. To address these problems, we
      introduce CRT (Constraint-Rectified Training), a principled post-training framework based on
      reference-guarded constrained optimization, yielding a more stable and interpretable
      formulation for efficient reasoning. CRT alternates between minimizing reasoning length and
      rectifying accuracy only when performance falls below the reference, enabling stable and
      effective pruning of redundant reasoning. We further extend CRT with a two-stage training
      scheme that first discovers the shortest reliable reasoning patterns and then refines accuracy
      under a learnt length budget, preventing the re-emergence of verbose CoT. Our comprehensive
      evaluation shows that this framework consistently reduces token usage while maintaining answer
      quality at a robust and reliable level. Fu
