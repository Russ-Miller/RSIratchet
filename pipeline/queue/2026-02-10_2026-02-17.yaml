      generalization and unstable generation behaviors such as repetition and incoherent outputs. In
      this work, we propose Sparse Complementary Fusion with reverse KL (SCF-RKL), a novel model
      merging framework that explicitly controls functional interference through sparse,
      distribution-aware updates. Instead of assuming linear additivity in parameter space, SCF-RKL
      measures the functional divergence between models using reverse Kullback-Leibler divergence
