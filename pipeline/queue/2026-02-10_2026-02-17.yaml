      systematic literature review and quantitative analysis, we establish taxonomies that
      categorize PI attacks by payload generation strategies (heuristic vs. optimization) and
      defenses by intervention stages (text, model, and execution levels). Our analysis reveals a
      key limitation shared by many existing defenses and benchmarks: they largely overlook
      context-dependent tasks, in which agents are authorized to rely on runtime environmental
