      through Reinforcement Learning. We propose a Spatially-Aware Dynamic Filtering strategy to
      enhance the efficiency of the RL stage by prioritizing learnable samples based on spatial
      difficulty. Extensive experiments on standard benchmarks demonstrate that SpotAgent achieves
      state-of-the-art performance, effectively mitigating hallucinations while delivering precise
      and verifiable geo-localization.
