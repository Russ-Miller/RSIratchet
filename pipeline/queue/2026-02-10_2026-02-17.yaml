      (updating the memory bank) must be tightly coordinated. Existing methods predominately
      optimize memory management while treating memory extraction as a static process, resulting in
      poor generalization, where agents accumulate instance-specific noise rather than robust
      memories. To address this, we propose Unified Memory Extraction and Management (UMEM), a
      self-evolving agent framework that jointly optimizes a Large Language Model to simultaneous
      extract and manage memories. To mitigate overfitting to specific instances, we introduce
      Semantic Neighborhood Modeling and optimize the model with a neighborhood-level marginal
      utility reward via GRPO. This approach ensures memory generalizability by evaluating memory
      utility across clusters of semantically related queries. Extensive experiments across five
      benchmarks demonstrate that UMEM significantly outperforms highly competitive baselines,
      achieving up to a 10.67% improvement in multi-turn interactive tasks. Futhermore, UMEM
      maintains a monotonic growth curve during continuous evolution. Codes and models will be
      publicly released.
