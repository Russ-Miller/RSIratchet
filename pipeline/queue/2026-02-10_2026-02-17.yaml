    abstract: "Chain-of-Thought (CoT) has been shown to significantly improve the reasoning accuracy of
      large language models (LLMs) on complex tasks. However, due to the autoregressive,
      step-by-step generation paradigm, existing CoT methods suffer from two fundamental
      limitations. First, the reasoning process is highly sensitive to early decisions: once an
      initial error is introduced, it tends to propagate and amplify through subsequent steps, while
      the lack of a global coordination and revision mechanism makes such errors difficult to
      correct, ultimately leading to distorted reasoning chains. Second, current CoT approaches lack
      structured analysis techniques for filtering redundant reasoning and extracting key reasoning
      features, resulting in unstable reasoning processes and limited interpretability. To address
      these issues, we propose GHS-TDA. GHS-TDA first constructs a semantically enriched global
      hypothesis graph to aggregate, align, and coordinate multiple candidate reasoning paths,
      thereby providing alternative global correction routes when local reasoning fails. It then
