    abstract: In vision-language models (VLMs), misalignment between textual descriptions and visual
      coordinates often induces hallucinations. This issue becomes particularly severe in dense
      prediction tasks such as spatial-temporal video grounding (STVG). Prior approaches typically
      focus on enhancing visual-textual alignment or attaching auxiliary decoders. However, these
      strategies inevitably introduce additional trainable modules, leading to significant
      annotation costs and computational overhead. In this work, we propose a novel visual prompting
      paradigm that avoids the difficult problem of aligning coordinates across modalities.
      Specifically, we reformulate per-frame coordinate prediction as a compact instance-level
      identification problem by assigning each object a unique, temporally consistent ID. These IDs
      are embedded into the video as visual prompts, providing explicit and interpretable inputs to
      the VLMs. Furthermore, we introduce STVG-R1, the first reinforcement learning framework for
      STVG, which employs a task-driven reward to jointly optimize temporal accuracy, spatial
