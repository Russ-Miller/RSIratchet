    abstract: Large language models (LLMs) exhibit a wide range of capabilities, including mathematical
      reasoning, code generation, and linguistic behaviors. We show that Transformer architectures
      contain small subsets of attention heads that are necessary for certain capabilities. Zeroing
      out as few as five task-specific heads can degrade performance by up to $60\%$ on standard
      benchmarks measuring the capability of interest, while largely preserving performance on
      unrelated tasks. We introduce a compressed sensing-based method that exploits the sparsity of
      these heads to identify them via strategic knockouts and a small number of model evaluations.
      We validate these findings across Llama and Qwen models ranging from 1B to 14B parameters and
      a diverse set of capabilities including mathematical abilities and code generation, revealing
      a modular organization in which specialized capabilities are dependent on sparse, functionally
      distinct components. Overall, our results suggest that capability localization is a general
      organizational principle of Transformer language models, with implications for
      interpretability, model editing, and AI safety. Code is released at
