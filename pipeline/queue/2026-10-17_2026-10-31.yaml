    abstract: "Despite recent advancements in ASR, identifying effective architectures, fine-tuning
      approaches, and data adaptation strategies for low-resource languages remains challenging. We
      present a systematic comparison across five low-resource African languages and Swahili as a
      mid-resource contrast, fine-tuning three models from distinct architectures:
      Phi-4-multimodal-instruct, Whisper-large-v3-turbo, and MMS-1B-all. We analyze data
      sufficiency, monolingual versus multilingual adaptation, domain fine-tuning, and
      language-adapter transfer. Phi-4 achieves the best overall accuracy, MMS shows comparable CER,
      while Whisper exhibits high CER, consistent with known hallucinations and repetition loops.
      Performance saturates at different data scales, offering practical data-efficiency targets,
      while typological complexity consistently shapes error rates. Domain fine-tuning benefits
      Phi-4 and Whisper but degrades MMS, revealing limitations of adapter-based adaptation. Proxy
      language adapters outperform training MMS adapters from scratch."
