    abstract: "Multimodal large language models can recognize visual content yet struggle to reason
      reliably over it across multiple steps. In counting, a model may see all objects but lose
      track of which ones it has counted. We argue that such failures, commonly attributed to
      perception, reveal a reference gap: the failure to bind language to the relevant visual
      entities, regions, or locations. Motivated by the theory of visual routines, we test whether
      external references such as numbering can narrow this gap. We introduce ReGap-Bench, a paired
      benchmark of five visual reasoning tasks in which the scene, question, and answer are fixed
      and only the reference varies. Results show that task-matched references improve accuracy by
      up to 25\\%, while mismatched references provide little benefit or even hurt performance.
