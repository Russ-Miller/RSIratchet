    abstract: "Analog layout remains largely manual and hard to automate. Generator frameworks such as
      gLayout express layouts as programs, producing layouts from parameterized, design-rule-aware
      generators; however, writing such generators still takes expert effort. Large language models
      (LLMs) could now write generator code, and frontier models can even draw layout geometry from
      design intent. This raises a practical question: if a model can draw the layout itself, what
      does a generator framework still contribute, and is applying these models to a generator
      framework better than having them draw a layout from scratch? Through controlled experiments
      on gLayout in SKY130, we find that the main obstacle to drawing a layout directly is its time
      and token cost, and that the main advantage of a model building on a generator framework is
      reusability. Its verified primitives keep each model edit small enough to check, and its
      parameters allow a single edit to be evaluated across an entire family of layouts.
      Accordingly, a model is most effective when it develops the layout from the generator source
      of the family that the design intent belongs to, and tests each edit on the family members
      most likely to fail, so that one verified change improves every layout the generator produces.
