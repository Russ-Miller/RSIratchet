    abstract: Large language models (LLMs) draw on parametric knowledge and retrieval-augmented
      generation (RAG) to solve knowledge-intensive tasks. Yet problem solving in unfamiliar domains
      calls for tightly coupled knowledge acquisition and reasoning, beyond factual retrieval and
      aggregation or learning solely from a preassembled context. We study self-learning --
      autonomously retrieving, studying, and applying knowledge from long-form reference materials
      on the fly. To investigate this capability, we formulate a textbook-based mathematical
      problem-solving task. LLMs must navigate textbook exposition, learn and apply relevant
      principles, and construct proofs for exercises, with reference solutions withheld. We
      introduce a BookNavigator interface to support this human-inspired study process and
      incentivize self-learning through reinforcement learning (RL) with fine-grained rewards.
      Experiments show that our method improves performance across in-domain and out-of-domain
      textbooks and subjects, raising Intern-S2-Preview-35B's overall proof accuracy from 51.5% to
