      signal becomes available. Our analysis reveals complementary limitations: visual-side [CLS]
      attention produces scattered, background-biased selections under aggressive compression, while
      stronger query-conditioned signals become available after substantial computation within the
      large language model (LLM). This raises a natural question: can structurally coherent,
