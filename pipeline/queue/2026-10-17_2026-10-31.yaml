    abstract: Anomaly searches in large astronomical image datasets aim to identify rare objects for
      follow-up investigation. Yet the objects that are most statistically unusual are not
      necessarily those of greatest scientific relevance. We investigate whether pretrained
      vision-language models can directly assess scientific interest from natural-language
      instructions, enabling galaxy images to be ranked without labeled examples. We evaluate models
      on a 20,000-image Hubble Space Telescope sample that includes 167 reference anomalies
      previously identified through machine learning and expert inspection. By scoring images for
      scientific interest, Gemini 3.1 Flash-Lite places 98.2% of the reference anomalies within the
      highest-ranked ~2,000 images, at a present-day inference cost of approximately $5.05 per
      10,000 images. We recover known gravitational lenses, jellyfish-galaxy candidates, and
      galaxies with visible jets, and release 102 high-scoring candidates for further investigation.
      These results show that an off-the-shelf vision-language model, without any training on the
