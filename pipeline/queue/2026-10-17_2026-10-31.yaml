      quantitative evidence. This paper proposes TGTV, an interpretable fault detection and
      traceability framework that integrates spatiotemporal graph learning with a large language
      model. A temporal convolutional network and a graph attention network with weighted fused
      adjacency extract multiscale temporal patterns and spatial dependencies among sensors. A
      hybrid temporal Transformer and variational autoencoder then evaluates window-level anomalies
