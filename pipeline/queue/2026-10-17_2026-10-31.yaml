    abstract: "Large language models (LLMs) can improve task performance during learning, yet these
      gains do not necessarily reflect learners' ability to thereafter apply the knowledge and
      skills independently. We present AI Cosmos, an agentic infrastructure for situated learning
      that organizes learning around two complementary principles: scenario-based participation and
      cumulative assets of practice. AI Cosmos organizes learners and role-specialized agents within
      learning scenarios that integrate task-relevant knowledge and, when needed, executable
      workbenches. An asset-memory loop preserves the processes and outcomes of practice as reusable
      assets with explicit provenance and dependencies. We evaluate scenario-based interaction
      through two preregistered randomized controlled studies examining the acquisition of legal
      reasoning and programming competence, holding the same underlying LLM across conditions. AI
      Cosmos achieves greater learning gains than a conventional LLM in legal reasoning and higher
      mastery of unseen programming problems than an LLM-as-Teacher baseline."
