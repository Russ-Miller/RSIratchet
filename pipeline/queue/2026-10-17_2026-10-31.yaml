      cross-primitive inconsistency by 58.57% and improves accuracy by +2.97%., demonstrating its
      effectiveness in both in-domain and out-of-domain settings. Our findings establish
      cross-primitive consistency as a key dimension for evaluating Jev and provide a practical
      approach to improving the reliability of its decisions. Code and benchmark is available at
