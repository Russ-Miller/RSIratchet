    abstract: The growing autonomy of AI agents has enabled self-improvement, where agents iteratively
      refine their programs through execution feedback and performance evaluation. As these agents
      increasingly operate in physical environments and rely on wireless connectivity, communication
      conditions become an integral part of their improvement process. However, existing approaches
      largely assume ideal communication, overlooking how wireless conditions shape both the
      feedback that guides program modifications and the evaluation outcomes that determine which
      modifications survive. This challenge is further complicated by the coupling between agent
