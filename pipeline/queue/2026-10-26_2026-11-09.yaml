    abstract: Large language model (LLM) agents increasingly operate in open-world environments where
      safety risks cannot be fully predefined. However, most existing guardrail mechanisms remain
      static, relying on fixed rules, prompts, or classifiers that generalize poorly to emerging
      risks. Here we present EVOLVE, a tool-level self-evolving defense framework that formulates
      agent security as a process of cumulative security evolution. Inspired by how human societies
      transform experiences into transferable protective knowledge, EVOLVE externalizes security
      knowledge into executable guardrail tools that are continuously inherited, independently
      audited, and iteratively refined through lifelong interaction. Across multiple benchmarks,
      backbone models, and embodied environments, EVOLVE consistently outperforms existing defenses
      across diverse risk scenarios with +22\% average F1 score. We further validate the framework
      in real-world robotic and autonomous agent systems. Our results suggest that scalable agent
      safety may require continuously evolving defense systems rather than static guardrails.
