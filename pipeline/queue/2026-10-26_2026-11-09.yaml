    abstract: An agent that explores, whether it generates conjectures or research ideas, must decide
      which of them are worth keeping. This judgment of interestingness is usually delegated to a
      hand-picked proxy or to a language model, neither of which is known to correspond to what
      humans actually value. I study it for mathematical theorems, by observing which results
      mathematicians single out in formal libraries and in papers. I model each way of singling out
