      dependencies, and split its weights into a shared and a subjective part. In formalized
      mathematics, ex-ante features predict these selections as well as a large language-model
      judge, and the two complement each other. Interestingness is also largely shared. One set of
      weights, carried mostly by structural features such as the length of the statement and of the
      proof and the subfields the proof draws on, accounts for most of the signal and transfers in
      part across formal libraries. What remains subjective depends on practices and individual
      authors more than on subfields. The judge's advantage lies in its knowledge of the canon, and
      neither the judge nor the features rely on memory of the papers. The approach, which infers
      what a community finds interesting from what it singles out, can be applied to other sciences.
