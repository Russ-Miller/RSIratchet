      it, by fixing the variables, a library of candidate terms, or a law to be modified. We
      introduce Unsatz, a benchmark in which an LLM agent must construct the ansatz itself. Each
      task is a simulated system, generated from a private seed as a program in a small modeling
      language: ordinary, delay, or partial differential equations, discrete maps, static and causal
      models, or stochastic processes, possibly with hidden states, distorted sensors, and
      uninformative measurement channels. The agent buys experiments within a budget, writes
      candidate programs in the same language, obtains their coefficients from the benchmark's
