    abstract: Skills, as reusable external knowledge, have demonstrated substantial potential to enhance
      the ability of Large Language Models (LLMs) to solve complex tasks. However, existing
      skill-augmented generation methods typically rely on separate models for skill retrieval and
      skill utilization, resulting in disconnected optimization of these two processes. To address
      this gap, we propose Skill-Uni, a unified reinforcement learning framework that jointly
      optimizes skill retrieval and utilization. Specifically, we adopt a generative skill retrieval
      paradigm that enables a single model to both learn how to retrieve relevant skills and
      leverage them for task solving. To effectively train this unified framework, we introduce a
      two-stage training strategy consisting of warm-up instruction tuning and GRPO, allowing the
      model to progressively improve its skill retrieval and utilization capabilities. Extensive
      experiments on five skill-related benchmarks demonstrate the effectiveness of Skill-Uni,
      yielding average performance gains of 66.59% and 34.82% over the base Qwen3-4B and LLaMA3.1-8B
      models, respectively. Besides, Skill-Uni is compatible with various skill retrieval engines,
      demonstrating its flexibility and generalizability. Additional in-depth analyses also provide
      insights into the effectiveness of Skill-Uni.
