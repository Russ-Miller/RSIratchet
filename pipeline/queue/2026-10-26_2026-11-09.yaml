    abstract: Modern large language models (LLMs) often exhibit overconfident errors, assigning high
      confidence to incorrect predictions and thereby undermining reliability in real-world use.
      Existing calibration methods typically rely on post-hoc adjustment or retraining, operating at
      the output level without addressing the underlying causes of miscalibration. We propose CoCHI,
      (Class-oriented Causal Head Intervention), a framework that improves calibration by
      identifying and intervening on internal components responsible for distinct confidence
      behaviours. By analysing predictions through correctness-confidence patterns, CoCHI enables
      targeted intervention on model internals, reducing overconfident errors while preserving
      correct predictions. Our approach provides a mechanistic perspective on calibration, linking
      reliability to identifiable structures within the model rather than treating it as an
      output-level issue. Experiments across multiple LLMs show consistent improvements in
      calibration metrics, including Expected Calibration Error, Negative Log-Likelihood, and Brier
      Score, while maintaining accuracy on five multiple-choice question answering benchmarks. These
      results suggest that effective calibration requires not only adjusting outputs, but also
      addressing the underlying causal mechanisms within the model.
