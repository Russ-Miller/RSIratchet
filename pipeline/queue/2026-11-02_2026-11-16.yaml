    abstract: "Knowledge editing has emerged as a promising approach for efficiently updating embedded
      knowledge in large language models (LLMs). It first computes an ideal target hidden state that
      steers the LLM toward the new output, and then edits the model parameters so that the original
      hidden state is mapped to this target. While most existing methods focus on the second stage
      of parameter editing in preserving other knowledge, we find that the upstream construction of
      the target hidden state also plays an important role in allocating the model's limited
      capacity space. We first establish a theoretical connection between interference in the
      parameter space and interference between target hidden states, showing that the two are
      positively correlated. Building on this insight, we propose a simple yet effective $\\ell_1$
      regularization method that prunes away unnecessary ``tentacles'' of each knowledge vector,
      retaining only the essential components. With fewer extraneous tentacles, each edit affects
      less other knowledge, enabling better coexistence. Extensive experiments across multiple LLMs
      and benchmark datasets verify the effectiveness of our method. Code:
      https://github.com/wintersdragon-c/STO."
