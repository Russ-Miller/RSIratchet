    abstract: Heterogeneous large language models (LLMs) exhibit complementary strengths, motivating
      routing and multi-model inference methods that seek to identify reliable predictions for each
      input. However, exploiting this complementarity remains challenging even when a correct
      prediction is available within the ensemble. We investigate this challenge across
      heterogeneous LLM ensembles and find that a simple single-round aggregation rule is highly
      competitive with learned routing methods, yet substantial oracle headroom remains. Further
      analysis shows that the evaluated single-round response signals provide limited discriminative
      power for identifying reliable predictions. In contrast, controlled re-presentations of the
      same question elicit complementary evidence about prediction reliability. Motivated by these
      findings, we introduce RE-PRESENT, a training-free framework that selectively re-presents
      disputed questions and directly aggregates candidate-level evidence across alternative views.
      Across seven multiple-choice benchmarks and two heterogeneous model ensembles, RE-PRESENT
      improves over strong single-round aggregation while offering a favorable accuracy--cost
      trade-off compared with self-consistency and multi-model debate.
