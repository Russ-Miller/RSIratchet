    abstract: Multimodal large language models (MLLMs) integrate information across modalities, but
      become unreliable when those modalities disagree. Under conflicting inputs, MLLMs may favor
      modalities that are not the most reliable for the task, thus motivating inference-time control
      of modality arbitration. We identify a small set of attention heads, termed arbitration heads,
      that causally influence whether predictions follow visual or textual evidence. Building on
      this, we introduce a lightweight, training-free intervention that biases these heads toward a
      designated trusted modality at inference time. The identified heads are stable across
      calibration set sizes and generalize across settings, and steering them enables effective
      bidirectional control of modality reliance across diverse benchmarks. Our findings identify an
      effective control mechanism to align MLLM predictions with task-specified modality priorities.
      The code is available at https://github.com/zhaoyingpan/modality-arbitration.
