    abstract: Evaluating language-guided mobile agents has recently shifted from rule-based to
      model-based approaches to achieve scalable and automated assessments. However, existing
      holistic evaluation paradigms process entire trajectories at once, leading to substantial
      context overload. Moreover, they primarily focus on task completion while overlooking
      operational safety. To address these limitations, we introduce CRATE, a novel two-stage
      VLM-as-judge framework for automated mobile agent evaluation that is compatible with both
      open- and closed-source models. Leveraging a step-level consequence reasoning mechanism, CRATE
      independently extracts task-relevant visual clues and infers action-conditioned state changes
      at each step. The resulting step-level textual evidence is then synthesized through
      trajectory-level aggregation to deliver an evidence-grounded evaluation of task completion.
      Building upon this evaluation scheme, we further extend CRATE to CRATE-S for operational
      safety assessment. Extensive experiments validate the effectiveness and robustness of both
      CRATE and CRATE-S. Powered by Qwen2.5-VL-72B-Instruct, CRATE achieves an F1-score of 0.833 on
      AndroidWorld (outperforming SPA-Bench by 20%), while CRATE-S reaches an F1-score of 0.697 on
      MobileRisk, demonstrating strong alignment with benchmark ground truths. Code is available at
      https://anonymous.4open.science/r/CRATE-D580.
