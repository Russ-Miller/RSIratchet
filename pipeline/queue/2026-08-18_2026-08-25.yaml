    abstract: Group-relative policy optimization has emerged as a key paradigm for training agentic
      large language models (LLMs) on multi-turn interactive tasks. However, most existing variants
      fail to distinguish advantages among successful trajectories even when these trajectories
      differ substantially in their interaction efficiency. For instance, circuitous successes are
      often assigned the identical outcome reward, causing advantage collapse and severe performance
      bottlenecks. To this end, we propose Group Planning-aware Policy Optimization (PlanPO), a
      simple yet effective RL method for learning generalizable planning abilities beyond
      task-specific high-quality behavior patterns. Specifically, PlanPO introduces coarse-to-fine
      advantage signals, which capture the relative differences in trajectory-level lengths and
      turn-level response lengths conditioned on successful trajectories sampled for the same task.
      Within the group-relative optimization structure, this enables agents to actively learn
      generalizable and deliberate behaviors spanning interaction planning and textual generation
      from high-quality rollouts, without degenerating into vanilla length minimization.
      Experimentally, PlanPO improves over GRPO by 27.2\% on average across the challenging
      multi-turn benchmarks ALFWorld, WebShop, and SciWorld, outperforming recent powerful baselines
      while incurring negligible additional training cost.
