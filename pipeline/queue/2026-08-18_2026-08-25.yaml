    abstract: "Financial document parsing requires accuracy, structural consistency, and verifiability
      that current benchmarks often fail to reflect. We present FinixDoc, an end-to-end agentic
      parsing system for real-world financial documents, with FinixDoc-VL, a 4B-scale
      vision-language model built on Qwen3-VL-4B, as its core parser. To characterize the gap
      between benchmark and deployment performance, we introduce a Document Parsing Capability
      Matrix organized along two practical axes: visual quality and document scale. Guided by this
      matrix, FinixDoc-VL is trained with a domain-adapted recipe combining homoglyph-aware
      contrastive learning and multi-stage reinforcement learning with composite domain-specific
      rewards. To better leverage our accumulated advantage in low-quality financial-document data
      and support large-scale, high-quality data production, we further build a human-in-the-loop
      Data Factory pipeline with confidence-aware expert review. For evaluation, we construct
      FinixDocBench, a financial-domain evaluation suite covering digital-native, camera-captured,
      ultra-large-page, and internal-workflow scenarios, with a compliance-reviewed subset released
      alongside this technical report. On its main subsets, FinixDoc-VL achieves the highest overall
