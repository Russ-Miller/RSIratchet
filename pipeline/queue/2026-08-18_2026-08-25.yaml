      goal states as reference anchors. During RL training, these reference anchors provide
      accurate, scalable reward signals that substantially enhance efficiency. Extensive evaluations
      demonstrate that our framework achieves over 90% accuracy on offline trajectory verification
      and performs closest to rule-based methods. Furthermore, agents trained using our reward
      framework exhibit strong performance on both AndroidWorld and our constructed benchmark,
      establishing a scalable approach for GUI agent training."
