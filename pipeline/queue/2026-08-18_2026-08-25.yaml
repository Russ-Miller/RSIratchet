      predictive distribution, conflating epistemic ignorance with genuine ambiguity. We introduce
      Credal Large Language Models (CLLMs): an ensemble of LoRA adapters induces a credal set whose
      lower and upper probabilities expose the spread of plausible predictive distributions rather
      than collapsing to a single softmax output. From this representation we derive two
      complementary commitment scores. Credal Token Commitment (CTC) is a token-space score that
      combines lower-bound support, credal width, and intersection entropy, computed without
      additional generation. Semantic Commitment Consistency (SCC) extends commitment to semantic
      space using sampled completions, with SCC-Gap measuring the mismatch between token-level and
