      detect these patterns. We introduce aiXamine, a unified black-box platform that evaluates LLM
      trustworthiness across safety, security, and privacy as interdependent properties. aiXamine
      orchestrates 46 tests across nine services through an automated red-teaming pipeline,
      producing hierarchical risk profiles, from prompt-level diagnostics to cross-service trade-off
