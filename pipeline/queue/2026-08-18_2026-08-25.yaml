      struggle to generate diverse data, while existing evaluators either suffer from limited
      scalability or provide inaccurate and unreliable reward signals. To overcome these challenges,
      we introduce GSAR (Goal-State-Anchor Reward), a RL reward framework that supports scalable
      task generation and delivers reliable reward signals for stable and efficient policy
      optimization. Our approach features self-evolving data synthesis, which produces multiple
      environments through task execution and generates diverse tasks and goal states. Complementing
