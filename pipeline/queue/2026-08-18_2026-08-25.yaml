      patent drafting: generating a complete and legally coherent patent application directly from
      early-stage invention materials. Prior work predominantly assumes later-stage, highly
      structured, or already legalistic inputs. However, real patenting workflows begin with
      informal, de-legalized disclosures authored by inventors. To bridge the gap, we introduce
      Dis2Pat, a disclosure-to-patent dataset that reflects realistic patenting workflows by
      requiring the generation of complete patent applications directly from inventor-style,
      de-legalized disclosures. Given the inherent difficulty of long-form, legally constrained
      patent drafting and the strong privacy requirements, we further propose a strong baseline
      named Patent-MAF. It is a multi-agent framework for locally deployable patent drafting.
      Benchmark results reveal that current LLMs exhibit limitations in patent drafting, while
      Patent-MAF provides a strong baseline that consistently outperforms evaluated open-source
      models and remains competitive with large closed-source models."
