    abstract: "Large language models (LLMs) are increasingly deployed as tool-augmented agents, where
      responses can depend on tool calls and external observations rather than model parameters
      alone. This creates an evaluation mismatch for LLM unlearning: previous unlearning methods may
      suppress direct parametric recall, but an agent can still recover the same forget target
      through tools such as web search, retrieval, or database lookup. We identify this failure mode
      as tool-mediated recovery and study agentic tool unlearning, which aims to reduce both
      parametric recall and tool-mediated recovery while preserving normal tool use for retained
      knowledge. To address this challenge, we propose Agentic Tool Unlearning (ATU), a two-stage
      framework. The first stage applies parametric knowledge unlearning to suppress direct recall,
