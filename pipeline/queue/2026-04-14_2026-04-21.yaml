    title: Generalization Boundaries of Fine-Tuned Small Language Models for Graph Structural Inference
    date: 2026-04-20
    arxiv_id: "2604.18092"
    authors:
      - Michał Podstawski
    venue: arXiv (Cornell University)
    topic: Advanced Graph Neural Networks
    cited_by_count: 0
    abstract: Small language models fine-tuned for graph property estimation have demonstrated strong
      in-distribution performance, yet their generalization capabilities beyond training conditions
      remain poorly understood. In this work, we systematically investigate the boundaries of
      structural inference in fine-tuned small language models along two generalization axes - graph
      size and graph family distribution - and assess domain-learning capability on real-world graph
      benchmarks. Using a controlled experimental setup with three instruction-tuned models in the
      3-4B parameter class and two graph serialization formats, we evaluate performance on graphs
      substantially larger than the training range and across held-out random graph families. Our
      results show that fine-tuned models maintain strong ordinal consistency across structurally
      distinct graph families and continue to rank graphs by structural properties on inputs
      substantially larger than those seen during training, with distinct architecture-specific
      degradation profiles. These findings delineate where fine-tuned small language models
      generalize reliably, providing empirical grounding for their use in graph-based reasoning
      tasks.
