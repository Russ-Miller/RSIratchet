      feedback explanation, but only 0--50\\% on error fixing -- a category dominated by
      long-context prompts that expose memory limits in local deployments. A central contribution of
      this paper is a systematic analysis of \\textit{model type effects} on performance: we compare
      reasoning vs.\\ instruction-tuned architectures, GGUF (llama.cpp) vs.\\ MLX (mlx\\_lm)
      backends, and quantization levels (Q3 / Q4\\_K\\_M / MLX-3bit / MLX-4bit / MLX-6bit) across
