      multi-turn refinement significantly outperforms state-of-the-art single-shot models in both
      click precision and overall task success rate. Our results suggest that iterative visual
      reasoning is a critical component for the next generation of reliable software engineering
      agents. Code: https://github.com/microsoft/precision-cua-bench/tree/main."
