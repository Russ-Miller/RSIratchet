    abstract: "Extending the effective context length of large language models (LLMs) remains a central
      challenge for real-world applications. While recent post-training methods have made progress
      in long-context scaling, they either rely on high-quality supervision data or sparse
      sequence-level rewards, leading to unstable and inefficient optimization. We propose OPSDL, an
      On-Policy Self-Distillation method for enhancing the Long-context capabilities of LLMs. Unlike
      other recent self-distillation methods that inject privileged information and rely on the
      model's in-context learning ability to act as a teacher, OPSDL leverages the model's own
      inherently strong short-context capability as a self-teacher to supervise its own generation
      in long-context scenarios. The model first generates responses conditioned on the full
      long-context, then the self-teacher provides per-token supervision signals via point-wise
      reverse KL divergence under the relevant extracted short-context. This dense token-level
