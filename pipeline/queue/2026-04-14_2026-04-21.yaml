      Language Models (LALMs) incorporate explicit Chain-of-Thought (CoT) reasoning, and their
      capabilities are often inconsistent and insufficient for complex tasks. To bridge this gap, we
      introduce Audio-Cogito, a fully open-source solution for deep audio reasoning. We develop
      Cogito-pipe for high-quality audio reasoning data curation, producing 545k reasoning samples.
      Based on this dataset, we adopt a self-distillation strategy for model fine-tuning.
