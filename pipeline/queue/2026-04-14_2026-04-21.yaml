    abstract: As reinforcement learning continues to scale the training of large language model-based
      agents, reliably verifying agent behaviors in complex environments has become increasingly
      challenging. Existing approaches rely on rule-based verifiers or LLM-as-a-Judge models, which
      struggle to generalize beyond narrow domains. Agent-as-a-Judge addresses this limitation by
      actively interacting with environments and tools to acquire verifiable evidence, yet its
      capabilities remain underexplored. We introduce a benchmark AJ-Bench to systematically
      evaluate Agent-as-a-Judge across three domains-search, data systems, and graphical user
      interfaces-comprising 155 tasks and 516 annotated trajectories. The benchmark comprehensively
      assesses judge agents' abilities in information acquisition, state verification, and process
      verification. Experiments demonstrate consistent performance gains over LLM-as-a-Judge
      baselines, while also revealing substantial open challenges in agent-based verification. Our
      data and code are available at https://aj-bench.github.io/.
