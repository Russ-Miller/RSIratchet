      face key limitations: process supervision often suffers from unstable value estimation,
      whereas outcome supervision struggles with credit assignment due to sparse, trajectory-level
      rewards. To bridge this gap, we propose Contribution-Weighted GRPO (CW-GRPO), a framework that
      integrates process supervision into group relative policy optimization. Instead of directly
      optimizing process rewards, CW-GRPO employs an LLM judge to assess the retrieval utility and
      reasoning correctness at each search round, producing per-round contribution scores. These
