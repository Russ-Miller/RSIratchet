    abstract: "Recent advances in large language models have highlighted their potential to automate
      computational research, particularly reproducing experimental results. However, existing
      approaches still use fixed sequential agent pipelines with weak global coordination, which
      limits their robustness and overall performance. In this work, we propose Hierarchical
      Research Agent System (HiRAS), a hierarchical multi-agent framework for end-to-end experiment
      reproduction that employs supervisory manager agents to coordinate specialised agents across
      fine-grained stages. We also identify limitations in the reference-free evaluation of the
      Paper2Code benchmark and introduce Paper2Code-Extra (P2C-Ex), a refined protocol that
      incorporates repository-level information and better aligns with the original reference-based
      metric. We conduct extensive evaluation, validating the effectiveness and robustness of our
      proposed methods, and observing improvements, including >10\\% relative performance gain
      beyond the previous state-of-the-art using open-source backbone models and significantly
      reduced hallucination in evaluation. Our work is available on GitHub:
      https://github.com/KOU-199024/HiRAS."
