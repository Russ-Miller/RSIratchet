    abstract: "Large Language Models (LLMs) excel at code generation but remain heavily reliant on
      large-scale annotated solutions and verification-based supervision, which constrains
      scalability and hinders sustained self-improvement. Recent solver--verifier frameworks exploit
      program execution as an automatic supervision signal, but their effectiveness degrades as
      solvers become moderately strong: verifier-generated tests increasingly confirm semantic
      correctness rather than exposing the remaining failure modes. We propose \\textbf{ACE}, a
      self-evolving code generation framework based on a solver--adversary architecture that
      prioritizes active failure discovery through execution-centric supervision. A single LLM
      alternates between generating candidate programs and producing adversarial unit test inputs
      optimized to induce execution-level failures, such as runtime errors, exceptions, or
      non-termination. Supervision is derived solely from execution outcomes: robust programs are
