      grounding and treat values as independent, unstructured signals, reducing consistency and
      interpretability. We propose OG-MAR, an Ontology-Guided Multi-Agent Reasoning framework.
      OG-MAR summarizes respondent-specific values from the World Values Survey (WVS) and constructs
      a global cultural ontology by eliciting relations over a fixed taxonomy via competency
