      consistency across sessions, a failure mode we term soul erosion. We present BMAM
      (Brain-inspired Multi-Agent Memory), a general-purpose memory architecture that models agent
      memory as a set of functionally specialized subsystems rather than a single unstructured
      store. Inspired by cognitive memory systems, BMAM decomposes memory into episodic, semantic,
