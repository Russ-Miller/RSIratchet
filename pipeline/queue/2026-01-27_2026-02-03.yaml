      failing to correct deeper reasoning flaws. We propose SELF-THOUGHT, a framework that
      introduces an intermediate step of task abstraction before solution refinement. Given an input
      and an initial response, the model first distills the task into a structured template that
      captures key variables, constraints, and problem structure. This abstraction then guides
      solution instantiation, grounding subsequent responses in a clearer understanding of the task
