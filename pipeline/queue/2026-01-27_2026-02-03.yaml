      long-horizon tasks, fragility leading to cascading errors, and a lack of modular
      extensibility. To address these challenges, we introduce Yunque DeepResearch, a hierarchical,
      modular, and robust framework. The architecture is characterized by three key components: (1)
      a centralized Multi-Agent Orchestration System that routes subtasks to an Atomic Capability
