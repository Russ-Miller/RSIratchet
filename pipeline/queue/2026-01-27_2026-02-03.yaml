    abstract: Emergent Misalignment refers to a failure mode in which fine-tuning large language models
      (LLMs) on narrowly scoped data induces broadly misaligned behavior. Prior explanations mainly
      attribute this phenomenon to the generalization of erroneous or unsafe content. In this work,
      we show that this view is incomplete. Across multiple domains and model families, we find that
      fine-tuning models on data exhibiting specific character-level dispositions induces
      substantially stronger and more transferable misalignment than incorrect-advice fine-tuning,
      while largely preserving general capabilities. This indicates that emergent misalignment
      arises from stable shifts in model behavior rather than from capability degradation or
      corrupted knowledge. We further show that such behavioral dispositions can be conditionally
      activated by both training-time triggers and inference-time persona-aligned prompts, revealing
      shared structure across emergent misalignment, backdoor activation, and jailbreak
      susceptibility. Overall, our results identify character formation as a central and
      underexplored alignment risk, suggesting that robust alignment must address behavioral
      dispositions rather than isolated errors or prompt-level defenses.
