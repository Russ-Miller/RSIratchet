      these methods typically rely on absolute numerical rewards, introducing intrinsic limitations.
      In verifiable tasks, identical group evaluations often result in sparse supervision, while in
      open-ended scenarios, the score range instability of reward models undermines advantage
      estimation based on group means. To address these limitations, we propose Reinforcement
      Learning with Relative Rewards (RLRR), a framework that shifts reward shaping from absolute
      scoring to relative ranking. Complementing this framework, we introduce the Ranking Reward
