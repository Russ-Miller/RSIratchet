    abstract: Large Language Models (LLMs) exhibit substantial parameter redundancy, particularly in
      Feed-Forward Networks (FFNs). Existing pruning methods suffer from two primary limitations.
      First, reliance on dataset-specific calibration introduces significant data dependency and
      computational overhead. Second, being predominantly static, they fail to account for the
      evolving subset of knowledge neurons in LLMs during autoregressive generation as the context
      evolves. To address this, we introduce DART, i.e., Dynamic Attention-Guided Runtime Tracing),
      a lightweight, training-free method that performs on-the-fly context-based pruning. DART
      monitors shifts in attention score distributions to infer context changes, dynamically
