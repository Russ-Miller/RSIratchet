      this paper, we conduct a systematic study of LLMs in multiple realistic poker tasks,
      evaluating both gameplay outcomes and reasoning traces. Our analysis reveals LLMs fail to
      compete against traditional algorithms and identifies three recurring flaws: reliance on
      heuristics, factual misunderstandings, and a "knowing-doing" gap where actions diverge from
