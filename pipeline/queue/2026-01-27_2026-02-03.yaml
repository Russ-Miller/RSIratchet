    abstract: "Can Large language models (LLMs) learn to reason without any weight update and only
      through in-context learning (ICL)? ICL is strikingly sample-efficient, often learning from
      only a handful of demonstrations, but complex reasoning tasks typically demand many training
      examples to learn from. However, naively scaling ICL by adding more demonstrations breaks down
      at this scale: attention costs grow quadratically, performance saturates or degrades with
      longer contexts, and the approach remains a shallow form of learning. Due to these
      limitations, practitioners predominantly rely on in-weight learning (IWL) to induce reasoning.
      In this work, we show that by using Prefix Tuning, LLMs can learn to reason without
      overloading the context window and without any weight updates. We introduce
      $\\textbf{ReasonCACHE}$, an instantiation of this mechanism that distills demonstrations into
      a fixed key-value cache. Empirically, across challenging reasoning benchmarks, including
      GPQA-Diamond, ReasonCACHE outperforms standard ICL and matches or surpasses IWL approaches.
      Further, it achieves this all while being more efficient across three key axes: data,
      inference cost, and trainable parameters. We also theoretically prove that ReasonCACHE can be
      strictly more expressive than low-rank weight update since the latter ties expressivity to
      input rank, whereas ReasonCACHE bypasses this constraint by directly injecting key-values into
      the attention mechanism. Together, our findings identify ReasonCACHE "
