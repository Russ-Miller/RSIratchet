      regression models lack geological prior knowledge to constrain ambiguous inverse mappings. We
      propose GeoLog-Agent, a knowledge-conditioned generative agent using pre-trained large
      language models (LLMs) as a source of geological priors. A universal Geo-Harness translates
      LLM stratigraphic reasoning into formation-anchored petrophysical trajectories, feature-wise
      linear modulation, and conditional adversarial constraints. On the Norwegian North Sea
