      multi-head latent attention (MLA) to FP4. NVFP4-MLA co-designs the quantization algorithm with
      the attention kernel and the cache system. Selective residual compensation preserves model
      accuracy by adding NVFP4 residuals only to the quantization-sensitive channels.
      Two-dimensional quantization blocks make the shared latent cache compatible with the different
      reduction directions of the two attention batched matrix multiplications (BMMs), removing
      requantization between them. On DeepSeek-R1 and Kimi-K3, NVFP4-MLA matches BF16 MLA average
      accuracy across nine benchmarks while compressing the MLA KV cache by 3.20x and 3.05x relative
      to BF16 MLA. On NVIDIA Rubin GPUs, NVFP4-MLA speeds up the attention kernel over FP8 MLA by up
