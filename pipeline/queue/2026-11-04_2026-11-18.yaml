    abstract: "Tamarin-based formal verification of security protocols requires expert-authored multiset
      rewriting rules and temporal-logic lemmas. Translating a natural-language protocol description
      into a complete formal model with an LLM is hard because syntactic, reachability, and
      property-level errors compound across the multi-step modeling process, and a single agent that
      both authors and self-evaluates cannot reliably localize them. We present MASTA, a multi-agent
      system that addresses these difficulties through three innovations. First, an
      operational--evaluative role decomposition assigns rule modeling to an Architect, property
      modeling to an Auditor, and pure dispatch to a dedicated Arbiter that holds no authoring
      duties. Second, the Arbiter implements a Tamarin-anchored scheduler that dispatches the next
      agent based on the latest verifier verdict and routes problem-tagged fixes through a
