    abstract: While Large Language Models (LLMs) excel at generating fluent text, they often struggle
      with multi-step logical reasoning with inferential connections among statements. We introduce
      KUDEX (Knowledge-Upward-Downward Reasoning Extension), a novel zero-shot, decompositional
      framework for analyzing and verifying logical relationships in natural language. Unlike
      traditional approaches that rely on surface-level entailment checks, KUDEX leverages LLMs to
      decompose reasoning into atomic primitives and constructs transparent reasoning graphs that
      serve both as execution traces and audit logs. Our framework includes a general prompt
      adaptation pipeline that adapts to diverse reasoning tasks without additional fine-tuning or
      domain-specific pipelines. Through comprehensive experiments on benchmarks across four
      domains, we demonstrate that KUDEX provides superior performance compared to existing methods,
      offering a more granular and robust framework for assessing logical relationships between
      statements.
