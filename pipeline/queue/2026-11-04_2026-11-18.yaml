    abstract: Organizations increasingly use large language models (LLMs) for decisions about people,
      such as hiring, investment and employee evaluation, and rely on them over long periods of
      time. Fairness audits of such systems, however, are conducted only once. We examine how the
      biases of LLMs change over time. In a venture screening setting, models from five providers
      decided whether and how much to invest in startups whose founders differed only in gender,
      origin and university. We repeated this audit three times over 13 months (248,400 API calls).
      Study 1 shows that the same model, called under the same identifier one year later, displayed
      a significantly different bias pattern. Study 2 shows that the successors of retired models
      carried the same bias as their predecessors, but in a significantly different size and form.
      Study 3 shows that the bias does not depend on the industry of the startup. A document
      analysis further shows that providers change and retire models at their discretion, with
      notice periods of zero to six months. Drawing on these findings, we develop a theory of
      evidence anchoring. We theorize that bias resides in the model class and persists, whereas
      audit evidence is anchored to a single model and expires when the provider decides. We derive
      policy advice for organizations and regulators, namely audits of model classes instead of
      single models, a version record for every model response, and re-audits triggered by model
      changes.
