    abstract: "GPTQ is the de facto standard solver for layer-wise post-training quantization (PTQ) of
      large language models, yet the solver itself has received less attention than weight
      preprocessing and cross-layer objectives. We target a bottleneck of GPTQ: its greedy procedure
      optimizes continuous group scales separately from the assignment of discrete integers.
      Evaluating each integer candidate with its closed-form optimal scale has been used for
      per-channel quantization; JointQ extends it to group-wise quantization, where a row's scales
      are coupled through the Hessian, and applies it to refine the GPTQ solution. Each local-search
      move changes one integer and recomputes its group's optimal scale in closed form, accounting
      for the other groups through the full Hessian; all scales are periodically re-solved jointly.
      The search starts from a row-wise selection among scale-refitted candidates including the GPTQ
      solution, so unregularized JointQ never has a larger layer-wise calibration error than GPTQ.
