    abstract: Process Reward Models (PRMs) are widely used for step-level evaluation of multi-step
      reasoning in large language models, but existing methods are often limited by weak historical
      dependency modeling and insufficient global awareness. They typically fail to leverage prior
      step evaluations for coherent judgment and lack visibility into subsequent reasoning, leading
      to suboptimal assessment of intermediate steps. To address this issue, we propose the Global
      Perspective Process Reward Model (GPRM), which jointly models the problem, previous reasoning
      steps and their evaluations, the current step, and future steps to enable history-aware and
      globally informed process evaluation. We further introduce a structured evaluation framework
      along four dimensions---look back, look ahead, self-check, and goal alignment---to assess
      prior consistency, future plausibility, step validity, and task alignment. Based on this
      framework, we construct datasets for supervised fine-tuning (SFT) and reinforcement learning
      (GRPO). Experiments show that, despite using less training data and smaller model sizes, GPRM
      outperforms strong baseline models by 7.8 and 5.4 points on PRMBench and ProcessBench,
      respectively. GPRM also generalizes well across tasks, surpassing the GPT-4.1 baseline on
      Agent Error Bench, improving strong baselines by around 4 points under test-time scaling
      (TTS), and achieving competitive performance on PPE.
