      complex multi-step reasoning, an error at any step may propagate along an incorrect path, and
      the resulting solution may omit necessary branches. Existing natural-language reflection
      methods often struggle to locate critical errors precisely, while outcome verification
      typically checks only whether the available candidate answers satisfy the problem conditions
      and can therefore overlook necessary branches. To address these limitations, we propose
      Agent-Guided Process Verification (AGPV) for mathematical self-correction. AGPV decomposes the
      current solution into an ordered sequence of key claims, verifies them individually while
      invoking a shared mathematical toolbox when needed, and stops upon detecting the first error.
