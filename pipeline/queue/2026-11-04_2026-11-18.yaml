      ParGLU's relative performance. Ablation studies further show that combining SwiGLU and
      ReLU$^2$ improves performance over either architecture alone. Token-frequency analysis reveals
      larger improvements on low-frequency tokens. These findings show that fully gated FFNs are not
      always the most effective use of an MoE expert's parameter budget. Partial gating can improve
      language modeling in MoE Transformers.
