    abstract: "Fine-tuning on hard negatives is a popular way to improve the compositional reasoning of
      vision-language models, but when accuracy goes up it is rarely clear what the model actually
      learned. We ask this question for multimodal large language models. We use CompHall, 2,860
      forced-choice questions (spatial, attribute, counting and part-whole) with two graded hard
      negatives each, three model families (LLaVA-1.5, LLaVA-NeXT and Idefics2), and controls that
      such studies often lack: gray-image evaluation, three seeds, option-order tests, control arms
      trained on different question types, and independent benchmarks. We find four things. First,
      CompHall is not a pure test of vision: part-whole questions can be answered from the text
      alone (66-95% without the image), and per-image accuracy is unrelated to an
      object-hallucination probe (r = -0.05), so we see no evidence that compositional failures
      drive hallucination. Second, the original fine-tuning method scored mostly image-placeholder
      tokens and hurt both LLaVA models. With a corrected loss, fine-tuning raises accuracy on the
