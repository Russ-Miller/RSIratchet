    abstract: "Reinforcement learning via environmental interaction is a cornerstone post-training
      paradigm for evolving large language models into autonomous agents capable of multi-turn tool
      use and exploration. Because the environment defines what the policy observes and how actions
      are verified, its structure directly bounds the capabilities an agent can acquire. Yet
      existing structured and retrieval environments rely on upstream pre-filtering---extracting a
      compact subgraph around the gold answer or retrieving fixed passages before the policy acts.
      We show that such pre-filtering introduces a fundamental measurement confound: because
      per-question subgraphs enclose ground-truth paths, they compress the candidate space by orders
      of magnitude and leak answer locations via local topology, allowing a question-blind degree
      heuristic to surface gold answers far above chance. To restore path selection, candidate
      pruning, and optimal stopping as genuine policy decisions, we propose RISE (Interactive
      Structured Environment), which transitions structured reinforcement learning from static
      subgraphs to full-scale interactive databases along two coupled axes. First, Decision-Space
      Scaling exposes the unpruned knowledge graph via a five-stage graph-agnostic typed intent
      adapter under a bounded call budget and a multiplicative grounding reward gate. Second,
      Learning-Frontier Scaling overcomes within-group variance collapse under group-normalized
      objectives by uniting model-independent structural tier"
