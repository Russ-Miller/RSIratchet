    abstract: Recent studies leverage large language models (LLMs) to construct executable programs
      through environment interaction, feedback analysis, and code revision. However, prior work has
      mainly treated LLMs as optimizers, overlooking their ability to transfer knowledge across
      system levels. We propose Program Distillation (PD), a framework that formalizes the transfer
      of abilities from System 2 to System 0. During learning, the LLM provides task knowledge and
      draft strategies; at deployment, a student program executes the resulting policy. We show that
      this approach can improve performance while reducing inference time. We introduce PDBench, a
      benchmark comprising 27 discrete- and continuous-control tasks with fixed initial policies,
      and PDMetaHarness, a model-harness-independent meta-system for monitoring and guiding the
      learning process. The strongest model achieves a normalized mean score of 0.728, surpassing
      PPO (0.656) and Jev-like decision models (0.239), while running exclusively on CPUs and
      reducing inference costs. Our analysis shows that performance is largely driven by the first
      breakthrough during learning, and structural modifications have a slightly lower success rate
      than parameter modifications but typically yield larger gains. We further introduce style
      distillation, which enables interpretable stylistic control over the learning process.
      Overall, we present an analytical framework for PD and demonstrate its practical viability.
