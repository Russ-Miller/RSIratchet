    abstract: Reinforcement learning with verifiable rewards (RLVR) has become an important approach to
      improving the reasoning capabilities of large language models. In tasks such as code
      generation and instruction following, multiple verifiers evaluate whether a response satisfies
      different requirements. Their outcomes provide detailed feedback about partial success, yet
      this feedback is commonly aggregated into a scalar reward for policy optimization. Rewarding
      only complete success discards distinctions among partial solutions, while counts and weighted
      sums impose comparisons between responses that satisfy different subsets of requirements. We
      introduce Partial-Order Likelihood Policy Optimization (POLPO), which learns from the
      comparisons established by verification without first constructing an aggregate reward. Pareto
      dominance identifies responses that satisfy additional requirements without losing any already
      satisfied, while leaving responses with conflicting outcomes incomparable. POLPO extends the
      listwise likelihood underlying Direct Preference Optimization by maximizing the total
      probability of all complete rankings consistent with these partial orders. This objective
      provides supervision from verified improvements even before complete solutions are available,
      without requiring a prescribed ordering of incomparable responses. Experiments on code
      generation and instruction following demonstrate improved learning efficiency and higher rates
      of complete requirement satisfaction
