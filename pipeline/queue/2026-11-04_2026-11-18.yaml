    abstract: "Recent advances in large audio-language models (LALMs) have broadened audio understanding
      across speech, sound, and music, with tool-based agents further supporting these tasks by
      invoking predefined audio tools. However, a persistent gap remains between perceiving acoustic
      content and using it as evidence for reasoning: recognizing what is audible does not ensure
      that a model can identify which cues resolve an uncertain decision. To bridge this gap, we
      propose Think2Listen, an evidence-centric learning framework for agentic audio understanding.
      Guided by evidence before commitment, Think2Listen couples iterative reasoning with a targeted
      LALM interaction to actively seek acoustic cues that distinguish competing hypotheses and
      revise candidate judgments based on the observations returned. It learns what to ask, how to
      use evidence, and when to stop, using observation-induced changes in candidate-state to inform
      training credit. Extensive evaluations on two benchmarks spanning seven audio categories
      demonstrate that Think2Listen achieves (I) enhanced multi-step audio reasoning, with gains in
      overall accuracy of 5.08%--17.67% over competing audio agents; and (II) improved audio
      understanding and reasoning across speech, sound, and music, boosting overall accuracy by
      2.29%--13.10% over the corresponding baselines. The source code is available at
