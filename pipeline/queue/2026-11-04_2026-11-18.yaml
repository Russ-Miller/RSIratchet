    abstract: "Can AI systems be moral agents? That is, can they undertake actions that can be correctly
      assessed as morally right or wrong? There is no settled normative criterion of moral agency
      that applies neatly outside paradigm human cases. Because of the difficulties with a normative
      account, we instead propose a research program to explore descriptive moral agency. Most
      basically, we ask, what are the capabilities we humans possess that underlie our moral agency?
      To do so, we draw on historical scholarship in philosophy and moral psychology to isolate
      candidate capabilities. Then we suggest refining candidate capabilities so that they are
      testable in the context of AI systems. Finally, we offer specific empirical recommendations to
      test AI systems, especially large language models (LLMs), for those refined capabilities. Our
      approach offers several benefits. Firstly, it may demonstrate whether the behaviors of AI
      systems are aligned, or in a broad sense desirable. Secondly, the debate may inform policy
      questions (e.g., what models should be deployed in which contexts?). Thirdly, our approach may
      complement engineering and design efforts: when capabilities can be precisely characterized,
      they can inform the development of models. Fourthly, applying our moral reasoning concepts in
      the new context of AI systems should improve our understanding of those concepts."
