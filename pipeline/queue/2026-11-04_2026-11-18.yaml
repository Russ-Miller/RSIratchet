    abstract: Traditional Chinese medicine (TCM) formulas feature complex chemical compositions, and
      their HPLC quality control method development is time-consuming and experience-dependent.
      Large language models (LLMs) provide a promising strategy for intelligently assisting
      analytical method construction. Taking the Eczema External Wash Formula as the research
      object, this work constructed a human-machine collaborative workflow involving intelligent
      recommendation, experimental validation and iterative optimization for HPLC method
      development. Among five prompt strategies tested, expert-role setting with structured
      reasoning performed best. After inputting formula information, the LLM proposed five
      chromatographic schemes. Through experimental screening and optimization, the final HPLC
      method used a SunShell C18 column, mobile phase of 0.1% aqueous formic acid-acetonitrile for
      gradient elution, with seven markers separated within 55 min. Twenty components were
      characterized by LC-MS. The validated method exhibited satisfactory linearity, precision,
      repeatability, stability and recovery. This indicates LLMs can reduce the workload of
      chromatographic condition exploration and boost the development efficiency of TCM formula
      analytical methods, supporting intelligent TCM quality control.
