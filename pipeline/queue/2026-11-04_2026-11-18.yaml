      (averaged over both option orders). Control arms show that the gain needs spatial training
      questions, and for LLaVA-NeXT about two-thirds of it appears even on relation words that were
      only wrong options in training. Third, the gain is not general: on CompHall itself it is
      significant only for LLaVA-NeXT (+6.9 points) a"
