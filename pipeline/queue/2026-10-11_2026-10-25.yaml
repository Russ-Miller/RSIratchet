    venue: arXiv (Cornell University)
    topic: Scheduling and Optimization Algorithms
    cited_by_count: 0
    abstract: Dynamic scheduling requires dispatching online arrivals while anticipating future jobs, as
      poor decisions can compound downstream costs under nonlinear tardiness objectives. We show
      that a pretrained large language model (LLM) can serve as the exogenous component of a
      structured world model, forecasting uncertain future job arrivals. Specifically, we exploit an
      afterstate decomposition, which separates known deterministic shop transitions from uncertain
      exogenous job arrivals, enabling the LLM to forecast only the latter through a compact belief
      representation. Building on this, we develop Afterstate World-Model Planning (AWMP), which
      combines an evolved, belief-conditioned dispatching strategy with short scenario-based
      rollouts. A surprise-triggered refresh mechanism queries the LLM only when newly observed
      arrivals deviate sufficiently from previous forecast, and online residual self-calibration
      further conditions the LLM on its recent forecast errors to handle nonstationary arrivals.
      Across diverse arrival distributions, AWMP reduces weighted tardiness by 6-21% on dynamic
      job-shop and 22-46% on flexible job-shop benchmarks, relative to the best of eight classical
      priority-dispatching rules.
