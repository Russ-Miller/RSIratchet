    venue: arXiv (Cornell University)
    topic: Ethics and Social Impacts of AI
    cited_by_count: 0
    abstract: "The deployment of small and quantized language models in resource-constrained settings
      raises an important fairness question: when a compressed model produces fewer biased
      responses, does this reflect fairer behavior or greater abstention? We study this problem in
      Question Answering (QA) using the BBQ benchmark across multiple model sizes and quantization
      settings from Qwen3, Gemma-3, and SmolLM2. We also examine whether the observed trends remain
      stable across alternative prompt formulations and when the ``Unknown'' option is removed in a
      forced-choice setting. Our results show that larger models achieved higher QA accuracy, but
      bias showed no simple scaling trend and quantization effects varied across configurations.
      Notably, 20 of the 26 configurations with fewer biased responses also show increased
      over-abstention, indicating that lower observed bias can partly reflect greater abstention.
      These findings show that lower observed bias can partly reflect greater abstention, and that
      fairness evaluation should consider biased responses, abstention, prompt formulation, and
      answer-option design jointly."
