    abstract: Automatic heuristic design (AHD) has emerged as a promising paradigm for solving NP-hard
      combinatorial optimization problems (COPs). Recent works show that large language models
      (LLMs), when integrated into well-designed frameworks (i.e., LLM-AHD), can autonomously
      discover high-performing heuristics. However, existing LLM-AHD frameworks typically treat LLMs
      as passive generators within fixed workflows, where the model generates heuristics from
      manually designed, limited context. Such context may fail to capture state-dependent
      information (e.g., specific failure modes), leading to inefficient trial-and-error
      exploration. To overcome these limitations, we propose AHD Agent, a novel tool-integrated,
      multi-turn framework that empowers LLMs to proactively decide whether to generate heuristics
      or invoke tools to retrieve targeted evidence from the solving environment. To effectively
      train such a dynamic decision-making agent, we introduce an agentic reinforcement learning
