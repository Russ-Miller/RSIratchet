    abstract: "Language models draw on two knowledge sources: facts baked into weights (parametric
      memory, PM) and information in context (working memory, WM). We study two mechanistically
      distinct failure modes--conflict, when PM and WM disagree and interfere; and hallucination,
      when the queried fact was never learned. Both produce confident output regardless, making
      output-based monitoring blind by design. We show both failures share a unified geometric
      account. In the hidden-state space of autoregressive generation, learned facts form attractor
      basins. Conflict is basin competition: WM disrupts convergence to the correct basin without
      raising output entropy. Hallucination is basin absence: the hidden state drifts freely when no
      memorized basin exists. The frozen LM head, designed for next-token prediction, cannot
      distinguish these cases and fires confidently either way. We verify this account in a
      controlled synthetic task-entity identifiers mapped to unique codes with PM installed via LoRA
      adapters--where ground truth is exact and component roles can be causally isolated through
      targeted adapter placement. Geometric margin--the hidden state's distance to the nearest
      memorized basin--reads this geometry directly and separates correct recall from hallucination
