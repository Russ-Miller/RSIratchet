      four held-out tasks, demonstrate that our 4B-parameter agent matches or surpasses
      state-of-the-art baselines using much larger models, while requiring significantly fewer
      evaluations. Model and inference scaling analysis further reveals that AHD Agent offers an
      effective trajectory toward truly autonomous heuristic design.
