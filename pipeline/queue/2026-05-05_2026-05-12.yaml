    abstract: The integration of Vision-Language-Action (VLA) models with World Models has gained
      increasing attention. One representative approach treats learned World Models as generative
      simulators, enabling policy optimization entirely within "imagination." However, when deployed
      as simulators for specific environments such as the LIBERO benchmark, existing World Models
      often suffer from poor generalization and long-horizon error accumulation. During closed-loop
      rollouts, these models are highly sensitive to initial-state perturbations; minor changes in
      color, illumination, and other visual factors can trigger cascading hallucinations, leading to
      severe blurriness or overexposure. Moreover, long-horizon error accumulation further degrades
      the quality and fidelity of predicted future states. These issues limit the reliability of
      World Models as simulators. To mitigate these problems, we propose Sword, a robust World Model
