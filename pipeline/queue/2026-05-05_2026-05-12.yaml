      is already going wrong. We introduce TeleResilienceBench, a benchmark that quantifies this
      capability, which we term reasoning resilience, across seven telecom sub-domains drawn from
      the GSMA Open-Telco LLM suite. Instances are constructed by collecting failures from a weak
      generator model, truncating the flawed reasoning trace at its midpoint, and asking a target
      model to continue and correct it. We propose the Correct Flip Rate (CFR) as a direct measure
      of successful recovery and evaluate eight models spanning the Qwen3.5, Gemma4, and Nemotron-3
      families. Our results show that even the strongest model achieves a macro-average CFR of only
