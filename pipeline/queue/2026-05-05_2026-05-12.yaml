      outperforms all Qwen3.5 variants including the 27b model and leads the auxiliary TeleMath
      numerical evaluation at 23.4% CR%, offering the best resilience-to-cost ratio in the set. A
      difficulty-stratified analysis further reveals that existing telecom benchmark difficulty
      labels reflect factual specificity rather than reasoning depth, suggesting that current
      evaluations measure knowledge coverage more than reasoning ability.
