    abstract: Large Language Models (LLMs) are increasingly applied to real-world forecasting tasks, yet
      evaluating their true predictive capability remains compromised by pre-training data
      contamination and look-ahead leakage in automated search. Existing benchmarks either rely on
      static contexts, restrict evaluations to narrow environments, or fail to audit auxiliary
      textual events for future information leakage. To establish a rigorous evaluation paradigm, we
      propose LEAF, the first living benchmark for event-augmented forecasting tasks, including
      trend, event, and time series forecasting. LEAF couples a recursive retrieval agent system
      with dual-agent cross-validation to gather comprehensive, relevant, and temporally aligned
      auxiliary context. A comprehensive audit across 500 tasks by 47 domain specialists
      demonstrates that our pipeline suppresses future information leakage from 8.6% to 1.6%. Across
      extensive evaluations of 16 frontier proprietary and open-weight models on our benchmark, we
      show that LLMs effectively extract signals from verified events to boost trend and event
      forecasting.
