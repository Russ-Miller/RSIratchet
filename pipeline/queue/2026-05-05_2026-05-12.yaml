    abstract: "Large reasoning models, such as OpenAI o1 and DeepSeek-R1, tend to become increasingly
      verbose as their reasoning capabilities improve. These inflated Chain-of-Thought (CoT)
      trajectories often exceed what the underlying problems require, wasting compute, latency, and
      context budgets. While introducing length-based efficiency rewards during reinforcement
      learning offers a natural remedy, existing methods struggle with two fundamental challenges:
      the optimal balance between correctness and efficiency is non-stationary throughout training,
      and intrinsic reasoning budgets vary drastically across problems. Relying on static reward
      weights and global length constraints inevitably forces a compromise between degraded accuracy
      and unrealized compression. To overcome these limitations, we propose LEAD (Length-Efficient
      Adaptive and Dynamic reasoning), a method that replaces static heuristics with online,
      self-adaptive mechanisms. LEAD dynamically calibrates the correctness-efficiency trade-off at
      each step using a Potential-Scaled Instability, directing optimization capacity to the most
      informative learning signal. Furthermore, it estimates an adaptive per-problem target length
