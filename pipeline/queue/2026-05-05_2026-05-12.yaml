    abstract: "AI agent research spans a wide spectrum: from RL agents that learn from scratch to
      foundation model agents that leverage pre-trained knowledge, yet no unified benchmark enables
      fair comparison across these approaches. We present Agentick, a benchmark for sequential
      decision-making agents designed to evaluate RL, LLM, VLM, hybrid, and human agents on common
      ground and to power research on the fundamental challenges of sequential decision-making.
      Agentick provides 37 procedurally generated tasks across six capability categories, four
      difficulty levels, and five observation modalities, all exposed through a single
      Gymnasium-compatible interface. The benchmark ships with a Coding API, oracle reference
      policies for all tasks, pre-built SFT datasets, a composable agent harness, and a live
