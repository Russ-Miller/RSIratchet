      model physical dynamics, reference frames, and the latent human intentions that drive spatial
      change. We introduce Teleo-Spatial Intelligence (TSI), a reasoning capability that links
      spatiotemporal change to goal-directed structure. To evaluate TSI, we present EscherVerse, a
      large-scale open-world resource built from 11,328 real-world videos, including an
      8,000-example benchmark and a 35,963-example instruction-tuning set. Across 27
