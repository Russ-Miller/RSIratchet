      foundation for future artificial intelligence applications. Despite recent progress, existing
      TKG reasoning models typically rely on large parameter sizes and intensive computation,
      leading to high hardware costs and energy consumption. These constraints hinder their
      deployment on resource-constrained, low-power, and distributed platforms that require
      real-time inference. Moreover, most existing model compression and distillation techniques are
      designed for static knowledge graphs and fail to adequately capture the temporal dependencies
      inherent in TKGs, often resulting in degraded reasoning performance. To address these
      challenges, we propose a distillation framework specifically tailored for temporal knowledge
      graph reasoning. Our approach leverages large language models as teacher models to guide the
      distillation process, enabling effective transfer of both structural and temporal reasoning
      capabilities to lightweight student models. By integrating large-scale public knowledge with
