    abstract: Self-reflection capabilities emerge in Large Language Models after RL post-training, with
      multi-turn RL achieving substantial gains over SFT counterparts. Yet the mechanism of how a
      unified optimization objective gives rise to functionally distinct capabilities of generating
      solutions and evaluating when to revise them remains opaque. To address this question, we
      introduce the Gradient Attribution Property to characterize how reward gradients distribute
      across policy components, formalized through the Two-Stage Decision-Sampling (DS) Hypothesis,
      which decomposes the policy into sampling ($π_{sample}$) for generation and decision ($π_{d}$)
      for verification. We prove that surrogate rewards exhibit Balanced Gradient Attribution, while
      SFT and KL penalties exhibit Unbalanced Gradient Attribution, with length-weighting creating
      asymmetric regularization that constrains $π_{sample}$ while leaving $π_{d}$ under-optimized,
      providing an theoretical explanation of why RL succeeds where SFT fails. We also empirically
      validate our theoretical predictions on arithmetic reasoning demonstrates that RL's superior
      generalization stems primarily from improved decision-making ($π_{d}$) rather than sampling
      capabilities, providing a first-principles mechanistic explanation for self-correction in
      thinking models.
