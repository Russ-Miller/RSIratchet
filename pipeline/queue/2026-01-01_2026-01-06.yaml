      hyper-relational temporal knowledge graphs (HTKGs), offer a straightforward structure to
      represent simple temporal relationships, they lack the expressive power to convey complex
      facts efficiently. One of the critical limitations of HTKGs is a lack of support for more than
      two primary entities in temporal facts, which commonly occur in real-world events. To address
      this limitation, in this work, we study a generalization of HTKGs, Hyper-Relational Temporal
