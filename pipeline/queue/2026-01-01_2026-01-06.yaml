      tasks with rubric-based evaluations across diverse, real-world websites and difficulty levels.
      We train agents with a simple reinforcement learning (RL) recipe, which trains on the agent's
      own interaction traces (rollouts), using task rewards as feedback to guide learning. To enable
      scaling RL, we speed up sampling of trajectories in WebGym by developing a high-throughput
      asynchronous rollout system, designed specifically for web agents. Our system achieves a 4-5x
      rollout speedup compared to naive implementations. Second, we scale the task set breadth,
      depth, and size, which results in continued performance improvement. Fine-tuning a strong base
      vision-language model, Qwen-3-VL-8B-Instruct, on WebGym results in an improvement in success
