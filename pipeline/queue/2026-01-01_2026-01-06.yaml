    abstract: Intuitive learning is crucial for developing deep conceptual understanding, especially in
      STEM education, where students often struggle with abstract and interconnected concepts.
      Automatic question generation has become an effective strategy for personalized and adaptive
      learning. However, its effectiveness is hindered by hallucinations in large language models
      (LLMs), which may generate factually incorrect, ambiguous, or pedagogically inconsistent
      questions. To address this issue, we propose a novel framework that combines
      causal-graph-guided Chain-of-Thought (CoT) reasoning with a multi-agent LLM architecture. This
      approach ensures the generation of accurate, meaningful, and curriculum-aligned questions.
      Causal graphs provide an explicit representation of domain knowledge, while CoT reasoning
      facilitates a structured, step-by-step traversal of related concepts. Dedicated LLM agents are
      assigned specific tasks such as graph pathfinding, reasoning, validation, and output, all
      working within domain constraints. A dual validation mechanism-at both the conceptual and
      output stages-greatly reduces hallucinations. Experimental results demonstrate up to a 70%
      improvement in quality compared to reference methods and yielded highly favorable outcomes in
      subjective evaluations.
