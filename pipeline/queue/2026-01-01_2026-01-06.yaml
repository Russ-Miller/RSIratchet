    abstract: "Direct Preference Optimization (DPO) has shown strong potential for mitigating
      hallucinations in Multimodal Large Language Models (MLLMs). However, existing multimodal DPO
      approaches often suffer from overfitting due to the difficulty imbalance in preference data.
      Our analysis shows that MLLMs tend to overemphasize easily distinguishable preference pairs,
      which hinders fine-grained hallucination suppression and degrades overall performance. To
      address this issue, we propose Difficulty-Aware Direct Preference Optimization (DA-DPO), a
      cost-effective framework designed to balance the learning process. DA-DPO consists of two main
      components: (1) Difficulty Estimation leverages pre-trained vision--language models with
      complementary generative and contrastive objectives, whose outputs are integrated via a
      distribution-aware voting strategy to produce robust difficulty scores without additional
      training; and (2) Difficulty-Aware Training reweights preference pairs based on their
      estimated difficulty, down-weighting easy samples while emphasizing harder ones to alleviate
      overfitting. This framework enables more effective preference optimization by prioritizing
      challenging examples, without requiring new data or extra fine-tuning stages. Extensive
