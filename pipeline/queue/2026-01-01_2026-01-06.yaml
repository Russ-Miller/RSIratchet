      feature attenuation hypothesis from computer vision to transformers and by benchmarking it
      against state-of-the-art baselines. Concretely, we adapt the COSTARR framework--originally
      designed for classification in computer vision--to two modest language models (BERT (base) and
      GPT-2) trained to label 176 arXiv subject areas. Alongside COSTARR, we evaluate Maximum
      Softmax Probability (MSP), MaxLogit, and the temperature-scaled free-energy score under the
      OOSA and AUOSCR metrics. Our results show (i) COSTARR extends to NLP without retraining but
