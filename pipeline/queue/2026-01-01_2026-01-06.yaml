      safety of LLMs in general usage, code generation, and agent-based applications, their
      vulnerabilities in automated algorithm design remain underexplored. To fill this gap, this
      study investigates this overlooked safety vulnerability, with a particular focus on
      intelligent optimization algorithm design, given its prevalent use in complex decision-making
      scenarios. We introduce MalOptBench, a benchmark consisting of 60 malicious optimization
