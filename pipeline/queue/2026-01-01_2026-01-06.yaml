    title: "Distortion Instead of Hallucination: The Effect of Reasoning Under Strict Constraints"
    date: 2026-01-04
    arxiv_id: "2601.01490"
    doi: https://doi.org/10.48550/arxiv.2601.01490
    authors:
      - Junichiro Niimi
    venue: arXiv (Cornell University)
    topic: Topic Modeling
    cited_by_count: 2
    abstract: "With the widespread adoption of large language models (LLMs), hallucinations, which are
      non-factual fabrications in model outputs, have become serious concerns. Reasoning
      capabilities have received attention as a self-verification process to improve output
      reliability. However, the effect of reasoning within a closed system where LLMs cannot rely on
      external tools or knowledge has yet to be clarified. We therefore conduct experiments under
      strict constraints (recommending peer-reviewed journal articles in computer science) to
      examine the effect of reasoning across multiple models (GPT-5.2 and Gemini 3 Flash). Our
      results reveal a problematic trade-off between constraint compliance and factual accuracy.
      Non-reasoning models exhibit high constraint violation rates (66-75%) but maintain factual
      accuracy, while reasoning models reduce violations (13-26%) but systematically distort known
      facts to satisfy constraints and increase complete fabrication. This trade-off pattern is
      consistent across both models despite different architectures, indicating a fundamental
      limitation of reasoning. Furthermore, reasoning does not uniformly improve output
      authenticity: effects diverge by model, reflecting different allocations of the
      compliance-truthfulness trade-off. These findings challenge the assumption that reasoning
      universally improves reliability: reasoning models trade honest constraint violations for
      detection-resistant distortions."
