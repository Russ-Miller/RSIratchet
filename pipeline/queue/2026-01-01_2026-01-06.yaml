    abstract: "Exception handling is a vital forward error-recovery mechanism in many programming
      languages, enabling developers to manage runtime anomalies through structured constructs
      (e.g., try-catch blocks). Improper or missing exception handling often leads to severe
      consequences, including system crashes and resource leaks. While large language models (LLMs)
      have demonstrated strong capabilities in code generation, they struggle with exception
      handling at the repository level, due to complex dependencies and contextual constraints. In
      this work, we propose CatchAll, a novel LLM-based approach for repository-aware exception
      handling. CatchAll equips LLMs with three complementary layers of exception-handling
      knowledge: (1) API-level exception knowledge, obtained from an empirically constructed
      API-exception mapping that characterizes the exception-throwing behaviors of APIs in
      real-world codebases; (2) repository-level execution context, which captures exception
      propagation by modeling contextual call traces around the target code; and (3)
      cross-repository handling knowledge, distilled from reusable exception-handling patterns mined
      from historical code across projects. The knowledge is encoded into structured prompts to
