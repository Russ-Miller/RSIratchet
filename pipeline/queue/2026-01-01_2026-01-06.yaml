    abstract: Molecular dynamics (MD) simulations are essential for understanding atomic-scale behaviors
      in materials science, yet writing LAMMPS scripts remains highly specialized and time-consuming
      tasks. Although LLMs show promise in code generation and domain-specific question answering,
      their performance in MD scenarios is limited by scarce domain data, the high deployment cost
      of state-of-the-art LLMs, and low code executability. Building upon our prior MDAgent, we
      present MDAgent2, the first end-to-end framework capable of performing both knowledge Q&A and
      code generation within the MD domain. We construct a domain-specific data-construction
      pipeline that yields three high-quality datasets spanning MD knowledge, question answering,
      and code generation. Based on these datasets, we adopt a three stage post-training
      strategy--continued pre-training (CPT), supervised fine-tuning (SFT), and reinforcement
      learning (RL)--to train two domain-adapted models, MD-Instruct and MD-Code. Furthermore, we
      introduce MD-GRPO, a closed-loop RL method that leverages simulation outcomes as reward
      signals and recycles low-reward trajectories for continual refinement. We further build
      MDAgent2-RUNTIME, a deployable multi-agent system that integrates code generation, execution,
      evaluation, and self-correction. Together with MD-EvalBench proposed in this work, the first
      benchmark for LAMMPS code generation and question answering, our models and system achieve
      performance surpassing several strong baselines.
