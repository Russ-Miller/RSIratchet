    abstract: "Efficient deployment of large language models (LLMs) on mobile devices requires balancing
      performance with compute and memory constraints. Post-training compression is an effective
      approach to managing this trade-off, while requiring much less computation than in-training
      counterparts. We propose DictLLM, a dictionary-based compression scheme in which weight
      matrices within grouped layers are decomposed into a shared dictionary and layer-specific
      sparse coefficients, directly obtained from a pre-trained model without further training.
      Specifically, we cast DictLLM as a four-step post-training optimization. First, we obtain
      shared dictionaries via singular value decomposition (SVD) of input-scaled weight matrices,
      amortizing rank across grouped layers; second, we sparsify the layer-specific coefficients to
      the target compression ratio using a dictionary-aware Hessian; and third, we refine the
      dictionaries given the resulting sparse coefficients. Finally, we aggressively quantize both
      components using factor-specific Hessian information: input covariance for the dictionaries
