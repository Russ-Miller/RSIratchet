    abstract: "Autoregressive approaches with large language models, such as long chain-of-thought
      reasoning, have become the default for new AI applications because they reach higher accuracy
      on a wide range of tasks. In production, however, they give inconsistent answers, require
      parsing of outputs, and add cost and latency. Decision models address this: given a question
      and a set of options supplied by the user, they return a probability distribution over the
      options without autoregressive decoding. We present Drex, a family of four open decision
      models with 8B (DLM), 9B (v1.5), 35B with 3B active (v2.0), and 27B (Max) parameters. Each
      request consists of a state (a document, record, or agent context, optionally with images) and
      questions about it, each asking for a choice among options, a yes/no judgment, or a score on
      an ordered scale. Training combines supervised fine-tuning with reinforcement learning from
      adjusted feedback (RLAF), plus vision tuning for Max. Ablations show that RLAF improves
      accuracy and that consistency losses improve robustness to option order. On Decision Index
      0.4.1, Max sets a new state of the art among the decision models we compare (67.52 on the
