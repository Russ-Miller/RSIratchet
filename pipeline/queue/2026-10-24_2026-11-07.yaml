    abstract: Goal interpretation is to translate a natural language instruction into a formal symbolic
      goal that a planner can execute. It is critical for embodied agents because any error here
      propagates to every downstream planning and action step. Doing it well requires both
      generating suitable candidates and reliably selecting among them. We present a two-stage
      generate-then-rank approach to Goal Interpretation in the Embodied Agent Interface (EAI).
      First, supervised fine-tuning adapts a Large Language Model (LLM) to EAI's output convention.
      Second, Candidate-Output Ranking from Errors (CORE) learns preferences over complete outputs
