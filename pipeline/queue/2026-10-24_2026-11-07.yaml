      address this, we train such a model zoo for application to Weight Space Generation by
      systematically varying the data mixture composition between web text, books, mathematics,
      coding, and French across populations of 51M, 124M, and 355M parameter GPT-2 Models, each tier
      with count N = 100. We analyze these populations by cosine similarity, functional diversity,
      Leave-One-Mixture-Out modeling, and variance decomposition. We show that the zoo contains
      diverse models whose variation is structured by training mixture composition. We embed the
