    abstract: Large language models (LLMs) are widely used for information access, content production,
      and agent-based task execution, but their outputs remain vulnerable to subtle, high-risk
      hallucinations. To systematically evaluate and advance post-generation hallucination
      detection, we introduce HaluCheck, a large-scale, bilingual benchmark comprising over 42k
      instances spanning both factual hallucinations in text and faithfulness hallucinations in
      agent trajectories. HaluCheck features fine-grained, multi-level annotations for detection,
      localization, and correction, covering different tasks and perturbation degrees. Experiments
      on fourteen LLMs reveal that, while models show basic sample-level detection ability, they
      struggle with fine-grained localization, correction, and agent hallucination detection.
      Further analysis demonstrates that thinking, web search, and supervised fine-tuning each offer
      partial improvements, but none fully solve the problem. HaluCheck thus provides a solid basis
      for benchmarking and diagnosing LLM reliability across text and agent scenarios.
