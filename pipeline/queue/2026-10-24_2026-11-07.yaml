      work, we investigate whether memorization can be mitigated without modifying or retraining the
      underlying model through an information bottleneck. We propose a modular plug-and-play
      framework that inserts a nonparametric variational information bottleneck (NVIB) between a
      frozen LLM backbone and its language modeling head. By compressing the final hidden
      representations before token prediction, the proposed bottleneck aims to preserve general
      linguistic knowledge while filtering out highly specific memorized sequences. We evaluate our
      approach on memorization extraction tasks involving book passages and on standard language
      modeling benchmarks to measure the trade-off between memorization reduction and downstream
      utility. Our experiments show that the NVIB layer substantially reduces extractability while
      maintaining competitive performance on benchmark tasks. These results suggest that adding an
      information bottleneck offers a practical and architecture agnostic direction for post-hoc
      memorization mitigation in pretrained LLMs.
