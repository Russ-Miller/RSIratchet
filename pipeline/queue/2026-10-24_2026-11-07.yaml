    abstract: "Large language models (LLMs) are increasingly used in biomedical and cognitive
      neuroscience, but their ability to reason reliably over heterogeneous knowledge graphs (KGs)
      remains unclear. We benchmark five LLMs (GPT-5.1, Gemini 2.0 Pro, Llama 3, Qwen, and BioGPT)
      across five KGs: DrugBank, NeuroSynth, Cognitive Atlas, Brain Map, and GDPKG. We introduce a
      multitier query dataset to evaluate reasoning depth and factual accuracy under KG-aware
      (graph-grounded) and KG-agnostic conditions. Inter-annotator agreement was substantial, with
      Cohen's kappa of 0.781 (range: 0.753-0.807) and Fleiss' kappa of 0.77. Results show that
      general-purpose models, particularly GPT-5.1 and Gemini 2.0 Pro, generally outperform
      domain-specific models on multi-hop and high-level reasoning tasks, although performance
      declines as query complexity increases. KG grounding reduces hallucination rates across all
      evaluated models. Contrary to our initial hypothesis, domain-specific models do not
      consistently outperform general-purpose models on specialized tasks without graph grounding.
      These findings highlight the value of combining broad language-model capabilities with
      structured domain knowledge. We provide practical guidance for selecting LLM-KG integration
      strategies based on task complexity and computational constraints, and discuss hybrid
      neurosymbolic architectures for personalized medicine, cognitive disorder diagnosis, and
      explainable AI."
