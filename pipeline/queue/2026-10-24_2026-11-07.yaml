      never asked for, unverified data, or a backtest that uses the future yields a report as
      convincing as a correct one. Existing benchmarks close the world somewhere, fixing the task,
      the data, or the timeline, and thereby remove these failures instead of measuring them. We
      introduce FINCOSMOS, an open-world evaluation paradigm for agents doing financial work. A
      simulated user holds a hidden strategy sampled from a compositional grammar and reveals it
      only when asked. The agent receives no data, so it must acquire data from the Web, build its
