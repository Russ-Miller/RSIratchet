      research, we identify an architectural vulnerability: these encrypted blocks are fully
      compatible and interchangeable across different sessions, users, and models within a
      provider's ecosystem. We exploit this compatibility to develop a scalable decryption
      jailbreak. By injecting an encrypted reasoning trace from a given model into a weaker, and
