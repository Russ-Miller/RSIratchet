      for successful execution and has received far less attention. In domains such as cloud
      networking, even frontier models correctly complete fewer than half of tool calls. Inspired by
      recent analyses showing that LLM hidden states encode rich information about model
      predictions, we discover that while the model generates a parameter value, its hidden state
      contains a strong correctness signal: a simple linear probe can accurately predict whether the
      value will be correct. Based on this observation, we propose a unified probe-guided framework
      with two complementary approaches: probe-filtered bootstrapped training (PBT), which uses the
      probe to filter reliable self-generated calls for fine-tuning, and probe-guided reranking
