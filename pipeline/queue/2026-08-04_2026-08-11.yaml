      Transformer (Mistral-7B-Instruct-v0.3), DistillCache retains 94.2% of full-cache accuracy on
      LongBench at a 25% cache budget, outperforming both strong heuristic baselines (H$_2$O,
      SnapKV) by up to 2.7 absolute points and, under our re-implementations, concurrent RL-based
