    abstract: "Transformer-based large language models (LLMs) achieve strong performance across many
      tasks, but their Key-Value (KV) cache grows linearly with sequence length, creating a severe
      memory bottleneck for long-context inference. Existing heuristic eviction methods (e.g.,
      H$_2$O and SnapKV) rely on static attention or positional signals that often fail to capture a
      token's future predictive influence. We propose DistillCache, a reinforcement learning
      framework that formulates KV-cache eviction as a sequential decision problem. DistillCache
      learns a lightweight policy network using rich internal model signals (attention statistics,
      value norms, entropy, and position) and trains it with REINFORCE via a per-step KL-divergence
