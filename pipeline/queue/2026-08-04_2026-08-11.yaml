      underexplored. To bridge this gap, we introduce OneEmo, a unified affective generalist capable
      of mastering emotion perception, comprehension, and interaction. For this purpose, we first
      construct EmoWorld-130K, a comprehensive dataset that distills specialized affective knowledge
      into explicit reasoning trajectories via a human-in-the-loop workflow. Supervised fine-tuning
      on this corpus reveals significant mutual benefits derived from multi-task learning. Second,
      to fully unlock the latent reasoning potential, we propose Emo-Chord, a novel reinforcement
      learning strategy that stabilizes optimization through unified multi-task reward allocation.
      Extensive experiments demonstrate that OneEmo achieves state-of-the-art performance against
      similarly sized baselines across most benchmarks. Notably, despite having significantly fewer
      parameters than commercial models, OneEmo delivers highly competitive results. This paper
      paves the way for more reliable and interpretable affective computing. The code is available
