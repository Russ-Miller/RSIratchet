      visual attention. However, we find that both real and hallucinated objects receive equally
      strong visual attention in the model's mid-to-late layers, suggesting that the key issue may
      not be how much the model attends, but what it attends to and why. To this end, we decode the
      visual features of high-attention regions using Logit Lens, and observe that regions
      corresponding to real objects can be correctly decoded to the target object tokens, whereas
      those for hallucinated objects cannot. Building on this, we identify two hallucination
      mechanisms: (i) visual uncertainty, triggered by semantically similar or confusable regions;
      masking these regions eliminates the hallucination. (ii) contextual prior, triggered by strong
      co-occurrence priors; even when the initially attended region is masked, the hallucination
      persists and attention drifts to other regions. Based on these findings, we propose a simple
