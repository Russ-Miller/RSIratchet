    abstract: Large language models (LLMs) are increasingly involved in scientific discovery, yet it
      remains unclear whether they can support complex real laboratory science. Here we introduce
      Science Edge Evaluation (SEE), a multimodal benchmark of expert-curated questions grounded in
      peer-reviewed literature and experimental practice in chemistry, biology, and materials
      science. Evaluation of 19 multimodal large language models (MLLMs) shows that even the
      best-performing model reaches only 48.7% accuracy. Moreover, general-purpose models outperform
      science-specialized models on average. In the visual-agent evaluation, the use of tools
      increases the best accuracy to 52.7%. Tool use can expand the information available to models,
      but more information does not necessarily lead to reliable scientific reasoning. The key
      challenge is whether models can manage tool-derived information within the boundaries of the
      original experimental evidence. Together, these findings reveal that current MLLMs still
      cannot reliably make justified and evidence-bounded inferences from experimental results,
      which is an essential capability in real scientific discovery. Bridging this gap requires
      MLLMs to transition from explaining established scientific concepts to deriving novel and
      evidence-based insights from experimental data.
