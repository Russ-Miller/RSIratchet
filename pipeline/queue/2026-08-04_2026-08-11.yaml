    abstract: "Large language models (LLMs) have substantially improved code generation, yet achieving
      strong functional correctness remains difficult, especially for heterogeneous programming
      tasks where a single prompting strategy and a single directly generated output are often
      insufficient. In this paper, we present RAV, a lightweight and modular framework that improves
      code generation with a fixed backbone model through three coordinated stages: Route, which
      applies task-aware prompt routing before generation; Align, which reduces the mismatch between
      fine-tuning prompts and inference-time prompts through aligned LoRA adaptation; and Verify,
      which selects the final output by executing multiple candidates against visible public tests.
