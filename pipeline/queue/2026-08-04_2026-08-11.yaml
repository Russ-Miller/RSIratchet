    abstract: Knowledge distillation (KD) is widely used to transfer the capabilities of large language
      models (LLMs) to smaller students, but existing objectives often struggle to balance faithful
      imitation and robust generation. In particular, existing methods mainly combine FKL and RKL,
      overlooking that RKL itself provides a mechanism for adjusting the student's imitation
      strength. Motivated by this, we revisit on-policy Reverse Kullback-Leibler (RKL) distillation
      and decompose its objective into a teacher-fitting term and a student-entropy term, without
      introducing an explicit FKL branch. We show theoretically that the token-level optimal student
      distribution corresponds to a tempered variant of the teacher distribution, where the adaptive
      weight controls the trade-off between mode-seeking and uncertainty preservation. Guided by
      this insight, we propose \textbf{Adaptive Entropy Distillation (AED)}, which uses the
      teacher's entropy to dynamically calibrate token-level imitation strength. Experiments on
      instruction-following and mathematical reasoning benchmarks demonstrate that AED achieves
      superior overall performance and generally improves teacher--student distributional and
      entropy alignment.
