    abstract: Large language model (LLM) agents rely on external memory to retain and reuse information
      across interactions. Existing memory systems treat memory as a record of the past and evaluate
      it by fidelity to the conversation. However, the value of memory lies in whether it improves
      the agent's response. A memory system decides what to memorize and what to serve before that
      response exists, and fidelity checks neither decision against it. Faithful memory can
      therefore fail to improve the response. We instead view memory as a prediction problem and
      present \textbf{\emph{\leto{}}}, a memory system for LLM agents that focuses on the utility of
      memory to the future rather than on its fidelity to the past. Because future requests are
      unknown, \emph{\leto{}} preserves access to conversation details through memory indexing,
      allowing information to remain available through its sources. When a request arrives, memory
      replay draws on this index to anticipate and supply the context the agent needs beyond what
      the request explicitly states. The utility of the served context remains uncertain until the
      response is generated, motivating a utility loop that uses response outcomes to refine future
      memory selection. We evaluate our system against six memory systems on five benchmarks across
      three scenarios. In personalization, it outperforms the strongest compared memory system by
      16.3 percentage points in accuracy on PrefEval and by 3.1 points in task completion on PERMA.
