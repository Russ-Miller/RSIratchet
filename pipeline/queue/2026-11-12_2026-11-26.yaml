    abstract: The theoretical foundation of data mining implicitly relies on an unstated premise, the
      Separation Axiom (SA), which assumes that mining tools and the data being analyzed are
      epistemologically independent. However, this premise is increasingly challenged by the
      emergence of LLM-driven AI agents that actively participate in data generation. We argue that
      this shift leads to a new epistemic failure mode, which we term ontological self-reference,
      where discovered patterns may reflect the inductive biases of the tools rather than the
      underlying structure of the data. This raises fundamental concerns about the credibility of
      knowledge discovery and the risk of self-reinforcing epistemic loops, where inferred patterns
      may reflect model-internal biases rather than the underlying structure of the data. We
      therefore call for a rethinking of the data mining paradigm in the era of large language
      models, grounded in an SA-aware theoretical foundation and extended to system-level epistemic
      safeguards. We argue that such a shift is necessary to conceptually rearm the discipline,
      preventing future knowledge discovery from collapsing into self-justifying algorithmic echo
      chambers.
