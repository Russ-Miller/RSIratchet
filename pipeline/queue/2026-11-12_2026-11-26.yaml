    abstract: "Large Language Models (LLMs) are increasingly used to translate natural-language
      statements into first-order logic (FOL) to improve reasoning. However, LLMs are prone to
      errors, and so a semantically unfaithful FOL formula could corrupt downstream reasoning. We
      present FOL-Proof, a semantic firewall pipeline that validates LLM-generated FOL translations
      against independently derived linguistic interpretations. FOL-Proof operates by
      deterministically obtaining a pool of candidate translations via semantic analysis tools, such
      as the English Resource Grammar and Minimal Recursion Semantics; then applying an SMT solver
      to check each derived reading for logical equivalence to the LLM-generated formula. If the
      translation is faithful it is accepted; otherwise, it is rejected, or optionally repaired via
      repeated invocations to the LLM. The procedure is conservative: incomplete search, unsupported
      constructions, or inconclusive checks yield abstention rather than false rejection. We
      evaluated FOL-Proof on established benchmarks (ProofWriter, RuleTaker and PrOntoQA), and also
      on a new adversarial benchmark (LongFaithCheck). Our experiments show that FOL-Proof attains
      near perfect selective accuracy, while direct LLM judges and round-trip baselines show
      substantially worse performance."
