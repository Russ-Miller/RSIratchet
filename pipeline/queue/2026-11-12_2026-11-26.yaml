    abstract: Memory-augmented large language model (LLM) driving agents can reuse past experience, yet
      previously learned corrections often fail to transfer when traffic conditions change. A key
      limitation is that existing memories mainly record observed outcomes, providing little
      evidence about alternative actions. We introduce XMind, a training-free framework that enables
      LLM-based driving to "Think Twice" through cross-memory reasoning. XMind integrates working
      memory of recent traffic states with episodic memory of critical risk events. The agent first
      makes an initial decision from the current context and then cross-checks it against retrieved
      historical experience. If a conflict arises, it makes a second decision guided by the
      retrieved evidence. To construct reliable episodic memory, XMind evaluates alternative actions
      through counterfactual rollouts under perturbed traffic conditions and stores the verified
      outcomes as structured risk capsules. These capsules are retrieved by jointly matching spatial
      risk patterns and scenario semantics. Across closed-loop highway simulations, XMind achieves
      success rates of 83.3-93.3%, exceeding the strong baseline by 6.6 percentage points on
      average. Evaluation on K-Risk further demonstrates lower decision risk on unseen real-world
      high-risk interactions. Ablation studies confirm the complementary benefits of working memory,
      risk-text retrieval, and counterfactual verification. Code is available at
      https://github.com/xiangxiangliuwo/XMind
