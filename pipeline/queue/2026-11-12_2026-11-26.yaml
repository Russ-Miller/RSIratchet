      programming (WSP), in which a language-model agent directly reads and writes a neural
      network's parameters, to a large, pre-trained vision-language-action policy. The idea is
      simple: many policy failures are not random but repeatedly land in the same recognizable stuck
      state, so if that state is visible in the model's internal activations, a small edit could
      trigger a corrective movement while leaving the rest of the model's parameters unchanged. A
      core design choice is where to write the edit: repurposing a few near-silent neurons in the
      action expert lets the edit switch on in situations associated with the failure and produce a
