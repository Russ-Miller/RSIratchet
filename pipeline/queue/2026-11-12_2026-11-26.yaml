      models nor higher reasoning effort reliably reduces this bias. We investigate decision models
      (System One architectures) for silicon sampling. Using choice training, we update KEV model
      weights on historical respondent-level choice microdata by conditional maximum likelihood,
      before inference and without target-study data. Across three model scales, training on two
