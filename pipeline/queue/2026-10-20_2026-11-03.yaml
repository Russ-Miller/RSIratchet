      Benchmark), a novel benchmark of 8,398 noisy image samples with high-fidelity annotations
      derived from 1,699 real-world video sequences. To support this, we present \textbf{Hawkeye}, a
      VLM fine-tuned on BSTRB to read and reason about illegible text by leveraging contextual
      priors and pixel-level alignment. Our results show that \name matches much larger VLMs on
