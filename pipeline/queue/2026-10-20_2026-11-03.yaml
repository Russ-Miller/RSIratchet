    abstract: A central challenge in multimodal in-context learning (MICL) arises from tasks that are
      ill-defined without context and require uncovering the underlying rules from demonstrations.
      Existing methods predominantly treat MICL as direct input-output mapping, overlooking the
      importance of explicitly inducing and reasoning over such rules, limiting both performance and
      interpretability. We propose ERIM, Explicit Rule-Induction for Multimodal In-Context Learning,
      a unified framework that enhances MICL by explicitly inducing the latent rules governing
      demonstration samples. Leveraging the reasoning ability of multi-modal large language model
      (MLLM), ERIM constructs rule-centric MICL datasets, introduces explicit supervision for rule
      induction, and fine-tunes MLLM to perform explicit rule-induction via a two-stage training
      strategy that combines mixed cold-start supervised fine-tuning with reinforcement learning.
      Extensive experiments show consistent performance improvements across diverse MICL settings
      and demonstrate that correctly inducing underlying rules directly leads to stronger and more
      stable performance.
