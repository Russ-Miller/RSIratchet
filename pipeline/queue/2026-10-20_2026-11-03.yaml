    abstract: "Chain-of-thought (CoT) reasoning allows large language models (LLMs) to generate
      intermediate reasoning traces in natural language while solving complex tasks. These traces
      can support safety monitoring by exposing potentially harmful plans before actions are
      executed. In this work, we investigate the conditions under which LLMs infer the presence of
      CoT monitoring from direct and indirect environmental cues and examine how this inference
      affects their subsequent behavior. Our observations suggest that oversight is an interactive
      process: while a monitor inspects a model's reasoning, traces left by monitoring interventions
      can allow the model to infer that its thoughts are being observed and to adapt its behavior
      accordingly. We show that even subtle environmental cues, such as timing-related signals from
      timeouts and operation durations, can reveal the presence of monitoring and trigger models to
      adapt their behavior. Across repeated episodes and interaction loops, we further observe that
      models can form statistical estimates of the monitor's effectiveness and use these estimates
      to guide attempts to evade detection. These findings highlight the need to evaluate CoT-based
      oversight under adaptive conditions, where the monitoring process itself may influence the
      behavior it seeks to observe."
