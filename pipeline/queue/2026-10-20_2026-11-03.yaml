      reliably. Using the El Agente Quntur multi-agent harness with GPT-5.6 Sol and GPT-5.6 Terra as
      its language models, agents study 32 fixed-geometry singlet excitations, detect missing active
      orbitals, compare excited states, and revise state assignments as calculations progress.
      Prompts specify equal-weight two-singlet state-averaged complete active space self-consistent
      field (CASSCF) calculations followed by strongly contracted second-order N-electron valence
      state perturbation theory (NEVPT2) with def2-TZVPD; agents choose and refine the active
      spaces. Excitation energies are evaluated against published complete active space second-order
      perturbation theory (CASPT2) reference values at matching geometries. Agentic execution
      reduces mean absolute error by 48\% relative to six deterministic Active Space Finder
      protocols. Computational traces vary substantially across runs in selection strategies and
      cost, even for the same molecule. These results underscore the advantage of agentic active
      space selection over fixed workflows, yet leave room to improve efficiency through
      runtime-aware decision-making, reduced inter-agent communication overhead and redundancy, more
      systematic checks of state identity, and clearer stopping criteria.
