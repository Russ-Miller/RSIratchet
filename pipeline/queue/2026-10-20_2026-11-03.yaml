      a recurrent checkpoint cannot recover an earlier state corresponding to a shorter prefix.
      Existing hybrid prefix caching systems retain checkpoints at selected boundaries to support
      common reuse patterns in conventional conversations. However, agent workloads modify and
      revisit earlier contexts, exposing reusable prefixes whose checkpoints were never saved or
      have already been evicted. A straightforward approach is to retain more checkpoints to reduce
      recomputation, but their cumulative footprint can displace reusable prefixes from other
      sessions and cause additional cache misses. To address these problems, we present HiState, a
      prefix cache management system for hybrid models serving agent workloads. Our key observation
      is that prefix reuse accesses all matching key-value (KV) entries but only one recurrent
      checkpoint, regardless of how many checkpoints are retained. This asymmetry allows HiState to
      retain historical checkpoints on SSD while prioritizing fast memory for KV entries: each hit
      retrieves only one checkpoint whose size is independent of context length. Within this
      hierarchy, we propose adaptive interval control to balance checkpoint storage against
      recomputation, and unified eviction to coordinate checkpoint sparsification with reclamation
      of stale trajectories. We implement HiState"
