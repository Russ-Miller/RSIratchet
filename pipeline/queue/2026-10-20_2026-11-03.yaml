    abstract: Sparse tuning is widely used to adapt large language models due to its parameter
      efficiency. However, its effectiveness depends not only on the number of trainable parameters,
      but also on the feature-interaction topology of the sparse update's structural support.
      Limited or uneven connectivity in this support may isolate subsets of feature dimensions,
      forming information islands that restrict direct task-specific interactions through the
      trainable update. To address this issue, we propose Small-World Induced Fine-Tuning (SWIFT), a
      sparse tuning framework inspired by small-world connectivity. SWIFT combines block-diagonal
      sparse updates for local feature mixing with a fixed deterministic scattering permutation that
      routes the mixed outputs across feature groups without additional trainable parameters. We
      further show theoretically that certain random sparse-update models and block-diagonal updates
      can exhibit information islands, whereas a sufficiently scattering permutation guarantees
      positive block-level expansion when the trainable block-diagonal factor consists of
      equal-sized, structurally dense square blocks. Extensive experiments on commonsense reasoning,
      natural language generation, and image classification demonstrate that SWIFT outperforms the
      evaluated parameter-efficient fine-tuning (PEFT) baselines on average and can match or surpass
      full fine-tuning. Implementation is available at https://github.com/xianchaoguan/SWIFT
