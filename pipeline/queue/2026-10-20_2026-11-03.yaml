    abstract: Large language models have been shown to memorise and reproduce verbatim sequences from
      their training data, raising concerns about privacy leakage, intellectual property exposure,
      and the limits of generalisation. Recent theoretical work suggests that attention heads may
      contribute to this behaviour by functioning as associative memory mechanisms, with
      memorisation capacity scaling with the number of heads. At the same time, empirical work has
      shown that many attention heads are redundant and can be pruned with limited impact on
      downstream performance. Despite these parallel findings, the effect of pruning redundant heads
      on memorised-sequence reproduction remains unexplored. In this work, we demonstrate that
      zeroing out a substantial fraction of attention heads prior to inference can significantly
      suppress verbatim memorisation while preserving, or even improving, language modelling
      performance on the benchmark used to identify redundant heads. Evaluating GPT-2-XL(1.5B) on
      known memorised sequences, we find that pruning 729 task-redundant heads reduces the
      memorisation count by 91.5%, while improving WikiText-103 perplexity by 0.92. These findings
      suggest that attention-head redundancy can be exploited to mitigate memorisation at inference
      time, without retraining or modifying the training data.
