      original sources. We introduce TOME-Math (Textbook-Oriented Mathematical Evidence), a
      large-scale corpus that converts 2,118 textbooks spanning the core areas of university-level
      mathematics subjects into approximately 380K structured proof-supervision records while
      preserving chapter order, proposition-proof links, dependency references, and source
      provenance. Leveraging these structural signals, we explore curriculum learning across
      multiple mathematical subjects and characterize scaling patterns with supervision volume and
      source breadth. At full scale, fine-tuning on TOME-Math raises the unweighted mean score
      across our held-out evaluations and established public benchmarks by 16.7 percentage points
      over the base model, while exceeding all three public instruction-data baselines evaluated in
      aggregate. Our findings highlight structured textbooks as both a scalable source of
