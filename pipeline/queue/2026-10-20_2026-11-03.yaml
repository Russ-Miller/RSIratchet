      a formal specification. We introduce a neuro-symbolic, specification-guided decoding framework
      that combines LLM generation with symbolic reasoning. At each step, the framework refines the
      decoding grammar by filtering out values that cannot be extended to an output satisfying the
      specification. We present a forward-only variant that guarantees specification satisfaction by
      construction, and a backtracking variant that revises earlier feasible choices when their
      downstream consequences leave only values that the LLM itself judges unsuitable. The framework
      is model-agnostic, requires no retraining, and builds on existing grammar-constrained decoding
      mechanisms. Experiments on configuration and constraint-solving benchmarks show that the
      forward-only variant reliably produces specification-compliant outputs while reducing repeated
