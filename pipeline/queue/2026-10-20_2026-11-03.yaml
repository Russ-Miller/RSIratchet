    abstract: "Multimodal Large Language Models (MLLMs) are increasingly capable of understanding images
      and performing complex visual reasoning, suggesting the possibility of using them to automate
      biological image analysis. This need is becoming increasingly urgent as advances in technology
      continue to generate ever larger and more diverse microscopy datasets, already exceeding the
      scale at which manual visual analysis is feasible. With the final aim to use MLLMs for visual
      comparison of complex phenotypes, we investigate a very simple baseline: comparison of the
      size of body parts in synthetic images of ants. We find that state-of-the-art open-weight
      MLLMs fail for some body parts, but not for others, even though the comparison itself is
      visually trivial for all of them. We evaluate different in-context learning strategies and
      analyze performance on the related object recognition task. Our results suggest a
      recognition-driven grounding failure: structures that the models cannot recognize are instead
      associated with a recognizable semantic concept, impairing the grounding and comparison of
      both. Further analysis of the vision encoder is consistent with the hypothesis that
      fine-grained visual structure may be less well preserved without semantic support. Together,
      our results reveal a surprising limitation of current MLLMs: semantic recognition can gate
      simple visual comparisons that do not intrinsically require semantic understanding. Our code
      and data are available at https://github.com/"
