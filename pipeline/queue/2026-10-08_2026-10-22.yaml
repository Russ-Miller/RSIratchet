    abstract: Ensuring the alignment of Large Language Models (LLMs) with diverse cultural values is
      critical for their safe global deployment. However, existing alignment benchmarks are
      predominantly English-centric or confined to simple discriminative tasks. Moreover, they often
      fail to effectively evaluate model robustness against complex, adversarial inductions within
      specific cultural contexts. To address these limitations, we propose ABench, a fine-grained,
      handcrafted benchmark specifically tailored to taxonomized values in Chinese. Grounded in a
      rigorous hierarchical taxonomy comprising 158 derived value subcategories, ABench consists of
      2,895 open-ended questions. These questions employ techniques such as role-playing and logical
      traps to probe the stability of models' stances in adversarially induced contexts.
      Furthermore, we propose a weighted automated evaluation framework that utilizes
      question-specific scoring criteria for nuanced assessment. Extensive experiments on 16
      mainstream LLMs reveal that most models exhibit significant vulnerabilities when subjected to
      sophisticated adversary attacks on values (scoring below 60). This underscores the need for
      more robust, culturally specific alignment strategies. Our data will be publicly released to
      promote further research on taxonomized value alignment.
