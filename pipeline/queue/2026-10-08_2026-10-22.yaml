    abstract: "Retrieval-augmented generation (RAG) is the dominant paradigm for grounding large
      language models in external corpora, but its similarity-driven, chunked pipeline has
      structural blind spots: it cannot anticipate which passages a question requires and discards
      document-level context that resolves cross-passage references. We introduce evidence-based
      generation (EBG), requiring models to return an answer with line-level citations, and a joint
      Ans+Evid metric that scores correctness and grounding simultaneously. We reformulate two
      corpora into evidence-grounded multi-document QA benchmarks- MultiHop-RAG and QASPER-MP, a
      multi-paper adaptation of QASPER with realistic short paper cues, and pair them with a
      controlled synthetic two-hop haystack and an evidence-augmented NoLiMa spanning 10K-1M
      characters. Across ten proprietary frontier and three open-weight LLMs, EBG isolates two RAG
      limitations that long-context models avoid: similarity retrieval surfaces any relevant chunk
      far more reliably than all required chunks for multi-fact queries, and chunking destroys
      document meta-information needed to resolve identity-bearing queries. EBG also exposes
      grounding failures invisible to answer-only evaluation, including incomplete citations in
