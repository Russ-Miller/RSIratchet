    abstract: "Large Language Models (LLMs) depend fundamentally on the diversity, depth, and factual
      rigor of their pre-training corpora. However, contemporary foundational pre-training datasets
      (such as The Pile, S2ORC, and Dolma) exhibit a severe structural omission: African scientific,
      medical, legal, and agricultural scholarship constitutes less than 0.5% of global pre-training
      tokens. Consequently, state-of-the-art models suffer from systematic failure modes when
      reasoning about tropical epidemiology, localized smallholder agro-ecologies, regional economic
      governance, and indigenous linguistic structures. To resolve this representation deficit and
      advance African intellectual sovereignty in artificial intelligence, we introduce
      Africa-Papers, the largest curated multi-domain Pan-African academic pre-training corpus to
      date. Comprising over 844,807 full-text papers spanning 10.15 billion tokens across 879
      Parquet shards, Africa-Papers unifies four primary scientific streams: (1) continental
      peer-reviewed journals indexed in DOAJ across 31 African nations, (2) the CGIAR CGSpace
      agricultural repository, (3) African-authored and African-focused STEM/AI preprints on arXiv,
      and (4) open-access international publications by scholars affiliated with African
