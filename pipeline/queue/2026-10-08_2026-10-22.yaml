    abstract: "Block-diffusion speculative decoding accelerates large language model inference by
      drafting multiple tokens in parallel. However, one-step drafting in discrete diffusion is
      limited by token factorization error: each token is predicted from the same masked block,
      without conditioning on the tokens selected at other positions in that step. This can produce
      inconsistent drafts and reduce acceptance length. Iterative refinement mitigates this
      limitation by conditioning later predictions on previously committed tokens, though additional
      passes increase drafting cost. To address this trade-off between draft fidelity and inference
      latency, we introduce DStill, a two-stage framework that distills a target-conditioned
      drafter's own multi-step refinement into one-step drafting. We first train the drafter to
      complete partially revealed blocks, then use its refinement trajectories to train a student to
      predict the final completion in one pass. Using a curriculum that gradually transitions from
      partial to fully masked inputs, we successfully transfer the multi-step refinement
      capabilities into one step. Across reasoning, math, code benchmarks on three model families
      DStill improves acceptance length by up to 28% and speedup by up to 25% over one-step DFlash,
      achieving up to 6.45x speedup over auto-regressive decoding."
    proposal:
      suggests_new_capability: false
