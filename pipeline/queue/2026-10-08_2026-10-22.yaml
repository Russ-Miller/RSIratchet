    abstract: Large language models are expected to estimate their own uncertainty, with confidence
      signals used to guide retrieval, adaptive compute allocation, routing, and selective
      abstention. We investigate whether confidence signals measured at different temporal stages of
      problem solving encode distinct forms of epistemic information and remain reliable beyond
      English-centric settings. Inspired by classical meta-memory theory, we distinguish
      anticipatory pre-solve confidence (Feeling-of-Knowing, FOK) from retrospective post-solve
      confidence (Judgement-of-Learning, JOL). We evaluate these signals across two frontier LLMs,
      multiple reasoning domains, translated Marathi benchmarks, and a newly constructed benchmark
      of genuinely local Marathi factual questions. Across settings, the cheaper pre-solve signal
      remains weakly calibrated, while post-solve confidence generally provides stronger epistemic
      alignment despite its additional inference cost. Confidence behaviour transfers surprisingly
      well under direct language translation, with calibration trends largely preserved between
      English and Marathi, but degrades substantially on local Marathi knowledge, suggesting that
      linguistic transfer alone is insufficient for region-specific information needs. Finally,
      hallucinated responses maintain persistently elevated confidence after answer generation,
      highlighting important limitations of current LLM self-assessment mechanisms.
