      present systematic evidence that vision-language models (VLMs) exhibit inverse scaling at the
      subtask level: specific question categories on which larger models perform worse than smaller
      counterparts within the same model family. We evaluate 19 models from four distinct model
      families across eight multimodal benchmarks (nine evaluation splits), answering 29,386
      questions per model, 558,334 model-question evaluations in total. Using per-question pairwise
      analysis across all model pairs in each family, we identify 375 subtask-model-pair
      combinations exhibiting inverse scaling, spanning 4,342 unique queries where a smaller model
      answers correctly but a larger model fails, and we find that these patterns replicate across
      independently developed architectures. We identify 13 subtask-dataset pairs that show inverse
