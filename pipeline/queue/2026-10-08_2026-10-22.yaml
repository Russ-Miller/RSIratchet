      both limitations, we propose Collaborative Reasoning Asymmetric Learning (CoRAL), a hybrid
      framework via an Asymmetric Planner-Executor (APE) architecture: a DLM Planner generates K
      diverse reasoning trajectories in parallel, while a large ARM Executor selects the optimal
      plan and synthesizes the final answer. To train the Planner effectively, we introduce
      Reward-Guided Denoising for CoT (RDC), which integrates outcome-based rewards into the
