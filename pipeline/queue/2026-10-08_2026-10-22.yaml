    abstract: Large Language Models (LLMs) increasingly operate across culturally diverse settings, yet
      existing evaluations largely measure cultural behavior at the output level. We introduce
      CultureLens, a reference-grounded benchmark and mechanistic study of how LLMs use cultural
      information. CultureLens contains 9,261 scenarios across 75 countries and systematically
      varies country, value, true-norm, and contradictory-norm evidence. Across Llama-3.1-8B,
      Gemma-3-12B, and Qwen-3.5-27B, stating a contradictory norm lowers aligned answers by 32-47
      percentage points, even when the model answers correctly from the country alone.
      Mechanistically, models default to Anglophone norms when no country is given. The failure
      under a contradictory norm is not one of missing knowledge, as blocking the norm inside the
      model restores the correct answer in most cases. Models accept a stated norm according to how
      it is presented and not whether it is true, which leaves them most exposed to errors in
      retrieved content. Supervised fine-tuning with contradictory-norm examples raises aligned
      answers under a contradictory norm to 85-93%, including on unseen countries, at a small cost
      under a true norm.
