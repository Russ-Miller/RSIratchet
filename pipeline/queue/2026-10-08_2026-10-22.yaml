    abstract: "Large Language Models (LLMs) have significantly advanced natural language processing and
      artificial intelligence applications through their capabilities in reasoning, text generation
      and knowledge retrieval. However, LLMs are still vulnerable to two important challenges:
      hallucination, generating factually incorrect or fabricated content, and response deviation,
      meaning systematic deviations from ground-truth responses. These limitations raise serious
      concerns regarding reliability and trustworthiness in academic and research environments. This
      study offers a thorough comparative analysis using a variety of metrics of ten advanced LLMs
      ChatGPT, Gemini, Claude~3.5~Sonnet, LLaMA~3, Mistral, Grok, Perplexity, DeepSeek~V3, Falcon,
      and Gemma based on a benchmark consisting of 70 carefully designed academic prompts across
      four complexity levels: Basic, Explanation, Advanced, and Tricky, evaluated in February 2025
      on specific model versions. Each response was independently evaluated by three reviewers using
      five metrics: Accuracy, Precision, Recall, Response Deviation Index, and Hallucination Index.
      Perplexity and DeepSeek~V3 achieved the highest overall accuracy, while Gemini demonstrated
      strong recall and a well-balanced performance profile across all five metrics. LLaMA~3 showed
      strong resistance against hallucinations through a conservative method of generation.
