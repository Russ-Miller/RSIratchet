    abstract: "Supervised Fine-Tuning (SFT) followed by Reinforcement Learning (RL) has become a
      standard pipeline for Large Language Model (LLM) post-training. SFT is expected to provide a
      useful behavioral prior for RL to further enhance model capabilities. However, checkpoints
      with excessive SFT often show limited improvement during RL. We attribute this failure to the
      loss of model plasticity: the reduced ability of an SFT-initialized policy to be effectively
      reshaped by subsequent RL. To better understand this phenomenon, we conduct detailed analysis
      from multiple perspectives, including parameter changes, output spaces, and RL optimization
      dynamics. Our results show that models from excessive SFT tend to produce over-confident token
      distributions and exhibit sharp parameter landscapes, which make them harder to optimize in
      the RL stage. To enable a more robust SFT-to-RL handoff, we propose \\texttt{Rejuvenation}, a
      simple yet effective method that restores plasticity while preserving useful SFT-acquired
      priors. Rejuvenation leverages base-anchored model fusion to reduce excessive SFT-induced
      drift with targeted neuron reset to mitigate model rigidity. Experimental results on both math
      reasoning tasks and agentic tasks demonstrate that our approach consistently improves RL
      performance on over-trained SFT models, while also enhancing generalization to
      out-of-distribution tasks."
