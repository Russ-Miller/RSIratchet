    venue: arXiv (Cornell University)
    topic: AI-based Problem Solving and Planning
    cited_by_count: 0
    abstract: A central goal of large language model (LLM) research is to build agentic systems that can
      plan, act, and adapt through sustained interaction with dynamic environments. While recent
      LLM-based agents exhibit impressive contextual reasoning, their long-horizon decision-making
      remains fragile, often suffering from objective drift, where goals and plans drift over
      extended interactions. We introduce Multi$^2$, a hierarchical multi-agent decision-making
      framework that explicitly decomposes agent behavior into complementary roles. A high-level
      agent (System 1) focuses on context-aware sub-goal generation using supervised fine-tuning
      (SFT), while a low-level agent (System 2) executes atomic actions through offline-to-online
      reinforcement learning (RL) in interactive environments. This separation enables stable
      long-horizon control, mitigates objective drift, and allows efficient adaptation. Across
      diverse interactive environments, Multi$^2$ consistently outperforms strong agentic baselines,
      demonstrating improved robustness and coordination in multi-turn interaction. Beyond
      performance, we introduce and release three hierarchical benchmark datasets, filling a
      long-standing gap in training and evaluating hierarchical decision-making for LLM-based
      agents.
