      multi-turn corpus and on 630 adversarial agent traces, where it exposes a meta-failure mode: a
      73-100 percentage-point gap between LLM-judge ASR and real execution. Cluster cohesion remains
      strong across all three regimes, which we take as evidence that behavioral clustering is a
      portable diagnosis primitive that generalizes beyond any single benchmark. We release the
      pipeline, three annotated corpora, and the cross-regime taxonomies."
