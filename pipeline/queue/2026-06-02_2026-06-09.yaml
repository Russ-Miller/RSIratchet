    abstract: "Multimodal large language models (MLLMs) have made substantial advancements in video
      understanding, yet the reliability of their responses remains underexplored. This work
      presents a diagnostic study of absent answer detection for MLLMs in video understanding, where
      the correct answer is deliberately excluded from the candidate set and a reliable model is
      expected to recognize that no valid option exists. We evaluate the absent answer detection
      behavior under three settings: multiple-choice questions augmented with an ``None of the
