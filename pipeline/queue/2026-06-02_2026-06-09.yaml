    abstract: "Reinforcement learning (RL) holds immense promise for enhancing the reasoning
      capabilities of diffusion large language models (dLLMs). However, progress is fundamentally
      constrained by a dual misalignment between authentic generation trajectory and the gradient
      update process: (i) Process-reward misalignment. Sparse, terminal rewards are indiscriminately
      assigned to all intermediate steps of the generation process, failing to provide
      discriminative credit assignment. (ii) State-trajectory misalignment. Policy updates are often
      diverted toward artificial, out-of-trajectory states, squandering gradients on less
      informative samples. To address these limitations, we introduce Process Aligned Policy
      Optimization (PAPO), a novel framework that holistically aligns the RL update with the dLLM's
      generative trajectory via Step-Aware Process Rewards (SPR) that transform sparse terminal
      rewards into dense, step-wise credit, and Entropy-Guided Historical Re-enactment (EHR) that
      replays authentic trajectories at high-uncertainty steps. Extensive experiments on four
      benchmarks demonstrate that PAPO significantly outperforms baselines, achieving gains of 4.5%
      on GSM8K, 4.8% on MATH500, 42.2% on Countdown and 16.1% on Sudoku."
