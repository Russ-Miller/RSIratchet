    abstract: "Standard benchmarks report aggregate accuracy, but practitioners need to know which
      specific capabilities a model lacks. We introduce FailureScope, a behavioral-diagnosis method
      that clusters evaluation probes by their cross-model pass/fail patterns (leave-one-model-out,
      LOMO), and show it yields stable, interpretable failure taxonomies across three regimes
      usually studied separately: single-turn benchmarks, multi-turn dialogue, and adversarial agent
      attacks. On 2,664 single-turn tasks across 18 models, taxonomy-conditioned sampling reaches
