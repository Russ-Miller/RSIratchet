      maintains superior performance under adversarial corruptions on general VQA benchmarks.
      Analysis confirms that high-quality visual recovery directly enhances reasoning performance,
      establishing self-recovery as a critical mechanism for robust visual understanding. The source
      code is available at https://github.com/jqtangust/Robust-U1."
