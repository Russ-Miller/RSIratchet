      substantially improves detection rates, performance remains unsatisfactory, suggesting that
      prompting-based strategies alone are insufficient to fully address this limitation. These
      findings expose a systematic failure in absent answer detection and highlight the need for
      explicit detection mechanisms in multimodal systems."
