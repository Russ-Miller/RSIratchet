      the large number of languages, significant phonetic overlap among related varieties, and the
      scarcity of labeled data for many low-resource languages. In this work, we present a
      systematic comparative study of two pre-trained speech encoders -- Whisper and FastConformer
      -- combined with a linear classifier for large-scale Indic LID spanning 42 languages across
      four linguistic families. We evaluate both encoders in frozen (linear probing) and fine-tuned
      settings, and compare three training objectives: cross-entropy (CE), supervised contrastive
      loss with cross entropy (CE + supCon), and hierarchical softmax (HSM). Models are trained on
      the Vaani dataset and evaluated in a cross-corpus setting on Vaani-Test (held-out), FLEURS,
