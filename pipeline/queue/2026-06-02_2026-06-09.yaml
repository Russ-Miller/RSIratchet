      strategies for Natural Language Inference (NLI) in Swahili, Yoruba, and Hausa using the
      AfriXNLI benchmark. We evaluate five prompting strategies Baseline (zero-shot), Script-Aware,
      Language Specific, Contrastive, and Native-Label Self-Translation (NL-STP) across two
