    abstract: "Multimodal Large Language Models (MLLMs) have demonstrated remarkable success in visual
      understanding, yet their performance degrades significantly under real-world visual
      corruptions. While existing robustness enhancement approaches exist, they are limited:
      black-box feature alignment lacks interpretability, and white-box text-based reasoning cannot
      restore lost pixel-level details. This work investigates a fundamental research question: Can
      MLLMs recover corrupted visual content by themselves? To address this, we propose Robust-U1, a
      novel framework that equips MLLMs with explicit visual self-recovery capability for robust
      understanding. The approach comprises three core stages: supervised fine-tuning for initial
      reconstruction, reinforcement learning with dual rewards (pixel-level SSIM and semantic-level
