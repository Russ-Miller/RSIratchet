    abstract: Visual DeepSearch tasks require multimodal large language models (MLLMs) to resolve
      complex visual queries by repeatedly inspecting image regions, grounding reasoning in visual
      evidence, and connecting fine-grained clues across multiple steps. However, existing
      benchmarks primarily evaluate single-step visual understanding or isolated visual-query
      response generation. They have limited difficulty, limited search horizons, and single-pass
      image inspection, and thus fail to evaluate models' ability to iteratively revisit visual
      evidence and reason across multiple steps. In this work, we introduce VistaHop, a benchmark
      designed specifically to evaluate Visual DeepSearch. It evaluates repeated image inspection,
      visual-anchor grounding, and long-horizon evidence traversal across different visual regions.
      VistaHop comprises 600 images, 25 visual search scenarios, and 600 Visual DeepSearch tasks. We
      also propose VistaArena, a unified evaluation framework that supports tool-based interactions,
      including visual retrieval, image inspection, and evidence-grounded reasoning. Experiments
      show that even state-of-the-art MLRMs remain far from solving VistaHop, with the
