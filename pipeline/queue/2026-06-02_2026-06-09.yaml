      any final output check can intervene. Existing defenses usually protect one boundary, either
      the planner/runtime or the point where external actions are executed, and therefore do not by
      themselves secure both surfaces. We present SecureClaw, a dual-boundary architecture that
      enforces authorization in a trusted executor and keeps raw protected data outside the LLM
      runtime. Sensitive reads pass through a trusted gateway that replaces raw values with
      reference IDs. In the evaluated deployment, the gateway also provides short planning summaries
      that deliberately release selected information, a process called declassification. Writes that
      change external state follow a PREVIEW$\\rightarrow$COMMIT protocol in which only a trusted
      executor may execute the exact request authorized by policy. The runtime can still plan over
