    title: "More Yap Less Meaning: Uncovering Self-Improvement Behavior in SLMs"
    date: 2026-06-07
    arxiv_id: "2606.08471"
    authors:
      - Marina Igitkhanian
      - Erik Arakelyan
    venue: arXiv (Cornell University)
