      achieves over 90\\% macro accuracy on FLEURS and Kathbath without any task-specific
      adaptation, substantially outperforming Whisper on out-of-domain benchmarks, while fine-tuned
      Whisper yields stronger in-domain performance. HSM consistently outperforms CE and CE+SupCon
