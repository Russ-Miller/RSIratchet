    abstract: While large language models (LLMs) offer promising reasoning capabilities, their
      integration into safety-critical driving systems is hindered by limited reasoning diversity,
      high computational overhead, and static learning paradigms. To address these challenges, we
      propose LUNA-AD, a lightweight uncertainty-aware language model with lifelong learning for
      autonomous driving (AD). LUNA-AD features a tri-system architecture that reconciles complex
      multimodal behavioral reasoning, efficient deployment, and continual refinement. We design a
      multi-agent analytical system to generate uncertainty-aware decision-making demonstrations
      through diverse hypothesis exploration. A dual-head lightweight heuristic model is distilled
      to unify the inference of decision distributions and textual explanations while enabling
      efficient deployment. Furthermore, a reflection-driven lifelong learning mechanism operates on
      multimodal decision outputs and preserves strategic diversity, allowing for the refinement of
      candidate decisions and rationales via closed-loop feedback to enhance driving robustness.
