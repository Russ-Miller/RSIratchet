      highly neutral class collapse and high prediction skew in some configurations. Contrastive
      prompting proves to be the most reliable and steadily improving strategy over language and
      model and has better balance of class behavior and balance of overall accuracy gains. Notably,
      well-constructed prompts are sufficient to beat more powerful baselines that are provided with
      few-shot prompts and Chain-of-Thought prompts. We have found that prompt formulation is
      essential to multilingual NLI with low-resource languages and that language aware decision
      structuring can be used to meaningfully enhance robustness in resource challenged settings.
