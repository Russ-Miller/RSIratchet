      direct-answer generation, which struggles when post-cutoff knowledge is not explicitly queried
      but is only causally related to the question. To address this limitation, we propose two
      recall-based prompting strategies: Self-Recall (SR), which asks the model to restate its
      cutoff constraint, and Question-Recall (QR), which requires the model to recall
      question-relevant information valid under the cutoff. Across three existing benchmarks, our
      methods outperform both direct-answer prompting and conventional step-by-step reasoning
      baselines, with particularly strong improvements on counterfactual questions. To investigate
      robustness across different cutoff settings, we further construct the Multi-cutoff Historical
      Event Benchmark (MHEB), which evaluates the same question under multiple cutoff years. Results
      show that knowledge cutoff performance varies with cutoff distance, while combining SR and QR
      consistently yields the best performance."
