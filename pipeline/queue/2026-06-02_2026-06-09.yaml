      limited trainability. As a result, direct fine-tuning tends to cause overfitting and
      suboptimal performance, sometimes even worse than training from scratch, substantially
      diminishing the benefits of pre-training. To overcome this limitation, we propose Smoothed
      Full Fine-tuning (SFF), a novel fine-tuning technology. Specifically, we construct an
      auxiliary LTSM via random initialization to obtain a smoother loss landscape, and then
      linearly interpolate its weights with those of the pre-trained model to smooth the original
      landscape. This process improves trainability while preserving pre-trained knowledge, thereby
      enabling more effective downstream fine-tuning. From an optimization perspective, SFF perturbs
