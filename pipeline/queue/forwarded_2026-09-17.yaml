      - Zihan Min
      - Hanling Zhang
      - Jichao Yan
      - Guohao Dai
      - Wanli Ouyang
      - Yu Wang
    venue: arXiv
    abstract: "Multi-LLM systems harness the complementary strengths of diverse Large Language Models,
      achieving performance and efficiency gains that are not attainable by a single model. In
      existing designs, LLMs communicate through text, forcing internal representations to be
      transformed into output token sequences. This process both loses rich semantic information and
      incurs token-by-token generation latency. Motivated by these limitations, we ask: Can LLMs
      communicate beyond text? Oracle experiments show that enriching the KV-Cache semantics can
      improve response quality without increasing cache size, supporting KV-Cache as an effective
      medium for inter-model communication. Thus, we propose Cache-to-Cache (C2C), a new paradigm
      for direct semantic communication between LLMs. C2C uses a neural network to project and fuse
      the source model&#39;s KV-cache with that of the target model to enable direct semantic
      transfer. A learnable gating mechanism selects the target layers that benefit from cache
      communication. Compared with text communication, C2C utilizes the deep, specialized semantics
      from both models, while avoiding explicit intermediate text generation. Experiments show that
      C2C achieves 6.4-14.2% higher average accuracy than individual models. It further outperforms
      the text communication paradigm by approximately 3.1-5.4%, while delivering an average 2.5x
      speedup in latency. Our code is available at this https URL ."
