    abstract: "The formal reasoning capabilities of LLMs are crucial for advancing automated software
      engineering. However, existing benchmarks for LLMs lack systematic evaluation based on
      computation and complexity, leaving a critical gap in understanding their formal reasoning
      capabilities. Therefore, it is still unknown whether SOTA LLMs can grasp the structured,
      hierarchical complexity of formal languages as defined by Computation Theory. To address this,
      we introduce ChomskyBench, a benchmark for systematically evaluating LLMs through the lens of
      Chomsky Hierarchy. Unlike prior work that uses vectorized classification for neural networks,
      ChomskyBench is the first to combine full Chomsky Hierarchy coverage, process-trace evaluation
      via natural language, and deterministic symbolic verifiability. ChomskyBench is composed of a
      comprehensive suite of language recognition and generation tasks designed to test capabilities
      at each level. Extensive experiments indicate a clear performance stratification that
      correlates with the hierarchy's levels of complexity. Our analysis reveals a direct
      relationship where increasing task difficulty substantially impacts both inference length and
      performance. Furthermore, we find that while larger models and advanced inference methods
      offer notable relative gains, they face severe efficiency barriers: achieving practical
      reliability would require prohibitive computational costs, revealing that current limitations
      stem from inefficiency rather than absolute"
