    abstract: The recent advancements in Vision Language Models (VLMs) have demonstrated progress toward
      true intelligence requiring robust reasoning capabilities. Beyond pattern recognition,
      linguistic reasoning must integrate with visual comprehension, particularly for Chart Question
      Answering (CQA) tasks involving complex data visualizations. Current VLMs face significant
      limitations in CQA, including imprecise numerical extraction, difficulty interpreting implicit
      visual relationships, and inadequate attention mechanisms for capturing spatial relationships
      in charts. In this work, we address these challenges by presenting Chart-RL, a novel
      reinforcement learning framework that enhances VLMs chart understanding through
      feedback-driven policy optimization of visual perception and logical inference. Our key
      innovation includes a comprehensive framework integrating Reinforcement Learning (RL) from
      Policy Optimization techniques along with adaptive reward functions, that demonstrates
      superior performance compared to baseline foundation models and competitive results against
      larger state-of-the-art architectures. We also integrated Parameter-Efficient Fine-Tuning
      through Low-Rank Adaptation (LoRA) in the RL framework that only requires single GPU
