    abstract: Uncertainty estimation (UE) aims to quantify uncertainty in large language model (LLM)
      outputs to flag potential hallucinations and support reliable deployment. However, UE metrics
      often exhibit unstable performance across models and datasets, limiting their practical
      utility. We formalise this phenomenon as proxy failure, arising because UE metrics are derived
      from model behaviour rather than being explicitly grounded in factual correctness. We show
      that when mutual information between a UE score and correctness is low, the score's
      discriminability must be close to chance. To address this, we propose Truth AnChoring (TAC), a
      lightweight post-hoc calibration method that maps raw UE scores to truth-aligned correctness
      probabilities. Even with noisy and few-shot supervision, TAC continues to improve calibration,
      providing a practical calibration protocol. Our findings highlight the limitations of treating
      heuristic UE metrics as direct indicators of uncertainty about factual correctness, and
      position our TAC as a principled step toward more reliable uncertainty estimation for LLMs.
      The code repository is available at https://github.com/ponhvoan/TruthAnchor/.
