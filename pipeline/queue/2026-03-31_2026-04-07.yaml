    abstract: "Integrating Large Language Models (LLMs) into hypersonic thermal protection system (TPS)
      design is bottlenecked by cascading constraint violations when generating executable
      simulation artifacts. General-purpose LLMs, treating generation as single-pass text
      completion, fail to satisfy the sequential, multi-gate constraints inherent in safety-critical
      engineering workflows. To address this, we propose AeroTherm-GPT, the first TPS-specialized
      LLM Agent, instantiated through a Constraint-Closed-Loop Generation (CCLG) framework. CCLG
      organizes TPS artifact generation as an iterative workflow comprising generation, validation,
      CDG-guided repair, execution, and audit. The Constraint Dependency Graph (CDG) encodes
      empirical co-resolution structure among constraint categories, directing repair toward
      upstream fault candidates based on lifecycle ordering priors and empirical co-resolution
      probabilities. This upstream-priority mechanism resolves multiple downstream violations per
      action, achieving a Root-Cause Fix Efficiency of 4.16 versus 1.76 for flat-checklist repair.
