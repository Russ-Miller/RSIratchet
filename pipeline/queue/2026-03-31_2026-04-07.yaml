    abstract: Large Language Models (LLMs) are powerful tools for answering user queries, yet they
      remain highly vulnerable to jailbreak attacks. Existing guardrail methods typically rely on
      internal features or textual responses to detect malicious queries, which either introduce
      substantial latency or suffer from randomness in text generation. To overcome these
      limitations, we propose SelfGrader, a lightweight guardrail method that formulates jailbreak
      detection as a numerical grading problem using anchored token-level logits. Specifically,
      SelfGrader evaluates the safety of a user query within a compact set of numerical tokens (NTs)
      (e.g., 0-9) and interprets their logit distribution as an internal safety signal. To align
      these signals with the target safety rubric, SelfGrader constructs Probably Approximately
      Correct-guided ICL anchor examples and introduces a dual-perspective scoring rule that
      considers both the maliciousness and benignness of the query, yielding a stable and
      interpretable score that reflects harmfulness and reduces the false positive rate
      simultaneously. Extensive experiments across diverse jailbreak benchmarks, adaptive attacks,
      benign prompt benchmarks, multiple LLMs, and state-of-the-art guardrail baselines demonstrate
      that SelfGrader achieves strong robustness with low false positive rates, memory overhead, and
      latency.
