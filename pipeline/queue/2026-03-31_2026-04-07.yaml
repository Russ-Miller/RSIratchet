      state-of-the-art models (including Qwen, InternVL, and LLaVA) shows a severe deficiency:
      performance saturates below 10% Exact Match and 20% semantic accuracy, with no significant
      improvement observed from model scaling or In-Context Learning (ICL). These findings suggest
      that while models possess the necessary visual and linguistic components, they lack the
      cognitive reasoning glue to connect them. Project page available at
