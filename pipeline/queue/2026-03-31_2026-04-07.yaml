    abstract: Safety alignment has become a critical step to ensure LLMs refuse harmful requests while
      providing helpful and harmless responses. However, despite the ubiquity of safety alignment
      for deployed frontier models, two separate lines of recent work--jailbreak-tuning (JT) and
      weight orthogonalization (WO)--have shown that safety guardrails may be largely disabled,
      resulting in LLMs which comply with harmful requests they would normally refuse. In spite of
      far-reaching safety implications, analysis has largely been limited to refusal rates of each
