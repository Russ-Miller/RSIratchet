      organ-level toxicity reasoning across multiple organs. ToxReason integrates experimental
      drug-target interaction evidence with toxicity labels, requiring models to infer both toxic
      outcomes and their underlying mechanisms from Molecular Initiating Event (MIE) to Adverse
      Outcome (AO). Using ToxReason, we evaluate toxicity prediction performance and reasoning
      quality across diverse LLMs. We find that strong predictive performance does not necessarily
      imply reliable reasoning. Furthermore, we show that reasoning-aware training improves
      mechanistic reasoning and, consequently, toxicity prediction performance. Together, these
      results underscore the necessity of integrating reasoning into both evaluation and training
      for trustworthy toxicity modeling.
