      domain, existing surgical vision-language datasets lack in capturing and evaluating complex,
      interleaved spatial-temporal dynamics. Creating large scale datasets that accurately represent
      fine-grained spatial-temporal relationships in surgical videos is challenging due to costly
      manual annotations or error-prone generation using large language models. To address this gap,
      we introduce the SurgSTU-Pipeline, a deterministic generation pipeline featuring temporal and
      spatial continuity filtering to reliably create surgical datasets for fine-grained
      spatial-temporal multimodal understanding. Applying this pipeline to publicly available
      surgical datasets, we create the SurgSTU dataset, comprising 6711 video clips densely extended
      with 150k fine-grained spatial-temporal question-answer samples. Our comprehensive evaluation
      shows that while state-of-the-art generalist VLMs struggle in zero-shot settings, their
      spatial-temporal capabilities can be improved through in-context learning. A fine-tuned VLM on
      the SurgSTU training dataset achieves highest performance among all spatial-temporal tasks,
      validating the dataset's efficacy to improve spatial-temporal understanding of VLMs in
