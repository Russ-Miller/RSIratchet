    abstract: "Does the door-in-the-face technique work on language models? In humans, a large request
      that is refused makes a smaller follow-up request more likely to be granted. We test this on
      nine production models from three providers: each model refuses a large request, then receives
      a smaller version of the same request, and we compare its compliance with asking directly. The
      answer depends on the model. On Anthropic's frontier models the technique works: Opus 5
      answers the smaller request 65.8% of the time after refusing the larger one, against 29.3%
      when asked directly. On the frontier models of OpenAI and Google, and on Haiku 4.5, it
      backfires, lowering compliance by 15.5 to 23.0 points. A control locates the effect: a refused
      large request on an unrelated topic does less than the related one on all nine models, so the
      concession itself matters everywhere, while the reaction to having just refused something
      differs by model family. The technique does not transfer to refusals drawn from public
      benchmarks. What decides whether a retreat can work is what the request asks for: rewriting
      265 refused requests for usable instructions into requests for explanations of the same topic
      removed the refusal in 263 cases. Human influence techniques port to language models one model
      family at a time."
