      large language models (LLMs) retrieve and synthesize into distorted answers. No existing
      benchmark evaluates defenses against this threat under controlled conditions. Therefore, we
      present Counter-GEO-Bench, a defense benchmark that pairs 247 human-verified, quality-gated
      queries with information-preserving and information-distorting GEO rewrites, and evaluates
      defenses on attack success rate (ASR), false positive rate, and answer quality across three
      victim LLMs. Under Counter-GEO-Bench, three off-the-shelf defenses (Granite Guardian, Llama
      Guard 3, and NeMo Self-Check Fact-Checking) reduce ASR by at most 5.7% relative, while Granite
      Guardian's reduction is not statistically significant. Safety-taxonomy guardrails target
      policy violations, while GEO misinformation passes through them as fluent informational
      content. To this end, a lightweight benchmark baseline, C-GEO Guard, is proposed, reducing ASR
      by 47.6% relative with near-zero utility loss, which proves threat tractable.
