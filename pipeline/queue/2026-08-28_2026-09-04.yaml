    abstract: "Existing Human-Robot Interaction (HRI) literature has focused on identifying and
      structuring errors, failures, conflicts, and knowledge issues (called in this work as
      contradictions) in domain-specific dialogue-based interactions. However, there is still lack
      of a formal computational framework to represent and define these contradictions,
      interoperable and usable across HRI and human-agent interaction (HAI) domains. Thus, this
      research project aims to capture, represent, and evaluate the notion of (1) dialogue-based
      collaborative interaction and (2) related contradictions in a foundational ontology.
      METHONTOLOGY, a systematic approach to build domain-independent ontologies was applied. In the
      conceptualisation stage of the presented ontology, concepts and models from Activity Theory
      were used. Preliminary results presented in this short article are: (i) Natural language
      definitions of dialogues and related contradictions in HRI, (ii) Set Theoretic definitions of
      dialogues and contradictions, and (iii) First Order Logic (FoL) formulation of the
      contradiction concepts and three novel principles guiding dialogue-based interactions between
      humans and robots. In summary, we report on ongoing work to develop a foundational ontology
      based on Activity Theory called Activity Theory-based foundational ontology (ATFOt) to capture
      and represent the notion of contradictions in HRI."
