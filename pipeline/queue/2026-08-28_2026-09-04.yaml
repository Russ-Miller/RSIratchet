    abstract: 'Named Entity Recognition (NER) has achieved substantial progress since the advent of
      large language models (LLMs). Nevertheless, the recognition of long-tail and domain-specific
      entities remains challenging due to the deficiency in parametric knowledge.
      Retrieval-augmented generation (RAG) offers a promising remedy by injecting external
