    abstract: "Mixture-of-Experts (MoE) is a scaling architecture for large language models that
      activates only a small subset of expert modules per token, enabling massive parameter growth
      with nearly constant computation. Recent Hybrid MoE architecture adds \\textit{shared experts}
      to capture consistently useful representations, further improving stability and
      generalization. MoE now powers many flagship open-source and commercial models, yet remains
      vulnerable to adversarial attacks. Specifically, sparse routing introduces a structural
      vulnerability: MoE safety hinges on which experts are activated, and adversaries can subvert
      this selection through jailbreak prompts, malicious fine-tuning, and weight-level pruning of
      safety-critical neurons. Existing defenses primarily focus on hardening the router, but an
      adversary may still manipulate or bypass the routing trajectory due to the routing process's
