      these properties later generalise. We introduce Inoculation Midtraining, a technique that
      teaches a base model that unsafe behaviour belongs to a designated context, as indicated by
      the neologism (a new token) introduced during midtraining, and then post-trains the model on
      unsafe data within that context. We then evaluate the model outside the context, with the
      neologism excluded from the system prompt. Across supervised fine-tuning and reinforcement
      learning post-training regimes, we find that Inoculation Midtraining can reduce misalignment
      while preserving the transfer of benign data properties (e.g., speaking in German or
      Shakespearean prose). However, our approach does not outperform standard Inoculation
      Prompting, is sensitive to training configuration, and produces a leaky boundary that nearby
      contextual cues can reactivate. These results show that inoculation with a learned association
