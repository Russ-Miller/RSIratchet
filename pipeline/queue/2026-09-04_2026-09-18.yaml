      handles prompt data before, during, and after inference. We examine four boundaries at which
      prompt confidentiality can fail in consumer local-LLM serving systems: model loading, runtime
      memory, wrapper-level persistence, and the serving interface. To study these boundaries, we
      develop LLAnalyzer, a measurement framework that tests each boundary separately and traces
      observed failures to the responsible software component. Applying LLAnalyzer to four
      open-weight model families and two consumer deployment platforms, we find markedly different
      behaviour across boundaries. In a 24-hour AFL++ campaign with more than 12 million executions,
      we observe no parser crashes or successful malformed GGUF loads within the explored state
      space. Runtime memory tells a different story: we recover prompts after inference because
      multiple plaintext representations survive in allocator-managed memory, and sanitisation
