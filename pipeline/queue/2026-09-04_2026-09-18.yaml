      sparse expert activation. This property makes MoE-based LLMs particularly attractive for
      resource-constrained distributed environments. However, federated fine-tuning of MoE-based
      LLMs remains challenging under heterogeneous client data. Since clients often correspond to
      different task preferences, directly aggregating their local updates may weaken expert
      specialization and introduce conflicting update directions on shared experts. To address these
      challenges, we propose FedTAR, a task-aware federated fine-tuning method for MoE-based LLMs.
      FedTAR establishes the association between local updates and task preference via routing
