    abstract: "Safety alignment teaches large language models (LLMs) to recognize harmful requests and
      reject risky instructions. Yet aligned models can fail when harmful intent is concealed within
      seemingly benign contexts. Robust safety therefore requires both knowledge of safety
      boundaries and \\textbf{vigilance}: the ability to detect unusual premises, misleading
      reasoning, and latent risks beneath surface-level semantics. Vigilance requires models to
      scrutinize a request's underlying intent and assumptions before acting. To cultivate this
      capability, we introduce \\textbf{cunning questions}, which are not necessarily safety-related
      but contain misleading premises, atypical reasoning, or subtle inconsistencies. We hypothesize
      that learning to look beyond such reasoning traps can transfer to safety-critical scenarios.
      Experiments show that Cunning training improves robustness to out-of-distribution jailbreak
      attacks and strengthens subsequent safety fine-tuning. Furthermore, augmenting an existing
