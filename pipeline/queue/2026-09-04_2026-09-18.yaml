      \emph{output-mode gap} (OMG). To reduce OMG, we propose \emph{Joint-Output On-Policy
      Distillation} (JO-OPD), which distills the model's stronger S2T policy into joint generation
      using student-generated S2TS trajectories. At each text position, the S2T teacher provides
