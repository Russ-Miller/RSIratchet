      outputs. Existing alignment methods, while effective, are costly and tightly coupled to the
      model, limiting flexibility and scalability. We propose a modular correction framework that
      augments pretrained LLMs with Activated LoRA (aLoRA) adapters and a context-aware routing
      mechanism to eliminate harms from misaligned model responses. Our approach enables expert
      adapters to activate mid-sequence without invalidating the KV cache, allowing low-latency,
      targeted correction during generation. Each expert is trained to detect and mitigate specific
      harms, such as bias or toxicity. A learned router dynamically selects appropriate experts
