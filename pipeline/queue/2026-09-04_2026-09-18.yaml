    abstract: "Modern networked control systems (NCSs), cyber-physical systems (CPSs), and complex
      multi-agent network systems (CNSs) increasingly rely on large language models (LLMs) for
      high-level decision-making. However, the slow, stochastic nature of LLMs directly conflicts
      with the strict stability and safety guarantees required by these physical systems. This
      survey presents a unified analysis of how LLMs can be admitted into the control loop of NCS,
      CPS, and CNS without compromising closed-loop guarantees. We organize this around a core
      principle: the LLM operates as a slow supervisor adjusting high-level goals and constraints,
      while a fast, certified inner loop maintains physical stability. Under this framework, LLM
      integration maps directly to classical networked control challenges, where inference latency
      acts as delay, API failures as packet dropouts, tokenization as quantization, and
      hallucinations as bounded disturbances. We assess current developments across all these three
      domains, highlighting that rising model capabilities are frequently accompanied by a drop in
      formal safety assurances. Finally, we propose concrete future research directions, identifying
      the widespread lack of formal stability proofs as the field's central open problem."
