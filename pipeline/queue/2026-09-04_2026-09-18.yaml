      ensuring reliable execution in modern physics engines. We present a unified framework for
      generating physically consistent dynamic 3D scenes from text, with outputs directly executable
      in Unreal Engine. Central to our approach is the \\emph{Evolutive Scene Graph} (ESG), which
      specifies entities with physical attributes, spatial relations, and event-driven timelines in
      a machine-checkable form. Given a prompt, a large language model constructs and validates a
      complete ESG; spatial layouts are grounded via energy-minimized gradient optimization;
      timeline-constrained physical parameters are then optimized through differentiable simulation
