    abstract: Industrial IoT environments increasingly deploy autonomous mobile robots for tasks such as
      material handling, product assembly, or infrastructure inspection. In such deployments,
      collaborative perception enables robots to share LiDAR observations and collectively construct
      a richer model of their environment than an individual agent could produce alone. However,
      industrial environments are dynamic spaces where robot positions shift continuously, network
      bandwidth fluctuates, and the marginal contribution of robots to perception quality varies at
      runtime. Existing collaborative perception approaches are designed for static participation
      assumptions and cannot adapt to these dynamics without sacrificing either detection precision
      or communication efficiency. This paper presents CoAdapt, an adaptive collaborative perception
      framework for IIoT robotic swarms in which a Large Language Model (LLM) serves as a runtime
      fusion controller, jointly deciding which robots participate in the fusion process and which
      fusion algorithm to apply based on the current spatial configuration and network state. The
      LLM reasons over structured natural language descriptions of the scene derived from raw LiDAR
      point clouds, requiring no taskspecific training and generalizing to unseen swarm topologies.
      Evaluated on the OPV2V benchmark across 25 scenarios, our approach achieves a 38% reduction in
      communication cost while maintaining detection precision comparable to static baseline
      approaches.
