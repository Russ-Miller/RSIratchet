      state values, estimated from multiple Monte Carlo continuations, change sharply across
      intermediate states while critic predictions remain comparatively flat. We further observe
      this phenomenon in a controlled FrozenLake environment and find that it becomes more
      pronounced as the state space grows. Our theoretical and empirical analyses relate Value
      Flattening to an implicit variance penalty in the critic loss and redundant updates from
      temporally correlated states with similar gradients. Motivated by these findings, we introduce
