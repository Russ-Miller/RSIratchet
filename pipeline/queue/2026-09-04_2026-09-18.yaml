      inference. We introduce information set emulation: an AI typed lift attaches source evidence,
      clinical and recording times, decision-time availability, representation version, proposed
      causal roles, and unresolved ambiguity to extracted features under a locked target trial.
      Causal certificates record auditable evidence for those roles. Features with unresolved
      downstream roles are routed to compatible reporting or separate analyses. Typed evidence
      defines an observational fiber of causal worlds consistent with the observed law. The locked
      scalar estimand maps this fiber to a compatible image whose squared Chebyshev radius equals
      the residual minimax mean squared error when the image is nonempty and compact. This classical
      identity provides a target-specific measure of information ambiguity. The contribution is its
      integration with a joint EHR observation map and an auditable certificate architecture. Under
      explicit exchangeability, positivity, and nuisance-consistency conditions, we give
