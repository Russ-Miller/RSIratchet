      two-dimensional study of 802 MCP-related publications and 33,319 GitHub repositories. We
      characterize their growth and identify their application domains via BERTopic and usage
      contexts via a human-validated GPT-5.6-Luna classifier. We find that publications and
      repositories began rapid growth within a month of each other in 2025, and peaked together in
      March 2026. Notably, a second growth wave alone accounts for 49.5% of the GitHub repositories.
      Most publications (57.8%) and nearly all repositories (93.7%) use MCP as an enabling
      technology rather than for analyzing, evaluating, extending, or securing it directly. Among
