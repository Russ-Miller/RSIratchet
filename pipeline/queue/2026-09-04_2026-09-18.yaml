      or extra model calls. Inference-time correction uses the model's internal logit signals, but a
      fixed transformation need not suit every question. A corrector that improves accuracy by about
      ten percentage points on a truthfulness stress test yields negligible gains on clinical
      multiple-choice benchmarks, where instruction tuning concentrates output probability on one
      answer and leaves low terminal entropy. We introduce ALTAS, which reads terminal entropy and
      late-layer linearity ($R^2$) from one forward pass to choose per question between greedy
      decoding and late-layer trajectory correction. No classifier, probe, or head is trained; the
      router operates on candidate-answer logits and adds 6.5% latency overhead. Applied to every
      question, the correction improves TruthfulQA over greedy at 3B and 8B by 11.4 and 10.0
      percentage points, respectively ($p<10^{-10}$). Gated per question, ALTAS retains gains of 8.3
