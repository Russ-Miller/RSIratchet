      following, mathematics, reasoning, and writing. Each response is scored by nine human
      annotators and is evaluated three times by each LLM judge using the same rubric. We compare
      the judge scores with the average human scores using Pearson correlation, Spearman
      correlation, mean absolute error (MAE), signed bias, and self-consistency. LLaMA-3-8B shows a
