      policy loopholes and show that affected tasks produce unreliable scores: they lower scores
      across different models in different ways and make every model less consistent across repeated
      trials. A cross-domain comparison reveals that exploitability requires both policy ambiguity
      and tool permissiveness: when policy complexity exceeds what tools can enforce, agents resolve
      gaps inconsistently and scores become unreliable. Policy specification quality sets the
      ceiling on evaluation quality. Benchmark developers should audit policies before collecting
      gold annotations."
