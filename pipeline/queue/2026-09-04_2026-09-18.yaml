      cybersecurity evaluations primarily measure whether they can detect, reproduce, or repair
      vulnerabilities rather than whether they can locate the relevant code. We study vulnerability
      localization: given a weakness class and an unfamiliar repository, identify the implementation
      files associated with that weakness. We introduce the Vulnerability Localization Benchmark
