      or probabilities, making them inapplicable in practice to proprietary LLMs that expose only
      textual continuations. To address this underexplored setting, we propose Word-level
      Probability MIA (WPMIA), a statistically principled MIA for strict black-box privacy auditing.
      WPMIA estimates word-level generation probabilities via Monte Carlo sampling with local kernel
      smoothing, then aggregates these estimates into a sequence-level likelihood estimator.
      Furthermore, WPMIA constructs the likelihood conditioned on different prefixes, thereby
      amplifying the distributional differences between members and non-members. We evaluate WPMIA
      across various open-source LLMs and find that it consistently outperforms existing black-box
      baselines. Importantly, we also evaluate WPMIA on modern proprietary LLMs, including
