      integrates memory-based retrieval with a dynamic policy generator, leveraging historical data
      and environment feedback to produce task-specific policies for continual LLM improvement. We
      evaluate DRPG across six benchmarks spanning text-to-SQL, question answering, medical
      diagnosis, and Python programming, using seven LLMs from both proprietary and open-weight
      families. DRPG outperforms strong baselines across most datasets and models. Further analysis
      demonstrates that DRPG's policy generation is robust to retrieval strategy, operates
      effectively without prior policy continuity, and can leverage smaller or cross-family models
      as cost-efficient policy generators. We also find that the benefit of policy-level guidance
      depends on task characteristics, offering practical insights into when and under what
      conditions this mechanism is most effective.
