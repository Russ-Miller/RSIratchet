    abstract: "Large language models reason in high-dimensional hidden-state spaces, while users observe
      only final outputs. We introduce Bypass Observation, a non-intrusive layer-wise readout
      architecture that attaches read-only observation heads to selected Transformer layers without
      feeding their outputs back into the backbone. We consider three variants: a shared LM head
      across layers, layer-specific heads, and a layer- or step-adaptive head. For full-vocabulary
      readout, we derive a closed-form overhead approximation governed primarily by V/(12d), with
      representative estimates ranging from about 30% to 240%, and discuss cost reductions via
      sparse observation, low-rank factorization, reduced vocabularies, top-k readout, and selective
      positions. We argue that Bypass Observation can make model computation more observable while
      remaining only a partial, potentially misleading projection of hidden states. We further
      distinguish bypass chain-of-thought from conventional chain-of-thought: conventional reasoning
      tokens enter the autoregressive computation, whereas bypass readouts remain causally external
      at inference time, although they can still provide training signals in reinforcement learning.
      Finally, we discuss applications to looped and recurrent-depth Transformers, where
      iteration-wise readout may expose convergence, oscillation, and potential halting signals. The
      proposal is conceptual and analytical; systematic empirical validation remains future work."
