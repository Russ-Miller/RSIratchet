      well-separated states in each response to mitigate both effects. Experiments on Qwen3-Base
      show that SP$^3$O with only three states supervised per response can mitigate Value Flattening
      and consistently improve the learned policy across model sizes and evaluation suites.
      Together, our results identify Value Flattening as an important yet overlooked failure mode of
      critic learning in standard PPO and show that a simple sparse supervision strategy can
      mitigate it."
