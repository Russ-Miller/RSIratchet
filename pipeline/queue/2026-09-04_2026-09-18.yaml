      LoRA and other adapters to all layers at once---where layer selection often relies on
      heuristic rules---we focus on the vision encoder and directly evaluate the \"adaptability'' of
      each Transformer layer. Specifically, we characterize each layer from two perspectives: (i)
      the statistical properties of its Q/K/V projection weights (e.g., norms and condition
      numbers); (ii) robustness under controlled parameter perturbations. We then systematically
      compare these indicators with the downstream performance gains brought by applying PEFT to a
      single layer. Across experiments covering seven benchmarks and five PEFT variants, we observe
