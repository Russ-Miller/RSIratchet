      skills, and operating procedures-continues to evolve to support increasingly sophisticated
      interactions. These changes create two practical challenges: 1) Demand drift alters the
      distribution, intent, and complexity of user requests, causing a model trained once to fall
      behind; 2) Harness evolution requires the model to use newly introduced capabilities correctly
      without losing behavior that users already rely on. Periodic manual retraining is too delayed
