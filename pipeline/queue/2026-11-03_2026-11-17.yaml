      unique models. To enable comparisons across heterogeneous agent interfaces, we develop a
      rule-based parser that maps raw execution traces to high-level actions such as repository
      search, file editing, and test execution, and audit its predictions against a six-model
      consensus reference on 500 events. We find that agents with similar solve rates can
