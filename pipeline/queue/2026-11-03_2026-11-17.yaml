      action from a compact strategy space via evolutionary-inspired learning dynamics, and a
      generation layer, where the LLM produces a concrete passage conditioned on that strategy and
      the debate context. On four fact-checking benchmarks (FEVER, HealthVer, CLIMATE-FEVER, and
      SciFact), D2D substantially outperforms existing attacks and evades most defenses.
