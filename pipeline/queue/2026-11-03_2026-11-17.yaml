      MementoHLS combines an Executable Repair Contract Library (ERCL), which converts cross-task
      HLS knowledge into evidence-gated repair actions, with a Reviewer-Grounded Falsification
      Ledger (RFL), which converts task-local repair history into trajectory evidence to suppress
