    abstract: Scientific literature search can benefit from locally deployed LLM assistants, which
      reduce reliance on hosted model providers while giving research teams greater control over
      their data and infrastructure. This work investigates whether open-weight models can support
      web-assisted paper retrieval under practical computing constraints. We first characterize
      inference latency as the input context grows from 512 to 128k tokens on a Mac Studio and a
      server equipped with two NVIDIA A100 GPUs. We then evaluate eight models on the retrieval of
      70 papers from seven scientific repositories, using queries that represent three levels of
      domain knowledge. The results show that retrieval success depends strongly on the selected
      model and the specificity of the query. And that A100 GPUs are generally faster than the Mac
      Studio, but its unified memory allows larger models that could not be loaded in the tested GPU
