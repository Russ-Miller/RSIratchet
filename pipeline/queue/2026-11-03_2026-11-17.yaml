    abstract: High-level behaviors such as sycophancy and hallucination correspond to directions in a
      model's activation space (Chen et al., 2025). These directions, known as persona vectors, can
      suppress undesirable traits either at inference time, subtracting the vector during
      generation, or through preventative steering, adding the vector during fine-tuning, so the
      optimizer never needs to encode the trait in weights, then removing the vector at evaluation.
      Chen et al. (2025) recommend preventative steering because it preserves Massive Multitask
      Language Understanding (MMLU) accuracy, but validations of this recommendation have measured
      capability alone. We primarily evaluate results on preventative steering of sycophancy and
      hallucination vectors on three models, measuring three safety benchmarks alongside trait
      expression, coherence, and MMLU. Our findings show that preventative steering still changes
      refusal behavior, but by an amount that depends on the trait and does not establish that
      preventative persona steering is safety-neutral, and steering methods should be evaluated on
