      measure that serves as a proxy for the amount of unverbalized serial cognition a model can
      perform, as a specific instantiation of the notion of opaque serial depth: roughly, the length
      of the longest path through a model's computation that does not pass through an interpretable
      bottleneck. Our main contribution is a particular standard for what counts as such a
      bottleneck. We define natural-language-rooted (NL-rooted) nodes as nodes that were initialized
      from a pre-training prior to produce human-understandable outputs, whose output space has not
