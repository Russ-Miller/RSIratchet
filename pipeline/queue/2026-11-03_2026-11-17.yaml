      paradigm, where agents depend on their intrinsic vision to execute visually grounded tasks.
      However, this architectural coupling introduces a fundamental bottleneck. Agent performance
      remains strictly bounded by internal perceptual limitations. Furthermore, text-only agents
      lack native perception. Without specialized tools, they cannot perform visual reasoning. To
      overcome these constraints, we introduce the Vision-as-a-Tool (VaaT) paradigm. Prior visual
      tool-use merely manipulates images for an agent's intrinsic vision to read. In contrast, VaaT
      reframes general-purpose multimodal large language models (MLLMs) as callable external
      utilities. As a result, text-only agents can completely offload visual reasoning during
