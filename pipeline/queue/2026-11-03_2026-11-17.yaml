      and inference compute. We synthesize nine primary empirical evaluations comprising 516 unique
      multi-agent configurations organized along a resource vector R with six dimensions and a
      baseline ladder with four categories. Against baselines with a single pass (Category A),
      multi-agent accuracy differences are negative overall and near zero when omitting the largest
      contributing study. When evaluated against baselines matched on sample count (Category B) or
