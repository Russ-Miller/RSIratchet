      injection and single-agent self-reflection -- lack robustness across diverse defenses and are
      prone to confirmation bias and costly trial-and-error, respectively. We propose
      Debate-to-Deceive (D2D), a multi-agent debate framework grounded in human debate structure and
      rhetorical style, enabling agents to generate adversarial passages that are semantically
      coherent, rhetorically effective, and resistant to early confirmation bias. D2D formalizes the
      adversarial process as an evolutionary game in which agents adaptively evolve their rhetorical
