      powerful pretrained VLMs on robotics data, yet it is unclear how much commonsense and factual
      knowledge they retain after adaptation. Failures on knowledge-sensitive tasks are ambiguous,
      conflating missing knowledge with poor generalization of low-level control. We introduce
      Act2Answer, a lightweight protocol that adapts VLM knowledge benchmarks to VLA evaluation by
      requiring agents to answer through action. Each question becomes a short tabletop episode
      where the agent performs a single object-placement action to select among candidate answers,
      yielding an action-grounded success rate with reduced control confounds. We curate a test
      suite of such environments across diverse commonsense and world-knowledge categories and
      introduce layerwise intent probing to localize answer-relevant information across the VLM
      backbone and action head. In a large-scale study of 7 VLA models and 9 VLM baselines, we
      systematically rank models across categories, finding that VLAs show solid performance on
      simple concepts while exhibiting larger gaps on richer semantic categories relative to their
      source VLMs, that VQA co-training is associated with better knowledge retention, and that
      answer-relevant signals peak in middle VLA layers but attenuate in upper layers. Act2Answer is
      available at https://tttonyalpha.github.io/act2answer/.
