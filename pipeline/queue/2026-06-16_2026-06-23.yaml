    abstract: High-stakes reasoning tasks necessitate transparent and verifiable workflows, yet
      conventional single-model large language models (LLMs) often struggle with hallucination and
      low interpretability under zero-shot paradigms. To address this general AI challenge, we
      propose a Multi-Agent Audit Framework that simulates a collaborative, multi-step verification
      process. We empirically validate this architecture in the sensitive domain of clinical mental
      health screening using a modular LangChain workflow. Our framework decomposes the reasoning
      process into a Perception Agent, Knowledge Retrieval-Augmented Generation (RAG),
      Chain-of-Thought (CoT) clinical inference, and a critical Audit verification stage. We
      evaluated this framework on the DAIC-WOZ dataset using locally deployed open-source models.
      Experimental results demonstrate that our multi-agent pipeline significantly outperforms
      single-agent baselines, reducing the Mean Absolute Error (MAE) for PHQ-8 depression severity
      prediction from 5.35 to 5.02. By exposing cross-agent validation traces, the framework
      mitigates reasoning drift and provides highly interpretable diagnostic rationales, offering a
      generalizable paradigm for reliable AI-assisted decision support beyond isolated model
      scaling. We make data and code open access on GitHub for replicability.
