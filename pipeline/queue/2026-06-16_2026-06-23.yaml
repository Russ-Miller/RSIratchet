      introduce moBERTo, a Portuguese adaptation of ModernBERT obtained through continued
      pretraining of the ModernBERT-base checkpoint on 60 billion tokens (5 epochs over a
      12-billion-token corpus curated from FineWeb2 and filtered with educational and STEM
      classifiers). We preserve the original architecture, including rotary positional embeddings,
      alternating local-global attention, flash attention, and unpadding. We evaluate moBERTo across
      information retrieval (including long-context retrieval at up to 8,192 tokens), document
      classification, named entity recognition, and natural language understanding. Our best
      variant, which combines a Portuguese tokenizer with subword-matching embedding transfer and
      long-context post-training, achieves the highest average reranking nDCG@10 across three
      Portuguese retrieval benchmarks and the best results on PLUE-PT. Through ablation studies, we
      show that (i) continued pretraining is strongly preferable to training from scratch,
