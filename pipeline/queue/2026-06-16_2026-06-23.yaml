      progressively ignore defensive constraints. Guided by this insight, we propose AREA, a
      practical defense that re-anchors the model's attention using an optimizable soft prompt.
      Experiments and real-world case studies show that AREA matches the leakage resistance of
      state-of-the-art defenses while improving average usability by over 33% and reducing
      optimization overhead by nearly 3x. Our responsible disclosure led two affected vendors to
      classify these leaks as medium-severity vulnerabilities.
