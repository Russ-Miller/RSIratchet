    abstract: Occlusion-robust scene recovery remains a major challenge in computational imaging,
      particularly where dense vegetation severely limits visibility. We propose a
      visionreasoning-guided light field occlusion removal framework combining light field
      integration (LFI) with vision-language model (VLM) semantic reasoning. Multi-view observations
      are first integrated via LFI to suppress foreground occlusions, producing an initial
      visibility-enhanced representation, a VLM then acts as a conditional semantic prior to restore
      degraded structures and fine details. A multi-sample fusion strategy aggregates multiple
      generated hypotheses to improve consistency and reduce hallucination. Experimental results on
      synthetic and real-world datasets show state-of-the-art performance, achieving the highest
      average SSIM across four synthetic benchmark scenes (4-Syn) and strong generalization across
      structured and unstructured acquisition settings, with applicability to search-and-rescue and
      exploratory robotic navigation.
