      iterative refinement. Technically, we enhance the Group Relative Policy Optimization (GRPO)
      framework by introducing an adjustable inter-group comparison reward, which mitigates the
      "direction blindness" issue of standard GRPO and enables the model to better distinguish
      varied-quality edits. VlogReward achieves state-of-the-art results that significantly
      outperform existing MLLMs, including GPT-5 and Gemini-3-Pro. We hope that our study can help
      vlog creators and foster automated vlog evaluation and refinement systems.
