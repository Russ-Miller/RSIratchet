      accelerating training under constrained budgets, they are less suited to elevating the
      capability upper bound. The challenge here is no longer to identify a smaller subset that
      preserves performance, but to refine the data distribution toward instances most capable of
      improving the final model. To address this problem, we explore instance-level data attribution
      using Influence Functions (IF). We identify that standard IF formulations struggle in this
      setting due to two structural limitations: a proximity gap caused by off-policy validation
