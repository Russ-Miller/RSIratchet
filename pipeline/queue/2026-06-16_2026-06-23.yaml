      and developer-defined constraints, making these prompts important intellectual property.
      However, system prompts are vulnerable to prompt leaking attacks. Although prior work has
      shown such attacks in controlled settings, their prevalence, causes, and defenses in
      real-world deployments remain unclear. This paper presents a systematic study of prompt
      leaking in real-world LLM-based applications. We measure 1,200 applications across six major
      commercial platforms and find that over 80% of deployments leak system prompts under realistic
      adversarial queries, sometimes exposing sensitive information such as third-party API keys. We
      also show that existing defenses often fail to prevent leakage without degrading usability. To
      explain these failures, we conduct an attention-level mechanistic analysis and identify
