      reusable knowledge, and without external supervision or access to future data. We show that
      In-Context Learning (ICL) over raw reasoning traces fails to generalize, reflecting a
      fundamental limitation of token-level reuse: individual traces lack the abstraction needed for
      transfer, even after refinement (e.g. self-reflection). In contrast, drawing inspiration from
      recent works on unsupervised reinforcement learning, we find that lightweight per-instance
