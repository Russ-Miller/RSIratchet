      While significant progress has been made in using state-of-the-art Auto-Regressive (AR) LLMs
      for formal theorem proving, these models suffer from inherent limitations. Their next-token
      prediction generation methods may yield suboptimal performance due to the challenges of
      long-range coherence and the compounding of errors over long sequences. Recent advancements in
      diffusion LLMs (dLLMs), which generate text through iterative denoising of a multi-token
      block, offer a promising alternative. However, the application of dLLMs to formal mathematics,
