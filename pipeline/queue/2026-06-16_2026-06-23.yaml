    abstract: Large Audio Language Models (LALMs) achieve strong performance on a variety of audio
      understanding tasks but continue to struggle with temporal reasoning, a fundamental capability
      central to human auditory perception. Understanding the causes of these failures remains
      challenging as existing benchmarks report performance gaps without probing underlying
      mechanisms. To address this, we introduce a benchmark with 1,657 questions across three
      foundational tasks designed specifically for mechanistic analysis. Examining model outputs
      across varying input settings (behavioral analysis) reveals that models often under-utilize
      audio when textual cues are available. We also provide the first causal mechanistic analysis
      of temporal reasoning failures in LALMs. Comparing attention upweighting against scaling, we
      find that redistributing attention across audio tokens is more effective than increasing audio
      attention. Targeting task-relevant tokens yields further gains. These findings suggest that
      modality imbalance alone cannot explain failures. Attention scaling at bottleneck layers
      improves accuracy from 55.9% to 59.1% without fine-tuning, demonstrating a promising direction
      for future work.
