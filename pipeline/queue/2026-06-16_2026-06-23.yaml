    abstract: "Knowledge distillation transfers a teacher's competence to a small student but is brittle
      in the small-student regime: forcing the student to imitate logits from a much larger teacher
      hurts generalization on benchmark families beyond the training corpus. Reinforcement learning
      (RL) avoids logit imitation by training on the student's own rollouts. However, on questions
      where every rollout fails - yielding zero advantage and being silently discarded - injecting a
      stronger teacher's response into the policy gradient breaks the on-policy assumption and
      induces drift. We introduce Zone of Proximal Policy Optimization (ZPPO), inspired by
      Vygotsky's zone of proximal development. ZPPO keeps the teacher inside the prompt rather than
      the policy gradient. On hard questions, where the student's mean rollout accuracy is below
      half, ZPPO constructs two reformulated prompts. A Binary Candidate-included Question (BCQ)
      pairs one correct teacher response with one incorrect student response as anonymized
      candidates the student uses as references. A Negative Candidate-included Question (NCQ)
      aggregates the student's wrong rollouts into a single prompt to surface their shared failure
      modes. A prompt replay buffer recirculates each hard question until it either graduates - the
      student's mean rollout accuracy on it reaches half or more - or is FIFO-evicted under finite
