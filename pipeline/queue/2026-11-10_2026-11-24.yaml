      benchmarks (RMSE $-5.8\\%$), marginally on two, and hurts mean RMSE on the fourth. Third, the
      LLM's stated uncertainty is unreliable; letting the data set the prior scale cuts the harm of
      a wrong center four-fold against a unit-variance prior. A pre-specified external test returned
