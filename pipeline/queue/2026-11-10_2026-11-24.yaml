    abstract: Simulation-based evaluation of embodied models requires calibrated interactions, diverse
      tasks, and explicit execution constraints. We present RoboColiseum, a platform combining
      system identification, composable physics and rendering, and multidimensional benchmarking.
      Recorded-command replay characterizes robot dynamics and object interactions, while a shared
      interface connects rigid and deformable simulation to rendering. Across 22 paired
      real--simulation robot--task configurations, task scores have a reported Pearson correlation
      of 0.9686. Eight evaluation tracks span instruction following, spatial reasoning, general
      manipulation, robustness, dexterous manipulation, precision manipulation, whole-body
      coordination, and execution across robot embodiments. Budget-aware scoring combines task
      progress, resource use, and completion rewards. We report 12 selected Season~I policies and
      all 11 systems on the public Season~II leaderboard, comprising eight Agent systems and three
      VLA policies. Agent2Act connects language models to robot-control execution; the VLA study
      uses mixed-task supervised fine-tuning. The results reveal substantial variation across tracks
      within each evaluation category. RoboColiseum connects simulation development with
      capability-oriented evaluation and provides a foundation for extending robot interactions and
      model assessment.
