    abstract: How much information relevant to predicting the future of a passage (i.e. predictive
      information) is carried by the preceding text, and how is this information distributed along
      that history? These questions are fundamental to understanding both the statistical structure
      of language and what large language models (LLMs) can learn about it. Indeed, LLMs trained to
      predict the next token in text must exploit this predictive information, so its organization
      determines how the structure of language becomes available to the model to learn. We develop a
      theory for the organization of predictive information based on the scaling behavior of a
      family of information measures, and the theory predicts that if this organization has the same
      form at all measured length scales -- i.e., it has a self-similar structure -- then the
      information measures evaluated at different lengths collapse onto a common form. We observe
      this scaling collapse in long text documents, showing that predictive information is present
      at every length scale we measure and has a self-similar structure. Self-similarity is a
      considerably stronger property than showing the existence of long-range dependencies, and it
      constrains the process generating the text. More broadly, our results give quantitative
      support to the empirical observation that conditioning on more distant text continues to
      reveal new structure in language to LLMs.
