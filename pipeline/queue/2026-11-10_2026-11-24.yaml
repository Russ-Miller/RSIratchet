    abstract: Recent work shows that large language models (LLMs) can reason directly about the weights
      of other neural networks. Given only a natural-language objective, an LLM can inspect a
      model's weights, understand what they compute, and edit them directly without gradient-based
      optimization. This capability, termed weight-space programming (WSP), has been used to improve
      model performance on math reasoning, medical QA and other benchmarks. We propose
      TrojanMaxxing, a novel strategy to backdoor vision-language models (VLMs), by reframing it as
      a WSP task. We use Claude Opus 5.5 and Mythos 5.2 agents to backdoor VLMs without any
      optimization or training methods. The agents inspect the model weights, apply targeted edits,
      and co-design an imperceptible visual trigger that activates the backdoor. We then study the
      agents' strategies and present a thorough evaluation of the trojaned models on various
      benchmark datasets. TrojanMaxxing achieves attack success rates of 93%-100% on content
      moderation and 78%-100% on OCR while maintaining clean accuracy. Perhaps most consequentially,
      we show that injecting backdoors in a training-free manner is possible by simply, "asking an
      agent to do it".
