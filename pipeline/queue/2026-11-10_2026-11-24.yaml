    abstract: Agents for Image Restoration (IR) aim to leverage Multimodal Large Language Models (MLLMs)
      to autonomously perceive image degradation and invoke IR tools. However, existing IR agents
      typically rely on fine-tuning MLLM parameters to adapt to new IR tasks, leading to
      catastrophic forgetting of IR knowledge. To address this limitation, we propose a
      skill-augmented IR agent, dubbed SIR-Agent, that maintains IR knowledge in a scalable skill
      library and uses Recursive Self-Improvement (RSI) to facilitate efficient skill-library
      evolution. Specifically, we design a Chain Feedback-driven Skill Revision (CFSR) to evolve the
      skill library. The CFSR analyzes restoration chains to identify and revise weak operations in
      existing skills. The compatibility of a revised skill with known tasks decides if it replaces
      the original skill or is appended independently. Furthermore, to advance CFSR's skill-library
      evolution, we present an RSI-driven skill meta-learning mechanism, which identifies CFSR's
      inefficient operations and autonomously refines its revision strategy. Extensive experiments
      across 14 IR benchmarks, covering 6 single-degradation and 8 mixed-degradation scenarios,
      demonstrate SIR-Agent's superior IR performance. Further evaluation on 7 unseen tasks
      validates SIR-Agent's generalization to new IR tasks.
