      these guardrails rely on the residual writing weights to trigger refusals. Based on this
      insight, we propose Cleave, a training-free attack that directly edits these weights to remove
      safety restrictions while preserving general capabilities. With Cleave, malicious users can
      either remove all guardrails or selectively lift only cybersecurity restrictions. Because this
      selective removal retains up to a 99% refusal rate on other harmful requests and avoids weight
      rank collapse, it evades both behavioral spot-checks and static weight audits. Across five
      open-weight LLMs from 7B to 320B parameters, Cleave achieves up to a 67.97% attack success
      rate on seven safety benchmarks, substantially outperforming existing white-box baselines. On
