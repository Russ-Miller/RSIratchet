      generation by up to 24.0 times and compromises up to 66.7% of the targets. To counter this
      threat, we propose a dual-stage defense that combines pre-release subspace diagnostics with
      post-release weight-coupling audits, achieving 100% detection recall at a 1% false-positive
      rate.
