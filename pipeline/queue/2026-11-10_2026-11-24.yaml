    abstract: Chain-of-thought prompting significantly improves the reasoning capabilities of large
      language models (LLMs) but incurs high inference costs due to lengthy autoregressive decoding.
      While previous efficiency approaches reduce costs by discarding tokens or utilizing continuous
      latent representations, these lossy methods fundamentally sacrifice interpretability and
      auditability. In this work, we introduce a novel compression framework for intermediate
      reasoning. We apply Byte-Pair Encoding (BPE) to reasoning corpora to learn a compressed
      vocabulary of Private Use Area (PUA) tokens, each representing frequent semantic spans. After
      expanding the LLM's vocabulary, we fine-tune the model via strictly 1:1, our method is
      lossless. We evaluate our approach on Llama-3.1-8B, Qwen2.5-14B, and Qwen2.5-32B across four
      diverse benchmarks. Our method reduces total generated tokens by 14.7% on average with
      reasoning trace lengths dropping by up to 27.1%, while incurring a negligible average accuracy
      cost of 1.6 percentage points. Crucially, this approach is orthogonal to existing lossy
      methods, allowing practitioners to stack lossless and irreversible compression techniques. We
      demonstrate that a compressed intermediate language provides a highly efficient computational
      resource that accelerates inference while fully preserving the transparency of LLM reasoning.
