      test that gives features the wrong descriptions. First, the models share their errors
      (correlation $0.92$--$0.99$ across draws, vendors and paraphrases): averaging $20$ draws is no
      more accurate than one, and treating draws as independent creates overconfidence. Much of this
      error comes from reporting each feature's effect alone, not with the others held fixed.
