    venue: arXiv
    topic: Explainable Artificial Intelligence (XAI)
    cited_by_count: 0
    abstract: "As the capabilities of large language models keep improving, traditional mechanistic
      interpretability methods struggle to keep pace. In contrast, trainable introspection methods
      emerge as a promising alternative; they repurpose the model itself as a self-diagnostic tool,
      trained to verbalize what it has learned during finetuning in natural language. While training
      on datasets of finetuned experts achieves encouraging results, it currently lacks robustness
      and generalization. Building on the data augmentation framework of MiXup, we introduce WaXup,
      a method that augments the introspection training set through linear interpolation in the
      weight space. This is motivated by the linear mode connectivity property: weight averaged
      experts interpolate the behaviors of the initial experts. We evaluate WaXup on three
      benchmarks: hidden-behavior models, a meta-dataset of real-world NLP tasks and AuditBench, a
      challenging alignment auditing suite of models adversarially trained to conceal their
      behaviors. WaXup improves the accuracy of generated descriptions as well as robustness to
      various distribution shifts. We hope to improve the reliability of trainable introspection
      methods towards better and safer models."
