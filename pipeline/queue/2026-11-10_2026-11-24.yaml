    title: "WaXup: Weight Averaging of Experts as Data Augmentation for Robust Introspection"
    date: 2026-11-20
    arxiv_id: "2611.27353"
    doi: https://doi.org/10.48550/arxiv.2611.27353
    authors:
      - Marc Boëlle
