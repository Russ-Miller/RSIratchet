    abstract: "Long chain-of-thought reasoning improves vision-language models (VLMs), but it also
      exposes a temporal grounding failure: as generation unfolds, models may drift from image
      evidence while reinforcement learning still provides only a final-answer reward. We study this
      gap through visual revisit, a temporally localized reactivation of image evidence during
      reasoning. Across three VLM backbones, revisit peaks are predictive of correctness and
      causally linked to performance: masking them degrades accuracy more than masking non-peaks,
      while injecting revisit-like peaks into failed rollouts partially restores correct answers.
