    abstract: "Text embedding and text generation are two of the most useful capabilities of modern
      large language models, yet they are typically provided by separate specialized models (an
      embedder and a generator) trained with incompatible objectives and deployed side by side in
      retrieval-augmented generation and agent systems. Recent unified embedding-generation models
      such as GritLM share parameters between the two capabilities, but they either switch attention
      regimes between modes or optimize embedding and language modeling as parallel objectives that
      never supervise each other. We argue that these designs are only partially unified: the two
      capabilities coexist on the same weights, but do not shape each other. We propose ULME, a
      post-training framework that unifies embedding and language modeling on a causal decoder-only
      LLM through predictive coupling. ULME inserts a chain of learnable slots between the query and
      the answer, reads a semantic embedding and a reasoning embedding from two designated slots,
      and trains three objectives on a shared causal backbone: a contrastive loss anchoring the
      semantic slot to document representations, a language-modeling loss supervising answer
      generation, and a stop-gradient predictive loss that aligns the reasoning slot with a pooled
      summary of the answer, so that generation actively shapes what the embedding encodes. Across
