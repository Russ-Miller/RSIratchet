      LLMs against fine-tuned encoder-decoder models, using reference-based metrics and
      graph-grounded reference-free LLM-based evaluation validated against human annotations. We
      observed that recent LLMs substantially narrow, and in several settings close, the gap with
      fine-tuned models on reference-based metrics, while performing better on graph-grounded
      metrics. LLM-based evaluation scores show limited correlation with reference-based metrics,
