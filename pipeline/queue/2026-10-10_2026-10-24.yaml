      models (LLMs) could help astronomers make such choices, yet this ability remains underexplored
      in existing benchmarks. We introduce Astro2Method, a benchmark of 500 expert-reviewed binary
      questions from 346 astronomy papers (2024/01-2026/06), based on clear performance differences
      and complete (Easy) or partial (Hard) explanations from the authors. Across five LLMs, direct
      prompting achieves 87.50-92.55% accuracy on Easy questions but only 58.87-64.52% on Hard.
