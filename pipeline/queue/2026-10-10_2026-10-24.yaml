    abstract: "Visual mathematical reasoning can fail before reasoning begins: when a vision-language
      model (VLM) misreads a diagram, subsequent reasoning proceeds from false premises. This
      perceptual bottleneck is especially pronounced in smaller models, while accurate textual
      descriptions can substantially narrow the gap to larger models. Because obtaining such
      descriptions at inference requires additional annotation or model calls, we propose
      minimal-edit corrective on-policy distillation. Using reference figure descriptions and
      verified reference solutions as training-only information, a teacher scores incorrect student
      rollouts under a minimal-edit objective, and only teacher-disfavored tokens contribute to the
      corrective loss. Correct rollouts receive task-reward reinforcement learning. This preserves
      on-policy supervision while avoiding full-response imitation. Across model scales, the method
      requires no descriptions at test time and meets or exceeds the corresponding base model
      supplied with a reference figure description at inference. It also improves
      perception-oriented performance, particularly low-level geometric perception, and transfers to
      external mathematics and perception benchmarks. Because the minimal-edit teacher evaluates
