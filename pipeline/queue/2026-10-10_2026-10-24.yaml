      implemented, as required by international guidelines on trustworthy and responsible automated
      decision-making systems. We propose a novel methodology that combines constraint reasoning
      techniques and Large Language Models (LLMs) to generate contrastive explanations for
      optimisation problems encoded as MIPs. Although LLMs have shown impressive capabilities in
      Natural Language processing, they can produce incorrect answers due to reasoning limitations.
