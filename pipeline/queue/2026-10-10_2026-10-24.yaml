      uncertainty, logit margin, or hidden-state norm. We propose RECAP, a GRPO-compatible training
      method that turns detached revisit traces into a credit-assignment signal. RECAP uses
      revisit-conditioned advantage estimation, dynamic discounting, and gated value prediction to
      propagate final rewards through visually important reasoning steps, without extra rewards,
