    abstract: When a mesh reconstructed from aerial remote-sensing imagery disagrees with reference
      geometry, deciding what to change requires a diagnosis of the reconstruction process. We
      present GeoPilot, a workflow that turns diagnostics and prior observations into executable
      program or camera-configuration interventions. A large language model proposes the change,
      numerical tools reconstruct the mesh, and an external evaluator measures its geometry under a
      stated coordinate and reference protocol. The main case tests a shared-intrinsics hypothesis
      proposed before the comparison. On 224 Metashape-raster development images, shared intrinsics
      improved all six native-coordinate measures and reduced mean surface-to-reference distance by
      7.04%. Reference-assisted alignment fitted and evaluated on separate within-scene checkerboard
      samples reversed the mean-distance ranking, limiting that gain to native-frame delivery. A
      separate matched comparison on publisher-undistorted images favored fixed published cameras on
      all six measures, reducing mean distance by 12.11%; the cameras retain upstream image and
      laser-scanning adjustment information. With one reconstruction per configuration, these
      comparisons provide conditional evidence for camera handling. Three end-to-end runs each
      delivered a mesh and six-metric evaluation from all 327 images of a second development scene.
