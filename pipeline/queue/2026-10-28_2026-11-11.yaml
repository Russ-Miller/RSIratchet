    abstract: Generating accurate CAD models requires substantial engineering expertise and careful
      control of geometry, topology, and mechanical constraints. Text-to-CAD aims to simplify this
      process, but current LLM-based methods often generate CAD programs directly. Language models
      remain unreliable when producing long code while coordinating coupled geometric, topological,
      and dimensional constraints. Consequently, executable programs may still produce structurally
      incorrect models, which execution rate and rendered appearance may fail to reveal. To address
      these limitations, we propose GOPR-CAD, an agentic Text-to-CAD pipeline based on
      Graph-of-Operations Progressive Reasoning. A language model acts as a decision agent over
      encapsulated CAD operations and progressively constructs an executable operation graph, which
      a deterministic compiler converts into the final CAD model. This separation requires no
      additional training and supports different language models. To evaluate structural fidelity,
      we construct MHCAD, a benchmark of 300 standard mechanical part requirements derived from
      Machinery's Handbook. Their explicit structures enable reference-free STEP/B-rep evaluation.
      GOPR-CAD achieves 82.7% Structural Yield on MHCAD, and 87.2% Structural Yield on an external
      CADPrompt subset.
