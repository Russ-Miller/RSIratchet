      level, implicitly treating entire responses as uniformly correct or incorrect. However,
      rejected responses may still contain informative reasoning steps, while preferred responses
      can include subtle errors. In this work, we propose \textbf{P}reference \textbf{O}ptimization
      via \textbf{R}obust \textbf{T}oken-level reweighting \textbf{(PORT)}, a fine-grained framework
