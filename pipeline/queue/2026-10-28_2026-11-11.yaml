    abstract: Machine unlearning in large language models (LLMs) aims to remove specific learned
      knowledge, capabilities, or behaviors while preserving model utility. Existing methods have
      mostly focused on the design of unlearning objectives, while largely overlooking the intrinsic
      matrix structure of transformer weights. In particular, standard optimizers operate on
      independent scalar coordinates, thereby ignoring this matrix structure. We propose spectral
      unlearning, an update framework that combines standard unlearning objectives with
      matrix-structured optimization. We show that the spectral update corresponds to the
      steepest-descent direction for transformers composed of linear layers with normalized inputs
      and outputs. Our approach is applied on top of existing unlearning methods and evaluated
      across complementary axes of memorization, privacy, and utility, summarized via their harmonic
      mean. Spectral unlearning consistently outperforms a broad range of baselines and closes most
