    abstract: "Multimodal Large Language Models (MLLMs) inherit strong textual reasoning capabilities
      from their language backbones and text pretraining, but often fail to apply the same level of
      competency to visual inputs. We show that this degradation cannot be attributed to only
      perception failures, by evaluating models on semantically-equivalent text and rendered-text
      image inputs: models can accurately read text in the images and recover near-text performance
      when provided their own transcriptions, but just cannot reason well on the images directly. We
      characterize this discrepancy as a modality reasoning-access gap, where models fail to route
      perceived visual content into existing reasoning machinery accessible with text. To bridge
      this, we propose TIGER (Text-to-Image Gap-targeted training for Enhanced Reasoning), which
      first mines synthetic modality counterfactuals where a model succeeds on a text problem but
      fails when provided the corresponding rendered image, and post-trains the model on the image
      input via Group Relative Policy Optimization (GRPO), along with SFT and DPO variants.
      Importantly, although trained exclusively on synthetic rendered-text images with no multimodal
      annotations, TIGER results in model performance improvements across diverse real-world visual
