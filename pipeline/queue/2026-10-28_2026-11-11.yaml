      large language models. Latent multimodal reasoning offers a promising route toward this
      capability by interleaving text with continuous visual latent blocks, allowing models to
      maintain internal visual workspaces without decoding them into pixels. In this paper, we ask
      whether these latent visual states actually matter. Through a direct perturbation analysis
      across representative latent-reasoning MLLMs, we find that they often do not: dropping,
      replacing, or shuffling generated visual latents has only minor effects on the model's own
      final-answer probability, while equivalent perturbations to the linguistic reasoning trace are
      substantially more damaging. We call this failure mode Mental Simulation Collapse (MSC): the
