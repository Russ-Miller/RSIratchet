    abstract: Translating historical cultural heritage poses profound challenges for machine translation
      systems due to the acute semantic asymmetry across eras and cultures, where terse classical
      syntax frequently obscures domain-specific cultural knowledge. While Large Language Models
      have demonstrated remarkable prowess in generic translation benchmarks, they struggle to
      negotiate Culturally-Specific Items and diachronic shifts in domain-rich historical texts,
      such as Yellow River cultural records. To bridge this critical gap, we introduce YRC-Bench,
      the first human-curated, multi-parallel benchmark dedicated to historical heritage translation
      across Classical Chinese, Modern Chinese, and nine target foreign languages. YRC-Bench
      establishes a tri-level parallel corpus incorporating modern explanatory glosses as explicit
      semantic bridges and operationalizes translation strategies through paired conserved versus
      substituted CSI variants categorized by cultural translatability. Systematic evaluations of
      nine leading LLMs across bidirectional translation directions reveal that leveraging modern
      Chinese glosses - especially human-curated ones - dramatically elevates both lexical fidelity
      and semantic adequacy. Furthermore, multidimensional human preference audits by native experts
      unveil distinct cross-cultural preferences between Sinographic-tradition and non-Sinographic
      language groups.
