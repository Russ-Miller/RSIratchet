    abstract: Large language models (LLMs) have made substantial progress in mathematical reasoning but
      still produce incorrect solutions to complex problems, indicating the need for more reliable
      self-correction mechanisms. Mathematical self-correction typically identifies errors through
      verification, which can proceed backward or forward. The two directions provide complementary
      verification capabilities. Backward verification checks a candidate answer against the
      original constraints, bypassing complex intermediate reasoning, but cannot ensure correct
      reasoning or objective completeness. Forward verification follows the problem conditions and
      current solution, enabling it to locate reasoning errors and assess objective completeness,
      but may overlook key constraints in complex solution chains. We propose BiVerify, a
      dynamically scheduled framework for bidirectional mathematical verification. BiVerify begins
      with backward verification to screen the answer against the original constraints, followed by
      forward verification of the reasoning process; subsequent direction switching, state
      resetting, and re-verification are governed by verification outcomes. Upon failure, the system
