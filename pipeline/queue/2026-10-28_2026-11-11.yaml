    abstract: We extract visibly pushdown grammars (VPGs) from neural language models in a fully
      black-box setting. Our work builds on the VPL* framework, which learns VPGs from recurrent
      networks by exploiting access to the target's internal state. First, we replace the white-box
      equivalence oracle with PAC sampling over trees. The resulting algorithm applies unchanged to
      transformer language models and, more generally, to any acceptor exposing only binary
      decisions. Second, we further observe that the original framework only ever queries the target
      on well-formed sequences that can be accepted by the most permissive VPG (called BParse) with
      the target's ranked alphabet. That is, VPL* is blind to the target's behavior outside BParse.
      Thus, we propose to sample trees directly instead of sequences and call the target with all
      the resulting sequences in order to provide an error estimate of how far the target deviates
      from being a VPG. Last but not least, we develop a learner that captures a tree automaton
      describing discovered behaviors of the target outside BParse, which results in a larger
      learnable space. We evaluate the approach on several cases, including transformers trained
      with Dyck grammars and synthetic targets designed to be outside BParse.
