      LLMs only ever encounter time secondhand---in descriptions rather than experience. Does this
      hinder their reasoning and decisions that involve time? Our paper traces this question from a
      model's knowledge to its actions through four successive evaluations. We find that models know
      the rules of time, which can be read, but struggle to predict durations, which must be lived;
      while they are highly accurate (92.0-97.5\\%) on a collection of questions built from the
