    abstract: This paper introduces a chatbot developed to assist in diagnosing common diseases in
      tomato plants through natural language interaction. Users can describe symptoms in text. Then,
      the chatbot responds with the most likely disease, and basic treatment suggestions and related
      image-based reasoning. The system leverages pre-trained Mistral and Llama 3.2 large language
      models. The system is also built using LangChain and Streamlit to provide a lightweight and
      offline-friendly interface. This work targets to support tomato growers a fast and accessible
      tomato plant health guidance when the technical expertise is not available nearby, especially
      in the remote areas. The experimental results are promising and encourage further improvement
      of the chatbot for future real-world deployment.
