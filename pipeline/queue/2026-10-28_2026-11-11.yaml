      prompts, particularly under adversarial distribution shifts where static alignment pipelines
      fail to generalize. Although introspective methods such as STAIR strengthen refusal
      consistency, they depend on fixed self-evaluation policies that cannot rapidly adapt to
      evolving manipulation strategies. To overcome these limitations, this paper introduces
      META-IR, a meta-introspective reasoning framework that enhances safety alignment through
      meta-learning-driven adaptation. It employs a dual-loop architecture: an inner introspective
      loop that performs structured risk analysis, self-assessment, and reflective correction via
      SI-MCTS, and an outer meta-learning loop that optimizes the introspection policy across
      diverse jailbreak task families to enable rapid generalization to unseen attacks. A dynamic
      jailbreak simulation module further exposes the model to progressively harder adversarial
