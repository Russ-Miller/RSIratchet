      user queries, ignoring a 1,200-fold increase in wait time entirely. Together, our experiments
      reveal new challenges posed to LLMs as they navigate a dimension they cannot directly
      perceive, and highlight how their blind spots can even be simple cognitive abilities that
      humans take for granted."
