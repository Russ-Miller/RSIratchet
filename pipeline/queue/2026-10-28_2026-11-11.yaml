      mistake or intentionally, to produce a literal translation, or calque. Considering that large
      language models (LLMs) have been shown to generalize crosslingually, despite being
      predominantly trained on English, we investigate whether they overgeneralize constructional
      strategies from English to other languages. To test this, we create a dataset of 5583 sentence
      pairs across seven languages, matching literal translations of strategies from English into
      other languages, and literal translations of the other languages' strategies into English. We
      then quantify constructional bleeding by measuring how often strategies from English are
      assigned a higher probability than native strategies. We find that models often fail to assign
