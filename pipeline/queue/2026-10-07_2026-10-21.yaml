    abstract: "Alan Turing proposed constructing a ``child machine'' and educating it rather than
      directly programming an adult-like intelligent machine. Recent work on model raising revives
      this developmental view for Large Language Models by arguing that moral values should
      accompany capability acquisition from the beginning rather than be added only through post-hoc
      alignment. This paper proposes Formal Raising (FR): selected moral values are represented as
      explicit, machine-checkable properties that participate in development, evaluation, and action
      selection. We present a C-based reasoning framework in which candidate actions are evaluated
      against prioritized ethical properties. Conflicts are resolved w.r.t. a given order, strict
      rules are non-defeasible, and underdetermination is reported explicitly. Exceptions are not
      encoded as special cases but emerge from the comparison of alternatives. We provide examples
      that cover conflicts involving life, truthfulness, harm, privacy, autonomy, and strict rules.
