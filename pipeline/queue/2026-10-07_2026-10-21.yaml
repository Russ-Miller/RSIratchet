      an environment works and adapt as it evolves. To address this gap, we introduce
      AdaExploreBench, a benchmark for proactive exploration and test-time adaptation in evolving
      environments. By instantiating environmental dynamics as hidden rules, AdaExploreBench
      requires agents to actively acquire evidence and infer the rules. Under implicit rule drift,
