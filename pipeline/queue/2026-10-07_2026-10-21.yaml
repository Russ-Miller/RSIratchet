    abstract: Interactive clinical agents acquire evidence through patient dialogue and diagnostic
      examinations, yet their performance also depends on how the interaction environment exposes
      information, available actions, and examination results. When these conditions are implicit or
      inconsistently controlled, final-answer accuracy can conflate diagnostic reasoning with the
      effects of the interaction protocol. We propose the \textbf{E}vidence-\textbf{G}rounded
      \textbf{I}nteraction \textbf{P}rotocol (EGIP), which enforces role-specific information
      boundaries, exposes diagnostic actions without revealing their results, retrieves examination
      results from stored clinical records, and organizes acquired evidence for final
      decision-making. By separating evidence acquisition from terminal prediction, EGIP enables
      different decision strategies to operate on the same observations. We evaluate EGIP across two
      clinical-agent frameworks, five datasets, and six language models. EGIP improves diagnostic
      accuracy over native baselines across all primary comparisons. A clinician review further
      shows that the proportion of automatically scored correct responses jointly judged
      evidence-supported rises from 10.20\% to 36.55\%. These findings support the effectiveness of
      EGIP as a unified interaction protocol for improving clinical-agent performance through
      controlled evidence access and acquisition.
