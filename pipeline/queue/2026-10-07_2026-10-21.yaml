      input can induce diverse reasoning trajectories and actions that a single greedy output cannot
      capture. Accordingly, we adopt consistent stochastic decoding during both optimization and
      evaluation. Experiments across malicious-instruction and malicious-environment benchmarks
      demonstrate that hybrid optimization improves attack effectiveness over single-optimizer
      methods, while optimization order substantially influences performance."
