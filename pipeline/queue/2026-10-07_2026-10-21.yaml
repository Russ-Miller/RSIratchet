      representation that supports precise localization. As reasoning trajectories grow longer, they
      often expand into broad scene narratives and peripheral relational details, which can dilute
      grounded perceptual evidence and lead to ambiguous or incorrect predictions. Motivated by the
      information bottleneck principle, we propose Think-Compress-Answer (TCA), a reinforcement
      learning framework that decomposes multimodal grounding into three phases: free-form
      reasoning, target-aware context compression, and answer generation conditioned on the
