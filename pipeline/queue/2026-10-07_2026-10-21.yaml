    abstract: "Real-world decision problems combine two qualitatively different kinds of constraints:
      requirements that must be satisfied, called hard constraints, and preferences that can be
      violated, called soft constraints. Because these problems are often posed to decision-makers
      in natural language, large language models offer a natural tool for assisting with their
      solution. This has given rise to autoformulation, which focuses on using LLMs to translate
      natural-language descriptions of decision problems into executable mathematical optimization
      models. However, this research often neglects soft constraints like those proposed by
      consumers, managers, and planners, despite the fact that many practical problems require
      modeling them explicitly. We introduce ASTOR, an inference-time framework that maps a
      natural-language decision problem to a grammar-guided abstract syntax tree (AST) before
      deterministically compiling the resulting representation into executable optimization code. We
      also introduce SoftOR, a unified benchmark of natural language problems which focuses on soft
      constraint formulations. On SoftOR, ASTOR achieves the best aggregate accuracy among
      comparable single-request and multi-agent LLM methods while remaining competitive on standard
      autoformulation benchmarks that include only hard constraints. Code and data are available at
      https://anonymous.4open.science/r/astor-softor-iclr-E34C/README.md."
