      behavioral preferences remains underexplored. Previous work has focused primarily on
      instruction-tuning for factual knowledge, overlooking nuanced cultural behaviors. We propose
      ArabPref, which to our knowledge is the first large-scale pan-Arab preference data set for the
      alignment of cultural behavior conditioned on the country. Our contribution includes two
      resources in English and Modern Standard Arabic: a culturally grounded preference dataset for
      training and evaluation, and a multiple-choice benchmark designed to assess culturally aligned
      behavior across nations. All test data are validated by native speakers to ensure
      authenticity. To optimize cultural alignment, we experiment with post-training methods across
      multilingual and Arabic-centric language models, evaluating performance on both generation
