    abstract: "Large language models (LLMs) have achieved strong performance across diverse reasoning
      tasks, yet it remains unclear whether this performance reflects an understanding of underlying
      logical structure or a reliance on shallow semantic cues. A key indicator of such
      understanding is whether models treat logically equivalent inputs consistently, producing the
      same predictions despite differences in expression. Through systematic evaluation on curated
      data, we show that even strong LLMs often fail this test: they do not consistently preserve
      predictions across logically equivalent inputs and generalize poorly to unseen logical forms.
      To address this limitation, we propose LoGIcal STructure-guided reasoning (LoGIST), a
      framework that guides LLM reasoning with explicit logical structure. LoGIST maps each input
      instance to a decision diagram, a directed acyclic graph that captures the underlying logical
      structure, and encodes this graph into a logical embedding that conditions the LLM's reasoning
      process. Across multiple training settings, LoGIST reduces inconsistency under logical
      equivalence and improves generalization to unseen logical forms, suggesting that logical
      invariance is a useful target for building more robust and generalizable logical reasoning in
      LLMs."
