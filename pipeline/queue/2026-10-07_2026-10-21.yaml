    abstract: It has long been proposed that animals construct cognitive maps to support flexible
      behavior in novel environments. We tested whether large language models form similar
      representations using relational reasoning tasks and causal "mosaic experiments" that
      manipulate internal activations in open-weight language models. Models beyond the
      ten-billion-parameter scale successfully inferred unstated relationships between entities and
      generalized to synthetic entity names. Across model and task families, models generated
      abstract representations of relational structure and combined them additively with
      representations of entity identity, binding entities to roles within that structure. Models
      stored observed relationships as pairwise links that they composed retrospectively when
      queried, rather than prospectively positioning each entity in a global coordinate system.
      Binding was mediated by a sparse, distributed set of key--value pairs; by perturbing these
      pairs, we implanted "false memories" that altered model behavior in predictable ways. Overall,
      our findings reveal an internal organization analogous to a cognitive map that explains how
      language models reason with limited information.
