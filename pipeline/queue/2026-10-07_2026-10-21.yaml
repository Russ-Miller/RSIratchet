      AI-specific provisions with no equivalent in human law. Looking more closely at the
      \"creativity\" of these AI agents, we find different levels: most proposals combine existing
      concepts and themes from human constitutions with AI-specific vocabulary. We introduce a
      measure of this recombination, which helps identify and highlight the most novel legal
      material. This study reveals a ceiling on AI creativity: the agents extend familiar legal
      ideas to new situations, but they do not work through what those situations would change.
