    abstract: "Multimodal Large Language Models (MLLMs) encode images into dense visual token sequences,
      creating substantial attention and KV-cache overhead. Existing visual token compression
      methods reduce this cost by pruning low-saliency tokens in shallow layers, but this practice
      couples temporary computational deactivation with irreversible information deletion. We show
      that this coupling breaks an intrinsic inference pattern in MLLMs. Through layer-wise
      attention analysis, we identify \\textbf{Visual Backtracking}: visual pivots remain spatially
      stable, yet in middle layers they actively retrieve context from tokens that appeared
      unimportant earlier. Thus, early low-saliency tokens can be inactive for computation while
      still being useful for later reasoning. Motivated by this finding, we propose
      \\textbf{ReTrace}, a backtracking-aware compression framework that introduces a dormant token
      state. ReTrace caches non-pivot tokens outside expensive layer-wise computation, restores them
      during the backtracking window, and prunes only after their information has been absorbed.
