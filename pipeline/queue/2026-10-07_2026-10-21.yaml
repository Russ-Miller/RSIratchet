      noise, leading to suboptimal accuracy-efficiency trade-offs. To address this, we propose
      \textbf{Locally Isolated Rotation Quantization (LIRQuant)}, a sensitivity-aware framework that
      selectively applies transformations. LIRQuant identifies sensitive channels using a
      noise-weighted sensitivity metric, applying expressive learnable rotations only to these
      channels and lightweight fixed rotations to the remaining ones. This decoupled design reduces
