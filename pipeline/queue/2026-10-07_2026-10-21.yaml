      information injection targets the evidence the agent trusts. The benchmark spans five
      injection vectors and seven event categories, evaluated over ~10,000 decisions on 15 U.S.
      stocks. Five findings emerge. (i) Prompt injection achieves 14% attack success rate (ASR), but
      fabricated news reaches 62% and two 30-word templates reach 100% on all 15 stocks, inverting
