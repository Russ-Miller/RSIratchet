      than content, since removing credibility cues such as a named source or a "BREAKING" tag drops
      ASR from 100% to 0% while the fake claim remains identical. (iii) Success depends on the
      agent's state, with a fake indicator panel scoring 91% against an agent about to hold but 12%
      against one about to buy. (iv) Attacks generalize across model vendors and remain effective
