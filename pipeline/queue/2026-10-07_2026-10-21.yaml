      transfer across models and datasets, and validation-calibrated rules lose their guarantee
      under shifts in test-time horizon or signal dynamics. We reframe adaptive stopping as
      sequential evidence accumulation along the reasoning trajectory rather than threshold
      calibration on held-out data. Our framework runs two e-processes on a shared per-chunk signal:
