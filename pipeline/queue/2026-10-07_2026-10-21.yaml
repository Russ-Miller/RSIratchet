    abstract: "As the world changes, new information is published while older records remain online.
      This complicates reasoning for large language models (LLMs), which must retrieve evidence and
      resolve conflicts to determine which information remains valid. Existing evaluations treat
      information seeking as a black box, revealing little about where and why LLMs fail. To address
      this gap, we introduce TREK, a suite of three components: TREKTRACE is a plug-and-play
      framework that attributes failures to specific stages of retrieval and reasoning. We apply it
      to TREKBENCH-WILD, a meta-benchmark of real-world questions that require complex reasoning
      over rapidly evolving knowledge. Surprisingly, the main bottleneck is post-retrieval reasoning
      rather than retrieval: frontier models are often misled by conflicting evidence even after
      retrieving all the information needed to answer. To study this bottleneck, we build
      TREKBENCH-CTRL, a controlled benchmark with distractors spanning temporality, relevance, and
      trustworthiness, and show that benchmarks dominated by outdated distractors substantially
      underestimate task difficulty. Together, TREK provides a testbed for diagnosing and improving
      reasoning over rapidly evolving knowledge."
