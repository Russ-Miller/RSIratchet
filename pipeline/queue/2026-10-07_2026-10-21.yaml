      limited on-policy rollouts can progressively suppress semantically distinct but equally
      rewarded reasoning modes. Once a mode becomes sufficiently under-sampled, standard on-policy
      RLVR rarely recovers it. Motivated by this observation, we propose TAR, a Targeted Adaptive
      Replay framework that preserves diverse correct reasoning behaviors already present in the
      base policy. TAR constructs a compact memory bank of diverse base-model solutions and
      selectively replays them through an adaptive mechanism that activates only when stored
      behaviors are being suppressed during RLVR. Across six mathematical reasoning benchmarks and
