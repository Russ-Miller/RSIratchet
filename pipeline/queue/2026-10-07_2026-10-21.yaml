      plan feasibility, without learning which eligible device returns a useful observation. Unlike
      previous works, we study online tool grounding: binding an already specified tool call to one
      physical endpoint under service cost and device participation constraints. We propose a
      framework that learns which physical device should execute each agent-issued call. It
      formulates selection as a contextual bandit problem and combines adaptive context partitions
      with hierarchical endpoint trees, so that execution feedback is reused across related requests
      and devices. Selection balances task success against service cost while respecting device
      capability, authorization, battery reserves, and availability. Gaussian reward aggregation
      provides an optional mechanism for protecting individual feedback values. Theoretical results
