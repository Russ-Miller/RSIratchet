    abstract: "Large Language Model (LLM) unlearning aims to suppress target knowledge while preserving
      general capabilities. In multilingual settings, unlearning must additionally propagate within
      its intended linguistic scope. However, existing evaluations mainly measure cross-lingual
      transfer and cannot distinguish insufficient from excessive propagation. We introduce CLLPU
      (Cross-Lingual and Language-Bound Protocol for LLM Unlearning), a multilingual benchmark that
      formulates this problem through two settings: common-goal forgetting, where target knowledge
      should be suppressed across all languages, and language-conditioned forgetting, where
      suppression should remain confined to a designated language. CLLPU combines goal-guided topic
      pairing, schema-aware relation matching, and dual-anchor multilingual translation to construct
      800 matched knowledge-unit pairs and 72,000 QA instances across ten languages. Experiments
      with six representative methods on Llama-3.1-8B-Instruct reveal opposite failure modes:
      forgetting remains incomplete when universal suppression is required, yet spreads beyond the
      intended boundary when language-conditioned confinement is required. We further find that
      general multilingual utility can conceal damage to neighbor knowledge. These findings
      establish propagation control as a central challenge for multilingual LLM unlearning. We
      publicly release CLLPU together with its construction pipeline."
