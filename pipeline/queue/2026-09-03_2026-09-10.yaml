      training data of Large Language Models. In this paper, we revisit MaskLID, a state-of-the art
      approach for CS identification, which requires no training and detects arbitrary language
      combinations. We make three main contributions: (a) we reveal, and address, a major issue of
      MaskLID: its overreliance on word-level language association scores; (b) we reformulate the
      underlying optimization algorithm as an Integer Linear Program, enabling us to experiment with
      a large set of clear and interpretable constraints; (c) each of these improvements vastly
      improves the baseline system, as we illustrate in experiments involving 10~diverse languages,
