      training efficiency of large language models. State-of-the-art methods search for a
      parallelism strategy offline and select the single strategy that minimizes per-iteration time.
      But we find that they neglect the target validation perplexity and time-to-perplexity (TTP).
      In particular, our analysis reveals that the best strategy yielding the fastest perplexity
      improvement changes multiple times during training. As a result, state-of-the-art methods are
      1.8-11.4x slower in TTP than the strategy sequence that selects the best strategy at each
      iteration. This paper proposes CONA, a new training method that introduces online strategy
      chaining. Instead of a single strategy selected offline, CONA ranks candidate strategies
      during training using a surrogate metric built from compute throughput and gradient
      statistics, and switches the current strategy to a new strategy with a higher metric. In our
