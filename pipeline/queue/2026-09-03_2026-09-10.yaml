      Probing, a controlled framework that places LLMs in value conflicts and implements four types
      of interventions that perturb these conflicts to probe LLM value expression. Applying this
      framework to ten LLMs, we identify three recurring patterns. (1) Expression duality: models
      shift from broad idealistic orientations in abstract assessment toward more pragmatic
      priorities in concrete conflicts. (2) Functional steerability: models readily reconfigure
      their expressed value profiles toward task-defined value objectives. (3) Bounded plasticity:
      such reconfiguration is not without constraints, i.e. pressure induces a security- and
