      realize slow thinking differently. We formulate slow thinking as coherent dynamics over
      reasoning trajectories, a discrete path integral in which action sequences coexist in
      superposition and recombine before measurement. In our trainable realization, an exact
      verifier partitions the ensemble into collective accepted and rejected components that
      interfere under Grover amplitude amplification. A finite Grover evolution is maximized when
      the pre-amplification success probability lies at an analytically determined value below one,
