      limitation, we introduce SBFNav, a closed-loop navigation framework centered on a language-
      conditioned Spatial Belief Field (SBF). Unlike ego-centric maps that primarily record what has
      been observed, SBF rep- resents a task-conditioned distribution over plausible target
      locations, preserving multiple spatial hypotheses under par- tial evidence. At each step, this
      distribution is updated from accumulated observations as new evidence becomes avail- able.
