    abstract: "The next generation of artificial intelligence systems will likely be natively temporal
      and multimodal in both inputs and outputs: able to converse, perceive, predict, reason, and
      synthesize through a shared world representation. Realizing this requires a temporal
      perceptual substrate integrating sensory streams, language, and structured outputs within a
      multimodal world model. We seek a generalist open-world perceptual system that represents
      biological forms, natural physical structures, and artifacts, and their interactions, as a
      coherent, temporally persistent process. The model should infer geometry, articulation,
      semantics, interaction structure, and uncertainty from raw multimodal streams; maintain
      identity through occlusion and viewpoint change; generalize across species, forms, mechanisms,
      and materials; and abstain or expand its ontology when encountering the unknown. The objective
      is a structured world state supporting understanding, prediction, counterfactual reasoning,
      and controllable synthesis. Recent work suggests that some cross-modal and reasoning-like
      capabilities can emerge from large-scale generative video pretraining, reminiscent of
      language-model scaling. Yet these capabilities are often accessed through language probes or
      expressed through photorealistic video, leaving explicit semantic, geometric, or temporal
      structure largely unexposed. This paper articulates an alternative and complementary paradigm:
      perception and synthesis as distinct conditionings"
