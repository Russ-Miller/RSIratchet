    abstract: "Existing Supervised Fine-Tuning paradigms, particularly Full Parameter Fine-Tuning are
      often plagued by parameter redundancy, inconsistent data quality, and catastrophic forgetting,
      which current methods typically address in isolation and lack a unified optimization signal to
      bridge data selection, parameter updates, and knowledge preservation. To address this, we
      propose Neuron-Guided Fine-Tuning (NGFT), a holistic framework that leverages neuron
      activation patterns as a universal proxy to unify the fine-tuning lifecycle. NGFT operates via
      three synergistic mechanisms: (1) Adaptive Task-Specific Neuron Selection, which identifies
      essential neurons in a single forward pass to concentrate updates and reduce redundancy; (2)
      Activation-Based Data Selection, which prioritizes information-dense samples that maximize
      contribution to key neurons; and (3) Neuron Activation Alignment, a novel loss function that
      anchors activations to pre-trained states, deepening representation learning and preserving
      general knowledge. Experimental results across three models across both domain-specific and
      general benchmarks demonstrate that NGFT significantly outperforms existing mainstream
      fine-tuning methods in both efficiency and performance, while effectively mitigating
      catastrophic forgetting."
