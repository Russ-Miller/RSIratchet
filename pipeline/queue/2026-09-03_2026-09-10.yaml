    topic: Mental Health via Writing
    cited_by_count: 0
    abstract: "Large language models (LLMs) are rapidly emerging as a new paradigm for modeling social
      networks by representing users and their relationships and interactions through natural
      language. Unlike classical network models or deep learning approaches, LLMs can simulate
      context-aware social behavior and language-driven interactions, enabling more realistic
      modeling of network formation and dynamic social processes. However, existing studies are
      scattered across different research communities and lack a unified perspective. This survey
      presents the first comprehensive review of LLMs for social network modeling by organizing the
      literature into two broad categories: network generative models and dynamic process models.
      Network generative models are further classified into selection-based and interaction-based
      approaches, while dynamic process models are categorized into opinion dynamics, information
      diffusion, and rumor propagation, each with their underlying modeling mechanisms. LLMs enable
      rich textual social interactions and decision-making, but they also exhibit many limitations,
      including inherent social biases and prompt sensitivity. We outline these open research
      challenges and discuss future directions in LLM-based social network modeling."
