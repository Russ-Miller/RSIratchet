      global learning rate across every rank-one component of every adapter. We show that this
      convention overlooks substantial within-module heterogeneity, where the rank-one components of
      a LoRA adapter update at highly uneven rates and low-velocity modules converge to concentrated
      singular spectra that underutilize the nominal rank budget. To address this, we propose an
      adaptive anisotropic learning-rate model that assigns each rank-one component its own
      effective learning rate, computed online from training-time signals and mean-normalized per
      module to preserve the global LR budget. AnLR-LoRA instantiates this model with two signals
      available during AdamW optimization, namely function-space velocity and Adam SNR, as a
