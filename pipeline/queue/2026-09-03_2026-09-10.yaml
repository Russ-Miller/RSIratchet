    abstract: "Training-free collaborative pipelines that integrate Vision Foundation Models such as
      CLIP, SAM, and DINO achieve strong open-vocabulary dense prediction and are increasingly
      deployed in safety-critical applications. The security of these systems is commonly assumed to
      follow from the robustness of their individual models. We challenge this assumption. We
      identify a vulnerability shared by every collaborative pipeline: each model consumes the
      intermediate output of another without verifying semantic consistency, an unverified premise
      that we term the semantic-spatial alignment dependency. Existing adversarial attacks target a
      single model and overlook this premise, leaving the inter-model interface entirely unguarded.
