    abstract: "Large language models are increasingly used as sources of advice and information,
      including in high-stakes settings, yet little is known about how they respond to user
      disagreement. We study how a model manages its epistemic authority, referring here to its
      claim to knowledge, competence, or the right to advise, once a user challenges its answer.
      Building on Conversation Analysis, we introduce a taxonomy of six challenge types and a
      four-layer framework for analysing each response: whether the original claim is maintained or
      changed, where authority is located, how the disagreement is socially managed, and what kind
      of evidential support is offered. We construct a new dataset of 2,310 controlled challenge
      scenarios and 32,340 corresponding responses from 14 models, and analyse them using our
      framework with an LLM-as-judge pipeline, providing a vocabulary which future evaluation and
      benchmark design can build on. We find that models show conflicting behaviour: they validate
      users in 85% of responses but maintain their original claim in 65%. They explicitly apologise
      in 33% of responses, yet 59% of those apologies accompany maintenance of the original claim.
