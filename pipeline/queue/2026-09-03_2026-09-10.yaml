    abstract: Understanding human attention is fundamental for scene interpretation, yet existing
      approaches often rely on heavily trained models that lack interpretability. Prior methods
      struggle to jointly reason about gaze targets, attended objects, and visual grounding without
      extensive supervision. To the best of our knowledge, this work introduces the first
      training-free Gaze Target Agent (GTA) for gaze-guided reasoning across tasks such as gaze
      target prediction, attention localization, and object identification. This is achieved by
      leveraging pretrained vision-language models, augmenting them with visually guided prompts,
      and employing a memory-based retrieval strategy for high-uncertainty samples to improve
      performance without additional training. We evaluate our approach using both quantitative
      metrics and qualitative results. Quantitatively, our method achieves state of the art
      performance on the GazeFollow and GazeHOI benchmarks. Qualitatively, our agent provides
      detailed semantic predictions, predicts the correct targets even when ground truth labels are
      wrong, and remains flexible without vocabulary constraints.
