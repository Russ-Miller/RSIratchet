    abstract: "The minimum cut problem for an undirected edge-weighted graph asks us to divide its set
      of nodes into two blocks while minimizing the weighted sum of the cut edges. Over the last
      years, we engineered a range of fast algorithms for this problem. Our fastest exact algorithm
      uses an inexact algorithm to obtain a better bound for the problem, reductions that depend on
      this bound, improved data structures and parallel contraction routines. It is available in the
      open-source package VieCut and, on real-world instances, outperformed the previously fastest
      solvers by a factor of up to 2.5 sequentially and up to 12.9 when run in parallel. We improve
      this algorithm using agentic algorithm engineering (AAE), a methodology that we introduce
      here, in which autonomous large language model agents run the algorithm engineering cycle on
      an existing code base: they form hypotheses about where running time is lost, implement them,
      benchmark the result on a fixed instance set and keep or discard the change. Even though we
      had already tuned our algorithm by hand extensively, the agent finds significant
      optimizations, in particular on the DIMACS core instances: factors of 1.28 (sequential) and
