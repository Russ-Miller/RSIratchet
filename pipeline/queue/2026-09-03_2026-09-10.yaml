      introduce STQA (Stock-focused Tabular Question Answering), an end-to-end benchmark designed to
      systematically evaluate natural-language question answering over historical data, numerical
      forecasts, and forecast-based reasoning. Built on a large-scale financial dataset, STQA covers
      4,417 stocks and contains 31,400 question-answer pairs derived from expert-crafted templates,
      accompanied by fine-grained intent and slot annotations. To operationalize this benchmark, we
