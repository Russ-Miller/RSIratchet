      the supporting pages, yet supplied citations are sometimes inaccurate, and current evaluations
      score citations at generation time or against text passages: no existing benchmark evaluates
      whether a system can verify and correct a page-level citation already attached to an answer.
      We propose AtomCite, an agentic framework that parses an answer into claims, checks each claim
      against the image of its cited page, and applies a deterministic repair policy. To evaluate
      it, we introduce DocCite, to our knowledge the first benchmark for systems that verify and
      correct page-level citations in document images. Built on MP-DocVQA and DUDE, it combines 928
