      However, recent studies suggest that LLMs are more resilient to high sparsity than previously
      thought, reframing the problem as a design challenge rather than a fundamental limitation. In
      this work, we challenge the perceived limits of unstructured post-training LLM pruning by
      revisiting elementary pruning strategies that have remained relatively underexplored at this
      scale. Through a progressive sparsification framework with second-order saliency and continued
      training coordinated with sparsity progression, we show that pretrained LLMs can retain strong
