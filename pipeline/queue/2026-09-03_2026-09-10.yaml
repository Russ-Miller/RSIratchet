      straightforward. In this work, we adapt the family of counterfactual methods for measuring CoT
      faithfulness, namely the Counterfactual Test (CT) and Correlational Counterfactual Test (CCT),
      to visual inputs, and call them vCT and vCCT, respectively. Using vCT and vCCT, we benchmark
      eight recent open-source Vision Language Models (VLMs) on two datasets. Our analysis shows
      that CoTs do not reliably track visual evidence that influences model predictions: they may
