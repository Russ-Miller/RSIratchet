    abstract: In the era of large models, stereo matching is developing towards generalizable foundation
      models trained on million-scale synthetic images. However, how model performance scales up
      with synthetic data is still underexplored. In this work, we preliminarily investigate the
      in-domain and cross-domain data scaling laws in stereo matching. A realistic synthetic
      dataset, named XStereo, containing 200 thousand samples is first built to serve as a
      high-quality benchmark for data scaling research. In-domain training on five large-scale
      datasets demonstrate a two-regime scaling behavior with data, transitioning from the standard
      power law to saturation, where the critical transition point is approximately invariant under
      a fixed model. Cross-domain performance exhibits a substantially weaker and less predictable
      dependence on the source-domain data scale. The distribution and coverage diversity are more
      effective for diminishing domain gaps. More instructive suggestions are provided for
      high-efficiency data construction and training. The insightful findings are significant
      verification and extension of the existing scaling laws in both language and vision, paving
      the way to efficient and stronger stereo matching. The XStereo dataset is public at
