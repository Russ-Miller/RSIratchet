    abstract: Large language models (LLMs) serve users whose cultural identities are multi-layered, yet
      cultural evaluations commonly reduce identity to one label. In this work, we study LLMs under
      simultaneous identity cues, with a country persona in the system prompt and a second identity
      signaled in the user turn, either by naming a country (explicit cue) or through the query
      language (implicit cue). We test World Values Survey (WVS) multiple-choice probing and
      open-ended sociopolitical generation. In multiple-choice probing, language cues shift answers
      about three times more than explicit cues but away from the associated country's distribution,
      and explicit cues do not consistently move answers toward the named country. Across 1.6
      million open-ended responses, naming a country closes 30-44% of the gap to the model's own
      responses for that country, and explicit cues produce more differentiated value changes than
      language cues. Our results suggest that country and language cues should be evaluated as
      distinct signals rather than interchangeable proxies for culture.
