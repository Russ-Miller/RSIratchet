    abstract: In engineering, applications of artificial intelligence have so far been largely limited
      to surrogate models and optimization tasks. Large language models changed this, as they can
      write software from a task given in words. Placed inside a harness, a system of components
      that lets it search for information and execute software, such a model becomes an agent that
      can take over recurring engineering tasks. This work measures how the model and the elements
      of the harness shape the performance and behavior of the agent in two common acoustic
      applications. In the first, the agent detects and locates faults in audio recordings from a
      vehicle interior with near-perfect accuracy. A benchmark on this task shows that a weak model
      sets a limit that no harness design can overcome, and that design choices take effect only
      once the model is capable enough to use them. In the second, a case study on the design of a
      metamaterial unit cell, the agent reliably finds designs that achieve a specified insertion
      loss over a given frequency range. The results aim to help the reader understand what each
      element of an agent contributes and how to design an agent for acoustic tasks.
