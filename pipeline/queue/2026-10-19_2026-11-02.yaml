    abstract: "Large language models increasingly automate optimization modeling from natural language
      problems, producing written mathematics, solver code and a returned report. Verifying one
      optimization problem across these artifacts requires semantic comparison: unequal models can
      attain the same objective, equivalent models can use different auxiliary variables, and
      mutually consistent artifacts can omit the same source requirement. ORSMT provides a typed
      semantic interface and exact SMT relation queries. It aligns observable decisions, projects
      auxiliary variables, proves or refutes feasible region and objective relations, localizes
      refutations to implicated rows or domains and links source texts when available. It then
      reconstructs one artifact from another, and each adopted candidate passes the required
      relation checks. Across 3,034 problems and six generator sizes, ORSMT improves the model-code
      match rate in all 72 benchmark and generator combinations before selection. Protected
