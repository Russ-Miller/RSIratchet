      improves task performance under a limited compute budget. Drawing inspiration from
      gradient-based parameter optimization, the harness organizes adaptation into error
      attribution, update-direction selection, and executable model updates. It combines
      metric-level and case-level analysis to identify a focal problem, then investigates
      research-backed strategies and compares their reported gains and reproduction difficulty. The
      selected strategy is translated into training data and a training configuration, with
      small-scale execution checks preceding full post-training. Subsequent evaluation guides model
      selection and further adaptation, while validated strategies and scripts are retained for
      reuse. Across 11 tasks, ImproveAnyTask achieves mean gains of 18.29 and 11.97 percentage
