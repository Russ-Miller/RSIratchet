    abstract: "Stance detection remains challenging for large language models (LLMs) due to implicit
      opinions, sarcasm, and context-dependent expressions of stance. Although automatic prompt
      optimization offers an alternative to fine-tuning without updating model parameters, existing
      structured approaches are not specifically designed around stance-label semantics and
      class-specific ambiguities. We introduce MoPrO-SD, a stance-specific prompt optimization
      framework that decomposes prompts into functional semantic modules and refines them
      sequentially using LLM-based feedback. We study three refinement strategies: instruction-only
      optimization (I), instruction with reasoning (I+R), and instruction with per-example reasoning
      (I+R+E), using class-conditioned errors for stance-label refinement. We also introduce
      VaccineStance, a new human-annotated benchmark for vaccine stance detection. Experiments
      across four datasets and five open-weight LLMs show that MoPrO-SD improves upon the
      human-written Base prompt in many settings. On SemEval-2016, class-conditioned feedback
      achieves higher mean Macro-F1 than pooled feedback for four of five backbones. Both
      reasoning-based strategies, I+R and I+R+E, achieve strong performance, with their relative
      effectiveness varying across models and datasets, while remaining competitive with recent
      prompt optimization methods. The MoPrO-SD code and VaccineStance dataset are available on
      GitHub."
