    abstract: "Knowledge-based Visual Question Answering (VQA) requires reasoning that extends beyond
      visible image content, demanding external commonsense and factual knowledge. While recent work
      leverages Large Language Models (LLMs) as knowledge sources, the question of how deeply such
      guidance should be integrated into a vision language architecture remains underexplored. In
      this work, we generate structured reasoning guidance, visual focus concepts, distractor
      elements and external knowledge using Llama~3.3~70B and systematically compare two integration
      strategies within a unified frozen ViT + FLAN-T5 framework on the OK-VQA benchmark: decision
      level late fusion and attention-matrix injection. Contrary to the prevailing assumption that
      deeper integration is superior, we find that shallow late fusion achieves the strongest
      results (39.4% exact match, +10.0 over the no guidance baseline), outperforming deep attention
      modification (31.8%) under data scarce fine-tuning. We further contribute an LLM based
      augmentation pipeline that expands training data more than tenfold via question paraphrasing.
      Our findings indicate that integration depth must be matched to the data regime."
