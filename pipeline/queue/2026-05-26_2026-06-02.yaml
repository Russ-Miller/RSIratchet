    abstract: Large language model (LLM) agents increasingly operate within a harness, the scaffolding
      that determines what enters the executor's context, yet the experience they accumulate across
      tasks rarely flows back into this harness. Existing approaches include executor fine-tuning
      and external memory retrieval, but combining task-adaptive retrieval with experience reuse
      across frozen executors remains challenging. To this end, we introduce ExpHarness, a learnable
      experience harness that improves frozen and replaceable LLM executors without modifying their
      parameters. Specifically, ExpHarness distills trajectories into reusable skills and failure
      lessons within a self-evolving experience graph, and trains a lightweight retrieval copilot
      that decides, per task, how broadly to explore the graph and how strongly to favor
      historically useful experiences over merely similar ones. The copilot is optimized with
      reinforcement learning from a utility-grounded reward combining the with/without-experience
      score difference and an absolute-performance term; the same reward updates the graph during
