    abstract: "Causal discovery is a cornerstone of scientific reasoning, yet whether large language
      models can perform it reliably remains an open question. Recent benchmarks show that even
      fine-tuned models plateau on simple causal graphs and degrade as complexity grows, but why
      they fail has not been established. We prove the failure is fundamental: supervised
      fine-tuning, direct preference optimization, and in-context learning all produce predictors
      that cannot distinguish between causal graphs generating similar observational data, and any
      attempt to do so requires the model's internal representations to grow unboundedly, violating
      the very conditions under which these methods work. We formalize this as a kernel obstruction
      theorem, establishing that the limitation is intrinsic to the learning paradigm, \\emph{not
      any particular model or dataset}. We propose Agentic Causal Bayesian Optimization (A-CBO),
      wherein a frozen language model serves as an interventional oracle answering targeted queries
