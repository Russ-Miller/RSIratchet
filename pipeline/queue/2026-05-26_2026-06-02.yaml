    abstract: Diffusion language models generate text by iteratively selecting and denoising masked
      positions, making position selection a central inference-time decision. Most training-free
      methods rely on model confidence, assuming that high-confidence positions are ready to be
      decoded. However, this assumption can fail in fully non-autoregressive (fully non-AR)
      decoding, where selection spans the entire masked response sequence. This can cause incomplete
      generation, partly due to EOT overconfidence. Existing remedies directly suppress EOT tokens,
      but provide limited gains or require additional fine-tuning. We show that placing even a
      semantically minimal suffix anchor near the end of the response region discourages premature
      EOT prediction and promotes complete generation. However, despite providing little supporting
      context, the anchor makes nearby positions highly confident and causes them to be decoded too
      early. We therefore propose Suffix-Anchored Confidence Modulation, a simple training-free
      method that uses suffix anchoring with progress-dependent confidence modulation near the
      anchor. Across text-only reasoning, vision-language reasoning, and code-generation benchmarks,
      our method outperforms diverse fully non-AR and semi-AR baselines. It also achieves
      particularly large gains under highly parallel decoding, demonstrating the benefit of
      improving the fully non-AR regime over block-wise semi-AR regime.
