    abstract: "While multimodal large language models (MLLMs) have achieved rapid progress in
      vision-language understanding, they remain prone to multimodal hallucinations, producing
      responses that are inconsistent with the visual input. Existing benchmarks predominantly focus
      on detecting hallucination outcomes rather than evaluating the underlying causes of these
      failures. Moreover, many benchmarks rely on simplistic scenarios and limited evaluation
      formats that no longer challenge state-of-the-art models. To address these limitations, we
      introduce ReactBench, a cause-driven hallucination benchmark featuring multiple tasks and an
      exam-style evaluation format. By generating adversarial images and hallucination-inducing
      queries, ReactBench introduces four targeted tasks: Relational Erasure, Counterfactual
      Attribute, Alteration Tracing, and Dense Counting. These tasks systematically expose
      co-occurrence bias, language priors, cross-image comparative perception deficiencies, and
      fine-grained perceptual bottlenecks. Beyond standard accuracy-based evaluation, we leverage
      Chain-of-Thought reasoning to identify fine-grained sub-causes of hallucination within each
      task. Extensive evaluations reveal that current MLLMs remain notably vulnerable to
      cause-specific hallucination triggers, demonstrating the value of ReactBench as a systematic
      and interpretable testbed for diagnosing and improving multimodal model robustness. The
      project page is available at https://reactbench.github.io/."
