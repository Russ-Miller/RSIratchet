    abstract: Large language models (LLMs) excel in reasoning and knowledge-intensive tasks but remain
      vulnerable to prompt-level adversarial attacks that preserve intent while triggering
      commonsense hallucinations. This vulnerability is urgent, as LLMs are rapidly integrated into
      safety-critical domains where factual reliability is non-negotiable. Existing attack methods
      either lack efficiency or fail to capture the adaptive strategies of real-world adversaries.
      We propose an A*-inspired Factual Error Induction Framework, a framework for generating
      semantically aligned yet obfuscated prompts. At its core is a Hierarchical Rewrite Strategy
      guided by a dynamic semantic dispersion coefficient $γ$ that balances conservative edits early
      with aggressive obfuscations later, following a reverse simulated annealing schedule. To
      enhance interpretability, we further introduce Agentic Mechanism Labeling, which discovers and
      refines adversarial mechanisms, offering interpretable reverse optimization. Theoretically, we
      prove that prompt rewriting follows a contractive recurrence, leading to semantic collapse as
      $γ$ decreases. Empirically, across diverse LLMs, our method achieves higher attack success
      rates than exhaustive exploration while requiring fewer attempts, demonstrating both
      efficiency and effectiveness.
