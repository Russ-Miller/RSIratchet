    abstract: "Scaling laws guide large language model training by relating compute to cross-entropy
      loss, and recent work further extends them to predict downstream benchmark performance.
      However, prior approaches face generalization limitations from two aspects: focusing on
      benchmark-level performance introduces scenario-specific artifacts, while relying on IID
      validation loss fails to track capability improvements when training distributions vary. In
      this work, we argue that downstream scaling should be studied at the capability level, which
      captures shared skill factors across related tasks while abstracting away benchmark-specific
      noise. We propose SuperValid, a framework that synthesizes OOD (out-of-distribution),
      capability-aligned validation data by distilling core concepts from benchmarks within a
      capability domain and expanding them into diverse, knowledge-rich texts. Extensive experiments
      spanning 16 benchmarks grouped into 6 capability domains show that SuperValid loss exhibits
      strong and stable correlation with downstream performance across models of different
      architectures, scales, and training data distributions. As a training-free metric computable
      during training without benchmark evaluation, SuperValid enables effective model selection,
      early stopping, and scaling decisions."
