      capabilities, making context-aware speech recognition possible without predefined bias lists.
      In this paper, we propose LaSR (Latent Speech Reasoning), a novel training paradigm featuring
      a context-aware reasoning trajectory that leverages the latent reasoning process. Instead of
      generating explicit intermediate tokens, LaSR aligns chain-of-thought (CoT) supervision around
      the acoustic feature region of the target word, and introduces latent reasoning periods for
      context information grounding and transcriptional transition. Furthermore, to effectively
