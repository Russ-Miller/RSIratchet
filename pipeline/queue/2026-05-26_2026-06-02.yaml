      corpus focusing on academic terminologies. Preliminary experiments on Fun-Audio-Chat
      demonstrate that LaSR significantly improves terminology recognition without introducing
      additional latency and consistently outperforms standard supervised fine-tuning baselines. Our
      findings highlight the potential of latent reasoning in building efficient, context-aware
      speech assistants.
