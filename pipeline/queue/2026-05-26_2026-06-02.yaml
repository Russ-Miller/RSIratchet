      external executable interfaces, thereby supporting environment-coupled problem solving.
      However, mainstream in-context learning (ICL) approaches typically incorporate detailed tool
      documentation and usage examples directly into the context. This results in substantial
      inference overhead and heightened risks of hallucination as the context length grows.
      Conversely, while tuning-based methods improve general tool-calling capabilities, they often
      fail to effectively internalize the specific details of previously seen tools, thereby
      retaining a dependency on in-context documentation. To address these limitations, we propose
      ParaTool, a framework that projects each tool into a dedicated, loadable set of parameters. By
      equipping a dynamic integration of these parameterized tools, the LLM can perform tool calling
