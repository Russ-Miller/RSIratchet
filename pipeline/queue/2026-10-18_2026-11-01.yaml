    abstract: Effective collaboration requires language models to understand what others know and
      believe, and to act accordingly. Models that assume others share their information may omit
      necessary communication and undermine coordination. Many theory-of-mind (ToM) benchmarks
      assess mental-state inference through story questions, but correct answers do not establish
      that models can use these judgments in subsequent tasks. We introduce a multi-level evaluation
      built on existing, verifiable tasks. We extend household collaboration and calendar scheduling
      with asymmetric information while retaining their original constraints and validators.
      Independent interfaces assess world understanding, information access, beliefs, decisions, and
      execution. Controls supply personal evidence or correct beliefs to distinguish state recovery
      from state use. Across six model configurations, these abilities diverge. On matched
      scheduling cases, Claude recovers all agent beliefs correctly but produces subjectively
      optimal plans in only 67.9% of cases. In household collaboration, supplying beliefs raises
      Qwen-27B success from 55.0% to 75.0%, yet Qwen-4B answers every fixed supplied-belief source
      question correctly while completing only 20.0% of the corresponding continuation condition.
      These results show why ToM evaluation must connect perspective inference to independently
      verified decisions and task consequences.
