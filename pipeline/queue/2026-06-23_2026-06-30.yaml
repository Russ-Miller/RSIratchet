      framework in which multiple LLM agents autonomously invent, evolve, and share compact Language
      Symbolism Frameworks (LSFs), while a latent-free router adaptively selects and composes these
      languages per query to optimize the accuracy-token trade-off. Unlike prompt optimization that
      refines surface instructions, CLSR treats each LSF as a reusable symbolic protocol with
      compact symbols, usage rules, and a message-passing contract, and improves it through an
