      to stabilize the training. Besides, we provide a theoretical analysis showing that ordered
      evidence margins induce a positive lower bound on local visual sensitivity. Extensive
      evaluations across hallucination and general-purpose benchmarks demonstrate that
      \\texttt{OPPO} consistently outperforms baseline methods."
