      evaluating their social biases is paramount. However, the current literature suffers from
      widespread methodological fragmentation, which yields contradictory conclusions. This stems
      largely from ignoring the structural framing of benchmark-level evaluations. To resolve this,
      we introduce a unified and controllable framework that standardizes heterogeneous benchmarks
      to systematically contrast isolated demographic assessments with forced-choice comparative
      settings. Crucially, this allows us to disentangle the confounding effects of Chain-of-Thought
      reasoning, neutral fallback options, and other structural artifacts in social bias
      evaluations. Our evaluation across multiple model families reveals a massive, systematic
      paradigm gap: while isolated assessments limit prejudice activation, comparative settings act
      as aggressive catalysts for latent discrimination, a shift primarily driven by underspecified
      contexts. Alarmingly, CoT reasoning exacerbates social biases under comparative settings, and
      this systemic bias persists as a deterministic prejudice even when models are provided neutral
