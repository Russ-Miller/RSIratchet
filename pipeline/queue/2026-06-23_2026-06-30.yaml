      while de novo molecular structure elucidation models operate as black boxes, lacking the
      atom-level interpretability required for rigorous scientific validation. Here, we present
      NMRAgent, an evidential reasoning agent powered by large language models (LLMs) that bridges
      this gap by integrating specialized spectral analysis tools with chemical knowledge graphs.
      Unlike previous approaches, NMRAgent mimics the deductive reasoning of human experts: it takes
