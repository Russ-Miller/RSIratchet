    abstract: "Multimodal Large Language Models (MLLMs) are prone to hallucination as their generation
      preferences are insufficiently calibrated to visual evidence, causing them to fall back on
      linguistic priors, rather than faithful grounding. In this work, we start from an empirical
      observation: when query-relevant visual evidence is explicitly strengthened using the model's
      own attention, generation becomes more accurate, suggesting that many failures do not arise
      solely from missing perception, but from an insufficient tendency to trust the evidence the
      model has already attended to. Motivated by this finding, we propose Oriented Pickup
      Preference Optimization (\\texttt{OPPO}), an evidence-aware alignment objective that learns
      preferences over the strength of visual evidence, rather than only response quality.
      Concretely, \\texttt{OPPO} contrasts the same faithful response under stronger, anchored,
      weaker-evidence views, turning naive visual preference into ordered visual-evidence alignment.
