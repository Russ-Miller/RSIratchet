    abstract: "Quantization is widely used to reduce the inference cost of large language models, but
      its effect on reasoning models is not fully captured by final-answer accuracy or per-token
      latency. We show that low-bit post-training quantization can introduce a hidden test-time
      compute cost: quantized reasoning models often generate longer chains of thought even when
      they still answer correctly. Across mathematical reasoning, code generation, scientific
      question answering, and agentic tool-use benchmarks, we find that INT4/INT3 quantization can
      preserve accuracy but increase reasoning-token usage, offsetting the expected per-token
      speedup. To measure this effect, we introduce the CoT Token Inflation Ratio, which compares
      reasoning length between quantized and full-precision models averaged across all evaluation
      benchmarks. We further show that token inflation is accompanied by behavioral changes in the
      reasoning trace, including more intermediate steps and greater semantic repetition. These
      changes translate into measurable end-to-end real-world serving penalties. Finally, we
      evaluate mitigation strategies and find that prompting and decoding-time sampling offer
      inconsistent accuracy-length trade-offs, while quantization-aware training shows more promise
      in reducing both accuracy degradation and token inflation. Our results suggest that
      reasoning-token usage should be reported alongside accuracy when evaluating quantized
      reasoning models."
