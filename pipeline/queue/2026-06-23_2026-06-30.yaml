      workflows, their evaluation remains fragmented across isolated tasks, while the financial
      relevance of benchmark tasks is often overlooked. Yet financial workflows are inherently
      multi-stage, spanning interdependent tasks such as forecasting, strategy construction, risk
      management, and trading. Existing platforms typically focus on a single task, and can
