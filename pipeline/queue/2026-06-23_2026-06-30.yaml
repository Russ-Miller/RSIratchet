      viewed not only as a property of item text, but also as an observable consequence of the
      problem-solving burden an item induces. Large Reasoning Models (LRMs) offer scalable process
      evidence through reasoning traces, but such evidence must be structured to support
      interpretable modeling. To this end, we introduce Epi2Diff (Episode to Difficulty), a
      framework that maps LRM reasoning traces into cognitively grounded episode sequences. These
      episodes group trace segments into functional problem-solving states, enabling difficulty to
