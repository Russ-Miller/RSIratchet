    abstract: Large Language Models (LLMs) have demonstrated remarkable capabilities across diverse
      tasks, yet they remain prone to generating hallucinations. Detecting these hallucinations is
      critical for deploying LLMs reliably in high-stakes applications. We present Grad Detect, a
      gradient-based approach for predicting hallucinations by analyzing layer-wise gradient
      patterns from a single forward-backward pass during inference. Our method shows that the
      internal gradient structure of a model carries rich information about the correctness of its
      output. This information is not accessible through output-level signals alone. We evaluate
      Grad Detect on several Q&A benchmarks across both hallucination detection and model abstention
      prediction, where it consistently outperforms confidence-based and sampling-based baselines.
      Through comprehensive layer ablation studies across all eleven models from four architectural
      families, we find that the final five layers concentrate over 97% of the discriminative
      gradient signal, enabling efficient deployment with minimal performance loss. Grad Detect
      provides a unified framework for predicting multiple dimensions of LLM reliability, offering
      strong predictive performance alongside interpretable insights into where and how model
      failures originate.
