    abstract: Vision Language Models (VLMs) have emerged in the robotic domain as a powerful tool that
      enables environmental perception with language context, serving as a catalyst for
      open-vocabulary tasks like ObjectNav. Yet, their computational footprint typically confines
      them to cloud execution, hindering low-latency inference with local deployment on
      resource-constrained robots. To address this challenge, we present a distillation strategy
      that transfers complex spatial-semantic reasoning from large frontier models into a
      lightweight, 4B-parameter local VLM for edge execution on embedded GPU devices (e.g., Jetson
      Orin). We first establish a State of the Art (SotA), Scene Graph (SG)-based pipeline using
      Claude Sonnet 4.6, achieving a 39.7% Success Rate (SR) on the HM3D OVON benchmark. We then
      demonstrate that fine-tuning Qwen3.5-4B on just 500 frontier reasoning traces effectively
      enables navigation capabilities, yielding a SR of 34.5%, narrowing the gap to the performance
      of large cloud models. Finally, we introduce E-RLVR with Token Generation (TG) regularization
      to compress output sequence lengths for physical deployment while grounding the agent in its
      task. This downstream optimization reduces TG overhead by 72.1% and latency by 71.8%. Combined
      with quantization, this joint strategy yields a cumulative 82.8% reduction in overall
      inference latency without significantly sacrificing performance, presenting a viable paradigm
      for local, low-latency VLM execution on mobile robots.
