    abstract: Knowledge updating in pre-trained Large Language Models (LLMs) remains an important
      challenge. While continual training provides a potential avenue for knowledge updating, it
      continues to present substantial technical difficulties. Furthermore, LLMs often struggle with
      accurately answering questions about specific factual information, such as news articles - a
      capability limitation widely recognized in the research community. This paper proposes PASTA,
      a simple yet powerful framework for integrating detailed factual information from news
      articles as new knowledge into LLMs, with the primary goal of building specialized models that
      accurately answer questions about this knowledge. Our framework combines data augmentation,
      question-answering generation, and a novel self-learning DPO process that simultaneously
      enables knowledge overwriting and hallucination suppression. We provide insights into
      effective knowledge updating through systematic analysis of learning parameters and data
      configurations. In our experimental evaluation with web articles published after the base
