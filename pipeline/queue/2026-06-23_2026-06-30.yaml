      large language models. Unlike question-answering-based evaluation of cinematic understanding,
      cinematographic captioning requires a unified open-form description over multiple
      cinematographic dimensions. This task is challenging for two main reasons: the model must
      infer professional cinematographic concepts from subtle visual evidence, and it must generate
      captions that are both comprehensive and accurate. Accordingly, we propose CineCap, a
      framework that combines structured reasoning with spatio-temporal anchors and reinforcement
