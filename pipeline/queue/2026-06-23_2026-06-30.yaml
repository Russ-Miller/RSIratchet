    abstract: Retrieval-Augmented Generation (RAG) mitigates hallucinations in Large Language Models
      (LLMs) by grounding the generation process on external knowledge. However, standard RAG
      approaches struggle with multi-hop reasoning. While recent graph-based RAG methods improve the
      retrieval of interconnected chunks, they often rely on computationally expensive and
      error-prone LLM-based extraction pipelines. To address these issues, we propose TIGRAG
      (Token-Induced GraphRAG), an efficient graph-augmented RAG framework based on a token
      co-occurrence Knowledge Graph. TIGRAG directly models topological relationships between tokens
      using sliding-window co-occurrence statistics, thus enabling scalable graph construction.
      During inference, it combines graph-based semantic expansion and neural reranking to retrieve
