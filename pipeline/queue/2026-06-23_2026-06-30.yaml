      can be applied to various MLLMs. Extensive experiments on 7 MLLM backbones and 14 benchmarks
      demonstrate that TOPS outperforms prior methods under diverse pruning settings. Notably, on
      LLaVA-NeXT, TOPS removes 77.8% of visual tokens while preserving 100.0% and 100.6% performance
      on its 7B and 13B models, respectively, suggesting that pruning redundant visual tokens can
