    abstract: Reinforcement learning with verifiable rewards (RLVR) enables large language models (LLMs)
      to continuously self-improve their reasoning capabilities. Compared to RLVR's scalar rewards,
      recent self-supervised on-policy distillation methods leverage denser supervision signals.
      However, both paradigms suffer from exploration bottlenecks, struggling to escape local optima
      when the policy fails to sample valid solutions. Relying on external demonstrations can bypass
      this issue; however, the off-policy nature hinders genuine self-improvement and the
      mismatched-distribution reasoning can not be fully exploited. In this work, we propose
      Self-Evolution Policy Optimization (SEPO), a framework that drives continuous reasoning
      capability evolution via guided exploration and in-distribution exploitation. Specifically,
      SEPO utilizes labels to elicit correct reasoning from the policy, unlocking the exploration
