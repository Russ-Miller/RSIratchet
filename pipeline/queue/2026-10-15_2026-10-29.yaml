    abstract: "In finance, the answer that matters is usually the current one: prices, rates, and
      disclosures hold only as of a given day, so retrieving up-to-date facts is a core capability
      of a financial agent. Yet most financial benchmarks overlook timeliness. They fix each answer
      at annotation time, so the gold goes stale as markets move and, once leaked into training
      data, rewards recall rather than search and analysis. We introduce LiveSearch, a live
      benchmark that stores each question as executable verifier code: a typed program of calls to a
      professional financial data service, followed by a declarative extractor. The question is
      frozen, while its gold answer is determined by executing the program against professional
      financial data at evaluation time, and a daily job re-executes it with no human or language
      model in the loop. A memorized answer is thus likely outdated, and a model must reach the
      current one through tools and analysis. Construction is equally automatic: a language model
      only verbalizes programs enumerated from real tool responses and never chooses an answer.
      Under general web search, six contemporary tool-calling models reach 70.9% to 76.7% answer
      accuracy. Over three consecutive days, 70% of served questions change their gold value, and
      even under tolerance-aware matching, a literally reused earlier snapshot fails on a majority
      of questions within a single day. Per-question tracking uncovers dynamic shifts in correctness
      masked by aggregate accuracy."
