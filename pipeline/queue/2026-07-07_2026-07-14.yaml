      making tool knowledge difficult to share and limited to behaviors observed in past tasks. We
      argue that reusable tool knowledge should instead be maintained by the tool provider. We
      introduce ToolAtlas, a graph-based framework that builds a persistent provider-side tool
      memory of tool capabilities, failure boundaries, and cross-tool compositions through
      execution-verified probing. At inference time, agents query the tool memory via adaptive graph
      traversal. Across two MCP-based benchmarks spanning eight services, ToolAtlas outperforms
      existing tool-side optimization and agent-side memory baselines by up to 21.61% in pass@1 and
