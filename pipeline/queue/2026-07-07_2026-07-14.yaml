      with one another. We show that modern LLM agents fail to do so, often exhibiting myopic and
      polarized interaction patterns that lead to suboptimal coordination and increased regret. We
      formalize this challenge as the Multi-Agent Exploration problem, modeling it as a partially
      observable stochastic game (POSG) problem in which agents must probe peers to infer their
      capabilities and identify effective interaction strategies. To address this, we introduce
      Multi- Agent Contextual Exploration (MACE), a lightweight framework that explicitly promotes
      exploration through structured peer selection. Across both contextual and parametric diversity
      settings, MACE substantially improves exploration behavior and downstream task performance. We
      further show theoretically that the value of exploration increases with agent diversity.
