    abstract: "On-policy distillation is a practical post-training recipe for large language models,
      supplying dense teacher supervision on the student's own trajectories. In privileged-context
      self-distillation, teacher and student are the same model conditioned on the same prefix, but
      the teacher also sees a hint or the full solution trace. This makes supervision abundant but
      harder to trust: the teacher can be confident about continuations its privileged view makes
      obvious but the student cannot yet justify. The distillation pull is strongest where teacher
      and student disagree most, and over many updates it accumulates into drift that degrades
      out-of-distribution (OOD) reasoning. We introduce GeoSD, a geometric self-distillation
      objective that treats this drift as movement in the student's predictive behavior and counters
      it in two complementary ways. A Hellinger loss scales each teacher preference by the overlap
