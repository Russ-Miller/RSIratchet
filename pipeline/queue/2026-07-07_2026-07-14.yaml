    abstract: "Recent Multimodal Large Language Models (MLLMs) achieve strong performance on single-view
      video understanding benchmarks. However, sports videos involve dense occlusion, rapid motion,
      and complex interactions that are difficult to resolve from a single viewpoint. In practice,
      sports events are recorded from multiple camera angles, providing complementary evidence used
      by referees. Yet, no existing benchmark evaluates MLLMs on multi-view sports video
      understanding. To address this gap, we introduce SportMV-Bench, a comprehensive benchmark
      built from official match recordings, through a dedicated pipeline combining LLM-based
      generation, MLLM-based verification, and human filtering to ensure quality and consistency.
