    abstract: Large language models (LLMs) exhibit remarkable capabilities but remain highly vulnerable
      to adversarial prompts and jailbreak attacks. Existing approaches primarily analyze these
      failures through input-output behaviors or attribution methods, offering limited insight into
      how adversarial perturbations alter the model's internal reasoning. Consequently, the
      mechanisms underlying unsafe or incorrect behaviors remain poorly understood. We introduce a
      mechanistic framework for diagnosing LLM vulnerabilities using paired internal computation
      graphs, which represent prompt-specific inference as structured causal interactions among
      latent features. By constructing and aligning computation graphs for clean and attacked
