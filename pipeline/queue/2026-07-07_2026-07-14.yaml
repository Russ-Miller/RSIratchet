    abstract: "Agent systems based on large language models (LLMs) are increasingly deployed for
      autonomous tasks, yet existing evaluations mostly focus on task success rather than whether
      agents know when to abstain. This gap poses real risks: under ambiguity, conflicting
      constraints, or tool failures, agents may execute unintended and irreversible actions. To
      close this gap, we present the first systematic evaluation framework for agentic abstention:
      the calibrated ability of tool-using LLM agents to recognize when not to act. At its core,
      AgentAbstain is a paired-task benchmark built on an agent-native taxonomy of 8 abstention
      scenarios across pre-execution reasoning and runtime discovery. It contains 263 paired tasks
      across 42 executable sandbox environments, where each pair consists of a should-act task and a
      should-abstain variant produced through a controlled perturbation to the instruction, tool, or
      environment state. To scale this paired design and resist data contamination, we propose
      AbstainGen, a fully automated pipeline that synthesizes sandbox environments and generates
      paired tasks end-to-end, validated by deterministic replay and semantic LLM judges; fresh task
