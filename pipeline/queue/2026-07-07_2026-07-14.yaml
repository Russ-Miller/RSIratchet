    abstract: Despite the advancements of Large Multimodal Models (LMMs) in RGB vision, their ability to
      generalize to unseen visual modalities remains a largely unexplored challenge. We argue that
      different visual modalities are merely distinct samplings of the same physical world.
      Therefore, effective generalization requires models to possess both modality-agnostic
      perception of scene semantics and the adaptability to modality-specific characteristics. To
      achieve this, we propose a training framework, VVM-Tuning, to equip LMMs with these
      capabilities through modality synthesis and modality contexts. Specifically, we synthesize
      diverse appearance-varied images from RGB scenes, training the model to disentangle invariant
      semantics from varying visual appearances, and align these appearances with language for
      visual concepts decoupled from modalities. We then introduce modality contexts in the prompt
      and use instruction tuning to assist the model in mapping these appearance variations back to
      modality-related attributes, enabling zero-shot adaptation to unseen modalities during
      inference. To facilitate research in this direction, we introduce VVM-Bench, a comprehensive
      benchmark featuring 6 real and synthetic modalities to evaluate semantic perception and
      modality understanding. Experiments demonstrate that, via our training on synthetic
