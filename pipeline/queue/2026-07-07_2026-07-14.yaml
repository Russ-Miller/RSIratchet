      decision-attributed timing value. These findings reframe the evaluation of LLM-based trading
      agents from capability-centric performance ranking to trace-grounded diagnosis of
      intelligence-to-profit conversion. Our code is available at
      https://anonymous.4open.science/r/TradeLens."
