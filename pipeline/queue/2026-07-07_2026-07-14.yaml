    abstract: Text-based evaluations of Theory of Mind (ToM) in Large Language Models (LLMs) often
      involve cognitive tests akin to the Sally-Anne task that can be gamed due to exposure to
      relevantly similar tasks in pre-training and do not obviously test models' functional ToM
      abilities in ways that generalize to naturalistic settings. To address these issues, we
      introduce the Epistemic Asymmetry Schelling Task (EAST), a two-player dialogue game designed
      to benchmark robust and generalizable ToM abilities. By requiring LLM-LLM dyads to
      independently converge on semantic Schelling points under varying states of epistemic
      transparency, we evaluate whether models can robustly apply ToM to achieve coordination. Our
      results reveal a significant capability gap in functional social reasoning, with only frontier
      models successfully navigating the varying epistemic demands of the tasks. Analysis of
      reasoning traces shows that coordination failures are primarily driven by epistemic tracking
      errors, such as conflating private knowledge with mutual knowledge. Despite high performance
      on traditional static benchmarks, our study shows that robust social reasoning and epistemic
      tracking remain a critical bottleneck, providing concrete targets for future LLM evaluation
      and development.
