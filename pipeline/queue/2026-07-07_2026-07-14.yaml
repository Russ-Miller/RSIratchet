    abstract: In text-to-image in-context learning (T2I-ICL), a model has to infer a latent
      compositional pattern from fewshot demonstrations for generating a query image. Recent studies
      show that state-of-the-art multimodal large language models struggle with this setting,
      particularly due to limited compositional reasoning and sensitivity to prompt construction. In
      this work, we propose a Tree-of-Thoughts (ToT) reasoning framework for T2I-ICL that introduces
      a multi-stage reasoning and selection layer that generates, evaluates, and selects among
      multiple candidate hypotheses before constructing the final prompt for image synthesis. By
      exploring alternative reasoning branches and selecting a coherent interpretation, the proposed
      approach mitigates prompt ambiguity and compositional errors. We implement the proposed
      approach in a complete ToT-T2IICL inference pipeline and evaluate it on the CoBSAT benchmark.
