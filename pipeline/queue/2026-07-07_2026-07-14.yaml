    abstract: "Mixture-of-Experts (MoE) models scale capacity without proportional compute cost and have
      become a key architecture for frontier large language models (LLMs). Yet domain-specific
      post-training inherits an expert pool shaped by mixed-domain pre-training: a substantial
      subset of experts contributes little on the target domain, and standard supervised fine-tuning
      (SFT) leaves the composition of this pool unchanged. We propose a simple, budget-preserving
      pipeline that realigns the expert pool to the target domain before fine-tuning. Given a target
      domain, we (1) prune the experts with lowest domain-aligned saliency, (2) regrow the expert
