    abstract: "Large language model (LLM) agents are increasingly used in trading systems, where model
      reasoning, tool use, and continual decisions incur costs that are expected to produce trading
      value. Existing evaluations typically report performance metrics, but rarely examine agentic
      viability: whether dynamic LLM-mediated decisions convert their induced costs into measurable
      incremental profit. To apply this criterion, we introduce TradeLens, a trace-grounded
      diagnostic toolkit for evaluating agentic trading systems from their trading records, runtime
      traces, and deployment configurations. It reconstructs trading trajectories, attributes profit
      and cost to interpretable evidence, and diagnoses whether and why an agent pays for its own
      intelligence. We conduct extensive analysis across backbone models, capital scales, trading
      frequencies, and system architectures, together with deployment discussion. Our results show
      that viability hinges on intelligence-to-profit conversion: models exhibit different failure
      patterns, such as poor asset selection in DeepSeek-V3.2 and negative timing in GLM-4.7, while
