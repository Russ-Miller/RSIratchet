    abstract: Accurately assessing personality from text is challenging because traits are latent,
      context-dependent, and often subtly expressed across long narratives. Large language models
      (LLMs) offer new opportunities by processing extensive textual contexts, but pretraining of
      these models can induce latent "personality-like" biases, making single-model inferences
      inconsistent. We propose a fine-tuned multi-agent framework for detecting OCEAN personality
      traits, in which sub-agents are conditioned to adopt high, low, or neutral perspectives for
      each trait through masked language modeling (MLM) and psychometric supervision. A judge LLM
      aggregates and compares sub-agent outputs to generate final trait predictions, capturing
      multiple complementary perspectives while mitigating individual model biases. We evaluate the
