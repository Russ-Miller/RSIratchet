    abstract: "Safety alignment in large language models remains brittle across languages: prompts
      reliably refused in English can elicit harmful compliance in non-English and low-resource
      settings. We introduce \\textsc{Minionese}, a multilingual jailbreak benchmark spanning 18
      languages, 4 resource tiers, and 4 perturbation types (standard translation, code-switching,
      transliteration, and translationese), paired with a geometric mechanistic analysis of refusal
      failure across language tiers. We show that each attack type produces a distinct vulnerability
      profile: transliteration vulnerability is mediated by script identity, code-switching
      maintains effectiveness through the lowest-resource tier, and a sharp safety regime transition
      between Tiers 2 and 3 is consistent across all models. Mechanistically, low-resource
      jailbreaks succeed by routing harmful content through a geometrically misaligned subspace that
      projects insufficiently onto the refusal directions, leaving the refusal mechanism intact but
      untriggered. These findings show that English-only safety evaluations are insufficient; they
      require accounting for script family, perturbation type, and per-language alignment coverage.
      The benchmark and analysis code is at
      https://github.com/Brentkong/Minionese-Comprehensive-Benchmark-and-Mechanistic-Study-of-Multi\
      lingual-LLM-Safety.git."
