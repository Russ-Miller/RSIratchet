      trajectories. Through scene representation alignment, ADDT reduces the number of denoising
      steps required and thus significantly accelerates inference. To facilitate strategic
      reasoning, we further construct a large-scale dataset featuring 85k Game-CoT annotations.
      Extensive experiments on the NAVSIM benchmark demonstrate that WCog-VLA achieves a
      State-Of-The-Art (SOTA) PDMS score of 92.9.
