    abstract: Vision-Language-Action (VLA) models have advanced end-to-end autonomous driving. However,
      existing methods either lack comprehensive world cognition or suffer from fragmented world
      foresight, inherently confining these models to reactive driving. To address this limitation,
      we propose WCog-VLA, a novel dual-level World-Cognitive VLA framework that successfully
      bridges semantic world forecasting with generative world evolution to achieve proactive
      autonomous driving. At the semantic level, WCog-VLA unifies world cognition and reasoning by
