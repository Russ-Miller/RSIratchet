    abstract: 'Large-Language Models (LLMs) can be prone to flawed and unfaithful reasoning that
      decoding strategies like Self-Consistency (SC) fail to detect as they evaluate only
      final-answer agreement while ignoring the logical validity of intermediate steps. This raises
      three fundamental questions: How can we reliably quantify uncertainty in LLM reasoning? Can
      semantic, structural, and causal awareness select more faithful reasoning compared to naïve
      majority voting? and How robust is reasoning topology under adversarial conditions? To address
      these questions, we introduce GRAPHEVAL, a graph-based reasoning framework that re-frames
      uncertainty quantification (UQ) as a holistic reasoning fidelity problem. We propose a novel
      UQ metric, Graph Reasoning Coherence Score (GRCS), that quantifies semantic-structural
      consensus of the reasoning space and captures pathological mode collapse and confident
      hallucinations. We find that GRCS is the only metric that is consistently negatively
      correlated with reasoning faithfulness across both more capable and smaller models.
