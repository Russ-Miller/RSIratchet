      proposed_label: Recognizing missing perspectives in one-sided accounts
      scope_note: Covers whether a model treats an unopposed narrator's account as complete and adopts its
        framing, versus seeking absent viewpoints; excludes caving to explicit user pushback
        (sycophancy).
      rationale: The paper defines 'narrative captivity' where multi-turn one-sided narration alone shifts
        moral judgments without any opposing pressure.
