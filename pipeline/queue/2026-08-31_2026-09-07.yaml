    abstract: "Idiomatic expressions are an integral part of natural language, reflecting cultural
      nuances and posing unique challenges for computational models, particularly in low-resource
      languages. In this paper, we present the first large-scale benchmark dataset of Bangla idioms,
      complemented by a synthetic multiple-choice question (MCQ) dataset for idiom meaning
      identification. We conduct a comprehensive evaluation of recent large language models (LLMs)
      across three idiom-related tasks: paraphrasing, idiom span detection, and meaning
      identification, leveraging zero-shot and few-shot prompting strategies. Our results reveal
      substantial variability in model performance, with no single LLM consistently outperforming
      others across all tasks. Notably, Phi-4-mini-instruct excels in paraphrasing,
      Kimi-K2-32b-instruct in span detection, and Gemini-2.5-flash in meaning identification. We
      believe that our datasets and analyses will provide valuable resources to guide future
      research in improving LLM comprehension of idiomatic expressions, particularly in Bangla and
      other low-resource languages."
    proposal:
      proposed_id: idiom-understanding
      proposed_label: Interpreting idioms and figurative language
      scope_note: Covers detecting and interpreting non-literal, culturally grounded expressions; excludes
        general low-resource-language translation quality.
      rationale: The paper benchmarks LLMs on Bangla idiom span detection, paraphrasing, and meaning
        identification.
