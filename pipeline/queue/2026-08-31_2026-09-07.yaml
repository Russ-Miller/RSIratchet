    venue: arXiv (Cornell University)
    topic: Distributed and Parallel Computing Systems
    cited_by_count: 0
    abstract: The emergence of modern agents powered by large language models has created a demand for
      executing long-horizon, autonomous workflows in various domains that require significant
      computational resources. While High Performance Computing clusters provide the ideal
      infrastructure for these computation-intensive workloads, traditional HPC job schedulers such
      as Slurm are not designed for dynamic, agentic workflows characterized by unpredictable task
      durations, external API calls, and fault tolerance requirements of modern agents. This work
      presents RASER, a user-space framework that enables seamless execution of agentic workflows on
      production HPC clusters by extending Slurm's internal primitives. RASER introduces agentic job
      arrays with work stealing via shared filesystem queues, user-space checkpointing through
      application-level state serialization combined with Slurm requeue, and Apptainer
      container-based isolation without requiring any image modifications. Evaluations demonstrate
      that RASER reduces makespan by nearly 39% compared to static partitioning while achieving
      near-full CPU utilization. RASER provides resilience against preemption and failures while
      maintaining minimal checkpoint/restore overhead. It requires no kernel privileges or external
      database infrastructure, making it an accessible solution for deploying agentic workflows on
      existing HPC infrastructure.
