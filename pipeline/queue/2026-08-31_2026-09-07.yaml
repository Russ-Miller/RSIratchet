    abstract: "Dreaming and large language model hallucination are usually studied apart, one as biology
      and the other as engineering. We argue they are two expressions of a single computation:
      generative reconstruction from distributed memory under incomplete constraints. Neither the
      sleeping brain nor an autoregressive model retrieves stored records; both synthesize output by
      recombining learned representations, and both produce fluent, structured content that can
      depart from fact. We organize the two systems with a four-stage account, encoding, latent
      representation, generative reconstruction, and reality verification, and argue that the
      difference between a reliable output and a hallucination or a dream is governed by one
      variable: the strength of the constraints and verification acting on the generator. In the
      brain these are sensory evidence and prefrontal control, both attenuated in REM sleep; in a
      model they are grounding and external checking, both absent in free decoding. We state where
      the mapping holds and where it breaks (it is computational, not phenomenal, and dreaming may
      be adaptive where hallucination is an unselected byproduct), and we separate our claim from
      accounts that treat dreams as training-time regularization or hallucination as narrativity. On
      this view, hallucination is the expected behavior of a generative memory whose verification
