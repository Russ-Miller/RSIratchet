    venue: arXiv
    abstract: "Coding harnesses such as Claude Code and OpenHands wrap foundation models with tools,
      memory, and planning, but no equivalent exists for embodied agents&#39; long-horizon
      partial-observability decision-making. We first report our Gemini Plays Pokemon (GPP)
      experiments. With iterative human-in-the-loop harness refinement, GPP became the first AI
      system to complete Pokemon Blue, Yellow Legacy on hard mode, and Crystal without a lost
      battle. In the hardest stages, the agent itself began iterating on its strategy through
      long-context memory, surfacing emergent self-improvement signals alongside human-in-the-loop
      refinement. Continual Harness removes the human fully from this loop: a reset-free
      self-improving harness for embodied agents that formalizes and automates what we observed.
      Starting from only a minimal environment interface, the agent alternates between acting and
      refining its own prompt, sub-agents, skills, and memory, drawing on any past trajectory data.
      Prompt-optimization methods require episode resets; Continual Harness adapts online within a
      single run. On Pokemon Red and Emerald across frontier models, Continual Harness starting from
      scratch substantially reduces button-press cost relative to the minimalist baseline and
      recovers a majority of the gap to a hand-engineered expert harness, with capability-dependent
      gains, despite starting from the same raw interface with no curated knowledge, no hand-crafted
      tools, and no domain scaffolding. We then close the loop with the model itself: an online
