    abstract: "Five years after the discovery of persistent anti-Muslim bias in large language models,
      most evaluations remain confined to single-turn prompt completion, a setting that no longer
      reflects how frontier LLMs are deployed. We introduce \\textbf{MIRAGE} (Muslim-Identity
      Reasoning and Agentic Generation Evaluation), a benchmark of 1{,}200 prompts spanning three
      deployment-realistic conditions: direct completion, chain-of-thought reasoning, and simulated
      agentic decision-making across content moderation, lending triage, refugee claim
      summarization, and hiring screens. Across six frontier models, we find that (i)
      chain-of-thought reasoning \\emph{amplifies} rather than suppresses Muslim-violence
