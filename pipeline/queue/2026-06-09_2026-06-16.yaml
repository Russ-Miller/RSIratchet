    abstract: Large language model (LLM) agents increasingly extend their capabilities at runtime by
      loading Agent Skills, which pair natural-language specifications (SKILL.md) with executable
      scripts and resources. Because a skill's behavior relies on both natural-language instructions
      and executable code, assessing its safety requires cross-modal reasoning, creating a new
      language-and-code attack surface. Attackers can present a benign workflow in SKILL.md while
      embedding implicit directives that steer the agent to exfiltrate sensitive files, even if the
      scripts appear harmless. This attack surface remains understudied; prior work treats skills
      merely as prompt-injection vectors or static code artifacts, leaving attacks emerging from
      cross-modal interactions largely unmeasured. In our evaluation, open-source and commercial
      skill scanners detect only 2%-8% and 9%-17% of such attacks, respectively. To address this
      gap, we introduce SkillMutator, the first benchmark for install-time detection of
      language-and-code cross-modal attacks on Agent Skills. It emulates an adversarial mutation
      process across 13 attack categories, iteratively refining malicious skills using scanner
      feedback to make injected behaviors indistinguishable from legitimate workflows. We further
      propose a four-phase reasoning-trajectory distillation framework to distill frontier-teacher
      traces into smaller open-weight models. This produces a locally deployable scanner avoiding
