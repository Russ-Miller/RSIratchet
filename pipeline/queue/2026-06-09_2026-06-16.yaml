    abstract: Reinforcement Learning with Verifiable Rewards (RLVR) has become an effective
      post-training paradigm for improving the reasoning abilities of large language models.
      However, existing RLVR methods typically rely on final-answer correctness to assign
      trajectory-level rewards, providing sparse supervision and treating all tokens uniformly
      regardless of their actual contribution to reasoning. Although recent studies introduce
      intermediate signals such as process rewards, high-entropy tokens, and semantic uncertainty,
      these signals are often not inherently verifiable and may fail to distinguish beneficial
      strategic patterns from harmful ones. To address this limitation, we propose STRIDE (Strategic
      Trajectory Reasoning with Discriminative Estimation), a fine-grained RLVR framework that
      derives strategic reasoning supervision from verifiable outcomes. STRIDE contrasts successful
      and failed trajectories within each response group to estimate the outcome-discriminative
      preference of each $n$-gram strategic pattern, and further combines this signal with reasoning
