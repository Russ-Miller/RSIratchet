    abstract: Affordance reasoning, the inference of an object's action possibilities from its physical
      properties (e.g., shape and material), is fundamental to human physical understanding and
      increasingly critical for Large Language Models (LLMs). However, existing affordance
      benchmarks largely expose explicit object identities in the evaluation setup, allowing models
      to rely on memorized object-affordance mappings rather than reasoning over physical
      properties. To address this gap, we introduce Affordance20Q, a novel affordance reasoning
      benchmark formulated as a 20-Questions game without exposing the object's identity. In each
      game, the model identifies a hidden object's affordance from a candidate set by asking yes/no
      questions about its physical properties. Affordance20Q comprises 1,009 games over 454 objects
      and 59 affordances, all manually filtered, refined, and annotated. We conduct comprehensive
      experiments with 15 state-of-the-art LLMs and find a substantial gap (~20 points) compared to
      human performance. A KL-based information-gain (IG) analysis further shows that models fail to
      ask discriminating questions as the game progresses. To close the gap, we develop KB-Anchored
      Rule Induction (KARI), a pipeline based on LLMs that generates affordance rules grounded in
