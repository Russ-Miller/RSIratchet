      differentiated advantage values during RL optimization, enabling more precise credit
      assignment while preserving the verifiability of RLVR. Extensive experiments demonstrate that
      STRIDE consistently improves reasoning performance across diverse models, tasks, and extended
      settings, including VLMs and agent-based systems.
