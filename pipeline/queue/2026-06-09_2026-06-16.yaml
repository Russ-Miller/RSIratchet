      RL-based fixes typically add a binary language fidelity reward to the accuracy objective, yet
      still incur trade-off in accuracy, mid-trace code-switching, and excessive token usage. In
      this work, we propose AdaMame, a two-stage training recipe for multilingual mathematical
      reasoning that addresses these limitations by adaptively aligning the reasoning language to
      the query language without compromising accuracy. The first SFT stage fine-tunes on non-MT
      reasoning traces across five languages to establish multilingual reasoning capability. In the
      subsequent RL stage, we introduce AdaMame-GRPO, an adaptation of Group Relative Policy
      Optimization (GRPO) in which a query-conditioned alignment factor grows progressively during
      training, guiding the model to first explore diverse reasoning languages before exploiting
      reasoning in the query language. Evaluated across two benchmarks, two LRMs, and 12 languages,
      AdaMame-GRPO achieves Pareto-optimal performance across reasoning accuracy, language fidelity,
      and token efficiency over all baselines, with the strongest gains on out-of-domain,
      lower-resource languages.
