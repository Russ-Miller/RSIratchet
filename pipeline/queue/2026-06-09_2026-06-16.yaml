      in multi-step execution due to insufficient tool-related knowledge and ineffective knowledge
      activation. Therefore, we present a systematic study on how knowledge influences tool-use
      performance, covering the stages of knowledge acquisition, activation, and internalization. In
      the knowledge acquisition stage, we acquire and evaluate various forms of experiential
      knowledge, and our analysis shows that simple instance-level knowledge can already provide
      strong and reliable gains, while abstract intent-level knowledge offers limited benefits. At
      inference time, to activate knowledge, we find that prompting LLM to expand the depth of
      reasoning yields diminishing returns, whereas expanding the width of reasoning by parallel
      sampling with aggregation more effectively activates latent experiential knowledge. At
      training time, for knowledge internalization, post-training with knowledge-augmented data
      further improves performance, with reinforcement learning outperforming supervised
      fine-tuning. Based on these insights, we propose the Knowledge-Augmented Tool Execution
      (KATE), a knowledge-augmented tool execution framework that integrates experiential knowledge
