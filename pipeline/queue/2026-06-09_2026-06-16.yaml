    abstract: Recent advances in reasoning and tool-calling capabilities of large language models (LLMs)
      have enabled increasingly capable agentic systems. However, existing benchmarks remain limited
      in task complexity, realism, and domain diversity, and often fail to capture interactions that
      span multiple domains, limiting their ability to evaluate agents in realistic multi-step
      settings that require sustained reasoning and coordination. To address these limitations, we
      introduce T1-Bench, a high-fidelity, comprehensive benchmark for evaluating agentic systems in
      realistic customer-facing, multi-domain environments, featuring interleaved scenarios that
      require structured reasoning across multi-turn user-assistant interactions and substantially
      increasing both compositional complexity and evaluative rigor across 25 domains of varying
      difficulty. We evaluate T1-Bench using 12 proprietary and open-weight models, providing a
      reproducible and standardized framework for assessing agent behavior, tool utilization, and
      conversational quality in complex, multi-step environments. We further complement automatic
      evaluation with human judgments to strengthen the assessment of qualitative performance.
      Overall, T1-Bench substantially advances prior benchmarks by increasing task complexity,
      interaction depth, and domain coverage in simulated multi-domain environments. To facilitate
      future research on agentic systems, we will publicly release data and evaluation code as open
      source.
