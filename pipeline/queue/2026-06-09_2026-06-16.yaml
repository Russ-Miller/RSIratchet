      parameter updates. We investigate the limits of ICL for structured generation under
      distribution mismatch, using high-cardinality tabular data as a controlled test case, and
      identify a structural failure mode we term \\textit{categorical prior lock-in}: the inability
      of ICL to update the model's prior over token distributions inherited from pre-training.
      Across two 7B-parameter open-weight models, ICL improves numerical fidelity with additional
      examples but exhibits a sharp ceiling on categorical distributions, failing to reproduce rare
      classes entirely. Parameter-efficient fine-tuning (LoRA) overcomes these limitations but
