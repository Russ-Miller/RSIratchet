      the need for future-proof evaluation benchmarks. Existing benchmarks such as BrowseComp rely
      on static knowledge, making them vulnerable to test-set contamination and parametric
      memorization. Consequently, models can achieve high scores through fact recall rather than
      genuine retrieval, obscuring true browsing competence via reasoning shortcuts. In this paper,
      we introduce EvoBrowseComp, an evolving benchmark of 400 English and 400 Chinese
      contamination-free complex questions synthesized via live-web traversal. To collect these
      questions, we design a three-agent collaborative framework: (1) a QA synthesis agent that
      retrieves fresh knowledge from the live web to synthesize QA pairs; (2) an information
      filtering agent that filters retrieved knowledge in terms of credibility and popularity to
