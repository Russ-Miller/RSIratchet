    abstract: "Large language models (LLMs) are increasingly used for tasks once reserved for trained
      researchers, including hypothesis generation, specification choice, and drafting conclusions.
      We argue that the reliability of AI-assisted research depends not only on model capability,
      but also on how cognitive labour is structured between humans and machines. We study this
      problem through Human-in-the-Loop Economic Research (HLER), a decision architecture based on
      pre-commitment, decision sequencing, accountability, and attention allocation. In a
      pre-specified 2*4 factorial experiment with 280 complete research runs across four datasets,
      an unconstrained multi-agent baseline produced critical failures in 72% of runs. Using the
      same underlying model, the same agent decomposition, and identical prompts for the shared
      reasoning agents, HLER reduced the failure rate to 16% by imposing three architectural
      commitments: LLMs reason but do not execute data work, data and estimation are handled
      deterministically, and three human decision gates bind the workflow. Fisher's exact test
