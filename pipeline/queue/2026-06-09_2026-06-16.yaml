      is particularly challenging under the zero-source constraint, where no model internals or
      external references are available, and detection must rely solely on the textual query-answer
      pair. In this paper, we propose Human-like Criteria Probing for Hallucination Detection
      (HCPD), a paradigm that emulates the multi-faceted reasoning of human evaluators. Its core is
      a Human-like Criteria Probing (HCP) mechanism, in which a LLM agent adaptively decomposes its
