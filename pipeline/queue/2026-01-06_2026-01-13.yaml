    abstract: Chain-of-Thought (CoT) reasoning improves multi-step mathematical problem solving in large
      language models but remains vulnerable to exposure bias and error accumulation, as early
      mistakes propagate irreversibly through autoregressive decoding. In this work, we propose
      DiffCoT, a diffusion-styled CoT framework that reformulates CoT reasoning as an iterative
      denoising process. DiffCoT integrates diffusion principles at the reasoning-step level via a
      sliding-window mechanism, enabling unified generation and retrospective correction of
      intermediate steps while preserving token-level autoregression. To maintain causal
      consistency, we further introduce a causal diffusion noise schedule that respects the temporal
      structure of reasoning chains. Extensive experiments on three multi-step CoT reasoning
      benchmarks across diverse model backbones demonstrate that DiffCoT consistently outperforms
