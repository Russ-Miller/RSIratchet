      evaluation methodology: a deterministic Electrical Rule Checking (ERC) engine categorizes
      topological faults by strict severity (Critical, Major, Minor, Warning), while an
      LLM-as-a-judge meta-evaluator identifies complex, context-aware design flaws that bypass
