      LLMs place them at the center of solving software development-related tasks such as code
      generation. However, direct use of LLM generated code in production software development
      systems is problematic. The code could be unstable or erroneous and contain vulnerabilities
      such as data poisoning, malicious attacks, and hallucinations that could lead to widespread
      system malfunctions. This prohibits the adoption of LLM generated code in production AI
