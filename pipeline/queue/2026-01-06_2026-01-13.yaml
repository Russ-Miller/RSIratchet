    abstract: "Long-horizon applications increasingly require large language models (LLMs) to answer
      queries when relevant evidence is sparse and dispersed across very long contexts. Existing
      memory systems largely follow two paradigms: explicit structured memories offer
      interpretability but often become brittle under long-context overload, while latent memory
      mechanisms are efficient and stable yet difficult to inspect. We propose LatentGraphMem, a
      memory framework that combines implicit graph memory with explicit subgraph retrieval.
      LatentGraphMem stores a graph-structured memory in latent space for stability and efficiency,
      and exposes a task-specific subgraph retrieval interface that returns a compact symbolic
      subgraph under a fixed budget for downstream reasoning and human inspection. During training,
      an explicit graph view is materialized to interface with a frozen reasoner for
