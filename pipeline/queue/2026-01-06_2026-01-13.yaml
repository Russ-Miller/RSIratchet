      (LLMs) frequently hallucinate components, violate strict physical constraints, and produce
      non-machine-readable outputs. To address this, we present CircuitLM, a multi-agent pipeline
      that translates user prompts into structured, visually interpretable $\\texttt{CircuitJSON}$
      schematics. The framework mitigates hallucination and ensures physical viability by grounding
      generation in a curated, embedding-powered component knowledge base through five sequential
      stages: (i) component identification, (ii) canonical pinout retrieval, (iii) chain-of-thought
      reasoning, (iv) JSON schematic synthesis, and (v) interactive force-directed visualization. We
