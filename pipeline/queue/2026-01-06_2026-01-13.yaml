      explanations and cannot be effectively contested to correct errors, undermining
      trustworthiness. In this paper, we propose ART (Adaptive Reasoning Trees), a hierarchical
      method for claim verification. The process begins with a root claim, which branches into
      supporting and attacking child arguments. An argument's strength is determined bottom-up via a
