      in investment contexts. A large set of multiple-choice questions is generated by varying
      objectives, candidate assets, and investment constraints, with each problem designed to
      include a unique correct solution and systematically constructed alternatives. Experimental
      results comparing GPT-4, Gemini 1.5 Pro, and Llama 3.1-70B reveal distinct performance
      patterns: GPT achieves the highest accuracy in risk-based objectives and remains stable under
      constraints, Gemini performs well in return-based tasks but struggles under other conditions,
