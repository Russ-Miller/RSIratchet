      to interpret and automate the analysis reliably. To support scalable and trustworthy analysis,
      this paper introduces ESG-Bench, a benchmark dataset for ESG report understanding and
      hallucination mitigation in large language models (LLMs). ESG-Bench contains human-annotated
      question-answer (QA) pairs grounded in real-world ESG report contexts, with fine-grained
      labels indicating whether model outputs are factually supported or hallucinated. Framing ESG
      report analysis as a QA task with verifiability constraints enables systematic evaluation of
      LLMs' ability to extract and reason over ESG content and provides a new use case: mitigating
      hallucinations in socially sensitive, compliance-critical settings. We design task-specific
      Chain-of-Thought (CoT) prompting strategies and fine-tune multiple state-of-the-art LLMs on
      ESG-Bench using CoT-annotated rationales. Our experiments show that these CoT-based methods
      substantially outperform standard prompting and direct fine-tuning in reducing hallucinations,
