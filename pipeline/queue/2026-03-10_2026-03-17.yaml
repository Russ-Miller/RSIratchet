    abstract: "Large language models (LLMs) have demonstrated significant potential in formal theorem
      proving, yet state-of-the-art performance often necessitates prohibitive test-time compute via
      massive roll-outs or extended context windows. In this work, we address this scalability
      bottleneck by exploiting an informative structure in formal verification: the observation that
      compilers map a vast space of diverse proof attempts to a compact set of structured failure
      modes. We introduce a learning-to-refine framework that leverages this compression to perform
      efficient learning and proof exploration. We perform tree search that corrects errors locally
      conditioned on explicit verifier feedback, thereby circumventing the costs associated with
      accumulating a long history of proof attempts. Extensive evaluations show that our method
      consistently amplifies the reasoning capabilities of base provers across varying scales.
      Notably, our approach achieves state-of-the-art performance on PutnamBench among publicly
      reported $\\sim$8B and $\\sim$32B parameter models under comparable test-time budgets,
      offering a scalable paradigm for next-generation verifier-guided reasoning."
