      iterative retrieval with reasoning processes via end-to-end training. While these approaches
      improve problem-solving performance, they still face challenges in task reasoning and model
      training, especially ambiguous retrieval execution paths and sparse rewards in end-to-end
      reinforcement learning (RL), which can lead to inaccurate retrieval results and lower
      performance. We attribute these failures to hierarchical credit entanglement: a single final
      reward updates planning and execution together, so the model cannot clearly separate plan
