      access protocols. In this work, we introduce EnterpriseOps-Gym, a benchmark designed to
      evaluate agentic planning in realistic enterprise settings. Specifically, EnterpriseOps-Gym
      features a containerized sandbox with 164 database tables and 512 functional tools to mimic
      real-world search friction. Within this environment, agents are evaluated on 1,150
