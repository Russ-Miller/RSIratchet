      spatial constraints, we annotate 750 chain of thought traces with an error taxonomy that
      surfaces four candidate causal failure modes, then test them with targeted interventions
      simulating each error type. These interventions show that certain error patterns like
      premature commitment and constraint forgetting have a direct impact on the ability to solve
      the puzzle, while repeated reasoning is a benign effect of search. Finally we study mitigation
      strategies including prompt guidance, cell-aligned grid representations and tool-based
      constraint checking, finding that the bottleneck lies in extracting constraints from spatial
      representations and not in reasoning over them. Code and data are available at
      github.com/mayug/topobench-benchmark.
