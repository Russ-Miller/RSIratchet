      programming languages (Brainfuck, Befunge-98, Whitespace, Unlambda, and Shakespeare). All five
      of our chosen esoteric languages are Turing-complete, so the same algorithmic problems that
      are solvable in Python or JavaScript are in principle solvable in each of them. Yet, they are
      unfamiliar to LLMs which makes them a good proxy for evaluating out-of-distribution
      performance. The unfamiliarity of esoteric languages comprises of: (i) the hard-by-design
      primitives comprising the language; (ii) substantially less representation in pre-training
      corpora (340x to over 60,000x fewer public GitHub repositories than Python); (iii) negligible
      deployment value, which makes targeted inclusion in post-training data economically
      irrational. We evaluate five frontier models across five prompting strategies and find a
