    abstract: "As large language models (LLMs) are deployed as autonomous agents with tool execution
      privileges, a critical assumption underpins their security architecture: that model errors are
      detectable at runtime, allowing monitoring systems, guardrails, or human reviewers to
      intervene before the agent acts. We present empirical evidence from a preliminary cohort of
      LLMs that this assumption fails for two of three instruction-following models evaluable for
      conflict detection; broader replication across additional architectures and scales is needed
      to establish prevalence rates. We introduce the concept of governability — the degree to which
      a model's errors are detectable before output commitment and correctable once detected — and
      demonstrate that it is an empirically measurable property that varies dramatically across
      models and capability domains. In our evaluation of six language models across twelve
      reasoning capability domains, two out of three instruction-following models evaluable for
      conflict detection exhibited silent commitment failure: confident, fluent, incorrect output
      with zero predictive warning signal. The remaining model produced a detectable conflict signal
      57 tokens before commitment — sufficient for pre-action intervention. We further show that
      benchmark accuracy does not predict governability, that correction capacity varies
      independently of detection, and that identical governance scaffolds produce opposite effects
