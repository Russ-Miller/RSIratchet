      generative models fail to recognize. This leads to Physical Hallucination: the generation of
      syntactically correct solvers that faithfully execute physically invalid laws. Here, we
      introduce a Neuro-Symbolic Generative Agent that functions as a cognitive supervisor atop
      traditional numerical engines. By encapsulating physical laws into modular Constitutive Skills
      and leveraging latent intrinsic priors, the Agent employs a Chain-of-Thought reasoning
