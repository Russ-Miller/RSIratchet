      decoding, which we empirically show correlate with factual errors, biases, and failures.
      Similar to Orgad et al. (2025), our method localizes the exact answer token and subsequently
      tests for hallucinations. Crucially, however, we achieve this without requiring trained probe
      classifiers or activation ablations. Instead, we introduce two completely training-free
      metrics derived directly from output logits: spilled energy, which captures the discrepancy
      between energy values across consecutive generation steps that should theoretically match, and
      marginalized energy, which is measurable at a single step. Evaluated on nine benchmarks across
      state-of-the-art LLMs (including LLaMA, Mistral, and Gemma) and on synthetic algebraic
      operations (Qwen3), our approach demonstrates robust, competitive hallucination detection and
      cross-task generalization. Notably, these results hold for both pretrained and
