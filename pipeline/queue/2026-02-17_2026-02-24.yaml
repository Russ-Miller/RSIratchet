      agents has established planning as a core component of modern intelligence. However, achieving
      generalized planning remains elusive, not only by the scarcity of high-quality interaction
      data but also by inherent conflicts across heterogeneous planning tasks. These challenges
      result in models that excel at isolated tasks yet struggle to generalize, while existing
      multi-task training attempts suffer from gradient interference. In this paper, we present
      \textbf{MagicAgent}, a series of foundation models specifically designed for generalized agent
      planning. We introduce a lightweight and scalable synthetic data framework that generates
      high-quality trajectories across diverse planning tasks, including hierarchical task
