      their causal reasoning ability. While recent work has demonstrated that labeled counterfactual
      tasks can be useful benchmarks of LLMs' causal reasoning, producing such data at the scale
      required to cover the vast potential space of counterfactuals is limited. In this work, we
      introduce double counterfactual consistency (DCC), a lightweight inference-time method for
      measuring and guiding the ability of LLMs to reason causally. Without requiring labeled
      counterfactual data, DCC verifies a model's ability to execute two important elements of
      causal reasoning: causal intervention and counterfactual prediction. Using DCC, we evaluate
