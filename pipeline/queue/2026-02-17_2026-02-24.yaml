      introduce Timestamped Audio Captioner (TAC), a model that produces temporally grounded audio
      descriptions at varying degrees of detail and resolution. TAC is trained with a synthetic data
      pipeline that constructs challenging and dynamic mixtures from real-world audio sources,
      enabling robust learning under realistic polyphonic conditions. Across event detection and
