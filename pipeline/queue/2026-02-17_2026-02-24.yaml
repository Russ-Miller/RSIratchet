    abstract: Modern large language models (LLMs) excel at generating fluent and faithful translations.
      However, they struggle to preserve an author's unique literary style, often producing
      semantically correct but generic outputs. This limitation stems from the inability of current
      single-model and static multi-agent systems to perceive and adapt to stylistic variations. To
      address this, we introduce the Style-Adaptive Multi-Agent System (SAMAS), a novel framework
      that treats style preservation as a signal processing task. Specifically, our method
      quantifies literary style into a Stylistic Feature Spectrum (SFS) using the wavelet packet
      transform. This SFS serves as a control signal to dynamically assemble a tailored workflow of
      specialized translation agents based on the source text's structural patterns. Extensive
