      variation across laboratories and imaging setups. Existing vision models struggle in this
      domain since they lack physical priors and cannot generalize to new materials or hardware
      conditions. This work presents a new physics-aware multimodal framework that addresses these
      limitations from both the data and model perspectives. We first present Synthia, a
      physics-based synthetic data generator that simulates realistic optical responses of quantum
      material flakes under thin-film interference. Synthia produces diverse and high-quality
      samples, helping reduce the dependence on expert manual annotation. We introduce
