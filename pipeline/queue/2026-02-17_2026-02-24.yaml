    abstract: "Activation steering, or representation engineering, offers a lightweight approach to
      align large language models (LLMs) by manipulating their internal activations at inference
      time. However, current methods suffer from two key limitations: (i) the lack of a unified
      theoretical framework for guiding the design of steering directions, and (ii) an over-reliance
      on one-step steering that fail to capture complex patterns of activation distributions. In
      this work, we propose a unified ordinary differential equations (ODEs)-based theoretical
      framework for activation steering in LLM alignment. We show that conventional activation
      addition can be interpreted as a first-order approximation to the solution of an ODE. Based on
      this ODE perspective, identifying a steering direction becomes equivalent to designing a
      barrier function from control theory. Derived from this framework, we introduce ODESteer, a
      kind of ODE-based steering guided by barrier functions, which shows empirical advancement in
      LLM alignment. ODESteer identifies steering directions by defining the barrier function as the
      log-density ratio between positive and negative activations, and employs it to construct an
