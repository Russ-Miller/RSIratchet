    abstract: With the rapid advancement of agent-based methods in recent years, Agentic RAG has
      undoubtedly become an important research direction. Multi-hop reasoning, which requires models
      to engage in deliberate thinking and multi-step interaction, serves as a critical testbed for
      assessing such capabilities. However, existing benchmarks typically provide only final
      questions and answers, while lacking the intermediate hop-level questions that gradually
      connect atomic questions to the final multi-hop query. This limitation prevents researchers
      from analyzing at which step an agent fails and restricts more fine-grained evaluation of
      model capabilities. Moreover, most current benchmarks are manually constructed, which is both
      time-consuming and labor-intensive, while also limiting scalability and generalization. To
      address these challenges, we introduce AgenticRAGTracer, the first Agentic RAG benchmark that
      is primarily constructed automatically by large language models and designed to support
