    abstract: Hallucination detection is critical for ensuring the reliability of large language models
      (LLMs) in context-based generation. Prior work has explored intrinsic signals available during
      generation, among which attention offers a direct view of grounding behavior. However,
      existing approaches typically rely on coarse summaries that fail to capture fine-grained
      instabilities in attention. Inspired by signal processing, we introduce a frequency-aware
      perspective on attention by analyzing its variation during generation. We model attention
      distributions as discrete signals and extract high-frequency components that reflect rapid
      local changes in attention. Our analysis reveals that hallucinated tokens are associated with
