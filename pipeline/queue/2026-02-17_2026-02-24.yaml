    abstract: "Benchmarking spatial reasoning in multimodal large language models (MLLMs) has attracted
      growing interest in computer vision due to its importance for embodied AI and other agentic
      systems that require precise interaction with the physical world. However, spatial reasoning
      on Earth imagery has lagged behind, as it uniquely involves grounding objects in georeferenced
      images and quantitatively reasoning about distances, directions, and topological relations
      using both visual cues and vector geometry coordinates (e.g., 2D bounding boxes, polylines,
      and polygons). Existing benchmarks for Earth imagery primarily focus on 2D spatial grounding,
      image captioning, and coarse spatial relations (e.g., simple directional or proximity cues).
      They lack support for quantitative direction and distance reasoning, systematic topological
      relations, and complex object geometries beyond bounding boxes. To fill this gap, we propose
      \\textbf{EarthSpatialBench}, a comprehensive benchmark for evaluating spatial reasoning in
      MLLMs on Earth imagery. The benchmark contains over 325K question-answer pairs spanning: (1)
      qualitative and quantitative reasoning about spatial distance and direction; (2) systematic
      topological relations; (3) single-object queries, object-pair queries, and compositional
      aggregate group queries; and (4) object references expressed via textual descriptions, visual
