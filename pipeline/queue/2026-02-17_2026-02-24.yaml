    abstract: Facial Expression Recognition (FER) is a fine-grained visual understanding task where
      reliable predictions require reasoning over localized and meaningful facial cues. Recent
      vision--language models (VLMs) enable natural language explanations for FER, but their
      reasoning is often ungrounded, producing fluent yet unverifiable rationales that are weakly
      tied to visual evidence and prone to hallucination, leading to poor robustness across
      different datasets. We propose TAG (Thinking with Action Unit Grounding), a vision--language
      framework that explicitly constrains multimodal reasoning to be supported by facial Action
      Units (AUs). TAG requires intermediate reasoning steps to be grounded in AU-related facial
      regions, yielding predictions accompanied by verifiable visual evidence. The model is trained
      via supervised fine-tuning on AU-grounded reasoning traces followed by reinforcement learning
      with an AU-aware reward that aligns predicted regions with external AU detectors. Evaluated on
      RAF-DB, FERPlus, and AffectNet, TAG consistently outperforms strong open-source and
      closed-source VLM baselines while simultaneously improving visual faithfulness. Ablation and
      preference studies further show that AU-grounded rewards stabilize reasoning and mitigate
      hallucination, demonstrating the importance of structured grounded intermediate
      representations for trustworthy multimodal reasoning in FER. The code will be available at
      https://github.com/would1920/FER_TAG .
