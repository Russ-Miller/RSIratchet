    abstract: Dual-to-Dual MLLMs refer to Multimodal Large Language Models, which can enable unified
      multimodal comprehension and generation through text and image modalities. Although exhibiting
      strong instantaneous learning and generalization capabilities, Dual-to-Dual MLLMs still remain
      deficient in lifelong evolution, significantly affecting continual adaptation to dynamic
      real-world scenarios. One of the challenges is that learning new tasks inevitably destroys the
      learned knowledge. Beyond traditional catastrophic forgetting, Dual-to-Dual MLLMs face other
      challenges, including hallucination, instruction unfollowing, and failures in cross-modal
      knowledge transfer. However, no standardized continual learning framework for Dual-to-Dual
