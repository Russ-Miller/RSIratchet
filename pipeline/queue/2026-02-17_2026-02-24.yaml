      unclear. We conduct a systematic study of long-context code question answering using
      controlled ablations that test sensitivity to answer format, distractors, and context scale.
      Extending LongCodeBench Python dataset with new COBOL and Java question-answer sets, we
      evaluate state-of-the-art models under three settings: (i) shuffled multiple-choice options,
      (ii) open-ended questions and (iii) needle-in-a-haystack contexts containing relevant and
      adversarially irrelevant information. Results show substantial performance drops in both
      shuffled multiple-choice options and open-ended questions, and brittle behavior in the
