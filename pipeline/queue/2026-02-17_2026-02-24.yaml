      Physics-Aware Instruction Tuning (QuPAINT), a multimodal architecture that incorporates a
      Physics-Informed Attention module to fuse visual embeddings with optical priors, enabling more
      robust and discriminative flake representations. Finally, we establish QF-Bench, a
      comprehensive benchmark spanning multiple materials, substrates, and imaging settings,
