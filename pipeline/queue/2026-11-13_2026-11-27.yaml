      whether the evidence supports the suspected defect and its location, using gaps or
      inconsistencies in that evidence to guide the next code action. ADClaw achieves competitive
      results in detection and localization across 2D and 3D industrial anomaly detection benchmarks
      and in anomaly understanding on MMAD.
