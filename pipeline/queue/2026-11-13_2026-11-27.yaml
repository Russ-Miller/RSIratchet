    abstract: Post-training large language models (LLMs) for mathematical reasoning often relies on
      accepted traces whose final answers pass a verifier. For hard math problems, however, such
      traces can be rare under independent Monte Carlo (MC) sampling. To address this, we propose
      Diverse Alternative Reasoning Traces (DART), a trace-mining method that starts from a rejected
      trace, decomposes it into reasoning steps, and ranks them by position-weighted uncertainty. It
      then generates deliberately distinct alternative candidates for highly ranked steps using
      reference-answer guidance and a meta-thought before completing the resulting traces. On
      greedy-unsolved DeepMath-103K problems, DART recovers 37% more problems than MC sampling at a
      matched number of generated traces. Its estimated generation cost per recovered problem is
      nearly identical, while its cost per accepted trace is 30% lower. Post-training
