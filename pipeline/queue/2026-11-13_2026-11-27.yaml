      the update $ΔW$ is the Kronecker product of a frozen random $p\\times p$ matrix $A$ and a
      trainable factor $M(x)$, which overcomes the rank ceiling: because rank is multiplicative
      under this product, $A$ multiplies the rank of $M(x)$ by $p$ without adding trainable
