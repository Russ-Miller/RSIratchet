    abstract: "Recent vision-language models (VLMs) can act as robot-use agents that understand diverse
      scenes and control robots through policy code and tools. However, they predict 3D gripper
      poses poorly even with extended reasoning, struggling with precise manipulation.
      Vision-language-action (VLA) and world-action (WAM) models are the opposite: they execute
      fast, smooth control on trained tasks, yet fail under domain shifts or when tasks require
      long-horizon memory and reasoning. Agentic robots therefore combine VLM reasoning and
      perception with precise VLA/WAM control through a policy harness. Yet harness design spans
      thousands of configurations, shifting success by tens of points with the same models.
      Moreover, testing even one design takes thousands of rollouts at high API and GPU cost, so
      prior works often commit to a single design chosen from few alternatives. To guide harness
      design, we evaluate over 470,000 rollouts across eight simulation benchmarks, six VLMs, and 15
      VLA/WAM checkpoints. Seven controlled studies show effective harnesses must adapt to both VLM
      and VLA/WAM capabilities. Our findings specify what structure the VLM's policy code needs,
      where VLA manipulation needs help from tools and policy code, and when to involve the VLM at
      test time. The reference recipe X-Harness shows that these findings compose without weight
      updates, lifting base policies up to $+42.8$ points across memory, reasoning, and domain
      shifts."
