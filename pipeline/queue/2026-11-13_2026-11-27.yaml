    cited_by_count: 0
    abstract: "AI systems increasingly help decide which drug targets enter costly clinical trials. We
      recast each target-disease hypothesis as a dated event, the pair's first clinical trial. This
      lets us test whether a language model can forecast such events after its training cutoff,
      rather than recall events before it. We rebuild a dated biomedical knowledge graph as it stood
      at the end of each year from 2020 up to its newest version. We then ask six open language
      models, with and without this graph, which targets will enter a first trial for a disease the
      next year. Without retrieval, the models rank about as well as trial history, a count of each
      target's past trials in the same therapeutic area, also after their training cutoffs. Evidence
      dated before the decision adds at most a small gain, before or after the models' training
      cutoffs. The newest graph raises five of six models clearly above that baseline, but its paths
      usually include the answer: the pair's own trial, dated after the decision. Evaluations of
      target prioritisation should date both features and labels, with evidence from before the
      decision and outcomes after it."
