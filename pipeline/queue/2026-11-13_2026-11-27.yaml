    title: "EATS: Scaling Tool-Use Experience for Medical Reasoning Agents"
    date: 2026-11-25
    arxiv_id: "2611.33897"
    doi: https://doi.org/10.48550/arxiv.2611.33897
    authors:
      - Mingyuan Li
