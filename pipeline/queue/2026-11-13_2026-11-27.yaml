      framework for training small language agents (SLAs) from scratch. In each environment, a large
      language model acts as the expert, and we collect its successful trajectories. We pretrain
      each SLA, which has fewer than 50 million parameters, to predict the expert's responses given
      the interaction history. We then post-train the agent on its own interactions using proximal
      policy optimization (PPO). During post-training, reasoning alignment supplements environment
      rewards with expert supervision on the language the agent generates alongside its actions. We
      evaluate the agents in three multistep environments where acting requires both understanding
      and generating language. In Crafter, agents interpret textual observations and generate
      reasoning before acting. In WebShop, they translate shopping instructions into search queries.
