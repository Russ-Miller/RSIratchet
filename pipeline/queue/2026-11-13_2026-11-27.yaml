    abstract: "Reliable deployment of Vision Language Models (VLMs) requires that a model's expressed
      confidence remain grounded in what it can actually see, and that it recognize when the visual
      evidence is too ambiguous to commit to a confident response. Standard post-training uses
      outcome reward models (ORMs) that supervise only the final decision, rewarding a confident
      answer regardless of whether the image supports one, while existing methods either tend to
      detect uncertainty post-hoc or assume an objective verdict always exists. We instead split
      multimodal reasoning into two stages: perception, where the model must factually describe the
      scene, and calibration, where it must judge whether that evidence is sufficient to commit to a
      conclusion. We introduce HumblePRM, a lightweight process reward model (PRM) that scores each
      stage independently, rewarding agreement between evidence and expressed confidence rather than
      outcome correctness alone. Training with HumblePRM increases abstention due to uncertainty on
      ambiguous inputs considerably while leaving accuracy on clear images roughly unchanged. We
      also find that the improvement transfers to Gemma 4 E4B, a larger, popular edge model. Our
      findings show that process reward supervision is a promising route to VLMs with better
      calibrated abstention, ensuring more reliability rather than unpredictable behavior."
