    abstract: Knowledge distillation enables the deployment of large language models through smaller
      student models, but the compression process can introduce regressions in trustworthiness even
      when downstream performance is preserved. Repairing such failures is challenging because the
      original distillation corpus is often unavailable, while direct preference optimization may
      alter capabilities inherited from the teacher. We propose a targeted repair framework based on
      the proximal Bregman response function (PBRF) that addresses both limitations. We estimate the
      curvature required for PBRF using a surrogate proxy dataset, removing dependence on the
      original transfer corpus, and extend the framework to preference-based supervision through an
      odds-ratio objective. This enables the use of preferred and dispreferred response pairs while
      constraining changes to the distilled model. Our results show that the proposed approach
      improves targeted trustworthiness behaviors for both pre-training and post-training models
      while largely preserving downstream performance, providing a practical alternative to
      re-distillation or unconstrained preference optimization. Our experiment results show that
      across different distilled models, the trustworthy regression can be improved by up to 8% with
      less than 1% decrement in perplexity.
