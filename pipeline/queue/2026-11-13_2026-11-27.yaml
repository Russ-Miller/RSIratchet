    abstract: "Multi-agent systems (MAS) built on large language models (LLMs) distribute reasoning
      across specialized agents that must exchange messages and invoke tools reliably. Existing
      evaluations typically couple communication with open domain tasks, making it difficult to
      determine whether a failure arises from reasoning, malformed tool use, lost messages, or
      forgotten requests. Prior benchmarks do not isolate communication execution or measure routing
      redundancy against a known optimal path. We introduce CypherMAS, a synthetic benchmark that
      isolates communication and routing in fixed multi-agent graphs. Agents in chain, star,
      bipartite, or ring graphs route cyphered messages to remote peers holding the matching
      decoders; since the optimal route is known, redundant LLM calls can be measured and routing
      failures may be easily tracked. Across eleven open-weight models from 4B to 753B, small models
      fail at routing and tool use, dense models above 27B degrade with diameter, and successful
      runs exceed minimum LLM calls. These findings identify communication reliability as a distinct
      scaling bottleneck for multi-agent systems and provide a controlled diagnostic for complex
      multi-agent systems. The source code is freely available:
