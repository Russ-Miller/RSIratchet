    abstract: "Pretrained vision-language-action (VLA) models rarely satisfy all behavioral requirements
      of a new platform, and teams without a large deployed fleet lack the data to address the
      resulting failures. We propose a failure-driven data flywheel for post-training such models.
      It constructs target scenarios absent from the available data by inserting task-relevant
      entities into reconstructed real-world scenes, and evaluates the model against each behavioral
      requirement of the target task. Failure rates form a failure map across task conditions and
      difficulty levels, which is re-evaluated after each round and assigns larger data generation
      quotas to conditions where the model still fails. We instantiate the framework in autonomous
      driving for occluded-pedestrian emergence and yielding at stop-sign-controlled intersections,
      and evaluate it on two VLA models and one non-VLA planner in simulation and on a real vehicle.
      For occluded-pedestrian emergence, five rounds of post-training improve the critical-phase
      collision-free rate on the sealed test set from 0.261 to 0.579 for AutoVLA and from 0.390 to
      0.765 for ReCogDrive, while the unnecessary braking rate in paired control scenarios never
      exceeds 0.013. On a full-scale vehicle without real-world training, post-trained ReCogDrive
      achieves 4 of 5 safe passages, versus 1 of 5 for the base model. Fine-grained evaluation
      reveals a pattern obscured by the collision-free rate alone: both VLA models learn
      anticipatory deceleration before reach"
