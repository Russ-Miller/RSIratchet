    abstract: "Visual language models (VLMs) have demonstrated exceptional capabilities across various
      multimodal tasks, but they remain susceptible to hallucinations, undermining their
      reliability. Existing hallucination benchmarks primarily focus on identifying hallucinations
      and describing their manifestations, often neglecting their underlying causes. Specifically,
      multimodal hallucinations can stem from two distinct failure modes: text modality bias (TMB),
      reflecting an over-reliance on misleading text input; and language prior (LP), reflecting a
      reliance on previously learned knowledge. To differentiate these failure modes, we propose
      VTK-Bench, a benchmark that explicitly separates three information sources: visual information
      (V), textual information (T), and prior knowledge (K). By establishing mutually exclusive
      answers corresponding to V, T, and K, VTK-Bench enables fine-grained attribution analysis of
      model responses. Furthermore, we introduce discrete attribution and soft attribution metrics
      to characterize information source preferences. Extensive experiments on 11 representative
      open-source VLMs show that LP is more prevalent than TMB in most evaluated models. Notably,
      TMB decreases substantially with model scaling, whereas LP exhibits relatively limited
      improvement and remains the dominant failure mode. These findings highlight the importance of
      different information source preferences for a deeper understanding of multimodal
      hallucinations."
