      proverbs, assess their prescriptive power, and quantify their recommendations on key
      dimensions of human judgment and behavior. We find that most proverbs are prescriptive,
      offering guidance in domains under individual control, such as preparation and prudent action,
      whereas proverbs about uncontrollable circumstances, such as fate and mortality, tend to
      describe rather than prescribe. When prescriptive proverbs take a consistent stance, they
      favor caution over risk, long-term over short-term outcomes, honesty over deception, and
      kindness over malice, and show a moderate tendency toward suspicion over trust. On dimensions
      involving genuine trade-offs, especially autonomy versus compliance, proverbs provide
      contradicting advice rather than a single recommendation. This analysis provides a
      quantitative map of the collective prescriptions in a culture's proverbial wisdom, revealing a
      core of prudent, honest, and forward-looking guidance alongside varied advice where
      circumstances dictate the best course of action.
