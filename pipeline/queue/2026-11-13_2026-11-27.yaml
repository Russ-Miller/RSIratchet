    abstract: This study provides large-scale empirical evidence about whether large language model
      (LLM)-based assessments of the likely technological impact of scientific publications are
      associated with their patent-based impact. Using Lens.org, we constructed a biotechnology
      dataset of 107,615 papers published between 1980 and 2015 with their patent citation counts.
      We used GPT-5-mini, Qwen-Flash, and DeepSeek-V3.2 to estimate papers technological impact and
      technology relevance, benchmarking model outputs against log-transformed patent-citation
      counts through correlation analysis, distributional alignment, and lift-over-random measures.
      The results show that LLMs extract meaningful signals associated with technological impact
      from scientific text, although there are substantial differences at the meso-level such as
      between research fields, journals, and countries. LLMs also outperform random selection in
      screening for papers with high observed patent impact. Overall, this study identifies the
      strengths, contexts, and limitations of LLM-based technological impact evaluation and
      highlights its potential to support large-scale screening for scientific work with downstream
      technological value.
