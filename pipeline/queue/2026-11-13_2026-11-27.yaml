    abstract: Video large language models incur substantial inference costs from long visual token
      sequences. Existing video token compression methods mitigate these costs by exploiting spatial
      redundancy within frames and temporal redundancy across frames. However, many approaches
      impose predefined processing orders or fixed allocation ratios for spatial and temporal
      compression, limiting their ability to adapt to the varying balance of spatiotemporal
      redundancy across videos. To address this limitation, we propose PURA, a training-free method
      that prunes visual tokens through unified spatiotemporal redundancy assessment. For each
      token, PURA constructs spatial and temporal reference candidates and selects the reference
      with the lowest representation error across the two dimensions. The representation error is
      combined with token importance to determine each token's removal cost. To avoid the time
      overhead of removing the lowest-cost token one by one, we introduce Coordinated Pruning, which
      iteratively groups mutually compatible low-cost removals into batches for simultaneous
      execution and updates the pruning state after each batch until the target budget is reached.
      Extensive experiments on three video large language models and five video understanding
      benchmarks demonstrate that PURA achieves a favorable trade-off between task performance and
      inference efficiency.
