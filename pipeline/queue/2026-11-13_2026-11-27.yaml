    venue: arXiv
    topic: Artificial Intelligence in Healthcare and Education
    cited_by_count: 0
    abstract: Medical reasoning agents combine large language model (LLM) reasoning with clinical
      workflows and specialized neural tools. However, general-purpose LLMs receive limited training
      exposure to domain-specific medical tools, and the uncertainty and distributional shifts of
      neural tool outputs make selecting tools from simple descriptions significantly more
      challenging than in deterministic settings such as calculators or dictionary lookups. In this
      paper, we propose EATS, an experience-augmented tool selection strategy that leverages
      accumulated tool-use trajectories to improve tool selection in medical reasoning agents. EATS
      constructs a memory of past interactions, including queries, tool choices, arguments, and
      self-evaluated feedback, and retrieves relevant experiences to guide tool selection for new
      queries. As memory construction does not require ground-truth supervision, EATS scales
      naturally with test-time experience. We evaluate EATS on tool-augmented medical reasoning
      tasks, including closed-ended visual question answering and free-form report generation.
      Experiments on four public datasets, ChestAgentBench, CheXbench, MIMIC-CXR, and SLAKE-VQA,
      across three multimodal LLMs, Qwen3-VL 2B, Qwen3-VL 32B, and GPT-5.5, show consistent gains in
      tool selection behavior and downstream medical reasoning performance. Code is available at
      https://github.com/Limingyuan001/EATS.
