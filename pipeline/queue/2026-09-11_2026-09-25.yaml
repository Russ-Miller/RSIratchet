      functional magnetic resonance imaging (fMRI) foundation models. Here, we conduct a controlled
      empirical study using pretraining data from more than 200 source datasets and over 10,000
      GPU-hours of experiments. Holding the pretraining framework and downstream protocol fixed, we
      vary pretraining data size, model size, and training duration. Downstream performance
      generally improves with compute, yet models using similar compute can perform substantially
      differently. Additional pretraining data bring larger gains at larger model sizes, suggesting
      that data and model size should be scaled together. At matched compute, increasing pretraining
      data benefits more tasks than increasing model size, although the pattern varies across tasks.
