      the correct term in 90.67% of 75 valid cells but produces an accepted term in 36.00% of the
      corresponding attempts; Llama 3.370B shows the same pattern (77.92% versus 24.24%). Since the
      four-option condition displays the candidate terms and does not require script production, the
