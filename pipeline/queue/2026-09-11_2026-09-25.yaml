    abstract: Multi-agent debate (MAD) has emerged as a promising paradigm for improving the reasoning
      accuracy of large language models (LLMs) through iterative peer interaction. Communication
      topology plays a central role in this process, motivating increasingly sophisticated
      mechanisms that learn, adapt, or dynamically reconfigure agent interactions to improve
      accuracy or reasoning reliability. Meanwhile, prior studies suggest that much simpler sparse
      communication can already achieve competitive performance at substantially lower cost. In this
      work, we take a closer look at sparse MAD and ask whether complex topology control is actually
      necessary to improve collective reasoning. We find that a simple random-without-replacement
      routing policy, which lets each agent debate with two distinct and newly sampled peers at
