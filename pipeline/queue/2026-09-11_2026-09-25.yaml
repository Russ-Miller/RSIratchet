      we reflect on the use of LLMs in the study of infant syntax learning by providing an
      epistemological assessment of several studies from this research program. We discuss how
      datasets are built, which models are implemented, how they are trained and syntactically
      evaluated. We observe significant assumptions in the methodology of BabyLM and related
