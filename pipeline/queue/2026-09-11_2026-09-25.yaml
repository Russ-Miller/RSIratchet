    abstract: "While Vision-and-Language Navigation (VLN) has demonstrated remarkable success, the
      prevailing single-turn paradigm exposes a fundamental vulnerability: agents operate in a
      strictly open-loop manner. In practice, factors such as perceptual aliasing, sensor noise, and
      odometry drift can cause minor deviations to accumulate over time, often leading to
      catastrophic mission failures with no built-in mechanism for error recovery. To address this,
      we introduce \\textit{Talk2Escape}, a proactive and model-agnostic dialogue intervention
      framework that reframes navigation as a closed-loop interactive process. At its core, a
      lightweight vision-language module continuously monitors agent kinematics. Upon detecting
      localized looping or severe trajectory divergence, it translates raw egocentric observations
      into concise, grounded queries to solicit targeted corrective feedback from either an
      algorithmic oracle or a human-in-the-loop. Extensive evaluations in high-fidelity simulators,
      including R2R-CE, RxR-CE, and VLNVerse, demonstrate that \\textit{Talk2Escape} exhibits
      consistent improvements across diverse base agents. Empirically, \\textit{Talk2Escape}
      achieves a 66.0\\% Success Rate on R2R-CE, outperforming the current supervised and zero-shot
      state-of-the-art methods. We further validate its sim-to-real transfer on a Unitree Go2
      quadruped, proving that proactive dialogue drastically improves navigation robustness in
      physical environments."
