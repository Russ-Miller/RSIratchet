    abstract: Diffusion Language Models (DLMs) have attracted significant attention for their strong
      reasoning ability. However, under a bidirectional attention mechanism, DLMs operate over an
      exponentially large exploration space compared to autoregressive models (ARMs), making it
      challenging to focus on reasoning-guiding tokens under random masking. We define causal
      shortcuts as token chains that cover the full sequence and provide explicit guidance towards
      correct reasoning trajectories. We analyze the effects of causal shortcuts on the reasoning
      accuracy and convergence speed of DLMs, and find that they largely improve answer convergence
      efficiency and generation accuracy. Motivated by this, we propose a Causal Shortcut Learning
      (CSL) Framework for DLMs. Specifically, we introduce a step-by-step token extraction procedure
      to extract causal shortcuts from data, and apply parallel prioritized masking on these tokens
      during training to enable efficient and accurate convergence to correct answers via causal
      shortcuts. Extensive experiments across multiple reasoning benchmarks and two base models
      demonstrate that CSL consistently outperforms existing SFT-variant baselines, achieving an
      average improvement of $1.92\%$ over SFT-only models, and up to $4.20\%$ on MATH-500. The code
