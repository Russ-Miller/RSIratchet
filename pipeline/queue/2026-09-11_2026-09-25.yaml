      remains limited by two gaps. First, navigation data such as occupancy grids are represented as
      raw geometric messages that are difficult for LLMs to use directly as spatial or semantic
      context. Second, adding LLM-driven capabilities often requires custom wrappers or
      robot-specific interfaces, limiting reuse across systems. To address these challenges, we
      propose a non-invasive framework that connects LLM reasoning with ROS-based navigation through
      a navigation-oriented representation layer, exposed through the Model Context Protocol (MCP)
      as standardized, reusable tools so that any MCP-compatible LLM can access them without
      robot-specific wrappers. The visual map modules transform occupancy grids into metric,
