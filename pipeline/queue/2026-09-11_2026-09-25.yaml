    abstract: "Most existing visual CAPTCHAs remain spatially solvable: the required information is
      exposed by static appearance, local structure, and interface state. This assumption is
      weakened by advances in multimodal large language models (MLLMs) and Graphical User Interface
      (GUI) agents, which exhibit strong visual perception, reasoning, and browser interaction
      capabilities. We propose Motion Vision CAPTCHA (MVCAP), a hierarchical motion-based CAPTCHA
      framework in which target semantics are instantiated as motion-defined foreground structures
      and become recoverable only through temporal segregation from a dynamically evolving
      background. Built on this shared principle, MVCAP is instantiated in three perceptually
      progressive levels: coherent motion, structural motion, and biological motion. To evaluate
      this framework, we introduce MVCAP-Bench, a browser-based benchmark with 600 live CAPTCHA
