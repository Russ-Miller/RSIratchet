      approaches mitigate this cost through pipelining checkpoint I/Os, differential checkpointing,
      or in-memory persistence, yet none leverage the distinct characteristics of LLM training
      dynamics, where model weight updates are non-uniformly distributed across transformer layers.
      This observation implies that saving all weights each time might not be efficient. Inspired by
      this observation, we present LayerCheck, a layer-wise adaptive checkpointing framework that
