      complex legal reasoning remains limited by two structural challenges. First, existing RAG and
      GraphRAG methods emphasize lexical or semantic similarity while overlooking normative
      relations among legal provisions. Second, vanilla Chain-of-Thought prompting may generate
      plausible rationales without enforcing the normative structure of legal reasoning. To deal
      with the bottleneck of pipelines in the legal reasoning domain, we propose LEGO, a dual-module
      framework that synergizes Legal Expert GraphRAG and expert Chain-of-thought for complex legal
      reasoning. ExpertGraphRAG uses an expert-annotated civil code graph encoding these normative
