      awareness of prior generations and their evaluations, it produces an increasing proportion of
      semantically duplicate answers as more samples are drawn, leading to diminishing returns. To
      address this limitation, we introduce FLEET, a novel method that integrates a memory mechanism
      into the generation process. FLEET represents each generation as a sparse trajectory through
