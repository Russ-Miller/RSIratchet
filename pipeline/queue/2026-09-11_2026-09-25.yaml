      challenge. While recent work has moved beyond single-turn evaluation toward multi-turn
      paradigms, key limitations persist: step-level methods treat actions in isolation, missing how
      risks accumulate, while trajectory-level evaluations operate post-hoc, offering no opportunity
      for timely intervention. To address these limitations, we formalize Decoupled Proactive Safety
      Monitoring along three dimensions: whether to intervene, when to intervene, and what the risk
      is. We introduce PASTABench, a benchmark of 1,139 multi-turn trajectories spanning 5 risk
      categories and 13 subcategories. We further propose the Optimal Intervention Window (OIW),
      anchored by annotated Earliest-Signal and Trigger turns, to quantify intervention timeliness.
      Evaluation of 16 LLMs reveals that proactive intervention remains largely unsolved, with the
      best model achieving only 40.74% optimal-timing interventions. Fine-grained diagnosis further
      uncovers pervasive lexical overfitting: competitive safety scores of smaller models mask
      keyword hypersensitivity rather than genuine risk comprehension, as their proactive capability
      largely collapses once hazard vocabulary is neutralized."
