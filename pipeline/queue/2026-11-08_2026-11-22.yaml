    title: Unified Law for Visual Tasks (The Four Laws of Computer Vision)
    date: 2026-11-18
    arxiv_id: "2611.24917"
    doi: https://doi.org/10.48550/arxiv.2611.24917
    authors:
      - Sen Fang
      - Yalin Feng
      - Yancheng Zhang
      - Yanxin Zhang
      - Zonglin Lyu
      - Hongbin Zhong
    venue: arXiv (Cornell University)
    topic: Advanced Neural Network Applications
    cited_by_count: 0
    abstract: "In this paper, we propose a Unified Law for Visual Tasks, which could be further divided
      into Four Laws of Computer Vision, with the goal of enabling a single framework or method to
      uniformly train on and perform nearly all visual tasks. Our starting point is an inspiration
      and hypothesis: if the world information is encoded into image, which we call World Snapshots,
      then image processing is world processing, and image generation is World Snapshot generation.
      Furthermore, if all visual and visualization tasks can be reformulated as generation tasks,
      then a unified method, World Snapshot Models (WSMs), can perform the vast majority of visual
      tasks, much as large language models have largely unified natural language processing. This
      paper validates these laws across more than 1,000 trained and evaluated visual tasks (defined
      by distinct input-output mappings) and presents a unified training framework for future
      visual-task research and applications."
