      - Ruihua Song
      - Wayne Xin Zhao
    venue: arXiv (Cornell University)
    topic: Domain Adaptation and Few-Shot Learning
    cited_by_count: 0
    abstract: Task success alone does not specify which behaviors post-training should reinforce. Even
      successful teacher trajectories can contain unsupported assumptions, unproductive repetition,
      or superficial verification. We propose Skill-FT (Skill-Guided Fine-Tuning), which uses
      natural-language skills to suppress undesirable habits and elicit underrepresented effective
      behaviors during teacher rollouts, then fine-tunes a target model on the resulting
      trajectories. We introduce AutoMaster, an autonomous post-training system in which an LLM
      agent develops these interventions through trajectory analysis, skill design, data selection,
      and feedback from rollouts and target-model evaluation. Across Terminal, Search, and software
      engineering tasks with 4B and 9B target models, AutoMaster improves mean performance over
      Vanilla SFT on successful unguided teacher trajectories by 1.42-8.99 percentage points, with
      the teacher, task pool, training set size, and SFT recipe held fixed. Together with the
      ablations and trajectory analyses, these results suggest that behavioral shaping can make a
      fixed model a more effective teacher. We further find that retaining skill instructions during
      SFT yields higher mean performance than removing them across all six settings, despite their
      absence at evaluation and identical supervised outputs. These findings suggest that preserving
      skill context as part of a training demonstration can support better behavioral
      internalization.
