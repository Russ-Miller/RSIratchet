    title: "AutoMaster: Autonomous Post-Training by Making the Same Model a Better Teacher"
    date: 2026-11-19
    arxiv_id: "2611.26510"
    doi: https://doi.org/10.48550/arxiv.2611.26510
    authors:
      - Guoxin Chen
      - Shuang Sun
