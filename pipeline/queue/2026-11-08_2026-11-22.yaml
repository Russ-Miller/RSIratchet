      - Carla Teixeira Lopes
      - Daniel Félix
    venue: arXiv (Cornell University)
    topic: Information Retrieval and Search Behavior
    cited_by_count: 0
    abstract: Access to large-scale clinical text collections is crucial for advancing medical
      information retrieval research, including clinical note search, patient cohort identification,
      and domain-adapted retrieval models. However, real clinical notes are rarely available due to
      privacy regulations, which particularly limits progress for low-resource languages such as
      European Portuguese. We present LusoClin, a publicly released dataset of synthetic clinical
      notes in European Portuguese, created to support privacy-preserving research on clinical text
      retrieval. LusoClin was generated by pre-processing real clinical data, fine-tuning the
      open-source Llama 3.2 (3B) instruction-tuned model using Quantized Low-Rank Adaptation, and
      applying prompt-based clinical note generation. To facilitate semantic indexing and clinical
      search, the notes are automatically annotated with clinical entities using a BERT-based model.
      We evaluate LusoClin in terms of utility, fidelity, diversity, and privacy using automatic
      metrics and human evaluation. Results indicate that the dataset captures clinically relevant
      language patterns and can support downstream IR applications such as clinical document
      retrieval and domain-specific model adaptation, although annotators can often distinguish
      synthetic from real notes and some medical inconsistencies persist.
