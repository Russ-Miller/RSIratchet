    abstract: "Visual adversarial perturbations can substantially impair large vision-language models
      (LVLMs) despite introducing only subtle input changes. To understand how these small changes
      cause substantial errors, we investigate their optimization and propagation through the model,
      revealing two key findings. First, stronger attacks rely on finer iterative optimization,
      while subtle input perturbations induce representation discrepancies that are amplified layer
      by layer through the vision encoder and persist in the language model. Second, disrupting the
      alignment between within-patch input patterns and the model's computation reduces
      clean-adversarial representation discrepancies and substantially weakens attacks. Together,
      these findings suggest that adversarial effectiveness depends on both fine-grained
      perturbation patterns and their coupling with the model's computation. Motivated by these
      findings, we propose SmoothShift, a lightweight, training-free defense that combines local
      smoothing and spatial transformations. Smoothing weakens fine-grained perturbation patterns,
      while spatial transformations disrupt their alignment with the encoder's patch grid.
      SmoothShift requires no model updates, auxiliary networks, or additional model inference.
      Experiments cover three LVLM families on four datasets and robustly fine-tuned Contrastive
      Language-Image Pre-training (CLIP) models on eight classification datasets. Evaluations across
      eight attack methods and multiple perturbation budgets "
