    venue: arXiv (Cornell University)
    topic: Authorship Attribution and Profiling
    cited_by_count: 1
    abstract: Disentangling writing style from semantic content is a fundamental challenge in literary
      text modeling. Style-content entanglement causes models to rely on semantic content for
      authorship attribution (AA) tasks and memorize author-specific content for style imitation
      (SI) tasks. We propose EDITORS (EditingLoRA Subspaces), a diagnose-then-deflate framework that
      adapts pretrained large language models and prioritizes stylistic features, making it
      effective for both AA and SI tasks. EDITORS first trains a diagnostic LoRA adapter using
      style-neutral statements derived from the training corpus to identify a content-oriented
      subspace. It then trains the final style adapter under activation-space deflation that
      projects input activations away from the identified content-oriented directions. We
      empirically demonstrate that EDITORS is effective. On three AA benchmarks spanning literature,
      social media, and news, EDITORS achieves state-of-the-art accuracy, outperforming the
      strongest existing baseline by up to 29%. On SI, EDITORS generates stylistically faithful and
      diverse passages, outperforming baselines in achieving style similarity while adhering to
      content specifications.
