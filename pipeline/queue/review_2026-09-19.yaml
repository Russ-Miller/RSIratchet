    title: "The role of artificial intelligence in medical education: an evaluation of Large Language
      Models (LLMs) on the Turkish Medical Specialty Training Entrance Exam"
    date: 2025-04-25
    doi: https://doi.org/10.1186/s12909-025-07148-0
    authors:
