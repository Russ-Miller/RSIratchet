      improving the effectiveness of test cases generated by LLMs in terms of revealing bugs by
      leveraging mutation testing. Methods: Our goal is achieved by augmenting prompts with
      surviving mutants, as those mutants highlight the limitations of test cases in detecting bugs.
      MuTAP is capable of generating effective test cases in the absence of natural language
      descriptions of the Program Under Test (PUTs). We employ different LLMs within MuTAP and
      evaluate their performance on different benchmarks. Results: Our results show that our
      proposed method is able to detect up to 28% more faulty human-written code snippets. Among
      these, 17% remained undetected by both the current state-of-the-art fully-automated test
