    abstract: Code localization--identifying precisely where in a codebase changes need to be made--is a
      fundamental yet challenging task in software maintenance. Existing approaches struggle to
      efficiently navigate complex codebases when identifying relevant code sections. The challenge
      lies in bridging natural language problem descriptions with the appropriate code elements,
      often requiring reasoning across hierarchical structures and multiple dependencies. We
      introduce LocAgent, a framework that addresses code localization through graph-based
      representation. By parsing codebases into directed heterogeneous graphs, LocAgent creates a
      lightweight representation that captures code structures (files, classes, functions) and their
      dependencies (imports, invocations, inheritance), enabling LLM agents to effectively search
