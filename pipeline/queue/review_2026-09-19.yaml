      Large Language Models into Multi-Agent (LMA) systems for addressing complex challenges in
      software engineering (SE). By leveraging the collaborative and specialized abilities of
      multiple agents, LMA systems enable autonomous problem-solving, improve robustness, and
      provide scalable solutions for managing the complexity of real-world software projects. In
      this article, we conduct a systematic review of recent primary studies to map the current
