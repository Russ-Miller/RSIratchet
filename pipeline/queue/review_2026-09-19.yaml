      Furthermore, MuTAP achieves a Mutation Score (MS) of 93.57% on synthetic buggy code,
      outperforming all other approaches in our evaluation. Conclusion: Our findings suggest that
      although LLMs can serve as a useful tool to generate test cases, they require specific
