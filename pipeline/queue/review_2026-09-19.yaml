    title: "UA-Code-Bench: A Competitive Programming Benchmark for Evaluating LLM Code Generation in
      Ukrainian"
    date: 2025-11-03
    arxiv_id: "2511.05040"
    doi: https://doi.org/10.15276/ict.02.2025.47
    authors:
