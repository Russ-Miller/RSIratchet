    abstract: "The rapid development of the large language model (LLM) presents huge opportunities for
      6G communications – for example, network optimization and management – by allowing users to
      input task requirements to LLMs with natural language. However, directly applying native LLMs
      in 6G encounters various challenges, such as a lack of communication data and knowledge, and
      limited logical reasoning, evaluation, and refinement abilities. Integrating LLMs with the
      capabilities of retrieval, planning, memory, evaluation, and reflection in agents can greatly
      enhance the potential of LLMs for 6G communications. To this end, we propose CommLLM, a
      multi-agent system with customized communication knowledge and tools for solving
      communication-related tasks using natural language. This system consists of three components:
      multi-agent data retrieval (MDR), which employs the condensate and inference agents to refine
      and summarize communication knowledge from the knowledge base, expanding the knowledge
      boundaries of LLMs in 6G communications; multi-agent collaborative planning (MCP), which
      utilizes multiple planning agents to generate feasible solutions for the
      communication-re-lated task from different perspectives based on the retrieved knowledge; and
      multi-agent evaluation and reflection (MER), which utilizes the evaluation agent to assess the
      solutions, and applies the reflection agent and refinement agent to provide improvement
      suggestions for current solutions. Finally, we validate the effectiveness of the proposed
      multi-agent system by designing a semantic communication system as a case study of 6G
      communications."
