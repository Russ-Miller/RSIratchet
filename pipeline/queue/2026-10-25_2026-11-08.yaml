    abstract: "Large language models are increasingly used as measurement instruments for socially
      consequential constructs such as hate speech, and are typically validated by their aggregate
      agreement with human labels. A valid instrument must also apply the same construct to every
      group it measures. We test this requirement using 421 \\hc{} templates that are instantiated
      identically for seven protected groups, so that only the identity term varies. Four LLM
      classifiers each exceed 0.95 balanced accuracy, yet within identical templates two of them
      miss hateful statements about women at markedly higher rates than the same statements about
      other groups (excess false-negative rates of 8.3 and 4.4 percentage points), a gap first
      reported for fine-tuned classifiers in 2021. We show how the construct shifts. Comparing
      rationales within each template, we find that models invoke protected-group status for other
      groups but recast the identical statement about women as personal dislike or as aimed at an
      individual, in 22 of 30 missed templates for one model. Adding the benchmark's own definition,
