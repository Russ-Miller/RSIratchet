    abstract: Robots manipulating in cluttered spaces must often plan from partial views where
      foreground objects occlude the target, surrounding geometry, and usable free space. Reactive
      policies often miss these hidden constraints, while exhaustive search becomes computationally
      prohibitive in dense clutter. We present SCOUT, an occlusion-aware planning framework that
      bridges high-level deliberation with grounded physical rollouts. SCOUT leverages an
      object-centric scene representation to reconstruct hidden geometry and derive a relational
      planning state capturing blocker hierarchies and accessibility corridors. To navigate the vast
      action space in clutter, an LLM proposes structured action candidates which are then
      rigorously evaluated via Monte Carlo Tree Search (MCTS) using a learned action-conditioned
      world model. Evaluations on 'Reveal' and 'Placement' tasks show that SCOUT outperforms
      Vision-Language-Action (VLA) policies, embodied agents, and 3D world models, with significant
      gains in long-horizon tasks requiring reasoning over occluded geometry. We further validate
      the framework's robustness through real-world robotic manipulation in a cluttered shelf
      environment.
