    abstract: Composed Image Retrieval (CIR) aims to retrieve a target image given a reference image and
      a modification text. Although recent approaches leveraging Multimodal Large Language Models
      (MLLMs) have shown significant progress, we argue that the MLLM's compositional understanding
      remains underutilized. This stems from directly mapping composed queries into a retrieval
      embedding via contrastive supervision alone, without explicitly resolving the intended visual
      modifications. In this work, we introduce Factorized MLLM Embeddings (FactEmbed), which
      decouples compositional query comprehension from building discriminative embeddings. Rather
      than directly projecting the composed query into a single embedding without internal
      reasoning, FactEmbed employs a set of factorized latents that simulate the intended visual
      modifications via an intermediate target imagination objective. This process encourages the
      latents to ground into target semantics before forming discriminative representations for
      retrieval. Subsequently, to propagate these factorized representations throughout the model
