    abstract: Recent work in machine learning has demonstrated that transformer-based language model
      agents can communicate state not only through text, but also directly in latent space via
      key-value (KV) caches. In this paper, we argue that such cache-to-cache translation can
      provide utility beyond the original motivating application of real-time agent communication
      and can instead be utilized for retrieval-augmented generation (RAG). Building on the
      Cache-to-Cache (C2C) fusion framework, our proposed system CacheGraft encodes each corpus
      passage offline into a fused KV cache representation between a larger sharer model (4B
      parameters in our experiments) and a smaller receiver model (0.6B parameters) such that this
      cache can be injected into the receiver at query time with no need for the larger model.
      Across five QA benchmarks and two independent locally-run judges, CacheGraft improves answer
      quality over the text-only receiver baseline in 29 out of 30 comparisons, of which 17 of the
      30 are statistically significant. Notably, these gains are zero-shot with respect to the
      fuser, which was never trained on retrieval data. These initial results suggest that
      latent-space document enrichment may be a promising avenue for enhancing the performance of
      RAG systems, particularly in compute-constrained settings where it is only feasible to deploy
      a small model at inference time.
