    abstract: Autonomous parking in nonconvex and narrow environments remains challenging. Although
      optimal-control methods can explicitly enforce vehicle dynamics and collision constraints,
      nonconvexity compromises solver robustness and can cause failures. Large language models
      (LLMs) exhibit strong semantic reasoning capabilities, but directly generating dense
      trajectories makes it difficult to guarantee physical feasibility. We introduce SE-LLM-OCP, a
      unified framework in which LLMs make high-level discrete maneuver decisions, while an
      optimal-control module enforces low-level vehicle dynamics and collision constraints. Online,
      the LLM proposes sparse maneuver plans, decomposing the parking task into a sequence of
      short-horizon trajectory-optimization problems. A low-level solver then sequentially solves
      optimal-control problems. If the solver fails, the LLM aggregates failure evidence from the
      solver and validation stages to guide replanning. Offline, SE-LLM-OCP automatically evolves a
      structured decision-making knowledge base from scratch, driven by accumulated online failures.
      We validate our proposed framework in simulation on a car-like vehicle model and on a
      differential-drive robot. Our experimental results show that SE-LLM-OCP enables safer
      autonomous parking in narrow scenarios and demonstrates transfer of the same maneuver
      representation to a different kinematic platform.
