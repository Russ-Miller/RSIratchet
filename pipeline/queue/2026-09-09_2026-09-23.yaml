      attributions, leaving internal computation largely underexplored. We instead cast faithfulness
      as internal concept grounding: Does a large language model's (LLM) CoT reasoning engage the
      same internal concepts that support the LLM's direct prediction, and do the shared concepts
      causally drive its answer? Encoding a prediction pass and a CoT pass with a single shared
      sparse autoencoder (SAE), a reliable approximator of the latent concepts LLMs use, makes their
