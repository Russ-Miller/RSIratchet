      representations, while overlooking the intrinsic conflict between task-oriented feature
      interests. In this paper, we introduce $\\textbf{DeCo}$, an efficient
      $\\textbf{De}$couple-to-$\\textbf{Co}$uple learning framework that resolves this dilemma
      through a two-stage paradigm: task-specific representation decoupling followed by
      complementary prior coupling. Specifically, we first propose Task-aware Semantic Decoupling
      (TSD) to route shared visual cues into individual features under salient word-level guidance,
      alleviating representation interference between localization and segmentation. Furthermore, we
