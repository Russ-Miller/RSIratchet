      directing such queries to a high-capability model can introduce unnecessary, considerable
      computation and energy consumption. In this paper, we investigate whether adaptive routing
      across a heterogeneous pool of LLMs can reduce this energy burden without substantially
      compromising task performance. We design a language-model-based router that reads in each
      query and selects an answer model from a fixed candidate pool. The candidate models are first
      profiled through an offline tournament that records their correctness, latency, power, and GPU
      energy for each query. Using these measurements, the router is trained through supervised
