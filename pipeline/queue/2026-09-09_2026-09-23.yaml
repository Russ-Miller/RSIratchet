    abstract: Poor clinical communication can delay care, contribute to errors, and harm patients, yet
      opportunities for repeated practice with feedback remain limited. Our prior randomized trial
      showed that practice with the SOPHIE AI patient platform improved serious illness
      communication, but the system addressed a single clinical context and required human effort
      for delivery and assessment. We developed SOPHIE 2.0, a browser-based, self-service platform
      integrating embodied AI-patient interactions, personalized feedback, and automated assessment
      across 24 clinical scenarios. An automated large language model assessor evaluated three
      communication skills---Empower, Be Explicit, and Empathize---with agreement comparable to
      individual human raters ($r=0.759$; ICC$=0.746$). In a study of 59 clinicians and students,
      participants completed two AI-patient encounters with personalized feedback; 92% found the
      platform engaging, 86% easy to use, and 83% clinically relevant. Scores were higher in the
      second encounter, though the uncontrolled design precludes attributing this change
      specifically to training.
