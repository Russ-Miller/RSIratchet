      agentic analysis-by-synthesis. Unlike prior methods which first estimate dense pixel
      correspondences and then recover object motion from them, our method infers a structured 3D
      object model, including its geometry and kinematic structure, and uses this model to optimise
      object track estimates over time. In our optimisation loop, a Vision-Language Model (VLM)
      agent iteratively refines shape or generalised pose through a render-and-compare loop,
      combining coarse visual reasoning with numerical pose optimisation for precise state
      estimation. This structured formulation enables our method to track through large motion,
