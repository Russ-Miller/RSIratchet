      each reading is exactly verifiable against the filing. A capable agent should recognize the
      ambiguity and ask, rather than commit to a plausible but unintended reading. Existing
      financial benchmarks cannot measure this, because one gold answer per question cannot separate
      agents that resolve the ambiguity from those that guess the common reading, a blind spot we
      call the single-gold illusion. We release FinInteract, a bilingual (English/Chinese) benchmark
      of 173 instances that pairs each question with a default and an intended interpretation across
      a five-category ambiguity taxonomy, and grades whether an agent elicits the right
