      noisy gradients produced from already-correct examples and over-specialization to hard cases
      that degrades performance on simpler inputs. We introduce STEVE, a stabilization framework
      with two coupled mechanisms. Error-Driven Refinement generates gradients only from incorrectly
      handled examples, concentrating updates on informative failures. Regularized Verification
      treats every update as provisional and accepts it only when improvement on hard cases does not
      cause unacceptable regression on a preservation set. Across ten reasoning benchmarks, three
      evaluator/optimizer models, and established prompt-optimization baselines, STEVE reduces
      degradation and produces more robust prompts. Additional evaluations with gpt-5.4-mini/gpt-5.4
