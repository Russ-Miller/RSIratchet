      response. This approach yields over 10% improvement on MedXpertQA, and our 30B model achieves
      50.1% accuracy on HealthBench-Hard, surpassing proprietary baselines including GPT-5
      (thinking). Our results show that targeted synthetic datasets and rubric-based training can
      systematically improve both diagnostic and interactive clinical reasoning in medical LLMs."
