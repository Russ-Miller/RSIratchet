    abstract: Large Language Models (LLMs) enable open-ended dialogue in interactive games, but their
      non-deterministic outputs make it difficult to preserve authorial control, factual
      consistency, and the intended sequence of information disclosure. These challenges are
      particularly significant in detective games, where premature revelation or fabricated details
      can undermine the logic of player progression. We present a Structured Knowledge Tree
      architecture coupled with a tri-agent LLM pipeline for controlling dialogue in an open-ended
      interrogation game. The system separates knowledge retrieval, dialogue generation, and
      response verification to ensure that the virtual suspect reveals only information permitted by
      the current narrative state. We evaluate the approach through The Interrogation of Adrian
      Gale, a playable detective-game testbed, and a formal user study examining hallucination
      reduction, adherence to authored disclosure sequences, and perceived logical progression. Our
      results demonstrate that the structured architecture reduces critical hallucinations by 64.78%
      and entirely prevents premature narrative disclosure. While the strict mechanical constraints
      introduced usability trade-offs regarding forced conversational reveals, the system
      successfully enforces rigorous epistemic pacing and provides players with a clear, subjective
      sense of progression toward solving the case.
