      an account may look human-like in semantics while remaining suspicious in graph structure,
      profile attributes, or cross-modal consistency. Recent graph-based detectors tackle this
      limitation by adding graph-side complexity, such as sparse prototype selection, adaptive
      gating, or architecture-specific control logic, yet our experiments suggest that complexity
      alone is not the most reliable way to resolve such conflict. We therefore propose CSC, a
      calibrated-simplicity framework for conflict-aware LLM-era social bot detection. The framework
      combines three design choices: a simplified prototype-guided graph expert that retains useful
      structural biases while removing unstable graph-side heuristics, calibrated
      simplex-constrained fusion that aligns heterogeneous confidence spaces before late fusion, and
      a lightweight inconsistency expert that models cross-modal disagreement. Experiments on
      TwiBot-22, TwiBot-20, and MGStBot-large show that \\textsc{CSC} improves calibrated
      operating-point decision quality while remaining competitive across external benchmarks.
