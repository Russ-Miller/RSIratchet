      assess the utility of the proposed approach, we fine-tune and evaluate AES scorers under three
      data conditions: authentic essays, synthetic essays generated conventionally, and synthetic
      essays generated using our proposed approach. The results show that in the larger-data
      settings, the proposed approach outperforms the conventional synthetic baseline in 11 out of
      12 dataset-metric comparisons, with performance in some cases approaching that of models
      trained on authentic essays. Despite these gains, performance under extremely low-resource
      settings remains mixed, with advantages over the conventional baseline only becoming more
      apparent at 200 training essays, although not consistently across datasets. Qualitative and
      quantitative analyses further show that the proposed approach produces learner-like errors
      whose distributions broadly resemble those observed in authentic essays."
