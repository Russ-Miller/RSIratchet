      foundation. Built on this, we propose ActiveArena-Bench, which comprises 35 tasks across 5
      fine-grained categories, covering visual exploration and interactive information acquisition.
      Each task is difficult to solve from passive observations alone, requiring multi-round
      evidence acquisition and memory-based reasoning. The benchmark provides rich memory
      annotations, standardized training data, and ID/OOD protocols featuring disjoint scenes,
