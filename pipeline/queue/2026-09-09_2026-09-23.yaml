    abstract: "Text-to-Speech (TTS) is an essential module that provides spoken responses in a spoken
      dialogue system (SDS) centered on a large language model (LLM). To ensure accurate TTS
      synthesis, responses generated by an LLM must be converted into TTS-readable formats via a
      Text Normalization (TN) module, imposing strict low-latency requirements in real-time SDS
      scenarios. Existing TN solutions are largely rule-based, rely on manual engineering, and
      generalize poorly to unseen patterns. Although an LLM itself can perform TN through prompt
      engineering, it faces key limitations: high first-token latency due to non-streaming
      processing, hallucination risks, and degraded intelligence or reasoning when the core LLM
      module is fine-tuned solely for TN. To address these challenges, we propose StreamTN, a
      lightweight LLM-based Chinese streaming TN model. Built on Qwen3-0.6B, StreamTN employs a
      dual-track streaming framework in which input tokens and output tokens are processed on two
      parallel tracks, enabling low-latency real-time inference without complex prompting. Moreover,
      task-specific fine-tuning yields superior TN performance and fewer hallucinations than
      rule-based systems and general-purpose LLMs. We also introduce a TN benchmark that spans
      diverse text scenarios, providing a comprehensive evaluation standard for speech generation in
      spoken dialogue systems. Experiments demonstrate the effectiveness of StreamTN in accuracy and
      inference latency."
