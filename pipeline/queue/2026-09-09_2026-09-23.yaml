      more pronounced in the speech domain, where audio, as a low-compression modality, requires
      substantially more embeddings than text to preserve both semantic content and acoustic cues.
      To address this challenge, we introduce \\textbf{Vox-Infinity}, the first benchmark
      specifically designed to evaluate long-context understanding in spoken language models.
