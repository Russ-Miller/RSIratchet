      areas, exposing failures in complex diagnostic scenarios and limitations in contextual,
      patient-centered dialogue. We introduce a sequential training framework that targets these
      facets using synthetic data and rubric-based reinforcement learning. First, we improve
      diagnostic reasoning using MedBullets-derived questions with rule- and rubric-guided
      Reinforcement Learning (RL). We then shift to clinical reasoning by generating 5.3k synthetic
