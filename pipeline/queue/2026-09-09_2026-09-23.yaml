      schema, generates PostgreSQL, validates it with a dry run, retries on failure, executes the
      query, and narrates the result set in plain English. The agent uses prompt engineering only;
      no model was fine-tuned. We evaluated it on the Chicago Crime dataset (approximately 8.5
      million records, 22 attributes) against a hand-built benchmark of 100 natural language
