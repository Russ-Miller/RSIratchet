      subtask remains relatively limited compared to other AM tasks, most existing approaches
      formulate it as a simplified sequence labeling problem, component classification, or a
      pipeline of component segmentation followed by classification. In this paper, we propose
      ITFACD, a novel approach based on instruction-tuned Large Language Models (LLMs) using compact
      instruction-based prompts, and reframe ACD as a language generation task, enabling arguments
      to be identified directly from plain text without relying on pre-segmented components.
