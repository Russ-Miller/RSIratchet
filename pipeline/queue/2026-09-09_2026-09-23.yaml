    abstract: While Large Language Models (LLMs) excel at understanding unstructured financial contexts,
      their direct use in portfolio optimization is limited by a mismatch between next-token
      prediction and the listwise ranking objectives required for asset allocation. They also
      struggle with precise numerical forecasting, leading to instability and arithmetic
      hallucinations. To bridge this gap, we propose FinRankGRPO, a framework that shifts LLM based
      portfolio construction from direct numerical prediction to listwise ranking of financial
      assets. We introduce a two-stage training process, supervised finetuning on Chain-of-Thought
      reasoning data, followed by our Financial Asset Ranking via Group Relative Policy Optimization
