    abstract: "Code generated by large language models passes security checks at a rate that has barely
      moved in four years. In regulated backends, the defect classes that matter most are money
      arithmetic, time handling, retry safety, and access control. Teams answer with instruction
      files, yet the largest controlled study of instruction files to date found no benefit. This
      paper tests a narrower idea: generated code improves when the prompt carries a specification,
      a fixed preamble stating what must be true of the result. We pre-registered hypotheses,
      refuters, analysis code, and a one-shot generation rule, then ran 50 realistic backend tasks
      from finance, healthcare, and insurance practice through five frontier models from five vendor
      lineages, each task twice: bare, and preceded by a 267-word filled specification frame. Nine
      deterministic AST-based checkers scored the outputs. The Bandit security scanner, which knows
      nothing of the frame, scored them independently. The frame reduced defects in all five models
      (mean reduction 0.16 to 0.70 findings per task, every Holm-adjusted sign test significant,
      every bootstrap confidence interval excluding zero). Where the arms differed, the frame arm
      won 95 of 100 times. It never made any model worse in any domain. Bandit found 53
      medium-or-high issues in the bare arm and 11 in the frame arm, in the same direction for every
      model. The effect was largest where a model's unprompted defaults were weakest: the frame
      supplies the discipline a model lacks"
