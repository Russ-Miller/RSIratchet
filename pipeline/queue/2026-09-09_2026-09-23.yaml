      the system prompt, which had been truncating multi-row answers. Error analysis attributes the
      residual failures to relevance-checker false rejections, ambiguous question semantics, and
      free-tier API rate limits rather than to the language generation step. We report no comparison
      against an external baseline system or a public benchmark; the study is a single-model
