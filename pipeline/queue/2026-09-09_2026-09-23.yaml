    abstract: Commercial large language models are increasingly deployed across African fintech
      infrastructure for fraud detection and customer communication, yet no Nigerian or African
      continental regulatory instrument specifies what pre-deployment evaluation such systems must
      undergo before procurement. This paper reviews African fintech AI governance across global,
      continental, and Nigerian instruments, and shows that safety is affirmed as a principle while
      pre-deployment evaluation is operationally unspecified. Generic safety benchmarks cannot
      surface the failure modes most relevant to this domain, since none contain Nigerian
      institutional content or test for false positive misclassification of legitimate financial
      communications. These claims are demonstrated using SafeAlert, a purpose-built evaluation kit
      applied to six commercial models across three system prompt conditions. Results show that
      models resisting generic harmful content requests still produce complete fraud scripts under
      specific framing, and that several models misclassify most legitimate Nigerian bank
      communications as suspicious or fraudulent, a failure invisible to standard safety evaluation.
      The paper concludes with a regulatory framework proposing pre-deployment evaluation
      requirements for the CBN, NITDA, SEC, and the AU, arguing that the identified gap reflects an
      absence of regulatory specification, not a shortage of technical or financial resources.
