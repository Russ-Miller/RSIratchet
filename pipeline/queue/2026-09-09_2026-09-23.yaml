      intervention pipelines. Across 1,200 28-turn conversations spanning four LLMs and two ADHD
      persona intensities, we varied when to intervene (static vs. adaptive) and what to inject
      (reinjection vs. reflective reminder), plus a novel adaptive condition in which a monitor
