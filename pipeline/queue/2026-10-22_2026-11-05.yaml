      Benchmark, an expert-curated benchmark of 110 open-ended questions about the EU AI Act
      (Regulation (EU) 2024/1689). Each question comes with an exemplary answer, question-specific
      correctness criteria, and expected references. Evaluation measures answer correctness,
      reference quality, conciseness, tone, and latency, with a multi-turn ``hard mode'' testing
      responses to simulated user pushback. We also present the results of the 2026 EU AI Act Q&A
      Challenge, based on the benchmark, where three off-the-shelf baselines and five purpose-built
      assistants (from four commercial developers and one academic entrant) were tested. Only two of
      the five submitted assistants consistently outperformed the baselines; one achieved high
      scores across all evaluated metrics. These results show that specialist development alone does
      not guarantee better performance and highlight the critical importance of LLM assistant
      evaluation in regulatory affairs. The benchmark code is openly available at
