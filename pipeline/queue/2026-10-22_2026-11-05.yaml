    venue: arXiv (Cornell University)
    topic: Machine Learning in Healthcare
    cited_by_count: 0
    abstract: MIMIC is one of the most widely used public hospital datasets for machine learning on
      electronic health records, yet clinically important information, such as past medical history,
      allergies, and diagnostic findings, remains confined to free-text discharge summaries. Studies
      requiring this information must therefore build their own extraction pipelines, duplicating
      substantial effort across projects. We release MIMIC-Note-Extract (MNE), a large-scale dataset
      that uses a hybrid extraction pipeline combining deterministic parsing with schema-guided
      large language model generation to transform 16 sections from 300,720 discharge summaries into
      structured tables. MNE adds information that has no structured MIMIC counterpart and enriches
      related tables with broader coverage and greater clinical detail, including 10 times more
      patient-history entries and medication histories for more than twice as many admissions.
      Validation by medical doctors confirms extraction accuracy above 92% across sections. Using
      MNE, we construct a clinical decision-making benchmark for LLM agents, demonstrating how
      reusable structured representations of clinical narratives reduce data curation effort.
