      full-attention layers, organized into an input block, a shared recurrent block, and an output
      block. At inference, the recurrent block can be applied a variable number of times. We
      pre-trained Dory1.0-4B on 6 trillion tokens. The first 4.5 trillion tokens were trained in
      NVFP4, and additional pre-training then extended the context length to 256K tokens. Next, we
