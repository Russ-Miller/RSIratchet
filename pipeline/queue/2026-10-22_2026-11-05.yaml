      In this work, we reveal that direct failure does not necessarily imply inability. Some
      reasoning failures can be recovered by exploring the model's own trajectories, exposing a
      recoverable capability frontier: a policy-dependent region where solutions are not reliably
      generated through direct decoding but can be elicited through trajectory-level search. Based
      on this observation, we introduce ReSI-Math, a framework that explores recoverable capability
      frontiers and converts recovered capabilities into data-efficient RLVR supervision. ReSI-Math
