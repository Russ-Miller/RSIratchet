    cited_by_count: 0
    abstract: Agile Earth observation satellites must coordinate imaging tasks within limited
      observation windows, while accounting for attitude maneuvering and onboard energy constraints.
      Competition among observation opportunities makes scheduling performance sensitive to the
      heuristic rules used for task selection. This letter proposes a large language model
      (LLM)-assisted adaptive heuristic search method for agile Earth observation satellite
      scheduling. The LLM generates an initial heuristic rule according to the characteristics of
      the scheduling instance. During the subsequent ant colony search, search performance and
      scheduling information are fed back to the LLM to refine the heuristic rule. The proposed
      modifications are evaluated through paired solution constructions before being incorporated
      into the search process. A unified scheduling procedure determines task selection, satellite
      assignment, and observation timing under the operational constraints. Experiments on six
      scheduling scenarios involving 50--200 imaging tasks demonstrate that the proposed method
      achieves 4.3\%--9.6\% higher mean observation benefit than the strongest baseline.
