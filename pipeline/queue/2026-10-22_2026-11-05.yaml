      tuning with caption-palette-grid trajectories. We post-train Molmo2-4B from its pretraining
      checkpoint by mixing general instruction data with our curated PRT data, improving performance
      across 16 visual-centric benchmarks, indicating that explicit pixel reconstruction can provide
      useful auxiliary supervision.
