      than a pre-specified out-of-sample test, mainly because they accept weaker evidence: held to
      an agent's false-positive rate, a conventional in-sample test does as well or better. The
      agents claim predictability too often in worlds without a signal, state miscalibrated
      probabilities, and change their verdicts after a sentence about prior research; the magnitudes
      depend on the model. The excess false claims persist in simulated worlds without a resampling
      artifact. Agent verdicts are informative but need a neutral brief, a decision rule fixed
      outside the agent and a sealed holdout."
