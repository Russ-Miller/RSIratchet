    abstract: Medical physicists turn a prescription into a delivered dose and check one another's
      calculations, because one error in a beam calibration or a monitor-unit (MU) calculation can
      affect every patient treated with it. MedPhysBench has ten seeded generators of calculation
      items in radiation therapy, diagnostic imaging, nuclear medicine and radiation protection, up
      to clinical tasks such as a TG-51 calibration worksheet. Reference answers come from code
      implementing the governing protocols, and a grader converts units and applies tolerance bands.
      From the same inputs, separate checking items test error detection, showing a colleague's
      worksheet or only the colleague's result, half correct and half with one planted error. On a
      held-out test split of 1,200 items (half for two models), 12 models scored 33.3 to 100.0% on
      calculation. Of the nine answers graded incorrect for the four best (99.3-100.0%), five
