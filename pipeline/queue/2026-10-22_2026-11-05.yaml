      attribution is therefore essential: it requires identifying the supporting pages and
      localizing fine-grained evidence regions within them, thereby making multi-page reasoning
      transparent and auditable. Existing approaches either process multiple pages jointly or
      iteratively refine evidence within a single trajectory, risking cross-page context pollution
