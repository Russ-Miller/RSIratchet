    abstract: Video Reasoning Segmentation (VRS) aims to infer and segment target objects specified by
      reasoning queries in videos. Existing methods typically first infer the target and generate a
      few segmentation tokens for it, which are then fed into a mask decoder for mask prediction.
      However, such segmentation tokens tend to be both semantically monotonous and spatially
      ambiguous, making them largely insufficient to represent the target to guide mask prediction.
      In this paper, we propose an explicit visual object grounding framework for VRS. Specifically,
      we first propose a spatial-aware prompt generation and refinement scheme, in which we query a
      multimodal large language model to generate explicit spatial prompts (i.e., bounding box and
      point set) for the target and then refine them through multi-step dialogue. Furthermore, we
      introduce a query diversification and alignment module to generate auxiliary queries that
      describe the same target from different perspectives. We then enforce cross-query consistency
      between their predicted spatial prompts to alleviate the training bias caused by query
      limitations. Finally, we select several reliable frames using a prompt-based keyframe
      selection strategy to support mask decoding and propagation. Extensive experiments on eight
      datasets demonstrate that our method significantly outperforms state-of-the-art methods. The
      code is available at https://github.com/viscom-tongji/EVOG.
