    abstract: "Multimodal discrete diffusion language models (dLLMs) generate responses through
      iterative mask prediction and offer a promising alternative to autoregressive large
      vision-language models. However, they still suffer from hallucination, producing outputs that
      are plausible under language priors but insufficiently grounded in the image. We argue that
      hallucination in multimodal dLLMs is not only a token prediction problem, but also a premature
      commitment problem: during iterative denoising, some masked positions are unmasked too early
      because their confidence is driven more by language priors than by visual evidence, and these
      early commitments can bias later generation. To address this issue, we propose Visual Gain
      Ordering (VIGOR), a training-free and plug-and-play inference strategy that reorders masked
      positions according to counterfactual visual evidence. At each denoising step, VIGOR compares
      the confidence of each candidate token under the original image-conditioned pass and an
      additional visual-ablation pass, and prioritizes positions whose predictions are more strongly
      supported by the image. Experiments on LLaDA-V and Lumina-DiMOO show that VIGOR consistently
      reduces hallucination and improves multimodal reasoning performance across benchmarks. Code is
      available at https://github.com/THU-BPM/Vigor."
