    title: A Compact Formula-Aware Spreadsheet Abstraction for Large Language Models
    date: 2026-10-30
    arxiv_id: "2611.03705"
    doi: https://doi.org/10.48550/arxiv.2611.03705
    authors:
      - Tie Cheng
    venue: arXiv (Cornell University)
    topic: Spreadsheets and End-User Computing
    cited_by_count: 0
    abstract: Large language models (LLMs) are increasingly used to assist spreadsheet users with tasks
      such as spreadsheet model construction, formula generation, and data analysis, yet their
      interaction with real-world spreadsheets remains limited by the mismatch between the structure
      of spreadsheets and the sequential textual representations typically provided to LLMs. We
      propose a compact formula-aware spreadsheet abstraction that represents large homogeneous
      ranges through their positions, types, R1C1 formula patterns, and selected boundary values. An
      efficient algorithm detects and structures these ranges before a textual serialization is
      supplied to an LLM. The abstraction is provided to the LLM before detailed spreadsheet content
      is submitted, improving the accuracy and efficiency of spreadsheet processing while reducing
      token consumption. We evaluate the method on 50 spreadsheet-query cases. The evaluation shows
      that the abstraction alone was sufficient to answer some queries. When additional spreadsheet
      content is required, the abstraction reduces the amount of data that must be submitted to the
      LLM, thereby reducing token consumption. The abstraction layer also improves the reliability
      and accuracy of spreadsheet processing. We conclude by discussing further techniques for
      combining spreadsheet static analysis with artificial intelligence to improve the reliability,
      accuracy, and efficiency of AI assisted spreadsheet tasks.
