    abstract: Large Vision-Language Models (LVLMs) routinely name objects that are absent from the
      image. Latent steering can reduce this failure in one model forward pass, but a fixed gate
      treats early and late decoding steps by the same criterion. We observe that predictive entropy
      varies sharply within free-running generation, while states that commit to short answers
      occupy a narrow, confident band. We exploit this temporal mismatch by using uncertainty as a
      causally available, token-local control signal for an existing steering gate. We propose
      Entropy-Gated Dynamic Rectification (EGDR), which lowers the intervention threshold when
      entropy derived from the preceding step's already available logits is high and retains the
