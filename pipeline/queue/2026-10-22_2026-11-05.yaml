      (LLMs) as execution-time decision makers, we use them as designers that construct RL pipelines
      before deployment, including Markov decision process (MDP) formulation and simulator
      implementation. We identify a phase-wise structure in this problem: MDP formulation is
      dependency-structured and sequential, whereas simulator implementation becomes modular once
      the formulation is fixed. Based on this structure, we propose ARPG, a dependency-aware agentic
      framework that performs sequential MDP modeling, localized verification and correction, and
      simulator-structured implementation while externalizing intermediate artifacts. ARPG targets a
      key failure mode of automated policy generation: executable code may still yield non-learnable
      policies when state, action, reward, and termination artifacts are not semantically aligned.
      Experiments in Isaac Sim show that ARPG improves modeling correctness, environment
      executability, and policy-generation success compared with monolithic LLM baselines and
      off-the-shelf agentic systems. Additional demonstrations on custom robotics, standard RL, and
      engineering-domain MDPs further suggest that the same modeling pipeline can be reused beyond
      the main benchmark suite."
