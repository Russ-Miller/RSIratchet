    abstract: 'Patient history taking is a strategic, multi-turn process that refines diagnostic
      hypotheses through iterative questioning, mirroring clinical reasoning where each inquiry
      updates beliefs over candidate diagnoses. Deploying AI in this setting is constrained by
      privacy, cost, and latency, making Small Language Models (SLMs) a more desirable backbone
      compared to larger LLMs. However, SLMs capture only the fast, intuitive "System 1" side of
      this process and lack explicit mechanisms for the deliberative "System 2" reasoning needed to
      maintain and update diagnostic uncertainty over time. Bayesian Networks (BayesNets) offer a
      natural complement, providing an interpretable framework for auditable probabilistic belief
      tracking. Yet, clinical BayesNets are difficult to construct due to their reliance on expert
      curated structure, dependencies, and parameters. We introduce ProbMedTOD, which automatically
      synthesizes a clinical BayesNet from a small number of clinical notes in three stages:
      ontology building, structure prediction, and parameter estimation. ProbMedTOD then integrates
      the resulting BayesNet with SLMs, enabling probabilistic reasoning in multi-turn dialogues. A
      BayesNet Agent maintains real-time posterior distributions over diagnoses, while a Policy
