    abstract: Large language model (LLM) agents achieve state-of-the-art performance across domains
      through chain-of-thought (CoT) reasoning. Despite their ubiquitous use, little is understood
      about the relationship between the externalized trace and the model's actual computation. We
      address this by investigating how LLM agents make decisions in iterative games with incomplete
      information. Using a series of mechanistic interpretability techniques, we find that the model
      forms and iteratively revises an internal representation of the game throughout the CoT. Once
      the model prematurely commits to an incorrect belief, it rarely recovers. This failure is
      manifested in both the literal trace and the layer activations. Ultimately, as multi-agent
      systems are more prevalent, our work opens the door to a more focused diagnosis of their
      strategic reasoning errors. For illustrative purposes, we offer an interactive visualizer of
      our methodology on selected sample traces at https://interp-self.github.io/gametrace/
