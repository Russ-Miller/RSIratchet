    abstract: Automated agent design searches for executable architectures that improve LLM-based agent
      performance, with evolutionary methods using language-model crossover to recombine promising
      mechanisms for task decomposition, model coordination, and verification. This search, however,
      is typically guided by aggregate fitness alone, which hides the instance-level successes and
      failures behind each score. We introduce Execution Guided Genetic Recombination for Agent
      Design (GRAFT), which uses aggregate fitness for selection and survival and parent-specific
      execution evidence to guide semantic crossover with integrated mutation. Its feedback harness
      reuses bounded samples of successful and failed runs from fitness evaluation, withholding
      reference answers and requiring no additional task executions. We evaluate GRAFT across six
