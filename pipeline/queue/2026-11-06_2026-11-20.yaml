      hundred tokens to reach the correct answer. We start by labelling each CoT hidden state as
      recovering if patching it into the direct prompt yields the correct answer, and failed
      otherwise. A linear probe shows that the model encodes these two classes differently. We then
      show that the representation space of the direct prompt holds a direction for each question
      that leads the model, in a short generation, to the correct answer more often than CoT does.
