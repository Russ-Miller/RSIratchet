    abstract: "Embodied robots increasingly rely on large language models (LLMs) to interpret user
      intent and coordinate with robot-specific action models for physical interaction. This
      multi-model pipeline creates a critical semantic boundary across mind, model collaboration,
      and motion: semantic consistency may break between what the large model understands, how the
      small action model translates that understanding into executable commands, and what physical
      actions the robot ultimately performs. As a security consequence, commercial robots may
      execute unintended physical actions even when user inputs contain no explicit action commands.
      To measure this problem, we develop TARS, a black-box framework that explores the
      command-reasoning-action pipeline and automatically discovers and validates unintended
      physical behaviors. We evaluate TARS on four commercial robots across 44 experimental
      settings, conducting 133,400 executions. TARS uncovers widespread cross-model action
      misalignment and achieves up to 94% verified action coverage."
