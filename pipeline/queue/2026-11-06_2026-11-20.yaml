      distinguish proxy limitations from calibration bottlenecks and establish practical efficiency.
      We present a unified benchmark of four representative systems, which formulate query
      processing as a three-stage workflow comprising proxy construction, threshold calibration, and
      cascade inference, using a two-threshold acceptance rule. We introduce cascadeability: the
      maximum empirical oracle reduction attainable from fixed proxy scores at a specified accuracy
      target, computed retrospectively using complete oracle labels. We investigate 8 research
      questions, spanning proxy quality, end-to-end performance, workload sensitivities, and
      component ablations, and reveal our key findings accordingly. Comparing cascadeability with
      achieved oracle reduction yields a realization gap that, interpreted alongside accuracy,
      exposes distinct proxy and calibration bottlenecks. The benchmark and diagnostics support
