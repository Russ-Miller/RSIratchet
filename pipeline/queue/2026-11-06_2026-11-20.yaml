      However, the best quantization recipe differs across models and precisions. As a result,
      experts must redesign it for every new model, which is time-consuming and often sub-optimal.
      Fortunately, an LLM agent can take over this design by refining the recipe over rounds of
      building and evaluating candidates, so that more rounds lead to better recipes. However,
      evaluating one quantized reasoning model takes tens of GPU-hours, and combining methods from
