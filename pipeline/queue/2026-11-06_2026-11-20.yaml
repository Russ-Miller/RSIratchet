    topic: Software Reliability and Analysis Research
    cited_by_count: 0
    abstract: "Public benchmarks support comparisons of large language model (LLM) capabilities, yet
      users can experience the same highly ranked model differently. Drawing on traditional software
      reliability, we argue that the reliability of an LLM service should be assessed for specified
      users and conditions of use. This requires more than a capability score: evaluation evidence
      must support a claim about failure during future operation. We distinguish testing to discover
      faults from testing to assess reliability and identify ten modelling considerations behind
      such claims. We propose a six-workstream research roadmap linking claim specification, dynamic
      operational profiles, graded outcomes and noisy judgements, local probabilistic robustness,
      interaction dependence, and statistical inference with reassessment. Local probabilistic
      robustness addresses the behavioural variation hidden when different concrete inputs are
      treated as the same task. Published findings and an illustrative customer-support example
      motivate the roadmap; its integrated validation remains an open research task. Reliability
      claims complement, but do not replace, separate safety and security arguments. Capability
      scores should therefore be complemented by versioned operational claims that state whose
      requirements are covered, under which conditions, and with what uncertainty."
    proposal:
      suggests_new_capability: false
