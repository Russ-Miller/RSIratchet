      natural-language descriptions, but reliability requires checks of physical consistency and
      fidelity to the problem description. Our agentic harness implements explicit task allocation:
      LLMs interpret user requests and simulator diagnostics, generate input components not covered
      by predefined construction rules, and propose repairs, while deterministic routines construct
