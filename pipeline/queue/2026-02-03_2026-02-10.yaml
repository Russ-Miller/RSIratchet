    abstract: "While Large Language Model (LLM)-based agents have shown remarkable potential for solving
      complex tasks, existing systems remain heavily reliant on large-scale models, leaving the
      capabilities of edge-scale models largely underexplored. In this paper, we present the first
      systematic study on training agentic models at the 4B-parameter scale. We identify three
      primary bottlenecks hindering the performance of edge-scale models: catastrophic forgetting
      during Supervised Fine-Tuning (SFT), sensitivity to reward signal noise during Reinforcement
      Learning (RL), and reasoning degradation caused by redundant information in long-context
      scenarios. To address the issues, we propose AgentCPM-Explore, a compact 4B agent model with
