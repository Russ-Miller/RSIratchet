      human-like shortcuts, or brittle pattern matching. We benchmark 20+ LLMs against a matched
      human baseline on 11 causal judgment tasks formalized by a collider structure ($C_1
      \rightarrow E \leftarrow C_2$). We find that a small interpretable model compresses LLMs'
      causal judgments well and that most LLMs exhibit more rule-like reasoning strategies than
      humans who seem to account for unmentioned latent factors in their probability judgments.
