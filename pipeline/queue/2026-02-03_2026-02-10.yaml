      alternative repair paradigm that relies on a representation more accessible to LLMs than raw
      code, enabling more accurate understanding, analysis, and alignment during repair. To address
      this gap, we propose VibeRepair, a specification-centric APR technique that treats repair as
      behavior-specification repair rather than ad-hoc code editing. VibeRepair first translates
      buggy code into a structured behavior specification that captures the program's intended
      runtime behavior, then infers and repairs specification misalignments, and finally synthesizes
      code strictly guided by the corrected behavior specification. An on-demand reasoning component
      enriches hard cases with program analysis and historical bug-fix evidence while controlling
