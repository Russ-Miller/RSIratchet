      feature, we propose EXaMCaP, which uses entropy gain maximization to select a subset. To
      obtain a high-diversity subset, EXaMCaP chooses the maximum-entropy subset from the large
      ChartU dataset. As enumerating all possible subsets is impractical, EXaMCaP iteratively
      selects samples to maximize the gain in set entropy relative to the current set, approximating
      the maximum-entropy subset of the full dataset. Experiments show that EXaMCaP outperforms
      baselines in probing the capability gains of the ChartU training set, along with its strong
      effectiveness across diverse subset sizes and compatibility with various MLLM architectures.
