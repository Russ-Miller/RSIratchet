      chain-of-thought (CoT) increases robustness for many LLMs. Together, this divergence suggests
      LLMs can complement humans when known biases are undesirable, but their rule-like reasoning
      may break down when uncertainty is intrinsic - highlighting the need to characterize LLM
      reasoning strategies for safe, effective deployment.
