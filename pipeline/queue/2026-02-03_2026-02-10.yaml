    abstract: "As large language model agents tackle increasingly complex long-horizon tasks, effective
      post-training becomes critical. Prior work faces fundamental challenges: outcome-only rewards
      fail to precisely attribute credit to intermediate steps, estimated step-level rewards
      introduce systematic noise, and Monte Carlo sampling approaches for step reward estimation
      incur prohibitive computational cost. Inspired by findings that only a small fraction of
      high-entropy tokens drive effective RL for reasoning, we propose Critical Step Optimization
      (CSO), which focuses preference learning on verified critical steps, decision points where
      alternate actions demonstrably flip task outcomes from failure to success. Crucially, our
      method starts from failed policy trajectories rather than expert demonstrations, directly
      targeting the policy model's weaknesses. We use a process reward model (PRM) to identify
      candidate critical steps, leverage expert models to propose high-quality alternatives, then
      continue execution from these alternatives using the policy model itself until task
      completion. Only alternatives that the policy successfully executes to correct outcomes are
      verified and used as DPO training data, ensuring both quality and policy reachability. This
      yields fine-grained, verifiable supervision at critical decisions while avoiding
