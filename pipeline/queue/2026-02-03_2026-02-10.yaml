      capabilities. However, existing RAG systems fail to leverage these capabilities. They still
      rely on two paradigms: (1) designing an algorithm that retrieves passages in a single shot and
      concatenates them into the model's input, or (2) predefining a workflow and prompting the
      model to execute it step-by-step. Neither paradigm allows the model to participate in
      retrieval decisions, preventing efficient scaling with model improvements. In this paper, we
      introduce A-RAG, an Agentic RAG framework that exposes hierarchical retrieval interfaces
