    abstract: To stabilize the training of Large Language Models (LLMs), gradient clipping is a nearly
      ubiquitous heuristic used to alleviate exploding gradients. However, traditional global norm
      clipping erroneously presupposes gradient homogeneity across different functional modules,
      leading to an adverse "spill-over" effect where volatile parameters force unnecessary scaling
      on stable ones. To overcome this, we propose Adaptive Group-wise Gradient Clipping (AGGC).
      AGGC partitions parameters into groups based on functional types and regulates each according
      to its historical behavior using an Exponential Moving Average (EMA). Specifically, it
      constructs an adaptive interval to simultaneously mitigate gradient explosion and vanishing,
