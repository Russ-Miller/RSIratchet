    abstract: "Self-evolving agents powered by Large Language Models (LLMs) have emerged as a promising
      direction across diverse domains, including code optimization and scientific discovery, yet
      their core failure modes remain underexplored. Through a comprehensive empirical study, we
      identify that the model's reasoning becomes anchored to the local context of current
      hypotheses, overemphasizing low-level details while neglecting the broader search landscape.
      As a result, such agents become prone to context pollution and mode collapse, repeatedly
      revisiting flawed hypotheses and converging on suboptimal solutions. To address this
      challenge, we propose Progress-Aware Consistent Evolution (PACEvolve), a systematic framework
      for governing agent memory and search dynamics. PACEvolve overcomes these limitations through
      three key techniques: (1) Hierarchical Context Management (HCM), which structures historical
      trajectories while dynamically pruning branches to preserve a high-signal memory state; (2)
      Momentum-Based Backtracking (MBB), which monitors optimization progress to escape local
      minima; and (3) a self-adaptive Collaborative Evolution policy (CE) that balances
      intra-trajectory refinement with inter-trajectory knowledge transfer. By decoupling high-level
      idea generation from low-level code evaluation, PACEvolve maintains a global view of search
      momentum and achieves state-of-the-art results across complex evolutionary benchmarks."
