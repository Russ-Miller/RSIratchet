      gap, we introduce SciHorizon-GENE, a large-scale gene-centric benchmark constructed from
      authoritative biological databases. The benchmark integrates curated knowledge for over 190K
      human genes and comprises more than 540K questions covering diverse gene-to-function reasoning
      scenarios relevant to cell type annotation, functional interpretation, and mechanism-oriented
