      a hybrid system that combines LLMs with deterministic phonological algorithms to achieve
      accurate rhyme identification/analysis and generation. Our approach implements a comprehensive
      taxonomy of Greek rhyme types, including Pure, Rich, Imperfect, Mosaic, and Identical
      Pre-rhyme Vowel (IDV) patterns, and employs an agentic generation pipeline with phonological
      verification. We evaluate multiple prompting strategies (zero-shot, few-shot,
      Chain-of-Thought, and RAG-augmented) across several LLMs including Claude 3.7 and 4.5, GPT-4o,
      Gemini 2.0 and open-weight models like Llama 3.1 8B and 70B and Mistral Large. Results reveal
      a significant "Reasoning Gap": while native-like models (Claude 3.7) perform intuitively (40\%
      accuracy in identification), reasoning-heavy models (Claude 4.5) achieve state-of-the-art
      performance (54\%) only when prompted with Chain-of-Thought. Most critically, pure LLM
      generation fails catastrophically (under 4\% valid poems), while our hybrid verification loop
      restores performance to 73.1\%. We release our system and a corpus of 40,000+ rhymes, derived
