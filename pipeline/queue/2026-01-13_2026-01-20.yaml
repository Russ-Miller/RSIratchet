    abstract: 'While Multimodal Large Language Models (MLLMs) have demonstrated impressive proficiency
      in high-level reasoning tasks, such as complex diagrammatic interpretation, it remains an open
      question whether they possess the fundamental visual primitives comparable to human intuition.
      To investigate this, we introduce KidVis, a novel benchmark grounded in the theory of human
      visual development. KidVis deconstructs visual intelligence into six atomic capabilities -
      Concentration, Tracking, Discrimination, Memory, Spatial, and Closure - already possessed by
      6-7 year old children, comprising 10 categories of low-semantic-dependent visual tasks.
      Evaluating 20 state-of-the-art MLLMs against a human physiological baseline reveals a stark
      performance disparity. Results indicate that while human children achieve a near-perfect
      average score of 95.32, the state-of-the-art GPT-5 attains only 67.33. Crucially, we observe a
      "Scaling Law Paradox": simply increasing model parameters fails to yield linear improvements
      in these foundational visual capabilities. This study confirms that current MLLMs, despite
      their reasoning prowess, lack the essential physiological perceptual primitives required for
      generalized visual intelligence.'
