      Task-oriented Agents capable of bridging the gap between relatively static user's needs and a
      dynamic environment. We formalize proactivity through two key capabilities, (i)
      Intent-Conditioned Monitoring: The agent autonomously formulates trigger conditions based on
      dialog history; (ii) Event-Triggered Follow-up: The agent actively engages the user upon
