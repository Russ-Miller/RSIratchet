    abstract: We demonstrate that large language model (LLM) agents can autonomously perform tensor
      network simulations of quantum many-body systems, achieving approximately 90% success rate
      across representative benchmark tasks. Tensor network methods are powerful tools for quantum
      simulation, but their effective use requires expertise typically acquired through years of
      graduate training. By combining in-context learning with curated documentation and multi-agent
      decomposition, we create autonomous AI agents that can be trained in specialized computational
      domains within minutes. We benchmark three configurations (baseline, single-agent with
      in-context learning, and multi-agent with in-context learning) on problems spanning quantum
      phase transitions, open quantum system dynamics, and photochemical reactions. Systematic
      evaluation using DeepSeek-V3.2, Gemini 2.5 Pro, and Claude Opus 4.5 demonstrates that both
      in-context learning and multi-agent architecture are essential. Analysis of failure modes
      reveals characteristic patterns across models, with the multi-agent configuration
      substantially reducing implementation errors and hallucinations compared to simpler
      architectures.
