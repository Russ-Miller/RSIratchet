      environments, overlooking robustness for stochastic real-world deployment. We identify three
      key challenges: dynamic task scheduling, active exploration under uncertainty, and continuous
      learning from experience. To bridge this gap, we introduce \method{}, a dynamic evaluation
      environment that simulates a "trainee" agent continuously exploring a novel setting. Unlike
      traditional benchmarks, \method{} evaluates agents along three dimensions: (1) context-aware
      scheduling for streaming tasks with varying priorities; (2) prudent information acquisition to
      reduce hallucination via active exploration; and (3) continuous evolution by distilling
      generalized strategies from rule-based, dynamically generated tasks. Experiments show that
