      "restoration-then-recognition" two-stage paradigm suffers from a fundamental flaw: the
      pixel-level optimization objectives of image restoration models are misaligned with the
      semantic goals of character recognition, leading to artifact interference and error
      accumulation. While Vision-Language Models (VLMs) have demonstrated powerful general
      capabilities, they lack explicit structural modeling for license plate character sequences
      (e.g., fixed length, specific order). To address this, we propose an end-to-end
      structure-aware multimodal reasoning framework based on Qwen3-VL. The core innovation lies in
      the Character-Aware Multimodal Reasoning Module (CMRM), which introduces a set of learnable
      Character Slot Queries. Through a cross-attention mechanism, these queries actively retrieve
      fine-grained evidence corresponding to character positions from visual features. Subsequently,
      we inject these character-aware representations back into the visual tokens via residual
      modulation, enabling the language model to perform autoregressive generation based on explicit
