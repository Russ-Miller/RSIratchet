      predefined workflows, where human engineers enumerate task states in advance and specify
      routing rules and contextual injections accordingly. Such workflow-driven designs are
      essentially rule-based decision trees, which suffer from two fundamental limitations: they
      require substantial manual effort to anticipate and encode possible task states, and they
      cannot exhaustively cover the state space of complex real-world tasks. To address these
      issues, we propose an Information-Flow-Orchestrated Multi-Agent Paradigm via Agent-to-Agent
      (A2A) Communication from CORAL, in which a dedicated information flow orchestrator
      continuously monitors task progress and dynamically coordinates other agents through the A2A
      toolkit using natural language, without relying on predefined workflows. We evaluate our
