      their robustness to realistic perception degradation remains poorly understood. In this work,
      we systematically study semantic misalignment in VLMs under controlled degradation of upstream
      visual perception, using semantic segmentation on the Cityscapes dataset as a representative
      perception module. We introduce perception-realistic corruptions that induce only moderate
      drops in conventional segmentation metrics, yet observe severe failures in downstream VLM
      behavior, including hallucinated object mentions, omission of safety-critical entities, and
      inconsistent safety judgments. To quantify these effects, we propose a set of language-level
      misalignment metrics that capture hallucination, critical omission, and safety
      misinterpretation, and analyze their relationship with segmentation quality across multiple
      contrastive and generative VLMs. Our results reveal a clear disconnect between pixel-level
      robustness and multimodal semantic reliability, highlighting a critical limitation of current
      VLM-based systems and motivating the need for evaluation frameworks that explicitly account
