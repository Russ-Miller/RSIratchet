    abstract: Existing reasoning segmentation frameworks typically employ multimodal large language
      models (MLLMs) with broad world knowledge to extract semantics in a human-like manner and
      generate corresponding segmentation masks. Nevertheless, these frameworks lack the necessary
      scene-specific awareness. This paper introduces driving scene reasoning segmentation (DSRS), a
      scene-specific task that requires models to interpret implicit instructions, infer spatial
      relations, detect potential risks, handle challenging conditions, and comprehend underlying
      traffic rules, ultimately generating accurate segmentation masks. Meanwhile, we establish a
      benchmark dataset to facilitate future research on the DSRS task. To pioneer this task, we
      propose DSRS-Net, a novel architecture with advanced reasoning segmentation capability for
      automated driving. Specifically, DSRS-Net seamlessly infuses geometric features for deeper
      reasoning segmentation, without compromising the original multimodal fusion mechanism. This
      strategy effectively mitigates the modality representation mismatch in MLLMs caused by
      RGB-only pretraining, while enhancing the integration of geometric, contextual, and linguistic
