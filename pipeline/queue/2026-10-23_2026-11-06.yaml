    abstract: "Multimodal large language models (MLLMs) have demonstrated remarkable progress on
      cross-modal reasoning tasks, yet they continue to suffer from hallucinations in long-chain
      reasoning processes. In this work, we revisit hallucination in MLLMs from the perspective of
      reasoning generation dynamics. We argue that entropy is not merely a static measure of
      uncertainty but a structured signal that reflects how modality information is integrated
      throughout decoding. Through systematic analysis, we identify two characteristic entropy
      patterns associated with hallucination behaviors: (1) a generally high-confidence regime
      corresponds to premature convergence to inappropriate multimodal interactions; and (2) local
      abrupt entropy transitions are associated with reasoning instability and hallucination onset.
      Building on these observations, we propose an entropy-aware self-introspective framework for
      MLLM reasoning. Our method continuously tracks entropy dynamics during decoding and performs
      targeted visual re-alignment when suspicious hallucination states are detected, encouraging
