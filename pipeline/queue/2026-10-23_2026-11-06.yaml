    abstract: "Speculative decoding accelerates large language model inference with a small drafter,
      whose per-guess acceptance rate determines the achievable speedup. Feature-level drafters
      share a design choice: every token, easy or hard, is drafted under a single forward pass. Many
      of the tokens the target rejects are ones the drafter is itself unsure about yet the target
      answers decisively. To address this, we introduce Parallel Reconsideration: guided by its own
      uncertainty, the drafter reconsiders its hesitant guesses with extra passes that run in
      parallel with the one-pass draft, adding negligible latency. A co-designed training recipe and
      serving-time drafting algorithm append these reconsidered guesses to the original draft tree
      as refined candidates. Across models and benchmarks, on average, Parallel Reconsideration
      improves over the baselines by 5.3% to 10.2% on acceptance length and by 3.5% to 9.2% on
      speedup."
