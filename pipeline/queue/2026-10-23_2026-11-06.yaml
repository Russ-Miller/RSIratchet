    abstract: Low-bit quantization enables efficient deployment of large language models by reducing
      memory footprint and computational cost. Achieving high accuracy at low precision requires
      selecting quantization ranges, linear transformations, and weight rounding decisions. Existing
      approaches typically optimize these components independently using local reconstruction
      objectives, which fail to account for the varying impact of quantization errors on downstream
      predictions. Direct optimization of task-level metrics would provide a more faithful
      objective, but is challenging due to the discontinuous nature of quantization operations and
      the high computational cost of evaluating their downstream effects. In this work, we derive a
      Hessian-guided approximation of the output change induced by joint weight and activation
      quantization. Based on a tractable Fisher approximation, we formulate a unified post-training
      quantization framework that enables the joint optimization of quantization ranges, linear
      transformations, and weight rounding under a common output-sensitivity objective. The
      resulting method remains practical for modern large language models and consistently
      outperforms state-of-the-art transformation and rounding methods across both channel-wise and
      block-wise quantization settings.
