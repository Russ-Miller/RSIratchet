    abstract: Open-weight language models that fit on a single consumer GPU are becoming capable on a
      growing range of tasks, and they matter because they can run locally without sending the code
      to a hosted service. Vulnerability reproduction, turning a vulnerability description into an
      input that crashes the vulnerable build, is a natural target for them, since it is an
      automated analysis task closer to test generation than to code comprehension and it runs
      against a build that must be executed rather than read. In order to assess whether current
      models can perform it, we evaluate twelve configurations of local models, spanning three
      generations, two architectures and three quantization levels, on ten CyberGym
      vulnerability-reproduction tasks, three runs each under one harness, and release the full
      artefact. We show that every configuration, down to the 4B model, solves most of the six
