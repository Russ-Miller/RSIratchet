      information and visual elements, including figures, diagrams, and plots. Existing ToT
      retrieval benchmarks do not address scientific search. We introduce a multimodal benchmark for
      scientific ToT retrieval, comprising 108,512 open-access scientific documents across five
      domains and 11,499 synthetically generated queries. To construct the benchmark, we propose a
      scalable query elicitation pipeline that independently extracts textual and visual memory cues
      from source documents and uses large language models to generate queries resembling incomplete
      human recollections. We characterize scientific ToT information needs through an empirical
