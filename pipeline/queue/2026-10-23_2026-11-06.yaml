    abstract: AI co-scientists have expanded the use of large language models for generating scientific
      hypotheses and guiding experimental investigation. Here we investigate whether temporal
      patterns in the semantic representations of complete biomedical conclusions can guide
      hypothesis generation. We introduce ForeSCITE, a framework that identifies thematic clusters
      of published conclusions, estimates a direction separating earlier from more recent findings
      within each cluster, and projects existing conclusion embeddings along these directions. An
      embedding language model trained to reconstruct conclusions decodes the projected coordinates
      into natural-language hypotheses. Across 407 clusters derived from approximately three million
      pre-cutoff conclusions, we identify temporal structure and illustrate its retention after
      decoding. In retrospective, time-sliced evaluations, ForeSCITE increases semantic coverage
      beyond the historical corpus, biomedical entity-pair novelty and post-cutoff pair
      re-observation relative to five prompt-based and retrieval-augmented baselines. Expert review
      of prioritized CAR-T hypotheses identified 37 candidates as both novel and biologically
      plausible, and expert justifications for five selected hypotheses illustrate their biological
      rationale and subsequent literature support where available. These findings support temporal
      guidance in semantic space as a scalable mechanism for proposing biomedical hypotheses for
      subsequent scientific evaluation.
