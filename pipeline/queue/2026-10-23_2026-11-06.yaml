      human surrogates in economic simulations and surveys, a role increasingly filled by Large
      Language Models (LLMs), which are costly at scale and under-represent the variation in human
      behaviour. We present a first evaluation of DMs as human surrogates in economics, comparing 10
      DMs with 8 LLMs in three economic settings: a household spending survey on consumption,
      several classic economic games and a labour-market field experiment. Frontier DMs, those that
      score highest on general decision-making benchmarks, reproduce the variation in human
      responses more closely than LLMs in all three settings. They capture the modal human response
      as well as LLMs in the spending survey, but less well in the economic games. Frontier DMs are
      also roughly ten times faster than the fastest LLM and can be over a hundred times cheaper.
