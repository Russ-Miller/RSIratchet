    abstract: Test-time scaling improves large language models through additional computation, but how
      to adapt the topology of internal computation to individual inputs remains underexplored.
      Existing approaches largely fix recurrent or parallel architectures during training, or
      reconfigure frozen models along a single structural axis. We introduce SelfMorph, which makes
      computational shape an input-dependent inference-time decision. It unifies the original
      forward path (BASE), serial reuse of a layer span (REPEAT), and local branching and merging of
      perturbed hidden states (BRANCH) in a unified space parameterized by type, location, and
      intensity. Since they offer complementary benefits rather than uniform dominance, we use a
      lightweight selector that reads the backbone's depth-wise hidden state trajectory on the
      prompt to choose a morphology before response generation. We train the selector by distilling
