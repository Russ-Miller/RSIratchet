      challenging. Prior work has leveraged expert-curated taxonomies to guide visualization design
      and subsequent quality evaluation, a practical evaluation model must also account for
      human-centric factors. Latest visualization tools integrate Large Language Models (LLMs) to
      generate and refine visualizations, using LLM-as-a-judge to provide design feedback. Without a
