    abstract: "Multimodal large language models have recently shown promising progress in visual
      mathematical reasoning. However, their performance is often limited by a critical yet
      underexplored bottleneck: inaccurate visual perception. Through systematic analysis, we find
      that the most failures originate from incorrect or incomplete visual evidence extraction
      rather than deficiencies in reasoning capability. Moreover, models tend to remain overly
      confident in their initial perceptions, making standard strategies such as prompt engineering,
      multi-round self-reflection, or posterior guidance insufficient to reliably correct errors. To
      address this limitation, we propose M3-ACE, a multi-agentic context engineering framework
      designed to rectify visual perception in multimodal math reasoning. Instead of directly
      aggregating final answers, our approach decouples perception and reasoning by dynamically
      maintaining a shared context centered on visual evidence lists. Multiple agents
      collaboratively contribute complementary observations, enabling the system to expose
      inconsistencies and recover missing perceptual information. To support stable multi-turn
      collaboration, we further introduce two lightweight tools: a Summary Tool that organizes
      evidence from different agents into consistent, complementary, and conflicting components, and
      a Refine Tool that filters unreliable samples and guides iterative correction. Extensive
