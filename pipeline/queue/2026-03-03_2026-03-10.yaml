      simulators are scalable but suffer from logic hallucination. We present AutoControl Arena, an
      automated framework for frontier AI risk evaluation built on the principle of logic-narrative
      decoupling. By grounding deterministic state in executable code while delegating generative
      dynamics to LLMs, we mitigate hallucination while maintaining flexibility. This principle,
      instantiated through a three-agent framework, achieves over 98% end-to-end success and 60%
      human preference over existing simulators. To elicit latent risks, we vary environmental
      Stress and Temptation across X-Bench (70 scenarios, 7 risk categories). Evaluating 9 frontier
