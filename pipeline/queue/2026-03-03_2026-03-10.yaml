      understanding of these failures requires empirical approaches that can isolate behavioral
      patterns in controlled settings. We propose that biological misalignment precedes artificial
      misalignment, and leverage the Dark Triad of personality (narcissism, psychopathy, and
      Machiavellianism) as a psychologically grounded framework for constructing model organisms of
      misalignment. In Study 1, we establish comprehensive behavioral profiles of Dark Triad traits
