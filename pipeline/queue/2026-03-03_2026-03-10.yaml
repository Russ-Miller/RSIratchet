      processing tasks, yet their application in hardware security verification remains limited due
      to scarcity of publicly available hardware description language (HDL) datasets. This knowledge
      gap constrains LLM performance in detecting vulnerabilities within HDL designs. To address
      this challenge, we propose SecureRAG-RTL, a novel Retrieval-Augmented Generation (RAG)-based
      approach that significantly enhances LLM-based security verification of hardware designs. Our
      approach integrates domain-specific retrieval with generative reasoning, enabling models to
      overcome inherent limitations in hardware security expertise. We establish baseline
      vulnerability detection rates using prompt-only methods and then demonstrate that
      SecureRAG-RTL achieves substantial improvements across diverse LLM architectures, regardless
      of size. On average, our method increases detection accuracy by about 30%, highlighting its
      effectiveness in bridging domain knowledge gaps. For evaluation, we curated and annotated a
      benchmark dataset of 14 HDL designs containing real-world security vulnerabilities, which we
      will release publicly to support future research. These findings underscore the potential of
      RAG-driven augmentation to enable scalable, efficient, and accurate hardware security
      verification workflows.
