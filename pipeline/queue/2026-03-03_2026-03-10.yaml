      visual context of a scene. To address this, we propose K-Gen, an interpretable keypoint-guided
      multimodal framework that leverages Multimodal Large Language Models (MLLMs) to unify
      rasterized BEV map inputs with textual scene descriptions. Instead of directly predicting full
      trajectories, K-Gen generates interpretable keypoints along with reasoning that reflects agent
      intentions, which are subsequently refined into accurate trajectories by a refinement module.
      To further enhance keypoint generation, we apply T-DAPO, a trajectory-aware reinforcement
