      evolve when such positive anchors are unavailable. We study this question through Cold-Start
      Failure-Only Evolution (CFOE), where agents start without accumulated experience and learn
      only from failed interactions without privileged guidance. Across three self-evolving
      paradigms, multiple LLM backbones, and four interactive environments, we uncover a consistent
      repair-generalization gap: failure-derived experience can help repair previously failed tasks,
