    abstract: Large language models increasingly act as agents that call external tools, yet most
      tool-safety research examines only what follows a tool call. The prior decision of whether to
      call the tool remains largely unexamined and can influence downstream safety. Across the seven
      open-weight models, the unweighted model-average harm rate after admitted harmful requests is
      74.5%. To identify what governs this decision, we apply a factorial intervention to the input
      request. Within our generated construction, neutralizing the requested-operation component
      produces the largest admission contrast (19 pp). A linear direction estimated from this
      contrast influences held-out admission in four of seven models; effects on
      operation-neutralized requests in some models show that it is not an operation-specific
      mechanism. We then test whether written refusal is behaviorally and representationally coupled
      to the same decision. Written refusal accompanies 33.6% of admitted harmful calls. Plain-text
      refusal training reduces unsafe admission in models that retain benign tool use, showing that
      response-level safety training can transfer to the call decision. Together, these results
      establish a partial, model-dependent relation between written refusal and tool admission. They
      motivate direct evaluation and supervision of tool admission rather than treating text refusal
      as its proxy.
