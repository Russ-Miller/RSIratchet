    abstract: Recent studies have shown that position bias remains a critical vulnerability in large
      language models (LLMs), undermining both the integrity of multiple-choice evaluations and the
      reliability of retrieval-augmented generation. However, existing understanding of this
      phenomenon is largely derived from studies with limited model coverage and English-centric
      benchmarks, leaving the behavior of frontier models and diverse languages underexplored. In
      this work, we conduct a comprehensive investigation of position bias across model scales
      ranging from billion-level to trillion-level parameters, covering both multiple-choice and
      multi-document tasks in five languages. Our experiments reveal that while position bias
      remains noticeable in small-scale models and Non-English languages, increasing model scale and
      employing standard Chain-of-Thought prompting significantly mitigate this issue. Moreover, we
      demonstrate that emerging \emph{thinking models} with extended reasoning capabilities are
      nearly immune to position bias, suggesting a costly but general approach toward resolving this
      vulnerability.
