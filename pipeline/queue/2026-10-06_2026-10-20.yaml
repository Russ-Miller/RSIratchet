      been proposed in the literature, making it a herculean task to select the most appropriate RAG
      techniques for specific problem scenarios. Thus, we propose a conceptual framework comprising
      main dimensions and sub-dimensions for characterising (defining "what it is") and analysing
      (defining "how well it does") existing RAG techniques. The conceptual framework was developed
      through a qualitative analysis of the attributes of RAG techniques reported in the literature.
