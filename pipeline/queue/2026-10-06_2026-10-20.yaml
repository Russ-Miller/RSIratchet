    abstract: "Multimodal large language model (MLLM)-based mobile agents are rapidly evolving from
      conversational assistants into autonomous systems that perceive, reason over, and act on
      smartphone environments. This capability also exposes a new security risk: adversaries can
      embed malicious objectives in cross-application mobile content and steer agent behavior
      through indirect multimodal injection. Although prompt injection has been studied in desktop
      and web settings, its cross-modal properties in mobile ecosystems remain poorly understood,
      and existing security analyses are still limited. To close this gap, we introduce
      MobileInject, the first benchmark for evaluating mobile agents against multimodal injection
      attacks and reasoning-to-action security risks. MobileInject provides a high-fidelity
      interactive mobile evaluation framework covering 11 scenarios, 9 security-risk categories, and
      108 executable risk instances. It further introduces Cross-Modal Consistency Injection to
      exploit corroboration across modalities, two enhanced attack methods, Multi-Role Collaborative
      Deception and Reasoning-Camouflage Injection, to intensify trust manipulation and reasoning
      hijacking, and a Reasoning Security Diagnosis Framework for fine-grained failure analysis.
