    abstract: "Large language model agents increasingly rely on skills to extend their capabilities in
      complex tasks. However, scalable skill use requires Selective Skill Exposure (SSE): providing
      relevant procedural content when needed while avoiding unnecessary exposure that may disrupt
      reasoning. Existing paradigms fall short in complementary ways. Progressive disclosure exposes
      metadata for a growing skill library, introducing context pollution; retrieval limits catalog
      exposure, but static retrieval from the initial task query may be misaligned with capability
      needs that emerge during reasoning and may still inject unnecessary skills. We propose
      SkillBrowser, a Meta-Skill-managed framework that enables an agent to identify current
      capability needs, formulate targeted queries, and selectively load skills on demand. Across
      six SRA-Bench subsets and five LLMs, SkillBrowser improves aggregate accuracy over static
