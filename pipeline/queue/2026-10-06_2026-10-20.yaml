      One approach to monitor such failures is to use an external LLM as a monitor, but this is
      prohibitively expensive. A well-known and efficient class of monitors can detect such failures
      from internal representations (such as activation probes), but are tied to the model they were
      trained on, requiring costly re-annotation as new LLMs appear. A natural way to avoid this
      repeated annotation cost is to develop internal-representation based monitors that transfer
