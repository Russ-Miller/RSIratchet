    abstract: As large language models (LLMs) generate increasingly fluent text, the need for reliable
      detection of LLM-generated content has grown substantially. However, existing research remains
      heavily English-centric, leaving Korean largely underexplored. Moreover, current evaluations
      of Korean text detection often rely on superficial cues, leading to overly optimistic
      estimates of detection performance. To address these limitations, we introduce
      \textsc{KoLing}, a bias-controlled adversarial benchmark comprising 50.9k instances that
      suppresses superficial shortcuts while preserving semantic content and separately evaluates
      LLM-generated and LLM-modified text detection. We further propose KoLingProbe, an
      interpretable detector grounded in theoretical linguistics that models Korean-specific
      properties across multiple linguistic levels. Experiments show that KoLingProbe substantially
      outperforms strong baselines on all detection tasks while remaining robust to adversarial
      attacks. Our analyses further reveal that integrating complementary linguistic features across
      multiple levels yields both improved performance and interpretability.
