    abstract: Large language model (LLM) agents increasingly rely on persistent memory to support
      long-term reasoning and personalized interactions. However, information collected from
      external sources can introduce security risks when untrusted claims (i.e., atomic statements)
      are later treated as authorized preferences, policies, or permissions. Existing defenses
      typically rely on content-based filtering or coarse-grained provenance tracking, which either
      fail to prevent unauthorized memory use or block legitimate information, sacrificing memory
      utility. To address these limitations, we propose SAFE-Mem, a fine-grained memory governance
      framework that improves security while preserving legitimate memory use. First, SAFE-Mem
      annotates each claim with three governance labels (i.e., kind, authority, and scope) to
      capture its provenance and permitted use. Second, governance-aware retrieval matches query
      requirements with claim permissions to block unauthorized influence while retaining legitimate
      information. Third, a governance-enabled memory graph connects source sentences, claims, and
      entities to support provenance tracking and efficient retrieval. Across four LLM backbones on
      MPBench and LoCoMo, SAFE-Mem attains the lowest attack success among defenses that retain
      legitimate memory, at least 77% below the strongest of them, and the highest answer accuracy
      of all evaluated defenses, improving it by up to 15%. The code is available at
      https://github.com/LVenum/SAFE-Mem.
