    abstract: Large Language Models (LLMs) have demonstrated remarkable success in complex reasoning
      through explicit Chain-of-Thought (CoT), but the associated computational overhead and token
      verbosity remain significant barriers to efficiency. While implicit reasoning in continuous
      latent spaces offers a promising alternative, existing methods like Coconut and CODI often
      rely on fixed-length latent sequences and suffer from representational collapse. In this
      paper, we propose Sep-Latent, an adaptive implicit reasoning framework that utilizes separator
      tokens as structural semantic anchors. By introducing an Attention-Decay mechanism, we force
      the model to aggregate and compress reasoning logic into these anchors during training. We
      then align explicit and implicit pathways through multi-level distillation across all layers
      to ensure logical consistency. Crucially, Sep-Latent enables dynamic reasoning depth by
      adaptively terminating the latent thinking phase based on query complexity. Experimental
      results on the GSM8k-Aug benchmark show that Sep-Latent achieves an accuracy of 56.8\% with an
      average of only 5.4 tokens, significantly outperforming prior fixed-length implicit models in
      efficiency while narrowing the performance gap with explicit CoT. Further analysis via PCA and
      symbolic variant testing confirms that our method ensures semantic grounding and exhibits
      superior robustness to perturbations.
