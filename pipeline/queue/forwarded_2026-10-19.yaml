    title: "ReasoningBank: Scaling Agent Self-Evolving with Reasoning Memory"
    date: 2025-09-29
    arxiv_id: "2509.25140"
    authors:
      - Siru Ouyang
      - Jun Yan
      - I-Hung Hsu
      - Yanfei Chen
      - Ke Jiang
      - Zifeng Wang
      - Rujun Han
      - Long T. Le
    venue: arXiv
    abstract: With the growing adoption of large language model agents in persistent real-world roles,
      they naturally encounter continuous streams of tasks. A key limitation, however, is their
      failure to learn from the accumulated interaction history, forcing them to discard valuable
      insights and repeat past errors. We propose ReasoningBank, a novel memory framework that
      distills generalizable reasoning strategies from an agent&#39;s self-judged successful and
      failed experiences. At test time, an agent retrieves relevant memories from ReasoningBank to
      inform its interaction and then integrates new learnings back, enabling it to become more
      capable over time. Building on this powerful experience learner, we further introduce
      memory-aware test-time scaling (MaTTS), which accelerates and diversifies this learning
      process by scaling up the agent&#39;s interaction experience. By allocating more compute to
      each task, the agent generates abundant, diverse experiences that provide rich contrastive
      signals for synthesizing higher-quality memory. The better memory in turn guides more
      effective scaling, establishing a powerful synergy between memory and test-time scaling.
      Across web browsing and software engineering benchmarks, ReasoningBank consistently
      outperforms existing memory mechanisms that store raw trajectories or only successful task
      routines, improving both effectiveness and efficiency; MaTTS further amplifies these gains.
      These findings establish memory-driven experience scaling as a new scaling dimension, enabling
      agents to self-evolve with emergent behaviors naturally arise. Our code can be found at this
      https URL .
