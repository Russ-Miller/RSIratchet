    venue: arXiv (Cornell University)
    topic: Explainable Artificial Intelligence (XAI)
    cited_by_count: 0
    abstract: "Multimodal (e.g. vision-language, in this work) attribution aims to interpret the models
      without access to ground-truth explanatory supervision. Existing multimodal attribution
      methods typically rely on paired modalities as proxy supervision, implicitly assuming that
      image-text pairs are semantically aligned. Information bottleneck (IB)-based attribution
      methods follow this general paradigm and instantiate it through a global
      sufficiency-compression objective. In realistic multimodal datasets, however, this assumption
      is frequently violated due to partial semantic misalignment and unreliable cross-modal
      correspondences. Through theoretical analysis, we show that, under such misalignment,
      information-bottleneck-based attribution objectives exhibit a structural limitation: by
      assuming equal reliability across all proxy supervision signals, they induce posterior
      over-contraction and forced explanations. To address this issue, we propose TIB, a sample-wise
      Tempered Information Bottleneck framework that adaptively modulates attribution strength
      according to cross-modal reliability, without assuming semantic alignment. Extensive
      experiments on controlled benchmarks and large-scale datasets show the effectiveness of the
      proposed approach, while also validating the identified failure mode."
