    title: Differentially Private Statistical Inference for Rankings from Pairwise Comparisons
    date: 2026-11-10
    arxiv_id: "2611.13485"
    doi: https://doi.org/10.48550/arxiv.2611.13485
    authors:
      - Xintao Xia
      - Jia Gu
    venue: arXiv (Cornell University)
    topic: Privacy-Preserving Technologies in Data
    cited_by_count: 0
    abstract: Reliable inference for rankings of large language models based on human pairwise
      comparisons must preserve the privacy of individual preference records. To meet this need, we
      develop methods for score and rank inference under the Bradley-Terry model with edge
      differential privacy. For an objective-perturbed estimator, a new leave-one-out analysis
      establishes finite-sample bounds on Euclidean and entrywise estimation errors. For
      sufficiently dense comparison graphs, the error bounds extend to smaller privacy budgets,
      including regimes in which its privacy term dominates its statistical term. A uniform
      asymptotic expansion yields asymptotically valid confidence intervals for individual scores
      and pairwise score differences. To improve finite-sample performance, we account for both
      regularization bias and privacy-induced randomness by combining a plug-in ridge-bias
      correction with Gaussian-Laplace calibration. We further establish a bootstrap procedure for
      simultaneous rank inference, providing asymptotically valid confidence sets for individual
      ranks and tests of top-$K$ membership. When the comparison probability is public and known,
      all proposed inferential procedures require no additional privacy budget. We evaluate
      finite-sample performance through simulations and apply the proposed methods to rank large
      language models for creative writing.
