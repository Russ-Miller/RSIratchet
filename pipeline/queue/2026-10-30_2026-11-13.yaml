    abstract: "Language models increasingly power data-intensive applications, from semantic data
      processing to question answering and agentic workflows. Using frontier models for every
      request is prohibitively expensive, while relying only on smaller models reduces accuracy. We
      study model routing under a user-specified cost budget, aiming to maximize accuracy under
      task-specific correctness criteria. Existing routers fall short in two ways: pretrained
      routers rely on generic preference signals that may not reflect a task's own correctness
      criteria or a new model pair, and model cascades run the weaker model first on every request,
      adding sequential latency. We present ARoute, a task-aligned router that learns cost and
      accuracy signals to select a model for each request before inference. ARoute has two variants:
      ARoute-Batch operates on a batch of requests known in advance, routing requests with the
      greatest expected benefit to the stronger model subject to the budget, whereas ARoute-Stream
      processes requests online, using a threshold calibrated on a small validation set to satisfy
