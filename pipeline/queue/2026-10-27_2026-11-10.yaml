    abstract: Leaderboards are a popular way to compare large language model (LLM) capabilities and can
      influence how model developers invest resources. We ask when competition on leaderboards leads
      developers to produce models with similar capability profiles, which we call monoculture, or
      similar performance levels. We study this by formulating leaderboard competition as a game in
      which model developers invest resources across capabilities to maximize their win rate. We
      show that similar production functions can induce similar capability profiles, while
      comparative advantage can sustain distinct capability profiles. We then study convergence in
      performance levels and show that diminishing returns can lead to an increasingly crowded
      competitive frontier. Using data from LM Arena and OpenRouter, we find that developers improve
      more in categories where they lag competitors, while still retaining category-specific
      advantages. At the same time, we find that the frontier of models becomes increasingly
      crowded, alongside increasingly diversified model usage patterns. Our results suggest that
      increasing competition does not need to produce interchangeable models, but can instead
      sustain competitive models with distinct strengths.
