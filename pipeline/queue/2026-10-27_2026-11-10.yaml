    abstract: "Vision-language-action (VLA) policies have become a promising paradigm for end-to-end
      robot control, but their effectiveness still depends heavily on large volumes of demonstration
      data. In manipulation tasks, this dependence is compounded by structured spatiotemporal
      uncertainty in the action space: multiple nearby actions or trajectories may successfully
      solve the same task, while semantically equivalent demonstrations often unfold at different
      speeds. Standard pointwise supervision treats each demonstrated action as an exact target,
      imposing an unnecessary learning burden under such uncertainty. We present SURE, a
