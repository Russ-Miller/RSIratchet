    abstract: LLMs excel at language tasks, but long-meeting QFS remains difficult due to complex
      speaker dynamics, sparse key information, and limited data. Meetings involve disfluencies,
      long transcripts and complex discourse. QFS have high risk of information omission,
      hallucination, even for advanced models such as GPT-4-mini and Gemini. Existing end-to-end
      methods compress retrieval, evidence extraction, and summary generation into a single pass,
      failing to handle the complex reasoning required for targeted meeting summaries. We propose
      ReSUM, a modular multi-LLM framework coordinated by a planner that orchestrates retrieval and
      summarization agents. By distilling teacher reasoning into query- and plan-conditioned
      retrievers and summarizers, ReSUM enhances long-context robustness, minimizes irrelevant
      exploration, and generates more faithful and comprehensive query-focused summaries.
      Experiments show consistent gains on query-focused meeting summarization benchmarks.
