    abstract: "Adolescents increasingly use social media for private conversations, sharing experiences
      and seeking support. These interactions generate digital traces, prompting efforts to infer
      mental health and psychosocial states. As large language models become more capable of
      reasoning about conversations and interpersonal dynamics, a fundamental question remains
      nonetheless: what can models actually \"know\" about an individual's psychological experience
      from what they are able to \"see\"? We evaluated ten reasoning LLMs using donated Instagram
      Direct Messages from 80 adolescents with a history of depression or suicidal thoughts and
      behaviors, comparing predictions with self-reports and analyzing 204 reasoning traces. Models
      performed better when inferring more observable states than participants' subjective
      appraisals of social experience, such as perceived social support. Beyond prediction accuracy,
      our findings highlight the epistemic limits of digital traces for AI design and evaluation:
      what can be observed, what can reasonably be inferred, and what requires people's own
      accounts."
