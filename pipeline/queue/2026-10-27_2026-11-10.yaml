    abstract: The timeline by which quantum computers can solve breakthrough problems in science depends
      on improved quantum algorithms as much as on better hardware. Such algorithmic advances are
      typically achieved through many years of expert human collaboration. In mathematics and
      computer science, large language models have accelerated progress through automated discovery
      loops. However, quantum algorithms can only be evaluated by classical computers on restricted
      or small instances. Here we demonstrate automated discovery of quantum programs beyond these
      regimes including order-of-magnitude improvements on scientific applications. To achieve this,
      we build a quantum program library in the Lean theorem prover in which large language model
      agents synthesize novel programs against formal problem specifications and verify their
      correctness and cost. Agent teams collaborate, sharing results and knowledge through wikis and
      discussing ideas at organized conferences. Our results improve on prior baselines for parallel
