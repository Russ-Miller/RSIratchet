    abstract: 'Hardware teams increasingly ask large language models (LLMs) to review register-transfer
      level (RTL) code, yet it is unclear whether a model can tell a correct module from a buggy one
      without simulating it. We introduce RTLReviewBench, a benchmark of 114 matched pairs of buggy
      and correct Verilog modules. Each pair shares one specification, most buggy modules are real
      failures of LLM code generators, and every label is confirmed by simulation. Evaluating 12
      commercial and open-weight models, we find a consistent asymmetry: reviewers rarely accept
      buggy code but often reject correct code, producing more than five false rejections for every
      missed bug. Synthetic mutants hide part of the problem: on the same designs, models miss far
      fewer injected bugs than real ones. Asking a model to reason before it commits to a verdict
      sharply reduces false rejections for weaker reviewers, and a controlled ablation shows that
      where the reasoning appears in the output matters more than the instruction to reason, whereas
      sampling and majority voting do not help. A blinded audit further shows that some correct
      "buggy" verdicts rest on false technical claims. We release the benchmark, a harder split for
      future models, all model responses, and the evaluation code at
      https://github.com/yasirmahmud/RTLReviewBench'
