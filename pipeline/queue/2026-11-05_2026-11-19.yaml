    abstract: "Multimodal large language models (MLLMs) have achieved impressive performance on a wide
      range of vision-language tasks. However, it remains unclear whether their predictions are
      grounded in the visual content itself or are largely driven by statistical co-occurrence
      patterns and commonsense correlations learned from large-scale image-text corpora. Existing
      vision-language benchmarks predominantly consist of samples that conform to human commonsense,
      allowing models to achieve strong performance by exploiting dataset priors rather than
      genuinely understanding image content. To address this limitation, we present ContraSense, a
      systematically constructed benchmark for evaluating faithful vision-language understanding.
      ContraSense consists of carefully curated counter-intuitive image-text pairs that deliberately
      violate common expectations, substantially reducing the effectiveness of statistical biases
      and requiring models to rely on visual evidence for reasoning. We conduct comprehensive
      evaluations on a diverse set of representative open- and closed-source MLLMs. The results
      reveal a substantial performance gap between current MLLMs and humans: even the strongest
      closed-source model achieves only about 60\\% accuracy, compared with 96.04\\% for human
      participants. These findings demonstrate that current MLLMs still struggle with faithful
      visual understanding and highlight the need for more robust multimodal reasoning grounded in
      image content. The ContraSense benchmark is public"
