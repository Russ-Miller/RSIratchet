      leads to overfitting and the catastrophic forgetting of the tails of the data distribution. To
      prevent this collapse, we introduce Ambient SFT, a principled framework for leveraging
      imperfect predictions to augment the fine-tuning set. In our method, a "frozen" version of the
      pre-trained model serves as a noisy teacher that the fine-tuned model must match at a coarse
      level. In particular, we require that the high-temperature versions of the conditional
      distributions produced by the post-training model should match the high-temperature versions
      of the pre-training ones. The temperature hyperparameter controls the level of trust in the
      pre-trained model, with the limit $T\to \infty$ reverting back to regular SFT and $T=1$ to
      knowledge distillation. We demonstrate that our approach outperforms standard SFT across
      domain adaptation, instruction-tuning, and reasoning, leading for up to $21\%$ average
