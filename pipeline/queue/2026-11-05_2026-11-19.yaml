    abstract: "Large language models (LLMs) are increasingly explored for power-system applications, yet
      their reliability in engineering analysis remains uncertain. We introduce PS-HalluBench, a
      manually constructed benchmark of 200 questions that evaluates hallucination-related failures
      across five power-system task categories: numerical reasoning, network topology, constraint
      verification, false-premise acceptance, and abstention. We evaluate ten LLMs over the
      benchmark, yielding 39.35\\% overall correctness, with constraint verification achieving only
      21.75\\%, and highlighting persistent difficulties in engineering reasoning. We further
      investigate engineering-grounded reasoning through numerical solver support and verified
      network information both of which show significant performance improvement. The findings
      reveal important limitations of standalone LLM reasoning and motivate integrating LLMs with
      verified engineering tools for reliable power-system analysis."
