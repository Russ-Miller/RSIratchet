      components and repeatedly apply search strategies that no longer yield any improvements. We
      introduce Inventa, a framework for automated scientific discovery that employs autonomous
      research units and verified shared knowledge. Each unit creates a lineage of candidate ideas
      using a mutator agent. A local orchestrator agent periodically adapts the mutator's harness.
