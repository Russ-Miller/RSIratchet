    abstract: Vision-language models (VLMs) can correctly interpret physics diagrams yet apply
      constraints outside the states or conditions in which they hold, causing premise errors to
      propagate through subsequent calculations. We introduce PhysScope, an inference-time visual
      harness that supports self-correction of these scope mismatches without updating model
      weights. PhysScope enables the model to link physical scopes directly to its visual
      observations and explicitly constructs derived views to support reasoning. The harness imposes
      explicit constraints on state distinctions, conditions, and physical scopes during model
      reasoning, and checks agent-proposed revisions against sources and scopes. Accepted revisions
      invalidate registered dependents, thereby maintaining scope-aware working memory. On
      PhysAlign, PhysScope achieves higher solving scores than direct solving across all six
      evaluated VLMs. With Gemini-3.8-flash, it outperforms Canvas-CoT by 9.34 percentage points and
      substantially improves solving accuracy on the out-of-distribution (OOD) PhysUniBench
      benchmark. Ablation studies support explicit scope management and dependency maintenance as
      design principles for multimodal physics reasoning agents.
