    abstract: We introduce Faithfulness Video Score (FVSCORE), a neuro-symbolic framework for
      specification-driven video generation evaluation. Existing evaluators rely on holistic MLLM
      judgments or vision-language metrics, yet aligning their scores with human judgments and
      tracing them to specific temporal violations remain open challenges. FVSCORE addresses these
      limitations by compiling each video into explicit propositions capturing prompt requirements
      and implicit propositions capturing unstated physical, temporal, and cross-modal constraints.
      It grounds each proposition using specialized perceptual tools and evaluates the resulting
      confidence traces with soft temporal operators inspired by Linear Temporal Logic. A
      Significance-Aware Calibration step then aligns verification with human perception by
      retaining only perceptually significant violations before producing a timestamp- and
      evidence-grounded report. We conduct extensive experiments across public and complex
      multi-event benchmarks with the strongest video models to date, demonstrating that FVSCORE
      outperforms holistic and agent-based evaluators in human correlation while providing highly
      accurate and interpretable feedback.
