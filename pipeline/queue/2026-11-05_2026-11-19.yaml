    abstract: Large language models (LLMs) have shown strong performance on medical question answering
      and diagnostic reasoning benchmarks. However, existing evaluations typically provide all
      patient information upfront and assess only the final diagnosis or rationale. This setup
      ignores the need to acquire diagnostic evidence incrementally from incomplete information in
      real-world diagnosis. To bridge this gap, we introduce DiagTrace, a source-grounded benchmark
      for evaluating whether LLMs can reconstruct the documented diagnostic trajectory through
      interactive information seeking. Each benchmark instance is built from a PubMed Central case
      report and includes an initial presentation, an event bank, a clinical course, and diagnostic
      references. DiagTrace contains 510 cases across eight specialties, with 225 used to evaluate
      four LLMs on clinical-course alignment, interaction quality, and efficiency. Results reveal
      trade-offs in coverage, source-consistent ordering, and turn use.
