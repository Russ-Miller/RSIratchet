      workers, retries, and publication. Over 81.53 hours, the factory published 14 datasets at an
      estimated recurring operating expenditure of about \$2.74 per publication. The accounting
      includes failed attempts, inference, workers, and hosting. Separate agents completed
      prediction experiments on all twelve evaluated releases. Source review nevertheless identified
      a task whose construction filters contradicted its population declaration. The original
      reviewer accepted later-record exclusions without reconciling them with the published
