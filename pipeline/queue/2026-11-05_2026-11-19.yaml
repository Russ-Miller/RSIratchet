      of their visual tokens. Most existing methods improve the ranking of the tokens and then
      answer every question once with the same budget. With strong rankings, pruning hurts only a
      few questions, and signals computed on the kept tokens see little of what it removed. We find
      that, on most of these questions, a small VLM given the full image disagrees with the pruned
      answer, since it still sees the missing evidence. We propose PRUDENT, which first answers with
      about half the budget and spends the saved tokens on re-answering the disagreeing questions at
      twice the budget. We show when such re-answering pays and why the small VLM should read the
      full image. On 18 benchmarks, PRUDENT outperforms eight existing pruning methods at the same
