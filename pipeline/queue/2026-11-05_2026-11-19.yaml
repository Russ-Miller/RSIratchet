      InternVL sizes. PRUDENT also has the highest average in two more model families. The
      disagreement of the small VLM flags most pruning failures of all eight methods, and
      re-answering on it also improves the two strongest with their own rankings. Other checkers
      give similar gains, and the extra tokens go where the first pass hurts the answer. These
