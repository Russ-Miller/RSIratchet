      adjacent emotions with highly overlapping multimodal cues. Existing approaches typically
      address these errors through global parameter adaptation, making confusion correction costly
      and inflexible. We instead observe that emotion confusion is highly localized and therefore
      better addressed through reusable pair-specific expertise. Building on this insight, we
