    abstract: "Knowledge editing aims to update outdated or incorrect knowledge in large language models
      without full retraining. Existing parameter-editing methods remain limited for long-sequence
      knowledge: single-point editors provide insufficient coverage for extended targets, while
      fixed chunk-based editors distribute editing effort uniformly across rigid predefined windows,
      failing to prioritize difficult, information-dense tokens. In this work, we show that token
      entropy is closely associated with both editing difficulty and semantic importance:
      high-entropy regions are harder to edit and often contain key factual content. Motivated by
      this observation, we propose DynEdit, a dynamic framework for long-sequence knowledge editing.
      DynEdit uses token-level entropy to guide non-uniform sliding, increasing the coverage of
      difficult high-entropy regions, and further applies entropy-guided token-level optimization to
