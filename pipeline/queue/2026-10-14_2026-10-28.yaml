      arise, we introduce a formal decomposition of the hint response and illustrate in controlled
      synthetic experiments how KL-regularized reward-based training reshapes both hinted and
      unhinted answer distributions. Finally, we evaluate whether this shift is calibrated to source
      reliability, finding that the log-odds shift persists even when the hint-giver is declared
      inaccurate or accompanied by explicit warnings not to trust the source, highlighting the
      vulnerability of LLMs to adversarial steering."
