      surrounding code, test hypotheses and weigh the evidence before forming their own judgement.
      This reasoning, however, spans many model calls, so that each verdict takes minutes of
      compute, far too long for real-time screening. Faster detectors, which fine-tune deep learning
      models or prompt an LLM for a direct verdict, are less accurate: they judge a function without
      the context an agent gathers, and an LLM's generated verdict is unreliable even when given
      some of it. We present REVA (REal-time Vulnerability Analysis), an AI vulnerability detector
