      ground truth is critical for reliable deployment in high-stakes settings. Existing approaches,
      such as entropy and perplexity, operate solely on final output statistics, discarding the rich
      information encoded in intermediate reasoning steps. To address this limitation, we propose
      STEP (Soft Trajectory Estimation of Prediction correctness), a training-free framework that
      scores each reasoning step via lightweight forward passes to obtain a soft probability
      distribution qi over candidate answers, from which we derive a set of soft trajectory features
      capturing per-step confidence and its progression toward the final answer. Extensive
      experiments on various benchmarks demonstrate consistent and substantial improvements,
