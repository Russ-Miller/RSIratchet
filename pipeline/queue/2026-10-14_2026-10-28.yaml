    abstract: "GEPA is among the strongest reflective prompt optimizers for language-model programs, but
      its system-aware merge operator is unstable across models: merge improves gpt-4.1-mini on
      average while degrading Qwen3-8B, an asymmetry noted but left unexplained by the GEPA paper.
      We investigate this instability across five datasets and two models. Our nine-configuration
      sweep over merge timing and merge operator shows that merge can improve both models when
      configured appropriately. This suggests that merge instability is better explained by
      configuration sensitivity than by an inherent flaw in the merge operator. We then test whether
      prompt-level features predict GEPA's merge-accept decisions and find that they do not, ruling
      out static-feature gating. As a proof of concept, a behavior-based probe built from these
      diagnostics avoids large merge failures in our multi-seed runs by abstaining on high-risk
      tasks, although it does not consistently outperform NoMerge. Code is available as
      GEPA-MergeProbe at https://github.com/ChongZZZZ/GEPA_MERGE ."
