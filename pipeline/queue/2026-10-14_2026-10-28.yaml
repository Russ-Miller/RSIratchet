    abstract: Unified large multimodal models (ULMMs) are able to perform visual reasoning through
      interleaved text-image generation, but generating explicit intermediate images incurs
      significant computational overhead. While visual latent reasoning addresses this, most
      existing methods rely on vision-language models (VLMs) incapable of visual generation. We
      propose Oddin, a novel framework enabling latent visual reasoning in ULMMs. Oddin replaces
      intermediate images with compact latent tokens processed entirely by the understanding branch,
