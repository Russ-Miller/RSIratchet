    abstract: "Dense retrievers provide grounded evidence that mitigates hallucinations in outputs from
      Large Language Models (LLMs). Real-world queries are often verbose, ambiguously framed, or
      require multi-step reasoning, introducing irrelevant details that weaken semantic matching for
      dense retrievers. Query rewriting is a widely adopted pre-retrieval technique that leverages
      LLMs to reformulate queries and bridge the semantic gap between such queries and the retrieval
      target. Existing rewriting approaches either rely on expensive proprietary models, substantial
      training data, or iterative retrieval and rewriting, while largely applying a uniform
      rewriting strategy regardless of the retrieval corpus. We observe that effective query
      rewriting instructions are not universal: the optimal strategy depends on the retrieval
      target, rather than the model alone. We introduce SkillQR, a query rewriting framework that
      automatically discovers reasoning strategy sets from the retrieval target and dynamically
      routes a query to the appropriate rewriting strategy at inference time. Without relying on
      training data, SkillQR achieves competitive performance compared to fine-tuned rewriting
      models on the BRIGHT and R2MED benchmarks, while also providing lower inference latency than
      iterative rewriting approaches."
