      understood. In this work, we investigate this behavior through hint-induced answer shifts on
      MMLU questions, evaluating prompts of the form ``[Source] thinks the answer is (X)''. We
      systematically vary the source to which the hint is attributed (a professor, a friend, or a
      dog) across three open-source model families, Qwen, Gemma, and SmolLM. We show that the change
      induced by the hint follows a predictable structure well-characterized by an exponential tilt:
      the hint induces an approximately constant mean shift in the hinted answer's log-odds, with
