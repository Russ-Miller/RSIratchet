    abstract: Large language model (LLM)-based multi-agent systems (MAS) rely on role-specific prompts
      and execution models to solve complex tasks collaboratively. However, prompt optimization
      typically keeps model assignments fixed, leaving differences in role requirements and their
      associated inference costs outside the search. We present UniMASO, a Unified framework for
      heterogeneous Multi-Agent System Optimization through the joint adaptation of prompts and
      model assignments. UniMASO evaluates candidate updates through local, downstream, and global
      feedback, using cost-aware Pareto search to retain useful quality-cost trade-offs.
      Topology-aware co-evolution then coordinates these updates according to agent roles and
      dependencies. Cross-level trajectory memory further supplies historical successes and failures
      to guide subsequent optimization. Experiments on five benchmarks and five execution topologies
      show that UniMASO achieves competitive task performance at substantially lower deployment cost
      than the strongest homogeneous configurations. Under centralized execution, it improves the
      average score from 69.79 to 70.40 while reducing token-weighted deployment cost by 85.2%
      relative to DeepSeek-V4-Pro with MASPO. These results support joint prompt-model adaptation as
      an effective approach to efficient multi-agent collaboration. The code is available at
