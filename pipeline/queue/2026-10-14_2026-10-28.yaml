      present SlowLab, a benchmark in which an agent runs a one-year campaign in four simulated
      greenhouse compartments on a site whose crop, facility and prices are hidden. The agent
      decides when to plant which climate policy, whether to stop a crop and which measurements to
      read while crops grow, and at the end recommends one policy, which a private evaluator scores
      in weather the agent never saw. In a preregistered study on 48 unseen sites, three low-cost
      language-model agents ended near a standard grower setting and clearly below a
      Bayesian-optimisation baseline that starts from that setting. They ran the facility as two
