    abstract: News outlets covering the same event differ in what they emphasize and omit. \textit{Same
      Story, Different Lens} is an experimental research prototype for comparing these choices. It
      collects world and politics coverage from 17 outlets, groups reports about the same event, and
      produces structured analyses of sentiment, political lean, framing, loaded language, possible
      omissions, and model-estimated proportions of factual claims and opinion. Loaded-language
      entries include quotations and neutral rewordings. Three model roles (agents) handle article
      analysis, assessment of source support, and cross-outlet briefing generation. Analyses are
      stored in a JSONL archive. The evaluation compares outlet-level lean estimates with
      approximate, predefined reference ratings and summarizes the Critic's model-assigned grounding
      scores. These measures provide preliminary diagnostics. A grounding score reflects the model's
      assessment of support in the supplied text and does not establish factual accuracy or
      constitute independent verification.
