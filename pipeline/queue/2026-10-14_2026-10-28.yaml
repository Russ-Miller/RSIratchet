    abstract: Advances in Multimodal Large Language Models (MLLMs) have driven substantial progress in
      multimodal embeddings. Recent methods exploit generative capabilities by augmenting embedded
      inputs with self-generated reasoning to produce more informative embeddings. However,
      conventional retrieval supervision for training embedding models specifies pairwise relevance
      relations without explicitly guiding the reasoning used for input augmentation. Such reasoning
      is neither directly observed nor uniquely determined by the input, allowing multiple plausible
      traces to introduce semantic cues of varying retrieval utility. Existing approaches largely
      optimize reasoning conditioned on the input alone, limiting the exploration of
      retrieval-relevant traces. We introduce PILOT, a framework that models reasoning as a latent
      variable and instantiates its prior and posterior distributions as distinct reasoning modes of
      a shared MLLM. The prior conditions only on the input, whereas the posterior uses additional
      training-time relational evidence to guide reasoning exploration. To translate the posterior's
