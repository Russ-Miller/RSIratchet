      models often fail to use interactive collaboration to improve over the non-interactive
      baseline in which one agent summarizes its information and the other agent immediately acts,
      despite substantial headroom. This suggests that state-of-the-art models still suffer from
      significant weaknesses in planning and executing multi-turn collaborative conversations. We
      analyze the linguistic features of these dialogues, assessing the roles of sycophancy,
      information density, and discourse coherence. While there is no single linguistic explanation
