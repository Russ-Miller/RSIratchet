      patterns, we reveal two key findings: 1) truthfulness and visual perception capabilities
      predominantly engage different subsets of attention heads within the model architecture; and
      2) truthfulness steering vectors vary significantly across different semantic contexts. Based
      on these observations, we propose Dynamic Multimodal Activation Steering, a training-free
