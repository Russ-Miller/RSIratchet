    abstract: Recently, multimodal large language models (MLLMs) have demonstrated strong potential in
      visual understanding and complex reasoning tasks. However, existing methods often struggle to
      efficiently transform visual cues from multimodal inputs and the semantics of the question
      into effective reasoning conditions, thereby limiting the reasoning performance of multimodal
      large language models. To address this challenge, we propose MMDynOpt-Agent, which models the
      dynamic optimization of multimodal reasoning as a Markov decision process via end-to-end
      reinforcement learning. Specifically, a lightweight multimodal agent serves as the decision
      policy and interacts with the target MLLM as the environment, adaptively steering its
      reasoning through multi-turn dynamic optimization prompts. Furthermore, to reduce the cost of
      multimodal reasoning, a reward mechanism that combines format compliance, answer correctness,
      and budget awareness is designed to jointly ensure reasoning accuracy and efficiency.
      MMDynOpt-Agent is transferable and generalizable, enabling training with one target MLLM and
      inference-time transfer to others. Experimental results on fifteen public datasets show
      MMDynOpt-Agent achieves strong performance and outperforms baselines. Our project is available
      at https://github.com/QwenQKing/MMDynOpt-Agent.
