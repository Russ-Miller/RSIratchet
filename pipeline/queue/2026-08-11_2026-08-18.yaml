    abstract: Large Audio-Language Models (LALMs) have recently shown strong capabilities in speech
      understanding and question answering (QA), but they also inherit privacy risks from
      large-scale training data, including the unintended memorization of sensitive information. In
      this work, we study machine unlearning for speech QA in LALMs, a setting that is more
      challenging than prior work on text-based Large Language Models (LLMs) or Automatic Speech
      Recognition (ASR) due to the tight coupling between acoustic perception and factual knowledge.
      We present and evaluate multiple unlearning strategies, including gradient ascent, task
      arithmetic, and alignment-based fine-tuning methods that enforce safe refusal responses, to
      remove private knowledge while still preserving performance on core capabilities. Through
      extensive experiments on speech QA datasets, we show that these unlearning methods can reduce
      the privacy leakage rate by up to 80% while maintaining near-neutral performance on
      non-private speech QA and general speech understanding benchmarks.
