    abstract: While Large Language Model (LLM) agents increasingly rely on long-term memory for
      persistent interactions, the retrieval mechanisms governing this memory are rarely treated as
      evolvable components. This static approach limits performance on heterogeneous memory queries,
      which often demand diverse evidence construction strategies. To address this, we introduce
      \textbf{ERSkill}, a retrieval-centric framework for self-evolving, skill-guided memory access.
      ERSkill compiles interaction histories into a structured memory store and represents retrieval
      behaviors as executable skills composed of fundamental primitives. At inference time, a
      trained router dynamically matches each query to the optimal skill to construct tailored
      evidence for answer generation. To enable continuous improvement, ERSkill co-evolves the skill
