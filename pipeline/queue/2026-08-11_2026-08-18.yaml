    abstract: "Recent advances in Multimodal Large Language Models (MLLMs) have led to substantial
      progress in video understanding, accompanied by a growing number of long video benchmarks.
      However, existing benchmarks rely predominantly on web-sourced videos that lack inter-clip
      spatiotemporal continuity, making it difficult to assess whether models can maintain
      consistent memory across days or weeks of real-world experience. We introduce EgoMonth, the
      first month-level egocentric video understanding benchmark. EgoMonth comprises over 300 hours
      of first-person daily-life recordings from 20 participants spanning 20 to 120 days, paired
      with 1,443 human-crafted multiple-choice question-answer pairs. We design a cognitively
      grounded 14-task evaluation framework organized into three hierarchical cognitive levels:
      Schema Consolidation, Episodic Indexing, and Cascading Reasoning. Evaluation of
      state-of-the-art open-source and closed-source MLLMs reveals that even the best-performing
      model, Gemini 2.5 Pro, achieves only 71.8% macro-average accuracy, remaining 22.4 percentage
