    abstract: "Static load balancers cannot mitigate a backend that is degraded rather than down:
      round-robin and least-connections keep routing traffic to a server returning HTTP 500s until
      an operator intervenes. We ask whether a Large Language Model can replace the static routing
      policy itself, reading HAProxy and Prometheus telemetry every 10 seconds and isolating faulty
      servers through guardrailed calls to the HAProxy Data Plane API. On a reproducible benchmark
      with a persistent structural fault built into roughly one-third of a heterogeneous fleet, we
      sweep 15 open-weight models across five families (0.35B to 35B total parameters; dense,
      mixture-of-experts, and efficient-sparse architectures), reasoning modes, fleet scales of 3 to
      9 backends, and two routing algorithms, totaling 240 runs. We find a capability threshold near
      3B active parameters. Below it, LLM policies are typically unreliable and sometimes worse than
      no policy; above it, every model, regardless of architecture, saturates near an 88% reduction
      in client-perceived 5xx errors over the static baseline. The threshold is approximate: Gemma 4
      E2B clears it with 2B active parameters, while the dense 3B Granite 4.0 Micro does not. The
