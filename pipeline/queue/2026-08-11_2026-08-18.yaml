      reasoning performance, due to both excessive irrelevant context and the lack of explicit
      relational structure. In this paper, we propose an LLM-based Structured Context Reasoning
      (SCoRe) framework that infers both explicit and implicit relationships for prediction. SCoRe
      consists of three stages: Context Acquisition, which generates diverse visual notes and
      retrieves explicit knowledge via an efficient two-stage multimodal retrieval strategy; Context
      Selection, which filters relevant visual, explicit, and implicit knowledge using LLM-guided
      selection; and Context Compression, which performs Relational Logic Distillation (RLD) to
      transform raw text into explicit entity-relation triplets. These relational triplets serve as
      a concise and structured prompt for final answer prediction. Extensive experiments on the
      OK-VQA and A-OKVQA benchmarks demonstrate that SCoRe consistently outperforms state-of-the-art
      methods."
