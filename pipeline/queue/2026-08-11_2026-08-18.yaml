    abstract: "Multimodal Large Language Model (MLLM)-based UAV aerial image understanding and reasoning
      is essential for aerial intelligence yet poses distinct challenges arising from extreme scale
      variation, arbitrary camera orientations, and high object density. Despite growing interest,
      existing evaluations remain fragmented across individual datasets and narrow tasks, leaving a
      critical gap in unified assessment of UAV understanding and reasoning capabilities. To fill
      this gap, we construct UAVQA-Bench, a benchmark of 1,500 human-annotated QA pairs drawn from
      13 public UAV datasets, covering 6 capability dimensions and 16 tasks in both multiple-choice
      and visual grounding formats. Systematic evaluation of a broad range of open-source and
      closed-source MLLMs as well as agent-based systems on UAVQA-Bench identifies three key failure
      modes: domain-toolset mismatch, unchecked error propagation, and static reasoning. Motivated
      by these findings, we propose UAV-MAS, a training-free multi-agent system for MLLM-based UAV
      aerial image understanding and reasoning, comprising a Domain-Specific Perception Engine
      (DSPE) that routes queries to task-appropriate visual tools, a Context-Aware Iterative
      Refinement module (CAIR) that validates intermediate reasoning to curb error accumulation, and
      a Difficulty-Aware Adaptive Search mechanism (DAAS) that adjusts search depth to question
