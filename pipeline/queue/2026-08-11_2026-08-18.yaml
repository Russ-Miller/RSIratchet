      proposed_id: confidence-calibration
      proposed_label: Matching expressed confidence to actual accuracy
      scope_note: Covers whether verbalized or token-level confidence tracks correctness (calibration
        error, selective risk); excludes outright refusal/abstention behavior and plain accuracy.
      rationale: The paper targets the systematic gap between medical MLLMs' expressed certainty and their
        diagnostic accuracy.
