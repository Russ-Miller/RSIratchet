    abstract: "Large Language Models (LLMs) are typically evaluated on standard written Vietnamese, yet
      everyday communication frequently involves regional dialects that preserve meaning but differ
      in surface form. Existing Vietnamese dialect work largely addresses this issue through
      dialect-to-standard normalization instead of measuring how the model fails under Vietnamese
      dialectal inputs. To address this gap, we present the first systematic evaluation of LLM
      robustness to Vietnamese dialect variation across multiple tasks, quantifying performance
      degradation and failure patterns. We introduce VialectBench (Vietnamese Dialects
      Benchmarking), a controlled benchmark for testing whether model decisions remain stable across
      six Vietnamese dialect groups. VialectBench contains 400 Standard Vietnamese source instances
