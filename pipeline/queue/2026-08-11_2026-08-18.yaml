      evaluation for unified multimodal models (UMMs). In this work, we propose
      Self-Generative-Understanding (SGU), a novel, annotation-free evaluation framework that probes
      the integrated capabilities of unified models through a semantic closed-loop challenge.
      Without requiring new annotations, SGU leverages the dual understanding-and-generation
      abilities of UMMs by asking them to first perceive an image and produce a textual description,
      subsequently reconstruct a visual context based on that description, and finally perform
      reasoning over the self-generated output. This pipeline provides a zero-cost testbed that
      yields an integrated performance score specifically tailored for evaluating UMMs as unified
      systems. Extensive experiments show that even high-performing UMMs often struggle to reason
      over their own generated contexts, revealing limitations that are not captured by separate
      evaluations of understanding or generation alone. Our work provides a complementary holistic
      evaluation framework and offers a foundation for benchmarking the development of
      next-generation unified multimodal models.
