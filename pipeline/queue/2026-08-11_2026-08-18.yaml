      to strategic drift, where localized decisions fail to sustain a coherent trajectory across
      reasoning. To address this, we introduce EpicStar, a framework that enables agents to learn
      memory as policy to tackle long-horizon reasoning. Specifically, the agent maintains a bank of
      successful past episodes as a heuristic alongside a working memory to track short-term
      environmental changes. During inference, a dynamic gating mechanism determines whether to
