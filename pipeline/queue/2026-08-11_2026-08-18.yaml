    abstract: While binary quantization theoretically promises extreme compression and acceleration for
      Large Language Models (LLMs), existing research often overlooks the necessity of specialized
      hardware kernels, thus failing to unleash the full acceleration potential due to persistent
      reliance on expensive floating-point arithmetic or runtime dequantization overheads. To bridge
      this gap, we propose FluxBin (\textbf{F}lexible \textbf{L}UT-based \textbf{U}ltra-low-bit
      e\textbf{X}ecution with \textbf{Bin}ary bases), an algorithm-kernel co-design that synergizes
      post-training quantization with a highly optimized CUDA kernel. Algorithmically, we introduce
      Decoupled Row-Column Binary Decomposition to enhance representational capacity while
      maintaining hardware efficiency, complemented by a Hessian-guided saliency-aware hybrid bases
      that preserve critical information. At the kernel level, we implement a Lookup Table Building
      Approach with Scale Fusion to reduce floating-point arithmetic, featuring a Virtual Columnar
      Mapping that transforms irregular, sparse, and salient matrices into dense execution.
