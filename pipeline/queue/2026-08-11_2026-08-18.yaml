    abstract: Recent advances in Large Language Models (LLMs) have demonstrated strong capabilities in
      generating semantically relevant concepts and relations, making them promising tools for
      taxonomy enrichment. However, directly relying on LLM-generated expansions often leads to
      noisy, redundant, or hierarchically inconsistent structures, limiting their reliability for
      automated taxonomy expansion. In this paper, we present ReLTEx, a framework for reliable
      LLM-based taxonomy expansion. ReLTEx combines LLM-driven candidate generation with
      structure-aware validation and recursive expansion control to improve the consistency and
      quality of generated taxonomies by reducing hallucinations. We evaluate the proposed framework
      using benchmark taxonomies under a masked taxonomy expansion setting and compare multiple
      validation strategies. Experimental results, supported by both adapted evaluation metrics and
      human evaluation, demonstrate that ReLTEx produces more reliable and semantically coherent
