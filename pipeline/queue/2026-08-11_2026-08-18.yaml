    abstract: Object Hallucination in large vision-language models (LVLMs), where models generate
      non-factual content about input images, remains a critical barrier to their reliability in
      real-world applications. Existing mitigation strategies can be categorized into training-based
      and training-free methods. Training-based methods often achieve strong performance but are
      costly, requiring extensive computational resources, large-scale data, and time-consuming
      fine-tuning. Training-free approaches are particularly appealing due to their efficiency.
      However, existing training-free methods either require multiple decoding rounds, which adds
      computational overhead, or modify internal states in a model-specific way that risks degrading
      pretrained knowledge. We propose Test-Time Hallucination Mitigation (TTH) method, a novel
      training-free method that addresses both limitations. TTH introduces a token-validator module,
      implemented as a zero-shot Multi-Modal Classifier (MMC), to generate auxiliary logits grounded
      in the input image. These logits are fused with the original LVLM outputs at the token level
      for object tokens selected from a candidate pool. An entropy-based weighting scheme is then
      applied to enable robust and accurate predictions. Extensive experiments across multiple LVLM
      families and diverse benchmarks demonstrate that TTH consistently improves accuracy and
      robustness, underscoring its generalizability and practical effectiveness. Code is released at
      https://github.com/Mehran-TAM/
