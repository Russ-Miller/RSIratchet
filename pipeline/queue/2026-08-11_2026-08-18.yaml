    abstract: Many areas of AI research, such as language model interpretability and chain of thought
      faithfulness, seek to explain model behaviors. But what constitutes a "good" explanation? In
      this work, we evaluate explanations through the lens of counterfactual simulatability-whether
      the explanation is useful for predicting model behaviors on related counterfactual inputs. To
      this end, we introduce CHIVE (Counterfactual Hypothesis Investigation Via Edits), a novel
      agentic pipeline that identifies unexpected model behaviors in the wild and investigates them
      with counterfactual prompt edits. This yields thousands of high-quality explanations for
      naturally-occurring model behaviors along with supporting counterfactual evidence. We apply
      CHIVE in two ways. First, we evaluate whether common LLM interpretability techniques improve
      an agent's ability to predict counterfactual model behaviors. Surprisingly, we find no uplift
