    abstract: 'Do Large Language Models (LLMs) possess genuine structural reasoning, or merely rely on
      surface-level pattern matching? The financial domain, demanding numerical precision and
      multi-step logic over long contexts, is an ideal testbed. Existing benchmarks fail to capture
      real-world industrial complexity, predominantly relying on multiple-choice questions or
      single-hop QA over cropped tables while ignoring intricate cross-statement dynamics and
