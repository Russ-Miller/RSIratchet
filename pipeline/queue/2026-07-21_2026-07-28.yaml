      internal decision-making process. While existing work focuses on evaluating faithfulness or
      using inference-time prompting frameworks to improve an LLM's self-explanation's tractability,
      these approaches do not provide a mechanism to directly optimize a model's parameters to
      generate faithful self-explanations. We bridge this gap by modifying existing faithfulness
      metrics into an RL training objective. We investigate (1) if models can be trained to
      accurately detect factors that affect their decisions, and (2) whether RL can directly
