      faces performance degradation due to outlier channels, which are highly sensitive to
      quantization and substantially impair activation fidelity and task accuracy. To protect these
      salient channels during quantization, existing PTQ methods leverage modality- or token-level
      metrics to guide channel-wise scaling (CWS) of LLM decoders. However, these orthogonal
      measurements fail to capture channel-wise impacts on task-specific loss, and the misalignment
      between importance and scaling factors ultimately leads to suboptimal performance. To address
      this issue, we propose C-PTQ, a unified channel-wise PTQ method that harmonizes task-specific
      loss perturbation and quantization error. Motivated by second-order derivatives, we design a
      Fisher-weighted objective as a tractable Hessian approximation, seamlessly injecting task
