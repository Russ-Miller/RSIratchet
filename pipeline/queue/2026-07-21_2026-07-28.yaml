    abstract: Multimodal Large Language Models have made great progress in grounding tasks, yet existing
      methods still struggle to unify precise localization and complex reasoning. For one thing,
      text-based methods rely on coordinates or index prediction, severely limiting the perceptual
      capabilities of the model for dense visual objects. Meanwhile, latent token-based methods
      employ special tokens without inherent spatial references and use a decoding mechanism that
      lacks thinking steps, weakening high-level reasoning capabilities. Consequently, developing a
      unified framework that excels in both perception and reasoning remains challenging. To address
      this, we propose Mixture-of-Thought-Tokens (Motto), a new free-form multimodal grounding
      method that bridges the perception-reasoning gap, enabling MLLMs to empower diverse, arbitrary
      grounding queries. Specifically, we introduce Spatially-Grounded Thought Tokenization to
      explicitly align special tokens with spatial locations for clear spatial correspondence and
      visual interpretability. We further design a Context-Adaptive Chain-of-Tokens that dynamically
