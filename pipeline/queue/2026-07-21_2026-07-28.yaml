    abstract: "Despite remarkable progress in visual understanding, Multimodal Large Language Models
      (MLLMs) remain prone to hallucinations when reasoning about spatial relationships, often
      producing judgments that contradict the true 3D structure of the scene. Though several
      existing works have proposed to mitigate hallucinations, our analysis indicates that they show
      limited effectiveness in spatial reasoning, as they fail to bridge the fundamental gap between
      2D visual representations and 3D spatial reality. Based on this finding, we define
      hallucinations arising from insufficient spatial structure modeling as spatial reasoning
      hallucination, a subcategory of relation hallucination that existing mitigation methods fail
      to address. We further identify three typical scenarios where such hallucinations frequently
