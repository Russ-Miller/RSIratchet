    abstract: "Data-driven fine-tuning is widely adopted to enhance reasoning in Large Language Models
      (LLMs) due to its simplicity and efficiency. However, mainstream imitation learning methods
      that rely exclusively on perfect reasoning trajectories suffer from a Scaling Collapse: when
      the problem set is limited, increasing positive examples fails to yield continuous
      improvement. However, during inference, an LLM can not guarantee that every intermediate step
      is correct and is therefore prone to errors. Once such errors arise, the LLM often struggles
      to recover and may be further misled by the accumulation of previous mistakes. To address
      this, we propose Reflective Recovery, a simple yet effective self-supervised approach that
      transforms failed reasoning attempts into recovery training data. Specifically, we extract
      initial segments of failed trajectories, concatenate them with prompts, and use them to guide
      the LLM toward valid solutions. Because these segments from failed trajectories are likely to
      contain errors, this process teaches models to recognize and correct mistakes during
      reasoning, enabling recovery from erroneous states without relying on external critics or
