    abstract: Existing adaptive inference methods for Large Language Models rely on observational
      heuristics, such as hidden-state similarity or activation magnitudes, to drop redundant
      modules. However, these correlation-based metrics often fail to capture subtle, non-linear
      structural computations vital for semantic accuracy. We introduce CausalGate, an
      intervention-guided framework for compute-efficient transformer inference. During a
      calibration phase, CausalGate isolates individual Attention and MLP sub-layers, zeros out
      their respective outputs, and measures the exact semantic damage via the Kullback-Leibler
      divergence of the final logit distribution. To eliminate runtime routing overhead, this
      structural importance hierarchy is distilled into a global set of static, lightweight scalar
      gates using an Exponential Moving Average smoothing objective paired with a differentiable
