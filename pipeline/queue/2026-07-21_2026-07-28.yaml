      with failures in reasoning or domain knowledge, while application-driven benchmarks only cover
      narrow, fragmented domains shaped by heuristic designs. To address these limitations,
      PerceptionBench adopts a bottom-up approach: by diagnosing the earliest failure points in the
      responses of frontier MLLMs across 42 existing benchmarks, we construct an error taxonomy
