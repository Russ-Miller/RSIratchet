      across tasks of varying complexity. In addition, we construct PR-Bench, a new referring
      expression comprehension benchmark to evaluate the perception-reasoning gap. Extensive
      experiments demonstrate that Motto achieves state-of-the-art performance across diverse
      free-form grounding tasks.
