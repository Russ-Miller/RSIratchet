      temporal properties, tonal attributes, style, and emotion. We introduce MuseDiag, a
      multi-paradigm diagnostic framework with contradiction-based verification, and evaluate nine
      models (four open-source and five closed-source). We find that (1) vocal misperception is a
      universal weakness across all nine models, tonal perception is a major axis of architectural
      differentiation, and Audio-Flamingo-3 remains the stable leader while substantial reordering
      below it reveals paradigm-specific vulnerability profiles; (2) affirmative bias,
      generation-mode effects, and layer-specific perceptual limitations are each empirically
      associated with the observed patterns, with convergent evidence from multiple analyses rather
      than strict causal attribution; and (3) our two training-free mitigation methods,
      Audio-Dependency-Aware Decoding for Music (ADD-M) and Taxonomy-Guided Perceptual Anchoring
