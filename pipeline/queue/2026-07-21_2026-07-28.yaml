    abstract: "Multimodal large language models (MLLMs) hold immense potential to revolutionize clinical
      practice, yet deploying them in the medical domain is fundamentally a vision-centric
      challenge: models must absorb knowledge from heterogeneous 2D and 3D medical images, and
      evaluation protocols must align with radiologists' clinical practice and provide an accurate,
      fine-grained and factualness-driven assessment. In this paper, we introduce ClinFusion, a
      vision-centric MLLM designed for holistic medical understanding that systematically addresses
      these limitations. We propose a compositional and cascaded vision encoder architecture
      featuring a Cascade Spatial-Aware Locality Fusion operator that unifies diverse 2D and native
      3D medical image understanding within a fused encoder. We further introduce a vision-grounded
      evaluation framework, including MedIF-Bench for instruction-following assessment and a
      region-of-interest-grounded method for clinically aligned and factualness-driven report
      generation evaluation. We show that ClinFusion sets a new state-of-the-art across a
      comprehensive suite of 2D and 3D multimodal medical benchmarks---spanning visual question
      answering, report generation, and instruction following---as well as textual medical tasks,
      outperforming leading open-source medical MLLMs (\\textit{e.g.}, Hulu-Med, Lingshu) on 20 out
