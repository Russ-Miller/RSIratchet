      further study the effect of incorporating information from traditional face recognition
      systems, viz., scores and decisions, alongside the input images. Although such information
      improves categorical verification performance, it does not consistently lead to faithful
      explanations. To evaluate the explanations beyond decision accuracy, we introduce a
      likelihood-ratio-based framework that measures the evidential strength of textual
      explanations. Our findings highlight fundamental limitations of current MLLMs for explainable
      face recognition and underscore the need for a principled evaluation of reliable and
      trustworthy explanations in biometric applications. Code is available at
      https://github.com/redwankarimsony/LR-MLLMFR-Explainability.
