    abstract: Pointing-based methods decompose complex tasks as sequential grounding and reasoning
      steps. Given a query, the model first grounds the relevant objects by generating their
      coordinates, and then predicts an answer conditioned on these points. While this approach has
      been shown to increase the performance of Large Vision-Language Models (LVLMs), it remains
      unclear why and how it improves the models' visual reasoning. In this work, we evaluate
      pointing-based methods in the task of zero-shot counting in visual scenes. We experiment with
      multiple fine-tuning and training-free approaches on state-of-the-art LVLMs, and compare them
      with Point-then-Count (PtC), where models first generate point coordinates for the target
      objects and then predict their count. Our results show that PtC achieves the highest accuracy
