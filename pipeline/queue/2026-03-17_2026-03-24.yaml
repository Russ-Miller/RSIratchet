      Fine-grained question answering over multi-modal driving observations provides a natural way
      to evaluate this capability, yet existing perception pipelines and driving-oriented large
      language model (LLM) methods still suffer from unreliable scene facts, hallucinations, opaque
      reasoning, and heavy reliance on task-specific training. We present KLDrive, the first
      knowledge-graph-augmented LLM reasoning framework for fine-grained question answering in
      autonomous driving. KLDrive addresses this problem through designing two tightly coupled
      components: an energy-based scene fact construction module that consolidates multi-source
      evidence into a reliable scene knowledge graph, and an LLM agent that performs fact-grounded
      reasoning over a constrained action space under explicit structural constraints. By combining
      structured prompting with few-shot in-context exemplars, the framework adapts to diverse
      reasoning tasks without heavy task-specific fine-tuning. Experiments on two large-scale
