    abstract: Recent advances in Large Language Models (LLMs) have enabled conversational AI agents to
      engage in extended multi-turn interactions spanning weeks or months. However, existing memory
      systems struggle to reason over temporally grounded facts and preferences that evolve across
      months of interaction and lack effective retrieval strategies for multi-hop, time-sensitive
      queries over long dialogue histories. We introduce Chronos, a novel temporal-aware memory
      framework that decomposes raw dialogue into subject-verb-object event tuples with resolved
      datetime ranges and entity aliases, indexing them in a structured event calendar alongside a
      turn calendar that preserves full conversational context. At query time, Chronos applies
      dynamic prompting to generate tailored retrieval guidance for each question, directing the
