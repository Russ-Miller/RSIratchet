      models. As the starting point for RLVR, the capacity of supervised fine-tuning (SFT) to
      memorize new chain-of-thought trajectories provides a crucial initialization that shapes the
      subsequent exploration landscape. However, existing research primarily focuses on facilitating
      exploration during RLVR training, leaving exploration-aware SFT under-explored. To bridge this
      gap, we propose Offline eXploration-Aware (OXA) fine-tuning. Specifically, OXA optimizes two
