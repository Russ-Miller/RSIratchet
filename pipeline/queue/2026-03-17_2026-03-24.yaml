      on approximation algorithms with provable performance guarantees for general cases. While
      designing such algorithms is challenging, formally proving their approximation optimality is
      even more demanding, which requires domain-specific geometric insights and multi-step
      mathematical reasoning over complex operational constraints. Recent Large Language Models
      (LLMs) have demonstrated strong performance on mathematical reasoning benchmarks, yet their
      ability to assist with research-level optimality proofs in robotic path planning remains
      under-explored. In this work, we introduce the first benchmark for evaluating LLMs on
