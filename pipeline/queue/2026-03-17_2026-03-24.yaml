      improving the accuracy of large language model (LLM) outputs. However, existing approaches
      face a trade-off between inference efficiency and accuracy: iterative
      verification-rectification is computationally expensive and prone to being trapped in faulty
      reasoning, while best-of-N selection requires extensive sampling without addressing internal
      model flaws. We propose a training-free regeneration paradigm that leverages an
      offline-curated contrastive Reflection Memory (RM) to provide corrective guidance, while
      regenerating from scratch helps break out of faulty reasoning. At inference time, the method
