    abstract: "Multi-agent collaboration has emerged as a powerful paradigm for enhancing the reasoning
      capabilities of large language models, yet it suffers from interaction-level ambiguity that
      blurs generation, critique, and revision, making credit assignment across agents difficult.
      Moreover, policy optimization in this setting is vulnerable to heavy-tailed and noisy rewards,
      which can bias advantage estimation and trigger unstable or even divergent training. To
      address both issues, we propose a robust multi-agent reinforcement learning framework for
      collaborative reasoning, consisting of two components: Dual-Agent Answer-Critique-Rewrite
      (DACR) and an Adaptive Robust Estimator (ARE). DACR decomposes reasoning into a structured
