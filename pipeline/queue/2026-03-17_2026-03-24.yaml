      estimation of batch experience means during multi-agent policy optimization. Across
      mathematical reasoning and embodied intelligence benchmarks, even under noisy rewards, our
      method consistently outperforms the baseline in both homogeneous and heterogeneous settings.
      These results indicate stronger robustness to reward noise and more stable training dynamics,
      effectively preventing optimization failures caused by noisy reward signals."
