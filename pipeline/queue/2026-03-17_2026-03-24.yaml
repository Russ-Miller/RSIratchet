      logic to optimize compute, (II) Adaptive Search Routing utilizing a Domain Detector to target
      subject-specific archives, (III) Refined Context Filtering (RCF) to eliminate non-essential or
      distracting information, and (IV) Extrinsic Regeneration followed by atomic claim-level
      verification. The system was evaluated across 650 queries from five diverse benchmarks: TimeQA
