      environmental and user signals, choose among remaining silent, asking, assisting, and acting,
      and account for interruption, misunderstanding, overreach, and privacy costs. This survey
      gives an operational definition centered on initiative and formulates the problem as a
      partially observable sequential decision process constrained by authorization and risk. The
