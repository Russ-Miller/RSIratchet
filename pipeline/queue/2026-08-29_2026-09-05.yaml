    abstract: "As LLMs increasingly act through tools, they must reconcile user instructions, parametric
      knowledge, and dynamic environmental observations before taking actions. We introduce
      KC-Bench, a controlled multi-turn benchmark for measuring this capability across
      world-knowledge conflicts, input inconsistencies, and multi-source temporal conflicts. Its 238
      tasks are manually screened from more than 1,000 generated candidates and combine a user
      simulator, stateful tools, deterministic environment assertions, an open-source
