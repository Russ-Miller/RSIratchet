    abstract: "Modern vision-language models (VLMs) can directly answer many image-grounded questions,
      yet they often struggle with complex queries requiring fine-grained visual details or external
      knowledge. To acquire this missing evidence, agentic VLMs invoke tools such as image cropping,
      image search, and text search. However, existing training paradigms primarily evaluate
      tool-use based on final answer correctness, leaving evidence acquisition and utilization
      insufficiently supervised. This leads to two critical shortcomings: (i) models frequently
      issue redundant or off-target tool calls that fail to gather necessary evidence, and (ii) even
      when appropriate tools are called, models often fail to extract the necessary information from
      the resulting observations. To address these limitations, we introduce the NTEP (Necessary
      Tool-Evidence Path), a novel annotation scheme that explicitly specifies the essential
      external evidence and corresponding tool calls for each query. Building upon this, we propose
      NTEP-R (NTEP Reward), a supervision mechanism ensuring that each tool invocation strictly
      advances the reasoning process toward the final solution. Specifically, our approach rewards
      the agent for aligning its pre-call intent with a necessary evidence-seeking goal, and for
      ensuring the information summarized from the post-call observation aligns with the necessary
      evidence. Furthermore, we introduce a non-repeated-goal regularizer to penalize redundant
      calls that revisit satisfied NTEP goa"
