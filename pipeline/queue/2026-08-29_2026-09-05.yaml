      from that distribution. We decouple the parameters of these models into two sets: AR weights,
      trained using the standard NTP objective, and lightweight diffusion weights, trained to
      generate multiple tokens simultaneously. The diffusion weights are learned through a simple
      Diffusion Distillation phase that adds negligible overhead to existing LLM training pipelines.
      We also introduce $Ψ$-Spec, a family of samplers that enables lossless acceleration and
