      three-axis evidence descriptors across streaming dialogue, screen, video,
      software-engineering, and human-agent collaboration resources, and formalize metrics for
      triggering, timing, calibration, user burden, safety, and policy value. The synthesis shows
      why offline classification performance alone does not predict deployment"
