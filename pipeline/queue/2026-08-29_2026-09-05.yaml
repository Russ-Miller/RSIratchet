      resulting in potentially dangerous performance degradation. Yet, existing data analysis
      pipelines largely rely on metadata, predefined labels, or manual inspection, which provide
      limited semantic insight or do not scale. This paper studies set difference captioning: given
      two subsets of images, the goal is to produce a natural-language hypothesis describing
      differences between the target and reference set. Building on a two-stage formulation, we
      adapt the method to autonomous driving by focusing on object-centric patches derived from
      object detection, which simplifies aggregation and enables attribution of differences to
