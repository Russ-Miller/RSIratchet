      challenge, we propose SelfDR, a Self-Distillation from Reasoning framework for LLM-based
      Recommendation. SelfDR distills an LLM's own reasoning-enhanced predictions to produce
      recommendations directly, improving recommendation effectiveness while maintaining inference
