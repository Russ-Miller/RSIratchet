      amplified through LLM-mediated interactions, while LLM-specific vulnerabilities can propagate
      across web applications, introducing attacks such as prompt injection. Securing modern web
      systems therefore requires understanding interactions between traditional and LLM-specific
      threats across the system lifecycle. Unlike prior surveys treating web and LLM security
      separately, this survey provides a unified analysis of how LLMs amplify web vulnerabilities
      across client-side, server-side, and pipeline layers while evaluating defenses and their
      limitations. The analysis examines extending NIST and ISO/IEC AI security frameworks to the
