      fall short when a task requires grounded information, correct tool use, or cautious handling
      of bank-specific sensitive situations. We introduce FiMI Banking, a controlled Indian
      retail-banking setting. We build it from vetted banking documents, structured ground truth,
      synthetic customer backgrounds, and banking tools. We evaluate two post-training approaches:
