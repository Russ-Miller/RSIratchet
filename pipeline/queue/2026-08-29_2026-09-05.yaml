      examples, often matching or outperforming traditional approaches in low-data settings.
      However, their performance remains model-dependent and less stable as input complexity
      increases. In contrast, ML, DL, and TFM models show more consistent improvement with larger
      training data. Overall, the findings highlight a trade-off between data efficiency and
      stability, suggesting that LLMs may serve as a flexible complementary approach for CKD
      screening when labeled data are limited.
