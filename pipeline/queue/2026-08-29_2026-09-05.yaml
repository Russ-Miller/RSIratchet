      making explicit the option value of waiting, the decision value of questions, and
      feedback-induced state changes. On this basis, we organize existing methods along one decision
      pipeline (state and need estimation, intervention gating, action construction, and feedback
      adaptation) and describe prescribed, predictive, model based, and return optimizing mechanisms
