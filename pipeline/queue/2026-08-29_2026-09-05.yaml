      Bernoulli trials. Unlike KGW's vocabulary permutation or SynthID's multi-layer tournament, SBW
      requires only a single comparison per token against a counter-based random number generator,
      reducing membership complexity to $O(1)$ and enabling single-kernel execution with zero
      intermediate allocations. We prove that this formulation preserves the same detection
      guarantees as fixed-size green lists: the z-score test remains $\\mathcal{N}(0,1)$ under the
      null. The stateless architecture enables capabilities unavailable to existing methods:
      full-vocabulary self-salt watermarking (over 6000$\\times$ faster than KGW's self-salt and
      2$\\times$ faster than SynthID despite biasing the entire vocabulary with candidate-dependent
      seeding) and architectural compatibility with distributed inference. In end-to-end generation
      benchmarks, SBW adds less than 1\\% overhead at all batch sizes. We additionally identify hash
