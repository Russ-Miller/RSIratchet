    abstract: "We present Dalek, a closed machine designed for agents that realizes self-maintenance,
      self-evolution, self-reproduction, and self-organization on any substrate satisfying a general
      host contract. The machine is built from three primitives---actors, messages, and channels.
      Four obligations---a host boundary, a construction language, admissible transitions, and rule
      heredity---give its boundary, identity, and closure a structural basis. Von Neumann's 1948
      self-reproducing automaton supplies a hereditary constructional core: a self-description
      together with a constructor, a copier, and a controller. Dalek combines this core with the
      four obligations and rederives its medium for a text-and-message agent substrate, adding
      explicit structures for boundary, identity, history, and growth. A large language model and a
      compiler occupy the payload position and form a general capability producer. New capabilities
      are authored, compiled, installed into the description, and inherited by descendants. The same
      path produces the machine's own organs and even its runtime, closing heredity and evolution
      within the machine."
