      knowledge. To investigate this, we introduce Fact-Ablated Evaluation (FAE), a new evaluation
      framework that iteratively ablates the cited evidence to assess whether LLMs revise their
      predictions accordingly. Our empirical results show that current off-the-shelf LLMs as
      fact-checking systems rely more on their parametric knowledge than on the evidence provided.
      To bridge this gap between prediction accuracy and evidence grounding, we propose REAL
