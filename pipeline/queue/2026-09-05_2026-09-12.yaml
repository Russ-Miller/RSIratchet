    abstract: Large language models (LLMs) and AI agents are increasingly explored for hardware design,
      including high-level digital design. While most work targets code generation and editing for
      hardware description languages (HDLs), our prior work introduced HLS-Eval, an open-source
      benchmark for evaluating LLMs on high-level synthesis (HLS) design tasks. Those evaluations,
      however, focused on zero-shot generation and editing, leaving open how agents achieve HLS
      design tasks. We therefore extend HLS-Eval with an agentic evaluation flow built on the
      open-source mini-swe-agent framework. The flow lets HLS design agents use file-editing tools,
      invoke a C++ compiler for self-verification, and iteratively refine designs during inference,
      while logging agent traces for analysis of cost, token usage, and iteration count. We present
      initial results on the existing HLS-Eval benchmarks. In our initial evaluation, we find
      open-source LLMs paired with an agentic harness solve every simple HLS code generation task in
      our evaluation, underscoring the need to expand benchmark difficulty as model capabilities
      advance. Analyzing traces from passing and failing runs, we show how model size, token usage,
      and trajectory length relate to design pass rates. These results establish a foundation for
      agentic HLS design and motivate harder benchmarks and new agentic tooling as model
      capabilities progress.
