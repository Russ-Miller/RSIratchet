    abstract: Large language models (LLMs) have demonstrated remarkable capabilities in reasoning and
      code generation, raising the prospect that they could assist in developing and optimizing the
      very infrastructure that powers them. However, existing benchmarks mainly focus on isolated
      kernels, predefined operators, or pre-specified optimization targets, and therefore fail to
      evaluate the ability of LLMs to perform open-ended, long-horizon LLM infrastructure
      engineering. To address this gap, we present $Φ$-Bench, a benchmark for systematically
      evaluating LLMs on engineering the LLM infrastructure stack. Derived from optimization
      problems studied in frontier research and grounded in real-world code repositories, $Φ$-Bench
      provides broad coverage of the LLM infrastructure stack and spans tasks of varying complexity,
      ranging from localized kernel-level function completion to long-horizon implementation and
      end-to-end system optimization. Extensive experiments on frontier LLMs reveal their current
      capabilities and limitations in engineering complex LLM infrastructure, offering insights into
      the challenges that remain on the path toward autonomous optimization of future AI
      infrastructure.
