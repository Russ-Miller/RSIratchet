      actual information shift underlying hallucination generation. In this paper, we propose HEAL,
      Head-lEvel information disentAnglement and caLibration for identifying and mitigating
      hallucinations. HEAL first employs causal noise intervention on multi-head outputs to filter
      out causally redundant heads. Subsequently, it disentangles information distribution within
      the remaining heads via the counterfactual Difference-in-Differences, categorizing heads into
      four types. Through analysis, we observe: hallucinations happen when information distribution
      drifts away from a healthy equilibrium in synergy heads, not strongly correlated with the
