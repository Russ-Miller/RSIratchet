    abstract: Recent advances in multimodal large language models (LLMs) have revolutionized web agents
      that can automate complex tasks on websites. However, their accuracy remains limited by the
      scarcity of high-quality web trajectory training data. Existing automatic trajectory
      generation methods suffer from incomplete website coverage due to homepage-based task
      proposals or random-walk exploration. Such methods often result in hallucinated or ambiguous
      task synthesis that lead to incomplete and unreliable trajectory generation. Here, we present
      AutoSurfer, a comprehensive web trajectory generator that addresses these limitations through
      three key innovations. First, AutoSurfer employs a systematic breadth-first exploration
      strategy that maintains a queue of discovered pages and action traces, propagates knowledge
      across pages to avoid redundant exploration, and recursively expands multi-level graphical
      user interface elements - closely resembling how a human would learn a new website. Second,
      AutoSurfer leverages the exploration trajectory to guide task synthesis, reducing
      hallucinations by grounding complex tasks in actual navigation paths rather than isolated
      actions or page content alone. Third, AutoSurfer uses the same exploration trajectory as hints
      to steer a web agent toward more accurate and reliable trajectory refinement. Together, these
      innovations enable AutoSurfer to comprehensively cover a website's action space and generate
      data suitable for training website-specific LLMs.
