      mechanical behavior. Existing inverse-design methods can efficiently generate candidates, but
      they typically require explicit numerical property targets and are less suitable for
      early-stage exploration, where researchers often begin with incomplete constraints and
      qualitative intents expressed in natural language. Large language models can interpret such
      intents, but they lack geometric awareness and physical property validity. To address this
      gap, we propose MetaSymbO, a multi-agent framework for language-guided Metamaterial discovery
      via Symbolic-driven latent evOlution. Specifically, MetaSymbO contains three agents: a
      Designer that interprets free-form design intents and retrieves a semantically consistent
      scaffold, a Generator that synthesizes candidate microstructures in a disentangled latent
      space, and a Supervisor that provides fast property-aware feedback for iterative refinement.
