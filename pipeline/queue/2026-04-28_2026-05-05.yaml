      subsequent unlearning evaluations unreliable. Diagnosing under-memorization and the multi-hop
      curse as root causes, we introduce ReMem, a Reliable Multi-hop and Multi-image Memorization
      Benchmark. ReMem ensures robust foundational learning through principled data scaling,
