      copyright content unlearning in LVLMs. CoVUBench utilizes procedurally generated, legally safe
      synthetic data coupled with systematic visual variations spanning compositional changes and
      diverse domain manifestations to ensure realistic and robust evaluation of unlearning
      generalization. Our comprehensive multimodal evaluation protocol assesses both forgetting
      efficacy from the copyright holder perspective and the preservation of general model utility
      from the deployer viewpoint. By rigorously measuring this crucial trade-off, CoVUBench
      provides a standardized tool to advance the development of responsible and effective
      unlearning methods for LVLMs.
