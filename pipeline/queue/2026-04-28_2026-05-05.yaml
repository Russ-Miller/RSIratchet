      existing methods typically rely on a predetermined, fixed number of shots. This static
      approach often fails to adapt to the varying difficulty of different queries, leading to
      either insufficient context or interference from noise. Furthermore, the prohibitive
      computational and memory costs of long contexts severely limit Many-Shot's feasibility. To
      address the above limitations, we propose AdapShot, which dynamically optimizes shot counts
      and leverages KV cache reuse for efficient inference. Specifically, we design a probe-based
      evaluation mechanism that utilizes output entropy to determine the optimal number of shots. To
