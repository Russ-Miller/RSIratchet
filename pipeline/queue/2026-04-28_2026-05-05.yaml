    abstract: The integration of Large Language Model (LLM) reasoning principles into classical robot
      path planning represents a rapidly emerging research direction. In this paper, we propose a
      Semantic Risk-Aware Heuristic (SRAH) planner that encodes LLM-inspired cost functions
      penalising geometrically cluttered or high-risk zones into an A$^*$ search framework,
      augmented with closed-loop replanning upon dynamic obstacle detection. We evaluate SRAH
      against two established baselines Breadth-First Search (BFS) with replanning and a Greedy
      heuristic without replanning across 200 randomised trials in a $15{\times}15$ grid-world with
      20\% static obstacle density and stochastic dynamic obstacles. SRAH achieves a task success
      rate of 62.0\%, outperforming BFS (56.5\%) by 9.7\% relative improvement and Greedy (4.0\%) by
      a large margin. We further analyse the trade-off between planning overhead, path efficiency,
      and failure-recovery count, and demonstrate via an obstacle-density ablation that semantic
      cost shaping consistently improves navigation across environments of varying difficulty. Our
      results suggest that even lightweight, LLM-inspired heuristics provide measurable safety and
      robustness gains for autonomous robot navigation.
