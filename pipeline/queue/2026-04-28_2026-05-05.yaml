    abstract: "Large language models pick up social biases from the data they are trained on and carry
      those biases into downstream applications, often reinforcing stereotypes around gender, race,
      religion, disability, age, and socioeconomic status. The standard fixes (retraining on curated
      data or fine-tuning with human feedback) are expensive, need access to model weights, and risk
      degrading the model on other tasks. In this paper we take a different route: we debias the
      model at decoding time, treating bias mitigation as a structured search over candidate tokens
      without ever touching model weights. A separate Process Reward Model (PRM) acts as a judge,
      scoring each candidate for both fairness and fluency. We design three schemes of increasing
      sophistication (Best-of-N selection, Sequential critique-and-revise, and Constitutional
      self-audit) and evaluate them on four models (GPT-4o-mini, Llama 3.2 3B, Gemma 3 4B, Qwen 2.5
      3B) across a 200-prompt bilingual benchmark in English and Urdu covering eight bias
      categories. Sequential debiasing proves the most effective, raising mean bias scores by up to
