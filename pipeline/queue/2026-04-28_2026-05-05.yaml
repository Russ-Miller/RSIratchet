    abstract: "The integration of Large Language Models (LLMs) with Retrieval-Augmented Generation (RAG)
      has significantly advanced Knowledge Graph Question Answering (KGQA). However, existing
      LLM-driven KGQA systems act as stateless planners, generating retrieval plans in isolation
      without exploiting historical query patterns: analogous to a database system that optimizes
      every query from scratch without a plan cache. This fundamental design flaw leads to schema
      hallucinations and limited retrieval coverage. We propose CacheRAG, a systematic
      cache-augmented architecture for LLM-based KGQA that transforms stateless planners into
      continual learners. Unlike traditional database plan caching (which optimizes for frequency),
      CacheRAG introduces three novel design principles tailored for LLM contexts: (1)
      Schema-agnostic user interface: A two-stage semantic parsing framework via Intermediate
      Semantic Representation (ISR) enables non-expert users to interact purely in natural language,
      while a Backend Adapter grounds the LLM with local schema context to compile executable
      physical queries safely. (2) Diversity-optimized cache retrieval: A two-layer hierarchical
      index (Domain $\\rightarrow$ Aspect) coupled with Maximal Marginal Relevance (MMR) maximizes
