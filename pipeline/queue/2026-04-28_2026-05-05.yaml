      auditory inputs, a problem known as multimodal hallucinations. Prior work suggests that this
      occurs when models rely more on textual cues and learned language patterns than on evidence
      from the perceptual input. To obtain a more direct account of this imbalance, we apply
      Layer-wise Relevance Propagation (LRP), which attributes predictions to individual input
      tokens, and use the resulting relevance scores to analyze and mitigate hallucinations. First,
      we examine whether this imbalance leads to multimodal hallucinations. We find that
