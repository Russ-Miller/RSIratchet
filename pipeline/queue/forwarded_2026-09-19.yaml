    title: Automatic XPath generation agents for vertical websites by LLMs
    date: 2025-06-18
    authors:
      - Huang
      - Song
    venue: Journal of King Saud University – Computer and Information Sciences
    doi: https://doi.org/10.1007/s44443-025-00071-w
    abstract: Extracting structured data from web pages has long been a challenging research topic,
      particularly for domain-specific data on vertical websites. The advent of large language
      models (LLMs) has introduced new possibilities for this task, enabling high-accuracy
      information extraction from individual pages. However, due to the substantial costs associated
      with LLMs, this approach is often economically impractical and difficult to scale in
      industrial applications. To address these challenges we propose a new framework that leverages
      a multi-task decomposition strategy, enabling LLMs, despite their limitations in handling
      structured information, to learn robust XPath expressions from seed pages and apply them to
      unseen web pages. Experimental results on various structured web data extraction datasets
      demonstrate that this framework achieves state-of-the-art accuracy for vertical websites with
      minimal LLM interactions. Furthermore, our approach significantly outperforms the top
      prompting-based methods, Reflexion and COT, improving F1 scores ranging from 14.84 to 23.86
      percentage points across multiple datasets. The proposed framework not only boosts the
      accuracy and efficiency of structured data extraction from vertical websites, but also holds
      promise for adaptation across a range of industrial applications focused on extracting
      information from hierarchical data.
    proposal:
      proposed_id: structured-document-extraction
      proposed_label: Extracting structured records from semi-structured documents
      scope_note: Covers pulling fields into a schema from HTML pages, forms, tables, or PDFs, including
        inducing reusable selectors or extraction rules that generalize across same-template
        documents; excludes free-text information extraction already covered by retrieval or code
        generation.
      rationale: The paper tests whether an LLM can induce XPath rules from seed pages that transfer to
        unseen pages of the same vertical website.
    verdicts:
