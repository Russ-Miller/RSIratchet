      - Jiaqi Guo
      - Wei Yang
      - Jian Peng
      - Tao Xie
      - Jian-Guang Lou
      - Ting Liu
      - Dongmei Zhang
    venue: EMNLP 2018
    doi: https://aclanthology.org/D18-1189/
    abstract: "Recent research proposes syntax-based approaches to address the problem of generating
      programs from natural language specifications. These approaches typically train a
      sequence-to-sequence learning model using a syntax-based objective: maximum likelihood
      estimation (MLE). Such syntax-based approaches do not effectively address the goal of
      generating semantically correct programs, because these approaches fail to handle Program
      Aliasing, i.e., semantically equivalent programs may have many syntactically different forms.
      To address this issue, in this paper, we propose a semantics-based approach named SemRegex.
      SemRegex provides solutions for a subtask of the program-synthesis problem: generating regular
      expressions from natural language. Different from the existing syntax-based approaches,
      SemRegex trains the model by maximizing the expected semantic correctness of the generated
      regular expressions. The semantic correctness is measured using the DFA-equivalence oracle,
      random test cases, and distinguishing test cases. The experiments on three public datasets
      demonstrate the superiority of SemRegex over the existing state-of-the-art approaches."
    proposal:
      suggests_new_capability: false
    verdicts:
      - capability: formal-query-synthesis
        about_capability: true
        direction: improves
        confidence: high
        rationale: SemRegex trains with a semantic-correctness reward and outperforms syntax-based state of
          the art on NL-to-regex generation.
        scope_condition: Seq2seq regex generation from natural language on three public NL-to-regex
          datasets, trained with semantic (DFA-equivalence/test-case) reward
