      objective. A natural approach is to train a shared policy through multiple harnesses, but
      doing so introduces a scheduling problem: each training step should favor a harness that
      currently provides a useful learning signal while also producing an update that benefits the
      other harnesses. We develop HarnessBandit, an online scheduler that selects one harness per
      optimizer step. After a group-relative policy optimization (GRPO) update, it observes
      learnability -- the mean absolute advantage on the batch -- and transferability -- the cosine
      between a low-dimensional gradient sketch of the current harness and exponential moving
      averages of the remaining harnesses. The two signals are fused after pooled sliding-window
      min-max normalization and sampled with a visit-dependent bonus and an explicit exploration
      floor. We train Qwen3.5-2B across six harnesses on ClawGym and evaluate on PinchBench
      (held-out tasks, in-distribution OpenClaw) and ClawEval (held-out tasks and harness).
      HarnessBandit improves over mixed-batch multi-harness training on both benchmarks, while
      training diagnostics indicate that learnability and transferability provide distinct, evolving
      signals."
