      non-redeemable virtual funds under real-time market conditions; no real brokerage accounts,
      real-money positions, or real transaction records were accessed. Given only information
      available before a prediction cutoff, a simulator predicts the participant's next-trading-day
      action, traded security, and transaction quantity. We evaluate temporally aligned rolling
      predictions and compare settings with and without point-in-time market information. Market
