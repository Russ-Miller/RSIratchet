    abstract: Silicon sampling uses large language models (LLMs) to simulate survey respondents. Whether
      it recovers cross-national variation, and why, remains unresolved. This study evaluates it
      against European Social Survey Round 11 (30 countries, 42 items) with two open-weight LLMs
      under first- and third-person prompts, plus backstory and response-format experiments.
      Aggregate recovery is moderate and uneven across items. Adding the country name to a
      three-variable demographic backstory raises the median per-item correlation between simulated
      and observed country means from -0.03 to 0.52, and the richer profiles tested add no
      consistent gain. The respondent's country label acts as a country-level assumption that
      respondent detail does not revise. Naming the response-scale endpoints in words stops the
      model from ranking countries backwards, so the answer format sets the direction of the
      ranking. Individual-level recovery remains negligible in every condition and does not track
      aggregate recovery across countries. An average of neighboring countries, using no LLM,
      recovers country levels more accurately than every model condition and ranks them about as
      well. Silicon sampling can thus support exploratory country-ranking comparison after
      item-level validation and with the response format reported. It does not support individual or
      distributional inference.
