      Although recent advances in large language model (LLM) agents enable automated experiment
      reproduction, existing evaluations largely focus on final repositories and are typically
      limited to machine learning (ML). We introduce AgentActionBench, a process-oriented benchmark
      for evaluating agent-based experiment reproduction across ML and AI4Science domains. Our
      framework uses an MCP-based Action Recorder to capture agents' behaviour throughout the
      reproduction process and evaluates the resulting traces with paper-specific rubrics.
      AgentActionBench contains 150 papers, including 120 ML papers and 30 AI4Science papers. A
      human-annotated subset covering 10% of the benchmark provides validation data, while
      model-assisted augmentation expands the full benchmark to more than 10,000 rubric items.
      Experimental results show that current systems remain limited, with execution as the primary
      bottleneck. Meanwhile, the strong Pearson and Spearman correlations between model-generated
      and human-annotated rubrics validate the reliability of our scalable rubric-generation
      approach.
