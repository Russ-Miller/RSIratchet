    abstract: 'Multimodal Large Language Models have demonstrated impressive video understanding, yet
      their ability to reason over long-form narratives is often masked by visual-centric
      evaluations and inefficient context processing. Existing benchmarks over-rely on visual
      heuristics while marginalizing auditory cues, effectively reducing models to "silent
      observers" that bypass genuine cross-modal reasoning. Moreover, standard dense sampling
      creates an evidence-context trade-off: increasing frames to capture evidence inevitably leads
      to attention distraction and token explosion. To bridge these gaps, we present Video-HolmesV2,
      a novel benchmark designed for Deep Audio-Visual Coupling. Unlike previous works, it enforces
      an Evidence-Based Evaluation, requiring models to justify answers with precise spatio-temporal
      audio-visual evidence, thereby reducing confounding effects of guessing and hallucinated
      evidence. To support this, we introduce: (1) a Multi-Model Cross-Verification pipeline to
      ensure task rigor; (2) a Spatio-temporal Evidence-Aware Metric for fine-grained calibration.
      Furthermore, we propose an Audio-Text Guided Token Compression framework. By fusing task
      intent with auditory anchors, our method distills high-value reasoning cues to mitigate
      long-context noise. In our evaluation, even strong proprietary models achieve below 60%
      accuracy, while our approach outperforms comparable open-source omni-models.'
