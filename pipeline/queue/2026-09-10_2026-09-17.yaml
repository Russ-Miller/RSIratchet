    abstract: The CRITICS project addresses science accessibility and literacy by converging advanced
      Machine Translation (MT) based on Large Language Models (LLMs) with educational technology. By
      leveraging MT systems specifically optimized for scientific content, educational institutions
      can provide accurate, culturally relevant translations of scientific materials in students'
      native languages, ensuring that complex scientific concepts are comprehensible while
      maintaining technical accuracy. Building on these translations, the project explores the
      design and evaluation of innovative science teaching-learning proposals grounded in
      curriculum-aligned teaching-learning. Thus, CRITICS will investigate key components of
      scientific argumentation and critical thinking practices together with textual feedback
      aligned with learning objectives and assessment criteria inspired by competence-based
      evaluation frameworks. CRITICS aims to break down language barriers to accessing cutting-edge
      research and educational materials currently available only in high-resourced languages,
      thereby facilitating the democratization of scientific knowledge and fostering critical
      thinking in science education.
