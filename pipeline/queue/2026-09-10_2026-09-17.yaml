      ones like redaction, and that explicitly prompting models about anonymization offers no
      discernible benefit. We conclude that anonymization is not a one-size-fits-all solution and
      must be co-designed with the model and task in mind to balance privacy and utility
      effectively. Our findings provide a crucial baseline for developing more robust, privacy-aware
      AI systems."
