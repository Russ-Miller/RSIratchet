      especially when numerical signals are serialized as text and require explicit computation.
      Tool-augmented approaches improve performance, but existing systems often intertwine language
      reasoning, computation, and perception, making it difficult to determine which components
      drive the gains. We present T-SMART, a neurosymbolic framework that separates these roles: a
      frozen LLM interprets questions and selects operations, deterministic tools perform numerical
