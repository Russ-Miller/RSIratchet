    abstract: Text watermarking techniques have gained significant attention for identifying
      machine-generated text and mitigating risks from large language models (LLMs). Existing
      methods typically divide an LLM's vocabulary into green and red tokens, but encouraging
      generation toward green tokens can reduce text quality and naturalness. To address this, we
      propose TripPattern, a watermarking framework that formulates text watermarking as a
      pattern-based matching task using three vocabulary partitions. TripPattern divides the
      vocabulary into one neutral group and two pattern groups. During generation, the model
      alternates token selection between the two pattern groups to embed detectable patterns, while
      neutral tokens are selected independently to improve flexibility and preserve naturalness. For
      detection, TripPattern uses pattern-based statistical tests that provide interpretable
      p-values by measuring how often adjacent tokens alternate between the pattern groups.
      Theoretical analysis and empirical evaluations on four multilingual datasets show that
      TripPattern maintains LLM generation quality while achieving robust watermark detectability.
