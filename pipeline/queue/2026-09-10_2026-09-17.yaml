      tasks. These benchmark achieve mean absolute errors of 0.002--0.02 and average Spearman
      correlations of ~0.98 with the full benchmarks. Overall, ZipBench reduces the cost of both LLM
      evaluation and compact benchmark construction, lowering the barrier to broad LLM research for
      compute-constrained researchers. The code has been released in
