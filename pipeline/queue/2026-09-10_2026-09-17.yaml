      turns failed trials into text that guides later attempts without updating model parameters. We
      introduce VRL-Bench, a harness for fair evaluation of trial-and-error learning under finite
      trial budgets. Across three models on MiniWoB and WebShop, we evaluate updates from several
      prominent verbal-memory methods spanning Reflexion and later work: each improves observed
      success over memory-free retry in some settings but reduces it in others. Replay experiments
