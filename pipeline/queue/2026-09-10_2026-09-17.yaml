    abstract: "As large language models are increasingly deployed in sensitive domains, anonymizing
      input data to protect personally identifiable information has become a critical practice.
      However, the impact of this anonymization on model utility is not well understood. This paper
      presents a systematic empirical study of the trade-off between privacy and performance. We
      evaluate five prominent language models across eleven diverse benchmarks, comparing their
      performance on original versus pseudonymized inputs. Our results reveal that while
      anonymization generally degrades performance, the effect is highly nuanced. We find that more
      capable models, such as Qwen2.5-72B and GPT-4o mini, suffer the largest performance drops,
      suggesting a stronger reliance on specific entity information. The impact is also
