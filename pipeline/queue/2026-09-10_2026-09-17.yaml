    abstract: Large language model (LLM) agents can benefit from reusable skills distilled from prior
      task experience, yet existing skill optimization methods often rely on costly execution-based
      evaluation and substantial task data. We introduce \textbf{COBRA-Skills}, an efficient
      framework that formulates skill optimization as budgeted sequential optimization over a
