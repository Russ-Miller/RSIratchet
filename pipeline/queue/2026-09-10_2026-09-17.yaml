    abstract: Comprehensive benchmark suites are essential for improving large language models (LLMs),
      but many widely used benchmarks are redundant, making evaluation unnecessarily expensive.
      Although recent benchmark compression methods (BCMs) can mitigate this cost, many strong BCMs
      rely on large collections of per-sample evaluation results from numerous LLMs to identify
      representative samples. Building such collections is also expensive unless they are already
      public, making these methods difficult to extend to newly released benchmarks. To address this
      challenge, we present ZipBench, a simple and low-cost BCM with theoretical error and
      rank-consistency guarantees. ZipBench evaluates only a small set of anchor LLMs, synthesizes
      pseudo evaluation results to broaden coverage, learns compact sample representations, and
      selects a small yet representative subset. Building on it, we create ZipBench Zoo, a
