    abstract: "Automated machine learning (AutoML) is reshaping data-driven science and industrial
      practice, and as large language models are introduced into AutoML, pipeline reliability
      becomes as important as automation efficiency. However, existing AutoML still struggles to
      realize instant feedback and adaptive optimization during execution, so once a run drifts into
      a suboptimal or failed state, it lacks a process-level correction mechanism. The fundamental
      pathology lies in its one-way pipeline: intermediate failures are typically terminated or
      bypassed, while fixed paradigms often strengthen model generation but leave ensemble decisions
      static, weakening both execution reliability and the controlled use of structural diversity.
      This indicates that LLM-driven AutoML needs a closed-loop ability for
      trial-correction-improvement together with evidence-based use of model diversity. To this end,
      we propose SAGE-Loop, a reliable closed-loop, self-adaptive, LLM-driven AutoML framework that
      performs multi-round generation and validation for trial-and-repair, and adaptively selects
      ensemble strategies in both supervised and unsupervised tasks, thereby unifying how to
      generate with how to use models. Across 20 public datasets, SAGE-Loop consistently improves
      performance and stability on classification, regression, and clustering tasks. Additional
      results further show its ability to recover from execution failures and maintain robust
      pipeline behavior."
