      hallucinated references are widely discussed, their visibility within specific research
      communities remains unclear. We address this gap by examining reference integrity at key
      computing education venues using ACM Digital Library data. We analyze referencing trends
      across 24,751 computing education papers and compare them with the broader ACM corpus of more
      than 723,000 papers and 15 million references. We then examine reference lists from these
      venues, classify common bibliographic errors, and manually identify LLM-generated
      hallucinations containing verifiably false information, including impossible page ranges,
      invented titles, and misattributed authors. In 2025, hallucinated references appeared across
      five SIGCSE-sponsored or in-cooperation venues. At the Technical Symposium alone, verified
      hallucinated references increased from 3 in 2025 to 17 in 2026, appearing in 2.3\\% of 2026
