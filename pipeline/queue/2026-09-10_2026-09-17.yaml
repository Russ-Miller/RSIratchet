      their adaptation signals, including predictive uncertainty, sample reliability, and local
      feature geometry, from the model being adapted. When the source model is unreliable under
      shift, these signals can reinforce its own errors, forming a self-referential loop. We
      introduce MASA (Multimodal-LLM-Anchored Semantic Adaptation), which complements model-internal
