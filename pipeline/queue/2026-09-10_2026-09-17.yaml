      condition for (i) logic-guided data collection and (ii) diffusion-based policy training,
      encouraging trajectories that are consistent with the desired ordering and coordination
      requirements. Experiments on multi-agent LTLDiff manipulation tasks demonstrate improved task
      success rates compared to the baseline. Together, these contributions demonstrate the
      effectiveness of LTLDiff for coordinated multi-agent manipulation.
