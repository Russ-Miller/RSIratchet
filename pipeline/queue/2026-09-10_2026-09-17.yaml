      i.e., insertion errors. We propose an acoustic-fidelity reward: a GRPO reward augmented with a
      separately pretrained, permanently frozen, non-autoregressive character-level wav2vec2-CTC
      acoustic judge, used strictly at training and absent at inference, where a single model
      decodes greedily. Trained on LibriSpeech and evaluated across a six-tier difficulty gradient
