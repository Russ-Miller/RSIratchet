      navigation decisions. As one of the most advanced uncertainty estimation frameworks, conformal
      prediction (CP) offers a promising approach for uncertainty estimation in VLN. However, given
      that VLN agent requires a sequence of steps, standard calibration in conformal prediction
      fails to provide coverage guarantee it promises over a dependent, variable-length VLN episode.
      To this end, we propose Episode-Normalized Conformal Prediction (ENCP), which rescales a
      nonconformity score by the policy's residual confidence and calibrates one maximum score per
