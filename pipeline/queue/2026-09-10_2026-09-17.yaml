    abstract: "Vision-language models (VLMs) increasingly power consumer-facing AI search, yet
      evaluating them on the diversity of everyday visual questions remains challenging. Existing
      benchmarks often target predefined capabilities, such as multi-hop retrieval or long-form
      synthesis, whereas users ask photo-grounded questions spanning a long tail of everyday
      scenarios. Despite advances in VLMs, users on Xiaohongshu, a mainstream Chinese image-sharing
      platform, continue to turn to other people for help with everyday visual questions. Motivated
      by this behaviour, we curate NoteVQA from these questions, yielding 252 items across 12
