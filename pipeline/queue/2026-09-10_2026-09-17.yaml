      comprising 860 randomized controlled trials (RCTs) and 14,820 queries. It evaluates models
      under the Hierarchical Logical Consistency (HLC) framework across four dimensions: Atomic
      Consistency, Domain Consistency, Aggregation Consistency, and Evidential Faithfulness.
      Experiments on 10 state-of-the-art LLMs reveal a catastrophic Error Compounding Effect:
      despite the top model reaching 98.88% Atomic Consistency, its end-to-end consistency collapses
