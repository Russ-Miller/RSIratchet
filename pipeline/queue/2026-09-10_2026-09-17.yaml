      database normalization from 1NF to BCNF. DNBENCH uses a three-axis protocol to measure
      semantic equivalence, structural accuracy, and logical validity. Across Single, Complex, and
      Real World levels, DNBENCH uncovers recurring failures in dependency inference, schema
      decomposition, and inter-table constraint reconstruction. We further propose Multi-Agent
      Reasoning for Schemas (MARS), which separates evidence extraction, violation diagnosis, and
      decomposition planning from schema generation and verification. MARS improves the DNB-SCORE by
