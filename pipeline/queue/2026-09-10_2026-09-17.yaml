    abstract: Retrieval-Augmented Generation (RAG) can ground large language model (LLM) outputs in
      external evidence, but it also exposes the system to knowledge poisoning. Representative
      attacks use multiple injected documents or templates that directly assert a target answer. We
      present ToxicRAG, a one-document-per-target attack that expresses misinformation as a coherent
      knowledge-update narrative. The generated document first acknowledges the previously accepted
      answer, introduces fabricated events that appear to invalidate it, and then attributes the
      attacker-selected answer to a set of purported authorities. An answer-focused self-validation
      loop optionally revises a candidate when a surrogate language model does not reproduce the
      target answer. We evaluate the attack on 100 target questions from each of Natural Questions,
      HotpotQA, and MS-MARCO, using four victim LLMs and four dense retrievers. In the
      sampled-corpus setting reported in this paper, ToxicRAG obtains ASRs between 0.61 and 0.91
