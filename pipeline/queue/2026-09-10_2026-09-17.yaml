      overall safety of the generated responses, when prompted for harmful or dangerous content. A
      clearer understanding of the mechanisms leading to this result is needed, as increasing
      numbers of end users turn to RAG to incorporate corporate documents and knowledge bases into
      LLM-based systems. We introduce RAG-Safety-Bench, a benchmark to measure the safety impact of
      RAG on LLM models. By removing the confounding effect of retriever quality, and cleanly
      separating the problem into four conditions -- non-RAG, RAG with an oracle document containing
      the answer to the harmful request, RAG with documents related to the harmful request but
