    abstract: Unified multimodal large language models (MLLMs) and multi-agent systems have advanced
      visual generation. However, three limitations remain. (1) Existing methods often distill
      task-specific experience with limited generalizability. (2) Reflection is often deferred until
      task completion. (3) Knowledge is often acquired only in response to downstream task demands.
      To address these limitations, we introduce OmniHarness, a framework for generalizable visual
      generation via symbolic policy learning. OmniHarness abstracts verified executions into
      symbolic policies for visual generation task families, capturing shared procedures and
      applicability conditions while removing instance-specific inputs. The harness instantiates,
      adapts, and composes these policies for new tasks. Intermediate verification guides refinement
      and failure recovery during execution. Through self-directed inquiry, OmniHarness autonomously
      generates and executes practice tasks near its capability limits before downstream objectives
      are specified. Execution feedback continually refines the policies while model parameters
      remain fixed. Experiments across six benchmarks, three MLLM backbones, and three visual agent
      frameworks demonstrate strong performance and continual capability expansion. On ComfyBench's
      Creative tasks, OmniHarness achieves a 95.0% resolve rate, exceeding the strongest baseline by
      27.5 percentage points. Frozen policy snapshots improve existing visual agent systems through
      plug-and-play reuse.
