      more challenging than traditional machine learning for many reasons, including probabilistic
      and open-ended outputs, and behavior that shifts with prompt design and accumulated context.
      This review covers four key areas of LLM evaluation: principles of study design, statistical
      methods, capability evaluation and clinical context evaluation. Capability evaluation
      considers different benchmarks, including multiple-choice, agentic and multi-turn benchmarks,
      alongside operational metrics like token usage. Clinical context evaluation addresses
      establishing accuracy of free text outputs, such as human review and LLM-as-a-judge, and
      clinical trial approaches. Across sections, we describe underlying concepts and potential
      pitfalls, while emphasizing the importance of aligning evaluation methods with the research
      question. Together, this article aims to provide a pragmatic basis for designing and executing
