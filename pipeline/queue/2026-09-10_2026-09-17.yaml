      own prediction changes. Across sentiment analysis and natural language inference, we evaluate
      ten instruction-tuned models from the LLaMA-3 and Qwen-2.5 families, measuring faithfulness,
      minimality, and alignment with human-annotated rationales. Our results show that model scale
      is the strongest determinant of explanation quality: larger models are substantially more
      likely to generate counterfactuals that flip their own predictions and target
      decision-relevant evidence. In contrast, the rationale-guided condition produces edit-minimal
