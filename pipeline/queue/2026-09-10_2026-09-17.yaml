      training-phase adjustments or post-hoc calibration, but face limitations in dynamic visual
      bias mitigation. These include inability to capture real-time visual-textual incongruence,
      dependence on predefined gender bias taxonomies, and degraded cross-modal alignment with
      emergent bias patterns. To address these challenges, we propose ViD, a causally-inspired
      framework that analyzes attention mechanisms across five distinct patterns, revealing
      confounding effects from strong language priors. ViD demonstrates that visual-to-language
