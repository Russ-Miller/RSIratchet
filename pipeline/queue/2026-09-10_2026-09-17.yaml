      identity from the Model Context Protocol (MCP) tool schema, bind scope to a verified
      credential, and enforce it below the agent. In a 373-trial ablation across eight model
      configurations and two transports, a correctly validated tenant parameter served every
      out-of-scope attempt: 26 of 26, or 26 of 41 plausible-pretext trials overall. With the
      parameter removed, no tool signature could express the read. Twelve of 56 trials instead
      escaped the interface by forging writable scope, showing that interface invariance requires
