      arise from a mixture of multiple patterns, so signals bound to a single pattern struggle to
      remain stable across models and tasks. Under a unified head-level view, we find that
      hallucination-induced changes manifest as localized deviations from each head's faithful
      contextual behavior, a phenomenon we term Role-Break. Detailed analysis reveals that these
      deviations are systematically organized across attention heads, contextual sources, and
