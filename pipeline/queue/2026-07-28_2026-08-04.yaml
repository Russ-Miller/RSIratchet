      address this dilemma, we introduce Divergence Decoding, a training-free framework for
      capability fusion. It reconstructs the "draft-and-verify" skeleton of speculative decoding
      into an adaptive routing mechanism. The core is using Jensen-Shannon divergence to monitor the
      distributional disagreement between the two models at each token. When the specialist exhibits
      significant divergence, our method identifies it as a potential reasoning risk and
      instantaneously routes control to the generalist. This allows the dynamic injection of general
