    title: "Aligned in Form, Not in Meaning: The Comprehension - Containment Decoupling of LLM Safety in
      Low-Resource Bangla Derogatory Speech"
    date: 2026-08-03
    arxiv_id: "2608.02941"
    authors:
      - Shadab Bin Habib
      - A K M Ferdous Reza Habib
