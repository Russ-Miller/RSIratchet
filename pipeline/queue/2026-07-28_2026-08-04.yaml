      experience into persistent model capabilities. Existing self-improvement paradigms remain
      fragmented: test-time methods can explicitly extract experience but cannot internalize it into
      model parameters, whereas training-time optimization methods can update model parameters but
      lack an explicit mechanism for accumulating transferable experience. Bridging these two
      paradigms requires a critical intermediate stage that remains underexplored, namely
      \\emph{experience distillation}. To address this gap, we propose \\textbf{SPEE}
      (\\textbf{S}elf-\\textbf{P}rogressive \\textbf{E}xperience \\textbf{E}volution), a unified
