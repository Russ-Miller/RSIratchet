    abstract: "Vision-Language-Action (VLA) models excel in robotic manipulation but suffer catastrophic
      performance drops when canonical instructions are simply paraphrased. Although this
      brittleness is typically addressed through costly data scaling, our probing reveals that the
      root cause is architectural rather than a lack of semantic understanding. Specifically, we
      demonstrate that current VLAs successfully retain the correct task identity internally. The
      failure actually stems from the joint encoding of dynamic visual observations and text, which
      introduces systematic feature shifts. Because the downstream action policy is highly
      vulnerable to these variations, it fails to translate the preserved semantics into correct
      control commands. To resolve this structural bottleneck, we propose Grounded Semantic
      Re-binding (GSR), an elegant intervention that bypasses unstable joint routing by explicitly
      fusing independently extracted task semantics with native visual features to train a
