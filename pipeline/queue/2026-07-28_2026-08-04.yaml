    abstract: Multimodal Large Language Models (MLLMs) have achieved strong performance on a wide range
      of vision-language tasks, but often fail under imperfect or shifted contexts. A reliable MLLM
      should refuse truly out-of-context (OOC) questions with subject-level context shifts while
      still answering shifted in-context (Shifted IC) questions with non-subject context shifts.
      Existing benchmarks mainly target OOC or visually unanswerable questions, but overlook
      answerable Shifted IC cases and cover limited OOC shifts. To fill this gap, we present MMOOC,
      a large-scale benchmark for evaluating refusal and robust answering abilities of MLLMs. MMOOC
      contains over 41K image-question pairs, including answerable Shifted IC cases and unanswerable
      OOC cases, spanning three question formats, eight shift types and six visual scenarios, with
      data quality ensured through MLLM-based filtering and human verification. We evaluate model
      responses using Accuracy and Refusal Rate, and further introduce an LLM-as-a-Judge metric to
      assess the correctness of model reasoning. Experiments on diverse MLLMs show that current
      models still struggle to balance answer-ability and refusal under shifted contexts. We further
      analyze key failure patterns and show that post-training can improve robustness. MMOOC will be
      made publicly available.
