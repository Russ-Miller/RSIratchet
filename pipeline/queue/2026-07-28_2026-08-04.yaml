    abstract: "Large vision--language models (LVLMs) demonstrate strong multimodal reasoning
      capabilities but remain prone to hallucination, where model predictions are not grounded in
      visual evidence. Existing black-box hallucination detection methods estimate uncertainty
      through a single consistency metric, implicitly assuming that model uncertainty can be
      adequately characterized by a single measure. However, hallucinations exhibit diverse
      manifestations of uncertainty across different behavioral probes, making a single measure
      insufficient to characterize their underlying behavior. We propose \\emph{Unique Hallucination
      Pattern (UHP) Detection}, a fully black-box framework that models hallucination as a
      structured uncertainty pattern defined by two axes: perturbation modality (image vs.\\ text)
      and logical polarity (a statement vs.\\ its negation). Their intersection produces four
      complementary consistency groups that capture distinct manifestations of model uncertainty,
