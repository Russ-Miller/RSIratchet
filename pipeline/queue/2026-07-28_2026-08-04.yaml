      mitigates this limitation. However, the subtasks of code comprehension are interdependent. One
      agent's findings can rewrite another's task, so agents must coordinate during execution, not
      only at phase boundaries. Existing multi-agent systems support such exchange only between
      phases, through staged handoffs or synchronized rounds. Communication and work remain mutually
      exclusive. A discovery made mid-execution cannot be shared until the next boundary. We present
      AgentRadio, an asynchronous message-passing layer that equips coding-agent harnesses with
      three primitives: threads, messages, and waiting for mentions. The last runs as a background
      task, surfacing teammates' messages without interrupting foreground work, so each agent
      remains passively aware of its peers and folds new findings into its ongoing task. Under a
      five-phase protocol of division of labor and negotiation, four agents organized by AgentRadio
