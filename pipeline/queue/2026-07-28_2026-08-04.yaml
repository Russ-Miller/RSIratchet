    abstract: "Agentic vision-language models (VLMs), which interleave textual reasoning with explicit
      tool calls such as cropping and code-based image manipulation, have emerged as a compelling
      paradigm for reliable and interpretable multimodal reasoning. However, recent studies have
      revealed that such models often use tools unfaithfully. Many process images are irrelevant to
      the question (e.g., the tool crops the wrong region or misses the queried target), yet the
      call still receives full credit and the model still answers correctly. Such decorative or
      misaligned tool calls waste computation and reveal that the model leans on prior knowledge or
      the original image rather than the evidence it retrieves. This may stem from two limitations
      of prevailing methods: the tool reward fails to distinguish useful from useless calls, and
