    abstract: "Chart question answering (CQA) requires multimodal large language models (MLLMs) to
      integrate visual comprehension with logical reasoning, yet current models struggle with
      accurate visual grounding and coherent reasoning chains. While extrinsic chain-of-thought
      prompting and visual cues significantly improve performance, current MLLMs lack intrinsic
      visual grounded reasoning capabilities, leading to inaccurate perception and reasoning
      disconnected from visual evidence. To address these limitations, we propose CURV, a curriculum
      learning framework that develops intrinsic visual reasoning capabilities by reformulating CQA
