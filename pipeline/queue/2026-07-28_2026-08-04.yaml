      relevant information is localized. This setting fails to reflect real-world development, which
      requires reasoning across multiple files and complex dependency structures. We introduce
      RepoReasoner, a benchmark for evaluating repository-level code reasoning. It assesses two
      complementary abilities: Output Prediction, which measures fine-grained, stateful execution
      reasoning across files, and Call Chain Prediction, which evaluates high-level architectural
      dependency understanding under noisy context. Our benchmark is constructed through a
