    abstract: "The growing role of AI-generated content and AI-enabled systems in public communication
      has led regulators to demand clear disclosure of content provenance and AI involvement. But
      the effects of such disclosures remain uncertain. We test two disclosure approaches in their
      impact on an AI chatbot's persuasive appeal. In a preregistered experiment, 1,500 UK adults
      held a short conversation with a persuasive chatbot about one of 60 policy issues. The chatbot
      was identical for everyone. We randomized the disclosure that people received: nothing
      (control), a prominent disclosure that they were interacting with an AI (T1), or that
      disclosure plus the chatbot's persuasive intent and instructions (T2). The chatbot shifted
      attitudes by 12.6 points on a 100-point scale in the control group. The AI-identity disclosure
      was practically equivalent to no disclosure, with a 13.1-point shift, whereas the additional
      intent disclosure cut the persuasive effect roughly in half to 6.3 points. It also made
      participants view the campaign's methods as less acceptable and support stronger penalties
      against it. For direct chatbot interactions, transparency about AI identity alone does not
      meaningfully impact its influence. While current rules emphasize what a system is, our results
      show why the regulation of persuasive AI must also address what the system is trying to do."
