    abstract: Formal theorem-proving benchmarks enable mechanically verifiable evaluation of
      mathematical reasoning in large language models. However, existing benchmarks mainly focus on
      Olympiad-style problems and algebraic domains, leaving computational and applied mathematics
      underrepresented. We introduce CAM-Bench, a Lean 4 theorem-proving benchmark of 1,000 Lean
      proof targets in computational and applied mathematics, with coverage spanning optimization,
      numerical linear algebra, and numerical analysis. These problems are adapted from textbook
      exercises and often depend on locally introduced definitions, notation, algorithms, and
      elementary results. To construct CAM-Bench, we develop a dependency-recovery pipeline that
      reconstructs the local textbook context needed to state each problem faithfully. It then
      normalizes each problem into a standalone informal theorem and translates it into a Lean
      target. We validate the resulting formal problems through Lean compilation and semantic
      review, checking both formal correctness and semantic alignment with the original exercises.
      For each problem, we release the raw exercise, recovered context, normalized informal theorem,
