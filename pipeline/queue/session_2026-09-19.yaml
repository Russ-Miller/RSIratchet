    title: "Agentic LLM Planning via Step-Wise PDDL Simulation: An Empirical Characterisation"
    date: 2026-03-06
    url: https://arxiv.org/abs/2603.06064
    authors:
      - Kai Göbel
      - Pierrick Lorang
      - Patrik Zips
