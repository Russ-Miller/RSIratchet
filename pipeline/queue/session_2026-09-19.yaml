    abstract: Verifying multi-step reasoning in large language models is difficult due to imprecise
      error localization and high token costs. Existing methods either assess entire reasoning
      chains, suffering attention dilution, or rely on expensive multi-sampling. We introduce
      Node-wise Consistency Verification (NCV), a training-free framework that recasts verification
      as lightweight binary consistency checks at the node level. By decomposing the chain of
      thought into interconnected verification nodes, NCV precisely localizes errors and avoids
      unnecessary long-form generation. Experiments demonstrate that our approach enhances
      interpretability and efficiency, presenting a scalable solution for reliable LLM reasoning
      verification. On public datasets, NCV achieves a 10\% to 25\% improvement in F1 scores over
      baselines while utilizing $6\times$~$58\times$ fewer tokens than traditional methods like
      CoT-based verifiers.
