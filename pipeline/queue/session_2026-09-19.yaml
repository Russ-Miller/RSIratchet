    date: 2026-06-01
    url: https://arxiv.org/abs/2606.01610
    authors:
      - Haoben Huang
      - Shuxin Liu
      - Ou Wu
      - Di Gao
    abstract: "Single-edit updates in large language models can trigger ripple effects across local
      knowledge neighborhoods: desirable propagation to related facts and unintended perturbation of
      preserved ones. Existing methods address these two effects separately, without explicitly
      modeling their coupling. We challenge this separation through an analysis of ripple responses
      across typical baselines, identifying two coupled design pressures: editable-side coordination
      and preserved-side leakage. We propose Joint Neighborhood Optimization (JNO), a new
      knowledge-editing framework to formalize and jointly address both pressures at the
      target-planning stage. JNO instantiates this principle through Pressure-Aware Coordination
      (PAC), which jointly optimizes neighborhood target representations under coupled constraints,
      and a semantic pre-execution gate that rejects high-risk target plans before parameter
      execution. Experiments on RippleEdits show JNO improves propagation and preservation metrics
      by at least 7.0% while preserving cross-backbone editing stability."
