    title: Autoformalizer with Tool Feedback
    date: 2025-10-08
    url: https://arxiv.org/abs/2510.06857
    authors:
      - Qi Guo
      - Jianing Wang
      - Jianfei Zhang
      - Deyang Kong
      - Xiangzhou Huang
      - Xiangyu Xi
      - Wei Wang
      - Jingang Wang
    abstract: Autoformalization addresses the scarcity of data for Automated Theorem Proving (ATP) by
      translating mathematical problems from natural language into formal statements. Efforts in
      recent work shift from directly prompting large language models to training an end-to-end
      formalizer model from scratch, achieving remarkable advancements. However, existing formalizer
      still struggles to consistently generate valid statements that meet syntactic validity and
      semantic consistency. To address this issue, we propose the Autoformalizer with Tool Feedback
      (ATF), a novel approach that incorporates syntactic and consistency information as tools into
      the formalization process. By integrating Lean 4 compilers for syntax corrections and
      employing a multi-LLMs-as-judge approach for consistency validation, the model is able to
      adaptively refine generated statements according to the tool feedback, enhancing both
      syntactic validity and semantic consistency. The training of ATF involves a cold-start phase
