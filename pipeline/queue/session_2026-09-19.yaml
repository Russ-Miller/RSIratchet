    title: "Knowing the Facts but Choosing the Shortcut: Understanding How Large Language Models Compare
      Entities"
    date: 2025-10-19
    url: https://arxiv.org/abs/2510.16815
    authors:
      - Hans Hergen Lehmann
      - Jae Hee Lee
      - Steven Schockaert
