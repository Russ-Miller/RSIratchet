    abstract: Large language models increasingly act as partners in everyday communication. In these
      interactions, useful assistance may require not only answering, but also asking the right
      questions that surface knowledge gaps, assumptions, and alternatives. In this study, we refer
      to such epistemic question-asking as model curiosity, and introduce a theory-grounded taxonomy
      that distinguishes curiosity-oriented questions from generic model questioning. Across four
      conversation datasets, we find that curiosity-oriented questions remain rare (17-28% of all
      questions), but are associated with more exploratory and epistemically rich subsequent user
      responses, with varying patterns across datasets. We further conduct a human study to evaluate
      the usefulness of model curiosity, finding that curiosity can encourage exploration,
      especially in advice, creative, and research contexts. These findings have implications for
      building LLMs that ask more selectively to support deeper exploration and human-AI
      collaboration.
