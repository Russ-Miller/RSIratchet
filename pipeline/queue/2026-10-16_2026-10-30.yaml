    abstract: The success of large language models in real-world applications relies on
      parameter-efficient fine-tuning methods such as Low-Rank Adaptation (LoRA), which inserts
      compact, trainable adapters into selected layers. In this paper, we propose SimplexLoRA, a
      LoRA variant that adaptively adjusts adapter ranks during fine-tuning based on their learned
      importance. Unlike standard LoRA, which employs a fixed rank across all layers, SimplexLoRA
      optimizes per-adapter importance weights on the $n$-scaled simplex during a short warm-up and
      then freezes them, dynamically allocating capacity where it is most beneficial without
      increasing the overall parameter budget or inference cost. We evaluate SimplexLoRA across 12
      language understanding, summarization, and reasoning tasks using DeBERTaV3, BART-large, Llama
      3.1 8B, and Qwen3-8B. Our results show that SimplexLoRA consistently matches or outperforms
      standard LoRA and recent adaptive baselines, with the largest gains at low ranks. Our code is
      available at https://github.com/brain-lab-research/SimplexLoRA.
