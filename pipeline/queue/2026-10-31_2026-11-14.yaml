    abstract: "On-policy distillation (OPD) has emerged as an effective post-training approach to
      improving fine-grained perception in multimodal large language models by amortizing costly
      inference-time zooming operations into a single-pass recipe. However, vanilla OPD is
      inherently susceptible to linguistic momentum: the teacher can follow the student's erroneous
      prefixes, thus weakening corrective supervision. To address this, we propose Blink On-Policy
      Distillation (BlinkOPD), in which the teacher \"blinks\" at every token: it reads the same
      prefix once with its eyes open and once with its eyes closed. A first-glance gain further
      strengthens the correction on rollouts that conflict with the teacher. By extracting more
      effective supervision from each on-policy trajectory, BlinkOPD achieves state-of-the-art
      average performance across six fine-grained benchmarks using only 500 training images (12x
      less data) than existing OPD methods. Beyond fine-grained perception, BlinkOPD also
      demonstrates strong zero-shot improvements across ten held-out benchmarks spanning general
      visual perception, visual hallucination, and multimodal reasoning abilities. Code:
      https://github.com/Supltz/BlinkOPD"
