    abstract: "Lyapunov functions are the cornerstone of stability analysis for dynamical systems, yet
      synthesizing a symbolic form remains difficult as no universal constructive algorithm exists.
      To address this challenge, we introduce SLyM, a framework that harnesses the knowledge and
      reasoning of large language models (LLMs) to discover symbolic Lyapunov functions. To avoid
      charging the LLM with ill-suited numerical generation, SLyM decomposes the construction into
      structure proposal and coefficient optimization: the LLM draws on its prior knowledge of
      Lyapunov constructions to propose the function structure, whose coefficients then follow from
      a convex program. Local-search structures are folded back into supervision, extending coverage
      to systems missed by the initial proposer. Across all benchmarks, SLyM consistently
      outperforms the evaluated neural, sum-of-squares, and generative baselines."
