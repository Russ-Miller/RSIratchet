    abstract: Sharing research data is essential to promote transparency, enable reproducibility, and
      fuel scientific discoveries. To ensure consistent sharing, the National Institutes of Health
      (NIH) and other funding agencies require applicants to submit data management plans (DMPs)
      with their proposals. They aim to encourage researchers to consider their data management and
      sharing strategies early on. However, researchers often face challenges when developing DMPs
      due to a lack of knowledge about data-sharing practices. Here, we evaluated the performance of
      Large Language Models (LLMs) in drafting DMPs compliant with the 2023 NIH guidelines. The goal
      was to investigate whether LLM-supported DMP creation could reduce the burden on researchers
      and librarians. We compared Llama and GPT performance against NIH-provided DMP samples. We
      also asked domain experts to evaluate LLM-generated DMPs. Overall, we found that LLMs can
      accelerate the creation of initial drafts but still require expert review before submission to
      ensure clarity and completeness. Moreover, open-source LLMs may not be as ready off-the-shelf
      as commercial ones for drafting funder-compliant DMPs.
