    abstract: "Large-language model (LLM) agents execute actions on external systems through tool calls,
      and enterprises deploy runtime controls, such as agent gateways, to check this behavior in
      real time. However, a control can only evaluate the actions that cross the point where it is
      placed, and an agent can act through more paths than the tool-call channel; no existing work
      measures this coverage against kernel-level ground truth. In this paper, we present
      guardscope, a framework that makes this coverage measurable. guardscope works in two stages: a
      static stage that predicts which of an agent's 15 action paths a control can check from its
      source, and an empirical stage that runs a fixed workload on a deployment that realizes one of
      eight topology designs and classifies every executed action as checked, bypassed, or prevented
      by reconciling the control's decision records against kernel-level ground truth. guardscope
      makes a control's coverage claim verifiable: a runtime control developer can publish which
      paths its product inspects under a kernel-verified protocol. We conducted experiments with two
      agent harnesses and real runtime controls, including Microsoft's agent governance toolkit and
      agentgateway. guardscope is available at https://github.com/VulcanLab/guardscope."
