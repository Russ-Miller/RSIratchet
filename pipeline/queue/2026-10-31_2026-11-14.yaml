      invariant construction, mathematical proof, and the management of automated theorem provers.
      Although large language models (LLMs) can generate program code and proof fragments, reliably
      developing complete machine-checked verifications remains challenging: it requires an
      iterative process of constructing and validating specifications and invariants, building
      proofs, diagnosing solver failures, and optimizing verification performance. This paper
      presents a systematic ten-step workflow for LLM-assisted verification of scientific algorithms
      using the Dafny verification system. The workflow integrates algorithm formalization, contract
      development, empirical invariant validation, proof construction, bottleneck profiling, and
      resource-driven proof optimization. We applied the workflow using Antrhopic's Claude Opus 5
      and Opus 5.5 models, combining LLM-driven development with automated testing and verification
      feedback, while retaining human oversight for correctness-critical decisions and strategic
