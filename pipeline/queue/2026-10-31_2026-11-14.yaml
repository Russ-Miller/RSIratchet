      judges has received limited attention. We evaluate Jev against generative LLM judges on four
      multilingual benchmarks with human annotations, covering up to 47 language varieties and three
      evaluation formats: binary decisions, pairwise comparisons, and graded ratings. At
      approximately $1/31$ to $1/61$ of GPT-6.1's evaluation cost, Jev is competitive on most
