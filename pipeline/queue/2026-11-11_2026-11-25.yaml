      unclear due to the embodiment gap between humans and robots. We present EgoStudy, a
      systematic, controlled study of egocentric data for robot learning. Holding the robot dataset
      fixed, we vary the scale and diversity of egocentric data, data processing strategies, and
      co-training configurations. We investigate three questions: (1) Which data processing and
      pretraining choices most effectively exploit egocentric data? (2) Which components of robot
      action prediction benefit most from scaling these data? (3) How do scaling effects differ
      between vision-language-action models (VLAs) and world-action models (WAMs)? Our experiments
      yield three main findings. First, data diversity, alignment between trajectories, and detailed
      language annotations are key factors in effective transfer. Second, scaling egocentric data
      yields larger gains in predicting end-effector translation than in predicting fine-grained
      finger movements. Third, WAMs perform better when egocentric data are limited, whereas VLAs
      exhibit greater gains as the amount of egocentric data increases. Together, these findings
      provide practical guidance on processing and using egocentric data to train VLAs and WAMs,
      while clarifying the benefits and limitations of scaling these data."
