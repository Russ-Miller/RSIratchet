    abstract: Knowledge distillation transfers capabilities from large language models to smaller
      students, yet stronger teachers do not always yield better students. Recent studies report
      diminishing or even negative returns from teacher scaling. We hypothesize that these
      limitations arise in part from insufficient student capacity to absorb the teacher's
      knowledge. We therefore investigate loop and recurrent computation as a way to expand the
      student's effective capacity by modifying its computation graph while keeping the backbone
      parameter count fixed. Under teacher-forced KD during pretraining, weight-shared looping
      improves performance but retains teacher-size saturation, whereas cross-token recurrence
      avoids the observed reversal with larger teachers. In mathematical post-training under both
      teacher-forced KD and on-policy distillation (OPD), recurrent students scale better with
      increasing teacher size than looped and vanilla LLMs do. Crucially, we show that a pretrained
      LLM can be readily fine-tuned into a looped or recurrent architecture jointly with OPD,
      without repeating pretraining. Our recurrent Qwen model improves with larger teachers and
      consistently outperforms looped and vanilla LLMs. This suggests a new post-training paradigm
      that integrates architectural conversion into distillation, avoiding a separate conversion
      stage while substantially improving student performance and maintaining near-vanilla inference
      latency.
