      studies have shown that hidden CoTs can be reconstructed, existing methods typically require
      training a separate attacker for each target LLM. This paper studies model-agnostic CoT
      reconstruction, aiming to reconstruct hidden CoT traces from arbitrary target LLMs using only
      input prompts and visible final responses. We propose Final-Output Preference Learning (FOPL),
      which trains a single reconstruction model that generalizes to unseen LLMs without
      target-specific adaptation. To achieve this, the reconstruction model must learn which
      reasoning patterns match a given final response without knowing the target LLM's identity. We
      address this using preference optimization, training the reconstruction model to prefer native
