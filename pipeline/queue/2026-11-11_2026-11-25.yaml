    abstract: This paper addresses the challenge of scene-level memory design for efficient navigation
      across sessions and successive object goals. Recent methods commonly represent a scene using
      scene graphs or image--text records. However, dense scene-graph representations impose
      substantial reasoning and context overhead on multimodal large language models, while
      image--text records cannot be directly converted into executable geometric routes. To address
      these limitations, we propose SuperNav-1.5, an agentic navigation system equipped with a
      structured spatial memory constructed by the agent. The memory consists of an area-segmented
      occupancy map annotated with agent-maintained, map-grounded memory nodes. This map guides the
      agent toward unvisited areas and provides executable routes to known locations. For
      multi-session navigation, we introduce agent-guided relocalization, whereby the agent infers
      an area prior from current observations and stored memory records to constrain geometric
      matching and localize the robot within the stored map. Together, these designs enable
      efficient navigation across session and successive object goals. Experiments show that our
      method outperforms baselines on single-object, multi-object, and demand-driven navigation
      benchmarks, with particularly strong gains in path efficiency. Multi-session evaluation
      demonstrates that the constructed memory can be reused, while deployment on a real quadruped
      robot further shows the system's applicability.
