    abstract: Video generators can now render convincing short clips, yet complete audiovisual works
      require coordinating visuals, sound, and editing across multiple stages. Existing benchmarks
      focus on individual generators or video agents under narrower production settings, leaving
      end-to-end creation by general multimodal large language models (MLLMs) underexplored. We
      introduce StudioBench, a benchmark comprising 160 tasks across eight video genres and five
      task types, spanning diverse audiovisual production requirements. Models produce minutes of
      finished audiovisual content using 33 atomic generation, editing, and inspection tools,
      without shell access or workflow templates. We evaluate the delivered films, while analyzing
      reconstructed workflow graphs to characterize production behavior and diagnose failures.
      Across seven MLLMs, explicit requirements are nearly saturated, yet production quality varies
      substantially in picture clarity and composition, object structure, motion, and lip sync. All
      models spontaneously organize multi-stage production workflows without predefined templates.
      However, higher-quality models exhibit more selective production workflows, whereas additional
      tool calls alone show little association with quality. These findings identify the missing
      quality loop of effective inspection, selection, and revision as a key bottleneck in
      productive audiovisual creation.
