    abstract: "Civil infrastructure is designed, built, and maintained through engineering drawing sets,
      yet preparing and revising them remains labour-intensive and calls for automation. Multimodal
      large language models (MLLMs) are promising candidates, but assessing them requires a
      benchmark grounded in real engineering practice. We introduce CivilCADBench, a benchmark for
      understanding, reconstructing, and designing civil engineering drawing sets, built from real
      infrastructure drawings and source CAD files containing over 250,000 CAD entities. Unlike
      parametric 3D CAD models, these drawings are dense, layered, and multi-sheet; and since prints
      are lossy projections with no pixel trace of layers, a file can print correctly yet remain
      wrongly organised. CivilCADBench comprises three task families of increasing difficulty:
      understanding tasks are evaluated with 2,183 expert-reviewed questions ranging from single
      sheets to whole sets, while reconstruction and design tasks are agentic, requiring models to
      rebuild printed pages as editable CAD files, either as single pages or entire drawing sets,
