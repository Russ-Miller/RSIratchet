      treatments the records cannot verify. Numerical reinforcement learning strikes this balance
      during training. For large language models (LLMs), directly using sparse retrospective
      outcomes for fine-tuning raises challenges of delayed credit assignment and limited evidence
      for alternative treatments. We present R-LLMC, which strikes the balance at inference for
      sepsis resuscitation. A behaviour-supervised LLM, decoded into an exact distribution over 25
      vasopressor-fluid actions, proposes clinician-anchored candidates; an offline critic selects
      among them by estimated long-term value. The policy has a closed form for off-policy
