      preferences from LLMs with accessible CoTs, the reconstruction model learns to distinguish
      reasoning patterns based on visible responses. Experiments show that reconstructed CoTs
      capture distinct reasoning patterns across LLM families, including a family unseen during
      training. Moreover, students trained on reconstructed CoTs match or outperform those trained
