    abstract: "Time-series anomaly detection (TSAD) lacks a one-size-fits-all detector for heterogeneous
      data and anomaly types. Existing automation is limited by implicit objectives, potentially
      unreliable historical knowledge, or high computational costs. More fundamentally, it selects
      how to detect anomalies without explicitly defining what to detect. We propose SMAD, an
      LLM-based multi-agent framework that translates anomaly intent into executable, testable
      detection pipelines. Rather than selecting detectors against an implicit target, SMAD
      establishes a natural-language semantic contract grounded in measurable time-series
      properties, specifying target event patterns, expected score responses, and validation
      questions. This contract governs both detector construction and evaluation: LLM agents propose
      pipelines, while contract-matched synthetic interventions provide label-free evidence from the
      target series to assess semantic coverage and guide iterative self-refinement. A
