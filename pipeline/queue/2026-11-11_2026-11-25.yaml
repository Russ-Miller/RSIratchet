      seconds per run. To synthesize longer sequences, existing methods either rely on agentic
      systems following preset scripts, or roll out autoregressively from the previous clip's last
      frame, losing off-screen states and accumulating hallucinations across turns. Consequently,
      users still cannot take an explicit goal, choose how to accomplish it, and see that choice
      persist across subsequent clips. We study goal-grounded interactive video generation, where
      one goal admits multiple valid approaches, the user's chosen approach must be executed on
      screen, and its consequences must persist across clips. To this end, we propose CineAct, a
