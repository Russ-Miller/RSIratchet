      both on correct compliance and on task performance, developing four deterministic mechanisms
      for determining per-phase success on a large subset of the dataset. Our evaluation reveals
      that none of the existing frontier models effectively navigate helping with safe requests and
      refusing risky ones, characterized by being overly-cautious. On the other hand, recent
      open-weight models rarely refuse and demonstrate strong validated accuracy on risky requests."
