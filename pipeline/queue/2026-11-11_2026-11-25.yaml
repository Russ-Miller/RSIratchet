    abstract: 'Reinforcement learning (RL) improves large language model search agents by up to 32
      exact-match (EM) points over their pre-RL initializations, yet overall accuracy gains do not
      identify which underlying functional capabilities improve or interact during training. We
      introduce CO-GRAFT, a reward-agnostic interventional attribution framework in which an
      RL-trained agent and its pre-RL initialization jointly generate a single trajectory under
      closed-loop execution with live retrieval. Each policy controls a mutually exclusive subset of
      four functional roles: intermediate reasoning, search-or-answer decision, search query
      generation, and final answer extraction. Evaluating all 2^4=16 role assignments without
      modifying weights or retraining defines a cooperative game whose Shapley values decompose the
      total RL gain across roles, while M"obius interaction terms distinguish standalone role
      improvements from multi-role coupling. Applying CO-GRAFT to Search-R1 agents across Qwen2.5
      and Llama-3.2 models (spanning two sizes, base and instruction-tuned initializations, GRPO and
      PPO optimizers, and NQ and HotpotQA datasets), we show that query generation never exceeds 15%
      of the total gain; instead, gains are governed by pre-RL answer validity, search retention,
      model scale, and fixed task-level search budgets, shifting credit from reasoning toward answer
      extraction in larger or well-formatted answer response checkpoints while smaller base models
      rely on reasoning--decision coupling.'
