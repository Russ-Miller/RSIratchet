    abstract: Treating independent layers as the minimal pruning unit allows layer pruning to
      efficiently eliminate many redundant parameters and achieve high compression rates. Layer
      pruning has become a promising and prevalent structured pruning technique for large language
      models (LLMs). However, multi-layer removal can lead to significant performance degradation
      for LLMs. Although some works have explored various compensation methods for pruned layers,
      they are inefficient and costly. Observing that the expression of a large proportion of
      information is concentrated on a small number of pivotal channels, we propose a novel
      post-pruning compensation method for layer pruning, called pivotal channel compensation (PCC).
      PCC can achieve significant performance improvement by compensating for a small number of
      channels through learnable linear transformations at the pruning interface. Besides, we
      propose a new evaluation metric, called channel-wise average performance improvement (CAPI),
      which can measure the efficiency of channel-wise compensation. Our experimental results across
      various LLMs demonstrate that PCC can achieve significant and consistent improvements and high
      CAPI on language modeling and zero-shot question answering for the state-of-the-art
      cross-layer and consecutive-layer pruning methods. Compared with existing compensation
      methods, PCC can achieve competitive results with fewer additional parameters and less
      training cost.
