      hyperparameters chosen before training begins, while researchers tune hyperparameters across
      consecutive runs. We introduce Population-Based Post-Training (PBPT), which trains several
      models in parallel and lets the training process do the tuning through population-based
      training. PBPT periodically evaluates models on a validation set. High-performers are
      duplicated and their hyperparameters perturbed to explore new configurations. Low-performers
      stop training and are replaced by these copies. On reasoning benchmarks (Enigmata, Nemotron)
