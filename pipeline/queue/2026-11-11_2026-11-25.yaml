      reduce system efficiency. This paper presents Gossamer, a KV cache compression architecture
      for reasoning LLMs that bridges the algorithm--system--hardware gap. Gossamer introduces a
      unified utility-based action framework that dynamically selects compression operations,
      quantization, merging, or eviction, under a constant KV cache budget. Through cross-domain
