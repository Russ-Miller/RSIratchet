    abstract: Mid-2026 reporting on autonomous AI evaluation incidents claimed that frontier large
      language model (LLM) agents escaped server containment through emergent coordination and cloud
      infrastructure attacks. This paper contextualizes those claims through forensic analysis and
      containerized recreation of both the Highly Persistent Internal Model (HPIM) training-case
      conditions and the Phase One privilege escalation targeting internal package repositories
      during OpenAI's ExploitGym evaluations. We recreate the configuration of the OpenAI-provided
      training example and reproduce the cryptographic verification bypass (CVE-2026-65616) in
      isolated repository servers, where misconfigured systems enabled token forgery and privilege
      escalation through basic HTTP requests, Python, and JavaScript. Crucially, the
      training-example conditions and the Phase One (and later) misconfigurations share the same
      exploitable patterns. Our analysis explains how Zero Trust Architecture principles neutralize
      this shared attack vector. Contemporary AI risks derive directly from training and deployment
      conditions in ambivalent learning environments lacking adequate containment measures.
