    abstract: "Autoregressive multimodal large language models (MLLMs) suffer from error snowballing: a
      single incorrect inference early in a chainof-thought (CoT) trace corrupts all downstream
      reasoning. We find that in state-of-the-art open-source MLLMs, once the first error occurs,
      the reasoning cascades into failure across all remaining steps in 65% of such cases (a metric
      we term the snowball rate). Existing mitigations-sampling multiple chains, post-hoc
      self-verification, or full program synthesis-either lack symbolic grounding, catch errors too
      late, or sacrifice the flexibility of natural language reasoning. We propose
      Constraint-Anchored Reasoning Traces (CART), a neuro-symbolic framework that trains MLLMs to
      interleave natural language reasoning steps with symbolic constraint assertions: lightweight,
      machine-checkable statements about visual content (e.g., count(red_objects) = 3). A
      dual-pronged Constraint Propagation Module-combining a learned neural grounding head with
