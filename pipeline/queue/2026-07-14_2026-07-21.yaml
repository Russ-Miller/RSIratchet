      hallucination. We argue that these failures stem from a fundamental limitation: language
      models lack an explicit representation of the person beyond the context they are given, which
      we term as the \\textbf{Severance Problem}. Even with rich personal context and strong
      commonsense reasoning capabilities from the backbone model, current AI assistants fail to
      represent what remains unknown about the user. We propose a simple solution: incorporating
      structured ignorance into the language model context via the \\textbf{Severance Schema}, which
      explicitly outlines dimensions along which the model lacks knowledge about the user, including
      physicality, temporality, consequences, continuity, multiplicity, and interiority.
      Empirically, across five model families, with the Severance Schema, the assistant consistently
      reduces sycophancy, harmful advice, and hallucination. Notably, models with the schema ask
      clarifying questions when information about the user is missing, rather than confidently
      extrapolating from incomplete user information."
