      they typically lack explicit mechanisms to assess execution stability and to recover when
      execution deviates from its nominal behavior. In this paper, we propose: (1) two complementary
      metrics to assess execution quality at runtime, and (2) an agentic reinforcement learning
      framework that learns to restore effective execution through high-level decision-making rather
      than directly learning low-level actions. In this framework, an agentic policy reasons over
      recent execution history and selects among a small set of execution modes to regulate the
