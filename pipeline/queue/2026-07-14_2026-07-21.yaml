    abstract: "Building capable embodied agents requires not only multimodal perception and
      understanding, but also agentic capabilities for reasoning about actions, adapting to evolving
      situations, and interacting with the physical world. In this report, we introduce
      Hy-Embodied-VLM-1.0, an efficient and powerful embodied foundation model specifically designed
      for embodied agents operating in the physical world. To cultivate such capabilities from the
      pre-training stage onward, we define an action-centric capability taxonomy comprising three
      progressive dimensions: Action-Relevant State Understanding, Action-Transition Reasoning, and
      Sequential and Adaptive Reasoning. Guided by this taxonomy, we develop a systematic data
      pipeline and curate data mixtures spanning both pre-training and post-training. To deliver
      strong physical-world understanding and interaction capabilities while supporting
      latency-sensitive deployment, we build our model on the Hy3-A3B language backbone and the
      Hy-ViT2 vision encoder. Its efficient Mixture-of-Experts architecture combines strong model
