    abstract: "Automated Program Repair (APR) has benefited from the code understanding and generation
      capabilities of Large Language Models (LLMs). Existing feedback-based APR methods iteratively
      refine candidate patches using test execution feedback and have shown promising results.
      However, most rely on outcome-level failure symptoms, such as stack traces, which show how
      failures are observed but fail to expose the intermediate runtime states critical for
      root-cause analysis. As a result, LLMs often infer bug causes without sufficient runtime
      evidence, leading to incorrect patches. To address this limitation, we propose DebugRepair, a
      self-directed debugging framework for LLM-based APR. DebugRepair enhances patch refinement
      with intermediate runtime evidence collected through simulated debugging. It consists of three
      components: test semantic purification, simulated instrumentation, and debugging-driven
      conversational repair. Together, they reduce noisy test context, collect runtime traces
      through targeted debugging statements with rule-based fallback, and progressively refine
      candidate patches using prior attempts and newly observed runtime states. We evaluate
