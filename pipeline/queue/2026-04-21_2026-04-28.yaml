      current MoE-LoRA method fails to explicitly match input semantics with expert capabilities,
      leading to weak expert specialization. (2)Uniform weight fusion strategies struggle to provide
      adaptive update strengths, overlooking the varying complexity of different tasks. To address
      these limitations, we propose SAMoRA (Semantic-Aware Mixture of LoRA Experts), a novel
      parameter-efficient fine-tuning framework tailored for task-adaptive learning. Specifically, A
      Semantic-Aware Router is proposed to explicitly align textual semantics with the most suitable
