    abstract: Large Language Models (LLMs) often fail to utilize their latent reasoning capabilities due
      to a distributional mismatch between ambiguous human inquiries and the structured logic
      required for machine activation. Existing alignment methods either incur prohibitive $O(N)$
      costs by fine-tuning each model individually or rely on static prompts that fail to resolve
      query-level structural complexity. In this paper, we propose ReQueR (\textbf{Re}inforcement
      \textbf{Que}ry \textbf{R}efinement), a modular framework that treats reasoning elicitation as
      an inference-time alignment task. We train a specialized Refiner policy via Reinforcement
      Learning to rewrite raw queries into explicit logical decompositions, treating frozen LLMs as
      the environment. Rooted in the classical Zone of Proximal Development from educational
      psychology, we introduce the Adaptive Solver Hierarchy, a curriculum mechanism that stabilizes
      training by dynamically aligning environmental difficulty with the Refiner's evolving
