    abstract: "Despite the impressive capabilities of large language models, their substantial
      computational costs, latency, and privacy risks hinder their widespread deployment in
      real-world applications. Small Language Models (SLMs) with fewer than 10 billion parameters
      present a promising alternative; however, their inherent limitations in knowledge and
      reasoning curtail their effectiveness. Existing research primarily focuses on enhancing SLMs
      through scaling laws or fine-tuning strategies while overlooking the potential of using agent
      paradigms, such as tool use and multi-agent collaboration, to systematically compensate for
      the inherent weaknesses of small models. To address this gap, this paper presents the first
      large-scale, comprehensive study of <10B open-source models under three paradigms: (1) the
      base model, (2) a single agent equipped with tools, and (3) a multi-agent system with
      collaborative capabilities. Our results show that single-agent systems achieve the best
      balance between performance and cost, while multi-agent setups add overhead with limited
      gains. Our findings highlight the importance of agent-centric design for efficient and
      trustworthy deployment in resource-constrained settings."
