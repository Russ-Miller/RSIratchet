    abstract: "Vision-Language Models (VLMs) are frequently undermined by object
      hallucination--generating content that contradicts visual reality--due to an over-reliance on
      linguistic priors. We introduce Positive-and-Negative Decoding (PND), a training-free
      inference framework that intervenes directly in the decoding process to enforce visual
      fidelity. PND is motivated by our key finding of a critical attention deficit in VLMs, where
      visual features are empirically under-weighted. Our framework corrects this via a dual-path
      contrast: The positive path amplifies salient visual evidence using multi-layer attention to
      encourage faithful descriptions, directly counteracting the attention deficit. Simultaneously,
      the negative path identifies and degrades the core object's features to create a strong
      counterfactual, which penalizes ungrounded, prior-dominant generation. By contrasting the
      model's outputs from these two perspectives at each step, PND steers generation towards text
      that is not just linguistically probable, but visually factual. Extensive experiments on
      benchmarks like POPE, MME, and CHAIR show that PND achieves state-of-the-art performance with
      up to 6.5% accuracy improvement, substantially reducing object hallucination while also
      enhancing descriptive detail--all without requiring any model retraining. The method
      generalizes effectively across diverse VLM architectures including LLaVA, InstructBLIP,
      InternVL, and Qwen-VL."
