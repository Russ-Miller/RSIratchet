      Tree-of-Writing (ToW), to resolve the implicit inconsistency often found when LLM-as-a-judge
      aggregates all sub-features in text evaluation. ToW incorporates a tree-structured workflow by
      explicitly modeling the aggregation weights of sub-features. We also present HowToBench, a
      large-scale Chinese writing benchmark encompassing 12 genres and 1302 instructions across
      three task categories: contextual completion, outline-guided writing, and open-ended
      generation. ToW successfully mitigates the biases, achieving a 0.93 Pearson correlation with
      human judgments. Furthermore, we detect that both overlap-based text generation metrics and
      popular LLM-as-a-judge practices are vulnerable to textual disturbances, while ToW is robust
      to them. We also uncover a negative correlation between input length and content-related
      scores in the Guide task, showcasing that it cannot be simply improved by input-side
      information piling."
