      intrinsic information heterogeneity along reasoning chains. We show that this coarse-grained
      credit assignment leads to premature entropy collapse and encourages the model to generate
      redundant, low-quality reasoning paths. Through systematic empirical analysis, we identify
      Critical Decision Pivots (CDPs): transient high-entropy states where the policy's trajectory
      is most sensitive to perturbations. These pivots represent the \"forks in the road\" where
      effective multi-path exploration is most crucial yet often suppressed by uniform advantage
      signals. Building on these insights, we propose Entropy-Regulated Policy Optimization (ERPO),
