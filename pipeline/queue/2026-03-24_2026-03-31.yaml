      While Large Language Models (LLMs) offer a training-free alternative, they often struggle with
      structural ambiguity, failing to distinguish between similar components like Claims and
      Premises. Furthermore, single-agent self-correction mechanisms often suffer from sycophancy,
      where the model reinforces its own initial errors rather than critically evaluating them. We
      introduce MAD-ACC (Multi-Agent Debate for Argument Component Classification), a framework that
      leverages dialectical refinement to resolve classification uncertainty. MAD-ACC utilizes a
      Proponent-Opponent-Judge model where agents defend conflicting interpretations of ambiguous
      text, exposing logical nuances that single-agent models miss. Evaluation on the UKP Student
