      with merge, hierarchical supervisor-worker and reflexive self-correcting loop. These are
      evaluated across five frontier and open-weight LLMs on a corpus of 10,000 SEC filings (10-K,
      10-Q and 8-K forms). Our evaluation spans 25 extraction field types covering governance
      structures, executive compensation and financial metrics, measured along five axes:
      field-level F1, document-level accuracy, end-to-end latency, cost per document and token
