    abstract: "An essential problem in artificial intelligence is whether LLMs can simulate human
      cognition or merely imitate surface-level behaviors, while existing datasets suffer from
      either synthetic reasoning traces or population-level aggregation, failing to capture
      authentic individual cognitive patterns. We introduce a benchmark grounded in the longitudinal
      research trajectories of 217 researchers across diverse domains of artificial intelligence,
      where each author's scientific publications serve as an externalized representation of their
      cognitive processes. To distinguish whether LLMs transfer cognitive patterns or merely imitate
      behaviors, our benchmark deliberately employs a cross-domain, temporal-shift generalization
      setting. A multidimensional cognitive alignment metric is further proposed to assess
      individual-level cognitive consistency. Through systematic evaluation of state-of-the-art LLMs
