      similarities. In this work, we introduce an analogical reasoning benchmark called Abstraction
      and Reasoning Corpus of ANAlogy (ARCANA). The tasks of ARCANA require performing far
      analogical mappings from real-world objects or physical phenomena to abstract grid-based
      transformations, different from the well-known ARC-AGI benchmark which primarily emphasized
      innate human priors. We validate ARCANA through a human study, demonstrating that humans solve
      these tasks reliably. In contrast, evaluations across a range of large language models show a
      distinct performance gap compared to humans, revealing systematic failure modes that remain
      challenging for current models. To address this gap, we propose ConceptSIR, a reasoning
      framework based on concept slippage, introspection, and reflection. Experiments demonstrate
      that ConceptSIR enables standard LLMs to solve several challenging ARCANA tasks that were
      unsolved by direct prompting in our evaluation. Overall, our results suggest that far
      analogical reasoning remains an open problem for contemporary LLMs. All the materials are
      available at sites.google.com/view/arcanacogtest. The complete codebase, including benchmark,
