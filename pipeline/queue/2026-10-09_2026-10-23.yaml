      built on autoregressive (AR) language models and inherit left-to-right decoding in planning
      and long-form writing. We present DiffResearch, an open multi-agent deep research framework
      that places a diffusion language model (dLLM) at the core of every stage, and measure how a
      diffusion backbone changes latency and report quality. Holding the agentic scaffold, retrieval
      code, prompts, and evaluation fixed, we swap the backbone between an open diffusion model and
      a comparable AR model. Across 100 Deep Research Bench tasks, the diffusion backbone is roughly
      6 times faster end-to-end, driven by order-of-magnitude reductions in planning and writing. We
      further introduce dFast, a decomposition mode that reads intermediate denoising states and
      extracts subqueries before generation finishes, providing a 1.99 times median speedup for
