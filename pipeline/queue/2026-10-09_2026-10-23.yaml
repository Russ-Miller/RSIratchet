    abstract: "Agentic systems have demonstrated strong capabilities on complex tasks by enabling
      multiple interacting large language model (LLM)-based agents to collaborate and execute
      subtasks in parallel. However, this collaborative structure introduces new challenges for
      reliably evaluating and diagnosing system failures, particularly failure attribution: tracing
      a system's execution to identify the agent step responsible for an incorrect final outcome.
      Because manually performing this task is time- and labor-intensive, recent work has turned to
      LLMs as judges to automate the process, referred to as automated failure attribution (AFA).
      These approaches assume that a sufficiently capable model can infer the failing step directly
      from an interaction transcript. In practice, however, direct prompting often performs poorly,
      which motivates follow-up work that explores various ways to improve AFA performance,
      including alternative prompting strategies and inference-time interventions. In this paper, we
