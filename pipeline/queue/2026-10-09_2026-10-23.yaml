      reasoning and precise action generation. However, when it comes to a specific agentic task,
      they have no internalized knowledge of how that particular environment unfolds. A world model
      offers a natural remedy, providing the agent with environment specific knowledge by foreseeing
      how the environment will respond to the action it is about to take. Prior world models for LLM
      agents mainly predict next observations at each step, which is costly and often uninformative
      because individual observations provide limited task-relevant guidance and not every step
      requires call for foresight. This raises a key question: what a world model should predict and
      when should it be invoked for agentic tasks? Our pilot study suggests that world model
      guidance is most useful when it anticipates pitfalls within a bounded multi-step future.
