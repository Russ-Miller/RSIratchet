    abstract: Reinforcement learning with verifiable rewards (RLVR), particularly through group-relative
      policy optimization (GRPO), has emerged as a central paradigm for the post-training of large
      language models (LLMs). While RLVR is highly effective at enhancing the reasoning capabilities
      of LLMs, it commonly induces \textit{distribution sharpening}, whereby the policy distribution
      becomes excessively peaked and rare-yet-correct trajectories are progressively suppressed,
      thus diminishing sample diversity. To this end, we promote flat-reward optima in RLVR to
      smooth the policy distribution. We theoretically link flat reward RLVR to reduced distribution
      sharpening, and empirically show improved sample diversity while maintaining single-attempt
      accuracy. Our method, called \texttt{Flat}-RLVR, searches for flat reward regions via
      sharpness-aware minimization during LLM post-training, combining this with GRPO variants to
      achieve better trade-offs between sampling efficiency and reasoning capacity.
