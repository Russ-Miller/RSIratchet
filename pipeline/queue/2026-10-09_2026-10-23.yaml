    abstract: "Benchmark performance is the dominant standard for comparing large language models
      (LLMs), typically summarized by a single aggregate score, such as accuracy, pass rate, or
      rubric score. This aggregate score provides limited information about a model's underlying
      capabilities, yet understanding these capabilities is crucial for model development and
      evaluation. To this end, we propose Tree-Induced Diagnostic Evaluation (TIDE), which recasts
      diagnostic evaluation as behavior-driven decision-tree induction to perform fine-grained
      capability diagnosis. TIDE recursively builds a hierarchical capability tree from benchmark
      samples and model scores: at each node, an LLM judge proposes candidate splits and performs
      sample-to-group classification, and behavior-based information gain selects among them. We
      apply TIDE to five models across four benchmarks to demonstrate its effectiveness, and find
      fine-grained capability contrasts invisible at the aggregate level: Claude Opus 4.6 achieves
      100% on microeconomic market reasoning where GPT-5.4 scores 83.3%, but trails GPT-5.4 on
      contract law reasoning with 77.8% versus 88.9%. We hope TIDE can be extended to past and
      future benchmarks so that the rich behavioral signal in evaluation results is fully leveraged
      for understanding model capabilities."
