    venue: arXiv (Cornell University)
    topic: Merger and Competition Analysis
    cited_by_count: 0
    abstract: "Evaluations of large language model (LLM) agents report that pricing agents collude at
      others' expense. Yet collusion is defined by enforcement: a cartel, in which competitors share
      monopoly profits, holds only if a member who cheats is punished. We introduce an audit that
      tests enforcement by forcing a member to cheat in counterfactual copies of a market, and use
      it to study what reinforcement learning (RL) teaches agents in pricing and trading. Small LLMs
      trained by RL learn what their training rivals reward, but only what they readily try. In
      self-play, they learn fixed rules ignoring their rivals; against a punishing rival, to be
      deterred; against a cheating rival, to match its cuts, never the costly price war that would
      deter it, which they rarely try. A war forced into training is learned, but mostly only where
      it was forced. Against their own copies, deterred and matching agents can earn the same cartel
      profits, but only matching ones can enforce them, and then thinly: as a by-product and only
      against large cuts. Q-learners enforce collusion only in pricing. Prompted LLMs reach
      cartel-like outcomes mostly through rules that ignore the market. Outcome measures cannot tell
      these cases apart; the audit can."
