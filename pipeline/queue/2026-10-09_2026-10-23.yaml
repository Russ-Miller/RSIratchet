    abstract: "Large audio-language models (LALMs) understand music, yet struggle to locate a described
      moment in time. We ask whether this reflects missing temporal information or a bottleneck in
      how the time span is extracted. Using a paired-query probe built from Slakh2100 stem
      activations, we attach a state query (e.g., ``only piano and bass are playing'') and a change
      query (e.g., ``the guitar drops out, leaving piano and bass'') to the same span and vary how
      much preceding audio the model is shown. Across frozen LALMs, three ways of extracting the
      span ask different questions: full-track prompting asking whether the model can say when;
      windowed yes/no scoring asking whether it verifies the moment when handed the segment, and
      whether it needs what came before; attention asking whether it can find the moment on its own.
      State queries score above baseline without context, while change queries improve with
      preceding context in most short-segment models; 30s padded encoders show no comparable
      recovery. Prompting and attention expose almost none of this. Prompting failures thus
      understate what LALMs can verify, though not what they can locate, by an amount set by query
      type and encoder."
