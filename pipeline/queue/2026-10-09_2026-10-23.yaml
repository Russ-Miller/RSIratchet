    abstract: "While agentic reinforcement learning (RL) has emerged as a promising paradigm for
      training small language models (SLMs), existing frameworks are predominantly tool-centric and
      struggle with data-centric environments. Specifically, applying tool-centric frameworks to
      stateful tasks like SQL debugging introduces severe spatial inefficiencies since proper
      environment isolation typically requires a separate database container per rollout. Naively
      reusing databases without tracking evolving states across multi-turn interactions causes
      trajectory contamination and cross-trajectory interference, which severely destabilizes policy
      updates. To overcome these bottlenecks, we introduce BIRD-RL, a novel four-stage agentic RL
      curriculum that alternately enhances foundational agent reasoning and trajectory-adaptive
      on-policy exploration to circumvent the instability inherently associated with direct
      end-to-end learning. Crucially, to support this curriculum, BIRD-RL is driven by a
      Trajectory-scoped Persistent Execution Infrastructure, which enables safe database replica
      reuse while preserving trajectory isolation. This design improves spatial RL efficiency by
