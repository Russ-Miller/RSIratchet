      (DT) representations to surgical video. Specifically, SurgReasonSeg constructs DT
      representations from surgical foundation models and trains two low-rank adapters (LoRA) of one
      large language model with reinforcement learning (RL), each specialized for a different query
      complexity. A lightweight router, also trained with RL, selects between the two adapters to
      balance latency against accuracy. SurgReasonSeg also sets the temporal context with an
