      costly to deploy. We present GoiBERT, a family of two compact Vietnamese encoders with 26M and
      49M parameters that operate directly on raw text. GoiBERT learns from two complementary
      teachers. A same-tokenizer Vietnamese encoder first teaches general-purpose representations. A
      much larger teacher then provides task-level guidance through soft labels that are generated
      without ever labeling its own training data. Across eight benchmarks covering text
      classification, aspect-based sentiment analysis, natural language inference, and named entity
      recognition, GoiBERT-large achieves the highest average score among non-teacher models. It
