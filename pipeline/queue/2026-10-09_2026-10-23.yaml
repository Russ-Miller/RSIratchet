      original full-precision model on fixed response sequences. However, the resulting low-bit
      quantized models still struggle on long-horizon reasoning tasks and often fail to terminate
      within a token budget that suffices for the full-precision model. We identify two challenges
      in closing this gap. First, fixed-response supervision leaves a mismatch between training
      prefixes and those encountered during student generation, and this trajectory divergence grows
      as responses lengthen. Second, on its own prefixes, the student underpredicts some next-token
