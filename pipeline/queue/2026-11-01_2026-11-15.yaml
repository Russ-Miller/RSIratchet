    title: "Mach2: Scientific Discovery Platform with Deterministic Execution Constraints"
    date: 2026-11-10
    arxiv_id: "2611.14777"
    doi: https://doi.org/10.48550/arxiv.2611.14777
    authors:
      - Vansh Sharma
      - Venkat Raman
    venue: arXiv (Cornell University)
    topic: Scientific Computing and Data Management
    cited_by_count: 0
    abstract: "Language-model agents can formulate workflows and invoke specialized tools, yet
      compliance with natural-language operating rules is not guaranteed by prompting alone. Mach2
      addresses this limitation by coupling Eigen orchestration to deterministic, lint-like checks
      of tool requests, source changes, acceptance tests, and artifact contracts. Domain
      requirements are represented as executable predicates: mandatory failures prevent advancement
      of the checked operation, while diagnostic findings are retained for correction or review.
      User-specified test-driven development (TDD), CodeGrapher's abstract-syntax-tree analysis, and
      history-guided evolutionary search provide complementary verification and optimization
      mechanisms. Mach2 also generates task-specific agent packages for execution through
      independently selected endpoints. The originating harness validates returned artifacts against
      declared interfaces and evidence requirements without assuming continuous supervision of the
      remote run. Model-internal-knowledge (MIK) dependencies are recorded separately from
      source-grounded and test-supported findings. This paper formalizes the rule-gated execution
      model and the agent-package lifecycle, and proposes measurable criteria for evaluating rule
      compliance, engineering validity, and cross-endpoint task continuity."
