    abstract: "Multimodal large language models (MLLMs) have become a key interface for visual reasoning
      and grounded question answering, yet they remain vulnerable to visual hallucinations, where
      generated responses contradict image content or mention nonexistent objects. A central
      challenge is that hallucination is not always caused by a simple lack of visual attention: the
      model may still assign substantial attention mass to image tokens while internally drifting
      toward an incorrect answer. In this paper, we show that the high-frequency structure of visual
      attention, measured by layer-wise Laplacian energy, reveals both the layer where hallucinated
      preferences emerge and the layer where the ground-truth answer transiently recovers. Building
      on this finding, we propose LaSCD (Laplacian-Spectral Contrastive Decoding), a training-free
      decoding strategy that selects informative layers via Laplacian energy and remaps next-token
      logits in closed form. Experiments on hallucination and general multimodal benchmarks show
      that LaSCD consistently reduces hallucination while preserving general capabilities,
      highlighting its potential as a faithful decoding paradigm. The code is available at
      https://github.com/macovaseas/LaSCD."
