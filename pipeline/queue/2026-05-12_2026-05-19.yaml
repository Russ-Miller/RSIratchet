      interactions, with two method directions providing this capability: long-context LVLMs and
      memory-augmented agents. However, no existing benchmark conducts a systematic comparison of
      the two on questions that genuinely require multimodal evidence. To close this gap, we
      introduce MEMLENS, a comprehensive benchmark for memory in multimodal multi-session
      conversations, comprising 789 questions across five memory abilities (information extraction,
      multi-session reasoning, temporal reasoning, knowledge update, and answer refusal) at four
      standard context lengths (32K-256K tokens) under a cross-modal token-counting scheme. An
