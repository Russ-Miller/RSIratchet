    abstract: We introduce \textsc{Cattle Trade, a multi-agent benchmark for evaluating large language
      models (LLMs) as agents in strategic reasoning under imperfect information, adversarial
      interaction, and resource constraints. The benchmark combines auctions, hidden-offer trade
      challenges (TCs), bargaining, bluffing, opponent modeling, and resource allocation within a
      single long-horizon game lasting 50--60 turns. Unlike prior agent benchmarks that test these
      abilities in isolation, \textsc{Cattle Trade} evaluates whether agents integrate them across a
      competitive, multi-agent economic game with conflicting incentives. The benchmark logs every
      bid, TC offer, counteroffer, and card selection, enabling behavioural analysis beyond final
      scores or win rates. We evaluate seven cost-efficient language models and three deterministic
      code agents across 242 games. Strategic coherence, in particular spending efficiency, resource
      discipline, and phase-adaptive bidding, is associated with rank more strongly than spending
      volume or any single subskill. Two heuristic code agents outperform most tested LLMs, and
      behavioural traces surface recurring LLM failure modes including overbidding, self-bidding,
      bankrupt TC initiation, and weak opponent-state adaptation. Evaluating agentic competence
      requires benchmarks that test the joint deployment of multiple capabilities in multi-agent
      environments with conflicting incentives, uncertainty, and economic dynamics.
