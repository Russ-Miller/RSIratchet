      conversations grow, whereas memory agents are length-stable but lose visual fidelity under
      storage-time compression. Multi-session reasoning caps most systems below 30%, and neither
      approach alone solves the task. These results motivate hybrid architectures that combine
      long-context attention with structured multimodal retrieval. Our code is available at
      https://github.com/xrenaf/MEMLENS."
