    abstract: In this paper, we propose Concentrate and Concentrate (CaC), a coarse-to-fine anomaly
      reward model based on Vision-Language Models. During inference, it first conducts a global
      temporal scan to anchor anomalous time windows, then performs fine-grained spatial grounding
      within the localized interval, and finally derives robust judgments via structured
      spatiotemporal Chain-of-Thought reasoning. To equip the model with these capabilities, we
      construct the first large-scale generated video anomaly dataset with per-frame bounding-box
      annotations, temporal anomaly windows, and fine-grained attribution labels. Building on this
      dataset, we design a three-stage progressive training paradigm. The model initially learns
      spatial and temporal anchoring through single- and multi-frame supervised fine-tuning, and
