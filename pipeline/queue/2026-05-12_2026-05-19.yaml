    abstract: "Reinforcement learning (RL) has demonstrated potential for enhancing reasoning in large
      language models (LLMs). However, effective RL training, which requires medium-difficulty
      training samples, faces two fundamental challenges: Effective Data Scarcity and Dynamic
      Difficulty Shifts, where medium-difficulty samples are scarce and become trivial as models
      improve. Existing methods mitigate this scarcity to some extent by generating training
      samples. However, these approaches suffer from anchor-free generation, ignoring co-evolution,
      and difficulty mismatch. To address these issues, we propose D$^2$Evo, a Dual Difficulty-aware
      self-Evolution RL framework. In each iteration, our method mines medium-difficulty anchors
      based on the current Solver's capability, trains the Questioner to generate diverse questions
      at appropriate difficulty levels, and jointly optimizes both components to enable progressive
      reasoning gains. Extensive experiments demonstrate that D$^2$Evo outperforms existing methods
      on mathematical reasoning benchmarks with fewer than 2K real mathematical samples, and
