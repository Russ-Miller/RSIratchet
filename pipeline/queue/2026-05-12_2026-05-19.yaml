    abstract: "Large language models remain vulnerable to adversarial prompts that elicit harmful
      outputs. Existing safety paradigms typically couple red-teaming and post-training in a closed,
      policy-centric loop, causing attack discovery to suffer from rapid saturation and limiting the
      exposure of novel failure modes, while leaving defenses inefficient, rigid, and difficult to
      transfer across victim models. To this end, we propose EvoSafety, an LLM safety framework
      built around persistent, inspectable, and reusable external structures. For red teaming,
      EvoSafety equips the attack policy with an adversarial skill library, enabling continued
      vulnerability probing through simple library expansion after saturation, while supporting the
      evolution of adversarial vectors. For defense learning, EvoSafety replaces model-specific
