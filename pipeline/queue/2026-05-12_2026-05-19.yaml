      general reasoning, their embodied spatial intelligence remains hampered by a \"Cartesian
      Illusion\" - a reliance on text-based probability distributions that lack grounded, 3D
      topological understanding. This limitation is starkly exposed in multi-agent environments,
      which demand more than just scene perception; they require second-order Theory of Mind (ToM).
