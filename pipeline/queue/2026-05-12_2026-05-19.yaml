    abstract: Optical character recognition (OCR) and multilingual scene-text understanding remain
      challenging for multimodal large language models (MLLMs), particularly in real-world images
      containing small or degraded text, cluttered layouts, occlusion, handwriting, and complex
      typography. We present an OCR-aware multilingual post-training framework that improves
      visual-text grounding in a general-purpose MLLM without requiring an external OCR engine,
      OCR-extracted text, or text bounding boxes at inference time. The framework combines
      large-scale multilingual OCR supervision, approximately 5M additional multilingual training
      samples, controlled synthetic OCR generation and in-image text translation, LoRA-based
      supervised fine-tuning (SFT), and lightweight OCR-oriented Chain-of-Thought prompting. On a
      held-out real-world multilingual OCR benchmark, OCR-SFT improves OCR completeness from 71.3 to
      84.6, reduces hallucination rate from 18.3\% to 5.5\%, and improves translation BLEU-1 from
      52.3 to 80.2, with substantial hallucination reductions under blur and rotation. Evaluation on
      public benchmarks further shows gains on OCR-intensive tasks while largely preserving broader
      multimodal capabilities; ablations show that SFT provides the primary improvement, with
      prompting offering smaller complementary gains. These results demonstrate that data-centric
      OCR-aware post-training provides a practical and scalable approach to improving multilingual
      visual-text grounding in general-purpose MLLMs.
