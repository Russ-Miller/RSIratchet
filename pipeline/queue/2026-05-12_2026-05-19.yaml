      intelligence from \"see\" to \"action\", as OpenClaw-style frameworks enable agents to
      autonomously operate massive RS image-processing tools for complex tasks. Existing RS agents
      adopt a passive selection paradigm for tool invocation, relying on either full tool
      registration (Flat) or retrieval-augmented generation (RAG). However, in the massive and
      multi-source heterogeneous RS tool ecosystem, such passive mechanisms struggle to dynamically
      balance \"context load\" and \"toolset completeness\" throughout task reasoning, thus
      exhibiting inherent limitations: full tool registration triggers context space deficits during
      long-horizon tasks, whereas RAG retrieval may omit critical tools in essential steps. To
      overcome these bottlenecks, this paper redefines tool selection by arguing that the agent
