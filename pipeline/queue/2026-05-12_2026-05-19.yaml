      architecture. However, our experiments reveal two key limitations: (1) Although visual
      information serves as the core evidential modality in MLLMs, it is treated on par with textual
      tokens, diminishing the unique contribution of the visual modality; (2) As generation length
      increases, particularly within a limited context window, the model's dependence on visual
