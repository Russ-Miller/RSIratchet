    abstract: "Model merging has emerged as a cost-effective paradigm for combining capabilities of
      multiple large language models (LLMs) without additional training. Among existing approaches,
      Data Flow Space (DFS) merging operates by selectively activating parameter groups across model
      layers, offering greater flexibility than naive parameter averaging. However, the optimization
      challenges underlying DFS merging remain poorly understood. In this paper, we formally
      characterize the DFS merging problem as a mixed binary-continuous black-box optimization
      problem, identifying three fundamental challenges: (1) mixed binary-continuous variable types,
      (2) high-dimensional search spaces with up to 291 parameter groups, and (3) conditional
      variable dependencies corresponding to Type-I interaction as characterized by Akimoto et al.
      [1]. We empirically evaluate seven merging methods on Mistral-7B models across official GSM8K
      (1,319 questions) and MMLU (14,042 questions, 57 subjects) benchmarks. Our structured approach
      achieves a 49.5% reduction in effective search space. Results reveal that all tested merging
      methods fail to surpass the stronger source model on official benchmarks, with TIES (13.72%)
      and DELLA (4.12%) performing catastrophically on GSM8K. Notably, DELLA scores below even the
