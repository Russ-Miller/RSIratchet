    abstract: "Despite their strong performance, large language models (LLMs) are bottlenecked by KV
      cache memory traffic during long-context inference. Sparse attention is widely used to
      accelerate LLM inference by computing exact attention over a selected subset of tokens. To
      recover the contribution of tokens excluded from exact attention, recent methods apply
      coarse-grained compensation to the omitted attention tail. However, existing methods typically
      select tokens based on attention mass and only then compensate for the unselected tokens. This
      decoupled design overlooks their interaction: selection should prioritize tokens that would
      leave the largest compensation error if omitted. To address this limitation, we introduce
      CompKV, the first compensation-aware sparse attention framework that divides tokens into
      blocks and explicitly optimizes selection for the downstream compensation mechanism. Our
