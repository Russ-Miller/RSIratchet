      interaction budget, whereas selective trials enable exploration of unfamiliar tools. Existing
      outcome-based post-training leaves wasteful trials unguided, while turn-level supervision may
      suppress necessary exploration. We introduce ToolCompass, a post-training framework that
      guides tool trialing by organizing tool-call representations according to shared functions.
      Specifically, ToolCompass models each function class as a von Mises--Fisher distribution and
      jointly reduces intra-function variation across domains and increases inter-function
      separation. This structure transfers experience from seen tools to functionally similar unseen
