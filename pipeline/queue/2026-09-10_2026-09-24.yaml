    abstract: AI tools for digital product design now offer prompt-to-design capabilities, allowing
      designers and their non-designer colleagues to create prototypes through conversational
      workflows with large language models (LLMs). While these tools promise time savings,
      experimental evidence in product design remains limited compared with evidence from software
      engineering. We conducted a randomized controlled trial with 50 product designers and 50
      product managers to evaluate prospective time savings from leveraging Figma Make in design
      work. Participants attempted three standardized design tasks with or without access to Figma
      Make. Among participants who completed the study tasks, access to Figma Make was associated
