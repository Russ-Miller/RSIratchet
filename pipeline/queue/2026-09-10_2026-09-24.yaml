    abstract: Reinforcement learning has become a central component of large language model (LLM)
      post-training, yet token-level credit lacks a generally accepted mathematical definition,
      leaving its relationship to commonly used training signals unclear. We formulate three
      regularity conditions, namely Completeness, Prefix Consistency, and Neutrality, and prove that
      they uniquely determine token-level credit. This characterization provides a unified basis for
      explaining phenomena across existing algorithms and guides the development of an improved
      actor-critic training procedure. Through this lens, an ideal teacher in On-Policy Distillation
      (OPD) acts as an implicit critic, yielding an expected policy gradient proportional to that
      induced by token-level credit. Response-level REINFORCE Leave-One-Out (RLOO) signals match the
      expected policy-gradient contribution of token-level credit despite their coarser granularity.
      We further establish approximate credit sparsity under bounded outcome rewards and show how
      intermediate critic errors in Generalized Advantage Estimation (GAE) can become comparable to
      the underlying credit. These motivate Policy Aligned Critic Training (PACT), which adopts an
