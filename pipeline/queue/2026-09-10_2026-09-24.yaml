      developers for competitor analysis, and end-users for focused app recommendations. Existing
      approaches rely on embedding-based retrieval, which captures semantic similarity but fails to
      identify functionally similar apps. To our knowledge, no prior work has applied large language
      model (LLM)-based filtering to this task, due to the high computational cost of evaluating
      large numbers of app pairs. To address this gap, we propose ReFilter, a hybrid framework that
