    abstract: Analyzing neuroimaging data requires specialized coding and statistical expertise, which
      limits accessibility for researchers without computational backgrounds. We present the AI
      Neuroscientist, a language agent for interactive data exploration. The system integrates a
      large language model (LLM) with a neuroimaging toolset to perform quality control, modeling,
      and visualization. This allows researchers to query data quality and specify analysis
      parameters directly in natural language, providing a transparent and interactive alternative
      to conventional scripted pipelines for small-scale data exploration. We demonstrate these
      capabilities using functional near-infrared spectroscopy (fNIRS) data, and evaluate the agent
      on a custom fNIRS benchmarking suite against general-purpose LLM agents with code sandboxes.
      Future extensions will generalize the architecture to additional modalities, including
      functional magnetic resonance imaging (fMRI) data, and expand the benchmarking suite to
      additional fNIRS tasks.
