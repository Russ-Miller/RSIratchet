    abstract: This paper presents a probabilistic perspective on large language models (LLMs), developed
      with the aim of bringing together, in a single self-contained account, tools that are usually
      treated separately across the literature. LLMs are described through probability measures on
      the set of sequences of tokens, specified via their autoregressive conditional distributions.
      Training is formulated as a maximum-likelihood estimation problem, addressed by stochastic
      gradient methods, while text generation is viewed as the sequential simulation of the
      resulting stochastic process. The role of the asymmetry of the Kullback--Leibler divergence in
      text generation is examined in relation with characteristic phenomena such as hallucination
      and the distinction between statistical plausibility and truth. As a complementary
      illustration of the same viewpoint, we also discuss diffusion models, built around the score
      function, which cast generation not as sequential token prediction but as the simulation of a
      reverse-time stochastic process transforming noise into data both in discrete and continuous
