    abstract: The rapidly advancing capabilities of vision-language models (VLMs) present a systemic
      challenge to academic integrity. VLMs now allow students to bypass meaningful engagement by
      capturing and submitting graphical problems as singular images, a practice we define as
      trivial plagiarism. To provide educators with actionable data on VLM limitations, we
      investigate the efficacy of heuristic adversarial image transformations designed to degrade
      model performance while remaining human-interpretable. Through a two-phase evaluation of
      introductory assessments, we manually assess baseline VLM performance on circuit diagrams,
      followed by an automated large-scale evaluation of topological structures (logic gates) and
      coordinate geometry (Karnaugh maps). We find that while highly capable VLMs can exhibit
      appreciable robustness, all models suffer vulnerability to adversarial perturbations. We
      conclude that while visual perturbations act as a viable near-term stopgap, long-term
      assessment security requires educators to reapproach assessment design given continually
      increasing VLM performance.
