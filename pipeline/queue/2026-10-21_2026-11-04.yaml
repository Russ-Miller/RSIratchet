      capabilities through structured diagnostic procedures. However, performing diagnostic analysis
      does not ensure correct root-cause identification. Our empirical study shows that final
      decisions often favor large anomaly scores despite the model's own propagation analysis
      suggesting otherwise. Moreover, the input does not reveal whether these apparently anomalous
      signals are common during normal operation. These findings motivate our system, which improves
      how SLMs assess evidence and select root causes through Historical Frequency Profiling and
      Biased-Decision Correction. Historical Frequency Profiling quantifies how often metric and log
