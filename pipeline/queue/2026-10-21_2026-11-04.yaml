      loss for any of the coding agents. However, final accuracy can conceal substantial behavioral
      changes: AWQ reduces Qwen-7B one-shot solves from 17 to 0 while increasing loop-based solves
      from 10 to 25. All Qwen-32B successes involve tool use, whereas Devstral rarely makes a valid
      executor call. Failure profiles also differ: Qwen-32B produces far more compilation errors
      than the smaller Qwen models, rising slightly under quantization, while Devstral's failures
      shift significantly from runtime errors toward wrong answers and timeouts. These findings
      indicate that quantization robustness in coding agents should be assessed through solution
      trajectories, tool use, and failure modes, in addition to final accuracy."
