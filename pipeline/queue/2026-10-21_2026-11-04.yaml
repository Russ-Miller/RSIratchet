      as locally plausible intermediate decisions. We characterize this failure mode as
      evidence-chain contamination of protected task state. The main challenge is task dependent: a
      suspicious string may be malicious control text for summarization but essential evidence for
      IOC extraction. To address this challenge, we propose StateFence, a task-aware evaluation and
      defense framework that treats severity labels, incident narratives, response policies, and IOC
      sets as protected states. StateFence maps indirect prompt-injection attacks into explicit,
      stealth, multi-hop, and persistent SOC evidence attacks, records observable propagation
