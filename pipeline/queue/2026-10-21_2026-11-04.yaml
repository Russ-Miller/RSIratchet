    abstract: "Understanding and reasoning over 3D scenes from point clouds is essential for a broad
      range of AI applications. Recent 3D large language models have shown promising results, yet
      they still face two fundamental limitations: (i) insufficient capability for grounded
      multi-step reasoning in complex 3D scenes, and (ii) a text-centric inference paradigm that
      lacks effective interaction between textual reasoning and visual evidence. As a result, these
      models often fail to verify intermediate inferences, disambiguate similar object instances,
      and avoid hallucinations. To address these limitations, we propose MMCoT$^3$, the first
      3D-Text Interleaved Chain-of-Thought (CoT) framework for 3D scene understanding. The core idea
      is to explicitly interleave textual reasoning with task-relevant 3D evidence, enabling the
      model to consult scene observations throughout the reasoning process. In addition, since a
      textual mention in 3D scenes may correspond to multiple candidate objects, naive
