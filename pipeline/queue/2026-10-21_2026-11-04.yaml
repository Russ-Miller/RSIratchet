    abstract: "Language models can analyze and assess student texts using predefined rubrics and deliver
      structured feedback, reducing instructors' workload. However, existing solutions often rely on
      external services that are resource-intensive, costly, and raise privacy concerns, making them
      unsuitable for constrained environments. This study evaluates an automated assessment pipeline
      with three key aims: design for low-resource environments, privacy, and focus on a novel
      context in cybersecurity education. The pipeline integrates lightweight language models for
      textual evaluation and a vision-language model for image interpretation. Responses from 105
      students were collected over two semesters of an undergraduate course during a cybersecurity
      exercise on incident response. Results across different hardware configurations show that
      small models in low-resource environments can achieve up to 97% accuracy in text-only and up
      to 94% in rich-text assessments. This rivals or even outperforms a large model while adding
      the benefits of locally hosted assessment. Our solution can help educators and practitioners
      who need grading assistance without replacing human oversight, especially in environments
      where cloud-based solutions may be impractical. This study contributes an open-source, locally
      deployable AI-assisted scoring pipeline that runs on affordable hardware and can be extended
      to various types of student reports in computing education. As a result, it makes automated
      assessment accessible"
