      to determine patient responses, making it difficult to consistently maintain psychological
      state, adapt to the clinician's responses, and generate clinically plausible challenges that
      meaningfully test the clinician. We present a state-aware virtual patient simulation pipeline
      for training psychiatrists in challenging clinical scenarios. The proposed system maintains an
      evolving patient state throughout the interaction and orchestrates patient behavior rather
      than leaving response generation entirely to an LLM. At each interaction, a learning-based
      behavioral strategy selector determines the type and level of challenge appropriate to the
      current patient and clinician context. The selected strategy, patient state, clinician
      response, interaction history, and relevant clinical knowledge are then provided as grounded
      context to an LLM to generate a semantically relevant and psychologically consistent patient
      response. Following each session, the system analyzes the interaction and provides feedback to
      the clinician on their communication and management of the virtual patient.
