      trajectories are rare, and the sparse terminal rewards make it difficult for agents to obtain
      useful feedback from failed trajectories. Inspired by skill acquisition theory, we propose
      Skill-Composed Progressive Exploration (SCOPE), a short-to-long learning framework for
      long-horizon Web agents that decomposes complex task exploration into a gradual expansion
      process from local skills to complete task-solving capability. Specifically, SCOPE iteratively
      explores around local skills: Skill Discovery extracts reusable local skills and failure
