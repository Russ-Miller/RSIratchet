    abstract: "Theoretical limitations of transformers on state tracking---the ability to track
      information about entities or variables over long contexts---have motivated new recurrent
      language modeling (LM) architectures such as Gated DeltaNet (GDN). These architectures have,
      in particular, been benchmarked against the $S_5$ word problem, a theoretically hard
      state-tracking task that captures abilities such as code evaluation under arbitrary variable
      assignment. It, however, remains open whether other, simpler forms of state tracking might
      both be more relevant in practice and already explain observed differences between these
      architectures. We propose evaluating state tracking using a hierarchy of word problems with
      four increasing levels of difficulty: r-trivial, corresponding to immutable assignment to
      variables in programming; aperiodic, where assignments are mutable; soluble, where assignments
      are self-referential; and general finite state tracking. Theoretically, we show that the class
      of problems transformers are thought to length-generalize on does not even contain all
      aperiodic state tracking. On the other hand, we prove that GDN with positive eigenvalues
      expresses all aperiodic problems, and the regular languages recognized by certain transformers
      are precisely all soluble ones, thus providing a fine-grained picture of state tracking
      capabilities of various architectures. Taking these ideas to practice, we construct
      StateBench, a 4-tier long-horizon state-tracking benchmark. Our"
