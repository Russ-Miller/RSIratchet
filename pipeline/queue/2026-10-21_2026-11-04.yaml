    abstract: "The proliferation of Large Language Models has catalyzed powerful application development
      platforms like Dify, which enable users to build sophisticated LLM-powered workflows through
      modular node orchestration. However, manually configuring these workflows requires deep
      platform expertise and remains time-consuming and error-prone, creating a significant barrier
      for non-expert users. To address this challenge, we propose \\textsc{ChatDify}, a novel
      multi-agent framework that automates end-to-end Dify workflow synthesis from natural language
      descriptions. \\textsc{ChatDify} employs an Actor-Critic architecture comprising three
      specialized agents: the \\textit{Planner Agent} that decomposes user requests into structured
      execution plans, the \\textit{Executor Agent} that performs context-aware parameter synthesis
      and schema-augmented DSL compilation, and the \\textit{Reviewer Agent} that ensures
      reliability through hybrid verification with closed-loop refinement. We evaluate
      \\textsc{ChatDify} on a curated benchmark of 100 production-inspired tasks across three
      state-of-the-art LLM backends, achieving 0.96, 0.91, and 0.75 success rates with Qwen-3.7,
      GLM-5.1, and DeepSeek-v4, respectively. These results demonstrate its robustness and practical
      applicability for lowering the technical barrier to creating sophisticated LLM applications."
