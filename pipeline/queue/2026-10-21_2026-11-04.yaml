      remaining reliable across heterogeneous production environments. To reconcile rapid evolution
      with production reliability, we present RTP-LLM, an open-source production inference engine
      developed and deployed at Alibaba. Its architecture separates model-specific execution from
      shared request processing, state management, and resource coordination. Explicit interfaces
