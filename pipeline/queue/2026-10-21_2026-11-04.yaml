      commonly stem from mixing framework specific syntax and violating framework constraints. This
      paper studies supervised fine-tuning for multi-framework WebUI code generation and proposes a
      phase-wise MLLM tuning method driven by compatibility and heterogeneity signals across
      frameworks. We first apply a normalization mapping that preserves each framework's native
      syntax while suppressing noise from variable naming and literal content. We then estimate
      cross framework heterogeneity and compatibility offline, and automatically derive training
