      public-SOC validation cases, StateFence lowers attack success and reduces failures that appear
      only after evidence is poisoned, while preserving task utility and avoiding the indicator loss
      caused by task-mismatched filtering. Our findings indicate that robust blue-team LLM agents
      require mechanisms that preserve task-critical state under untrusted evidence."
