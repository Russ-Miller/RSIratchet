      embeddings under sparse interactions. However, these embeddings typically capture only static
      content similarity while neglecting sequential transitions, and since their adaptation quality
      relies on sparse per-item updates or global geometric calibration, existing methods still
      struggle to explicitly transfer preceding interaction contexts from frequent to long-tail
      items under unevenly distributed behavioral evidence, limiting recommendation effectiveness
      across the catalog. To address this challenge, we propose PACERec, an ID-free progressive
      adaptation framework that incorporates preceding interaction contexts into semantic
