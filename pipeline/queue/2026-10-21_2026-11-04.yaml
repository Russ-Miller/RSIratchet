      from English and Arabic Wikipedia and two openly licensed book collections, and 163,758
      queries (147,381 for training and 16,377 for testing). The queries cover five reuse classes of
      increasing difficulty, namely verbatim copying, character-level obfuscation, same-language
      paraphrasing by two different LLMs, and English--Arabic translation with structural
      paraphrasing, together with a Safe class of non-reused passages. Every positive query is
      linked to its source passage, and the train/test split is grouped by source passage so that no
      passage contributes queries to both splits. The release was curated through language
      identification, removal of LLM generation artefacts, and exact and cross-lingual
      de-duplication. Technical validation reports per-class length statistics, automatic checks of
      the train/test split, and inter-annotator agreement on a manually rated sample. The dataset is
      distributed in JSON and Parquet formats under a CC BY-SA 4.0 license."
