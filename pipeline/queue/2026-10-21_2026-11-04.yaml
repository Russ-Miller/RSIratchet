    abstract: "Agent decisions depend on empirical relationships that deployment observations reveal and
      task descriptions alone may leave unresolved. We introduce Decoupled Predictive Decision
      Making (DPDM), an architecture that formulates heterogeneous agent decisions as conditional
      prediction with a shared pretrained learner. Language models provide semantic representations
      of current and historical records, while a general-purpose conditional predictor predicts
      task-defined targets from the represented evidence. Pretraining supplies reusable inference
      capability; deployment evidence instantiates problem-specific predictions without updating
      either model's neural parameters. Tool judgments, candidate preferences, and reasoning
      assessments share an evidence-and-query interface, with predictions mapped to choices by a
      decision rule. This architecture establishes complementary sources of agent capability:
      semantic knowledge acquired through language pretraining and empirical inference acquired
      through structured-data pretraining. A single frozen LimiX-2 predictor serves all five task
      categories. With Qwen3.5-27B as the semantic encoder, DPDM raises mean accuracy across 50
      benchmarks from 78.80% with few-shot prompting to 84.92% under their respective evaluated
      history budgets, and reaches 82.33% with identical histories and queries. On ToolPRMBench's
      BFCL and ToolSandbox tasks, absolute accuracy gains are 34.26% and 28.87%, respectively, at
      the methods' respective evaluated history budgets."
