    abstract: "Autonomous agents powered by vision-language models (VLMs) show great potential in
      navigating mobile graphical user interfaces (GUIs) to complete complex tasks. However,
      existing paradigms face fundamental scalability bottlenecks: fine-tuning requires massive
      high-fidelity datasets or prohibitive training time and compute, while gradient-free
      approaches rely on custom static heuristics or costly trial-and-error trajectory exploration
      where feedback is deferred until the end of execution. To address these limitations, we
      introduce MAPLE (Multimodal Agent with Playbook-Learned Experience), a novel gradient-free
      multi-agent framework that enables dynamic, step-wise experience sharing and execution-time
      prompt evolution. Unlike traditional action-reflection architectures that depend on costly,
      post-hoc self-reflection, MAPLE enables agents to cross-reference and distribute runtime
      insights in real time at each operational step. This dynamic exchange eliminates blind
      trial-and-error looping and steers agents along direct, grounded interaction paths. Extensive
      evaluations on the AndroidWorld and MobileWorld benchmarks demonstrate that MAPLE achieves
      state-of-the-art performance on complex, long-horizon mobile tasks, while proving scalable and
      adaptable across novel environments."
