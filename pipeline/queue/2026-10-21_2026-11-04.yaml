      framework that uses topological data analysis (TDA) to quantify structural drift in
      self-attention weights and relate it to behavioral changes in quantized LLMs. Across four LLM
      families and multiple quantization levels, we show that topological drift remains stable at
      moderate compression levels but increases sharply below 4 bit precision, closely tracking
      declines in attention agreement. Our results reveal a strong relationship between topological
