    abstract: The generation of high-fidelity synthetic data is a cornerstone of modern machine
      learning, yet Large Language Models (LLMs) frequently suffer from hallucinations, logical
      inconsistencies, and mode collapse when tasked with structured generation. Existing
      approaches, such as prompting or retrieval-augmented generation, lack the mechanisms to
      balance linguistic expressivity with formal guarantees regarding validity and coverage. To
      address this, we propose CircuitSynth, a novel neuro-symbolic framework that decouples
      semantic reasoning from surface realization. By distilling the reasoning capabilities of a
      Teacher LLM into a Probabilistic Sentential Decision Diagram (PSDD), CircuitSynth creates a
      tractable semantic prior that structurally enforces hard logical constraints. Furthermore, we
      introduce a convex optimization mechanism to rigorously satisfy soft distributional goals.
