    abstract: "Large language models frequently fail to produce correct code on their first attempt, yet
      most benchmarks evaluate them in a single-shot setting. We investigate iterative self-repair
      (feeding execution errors back to the model for correction) across seven models spanning three
      families and both open-weight and proprietary providers: Llama 3.1 8B, Llama 3.3 70B, Llama 4
      Scout (MoE, 16 experts), Llama 4 Maverick (MoE, 128 experts), Qwen3 32B, Gemini 2.5 Flash, and
      Gemini 2.5 Pro. On HumanEval (164 problems) and MBPP Sanitized (257 problems) with up to five
      attempts, self-repair universally improves pass rates: +4.9 to +17.1 pp on HumanEval and +16.0
      to +30.0 pp on MBPP. Gemini 2.5 Flash achieves the highest final pass rates (96.3% HumanEval,
      93.8% MBPP). Most gains concentrate in the first two rounds.Error-type analysis shows
      assertion errors (logical mistakes) are the hardest to repair at ~45%, while syntax and name
      errors are repaired at substantially higher rates, connecting to broader findings on the
