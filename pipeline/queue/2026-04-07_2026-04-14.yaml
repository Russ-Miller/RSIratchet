    abstract: Large Language Models (LLMs) still suffer from severe hallucinations and catastrophic
      forgetting during causal reasoning over massive, fragmented long contexts. Existing memory
      mechanisms typically treat retrieval as a static, single-step passive matching process,
      leading to severe semantic dilution and contextual fragmentation. To overcome these
      fundamental bottlenecks, we propose MemCoT, a test-time memory scaling framework that
      redefines the reasoning process by transforming long-context reasoning into an iterative,
      stateful information search. MemCoT introduces a multi-view long-term memory perception module
      that enables Zoom-In evidence localization and Zoom-Out contextual expansion, allowing the
