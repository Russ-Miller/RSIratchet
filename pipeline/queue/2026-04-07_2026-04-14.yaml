    abstract: "Theory of Mind (ToM), the ability to attribute mental states to others, is a hallmark of
      social intelligence. While large language models (LLMs) demonstrate promising performance on
      standard ToM benchmarks, we observe that they often fail to generalize to complex
      task-specific scenarios, relying heavily on prompt scaffolding to mimic reasoning. The
      critical misalignment between the internal knowledge and external behavior raises a
      fundamental question: Do LLMs truly possess intrinsic cognition, and can they externalize this
      internal knowledge into stable, high-quality behaviors? To answer this, we introduce CoSToM
      (Causal-oriented Steering for ToM alignment), a framework that transitions from mechanistic
      interpretation to active intervention. First, we employ causal tracing to map the internal
      distribution of ToM features, empirically uncovering the internal layers' characteristics in
      encoding fundamental ToM semantics. Building on this insight, we implement a lightweight
      alignment framework via targeted activation steering within these ToM-critical layers.
      Experiments demonstrate that CoSToM significantly enhances human-like social reasoning
      capabilities and downstream dialogue quality."
