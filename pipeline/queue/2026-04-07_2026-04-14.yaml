    abstract: Large multimodal models are increasingly used as the reasoning core of embodied agents
      operating in 3D environments, yet they remain prone to hallucinations that can produce unsafe
      and ungrounded decisions. Existing inference-time hallucination mitigation methods largely
      target 2D vision-language settings and do not transfer to embodied 3D reasoning, where
