    abstract: "Vision-language models (VLMs) have shown impressive capabilities in perceptual tasks, yet
      they degrade in complex multi-hop reasoning under multiplayer game settings with imperfect and
      deceptive information. In this paper, we study a representative multiplayer task, Murder
      Mystery Games, which require inferring hidden truths based on partial clues provided by roles
      with different intentions. To address this challenge, we propose a collaborative multi-agent
