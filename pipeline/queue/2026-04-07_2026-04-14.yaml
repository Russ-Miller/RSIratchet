    abstract: Deploying Large Language Models (LLMs) in real-world dynamic environments raises the
      challenge of updating their pre-trained knowledge. While existing knowledge editing methods
      can reliably patch isolated facts, they frequently suffer from a \textit{reasoning gap}, where
      the model recalls the edited fact but fails to utilize it in multi-step reasoning chains. Our
      analysis shows that multi-hop reasoning relies on sparse circuitry beyond direct factual
      recall, with functionally differentiated components contributing to intermediate processing
      and final-answer prediction. To bridge this gap, we introduce MCircKE (\underline{M}echanistic
      \underline{Circ}uit-based \underline{K}nowledge \underline{E}diting), a mechanistically
