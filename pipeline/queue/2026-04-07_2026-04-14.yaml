    abstract: "Quantifying the deceptive potential of Large Language Models (LLMs) is critical for AI
      safety, yet difficult to achieve in uncontrolled environments. This work investigates the
      reasoning, persuasion, and deceptive capabilities of LLMs within the social deduction game
      Secret Hitler. I introduce an open-source framework and novel metrics to measure performance:
      Role Identification Accuracy, Deception Retention Rate, and Game State Impact Rate. By
      benchmarking models against rule-based algorithms and human games, I identify a gap between
      conversational ability and strategic depth. The study also analyzes the impact of
      reasoning-enhancement techniques on win rates and strategic reasoning. Neither
      Chain-of-Thought prompting nor internal memory bring improvements in performance, with up to
      23.2% worse win rates for fascist roles. While rule-based agents align with expert human
      voting decisions 86.7% of the time, models like Llama 3.1 70B achieve only a 59.7% accuracy.
      Models playing as Fascists consistently yield negative impact scores and fail to sustain
      deception, resulting in roughly 40% shorter games compared to humans. These findings suggest
      that current architectures remain ineffective at complex, multi-turn manipulation. As
      capabilities advance, detecting when models begin to master these deceptive behaviors is
      crucial. The developed framework serves as a reproducible testbed for future alignment
      research."
