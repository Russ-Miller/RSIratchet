    abstract: "Network Intrusion Detection Systems (NIDS) face important limitations. Signature-based
      methods are effective for known attack patterns, but they struggle to detect zero-day attacks
      and often miss modified variants of previously known attacks, while many machine learning
      approaches offer limited interpretability. These challenges become even more severe in IoT
      environments because of resource constraints and heterogeneous protocols. To address these
      issues, we propose MA-IDS, a Multi-Agent Intrusion Detection System that combines Large
      Language Models (LLMs) with Retrieval Augmented Generation (RAG) for reasoning-driven
      intrusion detection. The proposed framework grounds LLM reasoning through a persistent,
      self-building Experience Library. Two specialized agents collaborate through a FAISS-based
      vector database: a Traffic Classification Agent that retrieves past error rules before each
      inference, and an Error Analysis Agent that converts misclassifications into human-readable
      detection rules stored for future retrieval, enabling continual learning through external
      knowledge accumulation, without modifying the underlying language model. Evaluated on
