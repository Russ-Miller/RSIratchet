    abstract: "Intrinsic self-correction in Large Language Models (LLMs) frequently fails in open-ended
      reasoning tasks due to ``hallucination snowballing,'' a phenomenon in which models recursively
      justify early errors during free-text reflection. While structured feedback can mitigate this
      issue, existing approaches often rely on externally trained critics or symbolic tools,
      reducing agent autonomy. This study investigates whether enforcing structured reflection
      purely through Outlines-based constrained decoding can disrupt error propagation without
      additional training. Evaluating an 8-billion-parameter model (Qwen3-8B), we show that simply
      imposing structural constraints does not improve self-correction performance. Instead, it
      triggers a new failure mode termed ``structure snowballing.'' We find that the cognitive load
      required to satisfy strict formatting rules pushes the model into formatting traps. This
      observation helps explain why the agent achieves near-perfect superficial syntactic alignment
      yet fails to detect or resolve deeper semantic errors. These findings expose an ``alignment
      tax'' inherent to constrained decoding, highlighting a tension between structural granularity
      and internal model capacity in autonomous workflows. Code and raw logs are available in the
      GitHub repository: https://github.com/hongxuzhou/agentic_llm_structured_self_critique."
