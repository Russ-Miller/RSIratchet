      approach prompts the model with paired images and converts next-token probabilities into
      similarity scores, enabling zero-shot re-ranking within large-scale retrieval pipelines. This
      design avoids specialized architectures and fine-tuning, leveraging the rich visual
      discrimination learned during multimodal pre-training. We address scalability by combining
