    abstract: Although Multimodal Large Language Models have achieved remarkable progress, they still
      struggle with complex 3D spatial reasoning due to the reliance on 2D visual priors. Existing
      approaches typically mitigate this limitation either through computationally expensive
      post-training procedures on limited 3D datasets or through rigid tool-calling mechanisms that
      lack explicit geometric understanding and viewpoint flexibility. To address these challenges,
      we propose a \textit{training-free} framework that introduces a Visual Chain-of-Thought
      mechanism grounded in explicit 3D reconstruction. The proposed pipeline first reconstructs a
      high-fidelity 3D mesh from a single image using MLLM-guided keyword extraction and mask
