      performance on public benchmarks, it remains challenging to balance recognition quality with
      latency and overhead, while hallucinations further limit real-world deployment. In this study,
      we revisit LLM-based ASR from an entropy allocation perspective and introduce three metrics to
      characterize how training paradigms allocate entropy reduction between the speech encoder and
      the LLM. To remedy entropy-allocation inefficiencies in prevailing approaches, we propose a
      principled multi-stage training strategy grounded in capability-boundary awareness, optimizing
      parameter efficiency and hallucination robustness. Specifically, we redesign the pretraining
      strategy to alleviate the speech-text modality gap, and further introduce an iterative
      asynchronous SFT stage between alignment and joint SFT to preserve functional decoupling and
