    abstract: "Multimodal large language models (MLLMs) frequently hallucinate objects that are absent
      from the visual input, often because attention during decoding is disproportionately drawn to
      visually dominant or frequently occurring content. We observe that this inequity in attention
      allocation is a root cause of object hallucination: when rare, small, or contextually
      peripheral objects receive insufficient attention, the model fails to ground its generation in
      the full visual scene. We argue that every object in an image, regardless of its size,
      frequency or visual salience, deserves equal representational opportunity during decoding. To
      this end, we propose DOP-OBC, a training-free and architecture-agnostic decoding strategy
      built on the principle of equitable attention. Two complementary object-aware signals work in
