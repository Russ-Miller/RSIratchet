    abstract: Multimodal Large Language Models (MLLMs) have demonstrated remarkable reasoning
      capabilities yet continue to suffer from hallucination, where generated text contradicts
      visual content. In this paper, we introduce Dual-Anchor Introspective Decoding (DaID), a novel
      contrastive decoding framework that dynamically calibrates each token generation by mining the
      model's internal perceptual discrepancies. Specifically, DaID identifies a Spotlight layer to
      amplify visual factual signals and a Shadow layer to suppress textual inertia. By leveraging
      visual attention distributions to guide this dual-anchor selection process, our method ensures
      precise, token-specific adaptation. Experimental results across multiple benchmarks and MLLMs
      demonstrate that DaID significantly mitigates hallucination while enhancing general reasoning
      capabilities.
