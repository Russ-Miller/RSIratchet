      balance translation fluency with tag fidelity when processing tagged text. We argue that
      resolving this tension requires a systematic approach at three interconnected levels: data
      synthesis, capability building, and multi-objective alignment. At the data level, we identify
      and formalize a fundamental trade-off between structural tag diversity and translation
      naturalness in synthetic data generation; existing methods optimize for one at the expense of
      the other. We propose a hybrid synthesis strategy (Hy-LST) combining LLM-based synthesis tag
      method and Two-Stage LLM-based synthesis tag method to produce both diverse and natural tagged
      data. At the capability level, we decompose tag-aware translation into four sub-tasks of
      increasing difficulty in a multi-task supervised fine-tuning framework, enabling targeted
      capability acquisition and knowledge transfer. At the alignment level, we design three
      complementary reward functions under a group relative policy optimization framework, each
      targeting a distinct objective (fluency, tag fidelity, and tag-scoped translation quality),
      and show that joint optimization consistently outperforms single-reward alternatives.
