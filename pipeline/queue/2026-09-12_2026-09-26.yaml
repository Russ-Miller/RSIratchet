      testing requires explicit control of type-I and type-II errors. We study how to use AI
      judgments, together with selective human verification, to conduct a valid hypothesis test at
      minimum cost. We consider a population of items with hidden binary labels. After choosing a
      fixed pool of items, the decision maker can selectively query AI, send an item directly to a
      human, escalate an AI-scored item to a human after observing the AI report, or stop once
      sufficient evidence has accumulated. We derive an information-theoretic lower bound that
