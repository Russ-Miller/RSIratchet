    venue: arXiv (Cornell University)
    topic: Personal Information Management and User Behavior
    cited_by_count: 0
    abstract: Large language models increasingly operate as persistent assistants in user-facing,
      shared-session, and tool-augmented settings. When users disclose sensitive information during
      an active conversation, that information may remain behaviorally recoverable through later
      prompts even after the dialogue shifts to unrelated topics. We introduce \textbf{PrivDrift}, a
      benchmark for auditing whether user-disclosed secrets remain recoverable after conversational
      topic drift and persuasion-based probing. PrivDrift contains 1{,}000 controlled multi-turn
      dialogues with seeded secrets, content-dense drift turns, and standardized extraction probes.
      Across three LLMs with extended context windows, dialogue-level hybrid leakage remains
      substantial, ranging from 38.7\% to 54.6\%, and varies strongly by model, secret type, and
      persuasion intensity. Within the tested drift window, additional topic drift does not reliably
      reduce leakage, suggesting that privacy risk in active LLM contexts should be evaluated as a
      persistent behavioral failure mode rather than only as training-data memorization or immediate
      jailbreak behavior.
