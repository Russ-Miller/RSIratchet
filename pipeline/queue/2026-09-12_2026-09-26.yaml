    abstract: Large language model (LLM)-based multi-agent systems can automate alpha factor mining, but
      their reliance on external APIs limits control over cost, availability, and confidentiality.
      Long research loops also tend to revisit a few successful economic mechanisms that lead to
      research path collapse. To address these limitations, we propose AlphaDiverse, a framework
      that integrates a multi-agent alpha research system, diverse research path collection, and
      post-training for local agents. We let the research system generate complementary plan
      portfolios and vary research environments across loops to collect diverse research paths.
      Using these diverse traces, we warm-start local Planner and Realizer agents with supervised
      fine-tuning. Then, we propose a joint GRPO method to optimize both of them using predictive
      quality and diversity of contributions. Research feedback is confined to inner period data,
      while a frozen final model is evaluated on a later outer period data, thereby avoiding
      test-set tuning. Experiments across four Chinese stock universes show that AlphaDiverse can
