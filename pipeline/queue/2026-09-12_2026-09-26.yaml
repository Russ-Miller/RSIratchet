    abstract: "Large Language Model (LLM) agents struggle to scale safely when exposed to vast
      enterprise toolsets. Providing an agent with access to every internal tool leads to oversized
      context windows, degraded tool selection, and severe governance vulnerabilities - as system
      policies defined purely in prompts remain probabilistic advice rather than hard constraints.
      Existing mitigations, such as multi-agent domain delegation, decentralize audit logs and fail
      to guarantee policy compliance across sessions. We introduce skilder, a framework that
      packages capabilities into roles: bundles of skills, tools, and instructions, together with
      the limits that bound them. An agent begins with a minimal role catalog, learns the roles a
      task requires, and receives each role's skills, instructions, and tools through a single MCP
      server. Because tools reach the agent only inside learned skills, the same server enforces the
      scope of what was learned deterministically. We evaluate skilder against flat-context tool
      selection and multi-agent orchestration across 13 tasks using six models (10 runs each). Our
      results show that, when models completed discovery and issued a governed call, the skilder
      simulated authorization layer enforced governance boundaries: no unauthorized tool call or
