      source of the pathological signal; the routing pathway that carries it is one that the
      backbone already provides. Against tuned VCD and DoLA baselines, tuned DoLA wins on binary
      calibration, but \textbf{only $L_0$ ablation reduces object hallucination in open-ended
      generation} (CHAIR$_i$ reduces by $31\,\%$ relatively, whereas tuned DoLA and VCD leave it
      unchanged or worsen it). These results recast object hallucination in unified VQ VLMs as a
      property of architecture and pretraining, and yield a targeted intervention that
      mechanism-agnostic decoding cannot replicate.
