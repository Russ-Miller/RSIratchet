    abstract: "Property Directed Reachability (PDR) is a prominent algorithm for hardware formal
      verification. However, bit-level PDR often struggles with datapath-heavy designs because
      bit-blasting obscures high-level semantics. While word-level PDR addresses this by reasoning
      over bit-vector and array theories, its performance remains bottlenecked by discovering
      proof-relevant word-level relations. We propose LLM4PDR, a framework leveraging Large Language
      Models (LLMs) to guide word-level PDR search through three mechanisms: (1) Predicate
      Generation, extracting state relationships as candidate predicates during inductive
      generalization; (2) Clause Generation, producing candidate frame lemmas to accelerate
      convergence after formal validation; and (3) Assertion Generation, synthesizing helper
      assertions that strengthen the target property under counterexample-guided refinement. We
      implement LLM4PDR in the Pono model checker and evaluate it on arithmetic micro-benchmarks,
      HLS-generated pipelines, open-source RTL components, and hardware model checking competition
      (HWMCC) instances. Results show LLM-generated guidance improves both solved instances and
