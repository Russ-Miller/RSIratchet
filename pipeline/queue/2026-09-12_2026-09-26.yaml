      trajectory. Moreover, failed trajectories are rarely entirely wrong: an agent may first
      collect useful evidence and make meaningful progress, but later deviate into an erroneous
      suffix. We therefore argue that skill self-evolution should identify where productive problem
      solving begins to break down, rather than reflect coarsely over the entire failure. Based on
      this insight, we propose SkillPivot, a deviation-point-guided framework for skill
