      treat generation as a local video-to-text problem, assuming that the content to describe and
      its temporal location are already provided. Realistic AD instead requires coupled decisions
      about what visual information is narratively important, when it can be spoken without
      interfering with dialogue, and how it should be formulated to fit within the available time.
      We formalize AD generation as a constrained optimization problem over these three decisions.
      Our hybrid system uses large language models to propose and ground visual elements, estimate
