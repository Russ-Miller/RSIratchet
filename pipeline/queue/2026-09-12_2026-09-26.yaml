    abstract: End-to-end event extraction remains challenging for large language models as it requires
      simultaneous identification of event triggers, classification of event types, and extraction
      of schema-grounded argument spans. We present EAGER, a reinforcement learning framework for
      generative event extraction that combines fine-grained verifiable rewards with
      Schema-Contrastive Advantage Estimation to alleviate advantage collapse under sparse binary
      rewards. Our reward design explicitly targets structural validity, extraction accuracy,
      groundedness, coverage, over-generation, and span precision. Experiments across seven
      benchmark datasets show that EAGER consistently outperforms prompting, supervised fine-tuning,
