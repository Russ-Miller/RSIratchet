    abstract: Recent advances in video object segmentation with Multimodal Large Language Model (MLLM)
      reasoning have demonstrated the effectiveness of using a single textual token, such as SEG, to
      predict segmentation masks across images and videos. However, we observe that this
      single-token strategy lacks the granularity required to precisely localize multiple objects
      across time in video segmentation tasks. To address this limitation, we develop Multi-Token
      Reasoning for Video Object Segmentation, or MoVISA. MoVISA uses multiple segmentation tokens,
      such as SEG0 and SEG1, to represent an object across different frames. This design enables
