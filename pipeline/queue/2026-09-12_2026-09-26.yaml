      evaluation, yet existing benchmarks are manually curated, costly to update, and rapidly become
      obsolete with evolving technological advancements. We present a scalable framework that
      automatically generates question--answer pairs from longitudinal EHR notes. Nineteen
      clinicians validate the benchmark generator, producing the Benchmark for Retrieving
      Information in EHRs (BRIE), a continuously maintainable evaluation dataset. Across nine LLMs
