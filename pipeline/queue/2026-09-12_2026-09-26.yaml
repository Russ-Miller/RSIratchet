      Hierarchical Bayesian Neyman (HBN) policy with pilot size and stage weight jointly chosen ex
      ante. It runs a short uniform pilot, pools per-task success counts with a hierarchical
      Bayesian model, and uses posterior expectations of task-level sampling variances for exact
      positive-integer Neyman allocation. To mitigate the pilot synchronization barrier, HBN-async
      speculatively executes continuations from partial pilot feedback and retains those selected by
