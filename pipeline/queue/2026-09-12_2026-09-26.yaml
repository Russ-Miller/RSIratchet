    abstract: "Artificial intelligence helps education most where an essential provision has been
      rationed by cost. For language learners that provision is a teacher's voice, which binds
      listening, reading, speaking, and writing into one act. Published evidence shows why most
      learners lack it, from a global shortage of 44 million teachers to heavy household tutoring
      bills, and why technology has not substituted for it: computer-assisted language learning
      proved effective but narrow, applications presuppose connectivity 2.6 billion people lack, and
      One Laptop per Child's randomized evaluation found that hardware without capable software
      teaches nothing. We distill eight difficulties and four binding constraints, and argue that
      small open-weight models dissolve the last: a complete four-skill stack now fits a
      \\$200-class laptop and, on community measurements, generates at the pace speech is consumed,
      for about one US cent of electricity per study hour. We therefore propose LLMersion, a scheme
      for AI for education that runs entirely at home, over the learner's own documents, with an
      AI-written, AI-understood, AI-updated codebase anyone can customize; present LLMersion-1, a
