      reasoning from one side, continuous-signal perception and zero-shot forecasting from the
      other, and fuses the two in a shared representation space where both modalities are understood
      and generated. We study the design choices that make such unified modeling work: where to
      align the two representation spaces, how to ground language in temporal structure, how to
      balance understanding with generation, and how to keep joint optimization stable. The
      resulting recipe combines a unified prompting scheme for diverse time-series and text tasks,
      stabilized joint training, and supervision from 2.2M curated series--text pairs and 4.9M
