      an early-layer ($L_0$) attention routing circuit shared across VQ-tokenized VLMs and propose a
      three-gate diagnostic that distinguishes the models carrying it from those that do not. The
      diagnostic isolates ten positive models (five natural unified-VQ VLMs across three LLM
      families and five induced variants) and rejects the remaining fifteen. A single-variable
      architectural swap (LLaVA-1.6 CLIP+MLP $\rightarrow$ VQ+Linear) installs the circuit, while a
