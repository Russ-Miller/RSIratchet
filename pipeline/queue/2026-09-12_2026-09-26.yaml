    abstract: Sequential recommendation aims to predict users' future interests from their historical
      interactions. Although Large Language Models (LLMs) capture rich item semantics, existing
      methods often struggle to align collaborative signals with textual semantic knowledge. As a
      result, the learned item representations fail to capture the complementary strengths of both
      signals, leading to suboptimal recommendation quality. To address this limitation, we propose
      Latent Semantic Fusion for Sequential Recommendation via Flow-based Conditional Variational
      Autoencoders (LSF-SR), a novel framework that uses a Conditional Variational Autoencoder
      (CVAE) with Normalizing Flows to fuse item ID embeddings and LLM-generated semantic signals.
      At the core of LSF-SR is a conditional fusion module augmented with planar or radial flows.
      This module learns a flexible latent space that encourages items with similar semantic
      profiles to cluster together within the latent manifold. Through extensive experiments on five
      public benchmark datasets, we demonstrate that LSF-SR consistently outperforms
      state-of-the-art baselines, achieving gains of up to 12.98% and 14.13% in Recall@20 and
      NDCG@20, respectively.
