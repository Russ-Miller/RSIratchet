    abstract: Jev is a fast, low-cost decision model that answers natural-language questions with
      choices, binary judgments, and scores. As its public ecosystem grows rapidly, it remains
      unclear how Jev is used across applications and how public attention relates to project
      distribution. To answer these questions, we conduct a large-scale, data-driven analysis of
      2,170 publicly available Jev projects collected from GitHub as of September 22, 2026. We find
      rapid early growth in Jev's public ecosystem, with both new projects and integration into
      existing repositories. Across diverse domains, projects use Jev for multiple decision purposes
      and combine its interfaces. Attribute judgment and scoring are widely used, while the use of
      action selection, content filtering, and model and tool selection varies across domains. These
      patterns suggest that Jev serves as a reusable decision component whose functionality varies
      with the surrounding workflow. Meanwhile, public attention is concentrated in routing and
      interface agents and does not track project counts. Our findings provide a quantitative view
      of Jev's emerging ecosystem and inform the design and evaluation of general-purpose decision
      models across diverse application contexts.
