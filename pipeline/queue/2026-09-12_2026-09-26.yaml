      terminology remains challenging. Motivated by the world knowledge and contextual capability of
      large language models (LLMs), we propose Agentic-GER, an LLM-based agent for terminology
      correction in long-form speech. The agent uses global context from the full transcript to
      identify suspicious terms and resolve ambiguous hypotheses. It selectively re-transcribes the
