    abstract: "The evolution of Large Language Model (LLM) reasoning is bottlenecked by the scarcity of
      high-quality process data. While self-alignment via endogenous rewards offers a solution,
      mining valid supervision faces three challenges: (1) Label Noise via Mimetic Bias, where
      rewards prioritize statistical likelihood over logical truth, creating a \"correctness
      illusion\" that masks compounding errors; (2) Coarse-Grained Supervision, where sparse global
      outcomes (e.g., in GRPO) fail to provide granular guidance, treating reasoning chains as
      monolithic; and (3) Distributional Collapse, where signals fail to generalize without
      amplifying pre-training biases. To address these, we introduce LC-ERD (Logic-Consistent
      Endogenous Reward Decomposition), a framework framing self-alignment as latent structure
      mining. We derive a Variational Logic Potential by aggregating consensus from the model's
