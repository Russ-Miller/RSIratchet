    abstract: Group Relative Policy Optimization (GRPO), a prominent algorithm within the Reinforcement
      Learning from Verifiable Rewards (RLVR) framework, has achieved strong results in improving
      the reasoning capabilities of large language models (LLMs). However, GRPO is prone to
      advantage collapse, a failure mode where homogeneous rewards within a group (e.g., all correct
      or all incorrect answers) yield near-zero advantages and vanishing gradients. To address this,
      we introduce the Advantage Collapse Rate (ACR), the first diagnostic metric quantifying the
      proportion of training batches with ineffective gradients. Across models from 0.5B to 14B
      parameters on mathematical reasoning benchmarks, we show that ACR strongly predicts training
      stagnation and final performance. We then propose Adaptive Virtual Sample Policy Optimization
