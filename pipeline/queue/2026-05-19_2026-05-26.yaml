    abstract: Large language models are moving scientific research from text assistance toward agentic
      workflows, yet biological research requires strong object validation, methodological
      suitability, reproducibility, and auditability. Prompt engineering, general RAG, or tool use
      alone cannot reliably produce domain-specific scientific judgment. Here, we present PRAXIS, a
      verifiable biological research agent framework driven by literature learning and case
      distillation. PRAXIS converts research experience, failure boundaries, domain rules, and
      executable procedures into structured long-term memory. By coordinating successful cases,
      negative cases, rules, and skills, PRAXIS supports problem definition, object validation,
      method selection, workflow execution, result interpretation, and review feedback across
      diverse biocomputational tasks. We instantiated PRAXIS as an agent suite for biomedical
      computing and evaluated it through object validation, case retrieval, memory ablation, public
      benchmarks, and cross-agent workflows. The results show that case-based learning improves
      method selection, error suppression, and workflow organization in complex biological research
      tasks. Rather than replacing scientists, PRAXIS provides a general pathway for transforming
      research experience into executable, auditable, and transferable agent capabilities.
