    abstract: "Personalization is classically a two-party problem: a sender chooses what to say, and a
      receiver with independent objectives decides whether to act. A salesperson pitching the same
      analytics product leads with HIPAA compliance for a hospital and real-time reporting for a
      retailer, expecting a different argument to work on each. Existing LLM personalization
      benchmarks measure a narrower, one-party property: whether output matches the preferences of
      the same user it serves-sender and receiver being the same, as when RLHF aligns an assistant
      to its own user. The two-party case is harder to study automatically, since it needs ground
      truth linking specific content to an observed receiver action. Sales outreach provides this: a
      message written for one prospect, recorded against whether it produced a reply, a call, or a
      closed deal. We introduce SDR-Arena, a framework for benchmarking two-party generative
      personalization at scale, and SDR-Bench, a public corpus of 50,000 customer success stories
