    abstract: "Deep research, in which an agent searches the open web, collects evidence, and derives an
      answer through extended reasoning, is a prominent use case for frontier language models.
      Frontier deep research products score high on existing benchmarks, making it difficult to
      distinguish their capabilities from current evaluation data alone. We introduce DeepWeb-Bench,
      a deep research benchmark that is substantially harder than existing benchmarks for the
      current frontier. Difficulty comes from three properties of the data itself: each task
      requires massive evidence collection, cross-source reconciliation, and long-horizon multi-step
      derivation. We represent these three sources of difficulty as four capability families
      (Retrieval, Derivation, Reasoning, and Calibration) and report results sliced by family. Every
      reference answer is accompanied by a source-provenance record with four disclosure levels and
      cross-source checks where available, making scores easier to audit against the underlying
