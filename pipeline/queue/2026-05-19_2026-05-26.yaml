      real-time ACR monitoring, to enable learning from homogeneous groups without additional model
      rollouts. AVSPO reduces advantage collapse by 58-63% relative to GRPO and yields consistent
      accuracy gains of 4-6 percentage points across all model scales, while maintaining
      generalization on the evaluated out-of-domain task. Code and datasets are available at
