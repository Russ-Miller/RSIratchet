    abstract: "Hallucination remains a central failure mode of large language models, but existing
      benchmarks operationalize it inconsistently across summarization, question answering,
      retrieval-augmented generation, and agentic interaction. This fragmentation makes it unclear
      whether a mitigation that works in one setting reduces hallucinations across contexts. Current
      benchmarks either require human annotation and fixed references that may be memorized, or rely
      on observations in settings that are difficult to reproduce. To study root causes, we
      introduce HalluWorld, an extensible benchmark grounded in an explicit reference-world
      formulation: a model hallucinates when it produces an observable claim that is false with
      respect to this world. Building on this view, we construct synthetic and semi-synthetic
