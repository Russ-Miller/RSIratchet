    abstract: Large language models (LLMs) are increasingly deployed in socially sensitive settings
      despite substantial documentation that they encode gender biases. Chain-of-Thought (CoT)
      prompting has been proposed as a bias-mitigation approach. However, existing evaluations
      primarily focus on changes in LLM benchmark performance, providing limited insight into
      whether apparent bias reductions reflect meaningful changes in a model's internal mechanisms.
      In this work, we investigate how CoT prompting affects gender bias in LLMs, combining
      benchmark-based evaluation with mechanistic interpretability techniques and reasoning chain
      failure analysis. Our results confirm a stereotypical bias present in LLM outputs across
      benchmarks, showing that CoT prompting does not consistently reduce the bias gap. Mechanistic
      analyses reveal that although CoT balances biased behavior in certain attention head clusters,
      gender bias remains embedded in hidden representations, indicating only superficial
      mitigation. Inspection of reasoning chains further suggests that these improvements stem from
      memorization and familiarity with the dataset rather than genuine understanding of bias.
