    abstract: "The proliferation of large language models (LLMs) and modular skills has endowed
      autonomous agents with increasingly powerful capabilities. Existing frameworks typically rely
      on monolithic LLMs and fixed logic to interface with these skills. This gives rise to a
      critical bottleneck: different LLMs offer distinct advantages across diverse domains, yet
      current frameworks fail to exploit the complementary strengths of models and skills, thereby
      limiting their performance on downstream tasks. In this paper, we present Maestro (Multimodal
      Agent for Expert-Skill Targeted Reinforced Orchestration), a Reinforcement Learning
      (RL)-driven orchestration framework that reframes heterogeneous multimodal tasks as a
      sequential decision-making process over a hierarchical model-skill registry. Rather than
      consolidating all knowledge into a single model, Maestro trains a lightweight policy to
      dynamically compose ensembles of frozen expert models and a two-tier skill library, deciding
      at each step whether to invoke an external expert, which model-skill pair to select, and when
      to terminate. The policy is optimized via outcome-based RL, requiring no step-level
