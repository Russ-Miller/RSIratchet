      interpretation of how iterative reasoning operates over graph-structured data. We observe that
      existing graph CoT methods rely on disjoint architectures and fixed graph representations,
      limiting step-by-step semantic-topological interaction and interpretability. To overcome this
      limitation, we propose a unified framework named KCoT that integrates CoT reasoning with graph
