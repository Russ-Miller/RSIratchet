      agent per participant's pre-discussion answer and scoring agents and people with the same
      code. Across human scoring definitions, estimates ranged from 24.0% to 57.0%; about one fifth
      of participants never posted, whereas agents almost always did. Agent groups remained more
      consensual in two post-unblinding sensitivity analyses: the submit-based comparison (n = 98)
      yielded gaps of 34.0 and 43.9 percentage points for chat and reasoning modes, and the
      participation-matched comparison (n = 45) yielded gaps of 34.1 and 44.4 points. These
      complementary routes reduced different measurement asymmetries yet converged within 0.5
      percentage points. The gap persisted without early stopping and under a reparameterization
      removing the memorizable answer; reasoning-mode groups then agreed nearly unanimously, mostly
      on incorrect answers. Simulated consensus did not track collective accuracy, and
      belief-anchored agent groups were biased estimators of the human group-outcome distribution in
      this setting. These analyses provide a scoring-explicit basis for assessing simulated-group
      estimates of human deliberative outcomes."
