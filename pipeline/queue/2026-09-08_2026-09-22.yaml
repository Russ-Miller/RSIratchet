      received LLM-judge comparisons but no human comparisons. We propose ANCHOR (ANchored
      Comparisons for Human-reference inference with Orthogonal Riesz correction), which uses
      historical human and LLM comparisons to learn judge-specific sensitivities to human score
      differences and feature-dependent judge biases. These estimates are then used to infer the new
      model's human-reference score from its judge comparisons. The framework allows the feature
      distribution to change between historical and new-model comparisons. For inference, we
      construct a Neyman-orthogonal estimator through a joint Riesz correction that removes the
