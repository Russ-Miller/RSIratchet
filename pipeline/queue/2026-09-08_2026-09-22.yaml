      update, pull minority predictions toward itself, and produce a degenerate mask as predictions
      saturate and their entropy gradients vanish. We theoretically establish this collapse in a
      shared-shift model. This analysis motivates Balanced-Anchor Prompt Adaptation (BAPA), which
