      post-training, we show that GVPO naturally extends to on-policy distillation (OPD).
      Furthermore, GVPO enables the optimization of a broad family of extended OPD objectives,
      providing a principled foundation for diverse objective design. By unifying theoretical
      guarantees with practical adaptability, GVPO establishes a new paradigm for reliable and
      versatile LLM post-training and on-policy distillation."
