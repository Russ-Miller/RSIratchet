      when verdict labels are preserved. The attack transfers to ELF binaries, where Gemini flips 16
      of 40. A verification-guided defense prompt roughly halves the benign verdicts, but 42.9
      percent of malicious samples still reach benign. LLM malware analyzers therefore require
      provenance checks that separate verified facts from attacker-controlled claims, not narrative
      trust.
