      underlying Pareto front. Here we recast acquisition-function choice as an adaptive
      policy-selection problem over a portfolio of conventional and feasibility-focused acquisition
      functions. This was done using two controllers: UCB-Bandit, a modified UCB multi-armed bandit,
      and Agentic-Switch, a multi-agent decision system driven by a large language model (LLM). Both
      were evaluated against fixed-policy baselines in silico across five synthetic benchmark
      functions and two materials design case studies. The adaptive policies performed competitively
