    abstract: Large Reasoning Models increasingly use intermediate traces for machine translation, but
      it remains unclear when such reasoning helps or hurts. We analyze reasoning traces across
      models, languages, domains, and datasets, focusing on reasoning language, length, and
      structure. We find that the best reasoning language is model-specific, reasoning length has a
      non-monotonic relationship with quality, and traces exhibit recurring functional patterns. To
      uncover these patterns, we introduce Hierarchical Meta-Summarization (HMS), a scalable
      framework that induces coarse- and fine-grained reasoning structures without predefined
      taxonomies. HMS reveals a shared organization--understanding/planning, translating/drafting,
      and refining/verifying--alongside domain-specific variation. Our results suggest that MT
      reasoning should be controlled in a model-aware, length-aware, and pattern-aware manner rather
      than uniformly encouraged.
