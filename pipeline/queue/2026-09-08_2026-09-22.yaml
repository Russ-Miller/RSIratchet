      connect these ideas and introduce LLM-Falsifier, an LLM-based approach that falsifies
      specifications by minimizing the STL robustness degree. Beyond generic prompt-based
      optimization, our key idea is to expose the LLM to semantic information that is natural for
      language models but absent from standard numerical optimizers, including natural-language
