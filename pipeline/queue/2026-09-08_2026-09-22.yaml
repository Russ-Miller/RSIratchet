    abstract: Business intelligence (BI) is a cornerstone of enterprise decision-making and is widely
      used by enterprise users in software such as Power BI and Tableau. In traditional BI
      workflows, users need to prepare data by (1) identifying relevant tables, (2) performing data
      transformations, and (3) building join relationships, before they can (4) answer their
      business questions. These steps can be complex and time-consuming, making BI challenging.
      Given the strong capabilities of large language models (LLMs) in working with data, we study
      their ability to answer BI questions end-to-end, without requiring users to manually perform
      the tedious preparation steps. To do this, we harvest a large collection of real-world BI
      projects from public sources, and manually extract pairs of (questions, ground-truth answers)
      from real user dashboards. The resulting benchmark, BI-Bench, is the first benchmark to
      systematically study LLMs' ability on end-to-end BI. We find that even frontier LLMs perform
      poorly on BI-Bench, with less than 50% accuracy. To address their limitations, we design a
      tool-augmented BI-Agent that decomposes BI workflows into subtasks on structured data, such as
      search, join, and transform, and orchestrates specialized data management methods across BI
      stages. Furthermore, we develop a post-training framework that synthesizes training
      trajectories from real BI projects, enabling BI-Agent to be further post-trained using both
