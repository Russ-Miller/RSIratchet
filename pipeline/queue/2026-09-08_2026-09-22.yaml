      suspect characteristics from incomplete evidence largely unexplored. To fill this gap, we
      introduce the Profiling, Investigation, and Judgment (PIJ), comprising 2,500 real homicide
      cases from five countries. PIJ evaluates LLMs across three tasks that span the entire criminal
      investigation pipeline: criminal profiling, which requires abductive reasoning to infer
