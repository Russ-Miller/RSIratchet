      models may succeed through superficial cues and incomplete annotations. To this end, we
      introduce VidOmni-Bench, a benchmark that requires models to verify whether each event in
      dense video captions is supported by the video. VidOmni-Bench consists of 500 videos spanning
      five complexity types and diverse durations from 4 seconds to 90 minutes. After collecting
      videos along these axes, we use diverse Video-LLMs to generate dense captions and obtain
      human-verified sentence-level labels, where sentences containing incorrect events serve as
      hard negatives for evaluation. Our experiments on VidOmni-Bench reveal three key findings: (i)
      Video-LLMs frequently generate hallucinated descriptions in dense video captioning; (ii) they
      also struggle as verifiers, failing to reliably detect plausible but incorrect event
      descriptions; and (iii) model weaknesses vary across video complexity and duration, revealing
      diverse, model-specific bottlenecks in current Video-LLMs."
