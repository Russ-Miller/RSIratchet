    abstract: Recent advancements in large language models have revolutionized the field of
      psychological counseling, especially in the context of Cognitive Behavioral Therapy (CBT).
      While the success of CBT relies heavily on dynamic decision-making informed by the client's
      real-time mental state, this aspect has often been overlooked in current research, limiting
      both flexibility and therapeutic outcomes. In this paper, we introduce StratCBT, a dataset
      specifically designed for psychological counseling conversations with CBT Strategies,
      consisting of 9,688 sessions and around 256K utterances, with each counselor's response
      aligned with one of eight distinct strategies. The creation of StratCBT involves modeling
      clients based on their negative thoughts and generating high-quality counseling conversations
      through self-chat, incorporating realistic sessions as guidance, thereby significantly
      surpassing existing datasets in both general counseling and CBT-specific skills. We conduct
      extensive experiments to demonstrate the effectiveness of strategy-aligned generation and
      evaluate its efficacy in delivering professional and effective counseling with LLM-simulated
      clients to reflect real-world scenarios. The dataset can be obtained from
