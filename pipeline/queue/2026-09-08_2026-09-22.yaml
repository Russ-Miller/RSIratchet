      produce transcripts with numbers written in Arabic numerals. This creates a need for fair
      comparison with models that output verbatim texts and proper processing of reference
      transcripts. Popular approaches often reduce text normalization to lowercase and remove
      punctuation, with no additional normalization applied to languages other than English. In this
      work, we analyze the impact of normalization of numerical expressions in the evaluation of ASR
      systems in various languages, using Polish as an example of a highly inflective language. We
      perform experiments on VoxPopuli and The Polish Parliamentary speech datasets and estimate
