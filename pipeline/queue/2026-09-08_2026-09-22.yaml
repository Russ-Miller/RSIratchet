      deployment remains impeded by training instability arising from the reliance on importance
      sampling. We introduce Group Variance Policy Optimization (GVPO), a novel post-training method
      that integrates the analytical solution of KL-constrained reward maximization into its
      gradient weighting scheme. This formulation provides an intuitive interpretation: GVPO's
      gradient corresponds to the mean squared error between the central distance of implicit
      rewards and that of actual rewards. GVPO offers two key advantages: (1) it guarantees a unique
