      is required to be fast, stable and context-aware. For unsegmented languages such as Japanese,
      G2P additionally couples word segmentation with highly context-dependent polyphone
      disambiguation, and the scarcity of accurately annotated data remains a bottleneck. In this
      paper, we present a context-aware neural G2P method that scores paths of a discriminative
      conditional random field (CRF) over a word lattice constructed from dictionaries. To tackle
