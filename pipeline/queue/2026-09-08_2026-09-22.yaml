    abstract: "High-quality pre-training data is a critical bottleneck for educational and STEM-specific
      language models targeting edge AI and on-device deployment where token budgets are tightly
      constrained. While major organizations train ever-larger models on private corpora, the open
      ecosystem lacks STEM-focused synthetic datasets that deliver high per-token learning value
      efficiently for small models. To address this gap, we introduce QVAC Genesis III, a
      191.43B-token, STEM-focused multi-domain synthetic corpus covering 19 domains across several
      difficulty levels and different educational styles. QVAC Genesis III is built via a dual
      generation strategy that performs targeted teacher distillation using a weak edge-scale
      student model as signal: the student's failures are converted into corrective explanations,
      while its successes are expanded into contrastive option-level reasoning over all answer
      choices. We further introduce an LLM-as-a-parser evaluation protocol that extracts final
      answers from free-form outputs and tracks both accuracy and answer validity. To validate the
      effectiveness of our QVAC Genesis III data, we conduct controlled from-scratch ablations with
      1.7B-parameter models, showing that models trained with QVAC Genesis III consistently
