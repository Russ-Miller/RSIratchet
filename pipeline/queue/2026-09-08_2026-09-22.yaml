      frequently exhibit dramatic variations in sensory and compute complexity over time.
      Correspondingly, a natural resource-efficient choice for robot control is to dynamically
      switch between control modes with varying resource allocations. However, such "mode-switching
      controllers" (MSCs) have historically required laborious, expert-driven design and synthesis
      for each new task. Driven by these design difficulties, modern robotic control architectures
      often fall back to a wasteful "monolithic" one-size-fits-all structure, where resource
      allocation is permanently anchored to the hardest, most resource-intensive task phases. To
      facilitate the design of performant yet efficient MSCs, we propose LLM-Guided synthesis of
      Efficient Mode-Switching Control Architectures (LEMCA). LEMCA represents MSC designs as
