    abstract: "Autoregressive (AR) text-to-speech (TTS) models generate discrete speech tokens
      sequentially, which makes inference slow and can degrade robustness, since local errors
      propagate to later positions and can escalate into hallucination. This limitation stems from
      their left-to-right AR commitment: each token must be determined before future speech-token
      context is available. However, such ordering is not an inherent requirement for TTS, since the
      model receives the full input text before synthesis. In this paper, we introduce DELTA-TTS, a
      lightweight LoRA-based adaptation framework that converts a pretrained AR TTS model into a
      discrete diffusion language model (dLLM) for confidence-ordered speech-token decoding. To
      better capture the local structure of speech, DELTA-TTS incorporates a convolution module that
      injects local acoustic context, together with a 1/t-weighted training objective and a
      time-shifted inference schedule that together defer low-confidence positions to later steps.
