    abstract: "Large Language Model (LLM) social simulations are a promising research method, but they
      are not yet faithful enough to be adopted widely. In this work, we investigate whether the
      current scaling paradigm in language modeling is likely to close these gaps, or whether
      simulation fidelity is orthogonal to general capabilities and therefore deserving of more
      research attention. We use scaling laws to study the relationship between LLMs' compute scale,
      general capability benchmarks, and the fidelity of social simulation in three representative
      sub-domains: opinion modeling, behavioral simulation, and longitudinal forecasting.
      Surprisingly, we discover strong compute scaling in all three settings, using a suite of 85
      transformer LLMs with the Qwen3 architecture pre-trained on the DCLM web text corpus under
      fixed-compute budgets from $10^{18}$ to $10^{20}$ FLOPs. Then we evaluate 35 larger and more
