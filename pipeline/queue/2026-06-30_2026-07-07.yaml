    abstract: LLM-powered agents struggle with personalization when users issue raw, underspecified
      queries. In this setting, agents must infer latent intent, extract preferences from noisy
      interaction histories, and select among competing alternatives. Existing benchmarks rarely
      test this capability, as they often rely on user-refined queries or simplified histories. We
      introduce personalized product search (PPS), a testbed for agentic personalization under raw
      queries and diverse histories. We construct Agent Personalized Benchmark (APeB) from action
      logs, pairing underspecified intents with rich histories and user-viewed candidate items.
      Evaluating state-of-the-art LLMs with multi-step agent workflows, we find that models handle
      explicit queries well but struggle with early-stage queries requiring intent and preference
      discovery. Rubric analysis attributes this gap mainly to ineffective history use. A simple
      history-aware query-refinement pipeline, VQRA, yields consistent gains, highlighting the need
      for dedicated history-utilization modules in personalized agents.
