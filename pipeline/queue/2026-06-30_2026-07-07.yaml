      lack semantic understanding of the target program, and by their inability to learn from past
      reduction experiences. We present a new approach that recasts program reduction as an
      autonomous reasoning task powered by agentic Large Language Models (LLMs). Instead of applying
      fixed transformation rules, our method enables an LLM to analyze program semantics, formulate
      reduction hypotheses, and iteratively refine its approach based on execution outcomes.
