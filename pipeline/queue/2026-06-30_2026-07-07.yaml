    abstract: "Large language models achieve strong performance on many reasoning tasks when allowed to
      externalize intermediate steps as Chain-of-Thought (CoT). However, many questions require the
      model to internalize the multi-step reasoning within a single forward pass before generating
      the answer. We study this challenge through two-hop reasoning, a representative task where the
      model must compose multiple pieces of parametric knowledge within a single forward pass.
      Standard non-recurrent Transformers suffer from a depth-local storage problem: facts learned
      in earlier layers are unavailable where second-hop retrieval happens. We found that Looped
