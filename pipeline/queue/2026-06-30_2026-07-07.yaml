      analytical workloads requiring nested aggregations, temporal reasoning, and multi-table joins.
      We present a semantic-layer-mediated NL2SQL agent that decouples semantic intent from physical
      SQL execution. Rather than generating SQL directly over raw schemas, the agent reasons over a
      curated semantic layer through a compact intermediate representation called the Semantic Model
      Query (SMQ). A deterministic compiler translates each SMQ into dialect-specific SQL, providing
      verified building blocks that the agent composes into the final query. The system employs a
      constrained think-act loop, supports SQLite, BigQuery, and Snowflake backends, and is
      integrated into an end-to-end evaluation framework. Using Gemini 3 Pro, the system achieves
      94.15% execution accuracy on the 547-task Spider2-snow benchmark, ranking third on the
      official leaderboard and substantially outperforming schema-only approaches. We describe the
      system architecture, SMQ representation, agent workflow, evaluation results, and discuss
      semantic-layer quality and the trade-off between improved grounding and overfitting.
