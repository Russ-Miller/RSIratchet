      fail to properly attend to visual inputs during reflection, limiting their ability to
      translate feedback into grounded corrections, especially for out-of-distribution images. To
      address this issue, we propose a novel reinforcement learning training framework VRRL, with
      two components explicitly designed to elicit visually grounded self-reflection. First, we
      randomly mask trajectory prefixes during training to emphasize recovery from incorrect
      intermediate predictions rather than making early mistakes. Second, we introduce buffered
