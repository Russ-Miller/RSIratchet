      into traceable quantum-application workflows through specialized agents for requirement
      parsing, formulation, code generation, review, execution, and verification. We evaluate QPipe
      on 20 NL requirements, each associated with a real-world benchmark and a test-optimization
      problem. QPipe successfully completes the key stages of quantum-application generation across
