    abstract: "Large Vision-Language Models (LVLMs) rely extensively on Visual Instruction Tuning (VIT)
      to elicit their multimodal reasoning capabilities. However, we find a discrepancy: VIT often
      packs multiple language tasks about the same image for conversational, multi-turn training,
      whereas existing benchmarks evaluate LVLMs in isolated, single-turn scenarios. The models can
      suffer from visual attention decay and contextual overfitting during multi-turn training,
      making it hard for them to realize their full potential in the mismatched test phase. To close
      the gap, we propose learning with Stochastic Turn Depth (StochasT), which stochastically
      groups language tasks for the same image into clusters of varying sizes (turn depth) while
      preserving their organic order. Hence, while StochasT draws on Dropout and stochastic depth
      for ResNets, it does not actually drop anything to maximize the utility of the training data.
