    abstract: "It is commonly observed that online reinforcement learning (RL) produces
      better-performing strategies than offline methods across a broad range of performance
      measures. In particular, RL-trained policies exhibit stronger out-of-distribution (OOD)
      behavior, where models trained only with imitation learning approaches often struggle. A
      recent study introduced an OOD-focused benchmark and reported that RL-trained
      vision-language-action (VLA) policies achieve noticeably better OOD performance and slightly
      better in-distribution (IND) performance than their counterparts trained with supervised
      fine-tuning (SFT). In this work, we investigate whether hybrid offline-online training can
      combine the advantages of both approaches. Specifically, we study RL methods regularized by
      offline supervision via either offline data or an offline-trained reference policy. We
      evaluate these approaches on the OOD benchmark and compare them with both offline-only
      training and standard RL. Our results show that although offline training achieves limited OOD
      performance by itself, incorporating offline supervision into RL preserves strong OOD
      capability while substantially improving training efficiency. In particular, the guided
      methods reach performance close to that of standard RL while requiring roughly half of the
      training budget. Rather than producing a trade-off between speed and OOD performance, the
      hybrid approach retains strong OOD capability while achieving this efficiency gain. Project
