    abstract: Reinforcement Learning is commonly used to train large language models using environmental
      feedback. In applied settings, the environment usually provides sparse or delayed feedback.
      This makes it difficult for the model to pinpoint which actions in its reasoning led to
      success or failure. So, learning effectively from these signals is hard because the model must
      determine how each failure should inform meaningful behavioral corrections in subsequent
      iterations. We introduce a training framework, Self-Review Reinforcement Learning, that embeds
      an explicit self-review step into each RL episode. When a first-pass response fails, the model
      generates a self-review to identify what went wrong, which conditions an improved second
      attempt. Unlike inference-time reflection approaches, such as Reflexion, the framework
      optimizes self-review with policy gradients and internalizes improvements into the base policy
      via selective distillation, ensuring they persist across future episodes. A cross-episode
