      can still predict the answer by reasoning from textual cues or linguistic priors rather than
      the provided audio. A common remedy is to train models on data whose answers cannot be
      inferred from text alone. This approach can improve performance, but what changes within the
      model remains unclear. In this paper, we ask what must happen inside the model for the audio
      to actually determine the answer. Our findings are threefold. (1) Replacing the audio with
