      objects to be managed, limiting the flexible evolution of skills and their co-adaptation with
      the reasoning agent. To address the limitations, we propose CoSkill, a unified multi-agent RL
      framework that recasts the static meta-skill workflow as a learnable Meta-Skill Agent and
