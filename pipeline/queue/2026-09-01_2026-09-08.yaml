      proof-synthesis benchmark in physics by a factor of four. AxQM is derived from a near-complete
      formalization of the formal portions of the textbook, so every task is guaranteed a solution,
      which we keep private. Grading of the benchmark is done deterministically by the Lean kernel,
      which checks that the proof compiles, that no sorry appears in it or in any declaration it
      depends on, and that it introduces no new axioms.
