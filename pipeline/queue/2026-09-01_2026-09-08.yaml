      rigor to physics, where theoretical arguments carry idealizations that are rarely stated
      fully, and any logical gaps could have a cascading effect on interdependent results.
      Recognizing the need to evaluate autoformalization systems for physics, we release AxQM, 1,019
      kernel-checkable proof-synthesis tasks over 479 items drawn from the textbook Quantum
      Computation and Quantum Information by Nielsen and Chuang. The tasks are stated in a custom
