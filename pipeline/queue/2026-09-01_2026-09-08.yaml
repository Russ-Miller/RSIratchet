    abstract: Evaluating the calibration of Large Language Models (LLMs) is critical for their safe
      deployment as zero-shot classifiers. Yet, commercial API providers increasingly hide the
      continuous output probabilities required by standard calibration metrics. To bypass this
      opacity, we demonstrate that any LLM API exposing a logit\_bias parameter can be
      mathematically manipulated to evaluate exact probability thresholds using strictly one query
