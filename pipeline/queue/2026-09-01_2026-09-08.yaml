      100\\% success rates, seemingly suggesting that the models are ready for deployment in real
      world. However, near perfect performance on existing benchmarks can be misleading: success
      under ideal conditions does not imply real world robustness. Existing benchmarks primarily
      evaluate task completion from predefined initial states, while real world interactions
      inevitably involve failures such as failed grasps, collisions, and unintended object
      movements. A robot must therefore not only execute tasks successfully, but also recognize and
      recover from failures to continue the task. Yet this capability remains largely unmeasured,
      revealing a critical gap between benchmark performance and real world reliability. To address
      this gap, we introduce LIBERO-Recover Benchmark, a large scale benchmark for failure recovery
      in robotic manipulation. Built upon LIBERO, we collect real execution failures from SOTA
