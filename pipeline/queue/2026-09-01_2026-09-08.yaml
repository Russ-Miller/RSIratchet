    abstract: Reasoning in large language models unfolds through diverse functional operations, such as
      problem formulation, goal decomposition, and deduction. Although these operations are
      explicitly distinguished in text, little is known about how they are geometrically organized
      in representation spaces. To this end, we investigate whether distinct reasoning operations
      exhibit corresponding geometric structure in hidden representations. We find that operations
      are separable in held-out representations, with separability peaking in middle layers, and
      verify that this structure is not explained by lexical or positional confounds. Across layers,
      token-wise operation-alignment becomes more distributed over spans, while identical surface
      tokens are represented differently depending on the operation of its surrounding chunk.
      Attention-masking interventions further show that operation-aligned representations at chunk
      onset depend on preceding reasoning context. Consequently, our work demonstrates that language
      models maintain representational correspondence between linguistic reasoning expressions and
      their internal geometric structures. Code and project materials are available at
