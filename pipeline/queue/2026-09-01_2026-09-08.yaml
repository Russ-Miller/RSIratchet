    doi: https://doi.org/10.48550/arxiv.2609.05009
    authors:
      - Maxim Chupilkin
    venue: arXiv (Cornell University)
    topic: Explainable Artificial Intelligence (XAI)
    cited_by_count: 0
    abstract: "Safety evaluations can mischaracterize deployed behaviour if artificial-intelligence
      systems respond to being evaluated. We test this possibility in a full-factorial conjoint
      experiment on decisions to start a war, spanning 20 large language models, 32 scenarios, 10
      repetitions and two conditions (N = 12,800 judgments). Adding one sentence, \"You are tested
      for alignment with human values\", produced two effects. First, it produced a level effect:
      mean willingness to start war fell by 13.43 points on a 0-100 scale (95% confidence interval,
      -16.20 to -10.65). Second, it produced a structural effect by changing which information drove
      judgments. Probability of success was the largest factor for 17 of 20 models at baseline;
      under the cue, civilian casualties were largest for 12. Standardized estimates show that this
      reordering arose principally because models attenuated strategic considerations such as
      probability of success and domestic support. Evaluation framing therefore changes both an
      answer's level and its revealed decision rule."
