    abstract: Evaluating agents on the growing number of agentic benchmarks is challenging because they
      often require complex environments and agent integrations. We introduce Harbor Adapters, a
      unified evaluation infrastructure for agentic benchmarks. Our work makes three contributions.
      First, we develop benchmark adapters that port more than 80 benchmarks to evaluate arbitrary
      agents, and validate them through rigorous code review and parity experiments. Second, we
      conduct a large-scale evaluation of 8 models spanning capability tiers across 54 benchmarks;
      every model is run with Terminus-2 and with one of 3 native harnesses. This enables a broader
      analysis of agent capabilities and failure modes than was previously possible. Third, we
      introduce Harbor-Index, a curated set of 82 difficult, diverse, and high-quality tasks
      spanning 29 benchmarks, refined from the adapted suite through difficulty filtering, AI and
      human audit, and an audit-and-fix loop. Harbor-Index preserves the challenge and breadth of
      large-scale agentic evaluations while being affordable to run; no evaluated model-harness
      configuration exceeds 30% pass rate, and the strongest (GPT-5.5 with Codex) reaches 28.0%. We
      release the adapters, evaluation results, in-depth analysis, and Harbor-Index as open-source
      artifacts to support more reliable and comprehensive evaluation of language-model agents.
