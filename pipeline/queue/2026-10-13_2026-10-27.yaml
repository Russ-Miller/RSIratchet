    topic: Misinformation and Its Impacts
    cited_by_count: 0
    abstract: "Large language models (LLMs) are widely used to answer factual questions, but their
      answers can contain errors and must be fact-checked claim by claim. Yet the resulting score
      depends on three design decisions: which questions the claims answer, under what conditions
      each claim is judged, and which sources count as evidence. No existing benchmark specifies all
      three. We introduce JSFactCheckBench, a Japanese benchmark that specifies all three, with
      1,913 claims from LLM answers to questions about misleading information that circulated on
      Japanese social media, each annotated for factuality at a reference time and for importance to
      the question, using evidence from preselected Web sources. Across six LLMs, all verify claims
      directly answering the question less accurately than supplementary claims, a gap that
      aggregate scores obscure. Scores also drop when models must locate the relevant content in
      longer or multiple sources and, for all four open models, when the surrounding question and
      response are added. These weaknesses are visible only because the benchmark records the
      conditions behind each label. A benchmark that leaves them implicit cannot reveal them."
