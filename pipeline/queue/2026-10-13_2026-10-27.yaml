    abstract: "Long-context language models (LCLMs) power agents that act over long trajectories, from
      improving a codebase to running research experiments to forecasters that condition on lengthy
      histories. These applications draw on three distinct long-context capabilities: recall, where
      the answer is a fact present in the context; state tracking, where the outcome can be computed
      by performing a series of transformations to a specified state; and pattern learning, where
      the goal is to make a prediction by sampling from a distribution inferred from many
      observations. Existing benchmarks primarily focus on the first capability. In this work, we
      introduce LEAPS (Long-context Evaluation of Adaptive Pattern learning and State tracking), a
      collection of 12 novel datasets, spanning agentic workflows, behavioral modeling, and
      forecasting of market and world events. By construction, LEAPS is resistant to data
      contamination, extends to millions of input tokens, and uses reliable metrics. We evaluate 30
      API and open models from 8K to 512K input tokens. LEAPS distinguishes models that perform near
      perfectly on recall tasks, finding that such models' state tracking and pattern learning
      abilities can vary significantly and degrade much more dramatically with increasing input
      lengths--even for pattern learning, where more observations should make learning a
      theoretically easier task. Moreover, thinking models often underperform their base
      counterparts, exhausting their generation budget or oversimplify"
