    abstract: "Majority Voting (MV) is a simple and widely used strategy which improves the reasoning
      accuracy of Large Language Models (LLMs) by allocating additional inference-time computation.
      Specifically, in MV multiple Chain-of-Thoughts (CoTs) are independently sampled and the most
      frequent final answer is selected. In this work, we propose Length-Conditioned Majority Voting
      (LCMV), a Test-Time Training approach which improves MV leveraging an empirical observation
      that has recently been established in several studies: longer CoTs tend to be associated with
      a lower probability of correctness. We formulate this inductive bias as a length-conditioned
      prior probability, which is modeled by a simple logistic function. Moreover, we adapt this
      prior at test time using only unlabeled testing data and without fine-tuning the LLM. Finally,
      the adapted prior is used to weight the vote of each sampled answer. Extensive experiments
      across multiple LLMs and reasoning benchmarks show that LCMV consistently improves over both
      standard MV and existing length-based and confidence-based aggregation strategies, while
      retaining the simplicity and model-agnostic nature of MV. Our code is available at:
      https://github.com/aimagelab/LCMV."
