    abstract: "The training loss of binary and ternary neural networks, expanded as a multilinear
      polynomial over the discrete weights, is structurally equivalent to the energy of a
      hierarchical high-order Ising model. We exploit this equivalence to apply Ising solvers to
      discrete-weight network training, while accounting for a fundamental difference in objectives:
      an Ising solver seeks the ground state of a fixed energy function, whereas training seeks
      solutions that generalize to unseen data. Our key contribution is $ΣΔ$-Sampler, an optimizer
      that reconciles these objectives by embedding a stochastic sampling-and-annealing step as a
      noisy quantizer inside a first-order $ΣΔ$ noise-shaping loop. The loop pushes noise from
      weight quantization, high-order frustration, and mini-batch sampling out of the low-frequency
      adaptation band, so that discrete weight updates follow the smooth descent trajectories
      embedded in the rugged loss landscape. We validate the framework on a planted quadratic
      unconstrained binary optimization (QUBO) benchmark with a known minimizer; on CIFAR-10, where
      a $13$M-parameter ternary model comes within $1\\%$ of full-precision accuracy; on
      ImageNet-1k, where a ternary ResNet-18 comes within $0.4\\%$ Top-5 accuracy of a ternary
      baseline; on class-incremental continual learning, where prior-task accuracy is preserved; and
      on MatMul-free language models up to $2.7$B parameters, where it outperforms a
      straight-through-estimator baseline under matched continued pre-training. C"
