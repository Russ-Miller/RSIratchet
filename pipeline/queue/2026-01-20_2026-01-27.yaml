      practical application of VLMs, e.g. where recognizing familiar people and objects is crucial
      for effective visual understanding. Existing solutions typically learn to recognize instances
      one at a time using instance-specific datasets, which not only incur substantial data
      collection and training costs but also struggle with fine-grained discrimination. In this
      work, we propose IIR-VLM, a VLM enhanced for In-context Instance-level Recognition. We
      integrate pre-trained ILR expert models as auxiliary visual encoders to provide specialized
