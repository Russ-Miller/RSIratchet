    abstract: The rapid expansion of Earth Science data from satellite observations, reanalysis
      products, and numerical simulations has created a critical bottleneck in scientific discovery,
      namely identifying relevant datasets for a given research objective. Existing discovery
      systems are primarily retrieval-centric and struggle to bridge the gap between high-level
      scientific intent and heterogeneous metadata at scale. We introduce \textbf{ReSearch}, a
      multi-stage, reasoning-enhanced search framework that formulates Earth Science data discovery
      as an iterative process of intent interpretation, high-recall retrieval, and context-aware
      ranking. ReSearch integrates lexical search, semantic embeddings, abbreviation expansion, and
      large language model reranking within a unified architecture that explicitly separates recall
      and precision objectives. To enable realistic evaluation, we construct a literature-grounded
      benchmark by aligning natural language intent with datasets cited in peer-reviewed Earth
      Science studies. Experiments demonstrate that ReSearch consistently improves recall and
      ranking performance over baseline methods, particularly for task-based queries expressing
      abstract scientific goals. These results demonstrate the importance of intent-aware,
      multi-stage search as a foundational capability for reproducible and scalable Earth Science
      research.
