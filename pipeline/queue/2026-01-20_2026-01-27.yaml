      using lightweight sparse autoencoders, and constructs a CPU-based inverted index mapping
      features to token positions or spans during a single streaming scan. This design allows the KV
      cache to be discarded entirely and bounds GPU memory usage by the scan chunk size. At
      generation time, feature co-activation is used to retrieve compact evidence spans, optionally
