      in a one-shot manner. Further, IIR-VLM leverages this knowledge for instance-aware visual
      understanding. We validate IIR-VLM's efficacy on existing instance personalization benchmarks.
      Finally, we demonstrate its superior ILR performance on a challenging new benchmark, which
      assesses ILR capabilities across varying difficulty and diverse categories, with person, face,
      pet and general objects as the instances at task.
