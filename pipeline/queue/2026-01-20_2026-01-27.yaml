      ancestral capabilities. This paper presents a systematic comparative study of catastrophic
      forgetting across twenty premier models representing the state-of-the-art in mid-2026. We
      categorize our investigation into two primary research lines: (i) a behavioral and semantic
      output drift analysis of ten leading closed-source models (including Claude Fable 5, GPT-5.5
      High, and Gemini 3.5 Flash), and (ii) a deep mechanistic interpretation of ten prominent
      open-weight architectures (such as DeepSeek-V4-Pro, Llama 4 Maverick, and Qwen 3.6-27B).
      Through weight-space trajectory tracking, Centered Kernel Alignment (CKA), and routing gate
      drift calculations in Mixture-of-Experts (MoE) layers, we localize the neural circuits highly
      susceptible to parameter overwriting. Our findings indicate that early-layer attention heads
      exhibit systemic entropic dispersion, while mid-to-deep feed-forward networks (or sparse
      expert blocks) suffer localized representation collapse. Informed by these insights, we
      introduce Low-Rank Circuit Projection (LRCP), a subspace-regularized training intervention.
      Empirical evaluations show that LRCP successfully mitigates up to 94.2% of ancestral
      capabilities in open-weight configurations and matches the adaptation velocity of standard
      PEFT baselines."
