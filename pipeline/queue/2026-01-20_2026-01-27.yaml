    abstract: Large language models (LLMs) make next-token predictions based on clues present in their
      context, such as semantic descriptions and in-context examples. Yet, elucidating which prior
      tokens most strongly influence a given prediction remains challenging due to the proliferation
      of layers and attention heads in modern architectures. We propose Jacobian Scopes, a suite of
      gradient-based, token level causal attribution methods for interpreting LLM predictions.
      Grounded in perturbation theory and information geometry, Jacobian Scopes quantify how input
      tokens influence various aspects of a model's prediction, such as specific logits, the full
      predictive distribution, and model uncertainty (effective temperature). Through case studies
      spanning instruction understanding, translation, and in-context learning (ICL), we demonstrate
      how Jacobian Scopes reveal implicit political biases, uncover word- and phrase-level
      translation strategies, and shed light on recently debated mechanisms underlying in-context
      time-series forecasting. On token-ablation faithfulness benchmarks (LAMBADA and IWSLT2017)
      across six LLMs, the distribution-level Fisher and Temperature Scopes significantly outperform
      established gradient-based attribution methods in 10 of 12 model-dataset settings. To
      facilitate exploration of Jacobian Scopes on custom text, we open-source our implementations
      and provide a cloud-hosted interactive demo at
