      We introduce ReasonNavi, a human-inspired framework that operationalizes this reason-then-act
      paradigm by coupling Multimodal Large Language Models (MLLMs) with deterministic planners.
      ReasonNavi converts a top-down map into a discrete reasoning space by room segmentation and
      candidate target nodes sampling. An MLLM is then queried in a multi-stage process to identify
      the candidate most consistent with the instruction (object, image, or text goal), effectively
      leveraging the model's semantic reasoning ability while sidestepping its weakness in
      continuous coordinate prediction. The selected waypoint is grounded into executable
      trajectories using a deterministic action planner over an online-built occupancy map, while
      pretrained object detectors and segmenters ensure robust recognition at the goal. This yields
      a unified zero-shot navigation framework that requires no MLLM fine-tuning, circumvents the
      brittleness of RL-based policies and scales naturally with foundation model improvements.
      Across three navigation tasks, ReasonNavi consistently outperforms prior methods that demand
      extensive training or heavy scene modeling, offering a scalable, interpretable, and globally
