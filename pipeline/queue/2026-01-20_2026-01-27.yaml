    abstract: As the development of Large Language Models (LLMs) shifts from parameter scaling to
      inference-time collaboration, the Mixture-of-Agents (MoA) framework has emerged as a general
      paradigm to harness collective intelligence by layering diverse models. While recent MoA
      variants have introduced dynamic routing and residual connections to improve efficiency, these
      methods often fail to facilitate deep semantic interaction between agents, limiting the
      system's ability to actively correct hallucinations and refine logic. In this paper, we
      introduce Attention-MoA, a novel MoA-based framework that redefines collaboration through
      Inter-agent Semantic Attention. Complemented by an Inter-layer Residual Module with Adaptive
      Early Stopping Mechanism, our architecture mitigates information degradation in deep layers
      while improving computational efficiency. Extensive evaluations across AlpacaEval 2.0,
      MT-Bench, and FLASK demonstrate that Attention-MoA significantly outperforms state-of-the-art
      baselines, achieving a 91.15% Length-Controlled Win Rate on AlpacaEval 2.0 and dominating in
      10 out of 12 capabilities on FLASK. Notably, Attention-MoA enables an ensemble of small
      open-source models to outperform massive proprietary models like Claude-4.5-Sonnet and
      GPT-4.1, achieving an MT-Bench score of 8.83 and an AlpacaEval 2.0 LC Win Rate of 77.36%.
