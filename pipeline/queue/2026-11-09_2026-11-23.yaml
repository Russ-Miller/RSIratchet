    abstract: "Embodied intelligence aims to let robots perform complex physical tasks with human-like
      adaptability and reliability, which requires three complementary capabilities: history-based
      cognitive reasoning, precise and timely physical execution, and the composition of reasoning
      and execution through environmental feedback. Yet existing benchmarks either evaluate
      reasoning and execution within the same tasks or assess them separately without their
      composition, so they reveal little about whether a failure comes from reasoning, execution, or
      their composition. We introduce Mind2Act World, a diagnostic benchmark of 30 simulated
      manipulation tasks from five real-world application domains. Each task has three difficulty
      levels and two scene settings (Clean and Random), yielding 180 configurations. The tasks form
      three views: Mind tests decisions based on past observations, Act tests precise and timely
      execution, and Mind2Act combines both in closed-loop tasks where action outcomes guide later
      decisions. Comparing the three views shows whether a system lacks a capability or fails to
      compose capabilities it already has. A diagnosis harness further attributes the failed
      episodes of three representative systems to Mind, Act, or their composition and summarizes
      each system in a profile card. Our evaluation of multimodal agents, vision-language-action
