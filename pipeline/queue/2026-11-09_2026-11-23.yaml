    title: Client Exits - A Way to Increase LLM Transparency on the Client Side
    date: 2026-11-19
    arxiv_id: "2611.26309"
    doi: https://doi.org/10.48550/arxiv.2611.26309
    authors:
      - Marc Jansen
    venue: arXiv (Cornell University)
    topic: Explainable Artificial Intelligence (XAI)
    cited_by_count: 0
    abstract: Textual recommendations generated by large language models (LLMs) can be difficult to
      inspect. This paper introduces \emph{Client Exits}, a lightweight mechanism for enriching LLM
      responses while separating semantic intent from client-specific presentation. The model
      inserts predefined, machine-interpretable markers into its output, and the receiving client
      decides whether and how to realize the corresponding enrichments. This allows supplementary
      information to be presented as graphics, text, speech, or other modalities without prescribing
      a concrete interface. We implement a prototype combining a finetuned Qwen model with a
      modified LibreChat client. Using the Question--Option--Criteria (QOC) approach including three
      XML-based client exits. We evaluate two QOC-oriented model variants trained on essentially the
      same examples, with client-exit annotations added for one variant. Across 100 test questions,
      the client-exit model includes all three markers in every response. An LLM judge, informed
      about the mechanism without being instructed to favor it, prefers this model's answers in 66\%
      of the comparisons. These results demonstrate successful marker generation on the evaluated
      test set and support the feasibility of client-controlled enrichment.
    proposal:
      suggests_new_capability: false
