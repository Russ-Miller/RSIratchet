    title: "MolReps: Taking SELFIES, Making SMILES, Teaching LLMs"
    date: 2026-11-16
    arxiv_id: "2611.20848"
    doi: https://doi.org/10.48550/arxiv.2611.20848
    authors:
      - Ken Deng
      - Garrett Morris
    venue: arXiv (Cornell University)
    topic: Computational Drug Discovery Methods
    cited_by_count: 0
    abstract: The same molecule can be expressed in multiple, syntactically distinct representations,
      yet it remains unclear whether large language models (LLMs) can recognize and relate these
      equivalent encodings. We introduce MolReps, a pipeline that generates 9,600 question-answer
      pairs across ten representations for conversion, normalization, and 2D structure recognition.
      Post-training on MolReps improves text-only and multimodal models, MolQwen3-4B-Instruct
      (MQ3-4B-I) and MolQwen3-VL-4B-Instruct (MQ3-VL-4B-I), from $4.01\%$ to $75.13\%$ and from
      $7.11\%$ to $73.14\%$ (InChIKey match) on the molecule-overlap test set, respectively. On the
      molecule-disjoint test set, post-training increased validity from $20.35\%$ to $58.12\%$ for
      MQ3-4B-I and from $17.19\%$ to $59.34\%$ for MQ3-VL-4B-I. However, InChIKey match remained
      low, decreasing from $3.86\%$ to $3.09\%$ and from $6.44\%$ to $2.29\%$, respectively.
      Furthermore, the resulting models achieve a relative $27.84\%$ improvement in average over
      their base model on MolRepBench, a comprehensive benchmark for evaluating molecular property
      prediction. These results show the effectiveness of targeted post-training for enhancing
      molecular representation understanding and its potential to improve downstream molecular
      tasks.
    proposal:
      proposed_id: notation-format-equivalence
      proposed_label: Recognizing the same object across notations
      scope_note: Covers converting and recognizing equivalence among syntactically different encodings of
        the same entity (e.g. SMILES/SELFIES/InChI, formula notations); excludes natural-language
        paraphrase robustness.
      rationale: MolReps tests whether LLMs can relate and convert between equivalent molecular
        representations.
