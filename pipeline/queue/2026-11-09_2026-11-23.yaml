    abstract: Automating experiments does not necessarily advance scientific understanding. Research
      agents must identify meaningful knowledge gaps, determine what available data can resolve, and
      assess whether their findings advance existing knowledge. We introduce DeepQuest, a
      knowledge-gap-driven AI scientist framework for Alzheimer's disease research. DeepQuest
      transforms unresolved questions from domain reviews into traceable, testable hypotheses and
      prioritizes them through data feasibility screening and groupwise Elo ranking. It couples
      iterative experimentation with two-level auditing that separates experimental reliability from
      knowledge contribution relative to two frozen literature corpora. On OASIS-3, DeepQuest
      produces 42 feasible hypotheses and outperforms the strongest baselines in 14 of 15
