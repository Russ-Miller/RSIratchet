    abstract: We introduce Clover-35B-A3B-Preview (Clover), a mixture-of-experts diffusion language
      model with 35 billion total parameters and 3 billion activated parameters, supporting
      thinking-mode generation. Clover adapts Gated Delta Networks to block diffusion by combining
      recurrent memory of previously generated context with bidirectional softmax attention inside
      the current block. Historical memory readout competes with current-block tokens in a shared
      softmax, with learnable block-size calibration and a separate, zero-initialized right-context
      convolution branch. Clover leads the seven evaluated agent metrics, including 73.6 on
      SWE-bench Verified and 51.7 on Terminal-Bench 2.1. On internal agent workloads, it reaches a
      reported generation speed of 680 tokens/s using one NVIDIA GB300 GPU at BF16 precision and
      batch size one. We organize the evaluation around model quality, drafting and verification
      costs, and deployment under constrained memory. We also describe a decision-model variant that
      generates answers to related questions in one denoising pass. On an internal set of 500
      groups, joint prediction raises question accuracy from 90.37% to 93.88% and all-correct group
      accuracy from 65.4% to 77.0%.
