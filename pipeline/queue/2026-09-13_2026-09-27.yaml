    authors:
      - Yawen Ouyang
      - Xinbo Zhang
      - Ziyuan Ma
      - Yixin Wu
      - Wenbin Liao
      - Feiran Zhang
    venue: arXiv (Cornell University)
    topic: RNA and protein synthesis mechanisms
    cited_by_count: 0
    abstract: "Protein modification requires navigating an immense sequence space, yet wet-lab
      validation remains low-throughput and costly. Although computational paradigms including
      protein language models (PLMs), large language models (LLMs), and LLM-based agents have shown
      promise in protein modification, their relative efficacy across realistic experimental
      decision-making settings remains unclear. To bridge this gap, we introduce PFArena, a
      benchmark comprising four controlled task interfaces that cover single-mutant generation and
      multi-mutant ranking. By providing varying levels of mutation fitness data, PFArena reflects
      four representative research scenarios characterized by differing degrees of prior
      experimental context. We assess six PLMs, six LLMs, and five LLM-based agents using
      complementary metrics to measure both peak and overall protein modification performance. Our
      evaluation reveals that model performance shifts systematically with the availability of
      target-specific experimental evidence: PLMs demonstrate proficiency in open-ended
      single-mutant generation by leveraging protein-specific priors, whereas LLMs and agents
      perform strongly in multi-mutant ranking, particularly when target-specific fitness data are
      available. Nevertheless, all model families face fundamental challenges with increasing
      search-space size and mutation depth. We release our code and benchmark suite to facilitate
      reproducible research in model-assisted protein modification."
