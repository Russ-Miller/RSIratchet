      - Mao Zheng
    venue: arXiv (Cornell University)
    topic: Multimodal Machine Learning Applications
    cited_by_count: 0
    abstract: "Role-playing agents based on large language models have been widely applied in areas such
      as personalized assistance and social simulation. Recent RL methods typically train on a fixed
      scenario pool collected before learning begins. This creates a distributional bottleneck: as
      the agent improves, the scenarios where it performs poorly also change, while the training
      distribution remains static. Therefore, we propose AdvRole, an adversarial context rewriting
      framework that turns role-playing RL into a closed-loop curriculum. AdvRole alternates between
      an Actor that learns to role-play and a Rewriter that edits character profiles and dialogue
      contexts into actor-specific hard scenarios. The Rewriter is trained with a performance-gap
      reward, which favors rewrites that reduce the current Actor's score relative to the original
      scenario. As a result, the scenario pool evolves with the Actor and continuously targets
      under-mastered regions of the character-context space. Experiments on three role-playing
      benchmarks covering English and Chinese, as well as a new multilingual benchmark we release,
      show that AdvRole consistently outperforms baselines."
    proposal:
      proposed_id: persona-consistency
      proposed_label: Staying in character
      scope_note: Covers maintaining a specified persona's knowledge, style and boundaries across
        dialogue, including under adversarial or off-profile contexts; excludes general instruction
        following and cultural norm knowledge.
      rationale: The paper trains and evaluates role-playing agents on adversarially rewritten character
        profiles and contexts where they break character.
