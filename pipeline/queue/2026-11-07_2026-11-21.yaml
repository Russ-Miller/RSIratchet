    abstract: Time series foundation models as well as the language-guided analytical agents achieve
      strong accuracy on standard chronological benchmarks. However, models that rank highest on
      historical validation splits often degrade across non-stationary regime transitions. We
      hypothesise that this gap arises from using historical backtesting as an open-ended search and
      model-selection objective instead of using it to test pre-specified compositional assumptions.
      Real-world time series are generated by recurring latent primitives that co-move within finite
      historical windows. Under strong historical co-movement, chronological holdout error cannot
      separate predictors that learn invariant couplings among primitives from predictors that fit
      transient historical correlations. Searching over large pools of architectures,
      hyperparameters, or chain-of-thought rules further biases selection toward historical
      shortcuts. Through theoretical analysis and diagnostic experiments on a controlled
      multi-primitive benchmark and German day-ahead electricity prices, we show that expanding
      validation search fails to improve out-of-regime accuracy, and that decomposing primitives
      without an ex-ante falsification test still breaks down when residual correlations shift.
      Hence, we propose formulating time series forecasting and reasoning around falsifiable
      compositional hypotheses that combine neural primitive encoders, explicit coupling
      constraints, and training-calibrated falsification tests.
