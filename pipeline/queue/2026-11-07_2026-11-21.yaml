    abstract: "Thinking with images (TwI) empowers vision-language models (VLMs) to overcome perceptual
      bottlenecks by actively cropping and zooming into fine-grained visual details, promising both
      higher accuracy and interpretable, region-grounded reasoning. However, our analysis shows that
      the improved accuracy of TwI models does not guarantee faithful tool use; they frequently
      invoke tools without actually relying on the zoomed region, undermining the reliability of
      tool-assisted reasoning. We trace this unfaithful behaviour to the training data: when
      questions are answerable without zooming, the model can answer correctly while ignoring the
      returned evidence, and this problem is exacerbated during training as the model becomes better
      at answering without tools. To keep zooming useful throughout training, we adapt the training
      data to the model's evolving capability and train on questions where correct zoomed evidence
      can still help the model answer correctly. This selection is supported by a data synthesis
      pipeline that localises small objects and constructs verifiable questions about their fine
      details, and complemented by an adaptiveness reward that favours tool-free answers when
      zooming is unnecessary. The experimental results show that our method substantially improves
      reasoning faithfulness and achieves state-of-the-art performance on visual search benchmarks
