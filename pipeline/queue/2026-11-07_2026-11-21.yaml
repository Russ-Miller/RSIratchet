    abstract: We evaluated the feasibility, acceptability, and engagement of three digital formats for
      dialectical behavior therapy (DBT) mindfulness skills training. In a 30-day randomized pilot
      study, 45 university students were assigned to GenAI-DBT, a general-purpose large language
      model chatbot (Chatbot), or a static web resource (Web). Forty-two completed the study, and
      nine completed follow-up interviews. Usability scores were within acceptable ranges across
      conditions, with no significant between-group differences. GenAI-DBT showed the highest
      observed participant-week adherence (71.4%, vs. 53.3% for Web and 42.3% for Chatbot), a
      descriptive difference. Mindful Attention Awareness Scale and Difficulties in Emotion
      Regulation Scale scores showed no significant time-by-group interactions, and session-level
      self-reported mood changes did not differ significantly across conditions. GenAI-DBT showed a
      larger positive change in linguistic valence than Chatbot (4.28 vs. 1.59, P = .02, Cohen's d =
      0.99). Interviewees valued contextualized, scenario-based practice and identified response
      latency, repetition, and limited personalization as areas for improvement. The findings
      support the feasibility and acceptability of DBT-informed conversational AI for skills
      practice and motivate further evaluation in larger, more clinically relevant samples. Clinical
      efficacy remains to be established.
