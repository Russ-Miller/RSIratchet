    abstract: Role allocation strategies in human-robot collaboration typically assign tasks to both the
      human and the robot, limiting the user's ability to take initiative. Furthermore, allocation
      decisions may conflict with the user's intentions, and the rationale behind such allocations
      may remain unclear, potentially reducing both acceptance and collaboration fluency. The
      novelty of the proposed framework is that the human is left free to contribute to the task,
      while the robot is dynamically allocated activities through a cost-driven Behavior Tree
      architecture according to user-expressed preferences and behavior. Explicit preferences are
      extracted from natural language instructions using a large language model, whereas human
      activity is monitored online through a Shannon entropy-based analysis of hand-object
      interactions. Furthermore, the framework can recognize anomalies in human execution and
      autonomously trigger corrective robot actions. The approach was validated through a pilot
      study and a multi-subject experiment involving 14 participants. Results demonstrate the
      potential of such an allocation strategy for enabling intuitive and engaging collaboration
