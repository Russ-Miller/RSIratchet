    abstract: "On-policy self-distillation (OPSD) offers a promising approach to improving visual
      reasoning in multimodal large language models (MLLMs). However, not all samples benefit
      equally from privileged visual guidance, and uniform token supervision can dilute visually
      grounded signals. We propose VisAlloc, a dual-level framework combining sample-level visual
      filtering with token-level counterfactual reweighting. A fixed paired-teacher filter retains
      samples answered correctly from an evidence-centered positive crop but incorrectly from a
      spatially displaced negative crop. At the token level, both EMA teachers score the same
      student-generated response, and their absolute log-probability differences measure view
      sensitivity. Additional supervision targets tokens admitted by sensitivity or
      teacher-distribution disagreement, with shared frozen-prior, template-bigram, and
      student--teacher divergence gates. Inverse-frequency redistribution preserves the total
      additional weight within each micro-batch, while the positive teacher remains the sole
      distillation target. Inference requires only the full-image student. Across eight benchmarks,
