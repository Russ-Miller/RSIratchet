      faithfulness: the principle that semantically equivalent rubrics must yield consistent scores.
      To quantify this, we propose a scale-reversal probe that inverts score anchors without
      altering evaluation criteria. Furthermore, we introduce floor normalization to calibrate
      reversal disagreement against intrinsic model variability, enabling fair cross-model
