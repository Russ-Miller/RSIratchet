    abstract: "Rare language model behaviors can be difficult to study because obtaining them through
      ordinary sampling can require a very large number of samples. This motivates the behavior
      posterior sampling problem: given a language model and a behavior of interest, is there an
      algorithm that efficiently samples from the model's distribution over transcripts that exhibit
      this behavior? We introduce PosteriorBench, a benchmark for comparing algorithms by their
      compute cost and by how close their samples are to the true posterior in forward and reverse
      KL divergence. PosteriorBench contains 21 tasks on Qwen3.5-0.8B with behavior probabilities
      from $10^{-5}$ to $10^{-1}$, each with exact posterior samples from a corpus of one billion
      labeled responses. We find that no method we evaluate is both efficient and faithful: simple
      methods like prompting are cheap but plateau at a high KL divergence from the posterior,
      fine-tuning on posterior samples is often cost-prohibitive, and several training methods from
      prior work do not perform better. Building a posterior sampler that can cheaply approximate
      the true posterior remains an open problem, and we hope PosteriorBench can measure progress
      towards this objective. Code and data are available at
      https://github.com/TransluceAI/PosteriorBench."
