      FrontierOR Challenge asks teams to build agentic workflows that design, test, and improve
      algorithms for many optimization problems at once. Stage 1 releases 60 of the benchmark's 180
      audited problems, spanning six application categories and five formulation types, in weekly
      rounds of 15; Stage 2 introduces new problems outside the benchmark, with unseen instances.
      Two tracks are ranked separately: in the Main track we run the submitted algorithms in a
      network-isolated sandbox with open-source dependencies only; in the Self-hosted track teams
      solve the instances on their own machines, with any software, within a timed window. Every
      solution is checked for feasibility, and a feasible solution scores the ratio of its objective
      to a frozen known reference, averaged over hidden instances."
