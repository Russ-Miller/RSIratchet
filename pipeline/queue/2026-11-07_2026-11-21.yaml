      bilingual English/Mandarin Chinese benchmark covering eight pragmatic phenomena across
      purpose-written and dialogue-derived items, with both culturally adapted and independently
      sourced data. We then evaluate eight LLMs from four families across a range of model sizes and
      prompting strategies. Our results reveal substantial variation across models and pragmatic
      phenomena: open-source models continue to struggle particularly with humour, while
      cross-linguistic performance varies with model origin. Our error analysis shows that, compared
      with human participants, models are more prone to literal interpretations in conversational
      contexts. Theory-of-Mind prompting lowers the literal share of errors, whereas
      Chain-of-Thought prompting slightly raises it. Together, these findings demonstrate that
      strong pragmatic performance in one evaluation setting does not necessarily generalise across
      languages or conversational contexts."
