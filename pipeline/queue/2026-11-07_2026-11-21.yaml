      strategy, which is brittle across different table scales and model capabilities. Full-table
      reading is efficient for compact inputs but suffers from irrelevant context. Table reduction
      helps long inputs but depends on reliable evidence localization, while execution is required
      when tables exceed the model context window and remains sensitive to schema and value
      grounding errors. We propose TableRoute, a capability-aware routing framework with
      evidence-conditioned inference for scalable TableQA. TableRoute first generates validated
      question--table evidence and identifies the required operations, then routes each instance
      among these three strategies according to serialized table length and calibrated estimates of
      how reliably the base model handles these operations. The validated evidence supports the
      selected route by grounding columns, values, and conditions. Across WikiTQ, WTQ-L, BirdQA, and
      TableBench, TableRoute consistently improves accuracy through complementary routing and
      evidence conditioning across table scales, while reducing online token cost. Code will be made
      available upon publication."
