    abstract: "Tabular in-context learning (TabICL) enables large language models (LLMs) to predict
      target records using a handful of labeled demonstrations in their prompts. However, these
      demonstrations often contain sensitive personal information. Differential privacy (DP) offers
      principled protection, but noise-based methods introduce substantial noise, distorting the
      feature-label relationships essential for accurate prediction, especially as data
      dimensionality grows. In this work, we study DP data synthesis for generating
      privacy-preserving TabICL demonstrations. We identify two limitations of directly applying
      general-purpose DP synthesis to entire datasets: modeling a global distribution can obscure
      local structure and minority patterns in heterogeneous data, while measuring broad attribute
      dependencies under a limited privacy budget can reduce the accuracy available for
      relationships most relevant to prediction. More broadly, global statistical fidelity may fail
      to preserve heterogeneous structures needed by downstream predictive and generative models. To
      address these challenges, we propose PriTabICL, a general framework compatible with existing
      DP synthesis algorithms. It partitions records into DP clusters and synthesizes each
      independently, using a fixed feature-target workload to prioritize prediction-relevant
      statistical relationships. At inference, each query is routed to a DP cluster, and
      demonstrations are sampled from its synthetic dataset without additional privacy loss"
