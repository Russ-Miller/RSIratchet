    abstract: Reasoning capabilities in large language models have evolved from prompting-based methods
      to internalized model behaviors. In this paper, we investigate whether the internal thinking
      model of an LLM can be deliberately changed and whether such a change is beneficial. Instead
      of relying on Chain-of-Thought, we train models to follow Question--Option--Criteria (QOC), a
      structured decision process that decomposes a task into explicit questions, competing options,
      and evaluation criteria. We present a three-generation development pipeline that ranges from a
      basic QOC decision core to richer answer synthesis and statistically enriched QOC reasoning.
      We then evaluate the resulting models with respect to both internal consistency and output
      quality. Across the reported experiments, QOC-based fine-tuning improves answer quality
      relative to non-fine-tuned base models and yields particularly strong gains once models are
      large enough to execute the underlying QOC computations reliably. The results suggest that the
      internal thinking model of an LLM is trainable and that structured alternatives to
      Chain-of-Thought can provide a promising path toward more reliable, interpretable, and
      task-adapted decision support.
